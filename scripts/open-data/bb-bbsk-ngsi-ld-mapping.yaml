extensions:
  Contract:
    baseModel: dataModel.CPSV-AP/Cost
    description: A contract the publisher signed and published.
    why: CPSV-AP Cost is the official model of an amount a public body pays or charges (value, currency, identifier);
      no subject holds a contract, order, invoice, grant or procurement
  PurchaseOrder:
    baseModel: dataModel.CPSV-AP/Cost
    description: An order the publisher issued and published.
    why: CPSV-AP Cost is the official model of an amount a public body pays or charges (value, currency, identifier);
      no subject holds a contract, order, invoice, grant or procurement
  Invoice:
    baseModel: dataModel.CPSV-AP/Cost
    description: An invoice the publisher received and published.
    why: CPSV-AP Cost is the official model of an amount a public body pays or charges (value, currency, identifier);
      no subject holds a contract, order, invoice, grant or procurement
  Grant:
    baseModel: dataModel.CPSV-AP/Cost
    description: A grant or subsidy the publisher awarded or paid out.
    why: CPSV-AP Cost is the official model of an amount a public body pays or charges (value, currency, identifier);
      no subject holds a contract, order, invoice, grant or procurement
  PublicProcurement:
    baseModel: dataModel.CPSV-AP/Cost
    description: A planned or realised public procurement of the publisher.
    why: CPSV-AP Cost is the official model of an amount a public body pays or charges (value, currency, identifier);
      no subject holds a contract, order, invoice, grant or procurement
  PublicInvestment:
    baseModel: dataModel.CPSV-AP/Cost
    description: A public investment project, with its place where the source has one.
    why: CPSV-AP Cost is the official model of an amount a public body pays or charges (value, currency, identifier);
      no subject holds a contract, order, invoice, grant or procurement
  CouncilMeeting:
    baseModel: dataModel.TourismDestinations/Event
    description: A meeting of a council or another body of the self-government.
    why: TourismDestinations Event is the official model of a dated happening; CPSV-AP has none for a council
  CouncilVote:
    baseModel: dataModel.TourismDestinations/Event
    description: One deputy's vote on one item of a council meeting.
    why: a vote is a dated happening of a meeting, so the meeting's base
  Petition:
    baseModel: dataModel.CPSV-AP/Evidence
    description: A petition filed with the publisher and how it was settled.
    why: CPSV-AP Evidence is the official model of a document filed with a public body (identifier, name)
  Article:
    baseModel: dataModel.CPSV-AP/Evidence
    description: A news article the publisher posted.
    why: CPSV-AP Evidence is the official model of a document a public body issues (identifier, name, relatedDocumentation);
      no subject holds news
  CommitteeSeat:
    baseModel: dataModel.Organization/Organization
    description: A seat of a council committee; the citizens' names are kept out.
    why: Organization is the official model of a body; a seat is a position of one
  OfficeHours:
    baseModel: dataModel.Organization/Organization
    description: One office's opening hours on one weekday.
    why: Organization is the office; the rows are its hours per weekday, which no model holds as an entity
  Bridge:
    baseModel: dataModel.PointOfInterest/PointOfInterest
    description: A bridge on a road the region owns or manages.
    why: Transportation Road and RoadSegment require roadClass, refRoad, startPoint and endPoint, which a structure
      register has not; PointOfInterest is a located named thing
  RoadStructure:
    baseModel: dataModel.PointOfInterest/PointOfInterest
    description: An underpass, culvert, expansion joint or level crossing on a regional road.
    why: 'as Bridge: a located structure of a road, not a road'
  AdministrativeArea:
    baseModel: dataModel.PointOfInterest/PointOfInterest
    description: 'A region, district or municipality: its boundary or centroid and its NUTS and LAU codes.'
    why: OpenStreetMap OSMBoundary requires osmId and osmType, which the region's register has not
  RiverBasin:
    baseModel: dataModel.PointOfInterest/PointOfInterest
    description: A river basin of the region.
    why: OpenStreetMap OSMWater requires osmId and osmType, which the region's register has not
  WaterBodyStatus:
    baseModel: dataModel.PointOfInterest/PointOfInterest
    description: A water body with its ecological status or potential class.
    why: WaterQualityObserved and WaterObserved require dateObserved and hold measured parameters; these rows are
      assessed classes of a located water body
  CycleRoute:
    baseModel: dataModel.Transportation/BikeLane
    description: A signed cycle touring route or one surface section of it.
    why: Transportation BikeLane is the official model of a way for bicycles; OSMCycleRoute requires osmId
