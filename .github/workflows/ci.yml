name: ci
# The fast lane, on every push (ci-full and pinned-images run daily beside it): render and gate every
# environment in a single job, run the tests in another, scan the history for secrets. Every
# tool is downloaded once; the environments loop inside the job instead of a matrix, which
# paid the setup four times over.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
permissions: { contents: read }
# On main a run is never cancelled: the watcher pins an image every few minutes, and each pin
# used to cancel the run before it, so main went an hour without a finished run. One run
# finishes, the newest push waits behind it (GitHub keeps one pending run per group).
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: "${{ github.ref != 'refs/heads/main' }}" }
env:
  CONFTEST_VERSION: "0.69.0"
  CONFTEST_CHECKSUM: "96fc2fbf11f0afde51256647127e6f00a64ce839a4d9a0a1aef2426c0e6f4b3f"
  GITLEAKS_VERSION: "8.29.0"
  GITLEAKS_CHECKSUM: "39e07ad810336fd0ae80d0bd61c60d0521f628173e7583583b5df4a38738522c"
  # kubeconform schemas of custom resources, pinned to one commit of datreeio/CRDs-catalog (2026-10-08).
  CRDS_CATALOG: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # nine environments since T-4956, about 30 s each
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with: { helmfile-args: version, helmfile-version: v1.8.1 }
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: kubeconform, conftest, gitleaks
        run: |
          set -eu
          curl --fail --retry 3 --retry-all-errors -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          curl --fail --retry 3 --retry-all-errors -sSLo conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_CHECKSUM}  conftest.tar.gz" | sha256sum --check --status
          tar xzf conftest.tar.gz conftest
          curl --fail --retry 3 --retry-all-errors -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_CHECKSUM}  gitleaks.tar.gz" | sha256sum --check --status
          tar xzf gitleaks.tar.gz gitleaks
          rm -f conftest.tar.gz gitleaks.tar.gz
      - name: helm lint every local chart
        # T-4956: lint plus values.schema.json against the chart's defaults, with its
        # ci/lint-values.yaml where the bare chart needs one; a chart vendored under another
        # chart's charts/ is upstream's and left out.
        run: |
          set -eu
          git ls-files '*Chart.yaml' | awk -F/ '{n=0; for (i=1;i<=NF;i++) if ($i=="charts") n++; if (n<=1) print}' \
            | xargs -n1 dirname | while read -r chart; do
                if [ -f "${chart}/ci/lint-values.yaml" ]; then helm lint --quiet "${chart}" -f "${chart}/ci/lint-values.yaml"
                else helm lint --quiet "${chart}"; fi
              done
      - run: just _dev-assemble
      - name: render and gate every environment
        # Per environment: helmfile template, kubeconform -strict, every container pinned by
        # digest (OPS-28, SEC-GAP-03), the four security properties Kyverno asserts at admission
        # (policies/workloads.rego: TS-18, TS-19, CC-12), no legacy name, no plaintext secret,
        # generated secrets long enough, and the objects of .ci/golden/<env>.txt (T-4956).
        # Custom resources validate against the CRDs catalog pinned to one commit; only the CRD
        # objects themselves have no schema there.
        run: |
          set -eu
          mkdir -p /tmp/scan
          golden_red=""
          # minimal and broker-only: the two small component profiles (T-4856); dev and smartcity
          # (production) the hosted clusters (T-4956). smoke-test needs a CI pipeline's env.
          mapfile -t environments < .ci/golden/ENVIRONMENTS
          for env in "${environments[@]}"; do
            echo "::group::${env}"
            helmfile -f deployment/helmfile.yaml -e "${env}" repos
            scripts/render.sh "${env}" "rendered-${env}.yaml"
            ./kubeconform -strict -skip CustomResourceDefinition -schema-location default -schema-location "${CRDS_CATALOG}" -summary "rendered-${env}.yaml"
            python3 scripts/ci/check-image-digests.py "rendered-${env}.yaml"
            ./conftest test --all-namespaces -p policies "rendered-${env}.yaml"
            ! grep -i -E 'civitas' "rendered-${env}.yaml"
            python3 scripts/check-rendered-secrets.py "rendered-${env}.yaml" /tmp/scan/rendered.yaml
            ./gitleaks detect --no-git --source /tmp/scan --config .ci/gitleaks-rendered.toml --redact --exit-code 1
            python3 scripts/check-secrets.py "rendered-${env}.yaml"
            python3 .ci/golden/list-objects.py "rendered-${env}.yaml" | diff -u ".ci/golden/${env}.txt" - || golden_red="${golden_red} ${env}"
            echo "::endgroup::"
          done
          if [ -n "${golden_red}" ]; then
            echo "::error::the rendered objects of${golden_red} changed. Review the diff above and run 'just golden-update'."
            exit 1
          fi
      - name: render and gate the BBSK demo
        # T-4687: demos/bbsk/ is its own helmfile outside the platform's environments, held to the
        # same gates: kubeconform, digest pins, the admission policies, no plaintext secret.
        run: |
          set -eu
          for env in dev smartcity; do
            echo "::group::demo-bbsk ${env}"
            helmfile -f demos/bbsk/helmfile.yaml.gotmpl -e "${env}" template --skip-deps > "rendered-demo-bbsk-${env}.yaml"
            ./kubeconform -strict -skip CustomResourceDefinition -schema-location default -schema-location "${CRDS_CATALOG}" -summary "rendered-demo-bbsk-${env}.yaml"
            python3 scripts/ci/check-image-digests.py "rendered-demo-bbsk-${env}.yaml"
            ./conftest test --all-namespaces -p policies "rendered-demo-bbsk-${env}.yaml"
            python3 scripts/check-rendered-secrets.py "rendered-demo-bbsk-${env}.yaml" /tmp/scan/rendered.yaml
            ./gitleaks detect --no-git --source /tmp/scan --config .ci/gitleaks-rendered.toml --redact --exit-code 1
            python3 scripts/check-secrets.py "rendered-demo-bbsk-${env}.yaml"
            python3 .ci/golden/list-objects.py "rendered-demo-bbsk-${env}.yaml" | diff -u ".ci/golden/demo-bbsk-${env}.txt" - || {
              echo "::error::the rendered objects of demo-bbsk ${env} changed. Review the diff and run 'just golden-update'."
              exit 1
            }
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendered
          path: rendered-*.yaml
          retention-days: 3
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # ran 9m40 a run on 2026-09-25 and timed out at 10; back under budget is T-2895
    # Two shards of the test files: one job ran 9 to 14.5 minutes and timed out at 15 on 39ada09
    # (T-3732); the time is spread over many 20-30 s renders, so halving the files halves it.
    # Three since 2026-10-18: shard 2 passed 11 min on 4cce5812, then ran past 15 on e0ee3611 and
    # a61f0df0 and was cancelled, so main had no verdict (T-4553 follow-up).
    # Four since 2026-10-19: shard 1, which also runs gitleaks, the docs pin and the kyverno
    # tests, ran past 15 on 593e2acc, ade77e03 and b0c7f814 and main had no verdict (T-2985 push).
    # Balanced by measured time since 2026-10-20: shard 4 ran past 15 on three main runs (T-4789).
    strategy: { fail-fast: false, matrix: { shard: [1, 2, 3, 4] } }
    name: tests (${{ matrix.shard }}/4)
    env: { KYVERNO_VERSION: v1.19.0, SOPS_VERSION: v3.13.3, AGE_VERSION: v1.2.1 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # The whole history: a credential deleted in the last commit is still a credential.
        with: { fetch-depth: 0 }
      - uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with: { helmfile-args: version, helmfile-version: v1.8.1 }
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - name: kyverno cli
        run: |
          curl --fail --retry 3 --retry-all-errors -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" | tar xz kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno
      - name: sops + age
        # tests/test_secrets.py round-trips a SOPS-encrypted environment secret; without
        # these two binaries that test would skip and the integration would go unproven.
        run: |
          curl --fail --retry 3 --retry-all-errors -sSL -o sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          sudo install -m 0755 sops /usr/local/bin/sops
          curl --fail --retry 3 --retry-all-errors -sSL "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo install -m 0755 age/age age/age-keygen /usr/local/bin/
      - name: gitleaks + conftest
        # tests/test_reusable_workflows.py runs the shared secret ruleset against the shapes it
        # exists for and the Rego gate against its fixtures; without these two binaries both
        # would skip, and a skipped gate reads exactly like a passing one.
        run: |
          set -eu
          curl --fail --retry 3 --retry-all-errors -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_CHECKSUM}  gitleaks.tar.gz" | sha256sum --check --status
          tar xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          curl --fail --retry 3 --retry-all-errors -sSLo conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_CHECKSUM}  conftest.tar.gz" | sha256sum --check --status
          tar xzf conftest.tar.gz conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest
          rm -f gitleaks.tar.gz conftest.tar.gz gitleaks conftest
      - name: gitleaks over the whole history
        if: matrix.shard == 1
        # Was the `gitleaks` job (reusable-gitleaks.yml); same ruleset, same scope, one billed
        # job fewer on a metered private repository (T-0521). The reusable workflow stays for
        # the other repositories.
        run: gitleaks detect --source . --config .ci/shared/gitleaks.toml --redact --exit-code 1
      - run: pip install --quiet pytest pytest-xdist pyyaml "jsonschema>=4.18" pyshacl jinja2
      - name: the docs this release serves hold for the code it runs (T-4483, TS-19)
        # The Portal's /docs is the docs commit pinned beside its digest; the pinned Portal and
        # platform commits and this tree are checked out and that docs commit's own checkers
        # run against them. tests/test_docs_pin.py proves it red on a page the code lacks.
        if: matrix.shard == 1
        run: scripts/check-docs-pin.sh
      - name: the images the tests run
        # tests/test_observability_collector.py runs `otelcol validate` on the rendered
        # config and one record through the allow-list (T-0349); tests/test_audit_logging.py
        # runs `vector validate` and `vector test` on the rendered audit transform (T-0052);
        # tests/test_ckan_dcat.py serializes DCAT-AP in the catalogue image (T-3010);
        # tests/test_gitops.py runs Argo CD's helmfile plugin in its sidecar image (T-4674).
        # Pulled here so a registry failure reads as a registry failure rather than as a red
        # test.
        run: |
          python3 - <<'EOF' > /tmp/test-images
          import yaml
          for component, part in (("observability", "collector"), ("audit-logging", "collector"), ("ckan", "catalogue"), ("gitops", "helmfile")):
              i = yaml.safe_load(open(f"components/{component}/images.yaml"))[component][part]
              print(f"{i['repository']}:{i['tag']}@{i['digest']}")
          EOF
          xargs -r -n1 docker pull --quiet < /tmp/test-images
      - name: assemble deployment dir and add the chart repos
        # Both environments: `addons` pulls chart repositories no core component uses, and a
        # test that renders it would fail on a missing repository rather than on its subject.
        run: |
          just _dev-assemble
          helmfile -f deployment/helmfile.yaml -e local repos
          helmfile -f deployment/helmfile.yaml -e production repos
          helmfile -f deployment/helmfile.yaml -e addons repos
      - name: kyverno policy unit tests
        if: matrix.shard == 1
        run: kyverno test .ci/policies
      - name: kyverno apply on the rendered local, production and add-on manifests (OPS-40)
        if: matrix.shard == 1
        # Shift-left: what admission would refuse is refused here first, on every pull request.
        run: .ci/policies/verify-kyverno-policies.sh
      # One worker per core: each smoke-script case runs the whole script against stubs, and in
      # series the suite passed the job's 10 minutes once T-2592 and T-2601 added cases, which
      # GitHub reports as "cancelled" and which hid a red test behind it (8m24s -> 2m45s on 4).
      # A module that rewrites deployment/environments/testing does it in its own copy of the tree
      # (own_tree), and each environment is rendered once for all workers (T-2895).
      # Every test file lands in exactly one shard, balanced by the seconds in .ci/test-durations.json
      # (scripts/ci/test-shard.py, T-4789: the positional split put 13.6 of 26 minutes in shard 4).
      # The slowest durations go to the log; refresh the table with --record from a --durations=0 run.
      # T-4694: the platform commit components/ai/bundle.lock names, so tests/test_ai_app.py
      # rebuilds the standalone assistant's bundle and compares it with the committed one.
      - name: the platform commit of the ai bundle
        run: |
          sha=$(sed -n 's/^platform: //p' components/ai/bundle.lock)
          git init -q "$RUNNER_TEMP/platform"
          git -C "$RUNNER_TEMP/platform" fetch -q --depth 1 https://github.com/marek-mraz-jc/joinedcontext-platform "$sha"
          echo "JC_PLATFORM_DIR=$RUNNER_TEMP/platform" >> "$GITHUB_ENV"
      - run: pytest -q -n auto --dist loadgroup --durations=30 $(python3 scripts/ci/test-shard.py ${{ matrix.shard }} 4)
      # How each seed pipeline creates history rows, per pipeline x type x attribute, with a verdict
      # (T-4844); tests/test_temporal_audit.py fails on a row that is not ok, the report is the table.
      - name: temporal audit of the seeds
        if: matrix.shard == 1 && always()
        run: python3 scripts/temporal-audit.py --out temporal-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.shard == 1 && always()
        with:
          name: temporal-audit
          path: temporal-audit.json
          retention-days: 30
