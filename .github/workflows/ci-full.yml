name: ci-full
# slow lane: policy gates on the rendered output and the k3d deployment test; never a PR gate.
# On demand only for now: this repository is private and its Actions minutes are metered
# (T-0402, T-0521). Put `push: { branches: [main] }` and `schedule: [{ cron: "37 2 * * *" }]`
# back under `on:` when the minutes are back.
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-full-${{ github.ref }}", cancel-in-progress: false }
jobs:
  policies:
    # the repo's own Kyverno policy gate (.ci/policies/base + production) on the rendered
    # output, blocking since T-0233. Helm test hooks are dropped before the scan (they are
    # never applied by `helmfile sync`), accepted findings live in
    # components/*/policy-exceptions.yaml with a reason.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { KYVERNO_VERSION: v1.19.0 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with: { helmfile-args: version }
      - name: kyverno cli
        run: |
          curl -sSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" | tar xz kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno && kyverno version
      - name: assemble deployment dir (local + production environments)
        run: |
          mkdir -p deployment && cp -r defaults/deployment/* deployment/
          cp .ci/example-deployments/helmfile.yaml deployment/helmfile.yaml
          cp -r .ci/example-deployments/environments/. deployment/environments/
          helmfile -f deployment/helmfile.yaml -e local repos
          # The add-on environment pulls chart repositories no core component uses.
          helmfile -f deployment/helmfile.yaml -e addons repos
      - name: kyverno apply on rendered local + production
        run: .ci/policies/verify-kyverno-policies.sh
      - name: kyverno policy unit tests
        run: kyverno test .ci/policies
  deployment-variants:
    # scripts/test-deployment-variants.sh brings up k3d clusters, far too slow for the PR gate.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The three-node k3d cluster keeps one containerd image store per node on the runner's
      # single disk, and ubuntu-latest ships toolchains this job never opens. One run
      # crossed the kubelet's ephemeral-storage threshold with 3.8 GB left: metallb and
      # ingress-nginx were evicted under DiskPressure and keycloak never became ready. Reclaim
      # the space before any tool lands in the hostedtoolcache, which stays untouched.
      - name: free runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with: { helmfile-args: version }
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - run: curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: linkerd cli
        # Four of the eight variants enable the mesh and the script installs the control
        # plane with this binary, so without it the whole job stops at the tool check.
        # Keep in step with the chart version in .ci/linkerd/helmfile.yaml.gotmpl.
        env: { LINKERD2_VERSION: edge-26.9.1 }
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://run.linkerd.io/install-edge | sh
          echo "$HOME/.linkerd2/bin" >> "$GITHUB_PATH"
      - run: ./scripts/test-deployment-variants.sh
  k3d-deploy:
    # One real deployment into a throwaway k3d cluster on the runner: single namespace,
    # all-in-one, no mesh, development profile. That is the variant that fits a 7 GB runner,
    # and it is the safety net behind the dev cluster — the eight-variant sweep above answers
    # "does every shape still deploy", this one answers "did main break the deployment" in a
    # quarter of an hour and says which pod did not come up (OPS-01…OPS-05, TS-19, TS-20).
    #
    # Nightly and on dispatch, never on a push: the deploy agent proves a change on the dev
    # cluster with `just dev-apply` and `just dev-smoke` long before this runs.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The same disk reclaim as deployment-variants: one containerd image store plus the
      # images this deployment pulls crossed the kubelet's ephemeral-storage threshold with
      # 3.8 GB left, and the eviction reads as an unready pod rather than a full disk.
      - name: free runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with: { helmfile-args: version }
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - run: curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      # No linkerd CLI: the mesh axis is 0 here, and the harness only demands the binary for
      # a variant that enables it. The pull-through image caches are the script's default.
      - run: ./scripts/test-deployment-variants.sh 0,0,0
      # The harness keeps the cluster up when a variant fails, which is what makes this
      # possible: what did not become Ready, why, and what it said before it gave up.
      - name: collect what the cluster looked like when it failed
        if: failure()
        run: |
          mkdir -p diagnostics
          kubectl get all -A -o wide > diagnostics/resources.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1 || true
          kubectl get pods -A \
            -o jsonpath='{range .items[?(@.status.phase!="Succeeded")]}{.metadata.namespace}{" "}{.metadata.name}{" "}{.status.containerStatuses[*].ready}{"\n"}{end}' \
            > diagnostics/pods.txt 2>&1 || true
          while read -r namespace pod ready; do
            case "$ready" in *false*|"") ;; *) continue ;; esac
            kubectl describe pod -n "$namespace" "$pod" > "diagnostics/${namespace}.${pod}.describe.txt" 2>&1 || true
            kubectl logs -n "$namespace" "$pod" --all-containers --tail=200 \
              > "diagnostics/${namespace}.${pod}.log" 2>&1 || true
            kubectl logs -n "$namespace" "$pod" --all-containers --tail=200 --previous \
              > "diagnostics/${namespace}.${pod}.previous.log" 2>&1 || true
          done < diagnostics/pods.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: k3d-deploy-diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 7
