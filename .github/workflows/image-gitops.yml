name: image-gitops
# The two GitOps images (T-4706): the helmfile plugin sidecar, which is also the smoke gate's
# image, and Argo CD with fixed git-lfs and kustomize builds. Both are rebuilt when their files
# change and once a month, so the bases' fixes arrive. The repository is public, so its minutes
# are not metered (T-3289).
on:
  push: { branches: [main], paths: ["images/gitops-*/**", ".github/workflows/image-gitops.yml"] }
  schedule: [{ cron: "0 5 1 * *" }]
  workflow_dispatch:
permissions: { contents: read, packages: write, id-token: write }
concurrency: { group: "image-gitops-${{ github.ref }}", cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { context: gitops-helmfile, image: joinedcontext-gitops-helmfile, tag: "1.8.1", key: helmfile }
          - { context: gitops-argocd, image: joinedcontext-argocd, tag: "v3.5.4", key: argocd }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      # Signed like every image this platform deploys: the cluster's policy verifies the
      # signature (OPS-27).
      - run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"
      # The CycloneDX bill of materials, attested to the digest (OPS-41, T-2412), then read back
      # under this workflow's identity.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
          format: cyclonedx
          output: sbom.cdx.json
      - run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@${{ steps.push.outputs.digest }}"
      - run: |
          cosign verify-attestation --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/image-gitops.yml@${{ github.ref }}" \
            "$IMAGE@${{ steps.push.outputs.digest }}" > /dev/null
      # No CRITICAL at all, fixed or not: a stricter bar than pinned-images holds every pinned
      # image to (scripts/scan-pinned-images.py). Argo CD's own binary carries fixable HIGHs that
      # only an upstream release clears, so HIGH stays that lane's KEV rule, not this gate.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
          severity: "CRITICAL"
          exit-code: "1"
      # The digest to pin in components/gitops/images.yaml; nothing deploys until it is pinned.
      - run: |
          {
            echo "pin this as gitops.${{ matrix.key }} in components/gitops/images.yaml:"
            echo '```yaml'
            echo "    repository: '$IMAGE'"
            echo "    tag: '${{ matrix.tag }}'"
            echo "    digest: '${{ steps.push.outputs.digest }}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
