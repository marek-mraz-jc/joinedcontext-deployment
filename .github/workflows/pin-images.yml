name: pin-images
# ADR-N-056 §2.4, OPS-57: pin the images of the newest commit platform and Portal `main` built
# (image.yml runs once an hour, T-4696) once their ci is green, cosign verifies the signature of
# their own image.yml on main, and the dev render passes; Argo CD takes the pin commit from here.
# Antares stays a hand pin (its pins carry migration notes). The repositories are public: the
# workflow's own token is enough. A push made with that token starts no ci run, so the dev render
# below is the pin commit's gate.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: { contents: write, packages: read, actions: read }
concurrency: { group: pin-images, cancel-in-progress: false }
jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/tools
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: pip install --quiet --require-hashes --no-deps -r .github/requirements-pyyaml.txt
      - name: pin, render, check the docs, commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name "pin-images"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A skipped source fails the run after the other source was tried, so tasks/ci files a
          # ci-red: 10-23..10-25 every run skipped both sources and stayed green (T-5686).
          skipped=""
          for source in platform portal; do
            message=$(python3 scripts/pin-images.py "$source")
            git diff --quiet -- components && continue
            just _dev-assemble
            helmfile -f deployment/helmfile.yaml -e dev repos >/dev/null
            if ! scripts/render.sh dev /tmp/rendered-dev.yaml >/dev/null; then
              echo "::error::$message: the dev render fails, nothing pinned"
              echo "- $source: $message: the dev render fails, nothing pinned" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              skipped="$skipped $source"
              git checkout -- components
              continue
            fi
            # The bot's push starts no ci run, so the docs check ci runs is repeated here: a code
            # head whose docs are not pinned yet (portal scripts/public-docs.sh) waits (T-4931).
            if ! scripts/check-docs-pin.sh; then
              echo "::error::$message: the pinned docs do not hold for this code, nothing pinned"
              echo "- $source: $message: the pinned docs do not hold for this code, nothing pinned" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              skipped="$skipped $source"
              git checkout -- components
              continue
            fi
            git commit -q -m "$message" -- components
            base=$(git rev-parse HEAD^)
            git pull -q --rebase origin main
            # main moved while this ran: the pin is rendered and its docs checked again on the new
            # base, or it waits for the next hour's run (F-DEP1-016).
            if [ "$(git rev-parse HEAD^)" != "$base" ]; then
              just _dev-assemble
              if ! scripts/render.sh dev /tmp/rendered-dev.yaml >/dev/null || ! scripts/check-docs-pin.sh; then
                echo "::warning::$message: main moved and the pin no longer renders or holds its docs; the next run retries"
                git reset -q --hard origin/main
                continue
              fi
            fi
            git push -q origin HEAD:main
          done
          if [ -n "$skipped" ]; then
            echo "::error::not pinned:$skipped (see the errors above)"
            exit 1
          fi
