name: pin-images
# ADR-N-054 §2.4, OPS-57: pin the images of the head of platform and Portal `main` once their
# ci is green, cosign verifies the signature of their own image.yml on main, and the dev render
# passes; Argo CD takes the pin commit from here. Antares stays a hand pin (its pins carry
# migration notes). The repositories are public: the workflow's own token is enough. A push made
# with that token starts no ci run, so the dev render below is the pin commit's gate.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: { contents: write, packages: read, actions: read }
concurrency: { group: pin-images, cancel-in-progress: false }
jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with: { helmfile-args: version, helmfile-version: v1.8.1 }
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: pin, render, commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name "pin-images"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for source in platform portal; do
            message=$(python3 scripts/pin-images.py "$source")
            git diff --quiet -- components && continue
            just _dev-assemble
            helmfile -f deployment/helmfile.yaml -e dev repos >/dev/null
            if ! scripts/render.sh dev /tmp/rendered-dev.yaml >/dev/null; then
              echo "::error::$message: the dev render fails, nothing pinned"
              git checkout -- components
              continue
            fi
            git commit -q -m "$message" -- components
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          done
