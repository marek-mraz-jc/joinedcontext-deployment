name: pinned-images
# Every image components/*/images.yaml pins, scanned by its digest (T-3289): a CRITICAL with a
# fixed version, or a fixed HIGH that CISA lists as exploited, fails the job, and tasks/ci files a
# task for the red run. Excuses live in .ci/pinned-images-ignore.yaml, each with a reason, a task
# and an expiry. Daily, and on every change of a pin or an excuse (T-3289).
on:
  push: { branches: [main], paths: ["components/*/images.yaml", ".ci/pinned-images-ignore.yaml"] }
  schedule: [{ cron: "23 4 * * *" }]
  workflow_dispatch:
permissions: { contents: read, packages: read }
concurrency: { group: "pinned-images-${{ github.ref }}", cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { TRIVY_VERSION: 0.75.0 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: trivy
        run: |
          curl --fail --retry 3 --retry-all-errors -sSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --retry 3 --retry-all-errors -sSL -o checksums.txt "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" checksums.txt | sed 's/ .*//' | sed "s/\$/  trivy.tgz/" | sha256sum -c -
          tar xzf trivy.tgz trivy && sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: scan every pinned image
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -eu
          mkdir -p reports
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          python3 scripts/scan-pinned-images.py list > pinned.txt
          n=0
          while read -r image; do
            n=$((n + 1))
            # ECR Public answers TOOMANYREQUESTS (data limit) to shared runners now and then:
            # the same digest again after a pause, never a skipped image (runs 39202611676, 39231220139).
            for try in 1 2 3; do
              trivy image --quiet --scanners vuln --severity CRITICAL,HIGH --format json \
                --output "reports/${n}.json" "$image" && break
              [ "$try" = 3 ] && exit 1
              sleep 120
            done
          done < pinned.txt
      - name: CISA known exploited vulnerabilities
        # CISA's own copy on GitHub: its web site answers 403 to a script.
        run: curl --fail --retry 3 --retry-all-errors -sSLf -o kev.json https://raw.githubusercontent.com/cisagov/kev-data/main/known_exploited_vulnerabilities.json
      # T-3834 (d): every fixable HIGH or CRITICAL as a tasks/file-failures summary, one board
      # task per (image, CVE): `tasks/file-failures vuln-summary.json` files and closes them.
      - name: board summary
        run: python3 scripts/scan-pinned-images.py summary reports/*.json --repo joinedcontext-deployment --run "$GITHUB_RUN_ID" > vuln-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: vuln-summary, path: vuln-summary.json, retention-days: 14 }
      - name: judge
        run: python3 scripts/scan-pinned-images.py judge reports/*.json --kev kev.json
