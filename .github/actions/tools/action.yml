name: tools
description: >-
  Load tools.env into the job environment and install just, helmfile, helm and helm-diff at the versions
  it pins (docs/analysis/iac-practices.md R3). Run it right after actions/checkout; later steps read
  the other versions and checksums from env.
inputs:
  helmfile:
    description: "false loads tools.env only, for a job that does not render"
    default: "true"
runs:
  using: composite
  steps:
    - name: load tools.env
      shell: bash
      run: grep -E '^[A-Z0-9_]+=[^ ]+$' "${GITHUB_WORKSPACE}/tools.env" >> "$GITHUB_ENV"
    - name: just
      shell: bash
      run: |
        set -eu
        asset="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        curl --fail --retry 3 --retry-all-errors -sSLo "${RUNNER_TEMP}/${asset}" "https://github.com/casey/just/releases/download/${JUST_VERSION}/${asset}"
        echo "${JUST_CHECKSUM}  ${RUNNER_TEMP}/${asset}" | sha256sum --check --status
        tar xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}" just
        sudo install -m 0755 "${RUNNER_TEMP}/just" /usr/local/bin/just
        rm -f "${RUNNER_TEMP}/${asset}" "${RUNNER_TEMP}/just"
    - if: inputs.helmfile == 'true'
      uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
      with:
        helmfile-args: version
        helmfile-version: ${{ env.HELMFILE_VERSION }}
        helm-version: ${{ env.HELM_VERSION }}
        helm-plugins: https://github.com/databus23/helm-diff@${{ env.HELM_DIFF_VERSION }}
