# The BBSK demo landing page, ConfigMaps demo-bbsk-landing and demo-bbsk-landing-site as prod served them
# (final export prod-20261109T1958Z, release demo-bbsk-smartcity), namespace renamed. Static site, no secret.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-bbsk-landing
  namespace: bbsk-landing
data:
  default.conf: "# T-4740: the BBSK demo's landing page. Static files only, no cookie, no form; the one framed\n# page is the demo assistant's widget on assistant.smartcity.joinedcontext.com, which the\
    \ CSP names alone.\nserver {\n    listen 8080;\n    server_tokens off;\n    absolute_redirect off;\n    root /srv/site;\n    autoindex off;\n    charset utf-8;\n\n    location = /healthz {\n       \
    \ access_log off;\n        default_type text/plain;\n        return 200 \"ok\\n\";\n    }\n\n    add_header X-Content-Type-Options nosniff always;\n    add_header Referrer-Policy no-referrer always;\n\
    \    add_header X-Robots-Tag \"noindex, nofollow\" always;\n    add_header Permissions-Policy \"camera=(), microphone=(), geolocation=(), payment=(), usb=()\" always;\n    add_header Cache-Control \"\
    no-cache\" always;\n    add_header Content-Security-Policy \"default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src https://assistant.smartcity.joinedcontext.com; base-uri\
    \ 'none'; form-action 'none'; frame-ancestors 'none'\" always;\n\n    location = / {\n        limit_except GET { deny all; }\n        default_type text/html;\n        try_files /index.html =404;\n \
    \   }\n    location ~ ^/(landing|jc-dock|jc-assistant)\\.js$ {\n        limit_except GET { deny all; }\n        types { text/javascript js; }\n    }\n    location = /landing.css {\n        limit_except\
    \ GET { deny all; }\n        types { text/css css; }\n    }\n\n    location / { return 404; }\n}\n"
---
