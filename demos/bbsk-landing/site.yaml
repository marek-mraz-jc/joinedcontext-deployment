    \ + 1rem); }\nbody { margin: 0; padding-top: var(--ribbon); font: 300 1rem/1.7 var(--sans); color: var(--ink); background: var(--white); }\na { color: var(--blue); text-decoration: none; }\na:hover\
    \ { color: var(--blue-dark); text-decoration: underline; }\na:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }\nh1, h2, h3 { font-family:\
    \ var(--display); font-weight: 700; line-height: 1.2; color: var(--ink); }\nul { list-style: none; margin: 0; padding: 0; }\n.wrap { max-width: 1296px; margin: 0 auto; padding: 0 1.5rem; }\n.skip {\
    \ position: absolute; left: -9999px; }\n.skip:focus { left: 1rem; top: calc(var(--ribbon) + .5rem); z-index: 30; background: var(--white); padding: .5rem 1rem; }\n.lead { max-width: 52rem; margin: -.5rem\
    \ 0 2rem; font-size: 1.0625rem; }\n\n/* DEMO on every width, above everything but the open assistant. */\n.ribbon { position: fixed; inset: 0 0 auto; z-index: 20; min-height: var(--ribbon); display:\
    \ flex; align-items: center; justify-content: center; padding: .25rem 1rem; background: var(--red); color: var(--white); font: 600 .875rem/1.3 var(--sans); text-align: center; }\n\n/* Header: the grey\
