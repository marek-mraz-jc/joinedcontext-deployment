  jc-dock.js: "// T-4685 (API/05 §1.6.1): before the first paint, a page whose assistant was open on the page\n// before makes room for it, docked at its width, and holds its first render until the panel\
    \ is\n// parsed, so the panel never shows empty and the page never jumps. jc-assistant.js opens it.\n// A catalogue rollout that fails a static file (owner report 2026-10-19 05:55Z) never leaves the\n\
