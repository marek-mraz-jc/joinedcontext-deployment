    jc-assistant\") || \"null\");\n    if (!held || held.open !== true) {\n      return;\n    }\n    var root = document.documentElement;\n    if (held.mode === \"dock\") {\n      root.classList.add(\"\
    jc-docked\");\n    }\n    var kept = parseInt(localStorage.getItem(\"jc-dock-width\"), 10);\n    if (kept > 0) {\n      root.style.setProperty(\"--jc-dock\", kept + \"px\");\n    }\n    var expect =\
    \ document.createElement(\"link\");\n    expect.rel = \"expect\";\n    expect.href = \"#jc-assistant\";\n    expect.setAttribute(\"blocking\", \"render\");\n    document.head.appendChild(expect);\n\
    \    document.addEventListener(\"DOMContentLoaded\", function () {\n      if (window.jcAssistant !== true) {\n        root.classList.remove(\"jc-docked\");\n        expect.remove();\n      }\n    });\n\
    \  } catch (e) { /* storage off: the panel opens closed */ }\n})();\n"
  landing.css: "/* The BBSK demo's landing page (T-4740, owner 2026-10-19T12:55Z): a snapshot of the www.bbsk.sk\n   home page, its layout, colours, type, header and footer, rebuilt in our own CSS. No file,\
    \ font,\n   photo or logo of theirs: a photo or a pictogram is a colour block with its caption. */\n:root {\n  --blue: #264a96;\n  --blue-dark: #1d3871;\n  --blue-mid: #203f80;\n  --blue-light: #d5dceb;\n\
