{{- /*
  The demo's own credentials (T-4687): generated here on the first install and kept, so the demo
  holds no platform secret and needs no secrets component. A Secret that exists keeps its values
  (`lookup`), and `resource-policy: keep` leaves it when the release goes, so a reinstall over the
  same database still signs in; `just demo-bbsk-destroy` deletes the namespace and them with it.
  A template render (`helmfile template`) has no cluster, so it shows fresh values that are never
  applied.
*/}}
{{- define "demo.secret" -}}
{{- $old := lookup "v1" "Secret" .ns .name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .ns }}
  labels:
    # scripts/check-rendered-secrets.py knows this chart's values as generated, not written.
    helm.sh/chart: {{ .chart }}
  annotations:
    helm.sh/resource-policy: keep
type: {{ .type | default "Opaque" }}
data:
{{- range $key, $value := .fixed }}
  {{ $key }}: {{ $value | b64enc }}
{{- end }}
{{- range .generated }}
  {{- if and $old (hasKey $old.data .) }}
  {{ . }}: {{ index $old.data . }}
  {{- else }}
  {{ . }}: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
{{- $ns := .Release.Namespace }}
{{- $chart := printf "%s-%s" .Chart.Name .Chart.Version }}
# CKAN's owner of both databases; CNPG creates the role from it (basic-auth: username, password).
{{ include "demo.secret" (dict "chart" $chart "ns" $ns "name" "db-ckan" "type" "kubernetes.io/basic-auth" "fixed" (dict "username" "ckan") "generated" (list "password")) }}
---
# The DataStore's read connection: SELECT only, which is what lets CKAN serve datastore_search_sql.
{{ include "demo.secret" (dict "chart" $chart "ns" $ns "name" "db-ckan-datastore-read" "type" "kubernetes.io/basic-auth" "fixed" (dict "username" "ckan_datastore_read") "generated" (list "password")) }}
---
# CKAN's SECRET_KEY, which signs its session cookie, CSRF token and API tokens.
{{ include "demo.secret" (dict "chart" $chart "ns" $ns "name" "ckan-session" "generated" (list "secret")) }}
---
# The catalogue's site administrator, the one account of a demo with no login for visitors.
{{ include "demo.secret" (dict "chart" $chart "ns" $ns "name" "ckan-admin-credentials" "fixed" (dict "username" "ckan_admin" "email" "ckan-admin@joinedcontext.invalid") "generated" (list "password")) }}
