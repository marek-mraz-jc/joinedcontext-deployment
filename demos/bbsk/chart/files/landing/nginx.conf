# T-4740: the BBSK demo's landing page. Static files only, no cookie, no form; the one framed
# page is the demo assistant's widget on assistant.__DOMAIN__, which the CSP names alone.
server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;
    root /srv/site;
    autoindex off;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src https://assistant.__DOMAIN__; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = / {
        limit_except GET { deny all; }
        default_type text/html;
        try_files /index.html =404;
    }
    location = /en { return 301 /en/; }
    location = /en/ {
        limit_except GET { deny all; }
        default_type text/html;
        try_files /en.html =404;
    }
    location ~ ^/(landing|jc-dock|jc-assistant)\.js$ {
        limit_except GET { deny all; }
        types { text/javascript js; }
    }
    location = /landing.css {
        limit_except GET { deny all; }
        types { text/css css; }
    }

    location / { return 404; }
}
