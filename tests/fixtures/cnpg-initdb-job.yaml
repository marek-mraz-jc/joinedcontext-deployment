# The Job CloudNativePG creates for `initdb`, reduced to what the label-protection
# policies look at, plus its Pod as the Job controller creates it.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-cluster-1-initdb
  namespace: dev
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        cnpg.io/cluster: postgres-cluster
        cnpg.io/jobRole: initdb
    spec:
      containers:
        - name: bootstrap-controller
          image: ghcr.io/cloudnative-pg/postgresql:16
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres-cluster-1-initdb-vmlkj
  namespace: dev
  labels:
    app.kubernetes.io/name: postgresql
    cnpg.io/cluster: postgres-cluster
    cnpg.io/jobRole: initdb
  ownerReferences:
    - apiVersion: batch/v1
      kind: Job
      name: postgres-cluster-1-initdb
      uid: 0e9f9ffb-13f0-41bb-9649-f5f2956b45df
      controller: true
spec:
  containers:
    - name: bootstrap-controller
      image: ghcr.io/cloudnative-pg/postgresql:16
