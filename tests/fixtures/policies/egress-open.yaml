apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: pipeline-runner }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pipeline-runner-runner }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 0.0.0.0/0, except: [10.0.0.0/8] }
      ports:
        - { protocol: TCP, port: 443 }
