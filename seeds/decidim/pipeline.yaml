# The harvester of a Decidim participation platform (T-5065), one copy per instance written by
# generate.py; the instance itself (base URL, language, scope, provider, full or light pass) comes
# from the run's DataSource, so this file is the same for every instance.
#
# Order of a run, every request one second after the last (sleep before each, one message at a time):
#   1. robots.txt: a 5xx fails the run; /api disallowed for * or joinedcontext fails it; the other rules
#      are kept and every page the fallback would read is checked against them (RFC 9309, prefixes).
#   2. { decidim { version } }: 0.28 and later know `withdrawn` on proposals and meetings, 0.27 does not.
#   3. participatoryProcesses and assemblies, with their phases.
#   4. per space its components of the six types read, by type (an unfiltered list of a big process
#      timed out at the server's 30 s on tvormespolu, 2026-10-21); a space that fails keeps its records
#      until their lease runs out and the run goes on.
#   5. per component its records, 100 a page, through the GraphQL cursor.
#   6. Decidim 0.29.5 answers null for every proposal and budget project an anonymous client asks for
#      (tvormespolu, 2026-10-21): such a component is read from its public list pages instead, the cards'
#      id, title, state label, support, votes and amount only. A card's text is never read: the
#      budget cards of tvormespolu carry the proposer's e-mail and phone.
#
# The base URL is written into each http step by generate.py (PL-07: no URL comes whole from a message),
# so the run reaches that one host: the paths come from the mapping, never from an answer.
#
# Personal data: no author, authors, comments, endorsements list, profile or user field is asked for
# or copied; every text loses its e-mail addresses and phone numbers.
#
# Removal: each entity carries expiresAt three days ahead (the daily run renews it), so a record the
# platform hid, deleted or moderated leaves the space within three days.

pipeline:
  processors:
    - mapping: |
        root = this
        meta base = this.base

    - branch:
        request_map: |
          root = ""
        processors:
          - sleep: { duration: 1s }
          - http:
              url: __BASE__/robots.txt
              verb: GET
              headers:
                User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public participation data)
                Accept: text/plain
              timeout: 20s
              retries: 1
              # A missing robots.txt allows everything (RFC 9309 2.3.1.3); a 5xx stays a failure.
              successful_on: [400, 401, 403, 404, 410]
          - mapping: |
              root = { "status": @http_status_code.or("").string(), "body": content().string() }
        result_map: |
          root.robots = if this.status == "200" { this.body } else { "" }

    - mapping: |
        let lines = this.robots.split("\n").map_each(l -> l.re_replace_all("#.*$", "").trim()).filter(l -> l != "")
        let groups = $lines.fold({ "ua": [], "open": false, "out": [] }, s -> if s.value.lowercase().has_prefix("user-agent:") {
          { "ua": if s.tally.open { [s.value.slice(11).trim().lowercase()] } else { s.tally.ua.append(s.value.slice(11).trim().lowercase()) }, "open": false, "out": s.tally.out }
        } else if s.value.lowercase().has_prefix("disallow:") {
          { "ua": s.tally.ua, "open": true, "out": if s.tally.ua.contains("*") || s.tally.ua.contains("joinedcontext-platform") { s.tally.out.append(s.value.slice(9).trim()) } else { s.tally.out } }
        } else {
          { "ua": s.tally.ua, "open": true, "out": s.tally.out }
        })
        # A rule's wildcard part is cut off: the shorter prefix refuses more, never less.
        let rules = $groups.out.map_each(r -> r.split("*").index(0).split("$").index(0)).filter(r -> r != "")
        root = if $rules.any(r -> "/api".has_prefix(r)) {
          throw("robots.txt of %s disallows /api".format(this.base))
        } else { this.without("robots").assign({ "disallow": $rules }) }

    # A robots.txt that refuses the run, or that the server failed to give, stops it here.
    - switch:
        - check: "!errored()"
          processors:
            - branch:
                request_map: |
                  meta base = this.base
                  root = { "query": "{ decidim { version } }" }
                processors:
                  - sleep: { duration: 1s }
                  - http:
                      url: __BASE__/api
                      verb: POST
                      headers:
                        User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public participation data)
                        Content-Type: application/json
                        Accept: application/json
                      timeout: 40s
                      retries: 1
                result_map: |
                  root.version = this.data.decidim.version.not_null().string()

            # Only a run whose version was read goes on.
            - switch:
                - check: "!errored()"
                  processors:
                    - mapping: |
                        let v = this.version.split(".").map_each(p -> p.number().catch(0))
                        root = this.assign({ "v28": $v.index(0) > 0 || $v.index(1).or(0) >= 28 })

                    - branch:
                        request_map: |
                          meta base = this.base
                          root = {
                            "query": "query($l: String!) { participatoryProcesses { id slug reference startDate endDate updatedAt title { translation(locale: $l) } shortDescription { translation(locale: $l) } steps { title { translation(locale: $l) } startDate endDate active } } assemblies { id slug reference updatedAt title { translation(locale: $l) } shortDescription { translation(locale: $l) } } }",
                            "variables": { "l": this.locale }
                          }
                        processors:
                          - sleep: { duration: 1s }
                          - http:
                              url: __BASE__/api
                              verb: POST
                              headers:
                                User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public participation data)
                                Content-Type: application/json
                                Accept: application/json
                              timeout: 40s
                              retries: 1
                        result_map: |
                          root.processes = this.data.participatoryProcesses.catch(throw("%s/api listed no participatory processes".format(@base))).filter(p -> p != null)
                          root.assemblies = this.data.assemblies.or([]).filter(a -> a != null)

                    # Only a run whose process list was read goes on; a failed one reaches the output errored and fails.
                    - switch:
                        - check: "!errored()"
                          processors:
                            # One message per space.
                            - mapping: |
                                let cfg = this.without("processes", "assemblies")
                                let spaces = this.processes.map_each(p -> p.assign({ "kind": "process", "field": "participatoryProcess", "path": "/processes/" + p.slug })).concat(this.assemblies.map_each(a -> a.assign({ "kind": "assembly", "field": "assembly", "path": "/assemblies/" + a.slug })))
                                root = $spaces.map_each(s -> { "cfg": $cfg, "space": s })
                            - unarchive:
                                format: json_array

                            # The light pass (the hourly run during a vote) reads only the budgets of the processes running today.
                            - mapping: |
                                let now = timestamp_unix()
                                let running = this.space.startDate.ts_parse("2006-01-02").ts_unix().catch(0) <= $now && this.space.endDate.ts_parse("2006-01-02").ts_unix().catch(9999999999) + 86400 >= $now
                                root = if this.cfg.light.or(false) && !$running { deleted() } else { this }

                            - for_each:
                                - sleep: { duration: 1s }
                                - branch:
                                    request_map: |
                                      meta base = this.cfg.base
                                      let types = if this.cfg.light.or(false) { ["Budgets"] } else { ["Proposals", "Budgets", "Accountability", "Meetings", "Debates", "Surveys"] }
                                      let wanted = $types.map_each(t -> "%s: components(filter: { type: \"%s\" }) { id __typename name { translation(locale: $l) } }".format(t, t)).join(" ")
                                      root = {
                                        "query": "query($id: ID!, $l: String!) { s: %s(id: $id) { %s } }".format(this.space.field, $wanted),
                                        "variables": { "id": this.space.id, "l": this.cfg.locale }
                                      }
                                    processors:
                                      - http:
                                          url: __BASE__/api
                                          verb: POST
                                          headers:
                                            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public participation data)
                                            Content-Type: application/json
                                            Accept: application/json
                                          timeout: 40s
                                          retries: 1
                                    result_map: |
                                      root.components = this.data.s.values().flatten().filter(c -> c != null && c.id != null)
                                - catch:
                                    - log:
                                        level: WARN
                                        message: 'decidim: the components of ${! json("space.path") } were not read: ${! error() }'
                                    - mapping: |
                                        root = this.assign({ "components": [], "failed": true })

                            # The space itself, then one message per component.
                            - mapping: |
                                let cfg = this.cfg
                                let space = this.space
                                let own = if this.cfg.light.or(false) { [] } else { [{ "cfg": $cfg, "space": $space, "record": { "kind": $space.kind } }] }
                                root = $own.concat(this.components.map_each(c -> { "cfg": $cfg, "space": $space, "component": c }))
                            - unarchive:
                                format: json_array

                            # One component at a time: a while loop judges a batch by its first message.
                            - for_each:
                                - switch:
                                    - check: this.component != null
                                      processors:
                                        - mapping: |
                                            let nodes = {
                                              "Proposals": "id reference title { translation(locale: $l) } body { translation(locale: $l) } state address coordinates { latitude longitude } voteCount endorsementsCount official publishedAt updatedAt category { name { translation(locale: $l) } }" + (if this.cfg.v28 { " withdrawn" } else { "" }),
                                              "Budgets": "id title { translation(locale: $l) } total_budget projects { id reference title { translation(locale: $l) } description { translation(locale: $l) } budget_amount selected updatedAt category { name { translation(locale: $l) } } }",
                                              "Accountability": "id reference title { translation(locale: $l) } description { translation(locale: $l) } progress startDate endDate updatedAt status { name { translation(locale: $l) } } parent { id } category { name { translation(locale: $l) } }",
                                              "Meetings": "id reference title { translation(locale: $l) } description { translation(locale: $l) } startTime endTime address location { translation(locale: $l) } coordinates { latitude longitude } onlineMeetingUrl typeOfMeeting closed privateMeeting transparent updatedAt category { name { translation(locale: $l) } }" + (if this.cfg.v28 { " withdrawn" } else { "" }),
                                              "Debates": "id title { translation(locale: $l) } description { translation(locale: $l) } startTime endTime createdAt updatedAt category { name { translation(locale: $l) } }",
                                              "Surveys": "id createdAt updatedAt questionnaire { title { translation(locale: $l) } }"
                                            }
                                            let connection = { "Proposals": "proposals", "Budgets": "budgets", "Accountability": "results", "Meetings": "meetings", "Debates": "debates", "Surveys": "surveys" }
                                            let t = this.component.__typename
                                            root = this.assign({
                                              "query": "query($id: ID!, $l: String!, $after: String) { c: component(id: $id) { ... on %s { items: %s(first: 100, after: $after) { pageInfo { hasNextPage endCursor } nodes { %s } } } } }".format($t, $connection.get($t), $nodes.get($t)),
                                              "items": [], "after": null, "more": true, "pages": 0
                                            })
                                        - while:
                                            check: this.more && this.pages < 50
                                            processors:
                                              - sleep: { duration: 1s }
                                              - branch:
                                                  request_map: |
                                                    meta base = this.cfg.base
                                                    root = { "query": this.query, "variables": { "id": this.component.id, "l": this.cfg.locale, "after": this.after } }
                                                  processors:
                                                    - http:
                                                        url: __BASE__/api
                                                        verb: POST
                                                        headers:
                                                          User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public participation data)
                                                          Content-Type: application/json
                                                          Accept: application/json
                                                        timeout: 40s
                                                        retries: 1
                                                  result_map: |
                                                    root.page = if content().length() > 8388608 { throw("a page over 8 MiB") } else { this.data.c.items }
                                              - catch:
                                                  - log:
                                                      level: WARN
                                                      message: 'decidim: component ${! json("component.id") } stopped at page ${! json("pages") }: ${! error() }'
                                                  - mapping: |
                                                      root = this.assign({ "more": false, "failed": true })
                                              - mapping: |
                                                  root = if this.page == null { this.without("page") } else {
                                                    this.without("page").assign({
                                                      "items": this.items.concat(this.page.nodes.or([])),
                                                      "after": this.page.pageInfo.endCursor.or(null),
                                                      "more": this.page.pageInfo.hasNextPage.or(false) && this.page.pageInfo.endCursor.or(null) != null,
                                                      "pages": this.pages + 1
                                                    })
                                                  }
                                        # The pages the API hid: a proposals component whose records came back null, and each
                                        # budget whose projects did.
                                        - mapping: |
                                            let base = this.cfg.base + this.space.path + "/f/" + this.component.id.string()
                                            let jobs = if this.component.__typename == "Proposals" && this.items.any(n -> n == null) {
                                              [{ "kind": "proposals", "list": $base + "/proposals", "budget": null, "page": 1 }]
                                            } else if this.component.__typename == "Budgets" {
                                              this.items.filter(b -> b != null && b.projects.or([]).any(p -> p == null)).map_each(b -> { "kind": "projects", "list": $base + "/budgets/" + b.id.string() + "/projects", "budget": b.without("projects"), "page": 1 })
                                            } else { [] }
                                            let disallow = this.cfg.disallow
                                            let cbase = this.cfg.base
                                            let refused = $jobs.filter(j -> $disallow.any(r -> j.list.trim_prefix($cbase).has_prefix(r)))
                                            root = this.assign({ "jobs": $jobs.filter(j -> !$disallow.any(r -> j.list.trim_prefix($cbase).has_prefix(r))), "cards": [], "refused": $refused.map_each(j -> j.list) })
                                        - while:
                                            check: this.jobs.length() > 0 && this.pages < 80
                                            processors:
                                              - sleep: { duration: 1s }
                                              - branch:
                                                  request_map: |
                                                    let job = this.jobs.index(0)
                                                    meta path = $job.list.trim_prefix(this.cfg.base + "/") + "?per_page=100&page=" + $job.page.string() + (if $job.kind == "proposals" { "&order=recent&filter%5Bwith_any_state%5D%5B%5D=" } else { "" })
                                                    root = ""
                                                  processors:
                                                    - http:
                                                        url: __BASE__/${! @path }
                                                        verb: GET
                                                        headers:
                                                          User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public participation data)
                                                          Accept: text/html
                                                        timeout: 40s
                                                        retries: 1
                                                  result_map: |
                                                    root.html = if content().length() > 8388608 { throw("a page over 8 MiB") } else { content().string() }
                                              - catch:
                                                  - log:
                                                      level: WARN
                                                      message: 'decidim: list page of component ${! json("component.id") } not read: ${! error() }'
                                                  - mapping: |
                                                      root = this.assign({ "html": null, "failed": true })
                                              - mapping: |
                                                  map card {
                                                    let title = this.re_find_all_submatch("<h3[^>]*>([^<]*)</h3>").index(0).index(1).catch(null)
                                                    let n = this.re_find_all_submatch("^([0-9]+)").index(0).index(1).catch(null)
                                                    root = {
                                                      "id": $n,
                                                      "title": $title,
                                                      "stateLabel": this.re_find_all_submatch("class=\"label\"[^>]*>([^<]+)<").index(0).index(1).catch(null),
                                                      "endorsementsCount": this.re_find_all_submatch("(?s)data-endorsements-count=\"\"[^>]*>\\s*<svg.*?</svg>\\s*([0-9]+)").index(0).index(1).number().catch(null),
                                                      "voteCount": this.re_find_all_submatch("project-votes\">\\s*([0-9]+)").index(0).index(1).number().catch(null),
                                                      "budget_amount": this.re_find_all_submatch("project__amount\">\\s*([0-9][0-9 .\\x{a0}]*)").index(0).index(1).re_replace_all("[^0-9]", "").number().catch(null)
                                                    }
                                                  }
                                                  let job = this.jobs.index(0)
                                                  let marker = if $job.kind == "proposals" { "id=\"proposals__proposal_" } else { "id=\"project-" }
                                                  let found = if this.html == null { [] } else { this.html.split($marker).slice(1).map_each(c -> c.apply("card")).filter(c -> c.id != null && c.title != null) }
                                                  let cards = $found.map_each(c -> c.assign({ "kind": $job.kind, "budget": $job.budget, "html": true }))
                                                  let next = if $found.length() >= 100 && $job.page < 20 { [$job.assign({ "page": $job.page + 1 })] } else { [] }
                                                  root = this.without("html").assign({
                                                    "cards": this.cards.concat($cards),
                                                    "jobs": this.jobs.slice(1).concat($next),
                                                    "pages": this.pages + 1
                                                  })
                                        - mapping: |
                                            let cfg = this.cfg
                                            let space = this.space
                                            let component = this.component
                                            let t = this.component.__typename
                                            let api = this.items.filter(n -> n != null)
                                            let records = if $t == "Budgets" {
                                              $api.map_each(b -> b.projects.or([]).filter(p -> p != null).map_each(p -> p.assign({ "kind": "projects", "budget": b.without("projects") }))).flatten()
                                            } else {
                                              $api.map_each(n -> n.assign({ "kind": $t.lowercase() }))
                                            }
                                            root = $records.concat(this.cards).map_each(r -> { "cfg": $cfg, "space": $space, "component": $component, "record": r })
                                        - unarchive:
                                            format: json_array

                            # Each record as its entity.
                            - mapping: |
                                map text {
                                  root = if this == null { null } else {
                                    this.string().strip_html().unescape_html().re_replace_all("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "").re_replace_all("(\\+421|\\b0)[0-9][0-9 /]{7,}[0-9]", "").re_replace_all("\\s+", " ").re_replace_all("[\\s,;:]+$", "").trim().(t -> if t == "" { null } else { t.slice(0, [t.length(), 2000].min()) })
                                  }
                                }
                                map tr {
                                  root = if this == null { null } else { this.translation.apply("text") }
                                }
                                map prop {
                                  root = if this == null { null } else { { "type": "Property", "value": this } }
                                }
                                map instant {
                                  root = if this == null { null } else { this.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null) }
                                }
                                map dated {
                                  root = if this == null { null } else if this.string().re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\\.[0-9]+)?)?(Z|[+-][0-9]{2}:[0-9]{2}))?$") { this.string() } else { null }
                                }
                                map point {
                                  let lat = this.latitude.number().catch(null)
                                  let lon = this.longitude.number().catch(null)
                                  root = if $lat != null && $lon != null && $lat >= 47.7 && $lat <= 49.7 && $lon >= 16.8 && $lon <= 22.6 { { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [$lon, $lat] } } } else { null }
                                }
                                let cfg = this.cfg
                                let space = this.space
                                let r = this.record
                                let sp = env("JC_SPACE")
                                let page = $cfg.base + $space.path
                                let cpage = if this.component != null { $page + "/f/" + this.component.id.string() } else { $page }
                                let process_id = "urn:ngsi-ld:ParticipatoryProcess:%s:%s-%s%s".format($sp, $cfg.instance, $space.kind.slice(0, 1), $space.id)
                                let kind = $r.kind
                                let type = {
                                  "process": "ParticipatoryProcess", "assembly": "ParticipatoryProcess", "proposals": "Proposal",
                                  "projects": "BudgetProject", "accountability": "Result", "meetings": "Meeting", "debates": "Debate", "surveys": "Survey"
                                }.get($kind)
                                let now = timestamp_unix()
                                let starts = $space.startDate.ts_parse("2006-01-02").ts_unix().catch(0)
                                let ends = $space.endDate.ts_parse("2006-01-02").ts_unix().catch(9999999999) + 86400
                                let status = if $kind == "assembly" { null } else if $starts > $now { "upcoming" } else if $ends < $now { "past" } else { "active" }
                                let html = $r.html.or(false)
                                let title = if $html { $r.title.apply("text") } else { $r.title.apply("tr") }
                                let state = if $html { null } else if $r.withdrawn.or(false) { "withdrawn" } else { $r.state.or("not_answered") }
                                let component_name = if this.component != null { this.component.name.apply("tr").catch(null) } else { null }
                                let address = if $r.address.apply("text") != null || $r.location.apply("tr") != null {
                                  { "type": "Property", "value": {
                                    "streetAddress": [$r.address.apply("text"), $r.location.apply("tr")].filter(s -> s != null).join(", "),
                                    "addressLocality": $cfg.locality,
                                    "addressCountry": "SK"
                                  } }
                                } else { null }
                                let common = {
                                  "type": $type,
                                  "scope": $cfg.scope,
                                  "refParticipatoryProcess": if $kind == "process" || $kind == "assembly" { null } else { { "type": "Relationship", "object": $process_id } },
                                  "source": { "type": "Property", "value": $cfg.base },
                                  "dataProvider": { "type": "Property", "value": $cfg.provider },
                                  "sourceId": $r.id.string().catch(null).apply("prop"),
                                  "reference": $r.reference.apply("prop"),
                                  "category": $r.category.name.apply("tr").apply("prop"),
                                  "dateModified": $r.updatedAt.apply("instant").apply("prop"),
                                  # Renewed by every run; a record the platform stops listing leaves after three days.
                                  "expiresAt": (timestamp_unix() + 259200).ts_format("2006-01-02T15:04:05Z", "UTC")
                                }
                                let own = match {
                                  $kind == "process" || $kind == "assembly" => {
                                    "id": $process_id,
                                    "name": $space.title.apply("tr").apply("prop"),
                                    "description": $space.shortDescription.apply("tr").apply("prop"),
                                    "processType": $kind.apply("prop"),
                                    "status": $status.apply("prop"),
                                    "startDate": $space.startDate.apply("dated").apply("prop"),
                                    "endDate": $space.endDate.apply("dated").apply("prop"),
                                    "activeStep": $space.steps.or([]).filter(s -> s.active.or(false)).index(0).title.apply("tr").catch(null).apply("prop"),
                                    "steps": $space.steps.or([]).map_each(s -> {
                                      "title": s.title.apply("tr"), "startDate": s.startDate.apply("dated"), "endDate": s.endDate.apply("dated"), "active": s.active.or(false)
                                    }.filter(kv -> kv.value != null)).(s -> if s.length() == 0 { null } else { s }).apply("prop"),
                                    "url": $page.apply("prop"),
                                    "sourceId": $space.id.string().apply("prop"),
                                    "reference": $space.reference.apply("prop"),
                                    "dateModified": $space.updatedAt.apply("instant").apply("prop"),
                                    "category": null
                                  }
                                  $kind == "proposals" => {
                                    "id": "urn:ngsi-ld:Proposal:%s:%s-%s".format($sp, $cfg.instance, $r.id),
                                    "name": $title.apply("prop"),
                                    "description": $r.body.apply("tr").apply("prop"),
                                    "proposalState": $state.apply("prop"),
                                    "stateLabel": $r.stateLabel.apply("text").apply("prop"),
                                    "voteCount": $r.voteCount.apply("prop"),
                                    "endorsementsCount": $r.endorsementsCount.apply("prop"),
                                    "official": $r.official.apply("prop"),
                                    "address": $address,
                                    "location": $r.coordinates.apply("point").catch(null),
                                    "url": ($cpage + "/proposals/" + $r.id.string()).apply("prop"),
                                    "dateCreated": $r.publishedAt.apply("instant").apply("prop")
                                  }
                                  $kind == "projects" => {
                                    "id": "urn:ngsi-ld:BudgetProject:%s:%s-%s".format($sp, $cfg.instance, $r.id),
                                    "name": $title.apply("prop"),
                                    "description": $r.description.apply("tr").apply("prop"),
                                    "budgetAmount": $r.budget_amount.apply("prop"),
                                    "selected": $r.selected.apply("prop"),
                                    "voteCount": $r.voteCount.apply("prop"),
                                    "budgetName": $r.budget.title.apply("tr").catch(null).apply("prop"),
                                    "budgetTotal": $r.budget.total_budget.catch(null).apply("prop"),
                                    "url": ($cpage + "/budgets/" + $r.budget.id.string().catch("") + "/projects/" + $r.id.string()).apply("prop")
                                  }
                                  $kind == "accountability" => {
                                    "id": "urn:ngsi-ld:Result:%s:%s-%s".format($sp, $cfg.instance, $r.id),
                                    "name": $r.title.apply("tr").apply("prop"),
                                    "description": $r.description.apply("tr").apply("prop"),
                                    "progress": $r.progress.number().catch(null).(p -> if p == null || p < 0 || p > 100 { null } else { p }).apply("prop"),
                                    "resultStatus": $r.status.name.apply("tr").catch(null).apply("prop"),
                                    "startDate": $r.startDate.apply("dated").apply("prop"),
                                    "endDate": $r.endDate.apply("dated").apply("prop"),
                                    "refParent": if $r.parent.id.catch(null) != null { { "type": "Relationship", "object": "urn:ngsi-ld:Result:%s:%s-%s".format($sp, $cfg.instance, $r.parent.id) } } else { null },
                                    "url": ($cpage + "/results/" + $r.id.string()).apply("prop")
                                  }
                                  $kind == "meetings" => {
                                    "id": "urn:ngsi-ld:Meeting:%s:%s-%s".format($sp, $cfg.instance, $r.id),
                                    "name": $r.title.apply("tr").apply("prop"),
                                    "description": $r.description.apply("tr").apply("prop"),
                                    "startDate": $r.startTime.apply("dated").apply("prop"),
                                    "endDate": $r.endTime.apply("dated").apply("prop"),
                                    "meetingType": $r.typeOfMeeting.or(null).(m -> if ["in_person", "online", "hybrid"].contains(m) { m } else { null }).apply("prop"),
                                    "address": $address,
                                    "location": $r.coordinates.apply("point").catch(null),
                                    "onlineUrl": $r.onlineMeetingUrl.or(null).(u -> if u != null && u.has_prefix("https://") { u } else { null }).apply("prop"),
                                    "closed": $r.closed.apply("prop"),
                                    "url": ($cpage + "/meetings/" + $r.id.string()).apply("prop")
                                  }
                                  $kind == "debates" => {
                                    "id": "urn:ngsi-ld:Debate:%s:%s-%s".format($sp, $cfg.instance, $r.id),
                                    "name": $r.title.apply("tr").apply("prop"),
                                    "description": $r.description.apply("tr").apply("prop"),
                                    "startDate": $r.startTime.apply("dated").apply("prop"),
                                    "endDate": $r.endTime.apply("dated").apply("prop"),
                                    "dateCreated": $r.createdAt.apply("instant").apply("prop"),
                                    "url": ($cpage + "/debates/" + $r.id.string()).apply("prop")
                                  }
                                  $kind == "surveys" => {
                                    "id": "urn:ngsi-ld:Survey:%s:%s-%s".format($sp, $cfg.instance, $r.id),
                                    "name": $r.questionnaire.title.apply("tr").catch(null).or($component_name).apply("prop"),
                                    "dateCreated": $r.createdAt.apply("instant").apply("prop"),
                                    "url": $cpage.apply("prop")
                                  }
                                }
                                # A private meeting nobody may watch and a withdrawn one are not public records.
                                let hidden = $kind == "meetings" && (($r.privateMeeting.or(false) && !$r.transparent.or(false)) || $r.withdrawn.or(false))
                                root = if $hidden || $type == null { deleted() } else { $common.assign($own).filter(kv -> kv.value != null) }

                            - archive:
                                format: json_array
