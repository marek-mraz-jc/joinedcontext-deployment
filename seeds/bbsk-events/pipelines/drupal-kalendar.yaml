# The Drupal calendar of Technická univerzita vo Zvolene and its faculties (`kalendar-podujati`,
# `kalendar-udalosti`; T-5083): the month's page lists each event with its start (`content="2026-10-07T09:45:00+02:00"`),
# its end as text (`Koniec: 7. 10. 2026, 15:45`), Miesto, Usporiadateľ and Zameranie. The page and the next month's
# (`?mini=YYYY-MM`) are read, 10 seconds apart as the site's robots.txt asks (Crawl-delay 10): two requests a run,
# no event page. The "Odborný gestor" field names persons and is never read.
- mapping: |
    root = { "page": content().string() }
- branch:
    # The next month of the same list page on the same host: the path is fixed by the inventory row.
    request_map: |
      let now = timestamp_unix()
      let first = $now.ts_format("2006-01", "Europe/Bratislava") + "-01"
      root = ""
      meta event_path = __LIST_PATH__.trim_prefix("/") + "?mini=" + ($first.ts_parse("2006-01-02").ts_unix() + 32 * 86400).ts_format("2006-01", "UTC")
    processors:
      - sleep:
          duration: 10s
      - http:
          url: __HOST__/${! @event_path }
          verb: GET
          headers:
            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
            Accept: text/html
          timeout: 20s
          retries: 1
    result_map: |
      root.next = content().string()
- mapping: |
    map at {
      let m = this.or("").re_find_object("^(?P<d>[0-9]{1,2})\\. ?(?P<m>[0-9]{1,2})\\. ?(?P<y>[0-9]{4})(?:,? *(?P<h>[0-9]{1,2}):(?P<i>[0-9]{2}))?")
      let day = if $m.y.or("") == "" { null } else { "%s-%02d-%02d".format($m.y, $m.m.number().int64(), $m.d.number().int64()) }
      let local = if $day != null && $m.h.or("") != "" { "%sT%02d:%s:00".format($day, $m.h.number().int64(), $m.i) } else { null }
      root = if $local != null { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") } else { $day }
    }
    map field {
      root = this.row.re_find_object("<div class=\"" + this.cls + "\"><span>[^<]*</span><span>(?P<v>[^<]{0,500})</span>").v.or(null).(v -> if v != null { v.unescape_html().trim() } else { null })
    }
    let rows = (this.page + this.next.or("")).split("<div class=\"views-row").filter(r -> r.contains("podujatie-info"))
    root = $rows.map_each(r -> {
      "link": r.re_find_object("<div class=\"podujatie-info\">\\s*<a href=\"(?P<h>/[A-Za-z0-9._~%/-]{1,300})\">(?P<n>[^<]{1,500})</a>").or({}),
      "row": r
    }).filter(x -> x.link.h.or(null) != null).map_each(x -> {
      "name": x.link.n.unescape_html().trim(),
      "url": "__HOST__" + x.link.h,
      "sourceId": x.link.h,
      "start": x.row.re_find_object("content=\"(?P<v>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[+-][0-9]{2}:[0-9]{2})\"").v.or(null),
      "end": x.row.re_find_object("class=\"end-date\">Koniec: <span[^>]*>(?P<v>[^<]{1,40})</span>").v.or(null).apply("at"),
      "venue": { "row": x.row, "cls": "miesto" }.apply("field"),
      "category": { "row": x.row, "cls": "zameranie" }.apply("field"),
      "organizer": { "row": x.row, "cls": "usporiadatel" }.apply("field").(o -> if o != null && o != "" { { "name": o } } else { null })
    }).unique(e -> e.sourceId)
