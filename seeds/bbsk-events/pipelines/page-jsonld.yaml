# An events page that carries its events as schema.org Event JSON-LD itself (T-5047): one request, no page
# reads. Each Event node becomes a record; a time without its offset is Bratislava's.
- mapping: |
    map at {
      let s = this.or("").string().trim().re_replace_all("([+-][0-9]{2})([0-9]{2})$", "$1:$2")
      let v = if $s.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:") { $s.slice(0, 10) + "T" + $s.slice(11) } else { $s }
      let local = $v.re_find_object("^(?P<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2})(:[0-9]{2})?$").t.or(null)
      root = if $v.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") || $v.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?([.][0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$") { $v } else if $local != null { $local + ":00" + ($local + ":00Z").ts_format("-07:00", "Europe/Bratislava") } else { null }
    }
    let blocks = content().string().re_find_all_object("<script[^>]*application/ld\\+json[^>]*>(?P<j>[\\s\\S]*?)</script>").map_each(m -> m.j.parse_json().catch(null)).filter(j -> j != null)
    let nodes = $blocks.map_each(j -> if j.type() == "array" { j } else if j."@graph".or(null) != null { j."@graph" } else { [j] }).flatten()
    let events = $nodes.filter(n -> n.type() == "object" && n."@type".or("").string().re_match("Event"))
    # A page without any JSON-LD is a broken or moved page, not a quiet day: the run fails and says so.
    let _ = if $blocks.length() == 0 { throw("the events page carries no schema.org JSON-LD") } else { true }
    root = $events.map_each(e -> e.location.or(null).(l -> if l != null && l.type() == "array" { l.index(0).catch(null) } else { l }).(loc -> loc.address.or(null).(adr -> {
      "name": e.name.or(null),
      "start": e.startDate.or(null).apply("at"),
      "end": e.endDate.or(null).apply("at").(x -> if x != e.startDate.or(null).apply("at") { x } else { null }),
      "venue": loc.name.or(null),
      "streetAddress": if adr != null && adr.type() == "string" { adr } else { adr.streetAddress.or(null) },
      "postalCode": if adr != null && adr.type() == "object" { adr.postalCode.or(null) } else { null },
      "locality": if adr != null && adr.type() == "object" { adr.addressLocality.or(null) } else { null },
      "lat": loc.geo.latitude.or(null),
      "lon": loc.geo.longitude.or(null),
      "url": e.url.or(null),
      "description": e.description.or(null),
      "sourceId": e.url.or(e."@id".or(null))
    })))
