# Krupina's ID-SK (govuk) town site (T-5354): the events list links each event as `/podujatia/<28 hex>`; the event's
# page holds a summary list (`govuk-summary-list__key` Kedy, Kde, Organizátor) with the date as printed
# ("16. 11. 2026", "3. – 5. 12. 2026", maybe a time) and the place as "[place, ]town". A title starting with its
# own date ("16. 11. Tanečná zábava") loses the date. One page of the source's own host at a time, a second apart.
- mapping: |
    let paths = content().string().re_find_all_object("href=\"(?:__HOST_RE__)?(?P<p>__LIST_PATH_RE__/[0-9a-f]{28})\"").map_each(m -> m.p).unique()
    root = $paths.slice(0, [$paths.length(), 50].min()).map_each(p -> { "url": "__HOST__" + p, "path": p, "sourceId": p })
- unarchive:
    format: json_array
- branch:
    # Only a page of the source's own host: the path is checked by the pattern above and the host is fixed in
    # the url below, so an item can never send the run to another host.
    request_map: |
      root = ""
      meta event_path = this.path.trim_prefix("/")
    processors:
      - sleep:
          duration: 1s
      - http:
          url: __HOST__/${! @event_path }
          verb: GET
          headers:
            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
            Accept: text/html
          timeout: 20s
          retries: 1
    result_map: |
      # A day as {d, m, y} to YYYY-MM-DD; number() before int64(): int64() reads "08" as octal.
      map day {
        root = if this.y == "" || this.m == "" || this.d == "" { null } else { "%04d-%02d-%02d".format(this.y.number().int64(), this.m.number().int64(), this.d.number().int64()) }
      }
      let page = content().string()
      let rows = $page.re_find_all_object("<dt class=\"govuk-summary-list__key\">(?P<k>[^<]{1,80})</dt>\\s*<dd class=\"govuk-summary-list__value\">(?P<v>[^<]{0,500})</dd>").fold({}, acc -> acc.tally.merge({ (acc.value.k.trim()): acc.value.v.unescape_html().re_replace_all("\\s+", " ").trim() }))
      let when = $rows.Kedy.or("").replace_all("–", "-")
      # "3. - 5. 12. 2026" or "30. 11. - 2. 12. 2026": the start takes the end's month and year where it prints none.
      let range = $when.re_find_object("^(?P<d1>[0-9]{1,2})\\.\\s*(?:(?P<m1>[0-9]{1,2})\\.\\s*)?(?:(?P<y1>[0-9]{4})\\s*)?-\\s*(?P<d2>[0-9]{1,2})\\.\\s*(?P<m2>[0-9]{1,2})\\.\\s*(?P<y2>[0-9]{4})")
      let one = $when.re_find_object("^(?P<d>[0-9]{1,2})\\.\\s*(?P<m>[0-9]{1,2})\\.\\s*(?P<y>[0-9]{4})(?:,?\\s*(?:o|od)?\\s*(?P<h>[0-9]{1,2})[:.](?P<i>[0-9]{2}))?")
      let first = if $range.d2.or("") != "" { { "d": $range.d1, "m": $range.m1.or("").(v -> if v == "" { $range.m2 } else { v }), "y": $range.y1.or("").(v -> if v == "" { $range.y2 } else { v }) }.apply("day") } else { { "d": $one.d.or(""), "m": $one.m.or(""), "y": $one.y.or("") }.apply("day") }
      let local = if $first != null && $one.h.or("") != "" { "%sT%02d:%s:00".format($first, $one.h.number().int64(), $one.i) } else { null }
      let parts = $rows.Kde.or("").split(",").map_each(p -> p.trim()).filter(p -> p != "")
      let name = $page.re_find_object("<h1 class=\"govuk-heading-xl[^\"]*\">(?P<v>[^<]{1,500})</h1>").v.or("").unescape_html().re_replace_all("^[0-9]{1,2}\\.\\s*(?:[-–]\\s*[0-9]{1,2}\\.\\s*)?[0-9]{1,2}\\.\\s+", "").trim()
      root.name = if $name == "" { null } else { $name }
      root.start = if $local != null { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") } else { $first }
      root.end = if $range.d2.or("") != "" { { "d": $range.d2, "m": $range.m2, "y": $range.y2 }.apply("day") } else { null }
      # The place is the whole text but its last part, the town; a text of one part is the town alone and stays the
      # venue, so an event in another town is never placed at this town's office.
      root.venue = if $parts.length() > 1 { $parts.slice(0, -1).join(", ") } else { $parts.index(0).catch(null) }
      root.locality = $parts.index(-1).catch(null)
      root.organizer = $rows."Organizátor".or("").(o -> if o == "" { null } else { { "name": o } })
- archive:
    format: json_array
