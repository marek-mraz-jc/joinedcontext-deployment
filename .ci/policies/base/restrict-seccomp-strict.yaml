---
# upstream content is vendored verbatim, so long lines are tolerated:
# yamllint disable rule:line-length
# Vendored from github.com/kyverno/policies
# path: pod-security/restricted/restrict-seccomp-strict/restrict-seccomp-strict.yaml
# ref: 76be98a25d49ae01278a94ecde8f50f9e08577ef
# Do not edit by hand; re-run .ci/policies/vendor-upstream-policies.sh instead.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-seccomp-strict
  annotations:
    policies.kyverno.io/title: Restrict Seccomp (Strict)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    kyverno.io/kyverno-version: 1.6.0
    kyverno.io/kubernetes-version: '1.22-1.23'
    policies.kyverno.io/description: >-
      The seccomp profile in the Restricted group must not be explicitly set to Unconfined
      but additionally must also not allow an unset value. This policy,
      requiring Kubernetes v1.19 or later, ensures that seccomp is
      set to `RuntimeDefault` or `Localhost`. A known issue prevents a policy such as this
      using `anyPattern` from being persisted properly in Kubernetes 1.23.0-1.23.2.
spec:
  background: true
  validationFailureAction: Audit
  rules:
    - name: check-seccomp-strict
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Use of custom Seccomp profiles is disallowed. The fields
          spec.securityContext.seccompProfile.type,
          spec.containers[*].securityContext.seccompProfile.type,
          spec.initContainers[*].securityContext.seccompProfile.type, and
          spec.ephemeralContainers[*].securityContext.seccompProfile.type
          must be set to `RuntimeDefault` or `Localhost`.
        anyPattern:
          - spec:
              securityContext:
                seccompProfile:
                  type: 'RuntimeDefault | Localhost'
              =(ephemeralContainers):
                - =(securityContext):
                    =(seccompProfile):
                      =(type): 'RuntimeDefault | Localhost'
              =(initContainers):
                - =(securityContext):
                    =(seccompProfile):
                      =(type): 'RuntimeDefault | Localhost'
              containers:
                - =(securityContext):
                    =(seccompProfile):
                      =(type): 'RuntimeDefault | Localhost'
          - spec:
              =(ephemeralContainers):
                - securityContext:
                    seccompProfile:
                      type: 'RuntimeDefault | Localhost'
              =(initContainers):
                - securityContext:
                    seccompProfile:
                      type: 'RuntimeDefault | Localhost'
              containers:
                - securityContext:
                    seccompProfile:
                      type: 'RuntimeDefault | Localhost'
