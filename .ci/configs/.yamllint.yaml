---
extends: default

rules:
  line-length:
    max: 120
    level: warning

  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  indentation:
    spaces: 2
    indent-sequences: true

  comments:
    min-spaces-from-content: 1

  truthy:
    allowed-values: ['true', 'false', 'on', 'off']

  comments-indentation: disable

  document-start:
    present: true
