# The baseline `cargo deny` configuration every Rust repository of the platform is held to
# (TS-04, TS-24, OPS-41). A repository that ships its own `deny.toml` uses that one instead,
# because an exception needs a reason written next to it; this is what applies when there is
# none.
#
# The copy embedded in `.github/workflows/reusable-rust-security.yml` is generated from this
# file and `tests/test_reusable_workflows.py` fails when the two drift.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []
[licenses]
# Permissive and weak-copyleft only. A strong copyleft licence (GPL, AGPL, LGPL) on a crate
# linked into a distributed binary changes what the platform may be shipped under, which is a
# decision no pull request makes on its own.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "EUPL-1.2", "CC0-1.0", "MIT-0", "OpenSSL"]
confidence-threshold = 0.9
[bans]
multiple-versions = "warn"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
