# What images/decidim/site.rb puts on the site (T-6453). Titles, states, phases, dates, venues,
# amounts and vote counts are the city's public record on tvormespolu.banskabystrica.sk, read
# 2026-11-02. Descriptions are written here in short: the public texts open with the proposer's
# name, e-mail and telephone, and none of that is copied. Authors are the organization.
organization:
  name: { sk: Spoločne tvorme Banskú Bystricu, en: Shaping Banská Bystrica Together }
  description:
    sk: Participatívna platforma mesta Banská Bystrica. Navrhujte, diskutujte a rozhodujte o tom, ako sa mení vaše okolie.
    en: The participation platform of the city of Banská Bystrica. Propose, discuss and decide how your neighbourhood changes.
  demo_notice:
    sk: Toto je demo kópia na testovacom prostredí, nie oficiálny web mesta. Obsah je prevzatý z verejného záznamu a slúži na ukážku.
    en: This is a demo copy on a test environment, not the city's official site. The content comes from the public record and is shown as a sample.
  demo_banner:
    sk: Demo kópia na testovacom prostredí, nie oficiálny web mesta.
    en: Demo copy on a test environment, not the city's official site.
  # The public site's primary colour; a darker shade carries links (7:1 on white); its grey.
  colors: { primary: "#d62426", secondary: "#a81c1e", tertiary: "#d1d1d1" }
  official_url: https://www.banskabystrica.sk
  time_zone: Bratislava
home:
  welcome_text: { sk: Spoločne tvorme Banskú Bystricu, en: Shaping Banská Bystrica Together }
  cta_text: { sk: Zapojte sa do participatívneho rozpočtu, en: Join the participatory budget }
  cta_process: participatorybudget20262027
privacy:
  slug: ochrana-osobnych-udajov
  title: { sk: Ochrana osobných údajov, en: Privacy }
  content:
    sk: <p>Prihlásenie zabezpečuje prihlasovacia služba platformy; samostatná registrácia tu nie je. Platforma ukladá len údaje potrebné na vaše príspevky a nastavenia účtu. Meno ani e-mail sa nezverejňujú v otvorených dátach a príspevky sa do dátového katalógu prenášajú bez osobných údajov.</p><p>Otázky k spracovaniu osobných údajov posielajte správcovi platformy mesta.</p>
    en: <p>Sign-in goes through the platform's sign-in service; there is no separate registration here. The platform stores only what your contributions and account settings need. Your name and e-mail are not published in open data, and contributions reach the data catalogue without personal data.</p><p>Send questions about personal data to the city's platform administrator.</p>
step_titles_en:
  Prvé diskusné fórum a vyhlásenie participatívneho rozpočtu: First discussion forum and launch of the budget
  Konzultačné stretnutia s predkladateľmi: Consultations with proposers
  Podávanie návrhov: Submitting proposals
  Formálna kontrola návrhov: Formal check of proposals
  Druhé diskusné fórum: Second discussion forum
  Hlasovanie: Voting
  Realizácia projektov: Delivering the projects
  Ročník ukončený: Round finished
processes:
- slug: participatorybudget20262027
  image: process-open.jpg
  promoted: false
  title: { sk: Participatívny rozpočet 2026/2027, en: Participatory budget 2026/2027 }
  subtitle: { sk: Podávanie návrhov je otvorené, en: Proposals are open }
  short_description:
    sk: <p>Zapojte sa do participatívneho rozpočtu a zmeňte svoju komunitu a okolie podľa vašich predstáv!</p>
    en: <p>Join the participatory budget and change your community and neighbourhood the way you want it!</p>
  description:
    sk: <p>Občania navrhujú projekty pre svoje okolie, mesto ich formálne skontroluje a o tých, ktoré postúpia, rozhodnú obyvatelia v online hlasovaní. Vyčlenená suma je 40 000 €, jeden projekt môže získať najviac 10 000 €.</p>
    en: <p>Residents propose projects for their neighbourhood, the city checks them formally, and residents decide on those that pass in an online vote. The allocation is EUR 40,000, with at most EUR 10,000 per project.</p>
  start_date: 2026-05-01
  end_date: 2027-12-30
  budget_total: 40000
  budget_votes: disabled
  steps:
  - { title: "Prvé diskusné fórum a vyhlásenie participatívneho rozpočtu" }
  - { title: "Konzultačné stretnutia s predkladateľmi", start: 2026-06-01, end: 2026-07-31 }
  - { title: "Podávanie návrhov", start: 2026-04-02, end: 2027-10-01, active: true }
  - { title: "Formálna kontrola návrhov", start: 2026-10-01, end: 2026-10-31 }
  - { title: "Druhé diskusné fórum", start: 2026-11-18, end: 2026-11-19 }
  - { title: "Hlasovanie", start: 2027-01-12, end: 2027-01-31 }
  - { title: "Realizácia projektov", start: 2027-03-01, end: 2027-12-31 }
  proposals:
  - { title: "Revitalizácia zelene a vodozádržné opatrenia v okolí bytového domu Partizánska 14-20", state: "evaluating", body: "Zachytávanie dažďovej vody zo strechy bytového domu do podzemnej a dekoratívnej nádrže a obnova predzáhradiek, trávnatých plôch a mobilnej zelene." }
  - { title: "Realizácia letného integračného táboru pre handikepovaných mladých ľudí", state: "rejected", body: "Štyri týždne denného integračného tábora v júli a auguste pre mladých ľudí so zdravotným postihnutím a ich rovesníkov." }
  - { title: "Komunitný altánok", state: "evaluating", body: "Drevený bezbariérový altánok s mobiliárom a solárnym osvetlením vo vnútrobloku ulíc Moskovská a Oremburská na stretávanie susedov a generácií." }
  - { title: "Vybavenie priestoru osvetového projektu PROSVITA", state: "evaluating", body: "Trvalé vybavenie priestoru na Tatranskej ulici na vzdelávanie a stretávanie ukrajinských a slovenských detí a rodín." }
  - { title: "Revitalizácia multifunkčného športovo-voľnočasového areálu na Rudohorskej ulici v Sásovej", state: "evaluating", body: "Obnova povrchu a vybavenia areálu, ktorý obyvatelia využívajú na šport, pohyb a stretávanie." }
  - { title: "Moderný street workout priestor na Slnečnej", state: "evaluating", body: "Verejné street workout ihrisko pre mládež, dospelých a seniorov zo sídliska, doplnok k existujúcemu detskému ihrisku." }
  - { title: "Workout ihrisko s detskými prvkami Šalková – priestor pre pohyb a šport pre všetkých", state: "evaluating", body: "Verejne prístupná workoutová zostava s detskými hernými prvkami a bezpečnými dopadovými plochami v areáli futbalového ihriska." }
  meetings:
