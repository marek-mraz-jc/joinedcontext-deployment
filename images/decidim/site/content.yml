  - { title: "Druhé diskusné fórum participatívneho rozpočtu", title_en: "Second discussion forum of the participatory budget", location: "Veľká sieň MsÚ", address: "Československej armády 26, Banská Bystrica", start: "2026-11-18T17:00:00+01:00", end: "2026-11-18T19:00:00+01:00", description: "Predkladatelia predstavia svoje návrhy a odborníci mestského úradu k nim povedia svoje stanovisko." }
  projects:
  - { title: "Komunitný altánok", amount: 10000, description: "Návrh vo formálnej kontrole; suma je strop pravidiel ročníka." }
  - { title: "Moderný street workout priestor na Slnečnej", amount: 10000, description: "Návrh vo formálnej kontrole; suma je strop pravidiel ročníka." }
  - { title: "Vybavenie priestoru osvetového projektu PROSVITA", amount: 10000, description: "Návrh vo formálnej kontrole; suma je strop pravidiel ročníka." }
