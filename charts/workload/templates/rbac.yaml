{{- if .Values.rbac.rules }}
{{- $namespace := .Values.rbac.namespace | default .Release.Namespace }}
# A namespaced Role, never a ClusterRole: a workload that needs to write objects needs them in
# one namespace, and a cluster-wide grant cannot be reasoned about from this chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "workload.fullname" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "workload.fullname" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "workload.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "workload.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
