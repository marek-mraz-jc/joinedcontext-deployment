{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "workload.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- /* Identities of pods this workload starts but does not run itself (the build Jobs the Portal
       reconciler starts, AP-81): created here so they exist before the first Job, in the namespace
       the Role reaches, and never with a token. */}}
{{- range $name := .Values.extraServiceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.rbac.namespace | default $.Release.Namespace }}
  labels:
    {{- include "workload.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
