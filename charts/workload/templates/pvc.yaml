{{- if .Values.persistence.enabled }}
# The workload's files volume (PL-50): what a runner reads a dropped file from. Kept on
# uninstall by Helm's resource policy, so a redeploy does not lose the files.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "workload.fullname" . }}-files
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
