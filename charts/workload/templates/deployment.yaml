apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workload.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workload.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take a pod away before its replacement is serving: the platform stays up through
      # a rollout, which is what OPS-07 asks of every stateless service. The surge is a share
      # rather than a count, so a service that scales out rolls proportionally instead of one
      # pod at a time.
      maxUnavailable: 0
      maxSurge: {{ .Values.maxSurge | default "25%" | quote }}
  selector:
    matchLabels:
      {{- include "workload.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $hasAnnotations := or .Values.serviceMesh.enabled .Values.configMap.enabled .Values.podAnnotations }}
      {{- if $hasAnnotations }}
      annotations:
        {{- if .Values.serviceMesh.enabled }}
        linkerd.io/inject: enabled
        {{- end }}
        {{- if .Values.configMap.enabled }}
        checksum/config: {{ .Values.configMap.data | toYaml | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "workload.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "workload.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "workload.name" . }}
          image: {{ include "workload.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: {{ .Values.service.name | default "http" }}
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: {{ .Values.metrics.name | default "metrics" }}
              containerPort: {{ .Values.metrics.port | default 4195 }}
              protocol: TCP
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | default "/" }}
              port: {{ .Values.containerPort }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold | default 3 }}
            {{- if .Values.probes.readiness.initialDelaySeconds }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | default "/" }}
              port: {{ .Values.containerPort }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | default 15 }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold | default 3 }}
            {{- if .Values.probes.liveness.initialDelaySeconds }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            {{- end }}
          {{- if or .Values.envSecret .Values.env }}
          env:
            {{- range $key, $sec := .Values.envSecret }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $sec.secret | quote }}
                  key: {{ $sec.key | quote }}
            {{- end }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
          {{- $hasMounts := or .Values.tmpDir .Values.configMap.enabled .Values.extraVolumeMounts .Values.persistence.enabled }}
          {{- if $hasMounts }}
          volumeMounts:
            {{- if .Values.tmpDir }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: files
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.configMap.enabled }}
            - name: config
              mountPath: {{ .Values.configMap.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $hasVolumes := or .Values.tmpDir .Values.configMap.enabled .Values.extraVolumes .Values.persistence.enabled }}
      {{- if $hasVolumes }}
      volumes:
        {{- if .Values.tmpDir }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: files
          persistentVolumeClaim:
            claimName: {{ include "workload.fullname" . }}-files
        {{- end }}
        {{- if .Values.configMap.enabled }}
        - name: config
          configMap:
            name: {{ default (include "workload.fullname" .) .Values.configMap.name }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
