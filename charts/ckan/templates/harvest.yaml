{{- /*
  Catalogue harvests (T-4151): one CronJob per `harvest.sources` entry, each copying one
  publisher's datasets from the national catalogue into a CKAN organization with
  `files/harvest-<kind>.py` (`nkod` unless the entry names `kind`; `hub` reads an ArcGIS Hub,
  T-4152). It writes through the Action API on the catalogue's own Service with
  the publisher token the api-token Job keeps, so it needs no Kubernetes API access and mounts no
  ServiceAccount token. Its egress is the catalogue and public 443 (networkpolicies.yaml).
  A run takes minutes, so it is never a Helm hook: the first run after an install is
  `kubectl create job --from=cronjob/ckan-harvest-<name> ckan-harvest-<name>-now`.
*/}}
{{- $full := include "ckan.fullname" . }}
{{- range .Values.harvest.sources }}
{{- $part := "harvest" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $full }}-{{ $part }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ckan.labels" (dict "root" $ "part" $part) | nindent 4 }}
spec:
  schedule: {{ $.Values.harvest.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "ckan.selectorLabels" (dict "root" $ "part" $part) | nindent 12 }}
          {{- if $.Values.serviceMesh.enabled }}
          annotations:
            # Told to exit with the script, or the pod stays Running and the Job never completes.
            linkerd.io/inject: enabled
            config.alpha.linkerd.io/proxy-enable-native-sidecar: "true"
          {{- end }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: harvest
              # CKAN's own image: pinned, and it carries python3; the script needs nothing else.
              image: {{ include "ckan.image" $.Values.ckan.image }}
              imagePullPolicy: {{ $.Values.ckan.image.pullPolicy }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              resources:
                # The largest city file is 14 MB of JSON, about 200 MB once parsed.
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              env:
                - name: CATALOGUE
                  value: {{ printf "%s.%s.svc.cluster.local" $full $.Release.Namespace | quote }}
                - name: CKAN_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.apiToken.secret }}
                      key: token
                - name: HARVEST_CONFIG
                  value: {{ merge (dict "source" (printf "%s-%s" (.kind | default "nkod") .name)) (omit . "name") | toJson | quote }}
              command: [python3, -c]
              args:
                - {{ $.Files.Get (printf "files/harvest-%s.py" (.kind | default "nkod")) | toJson }}
{{- end }}
