{{- $part := "redis" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ckan.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ckan.labels" (dict "root" . "part" $part) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ckan.selectorLabels" (dict "root" . "part" $part) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ckan.selectorLabels" (dict "root" . "part" $part) | nindent 8 }}
      {{- with (include "ckan.podAnnotations" .) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: redis
          image: {{ include "ckan.image" .Values.redis.image }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # A cache, not a database: no RDB, no AOF, nothing on disk to lose or to protect.
          args:
            - redis-server
            - --save
            - ''
            - --appendonly
            - 'no'
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 15
            timeoutSeconds: 3
            initialDelaySeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ckan.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ckan.labels" (dict "root" . "part" $part) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ckan.selectorLabels" (dict "root" . "part" $part) | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
