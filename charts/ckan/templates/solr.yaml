{{- $part := "solr" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ckan.fullname" . }}-solr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ckan.labels" (dict "root" . "part" $part) | nindent 4 }}
spec:
  serviceName: {{ include "ckan.fullname" . }}-solr
  replicas: 1
  selector:
    matchLabels:
      {{- include "ckan.selectorLabels" (dict "root" . "part" $part) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ckan.selectorLabels" (dict "root" . "part" $part) | nindent 8 }}
      {{- with (include "ckan.podAnnotations" .) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: solr
          image: {{ include "ckan.image" .Values.solr.image }}
          imagePullPolicy: {{ .Values.solr.image.pullPolicy }}
          env:
            # Solr writes its logs beside its binaries by default, which a read-only root
            # filesystem refuses; the claim below is the only writable place it has.
            - name: SOLR_LOGS_DIR
              value: /var/solr/logs
            - name: SOLR_HOME
              value: /var/solr/data
          ports:
            - name: solr
              containerPort: 8983
          readinessProbe:
            httpGet:
              path: /solr/ckan/admin/ping
              port: solr
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /solr/admin/info/system
              port: solr
            periodSeconds: 30
            timeoutSeconds: 5
            initialDelaySeconds: 30
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/solr
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.solr.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.solr.storage.storageClass }}
        storageClassName: {{ .Values.solr.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.solr.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ckan.fullname" . }}-solr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ckan.labels" (dict "root" . "part" $part) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ckan.selectorLabels" (dict "root" . "part" $part) | nindent 4 }}
  ports:
    - name: solr
      port: 8983
      targetPort: solr
