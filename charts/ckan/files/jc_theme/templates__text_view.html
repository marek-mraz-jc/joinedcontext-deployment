{% ckan_extends %}

{# CKAN's own inline script, with this request's nonce: the CSP refuses any other (T-5147). #}
{% block scripts %}
  <script nonce="{{ h.jc_csp_nonce() }}">
    var preload_resource = {{ resource | tojson }};
    var resource_url = {{ resource_url | tojson }};
    var preview_metadata = {{ preview_metadata | tojson }};
  </script>
{% endblock %}
