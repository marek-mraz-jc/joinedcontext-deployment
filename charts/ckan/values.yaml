# Default values for the ckan chart.
#
# CKAN is a third-party application, so the chart's job is to run it the way the platform
# runs everything else: non-root, read-only root filesystem, digest-pinned images, probes,
# and no value of its own that a city would have to edit. Everything a person sees comes
# from `branding` (OPS-46, OPS-47).

nameOverride: ''
fullnameOverride: 'ckan'

# The public URL CKAN renders every link with. Wrong here means every link in the catalogue
# points at the wrong host, so it has no default.
siteUrl: ''

ckan:
  replicaCount: 1
  image:
    repository: ''
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  # CKAN's own plugin list. `jc_theme` is the theme this chart mounts; the rest are CKAN's. It
  # comes first because the first plugin's templates win (IConfigurer runs in reverse), and the
  # theme overrides the table view's own page so the grid framed on a dataset page wears the
  # installation's look (T-3009).
  plugins: 'jc_theme envvars image_view text_view datatables_view datastore'
  # `ckan.locale_default` and `ckan.locales_offered` (T-4199); CKAN ships each of these.
  locales:
    default: sk
    offered: [sk, en, cs, fi]
  # `oidc_pkce` is appended to this list by the template when `sso.enabled` is on, and only
  # then: CKAN exits on a plugin it cannot import, and the extension lives in the image this
  # repository builds, not in the stock one.

  # Where uploads and resources land. A catalogue that loses them loses data, so this is a
  # claim and not an emptyDir.
  storage:
    size: 5Gi
    storageClass: ''
  # Keycloak login, through `ckanext-oidc-pkce`. Turning this on without an image that carries
  # the extension makes CKAN exit on an unknown plugin, so it travels with the pinned image
  # (T-0403). `issuer` is the realm's public URL; the host of it is what the extension is given
  # and the path of it is what 01-oidc.sh turns into the four endpoints.
  sso:
    enabled: false
    clientId: ckan
    # The realm's public issuer; the `iss` of every token carries it.
    issuer: ''
    scope: 'openid email profile'
  # DCAT-AP 3 for harvesters (data.europa.eu, a national portal, another CKAN): the catalogue
  # at /catalog.{rdf,ttl,jsonld} and each dataset at /dataset/{id}.{rdf,ttl,jsonld}, through
  # `ckanext-dcat` (T-3010). Like `sso`, the plugin lives in the image this repository builds,
  # so `dcat` joins the plugin list only when this is on and the pinned image carries it.
  dcat:
    enabled: false
  env: {}
  envSecret: {}
  resources: {}
  # How long a stopping CKAN keeps serving before uWSGI is told to stop, and how long its mesh
  # proxy waits beyond that for the requests the pause let in (T-3008, T-3032). The grace
  # period must be longer than both together.
  preStopSleepSeconds: 5
  meshDrainSeconds: 5
  terminationGracePeriodSeconds: 30

solr:
  # The CKAN project publishes a Solr image with CKAN's own schema already in it; a plain
  # Solr needs that schema loaded by hand before CKAN can index anything.
  image:
    repository: ''
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  storage:
    size: 5Gi
    storageClass: ''
  # SOLR_HEAP, both -Xms and -Xmx; empty keeps the image's 512m.
  heap: ''
  resources: {}

redis:
  # A cache and a job queue, nothing durable: persistence is off, so a restart costs a
  # rebuild of what CKAN can recompute anyway.
  image:
    repository: ''
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  resources: {}

database:
  host: ''
  port: 5432
  name: ckan
  user: ckan
  # The datastore extension keeps its rows in a database of its own (EP-65).
  datastoreName: ckan_datastore
  secret:
    name: db-ckan
    key: password
  # CKAN refuses to start when the datastore read connection can write: that is what keeps
  # `datastore_search_sql` from being an arbitrary-SQL hole in a public catalogue. The role
  # is created read-only by the postgres component (`additionalRoles`), and only its name
  # and the Secret that holds its password live here.
  datastoreRead:
    user: ckan_datastore_read
    secret:
      name: db-ckan-datastore-read
      key: password

secrets:
  # CKAN's `SECRET_KEY` and the site administrator, both generated by the secrets component
  # and referenced by name; nothing here carries a value. The Secret is still called
  # `ckan-session` because renaming it would generate a new one and log everyone out; what it
  # holds is the single key CKAN signs the session cookie, the CSRF token and every API token
  # with. `beaker.session.secret` is that option's own legacy name in CKAN 2.11, not a second
  # secret.
  session:
    name: ckan-session
    key: secret
  admin:
    name: ckan-admin-credentials
    userKey: username
    passwordKey: password
    emailKey: email

# The API token the publisher uses (T-0493): minted by the site administrator into this Secret,
# key `token`, the reference a CkanInstance's `apiTokenRef` names. A post-install and
# post-upgrade Job keeps it; a token that still authenticates is never replaced.
apiToken:
  enabled: true
  secret: ckan-api-token
  # The token's name in CKAN, so the administrator's token list says who holds it.
  name: jcctl

# Catalogue harvests (T-4151): a CronJob per source that copies one publisher's datasets from
# the national catalogue (NKOD) into a CKAN organization, corrected, with the API token above.
# Each source is the configuration `files/harvest-nkod.py` reads; a deployment that lists none
# renders nothing. A source: `{name, sparql, publisher, publisherName, organization, namePrefix,
# allowedHosts: [], rewriteHosts: {}, skip: {<title>: {state, reason}}, requireColumn: {<title>: <column>}}`.
# `kind: hub` (T-4152, `files/harvest-hub.py`) reads an ArcGIS Hub instead: `{name, kind, hub,
# allowedHosts, organization, publisherName, publisherUri, publisherDescription,
# skip: {<item id>: <reason>}, titles: {<item id>: <title>}, spelling: {<wrong>: <right>}}`.
harvest:
  schedule: '23 3 * * *'
  sources: []
  # The public base of the platform's Endpoints, such as https://dev.joinedcontext.com: each
  # converted dataset (files/od-datasets.json) gains its standard APIs as distributions (T-4279).
  # Empty: none.
  gateway: ''

# The block of Deployment/12. Every template below reads it and nothing else, which is what
# makes the theme reusable by a second installation without a file change (OPS-47).
branding: {}

# A badge and words per CKAN organization name, for a publisher that set no picture or
# description in CKAN itself: `{<name>: {initials, colour: "#rrggbb", description: {en, sk}}}`.
organizations: {}

# The packages the publish gate hides (T-4318): `{<package name>: <the check that failed>}`, from
# joinedcontext-conformance tests/assistant/publish_gate.py. Left out of search, listings and the
# DCAT feed, and a 404 on their page, for everyone but a sysadmin; nothing is deleted.
hidden: {}

# The knowledge assistant's widget page every catalogue page offers (AG-114); empty for none.
assistantWidget: ''
# A CKAN organization's own assistant widget, by organization name (T-4281); a dataset page of
# an organization not listed frames `assistantWidget`.
assistantWidgets: {}
# The basemap of the dataset map (T-4639): `style`, a MapLibre style on https://tiles.{domain}
# (T-4638), or `tiles: https://tile.openstreetmap.org/{z}/{x}/{y}.png` under OpenStreetMap's
# tile usage policy. Empty draws the data on a plain background.
mapBasemap: {}

podSecurityContext: {}
securityContext: {}
serviceMesh:
  enabled: false

# The chart renderer's origin, https://viz.{domain} (T-4641): the one origin CKAN's action API
# answers CORS for, so the renderer reads a published `jc_visualization` view. Empty: none.
vizOrigin: ''
