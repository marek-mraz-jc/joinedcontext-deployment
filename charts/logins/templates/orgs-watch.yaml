{{- with .Values.orgsWatch }}{{ if .enabled }}
{{- $ns := $.Release.Namespace }}
# kubectl calls of watch.py: logs deploy/jc --all-pods (get deployments, list pods, get pods/log),
# get configmap jc, and in the Prometheus namespace get pod -l + exec prometheus-prometheus-0
# promtool. Read verbs only in this namespace, no Secret, no exec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orgs-watch
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
# Its long-lived token for the kubeconfig on s1; the control plane fills it, Git never holds it.
apiVersion: v1
kind: Secret
metadata:
  name: orgs-watch-token
  namespace: {{ $ns }}
  annotations:
    kubernetes.io/service-account.name: orgs-watch
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orgs-watch
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ .configMap | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [services, endpoints]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orgs-watch
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orgs-watch
subjects:
  - kind: ServiceAccount
    name: orgs-watch
    namespace: {{ $ns }}
{{- if .prometheusNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orgs-watch-{{ $ns }}
  namespace: {{ .prometheusNamespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    resourceNames: [{{ .prometheusPod | quote }}]
    # The pod is distroless (no shell): exec runs its own binaries (promtool) under its
    # ServiceAccount, which reads endpoints, nodes, pods, services and ingresses, no Secret.
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orgs-watch-{{ $ns }}
  namespace: {{ .prometheusNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orgs-watch-{{ $ns }}
subjects:
  - kind: ServiceAccount
    name: orgs-watch
    namespace: {{ $ns }}
{{- end }}
{{- end }}{{ end }}
