{{- with .Values.prodPromote }}{{ if .enabled }}
{{- $ns := $.Release.Namespace }}
# What a helmfile sync of the jc component's releases writes in this namespace (Deployments,
# Services, ServiceAccounts, the ConfigMap, the PVC, linkerd Servers and policies, helm's release
# Secrets) and the Jobs and Pods it waits on. No Role or RoleBinding (no grant it could widen),
# no PVC delete, nothing cluster-scoped.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-promote
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: prod-promote-token
  namespace: {{ $ns }}
  annotations:
    kubernetes.io/service-account.name: prod-promote
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prod-promote
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [pods/log, events, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy.linkerd.io]
    resources: [servers, authorizationpolicies, meshtlsauthentications]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prod-promote
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prod-promote
subjects:
  - kind: ServiceAccount
    name: prod-promote
    namespace: {{ $ns }}
{{- if .readNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prod-promote-{{ $ns }}
  namespace: {{ .readNamespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prod-promote-{{ $ns }}
  namespace: {{ .readNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prod-promote-{{ $ns }}
subjects:
  - kind: ServiceAccount
    name: prod-promote
    namespace: {{ $ns }}
{{- end }}
{{- end }}{{ end }}
