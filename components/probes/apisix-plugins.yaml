---
status-page:
  name: status-page
  description: Status page headers and rate limiting
  plugins:
    request-id:
      include_in_response: true
    # Every route clears the headers the platform trusts internally, not only the
    # authenticated ones (T-0026): a client that can set them can claim a tenant or an
    # identity. X-Forwarded-For stays — nginx maintains it and the rate limit keys on it.
    # Each name is cleared twice, hyphenated and with underscores (T-1672): the http block
    # runs with `underscores_in_headers on`, so `X_Userinfo` survives to the upstream as a
    # header of its own, and a WSGI or CGI upstream folds it onto the same name the
    # hyphenated spelling has. The Lua is identical on every route and a test holds it so.
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
            for name in pairs(ngx.req.get_headers(0)) do
              local key = name:lower():gsub("_", "-")
              for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                if key:sub(1, #prefix) == prefix then
                  ngx.req.clear_header(name)
                end
              end
            end
          end
    # Static class (T-4717): one page and its stylesheet a minute per open tab, the same answer for
    # everyone; many people behind one CGNAT address read it during an outage.
    limit-count:
      count: 3000
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    proxy-rewrite:
      headers:
        set:
          X-Forwarded-Proto: https
          X-Forwarded-Port: '443'
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          Referrer-Policy: "strict-origin-when-cross-origin"
    # OPS-34: the upstream owns the Content Security Policy (the Portal's, each App's, AP-12,
    # AP-122), so the edge sets none over it and adds this baseline only to an answer that
    # carries none, its own refusals included. `frame-ancestors` says what X-Frame-Options
    # says. It runs after `response-rewrite`, whose `add` of an App's frame-ancestors counts.
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
            end
          end
