---
# Re-pin a digest with:
#   T=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/python:pull" | jq -r .token)
#   curl -sI -H "Authorization: Bearer $T" \
#     -H 'Accept: application/vnd.oci.image.index.v1+json' \
#     https://registry-1.docker.io/v2/library/python/manifests/<tag> | grep -i docker-content-digest
probes:
  probe:
    # The Python project's official slim image: files/probe.py needs the standard library only.
    repository: 'docker.io/library/python'
    tag: '3.13.16-slim-trixie'
    digest: 'sha256:cf50a4f6ac4f026458b08d5222023d700ac806410dff5e9ca8728fa44f2b850f'
