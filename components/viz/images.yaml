    # cosign-signed by image-viz.yml at deployment f6ec587b (pcre2 past CVE-2026-103111).
    server:
      repository: 'ghcr.io/marek-mraz-jc/joinedcontext-viz'
      tag: '1.30.4'
      digest: 'sha256:713eed847d2e3b29251a985625914e5db82eb65a3828066b9e0e6c1ffddddb15'
