    # cosign-signed by image-viz.yml at deployment d9646520 (T-5082: the catalogue explorer on the Portal's Endpoint data view).
    server:
      repository: 'ghcr.io/marek-mraz-jc/joinedcontext-viz'
      tag: '1.30.4'
      digest: 'sha256:c32db8fb741e0e7df68a509e6e389615b70247a747dc3392bad4084df149b18c'
