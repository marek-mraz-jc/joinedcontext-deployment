---
# Re-pin a digest with (the manifest list, so every architecture keeps its image):
#   curl -s "https://hub.docker.com/v2/repositories/<repo>/tags/<tag>" | jq -r .digest
viz:
  renderer:
    # Static files only, as uid 101, writing /tmp and its cache: the image basemap serves with.
    server:
      repository: 'docker.io/nginxinc/nginx-unprivileged'
      tag: '1.30.4-alpine-slim'
      digest: 'sha256:7bbe8940bc478e5618e6d4cfbeda406e5b4217cacc06faacd665aca5e468595e'
