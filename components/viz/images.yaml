---
# Re-pin a digest with (the manifest list, so every architecture keeps its image):
#   curl -s "https://hub.docker.com/v2/repositories/<repo>/tags/<tag>" | jq -r .digest
viz:
  renderer:
    # Static files only, as uid 101, writing /tmp and its cache. The image is the pinned nginx
    # plus the vendored Vega, MapLibre and PMTiles builds (`images/viz/`, T-4657), built and
    # cosign-signed by image-viz.yml at deployment fbabf207 (T-6313 at 575f76dd and T-6319 at fbabf207:
    # unified entity grid explorer bundle with the data toolbar; T-5376 at e58c63c0: nginx-unprivileged 1.30.6 base; T-5231 at ccff991d: centred citizen row card, cancellable default filter;
    # T-5192/T-5196 at 6f9117b9: model-driven columns, page length, numbered pager;
    # T-5082 explorer before it, d9646520).
    server:
      repository: 'ghcr.io/marek-mraz-jc/joinedcontext-viz'
      tag: '1.30.6'
      digest: 'sha256:f1e11c054e59a84dcd97163aff8aec547baf3b1ec29055cd68ee4b9253412bcb'
