# T-4641: the visualization renderer on viz.{domain} (ADR-N-053 §2.5). Static files only: the
# host page reads the published CKAN view and the Endpoint's rows, the renderer frame draws them
# sandboxed and may connect nowhere. No cookie is set or read on this host.
server {
    listen 8080;
    server_tokens off;
    root /srv/site;
    autoindex off;
    charset utf-8;
    # T-4711: the vendor scripts and styles leave compressed (vega 515 kB was sent raw to phones).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/javascript application/javascript text/css application/json image/svg+xml;
    location ~ /\. { return 404; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control "no-cache" always;
    # Everything that is not one of the two pages: nothing it could run or frame.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # The host page: any site may frame it (the "Embed on a website" snippet), because the page
    # holds no secret; it reads CKAN and the API and frames the renderer, nothing else.
    location = / {
        limit_except GET { deny all; }
        try_files /index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src https://__HOST__; style-src https://__HOST__; img-src https://__HOST__ data:; connect-src https://api.__DOMAIN__ https://opendata.__DOMAIN__; frame-src https://__HOST__; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
    }

    # The renderer: no connection at all. Styles may be inline because vega-embed writes its menu
    # and tooltip styles at run time; a style runs no script. `frame-ancestors` names every
    # ancestor, the site that embeds the host page too, so it cannot be narrower than the host
    # page's; the renderer takes its one message only from a parent on this host (render.js).
    location = /render.html {
        limit_except GET { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src https://__HOST__; style-src https://__HOST__ 'unsafe-inline'; img-src https://__HOST__ data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
    }

    # The map page (ADR-N-053 §2.9, T-4657): MapLibre on our basemap. A map spec holds no
    # expression, so the page runs in this origin, which the tiles answer CORS for; it connects to
    # the tiles alone, and its workers are MapLibre's own module (or a blob MapLibre makes of it).
    location = /map.html {
        limit_except GET { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src https://__HOST__; style-src https://__HOST__ 'unsafe-inline'; img-src https://__HOST__ https://tiles.__DOMAIN__ data: blob:; connect-src https://tiles.__DOMAIN__; worker-src blob: https://__HOST__; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
    }

    # The live explorer (T-5059): one public Endpoint's entities as a table, filters and a map, read
    # anonymously from api.{domain}; nothing is copied. Only the catalogue may frame it.
    location = /explore.html {
        limit_except GET { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src https://__HOST__; style-src https://__HOST__ 'unsafe-inline'; img-src https://__HOST__ https://tiles.__DOMAIN__ data: blob:; connect-src https://api.__DOMAIN__ https://tiles.__DOMAIN__; worker-src blob: https://__HOST__; base-uri 'none'; form-action 'none'; frame-ancestors https://opendata.__DOMAIN__" always;
    }

    # The explorer on any site (T-5129): the same page as /explore.html, framed by the snippet of its
    # Embed dialog. It holds no secret and acts on nothing (anonymous reads, no cookie), so any site may
    # frame it; it also reads the dataset's title and licence from the catalogue for its source line.
    location = /embed.html {
        limit_except GET { deny all; }
        try_files /explore.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src https://__HOST__; style-src https://__HOST__ 'unsafe-inline'; img-src https://__HOST__ https://tiles.__DOMAIN__ data: blob:; connect-src https://api.__DOMAIN__ https://tiles.__DOMAIN__ https://opendata.__DOMAIN__; worker-src blob: https://__HOST__; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
    }

    location = /index.html { return 404; }

    location / {
        limit_except GET { deny all; }
    }

    # The pinned releases, baked into the image (images/viz/vendor/SHA256SUMS). A new release is a new file name in the next
    # commit, so a file never changes under its name and is cached for a year (T-4711). MapLibre's modules exist only as .gz: nginx sends them as
    # they are, and unpacks them for the rare client that takes no gzip.
    location /vendor/ {
        alias /srv/vendor/;
        limit_except GET { deny all; }
        gzip_static always;
        gunzip on;
        types {
            text/javascript js mjs;
            text/css css;
        }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # The Portal's Endpoint data view built as one script (T-5082, images/viz/explorer/SHA256SUMS
    # names the Portal commit). Its names are fixed, so it is revalidated rather than cached for a year.
    location /explorer/ {
        alias /srv/explorer/;
        limit_except GET { deny all; }
        types {
            text/javascript js;
            text/css css;
        }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }
}
