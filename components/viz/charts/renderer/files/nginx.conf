# T-4641: the visualization renderer on viz.{domain} (ADR-N-053 §2.5). Static files only: the
# host page reads the published CKAN view and the Endpoint's rows, the renderer frame draws them
# sandboxed and may connect nowhere. No cookie is set or read on this host.
server {
    listen 8080;
    server_tokens off;
    root /srv/site;
    autoindex off;
    charset utf-8;
    location ~ /\. { return 404; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control "no-cache" always;
    # Everything that is not one of the two pages: nothing it could run or frame.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # The host page: any site may frame it (the "Embed on a website" snippet), because the page
    # holds no secret; it reads CKAN and the API and frames the renderer, nothing else.
    location = / {
        limit_except GET { deny all; }
        try_files /index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src https://__HOST__; style-src https://__HOST__; img-src https://__HOST__ data:; connect-src https://api.__DOMAIN__ https://data.__DOMAIN__; frame-src https://__HOST__; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
    }

    # The renderer: no connection at all. Styles may be inline because vega-embed writes its menu
    # and tooltip styles at run time; a style runs no script. `frame-ancestors` names every
    # ancestor, the site that embeds the host page too, so it cannot be narrower than the host
    # page's; the renderer takes its one message only from a parent on this host (render.js).
    location = /render.html {
        limit_except GET { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src https://__HOST__; style-src https://__HOST__ 'unsafe-inline'; img-src https://__HOST__ data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors *" always;
    }

    location = /index.html { return 404; }

    location / {
        limit_except GET { deny all; }
    }

    # The pinned Vega releases (files/vendor/SHA256SUMS). A new release is a new file name in
    # the next commit, so a day's cache is safe.
    location /vendor/ {
        alias /srv/vendor/;
        limit_except GET { deny all; }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }
}
