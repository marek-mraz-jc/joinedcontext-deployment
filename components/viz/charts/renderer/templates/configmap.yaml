{{- if not .Values.host }}{{ fail "viz: host is required" }}{{ end }}
{{- if not .Values.domain }}{{ fail "viz: domain is required" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "renderer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "renderer.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- .Files.Get "files/nginx.conf" | replace "__HOST__" .Values.host | replace "__DOMAIN__" .Values.domain | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "renderer.fullname" . }}-site
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "renderer.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/site/*" }}
  {{ base $path }}: {{ $.Files.Get $path | quote }}
  {{- end }}
---
# The pinned Vega builds, verbatim (files/vendor/SHA256SUMS), one ConfigMap each: Vega alone is
# half a megabyte and a ConfigMap holds one.
{{- range $path, $_ := .Files.Glob "files/vendor/*.min.js" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "renderer.fullname" $ }}-{{ base $path | trimSuffix ".min.js" | replace "." "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "renderer.labels" $ | nindent 4 }}
data:
  {{ base $path }}: {{ $.Files.Get $path | quote }}
---
{{- end }}
