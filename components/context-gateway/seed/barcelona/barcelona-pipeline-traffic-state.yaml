# The traffic state of each street section into the space barcelona every five minutes, the
# source's own period (T-5262): one TrafficFlowObserved per section with its line.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: traffic-state
  namespace: barcelona
  title:
    ca: Estat del trànsit per trams, cada 5 minuts
    es: Estado del tráfico por tramos, cada 5 minutos
    en: Traffic state by street section, every 5 min
spec:
  class: auto
  period: 300s
  source:
    dataSourceRef: { kind: DataSource, name: bcn-traffic-state }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:barcelona:barcelona
  output: { type: TrafficFlowObserved, mode: upsert }
  quotas: { maxMemoryMb: 64, cpuMillicores: 50 }
