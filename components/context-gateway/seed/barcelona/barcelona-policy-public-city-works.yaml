apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-city-works
  namespace: barcelona
  title:
    ca: Lectura pública de les obres
    es: Lectura pública de las obras
    en: Public read of city works
spec:
  contextSpaceRef: { kind: ContextSpace, name: barcelona }
  assigner: did:web:barcelona.cat
  assignee: { kind: role, id: public }
  # The slice the Endpoint city-works publishes, read only, with the discovery a client needs first
  # (T-4258, EP-116). The space keeps no history of this type, so no temporal operation.
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: CityWork
