apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-places
  namespace: barcelona
  title:
    ca: 'Lectura pública: equipaments'
    es: 'Lectura pública: equipamientos'
    en: 'Public read: facilities'
spec:
  contextSpaceRef: { kind: ContextSpace, name: barcelona }
  assigner: did:web:barcelona.cat
  assignee: { kind: role, id: public }
  # Read only, the register's facilities: open data under CC BY 4.0, nothing about a person (the
  # telephone is the facility's public line; associations are not read). Discovery beside the
  # reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: PointOfInterest
