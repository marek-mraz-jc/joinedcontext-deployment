# The Ajuntament de Barcelona's three activity agendas (Open Data BCN, CC BY 4.0, updated daily):
# agenda-diaria, agenda-cultural and agenda-activitats-esportives. Their downloadable files are
# UTF-16 and up to 200 MB; the portal's DataStore answers one SQL query over all three in UTF-8,
# one row per activity (its main address first, the sports agenda's row first), only those not
# ended before yesterday: about 7,700 rows, 2.9 MB, 1.3 s on 2026-10-22. No credential. T-5265.
# The query, decoded:
#   SELECT DISTINCT ON (id) ... FROM (<the same columns of each resource> UNION ALL ...) t
#   WHERE end_date IS NULL OR end_date >= now() - interval '1 day'
#   ORDER BY id, main = 'True' DESC, src = 'agenda-activitats-esportives' DESC, phone IS NULL
# Resources: agenda-diaria 877ccf66-9106-4ae2-be51-95a9f6469e4c, agenda-cultural
# 3abb2414-1ee0-446e-9c25-380e938adb73, agenda-activitats-esportives
# ab2d47b7-8493-4ed5-9f63-49ed116135f9.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: bcn-agenda
  namespace: barcelona
  title:
    ca: Agendes d'activitats de Barcelona (Open Data BCN)
    es: Agendas de actividades de Barcelona (Open Data BCN)
    en: Barcelona activity agendas (Open Data BCN)
spec:
