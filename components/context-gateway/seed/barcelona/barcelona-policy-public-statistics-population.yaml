# Public read of the population statistics (T-5266): the indicators whose id carries the
# theme `population`, current and history: all ten years the space keeps, one row per published period.
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-statistics-population
  namespace: barcelona
  title:
    ca: 'Lectura pública: estadístiques, població'
    es: 'Lectura pública: estadísticas, población'
    en: 'Public read: population statistics'
spec:
  contextSpaceRef: { kind: ContextSpace, name: barcelona }
  assigner: did:web:barcelona.cat
  assignee: { kind: role, id: public }
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
    - queryTemporal
    - retrieveTemporal
  temporalQ: timerel=after;timeAt=P-3650D
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:barcelona:stat-population-[A-Za-z0-9._-]+$
