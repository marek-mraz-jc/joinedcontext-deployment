apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-weather-forecast
  namespace: barcelona
  title:
    ca: Lectura pública de la predicció meteorològica del Barcelonès
    es: Lectura pública de la predicción meteorológica del Barcelonès
    en: Public read of the Barcelonès weather forecast
spec:
  contextSpaceRef: { kind: ContextSpace, name: barcelona }
  assigner: did:web:barcelona.cat
  assignee: { kind: role, id: public }
  # The slice the Endpoint weather-forecast publishes: the forecast days, read only, with
  # the discovery a client needs first (T-4258, EP-116) and the history the space keeps (T-4372).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
    - queryTemporal
    - retrieveTemporal
  temporalQ: timerel=after;timeAt=P-30D
  information:
    - entities:
        - type: WeatherForecast
