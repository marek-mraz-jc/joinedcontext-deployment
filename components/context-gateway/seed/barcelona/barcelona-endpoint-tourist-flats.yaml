    ca: Habitatges d'ús turístic de Barcelona
    es: Viviendas de uso turístico de Barcelona
    en: Barcelona licensed tourist flats
  description:
    ca: Els habitatges d'ús turístic amb llicència a Barcelona, amb les places, el número del Registre de Turisme de Catalunya i l'edifici on són (carrer, número, districte i barri), sense pis ni porta.
    es: Las viviendas de uso turístico con licencia en Barcelona, con sus plazas, el número del Registro de Turismo de Cataluña y el edificio donde están (calle, número, distrito y barrio), sin piso ni puerta.
    en: The licensed tourist flats in Barcelona with their places, their Catalan tourism register number and the building they are in (street, number, district and barri), without floor or door.
spec:
  contextSpaceRef: barcelona
  slug: h2mmrhmbg659m2wjwcegftzpdpd0jepk
