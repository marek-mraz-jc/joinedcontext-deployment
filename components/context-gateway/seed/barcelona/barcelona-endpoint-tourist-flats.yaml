# Barcelona's licensed tourist flats in the city's CKAN organisation: TouristRental at building
# level as NGSI-LD, CSV, GeoJSON by OGC API Features, OData and MCP, refreshed weekly (T-5417).
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
