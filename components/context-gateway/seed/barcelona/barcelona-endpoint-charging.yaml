# One Smart Data Model type per catalogue dataset (T-4344): the public charging points of Endolla
# Barcelona, read through their own Policy, which narrows the space's public read to them.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: barcelona-charging
  namespace: barcelona
  title:
    ca: Punts de recàrrega de vehicles elèctrics — Barcelona
    es: Puntos de recarga de vehículos eléctricos — Barcelona
    en: EV charging points — Barcelona
  description:
    ca: 'Cada punt de recàrrega públic de la xarxa Endolla Barcelona amb els seus connectors i els que estan lliures ara, actualitzat cada 5 minuts. Font: Ajuntament de Barcelona (B:SM), Open Data BCN, CC BY 4.0.'
    es: 'Cada punto de recarga público de la red Endolla Barcelona con sus conectores y los que están libres ahora, actualizado cada 5 minutos. Fuente: Ayuntamiento de Barcelona (B:SM), Open Data BCN, CC BY 4.0.'
    en: 'Each public charging point of the Endolla Barcelona network with its sockets and how many are free now, every 5 minutes. Source: Barcelona City Council (B:SM), Open Data BCN, CC BY 4.0.'
spec:
  contextSpaceRef: barcelona
  slug: hptanmkb42cdhkwvjminrm7mn4ejx4ah
  audience: public
  policyRef: urn:ngsi-ld:Policy:barcelona.cat:barcelona:public-charging
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: barcelona }
      license: cc-by
  catalog:
    publisher:
      name:
        ca: Ajuntament de Barcelona
        es: Ayuntamiento de Barcelona
        en: Barcelona City Council
      uri: http://datos.gob.es/recurso/sector-publico/org/Organismo/L01080193
    license: CC_BY_4_0
    attribution:
      ca: 'Font: Ajuntament de Barcelona, Open Data BCN, CC BY 4.0'
      es: 'Fuente: Ayuntamiento de Barcelona, Open Data BCN, CC BY 4.0'
      en: 'Source: Barcelona City Council (Ajuntament de Barcelona), Open Data BCN, CC BY 4.0'
    themes: [TRAN, ENER]
    keywords:
      ca: [recàrrega, vehicle elèctric, Endolla]
      es: [recarga, vehículo eléctrico, Endolla]
      en: [charging, electric vehicle, Endolla]
    spatial:
      - ES511
      - https://sws.geonames.org/3128760/
    frequency: CONT
    source:
      - url: https://opendata-ajuntament.barcelona.cat/data/ca/dataset/informacio-punts-recarrega-electric
        title:
          ca: Informació dels punts de recàrrega elèctrica
          en: EV charging point information
        description:
          ca: Un fitxer JSON amb cada punt, els seus connectors i l'estat de cada connector.
          en: One JSON file with each point, its ports and each port's state.
      - url: https://opendata-ajuntament.barcelona.cat/data/ca/dataset/estat-ports-recarrega-electric
        title: { ca: Estat dels connectors de recàrrega elèctrica, en: EV charging port states }
        description:
          ca: Els mateixos estats dels connectors, sense la resta de dades del punt.
          en: The same port states, without the rest of the point's data.
    pipelineRef: { kind: Pipeline, name: ev-charging }
    # Declared charts replace the automatic ones (T-5432): capacity and socketNumber describe the
    # station and have no observedAt, so their history charts stayed empty.
    visualizations:
      - name: auto-evchargingstation-availablecapacity
        title: { ca: Connectors lliures, sk: Voľné konektory, en: Free connectors }
        description:
          sk: Hodnoty za posledných 7 dní, jedna čiara na stanicu.
          en: The values of the last 7 days, one line per station.
        data:
          source: temporal
          type: EVChargingStation
          attrs: [availableCapacity]
          last: P7D
        spec:
          $schema: https://vega.github.io/schema/vega-lite/v5.json
          data: { name: source }
          mark: { type: line, point: true }
          encoding:
            x: { field: observedAt, type: temporal, title: null }
            'y':
              field: availableCapacity
              type: quantitative
              scale: { zero: false }
            color: { field: name, type: nominal, title: null }
            tooltip:
              - field: observedAt
                type: temporal
              - field: availableCapacity
                type: quantitative
                format: ',d'
              - field: name
                type: nominal
