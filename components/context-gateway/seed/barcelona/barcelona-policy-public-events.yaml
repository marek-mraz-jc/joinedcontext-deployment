apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-events
  namespace: barcelona
  title:
    ca: 'Lectura pública: activitats'
    es: 'Lectura pública: actividades'
    en: 'Public read: events'
spec:
  contextSpaceRef: { kind: ContextSpace, name: barcelona }
  assigner: did:web:barcelona.cat
  assignee: { kind: role, id: public }
  # Read only, the agendas' Events: open data under CC BY 4.0, nothing about a person (the
  # telephone is the venue's public line). Discovery beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: Event
