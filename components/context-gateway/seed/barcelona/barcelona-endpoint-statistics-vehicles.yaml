# Barcelona statistics, vehicle register (T-5266): the KeyPerformanceIndicator entities of the
# statistics pipeline whose id carries the theme `vehicles`, one per indicator and area, the newest
# period as the value and every period since the first run in the history.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: statistics-vehicles
  namespace: barcelona
  title:
    ca: Parc de vehicles — estadístiques de Barcelona
    es: Parque de vehículos — estadísticas de Barcelona
    en: Vehicle register — Barcelona statistics
  description:
    ca: 'Vehicles del padró municipal de vehicles per barri, districte i ciutat: total, tipologia, tipus de propulsió, servei i tipus de propietari, de cada any. Un KeyPerformanceIndicator dels Smart Data Models per indicador i àrea. Font: Ajuntament de Barcelona, Open Data BCN, CC BY 4.0.'
    es: 'Vehículos del padrón municipal de vehículos por barrio, distrito y ciudad: total, tipología, tipo de propulsión, servicio y tipo de propietario, de cada año. Un KeyPerformanceIndicator de los Smart Data Models por indicador y área. Fuente: Ayuntamiento de Barcelona, Open Data BCN, CC BY 4.0.'
    en: "Vehicles of the municipal vehicle register by barri, district and city: total, kind, propulsion, service and owner type, each year. One Smart Data Models KeyPerformanceIndicator per indicator and area, the newest period as kpiValue and the earlier periods in its history. Properties beyond the model: districtCode (the city's two-digit code of the district or barri), divisionLevel (city, district or neighbourhood), refArea (the AdministrativeArea), statisticsTable and dimensionKey (the source dataset and breakdown). Source: Barcelona City Council (Ajuntament de Barcelona), Open Data BCN, CC BY 4.0."
spec:
  contextSpaceRef: barcelona
  slug: woeeq72unms2u2howqku7h8atywvjgid
  audience: public
  policyRef: urn:ngsi-ld:Policy:barcelona.cat:barcelona:public-statistics-vehicles
  # The NGSI-LD door also answers the temporal API, the series per indicator. An indicator has
  # no geometry of its own: OGC API Features serves it as a feature without one.
  enabledRepresentations: [ngsi-ld, csv, mcp, websocket, ogc-features, odata]
