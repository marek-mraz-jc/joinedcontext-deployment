# Barcelona statistics, housing and households (T-5266): the KeyPerformanceIndicator entities of the
# statistics pipeline whose id carries the theme `housing`, one per indicator and area, the newest
# period as the value and every period since the first run in the history.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: statistics-housing
  namespace: barcelona
  title:
    ca: Habitatge i llars — estadístiques de Barcelona
    es: Vivienda y hogares — estadísticas de Barcelona
    en: Housing and households — Barcelona statistics
  description:
    ca: "Domicilis per nombre de persones i per estructura segons el Padró; habitatges del cadastre per superfície i any de construcció i finques per règim de propietat a 1 de gener; compravendes d'immobles i la seva superfície per tipus d'ús segons els registres notarials de cada mes. Per barri, districte i ciutat. Un KeyPerformanceIndicator dels Smart Data Models per indicador i àrea. Font: Ajuntament de Barcelona, Open Data BCN, CC BY 4.0."
    es: 'Domicilios por número de personas y por estructura según el Padrón; viviendas del catastro por superficie y año de construcción y fincas por régimen de propiedad a 1 de enero; compraventas de inmuebles y su superficie por tipo de uso según los registros notariales de cada mes. Por barrio, distrito y ciudad. Un KeyPerformanceIndicator de los Smart Data Models por indicador y área. Fuente: Ayuntamiento de Barcelona, Open Data BCN, CC BY 4.0.'
    en: "Households by size and structure from the Padró; cadastral dwellings by floor area and year of construction and estates by ownership regime on 1 January; property sales and their floor area by use from the notaries' records of each month. By barri, district and city. One Smart Data Models KeyPerformanceIndicator per indicator and area, the newest period as kpiValue and the earlier periods in its history. Properties beyond the model: districtCode (the city's two-digit code of the district or barri), divisionLevel (city, district or neighbourhood), refArea (the AdministrativeArea), statisticsTable and dimensionKey (the source dataset and breakdown). Source: Barcelona City Council (Ajuntament de Barcelona), Open Data BCN, CC BY 4.0."
