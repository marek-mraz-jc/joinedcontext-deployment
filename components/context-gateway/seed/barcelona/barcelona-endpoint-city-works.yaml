# The works on Barcelona's public space in the city's CKAN organisation: CityWork as NGSI-LD,
# CSV, GeoJSON by OGC API Features, OData and MCP, refreshed daily (T-5264, EP-118).
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: city-works
  namespace: barcelona
  title:
    ca: Obres a l'espai públic de Barcelona
    es: Obras en el espacio público de Barcelona
    en: Works on Barcelona's public space
  description:
    ca: Les obres en execució o aturades a l'espai públic de Barcelona, i les acabades fa menys de 30 dies, amb el seu àmbit, les dates, el promotor i el pressupost.
    es: Las obras en ejecución o paradas en el espacio público de Barcelona, y las acabadas hace menos de 30 días, con su ámbito, las fechas, el promotor y el presupuesto.
    en: The works in execution or stopped on Barcelona's public space, and those finished within 30 days, with their outline, dates, promoter and budget.
spec:
  contextSpaceRef: barcelona
  slug: nrejx2f5acew32ryrnslxvo23s3xmsxd
  audience: public
  # The one Policy this endpoint evaluates: the slice of the space it publishes (EP-14).
  policyRef: urn:ngsi-ld:Policy:barcelona.cat:barcelona:public-city-works
  enabledRepresentations: [ngsi-ld, csv, mcp, websocket, ogc-features, odata]
  catalog:
    # Off the catalogue (T-5788, owner order 2026-10-26: an empty dataset leaves it): on 2026-10-26
    # prod held 0 CityWork (dev 14): its prod runs write nothing.
    # The harvest feeds leave it out (EP-139); publish it again once prod holds data.
    harvest: false
    publisher:
      name:
        ca: Ajuntament de Barcelona
        es: Ayuntamiento de Barcelona
        en: Barcelona City Council
      uri: http://datos.gob.es/recurso/sector-publico/org/Organismo/L01080193
    license: CC_BY_4_0
    attribution:
      ca: 'Font: Ajuntament de Barcelona, Open Data BCN, CC BY 4.0'
      es: 'Fuente: Ayuntamiento de Barcelona, Open Data BCN, CC BY 4.0'
      en: 'Source: Barcelona City Council (Ajuntament de Barcelona), Open Data BCN, CC BY 4.0'
    themes: [TRAN, GOVE]
    keywords:
      ca: [obres, via pública, mobilitat]
      es: [obras, vía pública, movilidad]
      en: [road works, public space, mobility]
    spatial:
      - ES511
      - https://sws.geonames.org/3128760/
    frequency: DAILY
    source:
      - url: https://opendata-ajuntament.barcelona.cat/data/dataset/obres
        title:
          ca: Obres a l'espai públic (Open Data BCN)
          en: Works on the public space (Open Data BCN)
        description:
          ca: Obres de la ciutat amb el seu àmbit, dates, estat i promotor, CC BY 4.0.
          en: The city's works with their outline, dates, state and promoter, CC BY 4.0.
    pipelineRef: { kind: Pipeline, name: city-works }
