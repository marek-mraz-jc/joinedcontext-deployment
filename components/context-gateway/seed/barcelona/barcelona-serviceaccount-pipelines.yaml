apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipelines
  namespace: barcelona
  title:
    ca: Canals d'ingesta de Barcelona
    es: Canales de ingesta de Barcelona
    en: Barcelona ingestion pipelines
spec:
  owner: { user: de300000-0000-4000-8000-000000000006 } # demo.barcelona
  purpose: The Bento streams of the barcelona project write the Open Data BCN datasets into the space barcelona, through its Endpoint and the pipelines-write Policy
  roles:
    - role: space-writer
      scope: { contextSpace: barcelona }
  credentials:
    - kind: oauth-client
      name: main
