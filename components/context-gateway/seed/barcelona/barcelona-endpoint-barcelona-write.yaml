# The write door of barcelona (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes barcelona served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint barcelona.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: barcelona-write
  namespace: barcelona
  title: { sk: 'Barcelona, open data: zápis', en: 'Barcelona, open data: writes' }
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint barcelona.
    en: The internal door the data is written through; people read it through the public Endpoint barcelona.
spec:
  contextSpaceRef: barcelona
