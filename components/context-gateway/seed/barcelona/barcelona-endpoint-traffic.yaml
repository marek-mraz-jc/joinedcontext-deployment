# One Smart Data Model type per catalogue dataset (T-4344): the traffic state of Barcelona's
# street sections, read through its own Policy, which narrows the space's public read to it.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: barcelona-traffic
  namespace: barcelona
  title:
    ca: Estat del trànsit per trams — Barcelona
    es: Estado del tráfico por tramos — Barcelona
    en: Traffic state by street section — Barcelona
  description:
    ca: 'Estat del trànsit de cada tram viari de la ciutat ara i previst a 15 minuts, actualitzat cada 5 minuts, amb la línia del tram. Font: Ajuntament de Barcelona, Open Data BCN, CC BY 4.0.'
    es: 'Estado del tráfico de cada tramo viario de la ciudad ahora y previsto a 15 minutos, actualizado cada 5 minutos, con la línea del tramo. Fuente: Ayuntamiento de Barcelona, Open Data BCN, CC BY 4.0.'
    en: "The traffic state of each street section of the city now and forecast for 15 minutes, every 5 minutes, with the section's line. Source: Barcelona City Council, Open Data BCN, CC BY 4.0."
spec:
  contextSpaceRef: barcelona
  slug: 73jd7qdgjysvov6xfhwpmnwgwomjg4fi
  audience: public
  policyRef: urn:ngsi-ld:Policy:barcelona.cat:barcelona:public-traffic
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: barcelona }
      license: cc-by
      datastore: { representation: csv, refresh: onReconcile }
  catalog:
    publisher:
      name:
        ca: Ajuntament de Barcelona
        es: Ayuntamiento de Barcelona
        en: Barcelona City Council
      uri: http://datos.gob.es/recurso/sector-publico/org/Organismo/L01080193
    license: CC_BY_4_0
    attribution:
      ca: 'Font: Ajuntament de Barcelona, Open Data BCN, CC BY 4.0'
      es: 'Fuente: Ayuntamiento de Barcelona, Open Data BCN, CC BY 4.0'
      en: 'Source: Barcelona City Council (Ajuntament de Barcelona), Open Data BCN, CC BY 4.0'
    themes: [TRAN]
    keywords:
      ca: [trànsit, estat del trànsit, trams, congestió]
      es: [tráfico, estado del tráfico, tramos, congestión]
      en: [traffic, traffic state, street sections, congestion]
    spatial:
      - ES511
      - https://sws.geonames.org/3128760/
    frequency: CONT
    source:
      - url: https://opendata-ajuntament.barcelona.cat/data/ca/dataset/trams
        title: { ca: Estat del trànsit per trams, en: Traffic state by section }
        description:
          ca: Fitxer d'estat de cada tram, cada 5 minuts.
          en: The state file of each section, every 5 minutes.
      - url: https://opendata-ajuntament.barcelona.cat/data/ca/dataset/transit-relacio-trams
        title: { ca: Relació de trams de la via pública, en: Street sections of the public road }
        description: { ca: La línia i el nom de cada tram., en: The line and name of each section. }
    pipelineRef: { kind: Pipeline, name: traffic-state }
