apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-accidents
  namespace: barcelona
  title:
    ca: Lectura pública dels accidents de trànsit
    es: Lectura pública de los accidentes de tráfico
    en: Public read of road accidents
spec:
  contextSpaceRef: { kind: ContextSpace, name: barcelona }
  assigner: did:web:barcelona.cat
  assignee: { kind: role, id: public }
  # The slice the Endpoint barcelona-accidents publishes, read only, with the discovery a client needs first
  # (T-4258, EP-116, T-5374). The space keeps no history of this type, so no temporal operation.
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: RoadAccident
