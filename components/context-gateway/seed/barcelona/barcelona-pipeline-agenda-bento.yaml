# The mapping of the agenda pipeline (T-5265): every current and upcoming activity of the
# Ajuntament's three agendas (agenda diària, agenda cultural, agenda d'activitats esportives) as
# a Smart Data Models Event. The bcn-agenda DataSource answers one Open Data BCN DataStore SQL
# query over the three resources, one row per activity (about 7,700 on 2026-10-22, 2.9 MB); the
# reconciler renders that poll in front and the endpoint upsert after (PL-39, PL-16). Past
# activities stay in the space; nothing here deletes.
pipeline:
  processors:
    # An answer over 16 MiB is not the agenda; an empty agenda is a broken source, not a quiet
    # city; an agenda whose newest change is older than three days (three of its daily updates)
    # is stale. Each fails the run visibly instead of writing nothing or old rows.
    - mapping: |
        let rows = this.result.records.or([])
        let newest = $rows.map_each(r -> r.modified.or("")).sort().index(-1).or("")
        let floor = now().ts_sub_iso8601("P3D").ts_format("2006-01-02T15:04:05", "Europe/Madrid")
        root = if content().length() > 16777216 {
          throw("the agenda answer is %d bytes, more than the 16 MiB read".format(content().length()))
        } else if this.success.or(false) != true {
          throw("Open Data BCN refused the agenda query: %s".format(this.error.format_json(no_indent: true).or("no reason given")))
        } else if $rows.length() == 0 {
          throw("the Barcelona agendas list no current activity: nothing is written")
        } else if $newest < $floor {
          throw("the Barcelona agendas are stale: the newest change is %s, more than three days old".format($newest))
        } else { $rows }

    # Plausibility (owner 2026-10-22T18:10Z): a row a map or a calendar cannot use is dropped and
    # counted by reason, never guessed at: no position; a point outside Barcelona and 1 km around
    # it (the agenda carries activities in neighbouring towns, and a few rows at 0,0 where the
    # city's projection had no point); a start day missing (the permanent collections) or before
    # 2000, or an end before the start; one activity listed twice under two ids (same name, same
    # place within 20 m, same start day).
    - mapping: |
        # Two rows are one place when their names match and they lie within 20 m (owner
        # 2026-10-22T18:10Z): rows sorted by name, each compared with the kept points of its name.
        map near {
          let lat = this.value.lat.number()
          let lon = this.value.lon.number()
          let pts = if this.tally.name == this.value._key { this.tally.pts } else { [] }
          # Metres at Barcelona's latitude: 111,320 m a degree north, 83,520 m a degree east.
          let near = $pts.any(p -> (p.index(0) - $lat) * (p.index(0) - $lat) * 12392142400 + (p.index(1) - $lon) * (p.index(1) - $lon) * 6975590400 <= 400)
          root = if $near { this.tally.assign({ "dup": this.tally.dup.append(this.value.id) }) } else {
            { "name": this.value._key, "pts": $pts.append([$lat, $lon]), "dup": this.tally.dup }
          }
        }
        map reason {
          let lat = this.lat.or("").number().catch(null)
          let lon = this.lon.or("").number().catch(null)
          let start = this.starts.or("")
          root = if $lat == null || $lon == null { "no position" }
            else if $lon < 2.04 || $lon > 2.24 || $lat < 41.3 || $lat > 41.48 { "outside Barcelona" }
            else if !$start.re_match("^(19|2[0-9])[0-9]{2}-[01][0-9]-[0-3][0-9]$") || $start < "2000" { "start day missing or before 2000" }
            else if this.ends.or(null) != null && this.ends < $start { "ends before it starts" }
            else if !this.id.or("").re_match("^[0-9]{1,20}$") { "no id" }
            else if this.name.or("").trim() == "" { "no name" }
            else { null }
        }
        let rows = this.map_each(e -> e.assign({ "_drop": e.apply("reason") }))
        let usable = $rows.filter(e -> e._drop == null).unique(e -> e.id)
        let keyed = $usable.map_each(e -> e.assign({ "_key": [e.name.trim().lowercase(), e.starts].format_json(no_indent: true) })).sort_by(e -> e._key)
        let dup = $keyed.fold({ "name": "", "pts": [], "dup": [] }, item -> item.apply("near")).dup
        let kept = $usable.filter(e -> !$dup.contains(e.id))
        let tally = $rows.filter(e -> e._drop != null).fold({}, item -> item.tally.assign({ item.value._drop: item.tally.get(item.value._drop).or(0) + 1 }))
        let dups = $rows.filter(e -> e._drop == null).length() - $kept.length()
        meta dropped = (if $dups > 0 { $tally.assign({ "duplicate": $dups }) } else { $tally }).format_json(no_indent: true)
        meta kept = $kept.length().string()
        root = $kept.map_each(e -> e.without("_drop"))
    - log:
        level: INFO
        message: 'agenda: ${! @kept } events kept, dropped by reason ${! @dropped }'
    - unarchive: { format: json_array }

    - mapping: |
        # The domain comes from the deployment, never from this file (PF-44); the agenda's
        # register_id is the local id.
        let urn = "urn:ngsi-ld:%v:%v:%v:%v"
        let name = this.name.trim()
        let words = $name.lowercase()
        # The main category (T-5363's fifteen codes) from the first words of the Catalan name,
        # first rule that matches, then from a word that opens a later part of it ("Setmana de
        # l'Àlbum. Taller ..."); the sports agenda is sport whatever the name. The Smart Data
        # Models category and sub-category follow where one fits. No rule, no category.
        let rules = [
          ["children-family", "^(contacontes|narraci|contes?|sessi[óo] de contes|hora del conte|espectacle infantil|activitat familiar|en fam[ií]lia)|infantil|fam[ií]lies"],
          ["music", "^(concerts?|[òo]pera|recital|m[uú]sica|cantada|coral|jazz|sardanes|audici[óo])"],
          ["theatre-dance", "^(teatre|espectacles?|dansa|ball|mon[òo]leg|circ|titelles|lectura (dramatitzada|escenificada)|improvisaci|m[àa]gia)"],
          ["film", "^(projecci[óo]|cinema|cinef[òo]rum|cicle de cinema|documental|pel[·.]?l[ií]cula|curtmetratges?)"],
          ["exhibition-museum", "^(exposici[óo]|mostra|museu|instal[·.]?laci[óo])"],
          ["festival-fair", "^(festa|fira|festival|castanyada|celebraci[óo]|carnaval|revetlla|cavalcada|festes)"],
          ["sport", "^(b[àa]squet|futbol|cursa|partit|handbol|hoquei|nataci[óo]|atletisme|voleibol|tennis|marat[óo]|torneig|campionat|travessa|caminada|bicicletada)"],
          ["history-heritage", "^(sortida cultural|visit(a|es)|itineraris?|ruta|patis|passeig)"],
          ["outdoor-nature", "^(sortida|passejada|excursi[óo]|ruta natural|observaci[óo] d.ocells)"],
          ["education-talk", "^(xerrada|confer[èe]ncia|seminari|col[·.]?loqui|curs|taula rodona|presentaci[óo]|jornad(a|es)|debat|sessi[óo] informativa|lectura|club de lectura|tert[úu]lia|di[àa]leg|classe)"],
          ["food-market", "^(mercat|vermut|tast|degustaci[óo]|mercadet)"],
          ["hobby-workshop", "^(tallers?|joc|jocs|concurs)"],
          ["health-wellness", "^(ioga|meditaci[óo]|pilates|tai.?txi|salut)"],
          ["faith-tradition", "^(missa|processó|pessebre)"],
          ["community-civic", "^(trobada|espai (de trobada|obert)|grup|campanya|casal|assemblea|reuni[óo]|punt d.informaci[óo]|portes obertes|voluntariat)"]
        ]
        let main = if this.src == "agenda-activitats-esportives" { "sport" } else {
          $rules.filter(r -> $words.re_match(r.index(1))).map_each(r -> r.index(0)).index(0).or(
            $rules.filter(r -> $words.re_match(r.index(1).replace_all("^(", "(^|[ .,:'\"‘«(])("))).map_each(r -> r.index(0)).index(0).or(null))
        }
        let sdm = {
          "music": ["spectacle"], "theatre-dance": ["spectacle"], "film": ["spectacle"],
          "festival-fair": ["spectacle"], "exhibition-museum": ["museum"],
          "outdoor-nature": ["outdoorActivities"], "history-heritage": ["history"],
          "food-market": ["gastronomy"], "faith-tradition": ["religiousWorship"], "health-wellness": ["wellness"]
        }
        let sub = { "music": ["music"], "theatre-dance": ["theater"] }
        # The agenda's date is a day: its hours sit in a free-text timetable. The day starts at
        # local midnight in Barcelona, whatever offset summer time gives it that day.
        let offset = (this.starts + "T12:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_tz("Europe/Madrid").ts_format("Z07:00")
        let end_offset = if this.ends.or(null) == null { null } else {
          (this.ends + "T12:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_tz("Europe/Madrid").ts_format("Z07:00")
        }
        # The event leaves the space by itself (NGSI-LD 4.22 expiresAt): at the end of its last day,
        # or three daily runs after the newest run that listed it, whichever comes first; an hour
        # at least, so a write never carries a past expiry.
        let now = timestamp_unix()
        # The last day ends at the next local midnight, with the next day's own offset (a summer
        # time change makes that day 23 or 25 hours long).
        let next_day = if $end_offset == null { null } else {
          ((this.ends + "T12:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_unix() + 86400).ts_format("2006-01-02", "UTC")
        }
        let ends_at = if $next_day == null { null } else {
          ($next_day + "T00:00:00" + ($next_day + "T12:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_tz("Europe/Madrid").ts_format("Z07:00")).ts_parse("2006-01-02T15:04:05Z07:00").ts_unix()
        }
        let lease = $now + 259200
        let expires = [if $ends_at == null { $lease } else { [$ends_at, $lease].min() }, $now + 3600].max()
        # The register writes 9999 for a place with no street number (97 of them on 2026-10-23).
        let street = [this.street.or("").trim(), this.num.or("").trim()].filter(s -> s != "" && s != "9999").join(" ")
        let town = this.town.or("").trim()
        let phone = this.phone.or("").trim()
        root = {
          "id": $urn.format("Event", env("JC_ORG_DOMAIN"), env("JC_SPACE"), this.id),
          "type": "Event",
          "name": { "type": "Property", "value": $name },
          "startDate": { "type": "Property", "value": this.starts + "T00:00:00" + $offset },
          "endDate": if $end_offset == null { null } else {
            { "type": "Property", "value": this.ends + "T00:00:00" + $end_offset }
          },
          "category": if $main == null { null } else {
            { "type": "Property", "value": [$main].concat($sdm.get($main).or([])) }
          },
          "subCategory": if $main == null || $sub.get($main) == null { null } else {
            { "type": "Property", "value": $sub.get($main) }
          },
          "location": { "type": "GeoProperty", "value": {
            "type": "Point", "coordinates": [(this.lon.number() * 1000000).round() / 1000000, (this.lat.number() * 1000000).round() / 1000000]
          } },
          "address": { "type": "Property", "value": {
            "streetAddress": $street,
            "postalCode": this.zip.or(""),
            # The agenda writes the town in capitals as often as not ("BARCELONA").
            "addressLocality": if $town.uppercase() == "BARCELONA" { "Barcelona" } else { $town },
            "district": this.district.or("").trim(),
            "addressCountry": "ES"
          }.filter(entry -> entry.value != "") },
          "contactPoint": if $phone == "" || !$phone.re_match("^[0-9 .+()/-]{6,40}$") { null } else {
            { "type": "Property", "value": { "telephone": $phone } }
          },
          "source": { "type": "Property", "value": "https://opendata-ajuntament.barcelona.cat/data/dataset/" + this.src },
          "expiresAt": $expires.ts_format("2006-01-02T15:04:05Z", "UTC")
        }
        root = root.filter(entry -> entry.value != null)

    # 500 events per request to the endpoint: one run never holds one 7,700-entity write.
    - split: { size: 500 }
    - archive: { format: json_array }
