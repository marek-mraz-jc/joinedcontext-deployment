          "08019-0024": { "name": "QLSub - Pou Reial Club De Tennis Barcelona 1889", "place": "Club de Tennis Barcelona (Pou QLSub)", "aquifer": "Baix Besòs i Pla de Barcelona", "wellDepth": 20, "barri": "Pedralbes", "district": "les Corts", "coordinates": [2.1171731, 41.3926435] },
          "08019-0021": { "name": "QLSub - Pou Temple Sagrada Familia", "place": "Temple Sagrada Família (Pou QLSub)", "aquifer": "Baix Besòs i Pla de Barcelona", "wellDepth": 29, "barri": "la Sagrada Família", "district": "Eixample", "coordinates": [2.1741711, 41.4039686] },
          "08019-0082": { "name": "QLSub - Pozo Floridablanca", "place": "C. de Floridablanca (Pou QLSub)", "aquifer": "Baix Besòs i Pla de Barcelona", "wellDepth": 8, "barri": "Sant Antoni", "district": "Eixample", "coordinates": [2.1626761, 41.3814388] },
          "08019-1301": { "name": "QLSub - Trme (Ajuntament De Barcelona)", "place": "C. Trinxant (Pou QLSub)", "aquifer": "Baix Besòs i Pla de Barcelona", "wellDepth": 15, "barri": "el Camp de l’Arpa del Clot", "district": "Sant Martí", "coordinates": [2.1865961, 41.4139743] }
        }
        let rows = $text.parse_csv(true, ",").map_each(r -> {
          "well": r.Codi_Estacio_ACA.or("").trim(),
          "day": r.Data_Mesura.or("").trim(),
          "depth": r.Fondaria_Aigua.or("").trim().number().catch(null),
          "level": r.Cota_Nivell_Piezometric.or("").trim().number().catch(null)
        })
        let known = $rows.filter(r -> $wells.exists(r.well))
        # One row per well and day; a repeated row is a duplicate, its first stands.
        let keyed = $known.enumerated().map_each(e -> e.value.assign({ "key": e.value.well + "|" + e.value.day, "position": e.index }))
        let first = $keyed.fold({}, item -> if item.tally.exists(item.value.key) { item.tally } else { item.tally.assign({ item.value.key: item.value.position }) })
        let unique = $keyed.filter(r -> $first.get(r.key) == r.position)
        let dated = $unique.map_each(r -> r.assign({ "instant": (r.day + "T12:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_unix().catch(null) })).filter(r -> r.instant != null)
        let numeric = $dated.filter(r -> r.depth != null && r.level != null)
        let ranged = $numeric.filter(r -> r.depth >= 0 && r.depth <= $wells.get(r.well).wellDepth.or(150) && r.level >= -50 && r.level <= 200)
        let valid = $ranged.filter(r -> r.instant <= $now + 86400)
        let newest = $valid.map_each(r -> r.instant).sort().index(-1).catch(null)
        let latest = if $newest == null { throw("the readings file holds no valid reading of a known well") } else if $newest < $now - 270 * 86400 { throw("the newest reading of the readings file is of %v, more than 270 days old".format($newest.ts_format("2006-01-02", "UTC"))) } else {
          $valid.sort_by(r -> r.instant).fold({}, item -> item.tally.assign({ item.value.well: item.value })).values()
        }
        let current = $latest.filter(r -> r.instant >= $now - 1826 * 86400)
        root.dropped = {
          "unknownWell": $rows.length() - $known.length(),
          "duplicateRow": $known.length() - $unique.length(),
          "notADate": $unique.length() - $dated.length(),
          "notANumber": $dated.length() - $numeric.length(),
          "outOfRange": $numeric.length() - $ranged.length(),
          "inTheFuture": $ranged.length() - $valid.length(),
          "noReadingInFiveYears": $latest.length() - $current.length()
        }
        root.entities = $current.sort_by(r -> r.well).map_each(r -> $wells.get(r.well).assign({ "code": r.well, "reading": r })).map_each(w -> {
          "id": "urn:ngsi-ld:%v:%v:%v:aca-%v".format("PhreaticObserved", env("JC_ORG_DOMAIN"), env("JC_SPACE"), w.code),
          "type": "PhreaticObserved",
          "name": { "type": "LanguageProperty", "languageMap": { "ca": w.name } },
          "stationCode": { "type": "Property", "value": w.code },
          "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": w.coordinates } },
          "address": { "type": "Property", "value": { "streetAddress": w.place, "addressLocality": "Barcelona", "district": w.district, "addressCountry": "ES" } },
          "areaServed": { "type": "Property", "value": w.barri },
          "aquifer": { "type": "Property", "value": w.aquifer },
          "measurementType": { "type": "Property", "value": ["depth"] },
          "investigationDepth": if w.wellDepth == null { deleted() } else { { "type": "Property", "value": w.wellDepth } },
          "waterTable": { "type": "Property", "value": w.reading.depth, "unitCode": "MTR", "observedAt": w.reading.instant.ts_format("2006-01-02T15:04:05Z", "UTC") },
          "piezometricLevel": { "type": "Property", "value": w.reading.level, "unitCode": "MTR", "observedAt": w.reading.instant.ts_format("2006-01-02T15:04:05Z", "UTC") },
          "dateObserved": { "type": "Property", "value": w.reading.instant.ts_format("2006-01-02T15:04:05Z", "UTC") },
          "dataProvider": { "type": "Property", "value": "Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)" },
          "source": { "type": "Property", "value": "https://opendata-ajuntament.barcelona.cat/data/dataset/piezometres_detall" }
        })
    - log:
        level: INFO
        message: 'groundwater: ${! json("entities").length() } wells written; dropped ${! json("dropped").format_json(no_indent: true) }'
    - mapping: root = this.entities
