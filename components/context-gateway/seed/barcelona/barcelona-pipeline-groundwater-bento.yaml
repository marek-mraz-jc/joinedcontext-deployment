# The mapping of the groundwater pipeline (PL-03, T-5263): one PhreaticObserved per piezometer or
# well the city reads, with its newest reading. The source is Open Data BCN's piezometres_detall.csv
# (dataset piezometres_detall, one resource the city rewrites about once a month, its readings
# taken by hand and published some months late): one row per reading, the day in Data_Mesura, the
# well's Catalan water agency (ACA) code, the depth from the surface to the water (Fondaria_Aigua,
# m) and the water's height above sea level (Cota_Nivell_Piezometric, m, below 0 near the sea).
# The wells' names and places are not in it; they are listed here, read from the dataset
# piezometres_equipaments (piezometres_equipaments.csv, 2026-10-23, 54 wells, each with readings).
# Written: waterTable (the depth to the water, Smart Data Models' name), investigationDepth (the
# well's depth), piezometricLevel (a property of this model) and measurementType depth. The file
# gives the day only: dateObserved is that day at 12:00 UTC, the same date in every European zone.
#
# Plausibility (owner 2026-10-22): a well not listed, a value that is no number, a depth to the
# water below 0 or below the well's own depth, a level outside -50..200 m, a day more than a day
# ahead, and a second row for one well and day are each dropped and counted by reason in
# `dropped`, which the next step logs. A well whose newest reading is more than five years old
# is no longer read and is left out, counted as `noReadingInFiveYears`. A file with no valid
# reading, or whose newest reading is more than 270 days old (the city's months of delay plus
# three monthly updates), fails the run and leaves the entities as they were.

