# Barcelona's organization administrator (ADR-N-058 2.4, PF-123): org-admin on the Ajuntament's
# settings and its projects, and nothing in Helsinki's or Žilina's. The person is demo.barcelona
# (components/keycloak/demo-users.yaml).
apiVersion: joinedcontext.com/v1alpha1
kind: RoleBinding
metadata:
  name: barcelona-admins
  namespace: org
spec:
  subjects:
    - user: de300000-0000-4000-8000-000000000006 # demo.barcelona
  role: org-admin
  scope: { organization: barcelona }
