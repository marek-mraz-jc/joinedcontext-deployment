apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pedestrian-crossings
  namespace: barcelona
  title:
    ca: Lectura pública dels passos de vianants
    es: Lectura pública de los pasos de peatones
    en: Public read of pedestrian crossings
spec:
  contextSpaceRef: { kind: ContextSpace, name: barcelona }
  assigner: did:web:barcelona.cat
  assignee: { kind: role, id: public }
  # The slice the Endpoint pedestrian-crossings publishes, read only, with the discovery a client needs first
  # (T-4258, EP-116). The space keeps no history of this type, so no temporal operation.
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: PedestrianCrossing
