# The mapping of the city-works pipeline (PL-03, T-5264): one CityWork per public work of Open Data
# BCN's obres_espai_public.json (dataset obres, rewritten daily): every work on the city's public
# space since 2010, one row per work and district or barri it touches, each repeating the work's
# code, its dates and its outline (WKT, geometria_wgs84). So the work is keyed by its code and its
# rows become one entity whose territorialArea names every district; refDistrict points at the
# district's AdministrativeArea when the work lies in one district only (code 11, "Àmbit ciutat",
# is the whole city). The file writes a missing value as the string "None". The constructor is
# left out, because it can name a person. The promoter is mostly a public body, a utility or a
# company, but a private building's promoter can be a person (2 of 295 current works on
# 2026-10-23): it is kept only as one word (BIMSA, ENDESA) or with an organisation's marker
# (S.A., S.L., UTE, Fundació, Ajuntament...), and otherwise left out and counted.
#
# Which works: those in execution or stopped, and the finished ones for 30 days after their end;
# the older finished works (about 1,600 of 1,900) stay in the source's own archive. `expiresAt`
# (NGSI-LD 4.22): a work leaves every read three days after the file last listed it (three
# update periods), a finished one also 30 days after its end, so a work the file drops goes
# instead of standing with its last state.
#
# Plausibility (owner 2026-10-22): a row with no code, an unknown state, a start or end that is no
# date, an end before the start, no outline or a vertex outside the municipality's 1 km margin
# (the space's in-area bbox) is dropped; a budget below 0 or above 1,000 million euros is left
# out of the entity; each is counted by reason in `dropped`, which the next step logs. A file
# with no work in execution at all fails the run, so the works stand instead of going quiet.

pipeline:
  processors:
    - mapping: |
        let text = if content().length() > 33554432 { throw("the works file is %d bytes, more than the 32 MiB read".format(content().length())) } else { content().string().trim_prefix("﻿") }
        # The run's clock; a test sets bcn_now to read a recorded file as of its own day.
        let now = @bcn_now.or(now()).ts_parse("2006-01-02T15:04:05Z07:00").ts_unix()
        let lease = $now + 3 * 86400
        let bbox = [2.04, 41.3, 2.24, 41.48]
        let states = { "En execució": "open", "Aturada": "other", "Finalitzada": "completed" }
        map text {
          root = if this == null || this.string().trim() == "" || this.string().trim() == "None" || this.string().trim() == "-" { null } else { this.string().trim() }
        }
        # A local "2025-12-17 00:00:00.000" as UTC seconds: read as UTC, then moved by Madrid's offset.
        map instant {
          let naive = this.apply("text").ts_parse("2006-01-02 15:04:05.000").ts_unix().catch(null)
          root = if $naive == null { null } else { $naive - $naive.ts_format("-07", "Europe/Madrid").number() * 3600 }
        }
        map organisation {
          let name = this.apply("text")
          root = if $name != null && $name.re_match("(?i)(^\\S+$|\\b(s\\.?a\\.?u?|s\\.?l\\.?u?|ute|sccl|consorci|ajuntament|gerencia|junta|port|fira|club|incasol)\\b|\\bfundaci)") { $name } else { null }
        }
        map amount {
          let value = this.apply("text").number().catch(null)
          root = if $value == null || $value < 0 || $value > 1000000000 { null } else { $value }
        }
        let rows = $text.parse_json().catch([]).or([]).map_each(r -> r.assign({
          "code": r.codi.apply("text").or(""),
          "start": r.data_inici.apply("instant"),
          "end": r.data_fi.apply("instant")
        }))
        let coded = $rows.filter(r -> r.code.re_match("^[0-9]{2}-[0-9]{4}[A-Z][0-9]{4}$"))
        let known = $coded.filter(r -> $states.exists(r.estat.or("")))
        let dated = $known.filter(r -> r.start != null && r.end != null)
        let ordered = $dated.filter(r -> r.start <= r.end)
        let current = $ordered.filter(r -> r.estat != "Finalitzada" || r.end + 30 * 86400 >= $now)
        let shaped = $current.map_each(r -> r.assign({
          "wkt": r.geometria_wgs84.apply("text").or("")
        })).map_each(r -> r.assign({
          "shape": if r.wkt.has_prefix("MULTIPOLYGON") { "MultiPolygon" } else if r.wkt.has_prefix("POLYGON") { "Polygon" } else { null },
          "coordinates": r.wkt.re_replace_all("^[A-Z]+ *", "").re_replace_all("(-?[0-9.]+) (-?[0-9.]+)", "[$1,$2]").replace_all("(", "[").replace_all(")", "]").parse_json().catch(null)
        })).filter(r -> r.shape != null && r.coordinates != null)
        let inside = $shaped.filter(r -> (if r.shape == "MultiPolygon" { r.coordinates.flatten().flatten() } else { r.coordinates.flatten() }).all(p -> p.index(0) >= $bbox.index(0) && p.index(0) <= $bbox.index(2) && p.index(1) >= $bbox.index(1) && p.index(1) <= $bbox.index(3)))
        # One work per code: its first row stands, the districts of every row are gathered.
        let works = $inside.fold({}, item -> item.tally.assign({ item.value.code: item.tally.get(item.value.code).or(item.value.assign({ "districts": [] })).merge({ "districts": [ { "code": item.value.codi_districte.apply("text").or(""), "name": item.value.nom_districte.apply("text").or("") } ] }) })).values().sort_by(w -> w.code)
        let promoters = $works.map_each(w -> w.promotor.apply("text")).filter(p -> p != null)
        let budgets = $works.map_each(w -> [w.pressupost_licitacio, w.pressupost_adjudicacio]).flatten().filter(b -> b.apply("text") != null)
        root.dropped = {
          "noCode": $rows.length() - $coded.length(),
          "unknownState": $coded.length() - $known.length(),
          "noDate": $known.length() - $dated.length(),
          "endBeforeStart": $dated.length() - $ordered.length(),
          "finishedOver30DaysAgo": $ordered.length() - $current.length(),
          "noOutline": $current.length() - $shaped.length(),
          "outsideTheCity": $shaped.length() - $inside.length(),
          "rowPerAreaMerged": $inside.length() - $works.length(),
          "promoterLeftOut": $promoters.length() - $promoters.filter(p -> p.apply("organisation") != null).length(),
          "budgetOutOfRange": $budgets.length() - $budgets.filter(b -> b.apply("amount") != null).length()
        }
        root.entities = if $works.filter(w -> w.estat == "En execució").length() == 0 { throw("the works file holds no work in execution") } else { $works.map_each(w -> w.assign({
          "areas": w.districts.filter(d -> d.code.re_match("^(0[1-9]|10)$")).map_each(d -> d.code).unique().sort(),
          "names": w.districts.map_each(d -> d.name).filter(n -> n != "").unique().sort()
        })).map_each(w -> {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("CityWork", env("JC_ORG_DOMAIN"), env("JC_SPACE"), w.code),
          "type": "CityWork",
          "expiresAt": (if w.estat == "Finalitzada" { [w.end + 30 * 86400, $lease].min() } else { $lease }).ts_format("2006-01-02T15:04:05Z", "UTC"),
          "name": { "type": "Property", "value": w.titol.apply("text").or(w.ubicacio.apply("text")).or(w.code) },
          "description": if w.descripcio.apply("text") == null { null } else { { "type": "Property", "value": w.descripcio.apply("text") } },
          "workNumber": { "type": "Property", "value": w.code },
          "workState": { "type": "Property", "value": $states.get(w.estat) },
          "workStateLabel": { "type": "Property", "value": w.estat },
          "workCategory": if w.tipusobra.apply("text") == null { null } else { { "type": "Property", "value": w.tipusobra.apply("text") } },
          "startDate": { "type": "Property", "value": w.start.ts_format("2006-01-02T15:04:05Z", "UTC") },
          "endDate": { "type": "Property", "value": w.end.ts_format("2006-01-02T15:04:05Z", "UTC") },
          "contractingAuthority": if w.promotor.apply("organisation") == null { null } else { { "type": "Property", "value": w.promotor.apply("organisation") } },
          "tenderAmount": if w.pressupost_licitacio.apply("amount") == null { null } else { { "type": "Property", "value": w.pressupost_licitacio.apply("amount") } },
          "awardAmount": if w.pressupost_adjudicacio.apply("amount") == null { null } else { { "type": "Property", "value": w.pressupost_adjudicacio.apply("amount") } },
          "areaServed": if w.ubicacio.apply("text") == null { null } else { { "type": "Property", "value": w.ubicacio.apply("text").replace_all("''", "'") } },
          "territorialArea": if w.names.length() == 0 { null } else { { "type": "Property", "value": w.names.join("; ") } },
          "refDistrict": if w.areas.length() != 1 { null } else {
            { "type": "Relationship", "object": "urn:ngsi-ld:%v:%v:%v:district-%v".format("AdministrativeArea", env("JC_ORG_DOMAIN"), env("JC_SPACE"), w.areas.index(0)) }
          },
          "seeAlso": if w.url_web_obres.apply("text").or("").re_match("^https?://") { { "type": "Property", "value": w.url_web_obres.apply("text") } } else { null },
          "location": { "type": "GeoProperty", "value": { "type": w.shape, "coordinates": w.coordinates } },
          "dataProvider": { "type": "Property", "value": "Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)" },
          "source": { "type": "Property", "value": "https://opendata-ajuntament.barcelona.cat/data/dataset/obres" }
        }.filter(entry -> entry.value != null)) }
    - log:
        level: INFO
        message: 'city works: ${! json("entities").length() } written; dropped ${! json("dropped").format_json(no_indent: true) }'
    - mapping: root = this.entities
