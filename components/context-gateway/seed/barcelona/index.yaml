# file in this folder -> its path in the configuration repository (jc-core PATH_TEMPLATEs), read
# by the forge bootstrap's seed (components/gitea/values/bootstrap/development-values).
# Ajuntament de Barcelona as an Organization of its own (ADR-N-058, T-5260), its administrator
# and its readers; the bindings end at this Organization (PF-123).
barcelona-org.yaml: organizations/barcelona.yaml
barcelona-rolebinding-admins.yaml: users/assignments/barcelona-admins.yaml
barcelona-rolebinding-viewers.yaml: users/assignments/barcelona-viewers.yaml
# The project barcelona: one space of Open Data BCN as Smart Data Models, its one door, the
# pipelines' account and Policy, and the CKAN organisation its datasets publish to.
barcelona-project.yaml: projects/barcelona/project.yaml
barcelona-serviceaccount-pipelines.yaml: projects/barcelona/access/serviceaccounts/pipelines.yaml
barcelona-ckan.yaml: projects/barcelona/ckan/barcelona.yaml
barcelona-space.yaml: projects/barcelona/spaces/barcelona/space.yaml
barcelona-datamodel.yaml: projects/barcelona/spaces/barcelona/datamodels/barcelona.yaml
barcelona.linkml.yaml: projects/barcelona/spaces/barcelona/datamodels/barcelona.linkml.yaml
barcelona.v1.schema.json: projects/barcelona/spaces/barcelona/datamodels/barcelona.v1.schema.json
barcelona.v1.context.jsonld: projects/barcelona/spaces/barcelona/datamodels/barcelona.v1.context.jsonld
barcelona.v1.example.jsonld: projects/barcelona/spaces/barcelona/datamodels/barcelona.v1.example.jsonld
barcelona.v1.md: projects/barcelona/spaces/barcelona/datamodels/barcelona.v1.md
barcelona-endpoint.yaml: projects/barcelona/spaces/barcelona/endpoints/barcelona.yaml
barcelona-policy-pipelines-write.yaml: projects/barcelona/spaces/barcelona/policies/pipelines-write.yaml
barcelona-policy-public-read.yaml: projects/barcelona/spaces/barcelona/policies/public-read.yaml
# Transport (T-5262): the traffic state of each street section every five minutes, and the
# regulated surface parking sections of B:SM once a day, each its own public catalogue dataset.
barcelona-datasource-traffic-state.yaml: projects/barcelona/datasources/bcn-traffic-state.yaml
barcelona-pipeline-traffic-state.yaml: projects/barcelona/pipelines/traffic-state/pipeline.yaml
barcelona-pipeline-traffic-state-bento.yaml: projects/barcelona/pipelines/traffic-state/bento.yaml
barcelona-endpoint-traffic.yaml: projects/barcelona/spaces/barcelona/endpoints/barcelona-traffic.yaml
barcelona-policy-public-traffic.yaml: projects/barcelona/spaces/barcelona/policies/public-traffic.yaml
barcelona-datasource-parking-sections.yaml: projects/barcelona/datasources/bcn-parking-sections.yaml
barcelona-pipeline-parking-sections.yaml: projects/barcelona/pipelines/parking-sections/pipeline.yaml
barcelona-pipeline-parking-sections-bento.yaml: projects/barcelona/pipelines/parking-sections/bento.yaml
barcelona-endpoint-parking.yaml: projects/barcelona/spaces/barcelona/endpoints/barcelona-parking.yaml
barcelona-policy-public-parking.yaml: projects/barcelona/spaces/barcelona/policies/public-parking.yaml
