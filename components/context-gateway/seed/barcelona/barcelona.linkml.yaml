id: https://joinedcontext.com/models/barcelona/barcelona
name: barcelona
title: Barcelona, open data
description: >-
  What the space barcelona carries (DM-01, DM-61): the open data of Barcelona City Council
  (Open Data BCN) as Smart Data Models types, their IRIs cited rather than minted (DM-04, DM-16).
  The first type is AirQualityObserved, one entity per station of the city's air-quality
  network with the hourly mean of each pollutant it measures; each Open Data BCN batch adds its
  own classes. Batch 3 (T-5264) adds the districts and barris as AdministrativeArea, the
  works on the public space as CityWork and the street inventory's crossings as
  PedestrianCrossing.
license: https://joinedcontext.com/licenses/cc-by-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  jc: https://joinedcontext.com/models/
  sdm: https://smartdatamodels.org/
  ngsi-ld: https://uri.etsi.org/ngsi-ld/
default_prefix: sdm
default_range: string
imports:
  - linkml:types
  - ngsi-ld-core

slots:
  name:
    slot_uri: schema:name
    description: The name as the city publishes it, in Catalan (a station, a district or barri, a work).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://schema.org/name
  dateObserved:
    slot_uri: sdm:dateObserved
    description: The end of the hour the entity's readings cover, UTC.
    range: datetime
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  pm10:
    slot_uri: sdm:pm10
    description: Particulate matter up to 10 µm, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  pm25:
    slot_uri: sdm:pm25
    description: Particulate matter up to 2.5 µm, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  no2:
    slot_uri: sdm:no2
    description: Nitrogen dioxide, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  o3:
    slot_uri: sdm:o3
    description: Ozone, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment

  districtCode:
    slot_uri: jc:districtCode
    description: >-
      The city's own two-digit code of the area: the district number 01..10, or for a barri its
      number 01..73, which runs across the whole city.
    pattern: ^[0-9]{2}$
    required: true
    annotations: { ngsi_ld_kind: Property }
  divisionLevel:
    slot_uri: jc:divisionLevel
    description: Which of the city's two divisions the area belongs to.
    range: DivisionLevel
    required: true
    annotations: { ngsi_ld_kind: Property }
  refParentDistrict:
    slot_uri: jc:refParentDistrict
    description: The district a barri belongs to.
    range: AdministrativeArea
    inverse: neighbourhoods
    inlined: false
    annotations: { ngsi_ld_kind: Relationship, on_delete: restrict }
  refDistrict:
    slot_uri: jc:refDistrict
    description: The district the work lies in, when it lies in one district only.
    range: AdministrativeArea
    inverse: cityWorks
    inlined: false
    annotations: { ngsi_ld_kind: Relationship, on_delete: restrict }
  refNeighbourhood:
    slot_uri: jc:refNeighbourhood
    description: The barri the crossing lies in; none for a crossing on the city's edge.
    range: AdministrativeArea
    inverse: pedestrianCrossings
    inlined: false
    annotations: { ngsi_ld_kind: Relationship, on_delete: restrict }
  pedestrianCrossings:
    slot_uri: jc:pedestrianCrossings
    description: The crossings in this barri, computed from their refNeighbourhood and never stored.
    range: PedestrianCrossing
    multivalued: true
    inverse: refNeighbourhood
    inlined: false
    annotations: { ngsi_ld_kind: Relationship }
  crossingType:
    slot_uri: jc:crossingType
    description: How the crossing is marked, from the city's typology (infraestructures-tipologia-pas-vianants).
    range: CrossingType
    required: true
    annotations: { ngsi_ld_kind: Property }
  crossingTypeLabel:
    slot_uri: jc:crossingTypeLabel
    description: The crossing's kind as the city writes it, in Catalan (Pas de pastilles, Pas de tacs, Pas de bicicletes).
    annotations: { ngsi_ld_kind: Property }
  markedArea:
    slot_uri: jc:markedArea
    description: The painted area of the crossing in square metres (unitCode MTK).
    range: float
    minimum_value: 0
    maximum_value: 500
    unit: { ucum_code: m2 }
    annotations: { ngsi_ld_kind: Property }
  neighbourhoods:
    slot_uri: jc:neighbourhoods
    description: The barris of this district, computed from their refParentDistrict and never stored.
    range: AdministrativeArea
    multivalued: true
    inverse: refParentDistrict
    inlined: false
    annotations: { ngsi_ld_kind: Relationship }
  cityWorks:
    slot_uri: jc:cityWorks
    description: The works that lie in this district only, computed from their refDistrict and never stored.
    range: CityWork
    multivalued: true
    inverse: refDistrict
    inlined: false
    annotations: { ngsi_ld_kind: Relationship }
  dataProvider:
    slot_uri: sdm:dataProvider
    description: Who publishes the data the entity was read from, as an application credits it beside the licence (CC BY 4.0).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models
  source:
    slot_uri: sdm:source
    description: The Open Data BCN dataset the entity was read from.
    range: uri
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models
  description:
    slot_uri: schema:description
    description: The work's description as the city publishes it, in Catalan.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://schema.org/description
  workNumber:
    slot_uri: sdm:workNumber
    description: The city's code of the work, such as 05-2025G0074 (district, year, number).
    pattern: ^[0-9]{2}-[0-9]{4}[A-Z][0-9]{4}$
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  workState:
    slot_uri: sdm:workState
    description: Where the work stands, in the Smart Data Model's terms.
    range: WorkState
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  workStateLabel:
    slot_uri: jc:workStateLabel
    description: The work's state as the city writes it, in Catalan (En execució, Aturada, Finalitzada).
    annotations: { ngsi_ld_kind: Property }
  workCategory:
    slot_uri: jc:workCategory
    description: The city's kind of work, in Catalan (Urbanització, Serveis, Clavegueram...).
    annotations: { ngsi_ld_kind: Property }
  startDate:
    slot_uri: sdm:startDate
    description: The first day of the work, local midnight as UTC.
    range: datetime
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  endDate:
    slot_uri: sdm:endDate
    description: The planned last day of the work, local midnight as UTC.
    range: datetime
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  contractingAuthority:
    slot_uri: sdm:contractingAuthority
    description: >-
      The work's promoter, a public body, utility or company; left out when it may name a person.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  tenderAmount:
    slot_uri: jc:tenderAmount
    description: The budget the work was put out to tender with, in euros.
    range: float
    minimum_value: 0
    annotations: { ngsi_ld_kind: Property }
  awardAmount:
    slot_uri: jc:awardAmount
    description: The budget the work was awarded for, in euros.
    range: float
    minimum_value: 0
    annotations: { ngsi_ld_kind: Property }
  areaServed:
    slot_uri: sdm:areaServed
    description: The place of the work as the city writes it (a street and number, a square, a park).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models
  territorialArea:
    slot_uri: sdm:territorialArea
    description: Every district the work touches, by name, separated by "; ".
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  seeAlso:
    slot_uri: sdm:seeAlso
    description: The work's page on the city's works site.
    range: uri
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models

classes:
  AirQualityObserved:
    class_uri: sdm:AirQualityObserved
    description: One air-quality station of Barcelona and its hourly means.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
    slots: [name, dateObserved, pm10, pm25, no2, o3]
  AdministrativeArea:
    class_uri: jc:AdministrativeArea
    description: >-
      One district (10) or barri (73) of Barcelona, its outline and its code, as the Smart Data
      Model extension AdministrativeArea (PointOfInterest base).
    is_a: Entity
    annotations:
      upstream_source: https://github.com/marek-mraz/joinedcontext-deployment/blob/main/scripts/open-data/sdm/extensions/AdministrativeArea
    slots:
      - name
      - districtCode
      - divisionLevel
      - refParentDistrict
      - neighbourhoods
      - cityWorks
      - pedestrianCrossings
      - dataProvider
      - source
  CityWork:
    class_uri: sdm:CityWork
    description: >-
      One work on Barcelona's public space, in execution, stopped or finished within 30 days, with
      its outline, its dates and its promoter. The constructor is left out.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - name
      - description
      - workNumber
      - workState
      - workStateLabel
      - workCategory
      - startDate
      - endDate
      - contractingAuthority
      - tenderAmount
      - awardAmount
      - areaServed
      - territorialArea
      - refDistrict
      - seeAlso
      - dataProvider
      - source
  PedestrianCrossing:
    class_uri: jc:PedestrianCrossing
    description: >-
      One pedestrian or cycle crossing painted on Barcelona's streets, from the city's street
      inventory, with its kind, its painted area and its barri. Smart Data Models has no crossing
      model; the class is the project's own, with SDM's common names where they exist (location,
      dataProvider, source).
    is_a: Entity
    slots: [crossingType, crossingTypeLabel, markedArea, refNeighbourhood, dataProvider, source]

enums:
  DivisionLevel:
    permissible_values:
      district:
        description: A district (districte), 10 of them.
      neighbourhood:
        description: A barri, 73 of them, each inside one district.
  WorkState:
    description: The Smart Data Model CityWork workState values the city's states map to.
    permissible_values:
      open: { description: In execution (En execució). }
      other: { description: Stopped (Aturada). }
      completed: { description: Finished (Finalitzada). }
  CrossingType:
    description: The three kinds of crossing marking the city's typology names.
    permissible_values:
      stripes:
        description: Painted bars across the road, the zebra crossing (Pas de pastilles).
      blocks: { description: A crossing marked with painted square blocks (Pas de tacs). }
      cycle: { description: A crossing for bicycles (Pas de bicicletes). }
