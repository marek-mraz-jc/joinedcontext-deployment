id: https://joinedcontext.com/models/barcelona/barcelona
name: barcelona
title: Barcelona, open data
description: >-
  What the space barcelona carries (DM-01, DM-61): the open data of Barcelona City Council
  (Open Data BCN) as Smart Data Models types, their IRIs cited rather than minted (DM-04, DM-16).
  The first type is AirQualityObserved, one entity per station of the city's air-quality
  network with the hourly mean of each pollutant it measures; each Open Data BCN batch adds its
  agendas (cultural, daily and sports); PointOfInterest the city's register of facilities
  (equipaments); each Open Data BCN batch adds its own classes. Transport: TrafficFlowObserved,
  the traffic state of each street section and each route of sections the city reports every
  five minutes, OnStreetParking, each regulated surface parking section (blue, green, loading
  and bus zones), and EVChargingStation, each public charging point of the Endolla Barcelona
  network with its live socket states.
license: https://joinedcontext.com/licenses/cc-by-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  sdm: https://smartdatamodels.org/
  ngsi-ld: https://uri.etsi.org/ngsi-ld/
  jc: https://joinedcontext.com/models/
default_prefix: sdm
default_range: string
imports:
  - linkml:types
  - ngsi-ld-core

slots:
  name:
    slot_uri: schema:name
    description: The name as the city publishes it, in Catalan (a station, an event, a facility, a street section and its stretch, a street address).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://schema.org/name
  dateObserved:
    slot_uri: sdm:dateObserved
    description: >-
      The end of the period the entity's newest readings cover, UTC: the hour of an air-quality
      mean, the local day of a weather station's values, the day of a well's reading, a traffic
      state's report, a charging point's newest port change.
    range: datetime
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  pm10:
    slot_uri: sdm:pm10
    description: Particulate matter up to 10 µm, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  pm25:
    slot_uri: sdm:pm25
    description: Particulate matter up to 2.5 µm, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  no2:
    slot_uri: sdm:no2
    description: Nitrogen dioxide, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  o3:
    slot_uri: sdm:o3
    description: Ozone, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  congested:
    slot_uri: sdm:congested
    description: >-
      Whether the section is congested now: true for the city's states 4 (very dense) and 5
      (congestion), false otherwise, as SDM reads an absent flag (no data and closed included;
      trafficState tells those apart).
    range: boolean
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  trafficState:
    slot_uri: jc:trafficState
    description: >-
      The city's own traffic state of the section (custom: TrafficFlowObserved has only
      `congested`), its code 1 to 6 named in English; Open Data BCN dataset trams.
    range: TrafficState
    annotations: { ngsi_ld_kind: Property }
  trafficStateForecast:
    slot_uri: jc:trafficStateForecast
    description: The state the city forecasts for the section in 15 minutes, same codes as trafficState (custom).
    range: TrafficState
    annotations: { ngsi_ld_kind: Property }
  travelTime:
    slot_uri: jc:travelTime
    description: >-
      How long a vehicle takes now to drive the route, in seconds (custom: TrafficFlowObserved
      has no travel time); Open Data BCN dataset itineraris, its fourth field. Absent while the
      city reports no reading for the route.
    range: integer
    minimum_value: 0
    unit: { ucum_code: s }
    annotations: { ngsi_ld_kind: Property }
  usualTravelTime:
    slot_uri: jc:usualTravelTime
    description: >-
      The time the city expects for the route now from its history of the same kind of day, in
      seconds (custom; itineraris, its fifth field, temps previst). travelTime above it means
      slower traffic than usual.
    range: integer
    minimum_value: 0
    unit: { ucum_code: s }
    annotations: { ngsi_ld_kind: Property }
  allowedVehicleType:
    slot_uri: sdm:allowedVehicleType
    description: >-
      What may park there, the section's own kind first; at a charging point, what its sockets
      serve (car for Type 2, CCS and CHAdeMO and for a car park's household sockets, motorcycle
      for the 3.6 kW household sockets).
    multivalued: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking
  totalSpotNumber:
    slot_uri: sdm:totalSpotNumber
    description: The parking places of the section as B:SM counts them (PLACES).
    range: integer
    minimum_value: 0
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking
  zoneCode:
    slot_uri: jc:zoneCode
    description: The section type as B:SM codes it (AZL, VM, VR, DUM, BUS), kept as published (custom).
    annotations: { ngsi_ld_kind: Property }
  tariffCode:
    slot_uri: jc:tariffCode
    description: >-
      The B:SM rate (ID_TARIFA) and timetable (ID_HORARIO) codes of the section, joined as
      rate/timetable, kept as published (custom; Open Data BCN tarifes- and
      horaris-aparcament-superficie).
  so2:
    slot_uri: sdm:so2
    description: Sulphur dioxide, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  co:
    slot_uri: sdm:co
    description: Carbon monoxide, the hour's mean at the station, in mg/m³ as the city measures it.
    range: float
    minimum_value: 0
    unit: { ucum_code: mg/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  'no':
    slot_uri: sdm:no
    description: Nitrogen monoxide, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  nox:
    slot_uri: sdm:nox
    description: Nitrogen oxides (NO + NO2 as NO2), the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  blackCarbon:
    slot_uri: jc:blackCarbon
    description: >-
      Black carbon, the hour's mean at the station. A property of this model: the Smart Data Model
      AirQualityObserved names no black carbon attribute. The city's file gives it in ng/m³ under a
      µg/m³ label; the pipeline divides by 1000.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations: { ngsi_ld_kind: Property }
  temperature:
    slot_uri: sdm:temperature
    description: The day's mean air temperature at the station.
    range: float
    minimum_value: -40
    maximum_value: 50
    unit: { ucum_code: Cel }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  maxTemperature:
    slot_uri: jc:maxTemperature
    description: >-
      The day's highest air temperature at the station. A property of this model: the Smart Data
      Model WeatherObserved names only the mean.
    range: float
    minimum_value: -40
    maximum_value: 50
    unit: { ucum_code: Cel }
    annotations: { ngsi_ld_kind: Property }
  minTemperature:
    slot_uri: jc:minTemperature
    description: >-
      The day's lowest air temperature at the station. A property of this model: the Smart Data
      Model WeatherObserved names only the mean.
    range: float
    minimum_value: -40
    maximum_value: 50
    unit: { ucum_code: Cel }
    annotations: { ngsi_ld_kind: Property }
  relativeHumidity:
    slot_uri: sdm:relativeHumidity
    description: The day's mean relative humidity, as a fraction (0.57 is 57 %).
    range: float
    minimum_value: 0
    maximum_value: 1
    unit: { ucum_code: '1' }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  atmosphericPressure:
    slot_uri: sdm:atmosphericPressure
    description: The day's mean air pressure at the station's height (not reduced to sea level).
    range: float
    minimum_value: 0
    unit: { ucum_code: hPa }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  precipitation:
    slot_uri: sdm:precipitation
    description: The day's precipitation, in millimetres (litres per square metre).
    range: float
    minimum_value: 0
    unit: { ucum_code: mm }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  windSpeed:
    slot_uri: sdm:windSpeed
    description: The day's mean wind speed at 10 m.
    range: float
    minimum_value: 0
    unit: { ucum_code: m/s }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  windDirection:
    slot_uri: sdm:windDirection
    description: The day's mean wind direction at 10 m, in degrees from north.
    range: float
    minimum_value: 0
    maximum_value: 360
    unit: { ucum_code: deg }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  gustSpeed:
    slot_uri: sdm:gustSpeed
    description: The day's strongest gust at 10 m.
    range: float
    minimum_value: 0
    unit: { ucum_code: m/s }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  solarRadiation:
    slot_uri: sdm:solarRadiation
    description: >-
      The day's mean global solar irradiance: the day's irradiation the city gives in MJ/m², times
      10^6 / 86400.
    range: float
    minimum_value: 0
    unit: { ucum_code: W/m2 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  altitude:
    slot_uri: jc:altitude
    description: >-
      The station's height above sea level in metres, as the weather service lists it. A fixed
      property of the station, written without a unit code so its rows are never read as a
      measurement stamped on receipt.
    range: float
    annotations: { ngsi_ld_kind: Property }
  waterTable:
    slot_uri: sdm:waterTable
    description: The depth from the surface to the water in the well at the newest reading.
    range: float
    minimum_value: 0
    unit: { ucum_code: m }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  investigationDepth:
    slot_uri: sdm:investigationDepth
    description: >-
      The depth of the well or piezometer in metres. A fixed property of the well, written without
      a unit code so its rows are never read as a measurement stamped on receipt.
    range: float
    minimum_value: 0
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  piezometricLevel:
    slot_uri: jc:piezometricLevel
    description: >-
      The height of the water above sea level at the newest reading (below 0 where the sea draws
      the aquifer down). A property of this model: PhreaticObserved has only the depth.
    range: float
    unit: { ucum_code: m }
    annotations: { ngsi_ld_kind: Property }
  aquifer:
    slot_uri: jc:aquifer
    description: The groundwater body (massa d'aigua) the well reaches, as the water agency names it.
    annotations: { ngsi_ld_kind: Property }
  measurementType:
    slot_uri: sdm:measurementType
    description: What the well's readings measure; `depth` for each of the city's wells.
    multivalued: true
    range: MeasurementType
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  stationCode:
    slot_uri: jc:stationCode
    description: >-
      The station's code in the network that runs it: the Catalan air-quality network (XVPCA, the
      city's codi_eoi, such as `8019043`), the Meteocat weather network (such as `D5`) or the
      Catalan water agency's well register (ACA, such as `08019-0148`).
    pattern: ^[0-9A-Z][0-9A-Z-]{1,15}$
    examples:
      - value: '8019043'
      - value: D5
      - value: 08019-0148
    annotations: { ngsi_ld_kind: Property }
  startDate:
    slot_uri: schema:startDate
    description: >-
      The first day of the event, local midnight in Europe/Madrid; the agenda publishes the
      day, its hours sit in a free-text timetable.
    range: datetime
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
  endDate:
    slot_uri: schema:endDate
    description: The last day of the event, local midnight in Europe/Madrid; absent when the agenda gives none.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
  category:
    slot_uri: sdm:category
    description: >-
      An Event's main category first, one of the platform's fifteen event codes (music,
      theatre-dance, film, exhibition-museum, festival-fair, sport, outdoor-nature,
      education-talk, children-family, hobby-workshop, food-market, history-heritage,
      faith-tradition, health-wellness, community-civic), then the Smart Data Models category it
      falls under where one fits, read from the first words of the Catalan name and absent when
      no rule matches. A PointOfInterest's family in the city's facility register first
      (culture-leisure, sports, education, social-services, public-administration,
      markets-shopping, information-centres, religious-services, environment, animals-plants,
      cemeteries, media, utility-companies, restaurants), then the register's own kind in
      Catalan (Biblioteques, Poliesportius). An OnStreetParking's kind of regulated parking, from
      the section type (AZL blue zone, VM green zone, VR residents, DUM loading, BUS coaches).
    multivalued: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
  subCategory:
    slot_uri: sdm:subCategory
    description: The Smart Data Models sub-category where the name says it (music, theater).
    multivalued: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
  address:
    slot_uri: schema:address
    description: >-
      Where the station, the well, the event, the facility or the charging point is, as the city
      publishes it, field by field (Smart Data Models' common PostalAddress); a field the source
      leaves out is absent.
    range: PostalAddress
    inlined: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models/blob/master/common-schema.json
  streetAddress:
    slot_uri: schema:streetAddress
    description: The street and the house number, or for a station its square, park or street corner.
    annotations:
      upstream_source: https://schema.org/streetAddress
  postalCode:
    slot_uri: schema:postalCode
    description: The postal code.
    annotations:
      upstream_source: https://schema.org/postalCode
  addressLocality:
    slot_uri: schema:addressLocality
    description: The town or the municipality.
    annotations:
      upstream_source: https://schema.org/addressLocality
  addressCountry:
    slot_uri: schema:addressCountry
    description: The country, as an ISO 3166-1 alpha-2 code.
    annotations:
      upstream_source: https://schema.org/addressCountry
  capacity:
    slot_uri: sdm:capacity
    description: How many vehicles the charging point charges at once, one per port the city lists.
    range: integer
    minimum_value: 1
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  socketNumber:
    slot_uri: sdm:socketNumber
    description: The ports of the charging point.
    range: integer
    minimum_value: 1
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  availableCapacity:
    slot_uri: sdm:availableCapacity
    description: The ports free now (port status AVAILABLE); never more than capacity.
    range: integer
    minimum_value: 0
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  socketType:
    slot_uri: sdm:socketType
    description: >-
      The kinds of socket, in Smart Data Models' words: CCS_TYPE_2 is CCS/SAE, CHADEMO CHAdeMO,
      MENNEKES and a wall outlet over 3.7 kW Type2, a wall outlet up to 3.7 kW Wall_Euro.
    multivalued: true
    range: SocketType
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  status:
    slot_uri: sdm:status
    description: >-
      The state of the charging point from its ports: working while one is free, full when none
      is free and one charges, outOfService when every port is out of order, unavailable or
      unknown.
    range: ChargingStationStatus
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  network:
    slot_uri: sdm:network
    description: The brand of the charging network (Endolla Barcelona).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  operator:
    slot_uri: sdm:operator
    description: Who runs the charging point (Barcelona de Serveis Municipals S.A.).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  openingHours:
    slot_uri: schema:openingHours
    description: When the charging point may be used, in schema.org's syntax (Mo-Su 00:00-24:00).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://schema.org/openingHours
  areaServed:
    slot_uri: sdm:areaServed
    description: The neighbourhood (barri) the station or well is in, as the city names it.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models
  dataProvider:
    slot_uri: sdm:dataProvider
    description: >-
      Who publishes the data the entity was read from, with the credit its licence asks for.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models
  district:
    slot_uri: sdm:district
    description: The city district (districte) the address lies in.
    annotations:
      upstream_source: https://github.com/smart-data-models/data-models/blob/master/common-schema.json
  contactPoint:
    slot_uri: schema:contactPoint
    description: The public telephone line the agenda or the facility register lists.
    range: ContactPoint
    inlined: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models/blob/master/common-schema.json
  telephone:
    slot_uri: schema:telephone
    description: A telephone number as the agenda writes it.
    annotations:
      upstream_source: https://schema.org/telephone
  source:
    slot_uri: sdm:source
    description: The open-data file or the Open Data BCN dataset the entity was read from.
    range: uri
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models

classes:
  AirQualityObserved:
    class_uri: sdm:AirQualityObserved
    description: One air-quality station of Barcelona and its hourly means.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
      label:
        tag: label
        value:
          sk: Meranie kvality ovzdušia
          cs: Měření kvality ovzduší
          en: Air quality reading
          de: Luftqualitätsmessung
    slots:
      - name
      - dateObserved
      - pm10
      - pm25
      - no2
      - o3
      - so2
      - co
      - 'no'
      - nox
      - blackCarbon
      - stationCode
      - address
      - areaServed
      - dataProvider
      - source
  WeatherObserved:
    class_uri: sdm:WeatherObserved
    description: One Meteocat weather station in Barcelona and its newest day's values.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
    slots:
      - name
      - dateObserved
      - temperature
      - maxTemperature
      - minTemperature
      - relativeHumidity
      - atmosphericPressure
      - precipitation
      - windSpeed
      - windDirection
      - gustSpeed
      - solarRadiation
      - stationCode
      - altitude
      - address
      - areaServed
      - dataProvider
      - source
  PhreaticObserved:
    class_uri: sdm:PhreaticObserved
    description: One piezometer or well of Barcelona and its newest groundwater reading.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
    slots:
      - name
      - dateObserved
      - measurementType
      - waterTable
      - piezometricLevel
      - investigationDepth
      - aquifer
      - stationCode
      - address
      - areaServed
      - dataProvider
      - source
  TrafficFlowObserved:
    class_uri: sdm:TrafficFlowObserved
    description: >-
      One street section of the city's traffic-state network with its line, its state now and
      the state forecast for 15 minutes, every five minutes (Open Data BCN trams and
      transit-relacio-trams).
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - name
      - dateObserved
      - congested
      - trafficState
      - trafficStateForecast
      - travelTime
      - usualTravelTime
      - source
  OnStreetParking:
    class_uri: sdm:OnStreetParking
    description: >-
      One regulated surface parking section of B:SM (blue, green, residents, loading or coach
      zone), its curb lines, its places and its rate and timetable codes (Open Data BCN
      trams-aparcament-superficie).
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Parking
    slots: [name, category, allowedVehicleType, totalSpotNumber, zoneCode, tariffCode, source]
    slot_usage:
      category: { range: StreetParkingCategory }
  EVChargingStation:
    class_uri: sdm:EVChargingStation
    description: >-
      One public charging point of the Endolla Barcelona network run by B:SM, its ports, socket
      kinds and how many are free now, every five minutes (Open Data BCN
      informacio-punts-recarrega-electric, which carries the port states of
      estat-ports-recarrega-electric too).
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - name
      - address
      - dateObserved
      - capacity
      - socketNumber
      - availableCapacity
      - socketType
      - allowedVehicleType
      - status
      - network
      - operator
      - openingHours
      - source
  Event:
    class_uri: sdm:Event
    description: >-
      One activity of the Ajuntament's agendas (agenda diària, agenda cultural, agenda
      d'activitats esportives), the day it starts and ends, where it happens and its category.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
    slots: [name, startDate, endDate, category, subCategory, address, contactPoint, source]
  PointOfInterest:
    class_uri: sdm:PointOfInterest
    description: >-
      One facility of the city's register (Guia BCN equipaments): a library, a sports hall, a
      school, a market, a social services centre; its family, where it is and its telephone.
    is_a: Entity
