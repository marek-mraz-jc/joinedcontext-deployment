id: https://joinedcontext.com/models/barcelona/barcelona
name: barcelona
title: Barcelona, open data
description: >-
  What the space barcelona carries (DM-01, DM-61): the open data of Barcelona City Council
  (Open Data BCN) as Smart Data Models types, their IRIs cited rather than minted (DM-04, DM-16).
  The first type is AirQualityObserved, one entity per station of the city's air-quality
  network with the hourly mean of each pollutant it measures; Event holds the city's activity
  agendas (cultural, daily and sports); PointOfInterest the city's register of facilities
  (equipaments); batch 3 (T-5264) adds the districts and barris as AdministrativeArea, the
  works on the public space as CityWork and the street inventory's crossings as
  PedestrianCrossing; each Open Data BCN batch adds its own classes.
license: https://joinedcontext.com/licenses/cc-by-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  jc: https://joinedcontext.com/models/
  sdm: https://smartdatamodels.org/
  ngsi-ld: https://uri.etsi.org/ngsi-ld/
default_prefix: sdm
default_range: string
imports:
  - linkml:types
  - ngsi-ld-core

slots:
  name:
    slot_uri: schema:name
    description: The name as the city publishes it, in Catalan (a station, an event, a facility, a district or barri, a work).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://schema.org/name
  dateObserved:
    slot_uri: sdm:dateObserved
    description: >-
      The end of the period the entity's newest readings cover, UTC: the hour of an air-quality
      mean, the local day of a weather station's values, the day of a well's reading.
    range: datetime
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  pm10:
    slot_uri: sdm:pm10
    description: Particulate matter up to 10 µm, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  pm25:
    slot_uri: sdm:pm25
    description: Particulate matter up to 2.5 µm, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  no2:
    slot_uri: sdm:no2
    description: Nitrogen dioxide, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  o3:
    slot_uri: sdm:o3
    description: Ozone, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  so2:
    slot_uri: sdm:so2
    description: Sulphur dioxide, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  co:
    slot_uri: sdm:co
    description: Carbon monoxide, the hour's mean at the station, in mg/m³ as the city measures it.
    range: float
    minimum_value: 0
    unit: { ucum_code: mg/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  'no':
    slot_uri: sdm:no
    description: Nitrogen monoxide, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  nox:
    slot_uri: sdm:nox
    description: Nitrogen oxides (NO + NO2 as NO2), the hour's mean at the station.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  blackCarbon:
    slot_uri: jc:blackCarbon
    description: >-
      Black carbon, the hour's mean at the station. A property of this model: the Smart Data Model
      AirQualityObserved names no black carbon attribute. The city's file gives it in ng/m³ under a
      µg/m³ label; the pipeline divides by 1000.
    range: float
    minimum_value: 0
    unit: { ucum_code: ug/m3 }
    annotations: { ngsi_ld_kind: Property }
  temperature:
    slot_uri: sdm:temperature
    description: The day's mean air temperature at the station.
    range: float
    minimum_value: -40
    maximum_value: 50
    unit: { ucum_code: Cel }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  maxTemperature:
    slot_uri: jc:maxTemperature
    description: >-
      The day's highest air temperature at the station. A property of this model: the Smart Data
      Model WeatherObserved names only the mean.
    range: float
    minimum_value: -40
    maximum_value: 50
    unit: { ucum_code: Cel }
    annotations: { ngsi_ld_kind: Property }
  minTemperature:
    slot_uri: jc:minTemperature
    description: >-
      The day's lowest air temperature at the station. A property of this model: the Smart Data
      Model WeatherObserved names only the mean.
    range: float
    minimum_value: -40
    maximum_value: 50
    unit: { ucum_code: Cel }
    annotations: { ngsi_ld_kind: Property }
  relativeHumidity:
    slot_uri: sdm:relativeHumidity
    description: The day's mean relative humidity, as a fraction (0.57 is 57 %).
    range: float
    minimum_value: 0
    maximum_value: 1
    unit: { ucum_code: '1' }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  atmosphericPressure:
    slot_uri: sdm:atmosphericPressure
    description: The day's mean air pressure at the station's height (not reduced to sea level).
    range: float
    minimum_value: 0
    unit: { ucum_code: hPa }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  precipitation:
    slot_uri: sdm:precipitation
    description: The day's precipitation, in millimetres (litres per square metre).
    range: float
    minimum_value: 0
    unit: { ucum_code: mm }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  windSpeed:
    slot_uri: sdm:windSpeed
    description: The day's mean wind speed at 10 m.
    range: float
    minimum_value: 0
    unit: { ucum_code: m/s }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  windDirection:
    slot_uri: sdm:windDirection
    description: The day's mean wind direction at 10 m, in degrees from north.
    range: float
    minimum_value: 0
    maximum_value: 360
    unit: { ucum_code: deg }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  gustSpeed:
    slot_uri: sdm:gustSpeed
    description: The day's strongest gust at 10 m.
    range: float
    minimum_value: 0
    unit: { ucum_code: m/s }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  solarRadiation:
    slot_uri: sdm:solarRadiation
    description: >-
      The day's mean global solar irradiance: the day's irradiation the city gives in MJ/m², times
      10^6 / 86400.
    range: float
    minimum_value: 0
    unit: { ucum_code: W/m2 }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  altitude:
    slot_uri: jc:altitude
    description: >-
      The station's height above sea level in metres, as the weather service lists it. A fixed
      property of the station, written without a unit code so its rows are never read as a
      measurement stamped on receipt.
    range: float
    annotations: { ngsi_ld_kind: Property }
  waterTable:
    slot_uri: sdm:waterTable
    description: The depth from the surface to the water in the well at the newest reading.
    range: float
    minimum_value: 0
    unit: { ucum_code: m }
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  investigationDepth:
    slot_uri: sdm:investigationDepth
    description: >-
      The depth of the well or piezometer in metres. A fixed property of the well, written without
      a unit code so its rows are never read as a measurement stamped on receipt.
    range: float
    minimum_value: 0
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  piezometricLevel:
    slot_uri: jc:piezometricLevel
    description: >-
      The height of the water above sea level at the newest reading (below 0 where the sea draws
      the aquifer down). A property of this model: PhreaticObserved has only the depth.
    range: float
    unit: { ucum_code: m }
    annotations: { ngsi_ld_kind: Property }
  aquifer:
    slot_uri: jc:aquifer
    description: The groundwater body (massa d'aigua) the well reaches, as the water agency names it.
    annotations: { ngsi_ld_kind: Property }
  measurementType:
    slot_uri: sdm:measurementType
    description: What the well's readings measure; `depth` for each of the city's wells.
    multivalued: true
    range: MeasurementType
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  stationCode:
    slot_uri: jc:stationCode
    description: >-
      The station's code in the network that runs it: the Catalan air-quality network (XVPCA, the
      city's codi_eoi, such as `8019043`), the Meteocat weather network (such as `D5`) or the
      Catalan water agency's well register (ACA, such as `08019-0148`).
    pattern: ^[0-9A-Z][0-9A-Z-]{1,15}$
    examples:
      - value: '8019043'
      - value: D5
      - value: 08019-0148
    annotations: { ngsi_ld_kind: Property }
  startDate:
    slot_uri: schema:startDate
    description: >-
      The first day, local midnight in Europe/Madrid: of an event (the agenda publishes the
      day, its hours sit in a free-text timetable) or of a work on the public space.
    range: datetime
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
  endDate:
    slot_uri: schema:endDate
    description: >-
      The last day, local midnight in Europe/Madrid: of an event (absent when the agenda gives
      none) or the planned last day of a work on the public space.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
  category:
    slot_uri: sdm:category
    description: >-
      An Event's main category first, one of the platform's fifteen event codes (music,
      theatre-dance, film, exhibition-museum, festival-fair, sport, outdoor-nature,
      education-talk, children-family, hobby-workshop, food-market, history-heritage,
      faith-tradition, health-wellness, community-civic), then the Smart Data Models category it
      falls under where one fits, read from the first words of the Catalan name and absent when
      no rule matches. A PointOfInterest's family in the city's facility register first
      (culture-leisure, sports, education, social-services, public-administration,
      markets-shopping, information-centres, religious-services, environment, animals-plants,
      cemeteries, media, utility-companies, restaurants), then the register's own kind in
      Catalan (Biblioteques, Poliesportius).
    multivalued: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
  subCategory:
    slot_uri: sdm:subCategory
    description: The Smart Data Models sub-category where the name says it (music, theater).
    multivalued: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
  address:
    slot_uri: schema:address
    description: >-
      Where the station, the well, the event or the facility is, as the city publishes it, field
      by field (Smart Data Models' common PostalAddress); a field the source leaves out is absent.
    range: PostalAddress
    inlined: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models/blob/master/common-schema.json
  streetAddress:
    slot_uri: schema:streetAddress
    description: The street and the house number, or for a station its square, park or street corner.
    annotations:
      upstream_source: https://schema.org/streetAddress
  postalCode:
    slot_uri: schema:postalCode
    description: The postal code.
    annotations:
      upstream_source: https://schema.org/postalCode
  addressLocality:
    slot_uri: schema:addressLocality
    description: The town or the municipality.
    annotations:
      upstream_source: https://schema.org/addressLocality
  addressCountry:
    slot_uri: schema:addressCountry
    description: The country, as an ISO 3166-1 alpha-2 code.
    annotations:
      upstream_source: https://schema.org/addressCountry
  areaServed:
    slot_uri: sdm:areaServed
    description: >-
      Where the entity is as the city names it: the barri of a station or well, the place of a work
      (a street and number, a square, a park).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models
  dataProvider:
    slot_uri: sdm:dataProvider
    description: >-
      Who publishes the data the entity was read from, with the credit its licence asks for.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models
  district:
    slot_uri: sdm:district
    description: The city district (districte) the address lies in.
    annotations:
      upstream_source: https://github.com/smart-data-models/data-models/blob/master/common-schema.json
  contactPoint:
    slot_uri: schema:contactPoint
    description: The public telephone line the agenda or the facility register lists.
    range: ContactPoint
    inlined: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models/blob/master/common-schema.json
  telephone:
    slot_uri: schema:telephone
    description: A telephone number as the agenda writes it.
    annotations:
      upstream_source: https://schema.org/telephone
  source:
    slot_uri: sdm:source
    description: The open-data file or the Open Data BCN dataset the entity was read from.
    range: uri
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models

  districtCode:
    slot_uri: jc:districtCode
    description: >-
      The city's own two-digit code of the area: the district number 01..10, or for a barri its
      number 01..73, which runs across the whole city.
    pattern: ^[0-9]{2}$
    required: true
    annotations: { ngsi_ld_kind: Property }
  divisionLevel:
    slot_uri: jc:divisionLevel
    description: Which of the city's two divisions the area belongs to.
    range: DivisionLevel
    required: true
    annotations: { ngsi_ld_kind: Property }
  refParentDistrict:
    slot_uri: jc:refParentDistrict
    description: The district a barri belongs to.
    range: AdministrativeArea
    inverse: neighbourhoods
    inlined: false
    annotations: { ngsi_ld_kind: Relationship, on_delete: restrict }
  refDistrict:
    slot_uri: jc:refDistrict
    description: The district the work lies in, when it lies in one district only.
    range: AdministrativeArea
    inverse: cityWorks
    inlined: false
    annotations: { ngsi_ld_kind: Relationship, on_delete: restrict }
  refNeighbourhood:
    slot_uri: jc:refNeighbourhood
    description: The barri the crossing lies in; none for a crossing on the city's edge.
    range: AdministrativeArea
    inverse: pedestrianCrossings
    inlined: false
    annotations: { ngsi_ld_kind: Relationship, on_delete: restrict }
  pedestrianCrossings:
    slot_uri: jc:pedestrianCrossings
    description: The crossings in this barri, computed from their refNeighbourhood and never stored.
    range: PedestrianCrossing
    multivalued: true
    inverse: refNeighbourhood
    inlined: false
    annotations: { ngsi_ld_kind: Relationship }
  crossingType:
    slot_uri: jc:crossingType
    description: How the crossing is marked, from the city's typology (infraestructures-tipologia-pas-vianants).
    range: CrossingType
    required: true
    annotations: { ngsi_ld_kind: Property }
  crossingTypeLabel:
    slot_uri: jc:crossingTypeLabel
    description: The crossing's kind as the city writes it, in Catalan (Pas de pastilles, Pas de tacs, Pas de bicicletes).
    annotations: { ngsi_ld_kind: Property }
  markedArea:
    slot_uri: jc:markedArea
    description: The painted area of the crossing in square metres (unitCode MTK).
    range: float
    minimum_value: 0
    maximum_value: 500
    unit: { ucum_code: m2 }
    annotations: { ngsi_ld_kind: Property }
  neighbourhoods:
    slot_uri: jc:neighbourhoods
    description: The barris of this district, computed from their refParentDistrict and never stored.
    range: AdministrativeArea
    multivalued: true
    inverse: refParentDistrict
    inlined: false
    annotations: { ngsi_ld_kind: Relationship }
  cityWorks:
    slot_uri: jc:cityWorks
    description: The works that lie in this district only, computed from their refDistrict and never stored.
    range: CityWork
    multivalued: true
    inverse: refDistrict
    inlined: false
    annotations: { ngsi_ld_kind: Relationship }
  description:
    slot_uri: schema:description
    description: The work's description as the city publishes it, in Catalan.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://schema.org/description
  workNumber:
    slot_uri: sdm:workNumber
    description: The city's code of the work, such as 05-2025G0074 (district, year, number).
    pattern: ^[0-9]{2}-[0-9]{4}[A-Z][0-9]{4}$
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  workState:
    slot_uri: sdm:workState
    description: Where the work stands, in the Smart Data Model's terms.
    range: WorkState
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  workStateLabel:
    slot_uri: jc:workStateLabel
    description: The work's state as the city writes it, in Catalan (En execució, Aturada, Finalitzada).
    annotations: { ngsi_ld_kind: Property }
  workCategory:
    slot_uri: jc:workCategory
    description: The city's kind of work, in Catalan (Urbanització, Serveis, Clavegueram...).
    annotations: { ngsi_ld_kind: Property }
  contractingAuthority:
    slot_uri: sdm:contractingAuthority
    description: >-
      The work's promoter, a public body, utility or company; left out when it may name a person.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  tenderAmount:
    slot_uri: jc:tenderAmount
    description: The budget the work was put out to tender with, in euros.
    range: float
    minimum_value: 0
    annotations: { ngsi_ld_kind: Property }
  awardAmount:
    slot_uri: jc:awardAmount
    description: The budget the work was awarded for, in euros.
    range: float
    minimum_value: 0
    annotations: { ngsi_ld_kind: Property }
  territorialArea:
    slot_uri: sdm:territorialArea
    description: Every district the work touches, by name, separated by "; ".
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  seeAlso:
    slot_uri: sdm:seeAlso
    description: The work's page on the city's works site.
    range: uri
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models

classes:
  AirQualityObserved:
    class_uri: sdm:AirQualityObserved
    description: One air-quality station of Barcelona and its hourly means.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
      label:
        tag: label
        value:
          sk: Meranie kvality ovzdušia
          cs: Měření kvality ovzduší
          en: Air quality reading
          de: Luftqualitätsmessung
    slots:
      - name
      - dateObserved
      - pm10
      - pm25
      - no2
      - o3
      - so2
      - co
      - 'no'
      - nox
      - blackCarbon
      - stationCode
      - address
      - areaServed
      - dataProvider
      - source
  WeatherObserved:
    class_uri: sdm:WeatherObserved
    description: One Meteocat weather station in Barcelona and its newest day's values.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
    slots:
      - name
      - dateObserved
      - temperature
      - maxTemperature
      - minTemperature
      - relativeHumidity
      - atmosphericPressure
      - precipitation
      - windSpeed
      - windDirection
      - gustSpeed
      - solarRadiation
      - stationCode
      - altitude
      - address
      - areaServed
      - dataProvider
      - source
  PhreaticObserved:
    class_uri: sdm:PhreaticObserved
    description: One piezometer or well of Barcelona and its newest groundwater reading.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
    slots:
      - name
      - dateObserved
      - measurementType
      - waterTable
      - piezometricLevel
      - investigationDepth
      - aquifer
      - stationCode
      - address
      - areaServed
      - dataProvider
      - source
  AdministrativeArea:
    class_uri: jc:AdministrativeArea
    description: >-
      One district (10) or barri (73) of Barcelona, its outline and its code, as the Smart Data
      Model extension AdministrativeArea (PointOfInterest base).
    is_a: Entity
    annotations:
      upstream_source: https://github.com/marek-mraz/joinedcontext-deployment/blob/main/scripts/open-data/sdm/extensions/AdministrativeArea
    slots:
      - name
      - districtCode
      - divisionLevel
      - refParentDistrict
      - neighbourhoods
      - cityWorks
      - pedestrianCrossings
      - dataProvider
      - source
  CityWork:
    class_uri: sdm:CityWork
    description: >-
      One work on Barcelona's public space, in execution, stopped or finished within 30 days, with
      its outline, its dates and its promoter. The constructor is left out.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - name
      - description
      - workNumber
      - workState
      - workStateLabel
      - workCategory
      - startDate
      - endDate
      - contractingAuthority
      - tenderAmount
      - awardAmount
      - areaServed
      - territorialArea
      - refDistrict
      - seeAlso
      - dataProvider
      - source
    slot_usage:
      endDate: { required: true }
  PedestrianCrossing:
    class_uri: jc:PedestrianCrossing
    description: >-
      One pedestrian or cycle crossing painted on Barcelona's streets, from the city's street
      inventory, with its kind, its painted area and its barri. Smart Data Models has no crossing
      model; the class is the project's own, with SDM's common names where they exist (location,
      dataProvider, source).
    is_a: Entity
    slots: [crossingType, crossingTypeLabel, markedArea, refNeighbourhood, dataProvider, source]

  Event:
    class_uri: sdm:Event
    description: >-
      One activity of the Ajuntament's agendas (agenda diària, agenda cultural, agenda
      d'activitats esportives), the day it starts and ends, where it happens and its category.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
    slots: [name, startDate, endDate, category, subCategory, address, contactPoint, source]
  PointOfInterest:
    class_uri: sdm:PointOfInterest
    description: >-
      One facility of the city's register (Guia BCN equipaments): a library, a sports hall, a
      school, a market, a social services centre; its family, where it is and its telephone.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest
    slots: [name, category, address, contactPoint, source]
  PostalAddress:
    class_uri: schema:PostalAddress
    description: "The value of `address`: a postal address, never an entity of its own (Smart Data Models' common schema)."
    annotations:
      upstream_source: https://schema.org/PostalAddress
    slots: [streetAddress, postalCode, addressLocality, district, addressCountry]
  ContactPoint:
    class_uri: schema:ContactPoint
    description: 'The value of `contactPoint`: how to reach the organizer, never an entity of its own.'
    annotations:
      upstream_source: https://schema.org/ContactPoint
    slots: [telephone]

enums:
  MeasurementType:
    description: What a PhreaticObserved measures (Smart Data Models' enum).
    permissible_values:
      depth: {}
      volume: {}
      quality: {}
      other: {}
  DivisionLevel:
    permissible_values:
      district:
        description: A district (districte), 10 of them.
      neighbourhood:
        description: A barri, 73 of them, each inside one district.
  WorkState:
    description: The Smart Data Model CityWork workState values the city's states map to.
    permissible_values:
      open: { description: In execution (En execució). }
      other: { description: Stopped (Aturada). }
      completed: { description: Finished (Finalitzada). }
  CrossingType:
    description: The three kinds of crossing marking the city's typology names.
    permissible_values:
      stripes:
        description: Painted bars across the road, the zebra crossing (Pas de pastilles).
      blocks: { description: A crossing marked with painted square blocks (Pas de tacs). }
      cycle: { description: A crossing for bicycles (Pas de bicicletes). }
