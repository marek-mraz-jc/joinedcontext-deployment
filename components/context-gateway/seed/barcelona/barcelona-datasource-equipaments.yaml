# Open Data BCN's list of the `equipament-*` packages (Open Data BCN, CC BY 4.0, weekly): the city's
# register of facilities, one package per family. The pipeline takes the DataStore resource of
# each family it names and reads it with one SQL query; no credential. T-5265.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: bcn-equipaments
  namespace: barcelona
  title:
    ca: Equipaments de Barcelona (Open Data BCN)
    es: Equipamientos de Barcelona (Open Data BCN)
    en: Barcelona facilities (Open Data BCN)
spec:
  type: http
  http:
    url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/package_search?q=name:equipament-*&rows=50
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
