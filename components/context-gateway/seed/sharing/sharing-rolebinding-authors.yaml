# Who may propose an App in sharing (T-4911): its author, which makes demo.author the owner of
# a seeded App that carries no owner annotation (T-4910). A proposal still needs an approver.
apiVersion: joinedcontext.com/v1alpha1
kind: RoleBinding
metadata:
  name: sharing-authors
  namespace: org
spec:
  subjects:
    - user: demo.author@hel.fi
  role: app-editor
  scope:
    project: sharing
