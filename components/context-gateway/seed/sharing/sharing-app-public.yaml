# The App sharing matrix (T-4911): one of five copies of the sharing-probe bundle the Portal image
# ships (portal apps/sharing-probe); the five differ only in visibility.
# Anyone opens it, anonymous visitors included.
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: sharing-public
  namespace: sharing
  title: { en: Sharing probe (public) }
  description:
    en: 'Test page of the App sharing matrix, visibility public: who opens it and how many city-bike stations it shows them.'
  annotations: { joinedcontext.com/shipped-with: portal }
spec:
  kind: ui
  source:
    path: ./apps/sharing-public
  visibility: public
  lifecycle: published
  dataNeeds:
    - contextSpaceRef: { kind: ContextSpace, name: sharing-bikes }
      types: [BikeHireDockingStation]
      attrs: [name, location]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld]
