# The App sharing matrix (T-4911): one of five copies of the sharing-probe bundle the Portal image
# ships (portal apps/sharing-probe); the five differ only in visibility.
# Only a holder of its viewer role opens it (demo.bearer, through sharing-roles-viewer); everyone else signed in gets the 403 page.
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: sharing-roles
  namespace: sharing
  title: { en: Sharing probe (roles) }
  description:
    en: 'Test page of the App sharing matrix, visibility roles: who opens it and how many city-bike stations it shows them.'
  annotations: { joinedcontext.com/shipped-with: portal }
spec:
  kind: ui
  source:
    path: ./apps/sharing-roles
  # The Portal parses `build` for every App, a shipped one too (dev: "missing field `build`", T-5774).
  build: { node: '22' }
  visibility: roles
  lifecycle: published
  roles:
    - name: viewer
      title: { en: Viewer }
      description: Opens the probe and reads the station count.
  access:
    - role: viewer
      subjects:
        - group: sharing-roles-viewer
  dataNeeds:
    - contextSpaceRef: { kind: ContextSpace, name: sharing-bikes }
      types: [BikeHireDockingStation]
      attrs: [name, location]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld]
