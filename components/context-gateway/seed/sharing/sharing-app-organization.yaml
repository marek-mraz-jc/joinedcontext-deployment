# The App sharing matrix (T-4911): one of five copies of the sharing-probe bundle the Portal image
# ships (portal apps/sharing-probe); the five differ only in visibility.
# A person with a binding in force anywhere in the organization opens it (demo.neighbour, demo.member, demo.author).
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: sharing-organization
  namespace: sharing
  annotations:
    joinedcontext.com/shipped-with: portal
  title:
    en: "Sharing probe (organization)"
  description:
    en: "Test page of the App sharing matrix, visibility organization: who opens it and how many city-bike stations it shows them."
spec:
  kind: ui
  source:
    path: ./apps/sharing-organization
  visibility: organization
  lifecycle: published
  dataNeeds:
    - contextSpaceRef:
        kind: ContextSpace
        name: sharing-bikes
      types: [BikeHireDockingStation]
      attrs: [name, location]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld]
