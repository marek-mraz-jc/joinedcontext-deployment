apiVersion: joinedcontext.com/v1alpha1
kind: ContextSourceRegistration
metadata:
  name: prod-zilina-kpi
  namespace: zilina
  title: Prod zilina-kpi
spec:
  contextSpaceRef: zilina-kpi
  endpoint: https://api.smartcity.joinedcontext.com/api/endpoint/ricvfpfxtaxeyzf5c3b3es7ymc6unh3o
  information:
    - entities:
        - type: KeyPerformanceIndicator
  mode: auxiliary
  operations: [retrieveOps]
  federation: { identity: caller }
