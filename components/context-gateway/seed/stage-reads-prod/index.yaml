# file in this folder -> its path in the configuration repository (jc-core PATH_TEMPLATEs).
# Stage only (T-6545): an environment lists this folder in extraSeeds, and stage alone does. Each
# file registers one public prod Endpoint as a read-only source of the types stage held no rows of
# in the T-6502 sweep (evidence/T-6502/sweep-*.tsv, 2026-11-03), so a read on stage that prod can
# answer returns prod's entities. Dev keeps its own data and lists no such folder.
# mode auxiliary with retrieveOps: the broker forwards reads only and stage's own rows win (CIM 009
# 5.9.2.4; Antares tests/federation_loop.rs auxiliary_source_never_receives_unsafe_methods).
# federation.identity caller: for an address outside the platform jcctl writes no credential into
# the registration (jcctl csr_reconcile_tests no_identity_and_no_credential_reaches_the_broker), so
# prod answers stage as it answers any anonymous reader of its public Endpoints. A space of the
# list held none of the type on stage on any of its Endpoints, so prod's rows mix with nothing.
