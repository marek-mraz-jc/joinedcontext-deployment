# One KeyPerformanceIndicator per row of "Vývoj imisií v BBK" (T-4255); one row per station or source and year.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-vyvoj-imisii-v-bbk
  namespace: bbsk
  title:
    sk: Vývoj imisií v BBK
    en: Vývoj imisií v BBK
spec:
  class: scheduled
  enabled: false
  schedule: 45 4 20 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-vyvoj-imisii-v-bbk
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: replace
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
