apiVersion: joinedcontext.com/v1alpha1
kind: Project
metadata:
  name: bbsk
  namespace: org
  title: { sk: "Banskobystrický samosprávny kraj", en: "Banská Bystrica Self-Governing Region" }
  description:
    sk: "Kraj s 13 okresmi a 614 356 obyvateľmi; publikuje to, čo patrí kraju."
    en: "The region: 13 districts, 614 356 people, publishing what a region owns."
spec:
  organizationRef: hel
  # Three spaces (the raw cube rows, the indicators and the region's registers), one pipeline
  # per feed plus the one that computes the indicators, and two public endpoints: the indicators
  # the application reads and the registers (T-2783). Sized to what this project declares and no
  # more (PF-73).
  quotas:
    contextSpaces: 3
    residentPipelines: 14
    publicEndpoints: 2
    apps: 1
    ingestEventsPerSecond: 20
    agentRunsPerDay: 2000
    entitiesPerSpace: 15000
    requestsPerMinute: 600
