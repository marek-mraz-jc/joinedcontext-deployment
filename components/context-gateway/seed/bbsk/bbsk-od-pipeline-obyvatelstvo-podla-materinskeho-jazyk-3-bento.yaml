# The mapping of the od-obyvatelstvo-podla-materinskeho-jazyk-3 pipeline, generated from the T-4254 mapping: one KeyPerformanceIndicator per row of
# "Obyvateľstvo podľa materinského jazyka (2021), obce" (https://data.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-materinskeho-jazyka-2021-obce-fc02ff). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
        # anything else reads as a datetime (T-4288).
        map observed {
          let x = this
          root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
            $x.apply("datetime").value.catch(null)
          }
        }
        # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
        map stamped {
          root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "obyvatelstvo-podla-materinskeho-jazyk-3-" + [this.properties."IDN4"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "KeyPerformanceIndicator",
          "dOW": this.properties."DOW".apply("datetime"),
          "fACC": this.properties."FACC".apply("string"),
          "iDN4": this.properties."IDN4".apply("integer"),
          "nM4": this.properties."NM4".apply("string"),
          "iDN3": this.properties."IDN3".apply("integer"),
          "nM3": this.properties."NM3".apply("string"),
          "iDN2": this.properties."IDN2".apply("integer"),
          "nM2": this.properties."NM2".apply("string"),
          "vYMERA": this.properties."VYMERA".apply("float"),
          "nUTS1": this.properties."NUTS1".apply("string"),
          "nUTS1CODE": this.properties."NUTS1_CODE".apply("string"),
          "nUTS2": this.properties."NUTS2".apply("string"),
          "nUTS2CODE": this.properties."NUTS2_CODE".apply("string"),
          "nUTS3": this.properties."NUTS3".apply("string"),
          "nUTS3CODE": this.properties."NUTS3_CODE".apply("string"),
          "lAU1": this.properties."LAU1".apply("string"),
          "lAU1CODE": this.properties."LAU1_CODE".apply("string"),
          "lAU2": this.properties."LAU2".apply("string"),
          "lAU2CODE": this.properties."LAU2_CODE".apply("string"),
          "kod": this.properties."Kód".apply("string"),
          "uzemnaJednotka": this.properties."Územná_jednotka".apply("string"),
          "spolu": this.properties."Spolu".apply("integer"),
          "slovenskyAbs": this.properties."slovenský__abs__".apply("integer"),
          "slovensky": this.properties."slovenský____".apply("float"),
          "madarskyAbs": this.properties."maďarský__abs__".apply("integer"),
          "madarsky": this.properties."maďarský____".apply("float"),
          "romskyAbs": this.properties."rómsky__abs__".apply("integer"),
          "romsky": this.properties."rómsky____".apply("float"),
          "rusinskyAbs": this.properties."rusínsky__abs__".apply("integer"),
          "rusinsky": this.properties."rusínsky____".apply("float"),
          "ceskyAbs": this.properties."český__abs__".apply("integer"),
          "cesky": this.properties."český____".apply("float"),
          "ukrajinskyAbs": this.properties."ukrajinský__abs__".apply("integer"),
          "ukrajinsky": this.properties."ukrajinský____".apply("float"),
          "nemeckyAbs": this.properties."nemecký__abs__".apply("integer"),
          "nemecky": this.properties."nemecký____".apply("float"),
          "polskyAbs": this.properties."poľský__abs__".apply("integer"),
          "polsky": this.properties."poľský____".apply("float"),
          "ruskyAbs": this.properties."ruský__abs__".apply("integer"),
          "rusky": this.properties."ruský____".apply("float"),
          "vietnamskyAbs": this.properties."vietnamský__abs__".apply("integer"),
          "vietnamsky": this.properties."vietnamský____".apply("float"),
          "anglickyAbs": this.properties."anglický__abs__".apply("integer"),
          "anglicky": this.properties."anglický____".apply("float"),
          "chorvatskyAbs": this.properties."chorvátsky__abs__".apply("integer"),
          "chorvatsky": this.properties."chorvátsky____".apply("float"),
          "srbskyAbs": this.properties."srbský__abs__".apply("integer"),
          "srbsky": this.properties."srbský____".apply("float"),
          "talianskyAbs": this.properties."taliansky__abs__".apply("integer"),
          "taliansky": this.properties."taliansky____".apply("float"),
          "jidisAleboHebrejskyAbs": this.properties."jidiš_alebo_hebrejský__abs__".apply("integer"),
          "jidisAleboHebrejsky": this.properties."jidiš_alebo_hebrejský____".apply("float"),
          "arabskyAbs": this.properties."arabský__abs__".apply("integer"),
          "arabsky": this.properties."arabský____".apply("float"),
          "francuzskyAbs": this.properties."francúzsky__abs__".apply("integer"),
          "francuzsky": this.properties."francúzsky____".apply("float"),
          "rumunskyAbs": this.properties."rumunský__abs__".apply("integer"),
          "rumunsky": this.properties."rumunský____".apply("float"),
          "albanskyAbs": this.properties."albánsky__abs__".apply("integer"),
          "albansky": this.properties."albánsky____".apply("float"),
          "spanielskyAbs": this.properties."španielsky__abs__".apply("integer"),
          "spanielsky": this.properties."španielsky____".apply("float"),
          "slovenskyPosunkovyJazykAbs": this.properties."slovenský_posunkový_jazyk__abs_".apply("integer"),
          "slovenskyPosunkovyJazyk": this.properties."slovenský_posunkový_jazyk____".apply("float"),
          "cinskyAbs": this.properties."čínsky__abs__".apply("integer"),
          "cinsky": this.properties."čínsky____".apply("float"),
          "bulharskyAbs": this.properties."bulharský__abs__".apply("integer"),
          "bulharsky": this.properties."bulharský____".apply("float"),
          "korejskyAbs": this.properties."kórejský__abs__".apply("integer"),
          "korejsky": this.properties."kórejský____".apply("float"),
          "tureckyAbs": this.properties."turecký__abs__".apply("integer"),
          "turecky": this.properties."turecký____".apply("float"),
          "perzskyAbs": this.properties."perzský__abs__".apply("integer"),
          "perzsky": this.properties."perzský____".apply("float"),
          "inyAbs": this.properties."iný__abs__".apply("integer"),
          "iny": this.properties."iný____".apply("float"),
          "nezistenyAbs": this.properties."nezistený__abs__".apply("integer"),
          "nezisteny": this.properties."nezistený____".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mapa_SODB_2021_materinsk%C3%BD_jazyk/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN4,NM4,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,LAU2,LAU2_CODE,K%C3%B3d,%C3%9Azemn%C3%A1_jednotka,Spolu,slovensk%C3%BD__abs__,slovensk%C3%BD____,ma%C4%8Farsk%C3%BD__abs__,ma%C4%8Farsk%C3%BD____,r%C3%B3msky__abs__,r%C3%B3msky____,rus%C3%ADnsky__abs__,rus%C3%ADnsky____,%C4%8Desk%C3%BD__abs__,%C4%8Desk%C3%BD____,ukrajinsk%C3%BD__abs__,ukrajinsk%C3%BD____,nemeck%C3%BD__abs__,nemeck%C3%BD____,po%C4%BEsk%C3%BD__abs__,po%C4%BEsk%C3%BD____,rusk%C3%BD__abs__,rusk%C3%BD____,vietnamsk%C3%BD__abs__,vietnamsk%C3%BD____,anglick%C3%BD__abs__,anglick%C3%BD____,chorv%C3%A1tsky__abs__,chorv%C3%A1tsky____,srbsk%C3%BD__abs__,srbsk%C3%BD____,taliansky__abs__,taliansky____,jidi%C5%A1_alebo_hebrejsk%C3%BD__abs__,jidi%C5%A1_alebo_hebrejsk%C3%BD____,arabsk%C3%BD__abs__,arabsk%C3%BD____,franc%C3%BAzsky__abs__,franc%C3%BAzsky____,rumunsk%C3%BD__abs__,rumunsk%C3%BD____,alb%C3%A1nsky__abs__,alb%C3%A1nsky____,%C5%A1panielsky__abs__,%C5%A1panielsky____,slovensk%C3%BD_posunkov%C3%BD_jazyk__abs_,slovensk%C3%BD_posunkov%C3%BD_jazyk____,%C4%8D%C3%ADnsky__abs__,%C4%8D%C3%ADnsky____,bulharsk%C3%BD__abs__,bulharsk%C3%BD____,k%C3%B3rejsk%C3%BD__abs__,k%C3%B3rejsk%C3%BD____,tureck%C3%BD__abs__,tureck%C3%BD____,perzsk%C3%BD__abs__,perzsk%C3%BD____,in%C3%BD__abs__,in%C3%BD____,nezisten%C3%BD__abs__,nezisten%C3%BD____&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-materinskeho-jazyka-2021-obce-fc02ff" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
