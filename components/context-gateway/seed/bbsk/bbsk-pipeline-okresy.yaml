# One AdministrativeArea per record of `bbsk-okresy`, written into the register space through its one Endpoint (PL-18, T-2783).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: okresy
  namespace: bbsk
  title: { sk: "Okresy kraja", en: "Districts of the region" }
spec:
  class: auto
  # A register the region revises a few times a year: weekly is already more than it needs (PL-26).
  period: 168h
  schedule: "37 3 * * 1"
  source:
    dataSourceRef: { kind: DataSource, name: bbsk-okresy }
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-registre:bbsk-registre
  output:
    type: AdministrativeArea
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
