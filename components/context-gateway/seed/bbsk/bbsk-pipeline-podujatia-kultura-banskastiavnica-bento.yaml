          let month = $m.m.or("").(v -> if v == "" { 0 } else { v.number().int64() })
          let dom = $m.d.or("").(v -> if v == "" { 0 } else { v.number().int64() })
          let guess = "%04d-%02d-%02d".format($year, $month, $dom)
          let passed = $guess.ts_parse("2006-01-02").ts_unix().catch(this.now) < this.now - 86400
          let y = if $m.y.or("") != "" { $m.y.number().int64() } else if $passed { $year + 1 } else { $year }
          let day = if $month < 1 || $month > 12 || $dom < 1 { null } else { "%04d-%02d-%02d".format($y, $month, $dom) }
