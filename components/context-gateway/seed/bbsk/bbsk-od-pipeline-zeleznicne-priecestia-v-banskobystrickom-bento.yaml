# The mapping of the od-zeleznicne-priecestia-v-banskobystrickom pipeline, generated from the T-4254 mapping: one RoadStructure per row of
# "Železničné priecestia v Banskobystrickom kraji (public view)" (https://data.dev.joinedcontext.com/dataset/bbsk-zeleznicne-priecestia-v-banskobystrickom-kraji-public-view-89feb8). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "zeleznicne-priecestia-v-banskobystrickom-" + [this.properties."Identifikacne_čislo_žel__priec_"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("RoadStructure", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "RoadStructure",
          "triedaPK": this.properties."Trieda_PK".apply("string"),
          "cisloPK": this.properties."Číslo_PK".apply("string"),
          "name": this.properties."Identifikacne_čislo_žel__priec_".apply("string"),
          "pocetKolaji": this.properties."Počet_kolaji".apply("integer"),
          "rokStavby": this.properties."rok_Stavby".apply("integer"),
          "druhZabezpecenia": this.properties."Druh_zabezpečenia".apply("string"),
          "kraj": this.properties."Kraj".apply("string"),
          "okres": this.properties."Okres".apply("string"),
          "vlastnik": this.properties."Vlastník".apply("string"),
          "typSpravcu": this.properties."Typ_Spravcu".apply("string"),
          "spravca": this.properties."Spravca".apply("string"),
          "najblizsiKM": this.properties."Najbližši_KM".apply("float"),
          "jICZSR": this.properties."JIČ_ŽSR".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/%C5%BDelezni%C4%8Dn%C3%A9_priecestia_v_Banskobystrickom_kraji_(public_view)/FeatureServer/2/query?where=1%3D1&outFields=Trieda_PK,%C4%8C%C3%ADslo_PK,Identifikacne_%C4%8Dislo_%C5%BEel__priec_,Po%C4%8Det_kolaji,rok_Stavby,Druh_zabezpe%C4%8Denia,Kraj,Okres,Vlastn%C3%ADk,Typ_Spravcu,Spravca,Najbli%C5%BE%C5%A1i_KM,JI%C4%8C_%C5%BDSR&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-zeleznicne-priecestia-v-banskobystrickom-kraji-public-view-89feb8" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
