# One Hospital per record of `bbsk-nemocnice`, written into the register space through its one Endpoint (PL-18, T-2783).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: nemocnice
  namespace: bbsk
  title: { sk: "Nemocnice v kraji", en: "Hospitals in the region" }
spec:
  class: auto
  # A register the region revises a few times a year: weekly is already more than it needs (PL-26).
  period: 168h
  schedule: "49 3 * * 1"
  source:
    dataSourceRef: { kind: DataSource, name: bbsk-nemocnice }
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-registre:bbsk-registre
  output:
    type: Hospital
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
