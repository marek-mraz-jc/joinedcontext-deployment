# The mapping of the od-peticie pipeline, generated from the T-4254 mapping: one Petition per row of
# "Petície" (https://opendata.dev.joinedcontext.com/dataset/bbsk-peticie-f80530). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
        # anything else reads as a datetime (T-4288).
        map observed {
          let x = this
          root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
            $x.apply("datetime").value.catch(null)
          }
        }
        # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
        map stamped {
          root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "peticie-" + {"P_č_": this.properties."P_č_", "Vybavovateľ_petície": this.properties."Vybavovateľ_petície", "Názov_petície": this.properties."Názov_petície", "Text": this.properties."Text", "Je_kvórová": this.properties."Je_kvórová", "Dátum_doručenia": this.properties."Dátum_doručenia", "Dátum_vybavenia": this.properties."Dátum_vybavenia", "Zverejnenie_výsledku_vybavenia": this.properties."Zverejnenie_výsledku_vybavenia", "Počet_osôb_podporujúcich_petíci": this.properties."Počet_osôb_podporujúcich_petíci", "Spôsob_vybavenia": this.properties."Spôsob_vybavenia", "Poznámka": this.properties."Poznámka", "Link": this.properties."Link"}.format_json(no_indent: true).hash("sha256").encode("hex").slice(0, 24).re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("Petition", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "Petition",
          "identifier": this.properties."P_č_".apply("string"),
          "vybavovatelPeticie": this.properties."Vybavovateľ_petície".apply("string"),
          "name": this.properties."Názov_petície".apply("string"),
          "text": this.properties."Text".apply("string"),
          "jeKvorova": this.properties."Je_kvórová".apply("string"),
          "datumDorucenia": this.properties."Dátum_doručenia".apply("date"),
          "datumVybavenia": this.properties."Dátum_vybavenia".apply("date"),
          "zverejnenieVysledkuVybavenia": this.properties."Zverejnenie_výsledku_vybavenia".apply("date"),
          "pocetOsobPodporujucichPetici": this.properties."Počet_osôb_podporujúcich_petíci".apply("integer"),
          "sposobVybavenia": this.properties."Spôsob_vybavenia".apply("string"),
          "poznamka": this.properties."Poznámka".apply("string"),
          "link": this.properties."Link".apply("string"),
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Pet%C3%ADcie/FeatureServer/0/query?where=1%3D1&outFields=P_%C4%8D_,Vybavovate%C4%BE_pet%C3%ADcie,N%C3%A1zov_pet%C3%ADcie,Text,Je_kv%C3%B3rov%C3%A1,D%C3%A1tum_doru%C4%8Denia,D%C3%A1tum_vybavenia,Zverejnenie_v%C3%BDsledku_vybavenia,Po%C4%8Det_os%C3%B4b_podporuj%C3%BAcich_pet%C3%ADci,Sp%C3%B4sob_vybavenia,Pozn%C3%A1mka,Link&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-peticie-f80530" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
