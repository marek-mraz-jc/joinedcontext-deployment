# The mapping of the od-cykloturisticke-trasy-linie pipeline, generated from the T-4254 mapping: one CycleRoute per row of
# "Cykloturistické trasy - línie" (https://data.dev.joinedcontext.com/dataset/bbsk-cykloturisticke-trasy-linie-e6a1a7). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "cykloturisticke-trasy-linie-" + [this.properties."id"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("CycleRoute", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "CycleRoute",
          "sourceId": this.properties."id".apply("string"),
          "stav": this.properties."stav".apply("string"),
          "zdroj": this.properties."zdroj".apply("string"),
          "ctt": this.properties."ctt".apply("string"),
          "nazov": this.properties."nazov".apply("string"),
          "layer": this.properties."layer".apply("string"),
          "farba": this.properties."farba".apply("string"),
          "spr": this.properties."spr".apply("string"),
          "dlzka": this.properties."dlzka".apply("float"),
          "name": this.properties."name".apply("string"),
          "fName": this.properties."f_name".apply("string"),
          "obnRok": this.properties."obn_rok".apply("string"),
          "typ": this.properties."typ".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/2019_linie_CTT_ML/FeatureServer/0/query?where=1%3D1&outFields=id,stav,zdroj,ctt,nazov,layer,farba,spr,dlzka,name,f_name,obn_rok,typ&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-cykloturisticke-trasy-linie-e6a1a7" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
