# Generated by seeds/bbsk-events/generate.py from the inventory row Banská Bystrica (umb-cms),
# read 2026-10-21: https://www.ff.umb.sk/filozoficka-fakulta-umb/kalendar-udalosti/ (T-4896). Do not edit: change the template or the CSV.
pipeline:
  processors:
  - mapping: |
      let paths = content().string().re_find_all_object("<h3 class=\"title\"><a href=\"(?:https://www\\.ff\\.umb\\.sk)?(?P<p>/filozoficka\\-fakulta\\-umb/kalendar\\-udalosti/[A-Za-z0-9._~%/-]{1,300}\\.html)\"").map_each(m -> m.p).unique()
      root = $paths.slice(0, [$paths.length(), 50].min()).map_each(p -> { "url": "https://www.ff.umb.sk" + p, "path": p, "sourceId": p })
  - unarchive:
      format: json_array
  - branch:
      request_map: |
        root = if this.path.contains("..") { deleted() } else { "" }
        meta event_path = this.path.trim_prefix("/")
      processors:
      - sleep:
          duration: 1s
      - http:
          url: https://www.ff.umb.sk/${! @event_path }
          verb: GET
          headers:
            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
            Accept: text/html
          timeout: 20s
          retries: 1
      result_map: |
        # "3. 11. 2026, 8:30" is Bratislava's wall time; "3. 11. 2026" alone a whole day.
        map at {
          let m = this.or("").re_find_object("^(?P<d>[0-9]{1,2})\\. ?(?P<m>[0-9]{1,2})\\. ?(?P<y>[0-9]{4})(?:,? *(?P<h>[0-9]{1,2}):(?P<i>[0-9]{2}))?")
          let day = if $m.y.or("") == "" { null } else { "%s-%02d-%02d".format($m.y, $m.m.number().int64(), $m.d.number().int64()) }
          let local = if $day != null && $m.h.or("") != "" { "%sT%02d:%s:00".format($day, $m.h.number().int64(), $m.i) } else { null }
          root = if $local != null { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") } else { $day }
        }
        let page = content().string()
        let table = $page.re_find_object("<table class=\"eventTable\">(?P<t>[\\s\\S]*?)</table>").t.or("")
        let rows = $table.re_find_all_object("<td><strong>(?P<k>[^<]{1,120})</strong></td><td>(?P<v>[\\s\\S]*?)</td></tr>").fold({}, acc -> acc.tally.merge({ (acc.value.k.unescape_html().re_replace_all("[\\s:]+$", "").re_replace_all("\\s*\\(.*$", "").trim()): acc.value.v.strip_html().unescape_html().re_replace_all("\\s+", " ").trim() }))
        root.name = $page.re_find_object("<h1 class=\"title_big[^\"]*\">(?P<v>[^<]{1,500})</h1>").v.or(null).(v -> if v != null { v.unescape_html() } else { null })
        root.start = $rows."Začiatok".or(null).apply("at")
        root.end = $rows.Koniec.or(null).apply("at")
        root.venue = $rows.Miesto.or(null)
        root.locality = $rows.Mesto.or(null)
        root.category = $rows."Kategória".or(null)
        # "Iné" (other) is the CMS's placeholder, no organizer: the calendar's own body stands in (T-5081).
        root.organizer = $rows."Usporiadateľ".or(null).(o -> if o != null && o != "" && o != "Iné" { { "name": o } } else { null })
  - archive:
      format: json_array
  - mapping: |
      # The end as unix seconds: a datetime end as written, a whole-day end the next midnight
      # (CET, so up to an hour late in summer), no end the start plus a day (owner 2026-10-20).
      map unix {
        root = if this == null { null } else if this.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { this.ts_parse("2006-01-02").ts_unix() - 3600 } else { this.ts_unix().catch(null) }
      }
      let now = timestamp_unix()
      let records = this.map_each(r -> r.merge({
        "_start": r.start.apply("unix"),
        "_end": if r.end != null && r.end.apply("unix") != null {
          r.end.apply("unix") + if r.end.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { 86400 } else { 0 }
        } else { r.start.apply("unix").(s -> if s != null { s + 86400 } else { null }) }
      }))
      # Only upcoming events (owner 2026-10-20): one whose end (plus the store's grace, a day in the national
      # store) is past is never loaded. A record with no readable start stays, so the model check refuses it
      # where the run report shows it.
      let upcoming = $records.filter(r -> r._end == null || r._end + 0 >= $now)
      let dated = $upcoming.filter(r -> r._start != null).sort_by(r -> r._start)
      root = $dated.slice(0, [$dated.length(), 100].min()).concat($upcoming.filter(r -> r._start == null))
  - unarchive:
      format: json_array
  - mapping: |
      map key {
        root = this.lowercase().re_replace_all("\\([^)]*\\)", " ").re_replace_all("[,;]", " ").re_replace_all("\\s+", " ").trim()
      }
      map text {
        root = if this == null { null } else { this.string().strip_html().unescape_html().re_replace_all("\\s+", " ").trim().(t -> if t == "" { null } else { t }) }
      }
      map prop {
        root = if this == null { null } else { { "type": "Property", "value": this } }
      }
      let venues = [{"match":"jilemnického 48 banská bystrica","town":"banska-bystrica","venue":"Verejná knižnica Mikuláša Kováča","streetAddress":"Jilemnického 48","addressLocality":"Banská Bystrica","lat":48.7303957,"lon":19.1271483},{"match":"cpdv umb cesta na amfiteáter 1 učebňa č. 507","town":"banska-bystrica","venue":"CPDV UMB, Cesta na amfiteáter 1 (nová budova EF UMB), učebňa č. 507 (5. poschodie, za dverami vedľa výťahov)","streetAddress":"Cesta na amfiteáter 2728/1","addressLocality":"Banská Bystrica","lat":48.7395768,"lon":19.1376321},{"match":"štúdio tanca komenského 837","town":"banska-bystrica","venue":"Štúdio tanca, Komenského 837","streetAddress":"Komenského","addressLocality":"Banská Bystrica","lat":48.7427551,"lon":19.148376},{"match":"cesta na amfiteáter 1 aula rotunda","town":"banska-bystrica","venue":"Cesta na amfiteáter 1, Aula Rotunda","streetAddress":"Cesta na amfiteáter 2728/1","addressLocality":"Banská Bystrica","lat":48.7395768,"lon":19.1376321},{"match":"veľká zasadačka a veľký študijný hub tajovského 40","town":"banska-bystrica","venue":"Veľká zasadačka a veľký študijný hub, Tajovského 40 (SĎ 1)","streetAddress":"Tajovského 3767/40","addressLocality":"Banská Bystrica","lat":48.7421184,"lon":19.1212729},{"match":"fpvamv umb kuzmányho 1","town":"banska-bystrica","venue":"FPVaMV UMB, Kuzmányho 1","streetAddress":"Karola Kuzmányho 220/1","addressLocality":"Banská Bystrica","lat":48.7327705,"lon":19.1452633},{"match":"v-klub umb tajovského 40","town":"banska-bystrica","venue":"V-Klub UMB, Tajovského 40","streetAddress":"Tajovského 3767/40","addressLocality":"Banská Bystrica","lat":48.7421184,"lon":19.1212729},{"match":"europa shopping center","town":"banska-bystrica","venue":"Europa shopping center","streetAddress":"Na Troskách 14180/25","addressLocality":"Banská Bystrica","lat":48.7302094,"lon":19.1358859},{"match":"športový areál baseline švermova 6515/38a","town":"banska-bystrica","venue":"Športový areál BASELINE, Švermova 6515/38A","streetAddress":"Švermova 6515/38A","addressLocality":"Banská Bystrica","lat":48.7348153,"lon":19.1258807},{"match":"tipsport aréna banská bystrica","town":"banska-bystrica","venue":"Tipsport Aréna Banská Bystrica","streetAddress":"Hronské predmestie","addressLocality":"Banská Bystrica","lat":48.7338929,"lon":19.1558658},{"match":"aula beliana tajovského 40 banská bystrica.","town":"banska-bystrica","venue":"aula Beliana, Tajovského 40, Banská Bystrica.","streetAddress":"Tajovského 3767/40","addressLocality":"Banská Bystrica","lat":48.7421184,"lon":19.1212729},{"match":"telocvičňa ftvšaz umb tajovského 40","town":"banska-bystrica","venue":"Telocvičňa FTVŠaZ UMB, Tajovského 40","streetAddress":"Tajovského 3767/40","addressLocality":"Banská Bystrica","lat":48.7421184,"lon":19.1212729},{"match":"atletický štadión umb tajovského 57","town":"banska-bystrica","venue":"Atletický štadión UMB, Tajovského 57","streetAddress":"Tajovského 14450/57","addressLocality":"Banská Bystrica","lat":48.7402926,"lon":19.1202203},{"match":"stará tržnica","town":"banska-bystrica","venue":"Stará Tržnica","streetAddress":"Námestie Štefana Moyzesa 1093/29","addressLocality":"Banská Bystrica","lat":48.7371097,"lon":19.1458585},{"match":"emerge hub tajovského 40","town":"banska-bystrica","venue":"EMERGE HUB, Tajovského 40","streetAddress":"Tajovského 3767/40","addressLocality":"Banská Bystrica","lat":48.7421184,"lon":19.1212729},{"match":"park pod pamätníkom snp","town":"banska-bystrica","venue":"Park pod Pamätníkom SNP","streetAddress":null,"addressLocality":"Banská Bystrica","lat":48.7351892,"lon":19.1507932},{"match":"aula beliana","town":"banska-bystrica","venue":"Aula Beliana","streetAddress":"Tajovského 3767/40","addressLocality":"Banská Bystrica","lat":48.7421184,"lon":19.1212729},{"match":"aula fpvamv umb","town":"banska-bystrica","venue":"Aula FPVaMV UMB","streetAddress":"Karola Kuzmányho 220/1","addressLocality":"Banská Bystrica","lat":48.7327705,"lon":19.1452633}]
      let name = this.name.apply("text")
      let venue_text = this.venue.apply("text")
      let venue_key = if $venue_text != null { $venue_text.apply("key") } else { "" }
      let known = $venues.filter(v -> v.match == $venue_key).index(0).catch(null)
      # GPS from the feed, else from the venue table checked by hand; never a town's centre (owner
      # 2026-10-20). An event with neither keeps no location and the model check refuses it.
      let lat = this.lat.number().catch($known.lat.or(null))
      let lon = this.lon.number().catch($known.lon.or(null))
      let point = if $lat != null && $lon != null && $lat >= 47.7 && $lat <= 49.7 && $lon >= 16.8 && $lon <= 22.6 { { "type": "Point", "coordinates": [$lon, $lat] } } else { null }
      let locality = this.locality.apply("text").or($known.addressLocality.or("Banská Bystrica"))
      let town = $known.town.or("banska-bystrica")
      # One event announced by two sources is one entity: the id hashes the name, the start (to the
      # minute in UTC, or the day) and the town, the dedup key of the Event model (T-4895).
      let start_key = if this._start == null { null } else if this.start.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { this.start } else { this._start.ts_format("2006-01-02T15:04Z", "UTC") }
      let key = if $name != null && $start_key != null { "%s|%s|%s".format($name.lowercase(), $start_key, $locality.or("").lowercase()) } else { "source|" + this.url.or(this.sourceId).or("").string() }
      let address = {
        "streetAddress": this.streetAddress.apply("text").or($known.streetAddress.or(null)),
        "postalCode": this.postalCode.apply("text"),
        "addressLocality": $locality,
        "addressRegion": "Banskobystrický kraj",
        "addressCountry": "SK"
      }.filter(kv -> kv.value != null && kv.value != "")
      map link {
        root = if this == null { null } else { this.string().trim().(u -> if u.re_match("^https?://[^\\s/@]+(/\\S*)?$") && u.length() <= 2000 { u } else { null }) }
      }
      # The organizer the feed names, else the body whose calendar this is (the inventory row); an aggregator's
      # row names none, so its event without an organizer is refused (T-5081). Name and web site only: a feed's
      # organizer e-mail or phone may be a person's and stays on the source's page.
      map uncontact {
        root = if this == null { null } else { this.re_replace_all("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "").re_replace_all("(\\+421|\\b0)[0-9][0-9 /]{7,}[0-9]", "").re_replace_all("(?i)\\b(tel|mobil|e-?mail|kontakt)\\.?:?", "").re_replace_all("\\s+", " ").re_replace_all("^[ ,;:-]+|[ ,;:-]+$", "").(t -> if t == "" { null } else { t }) }
      }
      let named = this.organizer.name.or(null).apply("text").apply("uncontact")
      let organizer = if $named != null { { "name": $named.slice(0, [$named.length(), 300].min()), "url": this.organizer.url.or(null).apply("link") }.filter(kv -> kv.value != null) } else { {"name": "Filozofická fakulta UMB", "url": "https://www.ff.umb.sk"} }
      # The event's own page, else the organizer's page listing its events: every event carries a link a person opens.
      let link = this.url.apply("link").or("https://www.ff.umb.sk/filozoficka-fakulta-umb/kalendar-udalosti/")
      let now = timestamp_unix()
      let lease = null
      let ends = if this._end == null { null } else { this._end + 0 }
      let expires = if $lease == null { $ends } else if $ends == null { $now + $lease } else { [$ends, $now + $lease].min() }
      root = {
        "id": "urn:ngsi-ld:Event:%s:%s".format(env("JC_SPACE"), $key.hash("sha256").encode("hex").slice(0, 16)),
        "type": "Event",
        # The scope comes from the inventory row's region and town, never from the feed (T-4898). A
        # scope level is letters, digits and "_" (CIM 009 4.18): the broker refuses a hyphen (T-5051).
        "scope": if $town != null { "/SK/BB" + "/" + $town.replace_all("-", "_") } else { "/SK/BB" },
        "name": $name.apply("prop"),
        "startDate": this.start.apply("prop"),
        "endDate": this.end.apply("prop"),
        "location": if $point != null { { "type": "GeoProperty", "value": $point } } else { null },
        "venue": $known.venue.or($venue_text).apply("prop"),
        "address": { "type": "Property", "value": $address },
        "eventCategory": this.category.apply("text").apply("prop"),
        # A source that states no licence gives its facts only: what, when, where and the link back
        # (integrator 2026-10-20, T-4894); its text stays on its own page.
        # Contact e-mails and phone numbers stay on the source's page: they may name a person.
        "description": if true { null } else { this.description.apply("text").(d -> if d != null { d.re_replace_all("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "").re_replace_all("(\\+421|\\b0)[0-9][0-9 /]{7,}[0-9]", "").re_replace_all("\\s+", " ").trim() } else { null }).(d -> if d != null && d != "" { d.slice(0, [d.length(), 2000].min()) } else { null }).apply("prop") },
        "url": $link.apply("prop"),
        "organizer": $organizer.apply("prop"),
        "source": { "type": "Property", "value": "https://www.ff.umb.sk/filozoficka-fakulta-umb/kalendar-udalosti/" },
        "sourceId": this.sourceId.string().catch(null).apply("prop"),
        "dataProvider": { "type": "Property", "value": "Banská Bystrica, ff.umb.sk (licencia neuvedená)" },
        "dateModified": this.modified.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null).apply("prop"),
        # The event leaves the space when it is over (owner 2026-10-20, DM-130), or, in a store with a lease, when
        # no run has seen it for the lease: an event its source dropped or cancelled ends too (T-5047).
        "expiresAt": $expires.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)
      }.filter(kv -> kv.value != null)
  - archive:
      format: json_array
