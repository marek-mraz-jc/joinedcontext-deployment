# The mapping of the od-stredne-skoly-v-banskobystrickom-kraji pipeline, generated from the T-4254 mapping: one School per row of
# "Stredné školy v Banskobystrickom kraji" (https://data.dev.joinedcontext.com/dataset/bbsk-stredne-skoly-v-banskobystrickom-kraji-581554). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "stredne-skoly-v-banskobystrickom-kraji-" + [this.properties."KODSKO"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("School", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "School",
          "eDUID": this.properties."EDUID".apply("string"),
          "kODSKO": this.properties."KODSKO".apply("string"),
          "iCO": this.properties."ICO".apply("string"),
          "hierarchia": this.properties."Hierarchia".apply("string"),
          "druhSaSZ": this.properties."DruhSaSZ".apply("string"),
          "druhSaSZKod": this.properties."DruhSaSZKod".apply("string"),
          "typSaSZ": this.properties."TypSaSZ".apply("string"),
          "typSaSZKod": this.properties."TypSaSZKod".apply("string"),
          "typSaSZSkratka": this.properties."TypSaSZSkratka".apply("string"),
          "nazov": this.properties."Nazov".apply("string"),
          "nazovSkrateny": this.properties."NazovSkrateny".apply("string"),
          "kraj": this.properties."Kraj".apply("string"),
          "okres": this.properties."Okres".apply("string"),
          "obec": this.properties."Obec".apply("string"),
          "ulica": this.properties."Ulica".apply("string"),
          "supisneCislo": this.properties."SupisneCislo".apply("string"),
          "orientacneCislo": this.properties."OrientacneCislo".apply("string"),
          "pSC": this.properties."PSC".apply("string"),
          "datumZaciatkuVyucovacejCinnosti": this.properties."DatumZaciatkuVyucovacejCinnosti".apply("datetime"),
          "datumZaniku": this.properties."DatumZaniku".apply("string"),
          "datumZriadenia": this.properties."DatumZriadenia".apply("datetime"),
          "datumZrusenia": this.properties."DatumZrusenia".apply("string"),
          "sTAV": this.properties."STAV".apply("string"),
          "pravnaForma": this.properties."PravnaForma".apply("string"),
          "pravnaFormaKod": this.properties."PravnaFormaKod".apply("string"),
          "organizacnaZlozka": this.properties."OrganizacnaZlozka".apply("string"),
          "vyucovaciJazyk": this.properties."VyucovaciJazyk".apply("string"),
          "sustavnaPripravaNaPovolanie": this.properties."SustavnaPripravaNaPovolanie".apply("integer"),
          "typElokovanehoPracoviska": this.properties."TypElokovanehoPracoviska".apply("string"),
          "formaHospodarenia": this.properties."FormaHospodarenia".apply("string"),
          "formaVlastnictva": this.properties."FormaVlastnictva".apply("string"),
          "plnoorganizovana": this.properties."Plnoorganizovana".apply("integer"),
          "telefon": this.properties."Telefon".apply("string"),
          "fax": this.properties."Fax".apply("string"),
          "email": this.properties."Email".apply("string"),
          "web": this.properties."Web".apply("string"),
          "riaditel": this.properties."Riaditel".apply("string"),
          "statutari": this.properties."Statutari".apply("string"),
          "nadradenaSaSZEDUID": this.properties."NadradenaSaSZ_EDUID".apply("string"),
          "nadradenaSaSZKODSKO": this.properties."NadradenaSaSZ_KODSKO".apply("string"),
          "kmenovaSaSZEDUID": this.properties."KmenovaSaSZ_EDUID".apply("integer"),
          "kmenovaSaSZKODSKO": this.properties."KmenovaSaSZ_KODSKO".apply("integer"),
          "predchodcaSaSZEDUID": this.properties."PredchodcaSaSZ_EDUID".apply("string"),
          "predchodcaSaSZNazov": this.properties."PredchodcaSaSZ_Nazov".apply("string"),
          "zriadovatelEDUID": this.properties."Zriadovatel_EDUID".apply("integer"),
          "zriadovatelNazov": this.properties."Zriadovatel_Nazov".apply("string"),
          "zriadovatelTyp": this.properties."Zriadovatel_Typ".apply("string"),
          "latitude": this.properties."Latitude".apply("float"),
          "longitude": this.properties."Longitude".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/skoly_RIS_spolu/FeatureServer/0/query?where=1%3D1&outFields=EDUID,KODSKO,ICO,Hierarchia,DruhSaSZ,DruhSaSZKod,TypSaSZ,TypSaSZKod,TypSaSZSkratka,Nazov,NazovSkrateny,Kraj,Okres,Obec,Ulica,SupisneCislo,OrientacneCislo,PSC,DatumZaciatkuVyucovacejCinnosti,DatumZaniku,DatumZriadenia,DatumZrusenia,STAV,PravnaForma,PravnaFormaKod,OrganizacnaZlozka,VyucovaciJazyk,SustavnaPripravaNaPovolanie,TypElokovanehoPracoviska,FormaHospodarenia,FormaVlastnictva,Plnoorganizovana,Telefon,Fax,Email,Web,Riaditel,Statutari,NadradenaSaSZ_EDUID,NadradenaSaSZ_KODSKO,KmenovaSaSZ_EDUID,KmenovaSaSZ_KODSKO,PredchodcaSaSZ_EDUID,PredchodcaSaSZ_Nazov,Zriadovatel_EDUID,Zriadovatel_Nazov,Zriadovatel_Typ,Latitude,Longitude&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-stredne-skoly-v-banskobystrickom-kraji-581554" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
