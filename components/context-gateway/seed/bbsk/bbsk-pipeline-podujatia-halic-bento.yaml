# Generated by seeds/bbsk-events/generate.py from the inventory row Halič (lego-html),
# read 2026-10-21: https://www.halic.sk/obec-1/kalendar-akcii/ (T-4896). Do not edit: change the template or the CSV.
pipeline:
  processors:
  - mapping: |
      let paths = content().string().re_find_all_object("href=\"(?:https://www\\.halic\\.sk)?(?P<p>/obec\\-1/kalendar\\-akcii/[A-Za-z0-9._~%/-]{1,300}-[0-9]{1,9}(?:_[0-9]{1,9})?[a-z]{2}\\.html)\"").map_each(m -> m.p).unique()
      root = $paths.map_each(p -> { "url": "https://www.halic.sk" + p, "path": p, "sourceId": p })
  - unarchive:
      format: json_array
  - branch:
      request_map: |
        root = if this.path.contains("..") { deleted() } else { "" }
        meta event_path = this.path.trim_prefix("/")
      processors:
      - sleep:
          duration: 3s
      - http:
          url: https://www.halic.sk/${! @event_path }
          verb: GET
          headers:
            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
            Accept: text/html
          timeout: 20s
          retries: 1
      result_map: |
        # 20261018T150000 is Bratislava's wall time; 20261018 alone a whole day.
        map at {
          let m = this.or("").re_find_object("^(?P<d>[0-9]{8})(T(?P<t>[0-9]{4}))?")
          let day = if $m.d.or(null) == null { null } else { "%s-%s-%s".format($m.d.slice(0, 4), $m.d.slice(4, 6), $m.d.slice(6, 8)) }
          let local = if $day != null && $m.t.or("") != "" { "%sT%s:%s:00".format($day, $m.t.slice(0, 2), $m.t.slice(2, 4)) } else { null }
          root = if $local != null { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") } else { $day }
        }
        let page = content().string()
        let when = $page.re_find_object("data-date-start=\"(?P<s>[0-9T]*)\" data-date-end=\"(?P<e>[0-9T]*)\"")
        root.name = $page.re_find_object("<h1[^>]*>(?P<v>[^<]{1,500})</h1>").v.or(null)
        root.start = $when.s.or(null).apply("at")
        root.end = $when.e.or(null).apply("at")
        root.venue = $page.re_find_object("class=\"venue\">(?:<i[^>]*></i>)?(?:<span[^>]*>[^<]*</span>)?(?P<v>[^<]{1,300})</h2>").v.or(null)
        root.category = $page.re_find_object("Typ akcie:(?P<v>[^<]{1,200})<").v.or(null)
        root.description = $page.re_find_object("<p id=\"action-detail\">(?P<v>[\\s\\S]*?)</p>").v.or(null)
  - archive:
      format: json_array
  - mutation: |
      meta events = {"category_cache": {}, "category_default": null, "facts_only": true, "grace": 0, "home": {"poi":"osm-node-1929019064","match":"obecný úrad halič","town":"halic","venue":"Halič","streetAddress":null,"addressLocality":"Halič","lat":48.3544888,"lon":19.5739915,"checked_by":"overpass"}, "lease": 187200, "listing": "https://www.halic.sk/obec-1/kalendar-akcii/", "organizer": {"name": "Obec Halič", "url": "https://www.halic.sk"}, "provider": "Halič, halic.sk (licencia neuvedená)", "region": "Banskobystrický kraj", "scope": "/SK/BB", "self": ["celá obec", "halič", "halič - celá obec", "mesto", "mesto halič", "mestský úrad", "mestský úrad halič", "obec", "obec halič", "obecný úrad", "obecný úrad halič", "v obci"], "source": "https://www.halic.sk/obec-1/kalendar-akcii/", "space": env("JC_SPACE"), "town": "Halič", "town_scope": "/SK/BB/halic", "towns": [["Halič","halic",48.35449,19.57399,"office"]], "venues": [{"poi":"osm-node-13596568488","match":"múzeum csontváry a kaviareň céder","town":"halic","venue":"Múzeum Csontváry","streetAddress":"Mieru","addressLocality":"Halič","lat":48.3543776,"lon":19.5731775,"checked_by":"nominatim"},{"poi":"osm-node-1929019064","match":"obecný úrad halič","town":"halic","venue":"Halič","streetAddress":null,"addressLocality":"Halič","lat":48.3544888,"lon":19.5739915,"checked_by":"overpass"}]}
  - resource: events_tail
