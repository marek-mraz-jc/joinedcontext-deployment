# The mapping of the od-projekty-banskobystrickeho-kraja-itms21 pipeline, generated from the T-4254 mapping: one PublicInvestment per row of
# "Projekty Banskobystrického kraja ITMS21" (https://data.dev.joinedcontext.com/dataset/bbsk-projekty-banskobystrickeho-kraja-itms21-c8bfea). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "projekty-banskobystrickeho-kraja-itms21-" + [this.properties."ID_projektu"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("PublicInvestment", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "PublicInvestment",
          "typObce": this.properties."typ_obce".apply("string"),
          "iDN4": this.properties."IDN4".apply("integer"),
          "nM4": this.properties."NM4".apply("string"),
          "iDN3": this.properties."IDN3".apply("integer"),
          "nM3": this.properties."NM3".apply("string"),
          "iDN2": this.properties."IDN2".apply("integer"),
          "nM2": this.properties."NM2".apply("string"),
          "nUTS1": this.properties."NUTS1".apply("string"),
          "nUTS1CODE": this.properties."NUTS1_CODE".apply("string"),
          "nUTS2": this.properties."NUTS2".apply("string"),
          "nUTS2CODE": this.properties."NUTS2_CODE".apply("string"),
          "nUTS3": this.properties."NUTS3".apply("string"),
          "nUTS3CODE": this.properties."NUTS3_CODE".apply("string"),
          "lAU1": this.properties."LAU1".apply("string"),
          "lAU1CODE": this.properties."LAU1_CODE".apply("string"),
          "lAU2": this.properties."LAU2".apply("string"),
          "lAU2CODE": this.properties."LAU2_CODE".apply("string"),
          "fLAT": this.properties."F_LAT".apply("string"),
          "fLON": this.properties."F_LON".apply("string"),
          "iDProjektu": this.properties."ID_projektu".apply("string"),
          "identifier": this.properties."Kód_projektu".apply("string"),
          "name": this.properties."Názov_projektu".apply("string"),
          "kodKraja": this.properties."Kód_kraja".apply("string"),
          "nazovKraja": this.properties."Názov_kraja".apply("string"),
          "platnostProjektuOd": this.properties."Platnosť_projektu_od".apply("datetime"),
          "iCOPrijimatela": this.properties."IČO_prijímateľa".apply("string"),
          "nazovPrijimatela": this.properties."Názov_prijímateľa".apply("string"),
          "celkovaZazmluvnenaSuma": this.properties."Celková_zazmluvnená_suma".apply("float"),
          "rozsahUzemiaProjektu": this.properties."Rozsah_územia_projektu".apply("string"),
          "miestoRealizacieProjektu": this.properties."Miesto_realizácie_projektu".apply("string"),
          "uroven": this.properties."Úroveň".apply("string"),
          "miestoRealizacieProjektuObec": this.properties."Miesto_realizácie_projektu_obec".apply("string"),
          "kodObce": this.properties."Kód_obce".apply("string"),
          "miestoRealizacieProjektuKraj": this.properties."Miesto_realizácie_projektu_kraj".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Join_Features_to_Obce_BBK_centroidy_view_new/FeatureServer/0/query?where=1%3D1&outFields=typ_obce,IDN4,NM4,IDN3,NM3,IDN2,NM2,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,LAU2,LAU2_CODE,F_LAT,F_LON,ID_projektu,K%C3%B3d_projektu,N%C3%A1zov_projektu,K%C3%B3d_kraja,N%C3%A1zov_kraja,Platnos%C5%A5_projektu_od,I%C4%8CO_prij%C3%ADmate%C4%BEa,N%C3%A1zov_prij%C3%ADmate%C4%BEa,Celkov%C3%A1_zazmluvnen%C3%A1_suma,Rozsah_%C3%BAzemia_projektu,Miesto_realiz%C3%A1cie_projektu,%C3%9Arove%C5%88,Miesto_realiz%C3%A1cie_projektu_obec,K%C3%B3d_obce,Miesto_realiz%C3%A1cie_projektu_kraj&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-projekty-banskobystrickeho-kraja-itms21-c8bfea" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
