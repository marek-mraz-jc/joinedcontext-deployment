# One KeyPerformanceIndicator per row of "Počet obyvateľov v obciach BBK" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-pocet-obyvatelov-v-obciach-bbk
  namespace: bbsk
  title:
    sk: Počet obyvateľov v obciach BBK
    en: Počet obyvateľov v obciach BBK
spec:
  class: scheduled
  enabled: true
  schedule: 11 2 * * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-pocet-obyvatelov-v-obciach-bbk
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: replace
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
