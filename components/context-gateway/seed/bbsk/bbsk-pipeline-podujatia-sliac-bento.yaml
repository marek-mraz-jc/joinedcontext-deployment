# Generated by seeds/bbsk-events/generate.py from the inventory row Sliač (sc-rss),
# read 2026-10-20: https://www.sliac.sk/podujatia/ (T-4896). Do not edit: change the template or the CSV.
pipeline:
  processors:
  - xml:
      operator: to_json
  - mapping: |
      let items = if this.rss.or(null) != null { this.rss.channel.item.or([]) } else if this.feed.or(null) != null { this.feed.entry.or([]) } else { throw("the feed is neither RSS 2.0 nor Atom") }
      let list = if $items.type() == "array" { $items } else { [$items] }
      root = $list.map_each(i -> {
        "name": i.title.or(null).(t -> if t != null && t.type() == "object" { t."#text".or(null) } else { t }),
        "url": i.link.or(null).(l -> if l != null && l.type() == "object" { l."-href".or(null) } else { l }).or("").string().trim(),
        "sourceId": i.guid.or(null).(g -> if g != null && g.type() == "object" { g."#text".or(null) } else { g })
      })
  - unarchive:
      format: json_array
  - branch:
      request_map: |
        let path = this.url.or("").re_find_object("^https://www\\.sliac\\.sk/(?P<p>[A-Za-z0-9._~%/-]{1,300})$").p.or("")
        root = if $path == "" || $path.contains("..") { deleted() } else { "" }
        meta event_path = $path
      processors:
      - sleep:
          duration: 1s
      - http:
          url: https://www.sliac.sk/${! @event_path }
          verb: GET
          headers:
            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
            Accept: text/html
          timeout: 20s
          retries: 1
      result_map: |
        # "2026-10-23T18:00" is Bratislava's wall time; "2026-10-23" alone a whole day.
        map at {
          let v = this.or("").trim()
          root = if $v.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { $v } else if $v.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$") { $v + ":00" + ($v + ":00Z").ts_format("-07:00", "Europe/Bratislava") } else { null }
        }
        let page = content().string()
        let point = $page.re_find_object("static-map\\?lat=(?P<lat>[0-9]{1,2}\\.[0-9]{1,8})&(?:#038;|amp;)?lon=(?P<lon>[0-9]{1,2}\\.[0-9]{1,8})")
        root.start = $page.re_find_object("<time\\s+datetime=\"(?P<v>[0-9T:-]{10,16})\"\\s+itemprop=\"startDate\"").v.or(null).apply("at")
        root.end = $page.re_find_object("<time\\s+datetime=\"(?P<v>[0-9T:-]{10,16})\"\\s+itemprop=\"endDate\"").v.or(null).apply("at")
        let venue = $page.re_find_object("itemprop=\"location\"[^>]*>\\s*<span itemprop=\"name\">(?P<v>[^<]{1,300})</span>").v.or("").trim()
        let own = $venue != "" && $venue.lowercase() != "Sliač".or("").lowercase()
        root.venue = if $venue == "" { null } else { $venue }
        root.lat = if $own && $point.lat.or("") != "" { $point.lat } else { null }
        root.lon = if $own && $point.lon.or("") != "" { $point.lon } else { null }
  - archive:
      format: json_array
  - mutation: |
      meta events = {"category_cache": {}, "category_default": null, "facts_only": true, "grace": 0, "home": {"poi":"osm-way-302640073","match":"mestský úrad sliač","town":"sliac","venue":"Mestský úrad","streetAddress":"Letecká 232/1","addressLocality":"Sliač","lat":48.6164528,"lon":19.1357664,"checked_by":"overpass"}, "lease": 187200, "listing": "https://www.sliac.sk/podujatia/", "organizer": {"name": "Mesto Sliač", "url": "https://www.sliac.sk"}, "provider": "Sliač, sliac.sk (licencia neuvedená)", "region": "Banskobystrický kraj", "scope": "/SK/BB", "self": ["celá obec", "mesto", "mesto sliač", "mestský úrad", "mestský úrad sliač", "obec", "obec sliač", "obecný úrad", "obecný úrad sliač", "sliač", "sliač - celá obec", "v obci"], "source": "https://www.sliac.sk/podujatia/", "space": env("JC_SPACE"), "town": "Sliač", "town_scope": "/SK/BB/sliac", "towns": [["Sliač","sliac",48.61645,19.13577,"office"]], "venues": [{"poi":"osm-way-302640073","match":"mestský úrad sliač","town":"sliac","venue":"Mestský úrad","streetAddress":"Letecká 232/1","addressLocality":"Sliač","lat":48.6164528,"lon":19.1357664,"checked_by":"overpass"}]}
  - resource: events_tail
