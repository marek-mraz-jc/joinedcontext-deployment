# The mapping of the od-obyvatelstvo-podla-materinskeho-jazyk-2 pipeline, generated from the T-4254 mapping: one StatisticalObservation per row of
# "Obyvateľstvo podľa materinského jazyka (2011), okresy" (https://data.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-materinskeho-jazyka-2011-okresy-590643). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "obyvatelstvo-podla-materinskeho-jazyk-2-" + [this.properties."IDN3"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("StatisticalObservation", env("JC_ORG_DOMAIN"), env("JC_SPACE"), $local),
          "type": "StatisticalObservation",
          "dOW": this.properties."DOW".apply("datetime"),
          "fACC": this.properties."FACC".apply("string"),
          "iDN3": this.properties."IDN3".apply("integer"),
          "nM3": this.properties."NM3".apply("string"),
          "iDN2": this.properties."IDN2".apply("integer"),
          "nM2": this.properties."NM2".apply("string"),
          "vYMERA": this.properties."VYMERA".apply("float"),
          "nUTS1": this.properties."NUTS1".apply("string"),
          "nUTS1CODE": this.properties."NUTS1_CODE".apply("string"),
          "nUTS2": this.properties."NUTS2".apply("string"),
          "nUTS2CODE": this.properties."NUTS2_CODE".apply("string"),
          "nUTS3": this.properties."NUTS3".apply("string"),
          "nUTS3CODE": this.properties."NUTS3_CODE".apply("string"),
          "lAU1": this.properties."LAU1".apply("string"),
          "lAU1CODE": this.properties."LAU1_CODE".apply("string"),
          "okres": this.properties."Okres".apply("string"),
          "cisloOkresu": this.properties."Číslo_okresu".apply("string"),
          "rok": this.properties."Rok".apply("string"),
          "trvaloByvajuceObyvatelstvoSp": this.properties."Trvalo_bývajúce_obyvateľstvo_sp".apply("integer"),
          "slovensky": this.properties."slovenský".apply("float"),
          "madarsky": this.properties."maďarský".apply("float"),
          "romsky": this.properties."rómsky".apply("float"),
          "rusinsky": this.properties."rusínsky".apply("float"),
          "ukrajinsky": this.properties."ukrajinský".apply("float"),
          "cesky": this.properties."český".apply("float"),
          "nemecky": this.properties."nemecký".apply("float"),
          "polsky": this.properties."poľský".apply("float"),
          "chorvatsky": this.properties."chorvátsky".apply("float"),
          "jidis": this.properties."jidiš".apply("float"),
          "bulharsky": this.properties."bulharský".apply("float"),
          "ostatne": this.properties."ostatné".apply("float"),
          "nezisteny": this.properties."nezistený".apply("float"),
          "slovensky2": this.properties."slovenský2".apply("float"),
          "madarsky3": this.properties."maďarský3".apply("float"),
          "romsky4": this.properties."rómsky4".apply("float"),
          "rusinsky5": this.properties."rusínsky5".apply("float"),
          "ukrajinsky6": this.properties."ukrajinský6".apply("float"),
          "cesky7": this.properties."český7".apply("float"),
          "nemecky8": this.properties."nemecký8".apply("float"),
          "polsky9": this.properties."poľský9".apply("float"),
          "chorvatsky10": this.properties."chorvátsky10".apply("float"),
          "jidis11": this.properties."jidiš11".apply("float"),
          "bulharsky12": this.properties."bulharský12".apply("float"),
          "ostatne13": this.properties."ostatné13".apply("float"),
          "nezisteny14": this.properties."nezistený14".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mapa_SODB_2011_materinsk%C3%BD_jazyk_okres/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,Okres,%C4%8C%C3%ADslo_okresu,Rok,Trvalo_b%C3%BDvaj%C3%BAce_obyvate%C4%BEstvo_sp,slovensk%C3%BD,ma%C4%8Farsk%C3%BD,r%C3%B3msky,rus%C3%ADnsky,ukrajinsk%C3%BD,%C4%8Desk%C3%BD,nemeck%C3%BD,po%C4%BEsk%C3%BD,chorv%C3%A1tsky,jidi%C5%A1,bulharsk%C3%BD,ostatn%C3%A9,nezisten%C3%BD,slovensk%C3%BD2,ma%C4%8Farsk%C3%BD3,r%C3%B3msky4,rus%C3%ADnsky5,ukrajinsk%C3%BD6,%C4%8Desk%C3%BD7,nemeck%C3%BD8,po%C4%BEsk%C3%BD9,chorv%C3%A1tsky10,jidi%C5%A111,bulharsk%C3%BD12,ostatn%C3%A913,nezisten%C3%BD14&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-materinskeho-jazyka-2011-okresy-590643" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
