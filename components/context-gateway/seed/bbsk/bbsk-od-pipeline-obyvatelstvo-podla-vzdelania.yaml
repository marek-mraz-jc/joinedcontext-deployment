# One KeyPerformanceIndicator per row of "Obyvateľstvo podľa vzdelania (2021)" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-obyvatelstvo-podla-vzdelania
  namespace: bbsk
  title:
    sk: Obyvateľstvo podľa vzdelania (2021)
    en: Obyvateľstvo podľa vzdelania (2021)
spec:
  class: scheduled
  enabled: true
  schedule: 22 1 19 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-obyvatelstvo-podla-vzdelania
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: replace
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
