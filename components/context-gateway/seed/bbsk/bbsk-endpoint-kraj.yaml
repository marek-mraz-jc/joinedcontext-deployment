# their own public endpoint.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: bbsk-kraj
  namespace: bbsk
  title: { sk: "Kraj — zdrojové údaje", en: "Region, raw data" }
spec:
  contextSpaceRef: bbsk-kraj
  slug: 7u4ns3cdg2mqlx5gmxhk7rqai6pmokdj
  audience: organization
  enabledRepresentations: [ngsi-ld, csv, json]
  rateLimits: { requestsPerMinute: 300, burst: 50 }
