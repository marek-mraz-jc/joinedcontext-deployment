# The mapping of the od-prispevkove-rozpoctove-a-ine-organizacie pipeline, generated from the T-4254 mapping: one PublicOrganization per row of
# "Príspevkové rozpočtové a iné organizácie samosprávy" (https://data.dev.joinedcontext.com/dataset/bbsk-prispevkove-rozpoctove-a-ine-organizacie-samospravy-cec768). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "prispevkove-rozpoctove-a-ine-organizacie-" + {"IČO_samosprávy": this.properties."IČO_samosprávy", "Názov_samosprávy": this.properties."Názov_samosprávy", "IČO_organizácie": this.properties."IČO_organizácie", "Názov_organizácie": this.properties."Názov_organizácie", "ID_adresy": this.properties."ID_adresy", "Adresa_organizácie": this.properties."Adresa_organizácie", "Obec": this.properties."Obec", "Okres": this.properties."Okres", "Ulica_a_číslo_domu": this.properties."Ulica_a_číslo_domu", "LAT": this.properties."LAT", "LON": this.properties."LON", "Forma_podnikania": this.properties."Forma_podnikania", "Kód_formy_podnikania": this.properties."Kód_formy_podnikania"}.format_json(no_indent: true).hash("sha256").encode("hex").slice(0, 24).re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("PublicOrganization", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "PublicOrganization",
          "iCOSamospravy": this.properties."IČO_samosprávy".apply("string"),
          "nazovSamospravy": this.properties."Názov_samosprávy".apply("string"),
          "iCOOrganizacie": this.properties."IČO_organizácie".apply("string"),
          "nazovOrganizacie": this.properties."Názov_organizácie".apply("string"),
          "iDAdresy": this.properties."ID_adresy".apply("string"),
          "adresaOrganizacie": this.properties."Adresa_organizácie".apply("string"),
          "obec": this.properties."Obec".apply("string"),
          "okres": this.properties."Okres".apply("string"),
          "ulicaACisloDomu": this.properties."Ulica_a_číslo_domu".apply("string"),
          "lAT": this.properties."LAT".apply("float"),
          "lON": this.properties."LON".apply("float"),
          "formaPodnikania": this.properties."Forma_podnikania".apply("string"),
          "kodFormyPodnikania": this.properties."Kód_formy_podnikania".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Pr%C3%ADspevkov%C3%A9_rozpo%C4%8Dtov%C3%A9_a_in%C3%A9_organiz%C3%A1cie_samospr%C3%A1vy/FeatureServer/0/query?where=1%3D1&outFields=I%C4%8CO_samospr%C3%A1vy,N%C3%A1zov_samospr%C3%A1vy,I%C4%8CO_organiz%C3%A1cie,N%C3%A1zov_organiz%C3%A1cie,ID_adresy,Adresa_organiz%C3%A1cie,Obec,Okres,Ulica_a_%C4%8D%C3%ADslo_domu,LAT,LON,Forma_podnikania,K%C3%B3d_formy_podnikania&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-prispevkove-rozpoctove-a-ine-organizacie-samospravy-cec768" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
