# The write door of bbsk-registre (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes bbsk-registre served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint bbsk-registre.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: bbsk-registre-zapis
  namespace: bbsk
  title: { sk: 'Registre kraja: zápis', en: 'Registers of the region: writes' }
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint bbsk-registre.
    en: The internal door the data is written through; people read it through the public Endpoint bbsk-registre.
spec:
  contextSpaceRef: bbsk-registre
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-registre:app-bbsk-data-1
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-registre:app-bbsk-mapa-1
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-registre:app-bbsk-mosty-1-viewer
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-registre:hranice-read
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-registre:mosty-read
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-registre:organizacie-read
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-registre:registre-pipelines-write
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-registre:registre-read
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-registre:zariadenia-read
  slug: hxceoszwlvceltm2hlpplae6w4ixfxiz
  audience: organization
  enabledRepresentations: [ngsi-ld]
