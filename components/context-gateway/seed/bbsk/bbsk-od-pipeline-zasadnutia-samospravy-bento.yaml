# The mapping of the od-zasadnutia-samospravy pipeline, generated from the T-4254 mapping: one CouncilMeeting per row of
# "Zasadnutia samosprávy" (https://data.dev.joinedcontext.com/dataset/bbsk-zasadnutia-samospravy-9a27f2). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "zasadnutia-samospravy-" + [this.properties."Číslo_zasadnutia"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("CouncilMeeting", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "CouncilMeeting",
          "iCOSamospravy": this.properties."IČO_samosprávy".apply("string"),
          "nazovSamospravy": this.properties."Názov_samosprávy".apply("string"),
          "organSamospravy": this.properties."Orgán_samosprávy".apply("string"),
          "cisloZasadnutia": this.properties."Číslo_zasadnutia".apply("string"),
          "datumZasadnutia": this.properties."Dátum_zasadnutia".apply("datetime"),
          "hyperlinkNaPozvanku": this.properties."Hyperlink_na_pozvánku".apply("string"),
          "hyperlinkNaZapisnicu": this.properties."Hyperlink_na_zápisnicu".apply("string"),
          "hyperlinkNaPrijateUznesenia": this.properties."Hyperlink_na_prijaté_uznesenia".apply("string"),
          "hyperlinkNaVysledkyHlasovani": this.properties."Hyperlink_na_výsledky_hlasovani".apply("string"),
          "hyperlinkNaDochadzku": this.properties."Hyperlink_na_dochádzku".apply("string"),
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Zasadnutia_samospr%C3%A1vy/FeatureServer/0/query?where=1%3D1&outFields=I%C4%8CO_samospr%C3%A1vy,N%C3%A1zov_samospr%C3%A1vy,Org%C3%A1n_samospr%C3%A1vy,%C4%8C%C3%ADslo_zasadnutia,D%C3%A1tum_zasadnutia,Hyperlink_na_pozv%C3%A1nku,Hyperlink_na_z%C3%A1pisnicu,Hyperlink_na_prijat%C3%A9_uznesenia,Hyperlink_na_v%C3%BDsledky_hlasovani,Hyperlink_na_doch%C3%A1dzku&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-zasadnutia-samospravy-9a27f2" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
