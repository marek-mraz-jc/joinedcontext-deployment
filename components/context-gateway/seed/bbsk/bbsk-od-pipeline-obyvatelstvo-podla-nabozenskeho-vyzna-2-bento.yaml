# The mapping of the od-obyvatelstvo-podla-nabozenskeho-vyzna-2 pipeline, generated from the T-4254 mapping: one StatisticalObservation per row of
# "Obyvateľstvo podľa náboženského vyznania (2011), okresy" (https://data.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-nabozenskeho-vyznania-2011-okresy-3844c8). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "obyvatelstvo-podla-nabozenskeho-vyzna-2-" + [this.properties."IDN3"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("StatisticalObservation", env("JC_ORG_DOMAIN"), env("JC_SPACE"), $local),
          "type": "StatisticalObservation",
          "dOW": this.properties."DOW".apply("datetime"),
          "fACC": this.properties."FACC".apply("string"),
          "iDN3": this.properties."IDN3".apply("integer"),
          "nM3": this.properties."NM3".apply("string"),
          "iDN2": this.properties."IDN2".apply("integer"),
          "nM2": this.properties."NM2".apply("string"),
          "vYMERA": this.properties."VYMERA".apply("float"),
          "nUTS1": this.properties."NUTS1".apply("string"),
          "nUTS1CODE": this.properties."NUTS1_CODE".apply("string"),
          "nUTS2": this.properties."NUTS2".apply("string"),
          "nUTS2CODE": this.properties."NUTS2_CODE".apply("string"),
          "nUTS3": this.properties."NUTS3".apply("string"),
          "nUTS3CODE": this.properties."NUTS3_CODE".apply("string"),
          "lAU1": this.properties."LAU1".apply("string"),
          "lAU1CODE": this.properties."LAU1_CODE".apply("string"),
          "okres": this.properties."Okres".apply("string"),
          "cisloOkresu": this.properties."Číslo_okresu".apply("string"),
          "rok": this.properties."Rok".apply("string"),
          "pocetObyvatelovSpolu": this.properties."Počet_obyvateľov_spolu".apply("integer"),
          "rimskokatolickaCirkev": this.properties."Rímskokatolícka_cirkev".apply("float"),
          "greckokatolickaCirkev": this.properties."Gréckokatolícka_cirkev".apply("float"),
          "pravoslavnaCirkev": this.properties."Pravoslávna_cirkev".apply("float"),
          "evanjelickaCirkevAugsburskeho": this.properties."Evanjelická_cirkev_augsburského".apply("float"),
          "reformovanaKrestanskaCirkev": this.properties."Reformovaná_kresťanská_cirkev".apply("float"),
          "nabozenskaSpolocnostJehovovi": this.properties."Náboženská_spoločnosť_Jehovovi_".apply("float"),
          "evanjelickaCirkevMetodisticka": this.properties."Evanjelická_cirkev_metodistická".apply("float"),
          "krestanskeZbory": this.properties."Kresťanské_zbory".apply("float"),
          "apostolskaCirkev": this.properties."Apoštolská_cirkev".apply("float"),
          "bratskaJednotaBaptistov": this.properties."Bratská_jednota_baptistov".apply("float"),
          "cirkevAdventistovSiedmehoDna": this.properties."Cirkev_adventistov_siedmeho_dňa".apply("float"),
          "cirkevBratska": this.properties."Cirkev_bratská".apply("float"),
          "ustrednyZvazZidovskychNaboze": this.properties."Ústredný_zväz_židovských_nábože".apply("float"),
          "starokatolickaCirkev": this.properties."Starokatolícka_cirkev".apply("float"),
          "cirkevCeskoslovenskaHusitska": this.properties."Cirkev_československá_husitská".apply("float"),
          "novoapostolskaCirkev": this.properties."Novoapoštolská_cirkev".apply("float"),
          "bahajskeSpolocenstvo": this.properties."Bahájske_spoločenstvo".apply("float"),
          "cirkevJezisaKristaSvatychNe": this.properties."Cirkev_Ježiša_Krista_svätých_ne".apply("float"),
          "ine": this.properties."iné".apply("float"),
          "bezVyznania": this.properties."bez_vyznania".apply("float"),
          "nezistene": this.properties."nezistené".apply("float"),
          "rimskokatolickaCirkev2": this.properties."Rímskokatolícka_cirkev__".apply("float"),
          "greckokatolickaCirkev2": this.properties."Gréckokatolícka_cirkev__".apply("float"),
          "pravoslavnaCirkev2": this.properties."Pravoslávna_cirkev__".apply("float"),
          "evanjelickaCirkevAugsburske1": this.properties."Evanjelická_cirkev_augsburské_1".apply("float"),
          "reformovanaKrestanskaCirkev2": this.properties."Reformovaná_kresťanská_cirkev__".apply("float"),
          "nabozenskaSpolocnostJehovovi1": this.properties."Náboženská_spoločnosť_Jehovovi1".apply("float"),
          "evanjelickaCirkevMetodistic1": this.properties."Evanjelická_cirkev_metodistic_1".apply("float"),
          "krestanskeZbory2": this.properties."Kresťanské_zbory__".apply("float"),
          "apostolskaCirkev2": this.properties."Apoštolská_cirkev__".apply("float"),
          "bratskaJednotaBaptistov2": this.properties."Bratská_jednota_baptistov__".apply("float"),
          "cirkevAdventistovSiedmehoD1": this.properties."Cirkev_adventistov_siedmeho_d_1".apply("float"),
          "cirkevBratska2": this.properties."Cirkev_bratská__".apply("float"),
          "ustrednyZvazZidovskychNabo1": this.properties."Ústredný_zväz_židovských_nábo_1".apply("float"),
          "starokatolickaCirkev2": this.properties."Starokatolícka_cirkev__".apply("float"),
          "cirkevCeskoslovenskaHusitska2": this.properties."Cirkev_československá_husitská_".apply("float"),
          "novoapostolskaCirkev2": this.properties."Novoapoštolská_cirkev__".apply("float"),
          "bahajskeSpolocenstvo2": this.properties."Bahájske_spoločenstvo__".apply("float"),
          "cirkevJezisaKristaSvatych1": this.properties."Cirkev_Ježiša_Krista_svätých__1".apply("float"),
          "ine2": this.properties."iné__".apply("float"),
          "bezVyznania2": this.properties."bez_vyznania__".apply("float"),
          "nezistene2": this.properties."nezistené__".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mapa_SODB_2011_n%C3%A1bo%C5%BEenstvo_okresy/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,Okres,%C4%8C%C3%ADslo_okresu,Rok,Po%C4%8Det_obyvate%C4%BEov_spolu,R%C3%ADmskokatol%C3%ADcka_cirkev,Gr%C3%A9ckokatol%C3%ADcka_cirkev,Pravosl%C3%A1vna_cirkev,Evanjelick%C3%A1_cirkev_augsbursk%C3%A9ho,Reformovan%C3%A1_kres%C5%A5ansk%C3%A1_cirkev,N%C3%A1bo%C5%BEensk%C3%A1_spolo%C4%8Dnos%C5%A5_Jehovovi_,Evanjelick%C3%A1_cirkev_metodistick%C3%A1,Kres%C5%A5ansk%C3%A9_zbory,Apo%C5%A1tolsk%C3%A1_cirkev,Bratsk%C3%A1_jednota_baptistov,Cirkev_adventistov_siedmeho_d%C5%88a,Cirkev_bratsk%C3%A1,%C3%9Astredn%C3%BD_zv%C3%A4z_%C5%BEidovsk%C3%BDch_n%C3%A1bo%C5%BEe,Starokatol%C3%ADcka_cirkev,Cirkev_%C4%8Deskoslovensk%C3%A1_husitsk%C3%A1,Novoapo%C5%A1tolsk%C3%A1_cirkev,Bah%C3%A1jske_spolo%C4%8Denstvo,Cirkev_Je%C5%BEi%C5%A1a_Krista_sv%C3%A4t%C3%BDch_ne,in%C3%A9,bez_vyznania,nezisten%C3%A9,R%C3%ADmskokatol%C3%ADcka_cirkev__,Gr%C3%A9ckokatol%C3%ADcka_cirkev__,Pravosl%C3%A1vna_cirkev__,Evanjelick%C3%A1_cirkev_augsbursk%C3%A9_1,Reformovan%C3%A1_kres%C5%A5ansk%C3%A1_cirkev__,N%C3%A1bo%C5%BEensk%C3%A1_spolo%C4%8Dnos%C5%A5_Jehovovi1,Evanjelick%C3%A1_cirkev_metodistic_1,Kres%C5%A5ansk%C3%A9_zbory__,Apo%C5%A1tolsk%C3%A1_cirkev__,Bratsk%C3%A1_jednota_baptistov__,Cirkev_adventistov_siedmeho_d_1,Cirkev_bratsk%C3%A1__,%C3%9Astredn%C3%BD_zv%C3%A4z_%C5%BEidovsk%C3%BDch_n%C3%A1bo_1,Starokatol%C3%ADcka_cirkev__,Cirkev_%C4%8Deskoslovensk%C3%A1_husitsk%C3%A1_,Novoapo%C5%A1tolsk%C3%A1_cirkev__,Bah%C3%A1jske_spolo%C4%8Denstvo__,Cirkev_Je%C5%BEi%C5%A1a_Krista_sv%C3%A4t%C3%BDch__1,in%C3%A9__,bez_vyznania__,nezisten%C3%A9__&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-nabozenskeho-vyznania-2011-okresy-3844c8" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
