# One Organization per row of "Vysoké školy v Banskobystrickom kraji" (T-4255); schools as schema.org organizations.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-vysoke-skoly-v-banskobystrickom-kraji
  namespace: bbsk
  title:
    sk: Vysoké školy v Banskobystrickom kraji
    en: Vysoké školy v Banskobystrickom kraji
spec:
  class: scheduled
  enabled: false
  schedule: 31 4 * * 4
  source:
    dataSourceRef:
      kind: DataSource
      name: od-vysoke-skoly-v-banskobystrickom-kraji
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: Organization
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
