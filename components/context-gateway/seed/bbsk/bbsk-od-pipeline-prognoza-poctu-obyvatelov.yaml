# One KeyPerformanceIndicator per row of "Prognóza počtu obyvateľov (2018 - 2040)" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-prognoza-poctu-obyvatelov
  namespace: bbsk
  title:
    sk: Prognóza počtu obyvateľov (2018 - 2040)
    en: Prognóza počtu obyvateľov (2018 - 2040)
spec:
  class: scheduled
  enabled: false
  schedule: 1 1 16 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-prognoza-poctu-obyvatelov
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
