  title: { sk: "Organizácie v zriaďovateľskej pôsobnosti BBSK (BBSK)", en: "Organisations the region founded (BBSK)" }
spec:
  type: http
  http:
    url: https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/NEW_VIEW_Organiz%C3%A1cie_v_zria%C4%8Fovate%C4%BEskej_p%C3%B4sobnosti_BBSK/FeatureServer/0/query?where=1%3D1&outFields=I%C4%8CO,Ofici%C3%A1lny_n%C3%A1zov,Zau%C5%BE%C3%ADvan%C3%BD_n%C3%A1zov,kateg%C3%B3ria,obec_NUTS,adresa&returnGeometry=true&f=geojson&outSR=4326&geometryPrecision=6
