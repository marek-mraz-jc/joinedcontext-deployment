# The generated pipelines upsert; nothing deletes, since several pipelines write the space (PL-64).
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: otvorene-data-pipelines-write
  namespace: bbsk
  title:
    sk: Kanály zapisujú otvorené dáta
    en: The pipelines write the open data
spec:
  contextSpaceRef:
    kind: ContextSpace
    name: bbsk-otvorene-data
  assigner: did:web:{orgDomain}
  assignee:
    kind: serviceAccount
    id: pipelines
  operations:
  - upsertBatch
  - createBatch
  - queryBatch
  information:
  - entities:
    - type: KeyPerformanceIndicator
    - type: Organization
    - type: Person
    - type: PointOfInterest
    - type: PublicOrganization
    - type: RoadAccident
