# The mapping of the od-pohyb-obyvatelstva-v-okresoch pipeline, generated from the T-4254 mapping: one StatisticalObservation per row of
# "Pohyb obyvateľstva v okresoch (1996 - 2024)" (https://data.dev.joinedcontext.com/dataset/bbsk-pohyb-obyvatelstva-v-okresoch-1996-2024-8b7fa1). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "pohyb-obyvatelstva-v-okresoch-" + [this.properties."IDN3", this.properties."Rok"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("StatisticalObservation", env("JC_ORG_DOMAIN"), env("JC_SPACE"), $local),
          "type": "StatisticalObservation",
          "dOW": this.properties."DOW".apply("datetime"),
          "fACC": this.properties."FACC".apply("string"),
          "iDN3": this.properties."IDN3".apply("integer"),
          "nM3": this.properties."NM3".apply("string"),
          "iDN2": this.properties."IDN2".apply("integer"),
          "nM2": this.properties."NM2".apply("string"),
          "vYMERA": this.properties."VYMERA".apply("float"),
          "nUTS1": this.properties."NUTS1".apply("string"),
          "nUTS1CODE": this.properties."NUTS1_CODE".apply("string"),
          "nUTS2": this.properties."NUTS2".apply("string"),
          "nUTS2CODE": this.properties."NUTS2_CODE".apply("string"),
          "nUTS3": this.properties."NUTS3".apply("string"),
          "nUTS3CODE": this.properties."NUTS3_CODE".apply("string"),
          "lAU1": this.properties."LAU1".apply("string"),
          "lAU1CODE": this.properties."LAU1_CODE".apply("string"),
          "okresID": this.properties."Okres_ID".apply("string"),
          "okresDlhyNazov": this.properties."Okres_dlhý_názov".apply("string"),
          "krajID": this.properties."Kraj_ID".apply("string"),
          "krajDlhyNazov": this.properties."Kraj_dlhý_názov".apply("string"),
          "rok": this.properties."Rok".apply("string"),
          "stavTrvaleByvajucehoObyvatel": this.properties."Stav_trvale_bývajúceho_obyvateľ".apply("float"),
          "stavTrvaleByvajucehoObyvat1": this.properties."Stav_trvale_bývajúceho_obyvat_1".apply("float"),
          "stavTrvaleByvajucehoObyvat2": this.properties."Stav_trvale_bývajúceho_obyvat_2".apply("float"),
          "narodeniOsoba": this.properties."Narodení__Osoba_".apply("float"),
          "hrubaMieraZivorodenostiProm": this.properties."Hrubá_miera_živorodenosti__Prom".apply("float"),
          "potratyPocetVJednotkach": this.properties."Potraty__Počet_v_jednotkách_".apply("float"),
          "hrubaMieraPotratovostiPromi": this.properties."Hrubá_miera_potratovosti__Promi".apply("float"),
          "indexPotratovostiPercento": this.properties."Index_potratovosti__Percento_".apply("float"),
          "ukonceneTehotenstvaPocetVJ": this.properties."Ukončené_tehotenstvá__Počet_v_j".apply("float"),
          "hrubaMieraUkoncenychTehotens": this.properties."Hrubá_miera_ukončených_tehotens".apply("float"),
          "zomretiOsoba": this.properties."Zomretí__Osoba_".apply("float"),
          "hrubaMieraUmrtnostiPromile": this.properties."Hrubá_miera_úmrtnosti__Promile_".apply("float"),
          "dojcenskaUmrtnostOsoba": this.properties."Dojčenská_úmrtnosť__Osoba_".apply("float"),
          "mieraDojcenskejUmrtnostiPro": this.properties."Miera_dojčenskej_úmrtnosti__Pro".apply("float"),
          "novorodeneckaUmrtnostOsoba": this.properties."Novorodenecká_úmrtnosť__Osoba_".apply("float"),
          "mieraNovorodeneckejUmrtnosti": this.properties."Miera_novorodeneckej_úmrtnosti_".apply("float"),
          "perinatalnaUmrtnostOsoba": this.properties."Perinatálna_úmrtnosť__Osoba_".apply("float"),
          "mieraPerinatalnejUmrtnostiP": this.properties."Miera_perinatálnej_úmrtnosti__P".apply("float"),
          "standardnaDojcenskaUmrtnost": this.properties."Štandardná_dojčenská_úmrtnosť__".apply("float"),
          "standardnaNovorodeneckaUmrtno": this.properties."Štandardná_novorodenecká_úmrtno".apply("float"),
          "sobasePocetVJednotkach": this.properties."Sobáše__Počet_v_jednotkách_".apply("float"),
          "hrubaMieraSobasnostiPromile": this.properties."Hrubá_miera_sobášnosti__Promile".apply("float"),
          "rozvodyPocetVJednotkach": this.properties."Rozvody__Počet_v_jednotkách_".apply("float"),
          "hrubaMieraRozvodovostiPromi": this.properties."Hrubá_miera_rozvodovosti__Promi".apply("float"),
          "indexRozvodovostiPercento": this.properties."Index_rozvodovosti__Percento_".apply("float"),
          "prirodzenyPrirastokObyvatelst": this.properties."Prirodzený_prírastok_obyvateľst".apply("float"),
          "hrubaMieraPrirodzenehoPriras": this.properties."Hrubá_miera_prirodzeného_príras".apply("float"),
          "pristahovaniNaTrvalyPobytO": this.properties."Prisťahovaní_na_trvalý_pobyt__O".apply("float"),
          "vystahovaniZTrvalehoPobytu": this.properties."Vysťahovaní_z_trvalého_pobytu__".apply("float"),
          "migracneSaldoOsoba": this.properties."Migračné_saldo__Osoba_".apply("float"),
          "hrubaMieraMigracnehoSaldaP": this.properties."Hrubá_miera_migračného_salda__P".apply("float"),
          "celkovyPrirastokObyvatelstva": this.properties."Celkový_prírastok_obyvateľstva_".apply("float"),
          "hrubaMieraCelkovehoPrirastku": this.properties."Hrubá_miera_celkového_prírastku".apply("float"),
          "zivonarodeniOsoba": this.properties."Živonarodení__Osoba_".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/pohyb_okresy_view/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,Okres_ID,Okres_dlh%C3%BD_n%C3%A1zov,Kraj_ID,Kraj_dlh%C3%BD_n%C3%A1zov,Rok,Stav_trvale_b%C3%BDvaj%C3%BAceho_obyvate%C4%BE,Stav_trvale_b%C3%BDvaj%C3%BAceho_obyvat_1,Stav_trvale_b%C3%BDvaj%C3%BAceho_obyvat_2,Naroden%C3%AD__Osoba_,Hrub%C3%A1_miera_%C5%BEivorodenosti__Prom,Potraty__Po%C4%8Det_v_jednotk%C3%A1ch_,Hrub%C3%A1_miera_potratovosti__Promi,Index_potratovosti__Percento_,Ukon%C4%8Den%C3%A9_tehotenstv%C3%A1__Po%C4%8Det_v_j,Hrub%C3%A1_miera_ukon%C4%8Den%C3%BDch_tehotens,Zomret%C3%AD__Osoba_,Hrub%C3%A1_miera_%C3%BAmrtnosti__Promile_,Doj%C4%8Densk%C3%A1_%C3%BAmrtnos%C5%A5__Osoba_,Miera_doj%C4%8Denskej_%C3%BAmrtnosti__Pro,Novorodeneck%C3%A1_%C3%BAmrtnos%C5%A5__Osoba_,Miera_novorodeneckej_%C3%BAmrtnosti_,Perinat%C3%A1lna_%C3%BAmrtnos%C5%A5__Osoba_,Miera_perinat%C3%A1lnej_%C3%BAmrtnosti__P,%C5%A0tandardn%C3%A1_doj%C4%8Densk%C3%A1_%C3%BAmrtnos%C5%A5__,%C5%A0tandardn%C3%A1_novorodeneck%C3%A1_%C3%BAmrtno,Sob%C3%A1%C5%A1e__Po%C4%8Det_v_jednotk%C3%A1ch_,Hrub%C3%A1_miera_sob%C3%A1%C5%A1nosti__Promile,Rozvody__Po%C4%8Det_v_jednotk%C3%A1ch_,Hrub%C3%A1_miera_rozvodovosti__Promi,Index_rozvodovosti__Percento_,Prirodzen%C3%BD_pr%C3%ADrastok_obyvate%C4%BEst,Hrub%C3%A1_miera_prirodzen%C3%A9ho_pr%C3%ADras,Pris%C5%A5ahovan%C3%AD_na_trval%C3%BD_pobyt__O,Vys%C5%A5ahovan%C3%AD_z_trval%C3%A9ho_pobytu__,Migra%C4%8Dn%C3%A9_saldo__Osoba_,Hrub%C3%A1_miera_migra%C4%8Dn%C3%A9ho_salda__P,Celkov%C3%BD_pr%C3%ADrastok_obyvate%C4%BEstva_,Hrub%C3%A1_miera_celkov%C3%A9ho_pr%C3%ADrastku,%C5%BDivonaroden%C3%AD__Osoba_&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-pohyb-obyvatelstva-v-okresoch-1996-2024-8b7fa1" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
