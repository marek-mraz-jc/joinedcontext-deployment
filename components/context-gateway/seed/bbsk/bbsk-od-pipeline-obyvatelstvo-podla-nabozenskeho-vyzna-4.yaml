# One KeyPerformanceIndicator per row of "Obyvateľstvo podľa náboženského vyznania (2021), okresy" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-obyvatelstvo-podla-nabozenskeho-vyzna-4
  namespace: bbsk
  title:
    sk: Obyvateľstvo podľa náboženského vyznania (2021), okresy
    en: Obyvateľstvo podľa náboženského vyznania (2021), okresy
spec:
  class: scheduled
  enabled: false
  schedule: 48 3 25 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-obyvatelstvo-podla-nabozenskeho-vyzna-4
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
