# One KeyPerformanceIndicator per row of "Hustota obyvateľstva (2021)" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-hustota-obyvatelstva
  namespace: bbsk
  title:
    sk: Hustota obyvateľstva (2021)
    en: Hustota obyvateľstva (2021)
spec:
  class: scheduled
  enabled: true
  schedule: 31 2 14 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-hustota-obyvatelstva
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
