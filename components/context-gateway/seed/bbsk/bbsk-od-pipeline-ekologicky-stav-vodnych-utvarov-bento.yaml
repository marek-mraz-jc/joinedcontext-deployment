# The mapping of the od-ekologicky-stav-vodnych-utvarov pipeline, generated from the T-4254 mapping: one WaterBodyStatus per row of
# "Ekologický stav vodných útvarov" (https://data.dev.joinedcontext.com/dataset/bbsk-ekologicky-stav-vodnych-utvarov-48bbbd). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
        # anything else reads as a datetime (T-4288).
        map observed {
          let x = this
          root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
            $x.apply("datetime").value.catch(null)
          }
        }
        # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
        map stamped {
          root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "ekologicky-stav-vodnych-utvarov-" + [this.properties."KOD_VU_202"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("WaterBodyStatus", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "WaterBodyStatus",
          "fIDRiekyBbskJoin": this.properties."FID_rieky_bbsk_join".apply("integer"),
          "pOZNAMKA": this.properties."POZNAMKA".apply("string"),
          "name": this.properties."NAZOV_VU".apply("string"),
          "nAZOVVUD": this.properties."NAZOV_VU_D".apply("string"),
          "pOVODIE": this.properties."POVODIE".apply("string"),
          "sUBUNIT": this.properties."SUB_UNIT".apply("string"),
          "pOZN1": this.properties."POZN_1".apply("string"),
          "kODVU202": this.properties."KOD_VU_202".apply("string"),
          "rkmOd1": this.properties."rkm_od_1".apply("float"),
          "rkmDo1": this.properties."rkm_do_1".apply("float"),
          "dlzkaVU1": this.properties."dlzka_VU_1".apply("float"),
          "kod": this.properties."kod".apply("string"),
          "typ": this.properties."typ".apply("string"),
          "skupina": this.properties."skupina".apply("float"),
          "nazovVU1": this.properties."nazov_VU_1".apply("string"),
          "charakter": this.properties."charakter".apply("string"),
          "celkChemStav": this.properties."celk_chem_stav".apply("string"),
          "ekologickyStav": this.properties."ekologicky_stav".apply("float"),
          "fIDKraj0": this.properties."FID_kraj_0".apply("integer"),
          "dOW": this.properties."DOW".apply("datetime"),
          "aUT": this.properties."AUT".apply("integer"),
          "aCH": this.properties."ACH".apply("integer"),
          "sOI": this.properties."SOI".apply("integer"),
          "fACC": this.properties."FACC".apply("string"),
          "iDN2": this.properties."IDN2".apply("integer"),
          "nM2": this.properties."NM2".apply("string"),
          "vYMERA": this.properties."VYMERA".apply("float"),
          "potencial": this.properties."potencial".apply("string"),
          "charakter1": this.properties."charakter_1".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Eko_stav_project/FeatureServer/1/query?where=1%3D1&outFields=FID_rieky_bbsk_join,POZNAMKA,NAZOV_VU,NAZOV_VU_D,POVODIE,SUB_UNIT,POZN_1,KOD_VU_202,rkm_od_1,rkm_do_1,dlzka_VU_1,kod,typ,skupina,nazov_VU_1,charakter,celk_chem_stav,ekologicky_stav,FID_kraj_0,DOW,AUT,ACH,SOI,FACC,IDN2,NM2,VYMERA,potencial,charakter_1&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-ekologicky-stav-vodnych-utvarov-48bbbd" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
