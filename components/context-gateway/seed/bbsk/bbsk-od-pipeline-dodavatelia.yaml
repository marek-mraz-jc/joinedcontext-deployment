# One Organization per row of "Dodávatelia" (T-4255); suppliers with an IČO.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-dodavatelia
  namespace: bbsk
  title:
    sk: Dodávatelia
    en: Dodávatelia
spec:
  class: scheduled
  enabled: false
  schedule: 28 1 * * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-dodavatelia
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: Organization
    mode: upsert
  quotas:
    maxMemoryMb: 256
    cpuMillicores: 100
