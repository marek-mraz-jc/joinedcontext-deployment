# One KeyPerformanceIndicator per row of "Obyvateľstvo podľa materinského jazyka (2011), obce" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-obyvatelstvo-podla-materinskeho-jazyka
  namespace: bbsk
  title:
    sk: Obyvateľstvo podľa materinského jazyka (2011), obce
    en: Obyvateľstvo podľa materinského jazyka (2011), obce
spec:
  class: scheduled
  enabled: true
  schedule: 30 4 3 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-obyvatelstvo-podla-materinskeho-jazyka
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: replace
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
