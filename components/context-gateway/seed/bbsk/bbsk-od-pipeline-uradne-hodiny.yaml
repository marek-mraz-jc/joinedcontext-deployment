# One OfficeHours per row of "Úradné hodiny" (T-4255); one row per office and weekday.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-uradne-hodiny
  namespace: bbsk
  title:
    sk: Úradné hodiny
    en: Úradné hodiny
spec:
  class: scheduled
  enabled: true
  schedule: 10 4 * * 0
  source:
    dataSourceRef:
      kind: DataSource
      name: od-uradne-hodiny
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: OfficeHours
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
