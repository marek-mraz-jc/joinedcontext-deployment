# One StatisticalObservation per cell of the ŠÚ SR cube cr3807qr, written through the space's one Endpoint with the runner's service account (PL-18, PF-39, T-2783).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: kapacity
  namespace: bbsk
  title: { sk: "Kapacity ubytovacích zariadení kraja a okresov", en: "Accommodation capacity of the region and its districts" }
spec:
  class: auto
  # Annual or quarterly data: a weekly read is already far more often than it changes (PL-26, PL-27).
  period: 168h
  schedule: "33 3 * * 1"
  source:
    dataSourceRef: { kind: DataSource, name: susr-cr3807qr }
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-kraj:bbsk-kraj
  output:
    type: StatisticalObservation
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
