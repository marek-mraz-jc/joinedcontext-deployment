# The mapping of the od-mosty-v-sprave-bbrsc-public-view pipeline, generated from the T-4254 mapping: one Bridge per row of
# "Mosty v správe BBRSC (public view)" (https://data.dev.joinedcontext.com/dataset/bbsk-mosty-v-sprave-bbrsc-public-view-d3252c). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    # Page 0 as it came; when the layer says there is more, every further page up to half again
    # the 1031 rows it held when mapped (ponytail: a static page count; past that the
    # newest rows wait until the mapping is regenerated). A page past the end is empty.
    - mapping: |
        root = if this.properties.exceededTransferLimit.or(false) { [this].concat(range(1, 2).map_each(p -> { "offset": p * 1000 })) } else { [this] }
    - unarchive:
        format: json_array
    - switch:
        - check: this.offset.or(null) != null
          processors:
            - mapping: |
                meta offset = this.offset.string()
                root = ""
            - http:
                url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mosty_v_spr%C3%A1ve_BBRSC_(public_view)/FeatureServer/2/query?where=1%3D1&outFields=Identifika%C4%8Dn%C3%A9_%C4%8D%C3%ADslo,N%C3%A1zov,Po%C4%8Det_dil__celkov,Komunik%C3%A1cia,Trieda_cesty,Okres,Obec,Ulica,Vlastn%C3%ADk,Spr%C3%A1vca,Legislat%C3%ADvny_stav,Aktu%C3%A1lny_stavebnotechnick%C3%BD_stav,Hodnotenie,Norm%C3%A1lna_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5__t_,V%C3%BDhradn%C3%A1_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5__t_,Ojedinel%C3%A1_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5__t_,V%C3%BDnimo%C4%8Dn%C3%A1_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5__t_,Za%C5%A5a%C5%BEite%C4%BEnos%C5%A5_na_jednu_n%C3%A1pravu_,Rok_kon%C5%A1trukcie,Rok_z%C3%A1sadnej_rekon%C5%A1trukcie,Materi%C3%A1l_nosnej_kon%C5%A1trukcie,Druh_nosnej_kon%C5%A1trukcie,D%C4%BA%C5%BEka_premostenia__m_,Do%C4%8Dasnos%C5%A5_mosta,Typ_pamiatky,Predmet_premostenia,Typ_komunik%C3%A1cie&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000"
                verb: GET
                headers:
                  Accept: application/geo+json
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "mosty-v-sprave-bbrsc-public-view-" + [this.properties."Identifikačné_číslo"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("Bridge", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "Bridge",
          "identifikacneCislo": this.properties."Identifikačné_číslo".apply("string"),
          "name": this.properties."Názov".apply("string"),
          "pocetDilCelkov": this.properties."Počet_dil__celkov".apply("integer"),
          "komunikacia": this.properties."Komunikácia".apply("string"),
          "triedaCesty": this.properties."Trieda_cesty".apply("string"),
          "okres": this.properties."Okres".apply("string"),
          "obec": this.properties."Obec".apply("string"),
          "ulica": this.properties."Ulica".apply("string"),
          "vlastnik": this.properties."Vlastník".apply("string"),
          "spravca": this.properties."Správca".apply("string"),
          "legislativnyStav": this.properties."Legislatívny_stav".apply("string"),
          "aktualnyStavebnotechnickyStav": this.properties."Aktuálny_stavebnotechnický_stav".apply("string"),
          "hodnotenie": this.properties."Hodnotenie".apply("string"),
          "normalnaZatazitelnostT": this.properties."Normálna_zaťažiteľnosť__t_".apply("string"),
          "vyhradnaZatazitelnostT": this.properties."Výhradná_zaťažiteľnosť__t_".apply("string"),
          "ojedinelaZatazitelnostT": this.properties."Ojedinelá_zaťažiteľnosť__t_".apply("string"),
          "vynimocnaZatazitelnostT": this.properties."Výnimočná_zaťažiteľnosť__t_".apply("string"),
          "zatazitelnostNaJednuNapravu": this.properties."Zaťažiteľnosť_na_jednu_nápravu_".apply("string"),
          "rokKonstrukcie": this.properties."Rok_konštrukcie".apply("integer"),
          "rokZasadnejRekonstrukcie": this.properties."Rok_zásadnej_rekonštrukcie".apply("integer"),
          "materialNosnejKonstrukcie": this.properties."Materiál_nosnej_konštrukcie".apply("string"),
          "druhNosnejKonstrukcie": this.properties."Druh_nosnej_konštrukcie".apply("string"),
          "dlzkaPremosteniaM": this.properties."Dĺžka_premostenia__m_".apply("float"),
          "docasnostMosta": this.properties."Dočasnosť_mosta".apply("string"),
          "typPamiatky": this.properties."Typ_pamiatky".apply("string"),
          "predmetPremostenia": this.properties."Predmet_premostenia".apply("string"),
          "typKomunikacie": this.properties."Typ_komunikácie".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mosty_v_spr%C3%A1ve_BBRSC_(public_view)/FeatureServer/2/query?where=1%3D1&outFields=Identifika%C4%8Dn%C3%A9_%C4%8D%C3%ADslo,N%C3%A1zov,Po%C4%8Det_dil__celkov,Komunik%C3%A1cia,Trieda_cesty,Okres,Obec,Ulica,Vlastn%C3%ADk,Spr%C3%A1vca,Legislat%C3%ADvny_stav,Aktu%C3%A1lny_stavebnotechnick%C3%BD_stav,Hodnotenie,Norm%C3%A1lna_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5__t_,V%C3%BDhradn%C3%A1_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5__t_,Ojedinel%C3%A1_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5__t_,V%C3%BDnimo%C4%8Dn%C3%A1_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5__t_,Za%C5%A5a%C5%BEite%C4%BEnos%C5%A5_na_jednu_n%C3%A1pravu_,Rok_kon%C5%A1trukcie,Rok_z%C3%A1sadnej_rekon%C5%A1trukcie,Materi%C3%A1l_nosnej_kon%C5%A1trukcie,Druh_nosnej_kon%C5%A1trukcie,D%C4%BA%C5%BEka_premostenia__m_,Do%C4%8Dasnos%C5%A5_mosta,Typ_pamiatky,Predmet_premostenia,Typ_komunik%C3%A1cie&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-mosty-v-sprave-bbrsc-public-view-d3252c" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
