# The mapping of the od-ppa-platby-po-okresoch pipeline, generated from the T-4254 mapping: one StatisticalObservation per row of
# "PPA platby po okresoch" (https://data.dev.joinedcontext.com/dataset/bbsk-ppa-platby-po-okresoch-bf09ef). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "ppa-platby-po-okresoch-" + [this.properties."Kód_okresu", this.properties."Rok___kampaň"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("StatisticalObservation", env("JC_ORG_DOMAIN"), env("JC_SPACE"), $local),
          "type": "StatisticalObservation",
          "okres": this.properties."Okres".apply("string"),
          "kodOkresu": this.properties."Kód_okresu".apply("string"),
          "rokKampan": this.properties."Rok___kampaň".apply("integer"),
          "ePZF": this.properties."EPZF".apply("float"),
          "ePFRV": this.properties."EPFRV".apply("float"),
          "sRSR": this.properties."ŠR_SR_".apply("float"),
          "vyplatenaSumaSpolu": this.properties."Vyplatená_suma_spolu".apply("float"),
          "vyplatenaSumaNa1Obyvatela": this.properties."Vyplatená_suma_na_1_obyvateľa".apply("float"),
          "pocetObyvatelstva": this.properties."Počet_obyvateľstva".apply("integer"),
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/PPA_dataset_AGOL_1/FeatureServer/0/query?where=1%3D1&outFields=Okres,K%C3%B3d_okresu,Rok___kampa%C5%88,EPZF,EPFRV,%C5%A0R_SR_,Vyplaten%C3%A1_suma_spolu,Vyplaten%C3%A1_suma_na_1_obyvate%C4%BEa,Po%C4%8Det_obyvate%C4%BEstva&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-ppa-platby-po-okresoch-bf09ef" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
