# The mapping of the od-hustota-obyvatelstva pipeline, generated from the T-4254 mapping: one StatisticalObservation per row of
# "Hustota obyvateľstva (2021)" (https://data.dev.joinedcontext.com/dataset/bbsk-hustota-obyvatelstva-2021-503a78). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "hustota-obyvatelstva-" + [this.properties."IDN4"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("StatisticalObservation", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "StatisticalObservation",
          "dOW": this.properties."DOW".apply("datetime"),
          "fACC": this.properties."FACC".apply("string"),
          "iDN4": this.properties."IDN4".apply("integer"),
          "nM4": this.properties."NM4".apply("string"),
          "iDN3": this.properties."IDN3".apply("integer"),
          "nM3": this.properties."NM3".apply("string"),
          "iDN2": this.properties."IDN2".apply("integer"),
          "nM2": this.properties."NM2".apply("string"),
          "vYMERA": this.properties."VYMERA".apply("float"),
          "nUTS1": this.properties."NUTS1".apply("string"),
          "nUTS1CODE": this.properties."NUTS1_CODE".apply("string"),
          "nUTS2": this.properties."NUTS2".apply("string"),
          "nUTS2CODE": this.properties."NUTS2_CODE".apply("string"),
          "nUTS3": this.properties."NUTS3".apply("string"),
          "nUTS3CODE": this.properties."NUTS3_CODE".apply("string"),
          "lAU1": this.properties."LAU1".apply("string"),
          "lAU1CODE": this.properties."LAU1_CODE".apply("string"),
          "lAU2": this.properties."LAU2".apply("string"),
          "lAU2CODE": this.properties."LAU2_CODE".apply("string"),
          "kodStatu": this.properties."Kód_štátu".apply("string"),
          "nazovStatu": this.properties."Názov_štátu".apply("string"),
          "kodOblasti": this.properties."Kód_oblasti".apply("string"),
          "nazovOblasti": this.properties."Názov_oblasti".apply("string"),
          "kodKraja": this.properties."Kód_kraja".apply("string"),
          "nazovKraja": this.properties."Názov_kraja".apply("string"),
          "kodOkresu": this.properties."Kód_okresu".apply("string"),
          "nazovOkresu": this.properties."Názov_okresu".apply("string"),
          "kodObce": this.properties."Kód_obce".apply("string"),
          "nazovObce": this.properties."Názov_obce".apply("string"),
          "priemernyVek": this.properties."Priemerný_vek".apply("float"),
          "medianovyVek": this.properties."Mediánový_vek".apply("float"),
          "indexStarnutia": this.properties."Index_starnutia____".apply("string"),
          "indexEkonomickehoZatazenia": this.properties."Index_ekonomického_zaťaženia___".apply("float"),
          "indexEkonomickejZavislostiMl": this.properties."Index_ekonomickej_závislosti_ml".apply("float"),
          "indexEkonomickejZavislostiSt": this.properties."Index_ekonomickej_závislosti_st".apply("float"),
          "billeterovIndex": this.properties."Billeterov_index____".apply("float"),
          "hustotaOsobyKm": this.properties."Hustota__osoby_km__".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mapa_SODB_2021_hustota_obyvate%C4%BEstva/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN4,NM4,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,LAU2,LAU2_CODE,K%C3%B3d_%C5%A1t%C3%A1tu,N%C3%A1zov_%C5%A1t%C3%A1tu,K%C3%B3d_oblasti,N%C3%A1zov_oblasti,K%C3%B3d_kraja,N%C3%A1zov_kraja,K%C3%B3d_okresu,N%C3%A1zov_okresu,K%C3%B3d_obce,N%C3%A1zov_obce,Priemern%C3%BD_vek,Medi%C3%A1nov%C3%BD_vek,Index_starnutia____,Index_ekonomick%C3%A9ho_za%C5%A5a%C5%BEenia___,Index_ekonomickej_z%C3%A1vislosti_ml,Index_ekonomickej_z%C3%A1vislosti_st,Billeterov_index____,Hustota__osoby_km__&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-hustota-obyvatelstva-2021-503a78" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
