# The mapping of the od-obyvatelstvo-podla-ekonomickej-aktivity pipeline, generated from the T-4254 mapping: one StatisticalObservation per row of
# "Obyvateľstvo podľa ekonomickej aktivity (2021)" (https://data.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-ekonomickej-aktivity-2021-984966). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "obyvatelstvo-podla-ekonomickej-aktivity-" + [this.properties."IDN4"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("StatisticalObservation", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "StatisticalObservation",
          "dOW": this.properties."DOW".apply("datetime"),
          "fACC": this.properties."FACC".apply("string"),
          "iDN4": this.properties."IDN4".apply("integer"),
          "nM4": this.properties."NM4".apply("string"),
          "iDN3": this.properties."IDN3".apply("integer"),
          "nM3": this.properties."NM3".apply("string"),
          "iDN2": this.properties."IDN2".apply("integer"),
          "nM2": this.properties."NM2".apply("string"),
          "vYMERA": this.properties."VYMERA".apply("float"),
          "nUTS1": this.properties."NUTS1".apply("string"),
          "nUTS1CODE": this.properties."NUTS1_CODE".apply("string"),
          "nUTS2": this.properties."NUTS2".apply("string"),
          "nUTS2CODE": this.properties."NUTS2_CODE".apply("string"),
          "nUTS3": this.properties."NUTS3".apply("string"),
          "nUTS3CODE": this.properties."NUTS3_CODE".apply("string"),
          "lAU1": this.properties."LAU1".apply("string"),
          "lAU1CODE": this.properties."LAU1_CODE".apply("string"),
          "lAU2": this.properties."LAU2".apply("string"),
          "lAU2CODE": this.properties."LAU2_CODE".apply("string"),
          "kodObce": this.properties."Kód_obce".apply("string"),
          "uzemnaJednotka": this.properties."Územná_jednotka".apply("string"),
          "okres": this.properties."Okres".apply("string"),
          "spolu": this.properties."Spolu".apply("integer"),
          "pracujuciOkremDochodcovAb": this.properties."pracujúci__okrem_dôchodcov___ab".apply("integer"),
          "pracujuciOkremDochodcov": this.properties."pracujúci__okrem_dôchodcov_____".apply("float"),
          "pracujuciDochodcaAbs": this.properties."pracujúci_dôchodca__abs__".apply("integer"),
          "pracujuciDochodca": this.properties."pracujúci_dôchodca____".apply("float"),
          "osobaNaMaterskejDovolenkeA": this.properties."osoba_na_materskej_dovolenke__a".apply("integer"),
          "osobaNaMaterskejDovolenke": this.properties."osoba_na_materskej_dovolenke___".apply("float"),
          "osobaNaRodicovskejDovolenke": this.properties."osoba_na_rodičovskej_dovolenke_".apply("integer"),
          "osobaNaRodicovskejDovolenke1": this.properties."osoba_na_rodičovskej_dovolenke1".apply("float"),
          "nezamestnanyAbs": this.properties."nezamestnaný__abs__".apply("integer"),
          "nezamestnany": this.properties."nezamestnaný____".apply("float"),
          "ziakStrednejSkolyAbs": this.properties."žiak_strednej_školy__abs__".apply("integer"),
          "ziakStrednejSkoly": this.properties."žiak_strednej_školy____".apply("float"),
          "studentVysokejSkolyAbs": this.properties."študent_vysokej_školy__abs__".apply("integer"),
          "studentVysokejSkoly": this.properties."študent_vysokej_školy____".apply("float"),
          "osobaVDomacnostiAbs": this.properties."osoba_v_domácnosti__abs__".apply("integer"),
          "osobaVDomacnosti": this.properties."osoba_v_domácnosti____".apply("float"),
          "dochodcaAbs": this.properties."dôchodca__abs__".apply("integer"),
          "dochodca": this.properties."dôchodca____".apply("float"),
          "prijemcaKapitalovychPrijmov": this.properties."príjemca_kapitálových_príjmov__".apply("integer"),
          "prijemcaKapitalovychPrijmov1": this.properties."príjemca_kapitálových_príjmov_1".apply("float"),
          "ziakZakladnejSkolyAbs": this.properties."žiak_základnej_školy__abs__".apply("integer"),
          "ziakZakladnejSkoly": this.properties."žiak_základnej_školy____".apply("float"),
          "dietaDoZacatiaPovinnejSkols": this.properties."dieťa_do_začatia_povinnej_škols".apply("integer"),
          "dietaDoZacatiaPovinnejSko1": this.properties."dieťa_do_začatia_povinnej_ško_1".apply("float"),
          "inaAbs": this.properties."iná__abs__".apply("integer"),
          "ina": this.properties."iná____".apply("float"),
          "nezisteneAbs": this.properties."nezistené__abs__".apply("integer"),
          "nezistene": this.properties."nezistené____".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mapa_SODB_2021_pracuj%C3%BAci_nezaestnan%C3%AD/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN4,NM4,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,LAU2,LAU2_CODE,K%C3%B3d_obce,%C3%9Azemn%C3%A1_jednotka,Okres,Spolu,pracuj%C3%BAci__okrem_d%C3%B4chodcov___ab,pracuj%C3%BAci__okrem_d%C3%B4chodcov_____,pracuj%C3%BAci_d%C3%B4chodca__abs__,pracuj%C3%BAci_d%C3%B4chodca____,osoba_na_materskej_dovolenke__a,osoba_na_materskej_dovolenke___,osoba_na_rodi%C4%8Dovskej_dovolenke_,osoba_na_rodi%C4%8Dovskej_dovolenke1,nezamestnan%C3%BD__abs__,nezamestnan%C3%BD____,%C5%BEiak_strednej_%C5%A1koly__abs__,%C5%BEiak_strednej_%C5%A1koly____,%C5%A1tudent_vysokej_%C5%A1koly__abs__,%C5%A1tudent_vysokej_%C5%A1koly____,osoba_v_dom%C3%A1cnosti__abs__,osoba_v_dom%C3%A1cnosti____,d%C3%B4chodca__abs__,d%C3%B4chodca____,pr%C3%ADjemca_kapit%C3%A1lov%C3%BDch_pr%C3%ADjmov__,pr%C3%ADjemca_kapit%C3%A1lov%C3%BDch_pr%C3%ADjmov_1,%C5%BEiak_z%C3%A1kladnej_%C5%A1koly__abs__,%C5%BEiak_z%C3%A1kladnej_%C5%A1koly____,die%C5%A5a_do_za%C4%8Datia_povinnej_%C5%A1kols,die%C5%A5a_do_za%C4%8Datia_povinnej_%C5%A1ko_1,in%C3%A1__abs__,in%C3%A1____,nezisten%C3%A9__abs__,nezisten%C3%A9____&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-ekonomickej-aktivity-2021-984966" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
