# The mapping of the od-dotacie-2 pipeline, generated from the T-4254 mapping: one Grant per row of
# "Dotácie" (https://opendata.dev.joinedcontext.com/dataset/bbsk-dotacie-bada80). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
    # every further page of them is read (T-5288). One run holds every page, so a layer past
    # 10000 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
    - branch:
        request_map: |
          root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
        processors:
          - http:
              url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/VZN_Sharepoint_listy/FeatureServer/0/query?where=I%C4%8CO%20IS%20NOT%20NULL%20AND%20I%C4%8CO%20%3C%3E%20%27%27&returnCountOnly=true&f=json"
              verb: GET
              headers:
                Accept: application/json
              timeout: 60s
              retries: 2
              rate_limit: pipeline_egress
        result_map: |
          root.rowCount = this.count.or(this.error.message.or("no count"))
    - mapping: |
        let rows = this.rowCount.or(null)
        root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 10000 { [{ "problem": "the layer holds %v rows, more than the 10000 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
    - unarchive:
        format: json_array
    - switch:
        - check: this.offset.or(null) != null
          processors:
            - mapping: |
                meta offset = this.offset
                meta rows = this.rowCount
                root = ""
            - http:
                url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/VZN_Sharepoint_listy/FeatureServer/0/query?where=I%C4%8CO%20IS%20NOT%20NULL%20AND%20I%C4%8CO%20%3C%3E%20%27%27&outFields=%C4%8C%C3%ADslo,Typ_dot%C3%A1cie,Prv%C3%A9_doru%C4%8Denie,Stav_finan__vy%C3%BA%C4%8Dtovania,D%C3%A1tum_doru%C4%8Denia_vy%C3%BA%C4%8Dtovania,D%C3%A1tum_zverejnenia_zmluvy,D%C3%A1tum_%C3%BAhrady_dot%C3%A1cie,%C4%8C__zmluvy,%C5%BDiadate%C4%BE,%C4%8C__dod%C3%A1vate%C4%BEa,I%C4%8CO,Pr%C3%A1vna_forma,Schv%C3%A1len%C3%A1_v%C3%BD%C5%A1ka_dot%C3%A1cie,Skuto%C4%8Dn%C3%A9_%C4%8Derpanie,Rozdiel_na_vr%C3%A1tenie,Vr%C3%A1ten%C3%A1_nedo%C4%8Derpan%C3%A1_%C4%8Das%C5%A5_dot%C3%A1cie_d%C5%88a,N%C3%A1zov,Po%C5%BEadovan%C3%A1_dot%C3%A1cia,Opr%C3%A1vnen%C3%A9_spolu,Kampa%C5%88,Stav_%C5%BEiadosti,Pozn%C3%A1mky,D%C3%A1tum_realiz%C3%A1cie_projektu,Ulica_a_%C4%8D%C3%ADslo,Rozpo%C4%8Det,Okres,V_s%C3%BAlade_s_prioritami_poskytovania_dot%C3%A1ci%C3%AD,ID,%C5%A0tatut%C3%A1rny_z%C3%A1stupca,VZN,PS%C4%8C,S%C3%ADdlo,Rok,Po%C4%8Det_det%C3%AD,Po%C4%8Det_dn%C3%AD,Typ_t%C3%A1bora,Denn%C3%A9_t%C3%A1bory,Pobytov%C3%A9_t%C3%A1bory&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000"
                verb: GET
                headers:
                  Accept: application/geo+json
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else if this.features.or(null) == null { { "problem": "the page at %v answered no features: %v".format(@offset, this.error.message.or("")) } } else if this.features.length() < [1000, @rows - @offset].min() { { "problem": "the page at %v answered %v rows where %v were due".format(@offset, this.features.length(), [1000, @rows - @offset].min()) } } else { this }
    # A refusal above fails the run and writes none of its message's rows.
    - mapping: |
        root = if this.problem.or(null) != null { throw(this.problem) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    # A row stays only when its IČO looks like one, which no Esri SQL can ask:
    # a row without an IČO, or with a name where the IČO belongs, can name a natural person (T-4255).
    - mapping: |
        root = if this.properties."IČO".or("").string().trim().re_match("^[0-9]{6,8}( ?[0-9]{4})?$") { this } else { deleted() }
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
        # anything else reads as a datetime (T-4288).
        map observed {
          let x = this
          root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
            $x.apply("datetime").value.catch(null)
          }
        }
        # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
        map stamped {
          root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "dotacie-2-" + {"Číslo": this.properties."Číslo", "Typ_dotácie": this.properties."Typ_dotácie", "Prvé_doručenie": this.properties."Prvé_doručenie", "Stav_finan__vyúčtovania": this.properties."Stav_finan__vyúčtovania", "Dátum_doručenia_vyúčtovania": this.properties."Dátum_doručenia_vyúčtovania", "Dátum_zverejnenia_zmluvy": this.properties."Dátum_zverejnenia_zmluvy", "Dátum_úhrady_dotácie": this.properties."Dátum_úhrady_dotácie", "Č__zmluvy": this.properties."Č__zmluvy", "Žiadateľ": this.properties."Žiadateľ", "Č__dodávateľa": this.properties."Č__dodávateľa", "IČO": this.properties."IČO", "Právna_forma": this.properties."Právna_forma", "Schválená_výška_dotácie": this.properties."Schválená_výška_dotácie", "Skutočné_čerpanie": this.properties."Skutočné_čerpanie", "Rozdiel_na_vrátenie": this.properties."Rozdiel_na_vrátenie", "Vrátená_nedočerpaná_časť_dotácie_dňa": this.properties."Vrátená_nedočerpaná_časť_dotácie_dňa", "Názov": this.properties."Názov", "Požadovaná_dotácia": this.properties."Požadovaná_dotácia", "Oprávnené_spolu": this.properties."Oprávnené_spolu", "Kampaň": this.properties."Kampaň", "Stav_žiadosti": this.properties."Stav_žiadosti", "Poznámky": this.properties."Poznámky", "Dátum_realizácie_projektu": this.properties."Dátum_realizácie_projektu", "Ulica_a_číslo": this.properties."Ulica_a_číslo", "Rozpočet": this.properties."Rozpočet", "Okres": this.properties."Okres", "V_súlade_s_prioritami_poskytovania_dotácií": this.properties."V_súlade_s_prioritami_poskytovania_dotácií", "ID": this.properties."ID", "Štatutárny_zástupca": this.properties."Štatutárny_zástupca", "VZN": this.properties."VZN", "PSČ": this.properties."PSČ", "Sídlo": this.properties."Sídlo", "Rok": this.properties."Rok", "Počet_detí": this.properties."Počet_detí", "Počet_dní": this.properties."Počet_dní", "Typ_tábora": this.properties."Typ_tábora", "Denné_tábory": this.properties."Denné_tábory", "Pobytové_tábory": this.properties."Pobytové_tábory"}.format_json(no_indent: true).hash("sha256").encode("hex").slice(0, 24).re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("Grant", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "Grant",
          "identifier": this.properties."Číslo".apply("string"),
          "typDotacie": this.properties."Typ_dotácie".apply("string"),
          "prveDorucenie": this.properties."Prvé_doručenie".apply("date"),
          "stavFinanVyuctovania": this.properties."Stav_finan__vyúčtovania".apply("string"),
          "datumDoruceniaVyuctovania": this.properties."Dátum_doručenia_vyúčtovania".apply("date"),
          "datumZverejneniaZmluvy": this.properties."Dátum_zverejnenia_zmluvy".apply("date"),
          "datumUhradyDotacie": this.properties."Dátum_úhrady_dotácie".apply("date"),
          "cZmluvy": this.properties."Č__zmluvy".apply("string"),
          "ziadatel": this.properties."Žiadateľ".apply("string"),
          "cDodavatela": this.properties."Č__dodávateľa".apply("string"),
          "iCO": this.properties."IČO".apply("string"),
          "pravnaForma": this.properties."Právna_forma".apply("string"),
          "schvalenaVyskaDotacie": this.properties."Schválená_výška_dotácie".apply("float"),
          "skutocneCerpanie": this.properties."Skutočné_čerpanie".apply("float"),
          "rozdielNaVratenie": this.properties."Rozdiel_na_vrátenie".apply("float"),
          "vratenaNedocerpanaCastDotacieDna": this.properties."Vrátená_nedočerpaná_časť_dotácie_dňa".apply("string"),
          "name": this.properties."Názov".apply("string"),
          "pozadovanaDotacia": this.properties."Požadovaná_dotácia".apply("integer"),
          "opravneneSpolu": this.properties."Oprávnené_spolu".apply("integer"),
          "kampan": this.properties."Kampaň".apply("string"),
          "stavZiadosti": this.properties."Stav_žiadosti".apply("string"),
          "poznamky": this.properties."Poznámky".apply("string"),
          "datumRealizacieProjektu": this.properties."Dátum_realizácie_projektu".apply("string"),
          "ulicaACislo": this.properties."Ulica_a_číslo".apply("string"),
          "rozpocet": this.properties."Rozpočet".apply("float"),
          "okres": this.properties."Okres".apply("string"),
          "vSuladeSPrioritamiPoskytovaniaDotacii": this.properties."V_súlade_s_prioritami_poskytovania_dotácií".apply("string"),
          "iD": this.properties."ID".apply("integer"),
          "statutarnyZastupca": this.properties."Štatutárny_zástupca".apply("string"),
          "vZN": this.properties."VZN".apply("string"),
          "pSC": this.properties."PSČ".apply("string"),
          "sidlo": this.properties."Sídlo".apply("string"),
          "rok": this.properties."Rok".apply("string"),
          "pocetDeti": this.properties."Počet_detí".apply("string"),
          "pocetDni": this.properties."Počet_dní".apply("string"),
          "typTabora": this.properties."Typ_tábora".apply("string"),
          "denneTabory": this.properties."Denné_tábory".apply("string"),
          "pobytoveTabory": this.properties."Pobytové_tábory".apply("string"),
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/VZN_Sharepoint_listy/FeatureServer/0/query?where=I%C4%8CO%20IS%20NOT%20NULL%20AND%20I%C4%8CO%20%3C%3E%20%27%27&outFields=%C4%8C%C3%ADslo,Typ_dot%C3%A1cie,Prv%C3%A9_doru%C4%8Denie,Stav_finan__vy%C3%BA%C4%8Dtovania,D%C3%A1tum_doru%C4%8Denia_vy%C3%BA%C4%8Dtovania,D%C3%A1tum_zverejnenia_zmluvy,D%C3%A1tum_%C3%BAhrady_dot%C3%A1cie,%C4%8C__zmluvy,%C5%BDiadate%C4%BE,%C4%8C__dod%C3%A1vate%C4%BEa,I%C4%8CO,Pr%C3%A1vna_forma,Schv%C3%A1len%C3%A1_v%C3%BD%C5%A1ka_dot%C3%A1cie,Skuto%C4%8Dn%C3%A9_%C4%8Derpanie,Rozdiel_na_vr%C3%A1tenie,Vr%C3%A1ten%C3%A1_nedo%C4%8Derpan%C3%A1_%C4%8Das%C5%A5_dot%C3%A1cie_d%C5%88a,N%C3%A1zov,Po%C5%BEadovan%C3%A1_dot%C3%A1cia,Opr%C3%A1vnen%C3%A9_spolu,Kampa%C5%88,Stav_%C5%BEiadosti,Pozn%C3%A1mky,D%C3%A1tum_realiz%C3%A1cie_projektu,Ulica_a_%C4%8D%C3%ADslo,Rozpo%C4%8Det,Okres,V_s%C3%BAlade_s_prioritami_poskytovania_dot%C3%A1ci%C3%AD,ID,%C5%A0tatut%C3%A1rny_z%C3%A1stupca,VZN,PS%C4%8C,S%C3%ADdlo,Rok,Po%C4%8Det_det%C3%AD,Po%C4%8Det_dn%C3%AD,Typ_t%C3%A1bora,Denn%C3%A9_t%C3%A1bory,Pobytov%C3%A9_t%C3%A1bory&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-dotacie-bada80" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - split:
        size: 1000
        byte_size: 2097152
    - archive:
        format: json_array
