# Registered jobseekers at year end, the kraj and its 13 okresy, every year the cube carries (1996 on). The cube also reaches every municipality, but a URL naming 516 codes is refused (403) and `*` would read all of Slovakia, so the municipalities wait for a filter the API does not have. No key, CC-BY-4.0 (NKOD record of ŠÚ SR, legislation:termsOfUse).
