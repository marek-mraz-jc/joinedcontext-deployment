          "nezistenaAbs": this.properties."nezistená__abs__".apply("integer"),
          "nezistena": this.properties."nezistená____".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mapa_SODB_2021_%C4%8Fal%C5%A1ia_n%C3%A1rodnos%C5%A5/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN4,NM4,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,LAU2,LAU2_CODE,K%C3%B3d_obce,%C3%9Azemn%C3%A1_jednotka,K%C3%B3d_okresu,Okres,Spolu,slovensk%C3%A1__abs__,slovensk%C3%A1____,ma%C4%8Farsk%C3%A1__abs__,ma%C4%8Farsk%C3%A1____,r%C3%B3mska__abs__,r%C3%B3mska____,rus%C3%ADnska__abs__,rus%C3%ADnska____,%C4%8Desk%C3%A1__abs__,%C4%8Desk%C3%A1____,ukrajinsk%C3%A1__abs__,ukrajinsk%C3%A1____,nemeck%C3%A1__abs__,nemeck%C3%A1____,moravsk%C3%A1__abs__,moravsk%C3%A1____,po%C4%BEsk%C3%A1__abs__,po%C4%BEsk%C3%A1____,rusk%C3%A1__abs__,rusk%C3%A1____,vietnamsk%C3%A1__abs__,vietnamsk%C3%A1____,bulharsk%C3%A1__abs__,bulharsk%C3%A1____,chorv%C3%A1tska__abs__,chorv%C3%A1tska____,srbsk%C3%A1__abs__,srbsk%C3%A1____,%C5%BEidovsk%C3%A1__abs__,%C5%BEidovsk%C3%A1____,rumunsk%C3%A1__abs__,rumunsk%C3%A1____,alb%C3%A1nska__abs__,alb%C3%A1nska____,rak%C3%BAska__abs__,rak%C3%BAska____,gr%C3%A9cka__abs__,gr%C3%A9cka____,sliezska__abs__,sliezska____,%C4%8D%C3%ADnska__abs__,%C4%8D%C3%ADnska____,talianska__abs__,talianska____,k%C3%B3rejsk%C3%A1__abs__,k%C3%B3rejsk%C3%A1____,anglick%C3%A1__abs__,anglick%C3%A1____,franc%C3%BAzska__abs__,franc%C3%BAzska____,tureck%C3%A1__abs__,tureck%C3%A1____,ir%C3%A1nska__abs__,ir%C3%A1nska____,%C3%ADrska__abs__,%C3%ADrska____,kanadsk%C3%A1__abs__,kanadsk%C3%A1____,in%C3%A1__abs__,in%C3%A1____,nezisten%C3%A1__abs__,nezisten%C3%A1____&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
