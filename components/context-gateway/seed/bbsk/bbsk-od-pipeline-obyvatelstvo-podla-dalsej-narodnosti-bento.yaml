          "iranska": this.properties."iránska____".apply("float"),
          "irskaAbs": this.properties."írska__abs__".apply("integer"),
          "irska": this.properties."írska____".apply("float"),
          "kanadskaAbs": this.properties."kanadská__abs__".apply("integer"),
          "kanadska": this.properties."kanadská____".apply("float"),
          "inaAbs": this.properties."iná__abs__".apply("integer"),
