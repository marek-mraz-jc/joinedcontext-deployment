# The mapping of the od-priepusty-v-banskobystrickom-kraji-publi pipeline, generated from the T-4254 mapping: one RoadStructure per row of
# "Priepusty v Banskobystrickom kraji (public view)" (https://data.dev.joinedcontext.com/dataset/bbsk-priepusty-v-banskobystrickom-kraji-public-view-a9ed8e). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    # Page 0 as it came; when the layer says there is more, every further page up to half again
    # the 7078 rows it held when mapped (ponytail: a static page count; past that the
    # newest rows wait until the mapping is regenerated). A page past the end is empty.
    - mapping: |
        root = if this.properties.exceededTransferLimit.or(false) { [this].concat(range(1, 11).map_each(p -> { "offset": p * 1000 })) } else { [this] }
    - unarchive:
        format: json_array
    - switch:
        - check: this.offset.or(null) != null
          processors:
            - mapping: |
                meta offset = this.offset.string()
                root = ""
            - http:
                url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Priepusty_v_Banskobystrickom_kraji_(public_view)/FeatureServer/2/query?where=1%3D1&outFields=Trieda_PK,%C4%8C%C3%ADslo_PK,ID_%C4%8D%C3%ADslo_priepustu,Stavebno_technick%C3%BD_stav,Materi%C3%A1l_priepustu,Kraj,Okres,Vlastn%C3%ADk,Typ_Spravcu,Spravca,Najbli%C5%BE%C5%A1%C3%AD_KM&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000"
                verb: GET
                headers:
                  Accept: application/geo+json
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "priepusty-v-banskobystrickom-kraji-publi-" + [this.properties."ID_číslo_priepustu"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("RoadStructure", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "RoadStructure",
          "triedaPK": this.properties."Trieda_PK".apply("string"),
          "cisloPK": this.properties."Číslo_PK".apply("string"),
          "iDCisloPriepustu": this.properties."ID_číslo_priepustu".apply("string"),
          "stavebnoTechnickyStav": this.properties."Stavebno_technický_stav".apply("string"),
          "materialPriepustu": this.properties."Materiál_priepustu".apply("string"),
          "kraj": this.properties."Kraj".apply("string"),
          "okres": this.properties."Okres".apply("string"),
          "vlastnik": this.properties."Vlastník".apply("string"),
          "typSpravcu": this.properties."Typ_Spravcu".apply("string"),
          "spravca": this.properties."Spravca".apply("string"),
          "najblizsiKM": this.properties."Najbližší_KM".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Priepusty_v_Banskobystrickom_kraji_(public_view)/FeatureServer/2/query?where=1%3D1&outFields=Trieda_PK,%C4%8C%C3%ADslo_PK,ID_%C4%8D%C3%ADslo_priepustu,Stavebno_technick%C3%BD_stav,Materi%C3%A1l_priepustu,Kraj,Okres,Vlastn%C3%ADk,Typ_Spravcu,Spravca,Najbli%C5%BE%C5%A1%C3%AD_KM&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-priepusty-v-banskobystrickom-kraji-public-view-a9ed8e" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
