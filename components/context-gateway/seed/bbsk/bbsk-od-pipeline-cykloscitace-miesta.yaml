# One PointOfInterest per row of "Cyklosčítače - miesta" (T-4255); the counting sites; no counts in the layer.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-cykloscitace-miesta
  namespace: bbsk
  title:
    sk: Cyklosčítače - miesta
    en: Cyklosčítače - miesta
spec:
  class: scheduled
  enabled: true
  schedule: 14 1 * * 3
  source:
    dataSourceRef:
      kind: DataSource
      name: od-cykloscitace-miesta
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: PointOfInterest
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
