# One Organization per row of "Materské školy v Banskobystrickom kraji" (T-4255); schools as schema.org organizations.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-materske-skoly-v-banskobystrickom-kraji
  namespace: bbsk
  title:
    sk: Materské školy v Banskobystrickom kraji
    en: Materské školy v Banskobystrickom kraji
spec:
  class: scheduled
  enabled: false
  schedule: 17 2 * * 5
  source:
    dataSourceRef:
      kind: DataSource
      name: od-materske-skoly-v-banskobystrickom-kraji
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: Organization
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
