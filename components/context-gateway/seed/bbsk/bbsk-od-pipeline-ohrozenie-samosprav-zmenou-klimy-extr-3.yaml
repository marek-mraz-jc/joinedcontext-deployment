# One StatisticalObservation per row of "Ohrozenie samospráv zmenou klímy - extrémne zrážky" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-ohrozenie-samosprav-zmenou-klimy-extr-3
  namespace: bbsk
  title:
    sk: Ohrozenie samospráv zmenou klímy - extrémne zrážky
    en: Ohrozenie samospráv zmenou klímy - extrémne zrážky
spec:
  class: scheduled
  enabled: false
  schedule: 43 1 22 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-ohrozenie-samosprav-zmenou-klimy-extr-3
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: StatisticalObservation
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
