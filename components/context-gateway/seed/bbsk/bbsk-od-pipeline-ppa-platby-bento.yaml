# The mapping of the od-ppa-platby pipeline, generated from the T-4254 mapping: one Grant per row of
# "PPA platby" (https://data.dev.joinedcontext.com/dataset/bbsk-ppa-platby-f3c509). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    # Page 0 as it came; when the layer says there is more, every further page up to half again
    # the 13750 rows it held when mapped (ponytail: a static page count; past that the
    # newest rows wait until the mapping is regenerated). A page past the end is empty.
    - mapping: |
        root = if this.properties.exceededTransferLimit.or(false) { [this].concat(range(1, 21).map_each(p -> { "offset": p * 1000 })) } else { [this] }
    - unarchive:
        format: json_array
    - switch:
        - check: this.offset.or(null) != null
          processors:
            - mapping: |
                meta offset = this.offset.string()
                root = ""
            - http:
                url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/PPA_dataset_AGOL_2/FeatureServer/0/query?where=1%3D1&outFields=Rok___kampa%C5%88,Dota%C4%8Dn%C3%BD_titul,Popis_dota%C4%8Dn%C3%A9ho_titulu,Obec__PO_,Okres,EPZF___s%C3%BA%C4%8Det,EPFRV___s%C3%BA%C4%8Det,%C5%A0R_SR___s%C3%BA%C4%8Det,Vyplaten%C3%A1_suma_spolu___s%C3%BA%C4%8Det&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000"
                verb: GET
                headers:
                  Accept: application/geo+json
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "ppa-platby-" + {"Rok___kampaň": this.properties."Rok___kampaň", "Dotačný_titul": this.properties."Dotačný_titul", "Popis_dotačného_titulu": this.properties."Popis_dotačného_titulu", "Obec__PO_": this.properties."Obec__PO_", "Okres": this.properties."Okres", "EPZF___súčet": this.properties."EPZF___súčet", "EPFRV___súčet": this.properties."EPFRV___súčet", "ŠR_SR___súčet": this.properties."ŠR_SR___súčet", "Vyplatená_suma_spolu___súčet": this.properties."Vyplatená_suma_spolu___súčet"}.format_json(no_indent: true).hash("sha256").encode("hex").slice(0, 24).re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("Grant", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "Grant",
          "rokKampan": this.properties."Rok___kampaň".apply("integer"),
          "dotacnyTitul": this.properties."Dotačný_titul".apply("string"),
          "popisDotacnehoTitulu": this.properties."Popis_dotačného_titulu".apply("string"),
          "obecPO": this.properties."Obec__PO_".apply("string"),
          "okres": this.properties."Okres".apply("string"),
          "ePZFSucet": this.properties."EPZF___súčet".apply("float"),
          "ePFRVSucet": this.properties."EPFRV___súčet".apply("float"),
          "sRSRSucet": this.properties."ŠR_SR___súčet".apply("float"),
          "vyplatenaSumaSpoluSucet": this.properties."Vyplatená_suma_spolu___súčet".apply("float"),
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/PPA_dataset_AGOL_2/FeatureServer/0/query?where=1%3D1&outFields=Rok___kampa%C5%88,Dota%C4%8Dn%C3%BD_titul,Popis_dota%C4%8Dn%C3%A9ho_titulu,Obec__PO_,Okres,EPZF___s%C3%BA%C4%8Det,EPFRV___s%C3%BA%C4%8Det,%C5%A0R_SR___s%C3%BA%C4%8Det,Vyplaten%C3%A1_suma_spolu___s%C3%BA%C4%8Det&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-ppa-platby-f3c509" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
