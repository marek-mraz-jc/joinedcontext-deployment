# One EVChargingStation per row of "Nabíjačky a Zastávky" (T-4255); generated from the T-4254 mapping.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-nabijacky-a-zastavky
  namespace: bbsk
  title:
    sk: Nabíjačky a Zastávky
    en: Nabíjačky a Zastávky
spec:
  class: scheduled
  schedule: 41 3 * * 3
  source:
    dataSourceRef:
      kind: DataSource
      name: od-nabijacky-a-zastavky
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: EVChargingStation
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
