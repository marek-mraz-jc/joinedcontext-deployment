# The mapping of the od-hustota-obyvatelstva-v-obciach-bbk pipeline, generated from the T-4254 mapping: one KeyPerformanceIndicator per row of
# "Hustota obyvateľstva v obciach BBK" (https://opendata.dev.joinedcontext.com/dataset/bbsk-hustota-obyvatelstva-v-obciach-bbk-79fd96). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
    # every further page of them is read (T-5288). One run holds every page, so a layer past
    # 10000 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
    - branch:
        request_map: |
          root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
        processors:
          - http:
              url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Hustota_obyvate%C4%BEstva_obce_BBK1/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
              verb: GET
              headers:
                Accept: application/json
              timeout: 60s
              retries: 2
              rate_limit: pipeline_egress
        result_map: |
          root.rowCount = this.count.or(this.error.message.or("no count"))
    - mapping: |
        let rows = this.rowCount.or(null)
        root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 10000 { [{ "problem": "the layer holds %v rows, more than the 10000 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
    - unarchive:
        format: json_array
    - switch:
        - check: this.offset.or(null) != null
          processors:
            - mapping: |
                meta offset = this.offset
                meta rows = this.rowCount
                root = ""
            - http:
                url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Hustota_obyvate%C4%BEstva_obce_BBK1/FeatureServer/0/query?where=1%3D1&outFields=Okres,KOD_STAT_okres,KOD_NUTS_okres,Obec_dlhy_nazov,obec_kratkyNazov,STAT_KOD_obec,KOD_NUTS_obec,F2025,F2024,F2023,F2022,F2021,F2020,F2019,F2018,F2017,F2016,F2015,F2014,F2013,F2012,F2011,F2010,F2009,F2008,F2007,F2006,F2005,F2004,F2003,F2002,F2001,F2000&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000&orderByFields=OBJECTID"
                verb: GET
                headers:
                  Accept: application/geo+json
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else if this.features.or(null) == null { { "problem": "the page at %v answered no features: %v".format(@offset, this.error.message.or("")) } } else if this.features.length() < [1000, @rows - @offset].min() { { "problem": "the page at %v answered %v rows where %v were due".format(@offset, this.features.length(), [1000, @rows - @offset].min()) } } else { this }
    # A refusal above fails the run and writes none of its message's rows.
    - mapping: |
        root = if this.problem.or(null) != null { throw(this.problem) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
        # anything else reads as a datetime (T-4288).
        map observed {
          let x = this
          root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
            $x.apply("datetime").value.catch(null)
          }
        }
        # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
        map stamped {
          root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "hustota-obyvatelstva-v-obciach-bbk-" + [this.properties."KOD_NUTS_obec"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "KeyPerformanceIndicator",
          "okres": this.properties."Okres".apply("string"),
          "kODSTATOkres": this.properties."KOD_STAT_okres".apply("string"),
          "kODNUTSOkres": this.properties."KOD_NUTS_okres".apply("string"),
          "obecDlhyNazov": this.properties."Obec_dlhy_nazov".apply("string"),
          "obecKratkyNazov": this.properties."obec_kratkyNazov".apply("string"),
          "sTATKODObec": this.properties."STAT_KOD_obec".apply("string"),
          "kODNUTSObec": this.properties."KOD_NUTS_obec".apply("string"),
          "f2025": this.properties."F2025".apply("float"),
          "f2024": this.properties."F2024".apply("float"),
          "f2023": this.properties."F2023".apply("float"),
          "f2022": this.properties."F2022".apply("float"),
          "f2021": this.properties."F2021".apply("float"),
          "f2020": this.properties."F2020".apply("float"),
          "f2019": this.properties."F2019".apply("float"),
          "f2018": this.properties."F2018".apply("float"),
          "f2017": this.properties."F2017".apply("float"),
          "f2016": this.properties."F2016".apply("float"),
          "f2015": this.properties."F2015".apply("float"),
          "f2014": this.properties."F2014".apply("float"),
          "f2013": this.properties."F2013".apply("float"),
          "f2012": this.properties."F2012".apply("float"),
          "f2011": this.properties."F2011".apply("float"),
          "f2010": this.properties."F2010".apply("float"),
          "f2009": this.properties."F2009".apply("float"),
          "f2008": this.properties."F2008".apply("float"),
          "f2007": this.properties."F2007".apply("float"),
          "f2006": this.properties."F2006".apply("float"),
          "f2005": this.properties."F2005".apply("float"),
          "f2004": this.properties."F2004".apply("float"),
          "f2003": this.properties."F2003".apply("float"),
          "f2002": this.properties."F2002".apply("float"),
          "f2001": this.properties."F2001".apply("float"),
          "f2000": this.properties."F2000".apply("float"),
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Hustota_obyvate%C4%BEstva_obce_BBK1/FeatureServer/0/query?where=1%3D1&outFields=Okres,KOD_STAT_okres,KOD_NUTS_okres,Obec_dlhy_nazov,obec_kratkyNazov,STAT_KOD_obec,KOD_NUTS_obec,F2025,F2024,F2023,F2022,F2021,F2020,F2019,F2018,F2017,F2016,F2015,F2014,F2013,F2012,F2011,F2010,F2009,F2008,F2007,F2006,F2005,F2004,F2003,F2002,F2001,F2000&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000&orderByFields=OBJECTID" },
          "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-hustota-obyvatelstva-v-obciach-bbk-79fd96" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - split:
        size: 1000
        byte_size: 2097152
    - archive:
        format: json_array
