# Generated by seeds/bbsk-events/generate.py from the inventory row Zvolen (weby-feed),
# read 2026-10-20: https://www.zvolen.sk/aktualne-podujatia.html (T-4896). Do not edit: change the template or the CSV.
pipeline:
  processors:
  - xml:
      operator: to_json
  - mapping: |
      let items = if this.RDF.or(null) != null { this.RDF.item.or([]) } else if this.feed.or(null) != null { this.feed.entry.or([]) } else { throw("the feed is neither RSS 1.0 nor Atom") }
      let list = if $items.type() == "array" { $items } else { [$items] }
      root = $list.map_each(i -> {
        "name": i.title.or(null).(t -> if t.type() == "object" { t."#text".or(null) } else { t }),
        "url": i."-about".or(i.id.or(i.link.or(null).(l -> if l.type() == "object" { l."-href".or(null) } else { l }))).string().trim()
      })
  - unarchive:
      format: json_array
  - branch:
      request_map: |
        let path = this.url.or("").re_find_object("^https?://www\\.zvolen\\.sk/akcia/(?P<p>[A-Za-z0-9._-]{1,200}\\.html)$").p.or(null)
        root = if $path == null { deleted() } else { "" }
        meta event_path = $path
      processors:
      - sleep:
          duration: 1s
      - http:
          url: https://www.zvolen.sk/akcia/${! @event_path }
          verb: GET
          headers:
            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
            Accept: text/html
          timeout: 20s
          retries: 1
      result_map: |
        map field {
          root = this.page.re_find_object("act-" + this.cls + "[^\"]*\">\\s*<div class=\"data-name\">[^<]*</div>\\s*<div class=\"data-value[^\"]*\">(?P<v>[^<]*)</div>").v.or(null).(v -> if v != null { v.unescape_html().trim() } else { null })
        }
        map day {
          let m = this.or("").re_find_object("^(?P<d>[0-9]{1,2})\\. ?(?P<m>[0-9]{1,2})\\. ?(?P<y>[0-9]{4})$")
          root = if $m.y.or(null) == null { null } else { "%s-%02d-%02d".format($m.y, $m.m.number().int64(), $m.d.number().int64()) }
        }
        map at {
          let t = this.time.or("").re_find_all("[0-9]{1,2}:[0-9]{2}").index(this.n).catch(null)
          let hm = if $t != null { $t.split(":").map_each(x -> x.number().int64()) } else { null }
          let local = if $hm != null && this.date != null { "%sT%02d:%02d:00".format(this.date, $hm.index(0), $hm.index(1)) } else { null }
          root = if this.date == null { null } else if $local == null { this.date } else { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") }
        }
        let page = content().string()
        let from = { "page": $page, "cls": "date from" }.apply("field").apply("day")
        let to = { "page": $page, "cls": "date to" }.apply("field").apply("day")
        let time = { "page": $page, "cls": "time" }.apply("field")
        root.start = { "date": $from, "time": $time, "n": 0 }.apply("at")
        # "7:00 - 12:00" on one day ends at 12:00; a date range ends on its last day.
        root.end = if $to != null { $to } else if $time.or("").re_find_all("[0-9]{1,2}:[0-9]{2}").length() > 1 { { "date": $from, "time": $time, "n": 1 }.apply("at") } else { null }
        root.venue = { "page": $page, "cls": "place" }.apply("field")
        root.category = { "page": $page, "cls": "kat" }.apply("field")
        # "Usporiadateľ: Mesto Lučenec, LUKUS": who runs the event (T-5081).
        root.organizer = { "page": $page, "cls": "usp" }.apply("field").(o -> if o != null { { "name": o } } else { null })
