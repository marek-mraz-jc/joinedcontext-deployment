# One KeyPerformanceIndicator per row of "Obyvateľstvo podľa rodinného stavu (2021), okresy" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-obyvatelstvo-podla-rodinneho-stavu-2
  namespace: bbsk
  title:
    sk: Obyvateľstvo podľa rodinného stavu (2021), okresy
    en: Obyvateľstvo podľa rodinného stavu (2021), okresy
spec:
  class: scheduled
  enabled: true
  schedule: 1 1 16 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-obyvatelstvo-podla-rodinneho-stavu-2
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: replace
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
