# The mapping of the od-clenovia-samospravy pipeline, generated from the T-4254 mapping: one CouncilMember per row of
# "Členovia samosprávy" (https://data.dev.joinedcontext.com/dataset/bbsk-clenovia-samospravy-efc2f3). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "clenovia-samospravy-" + {"IČO_samosprávy": this.properties."IČO_samosprávy", "Názov_samosprávy": this.properties."Názov_samosprávy", "Orgán_samosprávy": this.properties."Orgán_samosprávy", "Titul_pred_menom": this.properties."Titul_pred_menom", "Meno": this.properties."Meno", "Priezvisko": this.properties."Priezvisko", "Titul_za_menom": this.properties."Titul_za_menom", "Funkcia": this.properties."Funkcia", "Obvod": this.properties."Obvod", "Názov_klubu": this.properties."Názov_klubu", "Vo_funkcii_od": this.properties."Vo_funkcii_od", "Vo_funkcii_do": this.properties."Vo_funkcii_do"}.format_json(no_indent: true).hash("sha256").encode("hex").slice(0, 24).re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("CouncilMember", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "CouncilMember",
          "iCOSamospravy": this.properties."IČO_samosprávy".apply("string"),
          "nazovSamospravy": this.properties."Názov_samosprávy".apply("string"),
          "organSamospravy": this.properties."Orgán_samosprávy".apply("string"),
          "titulPredMenom": this.properties."Titul_pred_menom".apply("string"),
          "meno": this.properties."Meno".apply("string"),
          "priezvisko": this.properties."Priezvisko".apply("string"),
          "titulZaMenom": this.properties."Titul_za_menom".apply("string"),
          "funkcia": this.properties."Funkcia".apply("string"),
          "obvod": this.properties."Obvod".apply("string"),
          "nazovKlubu": this.properties."Názov_klubu".apply("string"),
          "voFunkciiOd": this.properties."Vo_funkcii_od".apply("datetime"),
          "voFunkciiDo": this.properties."Vo_funkcii_do".apply("string"),
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/%C4%8Clenovia_samospr%C3%A1vy/FeatureServer/0/query?where=1%3D1&outFields=I%C4%8CO_samospr%C3%A1vy,N%C3%A1zov_samospr%C3%A1vy,Org%C3%A1n_samospr%C3%A1vy,Titul_pred_menom,Meno,Priezvisko,Titul_za_menom,Funkcia,Obvod,N%C3%A1zov_klubu,Vo_funkcii_od,Vo_funkcii_do&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-clenovia-samospravy-efc2f3" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
