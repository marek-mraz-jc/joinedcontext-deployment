# One KeyPerformanceIndicator per row of "Hustota obyvateľstva v obciach BBK" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-hustota-obyvatelstva-v-obciach-bbk
  namespace: bbsk
  title:
    sk: Hustota obyvateľstva v obciach BBK
    en: Hustota obyvateľstva v obciach BBK
spec:
  class: scheduled
  enabled: false
  schedule: 42 1 * * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-hustota-obyvatelstva-v-obciach-bbk
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
