# The mapping of the od-vekova-struktura-v-obciach pipeline, generated from the T-4254 mapping: one KeyPerformanceIndicator per row of
# "Veková štruktúra v obciach (1996 - 2022)" (https://opendata.dev.joinedcontext.com/dataset/bbsk-vekova-struktura-v-obciach-1996-2022-6de8c3). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
    # every further page of them is read (T-5288). One run holds every page, so a layer past
    # 29922 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
    - branch:
        request_map: |
          root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
        processors:
          - http:
              url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Join_Features_to_Obec3_WebMercator_view/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
              verb: GET
              headers:
                Accept: application/json
              timeout: 60s
              retries: 2
              rate_limit: pipeline_egress
        result_map: |
          root.rowCount = this.count.or(this.error.message.or("no count"))
    - mapping: |
        let rows = this.rowCount.or(null)
        root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 29922 { [{ "problem": "the layer holds %v rows, more than the 29922 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
    - unarchive:
        format: json_array
    - switch:
        - check: this.offset.or(null) != null
          processors:
            - mapping: |
                meta offset = this.offset
                meta rows = this.rowCount
                root = ""
            - http:
                url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Join_Features_to_Obec3_WebMercator_view/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN4,NM4,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,LAU2,LAU2_CODE,nuts_kraj,nuts_okres,nuts_obec,Okres,Obec,Rok,Index_ekonomick%C3%A9ho_za%C5%A5a%C5%BEenia_os,Index_ekonomickej_z%C3%A1vislosti_ml,Index_ekonomickej_z%C3%A1vislosti_st,Index_starnutia__Percento_,Medi%C3%A1nov%C3%BD_vek__Rok_,Priemern%C3%BD_vek_obyvate%C4%BEa__Rok_,Podiel_os%C3%B4b_v_predprodukt%C3%ADvnom_,Podiel_os%C3%B4b_v_produkt%C3%ADvnom_veku,Podiel_os%C3%B4b_v_poprodukt%C3%ADvnom_ve&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000"
                verb: GET
                headers:
                  Accept: application/geo+json
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else if this.features.or(null) == null { { "problem": "the page at %v answered no features: %v".format(@offset, this.error.message.or("")) } } else if this.features.length() < [1000, @rows - @offset].min() { { "problem": "the page at %v answered %v rows where %v were due".format(@offset, this.features.length(), [1000, @rows - @offset].min()) } } else { this }
    # A refusal above fails the run and writes none of its message's rows.
    - mapping: |
        root = if this.problem.or(null) != null { throw(this.problem) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
        # anything else reads as a datetime (T-4288).
        map observed {
          let x = this
          root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
            $x.apply("datetime").value.catch(null)
          }
        }
        # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
        map stamped {
          root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "vekova-struktura-v-obciach-" + [this.properties."IDN4", this.properties."Rok"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        let at = this.properties."Rok".apply("observed")
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "KeyPerformanceIndicator",
          "dOW": this.properties."DOW".apply("datetime"),
          "fACC": this.properties."FACC".apply("string"),
          "iDN4": {"p": this.properties."IDN4".apply("integer"), "at": $at}.apply("stamped"),
          "nM4": this.properties."NM4".apply("string"),
          "iDN3": {"p": this.properties."IDN3".apply("integer"), "at": $at}.apply("stamped"),
          "nM3": this.properties."NM3".apply("string"),
          "iDN2": {"p": this.properties."IDN2".apply("integer"), "at": $at}.apply("stamped"),
          "nM2": this.properties."NM2".apply("string"),
          "vYMERA": {"p": this.properties."VYMERA".apply("float"), "at": $at}.apply("stamped"),
          "nUTS1": this.properties."NUTS1".apply("string"),
          "nUTS1CODE": this.properties."NUTS1_CODE".apply("string"),
          "nUTS2": this.properties."NUTS2".apply("string"),
          "nUTS2CODE": this.properties."NUTS2_CODE".apply("string"),
          "nUTS3": this.properties."NUTS3".apply("string"),
          "nUTS3CODE": this.properties."NUTS3_CODE".apply("string"),
          "lAU1": this.properties."LAU1".apply("string"),
          "lAU1CODE": this.properties."LAU1_CODE".apply("string"),
          "lAU2": this.properties."LAU2".apply("string"),
          "lAU2CODE": this.properties."LAU2_CODE".apply("string"),
          "nutsKraj": this.properties."nuts_kraj".apply("string"),
          "nutsOkres": this.properties."nuts_okres".apply("string"),
          "nutsObec": this.properties."nuts_obec".apply("string"),
          "okres": this.properties."Okres".apply("string"),
          "obec": this.properties."Obec".apply("string"),
          "rok": this.properties."Rok".apply("string"),
          "indexEkonomickehoZatazeniaOs": {"p": this.properties."Index_ekonomického_zaťaženia_os".apply("float"), "at": $at}.apply("stamped"),
          "indexEkonomickejZavislostiMl": {"p": this.properties."Index_ekonomickej_závislosti_ml".apply("float"), "at": $at}.apply("stamped"),
          "indexEkonomickejZavislostiSt": {"p": this.properties."Index_ekonomickej_závislosti_st".apply("float"), "at": $at}.apply("stamped"),
          "indexStarnutiaPercento": {"p": this.properties."Index_starnutia__Percento_".apply("float"), "at": $at}.apply("stamped"),
          "medianovyVekRok": {"p": this.properties."Mediánový_vek__Rok_".apply("float"), "at": $at}.apply("stamped"),
          "priemernyVekObyvatelaRok": {"p": this.properties."Priemerný_vek_obyvateľa__Rok_".apply("float"), "at": $at}.apply("stamped"),
          "podielOsobVPredproduktivnom": {"p": this.properties."Podiel_osôb_v_predproduktívnom_".apply("float"), "at": $at}.apply("stamped"),
          "podielOsobVProduktivnomVeku": {"p": this.properties."Podiel_osôb_v_produktívnom_veku".apply("float"), "at": $at}.apply("stamped"),
          "podielOsobVPoproduktivnomVe": {"p": this.properties."Podiel_osôb_v_poproduktívnom_ve".apply("float"), "at": $at}.apply("stamped"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Join_Features_to_Obec3_WebMercator_view/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN4,NM4,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,LAU2,LAU2_CODE,nuts_kraj,nuts_okres,nuts_obec,Okres,Obec,Rok,Index_ekonomick%C3%A9ho_za%C5%A5a%C5%BEenia_os,Index_ekonomickej_z%C3%A1vislosti_ml,Index_ekonomickej_z%C3%A1vislosti_st,Index_starnutia__Percento_,Medi%C3%A1nov%C3%BD_vek__Rok_,Priemern%C3%BD_vek_obyvate%C4%BEa__Rok_,Podiel_os%C3%B4b_v_predprodukt%C3%ADvnom_,Podiel_os%C3%B4b_v_produkt%C3%ADvnom_veku,Podiel_os%C3%B4b_v_poprodukt%C3%ADvnom_ve&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-vekova-struktura-v-obciach-1996-2022-6de8c3" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - split:
        size: 1000
        byte_size: 2097152
    - archive:
        format: json_array
