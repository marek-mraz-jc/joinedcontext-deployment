# One School per row of "Školy a školské zariadenia v zriaďovateľskej pôsobnosti BBSK" (T-4255); the name of the bbsk-registre class.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-skoly-a-skolske-zariadenia-v-zriadovatel
  namespace: bbsk
  title:
    sk: Školy a školské zariadenia v zriaďovateľskej pôsobnosti BBSK
    en: Školy a školské zariadenia v zriaďovateľskej pôsobnosti BBSK
spec:
  class: scheduled
  schedule: 49 3 * * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-skoly-a-skolske-zariadenia-v-zriadovatel
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: School
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
