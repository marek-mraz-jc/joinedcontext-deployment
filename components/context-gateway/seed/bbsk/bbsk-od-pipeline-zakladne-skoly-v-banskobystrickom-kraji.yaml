# One School per row of "Základné školy v Banskobystrickom kraji" (T-4255); the name of the bbsk-registre class.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-zakladne-skoly-v-banskobystrickom-kraji
  namespace: bbsk
  title:
    sk: Základné školy v Banskobystrickom kraji
    en: Základné školy v Banskobystrickom kraji
spec:
  class: scheduled
  schedule: 52 4 * * 7
  source:
    dataSourceRef:
      kind: DataSource
      name: od-zakladne-skoly-v-banskobystrickom-kraji
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: School
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
