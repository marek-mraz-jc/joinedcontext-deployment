# file in this folder -> its path in the configuration repository (jc-core PATH_TEMPLATEs), read
# by the gateway's development values (flat /repo, every file under its own name) and by the
# forge bootstrap's seed (this layout). One list, two consumers.
#
# The region: one raw space holding the published cube rows as published, one indicator space
# holding what was decided to be measured, and the reference that lets the region's application
# read the city's indicators without being able to write them (T-2305, T-2310).
