# file in this folder -> its path in the configuration repository (jc-core PATH_TEMPLATEs), read
# by the gateway's development values (flat /repo, every file under its own name) and by the
# forge bootstrap's seed (this layout). One list, two consumers.
#
# The region: one raw space holding the published cube rows as published, one indicator space
# holding what was decided to be measured, and the reference that lets the region's application
# read the city's indicators without being able to write them (T-2305, T-2310).
bbsk-project.yaml: projects/bbsk/project.yaml
bbsk-space-kraj.yaml: projects/bbsk/spaces/bbsk-kraj/space.yaml
bbsk-datamodel.yaml: projects/bbsk/spaces/bbsk-kraj/datamodels/statistical-observation.yaml
statistical-observation.linkml.yaml: projects/bbsk/spaces/bbsk-kraj/datamodels/statistical-observation.linkml.yaml
statistical-observation.v1.schema.json: projects/bbsk/spaces/bbsk-kraj/datamodels/statistical-observation.v1.schema.json
statistical-observation.v1.context.jsonld: projects/bbsk/spaces/bbsk-kraj/datamodels/statistical-observation.v1.context.jsonld
statistical-observation.v1.example.jsonld: projects/bbsk/spaces/bbsk-kraj/datamodels/statistical-observation.v1.example.jsonld
statistical-observation.v1.md: projects/bbsk/spaces/bbsk-kraj/datamodels/statistical-observation.v1.md
bbsk-endpoint-kraj.yaml: projects/bbsk/spaces/bbsk-kraj/endpoints/bbsk-kraj.yaml
bbsk-policy-pipelines-write.yaml: projects/bbsk/spaces/bbsk-kraj/policies/pipelines-write.yaml
bbsk-space-kpi.yaml: projects/bbsk/spaces/bbsk-kpi/space.yaml
bbsk-endpoint-kpi.yaml: projects/bbsk/spaces/bbsk-kpi/endpoints/bbsk-kpi.yaml
bbsk-policy-kpi-pipelines-write.yaml: projects/bbsk/spaces/bbsk-kpi/policies/kpi-pipelines-write.yaml
bbsk-policy-kpi-read.yaml: projects/bbsk/spaces/bbsk-kpi/policies/kpi-read.yaml
bbsk-serviceaccount-pipelines.yaml: projects/bbsk/access/serviceaccounts/pipelines.yaml
bbsk-share-mesto-kpi.yaml: projects/bbsk/shares/mesto-kpi.yaml
# The two ingestion pipelines and their mappings (T-2305). The reconciler renders each Pipeline
# and the `-bento.yaml` beside it into a resident stream on the runner (PL-47).
bbsk-datasource-obyvatelstvo.yaml: projects/bbsk/datasources/susr-om7102rr.yaml
bbsk-datasource-emisie.yaml: projects/bbsk/datasources/susr-zp3803rs.yaml
bbsk-pipeline-obyvatelstvo.yaml: projects/bbsk/pipelines/obyvatelstvo/pipeline.yaml
bbsk-pipeline-obyvatelstvo-bento.yaml: projects/bbsk/pipelines/obyvatelstvo/bento.yaml
bbsk-pipeline-emisie.yaml: projects/bbsk/pipelines/emisie/pipeline.yaml
bbsk-pipeline-emisie-bento.yaml: projects/bbsk/pipelines/emisie/bento.yaml
# The indicator pipeline (T-2307): its Bloblang is inline, because its input is a query through
# the raw space's Endpoint and not a DataSource fetch, so there is no bento.yaml beside it.
bbsk-pipeline-ukazovatele.yaml: projects/bbsk/pipelines/ukazovatele/pipeline.yaml
