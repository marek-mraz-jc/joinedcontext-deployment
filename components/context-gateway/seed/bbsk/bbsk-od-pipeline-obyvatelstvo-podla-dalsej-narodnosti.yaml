# One KeyPerformanceIndicator per row of "Obyvateľstvo podľa ďalšej národnosti (2021), obce" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-obyvatelstvo-podla-dalsej-narodnosti
  namespace: bbsk
  title:
    sk: Obyvateľstvo podľa ďalšej národnosti (2021), obce
    en: Obyvateľstvo podľa ďalšej národnosti (2021), obce
spec:
  class: scheduled
  enabled: true
  schedule: 9 4 28 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-obyvatelstvo-podla-dalsej-narodnosti
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: replace
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
