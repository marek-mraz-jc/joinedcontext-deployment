# One StatisticalObservation per row of "Obyvateľstvo podľa ekonomickej aktivity (2021)" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-obyvatelstvo-podla-ekonomickej-aktivity
  namespace: bbsk
  title:
    sk: Obyvateľstvo podľa ekonomickej aktivity (2021)
    en: Obyvateľstvo podľa ekonomickej aktivity (2021)
spec:
  class: scheduled
  enabled: false
  schedule: 23 4 2 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-obyvatelstvo-podla-ekonomickej-aktivity
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: StatisticalObservation
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
