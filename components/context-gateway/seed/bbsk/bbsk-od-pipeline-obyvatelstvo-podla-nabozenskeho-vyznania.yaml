# One StatisticalObservation per row of "Obyvateľstvo podľa náboženského vyznania (2011), obce" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-obyvatelstvo-podla-nabozenskeho-vyznania
  namespace: bbsk
  title:
    sk: Obyvateľstvo podľa náboženského vyznania (2011), obce
    en: Obyvateľstvo podľa náboženského vyznania (2011), obce
spec:
  class: scheduled
  schedule: 58 4 7 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-obyvatelstvo-podla-nabozenskeho-vyznania
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: StatisticalObservation
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
