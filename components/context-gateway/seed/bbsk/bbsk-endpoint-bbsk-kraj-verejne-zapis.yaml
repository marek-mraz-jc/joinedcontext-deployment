# The write door of bbsk-kraj (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes bbsk-kraj-verejne served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint bbsk-kraj-verejne.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: bbsk-kraj-verejne-zapis
  namespace: bbsk
  title:
    sk: 'Banskobystrický kraj — zdrojové údaje, verejne: zápis'
    en: 'Banská Bystrica Region, raw data, public: writes'
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint bbsk-kraj-verejne.
    en: The internal door the data is written through; people read it through the public Endpoint bbsk-kraj-verejne.
spec:
  contextSpaceRef: bbsk-kraj
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-kraj:app-bbsk-zaznamy-1
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-kraj:app-bbsk-zaznamy-2-steward
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-kraj:kraj-public-read
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-kraj:kraj-steward-note
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-kraj:kraj-steward-read
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-kraj:pipelines-write
  slug: trd6a6cbtlcpfqynsuebohblkaokcxzz
  audience: organization
  enabledRepresentations: [ngsi-ld]
