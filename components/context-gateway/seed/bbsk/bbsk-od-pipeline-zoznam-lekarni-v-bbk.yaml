# One PointOfInterest per row of "Zoznam lekární v BBK" (T-4255); category from the facility kind.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-zoznam-lekarni-v-bbk
  namespace: bbsk
  title:
    sk: Zoznam lekární v BBK
    en: Zoznam lekární v BBK
spec:
  class: scheduled
  enabled: true
  schedule: 20 5 * * 3
  source:
    dataSourceRef:
      kind: DataSource
      name: od-zoznam-lekarni-v-bbk
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: PointOfInterest
    mode: replace
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
