# The mapping of the od-nehodovost-v-bbk pipeline, generated from the T-4254 mapping: one RoadAccident per row of
# "Nehodovosť v BBK" (https://opendata.dev.joinedcontext.com/dataset/bbsk-nehodovost-v-bbk-0ea72d). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    # Page 0 as it came; when the layer says there is more, every further page up to half again
    # the 3046 rows it held when mapped (ponytail: a static page count; past that the
    # newest rows wait until the mapping is regenerated). A page past the end is empty.
    - mapping: |
        root = if this.properties.exceededTransferLimit.or(false) { [this].concat(range(1, 5).map_each(p -> { "offset": p * 1000 })) } else { [this] }
    - unarchive:
        format: json_array
    - switch:
        - check: this.offset.or(null) != null
          processors:
            - mapping: |
                meta offset = this.offset.string()
                root = ""
            - http:
                url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Export_z_vizualu_nehodovost_MINV/FeatureServer/0/query?where=1%3D1&outFields=GPS_%C5%A0%C3%ADrka,GPS_D%C4%BA%C5%BEka,%C4%8C%C3%ADslo_nehody,D%C3%A1tum_a_%C4%8Das,Povrch_vozovky,Smerov%C3%A9_pomery,Druh_komunik%C3%A1cie,Hlavn%C3%BD_vinn%C3%ADk,%C4%BDahko_zranen%C3%AD,%C5%A4a%C5%BEko_zranen%C3%AD,Usmrten%C3%AD,Pr%C3%AD%C4%8Diny,%C5%A0koda_v_EUR&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000"
                verb: GET
                headers:
                  Accept: application/geo+json
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
        # anything else reads as a datetime (T-4288).
        map observed {
          let x = this
          root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
            $x.apply("datetime").value.catch(null)
          }
        }
        # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
        map stamped {
          root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "nehodovost-v-bbk-" + [this.properties."Číslo_nehody"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        let at = this.properties."Dátum_a_čas".apply("observed")
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("RoadAccident", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "RoadAccident",
          "gPSSirka": {"p": this.properties."GPS_Šírka".apply("float"), "at": $at}.apply("stamped"),
          "gPSDlzka": {"p": this.properties."GPS_Dĺžka".apply("float"), "at": $at}.apply("stamped"),
          "cisloNehody": this.properties."Číslo_nehody".apply("string"),
          "datumACas": this.properties."Dátum_a_čas".apply("datetime"),
          "povrchVozovky": this.properties."Povrch_vozovky".apply("string"),
          "smerovePomery": this.properties."Smerové_pomery".apply("string"),
          "druhKomunikacie": this.properties."Druh_komunikácie".apply("string"),
          "hlavnyVinnik": this.properties."Hlavný_vinník".apply("string"),
          "lahkoZraneni": {"p": this.properties."Ľahko_zranení".apply("integer"), "at": $at}.apply("stamped"),
          "tazkoZraneni": {"p": this.properties."Ťažko_zranení".apply("integer"), "at": $at}.apply("stamped"),
          "usmrteni": {"p": this.properties."Usmrtení".apply("integer"), "at": $at}.apply("stamped"),
          "priciny": this.properties."Príčiny".apply("string"),
          "skodaVEUR": {"p": this.properties."Škoda_v_EUR".apply("integer"), "at": $at}.apply("stamped"),
          "status": { "type": "Property", "value": "archived" },
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Export_z_vizualu_nehodovost_MINV/FeatureServer/0/query?where=1%3D1&outFields=GPS_%C5%A0%C3%ADrka,GPS_D%C4%BA%C5%BEka,%C4%8C%C3%ADslo_nehody,D%C3%A1tum_a_%C4%8Das,Povrch_vozovky,Smerov%C3%A9_pomery,Druh_komunik%C3%A1cie,Hlavn%C3%BD_vinn%C3%ADk,%C4%BDahko_zranen%C3%AD,%C5%A4a%C5%BEko_zranen%C3%AD,Usmrten%C3%AD,Pr%C3%AD%C4%8Diny,%C5%A0koda_v_EUR&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-nehodovost-v-bbk-0ea72d" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
