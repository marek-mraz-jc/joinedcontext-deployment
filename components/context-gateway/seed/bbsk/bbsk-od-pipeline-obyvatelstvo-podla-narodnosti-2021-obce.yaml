# One StatisticalObservation per row of "Obyvateľstvo podľa národnosti (2021), obce" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-obyvatelstvo-podla-narodnosti-2021-obce
  namespace: bbsk
  title:
    sk: Obyvateľstvo podľa národnosti (2021), obce
    en: Obyvateľstvo podľa národnosti (2021), obce
spec:
  class: scheduled
  schedule: 40 5 13 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-obyvatelstvo-podla-narodnosti-2021-obce
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: StatisticalObservation
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
