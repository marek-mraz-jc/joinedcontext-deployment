# The mapping of the od-nabijacky-a-zastavky pipeline, generated from the T-4254 mapping: one EVChargingStation per row of
# "Nabíjačky a Zastávky" (https://data.dev.joinedcontext.com/dataset/bbsk-nabijacky-a-zastavky-937210). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "nabijacky-a-zastavky-" + {"CMS_ID": this.properties."CMS_ID", "PRIM_NAME": this.properties."PRIM_NAME", "Categ": this.properties."Categ", "Hlavna_cat": this.properties."Hlavna_cat", "category": this.properties."category", "languages": this.properties."languages", "name": this.properties."name", "importKey": this.properties."importKey", "contentSta": this.properties."contentSta", "createdBy": this.properties."createdBy", "createdAt": this.properties."createdAt", "lastModifi": this.properties."lastModifi", "lastModi_1": this.properties."lastModi_1", "changedByC": this.properties."changedByC", "publishedB": this.properties."publishedB", "publishedA": this.properties."publishedA", "defLanguag": this.properties."defLanguag", "createdIn": this.properties."createdIn", "organisati": this.properties."organisati", "geometry": this.properties."geometry", "primaryIma": this.properties."primaryIma", "author": this.properties."author", "belongRegi": this.properties."belongRegi", "title": this.properties."title", "descriptio": this.properties."descriptio", "shortDescr": this.properties."shortDescr", "images": this.properties."images", "licenseKey": this.properties."licenseKey", "email": this.properties."email", "webAddress": this.properties."webAddress", "fax": this.properties."fax", "cellPhone": this.properties."cellPhone", "telephone": this.properties."telephone", "city": this.properties."city", "zipcode": this.properties."zipcode", "streetAddr": this.properties."streetAddr", "addressReg": this.properties."addressReg", "altitude": this.properties."altitude", "rankingPer": this.properties."rankingPer", "ID": this.properties."ID", "x": this.properties."x", "y": this.properties."y", "FID2": this.properties."FID2"}.format_json(no_indent: true).hash("sha256").encode("hex").slice(0, 24).re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("EVChargingStation", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "EVChargingStation",
          "cMSID": this.properties."CMS_ID".apply("integer"),
          "pRIMNAME": this.properties."PRIM_NAME".apply("string"),
          "categ": this.properties."Categ".apply("string"),
          "hlavnaCat": this.properties."Hlavna_cat".apply("string"),
          "category": this.properties."category".apply("integer"),
          "languages": this.properties."languages".apply("string"),
          "columnName": this.properties."name".apply("string"),
          "importKey": this.properties."importKey".apply("string"),
          "contentSta": this.properties."contentSta".apply("string"),
          "createdBy": this.properties."createdBy".apply("integer"),
          "sourceCreatedAt": this.properties."createdAt".apply("datetime"),
          "lastModifi": this.properties."lastModifi".apply("integer"),
          "lastModi1": this.properties."lastModi_1".apply("datetime"),
          "changedByC": this.properties."changedByC".apply("datetime"),
          "publishedB": this.properties."publishedB".apply("integer"),
          "publishedA": this.properties."publishedA".apply("datetime"),
          "defLanguag": this.properties."defLanguag".apply("string"),
          "createdIn": this.properties."createdIn".apply("integer"),
          "organisati": this.properties."organisati".apply("integer"),
          "geometry": this.properties."geometry".apply("string"),
          "primaryIma": this.properties."primaryIma".apply("string"),
          "author": this.properties."author".apply("integer"),
          "belongRegi": this.properties."belongRegi".apply("integer"),
          "title": this.properties."title".apply("string"),
          "descriptio": this.properties."descriptio".apply("string"),
          "shortDescr": this.properties."shortDescr".apply("string"),
          "images": this.properties."images".apply("integer"),
          "licenseKey": this.properties."licenseKey".apply("string"),
          "email": this.properties."email".apply("string"),
          "webAddress": this.properties."webAddress".apply("string"),
          "fax": this.properties."fax".apply("string"),
          "cellPhone": this.properties."cellPhone".apply("string"),
          "telephone": this.properties."telephone".apply("string"),
          "city": this.properties."city".apply("string"),
          "zipcode": this.properties."zipcode".apply("integer"),
          "streetAddr": this.properties."streetAddr".apply("string"),
          "addressReg": this.properties."addressReg".apply("string"),
          "altitude": this.properties."altitude".apply("string"),
          "rankingPer": this.properties."rankingPer".apply("integer"),
          "iD": this.properties."ID".apply("integer"),
          "x": this.properties."x".apply("float"),
          "y": this.properties."y".apply("float"),
          "fID2": this.properties."FID2".apply("integer"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Nab%C3%ADja%C4%8Dky_a_Zast%C3%A1vky/FeatureServer/0/query?where=1%3D1&outFields=CMS_ID,PRIM_NAME,Categ,Hlavna_cat,category,languages,name,importKey,contentSta,createdBy,createdAt,lastModifi,lastModi_1,changedByC,publishedB,publishedA,defLanguag,createdIn,organisati,geometry,primaryIma,author,belongRegi,title,descriptio,shortDescr,images,licenseKey,email,webAddress,fax,cellPhone,telephone,city,zipcode,streetAddr,addressReg,altitude,rankingPer,ID,x,y,FID2&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-nabijacky-a-zastavky-937210" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
