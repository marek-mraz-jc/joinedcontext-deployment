# One Petition per row of "Petície" (T-4255); the petition, not its signatories.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-peticie
  namespace: bbsk
  title:
    sk: Petície
    en: Petície
spec:
  class: scheduled
  schedule: 57 1 * * 3
  source:
    dataSourceRef:
      kind: DataSource
      name: od-peticie
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: Petition
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
