apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: kpi-read
  namespace: bbsk
  title: { sk: "Verejné čítanie ukazovateľov", en: "Public read: indicators" }
spec:
  contextSpaceRef: { kind: ContextSpace, name: bbsk-kpi }
  assigner: did:web:bbsk.sk
  assignee: { kind: role, id: public }
  # Discovery beside the reads (T-4258, EP-116): which types and attributes the Endpoint holds,
  # narrowed to this grant (EP-26), so an anonymous MCP client finds them before it queries.
  operations: [retrieveOps, retrieveEntityTypes, retrieveEntityTypeDetails, retrieveEntityTypeInfo, retrieveAttrTypes, retrieveAttrTypeDetails, retrieveAttrTypeInfo, createSubscription, retrieveSubscription, updateSubscription, deleteSubscription]
  information:
    - entities:
        - type: KeyPerformanceIndicator
