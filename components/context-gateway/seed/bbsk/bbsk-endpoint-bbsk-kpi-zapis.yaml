# The write door of bbsk-kpi (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes bbsk-kpi served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint bbsk-kpi.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: bbsk-kpi-zapis
  namespace: bbsk
  title: { sk: 'Ukazovatele kraja: zápis', en: 'Region indicators: writes' }
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint bbsk-kpi.
    en: The internal door the data is written through; people read it through the public Endpoint bbsk-kpi.
spec:
  contextSpaceRef: bbsk-kpi
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-kpi:kpi-pipelines-write
    - urn:ngsi-ld:Policy:bbsk.sk:bbsk-kpi:kpi-read
  slug: x3zanwf6mc2v5zt25ifzdrmvrjp3yfl7
  audience: organization
  enabledRepresentations: [ngsi-ld, websocket, ogc-features, mcp]
