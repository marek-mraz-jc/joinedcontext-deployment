apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipelines
  namespace: bbsk
  title: { sk: "Dávkovacie kanály kraja", en: "Region ingestion pipelines" }
spec:
  owner: { user: "demo.steward" }
  purpose: "The Bento streams of the region demo write the published cube rows into bbsk-kraj, the indicators computed from them into bbsk-kpi and the region's registers into bbsk-registre"
  roles:
    - { role: space-writer, scope: { contextSpace: bbsk-kraj } }
    - { role: space-writer, scope: { contextSpace: bbsk-kpi } }
    - { role: space-writer, scope: { contextSpace: bbsk-registre } }
  credentials:
    - { kind: oauth-client, name: main }
