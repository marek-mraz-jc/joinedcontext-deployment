# One KeyPerformanceIndicator per row of "Ohrozenie samospráv zmenou klímy - extrémne horúčavy" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-ohrozenie-samosprav-zmenou-klimy-extremn
  namespace: bbsk
  title:
    sk: Ohrozenie samospráv zmenou klímy - extrémne horúčavy
    en: Ohrozenie samospráv zmenou klímy - extrémne horúčavy
spec:
  class: scheduled
  enabled: false
  schedule: 29 1 20 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-ohrozenie-samosprav-zmenou-klimy-extremn
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: replace
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
