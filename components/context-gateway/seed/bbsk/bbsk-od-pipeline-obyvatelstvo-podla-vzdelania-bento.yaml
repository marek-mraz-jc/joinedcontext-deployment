# The mapping of the od-obyvatelstvo-podla-vzdelania pipeline, generated from the T-4254 mapping: one KeyPerformanceIndicator per row of
# "Obyvateľstvo podľa vzdelania (2021)" (https://opendata.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-vzdelania-2021-2481df). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
        # anything else reads as a datetime (T-4288).
        map observed {
          let x = this
          root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
            $x.apply("datetime").value.catch(null)
          }
        }
        # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
        map stamped {
          root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "obyvatelstvo-podla-vzdelania-" + [this.properties."IDN4"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "KeyPerformanceIndicator",
          "dOW": this.properties."DOW".apply("datetime"),
          "fACC": this.properties."FACC".apply("string"),
          "iDN4": this.properties."IDN4".apply("integer"),
          "nM4": this.properties."NM4".apply("string"),
          "iDN3": this.properties."IDN3".apply("integer"),
          "nM3": this.properties."NM3".apply("string"),
          "iDN2": this.properties."IDN2".apply("integer"),
          "nM2": this.properties."NM2".apply("string"),
          "vYMERA": this.properties."VYMERA".apply("float"),
          "nUTS1": this.properties."NUTS1".apply("string"),
          "nUTS1CODE": this.properties."NUTS1_CODE".apply("string"),
          "nUTS2": this.properties."NUTS2".apply("string"),
          "nUTS2CODE": this.properties."NUTS2_CODE".apply("string"),
          "nUTS3": this.properties."NUTS3".apply("string"),
          "nUTS3CODE": this.properties."NUTS3_CODE".apply("string"),
          "lAU1": this.properties."LAU1".apply("string"),
          "lAU1CODE": this.properties."LAU1_CODE".apply("string"),
          "lAU2": this.properties."LAU2".apply("string"),
          "lAU2CODE": this.properties."LAU2_CODE".apply("string"),
          "kod": this.properties."Kód".apply("string"),
          "uzemnaJednotka": this.properties."Územná_jednotka".apply("string"),
          "spolu": this.properties."Spolu".apply("integer"),
          "bezUkoncenehoVzdelaniaOsob": this.properties."bez_ukončeného_vzdelania___osob".apply("integer"),
          "bezUkoncenehoVzdelaniaOs1": this.properties."bez_ukončeného_vzdelania___os_1".apply("float"),
          "zakladneVzdelanieAbs": this.properties."základné_vzdelanie__abs__".apply("integer"),
          "zakladneVzdelanie": this.properties."základné_vzdelanie____".apply("float"),
          "stredneOdborneUcnovskeVzde": this.properties."stredné_odborné__učňovské__vzde".apply("integer"),
          "stredneOdborneUcnovskeVz1": this.properties."stredné_odborné__učňovské__vz_1".apply("float"),
          "uplneStredneVzdelanieSMatu": this.properties."úplné_stredné_vzdelanie__s_matu".apply("integer"),
          "uplneStredneVzdelanieSMa1": this.properties."úplné_stredné_vzdelanie__s_ma_1".apply("float"),
          "vyssieOdborneVzdelanieAbs": this.properties."vyššie_odborné_vzdelanie__abs__".apply("integer"),
          "vyssieOdborneVzdelanie": this.properties."vyššie_odborné_vzdelanie____".apply("float"),
          "vysokoskolskeVzdelanieAbs": this.properties."vysokoškolské_vzdelanie__abs__".apply("integer"),
          "vysokoskolskeVzdelanie": this.properties."vysokoškolské_vzdelanie____".apply("float"),
          "bezSkolskehoVzdelaniaOsoby": this.properties."bez_školského_vzdelania___osoby".apply("integer"),
          "bezSkolskehoVzdelaniaOso1": this.properties."bez_školského_vzdelania___oso_1".apply("float"),
          "nezisteneAbs": this.properties."nezistené__abs__".apply("integer"),
          "nezistene": this.properties."nezistené____".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mapa_SODB_2021_vzdelanie/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN4,NM4,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,LAU2,LAU2_CODE,K%C3%B3d,%C3%9Azemn%C3%A1_jednotka,Spolu,bez_ukon%C4%8Den%C3%A9ho_vzdelania___osob,bez_ukon%C4%8Den%C3%A9ho_vzdelania___os_1,z%C3%A1kladn%C3%A9_vzdelanie__abs__,z%C3%A1kladn%C3%A9_vzdelanie____,stredn%C3%A9_odborn%C3%A9__u%C4%8D%C5%88ovsk%C3%A9__vzde,stredn%C3%A9_odborn%C3%A9__u%C4%8D%C5%88ovsk%C3%A9__vz_1,%C3%BApln%C3%A9_stredn%C3%A9_vzdelanie__s_matu,%C3%BApln%C3%A9_stredn%C3%A9_vzdelanie__s_ma_1,vy%C5%A1%C5%A1ie_odborn%C3%A9_vzdelanie__abs__,vy%C5%A1%C5%A1ie_odborn%C3%A9_vzdelanie____,vysoko%C5%A1kolsk%C3%A9_vzdelanie__abs__,vysoko%C5%A1kolsk%C3%A9_vzdelanie____,bez_%C5%A1kolsk%C3%A9ho_vzdelania___osoby,bez_%C5%A1kolsk%C3%A9ho_vzdelania___oso_1,nezisten%C3%A9__abs__,nezisten%C3%A9____&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-vzdelania-2021-2481df" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
