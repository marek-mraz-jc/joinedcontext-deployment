# One SocialService per record of `bbsk-socialne-sluzby`, written into the register space through its one Endpoint (PL-18, T-2783).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: socialne-sluzby
  namespace: bbsk
  title: { sk: "Sociálne služby verejných poskytovateľov", en: "Social services of public providers" }
spec:
  class: auto
  # A register the region revises a few times a year: weekly is already more than it needs (PL-26).
  period: 168h
  schedule: "53 3 * * 1"
  source:
    dataSourceRef: { kind: DataSource, name: bbsk-socialne-sluzby }
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-registre:bbsk-registre
  output:
    type: SocialService
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
