# TEMPORARY (T-4202, owner "go" 2026-10-16 ~04:22Z): lets the bbsk pipelines account delete the stale
# hel.fi-prefixed duplicates in bbsk-registre, whose bbsk.sk-domain twins exist. Only deleteBatch, only ids
# matching the hel.fi pattern, expires by itself at 09:00Z; deployer removes this file right after the run.
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: tmp-t4202-dedup-delete
  namespace: bbsk
  title: { sk: "Dočasné: odstránenie duplikátov hel.fi (T-4202)", en: "Temporary: remove the hel.fi duplicates (T-4202)" }
spec:
  contextSpaceRef: { kind: ContextSpace, name: bbsk-registre }
  assigner: did:web:{orgDomain}
  assignee: { kind: serviceAccount, id: pipelines }
  operations: [deleteBatch]
  validity: { to: "2026-10-16T09:00:00Z" }
  information:
    - entities:
        - { type: AdministrativeArea, idPattern: '^urn:ngsi-ld:AdministrativeArea:hel\.fi:bbsk-registre:.+$' }
        - { type: Bridge, idPattern: '^urn:ngsi-ld:Bridge:hel\.fi:bbsk-registre:.+$' }
        - { type: Hospital, idPattern: '^urn:ngsi-ld:Hospital:hel\.fi:bbsk-registre:.+$' }
        - { type: PublicOrganization, idPattern: '^urn:ngsi-ld:PublicOrganization:hel\.fi:bbsk-registre:.+$' }
        - { type: SocialService, idPattern: '^urn:ngsi-ld:SocialService:hel\.fi:bbsk-registre:.+$' }
