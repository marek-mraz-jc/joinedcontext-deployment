# One KeyPerformanceIndicator per row of "Veková štruktúra v okresoch (1996 - 2022)" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-vekova-struktura-v-okresoch
  namespace: bbsk
  title:
    sk: Veková štruktúra v okresoch (1996 - 2022)
    en: Veková štruktúra v okresoch (1996 - 2022)
spec:
  class: scheduled
  enabled: true
  schedule: 24 4 17 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-vekova-struktura-v-okresoch
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: replace
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
