# Generated by seeds/bbsk-events/generate.py from the inventory row Ľubietová (lego-html),
# read 2026-10-21: https://www.lubietova.sk/aktualne/kalendar/ (T-4896). Do not edit: change the template or the CSV.
pipeline:
  processors:
  - mapping: |
      let paths = content().string().re_find_all_object("href=\"(?:https://www\\.lubietova\\.sk)?(?P<p>/aktualne/kalendar/[A-Za-z0-9._~%/-]{1,300}-[0-9]{1,9}(?:_[0-9]{1,9})?[a-z]{2}\\.html)\"").map_each(m -> m.p).unique()
      root = $paths.map_each(p -> { "url": "https://www.lubietova.sk" + p, "path": p, "sourceId": p })
  - unarchive:
      format: json_array
  - branch:
      request_map: |
        root = if this.path.contains("..") { deleted() } else { "" }
        meta event_path = this.path.trim_prefix("/")
      processors:
      - sleep:
          duration: 3s
      - http:
          url: https://www.lubietova.sk/${! @event_path }
          verb: GET
          headers:
            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
            Accept: text/html
          timeout: 20s
          retries: 1
      result_map: |
        # 20261018T150000 is Bratislava's wall time; 20261018 alone a whole day.
        map at {
          let m = this.or("").re_find_object("^(?P<d>[0-9]{8})(T(?P<t>[0-9]{4}))?")
          let day = if $m.d.or(null) == null { null } else { "%s-%s-%s".format($m.d.slice(0, 4), $m.d.slice(4, 6), $m.d.slice(6, 8)) }
          let local = if $day != null && $m.t.or("") != "" { "%sT%s:%s:00".format($day, $m.t.slice(0, 2), $m.t.slice(2, 4)) } else { null }
          root = if $local != null { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") } else { $day }
        }
        let page = content().string()
        let when = $page.re_find_object("data-date-start=\"(?P<s>[0-9T]*)\" data-date-end=\"(?P<e>[0-9T]*)\"")
        root.name = $page.re_find_object("<h1[^>]*>(?P<v>[^<]{1,500})</h1>").v.or(null)
        root.start = $when.s.or(null).apply("at")
        root.end = $when.e.or(null).apply("at")
        root.venue = $page.re_find_object("class=\"venue\">(?:<i[^>]*></i>)?(?:<span[^>]*>[^<]*</span>)?(?P<v>[^<]{1,300})</h2>").v.or(null)
        root.category = $page.re_find_object("Typ akcie:(?P<v>[^<]{1,200})<").v.or(null)
        root.description = $page.re_find_object("<p id=\"action-detail\">(?P<v>[\\s\\S]*?)</p>").v.or(null)
  - archive:
      format: json_array
  - mutation: |
      meta events = {"category_cache": {}, "category_default": null, "facts_only": true, "grace": 0, "home": {"poi":"osm-way-180460822","match":"obecný úrad ľubietová","town":"lubietova","venue":"Obecný úrad Ľubietová","streetAddress":"Námestie V. Dunajského 1/1","addressLocality":"Ľubietová","lat":48.7459388,"lon":19.3621751,"checked_by":"nominatim"}, "lease": 187200, "listing": "https://www.lubietova.sk/aktualne/kalendar/", "organizer": {"name": "Obec Ľubietová", "url": "https://www.lubietova.sk"}, "provider": "Ľubietová, lubietova.sk (licencia neuvedená)", "region": "Banskobystrický kraj", "scope": "/SK/BB", "self": ["celá obec", "mesto", "mesto ľubietová", "mestský úrad", "mestský úrad ľubietová", "obec", "obec ľubietová", "obecný úrad", "obecný úrad ľubietová", "v obci", "ľubietová", "ľubietová - celá obec"], "source": "https://www.lubietova.sk/aktualne/kalendar/", "space": env("JC_SPACE"), "town": "Ľubietová", "town_scope": "/SK/BB/lubietova", "towns": [["Ľubietová","lubietova",48.74594,19.36218,"office"]], "venues": [{"poi":"osm-way-180460822","match":"obecný úrad ľubietová","town":"lubietova","venue":"Obecný úrad Ľubietová","streetAddress":"Námestie V. Dunajského 1/1","addressLocality":"Ľubietová","lat":48.7459388,"lon":19.3621751,"checked_by":"nominatim"}]}
  - resource: events_tail
