apiVersion: joinedcontext.com/v1alpha1
kind: AssistantDeployment
metadata:
  name: knowledge
  namespace: bbsk
spec:
  # The staff assistant over the city's own website (T-3067): what the answer-quality evals ask,
  # through the Portal as a signed-in person. Internal, so nothing is published; capped at about
  # 0.1 USD a day (google/gemini-3.8-flash, 2026-10-07).
  publicId: bbsk-knowledge
  channel: internal
  systemPrompt: >-
    You answer the questions of the Banská Bystrica region's staff and residents from what the city publishes on its
    website. Answer in the language of the question, cite the passages you used, and say plainly
    when the website does not cover the question.
  sources: [web]
  budget: { tokensPerDay: 300000, tokensPerConversation: 40000 }
  languages: [sk, en]
