# One KeyPerformanceIndicator per row of "Obyvateľstvo podľa vekovej štruktúry (2011, 2021), obce" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-obyvatelstvo-podla-vekovej-struktury
  namespace: bbsk
  title:
    sk: Obyvateľstvo podľa vekovej štruktúry (2011, 2021), obce
    en: Obyvateľstvo podľa vekovej štruktúry (2011, 2021), obce
spec:
  class: scheduled
  enabled: true
  schedule: 8 1 17 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-obyvatelstvo-podla-vekovej-struktury
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: KeyPerformanceIndicator
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
