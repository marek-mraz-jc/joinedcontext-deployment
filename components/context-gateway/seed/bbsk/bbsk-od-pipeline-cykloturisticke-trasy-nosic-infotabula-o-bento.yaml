# The mapping of the od-cykloturisticke-trasy-nosic-infotabula-o pipeline, generated from the T-4254 mapping: one PointOfInterest per row of
# "Cykloturistické trasy - nosič/infotabuľa/odpočívadlo/značenie" (https://data.dev.joinedcontext.com/dataset/bbsk-cykloturisticke-trasy-nosic-infotabula-odpocivadlo-znacenie-f3c643). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    # Page 0 as it came; when the layer says there is more, every further page up to half again
    # the 1519 rows it held when mapped (ponytail: a static page count; past that the
    # newest rows wait until the mapping is regenerated). A page past the end is empty.
    - mapping: |
        root = if this.properties.exceededTransferLimit.or(false) { [this].concat(range(1, 3).map_each(p -> { "offset": p * 1000 })) } else { [this] }
    - unarchive:
        format: json_array
    - switch:
        - check: this.offset.or(null) != null
          processors:
            - mapping: |
                meta offset = this.offset.string()
                root = ""
            - http:
                url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/nosic_info_odpoc_WGS_ML/FeatureServer/0/query?where=1%3D1&outFields=mal_znac,stlp_ex,stlp_mat,stlp_stav,nedost_typ,trasa_spr,typ,zdroj,name,id,Pozn,nedost,trasa_no,trasa_farb,dopln_stp,stn,obtiazmost,nedostatok&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000"
                verb: GET
                headers:
                  Accept: application/geo+json
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "cykloturisticke-trasy-nosic-infotabula-o-" + {"mal_znac": this.properties."mal_znac", "stlp_ex": this.properties."stlp_ex", "stlp_mat": this.properties."stlp_mat", "stlp_stav": this.properties."stlp_stav", "nedost_typ": this.properties."nedost_typ", "trasa_spr": this.properties."trasa_spr", "typ": this.properties."typ", "zdroj": this.properties."zdroj", "name": this.properties."name", "id": this.properties."id", "Pozn": this.properties."Pozn", "nedost": this.properties."nedost", "trasa_no": this.properties."trasa_no", "trasa_farb": this.properties."trasa_farb", "dopln_stp": this.properties."dopln_stp", "stn": this.properties."stn", "obtiazmost": this.properties."obtiazmost", "nedostatok": this.properties."nedostatok"}.format_json(no_indent: true).hash("sha256").encode("hex").slice(0, 24).re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("PointOfInterest", env("JC_ORG_DOMAIN"), env("JC_SPACE"), $local),
          "type": "PointOfInterest",
          "malZnac": this.properties."mal_znac".apply("integer"),
          "stlpEx": this.properties."stlp_ex".apply("integer"),
          "stlpMat": this.properties."stlp_mat".apply("string"),
          "stlpStav": this.properties."stlp_stav".apply("string"),
          "nedostTyp": this.properties."nedost_typ".apply("string"),
          "trasaSpr": this.properties."trasa_spr".apply("string"),
          "typ": this.properties."typ".apply("string"),
          "zdroj": this.properties."zdroj".apply("string"),
          "columnName": this.properties."name".apply("string"),
          "sourceId": this.properties."id".apply("string"),
          "pozn": this.properties."Pozn".apply("string"),
          "nedost": this.properties."nedost".apply("integer"),
          "trasaNo": this.properties."trasa_no".apply("string"),
          "trasaFarb": this.properties."trasa_farb".apply("string"),
          "doplnStp": this.properties."dopln_stp".apply("integer"),
          "stn": this.properties."stn".apply("integer"),
          "obtiazmost": this.properties."obtiazmost".apply("string"),
          "nedostatok": this.properties."nedostatok".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/nosic_info_odpoc_WGS_ML/FeatureServer/0/query?where=1%3D1&outFields=mal_znac,stlp_ex,stlp_mat,stlp_stav,nedost_typ,trasa_spr,typ,zdroj,name,id,Pozn,nedost,trasa_no,trasa_farb,dopln_stp,stn,obtiazmost,nedostatok&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-cykloturisticke-trasy-nosic-infotabula-odpocivadlo-znacenie-f3c643" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
