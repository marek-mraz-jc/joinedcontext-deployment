# The mapping of the od-kontakty-na-miestne-samospravy-v-bbk pipeline, generated from the T-4254 mapping: one Organization per row of
# "Kontakty na miestne samosprávy v BBK" (https://opendata.dev.joinedcontext.com/dataset/bbsk-kontakty-na-miestne-samospravy-v-bbk-fc5ecb). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
    # every further page of them is read (T-5288). One run holds every page, so a layer past
    # 10000 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
    - branch:
        request_map: |
          root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
        processors:
          - http:
              url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Kontakty_na_samospr%C3%A1vy/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
              verb: GET
              headers:
                Accept: application/json
              timeout: 60s
              retries: 2
              rate_limit: pipeline_egress
        result_map: |
          root.rowCount = this.count.or(this.error.message.or("no count"))
    - mapping: |
        let rows = this.rowCount.or(null)
        root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 10000 { [{ "problem": "the layer holds %v rows, more than the 10000 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
    - unarchive:
        format: json_array
    - switch:
        - check: this.offset.or(null) != null
          processors:
            - mapping: |
                meta offset = this.offset
                meta rows = this.rowCount
                root = ""
            - http:
                url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Kontakty_na_samospr%C3%A1vy/FeatureServer/0/query?where=1%3D1&outFields=ID_BBSK,Okres_LAU1_ID,Okres_STAT_KOD,Okres,Obec_LAU2_ID,Obec_STAT_KOD,Obec_I%C4%8CO,Obec_dlh%C3%BD_n%C3%A1zov,Obec_kr%C3%A1tky_n%C3%A1zov,Druh_samospr%C3%A1vy,Adresa___ulica,Adresa___PS%C4%8C,Adresa___Obec,E_mail_v%C5%A1eobecn%C3%BD_1,E_mail_v%C5%A1eobecn%C3%BD_2,Telef%C3%B3nne_%C4%8D%C3%ADslo___v%C5%A1obecn%C3%A9_1,Telef%C3%B3nne_%C4%8D%C3%ADslo___v%C5%A1obecn%C3%A9_2,Web,lat,lon,Starosta_meno,Starosta_priezvisko,Pocet_obyvatelov,Okres_dlhy_nazov&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000&orderByFields=FID"
                verb: GET
                headers:
                  Accept: application/geo+json
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else if this.features.or(null) == null { { "problem": "the page at %v answered no features: %v".format(@offset, this.error.message.or("")) } } else if this.features.length() < [1000, @rows - @offset].min() { { "problem": "the page at %v answered %v rows where %v were due".format(@offset, this.features.length(), [1000, @rows - @offset].min()) } } else { this }
    # A refusal above fails the run and writes none of its message's rows.
    - mapping: |
        root = if this.problem.or(null) != null { throw(this.problem) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
        # anything else reads as a datetime (T-4288).
        map observed {
          let x = this
          root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
            $x.apply("datetime").value.catch(null)
          }
        }
        # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
        map stamped {
          root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "kontakty-na-miestne-samospravy-v-bbk-" + [this.properties."ID_BBSK"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("Organization", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "Organization",
          "iDBBSK": this.properties."ID_BBSK".apply("integer"),
          "okresLAU1ID": this.properties."Okres_LAU1_ID".apply("string"),
          "okresSTATKOD": this.properties."Okres_STAT_KOD".apply("integer"),
          "okres": this.properties."Okres".apply("string"),
          "obecLAU2ID": this.properties."Obec_LAU2_ID".apply("string"),
          "obecSTATKOD": this.properties."Obec_STAT_KOD".apply("integer"),
          "obecICO": this.properties."Obec_IČO".apply("string"),
          "name": this.properties."Obec_dlhý_názov".apply("string"),
          "obecKratkyNazov": this.properties."Obec_krátky_názov".apply("string"),
          "druhSamospravy": this.properties."Druh_samosprávy".apply("string"),
          "adresaUlica": this.properties."Adresa___ulica".apply("string"),
          "adresaPSC": this.properties."Adresa___PSČ".apply("string"),
          "adresaObec": this.properties."Adresa___Obec".apply("string"),
          "eMailVseobecny1": this.properties."E_mail_všeobecný_1".apply("string"),
          "eMailVseobecny2": this.properties."E_mail_všeobecný_2".apply("string"),
          "telefonneCisloVsobecne1": this.properties."Telefónne_číslo___všobecné_1".apply("string"),
          "telefonneCisloVsobecne2": this.properties."Telefónne_číslo___všobecné_2".apply("string"),
          "web": this.properties."Web".apply("string"),
          "lat": this.properties."lat".apply("float"),
          "lon": this.properties."lon".apply("float"),
          "starostaMeno": this.properties."Starosta_meno".apply("string"),
          "starostaPriezvisko": this.properties."Starosta_priezvisko".apply("string"),
          "pocetObyvatelov": this.properties."Pocet_obyvatelov".apply("integer"),
          "okresDlhyNazov": this.properties."Okres_dlhy_nazov".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Kontakty_na_samospr%C3%A1vy/FeatureServer/0/query?where=1%3D1&outFields=ID_BBSK,Okres_LAU1_ID,Okres_STAT_KOD,Okres,Obec_LAU2_ID,Obec_STAT_KOD,Obec_I%C4%8CO,Obec_dlh%C3%BD_n%C3%A1zov,Obec_kr%C3%A1tky_n%C3%A1zov,Druh_samospr%C3%A1vy,Adresa___ulica,Adresa___PS%C4%8C,Adresa___Obec,E_mail_v%C5%A1eobecn%C3%BD_1,E_mail_v%C5%A1eobecn%C3%BD_2,Telef%C3%B3nne_%C4%8D%C3%ADslo___v%C5%A1obecn%C3%A9_1,Telef%C3%B3nne_%C4%8D%C3%ADslo___v%C5%A1obecn%C3%A9_2,Web,lat,lon,Starosta_meno,Starosta_priezvisko,Pocet_obyvatelov,Okres_dlhy_nazov&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000&orderByFields=FID" },
          "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-kontakty-na-miestne-samospravy-v-bbk-fc5ecb" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - split:
        size: 1000
        byte_size: 2097152
    - archive:
        format: json_array
