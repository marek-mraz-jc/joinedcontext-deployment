# The mapping of the od-kontakty-na-miestne-samospravy-v-bbk pipeline, generated from the T-4254 mapping: one OrganizationUnit per row of
# "Kontakty na miestne samosprávy v BBK" (https://data.dev.joinedcontext.com/dataset/bbsk-kontakty-na-miestne-samospravy-v-bbk-fc5ecb). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "kontakty-na-miestne-samospravy-v-bbk-" + [this.properties."ID_BBSK"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("OrganizationUnit", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "OrganizationUnit",
          "iDBBSK": this.properties."ID_BBSK".apply("integer"),
          "okresLAU1ID": this.properties."Okres_LAU1_ID".apply("string"),
          "okresSTATKOD": this.properties."Okres_STAT_KOD".apply("integer"),
          "okres": this.properties."Okres".apply("string"),
          "obecLAU2ID": this.properties."Obec_LAU2_ID".apply("string"),
          "obecSTATKOD": this.properties."Obec_STAT_KOD".apply("integer"),
          "obecICO": this.properties."Obec_IČO".apply("string"),
          "obecDlhyNazov": this.properties."Obec_dlhý_názov".apply("string"),
          "obecKratkyNazov": this.properties."Obec_krátky_názov".apply("string"),
          "druhSamospravy": this.properties."Druh_samosprávy".apply("string"),
          "adresaUlica": this.properties."Adresa___ulica".apply("string"),
          "adresaPSC": this.properties."Adresa___PSČ".apply("string"),
          "adresaObec": this.properties."Adresa___Obec".apply("string"),
          "eMailVseobecny1": this.properties."E_mail_všeobecný_1".apply("string"),
          "eMailVseobecny2": this.properties."E_mail_všeobecný_2".apply("string"),
          "telefonneCisloVsobecne1": this.properties."Telefónne_číslo___všobecné_1".apply("string"),
          "telefonneCisloVsobecne2": this.properties."Telefónne_číslo___všobecné_2".apply("string"),
          "web": this.properties."Web".apply("string"),
          "lat": this.properties."lat".apply("float"),
          "lon": this.properties."lon".apply("float"),
          "starostaMeno": this.properties."Starosta_meno".apply("string"),
          "starostaPriezvisko": this.properties."Starosta_priezvisko".apply("string"),
          "pocetObyvatelov": this.properties."Pocet_obyvatelov".apply("integer"),
          "okresDlhyNazov": this.properties."Okres_dlhy_nazov".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Kontakty_na_samospr%C3%A1vy/FeatureServer/0/query?where=1%3D1&outFields=ID_BBSK,Okres_LAU1_ID,Okres_STAT_KOD,Okres,Obec_LAU2_ID,Obec_STAT_KOD,Obec_I%C4%8CO,Obec_dlh%C3%BD_n%C3%A1zov,Obec_kr%C3%A1tky_n%C3%A1zov,Druh_samospr%C3%A1vy,Adresa___ulica,Adresa___PS%C4%8C,Adresa___Obec,E_mail_v%C5%A1eobecn%C3%BD_1,E_mail_v%C5%A1eobecn%C3%BD_2,Telef%C3%B3nne_%C4%8D%C3%ADslo___v%C5%A1obecn%C3%A9_1,Telef%C3%B3nne_%C4%8D%C3%ADslo___v%C5%A1obecn%C3%A9_2,Web,lat,lon,Starosta_meno,Starosta_priezvisko,Pocet_obyvatelov,Okres_dlhy_nazov&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-kontakty-na-miestne-samospravy-v-bbk-fc5ecb" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
