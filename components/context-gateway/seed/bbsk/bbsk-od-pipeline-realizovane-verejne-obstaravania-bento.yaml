# The mapping of the od-realizovane-verejne-obstaravania pipeline, generated from the T-4254 mapping: one PublicProcurement per row of
# "Realizované verejné obstarávania" (https://opendata.dev.joinedcontext.com/dataset/bbsk-realizovane-verejne-obstaravania-754eee). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    # Page 0 as it came; when the layer says there is more, every further page up to half again
    # the 6829 rows it held when mapped (ponytail: a static page count; past that the
    # newest rows wait until the mapping is regenerated). A page past the end is empty.
    - mapping: |
        root = if this.properties.exceededTransferLimit.or(false) { [this].concat(range(1, 11).map_each(p -> { "offset": p * 1000 })) } else { [this] }
    - unarchive:
        format: json_array
    - switch:
        - check: this.offset.or(null) != null
          processors:
            - mapping: |
                meta offset = this.offset.string()
                root = ""
            - http:
                url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Realizovan%C3%A9_verejn%C3%A9_obstar%C3%A1vania/FeatureServer/0/query?where=1%3D1&outFields=ID_z%C3%A1kazky,N%C3%A1zov_predmetu,Hlavn%C3%BD_CPV,CPV___n%C3%A1zov,ID_%C4%8Dasti,N%C3%A1zov_%C4%8Dasti,Hlavn%C3%BD_CPV_%C4%8Dasti,CPV_%C4%8Dasti___n%C3%A1zov,Obstar%C3%A1vate%C4%BE,Druh_obstar%C3%A1vania,%C4%8C%C3%ADslo_spisu,Elektronick%C3%A1_aukcia,D%C3%A1tum_spustenia,Lehota_na_predkladanie,D%C3%A1tum_ukon%C4%8Denia,Predpokladan%C3%A1_hodnota,Po%C4%8Det_z%C3%A1ujemcov,Po%C4%8Det_uch%C3%A1dza%C4%8Dov,Zelen%C3%A9_obstar%C3%A1vanie,Soci%C3%A1lne_zodpovedn%C3%A9_obstar%C3%A1vani,Spolo%C4%8Densky_zodpovedn%C3%A9_verejn%C3%A9_,Druh_postupu,Stav,Najv%C3%BDhodnej%C5%A1%C3%AD_uch%C3%A1dza%C4%8D,Adresa_najv%C3%BDhodnej%C5%A1ieho_uch%C3%A1dza,Ponuka_uch%C3%A1dza%C4%8Da,Mena&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000"
                verb: GET
                headers:
                  Accept: application/geo+json
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
        # anything else reads as a datetime (T-4288).
        map observed {
          let x = this
          root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
            $x.apply("datetime").value.catch(null)
          }
        }
        # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
        map stamped {
          root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "realizovane-verejne-obstaravania-" + [this.properties."ID_časti"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("PublicProcurement", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "PublicProcurement",
          "iDZakazky": this.properties."ID_zákazky".apply("integer"),
          "name": this.properties."Názov_predmetu".apply("string"),
          "hlavnyCPV": this.properties."Hlavný_CPV".apply("string"),
          "cPVNazov": this.properties."CPV___názov".apply("string"),
          "identifier": this.properties."ID_časti".apply("string"),
          "nazovCasti": this.properties."Názov_časti".apply("string"),
          "hlavnyCPVCasti": this.properties."Hlavný_CPV_časti".apply("string"),
          "cPVCastiNazov": this.properties."CPV_časti___názov".apply("string"),
          "obstaravatel": this.properties."Obstarávateľ".apply("string"),
          "druhObstaravania": this.properties."Druh_obstarávania".apply("string"),
          "cisloSpisu": this.properties."Číslo_spisu".apply("string"),
          "elektronickaAukcia": this.properties."Elektronická_aukcia".apply("string"),
          "datumSpustenia": this.properties."Dátum_spustenia".apply("datetime"),
          "lehotaNaPredkladanie": this.properties."Lehota_na_predkladanie".apply("datetime"),
          "datumUkoncenia": this.properties."Dátum_ukončenia".apply("string"),
          "predpokladanaHodnota": this.properties."Predpokladaná_hodnota".apply("string"),
          "pocetZaujemcov": this.properties."Počet_záujemcov".apply("integer"),
          "pocetUchadzacov": this.properties."Počet_uchádzačov".apply("integer"),
          "zeleneObstaravanie": this.properties."Zelené_obstarávanie".apply("string"),
          "socialneZodpovedneObstaravani": this.properties."Sociálne_zodpovedné_obstarávani".apply("string"),
          "spolocenskyZodpovedneVerejne": this.properties."Spoločensky_zodpovedné_verejné_".apply("string"),
          "druhPostupu": this.properties."Druh_postupu".apply("string"),
          "stav": this.properties."Stav".apply("string"),
          "najvyhodnejsiUchadzac": this.properties."Najvýhodnejší_uchádzač".apply("string"),
          "adresaNajvyhodnejsiehoUchadza": this.properties."Adresa_najvýhodnejšieho_uchádza".apply("string"),
          "ponukaUchadzaca": this.properties."Ponuka_uchádzača".apply("float"),
          "mena": this.properties."Mena".apply("string"),
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Realizovan%C3%A9_verejn%C3%A9_obstar%C3%A1vania/FeatureServer/0/query?where=1%3D1&outFields=ID_z%C3%A1kazky,N%C3%A1zov_predmetu,Hlavn%C3%BD_CPV,CPV___n%C3%A1zov,ID_%C4%8Dasti,N%C3%A1zov_%C4%8Dasti,Hlavn%C3%BD_CPV_%C4%8Dasti,CPV_%C4%8Dasti___n%C3%A1zov,Obstar%C3%A1vate%C4%BE,Druh_obstar%C3%A1vania,%C4%8C%C3%ADslo_spisu,Elektronick%C3%A1_aukcia,D%C3%A1tum_spustenia,Lehota_na_predkladanie,D%C3%A1tum_ukon%C4%8Denia,Predpokladan%C3%A1_hodnota,Po%C4%8Det_z%C3%A1ujemcov,Po%C4%8Det_uch%C3%A1dza%C4%8Dov,Zelen%C3%A9_obstar%C3%A1vanie,Soci%C3%A1lne_zodpovedn%C3%A9_obstar%C3%A1vani,Spolo%C4%8Densky_zodpovedn%C3%A9_verejn%C3%A9_,Druh_postupu,Stav,Najv%C3%BDhodnej%C5%A1%C3%AD_uch%C3%A1dza%C4%8D,Adresa_najv%C3%BDhodnej%C5%A1ieho_uch%C3%A1dza,Ponuka_uch%C3%A1dza%C4%8Da,Mena&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-realizovane-verejne-obstaravania-754eee" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
