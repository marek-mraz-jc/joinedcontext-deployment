# The region's open data as one public, read-only MCP connector (T-4141, ADR-N-043):
# `https://{domain}/api/mcp/bbsk/otvorene-data`. Its members are the region's three public
# Endpoints; the steward's `bbsk-kraj` and the applications' own Endpoints stay out. Every call is
# still the member's own call, decided by its anonymous Policy, and the gateway lists anonymous
# callers read-only tools only (T-4168). The edge counts anonymous calls per client IP
# (context-mcp-named).
apiVersion: joinedcontext.com/v1alpha1
kind: McpServer
metadata:
  name: otvorene-data
  namespace: bbsk
  # What an AI client reads as serverInfo and initialize.instructions (EP-92).
  title: { sk: "Banskobystrický samosprávny kraj — otvorené údaje", en: "Banská Bystrica Region, open data" }
  description:
    sk: "Otvorené údaje Banskobystrického samosprávneho kraja, len na čítanie: registre kraja (okresy, obce, organizácie, nemocnice, sociálne služby, mosty), ročné údaje ŠÚ SR za kraj a okresy a ukazovatele kraja. Zdroje: Banskobystrický samosprávny kraj, Štatistický úrad SR; CC BY-SA 4.0. Pri citovaní uveďte zdroj."
    en: "Read-only open data of the Banská Bystrica Self-Governing Region (BBSK), Slovakia: its registers (districts, municipalities, the region's organisations, hospitals, social services, bridges), the Statistical Office's yearly figures for the region and its districts, and the region's indicators. Each tool answers per Endpoint. Start with list_types, then query_entities with a small limit. Texts are in Slovak. Sources: BBSK (https://opendata.bbsk.sk/) and the Statistical Office of the Slovak Republic; CC BY-SA 4.0, credit the source when you quote it."
spec:
  members:
    - { kind: Endpoint, name: bbsk-registre }
    - { kind: Endpoint, name: bbsk-kraj-verejne }
    - { kind: Endpoint, name: bbsk-kpi }
  audience: public
