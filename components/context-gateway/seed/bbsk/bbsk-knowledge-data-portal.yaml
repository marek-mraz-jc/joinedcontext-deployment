# The region's open datasets for its public assistant (T-4281): the CKAN at data.dev holds five
# bodies' catalogues; this source lists the organization `bbsk` alone, anonymously, so no other
# body's dataset and no private one reaches the index. Read once a night.
apiVersion: joinedcontext.com/v1alpha1
kind: KnowledgeSource
metadata:
  name: data-portal
  namespace: bbsk
  title: { sk: "Otvorené údaje Banskobystrického samosprávneho kraja", en: "The region's open datasets" }
spec:
  source: ckan
  ckanInstanceRef: bbsk
  organizations: [bbsk]
  schedule: "45 3 * * *"
  maxPages: 500
  languages: [sk, en]
  visibility: public
