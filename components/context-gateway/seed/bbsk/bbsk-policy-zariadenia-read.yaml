apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: zariadenia-read
  namespace: bbsk
  title: { sk: 'Verejné čítanie: nemocnice a sociálne služby' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: bbsk-registre }
  assigner: did:web:bbsk.sk
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint bbsk-zariadenia, and only
  # its types: the space's other types stay with their own datasets (T-4344).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: PointOfInterest
