# Generated by seeds/bbsk-events/generate.py from the inventory row Banská Štiavnica (mec-rest),
# read 2026-10-20: https://www.banskastiavnica.travel/events/ (T-4896). Do not edit: change the template or the CSV.
pipeline:
  processors:
  - mapping: |
      root = if this.type() != "array" { throw("the events API answered no list") } else { this }
  - mapping: |
      root = this.map_each(e -> {
        "name": e.title.rendered.or(null),
        "url": e.link.or(null),
        "sourceId": e.id.or(null),
        "modified": e.modified_gmt.or(null).(m -> if m != null { m + "Z" } else { null })
      })
  - unarchive:
      format: json_array
  - branch:
      request_map: |
        let path = this.url.or("").re_find_object("^https://www\\.banskastiavnica\\.travel/(?P<p>[A-Za-z0-9._~%/-]{1,300})$").p.or(null)
        root = if $path == null || $path.contains("..") { deleted() } else { "" }
        meta event_path = $path
      processors:
      - sleep:
          duration: 1s
      - http:
          url: https://www.banskastiavnica.travel/${! @event_path }
          verb: GET
          headers:
            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
            Accept: text/html
          timeout: 20s
          retries: 1
      result_map: |
        # schema.org writes a local time with or without its offset, LSVR with a space for the T: a time without an
        # offset is Bratislava's.
        map at {
          # EventON writes a one-digit offset hour and no seconds ("2026-11-14T10:00+2:00").
          let s = this.or("").string().trim().re_replace_all("([+-][0-9]{2})([0-9]{2})$", "$1:$2").re_replace_all("([+-])([0-9]):([0-9]{2})$", "$1#$2:$3").replace_all("#", "0").re_replace_all("(T[0-9]{2}:[0-9]{2})(Z|[+-][0-9]{2}:[0-9]{2})$", "$1:00$2")
          let v = if $s.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:") { $s.slice(0, 10) + "T" + $s.slice(11) } else { $s }
          let local = $v.re_find_object("^(?P<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2})(:[0-9]{2})?$").t.or(null)
          root = if $v.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") || $v.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?([.][0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$") { $v } else if $local != null { $local + ":00" + ($local + ":00Z").ts_format("-07:00", "Europe/Bratislava") } else { null }
        }
        # A Slovak date as a page prints it, "28. augusta 2026" or "28. 8. 2026", as YYYY-MM-DD.
        # number() before int64(): int64() reads "08" and "09" as octal and fails the whole event.
        map day {
          let months = {"januára": 1, "január": 1, "februára": 2, "február": 2, "marca": 3, "marec": 3, "apríla": 4, "apríl": 4, "mája": 5, "máj": 5, "júna": 6, "jún": 6, "júla": 7, "júl": 7, "augusta": 8, "august": 8, "septembra": 9, "september": 9, "októbra": 10, "október": 10, "novembra": 11, "november": 11, "decembra": 12, "december": 12}
          let n = this.re_find_object("(?P<d>[0-9]{1,2})\\.\\s*(?P<m>[0-9]{1,2})\\.\\s*(?P<y>[0-9]{4})").catch({})
          let w = this.re_find_object("(?P<d>[0-9]{1,2})\\.\\s*(?P<m>\\p{L}+)\\s+(?P<y>[0-9]{4})").catch({})
          let p = if $n.d.or(null) != null { $n } else { $w }
          let month = if $n.d.or(null) != null { $n.m.number().int64() } else { $months.get($w.m.or("").lowercase()).or(null) }
          root = if $p.d.or(null) == null || $month == null || $month < 1 || $month > 12 { null } else { "%04d-%02d-%02d".format($p.y.number().int64(), $month, $p.d.number().int64()) }
        }
        # Every HH:MM of a text, the hour in two digits.
        map clock {
          root = this.re_find_all("[0-9]{1,2}:[0-9]{2}").map_each(t -> if t.length() == 4 { "0" + t } else { t })
        }
        let blocks = content().string().re_find_all_object("<script[^>]*application/ld\\+json[^>]*>(?P<j>[\\s\\S]*?)</script>").map_each(m -> m.j.parse_json().catch(null)).filter(j -> j != null)
        let nodes = $blocks.map_each(j -> if j.type() == "array" { j } else if j."@graph".or(null) != null { j."@graph" } else { [j] }).flatten()
        let ld = $nodes.filter(n -> n.type() == "object" && n."@type".or("").string().re_match("Event")).index(0).catch(null)
        let loc = $ld.location.or(null).(l -> if l != null && l.type() == "array" { l.index(0).catch(null) } else { l })
        let adr = $loc.address.or(null)
        # LSVR Events (TownPress) leaves the JSON-LD dates empty and prints them in its post__info list: one "Dátum"
        # item and a "Čas" item ("08:00 - 12:00"), or "Začiatok" and "Koniec" items, each a date and maybe a time.
        let info = content().string().re_find_object("(?P<u><ul class=\"post__info[\\s\\S]*?</ul>)").u.or("")
        let days = $info.re_find_all_object("post__info-item--date\"[\\s\\S]*?post__info-item-text\">(?P<t>[\\s\\S]*?)</p>").map_each(i -> i.t)
        let hours = $info.re_find_object("post__info-item--time\"[\\s\\S]*?post__info-item-text\">(?P<t>[\\s\\S]*?)</p>").t.or("").apply("clock")
        let first = $days.index(0).catch("")
        let last = $days.index(1).catch(null)
        let from = $first.apply("day")
        let from_at = $first.apply("clock").concat($hours).index(0).catch(null)
        let to = if $last != null { $last.apply("day") } else if $hours.length() > 1 { $from } else { null }
        let to_at = if $last != null { $last.apply("clock").index(0).catch(null) } else { $hours.index(1).catch(null) }
        let lsvr_start = if $from == null { null } else if $from_at == null { $from } else { $from + "T" + $from_at }
        let lsvr_end = if $to == null { null } else if $to_at == null { $to } else { $to + "T" + $to_at }
        let start = $ld.startDate.or(null).apply("at").or($lsvr_start.apply("at"))
        let end = $ld.endDate.or(null).apply("at").or($lsvr_end.apply("at"))
        root.start = $start
        # A plugin writes the end equal to the start when the author gave none: that is no end.
        root.end = if $end != $start { $end } else { null }
        root.venue = $loc.name.or(null)
        root.streetAddress = if $adr != null && $adr.type() == "string" { $adr } else { $adr.streetAddress.or(null) }
        root.postalCode = if $adr != null && $adr.type() == "object" { $adr.postalCode.or(null) } else { null }
        root.locality = if $adr != null && $adr.type() == "object" { $adr.addressLocality.or(null) } else { null }
        root.lat = $loc.geo.latitude.or(null)
        root.lon = $loc.geo.longitude.or(null)
        root.description = $ld.description.or(null)
        # schema.org organizer: an Organization or a Person, one or a list; its name and url only.
        root.organizer = $ld.organizer.or(null).(o -> if o != null && o.type() == "array" { o.index(0).catch(null) } else { o }).(o -> if o != null && o.type() == "object" { { "name": o.name.or(null), "url": o.url.or(null) } } else { null })
  - archive:
      format: json_array
  - mapping: |
      # The end as unix seconds: a datetime end as written, a whole-day end the next midnight
      # (CET, so up to an hour late in summer), no end the start plus a day (owner 2026-10-20).
      map unix {
        root = if this == null { null } else if this.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { this.ts_parse("2006-01-02").ts_unix() - 3600 } else { this.ts_unix().catch(null) }
