# One StatisticalObservation per cell of the ŠÚ SR cube np3110rr, written through the space's one Endpoint with the runner's service account (PL-18, PF-39, T-2783).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: mzdy
  namespace: bbsk
  title: { sk: "Priemerná mzda v kraji a okresoch", en: "Average wage in the region and its districts" }
spec:
  class: auto
  # Annual or quarterly data: a weekly read is already far more often than it changes (PL-26, PL-27).
  period: 168h
  schedule: "25 3 * * 1"
  source:
    dataSourceRef: { kind: DataSource, name: susr-np3110rr }
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-kraj:bbsk-kraj
  output:
    type: StatisticalObservation
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
