# The mapping of the od-kontaktne-miesta pipeline, generated from the T-4254 mapping: one PointOfInterest per row of
# "Kontaktné miesta" (https://data.dev.joinedcontext.com/dataset/bbsk-kontaktne-miesta-2128a0). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "kontaktne-miesta-" + [this.properties."ID"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("PointOfInterest", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "PointOfInterest",
          "pC": this.properties."P_č_".apply("integer"),
          "name": this.properties."Názov_organizácie".apply("string"),
          "iCO": this.properties."IČO".apply("string"),
          "ulicaCisloSIDLO": this.properties."Ulica_číslo_SÍDLO".apply("string"),
          "pSCSIDLO": this.properties."PSČ_SÍDLO".apply("string"),
          "mestoSIDLO": this.properties."Mesto_SÍDLO".apply("string"),
          "ulicaCisloPRACOVISKO": this.properties."Ulica_číslo_PRACOVISKO".apply("string"),
          "pSCPRACOVISKO": this.properties."PSČ_PRACOVISKO".apply("string"),
          "mestoPRACOVISKO": this.properties."Mesto_PRACOVISKO".apply("string"),
          "kontakt": this.properties."Kontakt".apply("string"),
          "uRL": this.properties."URL".apply("string"),
          "kategoria": this.properties."Kategória".apply("string"),
          "iD": this.properties."ID".apply("integer"),
          "priznak": this.properties."Priznak".apply("string"),
          "okresPRACOVISKO": this.properties."Okres_PRACOVISKO".apply("string"),
          "kategoriaObrazok": this.properties."Kategória_obrázok".apply("string"),
          "lAT": this.properties."LAT_".apply("float"),
          "lON": this.properties."LON_".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Kontaktne_miesta/FeatureServer/0/query?where=1%3D1&outFields=P_%C4%8D_,N%C3%A1zov_organiz%C3%A1cie,I%C4%8CO,Ulica_%C4%8D%C3%ADslo_S%C3%8DDLO,PS%C4%8C_S%C3%8DDLO,Mesto_S%C3%8DDLO,Ulica_%C4%8D%C3%ADslo_PRACOVISKO,PS%C4%8C_PRACOVISKO,Mesto_PRACOVISKO,Kontakt,URL,Kateg%C3%B3ria,ID,Priznak,Okres_PRACOVISKO,Kateg%C3%B3ria_obr%C3%A1zok,LAT_,LON_&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-kontaktne-miesta-2128a0" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
