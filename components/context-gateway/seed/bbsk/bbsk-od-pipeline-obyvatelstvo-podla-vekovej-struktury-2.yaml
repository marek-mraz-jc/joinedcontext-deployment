# One StatisticalObservation per row of "Obyvateľstvo podľa vekovej štruktúry (2011, 2021), okresy" (T-4255); one row per area (and year).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-obyvatelstvo-podla-vekovej-struktury-2
  namespace: bbsk
  title:
    sk: Obyvateľstvo podľa vekovej štruktúry (2011, 2021), okresy
    en: Obyvateľstvo podľa vekovej štruktúry (2011, 2021), okresy
spec:
  class: scheduled
  enabled: false
  schedule: 15 1 18 * *
  source:
    dataSourceRef:
      kind: DataSource
      name: od-obyvatelstvo-podla-vekovej-struktury-2
  targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
  output:
    type: StatisticalObservation
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
