# The mapping of the od-uradne-hodiny pipeline, generated from the T-4254 mapping: one OfficeHours per row of
# "Úradné hodiny" (https://data.dev.joinedcontext.com/dataset/bbsk-uradne-hodiny-c912ed). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "uradne-hodiny-" + {"IČO_samosprávy": this.properties."IČO_samosprávy", "Názov_samosprávy": this.properties."Názov_samosprávy", "Identifikátor_kontaktného_miest": this.properties."Identifikátor_kontaktného_miest", "Názov_kontaktného_miesta": this.properties."Názov_kontaktného_miesta", "Kód_dňa_v_týždni": this.properties."Kód_dňa_v_týždni", "Deň_v_týždni": this.properties."Deň_v_týždni", "Otvorené_od": this.properties."Otvorené_od", "Otvorené_do": this.properties."Otvorené_do"}.format_json(no_indent: true).hash("sha256").encode("hex").slice(0, 24).re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("OfficeHours", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "OfficeHours",
          "iCOSamospravy": this.properties."IČO_samosprávy".apply("string"),
          "nazovSamospravy": this.properties."Názov_samosprávy".apply("string"),
          "identifikatorKontaktnehoMiest": this.properties."Identifikátor_kontaktného_miest".apply("string"),
          "name": this.properties."Názov_kontaktného_miesta".apply("string"),
          "kodDnaVTyzdni": this.properties."Kód_dňa_v_týždni".apply("string"),
          "denVTyzdni": this.properties."Deň_v_týždni".apply("string"),
          "otvoreneOd": this.properties."Otvorené_od".apply("string"),
          "otvoreneDo": this.properties."Otvorené_do".apply("string"),
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/%C3%9Aradn%C3%A9_hodiny/FeatureServer/0/query?where=1%3D1&outFields=I%C4%8CO_samospr%C3%A1vy,N%C3%A1zov_samospr%C3%A1vy,Identifik%C3%A1tor_kontaktn%C3%A9ho_miest,N%C3%A1zov_kontaktn%C3%A9ho_miesta,K%C3%B3d_d%C5%88a_v_t%C3%BD%C5%BEdni,De%C5%88_v_t%C3%BD%C5%BEdni,Otvoren%C3%A9_od,Otvoren%C3%A9_do&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-uradne-hodiny-c912ed" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
