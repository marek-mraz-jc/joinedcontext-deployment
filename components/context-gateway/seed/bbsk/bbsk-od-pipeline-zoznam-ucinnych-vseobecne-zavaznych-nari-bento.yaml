# The mapping of the od-zoznam-ucinnych-vseobecne-zavaznych-nari pipeline, generated from the T-4254 mapping: one Rule per row of
# "Zoznam účinných všeobecne záväzných nariadení (VZN)" (https://data.dev.joinedcontext.com/dataset/bbsk-zoznam-ucinnych-vseobecne-zavaznych-nariadeni-vzn-80db50). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
        # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
        map number {
          let s = this.string().re_replace_all("[ 	  ]", "")
          let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
          root = $t.number().catch(null)
        }
        map integer {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = if this == null { null } else { this.apply("number") }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map string_list {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
        # anything else reads as a datetime (T-4288).
        map observed {
          let x = this
          root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
            $x.apply("datetime").value.catch(null)
          }
        }
        # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
        map stamped {
          root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
              $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
            },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "zoznam-ucinnych-vseobecne-zavaznych-nari-" + [this.properties."Číslo_uznesenia"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("Rule", "bbsk.sk", env("JC_SPACE"), $local),
          "type": "Rule",
          "iCOSamospravy": this.properties."IČO_samosprávy".apply("string"),
          "nazovSamospravy": this.properties."Názov_samosprávy".apply("string"),
          "name": this.properties."Číslo_VZN".apply("string"),
          "description": this.properties."Názov_VZN".apply("string"),
          "uRLLinkaNaVZN": this.properties."URL_linka_na_VZN".apply("string"),
          "cisloZasadnutia": this.properties."Číslo_zasadnutia".apply("string"),
          "platnostOd": this.properties."Platnosť_od".apply("datetime"),
          "ucinnostOd": this.properties."Účinnosť_od".apply("datetime"),
          "ucinnostDo": this.properties."Účinnosť_do".apply("string"),
          "identifier": this.properties."Číslo_uznesenia".apply("string"),
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Zoznam_%C3%BA%C4%8Dinn%C3%BDch_v%C5%A1eobecne_z%C3%A1v%C3%A4zn%C3%BDch_nariaden%C3%AD_(VZN)/FeatureServer/0/query?where=1%3D1&outFields=I%C4%8CO_samospr%C3%A1vy,N%C3%A1zov_samospr%C3%A1vy,%C4%8C%C3%ADslo_VZN,N%C3%A1zov_VZN,URL_linka_na_VZN,%C4%8C%C3%ADslo_zasadnutia,Platnos%C5%A5_od,%C3%9A%C4%8Dinnos%C5%A5_od,%C3%9A%C4%8Dinnos%C5%A5_do,%C4%8C%C3%ADslo_uznesenia&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-zoznam-ucinnych-vseobecne-zavaznych-nariadeni-vzn-80db50" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
