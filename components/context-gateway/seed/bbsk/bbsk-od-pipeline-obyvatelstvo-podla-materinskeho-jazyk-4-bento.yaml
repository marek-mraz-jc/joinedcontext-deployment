# The mapping of the od-obyvatelstvo-podla-materinskeho-jazyk-4 pipeline, generated from the T-4254 mapping: one StatisticalObservation per row of
# "Obyvateľstvo podľa materinského jazyka (2021), okresy" (https://data.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-materinskeho-jazyka-2021-okresy-404a3d). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
    - mapping: |
        root = this.features.or([])
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "obyvatelstvo-podla-materinskeho-jazyk-4-" + [this.properties."IDN3"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("StatisticalObservation", "bbsk.sk", "bbsk-otvorene-data", $local),
          "type": "StatisticalObservation",
          "dOW": this.properties."DOW".apply("datetime"),
          "fACC": this.properties."FACC".apply("string"),
          "iDN3": this.properties."IDN3".apply("integer"),
          "nM3": this.properties."NM3".apply("string"),
          "iDN2": this.properties."IDN2".apply("integer"),
          "nM2": this.properties."NM2".apply("string"),
          "vYMERA": this.properties."VYMERA".apply("float"),
          "nUTS1": this.properties."NUTS1".apply("string"),
          "nUTS1CODE": this.properties."NUTS1_CODE".apply("string"),
          "nUTS2": this.properties."NUTS2".apply("string"),
          "nUTS2CODE": this.properties."NUTS2_CODE".apply("string"),
          "nUTS3": this.properties."NUTS3".apply("string"),
          "nUTS3CODE": this.properties."NUTS3_CODE".apply("string"),
          "lAU1": this.properties."LAU1".apply("string"),
          "lAU1CODE": this.properties."LAU1_CODE".apply("string"),
          "okres": this.properties."Okres".apply("string"),
          "cisloOkresu": this.properties."Číslo_okresu".apply("string"),
          "pocetObyvatelovSpolu": this.properties."Počet_obyvateľov_spolu".apply("integer"),
          "sucetZSlovenskyAbs": this.properties."Súčet_z_slovenský__abs__".apply("integer"),
          "sucetZMadarskyAbs": this.properties."Súčet_z_maďarský__abs__".apply("integer"),
          "sucetZRomskyAbs": this.properties."Súčet_z_rómsky__abs__".apply("integer"),
          "sucetZRusinskyAbs": this.properties."Súčet_z_rusínsky__abs__".apply("integer"),
          "sucetZCeskyAbs": this.properties."Súčet_z_český__abs__".apply("integer"),
          "sucetZUkrajinskyAbs": this.properties."Súčet_z_ukrajinský__abs__".apply("integer"),
          "sucetZNemeckyAbs": this.properties."Súčet_z_nemecký__abs__".apply("integer"),
          "sucetZPolskyAbs": this.properties."Súčet_z_poľský__abs__".apply("integer"),
          "sucetZRuskyAbs": this.properties."Súčet_z_ruský__abs__".apply("integer"),
          "sucetZVietnamskyAbs": this.properties."Súčet_z_vietnamský__abs__".apply("integer"),
          "sucetZAnglickyAbs": this.properties."Súčet_z_anglický__abs__".apply("integer"),
          "sucetZChorvatskyAbs": this.properties."Súčet_z_chorvátsky__abs__".apply("integer"),
          "sucetZSrbskyAbs": this.properties."Súčet_z_srbský__abs__".apply("integer"),
          "sucetZTalianskyAbs": this.properties."Súčet_z_taliansky__abs__".apply("integer"),
          "sucetZJidisAleboHebrejsky": this.properties."Súčet_z_jidiš_alebo_hebrejský__".apply("integer"),
          "sucetZArabskyAbs": this.properties."Súčet_z_arabský__abs__".apply("integer"),
          "sucetZFrancuzskyAbs": this.properties."Súčet_z_francúzsky__abs__".apply("integer"),
          "sucetZRumunskyAbs": this.properties."Súčet_z_rumunský__abs__".apply("integer"),
          "sucetZAlbanskyAbs": this.properties."Súčet_z_albánsky__abs__".apply("integer"),
          "sucetZSpanielskyAbs": this.properties."Súčet_z_španielsky__abs__".apply("integer"),
          "sucetZSlovenskyPosunkovyJaz": this.properties."Súčet_z_slovenský_posunkový_jaz".apply("integer"),
          "sucetZCinskyAbs": this.properties."Súčet_z_čínsky__abs__".apply("integer"),
          "sucetZBulharskyAbs": this.properties."Súčet_z_bulharský__abs__".apply("integer"),
          "sucetZKorejskyAbs": this.properties."Súčet_z_kórejský__abs__".apply("integer"),
          "sucetZTureckyAbs": this.properties."Súčet_z_turecký__abs__".apply("integer"),
          "sucetZPerzskyAbs": this.properties."Súčet_z_perzský__abs__".apply("integer"),
          "sucetZInyAbs": this.properties."Súčet_z_iný__abs__".apply("integer"),
          "sucetZNezistenyAbs": this.properties."Súčet_z_nezistený__abs__".apply("integer"),
          "slovensky": this.properties."slovenský____".apply("float"),
          "madarsky": this.properties."maďarský____".apply("float"),
          "romsky": this.properties."rómsky____".apply("float"),
          "rusinsky": this.properties."rusínsky____".apply("float"),
          "cesky": this.properties."český____".apply("float"),
          "ukrajinsky": this.properties."ukrajinský____".apply("float"),
          "nemecky": this.properties."nemecký____".apply("float"),
          "polsky": this.properties."poľský____".apply("float"),
          "rusky": this.properties."ruský____".apply("float"),
          "vietnamsky": this.properties."vietnamský____".apply("float"),
          "anglicky": this.properties."anglický____".apply("float"),
          "chorvatsky": this.properties."chorvátsky____".apply("float"),
          "srbsky": this.properties."srbský____".apply("float"),
          "taliansky": this.properties."taliansky____".apply("float"),
          "jidisAleboHebrejsky": this.properties."jidiš_alebo_hebrejský____".apply("float"),
          "arabsky": this.properties."arabský____".apply("float"),
          "francuzsky": this.properties."francúzsky____".apply("float"),
          "rumunsky": this.properties."rumunský____".apply("float"),
          "albansky": this.properties."albánsky____".apply("float"),
          "spanielsky": this.properties."španielsky____".apply("float"),
          "slovenskyPosunkovyJazyk": this.properties."slovenský_posunkový_jazyk____".apply("float"),
          "cinsky": this.properties."čínsky____".apply("float"),
          "bulharsky": this.properties."bulharský____".apply("float"),
          "korejsky": this.properties."kórejský____".apply("float"),
          "turecky": this.properties."turecký____".apply("float"),
          "perzsky": this.properties."perzský____".apply("float"),
          "iny": this.properties."iný____".apply("float"),
          "nezisteny": this.properties."nezistený____".apply("float"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mapa_SODB_2021_materinsk%C3%BD_jazyk_okresy/FeatureServer/0/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bbsk-obyvatelstvo-podla-materinskeho-jazyka-2021-okresy-404a3d" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
