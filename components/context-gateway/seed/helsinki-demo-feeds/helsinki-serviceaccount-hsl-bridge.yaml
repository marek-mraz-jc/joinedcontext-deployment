# The HSL bridge (T-5883): its client `helsinki-hsl-bridge` signs in with a secret an approver
# issues in the Portal (PF-37), stored on dev as the Secret the demo-feeds hsl-bridge part reads;
# no secret is in this repository. The broker `hsl-bridge` names it; it publishes only HSL's tram
# positions there and writes nothing through an Endpoint.
apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: hsl-bridge
  namespace: helsinki
  title: { en: HSL feed bridge (dev test), fi: HSL-syötteen silta (kehitystesti) }
spec:
  owner: { user: de300000-0000-4000-8000-000000000001 } # demo.steward
  purpose: Republishes HSL's live tram positions to the MQTT broker hsl-bridge on dev
  roles:
    - role: space-reader
      scope: { contextSpace: hsl-mqtt-test }
      types: [Vehicle]
  credentials:
    - kind: oauth-client
      name: main
