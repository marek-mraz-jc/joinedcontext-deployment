id: https://bbsk.sk/models/kraj/statistical-observation
name: statistical-observation
title: One published statistical cell
description: >-
  One cell of a published statistical table, as its publisher published it (DM-01, DM-09).
  A territory code, a period, the publisher's own indicator code, the remaining dimensions of
  the cube and the number, with the request that produced it. Nothing is renamed and nothing is
  recomputed on the way in, so a row can always be traced back to the URL it came from; the
  indicators computed from these rows are `KeyPerformanceIndicator` entities in the project's
  indicator space (PF-54, PF-55).

  It is deliberately not a Data Structure Definition in the sense of DM-60: a declared DSD puts
  its observations in the project's indicator space, and this space would then hold nothing.
  DM-60 is the upgrade the day an indicator has to be sliced by a dimension rather than read as
  one number per territory.
license: https://joinedcontext.com/licenses/cc-by-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  jc: https://joinedcontext.com/models/
  ngsi-ld: https://uri.etsi.org/ngsi-ld/
  qb: http://purl.org/linked-data/cube#
  sdmx-dim: http://purl.org/linked-data/sdmx/2009/dimension#
  ucefact: https://vocabulary.uncefact.org/UnitMeasureCode#
default_prefix: jc
default_range: string
imports:
  - linkml:types
  - ngsi-ld-core

slots:
  dataSet:
    slot_uri: qb:dataSet
    description: The publisher's own code for the table this cell comes from, such as `zp3803rs`.
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: http://purl.org/linked-data/cube#
  indicator:
    slot_uri: jc:indicator
    description: The publisher's own code for the measure, such as `ODPAD_TONY_KM2`.
    required: true
    annotations:
      ngsi_ld_kind: Property
  refArea:
    slot_uri: sdmx-dim:refArea
    description: >-
      The territory the cell describes, as the publisher codes it: a NUTS code for the kraj or
      an okres (`SK032`, `SK0323`), a LAU code for a municipality (`SK0321508438`).
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: http://purl.org/linked-data/sdmx/2009/dimension#
  refPeriod:
    slot_uri: sdmx-dim:refPeriod
    description: The period the cell covers, as the publisher labels it, such as `2023` or `2025Q2`.
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: http://purl.org/linked-data/sdmx/2009/dimension#
  dimensionKey:
    slot_uri: jc:dimensionKey
    description: >-
      The cube's remaining dimensions beyond territory and period, as their codes joined by a
      hyphen and in the cube's own dimension order, such as `1` for the solid-emissions
      pollutant. It is the tail of the `{localId}`, repeated here so a query can select a slice
      without matching on an id pattern. Absent when the table has no further dimension.
    annotations:
      ngsi_ld_kind: Property
  value:
    slot_uri: jc:value
    description: >-
      The number, exactly as published. Its unit varies with the indicator and travels on the
      Property as `unitCode`, a UN/CEFACT common code, beside `unitText`.
    range: float
    required: true
    annotations:
      ngsi_ld_kind: Property
  unitText:
    slot_uri: jc:unitText
    description: The unit in the publisher's own words, such as `v tis. m3`, kept because a UN/CEFACT code loses the scale factor.
    annotations:
      ngsi_ld_kind: Property
  source:
    slot_uri: jc:source
    description: The exact URL the row was fetched from, with its query, so the cell can be fetched again.
    required: true
    annotations:
      ngsi_ld_kind: Property
  dateObserved:
    slot_uri: jc:dateObserved
    description: When the publisher last updated the table, as the table itself reports it.
    range: datetime
    required: true
    annotations:
      ngsi_ld_kind: Property

  stewardNote:
    slot_uri: jc:stewardNote
    description: >-
      A note by the person who keeps this data: what was checked, what looks wrong, whom to
      ask. The one attribute of this model no pipeline writes and no pipeline overwrites, so
      an application may offer it for editing without the next run silently taking the words
      back (AP-62, EP-14). Every figure beside it belongs to the publisher and is read-only.
      At most 500 characters and no angle brackets, because it is a note and not a document.
    pattern: "^[^<>]{0,500}$"
    annotations:
      ngsi_ld_kind: Property

classes:
  StatisticalObservation:
    class_uri: qb:Observation
    description: One cell of one published statistical table.
    is_a: Entity
    slots:
      - dataSet
      - indicator
      - refArea
      - refPeriod
      - dimensionKey
      - value
      - unitText
      - source
      - dateObserved
      - stewardNote
