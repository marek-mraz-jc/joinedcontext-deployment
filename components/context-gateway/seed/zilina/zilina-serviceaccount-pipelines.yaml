apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipelines
  namespace: zilina
  title: { sk: "Dávkovacie kanály Žiliny", en: "Žilina ingestion pipelines" }
spec:
  owner: { user: "demo.steward" }
  purpose: "The Bento streams of the Žilina project write the ŠÚ SR rows into zilina-mesto, the air quality, monuments and stations into zilina-verejne, the university's works into zilina-uniza and the indicators into zilina-kpi"
  roles:
    - { role: space-writer, scope: { contextSpace: zilina-mesto } }
    - { role: space-writer, scope: { contextSpace: zilina-verejne } }
    - { role: space-writer, scope: { contextSpace: zilina-uniza } }
    - { role: space-writer, scope: { contextSpace: zilina-kpi } }
  credentials:
    - { kind: oauth-client, name: main }
