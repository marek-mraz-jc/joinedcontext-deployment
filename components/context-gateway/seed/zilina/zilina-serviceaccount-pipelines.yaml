apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipelines
  namespace: zilina
  title: { sk: Dávkovacie kanály Žiliny, en: Žilina ingestion pipelines }
spec:
  owner: { user: de300000-0000-4000-8000-000000000001 } # demo.steward
  purpose: The Bento streams of the Žilina project write the ŠÚ SR rows into zilina-mesto, the air quality, monuments and stations into zilina-verejne, the university's works into zilina-uniza, the indicators into zilina-kpi and the city portal's car parks, vehicles, traffic counts and street lights into zilina-doprava
  roles:
    - role: space-writer
      scope: { contextSpace: zilina-mesto }
    - role: space-writer
      scope: { contextSpace: zilina-verejne }
    - role: space-writer
      scope: { contextSpace: zilina-uniza }
    - role: space-writer
      scope: { contextSpace: zilina-kpi }
    - role: space-writer
      scope: { contextSpace: zilina-doprava }
  credentials:
    - kind: oauth-client
      name: main
