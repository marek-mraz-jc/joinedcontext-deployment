# One AirQualityObserved per record of `eea-sk0020a-o3`, written into the city's public space through its one Endpoint (PL-18, T-3138).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: ovzdusie-o3
  namespace: zilina
  title: { sk: "O3 na stanici SK0020A", en: "O3 at station SK0020A" }
spec:
  class: auto
  # EEA publishes each hour about 25 minutes after it ends; a read at minute 40 finds it (PL-26).
  period: 1h
  schedule: "46 * * * *"
  source:
    dataSourceRef: { kind: DataSource, name: eea-sk0020a-o3 }
  targetEndpoint: urn:ngsi-ld:Endpoint:zilina.sk:zilina-verejne:zilina-verejne
  output:
    type: AirQualityObserved
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
