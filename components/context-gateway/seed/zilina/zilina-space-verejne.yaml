# The city's public map data: its air-quality station, its monuments and its railway stations, as national publishers publish them (Research/zilina-open-data-sources.md).
apiVersion: joinedcontext.com/v1alpha1
kind: ContextSpace
metadata:
  name: zilina-verejne
  namespace: zilina
  title: { sk: "Žilina — verejné dáta", en: "Žilina, public data" }
  description:
    sk: "Kvalita ovzdušia, kultúrne pamiatky a železničné stanice mesta Žilina z otvorených dát EEA, Pamiatkového úradu a ŽSR."
    en: "Air quality, cultural monuments and railway stations of Žilina from the open data of the EEA, the Monuments Board and ŽSR."
spec:
  # The space name is the segment its ids carry, pinned so it cannot drift (PF-84).
  urnSegment: zilina-verejne
  isSandbox: false
  # The one model of this space: a write of a type it does not declare is refused (DM-61).
  dataModelRef: { kind: DataModel, name: zilina-verejne }
  defaultLocale: sk
  # History per type (DM-82, ADR-N-046 2.3, T-4275): a measurement series keeps 30 days, every
  # other type keeps its current state only. Owners change it on the space's Retention tab.
  retention:
    - entityType: AirQualityObserved
      history: P30D
      # Written on every run without an observedAt: one row per change and one a week,
      # not one per run (T-4844, DM-108, DM-109; scripts/temporal-audit.py).
      attributes:
        dataProvider: { record: onChange, heartbeat: P7D }
        dateObserved: { record: onChange, heartbeat: P7D }
        location: { record: onChange, heartbeat: P7D }
        name: { record: onChange, heartbeat: P7D }
        source: { record: onChange, heartbeat: P7D }
        stationCode: { record: onChange, heartbeat: P7D }
    - entityType: GtfsStop
      history: "off"
    - entityType: PointOfInterest
      history: "off"
  # The space's place (T-4525): the catalogue's Dataset carries it, so georel=near finds the space.
  # the city of Žilina with a margin; a PointOfInterest outside it is flagged, never refused (DM-87).
  quality:
    - name: in-area
      entityType: PointOfInterest
      kind: area
      attribute: location
      bbox: [18.55, 49.1, 18.95, 49.35]
