# The write door of zilina-doprava (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes zilina-doprava served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint zilina-doprava.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: zilina-doprava-zapis
  namespace: zilina
  title: { sk: 'Žilina — doprava a mesto naživo: zápis', en: 'Žilina, mobility live: writes' }
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint zilina-doprava.
    en: The internal door the data is written through; people read it through the public Endpoint zilina-doprava.
spec:
  contextSpaceRef: zilina-doprava
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:zilina.sk:zilina-doprava:doprava-pipelines-write
    - urn:ngsi-ld:Policy:zilina.sk:zilina-doprava:doprava-read
    - urn:ngsi-ld:Policy:zilina.sk:zilina-doprava:mhd-read
    - urn:ngsi-ld:Policy:zilina.sk:zilina-doprava:parkoviska-read
    - urn:ngsi-ld:Policy:zilina.sk:zilina-doprava:scitace-read
    - urn:ngsi-ld:Policy:zilina.sk:zilina-doprava:svietidla-read
  slug: tcqlroavwwpp753bjyroev7bapvznrnz
  audience: organization
  enabledRepresentations: [ngsi-ld]
