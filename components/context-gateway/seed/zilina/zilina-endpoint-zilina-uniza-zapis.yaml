# The write door of zilina-uniza (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes zilina-uniza served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint zilina-uniza.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: zilina-uniza-zapis
  namespace: zilina
  title: { sk: 'Žilinská univerzita — výskum: zápis', en: 'University of Žilina, research: writes' }
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint zilina-uniza.
    en: The internal door the data is written through; people read it through the public Endpoint zilina-uniza.
spec:
  contextSpaceRef: zilina-uniza
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:zilina.sk:zilina-uniza:app-zilina-vyskum-1
    - urn:ngsi-ld:Policy:zilina.sk:zilina-uniza:uniza-pipelines-write
    - urn:ngsi-ld:Policy:zilina.sk:zilina-uniza:uniza-read
  slug: luvxxq6frkmxhzw5ehujhssdql4sz6pr
  audience: organization
  enabledRepresentations: [ngsi-ld, websocket, ogc-features, mcp]
