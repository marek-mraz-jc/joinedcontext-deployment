    keywords:
      sk: ["výskum", "publikácie", "otvorený prístup", "univerzita", "Žilina"]
      en: ["research", "publications", "open access", "university", "Žilina"]
    spatial:
      - SK031
      - "https://data.gov.sk/id/lau2/SK031B517402"
    frequency: WEEKLY
    source:
      - url: "https://dspace.uniza.sk/server/api/discover/search/objects?dsoType=ITEM"
