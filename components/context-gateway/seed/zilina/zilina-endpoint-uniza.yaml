        description: { sk: "DSpace 7 REST; len položky s otvorenou licenciou v dc.rights.uri.", en: "DSpace 7 REST; only the items with an open licence in dc.rights.uri." }
    pipelineRef: { kind: Pipeline, name: drepo }
