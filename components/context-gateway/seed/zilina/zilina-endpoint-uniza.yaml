  namespace: zilina
  description:
    sk: "Otvorene licencované práce Digitálneho repozitára Žilinskej univerzity (DREPO): názov, druh, rok, zbierka, vydavateľ, licencia a trvalý odkaz, bez mien autorov."
    en: "The openly licensed works of the University of Žilina's digital repository (DREPO): title, kind, year, collection, publisher, licence and persistent handle, without author names."
  title: { sk: "Žilinská univerzita — výskum", en: "University of Žilina, research" }
spec:
  contextSpaceRef: zilina-uniza
  slug: os4quyrmvhijr3x7x4fno2jicej4ifv5
  audience: public
  enabledRepresentations: [ngsi-ld, csv, json]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: zilina }
