apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: kpi-read
  namespace: zilina
  title: { sk: Verejné čítanie ukazovateľov mesta, en: "Public read: the city's indicators" }
spec:
  contextSpaceRef: { kind: ContextSpace, name: zilina-kpi }
  assigner: did:web:zilina.sk
  assignee: { kind: role, id: public }
  # Read only. The indicators are what the project publishes as its own numbers.
  # Discovery beside the reads (T-4258, EP-116): which types and attributes the Endpoint holds,
  # narrowed to this grant (EP-26), so an anonymous MCP client finds them before it queries.
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
    - queryTemporal
    - retrieveTemporal
  # Its types keep history: anyone reads it, as far back as the space keeps it (T-4372).
  temporalQ: timerel=after;timeAt=P-30D
  information:
    - entities:
        - type: KeyPerformanceIndicator
