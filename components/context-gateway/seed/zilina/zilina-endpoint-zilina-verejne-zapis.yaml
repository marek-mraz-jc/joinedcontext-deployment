# The write door of zilina-verejne (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes zilina-verejne served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint zilina-verejne.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: zilina-verejne-zapis
  namespace: zilina
  title: { sk: 'Žilina — verejné dáta: zápis', en: 'Žilina, public data: writes' }
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint zilina-verejne.
    en: The internal door the data is written through; people read it through the public Endpoint zilina-verejne.
spec:
  contextSpaceRef: zilina-verejne
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:zilina.sk:zilina-verejne:app-zilina-mapa-1
    - urn:ngsi-ld:Policy:zilina.sk:zilina-verejne:app-zilina-zaznamy-1
    - urn:ngsi-ld:Policy:zilina.sk:zilina-verejne:ovzdusie-read
    - urn:ngsi-ld:Policy:zilina.sk:zilina-verejne:pamiatky-read
    - urn:ngsi-ld:Policy:zilina.sk:zilina-verejne:stanice-read
    - urn:ngsi-ld:Policy:zilina.sk:zilina-verejne:verejne-pipelines-write
    - urn:ngsi-ld:Policy:zilina.sk:zilina-verejne:verejne-read
    - urn:ngsi-ld:Policy:zilina.sk:zilina-verejne:verejne-read-history
  slug: iyjqibogjx6gbm4t7m6h2dkgfpss2qav
  audience: organization
  enabledRepresentations: [ngsi-ld]
