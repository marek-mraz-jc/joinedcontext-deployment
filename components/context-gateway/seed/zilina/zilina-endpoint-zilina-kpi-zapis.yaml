# The write door of zilina-kpi (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes zilina-kpi served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint zilina-kpi.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: zilina-kpi-zapis
  namespace: zilina
  title: { sk: 'Žilina — ukazovatele: zápis', en: 'Žilina, indicators: writes' }
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint zilina-kpi.
    en: The internal door the data is written through; people read it through the public Endpoint zilina-kpi.
spec:
  contextSpaceRef: zilina-kpi
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:zilina.sk:zilina-kpi:app-zilina-ukazovatele-1
    - urn:ngsi-ld:Policy:zilina.sk:zilina-kpi:kpi-pipelines-write
    - urn:ngsi-ld:Policy:zilina.sk:zilina-kpi:kpi-read
  slug: surbfjufso7hr2svy6xyglmgggmxd4zn
  audience: organization
  enabledRepresentations: [ngsi-ld]
