# One Smart Data Model type per catalogue dataset (T-4344): AirQualityObserved of the space
# zilina-verejne, read through its own Policy, which narrows the space's public read to these types.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
