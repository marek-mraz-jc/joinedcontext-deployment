apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: pamiatky-read
  namespace: zilina
  title: { sk: 'Verejné čítanie: kultúrne pamiatky' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: zilina-verejne }
  assigner: did:web:zilina.sk
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint zilina-pamiatky, and only
  # its types: the space's other types stay with their own datasets (T-4344).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: PointOfInterest
