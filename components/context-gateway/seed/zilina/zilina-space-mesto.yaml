# What ŠÚ SR publishes for the city of Žilina (SK031B517402), one entity per cube cell, the publisher's codes kept verbatim. The indicators computed from it live in zilina-kpi and never here (PF-54).
apiVersion: joinedcontext.com/v1alpha1
kind: ContextSpace
metadata:
  name: zilina-mesto
  namespace: zilina
  title: { sk: "Mesto — zdrojové údaje", en: "City, raw data" }
  description:
    sk: "Riadky ŠÚ SR pre mesto Žilina (SK031B517402), tak ako ich publikoval ŠÚ SR."
    en: "ŠÚ SR rows for the city of Žilina (SK031B517402), as ŠÚ SR published them."
spec:
  # The space name is the segment its ids carry, pinned so it cannot drift (PF-84).
  urnSegment: zilina-mesto
  isSandbox: false
  # The one model of this space: a write of a type it does not declare is refused (DM-61).
  dataModelRef: { kind: DataModel, name: statistical-observation }
  defaultLocale: sk
