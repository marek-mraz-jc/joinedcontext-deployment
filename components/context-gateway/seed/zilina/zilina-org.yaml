# Mesto Žilina, an Organization of its own in this installation (ADR-N-058, PF-121, T-5242).
# Helsinki (organizations/hel.yaml) stays the installation's: the repository, {orgDomain} and
# the URNs do not move. A project of this Organization publishes under zilina.sk or a subdomain
# of it (PF-122); its Keycloak group subtree is /zilina and its CKAN organisation `zilina`.
apiVersion: joinedcontext.com/v1alpha1
kind: Organization
metadata:
  name: zilina
  namespace: org
  title: { sk: Mesto Žilina, en: City of Žilina }
spec:
  domain: zilina.sk
  locales: [sk, en]
  defaultLocale: sk
  dcatProfiles: [dcat-ap-sk]
  # The publisher a project of this Organization names in its catalogue when it names none of
  # its own (ADR-N-058 2.3, EP-127): the city by its registry IRI.
  catalog:
    publisher:
      name: { sk: Mesto Žilina, en: City of Žilina }
      uri: https://data.gov.sk/id/legal-subject/00321796
    contactPoint: { name: joinedcontext platform, email: hello@joinedcontext.com }
  projects:
    # Its people read its projects through zilina-viewers; a project is opened by org-admin (PF-61, PF-65).
    visibility: organization
    creation: org-admin
    # The demo's quota (T-2873, PF-73): the mechanism stays, nobody reaches it.
    quota:
      contextSpaces: 100
      residentPipelines: 100
      publicEndpoints: 100
      apps: 100
      ingestEventsPerSecond: 500
      agentRunsPerDay: 2000
      entitiesPerSpace: 1000000
      requestsPerMinute: 6000
