# Žilina's public data as one read-only MCP connector (T-4750, ADR-N-043):
# `https://{domain}/api/mcp/zilina/otvorene-data`, the server the city's public assistant reads
# through. Its members are the three Endpoints that assistant read before; every call is still the
# member's own call under its anonymous Policy, and a public server lists read tools only,
# whoever calls (EP-141).
apiVersion: joinedcontext.com/v1alpha1
kind: McpServer
metadata:
  name: otvorene-data
  namespace: zilina
  # What an AI client reads as serverInfo and initialize.instructions (EP-92).
  title:
    sk: Žilina — otvorené údaje
    en: Žilina, open data
  description:
    sk: 'Otvorené údaje mesta Žilina, len na čítanie: hodinové merania ovzdušia na stanici SK0020A, národné kultúrne pamiatky, železničné stanice s odchodmi vlakov, šesť ukazovateľov mesta zo ŠÚ SR a otvorene licencované práce Žilinskej univerzity (DREPO). Zdroje: Európska environmentálna agentúra (údaje SHMÚ), Pamiatkový úrad SR, ŽSR, Štatistický úrad SR, Žilinská univerzita. Pri citovaní uveďte zdroj.'
    en: "Read-only open data of the City of Žilina, Slovakia: hourly air quality at station SK0020A, the city's national cultural monuments, its railway stations with the trains leaving each day, six city indicators computed from the Statistical Office's data, and the openly licensed works of the University of Žilina's repository (DREPO). Start with list_types, then query_entities with a small limit. Texts are in Slovak. Credit the source each Endpoint names when you quote it."
spec:
  members:
    - kind: Endpoint
      name: zilina-verejne
    - kind: Endpoint
      name: zilina-kpi
    - kind: Endpoint
      name: zilina-uniza
  audience: public
