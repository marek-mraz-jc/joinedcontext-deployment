# Žilina's public data as one read-only MCP connector (T-4750, T-5367, ADR-N-043):
# `https://{domain}/api/mcp/zilina/otvorene-data`, the server the city's public assistant reads
# through. It selects every public Endpoint of the project zilina; every call is still that
# Endpoint's own call under its anonymous Policy, and a public server lists read tools only,
# whoever calls (EP-141).
apiVersion: joinedcontext.com/v1alpha1
kind: McpServer
metadata:
  name: otvorene-data
  namespace: zilina
  # What an AI client reads as serverInfo and initialize.instructions (EP-92).
  title:
    sk: Žilina — otvorené údaje
    en: Žilina, open data
  description:
    sk: 'Otvorené údaje mesta Žilina, len na čítanie: hodinové merania ovzdušia na stanici SK0020A, národné kultúrne pamiatky, železničné stanice s odchodmi vlakov, MHD, parkoviská, sčítače dopravy a verejné osvetlenie, šesť ukazovateľov mesta zo ŠÚ SR a otvorene licencované práce Žilinskej univerzity (DREPO). Zdroje: Európska environmentálna agentúra (údaje SHMÚ), Pamiatkový úrad SR, ŽSR, Štatistický úrad SR, Žilinská univerzita. Pri citovaní uveďte zdroj.'
    en: "Read-only open data of the City of Žilina, Slovakia: hourly air quality at station SK0020A, the city's national cultural monuments, its railway stations with the trains leaving each day, city buses, car parks, traffic counters and street lights, six city indicators computed from the Statistical Office's data, and the openly licensed works of the University of Žilina's repository (DREPO). Start with list_endpoints or search, then query_entities naming one endpoint, with a small limit. Texts are in Slovak. Credit the source each Endpoint names when you quote it."
spec:
  # Every public Endpoint of the project, resolved on each call (MF-55, T-5367): a new one joins
  # without an edit here, one that stops being public leaves.
  select:
    projects: [zilina]
    accessLevel: [public]
  audience: public
