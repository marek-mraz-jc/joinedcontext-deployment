apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipelines
  namespace: slovensko
  title: { sk: "Kanály projektu Slovensko", en: "Slovakia ingestion pipelines" }
spec:
  owner: { user: "demo.steward" }
  purpose: "The Bento streams of the Slovakia project write the national air quality into the space ovzdusie-sk"
  roles:
    - { role: space-writer, scope: { contextSpace: ovzdusie-sk } }
  credentials:
    - { kind: oauth-client, name: main }
