# Generated by scripts/open-data/datacube.py (T-4390); do not edit by hand.
# Every cube of theme `np`, whole, into susr-np: one KeyPerformanceIndicator per published cell,
# as ŠÚ SR published it; nothing is renamed or recomputed. A daily read keeps every table within
# a day of its release.
apiVersion: joinedcontext.com/v1alpha2
kind: Pipeline
metadata:
  name: susr-np
  namespace: slovensko
  title: { sk: "ŠÚ SR: Náklady práce a mzdy", en: "ŠÚ SR: Labour costs and wages" }
spec:
  class: auto
  period: 24h
  schedule: "16 3 * * *"
  sources:
    - dataSourceRef: { kind: DataSource, name: susr-np1101rr }
    - dataSourceRef: { kind: DataSource, name: susr-np1102rs }
    - dataSourceRef: { kind: DataSource, name: susr-np1105rs }
    - dataSourceRef: { kind: DataSource, name: susr-np2008rs }
    - dataSourceRef: { kind: DataSource, name: susr-np2014qs }
    - dataSourceRef: { kind: DataSource, name: susr-np3101rr }
    - dataSourceRef: { kind: DataSource, name: susr-np3102rr }
    - dataSourceRef: { kind: DataSource, name: susr-np3103rr }
    - dataSourceRef: { kind: DataSource, name: susr-np3106rr }
    - dataSourceRef: { kind: DataSource, name: susr-np3112qr }
  steps:
    - kind: bloblang
      bloblang: |
        # The cubes of this theme and the role of their dimensions, read from DATAcube's collection.
        let cubes = {"np1101rr": {"area": "np1101rr_kraj", "indicator": "np1101rr_obd", "keys": ["np1101rr_ukaz"], "period": "np1101rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/np1101rr/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-12-15"}, "np1102rs": {"area": null, "indicator": null, "keys": ["np1102rs_ukaz", "np1102rs_nace"], "period": "np1102rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/np1102rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-12-15"}, "np1105rs": {"area": null, "indicator": null, "keys": ["np1105rs_stv", "np1105rs_nace"], "period": "np1105rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/np1105rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-09-02"}, "np2008rs": {"area": null, "indicator": "np2008rs_ukaz", "keys": ["np2008rs_nace"], "period": "np2008rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/np2008rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-12-15"}, "np2014qs": {"area": null, "indicator": null, "keys": ["np2014qs_stv", "np2014qs_ukaz2"], "period": "np2014qs_rok", "source": "https://data.statistics.sk/api/v2/dataset/np2014qs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-09-02"}, "np3101rr": {"area": "nuts13", "indicator": "np3101rr_ukaz", "keys": ["np3101rr_dim1"], "period": "np3101rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/np3101rr/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-07-13"}, "np3102rr": {"area": "nuts13", "indicator": "np3102rr_ukaz", "keys": ["np3102rr_dim1"], "period": "np3102rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/np3102rr/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-07-13"}, "np3103rr": {"area": "nuts13", "indicator": "np3103rr_ukaz", "keys": ["np3103rr_dim1"], "period": "np3103rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/np3103rr/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-07-13"}, "np3106rr": {"area": "nuts13", "indicator": "np3106rr_ukaz", "keys": ["np3106rr_dim1"], "period": "np3106rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/np3106rr/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-07-13"}, "np3112qr": {"area": "nuts13", "indicator": "np3112qr_ukaz", "keys": ["np3112qr_dim1"], "period": "np3112qr_rok", "source": "https://data.statistics.sk/api/v2/dataset/np3112qr/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-09-02"}}
        # The cube a message is, from the address the answer names itself by.
        let cube = this.href.or("").re_find_object("/(?P<code>[a-z]{2}[0-9]{4}[a-z]{2})/").code.catch(null)
        let roles = $cubes.get($cube.or("")).catch(null)
        root = if $roles == null { throw("no cube of this theme answered: %v".format(this.href.or("no href"))) } else if this.value.or([]).length() == 0 { throw("cube %v answered no cell".format($cube)) } else { this }
        let ds = this
        let ids = this.id
        let sizes = this.size
        let n = $sizes.length()
        # JSON-stat 2.0 is decoded by the index and never by the order: the period comes newest first.
        let codes = $ids.map_each(d -> $ds.dimension.get(d).category.index.key_values().sort_by(kv -> kv.value).map_each(kv -> kv.key))
        let labels = $ids.map_each(d -> $ds.dimension.get(d).category.label.or({}))
        let strides = range(0, $n, 1).map_each(k -> if k + 1 >= $n { 1 } else { $sizes.slice(k + 1, $n).fold(1, t -> t.tally * t.value) })
        let at_index = range(0, $n, 1).map_each(k -> { $ids.index(k): k }).squash()
        # A dimension DATAcube adds to the answer only (`*_data`, one value) names nothing.
        let named = [$roles.period, $roles.area, $roles.indicator, $roles.unit].concat($roles.keys)
        let keys = $roles.keys.concat($ids.filter(d -> !$named.contains(d) && $sizes.index($at_index.get(d)) > 1))
        let updated = ($ds.update.or($roles.update)).ts_parse("2006-01-02").ts_format("2006-01-02T15:04:05Z07:00", "UTC").catch(null)
        let cells = if $ds.value.type() == "object" { $ds.value.key_values().map_each(kv -> { "p": kv.key.number().int64(), "v": kv.value }) } else { range(0, $ds.value.length(), 1).map_each(p -> { "p": p, "v": $ds.value.index(p) }) }
        # One entity per cell that carries a number; a cell the publisher left empty is not a zero.
        root = $cells.filter(c -> c.v != null && c.v.type() == "number").map_each(c -> range(0, $n, 1).map_each(k -> { $ids.index(k): $codes.index(k).index(((c.p / $strides.index(k)).floor().int64()) % $sizes.index(k)) }).squash().merge({ "_v": c.v })).map_each(at -> {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), [$cube, if $roles.area == null { "SK0" } else { at.get($roles.area) }, at.get($roles.period), if $roles.indicator == null { $cube } else { at.get($roles.indicator) }].concat($keys.map_each(d -> at.get(d))).concat(if $roles.unit == null { [] } else { [at.get($roles.unit)] }).join("-").re_replace_all("[^A-Za-z0-9._~-]", "_")),
          "type": "KeyPerformanceIndicator",
          "dataSet": { "type": "Property", "value": $cube },
          "indicator": { "type": "Property", "value": if $roles.indicator == null { $cube } else { at.get($roles.indicator) } },
          "refArea": { "type": "Property", "value": if $roles.area == null { "SK0" } else { at.get($roles.area) } },
          "refPeriod": { "type": "Property", "value": at.get($roles.period) },
          "dimensionKey": if $keys.length() == 0 { null } else { { "type": "Property", "value": $keys.map_each(d -> at.get(d)).join("-") } },
          "kpiValue": { "type": "Property", "value": at._v, "observedAt": $updated }.filter(e -> e.value != null),
          "unitText": if $roles.unit == null { null } else { { "type": "Property", "value": $labels.index($at_index.get($roles.unit)).get(at.get($roles.unit)).or(at.get($roles.unit)) } },
          "source": { "type": "Property", "value": $roles.source },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/susr-%v".format($cube) },
          "dateObserved": if $updated == null { null } else { { "type": "Property", "value": $updated } }
        }.filter(e -> e.value != null))
  outputs:
    - targetEndpoint: urn:ngsi-ld:Endpoint:joinedcontext.com:susr-np:susr-np
      type: KeyPerformanceIndicator
      mode: upsert
  quotas:
    maxMemoryMb: 192
    cpuMillicores: 100
