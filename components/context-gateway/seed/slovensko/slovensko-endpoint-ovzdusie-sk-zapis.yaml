# The write door of ovzdusie-sk (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes ovzdusie-sk served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint ovzdusie-sk.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: ovzdusie-sk-zapis
  namespace: slovensko
  title: { sk: 'Kvalita ovzdušia — Slovensko: zápis', en: 'Air quality — Slovakia: writes' }
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint ovzdusie-sk.
    en: The internal door the data is written through; people read it through the public Endpoint ovzdusie-sk.
spec:
  contextSpaceRef: ovzdusie-sk
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:joinedcontext.com:ovzdusie-sk:pipelines-write
    - urn:ngsi-ld:Policy:joinedcontext.com:ovzdusie-sk:public-read
  slug: 72mu23f3fgzfvidgg5l45lw2tbbi4y2n
  audience: organization
  enabledRepresentations: [ngsi-ld]
