anská bystrica","town":"banska-bystrica","venue":"Rudohorská 23/A, Banská Bystrica","streetAddress":"Rudohorská 23A","addressLocality":"Banská Bystrica","lat":48.7569918,"lon":19.165669},{"match":"štátna vedecká knižnica","town":"banska-bystrica","venue":"Štátna vedecká knižnica","streetAddress":"Lazovná 240/9","addressLocality":"Banská Bystrica","lat":48.7373616,"lon":19.1436671},{"match":"univerzita mateja bela","town":"banska-bystrica","venue":"Univerzita Mateja Bela","streetAddress":"Národná 739/12","addressLocality":"Banská Bystrica","lat":48.7331796,"lon":19.1455309},{"match":"pedagogická fakulta umb","town":"banska-bystrica","venue":"Pedagogická fakulta UMB","streetAddress":"Ružová 4038/13","addressLocality":"Banská Bystrica","lat":48.7512092,"lon":19.1550149},{"match":"záhrada – centrum nezávislej kultúry","town":"banska-bystrica","venue":"Záhrada – Centrum nezávislej kultúry","streetAddress":"Dolná 167/34","addressLocality":"Banská Bystrica","lat":48.7336704,"lon":19.1423806},{"match":"thurzov dom námesie snp 4 banská bystrica","town":"banska-bystrica","venue":"Thurzov dom","streetAddress":"Námestie SNP 4/4","addressLocality":"Banská Bystrica","lat":48.7351155,"lon":19.1455954}]
