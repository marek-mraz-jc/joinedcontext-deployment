# Generated by scripts/open-data/datacube.py (T-4390); do not edit by hand.
# Every cube of theme `ob`, whole, into susr-ob: one KeyPerformanceIndicator per published cell,
# as ŠÚ SR published it; nothing is renamed or recomputed. A daily read keeps every table within
# a day of its release.
apiVersion: joinedcontext.com/v1alpha2
kind: Pipeline
metadata:
  name: susr-ob
  namespace: slovensko
  title: { sk: "ŠÚ SR: Obchod", en: "ŠÚ SR: Trade" }
spec:
  class: auto
  period: 24h
  schedule: "20 3 * * *"
  sources:
    - dataSourceRef: { kind: DataSource, name: susr-ob0002ms }
    - dataSourceRef: { kind: DataSource, name: susr-ob0003ms }
    - dataSourceRef: { kind: DataSource, name: susr-ob0004ms }
    - dataSourceRef: { kind: DataSource, name: susr-ob0005ms }
    - dataSourceRef: { kind: DataSource, name: susr-ob0006ms }
    - dataSourceRef: { kind: DataSource, name: susr-ob1004qs }
    - dataSourceRef: { kind: DataSource, name: susr-ob1801ms }
    - dataSourceRef: { kind: DataSource, name: susr-ob1802ms }
    - dataSourceRef: { kind: DataSource, name: susr-ob1803ms }
  steps:
    - kind: bloblang
      bloblang: |
        # The cubes of this theme and the role of their dimensions, read from DATAcube's collection.
        let cubes = {"ob0002ms": {"area": null, "indicator": "ob0002ms_indic", "keys": ["ob0002ms_month", "ob0002ms_specu", "ob0002ms_nace2"], "period": "ob0002ms_year", "source": "https://data.statistics.sk/api/v2/dataset/ob0002ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "ob0002ms_unit", "update": "2026-09-04"}, "ob0003ms": {"area": null, "indicator": "ob0003ms_indic", "keys": ["ob0003ms_month", "ob0003ms_specu", "ob0003ms_nace2"], "period": "ob0003ms_year", "source": "https://data.statistics.sk/api/v2/dataset/ob0003ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "ob0003ms_unit", "update": "2026-09-04"}, "ob0004ms": {"area": null, "indicator": "ob0004ms_indic", "keys": ["ob0004ms_month", "ob0004ms_specu", "ob0004ms_nace2"], "period": "ob0004ms_year", "source": "https://data.statistics.sk/api/v2/dataset/ob0004ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "ob0004ms_unit", "update": "2026-09-04"}, "ob0005ms": {"area": null, "indicator": "ob0005ms_indic", "keys": ["ob0005ms_month", "ob0005ms_specu", "ob0005ms_nace2"], "period": "ob0005ms_year", "source": "https://data.statistics.sk/api/v2/dataset/ob0005ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "ob0005ms_unit", "update": "2026-09-04"}, "ob0006ms": {"area": null, "indicator": "ob0006ms_indic", "keys": ["ob0006ms_month", "ob0006ms_specu", "ob0006ms_nace2"], "period": "ob0006ms_year", "source": "https://data.statistics.sk/api/v2/dataset/ob0006ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "ob0006ms_unit", "update": "2026-09-04"}, "ob1004qs": {"area": null, "indicator": "ob1004qs_indic", "keys": ["ob1004qs_quarter", "ob1004qs_specu", "ob1004qs_nace2"], "period": "ob1004qs_year", "source": "https://data.statistics.sk/api/v2/dataset/ob1004qs/all/all/all/all/all/all?lang=sk&type=json", "unit": "ob1004qs_unit", "update": "2026-09-14"}, "ob1801ms": {"area": null, "indicator": "ob1801ms_indic", "keys": ["ob1801ms_month", "ob1801ms_specu", "ob1801ms_nace2"], "period": "ob1801ms_year", "source": "https://data.statistics.sk/api/v2/dataset/ob1801ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "ob1801ms_unit", "update": "2026-09-04"}, "ob1802ms": {"area": null, "indicator": "ob1802ms_indic", "keys": ["ob1802ms_month", "ob1802ms_specu", "ob1802ms_nace2"], "period": "ob1802ms_year", "source": "https://data.statistics.sk/api/v2/dataset/ob1802ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "ob1802ms_unit", "update": "2026-09-04"}, "ob1803ms": {"area": null, "indicator": "ob1803ms_indic", "keys": ["ob1803ms_month", "ob1803ms_specu", "ob1803ms_nace2"], "period": "ob1803ms_year", "source": "https://data.statistics.sk/api/v2/dataset/ob1803ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "ob1803ms_unit", "update": "2026-09-14"}}
        # The cube a message is, from the address the answer names itself by.
        let cube = this.href.or("").re_find_object("/(?P<code>[a-z]{2}[0-9]{4}[a-z]{2})/").code.catch(null)
        let roles = $cubes.get($cube.or("")).catch(null)
        root = if $roles == null { throw("no cube of this theme answered: %v".format(this.href.or("no href"))) } else if this.value.or([]).length() == 0 { throw("cube %v answered no cell".format($cube)) } else { this }
        let ds = this
        let ids = this.id
        let sizes = this.size
        let n = $sizes.length()
        # JSON-stat 2.0 is decoded by the index and never by the order: the period comes newest first.
        let codes = $ids.map_each(d -> $ds.dimension.get(d).category.index.key_values().sort_by(kv -> kv.value).map_each(kv -> kv.key))
        let labels = $ids.map_each(d -> $ds.dimension.get(d).category.label.or({}))
        let strides = range(0, $n, 1).map_each(k -> if k + 1 >= $n { 1 } else { $sizes.slice(k + 1, $n).fold(1, t -> t.tally * t.value) })
        let at_index = range(0, $n, 1).map_each(k -> { $ids.index(k): k }).squash()
        # A dimension DATAcube adds to the answer only (`*_data`, one value) names nothing.
        let named = [$roles.period, $roles.area, $roles.indicator, $roles.unit].concat($roles.keys)
        let keys = $roles.keys.concat($ids.filter(d -> !$named.contains(d) && $sizes.index($at_index.get(d)) > 1))
        let updated = ($ds.update.or($roles.update)).ts_parse("2006-01-02").ts_format("2006-01-02T15:04:05Z07:00", "UTC").catch(null)
        let cells = if $ds.value.type() == "object" { $ds.value.key_values().map_each(kv -> { "p": kv.key.number().int64(), "v": kv.value }) } else { range(0, $ds.value.length(), 1).map_each(p -> { "p": p, "v": $ds.value.index(p) }) }
        # One entity per cell that carries a number; a cell the publisher left empty is not a zero.
        root = $cells.filter(c -> c.v != null && c.v.type() == "number").map_each(c -> range(0, $n, 1).map_each(k -> { $ids.index(k): $codes.index(k).index(((c.p / $strides.index(k)).floor().int64()) % $sizes.index(k)) }).squash().merge({ "_v": c.v })).map_each(at -> {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), [$cube, if $roles.area == null { "SK0" } else { at.get($roles.area) }, at.get($roles.period), if $roles.indicator == null { $cube } else { at.get($roles.indicator) }].concat($keys.map_each(d -> at.get(d))).concat(if $roles.unit == null { [] } else { [at.get($roles.unit)] }).join("-").re_replace_all("[^A-Za-z0-9._~-]", "_")),
          "type": "KeyPerformanceIndicator",
          "dataSet": { "type": "Property", "value": $cube },
          "indicator": { "type": "Property", "value": if $roles.indicator == null { $cube } else { at.get($roles.indicator) } },
          "refArea": { "type": "Property", "value": if $roles.area == null { "SK0" } else { at.get($roles.area) } },
          "refPeriod": { "type": "Property", "value": at.get($roles.period) },
          "dimensionKey": if $keys.length() == 0 { null } else { { "type": "Property", "value": $keys.map_each(d -> at.get(d)).join("-") } },
          "kpiValue": { "type": "Property", "value": at._v, "observedAt": $updated }.filter(e -> e.value != null),
          "unitText": if $roles.unit == null { null } else { { "type": "Property", "value": $labels.index($at_index.get($roles.unit)).get(at.get($roles.unit)).or(at.get($roles.unit)) } },
          "source": { "type": "Property", "value": $roles.source },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/susr-%v".format($cube) },
          "dateObserved": if $updated == null { null } else { { "type": "Property", "value": $updated } }
        }.filter(e -> e.value != null))
  outputs:
    - targetEndpoint: urn:ngsi-ld:Endpoint:joinedcontext.com:susr-ob:susr-ob
      type: KeyPerformanceIndicator
      mode: upsert
  quotas:
    maxMemoryMb: 192
    cpuMillicores: 100
