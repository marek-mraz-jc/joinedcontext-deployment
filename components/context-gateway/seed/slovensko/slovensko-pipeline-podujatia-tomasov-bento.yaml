pipeline:
  processors:
  - mapping: |
      let paths = content().string().re_find_all_object("href=\"(?:https?://www\\.tomasov\\.sk)?(?P<p>/oznamy/kalendar\\-podujati/[A-Za-z0-9._~%/-]{1,300}-[0-9]{1,9}(?:_[0-9]{1,9})?[a-z]{2}\\.html)\"").map_each(m -> m.p).unique()
