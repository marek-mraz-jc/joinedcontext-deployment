        let cubes = {"vt0001rs": {"area": null, "indicator": "vt0001rs_mj", "keys": ["vt0001rs_ukaz"], "period": "vt0001rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt0001rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-07-15"}, "vt0002rs": {"area": null, "indicator": "vt0002rs_ukaz", "keys": ["vt0002rs_fina"], "period": "vt0002rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt0002rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-07-15"}, "vt0003rs": {"area": null, "indicator": "vt0003rs_ukaz", "keys": ["vt0003rs_pod"], "period": "vt0003rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt0003rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-06-30"}, "vt1001rs": {"area": null, "indicator": "vt1001rs_ukaz", "keys": ["vt1001rs_tech"], "period": "vt1001rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1001rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1002rs": {"area": null, "indicator": "vt1002rs_ukaz", "keys": [], "period": "vt1002rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1002rs/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1003rs": {"area": null, "indicator": "vt1003rs_ukaz", "keys": ["vt1003rs_tech"], "period": "vt1003rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1003rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1004rs": {"area": null, "indicator": null, "keys": ["vt1004rs_ukaz", "vt1004rs_tech"], "period": "vt1004rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1004rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1005rs": {"area": null, "indicator": "vt1005rs_ukaz", "keys": [], "period": "vt1005rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1005rs/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1008rs": {"area": null, "indicator": "vt1008rs_ukaz", "keys": ["vt1008rs_area"], "period": "vt1008rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1008rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-09-30"}, "vt1009rs": {"area": null, "indicator": "vt1009rs_ukaz", "keys": ["vt1009rs_area"], "period": "vt1009rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1009rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-09-30"}, "vt1010rs": {"area": null, "indicator": "vt1010rs_ukaz", "keys": ["vt1010rs_area", "vt1010rs_pohl"], "period": "vt1010rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1010rs/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-09-30"}, "vt1011rs": {"area": null, "indicator": null, "keys": ["vt1011rs_ukaz", "vt1011rs_velk", "vt1011rs_tech"], "period": "vt1011rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1011rs/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1012rs": {"area": null, "indicator": null, "keys": ["vt1012rs_ukaz", "vt1012rs_tech"], "period": "vt1012rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1012rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1013rs": {"area": null, "indicator": null, "keys": ["vt1013rs_velk", "vt1013rs_tech"], "period": "vt1013rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1013rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1015rs": {"area": null, "indicator": null, "keys": ["vt1015rs_velk", "vt1015rs_tech"], "period": "vt1015rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1015rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1802rs": {"area": null, "indicator": "vt1802rs_ukaz", "keys": ["vt1802rs_tech"], "period": "vt1802rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1802rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1803rs": {"area": null, "indicator": "vt1803rs_mj", "keys": ["vt1803rs_ukaz1", "vt1803rs_ukaz2", "vt1803rs_sizeclas"], "period": "vt1803rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1803rs/all/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1804rs": {"area": null, "indicator": "vt1804rs_mj", "keys": ["vt1804rs_ukaz1", "vt1804rs_ukaz2", "vt1804rs_sizeclas"], "period": "vt1804rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1804rs/all/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1805rs": {"area": null, "indicator": "vt1805rs_ukaz", "keys": ["vt1805rs_tech"], "period": "vt1805rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1805rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "vt1806rs": {"area": null, "indicator": "vt1806rs_ukaz", "keys": ["vt1806rs_tech"], "period": "vt1806rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/vt1806rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}}
        # The cube a message is, from the address the answer names itself by.
        let cube = this.href.or("").re_find_object("/(?P<code>[a-z]{2}[0-9]{4}[a-z]{2})/").code.catch(null)
        let roles = $cubes.get($cube.or("")).catch(null)
        root = if $roles == null { throw("no cube of this theme answered: %v".format(this.href.or("no href"))) } else if this.value.or([]).length() == 0 { throw("cube %v answered no cell".format($cube)) } else { this }
        let ds = this
        let ids = this.id
        let sizes = this.size
        let n = $sizes.length()
        # JSON-stat 2.0 is decoded by the index and never by the order: the period comes newest first.
        let codes = $ids.map_each(d -> $ds.dimension.get(d).category.index.key_values().sort_by(kv -> kv.value).map_each(kv -> kv.key))
        let labels = $ids.map_each(d -> $ds.dimension.get(d).category.label.or({}))
        let strides = range(0, $n, 1).map_each(k -> if k + 1 >= $n { 1 } else { $sizes.slice(k + 1, $n).fold(1, t -> t.tally * t.value) })
        let at_index = range(0, $n, 1).map_each(k -> { $ids.index(k): k }).squash()
        # A dimension DATAcube adds to the answer only (`*_data`, one value) names nothing.
        let named = [$roles.period, $roles.area, $roles.indicator, $roles.unit].concat($roles.keys)
        let keys = $roles.keys.concat($ids.filter(d -> !$named.contains(d) && $sizes.index($at_index.get(d)) > 1))
        let updated = ($ds.update.or($roles.update)).ts_parse("2006-01-02").ts_format("2006-01-02T15:04:05Z07:00", "UTC").catch(null)
        let cells = if $ds.value.type() == "object" { $ds.value.key_values().map_each(kv -> { "p": kv.key.number().int64(), "v": kv.value }) } else { range(0, $ds.value.length(), 1).map_each(p -> { "p": p, "v": $ds.value.index(p) }) }
        # One entity per cell that carries a number; a cell the publisher left empty is not a zero.
        root = $cells.filter(c -> c.v != null && c.v.type() == "number").map_each(c -> range(0, $n, 1).map_each(k -> { $ids.index(k): $codes.index(k).index(((c.p / $strides.index(k)).floor().int64()) % $sizes.index(k)) }).squash().merge({ "_v": c.v })).map_each(at -> {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), [$cube, if $roles.area == null { "SK0" } else { at.get($roles.area) }, at.get($roles.period), if $roles.indicator == null { $cube } else { at.get($roles.indicator) }].concat($keys.map_each(d -> at.get(d))).concat(if $roles.unit == null { [] } else { [at.get($roles.unit)] }).join("-").re_replace_all("[^A-Za-z0-9._~-]", "_")),
          "type": "KeyPerformanceIndicator",
          "dataSet": { "type": "Property", "value": $cube },
          "indicator": { "type": "Property", "value": if $roles.indicator == null { $cube } else { at.get($roles.indicator) } },
          "refArea": { "type": "Property", "value": if $roles.area == null { "SK0" } else { at.get($roles.area) } },
          "refPeriod": { "type": "Property", "value": at.get($roles.period) },
          "dimensionKey": if $keys.length() == 0 { null } else { { "type": "Property", "value": $keys.map_each(d -> at.get(d)).join("-") } },
          "kpiValue": { "type": "Property", "value": at._v, "observedAt": $updated }.filter(e -> e.value != null),
          "unitText": if $roles.unit == null { null } else { { "type": "Property", "value": $labels.index($at_index.get($roles.unit)).get(at.get($roles.unit)).or(at.get($roles.unit)) } },
          "source": { "type": "Property", "value": $roles.source },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/susr-%v".format($cube) },
          "dateObserved": if $updated == null { null } else { { "type": "Property", "value": $updated } }
        }.filter(e -> e.value != null))
  outputs:
