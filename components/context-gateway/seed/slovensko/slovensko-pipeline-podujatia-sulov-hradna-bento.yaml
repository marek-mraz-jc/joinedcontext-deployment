      let known = $place.or($home)
      # GPS from the feed, else from the venue table, else from the organizer's address; never a town's centre
      # (owner 2026-10-20). An event with none is kept without a location and counted (owner 2026-10-22).
      let lat = this.lat.number().catch($known.lat.or(null))
