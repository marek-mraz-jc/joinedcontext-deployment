      meta events = {"category_cache": {}, "category_default": null, "facts_only": true, "grace": 86400, "home": {"poi":"osm-node-13888402851","match":"obecný úrad vinohrady nad váhom","town":"vinohrady-nad-vahom","venue":"Obecný úrad Vinohrady nad Váhom","streetAddress":null,"addressLocality":"Vinohrady nad Váhom","lat":48.3204716,"lon":17.7606031,"checked_by":"overpass"}, "lease": 187200, "listing": "https://www.vinohradynadvahom.eu/udalosti/kalendar-akcii/", "organizer": {"name": "Obec Vinohrady nad Váhom", "url": "https://www.vinohradynadvahom.eu"}, "provider": "Vinohrady nad Váhom, vinohradynadvahom.eu (licencia neuvedená)", "region": "Trnavský kraj", "scope": "/SK/TT", "self": ["celá obec", "mesto", "mesto vinohrady nad váhom", "mestský úrad", "mestský úrad vinohrady nad váhom", "obec", "obec vinohrady nad váhom", "obecný úrad", "obecný úrad vinohrady nad váhom", "v obci", "vinohrady nad váhom", "vinohrady nad váhom - celá obec"], "source": "https://www.vinohradynadvahom.eu/udalosti/kalendar-akcii/", "space": env("JC_SPACE"), "town": "Vinohrady nad Váhom", "town_scope": "/SK/TT/vinohrady_nad_vahom", "towns": [["Vinohrady nad Váhom","vinohrady-nad-vahom",48.32047,17.7606,"office"]], "venues": [{"poi":"osm-node-13888402851","match":"obecný úrad vinohrady nad váhom","town":"vinohrady-nad-vahom","venue":"Obecný úrad Vinohrady nad Váhom","streetAddress":null,"addressLocality":"Vinohrady nad Váhom","lat":48.3204716,"lon":17.7606031,"checked_by":"overpass"}]}
  - resource: events_tail
