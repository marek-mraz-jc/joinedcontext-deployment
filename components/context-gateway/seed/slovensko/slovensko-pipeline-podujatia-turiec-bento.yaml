# Generated by seeds/bbsk-events/generate.py from the inventory row Martin (tribe-rest),
# read 2026-10-20: https://turiec.com/events (T-4896). Do not edit: change the template or the CSV.
pipeline:
  processors:
  - mapping: |
      root = if this.events.or(null).type() != "array" { throw("the events API answered no event list") } else { this }
  - mapping: |
      # The plugin writes local wall time ("2026-11-14 19:00:00"); a whole-day event keeps its date.
      map at {
        # Some sites drop the seconds ("2026-11-03 19:00", visithumenne.sk, T-5051).
        let v = this.value.or("").string().re_replace_all("^([0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2})$", "$1:00")
        root = if !$v.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { null } else if this.all_day { $v.slice(0, 10) } else { $v.slice(0, 19).replace(" ", "T") + ($v.slice(0, 19).replace(" ", "T") + "Z").ts_format("-07:00", "Europe/Bratislava") }
      }
      root = this.events.map_each(e -> {
        "name": e.title.or(null),
        "start": { "value": e.start_date.or(null), "all_day": e.all_day.or(false) }.apply("at"),
        "end": { "value": e.end_date.or(null), "all_day": e.all_day.or(false) }.apply("at"),
        "venue": if e.venue.type() == "object" { e.venue.venue.or(null) } else { null },
        "streetAddress": if e.venue.type() == "object" { e.venue.address.or(null) } else { null },
        "postalCode": if e.venue.type() == "object" { e.venue.zip.or(null) } else { null },
        "locality": if e.venue.type() == "object" { e.venue.city.or(null) } else { null },
        "lat": if e.venue.type() == "object" { e.venue.geo_lat.or(null) } else { null },
        "lon": if e.venue.type() == "object" { e.venue.geo_lng.or(null) } else { null },
        "url": e.url.or(null),
        # The plugin's organizer: its name (`organizer`) and its web site; its e-mail and phone stay out.
        "organizer": e.organizer.or([]).(o -> if o.type() == "array" { o.index(0).catch(null) } else { o }).(o -> if o != null && o.type() == "object" { { "name": o.organizer.or(null), "url": o.website.or(null) } } else { null }),
        "category": e.categories.or([]).map_each(c -> c.name.or("")).filter(c -> c != "").join(", "),
        "description": e.description.or(null),
        "sourceId": e.id.or(null),
        "modified": e.modified_utc.or(null).(m -> if m != null { m.replace(" ", "T") + "Z" } else { null })
      })
  - mapping: |
      # The end as unix seconds: a datetime end as written, a whole-day end the next midnight
      # (CET, so up to an hour late in summer), no end the start plus a day (owner 2026-10-20).
      map unix {
        root = if this == null { null } else if this.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { this.ts_parse("2006-01-02").ts_unix() - 3600 } else { this.ts_unix().catch(null) }
      }
      let now = timestamp_unix()
      # A notice is no event (owner 2026-10-22, T-5215): waste collection, a council session, VZN, a zámer, an
      # oznámenie, elections, a power cut, a hall's booked or free slot (T-5393). Its record is never loaded.
      let notice = "(?i)(vývoz|odvoz|zvoz|zber|separ)\\S*\\s.*(odpad|papier|plast|skl|kov|kartón|bio|elektro|textil|olej|nádob)|^zberný dvor|^(papier|plasty?|sklo|kovy|bioodpad|komunálny odpad)$|\\bVZN\\b|všeobecne záväzn|\\bzámer|oznámeni|voľby|volby|referend|zasadnut|zastupiteľstv|preruš\\S* (dodávky|distribúcie)|odstávk|nová webová stránka|^(svadba|oslava|rodinná oslava|súkromná akcia|oslava narodenín|kar|obsadené|obsadený|rezervované|rezervovaná|voľné|voľný termín)$|\\bobsaden[ýáé]|prenájom (sály|kd|kultúrn)|súkromn[áé] (akcia|oslava)|rezervácia (jedál|sál|kd|kultúrn|miestn)"
      let records = this.filter(r -> !r.name.or("").string().unescape_html().trim().re_match($notice)).map_each(r -> r.merge({
        "_start": r.start.apply("unix"),
        "_end": if r.end != null && r.end.apply("unix") != null {
          r.end.apply("unix") + if r.end.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { 86400 } else { 0 }
        } else { r.start.apply("unix").(s -> if s != null { s + 86400 } else { null }) }
      }))
      # Only upcoming events (owner 2026-10-20): one whose end (plus the store's grace, a day in the national
      # store) is past is never loaded. A record with no readable start is refused, never stored without a date
      # (owner 2026-10-22, T-5215).
      let dated = $records.filter(r -> r._start != null && r._end + 86400 >= $now).sort_by(r -> r._start)
      root = $dated.slice(0, [$dated.length(), 100].min())
  - unarchive:
      format: json_array
  - mapping: |
      map key {
        # generate.py ABBREVIATIONS: a hall's or an office's short name spelled out (T-5240).
        root = (" " + this.lowercase().re_replace_all("\\([^)]*\\)", " ").re_replace_all("[,;]", " ").re_replace_all("\\s+", " ").trim() + " ").replace_all(" kd ", " kultúrny dom ").replace_all(" dk ", " dom kultúry ").replace_all(" msks ", " mestské kultúrne stredisko ").replace_all(" ocú ", " obecný úrad ").replace_all(" oú ", " obecný úrad ").replace_all(" msú ", " mestský úrad ").replace_all(" mú ", " mestský úrad ").trim()
      }
      map text {
        root = if this == null { null } else { this.string().strip_html().unescape_html().re_replace_all("\\s+", " ").trim().(t -> if t == "" { null } else { t }) }
      }
      map prop {
        root = if this == null { null } else { { "type": "Property", "value": this } }
      }
      let venues = []
      let name = this.name.apply("text")
      let venue_text = this.venue.apply("text")
      let venue_key = if $venue_text != null { $venue_text.apply("key") } else { "" }
      let place = $venues.filter(v -> v.match == $venue_key).index(0).catch(null)
      # An event that names no place, or only the town or its organizer, takes its organizer's own address
      # (homes.csv, owner 2026-10-22: "or the institution's address"); its venue stays as the source wrote it.
      let home = if $place == null && ($venue_key == "" || ["martin"].contains($venue_key)) { null } else { null }
      let known = $place.or($home)
      # The feed's town, unless it names a district or a region (geocode pilot 2026-10-22: "okres Myjava").
      let feed_locality = this.locality.apply("text").(l -> if l != null && l.re_match("(?i)^okres\\s|\\skraj$") { null } else { l })
      let locality = $feed_locality.or($known.addressLocality.or("Martin"))
      # An event with no known venue takes its town's office, else the town's centre (towns.csv, T-5240), labelled so.
      let hit = if $locality != null { [["Babín","babin",49.33232,19.37946,"office"],["Beňadovo","benadovo",49.43137,19.33909,"office"],["Bobrov","bobrov",49.42819,19.54399,"office"],["Bobrovec","bobrovec",49.11846,19.61372,"centre"],["Demänovská Dolina","demanovska-dolina",48.97705,19.59393,"office"],["Gbeľany","gbelany",49.21418,18.8485,"office"],["Hôrky","horky",49.20587,18.69218,"office"],["Lietavská Svinná-Babkov","lietavska-svinna-babkov",49.15249,18.67631,"office"],["Liptovská Kokava","liptovska-kokava",49.08574,19.81429,"office"],["Liptovské Kľačany","liptovske-klacany",49.0322,19.47468,"office"],["Lomná","lomna",49.36265,19.30707,"office"],["Martin","martin",49.06839,18.92569,"office"],["Oravská Polhora","oravska-polhora",49.52062,19.44742,"office"],["Paština Závada","pastina-zavada",49.21132,18.6384,"office"],["Podbiel","podbiel",49.3082,19.48481,"office"],["Ratkovo","ratkovo",49.13585,19.08628,"office"],["Rosina","rosina",49.17971,18.76874,"office"],["Sklabiňa","sklabina",49.04531,19.00355,"office"],["Stráňavy","stranavy",49.17096,18.8193,"office"],["Sučany","sucany",49.10047,18.99094,"office"],["Svrčinovec","svrcinovec",49.48115,18.79401,"office"],["Súľov-Hradná","sulov-hradna",49.16507,18.58785,"office"],["Teplička nad Váhom","teplicka-nad-vahom",49.2238,18.79886,"office"],["Turany","turany",49.11657,19.03526,"office"],["Turzovka","turzovka",49.40394,18.62471,"office"],["Vavrečka","vavrecka",49.38592,19.46834,"office"],["Vavrišovo","vavrisovo",49.07029,19.75891,"office"],["Vitanová","vitanova",49.35473,19.72698,"office"],["Vlachy","vlachy",49.09299,19.47418,"office"],["Zbyňov","zbynov",49.12061,18.64608,"office"],["Zuberec","zuberec",49.25998,19.61431,"office"],["Ďurčiná","durcina",49.06293,18.65443,"office"],["Ľubeľa","lubela",49.05221,19.48132,"office"],["Ťapešovo","tapesovo",49.3735,19.44664,"office"],["Kamenná Poruba","kamenna-poruba",49.089,18.68741,"office"],["Nižná","nizna",49.309,19.51903,"office"],["Višňové","visnove",49.16132,18.77657,"office"],["Ružomberok","ruzomberok",49.08151,19.30344,"office"],["Čadca","cadca",49.43818,18.79023,"office"],["Kysucké Nové Mesto","kysucke-nove-mesto",49.30555,18.78789,"office"],["Liesek","liesek",49.36058,19.67586,"office"],["Liptovský Hrádok","liptovsky-hradok",49.03724,19.72089,"office"],["Lisková","liskova",49.08868,19.35205,"office"],["Turčianske Teplice","turcianske-teplice",48.86185,18.86019,"office"],["Vrútky","vrutky",49.11381,18.92017,"office"]].filter(t -> t.index(0).lowercase() == $locality.lowercase()).index(0).catch(null) } else { null }
      let area = if $known == null && $hit != null { { "town": $hit.index(1), "lat": $hit.index(2), "lon": $hit.index(3), "precision": $hit.index(4) } } else { null }
      # The municipality by its official name, on every event (DM-141): the town table's, the venue's, else the feed's.
      let municipality = if $hit != null { $hit.index(0) } else { $known.addressLocality.or($locality) }
      # GPS from the feed, else from the venue table, else from the organizer's address, else from the town; the
      # precision says which (owner 2026-10-21: at least 90 % with a point; approximate points labelled).
      let feed_lat = this.lat.number().catch(null)
      let feed_lon = this.lon.number().catch(null)
      let pick = if $feed_lat != null && $feed_lon != null { { "lat": $feed_lat, "lon": $feed_lon, "precision": "source" } } else if $place != null { $place.merge({ "precision": "building" }) } else if $home != null { $home.merge({ "precision": "office" }) } else { $area }
      let lat = $pick.lat.or(null)
      let lon = $pick.lon.or(null)
      let point = if $lat != null && $lon != null && $lat >= 47.7 && $lat <= 49.7 && $lon >= 16.8 && $lon <= 22.6 { { "type": "Point", "coordinates": [$lon, $lat] } } else { null }
      let town = $known.town.or($area.town.or(null))
      # One event announced by two sources is one entity: the id hashes the name (letters and digits only, so
      # "Kintsugi – japonské umenie" and "Kintsugi: japonské umenie" agree), the start (to the hour in UTC, so
      # 16:35 and 16:36 agree, or the day) and the town, the dedup key of the Event model (T-4895, T-5215).
      let start_key = if this.start.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { this.start } else { this._start.ts_format("2006-01-02T15Z", "UTC") }
      let key = if $name != null { "%s|%s|%s".format($name.lowercase().re_replace_all("[^\\p{L}\\p{N}]+", " ").trim(), $start_key, $locality.or("").lowercase()) } else { "source|" + this.url.or(this.sourceId).or("").string() }
      # A street with the postcode glued on ("Bečov 96/6976 63" is 96/6 and 976 63) or written after it, or a postcode
      # alone ("976 63 Predajná"): the postcode moves to its own field and the country is dropped (T-5240).
      let street_text = this.streetAddress.apply("text").(s -> if s != null { s.re_replace_all("(?i)[,\\s]*(slovensko|slovakia|slovenská republika)$", "") } else { null })
      let glued = if $street_text != null { $street_text.re_find_object("^(?P<street>.*?\\d[a-zA-Z]?)[,\\s]*(?P<zip>\\d{3} \\d{2})(?:[,\\s]+[^\\d,]+)?$") } else { {} }
      let zip_only = if $street_text != null { $street_text.re_find_object("^(?P<zip>\\d{3} ?\\d{2})(?:[,\\s]+[^\\d,]+)?$") } else { {} }
      let street = if $zip_only.zip != null { null } else { $glued.street.or($street_text) }
      let address = {
        "streetAddress": $street.or($known.streetAddress.or(null)),
        "postalCode": this.postalCode.apply("text").or($zip_only.zip.or($glued.zip.or(null))),
        "addressLocality": $locality,
        "addressRegion": "Žilinský kraj",
        "addressCountry": "SK"
      }.filter(kv -> kv.value != null && kv.value != "")
      map link {
        root = if this == null { null } else { this.string().trim().(u -> if u.re_match("^https?://[^\\s/@]+(/\\S*)?$") && u.length() <= 2000 { u } else { null }) }
      }
      # The organizer the feed names, else the body whose calendar this is (the inventory row); an aggregator's
      # row names none, so its event keeps no organizer (owner 2026-10-22: optional). Name and web site only: a feed's
      # organizer e-mail or phone may be a person's and stays on the source's page.
      map uncontact {
        root = if this == null { null } else { this.re_replace_all("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "").re_replace_all("(\\+421|\\b0)[0-9][0-9 /]{7,}[0-9]", "").re_replace_all("(?i)\\b(tel|mobil|e-?mail|kontakt)\\.?:?", "").re_replace_all("\\s+", " ").re_replace_all("^[ ,;:-]+|[ ,;:-]+$", "").(t -> if t == "" { null } else { t }) }
      }
      let named = this.organizer.name.or(null).apply("text").apply("uncontact")
      let organizer = if $named != null { { "name": $named.slice(0, [$named.length(), 300].min()), "url": this.organizer.url.or(null).apply("link") }.filter(kv -> kv.value != null) } else { null }
      # The event's own page, else the organizer's page listing its events: every event carries a link a person opens.
      let link = this.url.apply("link").or("https://turiec.com/events")
      # The main category (T-5363, docs API/12-event-categories.md): the first rule of seeds/event-categories.json
      # matching the source's own word without its audience and catch-all parts, else the name, else the whole word
      # ("akcie pre deti"), else the kind of body whose calendar it is (a theatre). No match: no category.
      let rules = [["sport", "šport|sport|futbal|hokej|volejbal|nohejbal|basketbal|hádzan|tenis|kolky|karate|\\bbeh|maratón|turnaj|zápas|pohár|cyklo|korčuľ|plávan|lyžov|šach|atletik|fitnes|zumba|bowling|biliard|súťaž|hasič|krampuslauf|\\brun\\b"], ["outdoor-nature", "turistik|túra|výstup|výlet|príro|vychádzk|pochod|hike|nature|outdoor|jaskyň|splav|rastlín|stromy|záhrad"], ["film", "kino|film|premietan|projekci|cinema|movie"], ["theatre-dance", "divad|činohr|opera|balet|tanec|muzikál|predstaven|inscenác|bábk|repríza|premiér|kabaret|stand-?up|komédi|kúzel|zájazd|theat|dance|sľuk|lúčnic|színház"], ["music", "hudb|hudob|koncert|music|spev|zbor|orchest|kapel|\\bband\\b|trio\\b|kvartet|recitál|jazz|rock|disco|disko|párty|party|karaoke|\\bdj\\b|heligón|dychov|cimbal|organ|folklór|zábava|veselic|tančiare|\\bples|\\bbál\\b|vivaldi|zenekar"], ["festival-fair", "festival|\\bfest\\b|jarmo|\\bhody|hodov|dni obce|dni mesta|slávnos|oslav|karneval|maškar|fašiang|majáles|dožink|vinobran|ohňostroj|vatr|silvest|lampión|halloween|strašidel|tekvič|mikuláš"], ["food-market", "gastro|\\btrh|jedl|ochutnávk|degust|\\bvín|vinár|pivo|guláš|kapustnic|zabíjač|varen|pečen|burz|bazár|punč|kuchár|kuchyn|palacink|coffee|kávy|food|market|swap"], ["exhibition-museum", "výstav|vernisáž|finisáž|kurátor|galéri|múze|muze|expozíc|exhibit|museum|gallery|maľb|insit|sochár|ateliér|salón"], ["history-heritage", "histor|pamiatk|hrad|kaštie|zámo|dejin|výroči|spomienk|piet|vencov|vojn|veterán|\\bsnp\\b|remesl|kódex|prehliadk|baníc|patrón|minulos|dedičstv"], ["faith-tradition", "cirkev|omš|bohoslužb|kostol|púť|svät|modlitb|duchovn|poklon|pobožn|evanjel|reformač|farsk|farnos|biblick|advent|vianoc|vianoč|veľkonoč|dušičk|svetlono|koled|koľad|tradíci"], ["education-talk", "prednášk|seminár|konferenc|besed|workshop|kurz|vzdeláv|diskus|čítan|autorsk|knih|kniž|literár|poézi|poeti|básn|vedeck|\\bved|webinár|info dni|študent|talk|lecture|\\bai\\b|haiku|poviedk|recenzi|kvíz"], ["children-family", "deti|detsk|pre najmenš|rozprávk|rodin|rodič|škôlk|mamičk|story time|kids|children|family"], ["hobby-workshop", "tvoriv|tvoren|tvoríme|dielni|ručné práce|ručných prác|háčkov|pleten|plsten|modrotlač|ikeban|vyrezáv|spoločensk[ýé]ch hier|stolov[áé] hr|chovateľ|fotograf|hobby|craft"], ["health-wellness", "zdrav|wellness|cvičen|pohyb|kvapka krvi|darovanie krvi|meditác|relax|somatick|masáž|medicín|jóg|joga|parkinson|ženské kruhy|open class"], ["community-civic", "komunit|stretnut|posedeni|zhromažd|fórum|forum|občian|dobrovoľn|brigád|spolok|\\bklub|schôdz|ocenen|uvítan|jubil|prípitok|charit|zbierk|slobod|seniorov|susedia"]]
      let word = this.category.apply("text").or("").lowercase()
      let specific = $word.re_replace_all("trhy, výstavy, veľtrhy \\(ostatné\\)", "trh").re_replace_all("trhy, výstavy, veľtrhy|akcie pre [^,)]*", "")
      let title = $name.or("").lowercase()
      let category = [$specific, $title, $word].map_each(t -> $rules.filter(r -> t.re_match(r.index(1))).map_each(r -> r.index(0))).flatten().append(null).filter(c -> c != null).index(0).catch(null)
      let audience = if $category != "children-family" { null } else if ($word + " " + $title).re_match("deti|detsk|najmenš|škôlk") { ["children"] } else { ["family"] }
      let now = timestamp_unix()
      let lease = 28800
      let ends = if this._end == null { null } else { this._end + 86400 }
      let expires = if $lease == null { $ends } else if $ends == null { $now + $lease } else { [$ends, $now + $lease].min() }
      root = {
        "id": "urn:ngsi-ld:Event:%s:%s".format(env("JC_SPACE"), $key.hash("sha256").encode("hex").slice(0, 16)),
        "type": "Event",
        # The scope comes from the inventory row's region and town, never from the feed (T-4898). A
        # scope level is letters, digits and "_" (CIM 009 4.18): the broker refuses a hyphen (T-5051).
        "scope": if $town != null { "/SK/ZA" + "/" + $town.replace_all("-", "_") } else { "/SK/ZA/martin" },
        "name": $name.apply("prop"),
        "startDate": this.start.apply("prop"),
        "endDate": this.end.apply("prop"),
        "location": if $point != null { { "type": "GeoProperty", "value": $point } } else { null },
        "locationPrecision": if $point != null { { "type": "Property", "value": $pick.precision } } else { null },
        "venue": $place.venue.or($venue_text).apply("prop"),
        # The venue table's place as its PointOfInterest, which the store's miesta-podujati pipeline writes (DM-141).
        "refPointOfInterest": if $place != null { { "type": "Relationship", "object": "urn:ngsi-ld:PointOfInterest:%s:%s".format(env("JC_SPACE"), $place.poi) } } else { null },
        "areaServed": $municipality.apply("prop"),
        "address": { "type": "Property", "value": $address },
        "eventCategory": this.category.apply("text").apply("prop"),
        "category": if $category != null { { "type": "Property", "value": [$category] } } else { null },
        "categorySource": if $category != null { { "type": "Property", "value": "rule" } } else { null },
        "audience": $audience.apply("prop"),
        # A source that states no licence gives its facts only: what, when, where and the link back
        # (integrator 2026-10-20, T-4894); its text stays on its own page.
        # Contact e-mails and phone numbers stay on the source's page: they may name a person.
        "description": if true { null } else { this.description.apply("text").(d -> if d != null { d.re_replace_all("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "").re_replace_all("(\\+421|\\b0)[0-9][0-9 /]{7,}[0-9]", "").re_replace_all("\\s+", " ").trim() } else { null }).(d -> if d != null && d != "" { d.slice(0, [d.length(), 2000].min()) } else { null }).apply("prop") },
        "url": $link.apply("prop"),
        "organizer": $organizer.apply("prop"),
        "source": { "type": "Property", "value": "https://turiec.com/events" },
        "sourceId": this.sourceId.string().catch(null).apply("prop"),
        "dataProvider": { "type": "Property", "value": "Martin, turiec.com (licencia neuvedená)" },
        "dateModified": this.modified.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null).apply("prop"),
        # The event leaves the space when it is over (owner 2026-10-20, DM-130), or, in a store with a lease, when
        # no run has seen it for the lease: an event its source dropped or cancelled ends too (T-5047).
        "expiresAt": $expires.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)
      }.filter(kv -> kv.value != null)
  - archive:
      format: json_array
