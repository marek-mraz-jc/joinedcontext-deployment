# Generated by scripts/open-data/datacube.py (T-4390); do not edit by hand.
# Every cube of theme `kp`, whole, into susr-kp: one KeyPerformanceIndicator per published cell,
# as ŠÚ SR published it; nothing is renamed or recomputed. A daily read keeps every table within
# a day of its release.
apiVersion: joinedcontext.com/v1alpha2
kind: Pipeline
metadata:
  name: susr-kp
  namespace: slovensko
  title: { sk: "ŠÚ SR: Konjunkturálne prieskumy", en: "ŠÚ SR: Business and consumer surveys" }
spec:
  class: auto
  period: 24h
  schedule: "10 3 * * *"
  sources:
    - dataSourceRef: { kind: DataSource, name: susr-kp0003qs }
    - dataSourceRef: { kind: DataSource, name: susr-kp0012ms }
    - dataSourceRef: { kind: DataSource, name: susr-kp0013ms }
    - dataSourceRef: { kind: DataSource, name: susr-kp0014ms }
    - dataSourceRef: { kind: DataSource, name: susr-kp0015ms }
    - dataSourceRef: { kind: DataSource, name: susr-kp0016ms }
    - dataSourceRef: { kind: DataSource, name: susr-kp0017ms }
    - dataSourceRef: { kind: DataSource, name: susr-kp0018ms }
    - dataSourceRef: { kind: DataSource, name: susr-kp0019ms }
    - dataSourceRef: { kind: DataSource, name: susr-kp0020qs }
    - dataSourceRef: { kind: DataSource, name: susr-kp0021ms }
    - dataSourceRef: { kind: DataSource, name: susr-kp0022ms }
  steps:
    - kind: bloblang
      bloblang: |
        # The cubes of this theme and the role of their dimensions, read from DATAcube's collection.
        let cubes = {"kp0003qs": {"area": null, "indicator": "kp0003qs_otaz", "keys": ["kp0003qs_stv", "kp0003qs_ukaz"], "period": "kp0003qs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kp0003qs/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-07-30"}, "kp0012ms": {"area": null, "indicator": "kp0012ms_ind", "keys": ["kp0012ms_mes", "kp0012ms_obl", "kp0012ms_sez"], "period": "kp0012ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/kp0012ms/all/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-28"}, "kp0013ms": {"area": null, "indicator": null, "keys": ["kp0013ms_mes", "kp0013ms_nace", "kp0013ms_otazky"], "period": "kp0013ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/kp0013ms/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-28"}, "kp0014ms": {"area": null, "indicator": null, "keys": ["kp0014ms_mes", "kp0014ms_sizeclas", "kp0014ms_otaz"], "period": "kp0014ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/kp0014ms/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-28"}, "kp0015ms": {"area": null, "indicator": null, "keys": ["kp0015ms_mes", "kp0015ms_nace2", "kp0015ms_otaz"], "period": "kp0015ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/kp0015ms/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-28"}, "kp0016ms": {"area": null, "indicator": null, "keys": ["kp0016ms_mes", "kp0016ms_sizeclas", "kp0016ms_otaz"], "period": "kp0016ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/kp0016ms/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-28"}, "kp0017ms": {"area": null, "indicator": null, "keys": ["kp0017ms_mes", "kp0017ms_nace2", "kp0017ms_otaz"], "period": "kp0017ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/kp0017ms/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-28"}, "kp0018ms": {"area": null, "indicator": null, "keys": ["kp0018ms_mes", "kp0018ms_sizeclas", "kp0018ms_otaz"], "period": "kp0018ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/kp0018ms/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-28"}, "kp0019ms": {"area": null, "indicator": null, "keys": ["kp0019ms_mes", "kp0019ms_nace2", "kp0019ms_otaz"], "period": "kp0019ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/kp0019ms/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-28"}, "kp0020qs": {"area": null, "indicator": null, "keys": ["kp0020qs_stv", "kp0020qs_otaz"], "period": "kp0020qs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kp0020qs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-07-30"}, "kp0021ms": {"area": null, "indicator": null, "keys": ["kp0021ms_mes", "kp0021ms_otaz"], "period": "kp0021ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/kp0021ms/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-28"}, "kp0022ms": {"area": null, "indicator": "kp0022ms_indic", "keys": ["kp0022ms_month"], "period": "kp0022ms_year", "source": "https://data.statistics.sk/api/v2/dataset/kp0022ms/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-28"}}
        # The cube a message is, from the address the answer names itself by.
        let cube = this.href.or("").re_find_object("/(?P<code>[a-z]{2}[0-9]{4}[a-z]{2})/").code.catch(null)
        let roles = $cubes.get($cube.or("")).catch(null)
        root = if $roles == null { throw("no cube of this theme answered: %v".format(this.href.or("no href"))) } else if this.value.or([]).length() == 0 { throw("cube %v answered no cell".format($cube)) } else { this }
        let ds = this
        let ids = this.id
        let sizes = this.size
        let n = $sizes.length()
        # JSON-stat 2.0 is decoded by the index and never by the order: the period comes newest first.
        let codes = $ids.map_each(d -> $ds.dimension.get(d).category.index.key_values().sort_by(kv -> kv.value).map_each(kv -> kv.key))
        let labels = $ids.map_each(d -> $ds.dimension.get(d).category.label.or({}))
        let strides = range(0, $n, 1).map_each(k -> if k + 1 >= $n { 1 } else { $sizes.slice(k + 1, $n).fold(1, t -> t.tally * t.value) })
        let at_index = range(0, $n, 1).map_each(k -> { $ids.index(k): k }).squash()
        # A dimension DATAcube adds to the answer only (`*_data`, one value) names nothing.
        let named = [$roles.period, $roles.area, $roles.indicator, $roles.unit].concat($roles.keys)
        let keys = $roles.keys.concat($ids.filter(d -> !$named.contains(d) && $sizes.index($at_index.get(d)) > 1))
        let updated = ($ds.update.or($roles.update)).ts_parse("2006-01-02").ts_format("2006-01-02T15:04:05Z07:00", "UTC").catch(null)
        let cells = if $ds.value.type() == "object" { $ds.value.key_values().map_each(kv -> { "p": kv.key.number().int64(), "v": kv.value }) } else { range(0, $ds.value.length(), 1).map_each(p -> { "p": p, "v": $ds.value.index(p) }) }
        # One entity per cell that carries a number; a cell the publisher left empty is not a zero.
        root = $cells.filter(c -> c.v != null && c.v.type() == "number").map_each(c -> range(0, $n, 1).map_each(k -> { $ids.index(k): $codes.index(k).index(((c.p / $strides.index(k)).floor().int64()) % $sizes.index(k)) }).squash().merge({ "_v": c.v })).map_each(at -> {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), [$cube, if $roles.area == null { "SK0" } else { at.get($roles.area) }, at.get($roles.period), if $roles.indicator == null { $cube } else { at.get($roles.indicator) }].concat($keys.map_each(d -> at.get(d))).concat(if $roles.unit == null { [] } else { [at.get($roles.unit)] }).join("-").re_replace_all("[^A-Za-z0-9._~-]", "_")),
          "type": "KeyPerformanceIndicator",
          "dataSet": { "type": "Property", "value": $cube },
          "indicator": { "type": "Property", "value": if $roles.indicator == null { $cube } else { at.get($roles.indicator) } },
          "refArea": { "type": "Property", "value": if $roles.area == null { "SK0" } else { at.get($roles.area) } },
          "refPeriod": { "type": "Property", "value": at.get($roles.period) },
          "dimensionKey": if $keys.length() == 0 { null } else { { "type": "Property", "value": $keys.map_each(d -> at.get(d)).join("-") } },
          "kpiValue": { "type": "Property", "value": at._v, "observedAt": $updated }.filter(e -> e.value != null),
          "unitText": if $roles.unit == null { null } else { { "type": "Property", "value": $labels.index($at_index.get($roles.unit)).get(at.get($roles.unit)).or(at.get($roles.unit)) } },
          "source": { "type": "Property", "value": $roles.source },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/susr-%v".format($cube) },
          "dateObserved": if $updated == null { null } else { { "type": "Property", "value": $updated } }
        }.filter(e -> e.value != null))
  outputs:
    - targetEndpoint: urn:ngsi-ld:Endpoint:joinedcontext.com:susr-kp:susr-kp
      type: KeyPerformanceIndicator
      mode: upsert
  quotas:
    maxMemoryMb: 256
    cpuMillicores: 100
