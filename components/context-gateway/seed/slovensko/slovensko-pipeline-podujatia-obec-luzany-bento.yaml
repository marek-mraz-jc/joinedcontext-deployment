# Generated by seeds/bbsk-events/generate.py from the inventory row Lužany (weby-feed),
# read 2026-10-21: https://www.obec-luzany.sk/ (T-4896). Do not edit: change the template or the CSV.
pipeline:
  processors:
  - xml:
      operator: to_json
  - mapping: |
      let items = if this.RDF.or(null) != null { this.RDF.item.or([]) } else if this.feed.or(null) != null { this.feed.entry.or([]) } else { throw("the feed is neither RSS 1.0 nor Atom") }
      let list = if $items.type() == "array" { $items } else { [$items] }
      root = $list.map_each(i -> {
        "name": i.title.or(null).(t -> if t.type() == "object" { t."#text".or(null) } else { t }),
        "url": i."-about".or(i.id.or(i.link.or(null).(l -> if l.type() == "object" { l."-href".or(null) } else { l }))).string().trim()
      })
  - unarchive:
      format: json_array
  - branch:
      request_map: |
        let path = this.url.or("").re_find_object("^https://www\\.obec\\-luzany\\.sk/akcia/(?P<p>[A-Za-z0-9._-]{1,200}\\.html)$").p.or(null)
        root = if $path == null { deleted() } else { "" }
        meta event_path = $path
      processors:
      - sleep:
          duration: 1s
      - http:
          url: https://www.obec-luzany.sk/akcia/${! @event_path }
          verb: GET
          headers:
            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
            Accept: text/html
          timeout: 20s
          retries: 1
      result_map: |
        map field {
          root = this.page.re_find_object("act-" + this.cls + "[^\"]*\">\\s*<div class=\"data-name\">[^<]*</div>\\s*<div class=\"data-value[^\"]*\">(?P<v>[^<]*)</div>").v.or(null).(v -> if v != null { v.unescape_html().trim() } else { null })
        }
        map day {
          let m = this.or("").re_find_object("^(?P<d>[0-9]{1,2})\\. ?(?P<m>[0-9]{1,2})\\. ?(?P<y>[0-9]{4})$")
          root = if $m.y.or(null) == null { null } else { "%s-%02d-%02d".format($m.y, $m.m.number().int64(), $m.d.number().int64()) }
        }
        map at {
          let t = this.time.or("").re_find_all("[0-9]{1,2}:[0-9]{2}").index(this.n).catch(null)
          let hm = if $t != null { $t.split(":").map_each(x -> x.number().int64()) } else { null }
          let local = if $hm != null && this.date != null { "%sT%02d:%02d:00".format(this.date, $hm.index(0), $hm.index(1)) } else { null }
          root = if this.date == null { null } else if $local == null { this.date } else { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") }
        }
        let page = content().string()
        let from = { "page": $page, "cls": "date from" }.apply("field").apply("day")
        let to = { "page": $page, "cls": "date to" }.apply("field").apply("day")
        let time = { "page": $page, "cls": "time" }.apply("field")
        root.start = { "date": $from, "time": $time, "n": 0 }.apply("at")
        # "7:00 - 12:00" on one day ends at 12:00; a date range ends on its last day.
        root.end = if $to != null { $to } else if $time.or("").re_find_all("[0-9]{1,2}:[0-9]{2}").length() > 1 { { "date": $from, "time": $time, "n": 1 }.apply("at") } else { null }
        root.venue = { "page": $page, "cls": "place" }.apply("field")
        root.category = { "page": $page, "cls": "kat" }.apply("field")
        # "Usporiadateľ: Mesto Lučenec, LUKUS": who runs the event (T-5081).
        root.organizer = { "page": $page, "cls": "usp" }.apply("field").(o -> if o != null { { "name": o } } else { null })
  - archive:
      format: json_array
  - mapping: |
      # The end as unix seconds: a datetime end as written, a whole-day end the next midnight
      # (CET, so up to an hour late in summer), no end the start plus a day (owner 2026-10-20).
      map unix {
        root = if this == null { null } else if this.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { this.ts_parse("2006-01-02").ts_unix() - 3600 } else { this.ts_unix().catch(null) }
      }
      let now = timestamp_unix()
      let records = this.map_each(r -> r.merge({
        "_start": r.start.apply("unix"),
        "_end": if r.end != null && r.end.apply("unix") != null {
          r.end.apply("unix") + if r.end.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { 86400 } else { 0 }
        } else { r.start.apply("unix").(s -> if s != null { s + 86400 } else { null }) }
      }))
      # Only upcoming events (owner 2026-10-20): one whose end (plus the store's grace, a day in the national
      # store) is past is never loaded. A record with no readable start stays, so the model check refuses it
      # where the run report shows it.
      let upcoming = $records.filter(r -> r._end == null || r._end + 86400 >= $now)
      let dated = $upcoming.filter(r -> r._start != null).sort_by(r -> r._start)
      root = $dated.slice(0, [$dated.length(), 100].min()).concat($upcoming.filter(r -> r._start == null))
  - unarchive:
      format: json_array
  - mapping: |
      map key {
        root = this.lowercase().re_replace_all("\\([^)]*\\)", " ").re_replace_all("[,;]", " ").re_replace_all("\\s+", " ").trim()
      }
      map text {
        root = if this == null { null } else { this.string().strip_html().unescape_html().re_replace_all("\\s+", " ").trim().(t -> if t == "" { null } else { t }) }
      }
      map prop {
        root = if this == null { null } else { { "type": "Property", "value": this } }
      }
      let venues = []
      let name = this.name.apply("text")
      let venue_text = this.venue.apply("text")
      let venue_key = if $venue_text != null { $venue_text.apply("key") } else { "" }
      let known = $venues.filter(v -> v.match == $venue_key).index(0).catch(null)
      # GPS from the feed, else from the venue table checked by hand; never a town's centre (owner
      # 2026-10-20). An event with neither keeps no location and the model check refuses it.
      let lat = this.lat.number().catch($known.lat.or(null))
      let lon = this.lon.number().catch($known.lon.or(null))
      let point = if $lat != null && $lon != null && $lat >= 47.7 && $lat <= 49.7 && $lon >= 16.8 && $lon <= 22.6 { { "type": "Point", "coordinates": [$lon, $lat] } } else { null }
      let locality = this.locality.apply("text").or($known.addressLocality.or("Lužany"))
      let town = $known.town.or("luzany")
      # One event announced by two sources is one entity: the id hashes the name, the start (to the
      # minute in UTC, or the day) and the town, the dedup key of the Event model (T-4895).
      let start_key = if this._start == null { null } else if this.start.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { this.start } else { this._start.ts_format("2006-01-02T15:04Z", "UTC") }
      let key = if $name != null && $start_key != null { "%s|%s|%s".format($name.lowercase(), $start_key, $locality.or("").lowercase()) } else { "source|" + this.url.or(this.sourceId).or("").string() }
      let address = {
        "streetAddress": this.streetAddress.apply("text").or($known.streetAddress.or(null)),
        "postalCode": this.postalCode.apply("text"),
        "addressLocality": $locality,
        "addressRegion": "Nitriansky kraj",
        "addressCountry": "SK"
      }.filter(kv -> kv.value != null && kv.value != "")
      map link {
        root = if this == null { null } else { this.string().trim().(u -> if u.re_match("^https?://[^\\s/@]+(/\\S*)?$") && u.length() <= 2000 { u } else { null }) }
      }
      # The organizer the feed names, else the body whose calendar this is (the inventory row); an aggregator's
      # row names none, so its event without an organizer is refused (T-5081). Name and web site only: a feed's
      # organizer e-mail or phone may be a person's and stays on the source's page.
      map uncontact {
        root = if this == null { null } else { this.re_replace_all("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "").re_replace_all("(\\+421|\\b0)[0-9][0-9 /]{7,}[0-9]", "").re_replace_all("(?i)\\b(tel|mobil|e-?mail|kontakt)\\.?:?", "").re_replace_all("\\s+", " ").re_replace_all("^[ ,;:-]+|[ ,;:-]+$", "").(t -> if t == "" { null } else { t }) }
      }
      let named = this.organizer.name.or(null).apply("text").apply("uncontact")
      let organizer = if $named != null { { "name": $named.slice(0, [$named.length(), 300].min()), "url": this.organizer.url.or(null).apply("link") }.filter(kv -> kv.value != null) } else { {"name": "Obec Lužany", "url": "https://www.obec-luzany.sk"} }
      # The event's own page, else the organizer's page listing its events: every event carries a link a person opens.
      let link = this.url.apply("link").or("https://www.obec-luzany.sk/")
      let now = timestamp_unix()
      let lease = 187200
      let ends = if this._end == null { null } else { this._end + 86400 }
      let expires = if $lease == null { $ends } else if $ends == null { $now + $lease } else { [$ends, $now + $lease].min() }
      root = {
        "id": "urn:ngsi-ld:Event:%s:%s".format(env("JC_SPACE"), $key.hash("sha256").encode("hex").slice(0, 16)),
        "type": "Event",
        # The scope comes from the inventory row's region and town, never from the feed (T-4898). A
        # scope level is letters, digits and "_" (CIM 009 4.18): the broker refuses a hyphen (T-5051).
        "scope": if $town != null { "/SK/NR" + "/" + $town.replace_all("-", "_") } else { "/SK/NR" },
        "name": $name.apply("prop"),
        "startDate": this.start.apply("prop"),
        "endDate": this.end.apply("prop"),
        "location": if $point != null { { "type": "GeoProperty", "value": $point } } else { null },
        "venue": $known.venue.or($venue_text).apply("prop"),
        "address": { "type": "Property", "value": $address },
        "eventCategory": this.category.apply("text").apply("prop"),
        # A source that states no licence gives its facts only: what, when, where and the link back
        # (integrator 2026-10-20, T-4894); its text stays on its own page.
        # Contact e-mails and phone numbers stay on the source's page: they may name a person.
        "description": if true { null } else { this.description.apply("text").(d -> if d != null { d.re_replace_all("[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "").re_replace_all("(\\+421|\\b0)[0-9][0-9 /]{7,}[0-9]", "").re_replace_all("\\s+", " ").trim() } else { null }).(d -> if d != null && d != "" { d.slice(0, [d.length(), 2000].min()) } else { null }).apply("prop") },
        "url": $link.apply("prop"),
        "organizer": $organizer.apply("prop"),
        "source": { "type": "Property", "value": "https://www.obec-luzany.sk/" },
        "sourceId": this.sourceId.string().catch(null).apply("prop"),
        "dataProvider": { "type": "Property", "value": "Lužany, obec-luzany.sk (licencia neuvedená)" },
        "dateModified": this.modified.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null).apply("prop"),
        # The event leaves the space when it is over (owner 2026-10-20, DM-130), or, in a store with a lease, when
        # no run has seen it for the lease: an event its source dropped or cancelled ends too (T-5047).
        "expiresAt": $expires.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)
      }.filter(kv -> kv.value != null)
  - archive:
      format: json_array
