# The mapping of the ovzdusie pipeline of project slovensko (T-4340): the hourly means of PM10,
# PM2.5, NO2 and O3 at every Slovak station the EEA download service publishes, one AirQualityObserved
# per station. Do not edit: change scripts/air-sk/ and run scripts/air-sk/generate.py.
#
# Each run first reads, from the space's own public Endpoint, the latest hour it holds of each
# station and pollutant, and then writes every valid hour after it, oldest first, back to at most
# 7 days: the first run fills the week's history, every later one adds the new hour, and a
# restart writes nothing twice. The hours go out hour by hour, every station's in each (T-4410): the
# broker applies the repeats of one id in a batch as sequential rounds, and station by station a
# 1000-entity batch was ~168 rounds, which the 30 s write timeout cut 2-3 days into the week. A failed read of the Endpoint fails the run before anything is
# written. The files are read one at a time (for_each), so the runner holds one decoded file, not
# 159. A file that does not come is left out with a log line, so one retired sampling point
# does not stop the other stations; a run in which no file comes fails where it can be seen. The name is
# Smart Data Models' plain text, in Slovak.

pipeline:
  processors:
    - mapping: root = ""
    - http:
        url: "${JC_GATEWAY_URL}/api/endpoint/wtvuppkop6y3qv7bnvzqwifv4uts4e2k/ngsi-ld/v1/entities?type=AirQualityObserved&attrs=no2,o3,pm10,pm25&limit=1000"
        verb: GET
        headers:
          Accept: application/json
        timeout: 30s
        retries: 2
    - mapping: |
        root = if errored() { throw("the stored stations could not be read: %v".format(error())) } else { this }
    # Nothing is fetched or written after a failed read: the errored message alone goes on.
    - switch:
        - check: '!errored()'
          processors:
          - mapping: |
              let floor = @jc_now.or(now()).ts_parse("2006-01-02T15:04:05Z07:00").ts_unix() - 604800
              let stored = this.or([]).fold({}, item -> item.tally.merge({ (item.value.id.split(":").index(-1)): ["no2", "o3", "pm10", "pm25"].fold({}, a -> a.tally.merge(if item.value.get(a.value).observedAt.or(null) == null { {} } else { { (a.value): item.value.get(a.value).observedAt.ts_parse("2006-01-02T15:04:05Z07:00").ts_unix() } })) }))
              root = [{"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0001A_00005_100.parquet", "station": "SK0001A", "attribute": "pm10"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0001A_00007_500.parquet", "station": "SK0001A", "attribute": "o3"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0001A_00008_500.parquet", "station": "SK0001A", "attribute": "no2"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0001A_06001_100.parquet", "station": "SK0001A", "attribute": "pm25"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0002A_00005_100.parquet", "station": "SK0002A", "attribute": "pm10"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0002A_00008_500.parquet", "station": "SK0002A", "attribute": "no2"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0002R_00007_100.parquet", "station": "SK0002R", "attribute": "o3"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0002R_00008_100.parquet", "station": "SK0002R", "attribute": "no2"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0004R_00007_100.parquet", "station": "SK0004R", "attribute": "o3"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0006R_00007_100.parquet", "station": "SK0006R", "attribute": "o3"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0006R_00008_100.parquet", "station": "SK0006R", "attribute": "no2"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0007R_00005_100.parquet", "station": "SK0007R", "attribute": "pm10"}, {"url": "https://eeadmz1batchservice02.blob.core.windows.net/airquality-p/SK/SPO-SK0008A_00007_100.parquet", "station": "SK0008A", "attribute": "o3"}, {"u