apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: podujatia-read
  namespace: slovensko
  title: { sk: 'Verejné čítanie: podujatia na Slovensku', en: 'Public read: events in Slovakia' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: slovensko-podujatia }
  assigner: did:web:joinedcontext.com
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint slovensko-podujatia, events and their venues (DM-141);
  # no entity write for anyone but the pipelines, which write through slovensko-podujatia-zapis (T-5047).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: Event
        - type: PointOfInterest
