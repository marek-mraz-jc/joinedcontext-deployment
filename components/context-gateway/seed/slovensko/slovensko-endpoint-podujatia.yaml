# Every event of slovensko-podujatia (T-5047): the national events dataset, read by anyone; the pipelines write
# through slovensko-podujatia-zapis.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: slovensko-podujatia
  namespace: slovensko
  title: { sk: "Podujatia na Slovensku", en: "Events in Slovakia" }
  description:
    sk: "Nadchádzajúce podujatia miest, obcí, krajov a inštitúcií na Slovensku s časom a miestom konania, aj ako kalendár na odber."
    en: "Upcoming events of the towns, municipalities, regions and bodies of Slovakia with their time and place, also as a calendar to subscribe to."
spec:
  contextSpaceRef: slovensko-podujatia
  slug: c64i77g2akwuakkouvndhkfg6ujqyfqd
  audience: public
  policyRef: urn:ngsi-ld:Policy:joinedcontext.com:slovensko-podujatia:podujatia-read
  # ical: the calendar a person subscribes to, /api/endpoint/{slug}/ical/v1/events.ics (EP-125).
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp, ical]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: slovensko }
      license: cc-by
      datastore: { representation: csv, refresh: onReconcile }
  catalog:
    publisher: { name: { sk: "Platforma joinedcontext", en: "The joinedcontext platform" }, uri: "https://dev.joinedcontext.com/" }
    # Public events of public bodies: a record names an event and its place, never a person.
    personalData: does-not-contain
    license: CC_BY_4_0
    attribution: { sk: "Zdroj: webové stránky miest, obcí a inštitúcií, ktoré podujatie zverejnili (atribút source)", en: "Source: the web sites of the towns, municipalities and bodies that announced each event (attribute source)" }
    themes: [EDUC, SOCI]
    keywords:
      sk: ["podujatia", "kultúra", "kalendár"]
      en: ["events", "culture", "calendar"]
    spatial:
      - "SK"
    # Every source is read every 3 hours (T-5047); the frequency table has nothing between HOURLY and DAILY.
    frequency: DAILY
