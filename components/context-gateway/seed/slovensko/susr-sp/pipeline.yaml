ce": "https://data.statistics.sk/api/v2/dataset/sp1834ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "sp1834ms_unit", "update": "2026-08-27"}, "sp1836ms": {"area": null, "indicator": null, "keys": ["sp1836ms_month", "sp1836ms_specu", "sp1836ms_nace2"], "period": "sp1836ms_year", "source": "https://data.statistics.sk/api/v2/dataset/sp1836ms/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-27"}, "sp1837ms": {"area": null, "indicator": "sp1837ms_indic", "keys": ["sp1837ms_month", "sp1837ms_specu", "sp1837ms_cpa"], "period": "sp1837ms_year", "source": "https://data.statistics.sk/api/v2/dataset/sp1837ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "sp1837ms_unit", "update": "2026-08-26"}, "sp1838ms": {"area": null, "indicator": "sp1838ms_indic", "keys": ["sp1838ms_month", "sp1838ms_specu", "sp1838ms_cpa"], "period": "sp1838ms_year", "source": "https://data.statistics.sk/api/v2/dataset/sp1838ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "sp1838ms_unit", "update": "2026-08-26"}, "sp2037rs": {"area": null, "indicator": null, "keys": ["sp2037rs_ukaz", "sp2037rs_mj"], "period": "sp2037rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/sp2037rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-01-19"}, "sp2038ms": {"area": null, "indicator": null, "keys": ["sp2038ms_mes", "sp2038ms_ukaz1", "sp2038ms_mj"], "period": "sp2038ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/sp2038ms/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-01-19"}, "sp2043rs": {"area": null, "indicator": "sp2043rs_ukaz", "keys": ["sp2043rs_mj"], "period": "sp2043rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/sp2043rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-01-15"}, "sp2046ms": {"area": null, "indicator": null, "keys": ["sp2046ms_mes", "sp2046ms_ukaz1", "sp2046ms_mj"], "period": "sp2046ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/sp2046ms/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-01-19"}, "sp3801qr": {"area": "nuts13", "indicator": null, "keys": ["sp3801qr_nakneh", "sp3801qr_stv"], "period": "sp3801qr_rok", "source": "https://data.statistics.sk/api/v2/dataset/sp3801qr/all/all/all/all/all?lang=sk&type=json", "unit": "sp3801qr_mj", "update": "2026-08-31"}}
