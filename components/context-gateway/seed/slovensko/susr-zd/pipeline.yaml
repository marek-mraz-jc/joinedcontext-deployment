# Generated by scripts/open-data/datacube.py (T-4390); do not edit by hand.
# Every cube of theme `zd`, whole, into susr-zd: one KeyPerformanceIndicator per published cell,
# as ŠÚ SR published it; nothing is renamed or recomputed. A daily read keeps every table within
# a day of its release.
apiVersion: joinedcontext.com/v1alpha2
kind: Pipeline
metadata:
  name: susr-zd
  namespace: slovensko
  title: { sk: "ŠÚ SR: Zdravotníctvo", en: "ŠÚ SR: Health" }
spec:
  class: auto
  period: 24h
  schedule: "54 3 * * *"
  sources:
    - dataSourceRef: { kind: DataSource, name: susr-zd1001rs }
    - dataSourceRef: { kind: DataSource, name: susr-zd1002rs }
    - dataSourceRef: { kind: DataSource, name: susr-zd1004rs }
    - dataSourceRef: { kind: DataSource, name: susr-zd1006rs }
    - dataSourceRef: { kind: DataSource, name: susr-zd1007rs }
    - dataSourceRef: { kind: DataSource, name: susr-zd1008rs }
    - dataSourceRef: { kind: DataSource, name: susr-zd1009rs }
    - dataSourceRef: { kind: DataSource, name: susr-zd1010rs }
    - dataSourceRef: { kind: DataSource, name: susr-zd1824rs }
    - dataSourceRef: { kind: DataSource, name: susr-zd3004rr }
    - dataSourceRef: { kind: DataSource, name: susr-zd3005rr }
  steps:
    - kind: bloblang
      bloblang: |
        # The cubes of this theme and the role of their dimensions, read from DATAcube's collection.
        let cubes = {"zd1001rs": {"area": null, "indicator": "zd1001rs_ukaz", "keys": [], "period": "zd1001rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zd1001rs/all/all/all?lang=sk&type=json", "unit": "zd1001rs_mj", "update": "2026-06-30"}, "zd1002rs": {"area": null, "indicator": "zd1002rs_ukaz", "keys": [], "period": "zd1002rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zd1002rs/all/all?lang=sk&type=json", "unit": null, "update": "2026-06-30"}, "zd1004rs": {"area": null, "indicator": "zd1004rs_ukaz", "keys": ["zd1004rs_zari"], "period": "zd1004rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zd1004rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "zd1006rs": {"area": null, "indicator": "zd1006rs_ukaz", "keys": ["zd1006rs_uraz"], "period": "zd1006rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zd1006rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-06-30"}, "zd1007rs": {"area": null, "indicator": "zd1007rs_ukaz", "keys": [], "period": "zd1007rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zd1007rs/all/all?lang=sk&type=json", "unit": null, "update": "2026-06-30"}, "zd1008rs": {"area": null, "indicator": "zd1008rs_ukaz", "keys": ["zd1008rs_fisy"], "period": "zd1008rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zd1008rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-31"}, "zd1009rs": {"area": null, "indicator": "zd1009rs_ukaz", "keys": ["zd1009rs_star"], "period": "zd1009rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zd1009rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-31"}, "zd1010rs": {"area": null, "indicator": null, "keys": ["zd1010rs_fisy", "zd1010rs_star"], "period": "zd1010rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zd1010rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-31"}, "zd1824rs": {"area": null, "indicator": null, "keys": ["zd1824rs_ukaz"], "period": "zd1824rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zd1824rs/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-31"}, "zd3004rr": {"area": "nuts13", "indicator": "zd3004rr_ukaz", "keys": ["zd3004rr_dim1"], "period": "zd3004rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/zd3004rr/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-12-19"}, "zd3005rr": {"area": "nuts13", "indicator": "zd3005rr_ukaz", "keys": ["zd3005rr_dim"], "period": "zd3005rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/zd3005rr/all/all/all/all/all?lang=sk&type=json", "unit": "zd3005rr_mj", "update": "2026-02-27"}}
        # The cube a message is, from the address the answer names itself by.
        let cube = this.href.or("").re_find_object("/(?P<code>[a-z]{2}[0-9]{4}[a-z]{2})/").code.catch(null)
        let roles = $cubes.get($cube.or("")).catch(null)
        root = if $roles == null { throw("no cube of this theme answered: %v".format(this.href.or("no href"))) } else if this.value.or([]).length() == 0 { throw("cube %v answered no cell".format($cube)) } else { this }
        let ds = this
        let ids = this.id
        let sizes = this.size
        let n = $sizes.length()
        # JSON-stat 2.0 is decoded by the index and never by the order: the period comes newest first.
        let codes = $ids.map_each(d -> $ds.dimension.get(d).category.index.key_values().sort_by(kv -> kv.value).map_each(kv -> kv.key))
        let labels = $ids.map_each(d -> $ds.dimension.get(d).category.label.or({}))
        let strides = range(0, $n, 1).map_each(k -> if k + 1 >= $n { 1 } else { $sizes.slice(k + 1, $n).fold(1, t -> t.tally * t.value) })
        let at_index = range(0, $n, 1).map_each(k -> { $ids.index(k): k }).squash()
        # A dimension DATAcube adds to the answer only (`*_data`, one value) names nothing.
        let named = [$roles.period, $roles.area, $roles.indicator, $roles.unit].concat($roles.keys)
        let keys = $roles.keys.concat($ids.filter(d -> !$named.contains(d) && $sizes.index($at_index.get(d)) > 1))
        let updated = ($ds.update.or($roles.update)).ts_parse("2006-01-02").ts_format("2006-01-02T15:04:05Z07:00", "UTC").catch(null)
        let cells = if $ds.value.type() == "object" { $ds.value.key_values().map_each(kv -> { "p": kv.key.number().int64(), "v": kv.value }) } else { range(0, $ds.value.length(), 1).map_each(p -> { "p": p, "v": $ds.value.index(p) }) }
        # One entity per cell that carries a number; a cell the publisher left empty is not a zero.
        root = $cells.filter(c -> c.v != null && c.v.type() == "number").map_each(c -> range(0, $n, 1).map_each(k -> { $ids.index(k): $codes.index(k).index(((c.p / $strides.index(k)).floor().int64()) % $sizes.index(k)) }).squash().merge({ "_v": c.v })).map_each(at -> {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), [$cube, if $roles.area == null { "SK0" } else { at.get($roles.area) }, at.get($roles.period), if $roles.indicator == null { $cube } else { at.get($roles.indicator) }].concat($keys.map_each(d -> at.get(d))).concat(if $roles.unit == null { [] } else { [at.get($roles.unit)] }).join("-").re_replace_all("[^A-Za-z0-9._~-]", "_")),
          "type": "KeyPerformanceIndicator",
          "dataSet": { "type": "Property", "value": $cube },
          "indicator": { "type": "Property", "value": if $roles.indicator == null { $cube } else { at.get($roles.indicator) } },
          "refArea": { "type": "Property", "value": if $roles.area == null { "SK0" } else { at.get($roles.area) } },
          "refPeriod": { "type": "Property", "value": at.get($roles.period) },
          "dimensionKey": if $keys.length() == 0 { null } else { { "type": "Property", "value": $keys.map_each(d -> at.get(d)).join("-") } },
          "kpiValue": { "type": "Property", "value": at._v, "observedAt": $updated }.filter(e -> e.value != null),
          "unitText": if $roles.unit == null { null } else { { "type": "Property", "value": $labels.index($at_index.get($roles.unit)).get(at.get($roles.unit)).or(at.get($roles.unit)) } },
          "source": { "type": "Property", "value": $roles.source },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/susr-%v".format($cube) },
          "dateObserved": if $updated == null { null } else { { "type": "Property", "value": $updated } }
        }.filter(e -> e.value != null))
  outputs:
    - targetEndpoint: urn:ngsi-ld:Endpoint:joinedcontext.com:susr-zd:susr-zd
      type: KeyPerformanceIndicator
      mode: upsert
  quotas:
    maxMemoryMb: 192
    cpuMillicores: 100
