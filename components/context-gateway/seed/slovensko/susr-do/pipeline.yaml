1009rs_prep", "do1009rs_dopr"], "period": "do1009rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/do1009rs/all/all/all/all/all?lang=sk&type=json", "unit": "do1009rs_mj", "update": "2025-10-31"}, "do1010rs": {"area": null, "indicator": "do1010rs_ukaz", "keys": ["do1010rs_dopr"], "period": "do1010rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/do1010rs/all/all/all/all?lang=sk&type=json", "unit": "do1010rs_mj", "update": "2025-10-31"}, "do1011rs": {"area": null, "indicator": null, "keys": ["do1011rs_ukaz", "do1011rs_dopr"], "period": "do1011rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/do1011rs/all/all/all/all?lang=sk&type=json", "unit": "do1011rs_mj", "update": "2025-10-31"}, "do1012rs": {"area": null, "indicator": "do1012rs_ukaz", "keys": ["do1012rs_dopr"], "period": "do1012rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/do1012rs/all/all/all/all?lang=sk&type=json", "unit": "do1012rs_mj", "update": "2025-10-31"}, "do2007ms": {"area": null, "indicator": null, "keys": ["do2007ms_mes", "do2007ms_ukaz"], "period": "do2007ms_rok", "source": "https://data.statistics.sk/api/v2/dataset/do2007ms/all/all/all/all?lang=sk&type=json", "unit": "do2007ms_mj", "update": "2026-09-14"}, "do3701rr": {"area": "do3701rr_uzemieua", "indicator": "do3701rr_dop", "keys": [], "period": "do3701rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/do3701rr/all/all/all/all?lang=sk&type=json", "unit": "do3701rr_mj", "update": "2025-10-01"}, "do3801rr": {"area": "nuts13", "indicator": "do3801rr_ukaz", "keys": [], "period": "do3801rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/do3801rr/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-31"}, "do3802rr": {"area": "nuts13", "indicator": null, "keys": ["do3802rr_dim1"], "period": "do3802rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/do3802rr/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-31"}, "do3803rr": {"area": "nuts13", "indicator": null, "keys": ["do3803rr_dim1"], "period": "do3803rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/do3803rr/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-31"}, "do3804rr": {"area": "nuts13", "indicator": "do3804rr_ukaz", "keys": [], "period": "do3804rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/do3804rr/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-31"}, "do3805rr": {"area": "nuts13", "indicator": "do3805rr_ukaz", "keys": [], "period": "do3805rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/do3805rr/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-31"}, "do3806rr": {"area": "nuts13", "indicator": "do3806rr_ukaz", "keys": [], "period": "do3806rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/do3806rr/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-31"}}
        # The cube a message is, from the address the answer names itself by.
