ek"], "period": "kz1011rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kz1011rs/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-04-30"}, "kz1013rs": {"area": null, "indicator": "kz1013rs_ukaz", "keys": ["kz1013rs_typd"], "period": "kz1013rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kz1013rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-05-29"}, "kz1014rs": {"area": null, "indicator": "kz1014rs_ukaz", "keys": ["kz1014rs_typd"], "period": "kz1014rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kz1014rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-05-29"}, "kz1016rs": {"area": null, "indicator": "kz1016rs_ukaz", "keys": ["kz1016rs_pohl"], "period": "kz1016rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kz1016rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-05-29"}, "kz1018rs": {"area": null, "indicator": null, "keys": ["kz1018rs_pohl", "kz1018rs_vek"], "period": "kz1018rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kz1018rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-05-29"}, "kz1019rs": {"area": null, "indicator": null, "keys": ["kz1019rs_pohl", "kz1019rs_vek"], "period": "kz1019rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kz1019rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-05-29"}, "kz1020rs": {"area": null, "indicator": null, "keys": ["kz1020rs_vzd", "kz1020rs_pohl", "kz1020rs_vek"], "period": "kz1020rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kz1020rs/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-05-29"}, "kz1028rs": {"area": null, "indicator": "kz1028rs_ukaz", "keys": [], "period": "kz1028rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kz1028rs/all/all?lang=sk&type=json", "unit": null, "update": "2026-05-29"}, "kz1030rs": {"area": null, "indicator": null, "keys": ["kz1030rs_vzd", "kz1030rs_pohl"], "period": "kz1030rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kz1030rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-05-29"}, "kz1031rs": {"area": null, "indicator": "kz1031rs_ukaz", "keys": ["kz1031rs_pohl"], "period": "kz1031rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kz1031rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-05-30"}, "kz1037rs": {"area": null, "indicator": "kz1037rs_ukaz", "keys": [], "period": "kz1037rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/kz1037rs/all/all?lang=sk&type=json", "unit": null, "update": "2026-05-29"}}
        # The cube a message is, from the address the answer names itself by.
        let cube = this.href.or("").re_find_object("/(?P<code>[a-z]{2}[0-9]{4}[a-z]{2})/").code.catch(null)
        let roles = $cubes.get($cube.or("")).catch(null)
        root = if $roles == null { throw("no cube of this theme answered: %v".format(this.href.or("no href"))) } else if this.value.or([]).length() == 0 { throw("cube %v answered no cell".format($cube)) } else { this }
