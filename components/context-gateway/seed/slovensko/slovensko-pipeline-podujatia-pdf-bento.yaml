# Generated by seeds/bbsk-events/generate.py from the inventory row Banská Bystrica (umb-cms),
# read 2026-10-21: https://www.pdf.umb.sk/kalendar-udalosti/ (T-4896). Do not edit: change the template or the CSV.
pipeline:
  processors:
  - mapping: |
      let paths = content().string().re_find_all_object("<h3 class=\"title\"><a href=\"(?:https://www\\.pdf\\.umb\\.sk)?(?P<p>/kalendar\\-udalosti/[A-Za-z0-9._~%/-]{1,300}\\.html)\"").map_each(m -> m.p).unique()
      root = $paths.slice(0, [$paths.length(), 50].min()).map_each(p -> { "url": "https://www.pdf.umb.sk" + p, "path": p, "sourceId": p })
  - unarchive:
      format: json_array
  - branch:
      request_map: |
        root = if this.path.contains("..") { deleted() } else { "" }
        meta event_path = this.path.trim_prefix("/")
      processors:
      - sleep:
          duration: 1s
      - http:
          url: https://www.pdf.umb.sk/${! @event_path }
          verb: GET
          headers:
            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
            Accept: text/html
          timeout: 20s
          retries: 1
      result_map: |
        # "3. 11. 2026, 8:30" is Bratislava's wall time; "3. 11. 2026" alone a whole day.
        map at {
          let m = this.or("").re_find_object("^(?P<d>[0-9]{1,2})\\. ?(?P<m>[0-9]{1,2})\\. ?(?P<y>[0-9]{4})(?:,? *(?P<h>[0-9]{1,2}):(?P<i>[0-9]{2}))?")
          let day = if $m.y.or("") == "" { null } else { "%s-%02d-%02d".format($m.y, $m.m.number().int64(), $m.d.number().int64()) }
          let local = if $day != null && $m.h.or("") != "" { "%sT%02d:%s:00".format($day, $m.h.number().int64(), $m.i) } else { null }
          root = if $local != null { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") } else { $day }
        }
        let page = content().string()
        let table = $page.re_find_object("<table class=\"eventTable\">(?P<t>[\\s\\S]*?)</table>").t.or("")
        let rows = $table.re_find_all_object("<td><strong>(?P<k>[^<]{1,120})</strong></td><td>(?P<v>[\\s\\S]*?)</td></tr>").fold({}, acc -> acc.tally.merge({ (acc.value.k.unescape_html().re_replace_all("[\\s:]+$", "").re_replace_all("\\s*\\(.*$", "").trim()): acc.value.v.strip_html().unescape_html().re_replace_all("\\s+", " ").trim() }))
        root.name = $page.re_find_object("<h1 class=\"title_big[^\"]*\">(?P<v>[^<]{1,500})</h1>").v.or(null).(v -> if v != null { v.unescape_html() } else { null })
        root.start = $rows."Začiatok".or(null).apply("at")
        root.end = $rows.Koniec.or(null).apply("at")
        root.venue = $rows.Miesto.or(null)
        root.locality = $rows.Mesto.or(null)
        root.category = $rows."Kategória".or(null)
        # "Iné" (other) is the CMS's placeholder, no organizer: the calendar's own body stands in (T-5081).
        root.organizer = $rows."Usporiadateľ".or(null).(o -> if o != null && o != "" && o != "Iné" { { "name": o } } else { null })
