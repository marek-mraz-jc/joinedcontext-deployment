      bloblang: |
        # The cubes of this theme and the role of their dimensions, read from DATAcube's collection.
        let cubes = {"cr1004rs": {"area": null, "indicator": "cr1004rs_indic", "keys": ["cr1004rs_specu", "cr1004rs_refarea"], "period": "cr1004rs_year", "source": "https://data.statistics.sk/api/v2/dataset/cr1004rs/all/all/all/all/all?lang=sk&type=json", "unit": "cr1004rs_unit", "update": "2026-02-11"}, "cr1801rs": {"area": null, "indicator": "cr1801rs_ukazcr", "keys": ["cr1801rs_uncr"], "period": "cr1801rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1801rs/all/all/all/all?lang=sk&type=json", "unit": "cr1801rs_mj", "update": "2026-06-23"}, "cr1802rs": {"area": null, "indicator": "cr1802rs_ukazcr", "keys": ["cr1802rs_uncr"], "period": "cr1802rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1802rs/all/all/all/all?lang=sk&type=json", "unit": "cr1802rs_mj", "update": "2026-06-23"}, "cr1803rs": {"area": null, "indicator": null, "keys": ["cr1803rs_ucelc", "cr1803rs_cestr", "cr1803rs_cesuz"], "period": "cr1803rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1803rs/all/all/all/all/all?lang=sk&type=json", "unit": "cr1803rs_mj", "update": "2026-06-25"}, "cr1804rs": {"area": null, "indicator": null, "keys": ["cr1804rs_ucelc", "cr1804rs_cestr", "cr1804rs_cesuz"], "period": "cr1804rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1804rs/all/all/all/all/all?lang=sk&type=json", "unit": "cr1804rs_mj", "update": "2026-06-25"}, "cr1805rs": {"area": null, "indicator": null, "keys": ["cr1805rs_ucelc", "cr1805rs_cestr", "cr1805rs_cesuz"], "period": "cr1805rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1805rs/all/all/all/all/all?lang=sk&type=json", "unit": "cr1805rs_mj", "update": "2026-06-25"}, "cr1806rs": {"area": null, "indicator": null, "keys": ["cr1806rs_ucelc", "cr1806rs_cestr", "cr1806rs_cesuz"], "period": "cr1806rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1806rs/all/all/all/all/all?lang=sk&type=json", "unit": "cr1806rs_mj", "update": "2026-06-25"}, "cr1807rs": {"area": null, "indicator": null, "keys": ["cr1807rs_pobdl", "cr1807rs_cesuz"], "period": "cr1807rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1807rs/all/all/all/all?lang=sk&type=json", "unit": "cr1807rs_mj", "update": "2026-06-25"}, "cr1808rs": {"area": null, "indicator": null, "keys": ["cr1808rs_vekskup", "cr1808rs_cesuz"], "period": "cr1808rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1808rs/all/all/all/all?lang=sk&type=json", "unit": "cr1808rs_mj", "update": "2026-06-25"}, "cr1809rs": {"area": null, "indicator": null, "keys": ["cr1809rs_ucelc", "cr1809rs_cesuz"], "period": "cr1809rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1809rs/all/all/all/all?lang=sk&type=json", "unit": "cr1809rs_mj", "update": "2026-06-25"}, "cr1810rs": {"area": null, "indicator": null, "keys": ["cr1810rs_ciel", "cr1810rs_cesuz"], "period": "cr1810rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1810rs/all/all/all/all?lang=sk&type=json", "unit": "cr1810rs_mj", "update": "2026-06-25"}, "cr1811rs": {"area": null, "indicator": null, "keys": ["cr1811rs_ubyttyp", "cr1811rs_ubytpren", "cr1811rs_cesuz"], "period": "cr1811rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1811rs/all/all/all/all/all?lang=sk&type=json", "unit": "cr1811rs_mj", "update": "2026-06-25"}, "cr1812rs": {"area": null, "indicator": null, "keys": ["cr1812rs_dopt", "cr1812rs_cesuz"], "period": "cr1812rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1812rs/all/all/all/all?lang=sk&type=json", "unit": "cr1812rs_mj", "update": "2026-06-25"}, "cr1813rs": {"area": null, "indicator": "cr1813rs_ukazcr", "keys": ["cr1813rs_stat"], "period": "cr1813rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr1813rs/all/all/all/all?lang=sk&type=json", "unit": "cr1813rs_mj", "update": "2026-06-25"}, "cr2001rs": {"area": null, "indicator": "cr2001rs_ukaz", "keys": [], "period": "cr2001rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr2001rs/all/all?lang=sk&type=json", "unit": null, "update": "2026-02-11"}, "cr2002rs": {"area": null, "indicator": "cr2002rs_ukaz1", "keys": ["cr2002rs_ukaz", "cr2002rs_ukaz2"], "period": "cr2002rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr2002rs/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-25"}, "cr3801mr": {"area": "nuts13", "indicator": "cr3801mr_ukaz", "keys": ["cr3801mr_mes", "cr3801mr_dim1"], "period": "cr3801mr_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr3801mr/all/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-09-11"}, "cr3805rs": {"area": "cr3805rs_nuts", "indicator": "cr3805rs_ukazcr", "keys": [], "period": "cr3805rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr3805rs/all/all/all/all?lang=sk&type=json", "unit": "cr3805rs_mj", "update": "2026-06-25"}, "cr3806qr": {"area": "nuts13", "indicator": "cr3806qr_ukaz", "keys": ["cr3806qr_stv", "cr3806qr_dim1"], "period": "cr3806qr_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr3806qr/all/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-18"}, "cr3807qr": {"area": "nuts14", "indicator": "cr3807qr_ukaz", "keys": ["cr3807qr_stv"], "period": "cr3807qr_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr3807qr/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-18"}, "cr3808qr": {"area": "nuts14", "indicator": "cr3808qr_ukaz", "keys": ["cr3808qr_stv"], "period": "cr3808qr_rok", "source": "https://data.statistics.sk/api/v2/dataset/cr3808qr/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-08-18"}}
        # The cube a message is, from the address the answer names itself by.
        let cube = this.href.or("").re_find_object("/(?P<code>[a-z]{2}[0-9]{4}[a-z]{2})/").code.catch(null)
        let roles = $cubes.get($cube.or("")).catch(null)
        root = if $roles == null { throw("no cube of this theme answered: %v".format(this.href.or("no href"))) } else if this.value.or([]).length() == 0 { throw("cube %v answered no cell".format($cube)) } else { this }
        let ds = this
        let ids = this.id
        let sizes = this.size
        let n = $sizes.length()
        # JSON-stat 2.0 is decoded by the index and never by the order: the period comes newest first.
        let codes = $ids.map_each(d -> $ds.dimension.get(d).category.index.key_values().sort_by(kv -> kv.value).map_each(kv -> kv.key))
        let labels = $ids.map_each(d -> $ds.dimension.get(d).category.label.or({}))
        let strides = range(0, $n, 1).map_each(k -> if k + 1 >= $n { 1 } else { $sizes.slice(k + 1, $n).fold(1, t -> t.tally * t.value) })
        let at_index = range(0, $n, 1).map_each(k -> { $ids.index(k): k }).squash()
        # A dimension DATAcube adds to the answer only (`*_data`, one value) names nothing.
        let named = [$roles.period, $roles.area, $roles.indicator, $roles.unit].concat($roles.keys)
        let keys = $roles.keys.concat($ids.filter(d -> !$named.contains(d) && $sizes.index($at_index.get(d)) > 1))
        let updated = ($ds.update.or($roles.update)).ts_parse("2006-01-02").ts_format("2006-01-02T15:04:05Z07:00", "UTC").catch(null)
        let cells = if $ds.value.type() == "object" { $ds.value.key_values().map_each(kv -> { "p": kv.key.number().int64(), "v": kv.value }) } else { range(0, $ds.value.length(), 1).map_each(p -> { "p": p, "v": $ds.value.index(p) }) }
        # One entity per cell that carries a number; a cell the publisher left empty is not a zero.
        root = $cells.filter(c -> c.v != null && c.v.type() == "number").map_each(c -> range(0, $n, 1).map_each(k -> { $ids.index(k): $codes.index(k).index(((c.p / $strides.index(k)).floor().int64()) % $sizes.index(k)) }).squash().merge({ "_v": c.v })).map_each(at -> {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), [$cube, if $roles.area == null { "SK0" } else { at.get($roles.area) }, at.get($roles.period), if $roles.indicator == null { $cube } else { at.get($roles.indicator) }].concat($keys.map_each(d -> at.get(d))).concat(if $roles.unit == null { [] } else { [at.get($roles.unit)] }).join("-").re_replace_all("[^A-Za-z0-9._~-]", "_")),
          "type": "KeyPerformanceIndicator",
          "dataSet": { "type": "Property", "value": $cube },
          "indicator": { "type": "Property", "value": if $roles.indicator == null { $cube } else { at.get($roles.indicator) } },
          "refArea": { "type": "Property", "value": if $roles.area == null { "SK0" } else { at.get($roles.area) } },
          "refPeriod": { "type": "Property", "value": at.get($roles.period) },
          "dimensionKey": if $keys.length() == 0 { null } else { { "type": "Property", "value": $keys.map_each(d -> at.get(d)).join("-") } },
          "kpiValue": { "type": "Property", "value": at._v, "observedAt": $updated }.filter(e -> e.value != null),
          "unitText": if $roles.unit == null { null } else { { "type": "Property", "value": $labels.index($at_index.get($roles.unit)).get(at.get($roles.unit)).or(at.get($roles.unit)) } },
          "source": { "type": "Property", "value": $roles.source },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/susr-%v".format($cube) },
          "dateObserved": if $updated == null { null } else { { "type": "Property", "value": $updated } }
        }.filter(e -> e.value != null))
  outputs:
    - targetEndpoint: urn:ngsi-ld:Endpoint:joinedcontext.com:susr-cr:susr-cr
      type: KeyPerformanceIndicator
      mode: upsert
