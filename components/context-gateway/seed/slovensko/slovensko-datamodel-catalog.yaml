# The one model of the catalogue space (DM-61): the three types the Portal reconciler writes, SDM
# DCAT-AP Dataset, DataService and Organization (T-4500, T-4746). It narrows the space's writes to
# them; their attributes are the reconciler's, from the gateway's DCAT-AP feed and CKAN, so the
# model stays a draft that names no slot.
apiVersion: joinedcontext.com/v1alpha1
kind: DataModel
metadata:
  name: catalog
  namespace: slovensko
  title: { sk: "Katalóg otvorených dát", en: "Open data catalogue" }
spec:
  contextSpaceRef: catalog
  linkml: ./catalog.linkml.yaml
  version: 0.1.0
  lifecycle: draft
  classes: [Dataset, DataService, Organization]
