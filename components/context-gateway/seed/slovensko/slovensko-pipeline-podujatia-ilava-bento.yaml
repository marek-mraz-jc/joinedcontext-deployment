# Generated by seeds/bbsk-events/generate.py from the inventory row Ilava (lego-html),
# read 2026-10-21: https://www.ilava.sk/mesto/kalendar-podujati/ (T-4896). Do not edit: change the template or the CSV.
pipeline:
  processors:
  - mapping: |
      let paths = content().string().re_find_all_object("href=\"(?:https?://www\\.ilava\\.sk)?(?P<p>/mesto/kalendar\\-podujati/[A-Za-z0-9._~%/-]{1,300}-[0-9]{1,9}(?:_[0-9]{1,9})?[a-z]{2}\\.html)\"").map_each(m -> m.p).unique()
      root = $paths.map_each(p -> { "url": "https://www.ilava.sk" + p, "path": p, "sourceId": p })
  - unarchive:
      format: json_array
  - branch:
      request_map: |
        root = if this.path.contains("..") { deleted() } else { "" }
        meta event_path = this.path.trim_prefix("/")
      processors:
      - sleep:
          duration: 3s
      - http:
          url: https://www.ilava.sk/${! @event_path }
          verb: GET
          headers:
            User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
            Accept: text/html
          timeout: 20s
          retries: 1
      result_map: |
        # 20261018T150000 is Bratislava's wall time; 20261018 alone a whole day.
        map at {
          let m = this.or("").re_find_object("^(?P<d>[0-9]{8})(T(?P<t>[0-9]{4}))?")
          let day = if $m.d.or(null) == null { null } else { "%s-%s-%s".format($m.d.slice(0, 4), $m.d.slice(4, 6), $m.d.slice(6, 8)) }
          let local = if $day != null && $m.t.or("") != "" { "%sT%s:%s:00".format($day, $m.t.slice(0, 2), $m.t.slice(2, 4)) } else { null }
          root = if $local != null { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") } else { $day }
        }
        let page = content().string()
        let when = $page.re_find_object("data-date-start=\"(?P<s>[0-9T]*)\" data-date-end=\"(?P<e>[0-9T]*)\"")
        root.name = $page.re_find_object("<h1[^>]*>(?P<v>[^<]{1,500})</h1>").v.or(null)
        root.start = $when.s.or(null).apply("at")
        root.end = $when.e.or(null).apply("at")
        root.venue = $page.re_find_object("class=\"venue\">(?:<i[^>]*></i>)?(?:<span[^>]*>[^<]*</span>)?(?P<v>[^<]{1,300})</h2>").v.or(null)
        root.category = $page.re_find_object("Typ akcie:(?P<v>[^<]{1,200})<").v.or(null)
        root.description = $page.re_find_object("<p id=\"action-detail\">(?P<v>[\\s\\S]*?)</p>").v.or(null)
  - archive:
      format: json_array
  - mutation: |
      meta events = {"category_cache": {}, "category_default": null, "facts_only": true, "grace": 86400, "home": {"poi":"osm-way-58500587","match":"obecný úrad ilava","town":"ilava","venue":"Mestský úrad","streetAddress":"Mierové námestie 16/31","addressLocality":"Ilava","lat":48.9995242,"lon":18.2361525,"checked_by":"overpass"}, "lease": 187200, "listing": "https://www.ilava.sk/mesto/kalendar-podujati/", "organizer": {"name": "Obec Ilava", "url": "https://www.ilava.sk"}, "provider": "Ilava, ilava.sk (licencia neuvedená)", "region": "Trenčiansky kraj", "scope": "/SK/TN", "self": ["celá obec", "ilava", "ilava - celá obec", "mesto", "mesto ilava", "mestský úrad", "mestský úrad ilava", "obec", "obec ilava", "obecný úrad", "obecný úrad ilava", "v obci"], "source": "https://www.ilava.sk/mesto/kalendar-podujati/", "space": env("JC_SPACE"), "town": "Ilava", "town_scope": "/SK/TN/ilava", "towns": [["Ilava","ilava",48.99952,18.23615,"office"]], "venues": [{"poi":"osm-way-58500587","match":"obecný úrad ilava","town":"ilava","venue":"Mestský úrad","streetAddress":"Mierové námestie 16/31","addressLocality":"Ilava","lat":48.9995242,"lon":18.2361525,"checked_by":"overpass"}]}
  - resource: events_tail
