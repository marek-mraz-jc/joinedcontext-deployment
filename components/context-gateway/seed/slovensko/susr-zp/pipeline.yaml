# Generated by scripts/open-data/datacube.py (T-4390); do not edit by hand.
# Every cube of theme `zp`, whole, into susr-zp: one KeyPerformanceIndicator per published cell,
# as ŠÚ SR published it; nothing is renamed or recomputed. A daily read keeps every table within
# a day of its release.
apiVersion: joinedcontext.com/v1alpha2
kind: Pipeline
metadata:
  name: susr-zp
  namespace: slovensko
  title: { sk: "ŠÚ SR: Životné prostredie", en: "ŠÚ SR: Environment" }
spec:
  class: auto
  period: 24h
  schedule: "58 3 * * *"
  sources:
    - dataSourceRef: { kind: DataSource, name: susr-zp1001rs }
    - dataSourceRef: { kind: DataSource, name: susr-zp1002rs }
    - dataSourceRef: { kind: DataSource, name: susr-zp1003rs }
    - dataSourceRef: { kind: DataSource, name: susr-zp1004rs }
    - dataSourceRef: { kind: DataSource, name: susr-zp1005rs }
    - dataSourceRef: { kind: DataSource, name: susr-zp1006rs }
    - dataSourceRef: { kind: DataSource, name: susr-zp1007rs }
    - dataSourceRef: { kind: DataSource, name: susr-zp1009rs }
    - dataSourceRef: { kind: DataSource, name: susr-zp2001rs }
    - dataSourceRef: { kind: DataSource, name: susr-zp3001rr }
    - dataSourceRef: { kind: DataSource, name: susr-zp3701rr }
    - dataSourceRef: { kind: DataSource, name: susr-zp3803rs }
  steps:
    - kind: bloblang
      bloblang: |
        # The cubes of this theme and the role of their dimensions, read from DATAcube's collection.
        let cubes = {"zp1001rs": {"area": null, "indicator": null, "keys": ["zp1001rs_ukaz", "zp1001rs_zivo"], "period": "zp1001rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp1001rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-12-19"}, "zp1002rs": {"area": null, "indicator": "zp1002rs_ukaz", "keys": ["zp1002rs_nace"], "period": "zp1002rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp1002rs/all/all/all/all?lang=sk&type=json", "unit": "zp1002rs_mj", "update": "2025-10-31"}, "zp1003rs": {"area": null, "indicator": "zp1003rs_ukaz", "keys": [], "period": "zp1003rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp1003rs/all/all?lang=sk&type=json", "unit": null, "update": "2025-12-19"}, "zp1004rs": {"area": null, "indicator": "zp1004rs_ukaz", "keys": ["zp1004rs_obch"], "period": "zp1004rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp1004rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-12-19"}, "zp1005rs": {"area": "zp1005rs_kraj", "indicator": "zp1005rs_ukaz", "keys": [], "period": "zp1005rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp1005rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-15"}, "zp1006rs": {"area": null, "indicator": "zp1006rs_ukaz", "keys": ["zp1006rs_nakl", "zp1006rs_poob"], "period": "zp1006rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp1006rs/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-09-30"}, "zp1007rs": {"area": null, "indicator": "zp1007rs_ukaz", "keys": ["zp1007rs_kody"], "period": "zp1007rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp1007rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-31"}, "zp1009rs": {"area": null, "indicator": null, "keys": ["zp1009rs_odv"], "period": "zp1009rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp1009rs/all/all/all?lang=sk&type=json", "unit": "zp1009rs_mj", "update": "2025-11-28"}, "zp2001rs": {"area": null, "indicator": "zp2001rs_ukaz", "keys": ["zp2001rs_mj"], "period": "zp2001rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp2001rs/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-09-30"}, "zp3001rr": {"area": "nuts13", "indicator": "zp3001rr_ukaz", "keys": [], "period": "zp3001rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp3001rr/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-15"}, "zp3701rr": {"area": "zp3701rr_uzemieua", "indicator": "zp3701rr_zivp", "keys": [], "period": "zp3701rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp3701rr/all/all/all/all?lang=sk&type=json", "unit": "zp3701rr_mj", "update": "2025-10-01"}, "zp3803rs": {"area": "nuts14", "indicator": "zp3803rs_ukaz", "keys": ["zp3803rs_dim1"], "period": "zp3803rs_rok", "source": "https://data.statistics.sk/api/v2/dataset/zp3803rs/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-10-31"}}
        # The cube a message is, from the address the answer names itself by.
        let cube = this.href.or("").re_find_object("/(?P<code>[a-z]{2}[0-9]{4}[a-z]{2})/").code.catch(null)
        let roles = $cubes.get($cube.or("")).catch(null)
        root = if $roles == null { throw("no cube of this theme answered: %v".format(this.href.or("no href"))) } else if this.value.or([]).length() == 0 { throw("cube %v answered no cell".format($cube)) } else { this }
        let ds = this
        let ids = this.id
        let sizes = this.size
        let n = $sizes.length()
        # JSON-stat 2.0 is decoded by the index and never by the order: the period comes newest first.
        let codes = $ids.map_each(d -> $ds.dimension.get(d).category.index.key_values().sort_by(kv -> kv.value).map_each(kv -> kv.key))
        let labels = $ids.map_each(d -> $ds.dimension.get(d).category.label.or({}))
        let strides = range(0, $n, 1).map_each(k -> if k + 1 >= $n { 1 } else { $sizes.slice(k + 1, $n).fold(1, t -> t.tally * t.value) })
        let at_index = range(0, $n, 1).map_each(k -> { $ids.index(k): k }).squash()
        # A dimension DATAcube adds to the answer only (`*_data`, one value) names nothing.
        let named = [$roles.period, $roles.area, $roles.indicator, $roles.unit].concat($roles.keys)
        let keys = $roles.keys.concat($ids.filter(d -> !$named.contains(d) && $sizes.index($at_index.get(d)) > 1))
        let updated = ($ds.update.or($roles.update)).ts_parse("2006-01-02").ts_format("2006-01-02T15:04:05Z07:00", "UTC").catch(null)
        let cells = if $ds.value.type() == "object" { $ds.value.key_values().map_each(kv -> { "p": kv.key.number().int64(), "v": kv.value }) } else { range(0, $ds.value.length(), 1).map_each(p -> { "p": p, "v": $ds.value.index(p) }) }
        # One entity per cell that carries a number; a cell the publisher left empty is not a zero.
        root = $cells.filter(c -> c.v != null && c.v.type() == "number").map_each(c -> range(0, $n, 1).map_each(k -> { $ids.index(k): $codes.index(k).index(((c.p / $strides.index(k)).floor().int64()) % $sizes.index(k)) }).squash().merge({ "_v": c.v })).map_each(at -> {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), [$cube, if $roles.area == null { "SK0" } else { at.get($roles.area) }, at.get($roles.period), if $roles.indicator == null { $cube } else { at.get($roles.indicator) }].concat($keys.map_each(d -> at.get(d))).concat(if $roles.unit == null { [] } else { [at.get($roles.unit)] }).join("-").re_replace_all("[^A-Za-z0-9._~-]", "_")),
          "type": "KeyPerformanceIndicator",
          "dataSet": { "type": "Property", "value": $cube },
          "indicator": { "type": "Property", "value": if $roles.indicator == null { $cube } else { at.get($roles.indicator) } },
          "refArea": { "type": "Property", "value": if $roles.area == null { "SK0" } else { at.get($roles.area) } },
          "refPeriod": { "type": "Property", "value": at.get($roles.period) },
          "dimensionKey": if $keys.length() == 0 { null } else { { "type": "Property", "value": $keys.map_each(d -> at.get(d)).join("-") } },
          "kpiValue": { "type": "Property", "value": at._v, "observedAt": $updated }.filter(e -> e.value != null),
          "unitText": if $roles.unit == null { null } else { { "type": "Property", "value": $labels.index($at_index.get($roles.unit)).get(at.get($roles.unit)).or(at.get($roles.unit)) } },
          "source": { "type": "Property", "value": $roles.source },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/susr-%v".format($cube) },
          "dateObserved": if $updated == null { null } else { { "type": "Property", "value": $updated } }
        }.filter(e -> e.value != null))
  outputs:
    - targetEndpoint: urn:ngsi-ld:Endpoint:joinedcontext.com:susr-zp:susr-zp
      type: KeyPerformanceIndicator
      mode: upsert
  quotas:
    maxMemoryMb: 320
    cpuMillicores: 100
