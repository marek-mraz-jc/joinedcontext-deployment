# Generated by scripts/open-data/datacube.py (T-4390); do not edit by hand.
# Every cube of theme `st`, whole, into susr-st: one KeyPerformanceIndicator per published cell,
# as ŠÚ SR published it; nothing is renamed or recomputed. A daily read keeps every table within
# a day of its release.
apiVersion: joinedcontext.com/v1alpha2
kind: Pipeline
metadata:
  name: susr-st
  namespace: slovensko
  title: { sk: "ŠÚ SR: Stavebníctvo a bývanie", en: "ŠÚ SR: Construction and housing" }
spec:
  class: auto
  period: 24h
  schedule: "44 3 * * *"
  sources:
    - dataSourceRef: { kind: DataSource, name: susr-st0003qs }
    - dataSourceRef: { kind: DataSource, name: susr-st0005ms }
    - dataSourceRef: { kind: DataSource, name: susr-st0006ms }
    - dataSourceRef: { kind: DataSource, name: susr-st1004ms }
    - dataSourceRef: { kind: DataSource, name: susr-st1005ms }
    - dataSourceRef: { kind: DataSource, name: susr-st1006ms }
    - dataSourceRef: { kind: DataSource, name: susr-st1007ms }
    - dataSourceRef: { kind: DataSource, name: susr-st1008ms }
    - dataSourceRef: { kind: DataSource, name: susr-st2002qs }
    - dataSourceRef: { kind: DataSource, name: susr-st2022qs }
    - dataSourceRef: { kind: DataSource, name: susr-st2024qs }
    - dataSourceRef: { kind: DataSource, name: susr-st3002rr }
    - dataSourceRef: { kind: DataSource, name: susr-st3004rr }
    - dataSourceRef: { kind: DataSource, name: susr-st3701rr }
  steps:
    - kind: bloblang
      bloblang: |
        # The cubes of this theme and the role of their dimensions, read from DATAcube's collection.
        let cubes = {"st0003qs": {"area": null, "indicator": "st0003qs_ukaz", "keys": ["st0003qs_stv", "st0003qs_stav", "st0003qs_byt"], "period": "st0003qs_rok", "source": "https://data.statistics.sk/api/v2/dataset/st0003qs/all/all/all/all/all/all?lang=sk&type=json", "unit": "st0003qs_mj", "update": "2026-09-03"}, "st0005ms": {"area": null, "indicator": "st0005ms_indic", "keys": ["st0005ms_month", "st0005ms_specu", "st0005ms_constprod", "st0005ms_constr"], "period": "st0005ms_year", "source": "https://data.statistics.sk/api/v2/dataset/st0005ms/all/all/all/all/all/all/all?lang=sk&type=json", "unit": "st0005ms_unit", "update": "2026-09-10"}, "st0006ms": {"area": null, "indicator": "st0006ms_indic", "keys": ["st0006ms_month", "st0006ms_specu", "st0006ms_nace2"], "period": "st0006ms_year", "source": "https://data.statistics.sk/api/v2/dataset/st0006ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "st0006ms_unit", "update": "2026-09-14"}, "st1004ms": {"area": null, "indicator": "st1004ms_indic", "keys": ["st1004ms_month", "st1004ms_specu", "st1004ms_nace2"], "period": "st1004ms_year", "source": "https://data.statistics.sk/api/v2/dataset/st1004ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "st1004ms_unit", "update": "2026-09-10"}, "st1005ms": {"area": null, "indicator": "st1005ms_indic", "keys": ["st1005ms_month", "st1005ms_specu", "st1005ms_nace2"], "period": "st1005ms_year", "source": "https://data.statistics.sk/api/v2/dataset/st1005ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "st1005ms_unit", "update": "2026-09-14"}, "st1006ms": {"area": null, "indicator": "st1006ms_indic", "keys": ["st1006ms_month", "st1006ms_specu", "st1006ms_nace2"], "period": "st1006ms_year", "source": "https://data.statistics.sk/api/v2/dataset/st1006ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "st1006ms_unit", "update": "2026-09-10"}, "st1007ms": {"area": null, "indicator": "st1007ms_indic", "keys": ["st1007ms_month", "st1007ms_specu", "st1007ms_nace2"], "period": "st1007ms_year", "source": "https://data.statistics.sk/api/v2/dataset/st1007ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "st1007ms_unit", "update": "2026-09-14"}, "st1008ms": {"area": null, "indicator": "st1008ms_indic", "keys": ["st1008ms_month", "st1008ms_specu", "st1008ms_sizeclas"], "period": "st1008ms_year", "source": "https://data.statistics.sk/api/v2/dataset/st1008ms/all/all/all/all/all/all?lang=sk&type=json", "unit": "st1008ms_unit", "update": "2026-09-14"}, "st2002qs": {"area": null, "indicator": "st2002qs_ukaz", "keys": ["st2002qs_stv"], "period": "st2002qs_rok", "source": "https://data.statistics.sk/api/v2/dataset/st2002qs/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-09-03"}, "st2022qs": {"area": null, "indicator": "st2022qs_ukaz1", "keys": ["st2022qs_stv", "st2022qs_ukaz2"], "period": "st2022qs_rok", "source": "https://data.statistics.sk/api/v2/dataset/st2022qs/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-09-03"}, "st2024qs": {"area": null, "indicator": "st2024qs_ukaz1", "keys": ["st2024qs_stv", "st2024qs_ukaz2"], "period": "st2024qs_rok", "source": "https://data.statistics.sk/api/v2/dataset/st2024qs/all/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-09-03"}, "st3002rr": {"area": "nuts14", "indicator": "st3002rr_ukaz", "keys": [], "period": "st3002rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/st3002rr/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-09-26"}, "st3004rr": {"area": "nuts14", "indicator": "st3004rr_ukaz", "keys": [], "period": "st3004rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/st3004rr/all/all/all?lang=sk&type=json", "unit": null, "update": "2026-09-03"}, "st3701rr": {"area": "st3701rr_uzemieua", "indicator": "st3701rr_dim", "keys": [], "period": "st3701rr_rok", "source": "https://data.statistics.sk/api/v2/dataset/st3701rr/all/all/all?lang=sk&type=json", "unit": null, "update": "2025-09-02"}}
        # The cube a message is, from the address the answer names itself by.
        let cube = this.href.or("").re_find_object("/(?P<code>[a-z]{2}[0-9]{4}[a-z]{2})/").code.catch(null)
        let roles = $cubes.get($cube.or("")).catch(null)
        root = if $roles == null { throw("no cube of this theme answered: %v".format(this.href.or("no href"))) } else if this.value.or([]).length() == 0 { throw("cube %v answered no cell".format($cube)) } else { this }
        let ds = this
        let ids = this.id
        let sizes = this.size
        let n = $sizes.length()
        # JSON-stat 2.0 is decoded by the index and never by the order: the period comes newest first.
        let codes = $ids.map_each(d -> $ds.dimension.get(d).category.index.key_values().sort_by(kv -> kv.value).map_each(kv -> kv.key))
        let labels = $ids.map_each(d -> $ds.dimension.get(d).category.label.or({}))
        let strides = range(0, $n, 1).map_each(k -> if k + 1 >= $n { 1 } else { $sizes.slice(k + 1, $n).fold(1, t -> t.tally * t.value) })
        let at_index = range(0, $n, 1).map_each(k -> { $ids.index(k): k }).squash()
        # A dimension DATAcube adds to the answer only (`*_data`, one value) names nothing.
        let named = [$roles.period, $roles.area, $roles.indicator, $roles.unit].concat($roles.keys)
        let keys = $roles.keys.concat($ids.filter(d -> !$named.contains(d) && $sizes.index($at_index.get(d)) > 1))
        let updated = ($ds.update.or($roles.update)).ts_parse("2006-01-02").ts_format("2006-01-02T15:04:05Z07:00", "UTC").catch(null)
        let cells = if $ds.value.type() == "object" { $ds.value.key_values().map_each(kv -> { "p": kv.key.number().int64(), "v": kv.value }) } else { range(0, $ds.value.length(), 1).map_each(p -> { "p": p, "v": $ds.value.index(p) }) }
        # One entity per cell that carries a number; a cell the publisher left empty is not a zero.
        root = $cells.filter(c -> c.v != null && c.v.type() == "number").map_each(c -> range(0, $n, 1).map_each(k -> { $ids.index(k): $codes.index(k).index(((c.p / $strides.index(k)).floor().int64()) % $sizes.index(k)) }).squash().merge({ "_v": c.v })).map_each(at -> {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), [$cube, if $roles.area == null { "SK0" } else { at.get($roles.area) }, at.get($roles.period), if $roles.indicator == null { $cube } else { at.get($roles.indicator) }].concat($keys.map_each(d -> at.get(d))).concat(if $roles.unit == null { [] } else { [at.get($roles.unit)] }).join("-").re_replace_all("[^A-Za-z0-9._~-]", "_")),
          "type": "KeyPerformanceIndicator",
          "dataSet": { "type": "Property", "value": $cube },
          "indicator": { "type": "Property", "value": if $roles.indicator == null { $cube } else { at.get($roles.indicator) } },
          "refArea": { "type": "Property", "value": if $roles.area == null { "SK0" } else { at.get($roles.area) } },
          "refPeriod": { "type": "Property", "value": at.get($roles.period) },
          "dimensionKey": if $keys.length() == 0 { null } else { { "type": "Property", "value": $keys.map_each(d -> at.get(d)).join("-") } },
          "kpiValue": { "type": "Property", "value": at._v, "observedAt": $updated }.filter(e -> e.value != null),
          "unitText": if $roles.unit == null { null } else { { "type": "Property", "value": $labels.index($at_index.get($roles.unit)).get(at.get($roles.unit)).or(at.get($roles.unit)) } },
          "source": { "type": "Property", "value": $roles.source },
          "isPartOf": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/susr-%v".format($cube) },
          "dateObserved": if $updated == null { null } else { { "type": "Property", "value": $updated } }
        }.filter(e -> e.value != null))
  outputs:
    - targetEndpoint: urn:ngsi-ld:Endpoint:joinedcontext.com:susr-st:susr-st
      type: KeyPerformanceIndicator
      mode: upsert
  quotas:
    maxMemoryMb: 192
    cpuMillicores: 100
