# Bratislava's public data as one read-only MCP connector (T-5367, ADR-N-043):
# `https://{domain}/api/mcp/bratislava/otvorene-data`. It selects every public Endpoint of the
# project bratislava, so each dataset a later batch adds joins without an edit here; every call is
# still that Endpoint's own call under its anonymous Policy, and a public server lists read tools
# only, whoever calls (EP-141).
apiVersion: joinedcontext.com/v1alpha1
kind: McpServer
metadata:
  name: otvorene-data
  namespace: bratislava
  # What an AI client reads as serverInfo and initialize.instructions (EP-92).
  title:
    sk: Bratislava — otvorené údaje
    en: Bratislava, open data
  description:
    sk: 'Otvorené údaje hlavného mesta SR Bratislavy z portálu data.bratislava.sk, len na čítanie, ako Smart Data Models. Zdroj: Hlavné mesto SR Bratislava, CC BY 4.0. Pri citovaní uveďte zdroj.'
    en: 'Read-only open data of the City of Bratislava, Slovakia, from data.bratislava.sk as Smart Data Models. Start with list_endpoints or search, then query_entities naming one endpoint, with a small limit. Texts are in Slovak. Source: City of Bratislava (Hlavné mesto SR Bratislava), CC BY 4.0; credit it when you quote it.'
spec:
  # Every public Endpoint of the project, resolved on each call (MF-55, T-5367): a new one joins
  # without an edit here, one that stops being public leaves.
  select:
    projects: [bratislava]
    accessLevel: [public]
  audience: public
