apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-zmena-dopravneho-dopytu
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Zmena dopravného dopytu podľa ÚGD hl. mesta Bratislava a Prognózy (v %)'
    en: 'Public read: Change of transport demand by the city transport master plan and the forecast'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:zmena-dopravneho-dopytu[.][a-z0-9.-]+$
