apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-transfer-nestatnym-skolam
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Transfer neštátnym školám a školským zariadeniam poskytnutý v rokoch 2010 - 2023'
    en: 'Public read: Transfers to non-state schools and school facilities, 2010-2023'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:transfer-nestatnym-skolam[.][a-z0-9.-]+$
