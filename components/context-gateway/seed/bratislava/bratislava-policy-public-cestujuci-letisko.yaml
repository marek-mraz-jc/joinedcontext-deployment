apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-cestujuci-letisko
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet odbavených cestujúcich na letisku M. R. Štefánika v Bratislave podľa druhu dopravy'
    en: 'Public read: Passengers at M. R. Štefánik Airport by kind of traffic'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:cestujuci-letisko[.][a-z0-9.-]+$
