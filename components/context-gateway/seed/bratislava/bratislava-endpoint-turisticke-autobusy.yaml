# One catalogue dataset (T-5435): the tourist coach stops (OnStreetParking) of the space bratislava, read
# through its own Policy, which narrows the space's public read to them.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: bratislava-turisticke-autobusy
  namespace: bratislava
  title: { sk: Zastávky turistických autobusov — Bratislava, en: Tourist coach stops — Bratislava }
  description:
    sk: >-
      Miesta, kde môžu v Bratislave zastaviť turistické autobusy: krátkodobé zastavenie na výstup a nástup a dlhodobé státie s počtom miest, s pamiatkami v dosahu. Typ Smart Data Models OnStreetParking. Zoznam mesta neuvádza súradnice: polohu má každá zastávka podľa svojho názvu z OpenStreetMap (ulica alebo miesto, nie presné stojisko). Zdroj: Hlavné mesto SR Bratislava, data.bratislava.sk, CC BY 4.0; poloha OpenStreetMap, ODbL.
    en: >-
      Where tourist coaches may stop in Bratislava: short-term stops to let passengers off and on and long-term stands with their number of places, with the sights in reach. Smart Data Models type OnStreetParking. The city's list carries no coordinates: each stop is placed by its name from OpenStreetMap (the street or place, not the exact stand). Source: City of Bratislava, data.bratislava.sk, CC BY 4.0; positions OpenStreetMap, ODbL.
