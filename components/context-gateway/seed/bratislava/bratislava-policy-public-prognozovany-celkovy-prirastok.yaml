apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-prognozovany-celkovy-prirastok
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Prognózovaný celkový prírastok obyvateľov okresov Bratislavy v rokoch 2022 – 2035'
    en: "Public read: Projected total population increase of Bratislava's districts, 2022-2035"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:prognozovany-celkovy-prirastok[.][a-z0-9.-]+$
