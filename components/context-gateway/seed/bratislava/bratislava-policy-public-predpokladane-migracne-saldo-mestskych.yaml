apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-predpokladane-migracne-saldo-mestskych
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Predpokladané migračné saldo mestských častí Bratislavy do roku 2035'
    en: "Public read: Expected net migration of Bratislava's city districts to 2035"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:predpokladane-migracne-saldo-mestskych[.][a-z0-9.-]+$
