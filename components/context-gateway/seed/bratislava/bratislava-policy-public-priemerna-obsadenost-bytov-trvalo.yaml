apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-priemerna-obsadenost-bytov-trvalo
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Priemerná obsadenosť bytov trvalo bývajúcimi obyvateľmi v Bratislave v rokoch 1980 - 2051'
    en: 'Public read: Average occupancy of dwellings by permanent residents in Bratislava, 1980-2051'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:priemerna-obsadenost-bytov-trvalo[.][a-z0-9.-]+$
