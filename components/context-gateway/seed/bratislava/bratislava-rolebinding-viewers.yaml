# Bratislava's readers (PF-61 inside ADR-N-058 2.4): the members of the Keycloak group /bratislava,
# the root of the Organization's subtree, read its projects and nothing of another Organization.
apiVersion: joinedcontext.com/v1alpha1
kind: RoleBinding
metadata:
  name: bratislava-viewers
  namespace: org
spec:
  subjects:
    - group: bratislava
      source: provider
  role: viewer
  scope: { organization: bratislava }
