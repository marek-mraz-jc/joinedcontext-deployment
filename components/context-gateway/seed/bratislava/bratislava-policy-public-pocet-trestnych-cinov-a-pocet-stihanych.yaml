apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pocet-trestnych-cinov-a-pocet-stihanych
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet trestných činov a počet stíhaných a vyšetrovaných mladistvých a maloletých osôb'
    en: 'Public read: Crimes and juveniles and minors prosecuted and investigated'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:pocet-trestnych-cinov-a-pocet-stihanych[.][a-z0-9.-]+$
