apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-prognozovany-vyvoj-uhrnnej-plodnosti-v
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Prognózovaný vývoj úhrnnej plodnosti v okresoch Bratislavy do roku 2035'
    en: "Public read: Projected total fertility in Bratislava's districts to 2035"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:prognozovany-vyvoj-uhrnnej-plodnosti-v[.][a-z0-9.-]+$
