apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-zmena-poctu-obyvatelov-v-mestskych
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Zmena počtu obyvateľov v mestských častiach Bratislavy medzi rokom 2000 a 2021'
    en: "Public read: Population change in Bratislava's city districts between 2000 and 2021"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:zmena-poctu-obyvatelov-v-mestskych[.][a-z0-9.-]+$
