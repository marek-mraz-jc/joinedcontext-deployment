apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-odchadzka-do-zamestnania-a-skol-v
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Odchádzka do zamestnania a škôl v mestských častiach Bratislavy v rokoch 2011, 2021 a 2035'
    en: "Public read: Commuting to work and school from Bratislava's city districts in 2011, 2021 and 2035"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:odchadzka-do-zamestnania-a-skol-v[.][a-z0-9.-]+$
