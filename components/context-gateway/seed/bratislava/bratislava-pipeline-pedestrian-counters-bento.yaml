# The mapping of the pedestrian-counters pipeline (PL-03, T-5273): one CrowdFlowObserved per
# counter site of the city with the pedestrians it counted on the newest day the source has
# closed (Bratislava time), both directions apart (peopleCountTowards is the source's SMER_DO,
# peopleCountAway its SMER_Z), from the hub's hourly Feature Service table chodci10_01
# (data.bratislava.sk, CC BY 4.0). The closed day, the read and the checks are the counters
# pipeline's (bratislava-pipeline-counters-bento.yaml): a site without a position, outside
# Bratislava and a kilometre around it, repeated with more hours than a day has, or at 0 both ways
# all day (a site without a pedestrian sensor writes 0 every hour) is left out,
# and so is a site with an hour below 0 or above 5,000 people in a direction; one WARN line
# counts the reasons. A newest day older than three days, or a run with no count, fails.

pipeline:
  processors:
    - mapping: |
        root = if content().length() > 1048576 { throw("the counters' newest rows are %d bytes, more than the 1 MiB read".format(content().length())) } else { this }

    - mapping: |
        let now = now().ts_unix()
        let times = this.features.or([]).map_each(f -> f.attributes.newest.or("").string().ts_parse("2006-01-02T15:04:05Z07:00").ts_unix().catch(null)).filter(t -> t != null && t <= $now + 86400)
        let newest = $times.fold(0, t -> if t.value > t.tally { t.value } else { t.tally })
        let next = ($newest + 3600).ts_format("2006-01-02", "Europe/Bratislava")
        let day = ($next + "T00:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_sub_iso8601("P1D").ts_format("2006-01-02", "UTC")
        # Each midnight's offset is read at 00:00Z of that date: noon has the new offset on the day the
        # clocks change (2026-10-25 would end the day at 23:00Z instead of 22:00Z, T-5489).
        let from = (($day + "T00:00:00") + ($day + "T00:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_format("-07:00", "Europe/Bratislava")).ts_parse("2006-01-02T15:04:05Z07:00")
        let to = (($next + "T00:00:00") + ($next + "T00:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_format("-07:00", "Europe/Bratislava")).ts_parse("2006-01-02T15:04:05Z07:00")
        # A throw here would keep the newest rows as the message: the problem rides on it instead and
        # fails the run at the end, after nothing was read or written.
        root = { "day": $day, "from": $from.ts_format("2006-01-02T15:04:05Z", "UTC"), "to": $to.ts_format("2006-01-02T15:04:05Z", "UTC"),
          "problem": if $times.length() == 0 { "the counters answered no row time" } else if $to.ts_unix() < $now - 259200 { "the newest day the counters closed, %v, is more than three days old".format($day) } else { null } }
        meta from = $from.ts_format("2006-01-02T15:04:05", "UTC")
        meta to = $to.ts_format("2006-01-02T15:04:05", "UTC")

    - branch:
        request_map: root = if this.problem != null { deleted() } else { "" }
        processors:
          - try:
              - http:
                  url: https://services8.arcgis.com/pRlN1m0su5BYaFAS/arcgis/rest/services/chodci10_01/FeatureServer/0/query?where=DATUM_A_CAS%20%3E%3D%20%27${! @from }%27%20AND%20DATUM_A_CAS%20%3C%20%27${! @to }%27&groupByFieldsForStatistics=NAZOV,ZEMEPISNA_SIRKA,ZEMEPISNA_DLZKA,SMER_DO,SMER_Z&outStatistics=%5B%7B%22statisticType%22%3A%22sum%22%2C%22onStatisticField%22%3A%22POCET_DO%22%2C%22outStatisticFieldName%22%3A%22towards%22%7D%2C%7B%22statisticType%22%3A%22sum%22%2C%22onStatisticField%22%3A%22POCET_Z%22%2C%22outStatisticFieldName%22%3A%22away%22%7D%2C%7B%22statisticType%22%3A%22min%22%2C%22onStatisticField%22%3A%22POCET_DO%22%2C%22outStatisticFieldName%22%3A%22towardsMin%22%7D%2C%7B%22statisticType%22%3A%22max%22%2C%22onStatisticField%22%3A%22POCET_DO%22%2C%22outStatisticFieldName%22%3A%22towardsMax%22%7D%2C%7B%22statisticType%22%3A%22min%22%2C%22onStatisticField%22%3A%22POCET_Z%22%2C%22outStatisticFieldName%22%3A%22awayMin%22%7D%2C%7B%22statisticType%22%3A%22max%22%2C%22onStatisticField%22%3A%22POCET_Z%22%2C%22outStatisticFieldName%22%3A%22awayMax%22%7D%2C%7B%22statisticType%22%3A%22count%22%2C%22onStatisticField%22%3A%22ObjectId%22%2C%22outStatisticFieldName%22%3A%22rows%22%7D%5D&f=json
                  verb: GET
                  headers: { Accept: application/json }
                  timeout: 30s
                  retries: 1
              # ArcGIS answers a refused query with 200 and an `error` member.
              - mapping: |
                  root = if content().length() > 262144 { throw("the pedestrians' day is more than 256 KiB") } else if this.error.or(null) != null { throw("the pedestrians' table refused the query: %v".format(this.error.message.or(""))) } else if this.exceededTransferLimit.or(false) { throw("the pedestrians' day is more than one page") } else { { "rows": this.features.or([]).map_each(f -> f.attributes) } }
          - catch:
              - log: { level: WARN, message: 'counters: pedestrians not read: ${! error() }' }
              - mapping: 'root = { "failed": true }'
        result_map: root.walk = this

    - mapping: |
        root = if this.problem != null { throw(this.problem) } else { this }
    - mapping: |
        let box = { "w": 16.93, "s": 47.99, "e": 17.3, "n": 48.28 }
        let modes = [ { "mode": "pedestrian", "rows": this.walk.rows.or([]), "cap": 5000 } ]
        let day = this
        let judged = $modes.map_each(m -> m.rows.map_each(r -> {
          "mode": m.mode, "cap": m.cap,
          "name": r.NAZOV.or("").string().trim(),
          "key": r.NAZOV.or("").string().trim().re_find_all_submatch("^#([0-9]+) ").index(0).index(1).catch(r.NAZOV.or("").string().lowercase().re_replace_all("[^a-z0-9]+", "-").trim("-")),
          "lat": r.ZEMEPISNA_SIRKA.or(null), "lon": r.ZEMEPISNA_DLZKA.or(null),
          "towardsLabel": r.SMER_DO.or("").string().trim(), "awayLabel": r.SMER_Z.or("").string().trim().re_replace_all("^NIE JE.*", "protismer"),
          "towards": r.towards.or(null), "away": r.away.or(null), "towardsMin": r.towardsMin.or(null), "towardsMax": r.towardsMax.or(null),
          "awayMin": r.awayMin.or(null), "awayMax": r.awayMax.or(null), "rows": r.rows.or(0)
        }).enumerated().map_each(e -> e.value.assign({ "reason":
          if e.value.key == "" { "noName" }
          else if e.value.lon.type() != "number" || e.value.lat.type() != "number" { "noLocation" }
          else if !(e.value.lon >= $box.w && e.value.lon <= $box.e && e.value.lat >= $box.s && e.value.lat <= $box.n) {
            if e.value.lat >= $box.w && e.value.lat <= $box.e && e.value.lon >= $box.s && e.value.lon <= $box.n { "swappedCoordinates" } else { "outsideBratislava" }
          }
          else { null }
        }))).flatten()
        let valid = $judged.filter(s -> s.reason == null)
        let groups = $valid.enumerated().filter(e -> !$valid.slice(0, e.index).any(o -> o.mode == e.value.mode && o.key == e.value.key)).map_each(e -> e.value.assign({
          "twins": $valid.filter(o -> o.mode == e.value.mode && o.key == e.value.key).slice(1) })).map_each(s -> s.assign({ "hours": s.twins.fold(s.rows, t -> t.tally + t.value.rows) }))
        let merged = $groups.map_each(s -> if s.twins.length() == 0 || s.hours > 25 { s } else { s.assign({
          "towards": s.twins.fold(s.towards, t -> t.tally + t.value.towards), "away": s.twins.fold(s.away, t -> t.tally + t.value.away),
          "towardsMin": s.twins.fold(s.towardsMin, t -> [t.tally, t.value.towardsMin].min()), "towardsMax": s.twins.fold(s.towardsMax, t -> [t.tally, t.value.towardsMax].max()),
          "awayMin": s.twins.fold(s.awayMin, t -> [t.tally, t.value.awayMin].min()), "awayMax": s.twins.fold(s.awayMax, t -> [t.tally, t.value.awayMax].max()) }) })
        let duplicates = $groups.filter(s -> s.hours > 25).map_each(s -> s.twins).flatten().map_each(t -> t.assign({ "reason": "duplicate" }))
        # A site without the mode's sensor writes 0 every hour (14 of the 19 vehicle sites and three
        # pedestrian ones counted nothing from 2026-09-21 to 2026-10-21): a day of 0 both ways is no count.
        let silent = $merged.filter(s -> s.towards.or(0) + s.away.or(0) == 0).map_each(s -> s.assign({ "reason": "zeroDay" }))
        let directions = $merged.filter(s -> s.towards.or(0) + s.away.or(0) != 0).map_each(s -> s.assign({ "reason":
          if s.towards.type() != "number" || s.towardsMin.type() != "number" || s.towardsMax.type() != "number" || s.towardsMin < 0 || s.towardsMax > s.cap { "outOfRange" }
          else if s.away.type() != "number" || s.awayMin.type() != "number" || s.awayMax.type() != "number" || s.awayMin < 0 || s.awayMax > s.cap { "outOfRange" }
          else { null } }))
        let dropped = $judged.filter(s -> s.reason != null).concat($duplicates, $silent, $directions.filter(d -> d.reason != null)).fold({}, t -> t.tally.assign({ t.value.reason: t.tally.get(t.value.reason).or(0) + 1 }))
        meta dropped = if $dropped.keys().length() > 0 { $dropped.format_json(no_indent: true) } else { "" }
        root = $directions.filter(d -> d.reason == null).map_each(d -> {
          "id": "urn:ngsi-ld:%v:%v:%v:pedestrian-%v".format("CrowdFlowObserved", env("JC_ORG_DOMAIN"), env("JC_SPACE"), d.key),
          "type": "CrowdFlowObserved",
          "name": { "type": "LanguageProperty", "languageMap": { "sk": "%v (%v / %v)".format(d.name, d.towardsLabel, d.awayLabel) } },
          "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [d.lon, d.lat] } },
          "dateObserved": { "type": "Property", "value": $day.to },
          "dateObservedFrom": { "type": "Property", "value": $day.from },
          "dateObservedTo": { "type": "Property", "value": $day.to },
          "peopleCount": { "type": "Property", "value": (d.towards + d.away).round(), "observedAt": $day.to },
          "peopleCountTowards": { "type": "Property", "value": d.towards.round(), "observedAt": $day.to },
          "peopleCountAway": { "type": "Property", "value": d.away.round(), "observedAt": $day.to },
          "dataProvider": { "type": "Property", "value": "Hlavné mesto SR Bratislava, data.bratislava.sk (CC BY 4.0)" },
          "source": { "type": "Property", "value": "https://services8.arcgis.com/pRlN1m0su5BYaFAS/arcgis/rest/services/chodci10_01/FeatureServer/0" }
        }.filter(entry -> entry.value != null))

    - switch:
        - check: '@dropped != ""'
          processors:
            - log: { level: WARN, message: 'pedestrian counters left out: ${! @dropped }' }

    - mapping: |
        root = if this.length() == 0 { throw("no pedestrian counter wrote a count for the closed day") } else { this }
    - unarchive: { format: json_array }
