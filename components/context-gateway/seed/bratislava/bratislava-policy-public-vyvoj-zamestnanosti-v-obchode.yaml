apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vyvoj-zamestnanosti-v-obchode
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Vývoj zamestnanosti v obchode, pohostinstve a ubytovaní v Bratislave v rokoch 2015 - 2021'
    en: 'Public read: Employment in trade, catering and accommodation in Bratislava, 2015-2021'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:vyvoj-zamestnanosti-v-obchode[.][a-z0-9.-]+$
