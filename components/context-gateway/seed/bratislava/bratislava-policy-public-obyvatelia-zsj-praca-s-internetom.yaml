apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-obyvatelia-zsj-praca-s-internetom
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet obyvateľov podľa počítačovej znalosti - práca s internetom v ZSJ'
    en: 'Public read: Residents by computer skills, use of the internet, in the basic settlement units (ZSJ), 2021 census'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:obyvatelia-zsj-praca-s-internetom[.][a-z0-9.-]+$
