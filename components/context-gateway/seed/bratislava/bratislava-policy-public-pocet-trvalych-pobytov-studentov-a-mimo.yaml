apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pocet-trvalych-pobytov-studentov-a-mimo
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet trvalých pobytov študentov v Bratislave a mimo Bratislavy podľa druhu strednej školy v roku 2021'
    en: "Public read: Students' permanent residence in and outside Bratislava by type of secondary school, 2021"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:pocet-trvalych-pobytov-studentov-a-mimo[.][a-z0-9.-]+$
