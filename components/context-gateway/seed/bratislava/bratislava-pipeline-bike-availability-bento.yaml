# The mapping of the bike-availability pipeline (PL-03, T-5273): what each Slovnaft BAjk station
# of nextbike's Bratislava system holds right now (GBFS 2.3 `station_status`, CC0 1.0), written
# onto the station the bike-stations pipeline names. The gateway merges attributes
# (`upsert?options=update`), so the name and the position that pipeline writes stay.
#
# Plausibility (owner 2026-10-22): a station's counts are left out, the reason counted in one WARN
# line, when a count is not a whole number from 0 to 500 (no station of the city holds more than a
# few dozen bikes) or the station repeats an earlier id. A feed older than three of its own `ttl`
# periods (at least 15 minutes) or one that names no station fails the run.

pipeline:
  processors:
    - mapping: |
        root = if content().length() > 4194304 { throw("the station status is %d bytes, more than the 4 MiB read".format(content().length())) } else { this }
    - mapping: |
        let age = now().ts_unix() - this.last_updated.or(0).number().catch(0)
        let all = this.data.stations.or([]).map_each(s -> s.assign({ "station_id": s.station_id.or("").string() }))
        let judged = $all.enumerated().map_each(e -> e.value.assign({ "reason":
          if !e.value.station_id.re_match("^[0-9]+$") { "noId" }
          else if $all.slice(0, e.index).any(o -> o.station_id == e.value.station_id) { "duplicate" }
          else if [e.value.num_bikes_available.or(null), e.value.num_docks_available.or(0)].any(n -> n.type() != "number" || n < 0 || n > 500 || n.round() != n) { "outOfRange" }
          else { null }
        }))
        let kept = $judged.filter(s -> s.reason == null)
        let dropped = $judged.filter(s -> s.reason != null).fold({}, t -> t.tally.assign({ t.value.reason: t.tally.get(t.value.reason).or(0) + 1 }))
        meta dropped = if $dropped.keys().length() > 0 { $dropped.format_json(no_indent: true) } else { "" }
        meta problem = if $age > [this.ttl.or(60).number().catch(60) * 3, 900].max() { "the station status is %v s old".format($age) } else if $kept.length() == 0 { "the station status names no station" } else { "" }
        root = $kept.map_each(s -> {
          "id": "urn:ngsi-ld:%v:%v:%v:nextbike-%v".format("BikeHireDockingStation", env("JC_ORG_DOMAIN"), env("JC_SPACE"), s.station_id),
          "type": "BikeHireDockingStation",
          "availableBikeNumber": { "type": "Property", "value": s.num_bikes_available },
          "freeSlotNumber": if s.num_docks_available.or(null) == null { null } else { { "type": "Property", "value": s.num_docks_available } },
          "status": { "type": "Property", "value": if s.is_installed.or(false) && s.is_renting.or(false) { "working" } else { "outOfService" } },
          "dateModified": if s.last_reported.or(null) == null { null } else {
            { "type": "Property", "value": s.last_reported.ts_format("2006-01-02T15:04:05Z07:00", "UTC") }
          },
          "dataProvider": { "type": "Property", "value": "nextbike Czech Republic, Slovnaft BAjk (CC0 1.0)" },
          "source": { "type": "Property", "value": "https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_bi/gbfs.json" }
        }.filter(entry -> entry.value != null))
    - switch:
        - check: '@dropped != ""'
          processors:
            - log: { level: WARN, message: 'bike availability left out: ${! @dropped }' }
    - mapping: |
        root = if @problem != "" { [] } else { this }
    - mapping: |
        root = if @problem != "" { throw(@problem) } else { this }
    - unarchive: { format: json_array }
