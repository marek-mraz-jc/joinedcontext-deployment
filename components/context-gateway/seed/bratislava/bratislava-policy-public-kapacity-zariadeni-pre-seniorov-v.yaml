apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-kapacity-zariadeni-pre-seniorov-v
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Kapacity zariadení pre seniorov v Bratislave v rokoch 2008 – 2021'
    en: 'Public read: Capacity of facilities for seniors in Bratislava, 2008-2021'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:kapacity-zariadeni-pre-seniorov-v[.][a-z0-9.-]+$
