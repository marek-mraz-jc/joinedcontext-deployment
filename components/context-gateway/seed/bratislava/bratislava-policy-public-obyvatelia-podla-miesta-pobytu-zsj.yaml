apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-obyvatelia-podla-miesta-pobytu-zsj
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet obyvateľov podľa miesta trvalého pobytu alebo obvyklého bydliska v ZSJ'
    en: 'Public read: Population by place of permanent or usual residence in the basic settlement units'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, census aggregates, nothing about a
  # person); discovery beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:obyvatelia-podla-miesta-pobytu-zsj[.][a-z0-9.-]+$
