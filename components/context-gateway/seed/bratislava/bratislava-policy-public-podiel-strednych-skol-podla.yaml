apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-podiel-strednych-skol-podla
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Podiel stredných škôl podľa zriaďovateľa v Bratislave za obdobie 2010 – 2022'
    en: 'Public read: Share of secondary schools by founder in Bratislava, 2010-2022'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:podiel-strednych-skol-podla[.][a-z0-9.-]+$
