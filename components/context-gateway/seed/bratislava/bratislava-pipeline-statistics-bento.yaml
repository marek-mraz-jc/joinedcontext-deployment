# The mapping of the statistics pipeline (T-5274): the hub's district tables as Smart Data Models
# KeyPerformanceIndicator, one entity per table, figure, city district and period. One pipeline
# shape for every Feature Service table of the matrix (Research/bratislava-open-data.md): a table
# is one line of `tables` below, never a pipeline of its own. The bratislava-hub DataSource
# answers the hub's list of services; a table the list no longer names is logged and left out.
# Each table is read with one query of at most 2,000 rows; an answer that says it holds more fails
# that table instead of writing part of it. Nothing here deletes.
pipeline:
  processors:
    - mapping: |
        # key: the id prefix and the dataset's Endpoint idPattern; path: the Feature Service as the
        # hub's URL writes it; area: the district column; year, quarter or range: the period
        # column, or fixed: the one year the table's title names; only: [column, prefix] keeps the
        # rows of one breakdown (all school founders, not the districts' own schools); values:
        # [column, id segment, Slovak label, minimum, maximum], null where no bound holds.
        let tables = [
          { "key": "priestupky", "item": "db2bc2a556af4a3dbb1d76107769a089", "path": "Po%C4%8Det_priestupkov_pod%C4%BEa_mestsk%C3%BDch_%C4%8Dast%C3%AD_Bratislavy_pod%C4%BEa_evidencie_mestskej_pol%C3%ADcie", "title": "Priestupky podľa evidencie mestskej polície", "area": "MESTSKA_CAST", "year": "ROK", "frequency": "yearly",
            "values": [["POCET_PRIESTUPKOV", "pocet", "Počet priestupkov", 0, null]] },
          { "key": "komare", "item": "95df2faeda284dfdba5dbbcebd2d5cfd", "path": "Z%C3%A1sahy_pod%C4%BEa_jednotliv%C3%BDch_mestsk%C3%BDch_%C4%8Dast%C3%AD", "title": "Biologická regulácia komárov", "area": "MESTSKA_CAST", "year": "ROK", "frequency": "yearly",
            "values": [["POCET_KONTROL", "kontroly", "Počet kontrol", 0, null], ["OSETRENA_PLOCHA_V_M2", "plocha-m2", "Ošetrená plocha (m²)", 0, null]] },
          { "key": "demografia", "item": "b75314b4584f4875a3ce47a74bb67112", "path": "Demografia%20Bratislavy", "title": "Demografia", "area": "Mestská_časť", "year": "Rok", "frequency": "yearly",
            "values": [
              ["Stredný__priemerný__stav_trvale", "obyvatelia", "Stredný stav trvale bývajúcich obyvateľov", 0, null],
              ["Sobáše__Počet_v_jednotkách_", "sobase", "Sobáše", 0, null],
              ["Rozvody__Počet_v_jednotkách_", "rozvody", "Rozvody", 0, null],
              ["Narodení__Osoba_", "narodeni", "Narodení", 0, null],
              ["Zomretí__Osoba_", "zomreli", "Zomretí", 0, null],
              ["Prirodzený_prírastok_obyvateľst", "prirodzeny-prirastok", "Prirodzený prírastok", null, null],
              ["Prisťahovaní_na_trvalý_pobyt__O", "pristahovani", "Prisťahovaní na trvalý pobyt", 0, null],
              ["Vysťahovaní_z_trvalého_pobytu__", "vystahovani", "Vysťahovaní z trvalého pobytu", 0, null],
              ["Migračné_saldo__Osoba_", "migracne-saldo", "Migračné saldo", null, null],
              ["Celkový_prírastok_obyvateľstva_", "celkovy-prirastok", "Celkový prírastok", null, null]] },
          { "key": "prognoza-obyvatelia", "item": "35e2060c0fba4308b16d6bb02401bc0d", "path": "Progn%C3%B3za_po%C4%8Dtu_obyvate%C4%BEov_v_mestsk%C3%BDch_%C4%8Dastiach_Bratislavy", "title": "Prognóza počtu obyvateľov", "area": "MESTSKA_CAST", "year": "ROK", "frequency": "yearly",
            "values": [["POCET_OBYVATELOV", "pocet", "Počet obyvateľov (prognóza)", 0, null]] },
          { "key": "prognoza-celkovy-prirastok", "item": "da8cd2a844a2498db96236ef8925cd2b", "path": "Progn%C3%B3za_celkov%C3%A9ho_pr%C3%ADrastku_obyvate%C4%BEov_v_mestsk%C3%BDch_%C4%8Dastiach_Bratislavy", "title": "Prognóza celkového prírastku obyvateľov", "area": "MESTSKA_CAST", "year": "ROK", "frequency": "yearly",
            "values": [["CELKOVY_PRIRASTOK", "prirastok", "Celkový prírastok (prognóza)", null, null]] },
          { "key": "prognoza-ekonomicke-zatazenie", "item": "8e1efb34a91348ee8437fc2dd5505ed3", "path": "Progn%C3%B3za_indexu_ekonomick%C3%A9ho_za%C5%A5a%C5%BEenia_v_mestsk%C3%BDch_%C4%8Dastiach_Bratislavy", "title": "Prognóza indexu ekonomického zaťaženia", "area": "MESTSKA_CAST", "year": "ROK", "frequency": "yearly",
            "values": [["INDEX_EKON_ZATAZ", "index", "Index ekonomického zaťaženia (prognóza)", 0, 1000]] },
          { "key": "prognoza-index-starnutia", "item": "a2042a88ba3b4e94a324b33640115efd", "path": "Progn%C3%B3za_indexu_starnutia_v_mestsk%C3%BDch_%C4%8Dastiach_Bratislavye_Bratislava", "title": "Prognóza indexu starnutia", "area": "MESTSKA_CAST", "year": "ROK", "frequency": "yearly",
            "values": [["INDEX_STARNUTIA", "index", "Index starnutia (prognóza)", 0, 1000]] },
          { "key": "prognoza-priemerny-vek", "item": "d97203f6cd2e42478d3e75f9bedaa344", "path": "Progn%C3%B3za_priemern%C3%A9ho_veku_obyvate%C4%BEov_v_mestsk%C3%BDch_%C4%8Dastiach_Bratislavy", "title": "Prognóza priemerného veku obyvateľov", "area": "MESTSKA_CAST", "year": "ROK", "frequency": "yearly",
            "values": [["PRIEMERNY_VEK", "vek", "Priemerný vek (prognóza)", 0, 120]] },
          { "key": "prognoza-prirodzeny-prirastok", "item": "d83f7db610274623af5a3de553b2c980", "path": "Progn%C3%B3za_prirodzen%C3%A9ho_pr%C3%ADrastku_obyvate%C4%BEov_v_mestsk%C3%BDch_%C4%8Dastiach_Bratislavy", "title": "Prognóza prirodzeného prírastku obyvateľov", "area": "MESTSKA_CAST", "year": "ROK", "frequency": "yearly",
            "values": [["PRIRODZENY_PRIRASTOK", "prirastok", "Prirodzený prírastok (prognóza)", null, null]] },
          { "key": "nezamestnanost", "item": "d6b68e6e282f41a0ab6157cb6df3b13c", "path": "Miera_evidovanej_nezamestnanosti_mestsk%C3%BDch_%C4%8Dast%C3%AD_Bratislavy_v_%C5%A1tvr%C5%A5rokoc_%E2%80%93_k%C3%B3pia", "title": "Miera evidovanej nezamestnanosti", "area": "MESTSKA_CAST", "year": "ROK", "quarter": "STVRTROK", "frequency": "quarterly",
            "values": [["NEZAMESTNANOST_V__", "miera", "Miera evidovanej nezamestnanosti (%)", 0, 100]] },
          { "key": "ms-kapacita", "item": "8bdd3b3a849240dbb19ca309b0eb6be4", "path": "Kapacita_matersk%C3%BDch_%C5%A1k%C3%B4l_v_Bratislave_v_roku_2021", "title": "Kapacita materských škôl", "area": "MESTSKA_CAST", "fixed": "2021", "only": ["ZRIADOVATEL", "všetci"], "frequency": "yearly",
            "values": [["POCET", "miesta", "Kapacita materských škôl (miesta)", 0, null]] },
          { "key": "ms-deti", "item": "ac96675df45f4d7b997efdff5e86a628", "path": "Celkov%C3%BD_po%C4%8Det_det%C3%AD_v_matersk%C3%BDch_%C5%A1kol%C3%A1ch_v_Bratislave_v_roku_2021", "title": "Počet detí v materských školách", "area": "MESTSKA_CAST", "fixed": "2021", "only": ["ZRIADOVATEL", "všetci"], "frequency": "yearly",
            "values": [["POCET", "deti", "Počet detí v materských školách", 0, null]] },
          { "key": "zs-kapacita", "item": "a312b68160ee49bcbf7958f65e3beea2", "path": "Kapacita_z%C3%A1kladn%C3%BDch_%C5%A1k%C3%B4l_v_Bratislave_v_roku_2021", "title": "Kapacita základných škôl", "area": "MESTSKA_CAST", "fixed": "2021", "only": ["ZRIADOVATEL", "všetci"], "frequency": "yearly",
            "values": [["POCET", "miesta", "Kapacita základných škôl (miesta)", 0, null]] },
          { "key": "zs-ziaci", "item": "fd3bd5dd82434f4c8b82b31198884341", "path": "Celkov%C3%BD_po%C4%8Det_%C5%BEiakov_na_z%C3%A1kladn%C3%BDch_%C5%A1kol%C3%A1ch_v_Bratislave_v_roku_2021", "title": "Počet žiakov na základných školách", "area": "MESTSKA_CAST", "fixed": "2021", "only": ["ZRIADOVATEL", "všetci"], "frequency": "yearly",
            "values": [["POCET", "ziaci", "Počet žiakov na základných školách", 0, null]] },
          { "key": "ss-kapacita", "item": "cb2256a435f24178b2cca29be684d5c9", "path": "Kapacita_stredn%C3%BDch_%C5%A1k%C3%B4l_v_Bratislave", "title": "Kapacita stredných škôl", "area": "MESTSKA_CAST", "fixed": "2021", "only": ["ZRIADOVATEL", "všetci"], "frequency": "yearly",
            "values": [["POCET", "miesta", "Kapacita stredných škôl (miesta)", 0, null]] },
          { "key": "ss-studenti", "item": "968d67b7a5124129992019d4372efbcd", "path": "Celkov%C3%BD_po%C4%8Det_%C5%A1tudentov_na_stredn%C3%BDch_%C5%A1kol%C3%A1ch_v_Bratislave_v_roku_2021", "title": "Počet študentov na stredných školách", "area": "MESTSKA_CAST", "fixed": "2021", "only": ["ZRIADOVATEL", "všetci"], "frequency": "yearly",
            "values": [["POCET", "studenti", "Počet študentov na stredných školách", 0, null]] },
          { "key": "plodnost", "item": "191b3fe8bfcc43c8821863cabe8dfad2", "path": "%C3%9Ahrnn%C3%A1_plodnos%C5%A5_%C5%BEien_v_mestsk%C3%BDch_%C4%8Dastiach_Bratislavy_vo_vybran%C3%BDch_obdobiach_", "title": "Úhrnná plodnosť žien", "area": "MESTSKA_CAST", "range": "OBDOBIE",
            "values": [["UHRNNA_PLODNOST", "uhrnna", "Úhrnná plodnosť (deti na ženu)", 0, 10]] },
          { "key": "vymera", "item": "43bacf5da7a6447c9de670220786cc6d", "path": "V%C3%BDmera_%C3%BAzemia_pod%C4%BEa_druhu_pozemku_2019___2022", "title": "Výmera územia podľa druhu pozemku", "area": "Mestská_časť", "year": "Rok", "frequency": "yearly",
            "values": [
              ["Celková_výmera_m2", "celkova", "Celková výmera (m²)", 0, null],
              ["Pozemok_v_zastavanom_území_obce", "v-zastavanom-uzemi", "Pozemky v zastavanom území (m²)", 0, null],
              ["Pozemok_mimo_zastavaného_územia", "mimo-zastavaneho-uzemia", "Pozemky mimo zastavaného územia (m²)", 0, null],
              ["Orná_pôda", "orna-poda", "Orná pôda (m²)", 0, null],
              ["Chmelnice", "chmelnice", "Chmeľnice (m²)", 0, null],
              ["Vinice", "vinice", "Vinice (m²)", 0, null],
              ["Záhrady", "zahrady", "Záhrady (m²)", 0, null],
              ["Ovocné_sady", "ovocne-sady", "Ovocné sady (m²)", 0, null],
              ["Trvalé_trávnaté_porasty", "travnate-porasty", "Trvalé trávnaté porasty (m²)", 0, null],
              ["Poľnohospodárska_pôda", "polnohospodarska-poda", "Poľnohospodárska pôda (m²)", 0, null],
              ["Lesné_pozemky", "lesne-pozemky", "Lesné pozemky (m²)", 0, null],
              ["Vodné_plochy", "vodne-plochy", "Vodné plochy (m²)", 0, null],
              ["Zastavané_plochy_a_nádvoria", "zastavane-plochy", "Zastavané plochy a nádvoria (m²)", 0, null],
              ["Ostatné_plochy", "ostatne-plochy", "Ostatné plochy (m²)", 0, null]] }
        ]
        let listed = this.services.or([]).map_each(s -> s.name.or(""))
        let found = $tables.filter(t -> $listed.contains(t.path.unescape_url_query()))
        let missing = $tables.filter(t -> !$listed.contains(t.path.unescape_url_query())).map_each(t -> t.key)
        meta missing = $missing.join(", ")
        root = if content().length() > 1048576 {
          throw("the hub's list of services is %d bytes, more than the 1 MiB read".format(content().length()))
        } else if this.error.or(null) != null {
          throw("the hub refused its list of services: %s".format(this.error.message.or("no reason given")))
        } else if $found.length() == 0 {
          throw("the hub lists none of the statistics tables: nothing is written")
        } else { $found }
    - switch:
        - check: '@missing != ""'
          processors:
            - log:
                level: WARN
                message: 'statistics: the hub no longer lists ${! @missing }, left out of this run'
    - unarchive: { format: json_array }

    # One table a request; the path is the constant above, never text of an answer.
    - branch:
        request_map: |
          meta path = this.path
          root = ""
        processors:
          - sleep: { duration: '200ms' }
          - http:
              url: https://services8.arcgis.com/pRlN1m0su5BYaFAS/arcgis/rest/services/${! @path }/FeatureServer/0/query?where=1%3D1&outFields=*&resultRecordCount=2000&f=json
              verb: GET
              headers:
                Accept: application/json
                User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public open data)
              timeout: 30s
              retries: 2
        result_map: |
          root.rows = if content().length() > 4194304 {
            throw("the table answer is over 4 MiB")
          } else if this.error.or(null) != null {
            throw("the hub refused the query: %s".format(this.error.message.or("no reason given")))
          } else if this.exceededTransferLimit.or(false) {
            throw("the table holds more than 2,000 rows, more than one read")
          } else { this.features.or([]).map_each(f -> f.attributes) }
    # A table the hub refuses is logged and left out of this run; the others still write.
    - catch:
        - log: { level: WARN, message: 'statistics: ${! json("key") } not read: ${! error() }' }
        - mapping: root = deleted()
    - archive: { format: json_array }

    # Plausibility (owner 2026-10-22T18:10Z): dropped and counted by reason, never guessed at: a
    # district the city does not have; no period; a figure that is no number or lies outside its
    # bounds; one figure twice for the same district and period (the first is kept).
    - mapping: |
        # The 17 city districts by their name folded to ASCII, with their ZÚJ code (the
        # AdministrativeArea id the districts pipeline writes). The hub writes names three ways:
        # with diacritics, without them and abbreviated ("D. N. Ves", dots dropped: a key with a dot
        # is a path to `get`); the mosquito table writes č as è and ň as ò (a cp1250 text read as
        # Latin-1), folded here too, and its 2025 figures with a space between thousands.
        let districts = {
          "stare mesto": ["528595", "Staré Mesto"], "podunajske biskupice": ["529311", "Podunajské Biskupice"],
          "p biskupice": ["529311", "Podunajské Biskupice"], "ruzinov": ["529320", "Ružinov"], "vrakuna": ["529338", "Vrakuňa"],
          "nove mesto": ["529346", "Nové Mesto"], "raca": ["529354", "Rača"], "vajnory": ["529362", "Vajnory"],
          "devinska nova ves": ["529371", "Devínska Nová Ves"], "d n ves": ["529371", "Devínska Nová Ves"],
          "dubravka": ["529389", "Dúbravka"], "karlova ves": ["529397", "Karlova Ves"], "devin": ["529401", "Devín"],
          "lamac": ["529419", "Lamač"], "zahorska bystrica": ["529427", "Záhorská Bystrica"], "z bystrica": ["529427", "Záhorská Bystrica"],
          "cunovo": ["529435", "Čunovo"], "jarovce": ["529443", "Jarovce"], "petrzalka": ["529460", "Petržalka"], "rusovce": ["529494", "Rusovce"]
        }
        map fold {
          root = this.string().lowercase().replace_all_many([
            "á", "a", "ä", "a", "č", "c", "ď", "d", "é", "e", "í", "i", "ĺ", "l", "ľ", "l", "ň", "n", "ó", "o", "ô", "o",
            "ŕ", "r", "š", "s", "ť", "t", "ú", "u", "ý", "y", "ž", "z", "è", "c", "ò", "n", ".", ""
          ]).re_replace_all("\\s+", " ").trim()
        }
        map number {
          root = if this == null { null } else { this.string().re_replace_all("[\\s\u00a0]", "").replace_all(",", ".").number().catch(null) }
        }
        map year {
          root = if this.re_match("^(19|20)[0-9]{2}$") { { "from": this + "-01-01", "to": this + "-12-31", "slug": this, "label": this } } else { null }
        }
        map range {
          root = if this.length() == 2 {
            { "from": this.index(0) + "-01-01", "to": this.index(1) + "-12-31", "slug": this.join("-"), "label": this.join("–") }
          } else { null }
        }
        map quarter {
          let y = this.index(0)
          let q = this.index(1)
          root = if $y.re_match("^(19|20)[0-9]{2}$") && $q.re_match("^[1-4]$") {
            {
              "from": $y + "-" + ["01-01", "04-01", "07-01", "10-01"].index($q.number() - 1),
              "to": $y + "-" + ["03-31", "06-30", "09-30", "12-31"].index($q.number() - 1),
              "slug": $y + "-q" + $q,
              "label": $q + ". štvrťrok " + $y
            }
          } else { null }
        }
        map period {
          let t = this.table
          let r = this.row
          root = if $t.fixed.or("") != "" { $t.fixed.apply("year") }
            else if $t.range.or("") != "" { $r.get($t.range).or("").string().re_find_all("[0-9]{4}").apply("range") }
            else if $t.quarter.or("") != "" { [$r.get($t.year).or("").string().trim(), $r.get($t.quarter).or("").string().trim()].apply("quarter") }
            else { $r.get($t.year).or("").string().trim().apply("year") }
        }
        let cells = this.map_each(t -> t.rows.or([]).filter(r -> if t.only.or(null) == null { true } else {
          r.get(t.only.index(0)).or("").string().has_prefix(t.only.index(1))
        }).map_each(r -> t.values.map_each(v -> {
          "table": t.without("rows", "values"),
          "value": v,
          "district": $districts.get(r.get(t.area).or("").apply("fold")).or(null),
          "period": { "table": t, "row": r }.apply("period"),
          "number": r.get(v.index(0)).apply("number")
        }))).flatten().flatten()
        map reason {
          let v = this.value
          root = if this.district == null { "not a city district" }
            else if this.period == null { "no period" }
            else if this.number == null { "no number" }
            else if ($v.index(3) != null && this.number < $v.index(3)) || ($v.index(4) != null && this.number > $v.index(4)) { "out of range" }
            else { null }
        }
        let marked = $cells.map_each(c -> c.assign({
          "_drop": c.apply("reason"),
          "_id": "%s.%s.%s.%s".format(c.table.key, c.value.index(1), c.district.index(0).or(""), c.period.slug.or(""))
        }))
        let usable = $marked.filter(c -> c._drop == null)
        let once = $usable.unique(c -> c._id)
        let tally = $marked.filter(c -> c._drop != null).fold({}, item -> item.tally.assign({ item.value._drop: item.tally.get(item.value._drop).or(0) + 1 }))
        let dups = $usable.length() - $once.length()
        meta dropped = (if $dups > 0 { $tally.assign({ "duplicate": $dups }) } else { $tally }).format_json(no_indent: true)
        meta kept = $once.length().string()
        root = if $once.length() == 0 { throw("the statistics tables hold no usable figure: nothing is written") } else { $once }
    - log:
        level: INFO
        message: 'statistics: ${! @kept } figures kept, dropped by reason ${! @dropped }'
    - unarchive: { format: json_array }

    - mapping: |
        # The domain comes from the deployment, never from this file (PF-44).
        let t = this.table
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), this._id),
          "type": "KeyPerformanceIndicator",
          "name": { "type": "Property", "value": "%s, %s, %s".format(this.value.index(2), this.district.index(1), this.period.label) },
          "description": { "type": "Property", "value": $t.title },
          "process": { "type": "Property", "value": this.value.index(2) },
          "category": { "type": "Property", "value": ["quantitative"] },
          "kpiValue": { "type": "Property", "value": this.number },
          "calculationPeriod": { "type": "Property", "value": { "from": this.period.from, "to": this.period.to } },
          # Smart Data Models names hourly to yearly; the five-year fertility periods carry none.
          "calculationFrequency": if $t.frequency.or("") == "" { null } else { { "type": "Property", "value": $t.frequency } },
          "area": { "type": "Property", "value": this.district.index(1) },
          "organization": { "type": "Property", "value": "Hlavné mesto SR Bratislava" },
          "dataProvider": { "type": "Property", "value": "Hlavné mesto SR Bratislava, data.bratislava.sk (CC BY 4.0)" },
          "source": { "type": "Property", "value": "https://data.bratislava.sk/datasets/" + $t.item }
        }
        root = root.filter(entry -> entry.value != null)

    - split: { size: 500 }
    - archive: { format: json_array }
