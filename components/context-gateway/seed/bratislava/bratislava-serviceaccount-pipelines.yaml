apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipelines
  namespace: bratislava
  title: { sk: Zberové kanály Bratislavy, en: Bratislava ingestion pipelines }
spec:
  owner: { user: de300000-0000-4000-8000-000000000007 } # demo.bratislava
  purpose: The Bento streams of the bratislava project write the data.bratislava.sk datasets into the space bratislava, through its Endpoint and the pipelines-write Policy
  roles:
    - role: space-writer
      scope: { contextSpace: bratislava }
  credentials:
    - kind: oauth-client
      name: main
