apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pocty-vystahovanych-muzov-a-zien-z
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počty vysťahovaných mužov a žien z Bratislavy'
    en: 'Public read: Men and women moving away from Bratislava'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:pocty-vystahovanych-muzov-a-zien-z[.][a-z0-9.-]+$
