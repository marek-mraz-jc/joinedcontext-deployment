apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vekove-zlozenie-podiel
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Vekové zloženie obyvateľov najstaršej a najmladšej mestskej časti Bratislavy v roku 2021 (podiel)'
    en: 'Public read: Age structure of the oldest and the youngest city district of Bratislava in 2021 (share)'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:vekove-zlozenie-podiel[.][a-z0-9.-]+$
