apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pzi-rast
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Medziročný rast priamych zahraničných investícií v BSK v rokoch 2016 – 2019'
    en: 'Public read: Year-on-year growth of foreign direct investment in the Bratislava region 2016 to 2019'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:pzi-rast[.][a-z0-9.-]+$
