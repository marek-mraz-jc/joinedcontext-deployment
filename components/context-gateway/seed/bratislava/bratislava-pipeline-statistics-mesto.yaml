# The hub's tables of Bratislava as a whole as KeyPerformanceIndicator, one entity per figure, breakdown, area
# and period (T-5274), with the same mapping text as the statistics pipeline. The tables change once a
# year at most; a weekly run shows a new year within a week. 177 tables, 10,231 figures on 2026-10-24 (T-5274);
# on 2026-10-25 T-5435 added 11 tables (389 figures) and T-5671 15 (663 figures): 203 tables, 11,283 figures.
# Each batch's run fitted 256 MiB (docker --memory: killed at 192).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: statistics-mesto
  namespace: bratislava
  title: { sk: Štatistiky mesta Bratislava, en: Statistics of the City of Bratislava }
spec:
  class: auto
  period: 168h
  schedule: '45 4 * * 1'
  source:
    dataSourceRef: { kind: DataSource, name: bratislava-hub }
  targetEndpoint: urn:ngsi-ld:Endpoint:bratislava.sk:bratislava:bratislava
  output: { type: KeyPerformanceIndicator, mode: upsert }
  quotas: { maxMemoryMb: 256, cpuMillicores: 100 }
