# The hub's tables of Bratislava as a whole as KeyPerformanceIndicator, one entity per figure, breakdown, area
# and period (T-5274), with the same mapping text as the statistics pipeline. The tables change once a
# year at most; a weekly run shows a new year within a week. 177 tables, 10,231 figures on 2026-10-24;
# on 2026-10-25 T-5435 added 11 tables (389 figures), T-5671 15 (663), T-5672 6 (140), T-5673 6 (70)
# and T-5676 15 (1,977): 230 tables, about 13,500 figures. Each batch alone fitted 256 MiB (docker
# --memory: killed at 192); the merged list (T-5693) holds a third more figures, so 320 MiB until a
# run of it is measured.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: statistics-mesto
  namespace: bratislava
  title: { sk: Štatistiky mesta Bratislava, en: Statistics of the City of Bratislava }
spec:
  class: auto
  period: 168h
  schedule: '45 4 * * 1'
  source:
    dataSourceRef: { kind: DataSource, name: bratislava-hub }
  targetEndpoint: urn:ngsi-ld:Endpoint:bratislava.sk:bratislava:bratislava
  output: { type: KeyPerformanceIndicator, mode: upsert }
  quotas: { maxMemoryMb: 320, cpuMillicores: 100 }
