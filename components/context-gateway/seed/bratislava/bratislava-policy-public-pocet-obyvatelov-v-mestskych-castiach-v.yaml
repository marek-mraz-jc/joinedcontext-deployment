apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pocet-obyvatelov-v-mestskych-castiach-v
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet obyvateľov v mestských častiach Bratislavy v roku 2035'
    en: "Public read: Population of Bratislava's city districts in 2035"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:pocet-obyvatelov-v-mestskych-castiach-v[.][a-z0-9.-]+$
