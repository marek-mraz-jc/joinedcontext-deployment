apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-sposoby-riesenia-priestupkov-podla
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Spôsoby riešenia priestupkov v Bratislave podľa evidencie mestskej polície'
    en: 'Public read: How offences were settled in Bratislava, municipal police records'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:sposoby-riesenia-priestupkov-podla[.][a-z0-9.-]+$
