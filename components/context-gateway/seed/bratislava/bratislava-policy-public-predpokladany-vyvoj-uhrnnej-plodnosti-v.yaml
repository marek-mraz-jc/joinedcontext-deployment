apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-predpokladany-vyvoj-uhrnnej-plodnosti-v
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Predpokladaný vývoj úhrnnej plodnosti v mestských častiach Bratislavy vo vybraných rokoch'
    en: "Public read: Expected total fertility in Bratislava's city districts in selected years"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:predpokladany-vyvoj-uhrnnej-plodnosti-v[.][a-z0-9.-]+$
