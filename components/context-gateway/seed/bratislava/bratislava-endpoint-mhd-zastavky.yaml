# One catalogue dataset (T-4344, T-5273): GtfsStop of the space bratislava, read through
# its own Policy, which narrows the space's public read to them.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: bratislava-mhd-zastavky
  namespace: bratislava
  title: { sk: Zastávky MHD — Bratislava, en: Public transport stops — Bratislava }
  description:
    sk: >-
      Nástupištia zastávok mestskej hromadnej dopravy Dopravného podniku Bratislava s názvom, číslom zastávky, písmenom nástupišťa a tarifným pásmom, z cestovného poriadku GTFS, obnovované každú noc. Typ Smart Data Models GtfsStop. Vynechané sú nástupištia bez polohy, mimo Bratislavy a zopakované. Zdroj: Dopravný podnik Bratislava, CC BY 4.0.
    en: >-
      The stop platforms of Dopravný podnik Bratislava's public transport with their name, stop number, platform letter and fare zone, from the GTFS timetable, refreshed nightly. Smart Data Models type GtfsStop. Left out: platforms without a position, outside Bratislava and repeated ones. Source: Dopravný podnik Bratislava, CC BY 4.0.
spec:
  contextSpaceRef: bratislava
  slug: cbinyxsnezijhqjvpvisrzdcki3wyx2i
  audience: public
  policyRef: urn:ngsi-ld:Policy:bratislava.sk:bratislava:public-mhd-zastavky
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  catalog:
    # Off the catalogue (T-5788, owner order 2026-10-26: an empty dataset leaves it): on 2026-10-26
    # dev and prod hold 0 GtfsStop, although the mapping turns today's zip into 1,378 platforms: mhd-gtfs writes nothing.
    # The harvest feeds leave it out (EP-139); publish it again once prod holds data.
    harvest: false
    # The publisher is the Project's spec.catalog (T-4596). A timetable network: no record names a person.
    personalData: does-not-contain
    license: CC_BY_4_0
    attribution:
      sk: 'Zdroj: Dopravný podnik Bratislava, a.s., data.bratislava.sk, CC BY 4.0'
      en: 'Source: Dopravný podnik Bratislava, a.s., data.bratislava.sk, CC BY 4.0'
    themes: [TRAN]
    keywords:
      sk: [Bratislava, MHD, zastávky, GTFS]
      en: [Bratislava, public transport, stops, GTFS]
    spatial:
      - SK010
      - https://sws.geonames.org/3060972/
    # DPB republishes the timetable with each change, read nightly.
    frequency: IRREG
    source:
      - url: https://data.bratislava.sk/datasets/aba12fd2cbac4843bc7406151bc66106
        title:
          sk: Cestovné poriadky MHD vo formáte GTFS (data.bratislava.sk)
          en: Bratislava public transport timetables as GTFS (data.bratislava.sk)
        description:
          sk: 'Dataset Hlavného mesta SR Bratislava na portáli otvorených dát data.bratislava.sk: Cestovné poriadky MHD vo formáte GTFS. Licencia CC BY 4.0.'
          en: 'A dataset of the City of Bratislava on its open data portal data.bratislava.sk: Bratislava public transport timetables as GTFS. Licence CC BY 4.0.'
    pipelineRef: { kind: Pipeline, name: mhd-gtfs }
