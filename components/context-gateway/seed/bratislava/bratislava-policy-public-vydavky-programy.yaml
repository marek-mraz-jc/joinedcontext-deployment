apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vydavky-programy
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Bežné a kapitálové výdavky mesta Bratislava podľa programovej štruktúry'
    en: 'Public read: Current and capital expenditure of Bratislava by programme'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:vydavky-programy[.][a-z0-9.-]+$
