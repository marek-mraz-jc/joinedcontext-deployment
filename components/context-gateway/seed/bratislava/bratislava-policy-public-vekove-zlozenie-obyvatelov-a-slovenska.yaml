apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vekove-zlozenie-obyvatelov-a-slovenska
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Vekové zloženie obyvateľov Bratislavy a Slovenska v roku 2021'
    en: 'Public read: Age structure of the population of Bratislava and Slovakia in 2021'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:vekove-zlozenie-obyvatelov-a-slovenska[.][a-z0-9.-]+$
