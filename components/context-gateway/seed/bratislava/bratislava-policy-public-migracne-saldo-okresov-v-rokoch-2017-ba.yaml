apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-migracne-saldo-okresov-v-rokoch-2017-ba
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Migračné saldo okresov Bratislavy v rokoch 2017 – 2021 podľa veku a pohlavia (muži)'
    en: "Public read: Net migration of Bratislava's districts by age, 2017-2021 (men)"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:migracne-saldo-okresov-v-rokoch-2017-ba[.][a-z0-9.-]+$
