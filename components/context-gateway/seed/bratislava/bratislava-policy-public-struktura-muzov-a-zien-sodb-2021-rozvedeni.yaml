apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-struktura-muzov-a-zien-sodb-2021-rozvedeni
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Štruktúra mužov a žien podľa rodinného stavu a veku v BA a SR podľa SODB 2021 (rozvedení)'
    en: 'Public read: Men and women by marital status and age in Bratislava and Slovakia, 2021 census (divorced)'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:struktura-muzov-a-zien-sodb-2021-rozvedeni[.][a-z0-9.-]+$
