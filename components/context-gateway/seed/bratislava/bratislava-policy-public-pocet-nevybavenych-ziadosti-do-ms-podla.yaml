apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pocet-nevybavenych-ziadosti-do-ms-podla
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet nevybavených žiadostí do MŠ v Bratislave podľa typu zriaďovateľa v rokoch 2003 - 2021'
    en: 'Public read: Unmet kindergarten applications in Bratislava by type of founder, 2003-2021'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:pocet-nevybavenych-ziadosti-do-ms-podla[.][a-z0-9.-]+$
