apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-struktura-muzov-podla-najvyssieho
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Štruktúra mužov podľa najvyššieho dosiahnutého vzdelania a veku v BA podľa SODB 2021'
    en: 'Public read: Men by highest education attained and age in Bratislava, 2021 census'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:struktura-muzov-podla-najvyssieho[.][a-z0-9.-]+$
