apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pocet-zamestnancov-v-stavebnictve-v
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet zamestnancov v stavebníctve v podnikoch s viac ako 20 zamestnancami v r. 2008 - 2021'
    en: 'Public read: Employees in construction companies with more than 20 employees, 2008-2021'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:pocet-zamestnancov-v-stavebnictve-v[.][a-z0-9.-]+$
