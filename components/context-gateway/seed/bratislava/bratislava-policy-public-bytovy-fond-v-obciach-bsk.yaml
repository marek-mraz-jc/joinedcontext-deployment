apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-bytovy-fond-v-obciach-bsk
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Vývoj bytového fondu v obciach BSK v rokoch 1980 – 2051'
    en: 'Public read: Housing stock in the municipalities of the Bratislava Region, 1980-2051'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:bytovy-fond-v-obciach-bsk[.][a-z0-9.-]+$
