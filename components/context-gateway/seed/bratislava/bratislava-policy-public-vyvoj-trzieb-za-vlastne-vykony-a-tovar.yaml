apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vyvoj-trzieb-za-vlastne-vykony-a-tovar
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Vývoj tržieb za vlastné výkony a tovar v obchode pohostinstve a ubytovaní v BA'
    en: 'Public read: Revenues for own output and goods in trade, catering and accommodation in Bratislava'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:vyvoj-trzieb-za-vlastne-vykony-a-tovar[.][a-z0-9.-]+$
