apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-podiel-trzieb-z-predaja-do-zahranicia-v
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Podiel tržieb z predaja do zahraničia v priemysle Bratislavy podľa odvetví v r. 2015-2021'
    en: "Public read: Share of export revenues in Bratislava's industry by industry, 2015-2021"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:podiel-trzieb-z-predaja-do-zahranicia-v[.][a-z0-9.-]+$
