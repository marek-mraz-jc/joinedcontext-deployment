apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-migracny-obrat-okresov-na-1-000
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Migračný obrat okresov Bratislavy (na 1 000 obyvateľov)'
    en: "Public read: Migration turnover of Bratislava's districts (per 1,000 inhabitants)"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:migracny-obrat-okresov-na-1-000[.][a-z0-9.-]+$
