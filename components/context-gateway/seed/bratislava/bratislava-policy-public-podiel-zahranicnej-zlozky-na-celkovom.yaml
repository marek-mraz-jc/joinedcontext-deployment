apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-podiel-zahranicnej-zlozky-na-celkovom
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Podiel zahraničnej zložky na celkovom migračnom obrate mestských častí BA (v %)'
    en: "Public read: Share of the international component in total migration turnover of Bratislava's city districts (%)"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:podiel-zahranicnej-zlozky-na-celkovom[.][a-z0-9.-]+$
