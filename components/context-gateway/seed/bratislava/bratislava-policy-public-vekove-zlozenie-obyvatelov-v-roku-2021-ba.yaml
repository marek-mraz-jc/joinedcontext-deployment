apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vekove-zlozenie-obyvatelov-v-roku-2021-ba
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Vekové zloženie obyvateľov Bratislavy v roku 2021 a v roku 2050 (stredný scenár)'
    en: "Public read: Age structure of Bratislava's population in 2021 and 2050 (medium scenario)"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:vekove-zlozenie-obyvatelov-v-roku-2021-ba[.][a-z0-9.-]+$
