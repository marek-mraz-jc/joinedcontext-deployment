apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-standardizovane-miery-umrtnosti-zien-na
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Štandardizované miery úmrtnosti žien na vybrané hlavné skupiny príčin smrti v Bratislave'
    en: 'Public read: Standardised mortality rates of women by main groups of causes of death in Bratislava'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:standardizovane-miery-umrtnosti-zien-na[.][a-z0-9.-]+$
