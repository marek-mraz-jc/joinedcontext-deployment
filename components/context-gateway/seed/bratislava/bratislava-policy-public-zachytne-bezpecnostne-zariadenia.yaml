apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-zachytne-bezpecnostne-zariadenia
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Typy záchytného bezpečnostného zariadenia podľa triedy cestnej komunikácie a správcu'
    en: 'Public read: Road safety barriers by road class and road manager, 2016'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:zachytne-bezpecnostne-zariadenia[.][a-z0-9.-]+$
