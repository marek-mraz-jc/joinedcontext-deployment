apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-nehody-s-nasledkom-na-zdravi
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet dopravných nehôd s následkom na živote alebo zdraví'
    en: 'Public read: Traffic accidents with injury or death'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:nehody-s-nasledkom-na-zdravi[.][a-z0-9.-]+$
