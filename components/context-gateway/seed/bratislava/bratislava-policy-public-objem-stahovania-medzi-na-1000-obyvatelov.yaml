apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-objem-stahovania-medzi-na-1000-obyvatelov
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Objem sťahovania medzi mestskými časťami v rámci jedného okresu na 1000 obyvateľov'
    en: 'Public read: Moves between city districts within one district per 1,000 inhabitants'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:objem-stahovania-medzi-na-1000-obyvatelov[.][a-z0-9.-]+$
