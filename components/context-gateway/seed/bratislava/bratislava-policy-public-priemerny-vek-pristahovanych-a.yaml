apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-priemerny-vek-pristahovanych-a
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Priemerný vek prisťahovaných a vysťahovaných do a z Bratislavy podľa pohlaví'
    en: 'Public read: Average age of people moving to and from Bratislava by sex'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:priemerny-vek-pristahovanych-a[.][a-z0-9.-]+$
