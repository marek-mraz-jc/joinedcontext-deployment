# The mapping of the places pipeline (T-5274, T-5444): the hub's tables of places as Smart Data
# Models PointOfInterest, one table a dataset: barrier-free places, lifelong-learning providers,
# needle drop points (fixpointy), services for homeless people, veterinary and animal facilities
# and cooling places carry their own coordinates (columns, or the layer's point geometry read in
# WGS 84); the city's contact points, schools, kindergartens, art schools and leisure centres
# carry an address only, placed by `positions` below, which seeds/bratislava-places/geocode.py
# writes from the national address register. The pipeline never calls a geocoder.
# One pipeline shape for every such table: a table is one line of `tables` below. The
# bratislava-hub DataSource answers the hub's list of services; a table the list no longer names
# is logged and left out. Each table is read with one query of at most 2,000 rows; an answer that
# says it holds more fails that table instead of writing part of it. Nothing here deletes.
pipeline:
  processors:
    - mapping: |
        # key: the id prefix and the dataset's Endpoint idPattern; path: the Feature Service as the
        # hub's URL writes it; category: the code its PointOfInterest carries first; the other
        # members name the table's columns. The lifelong-learning table writes the latitude in X
        # and the longitude in Y; the barrier-free table writes them the other way round, both with
        # a decimal comma or point (Research/bratislava-open-data.md, section 5). `layer` is the
        # Feature Service layer when it is not 0; `_x` and `_y` are the layer's own point geometry;
        # a table with `geocoded` takes its position from `positions` by its address.
        let tables = [
          { "key": "bezbarierovost", "item": "ccaa77c555054b60937d1c532ac85844", "path": "Bezbari%C3%A9rovos%C5%A5_v_meste_Bratislava", "category": "barrier-free",
            "name": "názov", "street": "adresa", "district": "mestská_časť", "kind": "poddruh", "text": "pohyb_text", "web": "web_link_1", "lat": "Y", "lon": "X" },
          { "key": "celozivotne-vzdelavanie", "item": "346027a40f62416aba2f5b413d5bb68c", "path": "Datab%C3%A1za_poskytovate%C4%BEov_celo%C5%BEivotn%C3%A9ho_vzdel%C3%A1vania_v_Bratislave", "category": "lifelong-learning",
            "name": "Názov", "street": "Ulica", "number": "Číslo", "district": "Mestská_časť", "kind": "Oblasť", "web": "Web", "lat": "X", "lon": "Y" },
          { "key": "fixpointy", "item": "a8ef3fba66c14f9aa6664ee8549dc2f7", "path": "Fixpointy_pre_%C4%BEud%C3%AD_v_n%C3%BAdzi_v_Bratislave", "category": "needle-drop-point",
            "name": "Nazov", "street": "Adresa", "district": "mestska_cast", "text": "popis_pdf", "lat": "Latitude", "lon": "Longitude" },
          { "key": "sluzby-bez-domova", "item": "5242099b24bc4bf68ea766ca55162a08", "path": "Slu%C5%BEby_pre_%C4%BEud%C3%AD_bez_domova_v_Bratislave", "category": "homeless-services",
            "name": "Nazov", "street": "Adresa", "district": "Mestska_cast", "kind": "Tagy", "text": "Popis", "web": "Web", "lat": "Latitude", "lon": "Longitude" },
          { "key": "veterinarne-zariadenia", "item": "48b4110561f54105906f6ac11e225fd1", "path": "Chovn%C3%A9_a_veterin%C3%A1rne_zariadenia", "layer": 4, "category": "animal-care",
            "name": "Názov_zariadenia_1", "street": "Adresa_zariadenia_1", "kind": "Typ_zariadenia_1", "text": "Druh_zvierat_1", "lat": "_y", "lon": "_x" },
          { "key": "ochladzovacie-miesta", "item": "45f653d43e5c4840a44b7cbaf0161037", "path": "Ochladzovacie_miesta_v_Bratislave_%28Ochla%C4%8F_sa_%29", "category": "cooling-place",
            "name": "FIRMA", "street": "ADRESA", "text": "POPIS", "web": "WEB", "geocoded": true },
          { "key": "kontaktne-miesta", "item": "37c53db38ff14679b5d787f06cf1e9f7", "path": "Kontaktn%C3%A9_miesta_Magistr%C3%A1tu_hlavn%C3%A9ho_mesta_SR_BA", "category": "city-contact-point",
            "name": "Name", "street": "FullAddress", "web": "ServiceUrl", "geocoded": true },
          { "key": "vzdelavacie-institucie", "item": "38063d52342c451f92643ae5e6e4a337", "path": "S%C3%BAbor_vzdel%C3%A1vac%C3%ADch_in%C5%A1tit%C3%BAci%C3%AD_v_r%C3%A1mci_mesta_Bratislava", "category": "education",
            "name": "Vzdelávacia_inštitúcia", "street": "Ulica", "district": "Mestská_časť", "kind": "Typ", "geocoded": true },
          { "key": "centra-volneho-casu", "item": "f4b1e8b6888e41c6ae8cb728075bd082", "path": "Centrum_volneho_casu_zoznam_2024", "category": "leisure-centre",
            "name": "Názov", "street": "Lokalita", "district": "Mestská_časť", "kind": "Typ_zariadenia", "web": "Web_centra", "geocoded": true },
          { "key": "materske-skoly", "item": "3cca7b5834cd479597db95ac562ba1dd", "path": "Zoznam_matersk%C3%BDch_%C5%A1k%C3%B4l_v_roku_2026", "category": "kindergarten",
            "name": "nazov", "street": "adresa", "district": "mestska_cast", "web": "www", "geocoded": true },
          { "key": "zakladne-umelecke-skoly", "item": "49d5049003754b5984721879b842cf24", "path": "Zakladna_umelecka_skola_zoznam_2024", "category": "art-school",
            "name": "Názov", "street": "Lokalita", "district": "Mestská_časť", "web": "Web_školy", "geocoded": true },
          { "key": "zakladne-skoly", "item": "f1aeacee4f5d47778cebe21be0cb18dd", "path": "Zakladna_skola_zoznam_2025", "category": "primary-school",
            "name": "Názov_zriadenia", "street": "Lokalita", "district": "Mestská_časť", "kind": "Typ_školského_zariadenia", "web": "Web_školy", "geocoded": true }
        ]
        let listed = this.services.or([]).map_each(s -> s.name.or(""))
        let found = $tables.filter(t -> $listed.contains(t.path.unescape_url_query()))
        meta missing = $tables.filter(t -> !$listed.contains(t.path.unescape_url_query())).map_each(t -> t.key).join(", ")
        root = if content().length() > 1048576 {
          throw("the hub's list of services is %d bytes, more than the 1 MiB read".format(content().length()))
        } else if this.error.or(null) != null {
          throw("the hub refused its list of services: %s".format(this.error.message.or("no reason given")))
        } else if $found.length() == 0 {
          throw("the hub lists none of the tables of places: nothing is written")
        } else { $found }
    - switch:
        - check: '@missing != ""'
          processors:
            - log:
                level: WARN
                message: 'places: the hub no longer lists ${! @missing }, left out of this run'
    - unarchive: { format: json_array }

    # One table a request; the path is the constant above, never text of an answer.
    - branch:
        request_map: |
          meta path = this.path
          meta layer = this.layer.or(0).string()
          root = ""
        processors:
          - sleep: { duration: '200ms' }
          - http:
              url: https://services8.arcgis.com/pRlN1m0su5BYaFAS/arcgis/rest/services/${! @path }/FeatureServer/${! @layer }/query?where=1%3D1&outFields=*&resultRecordCount=2000&returnGeometry=true&outSR=4326&f=json
              verb: GET
              headers:
                Accept: application/json
                User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public open data)
              timeout: 30s
              retries: 2
        result_map: |
          root.rows = if content().length() > 4194304 {
            throw("the table answer is over 4 MiB")
          } else if this.error.or(null) != null {
            throw("the hub refused the query: %s".format(this.error.message.or("no reason given")))
          } else if this.exceededTransferLimit.or(false) {
            throw("the table holds more than 2,000 rows, more than one read")
          } else { this.features.or([]).map_each(f -> f.attributes.assign(
            if f.geometry.x.or(null) == null { {} } else { { "_x": f.geometry.x, "_y": f.geometry.y } }
          )) }
    # A table the hub refuses is logged and left out of this run; the others still write.
    - catch:
        - log: { level: WARN, message: 'places: ${! json("key") } not read: ${! error() }' }
        - mapping: root = deleted()
    - archive: { format: json_array }

    # Plausibility (owner 2026-10-22T18:10Z): dropped and counted by reason, never guessed at: no
    # position; a point outside Bratislava and 1 km around it (0,0 and swapped coordinates land
    # there too); no name; one place twice (the same name and address, or the same name within
    # 20 m), the first kept.
    - mapping: |
        map coordinate {
          root = if this == null { null } else { this.string().trim().replace_all(",", ".").number().catch(null) }
        }
        map text {
