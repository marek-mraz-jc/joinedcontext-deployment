          "web": r.get(t.web.or("-")).apply("text"),
          "lat": r.get(t.lat.or("-")).apply("coordinate"),
          "lon": r.get(t.lon.or("-")).apply("coordinate")
        })).flatten().map_each(e -> if e.table.geocoded.or(false) {
          e.assign($positions.get((e.street + "|" + e.district).lowercase().hash("sha256").encode("hex").slice(0, 16)).or({}))
        } else { e })
        map reason {
          root = if this.lat == null || this.lon == null { "no position" }
            else if this.lon < 16.93 || this.lon > 17.3 || this.lat < 47.99 || this.lat > 48.28 { "outside Bratislava" }
            else if this.name == "" { "no name" }
            else { null }
        }
        # Metres at Bratislava's latitude: 111,320 m a degree north, 74,290 m a degree east.
        map near {
          let p = this.value
          let pts = if this.tally.key == $p._key { this.tally.pts } else { [] }
          let near = $pts.any(q -> (q.index(0) - $p.lat) * (q.index(0) - $p.lat) * 12392142400 + (q.index(1) - $p.lon) * (q.index(1) - $p.lon) * 5519004100 <= 400)
          root = if $near { this.tally.assign({ "dup": this.tally.dup.append($p._id) }) } else {
            { "key": $p._key, "pts": $pts.append([$p.lat, $p.lon]), "dup": this.tally.dup }
          }
        }
        let marked = $rows.map_each(e -> e.assign({
          "_drop": e.apply("reason"),
          "_id": e.table.key + "." + (e.name.lowercase() + "|" + e.street.lowercase()).hash("sha256").encode("hex").slice(0, 16)
        }))
        let usable = $marked.filter(e -> e._drop == null)
        let once = $usable.unique(e -> e._id)
        let keyed = $once.map_each(e -> e.assign({ "_key": e.table.key + "|" + e.name.lowercase() })).sort_by(e -> e._key)
        let near = $keyed.fold({ "key": "", "pts": [], "dup": [] }, item -> item.apply("near")).dup
        let kept = $once.filter(e -> !$near.contains(e._id))
        let tally = $marked.filter(e -> e._drop != null).fold({}, item -> item.tally.assign({ item.value._drop: item.tally.get(item.value._drop).or(0) + 1 }))
        let dups = $usable.length() - $kept.length()
        meta dropped = (if $dups > 0 { $tally.assign({ "duplicate": $dups }) } else { $tally }).format_json(no_indent: true)
        meta kept = $kept.length().string()
        root = if $kept.length() == 0 { throw("the tables of places hold no usable place: nothing is written") } else { $kept }
    - log:
        level: INFO
        message: 'places: ${! @kept } places kept, dropped by reason ${! @dropped }'
    - unarchive: { format: json_array }

    - mapping: |
        # The domain comes from the deployment, never from this file (PF-44). A web address
        # without its scheme ("www.3ec.sk") gets https; anything else that is no web address is
        # left out.
        let t = this.table
        let web = if this.web.re_match("^https?://[^\\s]+$") { this.web } else if this.web.re_match("^www\\.[^\\s/]+\\.[a-z]{2,}(/[^\\s]*)?$") { "https://" + this.web } else { null }
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("PointOfInterest", env("JC_ORG_DOMAIN"), env("JC_SPACE"), this._id),
          "type": "PointOfInterest",
          "name": { "type": "Property", "value": this.name },
          "category": { "type": "Property", "value": [$t.category].concat(if this.kind == "" { [] } else { [this.kind] }) },
          "description": if this.text == "" { null } else { { "type": "Property", "value": this.text } },
          "location": { "type": "GeoProperty", "value": {
            "type": "Point", "coordinates": [(this.lon * 1000000).round() / 1000000, (this.lat * 1000000).round() / 1000000]
          } },
          "address": { "type": "Property", "value": {
            "streetAddress": this.street,
            "addressLocality": "Bratislava",
            "district": this.district,
            "addressCountry": "SK"
          }.filter(entry -> entry.value != "") },
          "url": if $web == null { null } else { { "type": "Property", "value": $web } },
          "dataProvider": { "type": "Property", "value": "Hlavné mesto SR Bratislava, data.bratislava.sk (CC BY 4.0)" },
          "source": { "type": "Property", "value": "https://data.bratislava.sk/datasets/" + $t.item }
        }
        root = root.filter(entry -> entry.value != null)

    - split: { size: 500 }
    - archive: { format: json_array }
