apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vnutorna-priestorova-struktura-medzi
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Vnútorná priestorová štruktúra medzi mestskými časťami Bratislavy v rokoch 2001 - 2051 (v %)'
    en: "Public read: Internal spatial structure between Bratislava's city districts, 2001-2051 (%)"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:vnutorna-priestorova-struktura-medzi[.][a-z0-9.-]+$
