apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-podiel-jednotlivych-odvetvi-na-trzbach
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Podiel jednotlivých odvetví na tržbách v priemysle Bratislavy v rokoch 2008 - 2021'
    en: 'Public read: Share of industries in industrial revenues of Bratislava, 2008-2021'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:podiel-jednotlivych-odvetvi-na-trzbach[.][a-z0-9.-]+$
