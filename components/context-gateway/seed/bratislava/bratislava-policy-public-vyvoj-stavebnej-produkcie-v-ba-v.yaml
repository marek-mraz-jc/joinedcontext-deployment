apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vyvoj-stavebnej-produkcie-v-ba-v
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Vývoj stavebnej produkcie v BA v podnikoch s viac ako 20 zamestnancami'
    en: 'Public read: Construction output in Bratislava in companies with more than 20 employees'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:vyvoj-stavebnej-produkcie-v-ba-v[.][a-z0-9.-]+$
