apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-ziaci-sportovych-tried-podla-sportu
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet žiakov športových tried stredných športových škôl podľa druhu športu'
    en: 'Public read: Pupils of the sports classes of sports secondary schools by sport'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:ziaci-sportovych-tried-podla-sportu[.][a-z0-9.-]+$
