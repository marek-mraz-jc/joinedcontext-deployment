apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-uhrnna-sobasnost-muzov-v-okresoch-v
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Úhrnná sobášnosť mužov v okresoch Bratislavy v obdobiach rokov 2000 – 2021'
    en: "Public read: Total first marriage rate of men in Bratislava's districts, 2000-2021"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:uhrnna-sobasnost-muzov-v-okresoch-v[.][a-z0-9.-]+$
