apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vzdelanostna-struktura-zien-vo-veku-15
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Vzdelanostná štruktúra žien vo veku 15 a viac rokov v mestských častiach BA (SODB 2021)'
    en: "Public read: Educational attainment of women aged 15 and over in Bratislava's city districts (2021 census)"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:vzdelanostna-struktura-zien-vo-veku-15[.][a-z0-9.-]+$
