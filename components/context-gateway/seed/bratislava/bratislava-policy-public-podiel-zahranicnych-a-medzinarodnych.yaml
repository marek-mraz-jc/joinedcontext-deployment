apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-podiel-zahranicnych-a-medzinarodnych
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Podiel zahraničných a medzinárodných podnikov na celkovom počte podľa SK-NACE'
    en: 'Public read: Share of foreign and international companies in the total by SK-NACE'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:podiel-zahranicnych-a-medzinarodnych[.][a-z0-9.-]+$
