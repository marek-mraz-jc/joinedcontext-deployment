apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-prispevky-dlzka-zivota-muzi-roky
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Príspevky k zmene strednej dĺžky života pri narodení mužov v okresoch BA'
    en: "Public read: Contributions to the change of male life expectancy at birth in Bratislava's okresy (years)"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:prispevky-dlzka-zivota-muzi-roky[.][a-z0-9.-]+$
