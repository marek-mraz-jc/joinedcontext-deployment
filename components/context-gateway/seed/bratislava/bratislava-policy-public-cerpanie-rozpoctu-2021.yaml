apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-cerpanie-rozpoctu-2021
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Priebežné čerpanie rozpočtu Hlavného mesta SR Bratislavy v roku 2021'
    en: 'Public read: Budget of the City of Bratislava in 2021 and 2022, approved, adjusted and drawn by economic class'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:cerpanie-rozpoctu-2021[.][a-z0-9.-]+$
