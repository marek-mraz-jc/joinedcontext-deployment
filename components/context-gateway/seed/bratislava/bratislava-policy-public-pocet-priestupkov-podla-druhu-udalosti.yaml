apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pocet-priestupkov-podla-druhu-udalosti
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet priestupkov podľa druhu udalosti v rokoch 2017 - 2022'
    en: 'Public read: Offences recorded by the city police by group of event, 2017-2022'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:pocet-priestupkov-podla-druhu-udalosti[.][a-z0-9.-]+$
