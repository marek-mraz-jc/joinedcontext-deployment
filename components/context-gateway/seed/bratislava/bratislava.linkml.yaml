  LaneDirection:
    permissible_values:
      forward: { description: Towards the first place the counter names. }
      backward:
        description: Towards the second place the counter names, or against a one-way street.
  StationStatus:
    permissible_values:
      working: { description: The station rents bikes and takes them back. }
      outOfService: { description: The station neither rents nor takes back bikes right now. }
  TransportMode:
    permissible_values:
      tram: { description: Tram (GTFS route type 0). }
      bus: { description: Bus (GTFS route type 3). }
      trolleybus: { description: Trolleybus (GTFS route type 11). }
  CoachStopCategory:
    description: The OnStreetParking `category` values the city's tourist coach stops map to, a subset of the Smart Data Model's enum.
    permissible_values:
      shortTerm: { description: 'A short-term stop: passengers get on and off.' }
      mediumTerm:
        description: A long-term stop where a coach waits (the Smart Data Model has no longer term).

classes:
  AirQualityObserved:
    class_uri: sdm:AirQualityObserved
    description: One air-quality station of Bratislava and its PM10 mean.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
    slots: [name, dateObserved, pm10]
  AdministrativeArea:
    class_uri: jc:AdministrativeArea
    description: >-
      One of the 17 city districts (mestské časti) of Bratislava, its outline and its ZÚJ code, as
      the Smart Data Model extension AdministrativeArea (PointOfInterest base).
    is_a: Entity
    annotations:
      upstream_source: https://github.com/marek-mraz/joinedcontext-deployment/blob/main/scripts/open-data/sdm/extensions/AdministrativeArea
    slots: [name, districtCode, dataProvider, source]
  PointOfInterest:
    class_uri: sdm:PointOfInterest
    description: >-
      One place a resident goes to: a barrier-free place, a lifelong-learning provider, a needle
      drop point or a service for homeless people, with its own coordinates from the hub.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest
    slots: [name, category, description, address, url, dataProvider, source]
  KeyPerformanceIndicator:
    class_uri: sdm:KeyPerformanceIndicator
    description: >-
      One figure of one hub table for one city district and one period: a count, a rate or an
      area, such as the offences the city police recorded in Nové Mesto in 2025.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
    slots:
      - name
      - description
      - process
      - category
      - kpiValue
      - calculationPeriod
      - calculationFrequency
      - area
      - organization
      - dataProvider
      - source

  PostalAddress:
    class_uri: schema:PostalAddress
    description: >-
      The value of `address`: a postal address, never an entity of its own (Smart Data Models'
      common schema).
    annotations:
      upstream_source: https://schema.org/PostalAddress
    slots: [streetAddress, district, addressLocality, addressCountry]
  KpiPeriod:
    class_uri: jc:KpiPeriod
    description: The value of `calculationPeriod`, never an entity of its own.
    slots: [from, to]
  TrafficFlowObserved:
    class_uri: sdm:TrafficFlowObserved
    description: >-
      One day of one of the city's counter sites in one direction: the cyclists or the motor
      vehicles it counted, from the hub's hourly tables. The site's name and place ride on the
      observation; the history of the days is the entity's temporal history.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - name
      - dateObserved
      - dateObservedFrom
      - dateObservedTo
      - intensity
      - vehicleType
      - laneDirection
      - dataProvider
      - source
  CrowdFlowObserved:
    class_uri: sdm:CrowdFlowObserved
    description: >-
      One day of one of the city's counter sites: the pedestrians it counted, each direction apart.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - name
      - dateObserved
      - dateObservedFrom
      - dateObservedTo
      - peopleCount
      - peopleCountTowards
      - peopleCountAway
      - dataProvider
      - source
  BikeHireDockingStation:
    class_uri: sdm:BikeHireDockingStation
    description: One Slovnaft BAjk station of nextbike's Bratislava system and what it holds right now.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - name
      - totalSlotNumber
      - availableBikeNumber
      - freeSlotNumber
      - status
      - dateModified
      - dataProvider
      - source
  GtfsStop:
    class_uri: sdm:GtfsStop
    description: >-
      One platform of a DPB stop (GTFS stop of location type 0): its name, the stop number and
      platform letter on its sign, its fare zone and where it is. The lines stopping there come
      through trips.txt and stop_times.txt, which are not read.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots: [name, stopCode, platformCode, zoneCode, dataProvider, source]
  GtfsRoute:
    class_uri: sdm:GtfsRoute
    description: One DPB line as its GTFS timetable gives it, every variant, with its number, what runs it, its colour and the agency.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots: [shortName, routeType, transportMode, routeColor, operatedBy, dataProvider, source]
  GtfsAgency:
    class_uri: sdm:GtfsAgency
    description: The transit agency DPB's GTFS timetable names, Dopravný podnik Bratislava itself.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots: [agencyName, page, timezone, language, phone, routes, dataProvider, source]
  OnStreetParking:
    class_uri: sdm:OnStreetParking
    description: One tourist coach stop of the city's list (data.bratislava.sk), placed by its name with OpenStreetMap; the list carries no coordinates.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Parking
    slots: [name, category, allowedVehicleType, totalSpotNumber, description, dataProvider, source]
    slot_usage:
      category: { range: CoachStopCategory }
