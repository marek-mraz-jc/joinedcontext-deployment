apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-priemerny-rozsah-zastavanych-ploch-na
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Priemerný rozsah zastavaných plôch na trvalo obývaný dom v Bratislave v rokoch 2001 - 2051 (v m²)'
    en: 'Public read: Average built-up area per permanently occupied house in Bratislava, 2001-2051 (m²)'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:priemerny-rozsah-zastavanych-ploch-na[.][a-z0-9.-]+$
