          {"name": "mestske-karantene-zariadenie-hradska", "item": "8ed75fd2aaca4abfaa21ff07890b759c", "path": "Mestsk%C3%A9%20karant%C3%A9ne%20zariadenie%20Hradsk%C3%A1%20-%20kr%C3%ADzov%C3%A9%20ubytovanie", "title": "Mestské karanténe zariadenie Hradská - krízové ubytovanie", "areas": "city", "year": "Rok", "month": "Mesiac", "values": [["Počet_prijatých_klientov", "pocet-prijatych-klientov", "Počet prijatých klientov", 0, null], ["Personál_TPP", "personal-tpp", "Personál TPP", 0, null], ["Obslužný_personál_dohodári", "obsluzny-personal-dohodari", "Obslužný personál (dohodári)", 0, null], ["Lekár", "lekar", "Lekár", 0, null], ["Zdravotná_sestra", "zdravotna-sestra", "Zdravotná sestra", 0, null], ["Dobrovoľníci", "dobrovolnici", "Dobrovoľníci", 0, null], ["Maximálna_kapacita_MKZ", "maximalna-kapacita-mkz", "Maximálna kapacita MKZ", 0, null]]},
          {"name": "pocet-deti-a-zariadeni-dalsieho-vzdelavania", "item": "dd0ac1c15c244c60b35eea88634553b3", "path": "Po%C4%8Det_det%C3%AD_a_dospievaj%C3%BAcich_a_zariaden%C3%AD_pre_%C4%8Fal%C5%A1ie_vzdel%C3%A1vanie_pod%C4%BEa_typu_zria%C4%8Fovate%C4%BEa", "title": "Počet detí a dospievajúcich a zariadení pre ďalšie vzdelávanie podľa typu zriaďovateľa v Bratislave", "areas": "city", "fixed": "2021", "by": ["VZDELAVACIE_ZARIADENIE", "ZRIADOVATEL"], "values": [["POCET", "pocet", "Počet detí a dospievajúcich a zariadení pre ďalšie vzdelávanie", 0, null]]},
          {"name": "pocet-deti-a-specialnych-skol", "item": "629aae1ae9ce45bc8e521735736ed01e", "path": "Po%C4%8Det_det%C3%AD_a_dospievaj%C3%BAcich_a_%C5%A1peci%C3%A1lnych_%C5%A1k%C3%B4l_a_%C5%A1kolsk%C3%BDch_zariaden%C3%AD_pod%C4%BEa_typu_zria", "title": "Počet detí a dospievajúcich a špeciálnych škôl a školských zariadení podľa typu zriaďovateľa v Bratislave", "areas": "city", "fixed": "2021", "by": ["SKOLSKE_ZARIADENIE", "ZRIADOVATEL"], "values": [["POCET", "pocet", "Počet detí a dospievajúcich a špeciálnych škôl a školských zariadení", 0, null]]}
        ]
        let listed = this.services.or([]).map_each(s -> s.name.or(""))
        let found = $tables.filter(t -> $listed.contains(t.path.unescape_url_query()))
        let missing = $tables.filter(t -> !$listed.contains(t.path.unescape_url_query())).map_each(t -> t.name)
        meta missing = $missing.join(", ")
        root = if content().length() > 1048576 {
          throw("the hub's list of services is %d bytes, more than the 1 MiB read".format(content().length()))
        } else if this.error.or(null) != null {
          throw("the hub refused its list of services: %s".format(this.error.message.or("no reason given")))
        } else if $found.length() == 0 {
          throw("the hub lists none of the statistics tables: nothing is written")
        } else { $found }
    - switch:
        - check: '@missing != ""'
          processors:
            - log:
                level: WARN
                message: 'statistics: the hub no longer lists ${! @missing }, left out of this run'
    - unarchive: { format: json_array }

    # One table a request; the path is the constant above, never text of an answer.
    - branch:
        request_map: |
          meta path = this.path
          root = ""
        processors:
          - sleep: { duration: '200ms' }
          - http:
              url: https://services8.arcgis.com/pRlN1m0su5BYaFAS/arcgis/rest/services/${! @path }/FeatureServer/0/query?where=1%3D1&outFields=*&resultRecordCount=2000&f=json
              verb: GET
              headers:
                Accept: application/json
                User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public open data)
              timeout: 30s
              retries: 2
        result_map: |
          root.rows = if content().length() > 4194304 {
            throw("the table answer is over 4 MiB")
          } else if this.error.or(null) != null {
            throw("the hub refused the query: %s".format(this.error.message.or("no reason given")))
          } else if this.exceededTransferLimit.or(false) {
            throw("the table holds more than 2,000 rows, more than one read")
          } else { this.features.or([]).map_each(f -> f.attributes) }
    # A table the hub refuses is logged and left out of this run; the others still write.
    - catch:
        - log: { level: WARN, message: 'statistics: ${! json("name") } not read: ${! error() }' }
        - mapping: root = deleted()
    - archive: { format: json_array }

    # Plausibility (owner 2026-10-22T18:10Z): dropped and counted by reason, never guessed at: an
    # area outside the city; no period; a breakdown cell left empty; a figure that is no number or
    # lies outside its bounds; one figure twice for the same breakdown, area and period (the first
    # is kept).
    - mapping: |
        # The 17 city districts by their name folded to ASCII, with their ZÚJ code (the
        # AdministrativeArea id the districts pipeline writes). The hub writes names three ways:
        # with diacritics, without them and abbreviated ("D. N. Ves", dots dropped: a key with a dot
        # is a path to `get`); the mosquito table writes č as è and ň as ò (a cp1250 text read as
        # Latin-1), folded here too, and its 2025 figures with a space between thousands.
        let districts = {
          "stare mesto": ["528595", "Staré Mesto"], "podunajske biskupice": ["529311", "Podunajské Biskupice"],
          "p biskupice": ["529311", "Podunajské Biskupice"], "ruzinov": ["529320", "Ružinov"], "vrakuna": ["529338", "Vrakuňa"],
          "nove mesto": ["529346", "Nové Mesto"], "raca": ["529354", "Rača"], "vajnory": ["529362", "Vajnory"],
          "devinska nova ves": ["529371", "Devínska Nová Ves"], "d n ves": ["529371", "Devínska Nová Ves"],
          "dubravka": ["529389", "Dúbravka"], "karlova ves": ["529397", "Karlova Ves"], "devin": ["529401", "Devín"],
          "lamac": ["529419", "Lamač"], "zahorska bystrica": ["529427", "Záhorská Bystrica"], "z bystrica": ["529427", "Záhorská Bystrica"],
          "cunovo": ["529435", "Čunovo"], "jarovce": ["529443", "Jarovce"], "petrzalka": ["529460", "Petržalka"], "rusovce": ["529494", "Rusovce"]
        }
        # The five okresy (LAU 1, Bratislava I to V, codes 101 to 105), written in Roman or Arabic
        # numerals; the city as a whole by its municipality code. A table of the whole region keeps
        # the Bratislava okresy, a table of Bratislava beside Slovakia the Bratislava rows.
        let okresy = {
          "bratislava i": ["101", "Bratislava I"], "bratislava ii": ["102", "Bratislava II"], "bratislava iii": ["103", "Bratislava III"],
          "bratislava iv": ["104", "Bratislava IV"], "bratislava v": ["105", "Bratislava V"], "bratislava 1": ["101", "Bratislava I"],
          "bratislava 2": ["102", "Bratislava II"], "bratislava 3": ["103", "Bratislava III"], "bratislava 4": ["104", "Bratislava IV"],
          "bratislava 5": ["105", "Bratislava V"]
        }
        # A table without an area column ("*") is the city's, and so is its row named after the city.
        let city = ["582000", "Bratislava"]
        map fold {
          root = this.string().lowercase().replace_all_many([
            "á", "a", "ä", "a", "à", "a", "â", "a", "č", "c", "ç", "c", "ď", "d", "é", "e", "ě", "e", "ë", "e", "í", "i", "ĺ", "l",
            "ľ", "l", "ň", "n", "ó", "o", "ô", "o", "ö", "o", "ő", "o", "ŕ", "r", "ř", "r", "š", "s", "ť", "t", "ú", "u", "ü", "u",
            "ű", "u", "ů", "u", "ý", "y", "ž", "z", "è", "c", "ò", "n", ".", ""
          ]).re_replace_all("\\s+", " ").trim()
        }
        map segment {
          root = this.apply("fold").re_replace_all("[^a-z0-9]+", "-").trim("-")
        }
        map number {
          root = if this == null { null } else { this.string().re_replace_all("[\\s %]", "").replace_all(",", ".").number().catch(null) }
        }
        map years {
          let v = this.string().trim()
          let y = $v.re_find_all("(19|20)[0-9]{2}")
          root = if $v.re_match("^(19|20)[0-9]{2}$") {
            { "from": $v + "-01-01", "to": $v + "-12-31", "slug": $v, "label": $v, "frequency": "yearly" }
          } else if $v.re_match("^(19|20)[0-9]{2}\\s*[–-]\\s*(19|20)[0-9]{2}$") {
            { "from": $y.index(0) + "-01-01", "to": $y.index(1) + "-12-31", "slug": $y.join("-"), "label": $y.join("–") }
          } else { null }
        }
        map quarter {
          let y = this.index(0)
          let q = this.index(1)
          root = if $y.re_match("^(19|20)[0-9]{2}$") && $q.re_match("^[1-4]$") {
            {
              "from": $y + "-" + ["01-01", "04-01", "07-01", "10-01"].index($q.number() - 1),
              "to": $y + "-" + ["03-31", "06-30", "09-30", "12-31"].index($q.number() - 1),
              "slug": $y + "-q" + $q,
              "label": $q + ". štvrťrok " + $y,
              "frequency": "quarterly"
            }
          } else { null }
        }
        # A month column holds 1 to 12, with or without a leading zero; anything else is no period.
        map month {
          let y = this.index(0)
          let m = this.index(1).trim_prefix("0")
          root = if $y.re_match("^(19|20)[0-9]{2}$") && $m.re_match("^([1-9]|1[0-2])$") {
            {
              "from": "%s-%02d-01".format($y, $m.number().int64()),
              "to": "%s-%02d-%s".format($y, $m.number().int64(), if $m == "2" && $y.number().int64() % 4 == 0 && ($y.number().int64() % 100 != 0 || $y.number().int64() % 400 == 0) { "29" } else {
                ["31", "28", "31", "30", "31", "30", "31", "31", "30", "31", "30", "31"].index($m.number().int64() - 1)
              }),
              "slug": "%s-%02d".format($y, $m.number().int64()),
              "label": "%d/%s".format($m.number().int64(), $y),
              "frequency": "monthly"
            }
          } else { null }
        }
        map period {
          let t = this.table
          let r = this.row
          root = if $t.fixed.or("") != "" { $t.fixed.apply("years") }
            else if $t.quarter.or("") != "" { [$r.get($t.year).or("").string().trim(), $r.get($t.quarter).or("").string().trim()].apply("quarter") }
            else if $t.month.or("") != "" { [$r.get($t.year).or("").string().trim(), $r.get($t.month).or("").string().trim()].apply("month") }
            else { $r.get($t.year).or("").apply("years") }
        }
        map areaname {
          root = if this.table.area.or("") == "" { "*" } else { this.row.get(this.table.area).or("").apply("fold") }
        }
        map breakdown {
          let r = this.row
          root = this.table.by.or([]).map_each(c -> $r.get(c).or("").string().trim())
        }
        let cells = this.map_each(t -> t.rows.or([]).filter(r -> if t.only.or(null) == null { true } else {
          r.get(t.only.index(0)).or("").string().has_prefix(t.only.index(1))
        }).map_each(r -> t.values.map_each(v -> {
          "table": t.without("rows", "values"),
          "value": v,
          "area": if t.areas == "district" { $districts.get({ "table": t, "row": r }.apply("areaname")).or(null) }
            else if t.areas == "okres" { $okresy.get({ "table": t, "row": r }.apply("areaname")).or(null) }
            else if ["*", $city.index(1).lowercase()].contains({ "table": t, "row": r }.apply("areaname")) { $city } else { null },
          "by": { "table": t, "row": r }.apply("breakdown"),
          "period": { "table": t, "row": r }.apply("period"),
          "number": r.get(v.index(0)).apply("number")
        }))).flatten().flatten()
        map reason {
          let v = this.value
          root = if this.area == null {
              { "district": "not a city district", "okres": "not a Bratislava okres", "city": "not Bratislava" }.get(this.table.areas)
            }
            else if this.period == null { "no period" }
            else if this.by.map_each(b -> b.apply("segment")).contains("") { "no breakdown" }
            else if this.number == null { "no number" }
            else if ($v.index(3) != null && this.number < $v.index(3)) || ($v.index(4) != null && this.number > $v.index(4)) { "out of range" }
            else { null }
        }
        let marked = $cells.map_each(c -> c.assign({
          "_drop": c.apply("reason"),
          "_id": ([c.table.name, c.value.index(1)].concat(c.by.map_each(b -> b.apply("segment"))).concat([c.area.index(0).or(""), c.period.slug.or("")])).join(".")
        }))
        let usable = $marked.filter(c -> c._drop == null)
        let once = $usable.unique(c -> c._id)
        let tally = $marked.filter(c -> c._drop != null).fold({}, item -> item.tally.assign({ item.value._drop: item.tally.get(item.value._drop).or(0) + 1 }))
        let dups = $usable.length() - $once.length()
        meta dropped = (if $dups > 0 { $tally.assign({ "duplicate": $dups }) } else { $tally }).format_json(no_indent: true)
        meta kept = $once.length().string()
        root = if $once.length() == 0 { throw("the statistics tables hold no usable figure: nothing is written") } else { $once }
    - log:
        level: INFO
        message: 'statistics: ${! @kept } figures kept, dropped by reason ${! @dropped }'
    - unarchive: { format: json_array }

    - mapping: |
        # The domain comes from the deployment, never from this file (PF-44).
        let t = this.table
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), this._id),
          "type": "KeyPerformanceIndicator",
          "name": { "type": "Property", "value": ([this.value.index(2)].concat(this.by).concat([this.area.index(1), this.period.label])).join(", ") },
          "description": { "type": "Property", "value": $t.title },
          "process": { "type": "Property", "value": this.value.index(2) },
          "category": { "type": "Property", "value": ["quantitative"] },
          "kpiValue": { "type": "Property", "value": this.number },
          "calculationPeriod": { "type": "Property", "value": { "from": this.period.from, "to": this.period.to } },
          # Smart Data Models names hourly to yearly; a period of several years carries none.
          "calculationFrequency": if this.period.frequency.or("") == "" { null } else { { "type": "Property", "value": this.period.frequency } },
          "area": { "type": "Property", "value": this.area.index(1) },
          "organization": { "type": "Property", "value": "Hlavné mesto SR Bratislava" },
          "dataProvider": { "type": "Property", "value": "Hlavné mesto SR Bratislava, data.bratislava.sk (CC BY 4.0)" },
          "source": { "type": "Property", "value": "https://data.bratislava.sk/datasets/" + $t.item }
        }
        root = root.filter(entry -> entry.value != null)

    - split: { size: 500 }
    - archive: { format: json_array }
