apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-prispevky-vekovych-skupin-zeny-v-ba
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Príspevky vekových skupín k zmene hodnôt strednej dĺžky života pri narodení žien v BA'
    en: 'Public read: Contributions of age groups to the change of female life expectancy at birth in Bratislava (years)'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:prispevky-vekovych-skupin-zeny-v-ba[.][a-z0-9.-]+$
