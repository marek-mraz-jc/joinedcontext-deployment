apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-podiel-plodnosti-zien-vo-veku-do-25-z
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Podiel plodnosti žien vo veku do 25 z celkovej intenzity plodnosti v mestských č. BA'
    en: 'Public read: Share of fertility of women under 25 in total fertility, Bratislava city districts'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:podiel-plodnosti-zien-vo-veku-do-25-z[.][a-z0-9.-]+$
