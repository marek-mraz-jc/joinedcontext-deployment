          {"name": "prispevky-dlzka-zivota-muzi-roky", "item": "e9f329bd12034bbd878a5d502f97d59e", "path": "Pr%C3%ADspevky_k_zmene_strednej_d%C4%BA%C5%BEky_%C5%BEivota_pri_naroden%C3%AD_mu%C5%BEov_v_okresoch_BA_abs", "title": "Príspevky k zmene strednej dĺžky života pri narodení mužov v okresoch BA", "areas": "okres", "area": "OKRES", "fixed": "2000-2019", "by": ["VEK"], "values": [["PRISPEVKY_ROKY", "prispevky-roky", "Príspevok k zmene strednej dĺžky života mužov pri narodení (roky)", null, null]]},
          {"name": "prispevky-dlzka-zivota-muzi-percenta", "item": "f447cf33877548488049a0a685cb3fec", "path": "Pr%C3%ADspevky_k_zmene_strednej_d%C4%BA%C5%BEky_%C5%BEivota_pri_naroden%C3%AD_mu%C5%BEov_v_okresoch_BA_", "title": "Príspevky k zmene strednej dĺžky života pri narodení mužov v okresoch BA (%)", "areas": "okres", "area": "OKRES", "fixed": "2000-2019", "by": ["VEK"], "values": [["PRISPEVKY__", "prispevky-percenta", "Príspevok k zmene strednej dĺžky života mužov pri narodení (%)", null, null]]},
          {"name": "prispevky-dlzka-zivota-zeny-roky", "item": "327f2a79bb0a479c9b3a7b0db910616d", "path": "Pr%C3%ADspevky_k_zmene_strednej_d%C4%BA%C5%BEky_%C5%BEivota_%C5%BEien_v_okresoch_Bratislavy_abs", "title": "Príspevky k zmene strednej dĺžky života žien v okresoch Bratislavy", "areas": "okres", "area": "OKRES", "fixed": "2000-2019", "by": ["VEK"], "values": [["PRISPEVOK_ROKY", "prispevok-roky", "Príspevok k zmene strednej dĺžky života žien pri narodení (roky)", null, null]]},
