apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pzi-v-zahranici
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Objem priamych zahraničných investícií v zahraničí vo vybraných rokoch'
    en: 'Public read: Outward foreign direct investment of the Bratislava region in selected years'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:pzi-v-zahranici[.][a-z0-9.-]+$
