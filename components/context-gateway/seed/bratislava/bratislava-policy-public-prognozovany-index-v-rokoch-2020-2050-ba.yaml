apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-prognozovany-index-v-rokoch-2020-2050-ba
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Prognózovaný index starnutia obyvateľstva Bratislavy v rokoch 2020 – 2050'
    en: 'Public read: Projected ageing index of Bratislava, 2020-2050'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:prognozovany-index-v-rokoch-2020-2050-ba[.][a-z0-9.-]+$
