apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vysadba-v-katastralnych-uzemiach-v
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Výsadba v katastrálnych územiach v Bratislave v rámci projektu 10 000 stromov a náhradnej výsadby'
    en: 'Public read: Planting by cadastral area under the 10,000 trees project and replacement planting'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:vysadba-v-katastralnych-uzemiach-v[.][a-z0-9.-]+$
