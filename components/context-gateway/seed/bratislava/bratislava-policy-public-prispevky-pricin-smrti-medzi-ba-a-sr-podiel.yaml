apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-prispevky-pricin-smrti-medzi-ba-a-sr-podiel
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Príspevky hlavných skupín príčin smrti k rozdielom strednej dĺžky života medzi BA a SR (%)'
    en: 'Public read: Contributions of the main causes of death to the life-expectancy gap between Bratislava and Slovakia, 2015–2019 (%)'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:prispevky-pricin-smrti-medzi-ba-a-sr-podiel[.][a-z0-9.-]+$
