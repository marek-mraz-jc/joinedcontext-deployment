# The mapping of the statistics-denne pipeline (T-5673): the hub's daily tables of Bratislava as a whole (Free Wifi VisitBratislava) as Smart Data Models
# KeyPerformanceIndicator, one entity per table, figure, breakdown, area and period. One mapping
# text for every Feature Service statistics table of the matrix (Research/bratislava-open-data.md
# 6.4): the statistics, statistics-okresy, statistics-mesto and statistics-denne pipelines run the same text
# and differ only in `tables` below, split by area (the daily tables apart) so that one run fits its memory quota. A table is
# one line of `tables`, never a pipeline of its own. The bratislava-hub DataSource answers the
# hub's list of services; a table the list no longer names is logged and left out. Each table is
# read with one query of at most 2,000 rows; an answer that says it holds more fails that table
# instead of writing part of it. Nothing here deletes.
pipeline:
  processors:
    - mapping: |
        # name: the id prefix and the dataset's Endpoint idPattern; path: the Feature Service as the
        # hub's URL writes it; areas: district (the 17 city districts), okres (Bratislava I to V),
        # city (Bratislava as a whole), zsj (the census's basic settlement units of the city), obec
        # (the municipalities of the Bratislava Region) or kraj (the Bratislava region, NUTS 3 SK010);
        # area: the area column (a zsj's 7-digit code), none for a table of the city alone; label: a
        # zsj's name column, within: its city district's code column; year: the period column (a
        # year, a range of years, two ranges compared, a day or a month such as 2018-06), quarter:
        # its quarter column, month: its month column (1 to 12), spans: the range each year of it
        # stands for (a model's 1991 is 1991-2021), or fixed: the year or range the table's title or
        # the item's description names; by: breakdown columns (age, sex,
        # category), each one segment of the id and one part of the name, or {code, name, optional}:
        # the id segment from the code column, the name part from the name column (a budget item's
        # code and title), an optional one left out of both where its cell is empty; abs: the figure
        # without its sign (an age pyramid writes the men's side negative); only: [column, prefix]
        # keeps the rows of one breakdown (all school founders, not the districts' own schools);
        # values: [column, id segment, Slovak label, minimum, maximum], null where no bound holds.
        # A table of events or bookings asks the hub for sums: group: the columns or expressions
        # (SUBSTRING of a date) one figure stands for, in the order the hub names its answer
        # (an expression answers as EXPR_1); stats: [statistic, column or expression, answer
        # column]; where: the rows counted (the year-end month of a running ledger); labels: a
        # breakdown code by its Slovak word; past: a period that starts after today is a wrong
        # date in the ledger, dropped.
        let tables = [
          {"name": "free-wifi-dlzka-pripojenia", "item": "15a9710974e146c09dc5d05618078917", "path": "Rozlo%C5%BEenie%20d%C4%BA%C5%BEky%20pripojenia%20u%C5%BE%C3%ADvate%C4%BEov%20Free%20Wifi%20VisitBratislava", "title": "Rozloženie dĺžky pripojenia užívateľov Free Wifi VisitBratislava", "areas": "city", "year": "Dátum", "values": [["Menej_ako_5_minút", "menej-ako-5-minut", "Pripojenia Free Wifi VisitBratislava kratšie ako 5 minút", 0, null], ["F5___10_minút", "5-10-minut", "Pripojenia Free Wifi VisitBratislava dlhé 5 – 10 minút", 0, null], ["F10___30_minút", "10-30-minut", "Pripojenia Free Wifi VisitBratislava dlhé 10 – 30 minút", 0, null], ["F30___60_minút", "30-60-minut", "Pripojenia Free Wifi VisitBratislava dlhé 30 – 60 minút", 0, null], ["Viac_ako_60_minút", "viac-ako-60-minut", "Pripojenia Free Wifi VisitBratislava dlhšie ako 60 minút", 0, null]]},
          {"name": "free-wifi-novi-a-vracajuci-sa", "item": "94d40e2e8e8e4fb8abfda1ca7168ed2a", "path": "Po%C4%8Det%20nov%C3%BDch%20%20vracaj%C3%BAcich%20sa%20a%20nepripojen%C3%BDch%20u%C5%BE%C3%ADvate%C4%BEov%20Free%20Wif", "title": "Počet nových, vracajúcich sa a nepripojených užívateľov Free Wifi VisitBratislava", "areas": "city", "year": "Dátum", "values": [["Noví", "novi", "Noví užívatelia Free Wifi VisitBratislava", 0, null], ["Vracajúci_sa", "vracajuci-sa", "Vracajúci sa užívatelia Free Wifi VisitBratislava", 0, null], ["Nepripojení", "nepripojeni", "Nepripojení užívatelia Free Wifi VisitBratislava", 0, null]]},
          {"name": "free-wifi-operacny-system", "item": "de1851ad86c04c3cb799ef048c05643b", "path": "Detegovan%C3%BD%20typ%20opera%C4%8Dn%C3%A9ho%20syst%C3%A9mu%20u%C5%BE%C3%ADvate%C4%BEov%20Free%20Wifi%20VisitBrat", "title": "Detegovaný typ operačného systému užívateľov Free Wifi VisitBratislava", "areas": "city", "year": "Dátum", "by": ["Operačný_systém"], "values": [["Hodnota", "pocet-uzivatelov", "Počet užívateľov Free Wifi VisitBratislava podľa operačného systému", 0, null]]},
          {"name": "free-wifi-prehliadac", "item": "5848cff436684e91affcd1bdb8448f98", "path": "Detegovan%C3%BD%20typ%20prehliada%C4%8Da%20u%C5%BE%C3%ADvate%C4%BEov%20Free%20Wifi%20VisitBratislava", "title": "Detegovaný typ prehliadača užívateľov Free Wifi VisitBratislava", "areas": "city", "year": "Dátum", "by": ["Prehliadač"], "values": [["Hodnota", "pocet-uzivatelov", "Počet užívateľov Free Wifi VisitBratislava podľa prehliadača", 0, null]]},
          {"name": "free-wifi-sucasne-pripojeni", "item": "1fd972fd4aa74405b230278235e35750", "path": "Po%C4%8Det%20s%C3%BA%C4%8Dasne%20pripojen%C3%BDch%20u%C5%BE%C3%ADvate%C4%BEov%20na%20Free%20Wifi%20VisitBratislav", "title": "Počet súčasne pripojených užívateľov na Free Wifi VisitBratislava", "areas": "city", "year": "Dátum", "values": [["Maximum", "maximum", "Najvyšší počet súčasne pripojených užívateľov Free Wifi VisitBratislava", 0, null], ["Priemer", "priemer", "Priemerný počet súčasne pripojených užívateľov Free Wifi VisitBratislava", 0, null]]},
          {"name": "free-wifi-zariadenie", "item": "2aad78525121496a90b861c2d83c48b1", "path": "Detegovan%C3%BD%20typ%20zariadenia%20u%C5%BE%C3%ADvate%C4%BEov%20Free%20Wifi%20VisitBratislava", "title": "Detegovaný typ zariadenia užívateľov Free Wifi VisitBratislava", "areas": "city", "year": "Dátum", "by": ["Zariadenie"], "values": [["Hodnota", "pocet-uzivatelov", "Počet užívateľov Free Wifi VisitBratislava podľa typu zariadenia", 0, null]]}
        ]
        let listed = this.services.or([]).map_each(s -> s.name.or(""))
        let found = $tables.filter(t -> $listed.contains(t.path.unescape_url_query()))
        let missing = $tables.filter(t -> !$listed.contains(t.path.unescape_url_query())).map_each(t -> t.name)
        meta missing = $missing.join(", ")
        root = if content().length() > 1048576 {
          throw("the hub's list of services is %d bytes, more than the 1 MiB read".format(content().length()))
        } else if this.error.or(null) != null {
          throw("the hub refused its list of services: %s".format(this.error.message.or("no reason given")))
        } else if $found.length() == 0 {
          throw("the hub lists none of the statistics tables: nothing is written")
        } else { $found }
    - switch:
        - check: '@missing != ""'
          processors:
            - log:
                level: WARN
                message: 'statistics: the hub no longer lists ${! @missing }, left out of this run'
    - unarchive: { format: json_array }

    # One table at a time, read in pages of 1,000 rows (the hub's smallest maxRecordCount) until
    # the hub says no more, at most 20 pages; a table with more fails instead of writing part of
    # it. The path and the query are the constants above, never text of an answer. A table line
    # with `group` asks the hub for its sums instead of its rows: one row a group, ordered by the
    # group so the pages do not overlap.
    - for_each:
        - branch:
            request_map: |
              meta path = this.path
              meta query = if this.group.or("") == "" { "where=1%3D1&outFields=*" } else {
                "where=" + this.where.or("1=1").escape_url_query() +
                "&groupByFieldsForStatistics=" + this.group.escape_url_query() +
                "&orderByFields=" + this.group.escape_url_query() +
                "&outStatistics=" + this.stats.map_each(s -> { "statisticType": s.index(0), "onStatisticField": s.index(1), "outStatisticFieldName": s.index(2) }).format_json(no_indent: true).escape_url_query()
              }
              root = { "rows": [], "offset": 0, "more": true }
            processors:
              - while:
                  check: this.more && !errored()
                  max_loops: 20
                  processors:
                    - branch:
                        request_map: |
                          meta offset = this.offset.string()
                          root = ""
                        processors:
                          - sleep: { duration: '200ms' }
                          - http:
                              url: https://services8.arcgis.com/pRlN1m0su5BYaFAS/arcgis/rest/services/${! @path }/FeatureServer/0/query?${! @query }&resultOffset=${! @offset }&resultRecordCount=1000&f=json
                              verb: GET
                              headers:
                                Accept: application/json
                                User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public open data)
                              timeout: 30s
                              retries: 2
                        result_map: |
                          root.rows = if content().length() > 4194304 {
                            throw("the table answer is over 4 MiB")
                          } else if this.error.or(null) != null {
                            throw("the hub refused the query: %s".format(this.error.message.or("no reason given")))
                          } else { root.rows.concat(this.features.or([]).map_each(f -> f.attributes)) }
                          root.offset = root.offset + 1000
                          root.more = this.exceededTransferLimit.or(false)
            result_map: |
              root.rows = if this.more { throw("the table holds more than 20,000 rows, more than 20 pages") } else { this.rows }
    # A table the hub refuses is logged and left out of this run; the others still write.
    - catch:
        - log: { level: WARN, message: 'statistics: ${! json("name") } not read: ${! error() }' }
        - mapping: root = deleted()
    - archive: { format: json_array }

    # Plausibility (owner 2026-10-22T18:10Z): dropped and counted by reason, never guessed at: an
    # area outside the city; no period; a breakdown cell left empty; a figure that is no number or
    # lies outside its bounds; one figure twice for the same breakdown, area and period (the first
    # is kept).
    - mapping: |
        # The 17 city districts by their name folded to ASCII, with their ZÚJ code (the
        # AdministrativeArea id the districts pipeline writes). The hub writes names three ways:
        # with diacritics, without them and abbreviated ("D. N. Ves", dots dropped: a key with a dot
        # is a path to `get`); the mosquito table writes č as è and ň as ò (a cp1250 text read as
        # Latin-1), folded here too, and its 2025 figures with a space between thousands.
        let districts = {
          "stare mesto": ["528595", "Staré Mesto"], "podunajske biskupice": ["529311", "Podunajské Biskupice"],
          "p biskupice": ["529311", "Podunajské Biskupice"], "ruzinov": ["529320", "Ružinov"], "vrakuna": ["529338", "Vrakuňa"],
          "nove mesto": ["529346", "Nové Mesto"], "raca": ["529354", "Rača"], "vajnory": ["529362", "Vajnory"],
          "devinska nova ves": ["529371", "Devínska Nová Ves"], "d n ves": ["529371", "Devínska Nová Ves"],
          "dubravka": ["529389", "Dúbravka"], "karlova ves": ["529397", "Karlova Ves"], "devin": ["529401", "Devín"],
          "lamac": ["529419", "Lamač"], "zahorska bystrica": ["529427", "Záhorská Bystrica"], "z bystrica": ["529427", "Záhorská Bystrica"],
          "cunovo": ["529435", "Čunovo"], "jarovce": ["529443", "Jarovce"], "petrzalka": ["529460", "Petržalka"], "rusovce": ["529494", "Rusovce"]
        }
        # The five okresy (LAU 1, Bratislava I to V, codes 101 to 105), written in Roman or Arabic
        # numerals; the city as a whole by its municipality code. A table of the whole region keeps
        # the Bratislava okresy, a table of Bratislava beside Slovakia the Bratislava rows.
        let okresy = {
          "bratislava i": ["101", "Bratislava I"], "bratislava ii": ["102", "Bratislava II"], "bratislava iii": ["103", "Bratislava III"],
          "bratislava iv": ["104", "Bratislava IV"], "bratislava v": ["105", "Bratislava V"], "bratislava 1": ["101", "Bratislava I"],
          "bratislava 2": ["102", "Bratislava II"], "bratislava 3": ["103", "Bratislava III"], "bratislava 4": ["104", "Bratislava IV"],
          "bratislava 5": ["105", "Bratislava V"]
        }
        # A table of the region beside Slovakia keeps the region's rows.
        let kraje = { "bratislavsky kraj": ["sk010", "Bratislavský kraj"] }
        # A table without an area column ("*") is the city's, and so is its row named after the city.
        let city = ["582000", "Bratislava"]
        # A basic settlement unit (ZSJ) by its 7-digit code, named with its city district, kept only
        # inside one of the 17; a municipality of the region by its name, the hub giving no code.
        let parts = $districts.values()
        map fold {
          root = this.string().lowercase().replace_all_many([
            "á", "a", "ä", "a", "à", "a", "â", "a", "č", "c", "ç", "c", "ď", "d", "é", "e", "ě", "e", "ë", "e", "í", "i", "ĺ", "l",
            "ľ", "l", "ň", "n", "ó", "o", "ô", "o", "ö", "o", "ő", "o", "ŕ", "r", "ř", "r", "š", "s", "ť", "t", "ú", "u", "ü", "u",
            "ű", "u", "ů", "u", "ý", "y", "ž", "z", "è", "c", "ò", "n", ".", ""
          ]).re_replace_all("\\s+", " ").trim()
        }
        map segment {
          root = this.apply("fold").re_replace_all("[^a-z0-9]+", "-").trim("-")
        }
        map number {
          root = if this == null { null } else { this.string().re_replace_all("[\\s %]", "").replace_all(",", ".").number().catch(null) }
        }
        map magnitude {
          let n = this.apply("number")
          root = if $n == null { null } else { $n.abs() }
        }
        map yearmonth {
          let y = this.slice(0, 4).number().int64()
          let m = this.slice(5, 7).number().int64()
          let february = if $y % 4 == 0 && ($y % 100 != 0 || $y % 400 == 0) { "29" } else { "28" }
          root = {
            "from": this + "-01",
            "to": this + "-" + ["31", $february, "31", "30", "31", "30", "31", "31", "30", "31", "30", "31"].index($m - 1),
            "slug": this,
            "label": ["január", "február", "marec", "apríl", "máj", "jún", "júl", "august", "september", "október", "november", "december"].index($m - 1) + " " + $y.string(),
            "frequency": "monthly"
          }
        }
        map years {
          let v = this.string().trim()
          let y = $v.re_find_all("(19|20)[0-9]{2}")
          root = if $v.re_match("^(19|20)[0-9]{2}$") {
            { "from": $v + "-01-01", "to": $v + "-12-31", "slug": $v, "label": $v, "frequency": "yearly" }
          } else if $v.re_match("^(19|20)[0-9]{2}\\s*[–-]\\s*(19|20)[0-9]{2}$") {
            { "from": $y.index(0) + "-01-01", "to": $y.index(1) + "-12-31", "slug": $y.join("-"), "label": $y.join("–") }
          } else if $v.re_match("^(19|20)[0-9]{2}\\s*[–-]\\s*(19|20)[0-9]{2} a (19|20)[0-9]{2}\\s*[–-]\\s*(19|20)[0-9]{2}$") {
            # Two ranges compared ("2017 – 2019 a 2000 – 2002"): the period spans both.
            {
              "from": $y.sort().index(0) + "-01-01", "to": $y.sort().index(3) + "-12-31", "slug": $y.join("-"),
              "label": $y.index(0) + "–" + $y.index(1) + " a " + $y.index(2) + "–" + $y.index(3)
            }
          } else if $v.re_match("^(19|20)[0-9]{2}-[0-9]{2}-[0-9]{2}$") && $v.ts_parse("2006-01-02").catch(null) != null {
            { "from": $v, "to": $v, "slug": $v, "label": $v, "frequency": "daily" }
          } else if $v.re_match("^(19|20)[0-9]{2}-(0[1-9]|1[0-2])$") { $v.apply("yearmonth") } else { null }
        }
        map quarter {
          let y = this.index(0)
          # "3" or the transit table's "3.Q".
          let q = this.index(1).re_replace_all("^([1-4])\\s*\\.?\\s*[Qq]$", "$1")
          root = if $y.re_match("^(19|20)[0-9]{2}$") && $q.re_match("^[1-4]$") {
            {
              "from": $y + "-" + ["01-01", "04-01", "07-01", "10-01"].index($q.number() - 1),
              "to": $y + "-" + ["03-31", "06-30", "09-30", "12-31"].index($q.number() - 1),
              "slug": $y + "-q" + $q,
              "label": $q + ". štvrťrok " + $y,
              "frequency": "quarterly"
            }
          } else { null }
        }
        # A month column holds 1 to 12, with or without a leading zero; anything else is no period.
        map month {
          let y = this.index(0)
          let m = this.index(1).trim_prefix("0")
          root = if $y.re_match("^(19|20)[0-9]{2}$") && $m.re_match("^([1-9]|1[0-2])$") {
            {
              "from": "%s-%02d-01".format($y, $m.number().int64()),
              "to": "%s-%02d-%s".format($y, $m.number().int64(), if $m == "2" && $y.number().int64() % 4 == 0 && ($y.number().int64() % 100 != 0 || $y.number().int64() % 400 == 0) { "29" } else {
                ["31", "28", "31", "30", "31", "30", "31", "31", "30", "31", "30", "31"].index($m.number().int64() - 1)
              }),
              "slug": "%s-%02d".format($y, $m.number().int64()),
              "label": "%d/%s".format($m.number().int64(), $y),
              "frequency": "monthly"
            }
          } else { null }
        }
        map period {
          let t = this.table
          let r = this.row
          root = if $t.fixed.or("") != "" { $t.fixed.apply("years") }
            else if $t.spans.or(null) != null { $t.spans.get($r.get($t.year).or("").string().trim()).or("").apply("years") }
            else if $t.quarter.or("") != "" { [$r.get($t.year).or("").string().trim(), $r.get($t.quarter).or("").string().trim()].apply("quarter") }
            else if $t.month.or("") != "" { [$r.get($t.year).or("").string().trim(), $r.get($t.month).or("").string().trim()].apply("month") }
            else { $r.get($t.year).or("").apply("years") }
        }
        map areaname {
          root = if this.table.area.or("") == "" { "*" } else { this.row.get(this.table.area).or("").apply("fold") }
        }
        # Each breakdown cell as its id segment and its label; a label read as Latin-1 from cp1250
        # text ("Raèianska") gets its č and ň back.
        map breakdown {
          let r = this.row
          let labels = this.table.labels.or({})
          # "Nan" is the hub's word for a category it did not detect: no breakdown.
          root = this.table.by.or([]).map_each(c -> if c.type() == "string" { { "code": c } } else { c }).map_each(c -> c.assign({
            "raw": $r.get(c.code).or("").string().trim()
          })).map_each(c -> c.assign({ "raw": if c.raw.lowercase() == "nan" { "" } else { $labels.get(c.raw).or(c.raw) } })).map_each(c -> {
            "segment": c.raw.apply("segment"),
            "label": (if c.name.or("") != "" { $r.get(c.name).or("").string().trim() } else { c.raw }).replace_all_many(["è", "č", "ò", "ň"]),
            "optional": c.optional.or(false)
          })
        }
        map zsj {
          let code = this.row.get(this.table.area).or("").string().trim()
          let name = this.row.get(this.table.label).or("").string().trim()
          let within = this.row.get(this.table.within).or("").string().trim()
          let part = this.parts.filter(d -> d.index(0) == $within)
          root = if $code.re_match("^[0-9]{7}$") && $name != "" && $part.length() > 0 { [$code, $name + " (" + $part.index(0).index(1) + ")"] } else { null }
        }
        map obec {
          let name = this.row.get(this.table.area).or("").string().trim()
          root = if $name.apply("segment") != "" { [$name.apply("segment"), $name] } else { null }
        }
        let cells = this.map_each(t -> t.rows.or([]).filter(r -> if t.only.or(null) == null { true } else {
          r.get(t.only.index(0)).or("").string().has_prefix(t.only.index(1))
        }).map_each(r -> t.values.map_each(v -> {
          "table": t.without("rows", "values"),
          "value": v,
          "area": if t.areas == "district" { $districts.get({ "table": t, "row": r }.apply("areaname")).or(null) }
            else if t.areas == "okres" { $okresy.get({ "table": t, "row": r }.apply("areaname")).or(null) }
            else if t.areas == "zsj" { { "table": t, "row": r, "parts": $parts }.apply("zsj") }
            else if t.areas == "obec" { { "table": t, "row": r }.apply("obec") }
            else if t.areas == "kraj" { $kraje.get({ "table": t, "row": r }.apply("areaname")).or(null) }
            else if ["*", $city.index(1).lowercase()].contains({ "table": t, "row": r }.apply("areaname")) { $city } else { null },
          "by": { "table": t, "row": r }.apply("breakdown"),
          "period": { "table": t, "row": r }.apply("period"),
          "number": r.get(v.index(0)).apply(if t.abs.or(false) { "magnitude" } else { "number" })
        }))).flatten().flatten()
        map reason {
          let v = this.value
          root = if this.area == null {
              { "district": "not a city district", "okres": "not a Bratislava okres", "city": "not Bratislava",
                "zsj": "not a ZSJ of the city", "obec": "no municipality", "kraj": "not the Bratislava region" }.get(this.table.areas)
            }
            else if this.period == null { "no period" }
            else if this.table.past.or(false) && this.period.from > now().ts_format("2006-01-02") { "in the future" }
            else if this.by.filter(b -> b.segment == "" && !b.optional).length() > 0 { "no breakdown" }
            else if this.number == null { "no number" }
            else if ($v.index(3) != null && this.number < $v.index(3)) || ($v.index(4) != null && this.number > $v.index(4)) { "out of range" }
            else { null }
        }
        let marked = $cells.map_each(c -> c.assign({
          "_drop": c.apply("reason"),
          "_id": ([c.table.name, c.value.index(1)].concat(c.by.map_each(b -> b.segment).filter(s -> s != "")).concat([c.area.index(0).or(""), c.period.slug.or("")])).join(".")
        }))
        let usable = $marked.filter(c -> c._drop == null)
        let once = $usable.unique(c -> c._id)
        let tally = $marked.filter(c -> c._drop != null).fold({}, item -> item.tally.assign({ item.value._drop: item.tally.get(item.value._drop).or(0) + 1 }))
        let dups = $usable.length() - $once.length()
        meta dropped = (if $dups > 0 { $tally.assign({ "duplicate": $dups }) } else { $tally }).format_json(no_indent: true)
        meta kept = $once.length().string()
        root = if $once.length() == 0 { throw("the statistics tables hold no usable figure: nothing is written") } else { $once }
    - log:
        level: INFO
        message: 'statistics: ${! @kept } figures kept, dropped by reason ${! @dropped }'
    - unarchive: { format: json_array }

    - mapping: |
        # The domain comes from the deployment, never from this file (PF-44).
        let t = this.table
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), this._id),
          "type": "KeyPerformanceIndicator",
          "name": { "type": "Property", "value": ([this.value.index(2)].concat(this.by.map_each(b -> b.label).filter(l -> l != "")).concat([this.area.index(1), this.period.label])).join(", ") },
          "description": { "type": "Property", "value": $t.title },
          "process": { "type": "Property", "value": this.value.index(2) },
          "category": { "type": "Property", "value": ["quantitative"] },
          "kpiValue": { "type": "Property", "value": this.number },
          "calculationPeriod": { "type": "Property", "value": { "from": this.period.from, "to": this.period.to } },
          # Smart Data Models names hourly to yearly; a period of several years carries none.
          "calculationFrequency": if this.period.frequency.or("") == "" { null } else { { "type": "Property", "value": this.period.frequency } },
          "area": { "type": "Property", "value": this.area.index(1) },
          "organization": { "type": "Property", "value": "Hlavné mesto SR Bratislava" },
          "dataProvider": { "type": "Property", "value": "Hlavné mesto SR Bratislava, data.bratislava.sk (CC BY 4.0)" },
          "source": { "type": "Property", "value": "https://data.bratislava.sk/datasets/" + $t.item }
        }
        root = root.filter(entry -> entry.value != null)

    - split: { size: 500 }
    - archive: { format: json_array }
