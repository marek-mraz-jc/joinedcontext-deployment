apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-buduci-bytovy-fond-v-okresoch-bsk-v
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Budúci bytový fond v okresoch BSK v rokoch 2031 - 2051'
    en: 'Public read: Future housing stock in the districts of the Bratislava Region, 2031-2051'
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:buduci-bytovy-fond-v-okresoch-bsk-v[.][a-z0-9.-]+$
