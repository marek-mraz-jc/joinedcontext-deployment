apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-struktura-zien-podla-rodinneho-stavu-vo
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Štruktúra žien podľa rodinného stavu vo veku 15 a viac v mestských častiach BA - SODB 2021'
    en: "Public read: Women aged 15 and over by marital status in Bratislava's city districts (2021 census)"
spec:
  contextSpaceRef: { kind: ContextSpace, name: bratislava }
  assigner: did:web:bratislava.sk
  assignee: { kind: role, id: public }
  # Read only, the rows of this one hub dataset (CC BY 4.0, nothing about a person); discovery
  # beside the reads (T-4258, EP-116).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:bratislava:struktura-zien-podla-rodinneho-stavu-vo[.][a-z0-9.-]+$
