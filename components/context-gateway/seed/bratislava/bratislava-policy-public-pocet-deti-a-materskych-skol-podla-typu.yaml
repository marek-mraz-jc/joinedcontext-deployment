apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pocet-deti-a-materskych-skol-podla-typu
  namespace: bratislava
  title:
    sk: 'Verejné čítanie: Počet detí a materských škôl podľa typu zriaďovateľa v Bratislave v roku 2021'
