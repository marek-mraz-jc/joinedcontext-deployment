# The air-quality endpoint read back by the public-air reaper (T-3120, PL-03): every reading the
# space holds, read in-cluster through the gateway, where the public-read Policy answers an
# anonymous read. The gateway host comes in as JC_GATEWAY_HOST from the runner's environment.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: public-air-live
  namespace: banskabystrica
  title: { sk: "Merania v datasete Kvalita ovzdušia (na kontrolu starnutia)", en: "Readings the Air quality dataset holds (read back for expiry)" }
spec:
  type: http
  http:
    url: http://${JC_GATEWAY_HOST}/api/endpoint/mluyob4nz52lok3ssk7pgn5vwt/ngsi-ld/v1/entities?type=AirQualityObserved&limit=1000&attrs=dateObserved
    verb: GET
    headers: { Accept: application/json }
    timeout: 20s
