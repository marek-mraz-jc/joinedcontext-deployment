# One AirQualityObserved per record of `eea-sk0263a-no2`, written into the city's public space through its one Endpoint (PL-18, T-2781, T-4153).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: ovzdusie-no2
  namespace: banskabystrica
  title: { sk: NO2 na stanici SK0263A, en: NO2 at station SK0263A }
spec:
  class: auto
  # As for PM10, four minutes later so the two streams do not merge into the same entity at once.
  period: 1h
  schedule: '44 * * * *'
  source:
    dataSourceRef: { kind: DataSource, name: eea-sk0263a-no2 }
  targetEndpoint: urn:ngsi-ld:Endpoint:banskabystrica.sk:banskabystrica-verejne:banskabystrica-verejne
  output: { type: AirQualityObserved, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
