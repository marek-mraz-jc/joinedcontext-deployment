# One AirQualityObserved per record of `eea-sk0263a-pm10`, written into `ovzdusie` through `public-air`,
# so the city's open air-quality dataset carries the real hourly reading (T-3120, PL-18). The
# same source feeds `banskabystrica-verejne` (pipeline ovzdusie-pm10); each space keeps its own copy.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: public-air-pm10
  namespace: banskabystrica
  title: { sk: "PM10 na stanici SK0263A do datasetu Kvalita ovzdušia", en: "PM10 at station SK0263A into the Air quality dataset" }
spec:
  class: auto
  # Five minutes after the verejne stream of the same file, and never in the same minute as the
  # other air stream, so the two writes of one station do not meet (PL-26).
  period: 1h
  schedule: "45 * * * *"
  source:
    dataSourceRef: { kind: DataSource, name: eea-sk0263a-pm10 }
  targetEndpoint: urn:ngsi-ld:Endpoint:banskabystrica.sk:ovzdusie:public-air
  output:
    type: AirQualityObserved
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
