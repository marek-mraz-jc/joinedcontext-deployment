apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: kpi-pipelines-write
  namespace: banskabystrica
  title: { sk: "Kanál zapisuje ukazovatele mesta", en: "The computing pipeline writes the city's indicators" }
spec:
  contextSpaceRef: { kind: ContextSpace, name: banskabystrica-kpi }
  assigner: did:web:{orgDomain}
  assignee: { kind: serviceAccount, id: pipelines }
  operations: [upsertBatch, createBatch, queryBatch]
  information:
    - entities:
        - type: KeyPerformanceIndicator
