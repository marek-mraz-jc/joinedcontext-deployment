# TEMPORARY (T-4202, owner "go" 2026-10-16 ~04:22Z): lets the banskabystrica pipelines account delete the stale
# hel.fi-prefixed duplicates in banskabystrica-mesto, whose banskabystrica.sk-domain twins exist. Only deleteBatch, only ids
# matching the hel.fi pattern, expires by itself at 09:00Z; deployer removes this file right after the run.
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: tmp-t4202-banskabystrica-mesto-dedup
  namespace: banskabystrica
  title: { sk: "Dočasné: odstránenie duplikátov hel.fi (T-4202)", en: "Temporary: remove the hel.fi duplicates (T-4202)" }
spec:
  contextSpaceRef: { kind: ContextSpace, name: banskabystrica-mesto }
  assigner: did:web:{orgDomain}
  assignee: { kind: serviceAccount, id: pipelines }
  operations: [deleteBatch]
  validity: { to: "2026-10-16T09:00:00Z" }
  information:
    - entities:
        - { type: StatisticalObservation, idPattern: '^urn:ngsi-ld:StatisticalObservation:hel\.fi:banskabystrica-mesto:.+$' }
