# Anyone reads the history of the types that keep one, as far back as the space keeps it (T-4372):
# the same entities as the read, over time. The other types keep no history.
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: otvorene-data-read-history
  namespace: banskabystrica
  title:
    sk: Verejné čítanie histórie otvorených dát
    en: 'Public read: open data history'
spec:
  contextSpaceRef:
    kind: ContextSpace
    name: banskabystrica-otvorene-data
  assigner: did:web:banskabystrica.sk
  assignee:
    kind: role
    id: public
  operations:
  - queryTemporal
  - retrieveTemporal
  temporalQ: timerel=after;timeAt=P-30D
  information:
  - entities:
    - type: KeyPerformanceIndicator
    - type: OffStreetParking
