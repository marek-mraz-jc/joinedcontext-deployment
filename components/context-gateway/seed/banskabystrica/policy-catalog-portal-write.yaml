# Only the Portal reconciler writes the catalogue (Architecture/21 §10), as in slovensko's: its
# platform client `portal-reconciler` is decided as the user `service-account-portal-reconciler`.
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: catalog-portal-write
  namespace: banskabystrica
  title: { sk: Katalóg zapisuje Portál, en: The Portal writes the catalogue }
spec:
  contextSpaceRef: { kind: ContextSpace, name: catalog }
  assigner: did:web:banskabystrica.sk
  assignee: { kind: user, id: service-account-portal-reconciler }
  operations: [upsertBatch, deleteBatch, retrieveOps]
  information:
    - entities:
        - type: Dataset
        - type: DataService
        - type: Organization
