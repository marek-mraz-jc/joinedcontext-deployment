        }
        let local = "dtm-bb-regulativy-a-limity-funkcneho-p3-" + [this.properties."vrstva_id"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
