# The mapping of the od-dtm-bb-vyuzitie-pody-na-nepolnohospo-p5 pipeline, generated from the T-4254 mapping: one LandUsePlanFeature per row of
# "DTM_BB-vyuzitie-pody-na-nepolnohospodarske-ucely" (https://data.dev.joinedcontext.com/dataset/bb-dtm-bb-vyuzitie-pody-na-nepolnohospodarske-ucely). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    - mapping: |
        let rest = [{"key": "8-22", "name": "Plochy záberov", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/8___Perspekt%C3%ADvne_pou%C5%BEitie_PP_a_LP_na_nep%C3%B4dohospod%C3%A1rske_%C3%BA%C4%8Dely/MapServer/22/query?where=1%3D1&outFields=OBJECTID,Drp_c,JEV_ID,ETAPA,ENTITA_ID,KU,ZU,Funkcia,Vymera_ha,Zmeny,C_zaberu,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=14000&resultRecordCount=1000"}, {"key": "8-22", "name": "Plochy záberov", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/8___Perspekt%C3%ADvne_pou%C5%BEitie_PP_a_LP_na_nep%C3%B4dohospod%C3%A1rske_%C3%BA%C4%8Dely/MapServer/22/query?where=1%3D1&outFields=OBJECTID,Drp_c,JEV_ID,ETAPA,ENTITA_ID,KU,ZU,Funkcia,Vymera_ha,Zmeny,C_zaberu,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=15000&resultRecordCount=1000"}, {"key": "8-22", "name": "Plochy záberov", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/8___Perspekt%C3%ADvne_pou%C5%BEitie_PP_a_LP_na_nep%C3%B4dohospod%C3%A1rske_%C3%BA%C4%8Dely/MapServer/22/query?where=1%3D1&outFields=OBJECTID,Drp_c,JEV_ID,ETAPA,ENTITA_ID,KU,ZU,Funkcia,Vymera_ha,Zmeny,C_zaberu,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=16000&resultRecordCount=1000"}]
        root = [{ "page": this }.merge({"key": "8-22", "name": "Plochy záberov"})].concat($rest)
    - unarchive:
        format: json_array
    - switch:
        - check: this.url.or(null) != null
          processors:
            - mapping: |
                meta url = this.url
                meta key = this.key
                meta name = this.name
                root = ""
            - http:
                url: "${! @url }"
                verb: GET
                headers:
                  Accept: application/geo+json
                  User-Agent: "joinedcontext-platform open-data pipeline (https://data.dev.joinedcontext.com)"
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page %v did not come: %v".format(@url, error())) } else { { "page": this, "key": @key, "name": @name } }
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        let key = this.key
        let name = this.name
        root = if this.page.error.or(null) != null || this.page.features.or(null) == null { throw("the layer %v answered no features: %v".format($key, this.page.error.message.or(""))) } else { this.page.features.map_each(f -> f.merge({ "properties": { "vrstva": $name, "vrstva_id": "%v-%v".format($key, f.id) } })) }
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "dtm-bb-vyuzitie-pody-na-nepolnohospo-p5-" + [this.properties."vrstva_id"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("LandUsePlanFeature", "banskabystrica.sk", env("JC_SPACE"), $local),
          "type": "LandUsePlanFeature",
          "jEVID": this.properties."JEV_ID".apply("integer"),
          "eTAPA": this.properties."ETAPA".apply("integer"),
          "eNTITAID": this.properties."ENTITA_ID".apply("string"),
          "uPID": this.properties."UP_ID".apply("string"),
          "nazovUP": this.properties."Nazov_UP".apply("string"),
          "vydal": this.properties."Vydal".apply("string"),
          "platiOd": this.properties."Plati_od".apply("string"),
          "obstaravatel": this.properties."Obstaravatel".apply("string"),
          "spracovatel": this.properties."Spracovatel".apply("string"),
          "referencnyPodklad": this.properties."Referencny_podklad".apply("string"),
          "datumRP": this.properties."Datum_RP".apply("string"),
          "label": this.properties."Label".apply("string"),
          "poznamka": this.properties."Poznamka".apply("string"),
          "poskytovatel": this.properties."Poskytovatel".apply("string"),
          "mETAID": this.properties."META_ID".apply("string"),
          "kod": this.properties."Kod".apply("string"),
          "kU": this.properties."KU".apply("string"),
          "zU": this.properties."ZU".apply("integer"),
          "funkcia": this.properties."Funkcia".apply("string"),
          "vymeraHa": this.properties."Vymera_ha".apply("float"),
          "zmeny": this.properties."Zmeny".apply("string"),
          "cZaberu": this.properties."C_zaberu".apply("string"),
          "zabLes": this.properties."Zab_les".apply("string"),
          "typ": this.properties."Typ".apply("string"),
          "nazov": this.properties."Nazov".apply("string"),
          "lokacia": this.properties."Lokacia".apply("string"),
          "hranica": this.properties."Hranica".apply("string"),
          "bPEJ": this.properties."BPEJ".apply("string"),
          "skupina": this.properties."Skupina".apply("integer"),
          "chranena": this.properties."Chranena".apply("string"),
          "intraExtra": this.properties."intra_extra".apply("string"),
          "cisKanala": this.properties."Cis_kanala".apply("string"),
          "dlzkaKm": this.properties."Dlzka_km".apply("string"),
          "rokVybud": this.properties."Rok_vybud".apply("integer"),
          "nazStav": this.properties."Naz_stav".apply("string"),
          "odvKan": this.properties."Odv_kan".apply("string"),
          "drpC": this.properties."Drp_c".apply("integer"),
          "vrstva": this.properties."vrstva".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Mesto Banská Bystrica (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/8___Perspekt%C3%ADvne_pou%C5%BEitie_PP_a_LP_na_nep%C3%B4dohospod%C3%A1rske_%C3%BA%C4%8Dely/MapServer/22/query?where=1%3D1&outFields=OBJECTID,Drp_c,JEV_ID,ETAPA,ENTITA_ID,KU,ZU,Funkcia,Vymera_ha,Zmeny,C_zaberu,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=13000&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bb-dtm-bb-vyuzitie-pody-na-nepolnohospodarske-ucely" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
