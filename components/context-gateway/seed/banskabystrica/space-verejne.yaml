# The city's public space (T-2781): what anybody may read and the catalogue republishes. The
# events the city announces (banskabystrica.sk, CC BY 4.0), the national school map's schools in
# the city (MŠVVaM SR, CC BY 4.0) and the hourly particulate readings of the city's station as
# the EEA republishes them (CC BY 4.0). The statistics stay in `banskabystrica-mesto`, and
# `ovzdusie` keeps its seeded stations.
apiVersion: joinedcontext.com/v1alpha1
kind: ContextSpace
metadata:
  name: banskabystrica-verejne
  namespace: banskabystrica
  title: { sk: "Mesto — verejné údaje", en: "City, open data" }
  description:
    sk: >-
      Podujatia mesta, školy a školské zariadenia v meste, hodinové merania prachových častíc, NO2
      a ozónu na mestskej stanici a počasie na automatických staniciach SHMÚ každých päť minút.
      Zdroje: Mesto Banská Bystrica (banskabystrica.sk), Ministerstvo školstva SR (Digitálna mapa
      škôl), Európska environmentálna agentúra (údaje SHMÚ) a Slovenský hydrometeorologický ústav,
      všetky pod CC BY 4.0.
    en: >-
      The city's events, the schools and school facilities in the city, the hourly particulate,
      NO2 and ozone readings of the city's station, and the weather at SHMÚ's automatic stations
      every five minutes. Sources: the City of Banská Bystrica (banskabystrica.sk), the Slovak
      Ministry of Education (Digitálna mapa škôl), the European Environment Agency (SHMÚ's data)
      and the Slovak Hydrometeorological Institute, all under CC BY 4.0.
spec:
  # The space name is the segment its ids carry, pinned so it cannot drift (PF-84).
  urnSegment: banskabystrica-verejne
  isSandbox: false
  # The one model of this space: a write of a type it does not declare is refused (DM-61).
  dataModelRef: { kind: DataModel, name: banskabystrica-verejne }
  defaultLocale: sk
