# The mapping of the od-dtm-bb-verejnoprospesne-stavby pipeline, generated from the T-4254 mapping: one LandUsePlanFeature per row of
# "DTM_BB-verejnoprospesne-stavby" (https://data.dev.joinedcontext.com/dataset/bb-dtm-bb-verejnoprospesne-stavby). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    - mapping: |
        let rest = [{"key": "10-1", "name": "Hranica urbanistického obvodu", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/1/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Cislo,Nazov,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-2", "name": "Hranica riešeného územia", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/2/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,UP_ID,Nazov_UP,Vydal,Plati_od,Obstaravatel,Spracovatel,Referencny_podklad,Datum_RP,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-3", "name": "Zoznam VPS v mestské časti", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/3/query?where=1%3D1&outFields=OBJECTID,TYP,POPIS&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-3", "name": "Zoznam VPS v mestské časti", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/3/query?where=1%3D1&outFields=OBJECTID,TYP,POPIS&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=1000&resultRecordCount=1000"}, {"key": "10-5", "name": "Hranica ÚPN-Z", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/5/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Cislo,Nazov,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-6", "name": "Zariadenia a odvádzanie a čistenie odpadových vôd", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/6/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Typ,Nazov,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-7", "name": "Zariadenia na zásobovanie pitnou vodou", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/7/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Typ,Nazov,Objem,Max_hl,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-8", "name": "Cestná komunikačná sieť", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/8/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod,Kategoria,Oznacenie,Okruhy,VPS,RU,Zobraz,Poskytovatel,META_ID,Label,Poznamka,Sirka,Rychlost&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-9", "name": "Hranica zastavaného územia", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/9/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-10", "name": "Stavby a zariadenia na zásobovanie plynom", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/10/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Poskytovatel,META_ID,Label,Poznamka,Typ,Material,DN,MPa,VPS&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-11", "name": "Stavby a zariadenia na zásobovanie elektrickou energiou", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/11/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Typ,OP,Popis,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-12", "name": "Koridor pre pripravované 2 x 400 kV prenosové vedenie  ZVN", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/12/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,RU,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-13", "name": "Stavby na odvádzanie a čistenie odpadových vôd", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/13/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Typ,Nazov,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-14", "name": "Stavby na zásobovanie pitnou vodou", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/14/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Typ,DN,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-15", "name": "Stavby a zariadenia na zásobovanie teplom", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/15/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Typ,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-16", "name": "Ochranné hrádze na Hrone", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/16/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-17", "name": "Stavby na reguláciu odtoku vody z povodia", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/17/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-18", "name": "Recipient", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/18/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Popis,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-19", "name": "Úprava miestnych tokov", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/19/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Popis,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-20", "name": "Kabínková lanovka z priestoru Trosky na Urpín", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/20/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Typ,RU,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-21", "name": "Železničná sieť", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/21/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Typ,Trat,OP,RU,VPS,Zobraz,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-22", "name": "Tunel na odvedenie veľkých vôd", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/22/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,VPS,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-26", "name": "Plochy pre verejno-prospešné stavby dopravné - pešia doprava", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/26/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod_cely,Kod,Kod_zjednodus,UO,Cast_mesta,Funkcia,Byty_HBV,Byty_IBV,Vyska,Nazov,VPS,RU,Spec_reg,Interv_reg,Indiv_reg,Kod_SV,dlzky,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-27", "name": "Funkčné plochy - VPS", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/27/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod_cely,Kod,Kod_zjednodus,UO,Cast_mesta,Funkcia,Byty_HBV,Byty_IBV,Vyska,Nazov,VPS,RU,Spec_reg,Interv_reg,Indiv_reg,Kod_SV,dlzky,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "10-28", "name": "Funkčné plochy", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/10___Verejno_prospe%C5%A1n%C3%A9_stavby_a_n%C3%A1sledn%C3%A9_%C3%9APN_Z/MapServer/28/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod_cely,Kod,Kod_zjednodus,UO,Cast_mesta,Funkcia,Byty_HBV,Byty_IBV,Vyska,Nazov,VPS,RU,Spec_reg,Interv_reg,Indiv_reg,Kod_SV,dlzky,Poskytovatel,META_ID,Label,Poznamka&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}]
        root = [{ "page": this }.merge({"key": "10-0", "name": "Hranica časti mesta"})].concat($rest)
    - unarchive:
        format: json_array
    - switch:
        - check: this.url.or(null) != null
          processors:
            - mapping: |
                meta url = this.url
                meta key = this.key
                meta name = this.name
                root = ""
            - http:
                url: "${! @url }"
                verb: GET
                headers:
                  Accept: application/geo+json
                  User-Agent: "joinedcontext-platform open-data pipeline (https://data.dev.joinedcontext.com)"
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page %v did not come: %v".format(@url, error())) } else { { "page": this, "key": @key, "name": @name } }
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        let key = this.key
        let name = this.name
        root = if this.page.error.or(null) != null || this.page.features.or(null) == null { throw("the layer %v answered no features: %v".format($key, this.page.error.message.or(""))) } else { this.page.features.map_each(f -> f.merge({ "properties": { "vrstva": $name, "vrstva_id": "%v-%v".format($key, f.id) } })) }
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "dtm-bb-verejnoprospesne-stavby-" + [this.properties."vrstva_id"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("LandUsePlanFeature", "banskabystrica.sk", env("JC_SPACE"), $local),
          "type": "LandUsePlanFeature",
          "jEVID": this.properties."JEV_ID".apply("integer"),
          "eTAPA": this.properties."ETAPA".apply("integer"),
          "eNTITAID": this.properties."ENTITA_ID".apply("string"),
          "cislo": this.properties."Cislo".apply("string"),
          "nazov": this.properties."Nazov".apply("string"),
          "poskytovatel": this.properties."Poskytovatel".apply("string"),
          "mETAID": this.properties."META_ID".apply("string"),
          "label": this.properties."Label".apply("string"),
          "poznamka": this.properties."Poznamka".apply("string"),
          "uPID": this.properties."UP_ID".apply("string"),
          "nazovUP": this.properties."Nazov_UP".apply("string"),
          "vydal": this.properties."Vydal".apply("string"),
          "platiOd": this.properties."Plati_od".apply("string"),
          "obstaravatel": this.properties."Obstaravatel".apply("string"),
          "spracovatel": this.properties."Spracovatel".apply("string"),
          "referencnyPodklad": this.properties."Referencny_podklad".apply("string"),
          "datumRP": this.properties."Datum_RP".apply("string"),
          "tYP": this.properties."TYP".apply("string"),
          "pOPIS": this.properties."POPIS".apply("string"),
          "typ": this.properties."Typ".apply("string"),
          "vPS": this.properties."VPS".apply("string"),
          "objem": this.properties."Objem".apply("string"),
          "maxHl": this.properties."Max_hl".apply("integer"),
          "kod": this.properties."Kod".apply("string"),
          "kategoria": this.properties."Kategoria".apply("string"),
          "oznacenie": this.properties."Oznacenie".apply("string"),
          "okruhy": this.properties."Okruhy".apply("integer"),
          "rU": this.properties."RU".apply("integer"),
          "zobraz": this.properties."Zobraz".apply("string"),
          "sirka": this.properties."Sirka".apply("integer"),
          "rychlost": this.properties."Rychlost".apply("integer"),
          "material": this.properties."Material".apply("string"),
          "dN": this.properties."DN".apply("string"),
          "mPa": this.properties."MPa".apply("float"),
          "oP": this.properties."OP".apply("string"),
          "popis": this.properties."Popis".apply("string"),
          "trat": this.properties."Trat".apply("string"),
          "kodCely": this.properties."Kod_cely".apply("string"),
          "kodZjednodus": this.properties."Kod_zjednodus".apply("float"),
          "uO": this.properties."UO".apply("string"),
          "castMesta": this.properties."Cast_mesta".apply("string"),
          "funkcia": this.properties."Funkcia".apply("string"),
          "bytyHBV": this.properties."Byty_HBV".apply("string"),
          "bytyIBV": this.properties."Byty_IBV".apply("string"),
          "vyska": this.properties."Vyska".apply("string"),
          "specReg": this.properties."Spec_reg".apply("string"),
          "intervReg": this.properties."Interv_reg".apply("string"),
          "indivReg": this.properties."Indiv_reg".apply("integer"),
          "kodSV": this.properties."Kod_SV".apply("integer"),
          "dlzky": this.properties."dlzky".apply("integer"),
          "vrstva": this.properties."vrstva".apply("string"),
