apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: pocasie-read
  namespace: banskabystrica
  title: { sk: 'Verejné čítanie: počasie' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: banskabystrica-verejne }
  assigner: did:web:banskabystrica.sk
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint banskabystrica-pocasie, and only
  # its types: the space's other types stay with their own datasets (T-4344).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
    - queryTemporal
    - retrieveTemporal
  # Its types keep history: anyone reads it, as far back as the space keeps it (T-4372).
  temporalQ: timerel=after;timeAt=P-30D
  information:
    - entities:
        - type: WeatherObserved
