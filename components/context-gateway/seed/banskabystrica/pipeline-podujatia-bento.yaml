# The mapping of the podujatia pipeline (PL-03, T-2781): one Event per event the city announces on
# banskabystrica.sk, from the site's own REST API (the newest hundred). The DataSource asks for the
# fields kept here by name, so the organiser's e-mail and telephone never leave the city's server.
# Dates and times stay as the city writes them, local to Banská Bystrica: converting them to UTC
# would need the city's time zone rules at the event's date, which the feed does not state.
# A post filed only under the city's monthly and yearly overviews is a listing, not an event.

pipeline:
  processors:
    - mapping: |
        # The first specific category the post carries; `other` only when it has no other.
        map category {
          root = this.map_each(id -> match id {
            96 => "musicDanceTheatre",
            97 => "museumsGalleriesLibraries",
            42 => "sport",
            425 => "exhibition",
            98 => "other",
            _ => null,
          }).filter(c -> c != null).sort_by(c -> if c == "other" { 1 } else { 0 }).index(0).or(null)
        }
        # WordPress's `modified_gmt` is UTC without a zone; `modified` is the site's local time.
        map stamp {
          root = this.string().ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z07:00", "UTC").catch(null)
        }
        # A published day (and time) as an instant with Bratislava's offset on that day.
        map local {
          let at = "%sT%s:00".format(this.day, this.time.or("00:00")).ts_parse("2006-01-02T15:04:05")
          root = "%sT%s:00%s".format(this.day, this.time.or("00:00"), $at.ts_format("Z07:00", "Europe/Bratislava"))
        }
        # WordPress renders a title as HTML: tags off, then entities to text, as the shared events
        # tail does (`text`), so `&#8211;` is a dash and `<em>` never reaches the name.
        map title {
          root = this.or("").string().strip_html().unescape_html().trim()
        }
        map clock {
          root = if this.or("").string().re_match("^[0-2][0-9]:[0-5][0-9]$") { this } else { null }
        }
        root = this.or([]).filter(e -> e.id.type() == "number" && e.title.rendered.apply("title") != "" && e.meta.date_start.or("").string().re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") && e.event_categories.or([]).apply("category") != null).map_each(e -> {
          "id": "urn:ngsi-ld:%v:%v:%v:event-%v".format("Event", "banskabystrica.sk", env("JC_SPACE"), e.id.int64()),
          "type": "Event",
          "name": { "type": "LanguageProperty", "languageMap": { "sk": e.title.rendered.apply("title") } },
          "startDate": { "type": "Property", "value": { "day": e.meta.date_start, "time": e.meta.time_start.apply("clock") }.apply("local") },
          "startTime": if e.meta.time_start.apply("clock") == null { null } else { { "type": "Property", "value": e.meta.time_start } },
          "endDate": if e.meta.date_end.or("").string().re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { { "type": "Property", "value": { "day": e.meta.date_end, "time": e.meta.time_end.apply("clock") }.apply("local") } } else { null },
          "endTime": if e.meta.time_end.apply("clock") == null { null } else { { "type": "Property", "value": e.meta.time_end } },
          "eventCategory": { "type": "Property", "value": e.event_categories.apply("category") },
          "address": if e.meta.address_locality.or("").trim() == "" { null } else {
            { "type": "Property", "value": {
              "streetAddress": "%v %v".format(e.meta.address_street.or(""), e.meta.address_number.or("")).trim(),
              "addressLocality": e.meta.address_locality.trim(),
              "addressCountry": "SK"
            }.filter(f -> f.value != "") }
          },
          # A point inside Slovakia or none: an unset pin comes back as 0,0.
          "location": if e.meta.coordinates.longitude.or(0).type() == "number" && e.meta.coordinates.longitude.or(0) > 16.8 && e.meta.coordinates.longitude.or(0) < 22.6 && e.meta.coordinates.latitude.or(0).type() == "number" && e.meta.coordinates.latitude.or(0) > 47.7 && e.meta.coordinates.latitude.or(0) < 49.7 {
            { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [e.meta.coordinates.longitude, e.meta.coordinates.latitude] } }
          } else { null },
          "url": if e.link.or("").has_prefix("https://") { { "type": "Property", "value": e.link } } else { null },
          "dateModified": if e.modified_gmt.or("").apply("stamp") == null { null } else { { "type": "Property", "value": e.modified_gmt.apply("stamp") } },
          "dataProvider": { "type": "Property", "value": "Mesto Banská Bystrica, banskabystrica.sk (CC BY 4.0)" },
          "source": { "type": "Property", "value": "https://www.banskabystrica.sk/podujatia/" }
        }.filter(entry -> entry.value != null))
