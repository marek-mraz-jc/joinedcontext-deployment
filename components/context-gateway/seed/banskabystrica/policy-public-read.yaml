apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-read
  namespace: banskabystrica
  title: { sk: Verejné čítanie, en: Public read }
spec:
  contextSpaceRef: { kind: ContextSpace, name: ovzdusie }
  assigner: did:web:banskabystrica.sk
  assignee: { kind: role, id: public }
  # Discovery beside the reads (T-4258, EP-116): which types and attributes the Endpoint holds,
  # narrowed to this grant (EP-26), so an anonymous MCP client finds them before it queries.
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
    - queryTemporal
    - retrieveTemporal
  # Its types keep history: anyone reads it, as far back as the space keeps it (T-4372).
  temporalQ: timerel=after;timeAt=P-30D
  # What the anonymous caller may read, attribute by attribute (R6, EP-47). The two the
  # list leaves out are the demo's least-privilege moment: `reliability` and `refDevice`
  # are absent from the entity, from the JSON Schema and from the `@context`, and named
  # in `redactedSlots` so the absence is visible rather than mysterious.
  information:
    - entities:
        - type: AirQualityObserved
      propertyNames: [dateObserved, location, name, observedAt, pm10, pm25]
