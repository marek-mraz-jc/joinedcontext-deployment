# The person who keeps the city's raw rows reads them (EP-14). Until now only the pipelines'
# service account was granted anything in this space, so a signed-in human saw an empty space
# and the records application had nothing to draw. The rows are somebody else's published data
# mirrored here, so the narrowing is the type and the published columns, not secrecy: what is
# withheld from the public is the republication under our own name, which is the endpoint's
# `organization` audience and stays as it is.
#
# Reading is a Policy of its own and not a second operation on the note grant beside it: one
# Policy carries one attribute whitelist for every operation it names, so a grant that listed
# both `retrieveOps` and `updateAttrs` over these columns would let the same person overwrite
# `value` (GW17, T-2434).
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: mesto-steward-read
  namespace: banskabystrica
  title: { sk: "Správca údajov číta zdrojové riadky mesta", en: "The data steward reads the city's raw rows" }
spec:
  contextSpaceRef: { kind: ContextSpace, name: banskabystrica-mesto }
  assigner: did:web:{orgDomain}
  # The person, not a role: `steward` is a RoleBinding over manifests (users/roles/steward.yaml)
  # and never reaches a token, whose only realm role is `portal-approver`
  # (components/keycloak/demo-users.yaml). A `kind: role` assignee here would match nobody and
  # the refusal would look like a bug in the application. Helsinki's own steward grant
  # (helsinki-policy-bikes-ops-steward.yaml) names the person for the same reason, and
  # `{orgDomain}` is rendered out of every spec when the repository is loaded, by the
  # gateway as well as by jcctl (jcctl loader.rs `render_in_place`, CC-74).
  assignee: { kind: user, id: "demo.steward@{orgDomain}" }
  operations: [retrieveOps]
  information:
    - entities:
        - type: StatisticalObservation
      # The columns the records application shows and filters on. A filter names an attribute,
      # so an attribute missing here is a filter the endpoint refuses rather than answers.
      propertyNames:
        [dataSet, indicator, refArea, refPeriod, dimensionKey, value, unitText, source, dateObserved, stewardNote]
