# One demo air sensor (T-4857): its client `banskabystrica-senzor-namestie` signs in with a
# secret an approver issues in the Portal (PF-37); no secret is in this repository. The broker
# `ovzdusie` names it; it reads only its own type and writes nothing through an Endpoint.
apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: senzor-namestie
  namespace: banskabystrica
  title: { sk: Senzor ovzdušia Námestie SNP (ukážka), en: Air sensor SNP Square (demo) }
spec:
  owner: { user: de300000-0000-4000-8000-000000000001 } # demo.steward
  purpose: A demo air sensor publishes PM10 and PM2.5 to the MQTT broker ovzdusie
  roles:
    - role: space-reader
      scope: { contextSpace: ovzdusie }
      types: [AirQualityObserved]
  credentials:
    - kind: oauth-client
      name: main
