# The mapping of the public-air-reaper pipeline (T-3120, PL-03): keeps the ids whose
# `dateObserved` is older than seven days (the model requires it, so a reading without a readable
# one counts as stale) and deletes them in one batch through `public-air` (deleteBatch of the
# ovzdusie-pipelines-write Policy). Seven days is a week of EEA silence: the hourly streams renew a
# live station long before. Nothing reaches the rendered output: the last mapping drops the message.

pipeline:
  processors:
    - unarchive:
        format: json_array

    - mapping: |
        let seen = this.dateObserved.value.or(this.dateObserved).or("1970-01-01T00:00:00Z")
        let age = now().ts_unix() - $seen.string().ts_parse("2006-01-02T15:04:05Z07:00").ts_unix().catch(0)
        root = if $age > 604800 { { "id": this.id } } else { deleted() }

    - archive:
        format: json_array

    # The batch delete takes the bare ids; an empty batch is nothing to delete.
    - mapping: |
        root = if this.length() == 0 { deleted() } else { this.map_each(entity -> entity.id) }

    - http:
        url: ${JC_GATEWAY_URL}/api/endpoint/mluyob4nz52lok3ssk7pgn5vwt/ngsi-ld/v1/entityOperations/delete
        verb: POST
        headers:
          Content-Type: application/json
        oauth2:
          enabled: true
          client_key: ${JC_CLIENT_ID}
          client_secret: ${JC_CLIENT_SECRET}
          token_url: ${JC_TOKEN_URL}
        timeout: 30s
        rate_limit: pipeline_egress

    - mapping: root = deleted()
