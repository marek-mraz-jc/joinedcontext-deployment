# The mapping of the od-dtm-bb-funkcne-vyuzitie-uzemia pipeline, generated from the T-4254 mapping: one LandUsePlanFeature per row of
# "DTM_BB-funkcne-vyuzitie-uzemia" (https://data.dev.joinedcontext.com/dataset/bb-dtm-bb-funkcne-vyuzitie-uzemia). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    - mapping: |
        let rest = [{"key": "3a-2", "name": "Hranica časti mesta", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/2/query?where=1%3D1&outFields=OBJECTID,Nazov,JEV_ID,ETAPA,ENTITA_ID,Cislo,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-3", "name": "Hranica urbanistického obvodu", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/3/query?where=1%3D1&outFields=OBJECTID,Nazov,JEV_ID,ETAPA,ENTITA_ID,Cislo,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-4", "name": "Hranica zastavaného územia", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/4/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-5", "name": "Ochranné pásmo NKP", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/5/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-6", "name": "Areál národných kultúrnych pamiatok (zapísaných v ÚZPF)", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/6/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,NHKP,Parcela,Adresa,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-7", "name": "Areál s národnými kultúrnymi pamiatkami (zapísanými v ÚZPF)", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/7/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,NHKP,Parcela,Adresa,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-8", "name": "Národná kultúrna pamiatka - objekt mimo PR (zapísaná v ÚZPF)", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/8/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,NHKP,Parcela,Adresa,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-9", "name": "Ochranné pásmo pamiatkovej rezervácie Banská Bystrica", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/9/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-10", "name": "Hranica centrálnej mestskej zóny", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/10/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-11", "name": "Pamiatková rezervácia Banská Bystrica", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/11/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-14", "name": "Tunel na odvedenie veľkých vôd - návrh", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/14/query?where=1%3D1&outFields=OBJECTID,VPS,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-15", "name": "Lesopark a prímestský les - stav", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/15/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Typ,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-16", "name": "Lesopark a prímestský les - návrh", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/16/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Typ,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-17", "name": "Pešia trasa doplnková", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/17/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-18", "name": "Železničná siet - stav", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/18/query?where=1%3D1&outFields=OBJECTID,Trat,OP,VPS,Zobraz,JEV_ID,ETAPA,ENTITA_ID,Typ,Label,Poznamka,Poskytovatel,META_ID,RU&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-19", "name": "Železničná siet - návrh", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/19/query?where=1%3D1&outFields=OBJECTID,Trat,OP,VPS,Zobraz,JEV_ID,ETAPA,ENTITA_ID,Typ,Label,Poznamka,Poskytovatel,META_ID,RU&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-20", "name": "Pešia turistická trasa", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/20/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID,RU&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-21", "name": "Vodné toky ostatné", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/21/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-21", "name": "Vodné toky ostatné", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/21/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=1000&resultRecordCount=1000"}, {"key": "3a-22", "name": "Doprava", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/22/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod,Kategoria,Oznacenie,Okruhy,VPS,RU,Label,Poznamka,Poskytovatel,META_ID,Zobraz,Sirka,Rychlost&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-22", "name": "Doprava", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/22/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod,Kategoria,Oznacenie,Okruhy,VPS,RU,Label,Poznamka,Poskytovatel,META_ID,Zobraz,Sirka,Rychlost&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=1000&resultRecordCount=1000"}, {"key": "3a-23", "name": "Základný komunikačný systém – dopravné okruhy a radiály", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/23/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod,Kategoria,Oznacenie,Okruhy,VPS,RU,Label,Poznamka,Poskytovatel,META_ID,Zobraz,Sirka,Rychlost&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "3a-24", "name": "Bežkárske trasy", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/24/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}]
        root = [{ "page": this }.merge({"key": "3a-0", "name": "Hranica riešeného územia"})].concat($rest)
    - unarchive:
        format: json_array
    - switch:
        - check: this.url.or(null) != null
          processors:
            - mapping: |
                meta url = this.url
                meta key = this.key
                meta name = this.name
                root = ""
            - http:
                url: "${! @url }"
                verb: GET
                headers:
                  Accept: application/geo+json
                  User-Agent: "joinedcontext-platform open-data pipeline (https://data.dev.joinedcontext.com)"
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page %v did not come: %v".format(@url, error())) } else { { "page": this, "key": @key, "name": @name } }
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        let key = this.key
        let name = this.name
        root = if this.page.error.or(null) != null || this.page.features.or(null) == null { throw("the layer %v answered no features: %v".format($key, this.page.error.message.or(""))) } else { this.page.features.map_each(f -> f.merge({ "properties": { "vrstva": $name, "vrstva_id": "%v-%v".format($key, f.id) } })) }
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "dtm-bb-funkcne-vyuzitie-uzemia-" + [this.properties."vrstva_id"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("LandUsePlanFeature", "banskabystrica.sk", env("JC_SPACE"), $local),
          "type": "LandUsePlanFeature",
          "jEVID": this.properties."JEV_ID".apply("integer"),
          "eTAPA": this.properties."ETAPA".apply("integer"),
          "eNTITAID": this.properties."ENTITA_ID".apply("string"),
          "label": this.properties."Label".apply("string"),
          "poznamka": this.properties."Poznamka".apply("string"),
          "uPID": this.properties."UP_ID".apply("string"),
          "nazovUP": this.properties."Nazov_UP".apply("string"),
          "vydal": this.properties."Vydal".apply("string"),
          "platiOd": this.properties."Plati_od".apply("string"),
          "obstaravatel": this.properties."Obstaravatel".apply("string"),
          "spracovatel": this.properties."Spracovatel".apply("string"),
          "referencnyPodklad": this.properties."Referencny_podklad".apply("string"),
          "datumRP": this.properties."Datum_RP".apply("string"),
          "poskytovatel": this.properties."Poskytovatel".apply("string"),
          "mETAID": this.properties."META_ID".apply("string"),
          "nazov": this.properties."Nazov".apply("string"),
          "cislo": this.properties."Cislo".apply("string"),
          "nHKP": this.properties."NHKP".apply("string"),
          "parcela": this.properties."Parcela".apply("string"),
          "adresa": this.properties."Adresa".apply("string"),
          "vPS": this.properties."VPS".apply("string"),
          "typ": this.properties."Typ".apply("string"),
          "trat": this.properties."Trat".apply("string"),
          "oP": this.properties."OP".apply("string"),
          "zobraz": this.properties."Zobraz".apply("string"),
          "rU": this.properties."RU".apply("integer"),
          "kod": this.properties."Kod".apply("string"),
          "kategoria": this.properties."Kategoria".apply("string"),
          "oznacenie": this.properties."Oznacenie".apply("string"),
          "okruhy": this.properties."Okruhy".apply("integer"),
          "sirka": this.properties."Sirka".apply("integer"),
          "rychlost": this.properties."Rychlost".apply("integer"),
          "kodCely": this.properties."Kod_cely".apply("string"),
          "kodZjednodus": this.properties."Kod_zjednodus".apply("float"),
          "uO": this.properties."UO".apply("string"),
          "castMesta": this.properties."Cast_mesta".apply("string"),
          "funkcia": this.properties."Funkcia".apply("string"),
          "bytyHBV": this.properties."Byty_HBV".apply("string"),
          "bytyIBV": this.properties."Byty_IBV".apply("string"),
          "vyska": this.properties."Vyska".apply("string"),
          "specReg": this.properties."Spec_reg".apply("string"),
          "intervReg": this.properties."Interv_reg".apply("string"),
          "indivReg": this.properties."Indiv_reg".apply("integer"),
          "kodSV": this.properties."Kod_SV".apply("integer"),
          "dlzky": this.properties."dlzky".apply("integer"),
          "vrstva": this.properties."vrstva".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Mesto Banská Bystrica (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/3a___Priestorov%C3%A9_usporiadanie_a_funk%C4%8Dn%C3%A9_vyu%C5%BEitie_%C3%BAzemia/MapServer/0/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,UP_ID,Nazov_UP,Vydal,Plati_od,Obstaravatel,Spracovatel,Referencny_podklad,Datum_RP,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bb-dtm-bb-funkcne-vyuzitie-uzemia" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
