# One AirQualityObserved per record of `eea-sk0263a-pm25`, written into the city's public space through its one Endpoint (PL-18, T-2781).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: ovzdusie-pm25
  namespace: banskabystrica
  title: { sk: "PM2.5 na stanici SK0263A", en: "PM2.5 at station SK0263A" }
spec:
  class: auto
  # As for PM10, two minutes later so the two streams do not merge into the same entity at once.
  period: 1h
  schedule: "42 * * * *"
  source:
    dataSourceRef: { kind: DataSource, name: eea-sk0263a-pm25 }
  targetEndpoint: urn:ngsi-ld:Endpoint:banskabystrica.sk:banskabystrica-verejne:banskabystrica-verejne
  output:
    type: AirQualityObserved
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
