apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: skoly-read
  namespace: banskabystrica
  title: { sk: "Verejné čítanie: školy" }
spec:
  contextSpaceRef: { kind: ContextSpace, name: banskabystrica-verejne }
  assigner: did:web:{orgDomain}
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint banskabystrica-skoly, and only
  # its types: the space's other types stay with their own datasets (T-4344).
  operations: [retrieveOps, retrieveEntityTypes, retrieveEntityTypeDetails, retrieveEntityTypeInfo, retrieveAttrTypes, retrieveAttrTypeDetails, retrieveAttrTypeInfo, createSubscription, retrieveSubscription, updateSubscription, deleteSubscription]
  information:
    - entities:
        - type: Organization
