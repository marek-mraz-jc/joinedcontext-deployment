apiVersion: joinedcontext.com/v1alpha1
kind: Project
metadata:
  name: banskabystrica
  namespace: org
  title: { sk: Mesto Banská Bystrica, en: City of Banská Bystrica }
  description:
    sk: Mesto so 72 123 obyvateľmi; publikuje to, čo patrí mestu. Kraj je samostatný projekt `bbsk`.
    en: 'The city: 72 123 people, publishing what a city owns. The region is its own project, `bbsk`.'
  # The sample of real open data the first-run checklist offers every newcomer (PF-109, T-3234):
  # every signed-in person reads it through `viewers`; the label grants nothing more.
  labels: { joinedcontext.com/sample: 'true' }
spec:
  organizationRef: hel
  # Who publishes this data, the did:web assigner of its Apps' Policies (PF-108); describes, grants nothing.
  domain: banskabystrica.sk
  # The body that publishes the project's catalogue /catalog/banskabystrica.jsonld, by its registry IRI
  # (EP-127, API/08 section 6). The desk is the installation's own, so no address is invented (T-4596).
  catalog:
    publisher:
      name: { sk: Mesto Banská Bystrica, en: City of Banská Bystrica }
      uri: https://data.gov.sk/id/legal-subject/00313271
    contactPoint: { name: joinedcontext platform, email: hello@joinedcontext.com }
  # Owner, 2026-09-25 (T-2873): no demo work and no city dataset is refused by a quota, so every
  # project allows 100 of each countable kind and runtime ceilings nobody reaches (PF-73). The
  # quota stays as the mechanism; what the node holds is the operator's bounds file (PF-97).
  quotas:
    contextSpaces: 100
    residentPipelines: 100
    # 110 since T-4514 brought the city's public endpoints to 11: the room of 90 stays.
    publicEndpoints: 110
    apps: 100
    ingestEventsPerSecond: 500
    agentRunsPerDay: 2000
    entitiesPerSpace: 1000000
    requestsPerMinute: 6000
    # The MQTT demo (T-4857, ADR-N-048 §2.9): one broker, `ovzdusie`, on the platform address.
    mqtt:
      enabled: true
      brokers: 1
      connections: 20
      messagesPerSecond: 20
      maxMessageBytes: 4096
