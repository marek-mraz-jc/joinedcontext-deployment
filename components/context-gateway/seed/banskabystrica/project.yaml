apiVersion: joinedcontext.com/v1alpha1
kind: Project
metadata:
  name: banskabystrica
  namespace: org
  title: { sk: "Mesto Banská Bystrica", en: "City of Banská Bystrica" }
  description:
    sk: "Mesto so 72 123 obyvateľmi; publikuje to, čo patrí mestu. Kraj je samostatný projekt `bbsk`."
    en: "The city: 72 123 people, publishing what a city owns. The region is its own project, `bbsk`."
spec:
  organizationRef: hel
  # The smaller tenant of the same node, tighter still (PF-73), and `publicEndpoints` is exactly
  # what it publishes today (`public-air`): the endpoints page of this project is where the
  # pre-emptive quota warning of T-1594 is true and can be read, on dev and in the demo.
  quotas:
    # Four spaces: the seeded `ovzdusie`, the raw cube rows in `banskabystrica-mesto`, the
    # indicators in `banskabystrica-kpi` and the city's open data in `banskabystrica-verejne`
    # (T-2781). Seventeen pipelines: eleven streams into `banskabystrica-mesto`, four open-data
    # feeds and the two that compute the indicators. Two public endpoints: `public-air` and
    # `banskabystrica-verejne`; the city's indicators reach the region's application by a named
    # share and not by being public (EP-15).
    contextSpaces: 4
    residentPipelines: 17
    publicEndpoints: 2
    apps: 1
    ingestEventsPerSecond: 50
    agentRunsPerDay: 2000
    entitiesPerSpace: 10000
    requestsPerMinute: 600
