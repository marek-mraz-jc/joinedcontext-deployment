# One StreetlightPole per row of "DTM_BB-register-stlpov-VO" (T-4255); the supports the DTM codes as street-light poles (DTM_BB).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-dtm-bb-register-stlpov-vo
  namespace: banskabystrica
  title:
    sk: DTM_BB-register-stlpov-VO
    en: DTM_BB-register-stlpov-VO
spec:
  class: scheduled
  enabled: false
  schedule: 10 2 * * 4
  source:
    dataSourceRef:
      kind: DataSource
      name: od-dtm-bb-register-stlpov-vo
  targetEndpoint: urn:ngsi-ld:Endpoint:banskabystrica.sk:banskabystrica-otvorene-data:banskabystrica-otvorene-data
  output:
    type: StreetlightPole
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
