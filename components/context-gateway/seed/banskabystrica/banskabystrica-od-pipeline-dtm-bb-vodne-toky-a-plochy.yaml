# One WaterBody per row of "DTM_BB-vodne-toky-a-plochy" (T-4255); the definition point of each stream, reservoir and channel (DTM_BB).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-dtm-bb-vodne-toky-a-plochy
  namespace: banskabystrica
  title:
    sk: DTM_BB-vodne-toky-a-plochy
    en: DTM_BB-vodne-toky-a-plochy
spec:
  class: scheduled
  enabled: false
  schedule: 26 5 * * 4
  source:
    dataSourceRef:
      kind: DataSource
      name: od-dtm-bb-vodne-toky-a-plochy
  targetEndpoint: urn:ngsi-ld:Endpoint:banskabystrica.sk:banskabystrica-otvorene-data:banskabystrica-otvorene-data
  output:
    type: WaterBody
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
