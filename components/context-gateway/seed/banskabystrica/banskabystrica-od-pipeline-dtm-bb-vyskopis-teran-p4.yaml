# One TerrainFeature per row of "DTM_BB-vyskopis-teran" (T-4255); contour lines, their height labels and terrain edges (DTM_BB).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-dtm-bb-vyskopis-teran-p4
  namespace: banskabystrica
  title:
    sk: DTM_BB-vyskopis-teran
    en: DTM_BB-vyskopis-teran
spec:
  class: scheduled
  enabled: false
  schedule: 54 5 * * 1
  source:
    dataSourceRef:
      kind: DataSource
      name: od-dtm-bb-vyskopis-teran-p4
  targetEndpoint: urn:ngsi-ld:Endpoint:banskabystrica.sk:banskabystrica-otvorene-data:banskabystrica-otvorene-data
  output:
    type: TerrainFeature
    mode: upsert
  quotas:
    maxMemoryMb: 256
    cpuMillicores: 100
