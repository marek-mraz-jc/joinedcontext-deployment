# The one public door of the air-quality space (EP-16, GW22): anonymous reads of what the
# `public-read` Policy allows, and the dataset the open-data catalogue carries (EP-62).
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: public-air
  namespace: banskabystrica
  # What the dataset page and the endpoint's own DCAT-AP record show: `dct:title` and
  # `dct:description` are read from here (EP-27), and the catalogue maps them to the dataset's
  # title and notes. Slovak first: the space's own locale is `sk`.
  title: { sk: "Kvalita ovzdušia v Banskej Bystrici", en: "Air quality in Banská Bystrica" }
  description:
    sk: "Merania kvality ovzdušia z monitorovacích staníc mesta Banská Bystrica: PM10, PM2.5, čas merania a spoľahlivosť záznamu, jedna položka na stanicu a meranie."
    en: "Air-quality readings from the monitoring stations of the city of Banská Bystrica: PM10, PM2.5, the time of the reading and how reliable it is, one record per station and reading."
spec:
  contextSpaceRef: ovzdusie
  slug: mluyob4nz52lok3ssk7pgn5vwt
  audience: public
  # `csv` is what a tabular consumer reads, and what the catalogue's DataStore sheet is filled
  # from: the sheet is read through this representation as an ordinary consumer, so an endpoint
  # that serves none can carry no preview, no filtered API and no SQL over its rows (EP-64,
  # Architecture/21 §3, T-2432). `xlsx` is the same rows for a person who opens them in a
  # spreadsheet; `zip` is left out, a third copy of the same readings nobody rebuilds.
  enabledRepresentations: [ngsi-ld, geojson, csv, xlsx, mcp]
  # Cleared for the catalogue by the owner (T-2407) and held back by the integrator: the space
  # holds 13 test stations at Helsinki's coordinates with no pm10/pm25 (seeded 2026-09-17), not
  # the city's readings. Put back once the space holds Banská Bystrica's own data:
  #   publish: { ckan: { instanceRef: { kind: CkanInstance, name: banskabystrica },
  #                      datastore: { representation: csv, refresh: onReconcile } } }
  # No licence, frequency or source yet: the space holds seeded test stations, not the city's readings
  # (see `publish` above). They follow the air-quality source of T-2781; a licence is read from
  # that source, never assumed (T-2790).
  catalog:
    publisher: { name: { sk: "Mesto Banská Bystrica", en: "City of Banská Bystrica" }, uri: "https://www.banskabystrica.sk/" }
    themes: [ENVI, HEAL]
    keywords:
      sk: ["kvalita ovzdušia", "PM10", "PM2.5", "Banská Bystrica"]
      en: ["air quality", "PM10", "PM2.5", "Banská Bystrica"]
    spatial:
      - SK032
      - "https://data.gov.sk/id/lau2/SK0321508438"
