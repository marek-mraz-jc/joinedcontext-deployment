pipeline:
  processors:
    - mapping: |
        let rest = [{"key": "5b-11", "name": "Telekomunikačné vedenie", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5b___Verejn%C3%A9_technick%C3%A9_vybavenie___plyn_a_teplo/MapServer/11/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=18000&resultRecordCount=1000"}, {"key": "5b-11", "name": "Telekomunikačné vedenie", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5b___Verejn%C3%A9_technick%C3%A9_vybavenie___plyn_a_teplo/MapServer/11/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=19000&resultRecordCount=1000"}, {"key": "5b-11", "name": "Telekomunikačné vedenie", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5b___Verejn%C3%A9_technick%C3%A9_vybavenie___plyn_a_teplo/MapServer/11/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=20000&resultRecordCount=1000"}, {"key": "5b-11", "name": "Telekomunikačné vedenie", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5b___Verejn%C3%A9_technick%C3%A9_vybavenie___plyn_a_teplo/MapServer/11/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=21000&resultRecordCount=1000"}, {"key": "5b-11", "name": "Telekomunikačné vedenie", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5b___Verejn%C3%A9_technick%C3%A9_vybavenie___plyn_a_teplo/MapServer/11/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orde