%A1cie/MapServer/1/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Cislo,Nazov,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "5c-3", "name": "Tabuľka", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5c___Verejn%C3%A9_technick%C3%A9_vybavenie___elektrick%C3%A1_energia_a_telekomunik%C3%A1cie/MapServer/3/query?where=1%3D1&outFields=OBJECTID,TYP,POPIS,SIZE&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "5c-19", "name": "Funkčné plochy", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5c___Verejn%C3%A9_technick%C3%A9_vybavenie___elektrick%C3%A1_energia_a_telekomunik%C3%A1cie/MapServer/19/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod_cely,Kod,Kod_zjednodus,UO,Cast_mesta,Funkcia,Byty_HBV,Byty_IBV,Vyska,Nazov,VPS,RU,Spec_reg,Interv_reg,Indiv_reg,Kod_SV,dlzky,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000"}, {"key": "5c-19", "name": "Funkčné plochy", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5c___Verejn%C3%A9_technick%C3%A9_vybavenie___elektrick%C3%A1_energia_a_telekomunik%C3%A1cie/MapServer/19/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod_cely,Kod,Kod_zjednodus,UO,Cast_mesta,Funkcia,Byty_HBV,Byty_IBV,Vyska,Nazov,VPS,RU,Spec_reg,Interv_reg,Indiv_reg,Kod_SV,dlzky,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=1000&resultRecordCount=1000"}, {"key": "5c-19", "name": "Funkčné plochy", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5c___Verejn%C3%A9_technick%C3%A9_vybavenie___elektrick%C3%A1_energia_a_telekomunik%C3%A1cie/MapServer/19/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod_cely,Kod,Kod_zjednodus,UO,Cast_mesta,Funkcia,Byty_HBV,Byty_IBV,Vyska,Nazov,VPS,RU,Spec_reg,Interv_reg,Indiv_reg,Kod_SV,dlzky,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=2000&resultRecordCount=1000"}, {"key": "5c-19", "name": "Funkčné plochy", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5c___Verejn%C3%A9_technick%C3%A9_vybavenie___elektrick%C3%A1_energia_a_telekomunik%C3%A1cie/MapServer/19/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod_cely,Kod,Kod_zjednodus,UO,Cast_mesta,Funkcia,Byty_HBV,Byty_IBV,Vyska,Nazov,VPS,RU,Spec_reg,Interv_reg,Indiv_reg,Kod_SV,dlzky,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=3000&resultRecordCount=1000"}, {"key": "5c-19", "name": "Funkčné plochy", "url": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5c___Verejn%C3%A9_technick%C3%A9_vybavenie___elektrick%C3%A1_energia_a_telekomunik%C3%A1cie/MapServer/19/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Kod_cely,Kod,Kod_zjednodus,UO,Cast_mesta,Funkcia,Byty_HBV,Byty_IBV,Vyska,Nazov,VPS,RU,Spec_reg,Interv_reg,Indiv_reg,Kod_SV,dlzky,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=4000&resultRecordCount=1000"}]
        root = [{ "page": this }.merge({"key": "5b-11", "name": "Telekomunikačné vedenie"})].concat($rest)
    - unarchive:
        format: json_array
    - switch:
        - check: this.url.or(null) != null
          processors:
            - mapping: |
                meta url = this.url
                meta key = this.key
                meta name = this.name
                root = ""
            - http:
                url: "${! @url }"
                verb: GET
                headers:
                  Accept: application/geo+json
                  User-Agent: "joinedcontext-platform open-data pipeline (https://data.dev.joinedcontext.com)"
                timeout: 60s
                retries: 2
                rate_limit: pipeline_egress
            - mapping: |
                root = if errored() { throw("the page %v did not come: %v".format(@url, error())) } else { { "page": this, "key": @key, "name": @name } }
    # A layer that answers an error or no feature list is the service failing, so the run fails
    # where it can be seen rather than writing nothing.
    - mapping: |
        let key = this.key
        let name = this.name
        root = if this.page.error.or(null) != null || this.page.features.or(null) == null { throw("the layer %v answered no features: %v".format($key, this.page.error.message.or(""))) } else { this.page.features.map_each(f -> f.merge({ "properties": { "vrstva": $name, "vrstva_id": "%v-%v".format($key, f.id) } })) }
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "dtm-bb-verejne-dopravne-a-technicke-p9-" + [this.properties."vrstva_id"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("LandUsePlanFeature", "banskabystrica.sk", env("JC_SPACE"), $local),
          "type": "LandUsePlanFeature",
          "jEVID": this.properties."JEV_ID".apply("integer"),
          "eTAPA": this.properties."ETAPA".apply("integer"),
          "eNTITAID": this.properties."ENTITA_ID".apply("string"),
          "uPID": this.properties."UP_ID".apply("string"),
          "nazovUP": this.properties."Nazov_UP".apply("string"),
          "vydal": this.properties."Vydal".apply("string"),
          "platiOd": this.properties."Plati_od".apply("string"),
          "obstaravatel": this.properties."Obstaravatel".apply("string"),
          "spracovatel": this.properties."Spracovatel".apply("string"),
          "referencnyPodklad": this.properties."Referencny_podklad".apply("string"),
          "datumRP": this.properties."Datum_RP".apply("string"),
          "poskytovatel": this.properties."Poskytovatel".apply("string"),
          "mETAID": this.properties."META_ID".apply("string"),
          "label": this.properties."Label".apply("string"),
          "poznamka": this.properties."Poznamka".apply("string"),
          "cislo": this.properties."Cislo".apply("string"),
          "nazov": this.properties."Nazov".apply("string"),
          "typ": this.properties."Typ".apply("string"),
          "oP": this.properties."OP".apply("string"),
          "lokalita": this.properties."Lokalita".apply("string"),
          "trat": this.properties."Trat".apply("string"),
          "rU": this.properties."RU".apply("integer"),
          "vPS": this.properties."VPS".apply("string"),
          "zobraz": this.properties."Zobraz".apply("string"),
          "kod": this.properties."Kod".apply("string"),
          "kategoria": this.properties."Kategoria".apply("string"),
          "oznacenie": this.properties."Oznacenie".apply("string"),
          "okruhy": this.properties."Okruhy".apply("integer"),
          "sirka": this.properties."Sirka".apply("integer"),
          "rychlost": this.properties."Rychlost".apply("integer"),
          "kodCely": this.properties."Kod_cely".apply("string"),
          "kodZjednodus": this.properties."Kod_zjednodus".apply("float"),
          "uO": this.properties."UO".apply("string"),
          "castMesta": this.properties."Cast_mesta".apply("string"),
          "funkcia": this.properties."Funkcia".apply("string"),
          "bytyHBV": this.properties."Byty_HBV".apply("string"),
          "bytyIBV": this.properties."Byty_IBV".apply("string"),
          "vyska": this.properties."Vyska".apply("string"),
          "specReg": this.properties."Spec_reg".apply("string"),
          "intervReg": this.properties."Interv_reg".apply("string"),
          "indivReg": this.properties."Indiv_reg".apply("integer"),
          "kodSV": this.properties."Kod_SV".apply("integer"),
          "dlzky": this.properties."dlzky".apply("integer"),
          "kota": this.properties."Kota".apply("integer"),
          "objem": this.properties."Objem".apply("string"),
          "maxHl": this.properties."Max_hl".apply("integer"),
          "dN": this.properties."DN".apply("string"),
          "popis": this.properties."Popis".apply("string"),
          "tYP": this.properties."TYP".apply("string"),
          "pOPIS": this.properties."POPIS".apply("string"),
          "sIZE": this.properties."SIZE".apply("float"),
          "vrstva": this.properties."vrstva".apply("string"),
          "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
          "dataProvider": { "type": "Property", "value": "Mesto Banská Bystrica (CC BY-SA 4.0)" },
          "source": { "type": "Property", "value": "https://dtm-banskabystrica.tmapserver.sk/arcgis/rest/services/up/5b___Verejn%C3%A9_technick%C3%A9_vybavenie___plyn_a_teplo/MapServer/11/query?where=1%3D1&outFields=OBJECTID,JEV_ID,ETAPA,ENTITA_ID,Label,Poznamka,Poskytovatel,META_ID&orderByFields=OBJECTID&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=17000&resultRecordCount=1000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bb-dtm-bb-verejne-dopravne-a-technicke-vybavenie" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
