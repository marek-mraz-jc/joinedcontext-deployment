# The generated pipelines upsert; nothing deletes, since several pipelines write the space (PL-64).
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: otvorene-data-pipelines-write
  namespace: banskabystrica
  title:
    sk: Kanály zapisujú otvorené dáta
    en: The pipelines write the open data
spec:
  contextSpaceRef:
    kind: ContextSpace
    name: banskabystrica-otvorene-data
  assigner: did:web:{orgDomain}
  assignee:
    kind: serviceAccount
    id: pipelines
  operations:
  - upsertBatch
  - createBatch
  - queryBatch
  information:
  - entities:
    - type: Address
    - type: AddressPoint
    - type: Article
    - type: Building
    - type: Contract
    - type: CouncilMeeting
    - type: Footway
    - type: Grant
    - type: GreenArea
    - type: GreenAreaBoundary
    - type: LandUsePlanFeature
    - type: ParkingArea
    - type: PurchaseOrder
    - type: Road
    - type: RoadSegment
    - type: StatisticalObservation
    - type: StreetlightPole
    - type: TerrainFeature
    - type: TrafficSign
    - type: Tree
    - type: WaterBody
