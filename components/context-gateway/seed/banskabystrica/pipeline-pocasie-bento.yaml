# The mapping of the pocasie pipeline (PL-03, T-4153): the latest minute of SHMÚ's automatic
# weather stations in and near Banská Bystrica, from the newest five-minute file of
# opendata.shmu.sk, one WeatherObserved per station.
#
# Stations, from SHMÚ's INSPIRE network of climatological stations (geo.shmu.sk ef-swn-cs, read
# 2026-10-15; `ind_kli` is the number in its identifier): 11898 Banská Bystrica-Zelená, 2.3 km
# from the square, and 11894 Donovaly, the resort above the city.
#
# Units from aws1min_metadata.json: `t` °C, `tlak` hPa, `vlh_rel` % (0 to 100, published as 0 to 1),
# `vie_pr_rych` m/s, `vie_vp_smer` degrees, `zra_uhrn` mm per minute. `minuta` is called SEČ, but
# SHMÚ writes Bratislava wall time minus one hour: UTC+1 in summer, UTC in winter (T-5645: on
# 2026-10-25, the day CEST ended, global radiation `zglo` at Zelená rose at 06:15 on 10-24 and at
# 05:15-05:30 on 10-25, with sunrise at about 05:30 UTC both days).
#
# TLS: opendata.shmu.sk sends its leaf without the intermediate (`openssl s_client`: verify
# return code 21). The intermediate is pinned below, the public certificate from the leaf's AIA
# URL http://crt.sectigo.com/SectigoPublicServerAuthenticationCADVR36.crt (Sectigo Public
# Server Authentication CA DV R36, SHA-256 8C:54:C3:34:B6:6B:A4:E4:26:77:2A:F4:A3:F9:13:6C:
# 19:A1:AE:C7:29:FD:B2:8C:53:5C:07:A5:A4:EF:22:E0, valid to 2036-03-21). Verification stays on;
# ponytail: when SHMÚ changes its CA the run fails with a certificate error, and the fix is the
# new intermediate here.

