    - mapping: |
        let stations = {
          "11898": { "sk": "Banská Bystrica - Zelená", "en": "Banská Bystrica - Zelená", "at": [19.115097, 48.733419] },
          "11894": { "sk": "Donovaly", "en": "Donovaly", "at": [19.223514, 48.875067] }
        }
        # SHMÚ's minute (Bratislava wall time minus one hour) to UTC, as RFC 3339: one hour back
        # where that instant is CEST, none where it is CET. The minutes 01:00-01:59 of the October
        # change day name both; the later instant wins unless it is still to come. A minute that
        # names neither (01:xx of the March change day, or one ahead of now) leaves that station out.
        # ponytail: a file read 00:00-01:00 UTC on the October change day relies on now().
        map utc {
          let n = this.ts_parse("2006-01-02T15:04:05").ts_unix()
          let summer = if ($n - 3600).ts_format("-07:00", "Europe/Bratislava") == "+02:00" { $n - 3600 } else { null }
          let winter = if $n.ts_format("-07:00", "Europe/Bratislava") == "+01:00" { $n } else { null }
          root = if $winter != null && $winter <= now().ts_unix() + 600 { $winter } else if $summer != null && $summer <= now().ts_unix() + 600 { $summer } else { throw("the SHMÚ minute %v is no Bratislava time minus one hour".format(this)) }.ts_format("2006-01-02T15:04:05Z", "UTC")
        }
        let rows = this.data.or([]).filter(r -> $stations.get(r.ind_kli.string()) != null && r.minuta.type() == "string")
        root = $stations.keys().sort().map_each(code -> $rows.filter(r -> r.ind_kli.string() == code).sort_by(r -> r.minuta)).filter(rs -> rs.length() > 0).map_each(rs -> rs.slice(-1).index(0).assign({
          "_at": rs.slice(-1).index(0).minuta.apply("utc").catch(null),
          # Soil temperature at the depths the station measures (`t_pod{cm}`), one instance per
          # depth, told apart by its datasetId (NGSI-LD multi-attribute, T-4557).
          "_soil": [5, 10, 20, 50, 100].filter(d -> rs.slice(-1).index(0).get("t_pod" + d.string()).type() == "number").map_each(d -> { "type": "Property", "value": rs.slice(-1).index(0).get("t_pod" + d.string()), "unitCode": "CEL", "datasetId": "urn:ngsi-ld:Dataset:shmu:soil-depth-%vcm".format(d) }),
          # The minutes of the ten up to the latest one that measured rain, as far as the file holds
          # them: none is no reading, never 0 mm (F-BNT1-016).
          "_rain": rs.filter(r -> r.minuta.ts_parse("2006-01-02T15:04:05").ts_unix() > rs.slice(-1).index(0).minuta.ts_parse("2006-01-02T15:04:05").ts_unix() - 600 && r.zra_uhrn.type() == "number").map_each(r -> r.zra_uhrn)
        })).filter(r -> r._at != null).map_each(r -> {
          "id": "urn:ngsi-ld:%v:%v:%v:shmu-%v".format("WeatherObserved", "banskabystrica.sk", env("JC_SPACE"), r.ind_kli),
          "type": "WeatherObserved",
          "name": { "type": "LanguageProperty", "languageMap": { "sk": "Stanica SHMÚ " + $stations.get(r.ind_kli.string()).sk, "en": "SHMÚ station " + $stations.get(r.ind_kli.string()).en } },
          "dateObserved": { "type": "Property", "value": r._at },
          "temperature": if r.t.type() == "number" { { "type": "Property", "value": r.t, "unitCode": "CEL", "observedAt": r._at } } else { deleted() },
          "relativeHumidity": if r.vlh_rel.type() == "number" && r.vlh_rel >= 0 && r.vlh_rel <= 100 { { "type": "Property", "value": (r.vlh_rel * 10).round() / 1000, "unitCode": "C62", "observedAt": r._at } } else { deleted() },
          "atmosphericPressure": if r.tlak.type() == "number" && r.tlak > 0 { { "type": "Property", "value": r.tlak, "unitCode": "A97", "observedAt": r._at } } else { deleted() },
          "windSpeed": if r.vie_pr_rych.type() == "number" && r.vie_pr_rych >= 0 { { "type": "Property", "value": r.vie_pr_rych, "unitCode": "MTS", "observedAt": r._at } } else { deleted() },
          "windDirection": if r.vie_vp_smer.type() == "number" && r.vie_vp_smer >= 0 && r.vie_vp_smer <= 360 { { "type": "Property", "value": r.vie_vp_smer, "unitCode": "DD", "observedAt": r._at } } else { deleted() },
          "precipitation": if r._rain.length() > 0 { { "type": "Property", "value": (r._rain.sum() * 10).round() / 10, "unitCode": "MMT", "observedAt": r._at } } else { deleted() },
          "soilTemperature": if r._soil.length() > 0 { r._soil.map_each(i -> i.merge({ "observedAt": r._at })) } else { deleted() },
          "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": $stations.get(r.ind_kli.string()).at } },
          "dataProvider": { "type": "Property", "value": "Slovenský hydrometeorologický ústav (SHMÚ), CC BY 4.0" },
          "source": { "type": "Property", "value": "https://opendata.shmu.sk/meteorology/climate/now/" }
        })
    # A file without the city's stations is a broken file, never weather that stopped.
    - mapping: |
        root = if this.length() == 0 { throw("the SHMÚ file %v holds no station of the city".format(@file)) } else { this }
