# The mapping of the public-air-pm10 pipeline (T-3120, PL-03): the latest valid hourly mean of
# particulate matter up to 10 µm at SK0263A, read from the same EEA file as ovzdusie-pm10, written
# into `ovzdusie` with the attributes of its model `bb-air-quality` and nothing else (DM-61): the
# station's name, code, provider and source live in the dataset's description, not on the entity.
# The decoding is ovzdusie-pm10's, line for line; test_banskabystrica_open_data holds them equal.

pipeline:
  processors:
    - parquet_decode: {}
    - archive:
        format: json_array
    - mapping: |
        let attribute = "pm10"
        let station = "SK0263A"
        # Parquet INT96: [nanoseconds of the day, low and high 32 bits, Julian day]. The times
        # are UTC+1, the offset EEA's download service has always used (its CSV printed
        # "+01:00"); read as UTC, the latest hour of a file fetched at 05:59 UTC ends at 06:00.
        map instant {
          root = ((this.index(2) - 2440588) * 86400 + ((this.index(1) * 4294967296 + this.index(0)) / 1000000000).floor() - 3600).ts_format("2006-01-02T15:04:05Z07:00", "UTC")
        }
        # Validity 1, 2 and 3 are valid readings; -1 and -99 are not (EEA vocabulary
        # "observationvalidity"). A value that is not a number, or is negative, is no reading.
        # The decoder hands INT96 and byte columns over as Go values Bloblang cannot index; read
        # back from the archived JSON they are plain arrays, numbers and strings.
        let valid = content().parse_json().or([]).filter(r -> [1, 2, 3].contains(r.Validity) && r.End.type() == "array" && r.End.length() == 3 && r.Value.number().catch(-1) >= 0)
        let latest = $valid.sort_by(r -> r.End.index(2) * 86400 + (r.End.index(1) * 4294967296 + r.End.index(0)) / 1000000000).slice(-1).index(0).catch(null)
        root = if $latest == null { [] } else { [{
          "id": "urn:ngsi-ld:%v:%v:%v:eea-%v".format("AirQualityObserved", env("JC_ORG_DOMAIN"), env("JC_SPACE"), $station),
          "type": "AirQualityObserved",
          $attribute: { "type": "Property", "value": $latest.Value.number(), "unitCode": "GQ", "observedAt": $latest.End.apply("instant") },
          "dateObserved": { "type": "Property", "value": $latest.End.apply("instant") },
          "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [19.115268, 48.733256] } }
        }] }
