# The data steward reads the demo sensors' readings (T-4857), as the journey checks them.
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: senzory-steward-read
  namespace: banskabystrica
  title: { sk: Správca údajov číta ukážkové senzory, en: The data steward reads the demo sensors }
spec:
  contextSpaceRef: { kind: ContextSpace, name: senzory }
  assigner: did:web:banskabystrica.sk
  assignee:
    kind: user
    id: de300000-0000-4000-8000-000000000001 # demo.steward
  operations:
    - retrieveOps
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: AirQualityObserved
