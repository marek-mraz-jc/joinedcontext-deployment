# A reading no source renewed for seven days leaves the Air quality dataset (T-3120): the EEA
# streams renew SK0263A every hour, so what ages out is a station nobody publishes any more,
# the 13 seeded test stations first. NGSI-LD has no entity lifetime, so the pipeline that reads
# the space back deletes them, through the same endpoint and Policy as every write (deleteBatch).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: public-air-reaper
  namespace: banskabystrica
  title: { sk: "Staré merania odchádzajú z datasetu Kvalita ovzdušia", en: "Stale readings leave the Air quality dataset" }
spec:
  class: auto
  period: 1h
  schedule: "52 * * * *"
  source:
    dataSourceRef: { kind: DataSource, name: public-air-live }
  targetEndpoint: urn:ngsi-ld:Endpoint:banskabystrica.sk:ovzdusie:public-air
  quotas:
    maxMemoryMb: 64
    cpuMillicores: 50
