# One Garden per row of "DTM_BB-register-verejnej-zelene-1" (T-4255); the definition point of each kept green area (DTM_BB).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-dtm-bb-register-verejnej-zelene
  namespace: banskabystrica
  title:
    sk: DTM_BB-register-verejnej-zelene-1
    en: DTM_BB-register-verejnej-zelene-1
spec:
  class: scheduled
  enabled: true
  schedule: 35 1 * * 6
  source:
    dataSourceRef:
      kind: DataSource
      name: od-dtm-bb-register-verejnej-zelene
  targetEndpoint: urn:ngsi-ld:Endpoint:banskabystrica.sk:banskabystrica-otvorene-data:banskabystrica-otvorene-data
