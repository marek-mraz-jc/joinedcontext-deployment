apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipelines
  namespace: banskabystrica
  title: { sk: Dávkovacie kanály mesta, en: City ingestion pipelines }
spec:
  owner: { user: de300000-0000-4000-8000-000000000001 } # demo.steward
  purpose: The Bento streams of the city demo write the published rows into banskabystrica-mesto and the indicators computed from them into banskabystrica-kpi, and the city's open data into banskabystrica-verejne, the air-quality readings into ovzdusie (T-3120), and every other table of its catalogue into banskabystrica-otvorene-data (T-4255)
  roles:
    - role: space-writer
      scope: { contextSpace: banskabystrica-mesto }
    - role: space-writer
      scope: { contextSpace: banskabystrica-kpi }
    - role: space-writer
      scope: { contextSpace: banskabystrica-verejne }
    - role: space-writer
      scope: { contextSpace: ovzdusie }
    - role: space-writer
      scope: { contextSpace: banskabystrica-otvorene-data }
    # The MQTT demo sensors (T-4857): pipeline mqtt-ovzdusie.
    - role: space-writer
      scope: { contextSpace: senzory }
  credentials:
    - kind: oauth-client
      name: main
