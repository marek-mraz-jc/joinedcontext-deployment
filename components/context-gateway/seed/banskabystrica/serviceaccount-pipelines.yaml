apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipelines
  namespace: banskabystrica
  title: { sk: "Dávkovacie kanály mesta", en: "City ingestion pipelines" }
spec:
  owner: { user: "demo.steward" }
  purpose: "The Bento streams of the city demo write the published rows into banskabystrica-mesto and the indicators computed from them into banskabystrica-kpi, and the city's open data into banskabystrica-verejne"
  roles:
    - { role: space-writer, scope: { contextSpace: banskabystrica-mesto } }
    - { role: space-writer, scope: { contextSpace: banskabystrica-kpi } }
    - { role: space-writer, scope: { contextSpace: banskabystrica-verejne } }
  credentials:
    - { kind: oauth-client, name: main }
