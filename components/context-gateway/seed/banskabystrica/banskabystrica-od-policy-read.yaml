# Anyone reads every type of the space: each is open data, and no mapping reads a column that names
# or reaches a person (Research/bb-bbsk-ngsi-ld-mapping.md §5).
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: otvorene-data-read
  namespace: banskabystrica
  title:
    sk: Verejné čítanie otvorených dát
    en: 'Public read: open data'
spec:
  contextSpaceRef:
    kind: ContextSpace
    name: banskabystrica-otvorene-data
  assigner: did:web:{orgDomain}
  assignee:
    kind: role
    id: public
  operations:
  - retrieveOps
  - retrieveEntityTypes
  - retrieveEntityTypeDetails
  - retrieveEntityTypeInfo
  - retrieveAttrTypes
  - retrieveAttrTypeDetails
  - retrieveAttrTypeInfo
  - createSubscription
  - retrieveSubscription
  - updateSubscription
  - deleteSubscription
  information:
  - entities:
    - type: Address
    - type: AddressPoint
    - type: Article
    - type: Building
    - type: Contract
    - type: CouncilMeeting
    - type: Footway
    - type: Grant
    - type: GreenArea
    - type: GreenAreaBoundary
    - type: LandUsePlanFeature
    - type: ParkingArea
    - type: PurchaseOrder
    - type: Road
    - type: RoadSegment
    - type: StatisticalObservation
    - type: StreetlightPole
    - type: TerrainFeature
    - type: TrafficSign
    - type: Tree
    - type: WaterBody
