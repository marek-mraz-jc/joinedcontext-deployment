# One WeatherObserved per SHMÚ station in and near the city, written into the city's public space
# through its one Endpoint every five minutes (T-4153, PL-18).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: pocasie
  namespace: banskabystrica
  title: { sk: "Počasie na staniciach SHMÚ", en: "Weather at the SHMÚ stations" }
spec:
  class: auto
  period: 5m
  # SHMÚ writes a file every five minutes; two minutes later it is on the server.
  schedule: "2-59/5 * * * *"
  source:
    dataSourceRef: { kind: DataSource, name: shmu-aws1min }
  targetEndpoint: urn:ngsi-ld:Endpoint:banskabystrica.sk:banskabystrica-verejne:banskabystrica-verejne
  output:
    type: WeatherObserved
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
