# The mapping of the od-adresy pipeline, generated from the T-4254 mapping: one Address per row of
# "Adresy" (https://data.dev.joinedcontext.com/dataset/bb-adresy). Do not edit: change the mapping and run scripts/open-data/generate.py.

pipeline:
  processors:
    - mapping: |
        root = if this.success.or(false) != true { throw("the catalogue answered no table") } else { this.result.records.or([]) }
    - unarchive:
        format: json_array
    - mapping: |
        map integer {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
        }
        map float {
          let v = this.number().catch(null)
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map string {
          let v = if this == null { "" } else { this.string().trim() }
          root = if $v == "" { null } else { { "type": "Property", "value": $v } }
        }
        map uri {
          root = this.apply("string")
        }
        # An Esri date is milliseconds since the epoch; a DataStore or WordPress one is text.
        # `match` rebinds `this` to what it matches, so the value is named first.
        map datetime {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
            "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        map date {
          let x = this
          let v = match $x.type() {
            "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
            "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else { null },
            _ => null,
          }
          root = if $v == null { null } else { { "type": "Property", "value": $v } }
        }
        let local = "adresy-" + {"Obec": this."Obec", "Časť_obce": this."Časť_obce", "Ulica": this."Ulica", "Súp._č.": this."Súp._č.", "Orient._č.": this."Orient._č."}.format_json(no_indent: true).hash("sha256").encode("hex").slice(0, 24).re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
        root = {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("Address", "banskabystrica.sk", env("JC_SPACE"), $local),
          "type": "Address",
          "obec": this."Obec".apply("string"),
          "castObce": this."Časť_obce".apply("string"),
          "ulica": this."Ulica".apply("string"),
          "supC": this."Súp._č.".apply("string"),
          "orientC": this."Orient._č.".apply("string"),
          "dataProvider": { "type": "Property", "value": "Mesto Banská Bystrica (CC BY 4.0)" },
          "source": { "type": "Property", "value": "https://data.dev.joinedcontext.com/api/3/action/datastore_search?resource_id=dfd84e65-70bc-4842-9785-ba756ec8b738&limit=32000" },
          "dataset": { "type": "Property", "value": "https://data.dev.joinedcontext.com/dataset/bb-adresy" }
        }.filter(entry -> entry.value != null)
    # One request per run's batch rather than one per row.
    - archive:
        format: json_array
