# One RoadSegment per row of "DTM_BB-register-ulic" (T-4255); the city's street segments (DTM_BB), reprojected from S-JTSK.
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: od-dtm-bb-register-ulic
  namespace: banskabystrica
  title:
    sk: DTM_BB-register-ulic
    en: DTM_BB-register-ulic
spec:
  class: scheduled
  enabled: false
  schedule: 35 1 * * 6
  source:
    dataSourceRef:
      kind: DataSource
      name: od-dtm-bb-register-ulic
  targetEndpoint: urn:ngsi-ld:Endpoint:banskabystrica.sk:banskabystrica-otvorene-data:banskabystrica-otvorene-data
  output:
    type: RoadSegment
    mode: upsert
  quotas:
    maxMemoryMb: 256
    cpuMillicores: 100
