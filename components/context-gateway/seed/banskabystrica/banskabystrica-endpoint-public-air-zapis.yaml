# The write door of ovzdusie (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes public-air served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint public-air.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: public-air-zapis
  namespace: banskabystrica
  title:
    sk: 'Kvalita ovzdušia v Banskej Bystrici: zápis'
    en: 'Air quality in Banská Bystrica: writes'
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint public-air.
    en: The internal door the data is written through; people read it through the public Endpoint public-air.
spec:
  contextSpaceRef: ovzdusie
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:banskabystrica.sk:ovzdusie:ovzdusie-pipelines-write
    - urn:ngsi-ld:Policy:banskabystrica.sk:ovzdusie:public-read
  slug: 2xwyaedxvvrqtomcjmtoc36gxtw2sxsk
  audience: organization
  enabledRepresentations: [ngsi-ld, websocket, ogc-features, mcp]
