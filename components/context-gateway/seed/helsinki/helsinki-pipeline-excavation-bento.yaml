# The mapping of the excavations pipeline (PL-03): one PublicAreaPermit per excavation notice of
# the city's public-area register (Allu), from the open WFS layer `Kaivuilmoitus_alue`.
#
# The layer holds one feature per area, and one application covers up to a hundred areas, each
# repeating the application number; the WFS row id is a row number that moves when the layer is
# rebuilt. So the permit is keyed by the application number, the register's own key, and its
# areas become one MultiPolygon. The applicant and the contractor (`hakija`, `tyon_suorittaja`)
# can name a person and are never read. A permit whose status, start or end the register does
# not state is dropped rather than guessed at.
#
# ponytail: a permit that leaves the layer stays in the space with its last state; a reader
# filters on `permitEnd`. A reaper like the vehicles' one is the upgrade if stale permits matter.

pipeline:
  processors:
    - mapping: |
        let kind = "excavation"
        let start_fields = ["tyo_alkaa", "tyo_alkaa"]
        let end_fields = ["tyo_paattyy", "tyo_paattyy"]
        let statuses = { "Tuleva": "upcoming", "Käynnissä": "ongoing", "Rakentaminen käynnissä": "setup", "Purkaminen käynnissä": "teardown" }
        # The WFS writes a field it has no value for as the string "None".
        map text {
          root = if this == null || this.string().trim() == "" || this.string() == "None" { null } else { this.string().trim() }
        }
        map day {
          root = if this != null && this.string().re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { this.string() } else { null }
        }
        let features = this.features.or([]).filter(f -> f.properties.hakemustunnus.or("").re_match("^[A-Z]{2}[0-9]{7}(-[0-9]+)?$"))
        let numbers = $features.map_each(f -> f.properties.hakemustunnus).unique()
        root = $numbers.map_each(number -> $features.filter(f -> f.properties.hakemustunnus == number)).map_each(areas -> {
          "props": areas.index(0).properties,
          "polygons": areas.map_each(f -> if f.geometry.type == "MultiPolygon" { f.geometry.coordinates } else { [f.geometry.coordinates] }).flatten()
        }).map_each(p -> p.assign({
          "status": $statuses.get(p.props.status.or("")).or(null),
          "start": p.props.get($start_fields.index(0)).apply("day").or(p.props.get($start_fields.index(1)).apply("day")),
          "end": p.props.get($end_fields.index(0)).apply("day").or(p.props.get($end_fields.index(1)).apply("day")),
          "name": p.props.nimi.apply("text"),
          "purpose": p.props.tyon_tarkoitus.apply("text"),
          "address": p.props.osoite.apply("text"),
          "district": p.props.kaupunginosa.or("").re_find_all("^[0-9]+").index(0).or(null)
        })).filter(p -> p.status != null && p.start != null && p.end != null).map_each(p -> {
          "id": "urn:ngsi-ld:%v:%v:%v:%v".format("PublicAreaPermit", env("JC_ORG_DOMAIN"), env("JC_SPACE"), p.props.hakemustunnus),
          "type": "PublicAreaPermit",
          "name": if p.name == null { null } else { { "type": "LanguageProperty", "languageMap": { "fi": p.name } } },
          "permitKind": { "type": "Property", "value": $kind },
          "permitNumber": { "type": "Property", "value": p.props.hakemustunnus },
          "permitStatus": { "type": "Property", "value": p.status },
          "permitStart": { "type": "Property", "value": p.start },
          "permitEnd": { "type": "Property", "value": p.end },
          "description": if p.purpose == null { null } else { { "type": "LanguageProperty", "languageMap": { "fi": p.purpose } } },
          "address": if p.address == null { null } else { { "type": "Property", "value": p.address } },
          # The district as the register names it, "20 LÄNSISATAMA": its number is the district
          # code of the city's division, so the permit points at that CityDistrict.
          "refDistrict": if p.district == null { null } else {
            { "type": "Relationship", "object": "urn:ngsi-ld:%v:%v:%v:district-%v".format("CityDistrict", env("JC_ORG_DOMAIN"), env("JC_SPACE"), p.district.number().int64()) }
          },
          "location": { "type": "GeoProperty", "value": { "type": "MultiPolygon", "coordinates": p.polygons } },
          "dataProvider": { "type": "Property", "value": "City of Helsinki, public-area permits (Allu)" },
          "source": { "type": "Property", "value": "https://kartta.hel.fi/ws/geoserver/avoindata/wfs?typeNames=avoindata:Kaivuilmoitus_alue" }
        }.filter(entry -> entry.value != null))
