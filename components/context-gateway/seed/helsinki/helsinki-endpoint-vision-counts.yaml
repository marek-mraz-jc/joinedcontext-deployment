# The machine vision counting pilot at Ratapihantie in spring 2023, one TrafficFlowObserved per lane,
# vehicle class and day (T-5669), read through its own Policy.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-vision-counts
  namespace: helsinki
  title:
    fi: Konenäön liikennelaskenta, Ratapihantie 2023 — Helsinki
    en: Machine vision traffic counts, Ratapihantie 2023 — Helsinki
  description:
    fi: >-
      Ajoneuvot, jotka yksi kamera laski konenäöllä Ratapihantien ja Rautatieläisenkadun risteyksessä 4.4.-6.6.2023
      (Wapice Oy:n tiedonkeruupilotti), kaistoittain, ajoneuvoluokittain ja päivittäin. Smart Data Models -tyyppi
      TrafficFlowObserved (intensity, vehicleType: car, bus, tram, motorcycle, bicycle, lorry); oma ominaisuus
      trafficDirection kertoo kulkusuunnan (north, south). Jalankulkijat ja sähköpotkulaudat eivät ole Smart Data
      Models -ajoneuvoluokkia, joten ne jätetään pois, samoin pilotin viimeinen vajaa päivä. Pilotin laatua ei ole
      tarkastettu käsin laskien. Lähde: Forum Virium Helsinki, CC BY 4.0.
    en: >-
      The vehicles one camera counted by machine vision at the Ratapihantie / Rautatieläisenkatu junction from
      2023-04-04 to 2023-06-06 (Wapice Oy's data collection pilot), per lane, vehicle class and day. Smart Data Models
      type TrafficFlowObserved (intensity, vehicleType: car, bus, tram, motorcycle, bicycle, lorry); the custom
      property trafficDirection names the direction of travel (north, south). Pedestrians and e-scooters are no Smart
      Data Models vehicle class and are left out, as is the pilot's last, partial day. The pilot's counts were not
      checked against manual counts. Source: Forum Virium Helsinki, CC BY 4.0.
