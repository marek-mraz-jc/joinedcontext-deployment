# The air sensors' broker (T-4857, MF-54, ADR-N-048): devices reach it over mqtts at
# sensors.helsinki.mqtt.<domain>:8883 with their own Keycloak token, and each publishes only on
# sensors/<its client id>/air. The ACL's last rule denies the rest; nothing is retained.
apiVersion: joinedcontext.com/v1alpha1
kind: MqttBroker
metadata:
  name: sensors
  namespace: helsinki
  title: { en: Helsinki air sensors, fi: Helsingin ilmanlaatuanturit }
spec:
  roles:
    - name: air-sensors
      serviceAccounts: [sensor-kallio]
      publish:
        - sensors/${clientid}/air
  limits: { maxMessageBytes: 1024, messagesPerSecond: 1, maxConnections: 20 }
