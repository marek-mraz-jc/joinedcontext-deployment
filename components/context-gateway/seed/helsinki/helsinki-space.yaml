apiVersion: joinedcontext.com/v1alpha1
kind: ContextSpace
metadata:
  name: helsinki
  namespace: helsinki
  title: { en: "Helsinki city context", fi: "Helsingin kaupunkikonteksti" }
  description:
    en: >-
      Today's events, the city bike stations, the buses of four trunk lines, and the city's open
      registers: services, beach water, parking, public-area permits and districts. Sources:
      City of Helsinki, HSL, FMI, Fintraffic and Forum Virium Helsinki, each under CC BY 4.0.
spec:
  # Pinned so no entity id changes: the space predates rendered segments (PF-84).
  urnSegment: helsinki
  isSandbox: false
  # The one model of this space: a write of a type it does not declare is refused (DM-61).
  dataModelRef: { kind: DataModel, name: helsinki }
  defaultLocale: en
  # How long the broker keeps each type's data (DM-81, ADR-N-046 2.1, T-3904); a type left out
  # is kept forever: the static GTFS (stops, routes, stations) and the registers. A vehicle
  # that stops reporting is gone five minutes after its last report, and its track is kept
  # eight hours. Departures live on their GtfsStop and the pipeline replaces them each round,
  # and an Alert leaves with its feed (the reapers), so neither has a duration of its own.
  retention:
    - entityType: Vehicle
      current: PT5M
      history: PT8H
  # Plausibility beside the model's own constraints (DM-86, ADR-N-046 2.4). The area is what
  # HSL's feeds cover: its region and the commuter trains to Riihimäki (Hyvinkää is a stop of
  # the recorded GTFS); 33.4 m/s is 120 km/h (HFP reports `spd` in m/s); a report more than
  # 30 s ahead of the clock is refused.
  quality:
    - name: vehicle-in-hsl-area
      entityType: Vehicle
      kind: area
      attribute: location
      bbox: [23.9, 59.85, 25.6, 60.8]
    - name: vehicle-speed
      entityType: Vehicle
      kind: range
      attribute: speed
      min: 0
      max: 33.4
    - name: vehicle-report-not-ahead
      entityType: Vehicle
      kind: freshness
      attribute: location
      maxAhead: PT30S
    - name: stop-in-hsl-area
      entityType: GtfsStop
      kind: area
      attribute: location
      bbox: [23.9, 59.85, 25.6, 60.8]
