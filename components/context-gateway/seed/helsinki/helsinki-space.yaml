apiVersion: joinedcontext.com/v1alpha1
kind: ContextSpace
metadata:
  name: helsinki
  namespace: helsinki
  title: { en: "Helsinki city context", fi: "Helsingin kaupunkikonteksti" }
  description:
    en: "Today's events, the city bike stations and the buses of four trunk lines, in one space"
spec:
  # Pinned so no entity id changes: the space predates rendered segments (PF-84).
  urnSegment: helsinki
  isSandbox: false
  # The one model of this space: a write of a type it does not declare is refused (DM-61).
  dataModelRef: { kind: DataModel, name: helsinki }
  defaultLocale: en
