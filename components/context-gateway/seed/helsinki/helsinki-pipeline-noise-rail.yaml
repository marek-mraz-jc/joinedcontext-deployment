# One NoiseZone per record of `hel-noise-rail`, written into the city space (T-5378).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: noise-rail
  namespace: helsinki
  title:
    en: Railway, metro and tram noise, day and night
spec:
  class: auto
  # The 2022 survey is a finished computation the city republishes rarely (layers last refreshed 2025-06-16); weekly is more than it needs.
  period: 168h
  schedule: '77 3 * * 3'
  source:
    dataSourceRef: { kind: DataSource, name: hel-noise-rail }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:helsinki:helsinki-all
  output: { type: NoiseZone, mode: upsert }
  quotas: { maxMemoryMb: 384, cpuMillicores: 100 }
