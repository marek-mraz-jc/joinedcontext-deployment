              {"id": "alu_asas_005h", "theme": "housing", "path": "asu/asas/alu_asas_005h.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Henkilöluku": ["*"], "Tiedot": ["*"]}},
              {"id": "alu_askan_005k", "theme": "housing", "path": "asu/askan/alu_askan_005k.px", "area": "Kunta", "time": "Vuosi", "every": "yearly", "keep": {"Talotyyppi": ["*"], "Valmistumisvuosi": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_askan_005l", "theme": "housing", "path": "asu/askan/alu_askan_005l.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "depth": "basicDistrict", "keep": {"Talotyyppi": ["*"], "Valmistumisvuosi": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_askan_005q", "theme": "housing", "path": "asu/askan/alu_askan_005q.px", "area": "Osa-alue", "time": "Vuosi", "every": "yearly", "depth": "basicDistrict", "keep": {"Käytössäolotilanne": ["*"], "Talotyyppi": ["ALL"], "Hallintaperuste": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_askan_005s", "theme": "housing", "path": "asu/askan/alu_askan_005s.px", "area": "Kunta", "time": "Vuosi", "every": "yearly", "keep": {"Hallintaperuste": ["*"], "Huoneistotyyppi": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_astuo_039h", "theme": "housing", "path": "rak/astuo/alu_astuo_039h.px", "area": "alue", "time": "vuonel", "every": "quarterly", "depth": "majorDistrict", "keep": {"raktoimpide": ["*"], "rakluokka": ["0000"], "huonlkm": ["0"], "Tiedot": ["*"]}},
              {"id": "alu_astuo_039j", "theme": "housing", "path": "rak/astuo/alu_astuo_039j.px", "area": "Alue", "time": "Vuosineljännes", "every": "quarterly", "depth": "basicDistrict", "keep": {"Rakennustoimenpide": ["*"], "Rakennusluokka": ["0000"], "Huoneiden lukumäärä": ["0"], "Rahoitus ja hallintaperuste": ["10yhteen"], "Rakennuttaja": ["0"], "Tiedot": ["*"]}},
              {"id": "alu_rakan_005v", "theme": "housing", "path": "asu/rakan/alu_rakan_005v.px", "area": "Kunta", "time": "Vuosi", "every": "yearly", "keep": {"Rakennuksen käyttötarkoitus": ["*"], "Valmistumisvuosi": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_rakan_005w", "theme": "housing", "path": "asu/rakan/alu_rakan_005w.px", "area": "Kunta", "time": "Vuosi", "every": "yearly", "keep": {"Rakennuksen käyttötarkoitus": ["*"], "Rakennuksen lämmitystapa": ["ALL"], "Rakennuksen lämmitysaine": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_rakan_005x", "theme": "housing", "path": "asu/rakan/alu_rakan_005x.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "depth": "basicDistrict", "keep": {"Rakennuksen käyttötarkoitus": ["ALL"], "Valmistumisvuosi": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_ratuo_039k", "theme": "housing", "path": "rak/ratuo/alu_ratuo_039k.px", "area": "alue", "time": "vuonel", "every": "quarterly", "depth": "basicDistrict", "keep": {"raktoimpide": ["*"], "rakluokka": ["YHT"], "Tiedot": ["*"]}},
              {"id": "alu_ratuo_039l", "theme": "housing", "path": "rak/ratuo/alu_ratuo_039l.px", "area": "alue", "time": "vuonel", "every": "quarterly", "depth": "basicDistrict", "keep": {"raktoimpide": ["*"], "rakluokka": ["YHT"], "Tiedot": ["*"]}},
              {"id": "alu_ratuo_039m", "theme": "housing", "path": "rak/ratuo/alu_ratuo_039m.px", "area": "alue", "time": "vuonel", "every": "quarterly", "depth": "basicDistrict", "keep": {"raktoimpide": ["*"], "rakluokka": ["YHT"], "Tiedot": ["*"]}},
              {"id": "alu_ratuo_039n", "theme": "housing", "path": "rak/ratuo/alu_ratuo_039n.px", "area": "alue", "time": "vuonel", "every": "quarterly", "depth": "basicDistrict", "keep": {"raktoimpide": ["*"], "rakluokka": ["YHT"], "Tiedot": ["*"]}},
              {"id": "alu_tyom_003s", "theme": "employment", "path": "tyo/tyom/alu_tyom_003s.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "depth": "basicDistrict", "keep": {"Pääasiallinen toiminta": ["*"], "Ikä": ["ALL"], "Sukupuoli": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_tyom_003v", "theme": "employment", "path": "tyo/tyom/alu_tyom_003v.px", "area": "Kunta", "time": "Vuosi", "every": "yearly", "keep": {"Pääasiallinen toiminta": ["*"], "Ikä": ["ALL"], "Sukupuoli": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_tyom_003x", "theme": "employment", "path": "tyo/tyom/alu_tyom_003x.px", "area": "Kunta", "time": "Vuosi", "every": "yearly", "keep": {"Pääasiallinen toiminta": ["*"], "Koulutusaste": ["ALL"], "Kieli": ["ALL"], "Sukupuoli": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_tyop_004a", "theme": "employment", "path": "tyo/tyop/alu_tyop_004a.px", "area": "Työpaikan alue", "time": "Vuosi", "every": "yearly", "keep": {"Toimiala": ["*"], "Tiedot": ["*"]}},
              {"id": "alu_tyov_004f", "theme": "employment", "path": "tyo/tyov/alu_tyov_004f.px", "area": "Kunta", "time": "Vuosi", "every": "yearly", "keep": {"Ikä": ["*"], "Sukupuoli": ["ALL"], "Pääasiallinen toiminta": ["lkm_tytyov"]}},
              {"id": "alu_tyov_004g", "theme": "employment", "path": "tyo/tyov/alu_tyov_004g.px", "area": "Kunta", "time": "Vuosi", "every": "yearly", "keep": {"Toimiala": ["*"], "Ikä": ["ALL"], "Sukupuoli": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_astul_011y", "theme": "income", "path": "tul/astul/alu_astul_011y.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "depth": "majorDistrict", "keep": {"Kvintiilien määrittelyperuste": ["*"], "Tuloluokka": ["ALL"], "Tiedot": ["*"]}}
            ]
            root = if $register.length() == 0 { throw("the sub-district register (Piirijako_osaalue) listed no sub-district") } else { $tables.map_each(t -> { "table": t, "register": $register }) }
        - unarchive: { format: json_array }
        - branch:
            request_map: |
              meta stat_path = if this.table.path.re_match("^[a-z]+(/[a-z]+)?/alu_[a-z]+_[0-9]{3}[a-z]\\.px$") { this.table.path } else { throw("not a statistics table path: %v".format(this.table.path)) }
              root = {
                "query": [
                  { "code": this.table.area, "selection": if this.table.areas != null { { "filter": "item", "values": this.table.areas } } else { { "filter": "all", "values": ["091*"] } } },
                  { "code": this.table.time, "selection": { "filter": "top", "values": ["1"] } }
                ].concat(this.table.keep.key_values().sort_by(kv -> kv.key).map_each(kv -> { "code": kv.key, "selection": if kv.value == ["*"] { { "filter": "all", "values": ["*"] } } else { { "filter": "item", "values": kv.value } } })),
                "response": { "format": "json-stat2" }
              }
            processors:
              - http:
                  url: https://stat.hel.fi/api/v1/fi/Aluesarjat/${! @stat_path }
                  verb: POST
                  headers:
                    Content-Type: application/json
                    Accept: application/json
                    User-Agent: joinedcontext-helsinki/1.0 (+https://dev.joinedcontext.com)
                  timeout: 30s
                  retries: 1
                  rate_limit: hel_stat
              - mapping: |
                  root = if content().length() > 4194304 { throw("stat.hel.fi answered %v bytes; more than 4194304 is not one period of one table".format(content().length())) } else { this }
            result_map: root.answer = this
        - mapping: |
            # The level of a Helsinki area code: 091, 91 or 0910000000 the city, 091{s}000000 a major
            # district, 091{s}{ppp}000 a basic district, 091{s}{ppp}{ooo} a sub-district, 09199{x}0000
            # the inner city or the suburbs; anything else (another town, 0919999999 "Muut") none.
            # A code or dimension name as one path segment: get() reads "1.1" (a building measure) or
            # "(0-17 v.)" as a path, so "~" and "." are escaped as ~0 and ~1.
            map key {
              root = this.string().replace_all("~", "~0").replace_all(".", "~1")
            }
            map depth_rank {
              root = if this == "subDistrict" { 3 } else if this == "basicDistrict" { 2 } else if this == "majorDistrict" || this == "cityPart" { 1 } else { 0 }
            }
            map area_level {
              root = if this == "091" || this == "91" || this == "0910000000" { "city" } else if this.re_match("^091[1-8]000000$") { "majorDistrict" } else if this.re_match("^091[1-8][0-9]{3}000$") { "basicDistrict" } else if this.re_match("^091[1-8][0-9]{6}$") { "subDistrict" } else if this.re_match("^09199[0-8]0000$") { "cityPart" } else { "" }
            }
            let t = this.table
            let ds = this.answer
            let register = this.register
            let ids = $ds.id.or([])
            let sizes = $ds.size.or([])
            let n = $ids.length()
            # JSON-stat 2.0 by the index and never by the order (T-2304): the position of a code is
            # dimension.{id}.category.index, and `value` is row-major over `size`.
            let codes = $ids.map_each(d -> $ds.dimension.get(d.apply("key")).category.index.key_values().sort_by(kv -> kv.value).map_each(kv -> kv.key))
            let strides = range(0, $n, 1).map_each(k -> if k + 1 >= $n { 1 } else { $sizes.slice(k + 1, $n).fold(1, x -> x.tally * x.value) })
            let breakdown = $ids.filter(d -> d != $t.area && d != $t.time)
            let named = $breakdown.filter(d -> d == "Tiedot" || $ds.dimension.get(d.apply("key")).category.index.keys().length() > 1)
            let cells = range(0, $ds.value.or([]).length(), 1).map_each(p -> { "at": range(0, $n, 1).map_each(k -> { $ids.index(k): $codes.index(k).index(((p / $strides.index(k)).floor().int64()) % $sizes.index(k)) }).squash(), "value": $ds.value.index(p) })
            let period = if $cells.length() == 0 { "" } else { $cells.index(0).at.get($t.time.apply("key")).string() }
            # The period's first and last day: a year (2025), a quarter (2026Q3) or a month (2026M08).
            let y = $period.slice(0, 4).number().int64().catch(0)
            let q = if $period.re_match("^[0-9]{4}Q[1-4]$") { $period.slice(5).number().int64() } else { 0 }
            let m = if $period.re_match("^[0-9]{4}M(0[1-9]|1[0-2])$") { $period.slice(5).number().int64() } else { 0 }
            let first_month = if $q > 0 { $q * 3 - 2 } else if $m > 0 { $m } else { 1 }
            let next_month = if $q > 0 { $q * 3 + 1 } else if $m > 0 { $m + 1 } else { 13 }
            let from = "%04d-%02d-01".format($y, $first_month)
            let next = if $next_month > 12 { "%04d-01-01".format($y + 1) } else { "%04d-%02d-01".format($y, $next_month) }
            let to = ($next.ts_parse("2006-01-02").ts_unix() - 86400).ts_format("2006-01-02", "UTC")
            let observed = "%vT00:00:00Z".format($to)
            let age_days = ((now().ts_unix() - $to.ts_parse("2006-01-02").ts_unix()) / 86400).floor()
            let max_age = $t.maxAgeDays.or(if $t.every == "monthly" { 92 } else if $t.every == "quarterly" { 276 } else { 1096 })
            let updated = $ds.updated.or("").ts_parse("2006-01-02T15:04:05Z07:00").ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)
            let rows = $cells.map_each(c -> c.merge({
              "areaCode": c.at.get($t.area.apply("key")).string(),
              "level": c.at.get($t.area.apply("key")).string().apply("area_level"),
              "measure": $breakdown.map_each(d -> $ds.dimension.get(d.apply("key")).category.label.get(c.at.get(d.apply("key")).apply("key"))).join(", "),
              # The name leaves out a breakdown of one value (a total such as Yhteensä) but the measure.
              "label": $named.map_each(d -> $ds.dimension.get(d.apply("key")).category.label.get(c.at.get(d.apply("key")).apply("key"))).join(", "),
              "key": $breakdown.map_each(d -> c.at.get(d.apply("key")).string().re_replace_all("[^A-Za-z0-9._]", "_")).join("-")
            })).map_each(c -> c.merge({
              "unit": if c.measure.contains("%") { "P1" } else if c.measure.contains("euroa") { "EUR" } else if c.measure.contains("m2") { "MTK" } else { "C62" },
              "id": "urn:ngsi-ld:%v:%v:%v:stat-%v-%v-%v-%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), $t.theme, $t.id, c.key, c.areaCode)
            })).map_each(c -> c.merge({
              "reason": if c.value == null { "no value" } else if c.level == "" { "not a Helsinki area" } else if c.value.type() != "number" { "not a number" } else if c.unit == "P1" && (c.value < 0 || c.value > 100) { "percentage outside 0..100" } else if c.value < 0 && !c.measure.lowercase().re_match("netto|korjaus|enemmyys|lisäys") { "negative count or amount" } else { "" }
            }))
            # A breakdown table may stop at a coarser level ("depth": majorDistrict or basicDistrict):
            # its sub-district totals are the integrated tables, and its breakdown by every sub-district
            # would multiply the indicators by about 150. Cells below the depth are out of scope, not dropped.
            let rows = if $t.depth == null { $rows } else { $rows.filter(c -> c.level.apply("depth_rank") <= $t.depth.apply("depth_rank")) }
            let kept = $rows.filter(c -> c.reason == "")
            let unique = $kept.unique(c -> c.id)
            let reasons = $rows.filter(c -> c.reason != "").map_each(c -> c.reason)
            let dropped = $reasons.unique().map_each(r -> { r: $reasons.filter(x -> x == r).length() }).squash()
            let dropped = if $kept.length() > $unique.length() { $dropped.merge({ "duplicate id": $kept.length() - $unique.length() }) } else { $dropped }
            let unlinked = $unique.filter(c -> c.level == "subDistrict" && !$register.contains(c.areaCode)).length()
            let dropped = if $unlinked > 0 { $dropped.merge({ "sub-district not in the register (written without refArea)": $unlinked }) } else { $dropped }
            let title = $ds.label.or($t.id).string().re_replace_all(" muuttujina .*$", "")
            let source = "https://stat.hel.fi/pxweb/fi/Aluesarjat/Aluesarjat__%v/%v/".format($t.path.re_replace_all("/[^/]+$", "").replace_all("/", "__"), $t.path.re_replace_all("^.*/", ""))
            root = if $cells.length() == 0 { throw("%v answered no cell".format($t.id)) } else if $y == 0 { throw("%v answered the period %v, which is no year, quarter or month".format($t.id, $period)) } else if $age_days > $max_age { throw("%v is stale: its newest period %v ended %v days ago, more than %v".format($t.id, $period, $age_days, $max_age)) } else if $unique.length() == 0 { throw("%v answered no usable cell: %v".format($t.id, $dropped.format_json(no_indent: true))) } else { {
              "table": $t.id,
              "period": $period,
              "dropped": $dropped,
              "entities": $unique.map_each(c -> {
                "id": c.id,
                "type": "KeyPerformanceIndicator",
                "name": { "type": "LanguageProperty", "languageMap": { "fi": "%v: %v – %v".format($title, c.label, $ds.dimension.get($t.area.apply("key")).category.label.get(c.areaCode.apply("key")).or(c.areaCode).re_replace_all("^091( [0-9]+)? ", "")) } },
                "description": { "type": "LanguageProperty", "languageMap": { "fi": $ds.label.or($t.id).string() } },
                "kpiValue": { "type": "Property", "value": c.value, "unitCode": c.unit, "observedAt": $observed },
                "calculationPeriod": { "type": "Property", "value": { "from": $from, "to": $to } },
                "calculationFrequency": { "type": "Property", "value": $t.every },
                "calculatedBy": { "type": "Property", "value": "City of Helsinki, Urban Research and Statistics" },
                "organization": { "type": "Property", "value": "City of Helsinki" },
                "process": { "type": "Property", "value": $ds.label.or($t.id).string() },
                "area": { "type": "Property", "value": $ds.dimension.get($t.area.apply("key")).category.label.get(c.areaCode.apply("key")).or(c.areaCode).re_replace_all("^091( [0-9]+)? ", "") },
                "districtCode": { "type": "Property", "value": if c.areaCode == "091" || c.areaCode == "91" { "0910000000" } else { c.areaCode } },
                "divisionLevel": { "type": "Property", "value": c.level },
                "refArea": if c.level == "subDistrict" && $register.contains(c.areaCode) { { "type": "Relationship", "object": "urn:ngsi-ld:%v:%v:%v:subdistrict-%v".format("AdministrativeArea", env("JC_ORG_DOMAIN"), env("JC_SPACE"), c.areaCode) } } else { null },
                "statisticsTable": { "type": "Property", "value": $t.id },
                "dimensionKey": { "type": "Property", "value": $breakdown.map_each(d -> "%v=%v".format(d, c.at.get(d.apply("key")))).join(";") },
                "updatedAt": if $updated == null { null } else { { "type": "Property", "value": $updated } },
                "dataProvider": { "type": "Property", "value": "City of Helsinki, Urban Research and Statistics (Aluesarjat), CC BY 4.0" },
                "source": { "type": "Property", "value": $source }
              }.filter(kv -> kv.value != null))
            } }
        - log:
            level: INFO
            message: 'statistics ${! this.table } ${! this.period }: ${! this.entities.length() } written, dropped ${! this.dropped.format_json(no_indent: true) }'
        - mapping: root = this.entities
