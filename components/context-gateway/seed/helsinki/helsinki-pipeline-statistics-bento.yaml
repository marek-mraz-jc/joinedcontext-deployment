              {"id": "alu_askan_005r", "theme": "housing", "path": "asu/askan/alu_askan_005r.px", "area": "Osa-alue", "time": "Vuosi", "every": "yearly", "keep": {"Huoneistotyyppi": ["ALL"], "Hallintaperuste": ["ALL"], "Tiedot": ["*"]}},
