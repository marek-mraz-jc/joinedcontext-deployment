              {"id": "alu_asas_005e", "theme": "housing", "path": "asu/asas/alu_asas_005e.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Asuntokunnan vanhimman ikä": ["*"], "Henkilöluku": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_asas_005f", "theme": "housing", "path": "asu/asas/alu_asas_005f.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Asuntokunnan koko": ["*"], "Talotyyppi": ["ALL"], "Tiedot": ["*"]}},
