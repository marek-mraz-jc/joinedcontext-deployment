              {"id": "alu_astuo_039g", "theme": "housing", "path": "rak/astuo/alu_astuo_039g.px", "area": "alue", "time": "vuonel", "every": "quarterly", "keep": {"raktoimpide": ["0"], "rakluokka": ["0000"], "huonlkm": ["0"], "Tiedot": ["*"]}},
              {"id": "alu_astuo_039i", "theme": "housing", "path": "rak/astuo/alu_astuo_039i.px", "area": "alue", "time": "vuonel", "every": "quarterly", "keep": {"raktoimpide": ["0"], "rakluokka": ["0000"], "huonlkm": ["0"], "Tiedot": ["*"]}},
