              {"id": "alu_ennak_006u", "theme": "population", "path": "vrm/ennak/alu_ennak_006u.px", "area": "Alue", "time": "Vuosineljännes", "every": "quarterly", "keep": {"Muuttosuunta": ["*"], "Kansalaisuus": ["Y"], "Lähtö- tai kohdealue": ["YHT"], "Tiedot": ["*"]}},
              {"id": "alu_mutau_009o", "theme": "population", "path": "vrm/mutau/alu_mutau_009o.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Sukupuoli": ["*"], "Koulutusaste": ["all"], "Tiedot": ["*"]}},
              {"id": "alu_mutau_009p", "theme": "population", "path": "vrm/mutau/alu_mutau_009p.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Sukupuoli": ["*"], "Koulutusaste": ["all"], "Tiedot": ["*"]}},
              {"id": "alu_perh_005y", "theme": "population", "path": "vrm/perh/alu_perh_005y.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "depth": "basicDistrict", "keep": {"Perhetyyppi": ["*"], "Tiedot": ["*"]}},
