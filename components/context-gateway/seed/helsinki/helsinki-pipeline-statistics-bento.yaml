              {"id": "alu_vamuu_010u", "theme": "population", "path": "vrm/vamuu/alu_vamuu_010u.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Sukupuoli": ["*"], "Ikä": ["ALL"], "Tiedot": ["*"]}},
