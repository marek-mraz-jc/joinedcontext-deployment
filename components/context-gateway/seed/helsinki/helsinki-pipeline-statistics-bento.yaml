              {"id": "alu_perh_010a", "theme": "population", "path": "vrm/perh/alu_perh_010a.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Tiedot": ["*"]}},
              {"id": "alu_vaerak_004q", "theme": "population", "path": "vrm/vaerak/alu_vaerak_004q.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "depth": "basicDistrict", "keep": {"Äidinkieli": ["ALL"], "Sukupuoli": ["*"], "Ikä": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_vaerak_004s", "theme": "population", "path": "vrm/vaerak/alu_vaerak_004s.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Äidinkieli": ["*"], "Sukupuoli": ["ALL"], "Ikä": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_vaerak_004t", "theme": "population", "path": "vrm/vaerak/alu_vaerak_004t.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Ikä": ["*"], "Tiedot": ["*"]}},
              {"id": "alu_vamuu_010g", "theme": "population", "path": "vrm/vamuu/alu_vamuu_010g.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "depth": "majorDistrict", "keep": {"Ikä": ["*"], "Tiedot": ["*"]}},
              {"id": "alu_vamuu_010r", "theme": "population", "path": "vrm/vamuu/alu_vamuu_010r.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Lähtö- tai kohdealue": ["ALL"], "Ikä": ["*"], "Äidinkieli": ["ALL"], "Tiedot": ["*"]}},
