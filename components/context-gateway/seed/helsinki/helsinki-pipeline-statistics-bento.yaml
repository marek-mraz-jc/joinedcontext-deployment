# The mapping of the statistics pipeline (T-5258): one Smart Data Model KeyPerformanceIndicator per
# (indicator, area) of the City of Helsinki's area statistics (Aluesarjat, stat.hel.fi PXWEB), the
# newest period of each table. One pipeline for every table: the tables below share the PXWEB JSON
# query API, and each one names only its own path, dimensions and the breakdown it keeps.
#
# The DataSource's answer is the description of one Aluesarjat table (alu_vaerak_004r): an answer
# that names no variable means stat.hel.fi is not serving its API, and the run fails at once. The
# second read is the space's own sub-districts (the helsinki-subdistricts pipeline writes them from
# the city's layer Piirijako_osaalue): an indicator of a sub-district links it as `refArea` only when
# the space holds that code, because the space refuses a whole entity whose relationship names an
# entity it does not hold. kartta.hel.fi, read here before for the codes, stopped answering the
# cluster in October 2026 and every run then ended with nothing written (T-5667).
# Each table is then asked for its newest period over every Helsinki area (codes 091*), one call a
# second (rate limit hel_stat) to stat.hel.fi only, 30 s and 4 MiB each.
#
# Ids: urn:ngsi-ld:KeyPerformanceIndicator:hel.fi:{space}:stat-{theme}-{table}-{kept codes}-{area
# code}; the theme segment is what each theme's Endpoint Policy selects by idPattern. kpiValue
# carries the period's last day as observedAt, so the space records one history row per period
# and none for a rerun of the same one (record: observed, DM-132).
#
# Plausibility (owner 2026-10-22): a cell is dropped and counted by reason when it is empty, of an
# area outside Helsinki or the source's "unknown area", a percentage outside 0..100, a negative
# count or amount (a net migration, surplus or correction may be negative), or a second cell with the same id; a sub-district the register lacks is written
# without refArea and counted. A table whose newest period is older than its maxAgeDays, that
# answers nothing, or that answers no usable cell fails its message (the run is failed, nothing
# is deleted); the counts go to the runner log, one line per table.

pipeline:
  processors:
    - try:
        - mapping: |
            root = if content().length() > 4194304 || this.variables.or([]).length() == 0 { throw("stat.hel.fi described no variable of alu_vaerak_004r: its API is not answering") } else { {} }
        - branch:
            # The sub-districts the space holds, read through the space's public Endpoint
            # (helsinki-all) as anybody reads it.
            request_map: |
              root = { "type": "Query", "entities": [{ "type": "AdministrativeArea", "idPattern": "^urn:ngsi-ld:AdministrativeArea:[^:]+:[^:]+:subdistrict-091[1-8][0-9]{6}$" }], "attrs": ["districtCode"] }
            processors:
              - http:
                  url: ${JC_GATEWAY_URL}/api/endpoint/si6epqkx364lprho5uaigutk274r5grb/ngsi-ld/v1/entityOperations/query?limit=1000&options=keyValues
                  verb: POST
                  headers: { Content-Type: application/json }
                  timeout: 20s
                  rate_limit: pipeline_egress
              - mapping: |
                  root = if content().length() > 4194304 { throw("the space answered %v bytes for its sub-districts; more than 4 MiB is not 148 codes".format(content().length())) } else { this }
            result_map: root.held = this.or([]).map_each(e -> e.id.or("").string().re_replace_all("^.*:subdistrict-", ""))
        - mapping: |
            let register = this.held.or([]).filter(c -> c.re_match("^091[1-8][0-9]{6}$"))
            # Keep codes: "*" for every value of the dimension, else the listed codes. The area and
            # time dimensions are named apart; the query asks every 091* area and the newest period.
            # The first 16 tables are the sub-district series; the rest add one breakdown to a theme
            # or are the Helsinki row of a region table, and "depth" stops a by-area breakdown at the
            # basic or major districts. Tables of the welfare (Hyvinvointitilastot), environment
            # (Ymparistotilasto) and sustainable development (SDG) databases name their "db"; a
            # city-wide table without an area dimension has "area": null.
            let tables = [
              {"id": "alu_vaerak_004r", "theme": "population", "path": "vrm/vaerak/alu_vaerak_004r.px", "area": "Osa-alue", "time": "Vuosi", "every": "yearly", "keep": {"Ikä": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_vaerak_004p", "theme": "population", "path": "vrm/vaerak/alu_vaerak_004p.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Äidinkieli": ["1", "2", "3"], "Ikä": ["ALL"], "Tiedot": ["*"]}},
              {"id": "alu_vamuu_010h", "theme": "population", "path": "vrm/vamuu/alu_vamuu_010h.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Tiedot": ["*"]}},
              {"id": "alu_vamuu_010o", "theme": "population", "path": "vrm/vamuu/alu_vamuu_010o.px", "area": "Alue", "time": "Vuosi", "every": "yearly", "keep": {"Tiedot": ["*"]}},
