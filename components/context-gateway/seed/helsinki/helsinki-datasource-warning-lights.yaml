# Every crossing of the city with warning lights, as an open WFS layer, in WGS84. No key. CC-BY-4.0, read from the
# HRI catalogue (package helsingin-liikenne-ja-varoitusvaloliittymat). 12 on 2026-10-26.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-warning-lights
  namespace: helsinki
  title: { en: Crossings with warning lights, fi: Varoitusvaloliittymät }
spec:
  type: http
  http:
    url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Varoitusvalot_piste
    verb: GET
    headers: { Accept: application/json }
    timeout: 30s
