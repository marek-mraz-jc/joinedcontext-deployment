# One Smart Data Model type per catalogue dataset (T-4344, T-5255): the AirQualityObserved readings
# of Forum Virium Helsinki's street cleaning pilot, read through their own Policy.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-street-cleaning-air
  namespace: helsinki
  title:
    fi: Ilmanlaatu katujen siivouksen aikana — Helsinki
    en: Air quality during street cleaning — Helsinki
  description:
    fi: 'Hiukkaspitoisuudet (PM10, PM2.5, µg/m³) kadunpesuautosta, harjakoneesta ja Rastilan kiinteästä mittauspisteestä keväällä 2023, yksi havainto lukemaa kohden. Kokeilun muut lukemat (PM1, lämpötila, kosteus, ilmanpaine, sade, valo, ääni, nopeus, ajoneuvon tila) eivät sisälly; lukemat ilman sijaintia, Helsingin ulkopuolella tai mittausalueen ulkopuolisilla arvoilla jätetään pois. Lähde: Forum Virium Helsinki, CC BY 4.0.'
    en: "Particulate matter (PM10, PM2.5, µg/m³) from a street washer, a brush machine and the fixed point in Rastila in spring 2023, one observation per reading. The pilot's other readings (PM1, temperature, humidity, air pressure, rain, light, sound, speed, vehicle status) are not included; readings with no position, outside Helsinki or with values outside the sensor range are left out. Source: Forum Virium Helsinki, CC BY 4.0."
