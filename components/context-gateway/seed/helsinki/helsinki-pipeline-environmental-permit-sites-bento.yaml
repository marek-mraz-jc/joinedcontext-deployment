# The mapping of the environmental-permit-sites pipeline (PL-03): one PointOfInterest (serviceCategory
# environmentalPermitSite) per site of the city's register of environmental permits and registered
# activities (ympäristölupakohteet), from the open WFS layer `Ymparistolupakohteet`.
#
# A site is keyed by the register's own id. Its name is the register's (an operator and a place, such
# as "Neste Vanha Porvoontie"); the activity class the permit names ("YSL 527/2014 liite 2.3
# jakeluasema", a filling station under the Environmental Protection Act) becomes its Finnish
# description. The layer writes the postal code and the post office in one field ("00760 HELSINKI"):
# the code goes to postalCode, the office to addressLocality as a person writes it (the city's own
# code 00099 HELSINGIN KAUPUNKI is Helsinki).
#
# `expiresAt` (NGSI-LD 4.22): a site leaves every read 3 days after the layer last listed it, three
# daily runs, so a site whose permit ended does not stay listed.

pipeline:
  processors:
    - mapping: |
        let lease = (now().ts_unix() + 259200).ts_format("2006-01-02T15:04:05Z", "UTC")
        # The WFS writes a field it has no value for as null or the string "None".
        map text {
          root = if this == null || this.string().trim() == "" || this.string() == "None" { null } else { this.string().trim().re_replace_all("\\s+", " ") }
        }
        root = this.features.or([]).filter(f -> f.properties.id.or("").string().re_match("^[0-9]{1,10}$") && f.geometry.type.or("") == "Point" && f.properties.nimi.apply("text") != null).map_each(f -> {
          "p": f.properties,
          "f": f,
          "name": f.properties.nimi.apply("text"),
          "street": f.properties.katuosoite.apply("text"),
          "post": f.properties.postitoimipaikka.apply("text").or("").re_find_all_submatch("^([0-9]{5}) +(.+)$").index(0).or([]),
          "activity": f.properties.toiminnan_luokittelun_tarkenne.apply("text")
        }).map_each(s -> {
          "id": "urn:ngsi-ld:%v:%v:%v:envpermit-%v".format("PointOfInterest", env("JC_ORG_DOMAIN"), env("JC_SPACE"), s.p.id.string()),
          "type": "PointOfInterest",
          "expiresAt": $lease,
          "name": { "type": "LanguageProperty", "languageMap": { "fi": s.name } },
          "serviceCategory": { "type": "Property", "value": "environmentalPermitSite" },
          "address": if s.street == null { null } else { { "type": "Property", "value": {
            "streetAddress": s.street,
            "postalCode": s.post.index(1).or(null),
            "addressLocality": if s.post.index(2).or("HELSINKI").uppercase().has_prefix("HELSIN") { "Helsinki" } else { s.post.index(2).lowercase().capitalize() },
            "addressCountry": "FI"
          }.filter(entry -> entry.value != null) } },
          "description": if s.activity != null { { "type": "LanguageProperty", "languageMap": { "fi": "Toiminta: " + s.activity } } } else { null },
          "dateModified": if s.p.paivitetty_tietopalveluun.or("").string().re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { { "type": "Property", "value": s.p.paivitetty_tietopalveluun.string() + "T00:00:00Z" } } else { null },
          "location": { "type": "GeoProperty", "value": s.f.geometry },
          "dataProvider": { "type": "Property", "value": "City of Helsinki, Urban Environment Division, environmental services" },
          "source": { "type": "Property", "value": "https://kartta.hel.fi/ws/geoserver/avoindata/wfs?typeNames=avoindata:Ymparistolupakohteet" }
        }.filter(entry -> entry.value != null))
