apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-bikes
  namespace: helsinki
  title: { en: "Helsinki city bike stations" }
spec:
  contextSpaceRef: helsinki
  slug: scsd2eehkx42n53z2zyd6vshfh7s7irf
  audience: public
  # The one Policy this endpoint evaluates: the slice of the space it publishes (EP-14).
  policyRef: urn:ngsi-ld:Policy:hel.fi:helsinki:public-bikes
  enabledRepresentations: [ngsi-ld, geojson, csv, xlsx, zip, mcp]
  # The organizer's contact line stays in the space for the city's own coordination and is
  # served by no public endpoint (EP-61). A projection only narrows.
  projection: { hiddenAttributes: [contactPoint] }
  rateLimits: { requestsPerMinute: 600, burst: 50 }
  # The catalogue entry (EP-62..EP-65): one dataset in the hel-fi catalogue, one resource per
  # representation, and a DataStore mirror of the CSV rows reloaded on every publish run.
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: hel-fi }
      datastore: { representation: csv, refresh: onReconcile }
  catalog:
    publisher: { name: { fi: "Helsingin kaupunki", sv: "Helsingfors stad", en: "City of Helsinki" }, uri: "https://www.hel.fi/" }
    license: ODC_ODBL
    attribution: { fi: "Sisältää Kaupunkipyörät-syötteen dataa (Inurba), ODbL 1.0", sv: "Innehåller data från stadscykelflödet (Inurba), ODbL 1.0", en: "Contains data from the City Bikes feed (Inurba), ODbL 1.0" }
    themes: [TRAN]
    keywords:
      fi: ["kaupunkipyörät", "pyöräasemat", "liikkuminen"]
      sv: ["stadscyklar", "cykelstationer", "mobilitet"]
      en: ["city bikes", "bike stations", "mobility"]
    spatial:
      - FI1B1
      - "http://uri.suomi.fi/codelist/jhs/kunta_1_20250101/code/091"
    frequency: CONT
    source:
      - url: "https://gbfs.theta.fifteen.eu/gbfs/2.2/helsinki/gbfs.json"
        title: { fi: "Kaupunkipyörät, GBFS-syöte", en: "City Bikes (Helsinki), GBFS feed" }
        description: { fi: "Operaattorin avoin GBFS 2.2 -syöte asemista ja niiden tilasta, ODbL 1.0.", en: "The operator's open GBFS 2.2 feed of stations and their status, ODbL 1.0." }
    pipelineRef: { kind: Pipeline, name: citybikes-gbfs }
