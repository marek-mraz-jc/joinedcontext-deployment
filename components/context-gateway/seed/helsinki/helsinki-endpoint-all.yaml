apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-all
  namespace: helsinki
  title:
    en: Helsinki city context, everything
  description:
    fi: 'Koko Helsingin tila yhdessä: tapahtumat, kaupunkipyöräasemat, joukkoliikenteen pysäkit ja linjat, uutiset, tiesää, liikennetiedotteet, uimavesi, pysäköinti, ulkoilmaluvat ja kaupunginosat. Kukin lähde lisenssinsä mukaisesti.'
    en: 'The whole Helsinki space in one place: events, city bike stations, transit stops and lines, news, road weather, traffic messages, beach water, parking, public-area permits and districts. Each source under its own licence.'
spec:
  contextSpaceRef: helsinki
  # The Policies this Endpoint evaluates; a Policy added to the space later binds only once named here (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:hel.fi:helsinki:app-helsinki-data-1
    - urn:ngsi-ld:Policy:hel.fi:helsinki:app-helsinki-kartta-1
    - urn:ngsi-ld:Policy:hel.fi:helsinki:bikes-ops-read
    - urn:ngsi-ld:Policy:hel.fi:helsinki:bikes-ops-steward
    - urn:ngsi-ld:Policy:hel.fi:helsinki:gtfs-routes-account
    - urn:ngsi-ld:Policy:hel.fi:helsinki:pipelines-delete-alerts
    - urn:ngsi-ld:Policy:hel.fi:helsinki:pipelines-write
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-air-quality
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-alerts
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-all
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-all-history
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-bikes
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-cycle-counts
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-districts
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-events
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-feedback
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-heat-vulnerability
