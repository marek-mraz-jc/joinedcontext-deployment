    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-noise
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-parking
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-permits
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-places
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-service-property-energy
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-statistics-education
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-statistics-employment
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-statistics-environment
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-statistics-housing
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-statistics-income
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-statistics-population
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-statistics-services
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-statistics-welfare
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-street-cleaning-air
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-traffic-counts
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-traffic-signals
    - urn:ngsi-ld:Policy:hel.fi:helsinki:public-traffic-volumes
