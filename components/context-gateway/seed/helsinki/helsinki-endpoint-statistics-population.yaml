# Helsinki area statistics, population (T-5258): the KeyPerformanceIndicator entities of the
# statistics pipeline whose id carries the theme `population`, one per indicator and area, the newest
# period as the value and every period since the first run in the history.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-statistics-population
  namespace: helsinki
  title:
    fi: Väestö — Helsingin aluesarjat
    sv: Befolkning — Helsingfors områdesserier
    en: Population — Helsinki area statistics
  description:
    fi: 'Helsingin aluesarjojen tilastot: syntyneet, kuolleet, perheet ja väestö äidinkielen mukaan; kaupungin, suurpiirien, peruspiirien ja osa-alueiden tasolla. Yksi Smart Data Models KeyPerformanceIndicator kutakin tunnuslukua ja aluetta kohden. Lähde: Helsingin kaupunki, kaupunkitutkimus ja -tilastot (Aluesarjat), CC BY 4.0.'
    sv: 'Helsingfors områdesserier: födda, döda, familjer och befolkningen efter modersmål; för staden, stordistrikten, distrikten och delområdena. En Smart Data Models KeyPerformanceIndicator per nyckeltal och område. Källa: Helsingfors stad, stadsforskning och statistik (Aluesarjat), CC BY 4.0.'
    en: 'Helsinki area statistics: births, deaths, families and the population by native language; for the city, its major districts, basic districts and sub-districts. One Smart Data Models KeyPerformanceIndicator per indicator and area, the newest period as kpiValue and the earlier periods in its history. Properties beyond the model: districtCode (the code of the area in the statistics of the city), divisionLevel (city, majorDistrict, basicDistrict, subDistrict or cityPart), refArea (the AdministrativeArea of the sub-district), statisticsTable and dimensionKey (the source table and cell). Source: City of Helsinki, Urban Research and Statistics (Aluesarjat), CC BY 4.0.'
spec:
  contextSpaceRef: helsinki
  slug: hb4cgyuttzzhtgxangivybcsvjx747ui
  audience: public
  policyRef: urn:ngsi-ld:Policy:hel.fi:helsinki:public-statistics-population
  # The NGSI-LD door also answers the temporal API, the series per indicator. An indicator has
  # no geometry of its own: OGC API Features serves it as a feature without one.
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: hel-fi }
      license: cc-by
      datastore: { representation: csv, refresh: onReconcile }
  catalog:
    publisher:
      name: { fi: Helsingin kaupunki, sv: Helsingfors stad, en: City of Helsinki }
      uri: https://www.hel.fi/
    license: CC_BY_4_0
    attribution:
      fi: 'Lähde: Helsingin kaupunki, kaupunkitutkimus ja -tilastot (Aluesarjat), CC BY 4.0'
      sv: 'Källa: Helsingfors stad, stadsforskning och statistik (Aluesarjat), CC BY 4.0'
      en: 'Source: City of Helsinki, Urban Research and Statistics (Aluesarjat), CC BY 4.0'
    themes: [SOCI, REGI]
    keywords:
      fi: [väestö, syntyneet, kuolleet, aluesarjat]
      sv: [befolkning, födda, döda, områdesserier]
      en: [population, births, deaths, area statistics]
    spatial:
      - FI1B1
      - http://uri.suomi.fi/codelist/jhs/kunta_1_20250101/code/091
    frequency: ANNUAL
    source:
      - url: https://stat.hel.fi/pxweb/fi/Aluesarjat/Aluesarjat__vrm__vaerak/alu_vaerak_004r.px/
        title: { fi: Aluesarjat alu_vaerak_004r, en: Area statistics table alu_vaerak_004r }
        description:
          fi: Pääkaupunkiseudun väestö
          en: Population of Helsinki, Espoo, Vantaa and Kauniainen by age groups 31.12.1961-
      - url: https://stat.hel.fi/pxweb/fi/Aluesarjat/Aluesarjat__vrm__vaerak/alu_vaerak_004p.px/
        title: { fi: Aluesarjat alu_vaerak_004p, en: Area statistics table alu_vaerak_004p }
        description:
          fi: Pääkaupunkiseudun väestö
          en: Population of Helsinki, Espoo, Vantaa and Kauniainen by native language and age group 31.12.1998-
      - url: https://stat.hel.fi/pxweb/fi/Aluesarjat/Aluesarjat__vrm__vamuu/alu_vamuu_010h.px/
        title: { fi: Aluesarjat alu_vamuu_010h, en: Area statistics table alu_vamuu_010h }
        description:
          fi: Pääkaupunkiseudun syntyneet
          en: Births by area in Helsinki, Espoo, Vantaa and Kauniainen beginning from 1998
      - url: https://stat.hel.fi/pxweb/fi/Aluesarjat/Aluesarjat__vrm__vamuu/alu_vamuu_010o.px/
        title: { fi: Aluesarjat alu_vamuu_010o, en: Area statistics table alu_vamuu_010o }
        description:
          fi: Pääkaupunkiseudun kuolleet
          en: Deaths in Helsinki, Espoo, Vantaa and Kauniainen 1998-
      - url: https://stat.hel.fi/pxweb/fi/Aluesarjat/Aluesarjat__vrm__perh/alu_perh_006t.px/
        title: { fi: Aluesarjat alu_perh_006t, en: Area statistics table alu_perh_006t }
