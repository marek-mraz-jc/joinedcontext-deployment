apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-air-quality
  namespace: helsinki
  title: { en: Helsinki air quality }
  description:
    fi: 'Pääkaupunkiseudun ilmanlaadun mittausasemien tuntiarvot: PM10, PM2,5 ja ilmanlaatuindeksi (AirQualityObserved). Lähde: Ilmatieteen laitos, avoin data, CC BY 4.0.'
    en: 'Hourly readings of the capital region air quality stations: PM10, PM2.5 and the air quality index (AirQualityObserved). Source: Finnish Meteorological Institute open data, CC BY 4.0.'
spec:
  contextSpaceRef: helsinki
  slug: jtjnhkaau64zmzz5csmcwem52icvufy2
  audience: public
  # The one Policy this endpoint evaluates: the slice of the space it publishes (EP-14).
  policyRef: urn:ngsi-ld:Policy:hel.fi:helsinki:public-air-quality
  enabledRepresentations: [ngsi-ld, csv, mcp, websocket, ogc-features, odata]
  # Its own dataset in the hel-fi catalogue (T-5259): one type, every mandatory surface (EP-118).
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: hel-fi }
      license: cc-by
      datastore: { representation: csv, refresh: onReconcile }
  catalog:
    publisher:
      name: { fi: Helsingin kaupunki, sv: Helsingfors stad, en: City of Helsinki }
      uri: https://www.hel.fi/
    license: CC_BY_4_0
    attribution:
      fi: 'Lähde: Ilmatieteen laitos, avoin data, CC BY 4.0'
      sv: 'Källa: Meteorologiska institutet, öppna data, CC BY 4.0'
      en: 'Source: Finnish Meteorological Institute open data, CC BY 4.0'
    themes: [ENVI, HEAL]
    keywords:
      fi: [ilmanlaatu, pienhiukkaset, hengitettävät hiukkaset]
      sv: [luftkvalitet, fina partiklar]
      en: [air quality, PM2.5, PM10]
    spatial:
      - FI1B1
      - http://uri.suomi.fi/codelist/jhs/kunta_1_20250101/code/091
      - http://uri.suomi.fi/codelist/jhs/kunta_1_20250101/code/049
      - http://uri.suomi.fi/codelist/jhs/kunta_1_20250101/code/092
    frequency: HOURLY
    source:
      - url: https://en.ilmatieteenlaitos.fi/open-data
        title: { fi: Ilmatieteen laitoksen avoin data, en: FMI open data }
        description:
          fi: Ilmanlaadun tuntihavainnot (urban::observations::airquality::hourly::simple), CC BY 4.0.
          en: Hourly air quality observations (urban::observations::airquality::hourly::simple), CC BY 4.0.
    pipelineRef: { kind: Pipeline, name: air-quality }
