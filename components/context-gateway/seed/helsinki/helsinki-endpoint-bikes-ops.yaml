# The stations' operations endpoint (AP-61, AP-62): the same slice the public endpoint reads,
# for the city's own people, and the one place a generated application may write a station's
# status back. No policyRef: every Policy of the space applies, so the members' read grant
# (bikes-ops-read) and the steward's write grant (bikes-ops-steward) meet here and the gateway
# evaluates the write in full (GW16). Organization audience: the person signs in; nothing here
# is public, and public-bikes does not reach a signed-in person here (GW22).
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-bikes-ops
  namespace: helsinki
  title:
    en: Helsinki city bike stations, operations
spec:
  contextSpaceRef: helsinki
  # The Policies this Endpoint evaluates; a Policy added to the space later binds only once named here (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:hel.fi:helsinki:app-helsinki-data-1
    - urn:ngsi-ld:Policy:hel.fi:helsinki:app-helsinki-kartta-1
    - urn:ngsi-ld:Policy:hel.fi:helsinki:bikes-ops-read
    - urn:ngsi-ld:Policy:hel.fi:helsinki:bikes-ops-steward
    - urn:ngsi-ld:Policy:hel.fi:helsinki:gtfs-routes-account
