# A Bento flow for a GBFS 2.x city-bike feed: station_status every minute into
# BikeHireDockingStation entities (PL-01, PL-04, CC-23..CC-27). What the helsinki-bikes stream
# is, as a card any project can run against its own operator's feed.
apiVersion: joinedcontext.com/v1alpha1
kind: Blueprint
metadata:
  name: gbfs-stations
  namespace: org
  title: { en: "City-bike stations from a GBFS feed", fi: "Kaupunkipyöräasemat GBFS-syötteestä" }
spec:
  version: 1.0.0
  category: ingestion
  riskClass: yellow
  allowedRoles: [portal-approver]
  parameterSchema:
    type: object
    required: [name, stationStatusUrl]
    additionalProperties: false
    properties:
      name: { type: string, title: "Flow name", pattern: "^[a-z][a-z0-9-]{1,40}$", default: citybikes }
      stationStatusUrl: { type: string, title: "station_status.json URL", format: uri, default: "https://gbfs.theta.fifteen.eu/gbfs/2.2/helsinki/en/station_status.json" }
      period:
        type: string
        title: "Poll every"
        default: 1m
        oneOf:
          - { const: 1m, title: "Minute" }
          - { const: 5m, title: "5 minutes" }
          - { const: 15m, title: "15 minutes" }
      targetEndpoint: { type: string, title: "Endpoint the flow writes through", default: "urn:ngsi-ld:Endpoint:hel.fi:helsinki:helsinki-all" }
  templates:
    - name: datasource
      template: |
        apiVersion: joinedcontext.com/v1alpha1
        kind: DataSource
        metadata:
          name: "{{ name }}-gbfs"
          title: { en: "GBFS station status ({{ name }})" }
        spec:
          type: http
          http:
            url: "{{ stationStatusUrl }}"
            verb: GET
            headers: { Accept: application/json }
            timeout: 15s
    - name: pipeline
      template: |
        apiVersion: joinedcontext.com/v1alpha1
        kind: Pipeline
        metadata:
          name: "{{ name }}-gbfs"
          title: { en: "BikeHireDockingStation from {{ name }}" }
        spec:
          class: auto
          period: "{{ period }}"
          schedule: "* * * * *"
          source:
            dataSourceRef: { kind: DataSource, name: "{{ name }}-gbfs" }
          targetEndpoint: "{{ targetEndpoint }}"
          quotas:
            maxMemoryMb: 128
            cpuMillicores: 100
