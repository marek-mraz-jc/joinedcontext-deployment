# One Tree per record of `hel-trees-1`, written into the city space (T-5378).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: trees-1
  namespace: helsinki
  title:
    en: Street and park trees, register ids 30000-79999
spec:
  class: auto
  # The register is republished every night (paivitetty_tietopalveluun moves daily); one read a day keeps up.
  period: 24h
  schedule: '17 2 * * *'
  source:
    dataSourceRef: { kind: DataSource, name: hel-trees-1 }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:helsinki:helsinki-all
  output: { type: Tree, mode: upsert }
  quotas: { maxMemoryMb: 256, cpuMillicores: 100 }
