apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: citybikes-gbfs
  namespace: helsinki
  title: { en: "City bike docking stations from the GBFS station status feed" }
spec:
  class: auto
  period: 60s
  source:
    dataSourceRef: { kind: DataSource, name: hsl-citybikes-gbfs }
  # Every stream writes through the one endpoint that evaluates the pipelines-write Policy.
  targetEndpoint: urn:ngsi-ld:Endpoint:hel.fi:helsinki:helsinki-all
  quotas:
    maxMemoryMb: 64
    cpuMillicores: 100
