# Helsinki's public data as one read-only MCP connector (T-4750, ADR-N-043):
# `https://{domain}/api/mcp/helsinki/otvorene-data`, the server the public assistant
# helsinki-public reads through. Its members are the two Endpoints that assistant read before;
# every call is still the member's own call under its anonymous Policy, and a public server lists
# read tools only, whoever calls (EP-141).
apiVersion: joinedcontext.com/v1alpha1
kind: McpServer
metadata:
  name: otvorene-data
  namespace: helsinki
  # What an AI client reads as serverInfo and initialize.instructions (EP-92).
  title: { sk: "Helsinki — otvorené údaje", en: "Helsinki, open data" }
  description:
    sk: "Otvorené údaje Helsínk, len na čítanie: merania cestných meteostaníc v Helsinkách, Espoo a Vantaa a dnešné podujatia v meste. Zdroje: Fintraffic / digitraffic.fi, mesto Helsinki (Linked Events); CC BY 4.0. Pri citovaní uveďte zdroj."
    en: "Read-only open data of Helsinki: road weather station readings in Helsinki, Espoo and Vantaa (air and road temperature, wind, road conditions) and today's events in the city (name, time, venue, link). Start with list_types, then query_entities with a small limit. Sources: Fintraffic / digitraffic.fi and the City of Helsinki's Linked Events; CC BY 4.0, credit the source when you quote it."
spec:
  members:
    - { kind: Endpoint, name: helsinki-weather }
    - { kind: Endpoint, name: helsinki-events }
  audience: public
