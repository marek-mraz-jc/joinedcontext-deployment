# The hub Endpoint's policy set is the only gate on a federated read (PF-48): what a member's
# own endpoint grants does not travel with the answer, so every type the hub publishes is named
# here. Narrower than the members on purpose — the union is public, the members' own extras are
# not (EP-61).
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-hub
  namespace: helsinki
  title: { en: 'Public read: the whole city' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: helsinki-hub }
  assigner: did:web:{orgDomain}
  assignee: { kind: role, id: public }
  # Discovery beside the reads (T-4258, EP-116): which types and attributes the Endpoint holds,
  # narrowed to this grant (EP-26), so an anonymous MCP client finds them before it queries.
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: Vehicle
        - type: KeyPerformanceIndicator
