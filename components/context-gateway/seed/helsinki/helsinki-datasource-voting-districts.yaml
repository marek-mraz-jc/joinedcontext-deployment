# The city's voting districts (äänestysalueet) as an open WFS layer, in WGS84. No key. CC-BY-4.0, read from the HRI
# catalogue (package paakaupunkiseudun-aanestysaluejako, the Helsinki layer of it).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-voting-districts
  namespace: helsinki
  title: { en: Voting districts (äänestysalueet), fi: Äänestysaluejako }
spec:
  type: http
  http:
    url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Halke_aanestysalue
    verb: GET
    headers: { Accept: application/json }
    timeout: 30s
