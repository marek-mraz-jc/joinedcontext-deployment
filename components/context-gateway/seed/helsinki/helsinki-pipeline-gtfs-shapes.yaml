# One GtfsShape per shape of `hsl-gtfs-shapes`, written into the city space (T-3890).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: gtfs-shapes
  namespace: helsinki
  title:
    en: HSL route shapes from GTFS, daily
spec:
  class: auto
  # Running since T-5259: the runner inflates shapes.txt bounded on its output (T-4752, unarchive zip),
  # +73 MB peak RSS for the few seconds of the run (T-3953 measurement).
  # Apart from transit-routes (Tuesdays 04:40), the other large mapping on the runner.
  period: 24h
  schedule: '10 5 * * *'
  source:
    dataSourceRef: { kind: DataSource, name: hsl-gtfs-shapes }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:helsinki:helsinki-all
  output: { type: GtfsShape, mode: upsert }
  quotas:
    # 22 MB of CSV, cut per shape; Bento held 180 to 225 MB over its own baseline for it, for the
    # 4 s it runs (2026-10-12, Bento 1.22.0 locally, the member alone, three runs).
    maxMemoryMb: 256
    cpuMillicores: 200
