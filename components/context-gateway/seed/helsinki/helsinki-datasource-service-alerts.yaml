# HSL's GTFS-RT service alerts, every alert of the network as one protobuf document (T-3889: about
# 21 kB, 18 alerts on 2026-10-12). No key. CC BY 4.0 (HSL open data). T-3892.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hsl-service-alerts
  namespace: helsinki
  title:
    en: HSL service alerts (GTFS-RT)
    fi: HSL:n häiriötiedotteet (GTFS-RT)
spec:
  type: http
  http:
    url: https://realtime.hsl.fi/realtime/service-alerts/v2/hsl
    verb: GET
    headers: { Accept: application/x-protobuf }
    timeout: 15s
