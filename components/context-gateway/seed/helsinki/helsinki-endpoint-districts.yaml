# One Smart Data Model type per catalogue dataset (T-4344): AdministrativeArea of the space
# helsinki, read through its own Policy, which narrows the space's public read to these types.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-districts
  namespace: helsinki
  title:
    fi: Kaupunginosat ja HSL-vyöhykkeet — Helsinki
    en: City districts and HSL fare zones — Helsinki
  description:
    fi: 'Kaupunginosat ja osa-alueet rajoineen sekä HSL:n taksavyöhykkeet A–D (divisionLevel fareZone, kirjain kentässä fareZone). Lähteet: Helsingin kaupunki ja HSL, CC BY 4.0.'
    en: "The city districts and sub-districts with their boundaries, and HSL's fare zones A to D (divisionLevel fareZone, the letter in fareZone). Sources: City of Helsinki and HSL, CC BY 4.0."
spec:
  contextSpaceRef: helsinki
  slug: s3luopgog5nkxcpykwxdvhw22iis5n7e
  audience: public
  policyRef: urn:ngsi-ld:Policy:hel.fi:helsinki:public-districts
  # The contact lines stay in the space, as on helsinki-all (EP-61). A projection only narrows.
  projection:
    hiddenAttributes: [contactPoint]
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: hel-fi }
      license: cc-by
      datastore: { representation: csv, refresh: onReconcile }
  catalog:
    publisher:
      name: { fi: Helsingin kaupunki, sv: Helsingfors stad, en: City of Helsinki }
      uri: https://www.hel.fi/
    license: CC_BY_4_0
    attribution:
      fi: 'Lähteet: Helsingin kaupunki ja Helsingin seudun liikenne (HSL), CC BY 4.0'
      sv: 'Källor: Helsingfors stad och Helsingforsregionens trafik (HRT), CC BY 4.0'
      en: 'Sources: City of Helsinki and Helsinki Region Transport (HSL), CC BY 4.0'
    themes: [REGI, TRAN]
    keywords:
      fi: [kaupunginosat, osa-alueet, taksavyöhykkeet]
      sv: [stadsdelar, delområden, taxezoner]
      en: [districts, sub-districts, fare zones]
    spatial:
      - FI1B1
      - http://uri.suomi.fi/codelist/jhs/kunta_1_20250101/code/091
    frequency: ANNUAL
    source:
      - url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Kaupunginosajako
        title: { fi: Kaupunginosajako, en: City districts }
        description:
          fi: Helsingin karttapalvelun WFS-taso, GeoJSON.
          en: A WFS layer of the city's map service, as GeoJSON.
      - url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Piirijako_osaalue
        title:
          fi: Piirijako, osa-alueet
          en: City sub-districts
        description:
          fi: Helsingin karttapalvelun WFS-taso, GeoJSON.
          en: A WFS layer of the city's map service, as GeoJSON.
      - url: https://hri.fi/data/en_GB/dataset/hsl-n-taksavyohykkeet
        title:
          fi: HSL:n taksavyöhykkeet
          en: HSL fare zones
        description:
          fi: HSL:n avoimen datan palvelun taso, GeoJSON (WGS84), CC BY 4.0. Luetaan päivittäin (putki fare-zones).
          en: A layer of HSL's open data hub, as GeoJSON (WGS84), CC BY 4.0. Read daily (pipeline fare-zones).
