# One Smart Data Model type per catalogue dataset (T-4344): AdministrativeArea of the space
# helsinki, read through its own Policy, which narrows the space's public read to these types.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-districts
  namespace: helsinki
  title:
    fi: Kaupunginosat, korttelit, äänestysalueet ja HSL-vyöhykkeet — Helsinki
    en: City districts, quarters, voting districts and HSL fare zones — Helsinki
  description:
    fi: 'Kaupunginosat, osa-alueet, korttelit ja äänestysalueet rajoineen sekä HSL:n taksavyöhykkeet A–D. Mallin ulkopuoliset ominaisuudet: divisionLevel (district, subDistrict, quarter, votingDistrict tai fareZone), districtCode (kaupungin oma tunnus: kaupunginosan numero, osa-alueen tai korttelin kymmennumeroinen tunnus, äänestysalueen tunnus kuten 049A) ja fareZone (vyöhykkeen kirjain). Lähteet: Helsingin kaupunki ja HSL, CC BY 4.0.'
    en: "The city districts, sub-districts, quarters and voting districts with their boundaries, and HSL's fare zones A to D. Properties beyond the model: divisionLevel (district, subDistrict, quarter, votingDistrict or fareZone), districtCode (the city's own code: the district number, the ten-digit code of a sub-district or quarter, a voting district's code such as 049A) and fareZone (the zone letter). Sources: City of Helsinki and HSL, CC BY 4.0."
spec:
  contextSpaceRef: helsinki
  slug: s3luopgog5nkxcpykwxdvhw22iis5n7e
  audience: public
  policyRef: urn:ngsi-ld:Policy:hel.fi:helsinki:public-districts
  # The contact lines stay in the space, as on helsinki-all (EP-61). A projection only narrows.
  projection:
    hiddenAttributes: [contactPoint]
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: hel-fi }
      license: cc-by
  catalog:
