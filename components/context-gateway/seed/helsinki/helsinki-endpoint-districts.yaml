      - url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Piirijako_osaalue
        title:
          fi: Piirijako, osa-alueet
          en: City sub-districts
        description:
          fi: Helsingin karttapalvelun WFS-taso, GeoJSON.
          en: A WFS layer of the city's map service, as GeoJSON.
      - url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Helsingin_korttelit
        title: { fi: Helsingin korttelit, en: City quarters }
