      uri: https://www.hel.fi/
    license: CC_BY_4_0
    attribution:
      fi: 'Lähteet: Helsingin kaupunki ja Helsingin seudun liikenne (HSL), CC BY 4.0'
      sv: 'Källor: Helsingfors stad och Helsingforsregionens trafik (HRT), CC BY 4.0'
      en: 'Sources: City of Helsinki and Helsinki Region Transport (HSL), CC BY 4.0'
    themes: [REGI, TRAN]
    keywords:
      fi: [kaupunginosat, osa-alueet, korttelit, äänestysalueet, taksavyöhykkeet]
      sv: [stadsdelar, delområden, kvarter, röstningsområden, taxezoner]
      en: [districts, sub-districts, quarters, voting districts, fare zones]
    spatial:
      - FI1B1
      - http://uri.suomi.fi/codelist/jhs/kunta_1_20250101/code/091
    frequency: ANNUAL
    source:
      - url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Kaupunginosajako
        title: { fi: Kaupunginosajako, en: City districts }
