apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-all
  namespace: helsinki
  title: { en: "Public read: everything in the space" }
spec:
  contextSpaceRef: { kind: ContextSpace, name: helsinki }
  assigner: did:web:{orgDomain}
  assignee: { kind: role, id: public }
  operations: [retrieveOps, createSubscription, retrieveSubscription, updateSubscription, deleteSubscription]
  information:
    - entities:
        - type: Event
        - type: BikeHireDockingStation
        - type: Vehicle
        - type: GtfsStop
        - type: TransitRoute
        # HSL's GTFS static feed (T-3890).
        - type: GtfsStation
        - type: GtfsAgency
        - type: GtfsRoute
        - type: GtfsShape
        # Fintraffic LIIPI's park and ride sites of the HSL area (T-3894).
        - type: OffStreetParking
        # The city's open registers (T-2787), each CC-BY-4.0 and free of personal data by their
        # mappings: the contact lines, applicants and contractors are never written.
        - type: PointOfInterest
        - type: WaterQualityObserved
        - type: ParkingArea
        - type: ParkingZone
        - type: PublicAreaPermit
        - type: CityDistrict
