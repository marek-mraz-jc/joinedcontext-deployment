# Who the hub is when it reads a member (PF-48). Read-only on both members and on nothing else:
# a hub that forwarded as an account able to write would make every reader of the hub a writer
# of the spaces behind it.
apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: hub-reader
  namespace: helsinki
  title: { en: "Helsinki hub reader" }
spec:
  owner: { user: "demo.steward" }
  purpose: "The identity the helsinki-hub space forwards a federated read as"
  roles:
    - { role: space-reader, scope: { contextSpace: helsinki } }
    - { role: space-reader, scope: { contextSpace: helsinki-kpi } }
  # A Keycloak client of its own, as every workload has (CC-04): no static key between cluster
  # services, and the hub's forwards are attributable to this account and not to the Portal's.
  credentials:
    - { kind: oauth-client, name: main }
