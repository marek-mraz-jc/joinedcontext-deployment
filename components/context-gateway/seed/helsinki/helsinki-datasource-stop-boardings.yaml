# HSL passengers by station (T-5254): average boardings per weekday (Monday to Friday) at each stop and
# station in November 2016, from HSL's open data hub as GeoJSON in WGS84. No key. CC-BY-4.0, read from the
# HRI catalogue (package hsl-n-nousijamaarat-pysakeittain). 6 708 points, 1.4 MB; HSL has not published a
# newer count, so the window stays November 2016.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hsl-stop-boardings
  namespace: helsinki
  title:
    en: HSL passengers by station
    fi: HSL:n nousijamäärät pysäkeittäin
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/c26bd38e37eb41eab20941cbe5dc6bd5_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
