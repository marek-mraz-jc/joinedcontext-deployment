# The write door of helsinki (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes helsinki-all served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint helsinki-all.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-all-write
  namespace: helsinki
  title:
    sk: 'Helsinki city context, everything: zápis'
    en: 'Helsinki city context, everything: writes'
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint helsinki-all.
    en: The internal door the data is written through; people read it through the public Endpoint helsinki-all.
spec:
  contextSpaceRef: helsinki
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
