# A workload on the Portal's side of the platform (T-2245, PF-45, PF-49): its Keycloak client,
# `helsinki-pipeline-proposer`, carries the `portal-api` audience and no endpoint slug, so its
# token opens the Portal API and the MCP door (/api/v1/mcp) and no endpoint. The Portal maps the
# token's `azp` to this manifest and holds it to the roles below, without approve (PF-58). The
# live journeys of an MCP client and of a REST-only load (T-1595, T-1596) sign in as it.
apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipeline-proposer
  namespace: helsinki
  title: { en: "Helsinki pipeline proposer" }
spec:
  owner: { user: "demo.steward" }
  purpose: "Proposes the DataSource and Pipeline manifests of project helsinki over the Portal API and MCP, never approves"
  roles:
    - { role: pipeline-editor, scope: { project: helsinki } }
  credentials:
    - { kind: oauth-client, name: main }
