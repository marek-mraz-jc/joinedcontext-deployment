# Every parking place of the city's street parking map (inner city and resident parking zones) as an open WFS layer,
# in WGS84. No key. CC-BY-4.0, read from the HRI catalogue (package
# helsingin-kantakaupungin-ja-asukaspysakointivyohykkeiden-pysakointipaikat). 8754 areas on 2026-10-26, 6.2 MB.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-parking-places
  namespace: helsinki
  title: { en: Parking places, fi: Pysäköintipaikat }
spec:
  type: http
  http:
    url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Pysakointipaikat_alue
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
