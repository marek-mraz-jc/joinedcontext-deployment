# One GtfsAgency per agency and one GtfsRoute per line of `hsl-gtfs-routes`, written into the city
# space (T-3890). The lines' stops in order stay with transit-routes (TransitRoute).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: gtfs-routes
  namespace: helsinki
  title: { en: "HSL agencies and lines from GTFS, daily" }
spec:
  class: auto
  # After the stops, from the same daily feed.
  period: 24h
  schedule: "30 4 * * *"
  source:
    dataSourceRef: { kind: DataSource, name: hsl-gtfs-routes }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:helsinki:helsinki-all
  output:
    type: GtfsRoute
    mode: upsert
  quotas:
    # 47 kB of CSV; Bento held about 2 MB over its own baseline for it (2026-10-12).
    maxMemoryMb: 64
    cpuMillicores: 100
