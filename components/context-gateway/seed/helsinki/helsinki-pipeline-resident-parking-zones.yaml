# One ParkingZone per record of `hel-resident-parking-zones`, written into the city space (T-2787).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: resident-parking-zones
  namespace: helsinki
  title: { en: "Resident and business parking zones" }
spec:
  class: auto
  # Zones change with a council decision; weekly is enough.
  period: 168h
  schedule: "10 4 * * 1"
  source:
    dataSourceRef: { kind: DataSource, name: hel-resident-parking-zones }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:helsinki:helsinki-all
  output:
    type: ParkingZone
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
