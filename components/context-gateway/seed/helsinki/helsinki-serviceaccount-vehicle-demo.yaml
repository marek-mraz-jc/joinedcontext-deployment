# One demo vehicle tracker (T-4857): its client `helsinki-vehicle-demo` signs in with a secret
# an approver issues in the Portal (PF-37); no secret is in this repository. The broker
# `vehicles` names it; it reads only its own type and writes nothing through an Endpoint.
apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: vehicle-demo
  namespace: helsinki
  title: { en: Vehicle tracker (demo), fi: Ajoneuvopaikannin (esittely) }
spec:
  owner: { user: de300000-0000-4000-8000-000000000001 } # demo.steward
  purpose: A demo vehicle tracker publishes its position to the MQTT broker vehicles
  roles:
    - role: space-reader
      scope: { contextSpace: helsinki }
      types: [Vehicle]
  credentials:
    - kind: oauth-client
      name: main
