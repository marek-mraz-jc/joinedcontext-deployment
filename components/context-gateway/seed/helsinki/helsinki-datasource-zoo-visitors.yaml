# Korkeasaari zoo's visitor counts of the current year, per month and per day (T-5258): the first
# read of the service-usage pipeline. The JSON API the HRI package korkeasaaren-kavijamaarat names;
# months count from 0. No key. CC-BY-4.0.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-zoo-visitors
  namespace: helsinki
  title: { en: Korkeasaari zoo visitors, fi: Korkeasaaren kävijämäärät }
spec:
  type: http
  http:
    url: https://korkeasaarenkavijat.onrender.com/api/data/year
    verb: GET
    headers: { Accept: application/json }
    timeout: 30s
