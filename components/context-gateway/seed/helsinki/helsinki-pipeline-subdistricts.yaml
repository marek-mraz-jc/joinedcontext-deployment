# One CityDistrict per record of `hel-subdistricts`, written into the city space (T-2787).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: subdistricts
  namespace: helsinki
  title: { en: "City sub-districts" }
spec:
  class: auto
  # The division changes a few times a decade; weekly is already more than it needs.
  period: 168h
  schedule: "55 3 * * 1"
  source:
    dataSourceRef: { kind: DataSource, name: hel-subdistricts }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:helsinki:helsinki-all
  output:
    type: CityDistrict
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
