# Helsinki area statistics, income (T-5258): the KeyPerformanceIndicator entities of the
# statistics pipeline whose id carries the theme `income`, one per indicator and area, the newest
# period as the value and every period since the first run in the history.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-statistics-income
  namespace: helsinki
  title:
    fi: Tulot — Helsingin aluesarjat
    sv: Inkomster — Helsingfors områdesserier
    en: Income — Helsinki area statistics
  description:
    fi: 'Helsingin aluesarjojen tilastot: asuntokuntien tulot (keskiarvo ja mediaani, käytettävissä olevat, pienituloiset) ja valtionveronalaisten tulojen keskiarvo; kaupungin, suurpiirien, peruspiirien ja osa-alueiden tasolla. Yksi Smart Data Models KeyPerformanceIndicator kutakin tunnuslukua ja aluetta kohden. Lähde: Helsingin kaupunki, kaupunkitutkimus ja -tilastot (Aluesarjat), CC BY 4.0.'
    sv: 'Helsingfors områdesserier: hushållens inkomster (medel och median, disponibla, låginkomsthushåll) och medelvärdet av statsskattepliktiga inkomster; för staden, stordistrikten, distrikten och delområdena. En Smart Data Models KeyPerformanceIndicator per nyckeltal och område. Källa: Helsingfors stad, stadsforskning och statistik (Aluesarjat), CC BY 4.0.'
    en: 'Helsinki area statistics: household income (mean and median, disposable, low-income households) and the mean taxable income; for the city, its major districts, basic districts and sub-districts. One Smart Data Models KeyPerformanceIndicator per indicator and area, the newest period as kpiValue and the earlier periods in its history. Properties beyond the model: districtCode (the code of the area in the statistics of the city), divisionLevel (city, majorDistrict, basicDistrict, subDistrict or cityPart), refArea (the AdministrativeArea of the sub-district), statisticsTable and dimensionKey (the source table and cell). Source: City of Helsinki, Urban Research and Statistics (Aluesarjat), CC BY 4.0.'
spec:
  contextSpaceRef: helsinki
  slug: ciub7zhdbmaqh2gg3e4yau6f6bjvuoax
