# The mapping of the traffic-messages pipeline (PL-03): one Alert per Fintraffic situation
# (a road work or a traffic announcement) whose primary point lies in Helsinki, Espoo or
# Vantaa, from the country-wide GeoJSON document. The announcement text is Finnish, and is
# published as such.

pipeline:
  processors:
    - mapping: |
        root = this.features
    - unarchive:
        format: json_array

    - mapping: |
        let domain = env("JC_ORG_DOMAIN")
        let announcement = this.properties.announcements.or([]).index(0).catch({})
        let municipality = $announcement.locationDetails.roadAddressLocation.primaryPoint.municipality.or("")
        let where = $announcement.location.description.or("").string().trim()
        let starts = $announcement.timeAndDuration.startTime.or(null)
        let ends = $announcement.timeAndDuration.endTime.or(null)
        let geometry = this.geometry.or(null)
        # `expiresAt` (NGSI-LD 4.22): the Alert leaves every read when its validTo passes, and an
        # hour after the feed last listed it, whichever comes first. The feed lists only running
        # situations and this pipeline reads it every ten minutes, so each run moves the hour on
        # for every situation still running, and one that ended early or carries no end time
        # goes an hour after it left (T-4823; the alerts reaper did this before). A feed outage
        # longer than the hour empties the desk until the feed answers again.
        let lease = now().ts_unix() + 3600
        let expires = if $ends == null { $lease } else { [$ends.ts_unix().catch($lease), $lease].min() }
        # The Smart Data Models code: a road work is roadWorks; an announcement is carAccident
        # or roadClosed when its features say so, and has no code otherwise.
        let features = $announcement.features.or([]).map_each(f -> f.name.or("").string())
        let code = if this.properties.situationType == "ROAD_WORK" { "roadWorks" } else if $features.contains("Onnettomuus") { "carAccident" } else if $features.contains("Tie on suljettu liikenteeltä") { "roadClosed" } else { null }
        root = if !["Helsinki", "Espoo", "Vantaa"].contains($municipality) || $geometry == null { deleted() } else {
          {
            "id": "urn:ngsi-ld:%v:%v:%v:%v".format("Alert", $domain, env("JC_SPACE"), this.properties.situationId),
            "type": "Alert",
            "expiresAt": $expires.ts_format("2006-01-02T15:04:05Z", "UTC"),
            "category": { "type": "Property", "value": "traffic" },
            "subCategory": if $code == null { null } else { { "type": "Property", "value": $code } },
            "alertSource": { "type": "Property", "value": "Fintraffic" },
            "name": { "type": "LanguageProperty", "languageMap": { "fi": $announcement.title.or("").string().trim() } },
            "description": if $where == "" { null } else {
              { "type": "LanguageProperty", "languageMap": { "fi": $where } }
            },
            "location": { "type": "GeoProperty", "value": $geometry },
            "address": { "type": "Property", "value": { "addressLocality": $municipality, "addressCountry": "FI" } },
            "dateIssued": { "type": "Property", "value": this.properties.releaseTime },
            "validFrom": if $starts == null { null } else { { "type": "Property", "value": $starts } },
            "validTo": if $ends == null { null } else { { "type": "Property", "value": $ends } },
            "source": { "type": "Property", "value": "https://tie.digitraffic.fi/api/traffic-message/v1/messages" }
          }.filter(entry -> entry.value != null)
        }

    - archive:
        format: json_array
