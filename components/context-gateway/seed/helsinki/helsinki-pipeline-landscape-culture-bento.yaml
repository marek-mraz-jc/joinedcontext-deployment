# The mapping of the landscape-culture pipeline (PL-03): one HeritageArea per area of the city's
# landscape culture map (maisemakulttuurikartta), from the open WFS layer `Maisemakulttuuri_alue`.
#
# The map's kind (`kohdetyyppi`) becomes `heritageCategory`. Five of its kinds are drawing aids of
# the printed map, never an area of their own: the district borders (ALUEJAKO_Kaupunginosa), the
# map label (KSV_tunnus), the sea view arrows and bars (Merinäkymä_*) and the white islands
# (Valkoinen_saaret), so they are dropped, as is a kind the map adds later until the model names
# it. The map holds no names; an area is named by its kind. An area is keyed by the layer's row
# id, the only key the map has; the map has not changed since 2019.
#
# `expiresAt` (NGSI-LD 4.22): an area leaves every read 21 days after the layer last listed it,
# three weekly runs, so a row id the map renumbers does not stay twice.

pipeline:
  processors:
    - mapping: |
        let lease = (now().ts_unix() + 1814400).ts_format("2006-01-02T15:04:05Z", "UTC")
        let kinds = {
          "Puistot_puistikot": ["park", "Puisto", "Park"],
          "Puistokadut": ["boulevard", "Puistokatu", "Boulevard"],
          "Aukiot": ["square", "Aukio", "Square"],
          "Hautausmaat": ["cemetery", "Hautausmaa", "Cemetery"],
          "Kansanpuistot": ["peoplesPark", "Kansanpuisto", "People's park"],
          "Urheilu_liikuntapuistot": ["sportsPark", "Urheilu- tai liikuntapuisto", "Sports park"],
          "Siirtolapuutarha": ["allotmentGarden", "Siirtolapuutarha", "Allotment garden"],
          "Loma_alueet": ["holidayArea", "Loma-alue", "Holiday area"],
          "Muut_viheralueet": ["otherGreenArea", "Muu viheralue", "Other green area"],
          "Huvilapuistot": ["villaPark", "Huvilapuisto", "Villa park"],
          "Huvila_aluekokonaisuus": ["villaPark", "Huvila-alueen kokonaisuus", "Villa area"],
          "Kartanopuistot_oranssi": ["manorPark", "Kartanopuisto", "Manor park"],
          "Kartano_tilakeskusten_kulttuuriympäristöt": ["manorEnvironment", "Kartanon tai tilakeskuksen kulttuuriympäristö", "Manor or estate environment"],
          "Asuntoalueet_kokonnaisuus": ["residentialEnsemble", "Asuinalueen kokonaisuus", "Residential ensemble"],
          "Julkisten_rak_ymp": ["publicBuildingGrounds", "Julkisen rakennuksen ympäristö", "Public building grounds"],
          "Pihat": ["courtyard", "Piha", "Courtyard"]
        }
        root = this.features.or([]).filter(f -> f.properties.id.or("").string().re_match("^[0-9]{1,10}$") && $kinds.get(f.properties.kohdetyyppi.or("").string()) != null && ["Polygon", "MultiPolygon"].contains(f.geometry.type.or(""))).map_each(f -> {
          "kind": $kinds.get(f.properties.kohdetyyppi.string()),
          "updated": f.properties.paivitetty_tietopalveluun.or("").string(),
          "f": f
        }).map_each(a -> {
          "id": "urn:ngsi-ld:%v:%v:%v:landscape-%v".format("HeritageArea", env("JC_ORG_DOMAIN"), env("JC_SPACE"), a.f.properties.id.string()),
          "type": "HeritageArea",
          "expiresAt": $lease,
          "name": { "type": "LanguageProperty", "languageMap": { "fi": a.kind.index(1), "en": a.kind.index(2) } },
          "heritageCategory": { "type": "Property", "value": a.kind.index(0) },
          "dateModified": if a.updated.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { { "type": "Property", "value": a.updated + "T00:00:00Z" } } else { null },
          "location": { "type": "GeoProperty", "value": a.f.geometry },
          "dataProvider": { "type": "Property", "value": "City of Helsinki, Urban Environment Division (KYMP)" },
          "source": { "type": "Property", "value": "https://kartta.hel.fi/ws/geoserver/avoindata/wfs?typeNames=avoindata:Maisemakulttuuri_alue" }
        }.filter(entry -> entry.value != null))
