# Public read of the service property energy indicators (T-5278):  service property energy use:the indicators whose id carries `energy-`, current and every month since the first run.
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-service-property-energy
  namespace: helsinki
  title: { en: Public read }
spec:
  contextSpaceRef: { kind: ContextSpace, name: helsinki }
  assigner: did:web:{orgDomain}
  assignee: { kind: role, id: public }
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
    - queryTemporal
    - retrieveTemporal
  temporalQ: timerel=after;timeAt=P-3650D
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:helsinki:energy-[a-z0-9-]+$
