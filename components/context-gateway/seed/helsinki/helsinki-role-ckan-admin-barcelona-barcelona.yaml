# The right to manage one CKAN instance, barcelona/barcelona (PF-107): the organization administrator's
# by default through org-admin, handed to a group or a person by a RoleBinding of the same name at
# `scope: { project: barcelona }`, which the instance's Access panel proposes. Seeded bound to nobody.
apiVersion: joinedcontext.com/v1alpha1
kind: Role
metadata:
  name: ckan-admin-barcelona-barcelona
  namespace: org
spec:
  rules:
    - kinds: [CkanInstance]
      verbs: [propose, approve, delete]
      constraints:
        - field: metadata.name
          in: [barcelona]
