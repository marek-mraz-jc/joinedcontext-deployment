# The stops where tourist coaches may stop to let passengers on and off, as an open WFS layer, in WGS84. No key.
# CC-BY-4.0, read from the HRI catalogue (package helsingin-matkailuliikenteen-pysakit-ja-pysakointipaikat). 28 stops
# on 2026-10-26.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-tourist-stops
  namespace: helsinki
  title: { en: Tourist coach stops, fi: Matkailuliikenteen pysäkit }
spec:
  type: http
  http:
    url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Matkailuliikenne_pysakit_piste
    verb: GET
    headers: { Accept: application/json }
    timeout: 30s
