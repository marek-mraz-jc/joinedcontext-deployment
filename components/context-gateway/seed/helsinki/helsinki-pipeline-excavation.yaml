# One PublicAreaPermit per record of `hel-allu-excavation`, written into the city space (T-2787).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: excavation
  namespace: helsinki
  title: { en: "Excavation notices" }
spec:
  class: auto
  # The register is updated several times a day; every six hours keeps a reader within a working day of it.
  period: 6h
  schedule: "20 */6 * * *"
  source:
    dataSourceRef: { kind: DataSource, name: hel-allu-excavation }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:helsinki:helsinki-all
  output:
    type: PublicAreaPermit
    mode: upsert
  quotas:
    maxMemoryMb: 256
    cpuMillicores: 100
