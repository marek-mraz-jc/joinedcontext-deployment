      sv: 'Källa: Helsingfors stad, miljötjänster (Ymparistotilasto) samt stadsforskning och statistik (SDG), CC BY 4.0'
      en: 'Source: City of Helsinki, Environmental Services (Ymparistotilasto) and Urban Research and Statistics (SDG), CC BY 4.0'
    themes: [ENVI, ENER, SOCI]
    keywords:
      fi: [ympäristö, päästöt, energia, kestävä kehitys]
