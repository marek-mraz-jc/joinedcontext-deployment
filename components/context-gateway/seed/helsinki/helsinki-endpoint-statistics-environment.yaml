# Helsinki environment and sustainable development statistics (T-5258): the KeyPerformanceIndicator
# entities of the statistics pipeline whose id carries the theme `environment`, read from the city's
# environment database (Ymparistotilasto) and its sustainable development indicators (SDG, the
# Voluntary Local Review). City-wide unless the table has an area. Newest period as the value.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-statistics-environment
  namespace: helsinki
  title:
    fi: Ympäristö ja kestävä kehitys — Helsingin tilastot
    sv: Miljö och hållbar utveckling — Helsingfors statistik
    en: Environment and sustainable development — Helsinki statistics
  description:
    fi: 'Helsingin ympäristötilasto ja kestävän kehityksen indikaattorit: kasvihuonekaasupäästöt, energiankulutus, ilmanlaatu, vedet, luonto, jätteet ja YK:n Agenda 2030 -tavoitteiden mittarit. Yksi Smart Data Models KeyPerformanceIndicator kutakin tunnuslukua kohden. Lähde: Helsingin kaupunki, ympäristöpalvelut ja kaupunkitutkimus ja -tilastot, CC BY 4.0.'
    sv: 'Helsingfors miljöstatistik och indikatorer för hållbar utveckling: växthusgasutsläpp, energiförbrukning, luftkvalitet, vatten, natur, avfall och mätarna för FN:s Agenda 2030. En Smart Data Models KeyPerformanceIndicator per nyckeltal. Källa: Helsingfors stad, miljötjänster samt stadsforskning och statistik, CC BY 4.0.'
    en: 'Helsinki environment statistics and sustainable development indicators: greenhouse gas emissions, energy use, air quality, waters, nature, waste and the measures of the UN Agenda 2030 goals (the Voluntary Local Review). One Smart Data Models KeyPerformanceIndicator per indicator, the newest period as kpiValue and the earlier periods in its history. Properties beyond the model: districtCode (0910000000 for the whole city), divisionLevel (city), statisticsTable and dimensionKey (the source table and cell). Sources: City of Helsinki, Environmental Services (Ymparistotilasto) and Urban Research and Statistics (SDG), CC BY 4.0.'
spec:
  contextSpaceRef: helsinki
  slug: 4gr7xjetq25axmbpn1obvyspuvlf5kbt
  audience: public
