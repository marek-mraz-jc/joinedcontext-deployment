apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-feedback
  namespace: helsinki
  title: { en: 'Public read: feedback reports' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: helsinki }
  assigner: did:web:{orgDomain}
  assignee: { kind: role, id: public }
  # Discovery beside the reads (T-4258, EP-116), as public-events.
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: ServiceRequest
