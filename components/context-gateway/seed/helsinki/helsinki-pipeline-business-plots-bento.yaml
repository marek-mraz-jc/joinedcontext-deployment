# The mapping of the business-plots pipeline (PL-03): one PointOfInterest (serviceCategory businessPlot)
# per plot the city offers to a business, from the open WFS layer `Vapaat_yritystontit`.
#
# A plot is keyed by the layer's row id: the property code (jhs_tunnus) is written in two shapes
# (091-010-0643-0001 and 91-10-643-1) and stays text in the description. The area and the floor area
# right become numbers in square metres when the layer gives a number; a worded value ("noin 640",
# a part of another plot) stays in the description, never guessed into a number. The plan's land-use
# mark and its meaning, the property code and the city's notes go into the Finnish description.
#
# `expiresAt` (NGSI-LD 4.22): a plot leaves every read 3 days after the layer last listed it, three
# daily runs, so a plot the city sold or withdrew does not stay offered.

pipeline:
  processors:
    - mapping: |
        let lease = (now().ts_unix() + 259200).ts_format("2006-01-02T15:04:05Z", "UTC")
        # The WFS writes a field it has no value for as null or the string "None".
        map text {
          root = if this == null || this.string().trim() == "" || this.string() == "None" { null } else { this.string().trim().re_replace_all("\\s+", " ") }
        }
        map square_metres {
          root = if this != null && this.re_match("^[0-9]{1,7}([.,][0-9]{1,2})?$") { this.replace_all(",", ".").number() } else { null }
        }
        root = this.features.or([]).filter(f -> f.properties.id.or("").string().re_match("^[0-9]{1,10}$") && f.geometry.type.or("") == "Point" && f.properties.osoite.apply("text") != null).map_each(f -> {
          "p": f.properties,
          "f": f,
          "street": f.properties.osoite.apply("text"),
          "area": f.properties.pinta_ala.apply("text"),
          "right": f.properties.rakennusoikeus.apply("text"),
          "mark": f.properties.kayttotarkoitusmerkinta.apply("text"),
          "use": f.properties.kayttotarkoitus_selite.apply("text"),
          "code": f.properties.jhs_tunnus.apply("text"),
          "notes": f.properties.lisatietoja.apply("text")
        }).map_each(s -> s.assign({
          "areaM2": s.area.apply("square_metres"),
          "rightM2": s.right.apply("square_metres")
        })).map_each(s -> s.assign({
          "lines": [
            if s.mark != null && s.use != null { "Käyttötarkoitus: %s (%s)".format(s.use, s.mark) } else if s.mark != null { "Käyttötarkoitus: " + s.mark } else if s.use != null { "Käyttötarkoitus: " + s.use } else { null },
            if s.area != null && s.areaM2 == null { "Pinta-ala: " + s.area } else { null },
            if s.right != null && s.rightM2 == null { "Rakennusoikeus: " + s.right } else { null },
            if s.code != null { "Kiinteistötunnus: " + s.code } else { null },
            if s.notes != null { "Lisätietoja: " + s.notes } else { null }
          ].filter(l -> l != null)
        })).map_each(s -> {
          "id": "urn:ngsi-ld:%v:%v:%v:business-plot-%v".format("PointOfInterest", env("JC_ORG_DOMAIN"), env("JC_SPACE"), s.p.id.string()),
          "type": "PointOfInterest",
          "expiresAt": $lease,
          "name": { "type": "LanguageProperty", "languageMap": { "fi": "Yritystontti, " + s.street, "sv": "Företagstomt, " + s.street, "en": "Business plot, " + s.street } },
          "serviceCategory": { "type": "Property", "value": "businessPlot" },
          "address": { "type": "Property", "value": { "streetAddress": s.street, "addressLocality": "Helsinki", "addressCountry": "FI" } },
          "plotArea": if s.areaM2 != null { { "type": "Property", "value": s.areaM2, "unitCode": "MTK" } } else { null },
          "floorAreaRight": if s.rightM2 != null { { "type": "Property", "value": s.rightM2, "unitCode": "MTK" } } else { null },
          "description": if s.lines.length() > 0 { { "type": "LanguageProperty", "languageMap": { "fi": s.lines.join("\n") } } } else { null },
          "dateModified": if s.p.paivitetty_tietopalveluun.or("").string().re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { { "type": "Property", "value": s.p.paivitetty_tietopalveluun.string() + "T00:00:00Z" } } else { null },
          "location": { "type": "GeoProperty", "value": s.f.geometry },
          "dataProvider": { "type": "Property", "value": "City of Helsinki, Urban Environment Division, plots for business" },
          "source": { "type": "Property", "value": "https://kartta.hel.fi/ws/geoserver/avoindata/wfs?typeNames=avoindata:Vapaat_yritystontit" }
        }.filter(entry -> entry.value != null))
