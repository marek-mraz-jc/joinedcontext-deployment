# One kind, one verb (T-2245): what a workload that proposes pipelines from outside a browser
# holds. No approve: a workload proposes and a person approves (PF-58), and the Portal takes
# approve out of any role an account names anyway (Architecture/12 §3).
apiVersion: joinedcontext.com/v1alpha1
kind: Role
metadata:
  name: pipeline-proposer
  namespace: org
spec:
  rules:
    - kinds: [Pipeline]
      verbs: [propose]
