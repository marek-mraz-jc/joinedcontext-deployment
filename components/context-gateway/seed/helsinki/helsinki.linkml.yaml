      - departures
      - stopAlerts
      - page
      - dataProvider
      - source
  PublicTransportRoute:
    class_uri: sdm:PublicTransportRoute
    description: >-
      One HSL line in one direction: its number, where it runs to, its stops in order and the
      line through them. A line with several variants has one entity per variant. The Smart Data
      Model's generic public transport route; GtfsRoute is the line without a direction.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots:
      - name
      - route
      - routeShortName
      - headsign
      - directionId
      - transportMode
      - transportationType
      - stopSequence
      - dataProvider
      - source
  GtfsStation:
    class_uri: sdm:GtfsStation
    description: One HSL station (GTFS location type 1), where it is and the platforms it gathers.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots:
      - name
      - fareZone
      - transportMode
      - wheelChairAccessible
      - hasStop
      - nearbyParking
      - page
      - dataProvider
      - source
  GtfsAgency:
    class_uri: sdm:GtfsAgency
    description: The transit agency HSL's GTFS feed names, HSL itself.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots: [agencyName, page, timezone, language, phone, routes, dataProvider, source]
  GtfsRoute:
    class_uri: sdm:GtfsRoute
    description: >-
      One HSL line as GTFS gives it, both directions and every variant: its number, its name,
      what runs it and who operates it. Its stops in order are PublicTransportRoute's.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots:
      - shortName
      - name
      - routeType
      - transportMode
      - operatedBy
      - routeAlerts
      - page
      - dataProvider
      - source
  GtfsShape:
    class_uri: sdm:GtfsShape
    description: >-
      The line one HSL route variant draws on the map, about 200 of its points, and the distance
      travelled at each.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots: [name, distanceTravelled, dataProvider, source]

  TrafficFlowObserved:
    class_uri: sdm:TrafficFlowObserved
    description: >-
      One day of one of the city's traffic counters in one direction: the cyclists an Eco-Counter
      station counted, or the motor vehicles and their mean speed at one of the city's induction
      loop (LAM) stations, from the city's traffic measurement API. The counter's name and place
      ride on the observation; the history of the days is the entity's temporal history.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - name
      - dateObserved
      - dateObservedFrom
      - dateObservedTo
      - intensity
      - averageVehicleSpeed
      - vehicleType
      - trafficDirection
      - dataProvider
      - source
    slot_usage:
      dateObserved:
        description: The end of the counted day, the same instant as dateObservedTo.
        required: true
      vehicleType:
        description: >-
          The one kind of vehicle the observation counts, in the Smart Data Model's words; absent
          when the counter sums every class of motor vehicle.
        range: CountedVehicleType

  PostalAddress:
    class_uri: schema:PostalAddress
    description: >-
      The value of `address`: a postal address, never an entity of its own (Smart Data Models'
      common schema).
    annotations:
      upstream_source: https://schema.org/PostalAddress
    slots: [streetAddress, postalCode, addressLocality, addressCountry]

enums:
  ServiceCategory:
    permissible_values:
      library: { description: A public library. }
      healthStation: { description: A health station. }
      swimmingHall: { description: An indoor swimming hall. }
      beach: { description: A public beach. }
      school: { description: A comprehensive school. }
  StreetParkingCategory:
    description: The OnStreetParking `category` values the city's layers use, a subset of the Smart Data Model's enum.
    permissible_values:
      public:
        description: A parking area of the parking guide, open to anyone.
      feeCharged: { description: A parking fee zone; parking costs by the hour. }
      forResidents:
        description: A resident parking zone; residents and businesses of the zone park on its permit.
  PermitKind:
    permissible_values:
      excavation: { description: Digging on a street or a park. }
      trafficArrangement:
        description: A temporary change to traffic, such as a closed lane.
      event: { description: An event held on a public area. }
  PermitStatus:
    permissible_values:
      upcoming: { description: Granted and not started. }
      ongoing: { description: The work or the event is going on. }
      setup: { description: The event's structures are being built. }
      teardown: { description: The event's structures are being taken down. }
  DivisionLevel:
    permissible_values:
      district:
        description: A district (kaupunginosa), 60 of them.
      subDistrict:
        description: A sub-district (osa-alue), the unit the city's statistics use.
  TransportMode:
    permissible_values:
      bus: { description: A bus. }
      tram: { description: A tram. }
      metro: { description: The metro. }
      train: { description: A commuter train. }
      ferry: { description: A ferry. }
  CountedVehicleType:
    description: The kinds of vehicle a city counter tells apart, a subset of Smart Data Models' vehicleType.
    permissible_values:
      bicycle:
        description: A bicycle, as an Eco-Counter station counts it.
  TrafficDirection:
    description: The direction a city counter names, in English.
    permissible_values:
      north: { description: Pohjoiseen. }
      south: { description: Etelään. }
      east: { description: Itään. }
      west: { description: Länteen. }
      inbound:
        description: IN, towards the centre.
      outbound:
        description: OUT, away from the centre.
  EventStatus:
    description: Where an event stands, schema.org's EventStatusType values as Linked Events publishes them.
    permissible_values:
      EventScheduled:
        description: Takes place as planned.
        annotations:
          label:
            tag: label
            value:
              sk: Naplánované
              cs: Naplánováno
              fi: Aikataulussa
              en: Scheduled
              de: Geplant
      EventCancelled:
        description: Called off; it does not take place.
        annotations:
          label:
            tag: label
            value:
              sk: Zrušené
              cs: Zrušeno
              fi: Peruttu
              en: Cancelled
              de: Abgesagt
      EventPostponed:
        description: Moved to a date not yet known.
        annotations:
          label:
            tag: label
            value:
              sk: Odložené
              cs: Odloženo
              fi: Siirretty
              en: Postponed
              de: Verschoben
      EventRescheduled:
        description: Moved to the new date the event now gives.
        annotations:
          label:
            tag: label
            value:
              sk: Presunuté
              cs: Přesunuto
              fi: Uusi ajankohta
              en: Rescheduled
              de: Neu angesetzt
      EventMovedOnline:
        description: Held online instead of at its place.
        annotations:
          label:
            tag: label
            value:
              sk: Presunuté online
              cs: Přesunuto online
              fi: Siirretty verkkoon
              en: Moved online
              de: Online verlegt
