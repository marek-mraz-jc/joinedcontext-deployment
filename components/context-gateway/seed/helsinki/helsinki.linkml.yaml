  PointOfInterest:
    class_uri: sdm:PointOfInterest
    description: >-
      One place of the city's service register a resident goes to: a library, a health station,
      a swimming hall, a beach or a school. The register's contact lines are left out, because
      they can name a person.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest
    slots:
      - name
      - serviceCategory
      - address
      - url
      - openingHours
      - dateModified
      - dataProvider
      - source
      - waterQualityObservations
  WaterQualityObserved:
    class_uri: sdm:WaterQualityObserved
    description: >-
      One of Forum Virium Helsinki's beach sensors and the water temperature it last read. A
      sensor that has not reported this season carries no reading.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
    slots: [name, temperature, dateObserved, refPointOfInterest, dataProvider, source]
  OnStreetParking:
    class_uri: sdm:OnStreetParking
    description: >-
      One street parking area of the city with its outline: a parking area of the city's
      parking guide with the cars it holds when the city has estimated it (category `public`), a
      parking fee zone (`feeCharged`) or a resident parking zone (`forResidents`), a zone with its
      code and rules.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Parking
    slots: [name, category, totalSpotNumber, zoneCode, description, url, dataProvider, source]
    slot_usage:
      category:
        description: Which of the city's street parking layers the area belongs to, in the Smart Data Model's own words.
        range: StreetParkingCategory
        multivalued: true
        required: true
  OffStreetParking:
    class_uri: sdm:OffStreetParking
    description: >-
      One park and ride site of the HSL area from Fintraffic's LIIPI register, where it is,
      what it holds, whether it is open, the free spaces when it reports them, and its station.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Parking
    slots:
      - name
      - status
      - allowedVehicleType
      - totalSpotNumber
      - capacityByType
      - availableSpotNumber
      - refNearestStation
      - dataProvider
      - source
  CityWork:
    class_uri: sdm:CityWork
    description: >-
      One permit of the city's public-area register: an excavation, a temporary traffic
      arrangement or an event, with every area it covers as one outline. The applicant and the
      contractor are left out, because they can name a person. The Smart Data Model of works
      that occupy the street; an event's permit covers its build and teardown on it.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - name
      - permitKind
      - permitNumber
      - permitStatus
      - permitStart
      - permitEnd
      - description
      - address
      - refDistrict
      - dataProvider
      - source
  AdministrativeArea:
