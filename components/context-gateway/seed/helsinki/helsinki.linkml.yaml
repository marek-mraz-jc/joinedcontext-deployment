      extension AdministrativeArea (PointOfInterest base).
    is_a: Entity
    annotations:
      upstream_source: https://github.com/marek-mraz/joinedcontext-deployment/blob/main/scripts/open-data/sdm/extensions/AdministrativeArea
    slots: [name, districtCode, divisionLevel, dataProvider, source, publicAreaPermits]
  GtfsStop:
    class_uri: sdm:GtfsStop
    description: One HSL stop or station platform, where it is, its sign's code and its fare zone.
    is_a: Entity
    annotations:
