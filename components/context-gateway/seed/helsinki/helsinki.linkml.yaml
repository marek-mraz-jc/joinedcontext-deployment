id: https://hel.fi/models/helsinki/helsinki
name: helsinki
title: Helsinki city context
description: >-
  What the Helsinki demonstration space carries side by side (DM-01, DM-09): the events of the
  city's Linked Events register, the HSL city bike docking stations, the HSL buses of four
  trunk lines, HSL's stops, stations, lines and their shapes, the city's news, Fintraffic's road weather stations and its traffic alerts, FMI's air quality stations, and the city's open registers: its services (libraries, health
  stations, swimming halls, beaches, schools), the beach water sensors, parking areas and zones,
  the permits for digging, traffic arrangements and events on public areas, and its district
  division. One model, one space, four endpoints that each publish a slice of it. The IRIs
  are Smart Data Models' and ETSI's, cited rather than minted, so a reader who knows those
  vocabularies reads the same terms here (DM-04, DM-16).
license: https://joinedcontext.com/licenses/cc-by-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  jc: https://joinedcontext.com/models/
  sdm: https://smartdatamodels.org/
  ngsi-ld: https://uri.etsi.org/ngsi-ld/
default_prefix: sdm
default_range: string
imports:
  - linkml:types
  - ngsi-ld-core

slots:
  identifier:
    slot_uri: https://smartdatamodels.org/dataModel.CPSV-AP/identifier
    description: The publisher's own identifier of the record (a news item's RSS guid), the one the Article extension requires.
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP
  name:
    slot_uri: schema:name
    description: The name, per language.
    annotations:
      ngsi_ld_kind: LanguageProperty
      upstream_source: https://schema.org/name
  description:
    slot_uri: schema:description
    description: A short description, per language.
    annotations:
      ngsi_ld_kind: LanguageProperty
      upstream_source: https://schema.org/description
  startDate:
    slot_uri: schema:startDate
    description: When the event starts, ISO 8601 with a time zone.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Event
  endDate:
    slot_uri: schema:endDate
    description: When the event ends; absent while the register does not say.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Event
  eventStatus:
    slot_uri: schema:eventStatus
    description: The register's status of the event, EventScheduled, EventCancelled or EventPostponed.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://schema.org/eventStatus
  address:
    slot_uri: schema:address
    description: >-
      The postal address as the source publishes it, field by field (Smart Data Models'
      common PostalAddress); a field the source leaves out is absent, never guessed from a
      line of text.
    range: PostalAddress
    inlined: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models/blob/master/common-schema.json
  streetAddress:
    slot_uri: schema:streetAddress
    description: The street and the house number.
    annotations:
      upstream_source: https://schema.org/streetAddress
  postalCode:
    slot_uri: schema:postalCode
    description: The postal code.
    annotations:
      upstream_source: https://schema.org/postalCode
  addressLocality:
    slot_uri: schema:addressLocality
    description: The town or the municipality.
    annotations:
      upstream_source: https://schema.org/addressLocality
  addressCountry:
    slot_uri: schema:addressCountry
    description: The country, as an ISO 3166-1 alpha-2 code.
    annotations:
      upstream_source: https://schema.org/addressCountry
  contactPoint:
    slot_uri: schema:contactPoint
    description: >-
      The organizer's contact line as the register carries it, often a named person with a
      phone number. The space keeps it for the city's own coordination; no public endpoint
      serves it.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://schema.org/contactPoint
  source:
    slot_uri: sdm:source
    description: The open-data service the entity was read from.
    range: uri
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models
  availableBikeNumber:
    slot_uri: sdm:availableBikeNumber
    description: Bikes ready to rent at the station right now.
    range: integer
    minimum_value: 0
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  freeSlotNumber:
    slot_uri: sdm:freeSlotNumber
    description: Empty docks a bike can be returned to right now.
    range: integer
    minimum_value: 0
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  totalSlotNumber:
    slot_uri: sdm:totalSlotNumber
    description: Bikes plus free docks, the station's working size.
    range: integer
    minimum_value: 0
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  status:
    slot_uri: sdm:status
    description: >-
      A bike station's working while it rents and takes returns, otherwise outOfService; a park and
      ride site's open, closed or closedAbnormal (Fintraffic LIIPI's IN_OPERATION, INACTIVE or
      TEMPORARILY_CLOSED, EXCEPTIONAL_SITUATION).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  dateModified:
    slot_uri: sdm:dateModified
    description: When the publisher last changed the record, or the station last reported.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models
  speed:
    slot_uri: sdm:speed
    description: Ground speed of the vehicle.
    range: float
    minimum_value: 0
    unit:
      ucum_code: m/s
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  heading:
    slot_uri: sdm:heading
    description: Compass heading of the vehicle, degrees clockwise from north.
    range: float
    minimum_value: 0
    maximum_value: 360
    unit:
      ucum_code: deg
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  route:
    slot_uri: sdm:route
    description: The HSL route id the vehicle is serving, as GTFS names it (2550, 1009, 31M1, 3001K).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  vehicleType:
    slot_uri: sdm:vehicleType
    description: The Smart Data Models kind of vehicle - bus, tram, passengerVessel for a ferry, other for metro and train; transportMode names HSL's mode.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  fleetVehicleId:
    slot_uri: sdm:fleetVehicleId
    description: The operator and vehicle number HSL publishes, operator-vehicle.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
  url:
    slot_uri: schema:url
    description: Where the item is published in full.
    range: uri
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://schema.org/url
  datePublished:
    slot_uri: schema:datePublished
    description: When the item was published, ISO 8601 with a time zone.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://schema.org/datePublished
  image:
    slot_uri: schema:image
    description: The item's picture, when the feed carries one.
    range: uri
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://schema.org/image
  dateObserved:
    slot_uri: sdm:dateObserved
    description: When the readings were taken.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  temperature:
    slot_uri: sdm:temperature
    description: >-
      The temperature the station measures: the air at a road weather station, the water at a
      beach sensor.
    range: float
    unit:
      ucum_code: Cel
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  roadSurfaceTemperature:
    slot_uri: sdm:roadSurfaceTemperature
    description: Temperature of the road surface at the station.
    range: float
    unit:
      ucum_code: Cel
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  relativeHumidity:
    slot_uri: sdm:relativeHumidity
    description: Relative humidity of the air, 0 to 1.
    range: float
    minimum_value: 0
    maximum_value: 1
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  windSpeed:
    slot_uri: sdm:windSpeed
    description: Mean wind speed at the station.
    range: float
    minimum_value: 0
    unit:
      ucum_code: m/s
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  windDirection:
    slot_uri: sdm:windDirection
    description: Where the wind comes from, degrees clockwise from north.
    range: float
    minimum_value: 0
    maximum_value: 360
    unit:
      ucum_code: deg
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  precipitation:
    slot_uri: sdm:precipitation
    description: Precipitation intensity at the station, millimetres per hour.
    range: float
    minimum_value: 0
    unit:
      ucum_code: mm/h
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
  category:
    slot_uri: sdm:category
    description: The alert's domain; traffic for everything Fintraffic and HSL publish.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Alert
  subCategory:
    slot_uri: sdm:subCategory
    description: >-
      The Smart Data Models code of the alert, roadWorks for a Fintraffic road work. Left out
      where no code fits: a Fintraffic traffic announcement and an HSL service alert.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Alert
  dateIssued:
    slot_uri: sdm:dateIssued
    description: When the situation was published.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Alert
  alertSource:
    slot_uri: sdm:alertSource
    description: Who raised the alert, Fintraffic or HSL.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Alert
  effect:
    slot_uri: jc:effect
    description: What an HSL service alert does to the service, as GTFS-RT names it, such as DETOUR or REDUCED_SERVICE.
    annotations:
      ngsi_ld_kind: Property
  cause:
    slot_uri: jc:cause
    description: Why an HSL service alert is in force, as GTFS-RT names it, such as CONSTRUCTION or MAINTENANCE.
    annotations:
      ngsi_ld_kind: Property
  severity:
    slot_uri: sdm:severity
    description: How much the alert matters, informational, medium or high (GTFS-RT INFO, WARNING, SEVERE).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Alert
  refRoute:
    slot_uri: jc:refRoute
    description: The lines an HSL service alert affects, each a GtfsRoute of this space.
    range: GtfsRoute
    multivalued: true
    inverse: routeAlerts
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
      on_delete: set-null
  refStop:
    slot_uri: jc:refStop
    description: The stops an HSL service alert affects, each a GtfsStop of this space.
    range: GtfsStop
    multivalued: true
    inverse: stopAlerts
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
      on_delete: set-null
    # T-3893: a vehicle's links to the line it runs and the stop it is at or heading to. They name
    # entities by URN and point outside the model (uriorcurie): the hub carries Vehicle slot for
    # slot without the GTFS classes (DM-61), and a vehicle is written even before the day's GTFS
    # read holds its line or stop.
  onRoute:
    slot_uri: jc:onRoute
    description: The line the vehicle is running, the URN of a GtfsRoute of this space.
    range: uriorcurie
    annotations:
      ngsi_ld_kind: Relationship
  nextStop:
    slot_uri: jc:nextStop
    description: >-
      The stop the vehicle stands at or comes to next, the URN of a GtfsStop of this space; HSL
      moves it on at each departure from or passing of a stop.
    range: uriorcurie
    annotations:
      ngsi_ld_kind: Relationship
  delay:
    slot_uri: jc:delay
    description: Seconds behind the timetable, negative when ahead (HSL's dl with the sign turned).
    range: integer
    unit:
      ucum_code: s
    annotations:
      ngsi_ld_kind: Property
  occupancy:
    slot_uri: jc:occupancy
    description: How full the vehicle is, in percent; HSL sends 0 (room) or 100 (full).
    range: integer
    minimum_value: 0
    maximum_value: 100
    unit:
      ucum_code: '%'
    annotations:
      ngsi_ld_kind: Property
  routeAlerts:
    slot_uri: jc:routeAlerts
    description: The HSL service alerts on the line, computed from their refRoute and never stored.
    range: Alert
    multivalued: true
    inverse: refRoute
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
  stopAlerts:
    slot_uri: jc:stopAlerts
    description: The HSL service alerts on the stop, computed from their refStop and never stored.
    range: Alert
    multivalued: true
    inverse: refStop
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
  unknownReference:
    slot_uri: jc:unknownReference
    description: >-
      What an HSL service alert names that this space holds no entity for, as `route:<id>` or
      `stop:<id>`, kept as text rather than as a relationship that would point at nothing.
    multivalued: true
    annotations:
      ngsi_ld_kind: Property
  validFrom:
    slot_uri: sdm:validFrom
    description: When the situation starts.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Alert
  validTo:
    slot_uri: sdm:validTo
    description: When the situation ends; absent while open-ended.
    range: datetime
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Alert
  pm10:
    slot_uri: sdm:pm10
    description: Particulate matter up to 10 µm, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit:
      ucum_code: ug/m3
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  pm25:
    slot_uri: sdm:pm25
    description: Particulate matter up to 2.5 µm, the hour's mean at the station.
    range: float
    minimum_value: 0
    unit:
      ucum_code: ug/m3
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  airQualityIndex:
    slot_uri: sdm:airQualityIndex
    description: FMI's hourly air quality index, 1 (good) to 5 (very poor).
    range: float
    minimum_value: 1
    maximum_value: 5
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  dataProvider:
    slot_uri: sdm:dataProvider
    description: >-
      Who publishes the data the entity was read from, as an application credits it beside the
      licence (CC BY 4.0 for every feed of this space).
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/data-models
  openingHours:
    slot_uri: schema:openingHours
    description: >-
      The opening hours as the city's service register words them, per language. Free text,
      because the register writes exceptions and self-service hours no fixed shape holds.
    annotations:
      ngsi_ld_kind: LanguageProperty
      upstream_source: https://schema.org/openingHours
  serviceCategory:
    slot_uri: jc:serviceCategory
    description: Which of the city's services the place is, from the service register's own codes.
    range: ServiceCategory
    required: true
    annotations:
      ngsi_ld_kind: Property
  refPointOfInterest:
    slot_uri: sdm:refPointOfInterest
    description: The place in the city's service register the sensor stands at.
    range: PointOfInterest
    inverse: waterQualityObservations
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
      on_delete: restrict
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
  totalSpotNumber:
    slot_uri: sdm:totalSpotNumber
    description: The number of vehicles the site holds, as the publisher states or estimates it; for a park and ride site, of its own kind (car or bicycle).
    range: integer
    minimum_value: 0
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking
  zoneCode:
    slot_uri: jc:zoneCode
    description: The zone's own code, a fee zone number or a resident permit letter, as the signs show it.
    annotations:
      ngsi_ld_kind: Property
  permitKind:
    slot_uri: jc:permitKind
    description: What the permit lets its holder do on the public area.
    range: PermitKind
    required: true
    annotations:
      ngsi_ld_kind: Property
  permitNumber:
    slot_uri: jc:permitNumber
    description: The application number the city's permit register gives the permit, such as KP1900206-23.
    required: true
    pattern: "^[A-Z]{2}[0-9]{7}(-[0-9]+)?$"
    annotations:
      ngsi_ld_kind: Property
  permitStatus:
    slot_uri: jc:permitStatus
    description: Where the permitted work or event stands today.
    range: PermitStatus
    required: true
    annotations:
      ngsi_ld_kind: Property
  permitStart:
    slot_uri: jc:permitStart
    description: The first day the permit covers.
    range: date
    required: true
    annotations:
      ngsi_ld_kind: Property
  permitEnd:
    slot_uri: jc:permitEnd
    description: The last day the permit covers.
    range: date
    required: true
    annotations:
      ngsi_ld_kind: Property
  refDistrict:
    slot_uri: jc:refDistrict
    description: The district the record lies in.
    range: AdministrativeArea
    inverse: publicAreaPermits
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
      on_delete: restrict
  districtCode:
    slot_uri: jc:districtCode
    description: >-
      The city's own code of the area: the district number, or for a sub-district the full
      ten-digit code the city's statistics use for it.
    required: true
    pattern: "^[0-9]{1,10}$"
    annotations:
      ngsi_ld_kind: Property
  divisionLevel:
    slot_uri: jc:divisionLevel
    description: Which of the city's two divisions the area belongs to.
    range: DivisionLevel
    required: true
    annotations:
      ngsi_ld_kind: Property
  stewardNote:
    slot_uri: jc:stewardNote
    description: >-
      A note by the person who keeps this data: what was checked, what looks wrong, whom to
      ask. No pipeline writes it and no pipeline overwrites it, so an application may offer it
      for editing without the next run taking the words back (AP-62). At most 500 characters
      and no angle brackets, because it is a note and not a document.
    pattern: "^[^<>]{0,500}$"
    annotations:
      ngsi_ld_kind: Property
  waterQualityObservations:
    slot_uri: jc:waterQualityObservations
    description: The water-quality readings taken at this place, computed from their refPointOfInterest and never stored.
    range: WaterQualityObserved
    multivalued: true
    inverse: refPointOfInterest
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
  publicAreaPermits:
    slot_uri: jc:publicAreaPermits
    description: The public-area permits that lie in this district, computed from their refDistrict and never stored.
    range: CityWork
    multivalued: true
    inverse: refDistrict
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
  stopCode:
    slot_uri: jc:stopCode
    description: The code on the stop's sign, such as H2014; empty for a stop HSL gives none.
    annotations:
      ngsi_ld_kind: Property
  fareZone:
    slot_uri: jc:fareZone
    description: The HSL fare zone the stop lies in, A to D; none for a stop beyond HSL's zones.
    pattern: "^[A-Z]$"
    annotations:
      ngsi_ld_kind: Property
  routeShortName:
    slot_uri: jc:routeShortName
    description: The line number riders see, such as 4 or 550.
    annotations:
      ngsi_ld_kind: Property
  headsign:
    slot_uri: jc:headsign
    description: Where the line runs to in this direction, as its sign shows it.
    annotations:
      ngsi_ld_kind: Property
  directionId:
    slot_uri: jc:directionId
    description: HSL's direction of the line, 1 or 2.
    range: integer
    minimum_value: 1
    maximum_value: 2
    annotations:
      ngsi_ld_kind: Property
  transportMode:
    slot_uri: jc:transportMode
    description: What serves the stop or runs the line.
    range: TransportMode
    annotations:
      ngsi_ld_kind: Property
  transportationType:
    slot_uri: sdm:transportationType
    description: >-
      What runs the line as its GTFS route type (0 tram, 1 metro, 2 train, 3 bus, 4 ferry), the
      number the Smart Data Model requires beside the word `transportMode` gives.
    range: integer
    minimum_value: 0
    maximum_value: 7
    required: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  stopSequence:
    slot_uri: jc:stopSequence
    description: >-
      The stops the line serves in this direction, in order, each the GTFS stop id that ends
      the id of a GtfsStop of this space.
    multivalued: true
    annotations:
      ngsi_ld_kind: Property
  availableSpotNumber:
    slot_uri: sdm:availableSpotNumber
    description: Free spaces at the park and ride site when it last reported, LIIPI's spacesAvailable.
    range: integer
    minimum_value: 0
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking
  allowedVehicleType:
    slot_uri: sdm:allowedVehicleType
    description: What may park, the site's own kind first (car or bicycle), then motorcycle where it has spaces for them.
    multivalued: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.Parking
  capacityByType:
    slot_uri: jc:capacityByType
    description: >-
      The built capacity per kind of space, as LIIPI names them in lower case (car, disabled,
      bicycle, electricCar, motorcycle, bicycleSecureSpace), each a count.
    annotations:
      ngsi_ld_kind: JsonProperty
  refNearestStation:
    slot_uri: jc:refNearestStation
    description: The HSL station within 500 m of the park and ride site, the nearest one, a GtfsStation of this space.
    range: GtfsStation
    inverse: nearbyParking
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
      on_delete: set-null
  nearbyParking:
    slot_uri: jc:nearbyParking
    description: The park and ride sites whose nearest station this is, computed from their refNearestStation and never stored.
    range: OffStreetParking
    multivalued: true
    inverse: refNearestStation
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
  departures:
    slot_uri: jc:departures
    description: >-
      The next departures from the stop, at most five, soonest first, each an object with the
      line (`route`, the GtfsRoute's id, and `routeId`), its `directionId`, the `expected` time
      and its `status` (scheduled, skipped or canceled), and `delay` in seconds with the
      `scheduled` time it implies when HSL sends one. Set every 30 s for a curated set of stops
      from HSL's GTFS-RT trip updates; empty after five minutes without a feed.
    annotations:
      ngsi_ld_kind: JsonProperty
  wheelChairAccessible:
    slot_uri: sdm:wheelChairAccessible
    description: Whether a wheelchair can board here, GTFS's wheelchair_boarding; 0 unknown, 1 possible, 2 not possible.
    pattern: "^[012]$"
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  hasParentStation:
    slot_uri: sdm:hasParentStation
    description: The station the stop or platform belongs to; absent for a stop on its own.
    range: GtfsStation
    inverse: hasStop
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  hasStop:
    slot_uri: sdm:hasStop
    description: The platforms of the station, computed from their hasParentStation and never stored.
    range: GtfsStop
    multivalued: true
    inverse: hasParentStation
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  page:
    slot_uri: sdm:page
    description: The publisher's web page about it.
    range: uri
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  agencyName:
    slot_uri: sdm:agencyName
    description: The transit agency's full name.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  timezone:
    slot_uri: sdm:timezone
    description: The agency's time zone, an IANA name such as Europe/Helsinki.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  language:
    slot_uri: sdm:language
    description: The agency's main language, a two-letter code.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  phone:
    slot_uri: sdm:phone
    description: The agency's public customer service number.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  shortName:
    slot_uri: sdm:shortName
    description: The line number riders see, such as 4 or 550.
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  routeType:
    slot_uri: sdm:routeType
    description: >-
      GTFS's basic route type: 0 a tram, 1 the metro, 2 a train, 3 a bus, 4 a ferry. HSL's
      extended codes (109, 700s, 900) are written as the basic one they extend.
    pattern: "^[0-7]$"
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  operatedBy:
    slot_uri: sdm:operatedBy
    description: The agency that runs the line.
    range: GtfsAgency
    inverse: routes
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
  routes:
    slot_uri: jc:routes
    description: The lines the agency operates, computed from their operatedBy and never stored.
    range: GtfsRoute
    multivalued: true
    inverse: operatedBy
    inlined: false
    annotations:
      ngsi_ld_kind: Relationship
  distanceTravelled:
    slot_uri: sdm:distanceTravelled
    description: The distance along the shape at each point of its line, in kilometres.
    range: float
    multivalued: true
    annotations:
      ngsi_ld_kind: Property
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility

classes:
  Event:
    class_uri: sdm:Event
    description: One event of the City of Helsinki's Linked Events register.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Event
    slots:
      - name
      - description
      - startDate
      - endDate
      - eventStatus
      - address
      - contactPoint
      - source
    slot_usage:
      name:
        rank: 1
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Názov", cs: "Název", fi: "Nimi", en: "Name" } }
      startDate:
        rank: 2
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Začiatok", cs: "Začátek", fi: "Alkaa", en: "Start" } }
      endDate:
        rank: 3
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Koniec", cs: "Konec", fi: "Päättyy", en: "End" } }
      address:
        rank: 4
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Adresa", cs: "Adresa", fi: "Osoite", en: "Address" } }
      eventStatus:
        rank: 5
        annotations:
          label: { tag: label, value: { sk: "Stav", cs: "Stav", fi: "Tila", en: "Status" } }
      description:
        rank: 6
        annotations:
          label: { tag: label, value: { sk: "Popis", cs: "Popis", fi: "Kuvaus", en: "Description" } }
      contactPoint:
        annotations:
          label: { tag: label, value: { sk: "Kontakt", cs: "Kontakt", fi: "Yhteystiedot", en: "Contact" } }
  BikeHireDockingStation:
    class_uri: sdm:BikeHireDockingStation
    description: One HSL city bike station, its position and what it holds right now.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - name
      - availableBikeNumber
      - freeSlotNumber
      - totalSlotNumber
      - status
      - dateModified
      - source
    slot_usage:
      name:
        rank: 1
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Názov", cs: "Název", fi: "Nimi", en: "Name" } }
      availableBikeNumber:
        rank: 2
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Voľné bicykle", cs: "Volná kola", fi: "Vapaat pyörät", en: "Bikes available" } }
      freeSlotNumber:
        rank: 3
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Voľné stojany", cs: "Volné stojany", fi: "Vapaat paikat", en: "Free slots" } }
      totalSlotNumber:
        rank: 4
        annotations:
          label: { tag: label, value: { sk: "Stojany spolu", cs: "Stojanů celkem", fi: "Paikkoja yhteensä", en: "Total slots" } }
      status:
        rank: 5
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Stav", cs: "Stav", fi: "Tila", en: "Status" } }
  Vehicle:
    class_uri: sdm:Vehicle
    description: One HSL bus, tram, metro, train or ferry in service, where it is, how fast it moves and how late it runs.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - speed
      - heading
      - route
      - vehicleType
      - transportMode
      - fleetVehicleId
      - onRoute
      - nextStop
      - delay
      - occupancy
    slot_usage:
      route:
        rank: 1
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Linka", cs: "Linka", fi: "Linja", en: "Route" } }
      vehicleType:
        rank: 2
        annotations:
          label: { tag: label, value: { sk: "Typ vozidla", cs: "Typ vozidla", fi: "Ajoneuvotyyppi", en: "Vehicle type" } }
      nextStop:
        rank: 3
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Ďalšia zastávka", cs: "Další zastávka", fi: "Seuraava pysäkki", en: "Next stop" } }
      delay:
        rank: 4
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Meškanie", cs: "Zpoždění", fi: "Myöhästyminen", en: "Delay" } }
      speed:
        rank: 5
        annotations:
          label: { tag: label, value: { sk: "Rýchlosť", cs: "Rychlost", fi: "Nopeus", en: "Speed" } }
      occupancy:
        rank: 6
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Obsadenosť", cs: "Obsazenost", fi: "Kuormitus", en: "Occupancy" } }
      heading:
        annotations:
          label: { tag: label, value: { sk: "Smer", cs: "Směr", fi: "Suunta", en: "Heading" } }
  Article:
    class_uri: jc:Article
    description: >-
      One item of the City of Helsinki's news feed, as the Smart Data Model extension Article
      (CPSV-AP Evidence base, T-4338).
    is_a: Entity
    annotations:
      upstream_source: https://github.com/marek-mraz/joinedcontext-deployment/blob/main/scripts/open-data/sdm/extensions/Article
    slots:
      - identifier
      - name
      - description
      - url
      - datePublished
      - image
      - source
  WeatherObserved:
    class_uri: sdm:WeatherObserved
    description: One Fintraffic road weather station around Helsinki and its latest readings.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Weather
    slots:
      - name
      - dateObserved
      - temperature
      - roadSurfaceTemperature
      - relativeHumidity
      - windSpeed
      - windDirection
      - precipitation
      - source
    slot_usage:
      name:
        rank: 1
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Názov", cs: "Název", fi: "Nimi", en: "Name" } }
      dateObserved:
        rank: 2
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Čas merania", cs: "Čas měření", fi: "Mittausaika", en: "Observed" } }
      temperature:
        rank: 3
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Teplota", cs: "Teplota", fi: "Lämpötila", en: "Temperature" } }
      roadSurfaceTemperature:
        rank: 4
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Teplota vozovky", cs: "Teplota vozovky", fi: "Tienpinnan lämpötila", en: "Road surface temperature" } }
      precipitation:
        rank: 5
        annotations:
          label: { tag: label, value: { sk: "Zrážky", cs: "Srážky", fi: "Sademäärä", en: "Precipitation" } }
      windSpeed:
        rank: 6
        annotations:
          label: { tag: label, value: { sk: "Rýchlosť vetra", cs: "Rychlost větru", fi: "Tuulen nopeus", en: "Wind speed" } }
      relativeHumidity:
        annotations:
          label: { tag: label, value: { sk: "Vlhkosť", cs: "Vlhkost", fi: "Kosteus", en: "Humidity" } }
      windDirection:
        annotations:
          label: { tag: label, value: { sk: "Smer vetra", cs: "Směr větru", fi: "Tuulen suunta", en: "Wind direction" } }
  Alert:
    class_uri: sdm:Alert
    description: >-
      One road work or traffic announcement of Fintraffic in the capital region, or one service
      alert of HSL with the lines and stops it affects.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Alert
    slots:
      - name
      - description
      - category
      - subCategory
      - alertSource
      - effect
      - cause
      - severity
      - address
      - dateIssued
      - validFrom
      - validTo
      - refRoute
      - refStop
      - unknownReference
      - source
  AirQualityObserved:
    class_uri: sdm:AirQualityObserved
    description: >-
      One air quality station around Helsinki and its newest hourly readings: FMI's stations,
      and the stations a steward adds by hand, which carry no source.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
    slots:
      - name
      - dateObserved
      - pm10
      - pm25
      - airQualityIndex
      - stewardNote
      - source
    slot_usage:
      name:
        rank: 1
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Názov", cs: "Název", fi: "Nimi", en: "Name" } }
      dateObserved:
        rank: 2
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Čas merania", cs: "Čas měření", fi: "Mittausaika", en: "Observed" } }
      airQualityIndex:
        rank: 3
        annotations:
          summary: true
          label: { tag: label, value: { sk: "Index kvality ovzdušia", cs: "Index kvality ovzduší", fi: "Ilmanlaatuindeksi", en: "Air quality index" } }
      pm10:
        rank: 4
        annotations:
          summary: true
          label: { tag: label, value: { sk: "PM10", cs: "PM10", fi: "PM10", en: "PM10" } }
      pm25:
        rank: 5
        annotations:
          label: { tag: label, value: { sk: "PM2,5", cs: "PM2,5", fi: "PM2,5", en: "PM2.5" } }
  PointOfInterest:
    class_uri: sdm:PointOfInterest
    description: >-
      One place of the city's service register a resident goes to: a library, a health station,
      a swimming hall, a beach or a school. The register's contact lines are left out, because
      they can name a person.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest
    slots:
      - name
      - serviceCategory
      - address
      - url
      - openingHours
      - dateModified
      - dataProvider
      - source
      - waterQualityObservations
  WaterQualityObserved:
    class_uri: sdm:WaterQualityObserved
    description: >-
      One of Forum Virium Helsinki's beach sensors and the water temperature it last read. A
      sensor that has not reported this season carries no reading.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Environment
    slots:
      - name
      - temperature
      - dateObserved
      - refPointOfInterest
      - dataProvider
      - source
  OnStreetParking:
    class_uri: sdm:OnStreetParking
    description: >-
      One street parking area of the city with its outline (T-4329): a parking area of the city's
      parking guide with the cars it holds when the city has estimated it (category `public`), a
      parking fee zone (`feeCharged`) or a resident parking zone (`forResidents`), a zone with its
      code and rules.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Parking
    slots:
      - name
      - category
      - totalSpotNumber
      - zoneCode
      - description
      - url
      - dataProvider
      - source
    slot_usage:
      category:
        description: Which of the city's street parking layers the area belongs to, in the Smart Data Model's own words.
        range: StreetParkingCategory
        multivalued: true
        required: true
  OffStreetParking:
    class_uri: sdm:OffStreetParking
    description: >-
      One park and ride site of the HSL area from Fintraffic's LIIPI register (T-3894), where it is,
      what it holds, whether it is open, the free spaces when it reports them, and its station.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Parking
    slots:
      - name
      - status
      - allowedVehicleType
      - totalSpotNumber
      - capacityByType
      - availableSpotNumber
      - refNearestStation
      - dataProvider
      - source
  CityWork:
    class_uri: sdm:CityWork
    description: >-
      One permit of the city's public-area register: an excavation, a temporary traffic
      arrangement or an event, with every area it covers as one outline. The applicant and the
      contractor are left out, because they can name a person. The Smart Data Model of works
      that occupy the street (T-4329); an event's permit covers its build and teardown on it.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.Transportation
    slots:
      - name
      - permitKind
      - permitNumber
      - permitStatus
      - permitStart
      - permitEnd
      - description
      - address
      - refDistrict
      - dataProvider
      - source
  AdministrativeArea:
    class_uri: jc:AdministrativeArea
    description: >-
      One district or sub-district of Helsinki, its outline and its code, as the Smart Data Model
      extension AdministrativeArea (PointOfInterest base, T-4338).
    is_a: Entity
    annotations:
      upstream_source: https://github.com/marek-mraz/joinedcontext-deployment/blob/main/scripts/open-data/sdm/extensions/AdministrativeArea
    slots:
      - name
      - districtCode
      - divisionLevel
      - dataProvider
      - source
      - publicAreaPermits
  GtfsStop:
    class_uri: sdm:GtfsStop
    description: One HSL stop or station platform, where it is, its sign's code and its fare zone.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots:
      - name
      - stopCode
      - description
      - fareZone
      - transportMode
      - wheelChairAccessible
      - hasParentStation
      - departures
      - stopAlerts
      - page
      - dataProvider
      - source
  PublicTransportRoute:
    class_uri: sdm:PublicTransportRoute
    description: >-
      One HSL line in one direction: its number, where it runs to, its stops in order and the
      line through them. A line with several variants has one entity per variant. The Smart Data
      Model's generic public transport route (T-4329); GtfsRoute is the line without a direction.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots:
      - name
      - route
      - routeShortName
      - headsign
      - directionId
      - transportMode
      - transportationType
      - stopSequence
      - dataProvider
      - source
  GtfsStation:
    class_uri: sdm:GtfsStation
    description: One HSL station (GTFS location type 1), where it is and the platforms it gathers.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots:
      - name
      - fareZone
      - transportMode
      - wheelChairAccessible
      - hasStop
      - nearbyParking
      - page
      - dataProvider
      - source
  GtfsAgency:
    class_uri: sdm:GtfsAgency
    description: The transit agency HSL's GTFS feed names, HSL itself.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots:
      - agencyName
      - page
      - timezone
      - language
      - phone
      - routes
      - dataProvider
      - source
  GtfsRoute:
    class_uri: sdm:GtfsRoute
    description: >-
      One HSL line as GTFS gives it, both directions and every variant: its number, its name,
      what runs it and who operates it. Its stops in order are PublicTransportRoute's.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots:
      - shortName
      - name
      - routeType
      - transportMode
      - operatedBy
      - routeAlerts
      - page
      - dataProvider
      - source
  GtfsShape:
    class_uri: sdm:GtfsShape
    description: >-
      The line one HSL route variant draws on the map, about 200 of its points, and the distance
      travelled at each.
    is_a: Entity
    annotations:
      upstream_source: https://github.com/smart-data-models/dataModel.UrbanMobility
    slots:
      - name
      - distanceTravelled
      - dataProvider
      - source

  PostalAddress:
    class_uri: schema:PostalAddress
    description: >-
      The value of `address`: a postal address, never an entity of its own (Smart Data Models'
      common schema).
    annotations:
      upstream_source: https://schema.org/PostalAddress
    slots:
      - streetAddress
      - postalCode
      - addressLocality
      - addressCountry

enums:
  ServiceCategory:
    permissible_values:
      library:
        description: A public library.
      healthStation:
        description: A health station.
      swimmingHall:
        description: An indoor swimming hall.
      beach:
        description: A public beach.
      school:
        description: A comprehensive school.
  StreetParkingCategory:
    description: The OnStreetParking `category` values the city's layers use, a subset of the Smart Data Model's enum.
    permissible_values:
      public:
        description: A parking area of the parking guide, open to anyone.
      feeCharged:
        description: A parking fee zone; parking costs by the hour.
      forResidents:
        description: A resident parking zone; residents and businesses of the zone park on its permit.
  PermitKind:
    permissible_values:
      excavation:
        description: Digging on a street or a park.
      trafficArrangement:
        description: A temporary change to traffic, such as a closed lane.
      event:
        description: An event held on a public area.
  PermitStatus:
    permissible_values:
      upcoming:
        description: Granted and not started.
      ongoing:
        description: The work or the event is going on.
      setup:
        description: The event's structures are being built.
      teardown:
        description: The event's structures are being taken down.
  DivisionLevel:
    permissible_values:
      district:
        description: A district (kaupunginosa), 60 of them.
      subDistrict:
        description: A sub-district (osa-alue), the unit the city's statistics use.
  TransportMode:
    permissible_values:
      bus:
        description: A bus.
      tram:
        description: A tram.
      metro:
        description: The metro.
      train:
        description: A commuter train.
      ferry:
        description: A ferry.
