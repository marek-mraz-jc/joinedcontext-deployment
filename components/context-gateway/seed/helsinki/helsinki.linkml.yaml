id: https://hel.fi/models/helsinki/helsinki
name: helsinki
title: Helsinki city context
description: >-
  What the Helsinki demonstration space carries side by side (DM-01, DM-09): the events of the
  city's Linked Events register, the HSL city bike docking stations, the HSL buses of four
  trunk lines, HSL's stops, stations, lines and their shapes, the city's news, Fintraffic's road weather stations and its traffic alerts, FMI's air quality stations, and the city's open registers: its services (libraries, health
  stations, swimming halls, beaches, schools), the beach water sensors, parking areas and zones,
  the permits for digging, traffic arrangements and events on public areas, and its district
  division. One model, one space, four endpoints that each publish a slice of it. The IRIs
  are Smart Data Models' and ETSI's, cited rather than minted, so a reader who knows those
  vocabularies reads the same terms here (DM-04, DM-16).
license: https://joinedcontext.com/licenses/cc-by-4.0
prefixes:
  linkml: https://w3id.org/linkml/
  jc: https://joinedcontext.com/models/
  sdm: https://smartdatamodels.org/
  ngsi-ld: https://uri.etsi.org/ngsi-ld/
default_prefix: sdm
default_range: string
imports:
  - linkml:types
  - ngsi-ld-core

