# The excavation notices of the city's public-area register (Allu) as an open WFS layer, one feature per area, 3266
# areas of 869 applications on 2026-09-25, in WGS84 because `srsName` asks for it (the layer's own is EPSG:3879). No
# key. CC-BY-4.0, read from the HRI catalogue (package
# helsingin-kaupungin-yleisten-alueiden-tapahtuma-ja-maankayttolupajarjestelma). The whole layer is 3.6 MB.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-allu-excavation
  namespace: helsinki
  title: { en: "Excavation notices (public-area permits, Allu)", fi: "Kaivuilmoitukset (Allu)" }
spec:
  type: http
  http:
    url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Kaivuilmoitus_alue
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
