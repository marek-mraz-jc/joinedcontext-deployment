apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-transport
  namespace: helsinki
  title: { en: "Public read: HSL vehicles, stops, lines, departures, service alerts and park and ride" }
spec:
  contextSpaceRef: { kind: ContextSpace, name: helsinki }
  assigner: did:web:{orgDomain}
  assignee: { kind: role, id: public }
  operations: [retrieveOps]
  information:
    - entities:
        - type: Vehicle
        - type: GtfsStop
        - type: TransitRoute
        # HSL's GTFS static feed (T-3890).
        - type: GtfsStation
        - type: GtfsAgency
        - type: GtfsRoute
        - type: GtfsShape
        # HSL's service alerts (T-3892), beside Digitraffic's road alerts of the same type, and
        # the park and ride sites of the HSL area (T-3894). A GtfsStop carries its departures
        # (T-3891), a Vehicle its mode (T-3893): both types are above.
        - type: Alert
        - type: OffStreetParking
