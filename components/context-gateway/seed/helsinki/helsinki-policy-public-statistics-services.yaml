# Public read of the service usage counters (T-5258): the indicators whose id carries the theme
# `services`, current and history: all ten years the space keeps, one row per day or month.
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-statistics-services
  namespace: helsinki
  title: { en: 'Public read: service usage statistics' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: helsinki }
  assigner: did:web:{orgDomain}
  assignee: { kind: role, id: public }
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
    - queryTemporal
    - retrieveTemporal
  temporalQ: timerel=after;timeAt=P-3650D
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:helsinki:stat-services-[A-Za-z0-9._-]+$
