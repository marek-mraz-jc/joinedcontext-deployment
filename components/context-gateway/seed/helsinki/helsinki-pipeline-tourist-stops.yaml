# One OnStreetParking per record of `hel-tourist-stops`, written into the city space (T-5286).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: tourist-stops
  namespace: helsinki
  title: { en: Tourist coach stops }
spec:
  class: auto
  # The stops change with the season at most; weekly is enough.
  period: 168h
  schedule: '45 4 * * 3'
  source:
    dataSourceRef: { kind: DataSource, name: hel-tourist-stops }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:helsinki:helsinki-all
  output: { type: OnStreetParking, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
