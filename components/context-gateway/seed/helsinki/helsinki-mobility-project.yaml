apiVersion: joinedcontext.com/v1alpha1
kind: Project
metadata:
  name: helsinki-mobility
  namespace: org
  title: { en: "Mobility analytics", sk: "Analytika mobility" }
spec:
  organizationRef: hel
  # A second project on the same node is deliberately tighter than the organization's default
  # (PF-73): analytics over what helsinki already publishes, not another city's worth of feeds.
  # `contextSpaces` is exactly what it holds, so the quota is visible where a person meets it —
  # the spaces page offers no new space and says which limit is used up (T-0526, T-2244).
  quotas:
    contextSpaces: 1
    residentPipelines: 2
    publicEndpoints: 2
    apps: 1
    ingestEventsPerSecond: 50
    agentRunsPerDay: 20
    entitiesPerSpace: 10000
    requestsPerMinute: 300
