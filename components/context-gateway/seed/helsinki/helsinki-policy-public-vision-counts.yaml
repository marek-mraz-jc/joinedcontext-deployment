# Public read of the machine vision counts' TrafficFlowObserved (T-5669): the vision- entities of the
# vision-counts pipeline only, so the catalogue datasets of one type stay apart.
apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vision-counts
  namespace: helsinki
  title: { en: 'Public read: machine vision counts' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: helsinki }
  assigner: did:web:{orgDomain}
  assignee: { kind: role, id: public }
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
    - queryTemporal
    - retrieveTemporal
  # History reads through the same door as the space's other public counts (T-4372); the
  # observations are older than the space keeps history, so the window answers what it holds.
  temporalQ: timerel=after;timeAt=P-30D
  information:
    - entities:
        - type: TrafficFlowObserved
          idPattern: ^urn:ngsi-ld:TrafficFlowObserved:[a-z0-9.-]+:helsinki:vision-[0-9]+-[a-z]+-[0-9]{8}$
