# One HeritageArea per area of `hel-landscape-culture`, written into the city space (T-5670).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: landscape-culture
  namespace: helsinki
  title: { en: Landscape culture areas }
spec:
  class: auto
  # The map was last changed in 2019; weekly is already more than it needs.
  period: 168h
  schedule: '20 4 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: hel-landscape-culture }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:helsinki:helsinki-all
  output: { type: HeritageArea, mode: upsert }
  quotas: { maxMemoryMb: 256, cpuMillicores: 100 }
