# One TrafficSignalJunction per record of `hel-traffic-lights`, written into the city space (T-5286).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: traffic-lights
  namespace: helsinki
  title: { en: Junctions with traffic lights }
spec:
  class: auto
  # A junction gets or loses its signals a few times a year; weekly is enough.
  period: 168h
  schedule: '55 4 * * 3'
  source:
    dataSourceRef: { kind: DataSource, name: hel-traffic-lights }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:helsinki:helsinki-all
  output: { type: TrafficSignalJunction, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
