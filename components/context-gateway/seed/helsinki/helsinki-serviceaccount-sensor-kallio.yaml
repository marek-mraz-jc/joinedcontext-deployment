# One demo air sensor (T-4857): its client `helsinki-sensor-kallio` signs in with a secret an
# approver issues in the Portal (PF-37); no secret is in this repository. The broker `sensors`
# names it; it reads only its own type and writes nothing through an Endpoint.
apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: sensor-kallio
  namespace: helsinki
  title: { en: Air sensor Kallio (demo), fi: Ilmanlaatuanturi Kallio (esittely) }
spec:
  owner: { user: de300000-0000-4000-8000-000000000001 } # demo.steward
  purpose: A demo air sensor publishes PM10 and PM2.5 to the MQTT broker sensors
  roles:
    - role: space-reader
      scope: { contextSpace: helsinki }
      types: [AirQualityObserved]
  credentials:
    - kind: oauth-client
      name: main
