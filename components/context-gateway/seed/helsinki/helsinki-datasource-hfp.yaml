# HSL's high-frequency positioning broker, public. Five lines the owner chose (T-4624), not
# fleets: the topic is the filter, so the runner never sees the vehicles it would drop anyway.
# Route ids are HSL's GTFS ones: 2550 is bus 550 (2 = Espoo), 1004 tram 4, 31M1 and 31M2 the
# metro, 1019 the Suomenlinna ferry.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hsl-hfp
  namespace: helsinki
  title: { en: "HSL high-frequency positioning: bus 550, tram 4, metro, Suomenlinna ferry", fi: "HSL:n suurtaajuinen paikannus: bussi 550, raitiovaunu 4, metro, Suomenlinnan lautta" }
spec:
  type: mqtt
  mqtt:
    # MQTT over WebSocket on 443, not MQTT over TLS on 8883: the cluster's firewall
    # (kube-hetzner's outbound defaults) lets 443 out and nothing on 8883, and HSL serves the
    # same broker on both. `wss://` renders the stream's TLS block.
    urls:
      - wss://mqtt.hsl.fi:443/
    # A fixed list of lines (owner, T-4624): about 30 to 60 vehicles at a time, sampled to one
    # report in 30 s by the mapping, so helsinki stays near ten batch upserts a minute. Never a
    # whole mode, never `vp/#`.
    topics:
      - /hfp/v2/journey/ongoing/vp/bus/+/+/2550/#
      - /hfp/v2/journey/ongoing/vp/tram/+/+/1004/#
      - /hfp/v2/journey/ongoing/vp/metro/+/+/31M1/#
      - /hfp/v2/journey/ongoing/vp/metro/+/+/31M2/#
      - /hfp/v2/journey/ongoing/vp/ferry/+/+/1019/#
    qos: 0
    cleanSession: true
