# The city's parking fee zones as an open WFS layer, 2 zones on 2026-09-25, in WGS84. No key. CC-BY-4.0, read from the
# HRI catalogue (package helsingin-pysakoinnin-maksuvyohykkeet).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-parking-fee-zones
  namespace: helsinki
  title: { en: "Parking fee zones", fi: "Pysäköinnin maksuvyöhykkeet" }
spec:
  type: http
  http:
    url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Pysakoinnin_maksuvyohykkeet_alue
    verb: GET
    headers: { Accept: application/json }
    timeout: 30s
