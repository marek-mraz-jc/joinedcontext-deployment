apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: traffic-messages
  namespace: helsinki
  title: { en: "Road works and traffic announcements in the capital region" }
spec:
  class: auto
  period: 10m
  schedule: "*/10 * * * *"
  source:
    dataSourceRef: { kind: DataSource, name: digitraffic-traffic-messages }
  targetEndpoint: urn:ngsi-ld:Endpoint:hel.fi:helsinki:helsinki-all
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
  # An Alert's end (PL-80, NGSI-LD 4.22 expiresAt): its validTo, and no later than an hour after
  # the run that wrote it. The feed lists only running situations and this pipeline reads it every
  # ten minutes, so each run moves the hour on for a situation still running, and one that ended
  # early goes an hour after it left (T-4823, T-4843). A feed outage longer than the hour empties
  # the desk until the feed answers again. A situation without an end time gets no end here
  # (the run counts it under lifetime-from); the space's Alert rule removes it 30 days after its
  # last write.
  lifetime:
    - type: Alert
      entity: { from: validTo, notAfter: PT1H }
