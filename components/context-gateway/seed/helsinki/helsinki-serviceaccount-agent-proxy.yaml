apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: agent-proxy
  namespace: helsinki
  title: { en: "Agent proxy of the builder runs" }
spec:
  owner: { user: "demo.steward" }
  purpose: "jc-agent-proxy reads the project's public endpoints on behalf of a builder run; the role is the anonymous reader's, so a run sees what the public sees"
  roles:
    - { role: public, scope: { contextSpace: helsinki } }
  credentials:
    - { kind: oauth-client, name: main }
