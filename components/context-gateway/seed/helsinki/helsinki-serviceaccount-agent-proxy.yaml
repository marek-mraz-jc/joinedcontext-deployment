apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: agent-proxy
  namespace: helsinki
  title: { en: "Agent proxy of the builder runs" }
spec:
  owner: { user: "demo.steward" }
  purpose: "jc-agent-proxy reads the project's endpoints for a builder run; a run's calls carry the exchanged token of the person who started it and are decided as that person (ADR-N-038, AG-95); the account's own role is the anonymous reader's"
  delegation: token-exchange
  roles:
    - { role: public, scope: { contextSpace: helsinki } }
  credentials:
    - { kind: oauth-client, name: main }
