# The write door of helsinki-kpi (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes helsinki-kpi served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint helsinki-kpi.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-kpi-write
  namespace: helsinki
  title: { sk: 'Helsinki indicators: zápis', en: 'Helsinki indicators: writes' }
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint helsinki-kpi.
    en: The internal door the data is written through; people read it through the public Endpoint helsinki-kpi.
spec:
  contextSpaceRef: helsinki-kpi
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
  policyRefs:
    - urn:ngsi-ld:Policy:hel.fi:helsinki-kpi:kpi-pipelines-write
    - urn:ngsi-ld:Policy:hel.fi:helsinki-kpi:kpi-read
  slug: gagl72sfertxzsagw77ij36jslpbkxvk
  audience: organization
  enabledRepresentations: [ngsi-ld]
