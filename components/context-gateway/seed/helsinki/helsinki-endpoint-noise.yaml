# One Smart Data Model type per catalogue dataset (T-4344): NoiseZone of the space helsinki, read
# through its own Policy, which narrows the space's public read to this type (T-5378).
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-noise
  namespace: helsinki
  title:
    fi: Meluselvitys 2022, liikennemelualueet — Helsinki
    en: Traffic noise zones of the 2022 noise survey — Helsinki
  description:
    fi: 'Helsingin meluselvityksen 2022 laskennalliset melualueet 5 dB:n vyöhykkeinä: katu- ja tieliikenne, junaliikenne, metro ja raitioliikenne (noiseSource), päivällä klo 7–22 ja yöllä klo 22–7 (assessmentPeriod, LAeq). Vyöhykkeen ala- ja yläraja desibeleinä kentissä noiseLevelLow ja noiseLevelHigh; kovimmalla vyöhykkeellä ei ole ylärajaa. noiseSource on Smart Data Models -laajennuksen NoiseZone ulkopuolinen kenttä. Lähde: Helsingin kaupunki, CC BY 4.0.'
    en: "The computed noise areas of Helsinki's 2022 noise survey as 5 dB bands: streets and roads, the railway, the metro and the tram (noiseSource), for the day 07-22 and the night 22-07 (assessmentPeriod, LAeq). The band's lower and upper bound in decibels are noiseLevelLow and noiseLevelHigh; the loudest band has no upper bound. noiseSource is a custom property beside the Smart Data Model extension NoiseZone. Source: City of Helsinki, CC BY 4.0."
spec:
  contextSpaceRef: helsinki
  slug: dh54wtluwvyhzmdsaosg3xpmgdadyoxg
  audience: public
  policyRef: urn:ngsi-ld:Policy:hel.fi:helsinki:public-noise
