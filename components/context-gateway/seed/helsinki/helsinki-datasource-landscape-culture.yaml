# The areas of the city's landscape culture map (maisemakulttuurikartta) as an open WFS layer, in WGS84. No key.
# CC-BY-4.0, read from the HRI catalogue (package helsingin_maisemakulttuurikartta). 2313 areas on 2026-10-26;
# the whole layer is 3.2 MB.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-landscape-culture
  namespace: helsinki
  title: { en: Landscape culture map, fi: Maisemakulttuurikartta }
spec:
  type: http
  http:
    url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Maisemakulttuuri_alue
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
