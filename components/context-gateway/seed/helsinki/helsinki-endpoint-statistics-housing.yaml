# Helsinki area statistics, housing and housing production (T-5258): the KeyPerformanceIndicator entities of the
# statistics pipeline whose id carries the theme `housing`, one per indicator and area, the newest
# period as the value and every period since the first run in the history.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: helsinki-statistics-housing
  namespace: helsinki
  title:
    fi: Asuminen ja asuntotuotanto — Helsingin aluesarjat
    sv: Boende och bostadsproduktion — Helsingfors områdesserier
    en: Housing and housing production — Helsinki area statistics
  description:
    fi: 'Helsingin aluesarjojen tilastot: asunnot sekä neljännesvuosittain myönnetyt, aloitetut ja valmistuneet asunnot; kaupungin, suurpiirien, peruspiirien ja osa-alueiden tasolla. Yksi Smart Data Models KeyPerformanceIndicator kutakin tunnuslukua ja aluetta kohden. Lähde: Helsingin kaupunki, kaupunkitutkimus ja -tilastot (Aluesarjat), CC BY 4.0.'
    sv: 'Helsingfors områdesserier: bostäder samt beviljade, påbörjade och färdiga bostäder per kvartal; för staden, stordistrikten, distrikten och delområdena. En Smart Data Models KeyPerformanceIndicator per nyckeltal och område. Källa: Helsingfors stad, stadsforskning och statistik (Aluesarjat), CC BY 4.0.'
    en: 'Helsinki area statistics: dwellings, and the dwellings granted a permit, started and completed each quarter; for the city, its major districts, basic districts and sub-districts. One Smart Data Models KeyPerformanceIndicator per indicator and area, the newest period as kpiValue and the earlier periods in its history. Properties beyond the model: districtCode (the code of the area in the statistics of the city), divisionLevel (city, majorDistrict, basicDistrict, subDistrict or cityPart), refArea (the AdministrativeArea of the sub-district), statisticsTable and dimensionKey (the source table and cell). Source: City of Helsinki, Urban Research and Statistics (Aluesarjat), CC BY 4.0.'
spec:
  contextSpaceRef: helsinki
  slug: fxokhhdfi5kf2sahspabslnxd2ahhr7c
  audience: public
  policyRef: urn:ngsi-ld:Policy:hel.fi:helsinki:public-statistics-housing
  # The NGSI-LD door also answers the temporal API, the series per indicator. An indicator has
  # no geometry of its own: OGC API Features serves it as a feature without one.
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: hel-fi }
      license: cc-by
      datastore: { representation: csv, refresh: onReconcile }
  catalog:
    publisher:
      name: { fi: Helsingin kaupunki, sv: Helsingfors stad, en: City of Helsinki }
      uri: https://www.hel.fi/
    license: CC_BY_4_0
    attribution:
      fi: 'Lähde: Helsingin kaupunki, kaupunkitutkimus ja -tilastot (Aluesarjat), CC BY 4.0'
      sv: 'Källa: Helsingfors stad, stadsforskning och statistik (Aluesarjat), CC BY 4.0'
      en: 'Source: City of Helsinki, Urban Research and Statistics (Aluesarjat), CC BY 4.0'
    themes: [SOCI, REGI]
    keywords:
      fi: [asunnot, asuntotuotanto, aluesarjat]
      sv: [bostäder, bostadsproduktion, områdesserier]
      en: [dwellings, housing production, area statistics]
    spatial:
      - FI1B1
      - http://uri.suomi.fi/codelist/jhs/kunta_1_20250101/code/091
    frequency: QUARTERLY
    source:
      - url: https://stat.hel.fi/pxweb/fi/Aluesarjat/Aluesarjat__asu__askan/alu_askan_005r.px/
        title: { fi: Aluesarjat alu_askan_005r, en: Area statistics table alu_askan_005r }
        description:
          fi: Pääkaupunkiseudun asunnot
          en: Dwellings in Helsinki, Espoo, Vantaa and Kauniainen by tenure status and dwelling type 31.12.2002-
      - url: https://stat.hel.fi/pxweb/fi/Aluesarjat/Aluesarjat__rak__astuo/alu_astuo_039f.px/
        title: { fi: Aluesarjat alu_astuo_039f, en: Area statistics table alu_astuo_039f }
        description:
          fi: Helsingin asuntotuotanto neljännesvuosittain - Myönnetyt rakennusluvat
          en: Housing production in Helsinki by quarter - Building permits granted 2015Q1-
      - url: https://stat.hel.fi/pxweb/fi/Aluesarjat/Aluesarjat__rak__astuo/alu_astuo_039g.px/
        title: { fi: Aluesarjat alu_astuo_039g, en: Area statistics table alu_astuo_039g }
        description:
