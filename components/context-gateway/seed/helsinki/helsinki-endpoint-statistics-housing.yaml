      en: 'Source: City of Helsinki, Urban Research and Statistics (Aluesarjat), CC BY 4.0'
    themes: [SOCI, REGI]
    keywords:
      fi: [asunnot, asuntotuotanto, aluesarjat]
      sv: [bostäder, bostadsproduktion, områdesserier]
      en: [dwellings, housing production, area statistics]
