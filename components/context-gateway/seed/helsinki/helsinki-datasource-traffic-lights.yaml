# Every junction and crossing of the city with traffic lights, as an open WFS layer, in WGS84. No key. CC-BY-4.0,
# read from the HRI catalogue (package helsingin-liikenne-ja-varoitusvaloliittymat). 557 on 2026-10-26.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-traffic-lights
  namespace: helsinki
  title: { en: Junctions with traffic lights, fi: Liikennevaloliittymät }
spec:
  type: http
  http:
    url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Liikennevalot_piste
    verb: GET
    headers: { Accept: application/json }
    timeout: 30s
