# The temporary traffic arrangements of the city's public-area register (Allu) as an open WFS layer, 297 areas on
# 2026-09-25, in WGS84. No key. CC-BY-4.0, read from the HRI catalogue (package
# helsingin-kaupungin-yleisten-alueiden-tapahtuma-ja-maankayttolupajarjestelma).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-allu-traffic-arrangements
  namespace: helsinki
  title: { en: "Temporary traffic arrangements (public-area permits, Allu)", fi: "Tilapäiset liikennejärjestelyt (Allu)" }
spec:
  type: http
  http:
    url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Tilapainen_liikennejarjestely_alue
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
