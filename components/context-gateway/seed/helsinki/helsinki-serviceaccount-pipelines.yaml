apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipelines
  namespace: helsinki
  title: { en: "Helsinki ingestion pipelines" }
spec:
  owner: { user: "demo.steward" }
  purpose: "The Bento streams of the Helsinki demo write events, bike stations and buses into the space"
  roles:
    - { role: space-writer, scope: { contextSpace: helsinki } }
  credentials:
    - { kind: oauth-client, name: main }
