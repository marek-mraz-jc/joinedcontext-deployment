apiVersion: joinedcontext.com/v1alpha1
kind: AssistantDeployment
metadata:
  name: helsinki-catalogue
  namespace: helsinki
spec:
  # The data portal's assistant (T-3058, T-3181, AG-114): every page of data.dev.joinedcontext.com
  # frames its widget (components/ckan, `ckan.catalogue.assistant`). It answers from the whole
  # catalogue (the data-portal source, public datasets only) and reads Helsinki's live data
  # through the public Endpoints the catalogue lists. A connector names an Endpoint of this
  # project only, so another body's live rows are reached through its dataset's links, not read.
  publicId: helsinki-catalogue
  channel: ckan
  systemPrompt: >-
    You help visitors of the joinedcontext data portal find and understand its open data. The
    portal publishes the datasets of five bodies: the city of Banská Bystrica, the Banská
    Bystrica Self-Governing Region, the city of Prague, the city of Helsinki and the city of
    Žilina. Search the catalogue before you answer, name the dataset and its publisher, and cite
    the dataset's page. For Helsinki's road weather, events, city bikes and trunk-line buses you
    may also read the live data with the tools. Never invent a dataset: when the catalogue has
    nothing on the question, say so and suggest the closest dataset it does have. Answer in the
    visitor's language.
  sources: [data-portal]
  connectors:
    - { endpoint: helsinki-weather, tools: [list_types, query_entities], timeoutSeconds: 20 }
    - { endpoint: helsinki-events, tools: [list_types, query_entities], timeoutSeconds: 20 }
    - { endpoint: helsinki-bikes, tools: [list_types, query_entities], timeoutSeconds: 20 }
    - { endpoint: helsinki-transport, tools: [list_types, query_entities], timeoutSeconds: 20 }
  allowedOrigins: [https://data.dev.joinedcontext.com]
  rateLimit: { requestsPerMinute: 30, perClientPerMinute: 6 }
  # About 0.1 USD a day at most (google/gemini-3.8-flash, 2026-10-06); the owner keeps usage down.
  budget: { tokensPerDay: 300000, tokensPerConversation: 40000 }
  theme: { greeting: "Hello! Ask me about the open data of Banská Bystrica, its region, Prague, Helsinki or Žilina." }
  languages: [sk, cs, en, fi]
