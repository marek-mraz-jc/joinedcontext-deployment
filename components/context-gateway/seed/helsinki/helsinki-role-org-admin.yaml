# PF-56: the organization administrator proposes, approves and deletes every kind, roles and
# bindings included; the one role that approves the red lane (CC-70). A binding under
# users/assignments/ hands it to a person; the Portal checks the binding before a Change
# exists (PF-50).
apiVersion: joinedcontext.com/v1alpha1
kind: Role
metadata:
  name: org-admin
  namespace: org
spec:
  rules:
    - kinds:
        - Organization
        - Project
        - ContextSpace
        - DataModel
        - Mapping
        - Policy
        - ScopeDefinition
        - Endpoint
        # An endpoint that names a projection carries one, and the Portal proposes the two
        # as one import: a role that may act on the endpoint and not on its projection cannot
        # check its own proposal (MP-01, T-1222).
        - ModelProjection
        - SharedSpaceReference
        - ContextSourceRegistration
        - ServiceAccount
        - Pipeline
        - DataSource
        - App
        - CkanInstance
        - Blueprint
        - DataSpaceParticipant
        - DataOffer
        - DataAgreement
        - SyncSource
        - Bundle
        - UiSchema
        - Role
        - RoleBinding
        - Subscription
        - Entity
        - Dashboard
        - Layer
      verbs: [propose, approve, delete]
