# The sites holding an environmental permit or registered under the Environmental Protection Act
# (ympäristölupakohteet) as an open WFS layer, in WGS84. No key. CC-BY-4.0, read from the HRI catalogue (package
# helsingin-ymparistolupakohteet). 254 sites on 2026-10-27.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: hel-environmental-permit-sites
  namespace: helsinki
  title: { en: Environmental permit sites, fi: Ympäristölupakohteet }
spec:
  type: http
  http:
    url: https://kartta.hel.fi/ws/geoserver/avoindata/wfs?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application/json&srsName=EPSG:4326&typeNames=avoindata:Ymparistolupakohteet
    verb: GET
    headers: { Accept: application/json }
    timeout: 30s
