# One FloodZone per record of the IPR layer Záplavové území (Q5) into the city space (T-5429).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-flood-q5
  namespace: praha
  title:
    en: Flood area of the 5-year flood (Q5)
    cs: Záplavové území (Q5)
spec:
  class: auto
  # IPR republishes the layer a few times a year; one read a week keeps up.
  period: 168h
  schedule: '40 3 * * 3'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-flood-q5 }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: FloodZone, mode: upsert }
  # 4622899 bytes on 2026-10-24.
  quotas: { maxMemoryMb: 256, cpuMillicores: 100 }
