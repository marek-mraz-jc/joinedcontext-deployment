# One RadonRiskArea per record of the IPR layer Kategorie radonového rizika into the city space (T-5429).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-radon
  namespace: praha
  title:
    en: Radon risk categories
    cs: Kategorie radonového rizika
spec:
  class: auto
  # IPR republishes the layer a few times a year; one read a week keeps up.
  period: 168h
  schedule: '40 3 * * 3'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-radon }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: RadonRiskArea, mode: upsert }
  # 8421773 bytes on 2026-10-24.
  quotas: { maxMemoryMb: 256, cpuMillicores: 100 }
