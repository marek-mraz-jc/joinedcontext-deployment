# One PointOfInterest per office of a city district or of the city from Golemio's /v2/municipalauthorities into the city space (T-5276).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: golemio-authorities
  namespace: praha
  title: { en: Municipal offices, cs: Úřady městských částí }
spec:
  class: auto
  # Golemio last refreshed it on 2025-05-23; one read a week is one request of the key's 20 per 8 s.
  period: 168h
  schedule: '25 4 * * 1'
  source:
    dataSourceRef: { kind: DataSource, name: golemio-authorities }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
