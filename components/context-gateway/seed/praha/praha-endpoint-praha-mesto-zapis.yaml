# The write door of praha-mesto (T-6980, EP-187): an open-data Endpoint is read-only, so the
# writes praha-mesto served move here. The audience keeps out anyone outside the organization;
# people read the data through the public Endpoint praha-mesto.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: praha-mesto-zapis
  namespace: praha
  title: { sk: 'Prague city data: zápis', en: 'Prague city data: writes' }
  description:
    sk: Interný vstup, cez ktorý sa zapisujú údaje; čítajú sa cez verejný Endpoint praha-mesto.
    en: The internal door the data is written through; people read it through the public Endpoint praha-mesto.
spec:
  contextSpaceRef: praha-mesto
  # The Policies this Endpoint evaluates: the ones the open-data Endpoint served before (P-18).
