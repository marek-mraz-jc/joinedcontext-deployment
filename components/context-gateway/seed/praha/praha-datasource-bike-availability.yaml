# nextbike's Prague system as GBFS 2.3 `station_status`: what each of the 1580 stations holds, refreshed every 60 s by the
# publisher (`ttl`). No key. CC0-1.0, read from the feed's own `system_information.json`.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: nextbike-station-status
  namespace: praha
  title: { en: "Bike availability (nextbike, GBFS)", cs: "Dostupnost kol (nextbike)" }
spec:
  type: http
  http:
    url: https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_tg/cs/station_status.json
    verb: GET
    headers: { Accept: application/json }
    timeout: 30s
