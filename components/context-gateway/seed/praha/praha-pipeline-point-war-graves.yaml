# One PointOfInterest per place of the IPR layer Pietní místa a válečné hroby into the city space (T-5682).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: point-war-graves
  namespace: praha
  title: { en: Memorials and war graves, cs: Pietní místa a válečné hroby }
spec:
  class: auto
  # IPR republishes its layers a few times a year; one read a week keeps up.
  period: 168h
  schedule: '20 3 * * 4'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-point-war-graves }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
