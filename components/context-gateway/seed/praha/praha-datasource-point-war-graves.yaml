# IPR Praha's geoportal item 227f70195fd04dc8b429b04ac8ce6cae (Pietní místa a válečné hroby), 5,931 records at 1,197 places on 2026-10-25: the layer's description
# on IPR's ArcGIS server, whose field list and coded values the mapping reads before it pages
# through the layer's FeatureServer. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5682).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-point-war-graves
  namespace: praha
  title: { en: Memorials and war graves (IPR Praha), cs: Pietní místa a válečné hroby (IPR Praha) }
spec:
  type: http
  http:
    url: https://mp.iprpraha.cz/arcgis/rest/services/Hosted/URK_CUR_URK_VALHROBPIETMIST_B/FeatureServer/0?f=json
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
