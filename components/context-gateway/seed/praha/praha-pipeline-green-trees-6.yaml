# One Tree per record of the IPR layer Sdílená data o zeleni – vegetační prvky – body into the city space (T-5425).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: green-trees-6
  namespace: praha
  title:
    en: 'Shared green register: trees, part 7 of 10'
    cs: Sdílená data o zeleni – vegetační prvky – body, část 7 z 10
spec:
  class: auto
  # IPR republishes the green register every few weeks; one read a week keeps up.
  period: 168h
  schedule: '12 3 * * 3'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-green-trees }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: Tree, mode: upsert }
  quotas: { maxMemoryMb: 192, cpuMillicores: 100 }
