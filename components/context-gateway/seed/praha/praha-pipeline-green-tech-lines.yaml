# One GreenAsset per place of the IPR layer Sdílená data o zeleni – technické prvky – linie into the city space (T-5682).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: green-tech-lines
  namespace: praha
  title:
    en: 'Shared green register: technical elements, lines'
    cs: Sdílená data o zeleni – technické prvky – linie
spec:
  class: auto
  # IPR republishes its layers a few times a year; one read a week keeps up.
  period: 168h
  schedule: '35 3 * * 4'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-green-tech-lines }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: GreenAsset, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
