kind: DataModel
metadata:
  name: catalog
  namespace: praha
  title: { cs: Katalog otevřených dat, en: Open data catalogue }
spec:
  contextSpaceRef: catalog
  linkml: ./catalog.linkml.yaml
  version: 0.1.0
  lifecycle: draft
  classes: [Dataset, DataService, Organization]
