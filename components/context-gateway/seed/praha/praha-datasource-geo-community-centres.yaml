# IPR Praha's geoportal item c0bca952f09d44b0bf38885f499ad59d (Kulturně komunitní centra), 294 records on 2026-10-23, served by its ArcGIS Hub
# download as GeoJSON in WGS 84, as the toilets read theirs. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-geo-community-centres
  namespace: praha
  title:
    en: Cultural and community centres (IPR Praha)
    cs: Kulturně komunitní centra (IPR Praha)
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/c0bca952f09d44b0bf38885f499ad59d_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
