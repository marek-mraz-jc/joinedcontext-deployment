# The mapping of the waste-fill pipeline (PL-03): one WasteContainer per sensor-monitored container
# Golemio reports, with what it takes, how full it was at its last reading and the collection point
# it stands at. The point's id is its number in the city's waste register, the key IPR and Golemio
# share, so the relationship lands on the WasteContainerIsle the `waste-stations` pipeline writes.
# A container at a point IPR does not publish (113 of 3456 on 2026-09-25) is refused on its own by
# the gateway's relationship check, the rest of the batch lands (DM-70).

pipeline:
  processors:
    - mapping: |
        let kinds = { "1": "colouredGlass", "2": "electronics", "3": "metal", "4": "beverageCartons", "5": "paper", "6": "plastic", "7": "clearGlass", "8": "edibleOil", "9": "mixedRecyclables" }
        root = this.features.or([]).filter(f -> f.properties.station_number.or("").string().trim().lowercase().replace_all("/ ", "-").replace_all("/-", "--").re_match("^[0-9a-z-]+$")).map_each(f -> f.properties.containers.or([]).filter(c -> c.is_monitored.or(false) == true && c.ksnko_id.or("").string().re_match("^[0-9]+$") && $kinds.get(c.trash_type.id.or("").string()) != null).map_each(c -> {
          "id": "urn:ngsi-ld:%v:%v:%v:ksnko-%v".format("WasteContainer", env("JC_ORG_DOMAIN"), env("JC_SPACE"), c.ksnko_id.string()),
          "type": "WasteContainer",
          "containerCode": { "type": "Property", "value": c.ksnko_id.string() },
          "wasteKind": { "type": "Property", "value": $kinds.get(c.trash_type.id.string()) },
          "fillingLevel": if c.last_measurement.percent_calculated.type() == "number" && c.last_measurement.percent_calculated >= 0 && c.last_measurement.percent_calculated <= 100 { { "type": "Property", "value": c.last_measurement.percent_calculated / 100 } } else { null },
          "dateModified": if c.last_measurement.measured_at_utc.or("").string().re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}T") { { "type": "Property", "value": c.last_measurement.measured_at_utc.ts_format("2006-01-02T15:04:05Z07:00", "UTC") } } else { null },
          "refWasteContainerIsle": { "type": "Relationship", "object": "urn:ngsi-ld:%v:%v:%v:station-%v".format("WasteContainerIsle", env("JC_ORG_DOMAIN"), env("JC_SPACE"), f.properties.station_number.string().trim().lowercase().replace_all("/ ", "-").replace_all("/-", "--")) },
          "dataProvider": { "type": "Property", "value": "Golemio, Operátor ICT" },
          "source": { "type": "Property", "value": "https://api.golemio.cz/v2/sortedwastestations" }
        }.filter(entry -> entry.value != null))).flatten()
