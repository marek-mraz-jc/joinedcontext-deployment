# The mapping of the waste-fill pipeline (PL-03): one WasteContainer per sensor-monitored container
# Golemio reports, with what it takes, how full it was at its last reading and the collection point
# it stands at. The point's id is its number in the city's waste register, the key IPR and Golemio
# share, so the relationship lands on the WasteContainerIsle the `waste-stations` pipeline writes.
# A container at a point IPR does not publish (113 of 3456 on 2026-09-25; 249 containers on dev
# on 2026-10-25) cannot be written: the link is required and the broker's view refuses one to an
# Entity it does not show. So the run asks the space which of the named points it holds, a
# thousand ids per ask, and leaves out the containers at the others, counted in the run's log
# (T-5720). A failed or empty ask writes every container as before, so a lookup outage loses nothing.
# A container Golemio stops monitoring drops out of the answer, and an upsert never deletes: each
# write carries expiresAt a week ahead, so the hourly run keeps a monitored container and one that
# left the list goes a week after its last write instead of showing an old fill level as today's
# (199 such on dev on 2026-10-23, the oldest written 2026-09-29; T-5270).

pipeline:
  processors:
    - mapping: |
        let kinds = { "1": "colouredGlass", "2": "electronics", "3": "metal", "4": "beverageCartons", "5": "paper", "6": "plastic", "7": "clearGlass", "8": "edibleOil", "9": "mixedRecyclables" }
        root = this.features.or([]).filter(f -> f.properties.station_number.or("").string().trim().lowercase().replace_all("/ ", "-").replace_all("/-", "--").re_match("^[0-9a-z-]+$")).map_each(f -> f.properties.containers.or([]).filter(c -> c.is_monitored.or(false) == true && c.ksnko_id.or("").string().re_match("^[0-9]+$") && $kinds.get(c.trash_type.id.or("").string()) != null).map_each(c -> {
          "id": "urn:ngsi-ld:%v:%v:%v:ksnko-%v".format("WasteContainer", env("JC_ORG_DOMAIN"), env("JC_SPACE"), c.ksnko_id.string()),
          "type": "WasteContainer",
          # The station's address and the waste the container takes, as Golemio names both (T-4745).
          "name": if f.properties.name.or("").string().trim() == "" { null } else { { "type": "LanguageProperty", "languageMap": {
            "cs": [f.properties.name.string().trim(), c.trash_type.description.or("").string().trim()].filter(t -> t != "").join(", ") } } },
          "containerCode": { "type": "Property", "value": c.ksnko_id.string() },
          "wasteKind": { "type": "Property", "value": $kinds.get(c.trash_type.id.string()) },
          "fillingLevel": if c.last_measurement.percent_calculated.type() == "number" && c.last_measurement.percent_calculated >= 0 && c.last_measurement.percent_calculated <= 100 { { "type": "Property", "value": c.last_measurement.percent_calculated / 100 } } else { null },
          "dateModified": if c.last_measurement.measured_at_utc.or("").string().re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}T") { { "type": "Property", "value": c.last_measurement.measured_at_utc.ts_format("2006-01-02T15:04:05Z07:00", "UTC") } } else { null },
          "location": { "type": "GeoProperty", "value": f.geometry },
          "refWasteContainerIsle": { "type": "Relationship", "object": "urn:ngsi-ld:%v:%v:%v:station-%v".format("WasteContainerIsle", env("JC_ORG_DOMAIN"), env("JC_SPACE"), f.properties.station_number.string().trim().lowercase().replace_all("/ ", "-").replace_all("/-", "--")) },
          "dataProvider": { "type": "Property", "value": "Golemio, Operátor ICT" },
          "source": { "type": "Property", "value": "https://api.golemio.cz/v2/sortedwastestations" },
          "expiresAt": (now().ts_unix() + 604800).ts_format("2006-01-02T15:04:05Z", "UTC")
        }.filter(entry -> entry.value != null))).flatten()

    # Which of the named collection points the space holds: one batch query per thousand ids
    # through the city endpoint the pipeline writes to.
    - branch:
        request_map: |
          let isles = this.map_each(c -> c.refWasteContainerIsle.object).unique()
          root = if $isles.length() == 0 { deleted() } else {
            # Bento's range(0, n, 1000) leaves out the last part chunk: count the chunks instead.
            range(0, (($isles.length() + 999) / 1000).floor().int64()).map_each(i -> {
              "type": "Query",
              "entities": $isles.slice(i * 1000, [i * 1000 + 1000, $isles.length()].min()).map_each(id -> { "id": id, "type": "WasteContainerIsle" })
            })
          }
        processors:
          - unarchive: { format: json_array }
          - try:
              - http:
                  url: ${JC_GATEWAY_URL}/api/endpoint/jw7tffshzip7igmzcszgffkkkuetnc6v/ngsi-ld/v1/entityOperations/query?limit=1000&options=keyValues
                  verb: POST
                  headers: { Content-Type: application/json }
                  oauth2:
                    enabled: true
                    client_key: ${JC_CLIENT_ID}
                    client_secret: ${JC_CLIENT_SECRET}
                    token_url: ${JC_TOKEN_URL}
                  timeout: 20s
                  rate_limit: pipeline_egress
              - mapping: 'root = { "held": this.map_each(e -> e.id) }'
          - catch:
              - mapping: 'root = { "failed": true }'
          - archive: { format: json_array }
        result_map: |
          meta asked = if this.any(r -> r.failed.or(false)) { "failed" } else { "ok" }
          meta held = this.map_each(r -> r.held.or([])).flatten().join(" ")

    - mapping: |
        let held = @held.or("").split(" ")
        # An answer holding no point at all is a broken ask, not a city without collection points.
        let kept = if @asked.or("") == "ok" && @held.or("") != "" { this.filter(c -> $held.contains(c.refWasteContainerIsle.object)) } else { this }
        meta dropped = (this.length() - $kept.length()).string()
        meta kept = $kept.length().string()
        root = $kept
    - log:
        level: INFO
        message: 'waste-fill: ${! @kept } containers kept, ${! @dropped } left out at a collection point the space does not hold'
