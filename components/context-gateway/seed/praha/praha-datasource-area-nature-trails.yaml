# IPR Praha's geoportal item 927f999ff604463cbce63914de97a6d7 (Naučné stezky), 15 trails on 2026-10-25, served by its ArcGIS Hub
# download as GeoJSON in WGS 84. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5426).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-area-nature-trails
  namespace: praha
  title: { en: Nature trails (IPR Praha), cs: Naučné stezky (IPR Praha) }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/927f999ff604463cbce63914de97a6d7_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
