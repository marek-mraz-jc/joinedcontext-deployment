# IPR Praha's geoportal item bed7894d358a4d08b640c972e844d7f3 (Naučné stezky – zastávky), 154 records on 2026-10-23, served by its ArcGIS Hub
# download as GeoJSON in WGS 84, as the toilets read theirs. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-geo-trail-stops
  namespace: praha
  title: { en: Nature trail stops (IPR Praha), cs: Naučné stezky – zastávky (IPR Praha) }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/bed7894d358a4d08b640c972e844d7f3_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
