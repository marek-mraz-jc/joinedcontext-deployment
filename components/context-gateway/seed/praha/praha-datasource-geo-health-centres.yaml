apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-geo-health-centres
  namespace: praha
  title:
    en: Polyclinics and health centres (IPR Praha)
    cs: Polikliniky a zdravotní střediska (IPR Praha)
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/3fbd520692be4ac889550cf7c5137282_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
