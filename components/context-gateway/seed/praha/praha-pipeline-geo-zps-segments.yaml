# One ParkingGroup per record of the IPR layer Úseky parkování v zónách placeného stání into the city space (T-5424).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-zps-segments
  namespace: praha
  title:
    en: Street segments of the paid parking zones
    cs: Úseky parkování v zónách placeného stání
spec:
  class: auto
  # TSK republishes its parking layers every few weeks; one read a week keeps up.
  period: 168h
  schedule: '40 3 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-zps-segments }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: ParkingGroup, mode: upsert }
  quotas: { maxMemoryMb: 512, cpuMillicores: 200 }
