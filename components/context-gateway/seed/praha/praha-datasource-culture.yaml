# IPR Praha's geoportal item 17f4294bf3f041db9a0ec0d6ac0741a6, served by its download API (opendata.geoportalpraha.cz/api/download/v1/items/17f4294bf3f041db9a0ec0d6ac0741a6/geojson), which
# answers with a redirect to this ArcGIS Hub URL; the manifest names the target so the fetch is one request. No key.
# CC BY 4.0 with the credit "datový podklad © IPR Praha", read from geoportalpraha.cz/data-a-sluzby/otevrena-data and the
# IPR DCAT feed. 523 venues.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-culture
  namespace: praha
  title: { en: "Cultural venues (IPR Praha)", cs: "Kulturní zařízení (IPR Praha)" }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/17f4294bf3f041db9a0ec0d6ac0741a6_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
