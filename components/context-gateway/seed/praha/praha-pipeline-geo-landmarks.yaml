# One PointOfInterest per record of the IPR layer Významné stavby a místa into the city space (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-landmarks
  namespace: praha
  title: { en: Notable buildings and places, cs: Významné stavby a místa }
spec:
  class: auto
  # IPR republishes its layers a few times a year; one read a week keeps up.
  period: 168h
  schedule: '5 3 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-landmarks }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
