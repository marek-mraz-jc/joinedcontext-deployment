# Health care and social services in Prague (T-5691): the places of care of legal persons from the
# national register of health care providers and the social services with a facility address from
# MPSV's register, geocoded at ČÚZK. PointOfInterest of the space praha-mesto read through its own
# Policy, which narrows the public read to the nrpzs- and rpss- ids.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: praha-zdravotni-a-socialni-sluzby
  namespace: praha
  title: { cs: Zdravotní a sociální služby — Praha, en: Health care and social services — Prague }
  description:
    cs: 'Ordinace, nemocnice, lékárny a další místa poskytování zdravotních služeb právnických osob z Národního registru poskytovatelů zdravotních služeb a sociální služby se zařízením v Praze z Registru poskytovatelů sociálních služeb: poloha, druh, adresa a web. Zdroj: ÚZIS ČR (CC BY 4.0), MPSV, poloha sociálních služeb © ČÚZK (CC BY 4.0).'
    en: 'Surgeries, hospitals, pharmacies and other places of health care run by legal persons from the national register of health care providers, and the social services with a facility in Prague from the register of social service providers: location, kind, address and web page. Source: ÚZIS ČR (CC BY 4.0), MPSV, social service locations © ČÚZK (CC BY 4.0).'
spec:
  contextSpaceRef: praha-mesto
