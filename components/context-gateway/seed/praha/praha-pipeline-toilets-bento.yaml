# The mapping of the toilets pipeline (PL-03): one PointOfInterest per public toilet of the city
# geoportal (IPR Praha), 458 on 2026-09-25. `vozickari` is the register's wheelchair flag (1 yes,
# 0 no). The layer's `typ` and `umisteni_podrob` are codes whose list the publisher does not
# publish, so they are not read.

pipeline:
  processors:
    - mapping: |
        root = this.features.or([]).filter(f -> f.properties.globalid.or("").string().re_replace_all("[{}]", "").lowercase().re_match("^[0-9a-f-]{36}$") && f.geometry.or(null) != null && f.properties.lokalita.or("").trim() != "").map_each(f -> {
          "id": "urn:ngsi-ld:%v:%v:%v:ipr-%v".format("PointOfInterest", env("JC_ORG_DOMAIN"), env("JC_SPACE"), f.properties.globalid.or("").string().re_replace_all("[{}]", "").lowercase()),
          "type": "PointOfInterest",
          "name": { "type": "LanguageProperty", "languageMap": { "cs": f.properties.lokalita.trim().re_replace_all("\\s+", " ") } },
          "serviceCategory": { "type": "Property", "value": "publicToilet" },
          "address": if f.properties.adresa.or("").trim() == "" { null } else { { "type": "Property", "value": f.properties.adresa.trim() } },
          "wheelchairAccessible": match f.properties.vozickari.or(null) { 1 => { "type": "Property", "value": true }, 0 => { "type": "Property", "value": false }, _ => null },
          "location": { "type": "GeoProperty", "value": f.geometry },
          "dataProvider": { "type": "Property", "value": "datový podklad © IPR Praha (CC BY 4.0)" },
          "source": { "type": "Property", "value": "https://opendata.geoportalpraha.cz/" }
        }.filter(entry -> entry.value != null))
