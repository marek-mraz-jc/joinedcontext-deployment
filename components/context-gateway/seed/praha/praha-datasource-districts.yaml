# IPR Praha's geoportal item 35ede955057f4815b522ea91b488792a, served by its download API (opendata.geoportalpraha.cz/api/download/v1/items/35ede955057f4815b522ea91b488792a/geojson), which
# answers with a redirect to this ArcGIS Hub URL; the manifest names the target so the fetch is one request. No key.
# CC BY 4.0 with the credit "datový podklad © IPR Praha", read from geoportalpraha.cz/data-a-sluzby/otevrena-data and the
# IPR DCAT feed. 57 districts, 1.7 MB.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-districts
  namespace: praha
  title: { en: "City districts (IPR Praha)", cs: "Městské části (IPR Praha)" }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/35ede955057f4815b522ea91b488792a_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
