# IPR Praha's geoportal item 28a9425f2ee748328fc5346030de2d83 (Vysoké školy), 289 records on 2026-10-23, served by its ArcGIS Hub
# download as GeoJSON in WGS 84, as the toilets read theirs. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-geo-universities
  namespace: praha
  title: { en: Universities (IPR Praha), cs: Vysoké školy (IPR Praha) }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/28a9425f2ee748328fc5346030de2d83_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
