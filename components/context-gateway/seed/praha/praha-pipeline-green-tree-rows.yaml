# One Tree per record of the IPR layer Stromořadí into the city space (T-5425).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: green-tree-rows
  namespace: praha
  title: { en: Tree rows, cs: Stromořadí }
spec:
  class: auto
  # IPR republishes the green register every few weeks; one read a week keeps up.
  period: 168h
  schedule: '25 3 * * 3'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-green-tree-rows }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: Tree, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
