# Golemio's /v2/municipalauthorities (Operátor ICT, a.s.): 64 records on 2026-10-22; Golemio last refreshed it on 2025-05-23. The key travels as the
# X-Access-Token header from the secret `golemio`, never as a value here (CC-06, MF-35). Terms: the
# Golemio API Keys service, attribution "Golemio, Operátor ICT, a.s.", no licence named (T-5268).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: golemio-authorities
  namespace: praha
  title: { en: Municipal offices (Golemio), cs: Úřady městských částí (Golemio) }
spec:
  type: http
  http:
    url: https://api.golemio.cz/v2/municipalauthorities?limit=10000
    verb: GET
    headers: { Accept: application/json }
    authorization:
      header: X-Access-Token
      headerRef: { name: golemio, key: token }
    timeout: 60s
