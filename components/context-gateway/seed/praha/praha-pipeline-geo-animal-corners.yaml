# One PointOfInterest per record of the IPR layer Zookoutky, farmy a záchranné stanice into the city space (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-animal-corners
  namespace: praha
  title:
    en: Petting zoos, farms and rescue stations
    cs: Zookoutky, farmy a záchranné stanice
spec:
  class: auto
  # IPR republishes its layers a few times a year; one read a week keeps up.
  period: 168h
  schedule: '0 3 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-animal-corners }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
