# The mapping of the police-units pipeline (T-5428, PL-03): the police-activity mapping over the same
# monthly activity reports cut by police unit (LKOD cc9dbd08, CC0): the 15 district directorates
# OŘ1 to OŘ15 and the patrol unit, 9,152 figures over the 11 reported months of 2025. The unit is
# the figure's `dimensionKey` and enters the hash of its id; the rest is the police-activity
# pipeline's file, with the series `mp-utvary`. Read its comment for the format, the ids and the
# plausibility checks; a change there is made here too.
pipeline:
  processors:
    - try:
        - mapping: |
            root = if content().length() > 4194304 { throw("the police answered %v bytes; more than 4 MiB is not a year of reports".format(content().length())) } else { this }
        - mapping: |
            let set = "mp-utvary"
            let byunit = true
            let source = "https://mppraha.cz/opendata/cinnost/mesicni_zpravy_za_rok_podle_utvaru_2025.json"
            map leaves {
              root = if this.v.type() == "object" { this.v.key_values().sort_by(kv -> kv.key).map_each(kv -> { "p": this.p.append(kv.key.trim()), "v": kv.value }.apply("leaves")).flatten() } else { [this] }
            }
            let months = if this.type() == "object" { this.key_values().filter(kv -> kv.key.re_match("^(0[1-9]|1[0-2])[0-9]{4}$") && kv.value.type() == "object" && kv.value.length() > 0) } else { null }
            let rows = if $months == null { null } else { $months.map_each(m -> (if $byunit { m.value.key_values().map_each(u -> { "u": u.key.trim(), "t": u.value }) } else { [{ "u": "", "t": m.value }] }).map_each(g -> { "p": [], "v": g.t }.apply("leaves").map_each(l -> l.assign({ "u": g.u, "period": m.key.slice(2, 6) + "-" + m.key.slice(0, 2) }))).flatten()).flatten() }
            root = if $months == null {
              throw("the police file %v is not an object of months".format($source))
            } else if $rows.length() == 0 {
              throw("the police file %v holds no reported month; it is never empty after January, so the download failed".format($source))
            } else {
              { "set": $set, "source": $source, "byunit": $byunit, "rows": $rows }
            }
        - mapping: |
            let now = now().ts_format("2006-01", "Europe/Prague")
            let rows = this.rows.map_each(r -> r.assign({
              "n": if r.v.type() == "string" { r.v.re_replace_all("[\\s\\x{00a0}]", "").replace_all(",", ".") } else { "" },
              "share": r.p.index(0).has_prefix("Procentické"),
              "key": "%v-%v".format(r.period, ([r.u].filter(u -> u != "").concat(r.p).join("/")).hash("sha256").encode("hex").slice(0, 12))
            }))
            let numeric = $rows.filter(r -> r.n.re_match("^-?[0-9]+(\\.[0-9]+)?$")).map_each(r -> r.assign({ "x": r.n.number() }))
            let plausible = $numeric.filter(r -> r.x >= 0 && (!r.share || r.x <= 100))
            let current = $plausible.filter(r -> r.period <= $now)
            let unique = $current.unique(r -> r.key)
            meta read = $rows.length()
            meta unusable = $rows.length() - $numeric.length()
            meta range = $numeric.length() - $plausible.length()
            meta future = $plausible.length() - $current.length()
            meta duplicate = $current.length() - $unique.length()
            meta set = this.set
            root = if $unique.length() * 2 < $rows.length() {
              throw("police file %v: only %v of %v figures are plausible numbers of a past month".format(this.source, $unique.length(), $rows.length()))
            } else { this.assign({ "rows": $unique }) }
        - log:
            level: INFO
            message: '${! meta("set") }: read ${! meta("read") }, dropped ${! meta("unusable") } not a number, ${! meta("range") } out of range, ${! meta("future") } of a future month, ${! meta("duplicate") } duplicates'
        - mapping: |
            let set = this.set
            let source = this.source
            root = this.rows.map_each(r -> {
              "id": "urn:ngsi-ld:%v:%v:%v:%v-%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), $set, r.key),
              "type": "KeyPerformanceIndicator",
              "name": { "type": "LanguageProperty", "languageMap": { "cs": "%v%v (%v)".format(if r.u == "" { "" } else { r.u + ": " }, r.p.join(" / "), r.period) } },
              "dataSet": { "type": "Property", "value": $set },
              "indicator": { "type": "Property", "value": r.p.join(" / ") },
              "refArea": { "type": "Property", "value": "CZ010" },
              "refPeriod": { "type": "Property", "value": r.period },
              "dimensionKey": if r.u == "" { null } else { { "type": "Property", "value": r.u } },
              "kpiValue": if r.share { { "type": "Property", "value": r.x, "unitCode": "P1" } } else if r.p.index(0).contains("v Kč") { { "type": "Property", "value": r.x } } else { { "type": "Property", "value": r.x, "unitCode": "C62" } },
              "unitText": { "type": "Property", "value": if r.share { "%" } else if r.p.index(0).contains("v Kč") { "Kč" } else { "počet" } },
              "dataProvider": { "type": "Property", "value": "Městská policie hl. m. Prahy (CC0)" },
              "source": { "type": "Property", "value": $source }
            }.filter(kv -> kv.value != null))
        # 500 records per request to the endpoint, about 0.5 MB, far under the broker's 4 MiB body limit.
        - unarchive: { format: json_array }
        - split: { size: 500 }
        - archive: { format: json_array }
