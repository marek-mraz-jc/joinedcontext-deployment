# One WasteContainerIsle per record of `ipr-waste-stations`, written into the city space (T-2785).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: waste-stations
  namespace: praha
  title: { en: "Sorted-waste collection points" }
spec:
  class: auto
  # Points are added and moved a few times a month; weekly is enough.
  period: 168h
  schedule: "40 3 * * 1"
  source:
    dataSourceRef: { kind: DataSource, name: ipr-waste-stations }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output:
    type: WasteContainerIsle
    mode: upsert
  quotas:
    maxMemoryMb: 256
    cpuMillicores: 100
