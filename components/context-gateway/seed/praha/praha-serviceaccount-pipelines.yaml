apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipelines
  namespace: praha
  title: { cs: "Kanály Prahy", en: "Prague ingestion pipelines" }
spec:
  owner: { user: "demo.steward" }
  purpose: "The Bento streams of the Prague project write the city's open data into the space praha-mesto"
  roles:
    - { role: space-writer, scope: { contextSpace: praha-mesto } }
  credentials:
    - { kind: oauth-client, name: main }
