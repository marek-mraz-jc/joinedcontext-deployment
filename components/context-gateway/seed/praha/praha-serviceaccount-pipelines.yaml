apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: pipelines
  namespace: praha
  title: { cs: Kanály Prahy, en: Prague ingestion pipelines }
spec:
  owner: { user: de300000-0000-4000-8000-000000000001 } # demo.steward
