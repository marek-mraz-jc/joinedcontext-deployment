# One PointOfInterest per record of the IPR layer Oázy chladu – místa ke koupání into the city space (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-bathing-places
  namespace: praha
  title: { en: 'Cool spots: places to swim', cs: Oázy chladu – místa ke koupání }
spec:
  class: auto
  # IPR republishes its layers a few times a year; one read a week keeps up.
  period: 168h
  schedule: '55 2 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-bathing-places }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
