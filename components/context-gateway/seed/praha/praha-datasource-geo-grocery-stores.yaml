# IPR Praha's geoportal item 97a5ee3b3d0c4e27b423f28daeb84e67 (Potravinářské plnosortimentní prodejny), 378 records on 2026-10-23, served by its ArcGIS Hub
# download as GeoJSON in WGS 84, as the toilets read theirs. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-geo-grocery-stores
  namespace: praha
  title: { en: Grocery stores (IPR Praha), cs: Potravinářské plnosortimentní prodejny (IPR Praha) }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/97a5ee3b3d0c4e27b423f28daeb84e67_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
