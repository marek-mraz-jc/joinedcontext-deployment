# One OnStreetParking per record of the IPR layer Vyhrazená stání pro invalidy - sdružená into the city space (T-5424).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-ztp-shared
  namespace: praha
  title:
    en: Shared reserved bays for disabled drivers
    cs: Vyhrazená stání pro invalidy - sdružená
spec:
  class: auto
  # TSK republishes its parking layers every few weeks; one read a week keeps up.
  period: 168h
  schedule: '20 3 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-ztp-shared }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: OnStreetParking, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 200 }
