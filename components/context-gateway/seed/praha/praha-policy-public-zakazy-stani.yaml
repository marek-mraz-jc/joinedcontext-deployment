apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-zakazy-stani
  namespace: praha
  title: { cs: 'Veřejné čtení: zákazy stání z geoportálu IPR' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-zakazy-stani: the
  # TSK street parking layers of the IPR geoportal (T-5424), each type only by its geo- ids.
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: RestrictedTrafficArea
          idPattern: ^urn:ngsi-ld:RestrictedTrafficArea:[a-z0-9.-]+:praha-mesto:geo-no-parking-[0-9a-f-]{36}$
