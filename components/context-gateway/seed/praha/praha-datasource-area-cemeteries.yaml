# IPR Praha's geoportal item 787f7c3ce4964b519ddc39246377c31b (Hřbitovy), 82 areas on 2026-10-25, served by its ArcGIS Hub
# download as GeoJSON in WGS 84. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5426).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-area-cemeteries
  namespace: praha
  title: { en: Cemeteries (IPR Praha), cs: Hřbitovy (IPR Praha) }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/787f7c3ce4964b519ddc39246377c31b_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
