# nextbike's Prague system as GBFS 2.3 `station_information`: 1580 stations on 2026-09-25, with their docks. No key.
# CC0-1.0, read from the feed's own `system_information.json` (`license_id`).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: nextbike-stations
  namespace: praha
  title: { en: "Bike stations (nextbike, GBFS)", cs: "Stanice sdílených kol (nextbike)" }
spec:
  type: http
  http:
    url: https://gbfs.nextbike.net/maps/gbfs/v2/nextbike_tg/cs/station_information.json
    verb: GET
    headers: { Accept: application/json }
    timeout: 30s
