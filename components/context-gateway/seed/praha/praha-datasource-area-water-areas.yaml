# IPR Praha's geoportal item e01b4bb6d148496abff4f065686290ff (Oázy chladu – vodní plochy a toky), 3,524 areas on 2026-10-25, served by its ArcGIS Hub
# download as GeoJSON in WGS 84. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5426).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-area-water-areas
  namespace: praha
  title:
    en: 'Cool spots: water areas and streams (IPR Praha)'
    cs: Oázy chladu – vodní plochy a toky (IPR Praha)
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/e01b4bb6d148496abff4f065686290ff_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
