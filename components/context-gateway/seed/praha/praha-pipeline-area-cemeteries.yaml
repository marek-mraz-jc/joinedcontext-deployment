# One PointOfInterest per record of the IPR layer Hřbitovy into the city space (T-5426).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: area-cemeteries
  namespace: praha
  title: { en: Cemeteries, cs: Hřbitovy }
spec:
  class: auto
  # IPR republishes the layer a few times a year; one read a week keeps up.
  period: 168h
  schedule: '35 2 * * 5'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-area-cemeteries }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  # 268869 bytes on 2026-10-25.
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
