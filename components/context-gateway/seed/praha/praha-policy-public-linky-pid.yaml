apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-linky-pid
  namespace: praha
  title: { cs: 'Veřejné čtení: linky pid' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-linky-pid, and only
  # its type, of the pid- ids its pipeline writes (T-5423).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: PublicTransportRoute
          idPattern: ^urn:ngsi-ld:PublicTransportRoute:[a-z0-9.-]+:praha-mesto:pid-l[0-9]+$
