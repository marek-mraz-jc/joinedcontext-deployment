apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-cinnost-mestske-policie
  namespace: praha
  title: { cs: 'Veřejné čtení: činnost městské policie' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-cinnost-mestske-policie, and only
  # the KeyPerformanceIndicator entities of its pipeline police-activity (T-4344, T-5428).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: KeyPerformanceIndicator
          idPattern: ^urn:ngsi-ld:KeyPerformanceIndicator:[a-z0-9.-]+:praha-mesto:mp-cinnost-[0-9]{4}-[0-9]{2}-[0-9a-f]{12}$
