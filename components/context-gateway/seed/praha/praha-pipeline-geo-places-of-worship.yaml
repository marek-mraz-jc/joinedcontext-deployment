# One PointOfInterest per record of the IPR layer Sakrální objekty into the city space (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-places-of-worship
  namespace: praha
  title: { en: Places of worship, cs: Sakrální objekty }
spec:
  class: auto
  # IPR republishes its layers a few times a year; one read a week keeps up.
  period: 168h
  schedule: '10 2 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-places-of-worship }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
