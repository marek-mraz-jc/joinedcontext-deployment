  http:
    url: https://hub.arcgis.com/api/v3/datasets/ae0ef46774394e09a91850fb9b826788_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
