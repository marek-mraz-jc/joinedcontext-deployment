apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-geo-drinking-fountains
  namespace: praha
  title: { en: 'Cool spots: drinking fountains (IPR Praha)', cs: Oázy chladu – pítka (IPR Praha) }
