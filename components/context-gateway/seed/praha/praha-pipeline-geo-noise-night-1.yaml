# One NoiseZone per polygon of the bands 35-45 dB of the IPR layer Hluková mapa povrchové dopravy – noc into the city space (T-5683).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-noise-night-1
  namespace: praha
  title:
    en: Noise map of surface transport, night, bands 35-45 dB
    cs: Hluková mapa povrchové dopravy – noc, pásma 35–45 dB
spec:
  class: auto
  # IPR republishes the layer a few times a year; one read a week keeps up.
  period: 168h
  schedule: '45 2 * * 0'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-noise-night }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: NoiseZone, mode: upsert }
  quotas: { maxMemoryMb: 384, cpuMillicores: 100 }
