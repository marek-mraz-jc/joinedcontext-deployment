# One PointOfInterest per record of the IPR layer Naučné stezky – zastávky into the city space (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-trail-stops
  namespace: praha
  title: { en: Nature trail stops, cs: Naučné stezky – zastávky }
spec:
  class: auto
  # IPR republishes its layers a few times a year; one read a week keeps up.
  period: 168h
  schedule: '15 3 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-trail-stops }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
