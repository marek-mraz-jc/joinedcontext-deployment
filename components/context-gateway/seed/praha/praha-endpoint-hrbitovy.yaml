# Cemeteries of the IPR Praha geoportal (T-5426), PointOfInterest of the space praha-mesto read through
# its own Policy, which narrows the public read to the area-cemeteries- ids.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: praha-hrbitovy
  namespace: praha
  title: { cs: Hřbitovy — Praha, en: Cemeteries — Prague }
  description:
    cs: 'Hřbitovy jako plochy: název, ulice a poloha. Zdroj: IPR Praha, CC BY 4.0.'
    en: 'Cemeteries as areas: name, street and outline. Source: IPR Praha, CC BY 4.0.'
spec:
  contextSpaceRef: praha-mesto
  slug: hbw5qxk3rsmtf7c2yj4dnoa6lpveu2gz
  audience: public
  policyRef: urn:ngsi-ld:Policy:praha.eu:praha-mesto:public-hrbitovy
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: praha }
      license: cc-by
      datastore: { representation: csv, refresh: onReconcile }
  catalog:
    # Mapped areas and lines: no record names a person.
    personalData: does-not-contain
    applicableLegislation:
      - https://www.e-sbirka.cz/eli/cz/sb/1999/106/2025-08-19
    license: CC_BY_4_0
    attribution:
      cs: 'Zdroj: datový podklad © IPR Praha (CC BY 4.0)'
      en: 'Source: data © IPR Praha (CC BY 4.0)'
    themes: [SOCI]
    keywords:
      cs: [Praha, hřbitovy, pohřebiště]
      en: [Prague, cemeteries, burial grounds]
    spatial:
      - CZ010
      - https://linked.cuzk.cz/resource/ruian/obec/554782
    frequency: IRREG
    source:
      - url: https://hub.arcgis.com/api/v3/datasets/787f7c3ce4964b519ddc39246377c31b_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
        title: { cs: Hřbitovy (IPR Praha), en: Cemeteries (IPR Praha) }
        description:
          cs: Hřbitovy z geoportálu IPR Praha, CC BY 4.0, datový podklad © IPR Praha.
          en: Cemeteries from the IPR Praha geoportal, CC BY 4.0, data © IPR Praha.
    pipelineRef: { kind: Pipeline, name: area-cemeteries }
