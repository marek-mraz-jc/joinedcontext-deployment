apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-sluzby
  namespace: praha
  title: { cs: 'Veřejné čtení: městské služby z Golemia' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-sluzby, and only
  # Golemio's places (golemio-): the IPR and ROPID places stay with praha-mista (T-5276).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: PointOfInterest
          idPattern: ^urn:ngsi-ld:PointOfInterest:[a-z0-9.-]+:praha-mesto:golemio-[a-z0-9-]+$
