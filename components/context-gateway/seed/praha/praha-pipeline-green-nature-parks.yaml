# One Garden per record of the IPR layer Přírodní parky into the city space (T-5425).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: green-nature-parks
  namespace: praha
  title: { en: Nature parks, cs: Přírodní parky }
spec:
  class: auto
  # IPR republishes the green register every few weeks; one read a week keeps up.
  period: 168h
  schedule: '45 3 * * 3'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-green-nature-parks }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: Garden, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
