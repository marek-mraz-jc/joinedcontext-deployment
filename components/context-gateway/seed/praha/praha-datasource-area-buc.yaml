  http:
    url: https://hub.arcgis.com/api/v3/datasets/8a85aa7854b048f8a5cf8a92070dcbbe_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
