apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-area-buc
  namespace: praha
  title:
    en: Planning balance units (BUC) (IPR Praha)
    cs: Bilanční územní celky (BUC) (IPR Praha)
spec:
