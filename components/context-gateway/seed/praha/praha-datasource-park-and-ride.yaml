# IPR Praha's geoportal item 7dce241cdbb141fa8104e3a65ca67ad6, served by its download API (opendata.geoportalpraha.cz/api/download/v1/items/7dce241cdbb141fa8104e3a65ca67ad6/geojson), which
# answers with a redirect to this ArcGIS Hub URL; the manifest names the target so the fetch is one request. No key.
# CC BY 4.0 with the credit "datový podklad © IPR Praha", read from geoportalpraha.cz/data-a-sluzby/otevrena-data and the
# IPR DCAT feed. 28 car parks.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-park-and-ride
  namespace: praha
  title: { en: "Park and ride car parks (IPR Praha)", cs: "Parkoviště P+R (IPR Praha)" }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/7dce241cdbb141fa8104e3a65ca67ad6_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
