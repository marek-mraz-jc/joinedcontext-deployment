# The mapping of the park-and-ride-occupancy pipeline (PL-03): the free and the occupied spaces of
# each car park Golemio counts, written onto the OffStreetParking the `park-and-ride` pipeline keeps
# from IPR. The gateway's upsert merges attributes, so the name, capacity and outline stay IPR's.
#
# TSK and IPR share no key: `pairs` maps TSK's car park id to IPR's globalid, matched by name and
# checked by distance (all under 200 m) on 2026-09-25. P+R Roztyly has no IPR record and is left
# out; a car park TSK adds is left out until it is paired here.
# ponytail: a hand-kept table of 22 pairs; a shared register id replaces it when IPR or TSK
# publishes one.

pipeline:
  processors:
    - mapping: |
        let pairs = {
          "ae77736b-399d-462e-901d-bf91ef7ab96c": "a7c9a9af-a0fb-4005-8baf-c9a202b763ad",
          "52551797-f7f0-44e0-8e06-988c96ab319f": "7ebeedd4-8076-4c57-bbd8-d26004c86cb2",
          "0a25bd51-0851-4766-b884-e5bf8cf0aac7": "8bb9fac8-1596-4968-8a95-25611e6c6a2a",
