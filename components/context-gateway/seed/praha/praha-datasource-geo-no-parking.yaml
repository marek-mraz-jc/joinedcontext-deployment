# by its ArcGIS Hub download as GeoJSON in WGS 84. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5424).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-geo-no-parking
  namespace: praha
  title: { en: No parking (IPR Praha), cs: Zákaz stání (IPR Praha) }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/b2be4777cec1443fa1e9b4b0d385fed1_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 120s
