# download as GeoJSON in WGS 84. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5426).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-area-cycle-routes
  namespace: praha
  title: { en: Cycle routes (IPR Praha), cs: Cyklistické trasy (IPR Praha) }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/45063acce89d4b37afc6d51f03f3ad49_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
