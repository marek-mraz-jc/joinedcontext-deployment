# One PointOfInterest per record of `ipr-toilets`, written into the city space (T-2785).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: toilets
  namespace: praha
  title: { en: "Public toilets" }
spec:
  class: auto
  # The register is updated a few times a year; weekly is enough.
  period: 168h
  schedule: "35 3 * * 1"
  source:
    dataSourceRef: { kind: DataSource, name: ipr-toilets }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output:
    type: PointOfInterest
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
