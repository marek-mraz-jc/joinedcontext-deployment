      - url: https://mp.iprpraha.cz/arcgis/rest/services/Hosted/OPK_CUR_OPK_PRIRODNIPARKY_P/FeatureServer/0?f=json
        title: { cs: Přírodní parky (IPR Praha), en: Nature parks (IPR Praha) }
        description:
          cs: Přírodní parky z geoportálu IPR Praha, CC BY 4.0, datový podklad © IPR Praha.
          en: Nature parks from the IPR Praha geoportal, CC BY 4.0, data © IPR Praha.
