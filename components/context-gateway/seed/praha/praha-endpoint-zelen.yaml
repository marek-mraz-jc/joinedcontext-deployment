# Parks and green areas of the IPR Praha geoportal (T-5425): the parks, the nature parks and the basic
# green areas, the areas in care and the vegetation areas (T-5683) of the shared green register,
# Garden of the space praha-mesto read through its own Policy, which narrows the public read to the
# green- ids. The trees are the dataset praha-stromy.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: praha-zelen
  namespace: praha
  title: { cs: Parky a plochy zeleně — Praha, en: Parks and green areas — Prague }
  description:
    cs: 'Parky, přírodní parky, základní plochy zeleně, plochy správy zeleně a plošné vegetační prvky: plocha, druh, správce, režim péče a datum poslední změny. Zdroj: IPR Praha, CC BY 4.0.'
    en: 'Parks, nature parks, basic green areas, the areas each green manager looks after and the vegetation areas: area, kind, manager, care regime and date of the last edit. Source: IPR Praha, CC BY 4.0.'
spec:
  contextSpaceRef: praha-mesto
  slug: criiz77fepoukmw4opvl2osua3b6ug5k
  audience: public
  policyRef: urn:ngsi-ld:Policy:praha.eu:praha-mesto:public-zelen
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: praha }
      license: cc-by
  catalog:
    # Areas with their manager, a city district or a city department: no person.
    personalData: does-not-contain
    applicableLegislation:
      - https://www.e-sbirka.cz/eli/cz/sb/1999/106/2025-08-19
    license: CC_BY_4_0
    attribution:
      cs: 'Zdroj: datový podklad © IPR Praha (CC BY 4.0)'
      en: 'Source: data © IPR Praha (CC BY 4.0)'
    themes: [ENVI, REGI]
    keywords:
      cs: [Praha, zeleň, parky, přírodní parky]
      en: [Prague, green areas, parks, nature parks]
    spatial:
      - CZ010
      - https://linked.cuzk.cz/resource/ruian/obec/554782
    frequency: WEEKLY
