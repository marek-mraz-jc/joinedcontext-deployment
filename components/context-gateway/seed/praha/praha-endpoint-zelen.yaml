# Parks, green areas and trees of the IPR Praha geoportal (T-5425): the parks and nature parks, the
# basic green areas and the trees and tree rows of the shared green register, Garden and Tree of
# the space praha-mesto read through its own Policy, which narrows the public read to the green- ids.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: praha-zelen
  namespace: praha
  title:
    cs: Parky, zeleň a stromy — Praha
    en: Parks, green areas and trees — Prague
  description:
    cs: 'Parky, přírodní parky, základní plochy zeleně, stromy a stromořadí: plocha nebo poloha, druh, správce, režim péče a datum poslední změny. Zdroj: IPR Praha, CC BY 4.0.'
    en: 'Parks, nature parks, basic green areas, trees and tree rows: area or location, kind, manager, care regime and date of the last edit. Source: IPR Praha, CC BY 4.0.'
spec:
  contextSpaceRef: praha-mesto
  slug: criiz77fepoukmw4opvl2osua3b6ug5k
  audience: public
  policyRef: urn:ngsi-ld:Policy:praha.eu:praha-mesto:public-zelen
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: praha }
      license: cc-by
      datastore: { representation: csv, refresh: onReconcile }
  catalog:
    # Areas and trees with their manager, a city district or a city department: no person.
    personalData: does-not-contain
    applicableLegislation:
      - https://www.e-sbirka.cz/eli/cz/sb/1999/106/2025-08-19
    license: CC_BY_4_0
    attribution:
      cs: 'Zdroj: datový podklad © IPR Praha (CC BY 4.0)'
      en: 'Source: data © IPR Praha (CC BY 4.0)'
    themes: [ENVI, REGI]
    keywords:
      cs: [Praha, zeleň, parky, stromy, stromořadí, přírodní parky]
      en: [Prague, green areas, parks, trees, tree rows, nature parks]
    spatial:
      - CZ010
      - https://linked.cuzk.cz/resource/ruian/obec/554782
    frequency: WEEKLY
    source:
      - url: https://mp.iprpraha.cz/arcgis/rest/services/Hosted/OPK_CUR_OPK_SMZ_VP_B/FeatureServer/0?f=json
        title:
          cs: Sdílená data o zeleni – stromy (IPR Praha)
          en: 'Shared green register: trees (IPR Praha)'
        description:
          cs: Stromy (body vegetačních prvků) ze sdílených dat o zeleni z geoportálu IPR Praha, CC BY 4.0, datový podklad © IPR Praha.
          en: Trees (the vegetation element points) of the shared green register from the IPR Praha geoportal, CC BY 4.0, data © IPR Praha.
      - url: https://mp.iprpraha.cz/arcgis/rest/services/Hosted/OPK_CUR_OPK_SMZ_VP_L/FeatureServer/0?f=json
        title:
          cs: Sdílená data o zeleni – stromořadí (IPR Praha)
          en: 'Shared green register: tree rows (IPR Praha)'
        description:
          cs: Stromořadí (linie vegetačních prvků) ze sdílených dat o zeleni z geoportálu IPR Praha, CC BY 4.0, datový podklad © IPR Praha.
          en: Tree rows (the vegetation element lines) of the shared green register from the IPR Praha geoportal, CC BY 4.0, data © IPR Praha.
      - url: https://mp.iprpraha.cz/arcgis/rest/services/Hosted/URK_CUR_URK_SS_STROMORADI_L/FeatureServer/0?f=json
        title: { cs: Stromořadí (IPR Praha), en: Tree rows (IPR Praha) }
        description:
          cs: Stromořadí z územně analytických podkladů z geoportálu IPR Praha, CC BY 4.0, datový podklad © IPR Praha.
          en: Tree rows of the planning analysis from the IPR Praha geoportal, CC BY 4.0, data © IPR Praha.
      - url: https://mp.iprpraha.cz/arcgis/rest/services/Hosted/OPK_CUR_OPK_SMZ_ZAKLADNIPL_P/FeatureServer/0?f=json
        title:
          cs: Sdílená data o zeleni – základní plochy zeleně (IPR Praha)
          en: 'Shared green register: basic green areas (IPR Praha)'
        description:
          cs: Základní plochy zeleně ze sdílených dat o zeleni z geoportálu IPR Praha, CC BY 4.0, datový podklad © IPR Praha.
          en: Basic green areas of the shared green register from the IPR Praha geoportal, CC BY 4.0, data © IPR Praha.
      - url: https://mp.iprpraha.cz/arcgis/rest/services/Hosted/URK_CUR_URK_PARKY_P/FeatureServer/0?f=json
        title: { cs: Parky (ÚAP) (IPR Praha), en: Parks (planning analysis) (IPR Praha) }
        description:
