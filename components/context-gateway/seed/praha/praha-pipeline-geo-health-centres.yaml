# One PointOfInterest per record of the IPR layer Polikliniky a zdravotní střediska into the city space (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-health-centres
  namespace: praha
  title: { en: Polyclinics and health centres, cs: Polikliniky a zdravotní střediska }
spec:
  class: auto
  # IPR republishes its layers a few times a year; one read a week keeps up.
  period: 168h
  schedule: '0 2 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-health-centres }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
