# One PointOfInterest per record of `ipr-schools`, written into the city space (T-2785).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: schools
  namespace: praha
  title: { en: "School facilities" }
spec:
  class: auto
  # The register is updated a few times a year; weekly is enough.
  period: 168h
  schedule: "25 3 * * 1"
  source:
    dataSourceRef: { kind: DataSource, name: ipr-schools }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output:
    type: PointOfInterest
    mode: upsert
  quotas:
    maxMemoryMb: 128
    cpuMillicores: 100
