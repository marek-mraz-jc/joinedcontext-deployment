# One FloodDefence per record of the IPR layer Protipovodňová ochrana into the city space (T-5429).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-flood-defences
  namespace: praha
  title:
    en: Flood defences
    cs: Protipovodňová ochrana
spec:
  class: auto
  # IPR republishes the layer a few times a year; one read a week keeps up.
  period: 168h
  schedule: '40 3 * * 3'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-flood-defences }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: FloodDefence, mode: upsert }
  # 153078 bytes on 2026-10-24.
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
