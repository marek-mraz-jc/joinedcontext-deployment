apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-scitace-cyklistu
  namespace: praha
  title: { cs: 'Veřejné čtení: sčítače cyklistů' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-scitace-cyklistu,
  # and only its type: the space's other types stay with their own datasets (T-4344).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
    - queryTemporal
    - retrieveTemporal
  # Its type keeps history: anyone reads it, as far back as the space keeps it (T-4372).
  temporalQ: timerel=after;timeAt=P-30D
  information:
    - entities:
        - type: TrafficFlowObserved
