# One PointOfInterest per station or desk of the Municipal Police from Golemio's /v2/municipalpolicestations into the city space (T-5276).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: golemio-police
  namespace: praha
  title: { en: Municipal Police stations, cs: Služebny Městské policie Praha }
spec:
  class: auto
  # Golemio refreshes it on the 1st of each month; one read a week is one request of the key's 20 per 8 s.
  period: 168h
  schedule: '15 4 * * 1'
  source:
    dataSourceRef: { kind: DataSource, name: golemio-police }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
