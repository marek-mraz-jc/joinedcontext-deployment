# The mapping of the schools pipeline (PL-03): one PointOfInterest per facility of the city's
# school register as the city geoportal (IPR Praha) publishes it: kindergartens, schools, school
# clubs and the rest, 1493 on 2026-09-25, with the capacity and the number of pupils the register
# states. Keyed by the layer's `globalid`, because its `objectid` changes when the layer is
# republished.

pipeline:
  processors:
    - mapping: |
        root = this.features.or([]).filter(f -> f.properties.globalid.or("").string().re_replace_all("[{}]", "").lowercase().re_match("^[0-9a-f-]{36}$") && f.geometry.or(null) != null && f.properties.nazev_zar.or("").trim() != "").map_each(f -> {
          "id": "urn:ngsi-ld:%v:%v:%v:ipr-%v".format("PointOfInterest", env("JC_ORG_DOMAIN"), env("JC_SPACE"), f.properties.globalid.or("").string().re_replace_all("[{}]", "").lowercase()),
          "type": "PointOfInterest",
          "name": { "type": "LanguageProperty", "languageMap": { "cs": f.properties.nazev_zar.trim() } },
          "serviceCategory": { "type": "Property", "value": "school" },
          "facilityType": if f.properties.typ_txt.or("").trim() == "" { null } else { { "type": "Property", "value": f.properties.typ_txt.trim() } },
          "address": if f.properties.adresa_zar.or("").trim() == "" { null } else { { "type": "Property", "value": f.properties.adresa_zar.trim() } },
          "capacity": if f.properties.kapacita.or(null) == null { null } else { { "type": "Property", "value": f.properties.kapacita } },
          "pupilCount": if f.properties.pocet_zaku.or(null) == null { null } else { { "type": "Property", "value": f.properties.pocet_zaku } },
          "location": { "type": "GeoProperty", "value": f.geometry },
          "dataProvider": { "type": "Property", "value": "datový podklad © IPR Praha (CC BY 4.0)" },
          "source": { "type": "Property", "value": "https://opendata.geoportalpraha.cz/" }
        }.filter(entry -> entry.value != null))
