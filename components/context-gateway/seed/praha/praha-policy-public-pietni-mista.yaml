apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-pietni-mista
  namespace: praha
  title: { cs: 'Veřejné čtení: pietní místa a válečné hroby' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-pietni-mista, and only
  # the records of its IPR layer (point-war-graves-): the space's other PointOfInterest stay with their own datasets (T-5682).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: PointOfInterest
          idPattern: ^urn:ngsi-ld:PointOfInterest:[a-z0-9.-]+:praha-mesto:point-war-graves-[0-9a-f-]{36}$
