# IPR Praha's geoportal item fb6ab7891a7244f39a3a380027af2981 (Významné stavby a místa), 781 records on 2026-10-23, served by its ArcGIS Hub
# download as GeoJSON in WGS 84, as the toilets read theirs. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-geo-landmarks
  namespace: praha
  title: { en: Notable buildings and places (IPR Praha), cs: Významné stavby a místa (IPR Praha) }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/fb6ab7891a7244f39a3a380027af2981_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
