# One RoadSegment per record of the IPR layer Uliční úseky TSK whose objectid falls in objectid>=228849 AND objectid<238849 into the city space (T-5677).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: tsk-useky-1
  namespace: praha
  title:
    en: TSK street sections, part 2 of 5
    cs: Uliční úseky TSK, část 2 z 5
spec:
  class: auto
  # TSK republishes the layer a few times a year; one read a week keeps up.
  period: 168h
  schedule: '10 3 * * 0'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-tsk-useky }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: RoadSegment, mode: upsert }
  quotas: { maxMemoryMb: 192, cpuMillicores: 100 }
