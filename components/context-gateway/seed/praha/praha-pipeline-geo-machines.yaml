# One FareCollectionSystem per record of the IPR layer Parkovací automaty into the city space (T-5424).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-machines
  namespace: praha
  title: { en: Parking machines, cs: Parkovací automaty }
spec:
  class: auto
  # TSK republishes its parking layers every few weeks; one read a week keeps up.
  period: 168h
  schedule: '20 3 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-machines }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: FareCollectionSystem, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 200 }
