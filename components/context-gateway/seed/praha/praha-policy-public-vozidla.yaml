apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vozidla-pid
  namespace: praha
  title: { cs: 'Veřejné čtení: vozidla PID' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-vozidla-pid, and only
  # its types: the space's other types stay with their own datasets (T-4344).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: Vehicle
  # The PID vehicles only: the shared cars of the same type are the dataset praha-sdilena-auta
  # (T-5680), told apart by their kind.
  q: vehicleType=="tram","bus","trolley","other"
