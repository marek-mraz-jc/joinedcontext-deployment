# Golemio's /v2/municipallibraries (Operátor ICT, a.s.): 107 records of 61 branches on 2026-10-22; Golemio refreshes the opening hours every few days. The key travels as the
# X-Access-Token header from the secret `golemio`, never as a value here (CC-06, MF-35). Terms: the
# Golemio API Keys service, attribution "Golemio, Operátor ICT, a.s.", no licence named (T-5268).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: golemio-libraries
  namespace: praha
  title:
    en: Municipal Library branches (Golemio)
    cs: Pobočky Městské knihovny v Praze (Golemio)
spec:
  type: http
  http:
    url: https://api.golemio.cz/v2/municipallibraries?limit=10000
    verb: GET
    headers: { Accept: application/json }
    authorization:
      header: X-Access-Token
      headerRef: { name: golemio, key: token }
    timeout: 60s
