# One OnStreetParking per record of the IPR layer Zóny placeného stání vymezené tarifem into the city space (T-5424).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-zps-sections
  namespace: praha
  title: { en: Paid parking sections by tariff, cs: Zóny placeného stání vymezené tarifem }
spec:
  class: auto
  # TSK republishes its parking layers every few weeks; one read a week keeps up.
  period: 168h
  schedule: '20 3 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-zps-sections }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: OnStreetParking, mode: upsert }
  quotas: { maxMemoryMb: 256, cpuMillicores: 200 }
