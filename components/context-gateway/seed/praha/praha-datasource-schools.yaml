# IPR Praha's geoportal item 5d32db18a5d545a79ad3029917984a89, served by its download API (opendata.geoportalpraha.cz/api/download/v1/items/5d32db18a5d545a79ad3029917984a89/geojson), which
# answers with a redirect to this ArcGIS Hub URL; the manifest names the target so the fetch is one request. No key.
# CC BY 4.0 with the credit "datový podklad © IPR Praha", read from geoportalpraha.cz/data-a-sluzby/otevrena-data and the
# IPR DCAT feed. 1493 facilities.
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-schools
  namespace: praha
  title: { en: "School facilities (IPR Praha)", cs: "Školská zařízení (IPR Praha)" }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/5d32db18a5d545a79ad3029917984a89_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
