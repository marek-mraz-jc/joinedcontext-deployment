# One PointOfInterest per record of the IPR layer Shromažďovací místa nebezpečných a bioodpadů into the city space (T-5269).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: geo-waste-points
  namespace: praha
  title:
    en: Hazardous and bio-waste collection points
    cs: Shromažďovací místa nebezpečných a bioodpadů
spec:
  class: auto
  # IPR republishes its layers a few times a year; one read a week keeps up.
  period: 168h
  schedule: '10 3 * * 2'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-geo-waste-points }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
