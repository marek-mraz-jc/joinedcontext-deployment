apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-protipovodnova-ochrana
  namespace: praha
  title: { cs: 'Veřejné čtení: protipovodňová ochrana' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-protipovodnova-ochrana, and only
  # its type: the space's other types stay with their own datasets (T-4344, T-5429).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: FloodDefence
