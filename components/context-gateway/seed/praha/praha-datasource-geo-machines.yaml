# IPR Praha's geoportal item 2b49ad1ad0bb4892bcb54acfb978456a (Parkovací automaty, TSK hl. m. Prahy), 1,337 records on 2026-10-24, served
# by its ArcGIS Hub download as GeoJSON in WGS 84. No key. CC BY 4.0, "datový podklad © IPR Praha" (T-5424).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: ipr-geo-machines
  namespace: praha
  title: { en: Parking machines (IPR Praha), cs: Parkovací automaty (IPR Praha) }
spec:
  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/2b49ad1ad0bb4892bcb54acfb978456a_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 120s
