apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-vstupy-metra
  namespace: praha
  title: { cs: 'Veřejné čtení: vstupy do metra' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-vstupy-metra, and only
  # its type, of the pid- ids its pipeline writes (T-5423).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: GtfsAccessPoint
          idPattern: ^urn:ngsi-ld:GtfsAccessPoint:[a-z0-9.-]+:praha-mesto:pid-entrance-[0-9a-f-]{36}$
