enums:
  StreetParkingCategory:
    description: The OnStreetParking `category` values the Prague parking layers map to, a subset of the Smart Data Model's enum.
    permissible_values:
      forResidents:
        description: Residents of the zone with a parking permit (RES, MIX).
      onlyWithPermit:
        description: A permit is needed (RES residents, a bay reserved for one plate, a special bay).
      feeCharged:
        description: Parking is paid by the time parked (MIX, VIS).
      shortTerm: { description: Short-term visitor parking (VIS). }
      forDisabled: { description: A bay for a ZTP/P card holder. }
      forLoadUnload: { description: A delivery bay (zásobování). }
  VehicleKind:
    permissible_values:
      tram: { description: A tram. }
      bus: { description: A bus. }
      trolley: { description: A trolleybus. }
      other:
        description: A metro train, a train, a ferry or the funicular.
  VehicleCategory:
    permissible_values:
      public: { description: A public transport vehicle. }
      tracked: { description: A vehicle whose position its operator tracks. }
  TransportMode:
    permissible_values:
      tram: { description: Tram (GTFS route type 0). }
      metro: { description: Metro (GTFS route type 1). }
      train: { description: Train (GTFS route type 2). }
      bus: { description: Bus (GTFS route type 3). }
      ferry: { description: Ferry (GTFS route type 4). }
      funicular: { description: Funicular (GTFS route type 7). }
      trolleybus: { description: Trolleybus (GTFS route type 11). }
  StationStatus:
    permissible_values:
      working: { description: The station rents bikes and takes them back. }
      outOfService: { description: The station neither rents nor takes back bikes right now. }
  ServiceCategory:
    permissible_values:
      school: { description: A school or a school facility of the city's school register. }
      culture:
        description: A theatre, a museum, a gallery or another cultural venue.
      publicToilet: { description: A public toilet. }
      ticketSale: { description: A place that sells public transport tickets. }
      library: { description: A branch of the Municipal Library of Prague. }
      municipalAuthority:
        description: The office of a city district or of the city (úřad městské části).
      police:
        description: A station or desk of the Municipal Police of Prague (Městská policie).
      garden: { description: A public garden or park of the city. }
      playground: { description: A public children's playground. }
      wasteCollectionYard:
        description: A waste collection yard (sběrný dvůr) that takes bulky and hazardous waste.
      healthCentre: { description: A polyclinic or health centre. }
      university:
        description: A university, faculty or university workplace.
      placeOfWorship:
        description: A church, chapel, prayer room or other place of worship.
      communityCentre:
        description: A cultural or community centre, a local library, a youth or senior club.
      accommodation:
        description: A hotel, guest house, hostel, campsite or other accommodation.
      groceryStore: { description: A full-range grocery store or supermarket. }
      drinkingFountain: { description: A public drinking fountain. }
      fountain: { description: A fountain or ornamental pool. }
      spring: { description: A well or spring. }
      waterPump: { description: A public water pump. }
      mistShower: { description: A mist shower that cools passers-by in summer. }
      bathingPlace:
        description: A swimming pool, natural pool or other place to swim.
      animalCorner:
        description: A petting zoo, farm, terrarium or animal rescue station.
      landmark: { description: A notable building or place of the city. }
      wasteCollectionPoint:
        description: A collection point for hazardous waste or bio-waste that is not a collection yard.
      trailStop: { description: A stop of a nature trail. }
      cemetery:
        description: A cemetery or burial ground, drawn as its area.
      natureTrail:
        description: A nature trail, drawn as its course.
      waterArea:
        description: A stream, pond or other water area, drawn as its outline.
      dogZone:
        description: An area where dogs may run free, must stay on a lead or may not enter, or a dog park.
      warMemorial:
        description: A memorial or war grave of the IPR register of memorials and war graves.
      postOffice: { description: A post office of the IPR layer of post offices. }
  WasteAccess:
    permissible_values:
      public: { description: Anyone may use it (volně). }
      residents: { description: Only the residents of the house may use it (obyvatelům domu). }
  WasteKind:
    permissible_values:
      colouredGlass: { description: Coloured glass (barevné sklo). }
      clearGlass: { description: Clear glass (čiré sklo). }
      paper: { description: Paper (papír). }
      plastic: { description: Plastic (plast). }
      metal: { description: Metal (kovy). }
      beverageCartons: { description: Beverage cartons (nápojové kartony). }
      electronics: { description: Small electrical appliances (elektrozařízení). }
      edibleOil: { description: Edible fats and oils (jedlé tuky a oleje). }
      mixedRecyclables:
        description: Paper, plastic and cartons in one container (multikomoditní sběr).
  EmissionRegister:
    permissible_values:
      rezzo1:
        description: REZZO 1, a large stationary source (kategorie 1).
      rezzo2:
        description: REZZO 2, a medium stationary source (kategorie 2).
  RadonRisk:
    permissible_values:
      transitional:
        description: Transitional, on variable Quaternary soils (přechodná).
      low: { description: Low (nízká). }
      medium: { description: Medium (střední). }
      high: { description: High (vysoká). }
  FloodZoneCategory:
    permissible_values:
      active:
        description: The active zone, where a flood flows fastest (aktivní).
      flowThrough: { description: Ground the flood flows through (průtočná). }
      nonFlowThrough: { description: Ground where the flood water stands (neprůtočná). }
      protectedByCity:
        description: Ground the city's flood defences protect (určená k ochraně městem).
      protectedIndividually:
        description: Ground its owners protect themselves (určená k ochraně individuálně).
  FloodDefenceType:
    permissible_values:
      unknown: { description: The register does not say (neznámo). }
      fixed: { description: A fixed barrier or wall (pevné opatření). }
      mobileWall: { description: A mobile wall put up before a flood (mobilní stěna). }
      sandbags: { description: A line of sandbags (pytle s pískem). }
  FloodDefenceKeeper:
    permissible_values:
      city: { description: The city sets it up and keeps it (zajišťovaná městem). }
      individual:
        description: The owner of the ground behind it does (zajišťovaná individuálně).
  FloodDesignLevel:
    permissible_values:
      q100: { description: The 100-year flood (Q100). }
      flood2002: { description: The level of the August 2002 flood (Q2002). }
