# ROPID's PID stop platforms with their lines and fare zones (Zastavky_WGS84, 16,118 platforms on 2026-10-24,
# 9.4 MB), the platforms of GTFS stops.txt without the 52 MB timetable zip. No key. CC BY 4.0 (T-5423).
apiVersion: joinedcontext.com/v1alpha1
kind: DataSource
metadata:
  name: pid-stops
  namespace: praha
  title: { en: PID stops (ROPID), cs: Zastávky PID (ROPID) }
spec:
  type: http
  http:
    url: https://data.pid.cz/geodata/Zastavky_WGS84.json
    verb: GET
    headers: { Accept: application/json }
    timeout: 120s
