      en: [Prague, road closures, road works, traffic]
    spatial:
      - CZ010
      - https://linked.cuzk.cz/resource/ruian/obec/554782
    frequency: DAILY
    source:
      - url: https://opravujeme.to/api/action?limit=101
        title: { cs: Data z aplikace opravujeme.to, en: Data of the opravujeme.to service }
        description:
          cs: Stavby, opravy a uzavírky na pražských ulicích ze služby opravujeme.to, bez omezení práv.
          en: The works, repairs and closures on Prague's streets from the opravujeme.to service, free of rights.
