# One Smart Data Model type per catalogue dataset (T-4344): WasteContainerIsle, WasteContainer of the space
# praha-mesto, read through its own Policy, which narrows the space's public read to these types.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: praha-trideny-odpad
  namespace: praha
  title: { cs: "Tříděný odpad — Praha", en: "Sorted waste — Prague" }
  description:
    cs: "Stanoviště tříděného odpadu a jejich kontejnery se zaplněním ze senzorů. Kontejner odkazuje na své stanoviště. Zdroje: IPR Praha (CC BY 4.0), Golemio, Operátor ICT."
    en: "Sorted-waste collection points and their containers with the fill level their sensors read. Each container references its collection point. Sources: IPR Praha (CC BY 4.0), Golemio, Operátor ICT."
spec:
  contextSpaceRef: praha-mesto
  slug: e6sryswazw3lcgip7tngpeoampsoai6z
  audience: public
  policyRef: urn:ngsi-ld:Policy:praha.eu:praha-mesto:public-odpad
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: praha }
      license: cc-by
  catalog:
    # The publisher and contact desk are the Project's spec.catalog, its registry IRI (T-4596).
    # Aggregates of public facilities and readings: no record names a person (T-4596).
    personalData: does-not-contain
    # Open data under the Czech act on free access to information (DCAT-AP-CZ, API/08 section 3).
    applicableLegislation: ["https://www.e-sbirka.cz/eli/cz/sb/1999/106/2025-08-19"]
    license: CC_BY_4_0
    attribution: { cs: "Zdroje: datový podklad © IPR Praha (CC BY 4.0); Golemio, Operátor ICT", en: "Sources: data © IPR Praha (CC BY 4.0); Golemio, Operátor ICT" }
    themes: [ENVI]
    keywords:
      cs: ["Praha", "odpad", "tříděný odpad", "kontejnery"]
      en: ["Prague", "waste", "recycling", "containers"]
    spatial:
      - "CZ010"
      - "https://linked.cuzk.cz/resource/ruian/obec/554782"
    frequency: CONT
    source:
      - url: "https://hub.arcgis.com/api/v3/datasets/9938b4b73b4d49a7aef5a605f4d39acf_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1"
        title: { cs: "Stanoviště tříděného odpadu (IPR Praha)", en: "Sorted-waste collection points (IPR Praha)" }
        description: { cs: "Stanoviště tříděného odpadu z geoportálu IPR Praha, CC BY 4.0, datový podklad © IPR Praha.", en: "Sorted-waste collection points from the IPR Praha geoportal, CC BY 4.0, data © IPR Praha." }
      - url: "https://api.golemio.cz/v2/sortedwastestations?onlyMonitored=true"
        title: { cs: "Zaplněnost kontejnerů na tříděný odpad (Golemio)", en: "Sorted-waste container fill levels (Golemio)" }
        description: { cs: "Stanoviště tříděného odpadu s poslední hodnotou zaplnění ze senzorů, Operátor ICT, otevřená data.", en: "Sorted-waste collection points with the last fill level their sensors read, Operátor ICT, open data." }
    pipelineRef: { kind: Pipeline, name: waste-fill }
