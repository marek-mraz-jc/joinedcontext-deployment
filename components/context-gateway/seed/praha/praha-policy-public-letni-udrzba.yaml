apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-letni-udrzba
  namespace: praha
  title: { cs: 'Veřejné čtení: blokové čištění ulic' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-letni-udrzba, and only
  # the RoadSegments of its layer: the other TSK layer and the space's other types stay with their own
  # datasets (T-4344, T-5677).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: RoadSegment
          idPattern: ^urn:ngsi-ld:RoadSegment:[a-z0-9.-]+:praha-mesto:tsk-letni-[0-9a-f-]{36}$
