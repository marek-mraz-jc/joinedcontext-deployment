# The one door of the space, public: every source is open data, and republishing it with the
# publisher's credit is what its licence allows. The catalogue entry names the licence the most
# demanding source asks for, CC BY 4.0, and the space's description names each publisher.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: praha-mesto
  namespace: praha
  title: { cs: Praha — městská data, en: Prague city data }
  description:
    cs: 'Městská data Prahy: kvalita ovzduší, sdílená kola, parkoviště P+R, kontejnery a stanoviště tříděného odpadu, rozpočet, kulturní a školská zařízení, veřejné toalety, městské části, služebny městské policie, knihovny, úřady, zahrady, dětská hřiště, sběrné dvory, občanská vybavenost a oázy chladu, zdroje znečišťování ovzduší, radonové riziko, záplavová území, protipovodňová ochrana a počasí. Zdroje: ČHMÚ, Golemio, ROPID, IPR Praha a hl. m. Praha.'
    en: 'Prague city data: air quality, shared bikes, park and ride car parks, sorted-waste containers and collection points, the budget, cultural and school facilities, public toilets, city districts, municipal police stations, libraries, municipal offices, gardens, playgrounds, waste collection yards, city amenities and cool spots, air pollution sources, radon risk, flood areas, flood defences and the weather. Sources: ČHMÚ, Golemio, ROPID, IPR Praha and the City of Prague.'
spec:
  contextSpaceRef: praha-mesto
  slug: jw7tffshzip7igmzcszgffkkkuetnc6v
  audience: public
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  # Off the catalogue (T-4344): its unrelated types are each their own dataset, through the
  # narrowed Endpoints beside it. This Endpoint stays for the Apps and connectors that read it.
  # The DCAT-AP description (T-2792, EP-78, EP-79), each licence read from its source on 2026-09-25:
  # ČHMÚ CC BY 4.0 (NKOD 00020699/2d09f059…, author ČHMÚ); IPR Praha CC BY 4.0 with the credit
  # "datový podklad © IPR Praha"; ROPID's ticket points CC BY (NKOD 60437359/12cceb7b…); nextbike
  # CC0 1.0 (its GBFS system_information); Golemio's park-and-ride API free of rights (NKOD
  # 02795281/b1c05f31…, matched to CC0); the city budget free of rights (Prague catalogue); Golemio's
  # waste sensors marked "Open Data" with no licence named, credited to Golemio. CC BY 4.0 is the
  # most demanding, so it is the space's; no source asks for share-alike. No contactPoint: the
  # organization has no open-data role address yet (owner's decision, as T-2790). No temporal:
  # the space holds each feed's current state, not a history.
  catalog:
    # Not a catalogue dataset: a door over the space; T-4344 split its types into datasets of their own, read by the Apps.
    # Its own record stays; the harvest feeds leave it out (EP-139, T-4744).
    harvest: false
    # The publisher and contact desk are the Project's spec.catalog, its registry IRI (T-4596).
    # Aggregates of public facilities and readings: no record names a person (T-4596).
    personalData: does-not-contain
    # Open data under the Czech act on free access to information (DCAT-AP-CZ, API/08 section 3).
    applicableLegislation:
      - https://www.e-sbirka.cz/eli/cz/sb/1999/106/2025-08-19
    license: CC_BY_4_0
    attribution:
      cs: 'Zdroje: Český hydrometeorologický ústav (CC BY 4.0); datový podklad © IPR Praha (CC BY 4.0); ROPID (CC BY 4.0); nextbike (CC0 1.0); Golemio, Operátor ICT, s daty TSK hl. m. Prahy; rozpočet hl. m. Prahy'
      en: 'Sources: Czech Hydrometeorological Institute (CC BY 4.0); data © IPR Praha (CC BY 4.0); ROPID (CC BY 4.0); nextbike (CC0 1.0); Golemio, Operátor ICT, with data of TSK hl. m. Prahy; City of Prague budget'
    themes: [TRAN, ENVI, EDUC, ECON, GOVE, REGI]
    keywords:
      cs:
        - Praha
        - doprava
        - sdílená kola
        - P+R
        - kvalita ovzduší
        - odpad
        - školy
        - kultura
