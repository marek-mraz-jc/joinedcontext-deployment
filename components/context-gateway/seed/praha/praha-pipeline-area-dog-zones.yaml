# One PointOfInterest per record of the IPR layer Volný pohyb psů – psí zóny into the city space (T-5426).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: area-dog-zones
  namespace: praha
  title: { en: Dog zones, cs: Volný pohyb psů – psí zóny }
spec:
  class: auto
  # IPR republishes the layer a few times a year; one read a week keeps up.
  period: 168h
  schedule: '50 2 * * 5'
  source:
    dataSourceRef: { kind: DataSource, name: ipr-area-dog-zones }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: PointOfInterest, mode: upsert }
  # 7050359 bytes on 2026-10-25.
  quotas: { maxMemoryMb: 384, cpuMillicores: 100 }
