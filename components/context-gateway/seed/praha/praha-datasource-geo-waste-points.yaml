  type: http
  http:
    url: https://hub.arcgis.com/api/v3/datasets/176f314a9ded40ef88ce55a2ed401c2e_0/downloads/data?format=geojson&spatialRefId=4326&where=1%3D1
    verb: GET
    headers: { Accept: application/json }
    timeout: 60s
