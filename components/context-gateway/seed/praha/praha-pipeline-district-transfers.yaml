# One KeyPerformanceIndicator per record of `mhmp-district-transfers`, written into the city space (T-5428).
apiVersion: joinedcontext.com/v1alpha1
kind: Pipeline
metadata:
  name: district-transfers
  namespace: praha
  title: { en: City district transfers 2026, cs: Finanční vztahy s městskými částmi 2026 }
spec:
  class: auto
  # The city updates the transfers monthly; a nightly read keeps the page current, as the budget's.
  period: 24h
  schedule: '5 4 * * *'
  source:
    dataSourceRef: { kind: DataSource, name: mhmp-district-transfers }
  targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:praha-mesto:praha-mesto
  output: { type: KeyPerformanceIndicator, mode: upsert }
  quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
