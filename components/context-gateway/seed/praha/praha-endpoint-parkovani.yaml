# The street parking of Prague that TSK hl. m. Prahy maps on the IPR geoportal (T-5424): the paid
# parking sections and their street segments (one referencing group, T-4344) and the bays reserved
# for ZTP/P card holders, deliveries and special purposes, read through their own Policy.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: praha-parkovani
  namespace: praha
  title: { cs: Parkování na ulici — Praha, en: On-street parking — Prague }
  description:
    cs: 'Zóny placeného stání (úseky s tarifem a zónou, úseky ulic s počtem stání) a vyhrazená stání pro držitele průkazu ZTP/P, pro zásobování a speciální: plochy a body na mapě. Zdroj: TSK hl. m. Prahy na geoportálu IPR Praha, CC BY 4.0.'
    en: 'Paid parking zones (sections with their tariff and zone, street segments with their spaces) and bays reserved for ZTP/P card holders, deliveries and special purposes: areas and points on the map. Source: TSK hl. m. Prahy on the IPR Praha geoportal, CC BY 4.0.'
spec:
  contextSpaceRef: praha-mesto
  slug: o4skujqulerujig44bteetjkalme6iof
  audience: public
  policyRef: urn:ngsi-ld:Policy:praha.eu:praha-mesto:public-parkovani
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: praha }
      license: cc-by
      datastore: { representation: csv, refresh: onReconcile }
