# Golemio's city places (T-5276): Municipal Police stations, Municipal Library branches, municipal
# offices, gardens, playgrounds and waste collection yards, PointOfInterest of the space praha-mesto
# read through its own Policy, which narrows the public read to the golemio- ids. Its own dataset
# because Golemio grants no licence of its own, beside the CC BY places of praha-mista.
apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: praha-sluzby
  namespace: praha
  title: { cs: Městské služby — Praha, en: City services — Prague }
  description:
    cs: 'Služebny Městské policie, pobočky Městské knihovny, úřady městských částí, zahrady a parky, dětská hřiště a sběrné dvory: poloha, adresa, otevírací doba a web. Zdroj: Golemio, Operátor ICT, a.s.'
    en: 'Municipal Police stations, Municipal Library branches, city district offices, gardens and parks, playgrounds and waste collection yards: location, address, opening hours and web page. Source: Golemio, Operátor ICT, a.s.'
spec:
  contextSpaceRef: praha-mesto
  slug: erj34fswmcrmg7fiwjyklxjqrlg2yqqt
  audience: public
  policyRef: urn:ngsi-ld:Policy:praha.eu:praha-mesto:public-sluzby
  enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp]
  publish:
    ckan:
      instanceRef: { kind: CkanInstance, name: praha }
      # Golemio's terms allow republishing but grant no sublicence: no licence of its own (T-5268).
      license: other-at
  catalog:
    # Public facilities by address; a police desk or an office is a place, never a person (T-4596).
    personalData: does-not-contain
    applicableLegislation:
      - https://www.e-sbirka.cz/eli/cz/sb/1999/106/2025-08-19
    attribution:
      cs: 'Zdroj: Golemio, Operátor ICT, a.s.; podmínky užití https://api.golemio.cz/api-keys/'
      en: 'Source: Golemio, Operátor ICT, a.s.; terms of use https://api.golemio.cz/api-keys/'
    themes: [GOVE, SOCI, ENVI]
    keywords:
      cs: [Praha, městská policie, knihovny, úřady, zahrady, dětská hřiště, sběrné dvory]
      en:
        - Prague
        - municipal police
        - libraries
        - municipal offices
        - gardens
        - playgrounds
        - waste collection yards
    spatial:
      - CZ010
      - https://linked.cuzk.cz/resource/ruian/obec/554782
    frequency: WEEKLY
