apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-opravy-a-uzavirky
  namespace: praha
  title: { cs: 'Veřejné čtení: opravy a uzavírky' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-opravy-a-uzavirky, and only
  # the CityWork entities of its pipeline road-works (T-4344, T-5428).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  information:
    - entities:
        - type: CityWork
          idPattern: ^urn:ngsi-ld:CityWork:[a-z0-9.-]+:praha-mesto:opravujeme-[0-9]+$
