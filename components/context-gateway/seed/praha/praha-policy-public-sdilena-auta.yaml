apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: public-sdilena-auta
  namespace: praha
  title: { cs: 'Veřejné čtení: sdílená auta' }
spec:
  contextSpaceRef: { kind: ContextSpace, name: praha-mesto }
  assigner: did:web:praha.eu
  assignee: { kind: role, id: public }
  # The reads, the discovery (EP-116) and the subscriptions of the Endpoint praha-sdilena-auta, and only
  # its types: the space's other types stay with their own datasets (T-4344).
  operations:
    - retrieveOps
    - retrieveEntityTypes
    - retrieveEntityTypeDetails
    - retrieveEntityTypeInfo
    - retrieveAttrTypes
    - retrieveAttrTypeDetails
    - retrieveAttrTypeInfo
    - createSubscription
    - retrieveSubscription
    - updateSubscription
    - deleteSubscription
  # No history read: a car's track would show where its renter drove, as the PID vehicles keep
  # none open either.
  information:
    - entities:
        - type: Vehicle
          idPattern: ^urn:ngsi-ld:Vehicle:[a-z0-9.-]+:praha-mesto:sharedcar-[a-z0-9]{1,20}$
