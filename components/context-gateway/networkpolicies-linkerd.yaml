---
context-gateway-allow-linkerd:
  podSelector:
    app.kubernetes.io/name: context-gateway-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
          componentNamespace: apisix
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pipeline-runner-runner
          componentNamespace: pipeline-runner
        # The broker delivering a notification, meshed like every other client
        # (R46); the plain rule for it is context-gateway-notification-egress.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-broker-broker
          componentNamespace: context-broker
        # A published App's pod calls its endpoint on this Service in the cluster, never through
        # the public host (AP-134). Every project's apps namespace is the Portal's, created with
        # this label (AP-116, AP-117), and only an App pod carries the other one.
        - namespaceSelector:
            matchLabels:
              joinedcontext.com/managed-by: joinedcontext-portal
          podSelector:
            matchLabels:
              joinedcontext.com/app: "true"
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP

# Same reason as the pipeline runner: the gateway declares an egress policy, so its
# Linkerd proxy needs identity (8080), destination (8086) and policy (8090) explicitly.
context-gateway-linkerd-control-plane:
  podSelector:
    app.kubernetes.io/name: context-gateway-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-broker-broker
          componentNamespace: context-broker
      ports:
        - protocol: TCP
          port: 4143
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
          componentNamespace: keycloak
      ports:
        - protocol: TCP
          port: 4143
    # The preview list from the Portal's internal listener, meshed (Architecture/06 §7.2).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal-portal
          componentNamespace: portal
      ports:
        - protocol: TCP
          port: 4143
    # git-sync fetches the configuration repository through the mesh (T-0278).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
              app.kubernetes.io/instance: gitea-forge
          componentNamespace: gitea
      ports:
        - protocol: TCP
          port: 4143

portal-linkerd-from-context-gateway:
  componentNamespace: portal
  podSelector:
    app.kubernetes.io/name: portal-portal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-gateway-gateway
          componentNamespace: context-gateway
      ports:
        - port: 4143
          protocol: TCP
