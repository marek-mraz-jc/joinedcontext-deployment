api-catalog-feed:
  name: api-catalog-feed
  description: The DCAT-AP catalogue feed on the data host, anonymous
  upstream: context-gateway.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "context-gateway") }}.svc.cluster.local:8080 # yamllint disable-line rule:line-length
  uri: '/catalog*'
  subDomain: api
  priority: 20
  methods: [GET, HEAD]
  pluginConfig: catalog-feed

api-context-endpoint:
  name: api-context-endpoint
  description: Context endpoint representation surface on the data host
  upstream: context-gateway.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "context-gateway") }}.svc.cluster.local:8080 # yamllint disable-line rule:line-length
  uri: '/api/endpoint/*'
  subDomain: api
  priority: 20
  pluginConfig: context-endpoint
  # As context-endpoint: the plain reads and writes (T-4903): the gateway ends a read at 10 s and waits up to 10 s
  # for write room, so 60 s is margin, never a read the broker spends minutes on. The WebSocket
  # (`-ws`) and the bulk exports (`-bulk`) have routes of their own with 300 s.
  timeout:
    connect: 6
    send: 60
    read: 60
  keepalivePool:
    size: 320
    idleTimeout: 60
    requests: 1000
  # The edge cache of anonymous reads (T-5900): the data host is where anonymous traffic lands.
  # APISIX keeps only an answer the gateway marks `public, max-age=N` (cache_control: true honours
  # it and never stores `private` or `no-store`); the gateway marks only a 200 to a GET or HEAD of
  # data sent with neither Authorization nor Cookie, and only while JC_GATEWAY_PUBLIC_MAX_AGE is
  # set. A request with either header neither reads nor fills the cache, nor does one with a
  # header that shapes the answer outside the key (Link names the @context of a compacted answer,
  # Prefer, NGSILD-Tenant; the gateway keeps those answers private too). The key carries the other
  # request headers the gateway's `Vary` names. The client gets the gateway's own
  # `public, max-age=N` too (context-endpoint's response-rewrite sets no Cache-Control), so a
  # browser may reuse an anonymous public answer for the same N seconds the edge does. The zone
  # must be one the APISIX chart's config.yaml declares, and chart 2.15 declares only
  # `disk_cache_one` (on the pod's /tmp): a route naming another zone is dropped whole, and every
  # read of the data host answered the edge's 404 on dev (2026-10-28, `memory_cache`).
  plugins:
    # context-endpoint turns nginx buffering off for SSE and exports, and an unbuffered answer
    # never enters proxy_cache (APISIX execs its @disable_proxy_buffering location): the cache
    # stored nothing on dev until this route plugin replaced the chain's (T-6185, 2026-10-31).
    proxy-buffering:
      disable_proxy_buffering: false
    proxy-cache:
      cache_strategy: disk
      cache_zone: disk_cache_one
      cache_key: ["$host", "$request_uri", "$http_accept", "$http_accept_language", "$http_accept_encoding", "$http_ngsild_results_restricted"] # yamllint disable-line rule:line-length
      cache_bypass: ["$http_cookie", "$http_authorization", "$http_link", "$http_prefer", "$http_ngsild_tenant"] # yamllint disable-line rule:line-length
      no_cache: ["$http_cookie", "$http_authorization", "$http_link", "$http_prefer", "$http_ngsild_tenant"] # yamllint disable-line rule:line-length
      cache_method: ["GET", "HEAD"]
      cache_http_status: [200]
      cache_control: true
      cache_ttl: 5
      hide_cache_headers: false

# T-6185 review: api-context-endpoint buffers for its cache, and nginx then holds an SSE answer
# until it ends. `{endpoint}/mcp` is the one path of the surface the gateway may answer as
# `text/event-stream` (Streamable HTTP, platform mcp/endpoint.rs), and the gateway sets no
# `X-Accel-Buffering`, so it keeps a route of its own on the plain chain: unbuffered, as the
# chain's comment wants SSE, and never cached. The rest of api-context-endpoint, limits and
# timeouts included.
api-context-endpoint-mcp:
  name: api-context-endpoint-mcp
  description: Endpoint MCP of the data host's surface, streamed unbuffered and never cached
  upstream: context-gateway.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "context-gateway") }}.svc.cluster.local:8080 # yamllint disable-line rule:line-length
  uri: '/api/endpoint/*'
