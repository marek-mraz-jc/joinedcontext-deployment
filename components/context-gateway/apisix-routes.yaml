# The gateway's stateless OAuth server for anonymous MCP (ADR-N-052 §2.2, platform T-4631):
# registration, authorize, token, and the RFC 8414 and RFC 9728 documents at the host's root.
# Nothing behind it is stored, so what an abuser can spend is minting; 30 a minute per client
# address (`remote_addr`, never a client header) is a few connector setups and no flood.
api-oauth:
  name: api-oauth
  description: The anonymous OAuth server on the data host, counted per client IP
  upstream: context-gateway.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "context-gateway") }}.svc.cluster.local:8080 # yamllint disable-line rule:line-length
  uri: '/oauth/*'
  subDomain: api
  priority: 20
  methods: [GET, POST]
  pluginConfig: context-endpoint
  plugins:
    limit-count:
      count: 30
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
  timeout:
    connect: 6
    send: 30
    read: 30

api-oauth-metadata:
  name: api-oauth-metadata
  description: The OAuth server and protected-resource documents on the data host
  upstream: context-gateway.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "context-gateway") }}.svc.cluster.local:8080 # yamllint disable-line rule:line-length
  uri: '/.well-known/oauth-*'
  subDomain: api
  priority: 20
  methods: [GET, HEAD]
  pluginConfig: context-endpoint

# The addresses people copied before the move (ADR-N-052 §2.1.3): an anonymous request for one
# of the four surfaces on the apex or the Portal host is a 308 to the same path and query on the
# data host, so a connector, a GIS layer or a harvester keeps working. A request with a bearer is
# still served where it is: a client drops `Authorization` on a redirect to another host, so
# redirecting it would only refuse it. On the Portal host the edge session cookie, which is
# host-only, keeps the Portal's own screens served there. The Portal host never served the feed,
# and `/catalog*` there would take its own `/catalogue` page, so the feed moves from the apex
# alone. Removed in release v0.2.0.
api-moved-endpoint:
  name: api-moved-endpoint
  description: /api/endpoint/* on the apex, anonymous, moved to the data host
  upstream: context-gateway.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "context-gateway") }}.svc.cluster.local:8080 # yamllint disable-line rule:line-length
  uri: '/api/endpoint/*'
  host: '{{ .Values.global.domain }}'
  priority: 30
  vars: [["http_authorization", "!", "~~", "."]]
  pluginConfig: api-moved
api-moved-portal-endpoint:
  name: api-moved-portal-endpoint
  description: /api/endpoint/* on the Portal host, anonymous and with no edge session, moved to the data host
  upstream: context-gateway.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "context-gateway") }}.svc.cluster.local:8080 # yamllint disable-line rule:line-length
  uri: '/api/endpoint/*'
  subDomain: portal
  priority: 30
  vars: [["http_authorization", "!", "~~", "."], ["cookie___Host-jc_edge", "!", "~~", "."]]
  pluginConfig: api-moved
api-moved-mcp:
  name: api-moved-mcp
  description: /api/mcp* on the apex, anonymous, moved to the data host
  upstream: context-gateway.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "context-gateway") }}.svc.cluster.local:8080 # yamllint disable-line rule:line-length
  uri: '/api/mcp*'
  host: '{{ .Values.global.domain }}'
  priority: 30
  vars: [["http_authorization", "!", "~~", "."]]
  pluginConfig: api-moved
api-moved-portal-mcp:
  name: api-moved-portal-mcp
  description: /api/mcp* on the Portal host, anonymous and with no edge session, moved to the data host
  upstream: context-gateway.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "context-gateway") }}.svc.cluster.local:8080 # yamllint disable-line rule:line-length
  uri: '/api/mcp*'
  subDomain: portal
  priority: 30
  vars: [["http_authorization", "!", "~~", "."], ["cookie___Host-jc_edge", "!", "~~", "."]]
  pluginConfig: api-moved
# The radix tree matches the longest prefix before priority: `/api/mcp/*` (context-mcp-named)
# outranked `/api/mcp*` above, so the hub's metadata and the named servers stayed on the old host.
api-moved-mcp-named:
