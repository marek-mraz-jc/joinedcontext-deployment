context-endpoint-apps:
  name: context-endpoint-apps
  description: Context endpoint surface under a static app's path, the apps session as the bearer
  plugins:
    request-id:
      include_in_response: true
    # SSE and large GeoJSON/CSV exports must reach the client as they are produced; with
    # nginx buffering on, a 300 s read timeout only means the client waits 300 s for the
    # first byte.
    proxy-buffering:
      disable_proxy_buffering: true
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            -- The notification delivery path is the one gateway surface that carries no
            -- token: the broker calling it holds none (R46). It is reached in-cluster, where
            -- the NetworkPolicy of T-0429 says only the broker may, and JC_GATEWAY_EGRESS_URL
            -- is what makes the broker dial the Service rather than this edge. Published here
            -- it would be a delivery-forging surface open to the internet, and a policy that
            -- governs pods can say nothing about a request that arrives through the ingress.
            if ngx.re.find(ngx.var.uri, [[^/apps/[^/]+/api/endpoint/[^/]+/egress/]], "jo") then
              return ngx.exit(403)
            end
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
          end
    # Class 3 (high-throughput streams): 5,000 requests per minute. The endpoint surface is
    # what the pipeline runners write telemetry to, so it carries the stream ceiling rather
    # than the 1,200 API one; separating a Class 2 caller from a Class 3 one needs the stable
    # client identity APISIX cannot key on yet (see portal-api).
    limit-count:
      count: 5000
      time_window: 60
      key_type: var_combination
      key: '$http_authorization $remote_addr'
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    # Class 4 (bulk file exports): 10 concurrent requests per client. A GeoJSON or CSV export
    # holds its connection for minutes, so a count per minute does not bound them — concurrency does.
    limit-conn:
      conn: 10
      burst: 0
      default_conn_delay: 0.1
      key_type: var_combination
      key: '$http_authorization $remote_addr'
      rejected_code: 429
    # No openid-connect here: the realm signs ES256 only (TR-03187 AR-11) and the plugin
    # (lua-resty-openidc) verifies RS/HS signatures only, so it would refuse every token.
    # Anonymous and bearer requests both reach the gateway PEP, which verifies the token itself and decides between a public representation and 401 (docs Deployment/10 §4, OPS-33).
    cors:
      # A browser may call the endpoint surface from any app served under this platform's
      # domain, and from nowhere else. `allow_origins: '*'` would also hand the response to
      # a page on an attacker's host.
      allow_origins_by_regex:
        # `${DOMAIN_RE}` and not `${DOMAIN}`: the dots of the domain are escaped by the
        # ConfigMap template, because an unescaped one matches any character and would admit
        # `https://evil.platform-example.org` as if it were ours (T-1679).
        - '^https://[^@/]+\.${DOMAIN_RE}$'
      allow_methods: 'GET,HEAD,OPTIONS'
      allow_headers: 'Authorization,Content-Type'
      allow_credential: false
    # The apps session as the bearer the gateway verifies (T-2670): the session apps-surface
    # made, read with the same client, cookie name and path; `pass` leaves an anonymous visitor
    # of a public app anonymous and a presented bearer untouched.
    openid-connect:
      client_id: edge
      client_secret: ${EDGE_CLIENT_SECRET}
      discovery: https://idm.${DOMAIN}/realms/${REALM}/.well-known/openid-configuration
      bearer_only: false
      use_jwks: false
      use_pkce: true
      ssl_verify: true
      unauth_action: pass
      redirect_uri: https://${DOMAIN}/apps/callback
      logout_path: /apps/logout
      post_logout_redirect_uri: https://portal.${DOMAIN}/
      set_userinfo_header: false
      set_access_token_header: true
      access_token_in_authorization_header: true
      set_id_token_header: false
      set_refresh_token_header: false
      session:
        secret: ${OIDC_SESSION_SECRET}
        cookie_name: jc_edge_apps
        cookie_path: /apps/
        cookie_secure: true
        cookie_http_only: true
        cookie_same_site: Lax
        idling_timeout: 3600
        rolling_timeout: 3600
        absolute_timeout: 36000
    # /apps/{name}/api/endpoint/{slug}/… is the gateway's /api/endpoint/{slug}/…; the name only
    # picks the path the session cookie reaches.
    proxy-rewrite:
      regex_uri: ['^/apps/[^/]+(/api/endpoint/.*)$', '$1']
      headers:
        set:
          X-Forwarded-Proto: https
          X-Forwarded-Port: '443'
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          Referrer-Policy: "strict-origin-when-cross-origin"
