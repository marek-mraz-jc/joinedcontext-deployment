# The four public data surfaces moved to `api.{domain}` (ADR-N-052 §2.1.3, EP-128, T-4630): an
# anonymous request on the apex or the Portal host answers 308 to the same path and query there,
# so the method and body of an MCP POST survive the move. The route terminates in the rewrite
# phase and never dials its upstream; the sanitising and the headers of every other route apply.
api-moved:
  name: api-moved
  description: Send a public data surface to the data host
  plugins:
    request-id:
      include_in_response: true
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
            for name in pairs(ngx.req.get_headers(0)) do
              local key = name:lower():gsub("_", "-")
              for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                if key:sub(1, #prefix) == prefix then
                  ngx.req.clear_header(name)
                end
              end
            end
          end
    # Class 1 (standard web), as the CKAN redirect: a redirect costs the edge nothing more.
    limit-count:
      count: 300
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    redirect:
      uri: "https://api.${DOMAIN}$request_uri"
      ret_code: 308
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Cache-Control: "no-store, no-cache, must-revalidate"
    # OPS-34: the 308 carries no policy of its own, so the edge adds the DENY baseline.
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
            end
          end
