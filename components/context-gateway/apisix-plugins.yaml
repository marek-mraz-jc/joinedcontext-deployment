---
context-space:
  name: context-space
  description: Context space direct NGSI-LD security and filtering
  # Every method but GET and HEAD, which the -read route counts apart: the Organization's
  # spec.limits.edge.requestsPerMinute.dataWrite replaces the count below (ADR-N-035).
  rateClass: dataWrite
  plugins:
    request-id:
      include_in_response: true
    # SSE and large GeoJSON/CSV exports must reach the client as they are produced; with
    # nginx buffering on, a 300 s read timeout only means the client waits 300 s for the
    # first byte.
    proxy-buffering:
      disable_proxy_buffering: true
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
            for name in pairs(ngx.req.get_headers(0)) do
              local key = name:lower():gsub("_", "-")
              for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                if key:sub(1, #prefix) == prefix then
                  ngx.req.clear_header(name)
                end
              end
            end
          end
    # Class 2 (authenticated API): 1,200 requests per minute per client identity.
    limit-count:
      count: 1200
      time_window: 60
      key_type: var
      key: http_authorization
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    # No openid-connect here: the realm signs ES256 only (TR-03187 AR-11) and the plugin
    # (lua-resty-openidc) verifies RS/HS signatures only, so it would refuse every token.
    # The upstream verifies the bearer token itself (docs Deployment/10 §4, OPS-33).
    proxy-rewrite:
      headers:
        set:
          X-Forwarded-Proto: https
          X-Forwarded-Port: '443'
    # No Cache-Control here: the gateway says `private, no-store` on every answer itself and
    # `private, no-cache` with a strong ETag on the schema artifacts it wants revalidated (T-2261,
    # EP-51). `set` replaced that with `no-store`, so no client could keep an artifact and every
    # page load downloaded all of them again instead of a 304 (T-2262).
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          Referrer-Policy: "strict-origin-when-cross-origin"
    # OPS-34: the upstream owns the Content Security Policy (the Portal's, each App's, AP-12,
    # AP-122), so the edge sets none over it and adds this baseline only to an answer that
    # carries none, its own refusals included. `frame-ancestors` says what X-Frame-Options
    # says. It runs after `response-rewrite`, whose `add` of an App's frame-ancestors counts.
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
            end
          end

