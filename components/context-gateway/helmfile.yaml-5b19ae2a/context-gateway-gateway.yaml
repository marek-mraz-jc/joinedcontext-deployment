command:
  - context-gateway
containerPort: 8080
env:
  JC_GATEWAY_ASSEMBLY_DIR: /assembly/current
  JC_GATEWAY_ASSISTANT_URL: http://jc-assistant.smartcity.svc.cluster.local:8080
  JC_GATEWAY_BROKER_URL: http://context-broker.smartcity.svc.cluster.local:8080
  JC_GATEWAY_BROKER_URL_TEMPLATE: http://context-broker-{broker}.smartcity.svc.cluster.local:8080
  JC_GATEWAY_CONNECTORS_URL: http://portal.smartcity.svc.cluster.local:9090/internal/connectors
  JC_GATEWAY_DOMAIN_VERIFICATION: report
  JC_GATEWAY_DOMAIN_VERIFICATIONS_URL: http://portal.smartcity.svc.cluster.local:9090/internal/domain-verifications
  JC_GATEWAY_HUB_KNOWLEDGE_SOURCES: banskabystrica/web,bbsk/web,zilina/web,praha/web,helsinki/web
  JC_GATEWAY_INTERNAL_BIND: 0.0.0.0:8082
  JC_GATEWAY_MAX_IN_FLIGHT_PER_CALLER: "96"
  JC_GATEWAY_MQTT_BROKER_HOST: mqtt-broker-pods.smartcity.svc.cluster.local
  JC_GATEWAY_MQTT_PORTAL_HOST: portal-pods.smartcity.svc.cluster.local
  JC_GATEWAY_MQTT_RUNNER_HOST: pipeline-runner-pods.smartcity.svc.cluster.local
  JC_GATEWAY_OAUTH_REDIRECT_HOSTS: oauth-redirect.googleusercontent.com
  JC_GATEWAY_ORG_DOMAIN: hel.fi
  JC_GATEWAY_PERSONAL_KEYS: /var/run/secrets/jc/personal-keys
  JC_GATEWAY_PREVIEWS_DIR: /previews
  JC_GATEWAY_PREVIEWS_URL: http://portal.smartcity.svc.cluster.local:9090/internal/previews
  JC_GATEWAY_PROJECTS_DIR: /projects
  JC_GATEWAY_PUBLIC_MAX_AGE: "60"
  JC_GATEWAY_PUBLIC_URL: https://api.smartcity.joinedcontext.com
  JC_GATEWAY_REPO_DIR: /repo/current
  JC_GATEWAY_REVOCATIONS_URL: http://portal.smartcity.svc.cluster.local:9090/internal/revocations
  JC_GATEWAY_USAGE_URL: http://portal.smartcity.svc.cluster.local:9090/internal/usage
  JC_GATEWAY_WS_ENTITIES: "10000"
  JC_OIDC_CLIENT_ASSERTION_FILE: /var/run/secrets/jc/keycloak/token
  JC_OIDC_CLIENT_ID: context-gateway
  JC_OIDC_ISSUER: https://idm.smartcity.joinedcontext.com/realms/smartcity
  JC_OIDC_JWKS_URL: http://keycloak-app-keycloakx-http.smartcity.svc.cluster.local:80/realms/smartcity/protocol/openid-connect/certs
  JC_OIDC_TOKEN_URL: http://keycloak-app-keycloakx-http.smartcity.svc.cluster.local:80/realms/smartcity/protocol/openid-connect/token
  MALLOC_ARENA_MAX: "2"
  MALLOC_MMAP_THRESHOLD_: "131072"
envSecret:
  JC_GATEWAY_OAUTH_KEY:
    key: key
    secret: context-gateway-oauth-key
extraContainers:
  - env:
      - name: GITSYNC_REPO
        value: http://gitea-http.smartcity.svc.cluster.local:3000/joinedcontext/configuration.git
      - name: GITSYNC_REF
        value: main
      - name: GITSYNC_ROOT
        value: /repo
      - name: GITSYNC_LINK
        value: current
      - name: GITSYNC_DEPTH
        value: "1"
      - name: GITSYNC_USERNAME
        value: git-sync
      - name: GITSYNC_PASSWORD
        valueFrom:
          secretKeyRef:
            key: token
            name: gitea-token-gateway
      - name: HOME
        value: /tmp
      - name: GITSYNC_PERIOD
        value: 10s
      - name: GITSYNC_HTTP_BIND
        value: :9092
      - name: GITSYNC_MAX_FAILURES
        value: "-1"
    image: registry.k8s.io/git-sync/git-sync:v4.7.1@sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717
    imagePullPolicy: IfNotPresent
    name: git-sync
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /
        port: 9092
      periodSeconds: 10
      timeoutSeconds: 3
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 65533
      runAsNonRoot: true
      runAsUser: 65533
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - mountPath: /repo
        name: repo
      - mountPath: /tmp
        name: tmp
  - args:
      - --org-dir
      - /repo/current
      - --projects-dir
      - /projects
      - --forge
      - http://gitea-http.smartcity.svc.cluster.local:3000/joinedcontext
      - --token-file
      - /var/run/forge/token
      - --interval
      - "10"
    env:
      - name: HOME
        value: /tmp
    image: ghcr.io/marek-mraz-jc/joinedcontext-platform/checkouts:main@sha256:f686b672dd063a85a718bf329aab9175aa81f6a6da238d31c0c18641a736bf09
    imagePullPolicy: IfNotPresent
    name: checkouts
    readinessProbe:
      exec:
        command:
          - test
          - -d
          - /projects
      periodSeconds: 30
      timeoutSeconds: 3
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - mountPath: /repo
        name: repo
        readOnly: true
      - mountPath: /projects
        name: projects
      - mountPath: /var/run/forge
        name: forge-token
        readOnly: true
      - mountPath: /tmp
        name: tmp
extraInitContainers:
  - env:
      - name: GITSYNC_REPO
        value: http://gitea-http.smartcity.svc.cluster.local:3000/joinedcontext/configuration.git
      - name: GITSYNC_REF
        value: main
      - name: GITSYNC_ROOT
        value: /repo
      - name: GITSYNC_LINK
        value: current
      - name: GITSYNC_DEPTH
        value: "1"
      - name: GITSYNC_USERNAME
        value: git-sync
      - name: GITSYNC_PASSWORD
        valueFrom:
          secretKeyRef:
            key: token
            name: gitea-token-gateway
      - name: HOME
        value: /tmp
      - name: GITSYNC_ONE_TIME
        value: "true"
    image: registry.k8s.io/git-sync/git-sync:v4.7.1@sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717
    imagePullPolicy: IfNotPresent
    name: git-sync-init
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 65533
      runAsNonRoot: true
      runAsUser: 65533
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - mountPath: /repo
        name: repo
      - mountPath: /tmp
        name: tmp
  - args:
      - --org-dir
      - /repo/current
      - --projects-dir
      - /projects
      - --forge
      - http://gitea-http.smartcity.svc.cluster.local:3000/joinedcontext
      - --token-file
      - /var/run/forge/token
      - --once
    env:
      - name: HOME
        value: /tmp
    image: ghcr.io/marek-mraz-jc/joinedcontext-platform/checkouts:main@sha256:f686b672dd063a85a718bf329aab9175aa81f6a6da238d31c0c18641a736bf09
    imagePullPolicy: IfNotPresent
    name: checkouts-init
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - mountPath: /repo
        name: repo
        readOnly: true
      - mountPath: /projects
        name: projects
      - mountPath: /var/run/forge
        name: forge-token
        readOnly: true
      - mountPath: /tmp
        name: tmp
extraVolumeMounts:
  - mountPath: /repo
    name: repo
    readOnly: true
  - mountPath: /previews
    name: previews
  - mountPath: /var/run/secrets/jc/keycloak
    name: keycloak-token
    readOnly: true
  - mountPath: /var/run/secrets/jc/personal-keys
    name: personal-keys
    readOnly: true
  - mountPath: /projects
    name: projects
    readOnly: true
  - mountPath: /assembly
    name: assembly
extraVolumes:
  - emptyDir: {}
    name: repo
  - name: keycloak-token
    projected:
      sources:
        - serviceAccountToken:
            audience: https://idm.smartcity.joinedcontext.com/realms/smartcity
            expirationSeconds: 600
            path: token
  - name: personal-keys
    secret:
      defaultMode: 292
      optional: true
      secretName: personal-data-keys
  - emptyDir:
      sizeLimit: 64Mi
    name: previews
  - emptyDir:
      sizeLimit: 256Mi
    name: projects
  - emptyDir:
      sizeLimit: 256Mi
    name: assembly
  - name: forge-token
    secret:
      items:
        - key: token
          path: token
      secretName: gitea-token-gateway
fullnameOverride: context-gateway
headlessService:
  name: context-gateway-pods
image:
  digest: sha256:e11965b94ddb93e034221c15eccfe967a8af46008fc5f2375243326d442f9650
  pullPolicy: IfNotPresent
  repository: ghcr.io/marek-mraz-jc/joinedcontext-platform
  tag: main
nameOverride: context-gateway-gateway
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
probes:
  liveness:
    failureThreshold: 3
    initialDelaySeconds: 10
    path: /livez
    periodSeconds: 15
    timeoutSeconds: 3
  readiness:
    failureThreshold: 3
    path: /healthz
    periodSeconds: 5
    timeoutSeconds: 3
replicaCount: 1
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 384Mi
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
service:
  enabled: true
  extraPorts:
    - name: internal
      port: 8082
      protocol: TCP
      targetPort: 8082
  name: http
  port: 8080
  targetPort: 8080
  type: ClusterIP
serviceMesh:
  enabled: true
