---
context-gateway:
  gateway:
    # The key the gateway seals each subscription's subscriber with, so every delivery is decided
    # again against the policies in force and a revoked grant stops it (GW27, T-2383). Generated
    # once and reused on every apply: rotating it stops every stored subscription until it is
    # written again.
    context-gateway-delivery-key:
      secret:
        length: 64
        generate: true
      componentNamespaces:
        - context-gateway
