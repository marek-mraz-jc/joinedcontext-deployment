---
# The key the gateway's anonymous OAuth server signs its client ids, codes and tokens with
# (ADR-N-052 §2.2.6, platform T-4631, T-4630): generated once, read by the gateway alone.
# Rotating it voids every registration and token at once; a client registers again.
context-gateway:
  gateway:
    context-gateway-oauth-key:
      key:
        length: 64
        generate: true
      componentNamespaces:
        - context-gateway
