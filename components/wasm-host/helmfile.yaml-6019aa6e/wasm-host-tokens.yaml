command:
  - /usr/local/bin/jc-token-sidecar
containerPort: 4180
env:
  JC_APP_IDENTITY_NAMESPACE: smartcity-app-identities
  JC_SIDECAR_IDENTITY: appjob
  JC_SIDECAR_LISTEN: 0.0.0.0:4180
  JC_TOKEN_AUDIENCE: https://idm.smartcity.joinedcontext.com/realms/smartcity
  JC_TOKEN_URL: https://idm.smartcity.joinedcontext.com/realms/smartcity/protocol/openid-connect/token
extraVolumeMounts:
  - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
    name: kube-api-token
    readOnly: true
extraVolumes:
  - name: kube-api-token
    projected:
      sources:
        - serviceAccountToken:
            expirationSeconds: 3600
            path: token
        - configMap:
            items:
              - key: ca.crt
                path: ca.crt
            name: kube-root-ca.crt
fullnameOverride: wasm-host-tokens
image:
  digest: sha256:e11965b94ddb93e034221c15eccfe967a8af46008fc5f2375243326d442f9650
  pullPolicy: IfNotPresent
  repository: ghcr.io/marek-mraz-jc/joinedcontext-platform
  tag: main
meshAuthorization:
  clients:
    - namespace: smartcity
      serviceAccount: jc-wasm-host-0
    - namespace: smartcity
      serviceAccount: jc-wasm-host-1
  port: 4180
nameOverride: wasm-host-tokens
podAnnotations:
  security.joinedcontext.com/api-access-reason: Mints a short TokenRequest token for the Apps' jobs' own ServiceAccounts (create on serviceaccounts/token in that namespace alone) to present to Keycloak as a client assertion.
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
probes:
  liveness:
    failureThreshold: 3
    initialDelaySeconds: 5
    path: /healthz
    periodSeconds: 20
    timeoutSeconds: 3
  readiness:
    failureThreshold: 3
    path: /healthz
    periodSeconds: 10
    timeoutSeconds: 3
rbac:
  rules: []
resources:
  limits:
    cpu: 200m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 16Mi
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
service:
  enabled: true
  name: http
  port: 4180
  targetPort: 4180
  type: ClusterIP
serviceAccount:
  automountServiceAccountToken: false
  create: true
serviceMesh:
  enabled: true
