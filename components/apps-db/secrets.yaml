---
# The logins of apps-db (ADR-N-044 §2.5), generated once: the Portal's, read by the Portal and by
# CloudNativePG for the role it manages, and one per shard of jc-wasm-host, read by that shard
# alone (its component wasm-host, T-3361). A shard added in `apps-db.cluster.shards` adds its
# entry here.
apps-db:
  cluster:
    db-apps-admin:
      username: 'jc_apps_admin'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - apps-db
        - portal
    apps-host-0-db:
      username: 'wasm_host_0'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - apps-db
        - wasm-host
    apps-host-1-db:
      username: 'wasm_host_1'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - apps-db
        - wasm-host
  # The drill key of the nightly dump (T-5839): each dump is age-encrypted to it besides the
  # operator's key, and the monthly drill opens the newest with it. The databases chart reads it as
  # `{cluster}-local-backup-key`, so a renamed cluster renames it here. Never rotate it alone: the
  # dumps sealed under the old key then open only with the operator's key.
  backup:
    apps-db-local-backup-key:
      key:
        length: 64
        generate: true
        encoding: hex
      componentNamespaces:
        - apps-db
