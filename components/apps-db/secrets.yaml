---
# The logins of apps-db (ADR-N-044 §2.5), generated once: the Portal's, read by the Portal and by
# CloudNativePG for the role it manages, and one per shard of jc-wasm-host, read by that shard
# alone once its component lands (T-3344). A shard added in `apps-db.cluster.shards` adds its
# entry here.
apps-db:
  cluster:
    db-apps-admin:
      username: 'jc_apps_admin'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - apps-db
        - portal
    apps-host-0-db:
      username: 'wasm_host_0'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - apps-db
    apps-host-1-db:
      username: 'wasm_host_1'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - apps-db
