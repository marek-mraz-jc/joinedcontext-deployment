---
context-broker:
  podSelector:
    app.kubernetes.io/name: context-broker-broker
  policyTypes:
    - Ingress
    - Egress
  egress:
    # CoreDNS. Every rule below names a Service, and a Service name is worth nothing
    # without this one.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-cluster
          componentNamespace: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Delivering a notification (R46). The gateway rewrites every subscription's endpoint
    # to point back at itself, so this is the only address the broker ever dials for one,
    # and the broker still holds no policy: it hands the notification to the gateway and
    # the gateway decides what leaves and where it goes.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-gateway-gateway
          componentNamespace: context-gateway
      ports:
        - protocol: TCP
          port: 8080
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-gateway-gateway
          componentNamespace: context-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal-portal
          componentNamespace: portal
      ports:
        - protocol: TCP
          port: 9090

postgres-from-context-broker:
  componentNamespace: postgres
  podSelector:
    cnpg.io/cluster: postgres-cluster
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-broker-broker
          componentNamespace: context-broker
      ports:
        - protocol: TCP
          port: 5432
