---
context-broker:
  broker:
    db-antares:
      username: 'antares'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - context-broker
        - postgres
    # The broker's `/q` admin credential (T-3642, ANTARES_ADMIN_TOKEN_FILE): every `/q` route but
    # health, readiness and metrics answers 401 without it. The Portal's view writer is the one
    # other holder (JC_PORTAL_BROKER_ADMIN_TOKEN_FILE). Read once at the broker's start.
    context-broker-admin-token:
      token:
        length: 48
        generate: true
      componentNamespaces:
        - context-broker
        - portal
