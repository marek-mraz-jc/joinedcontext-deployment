---
context-broker:
  broker:
    db-antares:
      username: 'antares'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - context-broker
        - postgres
    # The broker's `/q` admin credential (T-3642, ANTARES_ADMIN_TOKEN_FILE): every `/q` route but
    # health, readiness and metrics answers 401 without it. The Portal's view writer is the one
    # other holder (JC_PORTAL_BROKER_ADMIN_TOKEN_FILE). Read once at the broker's start.
    context-broker-admin-token:
      token:
        length: 48
        generate: true
      componentNamespaces:
        - context-broker
        - portal
    # The key Subscription receiverInfo is sealed with in the broker's database (T-5838,
    # ANTARES_SECRET_KEY): 32 bytes as 64 hex digits, read by the broker alone. Never rotate it while
    # rows are sealed under it: each such read then fails with a 500.
    context-broker-secret-key:
      key:
        length: 64
        generate: true
        encoding: hex
      componentNamespaces:
        - context-broker
