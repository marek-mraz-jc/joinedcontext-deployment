    # no new migration or runtime ANTARES_* key over f248288.
    # Antares dev e25ec9c (train 20261013-0011): retention sets the rule's tenant, so the history
    # sweep deletes under the broker's RLS-bound role (T-3900); upsert through a view in one read
    # (T-4085); OGC Part 3 CQL2 and items through the view scan (T-3745, T-3759); no new
    # migration or runtime ANTARES_* key over d335893.
    # Antares dev 79be5ab (train 20261013-0509): T-4020 T-3715 T-3946 T-3747 T-3822 T-4133 T-3752
    # (OGC collections from the view's LinkML, fan-out 1011/503, view-all contexts); no new
    # migration or runtime ANTARES_* key over d032654.
    # Antares dev c0be313 (trains 20261013-0555, -0704, -1004): T-3645 T-3912 T-3959 T-3773 T-3945
