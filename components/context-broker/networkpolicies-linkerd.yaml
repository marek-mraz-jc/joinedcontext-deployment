---
context-broker-allow-linkerd:
  podSelector:
    app.kubernetes.io/name: context-broker-broker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-gateway-gateway
          componentNamespace: context-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal-portal
          componentNamespace: portal
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP

# Meshed traffic reaches a pod through its Linkerd inbound proxy on 4143, not on the
# service port, so allowing 5432 alone is not enough: the database pods need their own
# rule for this client. Every meshed database client has to add one.
postgres-linkerd-from-context-broker:
  componentNamespace: postgres
  podSelector:
    cnpg.io/cluster: postgres-cluster
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-broker-broker
          componentNamespace: context-broker
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP

# A meshed pod under an egress policy needs two things spelled out. The Linkerd control
# plane — identity (8080), destination (8086), policy (8090) — or the proxy never learns the
# inbound policy for its own admin port, answers the kubelet startup probe with 403 and the
# pod loops in Init forever. And 4143 on every peer it calls: meshed traffic lands on the
# peer's inbound proxy, not on the service port, so the plain rule in networkpolicies.yaml
# allows a connection the proxy never makes.

context-broker-linkerd-control-plane:
  podSelector:
    app.kubernetes.io/name: context-broker-broker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8090
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-cluster
          componentNamespace: postgres
      ports:
        - protocol: TCP
          port: 4143
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-gateway-gateway
          componentNamespace: context-gateway
      ports:
        - protocol: TCP
          port: 4143
