---
gitea:
  forge:
    db-gitea:
      username: 'gitea'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - gitea
        - postgres
    # The forge's own administrator. Keycloak owns human logins (see keycloak-clients.yaml);
    # this account exists because someone has to hold the site-administration pages when
    # the identity provider is the thing that is broken, and because the chart's init
    # container needs an admin to create on an empty database.
    gitea-admin-credentials:
      username: 'gitea_admin'
      password:
        length: 32
        generate: true
        special: true
      componentNamespaces:
        - gitea
