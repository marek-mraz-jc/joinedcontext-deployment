---
component: gitea
parts:
  - name: forge
  # After the forge, because it talks to it. `needs` is the ordering; the Job's own wait loop
  # only covers the gap between a ready Deployment and a Gitea that has finished migrating.
  # The sample applications' files, a release of their own so the bootstrap's stays under Helm's
  # 1 MiB (T-3175); before the bootstrap, whose Job mounts them.
  - name: sample-apps
  # Its post-upgrade Job pushes six projects' seeds and the sample apps: 6 min 45 s on
  # 2026-10-07, past Helm's 300 s default, which failed an apply whose Job then succeeded (T-3207).
  - name: bootstrap
    timeout: 900
    needs:
      - gitea.forge
      - gitea.sample-apps
