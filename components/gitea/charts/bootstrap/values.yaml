---
# The forge the Job talks to, in-cluster. Not the public URL: under a self-signed cluster
# issuer that host is served with the cluster CA and curl in this image trusts only the
# Mozilla bundle.
giteaUrl: ''

# What the repository is called. Filled from global.configRepo.
# The forge teams a signed-in person lands in, keyed by name so the environment's
# group -> teams map and this list cannot drift (PF-79). Every team reads, none writes.
teams: {}

repo:
  owner: ''
  name: ''
  branch: main

# The forge administrator, the only credential that can mint a token.
adminSecret:
  name: gitea-admin-credentials
  usernameKey: username
  passwordKey: password

# Where the two minted tokens are written. Each holds one key, `token`.
tokens:
  portal:
    secret: gitea-token-portal
    # Read and write the organization's repositories: the Portal opens branches, writes files
    # and merges. `write:organization` is what creates a generated application's own repository
    # in the organization (AP-75); the forge files that route under the organization scope.
    # `write:package` publishes an application's checked build as the generic package
    # `app-{name}`: the Portal is the registry's only writer, no runner holds it (AP-101, AP-104).
    scopes: ['write:repository', 'read:user', 'write:organization', 'write:package']
    # Where the Secret is written. One entry under `singleNamespace: true`, one per consumer
    # otherwise.
    namespaces: []
  gateway:
    secret: gitea-token-gateway
    # The gateway only ever clones.
    scopes: ['read:repository']
    namespaces: []
  # What a node pulls a fullstack App's image with (AP-108): a token that reads packages and
  # nothing else, written as the `dockerconfigjson` Secret every App pod names in
  # `imagePullSecrets`, for the registry at `host`. Empty namespaces: no App pod runs here.
  registry:
    secret: app-registry
    scopes: ['read:package']
    host: ''
    namespaces: []
  # What the `gitea-lane-token` CronJob writes the Actions organization secret `JC_LANE_TOKEN`
  # with (ADR-N-028 §5, T-2636): `write:organization` alone, the scope the forge files the
  # organization's Actions secrets under. It reads no repository and writes no package. Empty
  # namespaces: no runner, no lane, no token.
  lane:
    secret: gitea-token-lane-secret
    scopes: ['write:organization']
    namespaces: []
  # Not a token of the admin user: the organization's Actions runner registration token
  # (ADR-N-028), which only the runner's init container mounts. Empty namespaces: no runner.
  runner:
    secret: gitea-runner-registration
    namespaces: []

# Files committed into the repository after it exists, keyed by their path with `/` written as
# `__` (a ConfigMap key cannot hold a slash): the manifests the gateway already serves, under the
# paths the Portal reads (T-0478). Idempotent: a file whose committed content matches is left
# alone, one that differs is updated, one that is missing is created; nothing is ever deleted.
seed: {}

# The refresher of the lane's token (AP-73, ADR-N-028 §5, T-2636): every `schedule` it asks
# Keycloak for a `client_credentials` token of `clientId` and writes it as the organization's
# Actions secret `JC_LANE_TOKEN`, with the `lane` forge token above and nothing else. Off unless
# the environment runs the runner.
laneToken:
  enabled: false
  schedule: '*/5 * * * *'
  # The realm's token endpoint in-cluster: Keycloak pins its public hostname, so the token's
  # `iss` is the one the Portal checks, and no TLS to the public host is needed from this image.
  tokenUrl: ''
  clientId: jc-build-lane
  clientSecretName: keycloak-client-jc-build-lane
  secretName: JC_LANE_TOKEN

image:
  repository: ''
  tag: ''
  digest: ''
  pullPolicy: IfNotPresent

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 128Mi }

podSecurityContext: {}
securityContext: {}
serviceMesh:
  enabled: false

# The sample applications the Job pushes each into its own repository and commits into
# `projects/<project>/apps/<name>/app.yaml` (T-2599, AP-75): `apps.<name>` maps a file's path,
# `/` written as `__`, to its text. `app.yaml` is the manifest and is not pushed with the tree.
# `publicBase` is where a person clones from, the address the manifest's `source.git.url` names.
sampleApps:
  project: ''
  publicBase: ''
  apps: {}
