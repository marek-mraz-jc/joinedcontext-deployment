apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bootstrap.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- /*
  A token is minted at run time, so it has to be written where it is read. Under
  `singleNamespace: true` that is one namespace and this loop renders one Role; under
  `false` the Portal and the gateway are in namespaces of their own and each needs its own,
  bound to this one ServiceAccount. Rendering only the Job's own namespace would work in
  exactly the default configuration and fail silently in the other one.
*/}}
{{- $secretNames := list }}
{{- $namespaces := list }}
{{- $restarts := dict }}
{{- range $key, $token := .Values.tokens }}
{{- $secretNames = append $secretNames $token.secret }}
{{- $namespaces = concat $namespaces $token.namespaces }}
{{- range $target := $token.restart | default list }}
{{- $parts := splitList "/" $target }}
{{- $ns := index $parts 0 }}
{{- $_ := set $restarts $ns (append (get $restarts $ns | default list) (index $parts 1)) }}
{{- $namespaces = append $namespaces $ns }}
{{- end }}
{{- end }}
{{- range $namespace := $namespaces | uniq | sortAlpha }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bootstrap.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "bootstrap.labels" $ | nindent 4 }}
rules:
  # `resourceNames` is what keeps this from being "may read every Secret in the namespace",
  # which in the forge's namespace includes the database credential and the administrator
  # password this Job authenticates with.
  - apiGroups: ['']
    resources: [secrets]
    resourceNames:
      {{- range $secretNames | uniq | sortAlpha }}
      - {{ . | quote }}
      {{- end }}
    verbs: [get, update, patch]
  # `create` takes no `resourceNames`: the object does not exist yet, so there is no name to
  # match on. It can only add a Secret to this one namespace.
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create]
  {{- with get $restarts $namespace }}
  # The Deployments that read a token at start, restarted when it is minted again (PF-106):
  # `patch` on these names alone, which is all `kubectl rollout restart` is.
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames:
      {{- range . | uniq | sortAlpha }}
      - {{ . | quote }}
      {{- end }}
    verbs: [patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bootstrap.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "bootstrap.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bootstrap.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bootstrap.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- /*
  The bound on `create` (F-R2DEP2-005). RBAC cannot name what a Job may create, so the rule
  above lets it create any Secret, a `service-account-token` one too, which the cluster fills
  with the token of whichever ServiceAccount it names; `get` on that name would then hand the
  Job that token. This policy holds the Job to the Secrets it writes: the names the Role reads,
  of type Opaque or (a registry pull Secret, AP-108) dockerconfigjson.
*/}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Release.Namespace }}-{{ include "bootstrap.fullname" . }}-secrets
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["secrets"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: the-bootstrap-job
      expression: request.userInfo.username == "system:serviceaccount:{{ .Release.Namespace }}:{{ include "bootstrap.fullname" . }}"
  validations:
    - expression: >-
        object.metadata.name in {{ $secretNames | uniq | sortAlpha | toJson }}
        && (!has(object.type) || object.type in ["Opaque", "kubernetes.io/dockerconfigjson"])
      messageExpression: >-
        "The forge bootstrap writes only its token Secrets, Opaque or dockerconfigjson, not " + request.namespace + "/" + request.name + " (F-R2DEP2-005)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "bootstrap.fullname" . }}-secrets
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
spec:
  policyName: {{ .Release.Namespace }}-{{ include "bootstrap.fullname" . }}-secrets
  validationActions: [Deny]
