apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bootstrap.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bootstrap.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- /*
  A token is minted at run time, so it has to be written where it is read. Under
  `singleNamespace: true` that is one namespace and this loop renders one Role; under
  `false` the Portal and the gateway are in namespaces of their own and each needs its own,
  bound to this one ServiceAccount. Rendering only the Job's own namespace would work in
  exactly the default configuration and fail silently in the other one.
*/}}
{{- $secretNames := list }}
{{- $namespaces := list }}
{{- range $key, $token := .Values.tokens }}
{{- $secretNames = append $secretNames $token.secret }}
{{- $namespaces = concat $namespaces $token.namespaces }}
{{- end }}
{{- range $namespace := $namespaces | uniq | sortAlpha }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bootstrap.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "bootstrap.labels" $ | nindent 4 }}
rules:
  # `resourceNames` is what keeps this from being "may read every Secret in the namespace",
  # which in the forge's namespace includes the database credential and the administrator
  # password this Job authenticates with.
  - apiGroups: ['']
    resources: [secrets]
    resourceNames:
      {{- range $secretNames | uniq | sortAlpha }}
      - {{ . | quote }}
      {{- end }}
    verbs: [get, update, patch]
  # `create` takes no `resourceNames`: the object does not exist yet, so there is no name to
  # match on. It can only add a Secret to this one namespace.
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bootstrap.fullname" $ }}
  namespace: {{ $namespace }}
  labels:
    {{- include "bootstrap.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bootstrap.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bootstrap.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
