---
gitea-forge:
  name: gitea-forge
  description: Git forge prefix rewriting and rate limiting
  plugins:
    request-id:
      include_in_response: true
    # Every route clears the headers the platform trusts internally, not only the
    # authenticated ones (T-0026): a client that can set them can claim a tenant or an
    # identity. X-Forwarded-For stays — nginx maintains it and the rate limit keys on it.
    # Each name is cleared twice, hyphenated and with underscores (T-1672): the http block
    # runs with `underscores_in_headers on`, so `X_Userinfo` survives to the upstream as a
    # header of its own, and a WSGI or CGI upstream folds it onto the same name the
    # hyphenated spelling has. The Lua is identical on every route and a test holds it so.
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
          end
    # Gitea is served under /git/ but listens at the root: ROOT_URL carries the prefix so
    # every link it renders keeps it, and the prefix comes off here on the way in. This is
    # the sub-path deployment Gitea documents; without the strip, every request lands on
    # /git/... inside the container and 404s.
    proxy-rewrite:
      regex_uri:
        - '^/git/?(.*)'
        - '/$1'
      headers:
        set:
          X-Forwarded-Proto: https
          X-Forwarded-Port: '443'
    # Class 2 (authenticated), keyed by address rather than by token: the forge
    # authenticates with its own session cookies and Git credentials, so there is no
    # bearer token here to build a bucket from.
    limit-count:
      count: 1200
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          # A forge is a web UI and frames its own pages; DENY belongs to the API classes.
          X-Frame-Options: "SAMEORIGIN"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Cache-Control: "no-store, no-cache, must-revalidate"

# The registry route: the same header clearing, no prefix to strip (/v2/ is the forge's own
# root), and a budget per address that a node pulling a few images stays well inside.
gitea-registry:
  name: gitea-registry
  description: Container registry pulls, header clearing and rate limiting
  plugins:
    request-id:
      include_in_response: true
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
          end
    proxy-rewrite:
      headers:
        set:
          X-Forwarded-Proto: https
          X-Forwarded-Port: '443'
    limit-count:
      count: 1200
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          # An API: nothing frames it, and it names no page a Referer would leak.
          X-Frame-Options: "DENY"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Cache-Control: "no-store, no-cache, must-revalidate"
