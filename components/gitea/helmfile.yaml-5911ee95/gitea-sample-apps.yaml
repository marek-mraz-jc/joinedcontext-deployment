    src__fixtures__memory.ts: |
      import { vi } from "vitest";
      import { ServerProblem } from "../server";
      import type { HistoryRow, KeptReach, Me, NewOrigin, Origin, ReachApi } from "../server";

      export const VIEWER: Me = { id: "u-viewer", name: "Vilja Viewer", roles: ["viewer"] };
      export const STEWARD: Me = { id: "u-steward", name: "Sami Steward", roles: ["viewer", "steward"] };

      export const BANDS = [
        { minutes: 10, areaKm2: 1.5, stops: 4 },
        { minutes: 20, areaKm2: 6.25, stops: 12 },
        { minutes: 30, areaKm2: 14, stops: 30 },
      ];

      /** An origin someone kept, as the server answers it to `me`. */
      export function origin(id: number, name: string, owner: string, published = false): Origin & { owner: string } {
        return { id, name, lon: 24.93, lat: 60.17, source: "network", bands: BANDS, published, mine: false, createdAt: "2030-10-07T06:00:00Z", owner };
      }

      /**
       * The App's server in memory, deciding as the real one does from the caller alone (`null` signed
       * out): a signed-in visitor keeps origins of their own, a steward publishes any and changes every
       * one; the published ones are everyone's to see; every write is history, a viewer's own rows only.
       */
      export function memory(me: Me | null = VIEWER, kept: (Origin & { owner: string })[] = []) {
        const origins = kept;
        const log: (HistoryRow & { owner: string })[] = [];
        const steward = () => me?.roles.includes("steward") ?? false;
        const signedIn = () => {
          if (!me) throw new ServerProblem(401, "sign in to do this");
          return me;
        };
        const write = (action: HistoryRow["action"], target: string, summary: string) => {
          const caller = signedIn();
          log.unshift({ id: log.length + 1, at: "2030-10-07T06:00:00Z", actorName: caller.name, action, target, summary, owner: caller.id });
        };
        const changeable = (id: number) => {
          const caller = signedIn();
          const found = origins.find((o) => o.id === id && (o.owner === caller.id || steward()));
          if (!found) throw new ServerProblem(404, "no such record, or not yours to change");
          return found;
        };
        const shown = (o: Origin & { owner: string }): Origin => {
          const { owner, ...rest } = o;
          return { ...rest, mine: me !== null && owner === me.id };
        };
        const api = {
          reach: vi.fn(
            async (stop: string): Promise<KeptReach> => ({ version: "v1", stop, bands: BANDS, cached: true, stale: false, url: "https://store.example/t.geojson" }),
          ),
          refresh: vi.fn(async () => ({ version: "v1", stops: 4, routes: 2, changed: false })),
          me: vi.fn(async () => me),
          origins: vi.fn(async () => origins.filter((o) => o.published || o.owner === me?.id || steward()).map(shown)),
          keep: vi.fn(async (wanted: NewOrigin) => {
            const caller = signedIn();
            if (!wanted.name.trim()) throw new ServerProblem(400, "a name is 1 to 80 characters, on one line");
            const made = { ...wanted, id: origins.length + 1, published: false, mine: true, createdAt: "2030-10-07T06:00:00Z", owner: caller.id };
            origins.unshift(made);
            write("insert", `origins/${made.id}`, `kept the origin ${made.name}`);
            return shown(made);
          }),
          rename: vi.fn(async (id: number, name: string) => {
            changeable(id).name = name;
            write("update", `origins/${id}`, `renamed an origin to ${name}`);
          }),
          forget: vi.fn(async (id: number) => {
            changeable(id);
            origins.splice(
              origins.findIndex((o) => o.id === id),
              1,
            );
            write("delete", `origins/${id}`, "deleted an origin");
          }),
          publish: vi.fn(async (id: number, published: boolean) => {
            signedIn();
            if (!steward()) throw new ServerProblem(403, "this needs the role steward");
            changeable(id).published = published;
            write("update", `origins/${id}`, published ? "published an origin" : "withdrew an origin from the shared set");
          }),
          history: vi.fn(async () => {
            const caller = signedIn();
            return log.filter((row) => steward() || row.owner === caller.id).map(({ owner: _, ...row }) => row);
          }),
        } satisfies ReachApi;
        return Object.assign(api, { kept: origins, log });
      }
    src__fixtures__network.ts: |
      /**
       * HSL's stops and lines as the space carries them (T-3356): four stops around Rautatientori and
       * two line variants, the metro east through three of them and bus 550 from Kaisaniemi to the
       * shore. Positions as the register gives them; rows as the endpoint answers them.
       */
      import type { Row } from "@joinedcontext/sdk";

      const stop = (id: string, name: string, code: string | null, lon: number, lat: number): Row =>
        ({
          id: `urn:ngsi-ld:GtfsStop:hel.fi:helsinki:${id}`,
          type: "GtfsStop",
          name,
          ...(code ? { stopCode: code } : {}),
          location: { type: "Point", coordinates: [lon, lat] },
        }) as Row;

      // A row carries the list as the endpoint's rows do: one text, joined by commas.
      const line = (id: string, name: string, mode: string, stops: string[]): Row => ({
        id: `urn:ngsi-ld:PublicTransportRoute:hel.fi:helsinki:${id}`,
        type: "PublicTransportRoute",
        routeShortName: name,
        transportMode: mode,
        stopSequence: stops.join(", "),
      });

      export const NETWORK_ROWS: Row[] = [
        stop("1020601", "Rautatientori", "H0019", 24.9414, 60.171),
        stop("1020602", "Kaisaniemi", "H0012", 24.9475, 60.1716),
        stop("1111601", "Hakaniemi", "H0026", 24.9512, 60.1789),
        stop("1111602", "Kaisaniemenranta", null, 24.9561, 60.1755),
        line("31M1-1", "M1", "metro", ["1020601", "1020602", "1111601"]),
        line("1550-1", "550", "bus", ["1020602", "1111602"]),
      ];
    src__fixtures__vehicles.ts: |
      /**
       * Five vehicles' last hour as the temporal read answers it (shaped like dev's HFP vehicles, times
       * in 2030): three buses of route 550 running east from Rautatientori through two stops, and two of
       * route 4570 running north from the last of them. Every vehicle stands still a minute at each stop
       * and reports every 30 seconds.
       */
      const START = Date.UTC(2030, 9, 7, 6, 0);
      const STEP = 30_000;

      /** The stops, as longitude and latitude: Rautatientori, then 2 km and 4 km east, then 3 km north. */
      export const STOPS = {
        centre: [24.9414, 60.171],
        east2: [24.9773, 60.171],
        east4: [25.0132, 60.171],
        north: [25.0132, 60.198],
      } as const;

      type Position = readonly [number, number];

      /** One run: a minute at each stop, four minutes' ride between, a reading every 30 s. */
      function run(path: Position[], start: number): { t: number; at: Position; speed: number }[] {
        const out: { t: number; at: Position; speed: number }[] = [];
        let t = start;
        path.forEach((stop, i) => {
          for (let k = 0; k < 3; k++, t += STEP) out.push({ t, at: [stop[0] + k * 1e-5, stop[1]], speed: 0 });
          const next = path[i + 1];
          if (!next) return;
          for (let k = 1; k < 8; k++, t += STEP) {
            const share = k / 8;
            out.push({ t, at: [stop[0] + (next[0] - stop[0]) * share, stop[1] + (next[1] - stop[1]) * share], speed: 8 });
          }
        });
        return out;
      }

      function vehicle(id: string, route: string, readings: { t: number; at: Position; speed: number }[]) {
        const iso = (t: number) => new Date(t).toISOString();
        return {
          id: `urn:ngsi-ld:Vehicle:hel.fi:helsinki:${id}`,
          type: "Vehicle",
          location: { type: "GeoProperty", values: readings.map((r) => [{ type: "Point", coordinates: [r.at[0], r.at[1]] }, iso(r.t)]) },
          speed: { type: "Property", values: readings.map((r) => [r.speed, iso(r.t)]) },
          route: { type: "Property", values: readings.map((r) => [route, iso(r.t)]) },
        };
      }

      const EAST: Position[] = [STOPS.centre, STOPS.east2, STOPS.east4];
      const NORTH: Position[] = [STOPS.east4, STOPS.north];

      export const HISTORY = [
        vehicle("12-1001", "550", run(EAST, START)),
        vehicle("12-1002", "550", run(EAST, START + 15 * 60_000)),
        vehicle("12-1003", "550", run(EAST, START + 30 * 60_000)),
        vehicle("12-2001", "4570", run(NORTH, START + 5 * 60_000)),
        vehicle("12-2002", "4570", run(NORTH, START + 25 * 60_000)),
      ];
