          }

          #[test]
          fn hsls_stops_and_lines_are_used_over_the_vehicles_and_name_the_stops() {
              let stop = |id: &str, x: f64, name: &str, code: &str| json!({ "id": id, "lon": east(x), "lat": A.1, "name": name, "code": code });
              let out = answer(json!({
