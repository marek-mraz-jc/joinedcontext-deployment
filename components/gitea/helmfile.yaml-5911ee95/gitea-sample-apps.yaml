    map-worker.ts: |
      // The map's worker, for the built application only. MapLibre looks for its worker beside its own
      // script, and a Vite build has no such file, so the map would never draw; this bundles the worker
      // with the library's shared chunk and hands the library its address. index.html loads it before
      // the application. The Portal's preview builds its own document and inlines the worker instead
      // (the SDK's mapWorkerReady), so it never loads this file.
      import { setWorkerUrl } from "maplibre-gl";
      import mapWorker from "maplibre-gl/dist/maplibre-gl-worker.mjs?worker&url";

      setWorkerUrl(mapWorker);
    migrations__0001_networks_and_reach.sql: |
      -- What the server of transit-reach keeps (T-3349). The reconciler runs this as the schema's owner
      -- at publish; the App itself never runs DDL (ADR-N-044 §2.3). Every statement may run again and
      -- change nothing.

      -- Each version of HSL's stops and lines the server has read: the SHA-256 of the network as it was
      -- read, its file under `networks/{version}.json`, and when the registers were last read and found
      -- the same.
      create table if not exists networks (
          version text primary key check (version ~ '^[0-9a-f]{64}$'),
          stops integer not null check (stops >= 0),
          routes integer not null check (routes >= 0),
          read_at timestamptz not null default now(),
          checked_at timestamptz not null default now()
      );

      -- The area reached from one stop in each band, on one version of the network, and its GeoJSON
      -- under `tiles/{version}/{stop}.geojson`. A newer network drops the older one's rows.
      create table if not exists reach (
          version text not null references networks (version) on delete cascade,
          stop text not null check (length(stop) <= 256),
          bands jsonb not null,
          tile text not null,
          computed_at timestamptz not null default now(),
          primary key (version, stop)
      );
    migrations__0002_roles.sql: |
      -- Roles and edits (T-3826, API/07): a signed-in visitor keeps origins of their own with the areas
      -- reached from them, side by side to compare; a steward publishes a shared set every visitor sees;
      -- every change leaves a row in app_audit. Every statement may run again and change nothing.
      create table if not exists origins (
          id bigserial primary key,
          owner_id text not null,
          name text not null check (length(name) between 1 and 80),
          lon double precision not null check (lon between 24.4 and 25.6),
          lat double precision not null check (lat between 59.9 and 60.5),
          source text not null check (source in ('network', 'derived')),
          -- [{minutes, areaKm2, stops}] for 10, 20 and 30 minutes, as the page's analysis gave them.
          bands jsonb not null check (jsonb_typeof(bands) = 'array'),
          published boolean not null default false,
          created_at timestamptz not null default now()
      );
      create index if not exists origins_owner on origins (owner_id, id desc);
      create index if not exists origins_published on origins (id desc) where published;

      -- jc_app_sdk::access::AUDIT_TABLE
      create table if not exists app_audit (
          id bigserial primary key,
          at timestamptz not null default now(),
          actor_id text not null,
          actor_name text not null,
          action text not null check (action in ('insert', 'update', 'delete', 'edit')),
          target text not null,
          summary text not null check (length(summary) <= 500)
      );
