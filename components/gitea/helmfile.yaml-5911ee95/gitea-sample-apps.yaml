                      { "t": 1, "lon": 24.9, "lat": 60.2 },
                      { "t": 2, "lon": 24.9, "lat": 60.2, "speed": 0, "route": "1" }
                  ]}],
                  "origin": { "lon": A.0, "lat": A.1 }
