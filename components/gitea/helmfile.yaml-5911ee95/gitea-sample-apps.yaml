      import { ServerProblem } from "../server";
      import type { Me } from "../server";
      import type { Lang } from "../i18n";
      import { sweep } from "../testing/sweep";
      import { openHref, Origins } from "./Origins";

      /** Two origins: the viewer's own, and another person's that a steward published. */
      function kept() {
        return [origin(2, "Kamppi", VIEWER.id), origin(1, "Itäkeskus", "u-other", true)];
      }

      function show(me: Me | null, api = memory(me, kept()), lang: Lang = "en") {
        render(
          <AccessProvider api={api}>
            <Origins lang={lang} api={api} />
          </AccessProvider>,
        );
        return api;
      }

      const row = async (name: string) => (await screen.findByRole("rowheader", { name })).closest("tr") as HTMLElement;

      // T-3826: the origins side by side; a viewer changes their own, a steward every one and publishes.
      describe("Origins", () => {
        it("compares the origins' areas side by side, and links each to its view", async () => {
          show(VIEWER);
          const table = await screen.findByRole("table", { name: "Origins side by side" });
          expect(within(table).getAllByRole("columnheader").map((th) => th.textContent)).toEqual(["Origin", "10 min", "20 min", "30 min", "Stops in 30 min", "State", "Actions"]);
          const mine = await row("Kamppi");
          expect(within(mine).getAllByRole("cell").map((td) => td.textContent)).toEqual(["1.5 km²", "6.3 km²", "14.0 km²", "30", "yours", expect.any(String)]);
          expect(within(mine).getByRole("link", { name: "Open: Kamppi" })).toHaveAttribute("href", "?at=24.93000,60.17000&lang=en#reach");
          expect(within(await row("Itäkeskus")).getByText("published")).toBeInTheDocument();
          expect(openHref({ lon: 25.0812345, lat: 60.21 }, "sv")).toBe("?at=25.08123,60.21000&lang=sv#reach");
        });

        it("lets a viewer rename and delete their own, shown at once, and closes another's with the reason", async () => {
          const api = show(VIEWER);
          const mine = await row("Kamppi");
          fireEvent.click(within(mine).getByRole("button", { name: "Rename: Kamppi" }));
          const name = within(mine).getByRole("textbox", { name: "Name" });
          expect(within(mine).getByRole("button", { name: "Save the name" })).toBeDisabled();
          fireEvent.change(name, { target: { value: "  Kamppi centre " } });
          fireEvent.click(within(mine).getByRole("button", { name: "Save the name" }));
          expect(await screen.findByRole("rowheader", { name: "Kamppi centre" })).toBeInTheDocument();
          expect(await screen.findByText("The name is saved: Kamppi centre.")).toBeInTheDocument();
          expect(api.rename).toHaveBeenCalledWith(2, "Kamppi centre");

          // Rename opened and given up: nothing sent.
          const renamed = await row("Kamppi centre");
          fireEvent.click(within(renamed).getByRole("button", { name: "Rename: Kamppi centre" }));
          fireEvent.click(within(renamed).getByRole("button", { name: "Cancel" }));
          expect(api.rename).toHaveBeenCalledTimes(1);

          const other = await row("Itäkeskus");
          for (const button of within(other).getAllByRole("button")) {
            expect(button).toBeDisabled();
          }
          expect(within(other).getByRole("button", { name: "Rename: Itäkeskus" })).toHaveAttribute("title", "Only whoever kept it, or a steward, changes this.");
          expect(within(renamed).getByRole("button", { name: "Publish: Kamppi centre" })).toHaveAttribute("title", "Only a steward publishes origins for everyone.");
          expect(screen.getByText("Only a steward publishes origins for everyone.", { selector: "p" })).toBeInTheDocument();

          fireEvent.click(within(renamed).getByRole("button", { name: "Delete: Kamppi centre" }));
          fireEvent.click(within(renamed).getByRole("button", { name: "Cancel" }));
          fireEvent.click(within(renamed).getByRole("button", { name: "Delete: Kamppi centre" }));
          fireEvent.click(within(renamed).getByRole("button", { name: "Delete for good" }));
          expect(await screen.findByText("Deleted: Kamppi centre.")).toBeInTheDocument();
          expect(screen.queryByRole("rowheader", { name: "Kamppi centre" })).toBeNull();
          expect(api.kept.map((o) => o.name)).toEqual(["Itäkeskus"]);
        });

        it("lets a steward publish and withdraw any origin, and change another's", async () => {
          const api = show(STEWARD);
          expect(await screen.findByText("Everyone's origins; the published ones every visitor sees.")).toBeInTheDocument();
          const viewers = await row("Kamppi");
          expect(within(viewers).getByText("someone else's")).toBeInTheDocument();
          fireEvent.click(within(viewers).getByRole("button", { name: "Publish: Kamppi" }));
          expect(await screen.findByText("Published for everyone: Kamppi.")).toBeInTheDocument();
          expect(within(viewers).getByText("someone else's, published")).toBeInTheDocument();
          fireEvent.click(within(viewers).getByRole("button", { name: "Withdraw: Kamppi" }));
          expect(await screen.findByText("Withdrawn: Kamppi.")).toBeInTheDocument();
          expect(api.publish).toHaveBeenLastCalledWith(2, false);
          fireEvent.click(within(await row("Itäkeskus")).getByRole("button", { name: "Rename: Itäkeskus" }));
          expect(screen.getByRole("form", { name: "Rename: Itäkeskus" })).toBeInTheDocument();
        });

        it("puts a change back and says why when the server refuses it", async () => {
          const api = memory(STEWARD, kept());
          api.publish = vi.fn(async () => {
            throw new ServerProblem(403, "this needs the role steward");
          });
          api.forget = vi.fn(async () => {
            throw new ServerProblem(404, "no such record, or not yours to change");
          });
          api.rename = vi.fn(async () => {
            throw new ServerProblem(400, "a name is 1 to 80 characters, on one line");
          });
          show(STEWARD, api, "fi");
          const east = await row("Itäkeskus");
          fireEvent.click(within(east).getByRole("button", { name: "Peru julkaisu: Itäkeskus" }));
          expect(await screen.findByText("Tunnuksellasi ei ole oikeutta tähän.")).toBeInTheDocument();
          expect(within(east).getByText("toisen, julkaistu")).toBeInTheDocument();

          fireEvent.click(within(east).getByRole("button", { name: "Poista: Itäkeskus" }));
          fireEvent.click(within(east).getByRole("button", { name: "Poista lopullisesti" }));
          expect(await screen.findByText("Sitä ei enää ole, tai se ei ole sinun muutettavissasi.")).toBeInTheDocument();
          expect(await screen.findByRole("rowheader", { name: "Itäkeskus" })).toBeInTheDocument();

          const kamppi = await row("Kamppi");
          fireEvent.click(within(kamppi).getByRole("button", { name: "Nimeä uudelleen: Kamppi" }));
          fireEvent.change(within(kamppi).getByRole("textbox", { name: "Nimi" }), { target: { value: "K" } });
          fireEvent.click(within(kamppi).getByRole("button", { name: "Tallenna nimi" }));
          expect(await screen.findByText("Nimeä ei tallennettu: a name is 1 to 80 characters, on one line")).toBeInTheDocument();
          expect(await screen.findByRole("rowheader", { name: "Kamppi" })).toBeInTheDocument();
        });

        it("shows a signed-out visitor the published origins only, with nothing to change", async () => {
          show(null);
          await row("Itäkeskus");
          expect(screen.queryByRole("rowheader", { name: "Kamppi" })).toBeNull();
          expect(screen.queryByRole("button")).toBeNull();
          expect(screen.getByRole("link", { name: "Open: Itäkeskus" })).toBeInTheDocument();
        });

        it("says when there is none, and in words when the origins cannot be read", async () => {
          show(VIEWER, memory(VIEWER), "sv");
          expect(await screen.findByText("Inga startpunkter ännu. Spara en på sidan Räckvidd.")).toBeInTheDocument();
        });

        it("says why the origins could not be read", async () => {
          const api = memory(VIEWER);
          api.origins = vi.fn(async () => {
            throw new ServerProblem(0, "");
          });
          show(VIEWER, api);
          expect(await screen.findByText("The server could not be reached. Check the connection and try again.")).toBeInTheDocument();
          await waitFor(() => expect(screen.queryByText("No origin yet. Keep one on the Reach page.")).toBeNull());
        });

        for (const [language, me] of [
          ["en", STEWARD],
          ["fi", STEWARD],
          ["sv", STEWARD],
          ["en", VIEWER],
          ["fi", VIEWER],
          ["sv", VIEWER],
        ] as const) {
          it(`answers every control of the table in ${language} for a ${me === STEWARD ? "steward" : "viewer"}`, async () => {
            const api = show(me, memory(me, kept()), language);
            await screen.findByRole("table");
            await sweep(document.body);
            // Each press reached the server or was closed; what is left still reads.
            await waitFor(() => expect(api.origins).toHaveBeenCalled());
          });
        }
      });
    src__pages__Origins.tsx: |
      import { useState } from "react";
      import { Card, Empty, Loading, Page } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { decimal, number, t } from "../i18n";
      import type { Lang, Word } from "../i18n";
      import { changeProblem, useOrigins } from "../origins";
      import type { Origin, ReachApi } from "../server";

      const BANDS = [10, 20, 30];

      /** The view of an origin: its point in the address, the language kept, on the Reach page. */
      export function openHref(origin: Pick<Origin, "lon" | "lat">, lang: Lang): string {
        return `?at=${origin.lon.toFixed(5)},${origin.lat.toFixed(5)}&lang=${lang}#reach`;
      }

      /**
       * The origins side by side (T-3826): the area reached from each in 10, 20 and 30 minutes and the
       * stops within 30. The reader's own, renamed or deleted by them; the published ones a steward
       * chose for everyone; a steward sees and changes every one and publishes or withdraws it.
       */
      export function Origins({ lang, api }: { lang: Lang; api: ReachApi }) {
        const { me, steward } = useAccess();
        const origins = useOrigins(api, me !== undefined);
        const [editing, setEditing] = useState<{ id: number; name: string } | null>(null);
        const [confirming, setConfirming] = useState<number | null>(null);
        const [message, setMessage] = useState<{ text: string; error: boolean } | null>(null);

        const run = async (work: () => Promise<void>, done: string, failed: Word) => {
          setMessage(null);
          try {
            await work();
            setMessage({ text: done, error: false });
          } catch (error) {
            setMessage({ text: changeProblem(lang, error, failed), error: true });
          }
        };
        const area = (origin: Origin, minutes: number) => {
          const band = origin.bands.find((b) => b.minutes === minutes);
          return band ? t(lang, "area", { km2: decimal(lang, band.areaKm2) }) : "–";
        };
        const list = origins.list;

        return (
          <Page label={t(lang, "originsPage")}>
            <Card title={t(lang, "originsTitle")}>
              <p className="app-note">{t(lang, steward ? "originsLeadSteward" : "originsLead")}</p>
              <p role="status" aria-live="polite" className={message?.error ? "app-error" : "app-note"}>
                {message?.text ?? (origins.failed ? changeProblem(lang, origins.failed, "originsFailed") : "")}
              </p>
              {list === null ? (
                <Loading label={t(lang, "originsLoading")} />
              ) : list.length === 0 ? (
                origins.failed ? null : <Empty>{t(lang, "originsEmpty")}</Empty>
              ) : (
                <div className="app-table">
                  <table>
                    <caption className="app-sr">{t(lang, "originsTitle")}</caption>
                    <thead>
                      <tr>
                        <th scope="col">{t(lang, "colName")}</th>
                        {BANDS.map((minutes) => (
                          <th scope="col" key={minutes}>
                            {t(lang, "colMinutes", { minutes: number(lang, minutes) })}
                          </th>
                        ))}
                        <th scope="col">{t(lang, "colStops")}</th>
                        <th scope="col">{t(lang, "colState")}</th>
                        <th scope="col">{t(lang, "colActions")}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {list.map((origin) => {
                        const changeable = origin.mine || steward;
                        const why = changeable ? undefined : t(lang, "notYours");
                        const state = [origin.mine ? t(lang, "stateMine") : steward ? t(lang, "stateOther") : null, origin.published ? t(lang, "statePublished") : null]
                          .filter(Boolean)
                          .join(", ");
                        return (
                          <tr key={origin.id}>
                            <th scope="row">
                              {editing?.id === origin.id ? (
                                <form
                                  className="app-filters"
                                  aria-label={`${t(lang, "rename")}: ${origin.name}`}
                                  onSubmit={(event) => {
                                    event.preventDefault();
                                    const name = editing.name;
                                    setEditing(null);
                                    void run(() => origins.rename(origin.id, name), t(lang, "renamed", { name: name.trim() }), "renameFailed");
                                  }}
                                >
                                  <label>
                                    <span>{t(lang, "saveName")}</span>
                                    <input value={editing.name} maxLength={80} required onChange={(event) => setEditing({ id: origin.id, name: event.target.value })} />
                                  </label>
                                  <button type="submit" className="jc-button" disabled={editing.name.trim() === "" || editing.name.trim() === origin.name}>
                                    {t(lang, "renameSave")}
                                  </button>
                                  <button type="button" className="jc-button" onClick={() => setEditing(null)}>
                                    {t(lang, "cancel")}
                                  </button>
                                </form>
                              ) : (
                                origin.name
                              )}
                            </th>
                            {BANDS.map((minutes) => (
                              <td key={minutes}>{area(origin, minutes)}</td>
                            ))}
                            <td>{number(lang, origin.bands.find((b) => b.minutes === 30)?.stops ?? 0)}</td>
                            <td>{state}</td>
                            <td>
                              <div className="app-actions">
                                <a className="jc-button" href={openHref(origin, lang)} aria-label={`${t(lang, "open")}: ${origin.name}`}>
                                  {t(lang, "open")}
                                </a>
                                {me && (
                                  <>
                                    <button
                                      type="button"
                                      className="jc-button"
                                      disabled={!changeable}
                                      title={why}
                                      aria-label={`${t(lang, "rename")}: ${origin.name}`}
                                      onClick={() => setEditing({ id: origin.id, name: origin.name })}
                                    >
                                      {t(lang, "rename")}
                                    </button>
                                    <button
                                      type="button"
                                      className="jc-button"
                                      disabled={!steward}
                                      title={steward ? undefined : t(lang, "publishOnly")}
                                      aria-label={`${t(lang, origin.published ? "withdraw" : "publish")}: ${origin.name}`}
                                      onClick={() =>
                                        void run(
                                          () => origins.publish(origin.id, !origin.published),
                                          t(lang, origin.published ? "withdrawn" : "published", { name: origin.name }),
                                          "publishFailed",
                                        )
                                      }
                                    >
                                      {t(lang, origin.published ? "withdraw" : "publish")}
                                    </button>
                                    {confirming === origin.id ? (
                                      <>
                                        <button
                                          type="button"
                                          className="jc-button app-danger"
                                          onClick={() => {
                                            setConfirming(null);
                                            void run(() => origins.remove(origin.id), t(lang, "removed", { name: origin.name }), "removeFailed");
                                          }}
                                        >
                                          {t(lang, "confirmRemove")}
                                        </button>
                                        <button type="button" className="jc-button" onClick={() => setConfirming(null)}>
                                          {t(lang, "cancel")}
                                        </button>
                                      </>
                                    ) : (
                                      <button
                                        type="button"
                                        className="jc-button"
                                        disabled={!changeable}
                                        title={why}
                                        aria-label={`${t(lang, "remove")}: ${origin.name}`}
                                        onClick={() => setConfirming(origin.id)}
                                      >
                                        {t(lang, "remove")}
                                      </button>
                                    )}
                                  </>
                                )}
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
              {me && !steward && <p className="app-note">{t(lang, "publishOnly")}</p>}
            </Card>
          </Page>
        );
      }
    src__pages__Reach.tsx: |
      import { useEffect, useMemo, useState } from "react";
      import { Card, Loading, Page, useEntitySelection } from "@joinedcontext/sdk";
      import { useAnalysis } from "../analysis";
      import type { AnalysisOutput, StopOut } from "../analysis";
      import { KeptReach } from "../components/KeptReach";
      import { ReachMap } from "../components/ReachMap";
      import { SaveOrigin } from "../components/SaveOrigin";
      import { useHistory } from "../history";
      import { pointKey, STOP, useNetwork } from "../network";
      import { decimal, moment, number, t } from "../i18n";
      import type { Lang } from "../i18n";
      import { apiBase, reachApi } from "../server";
      import type { ReachApi } from "../server";
      import { reachColours } from "../theme";
      import { CENTRE, HOURS, readView, toVehicles, writeView } from "../vehicles";
      import type { Hours, ViewState } from "../vehicles";

      const BANDS = [10, 20, 30];
      const WAIT = 5;
      /** The reached stops listed by name, nearest first; the map shows them all. */
      const LISTED = 30;

      /** The sentence that answers the page's question before anything is touched. */
      export function summaryOf(lang: Lang, out: AnalysisOutput): string {
        const limit = out.bands[out.bands.length - 1];
        return t(lang, "summary", {
          bands: out.bands
            .map((b) =>
              t(lang, "bandPhrase", {
                minutes: number(lang, b.minutes),
                area: decimal(lang, b.areaKm2),
              }),
            )
            .join(", "),
          limit: number(lang, limit?.minutes ?? 0),
          reached: number(lang, limit?.stops ?? 0),
          all: number(lang, out.stops.length),
        });
      }

      function routesOf(lang: Lang, stop: StopOut): string {
        return stop.routes.length > 0 ? stop.routes.join(", ") : t(lang, "noRoutes");
      }

      /** A stop as a rider knows it: its name and sign code from HSL's register, else its number here. */
      export function stopLabel(lang: Lang, stop: StopOut, index: number): string {
        if (!stop.name)
          return t(lang, "stopOption", {
            n: number(lang, index + 1),
            routes: routesOf(lang, stop),
          });
        return t(lang, "stopNamed", {
          name: stop.code ? `${stop.name} (${stop.code})` : stop.name,
          routes: routesOf(lang, stop),
        });
      }

      /**
       * How far one gets by transit from a point of Helsinki (T-3331, T-3356): one sentence with the area
       * reached in 10, 20 and 30 minutes, the map of it (a click starts from there), the stops reached in
       * time, and what the answer rests on: HSL's stops and lines when the space holds them, else stops
       * derived from where the vehicles stood still. The point and the history's hours are in the
       * address. An HSL stop reached opens in the SDK's entity panel, which links to it in the Portal
       * (SDK-40, AP-140); the city's data is only read. A signed-in visitor keeps the point with its
       * areas, to compare on the Origins page (T-3826).
       */
      export function Reach({ lang, server }: { lang: Lang; server?: ReachApi }) {
        const api = useMemo(() => server ?? reachApi(apiBase()), [server]);
        const [view, setView] = useState<ViewState>(() => readView(window.location.search));
        useEffect(() => {
          try {
            window.history.replaceState(null, "", `${window.location.pathname}${writeView(window.location.search, view)}${window.location.hash}`);
          } catch {
            // A sandboxed preview may refuse; the view still holds on the page.
          }
        }, [view]);

        // HSL's network first; the vehicles' history only when the space holds no network or refuses it.
        const hsl = useNetwork();
        const { network, entities, loading: networkLoading, error: networkError } = hsl;
        const { select } = useEntitySelection();
        const onNetwork = !networkLoading && network.stops.length > 0 && network.routes.length > 0;
        const history = useHistory(view.hours, !networkLoading && !onNetwork);
        const vehicles = useMemo(() => toVehicles(history.history), [history.history]);
        const input = useMemo(() => {
          if (networkLoading) return null;
          if (onNetwork) return { vehicles: [], network, origin: view.at, bands: BANDS, wait: WAIT };
          return history.loading ? null : { vehicles, origin: view.at, bands: BANDS, wait: WAIT };
        }, [networkLoading, onNetwork, network, history.loading, vehicles, view.at]);
        const { output, running, error: failed } = useAnalysis(input);
        const limit = BANDS[BANDS.length - 1];
        const reached = useMemo(
          () =>
            (output?.stops ?? [])
              .map((stop, index) => ({ stop, index }))
              .filter(({ stop }) => stop.minutes !== null)
              .sort((a, b) => (a.stop.minutes ?? 0) - (b.stop.minutes ?? 0)),
          [output],
        );
        // The legend's colours are the map's, for the scheme in force (the page is drawn again per scheme).
        const colours = reachColours();
        const bandColours = [colours.near, colours.mid, colours.far];
        const pickedStop = output?.stops.findIndex((s) => s.lon === view.at.lon && s.lat === view.at.lat) ?? -1;
        // Thousands of HSL stops make no list: the ones reached, nearest first (and the one started
        // from); the few derived stops are all offered.
        const offered =
          output?.source === "network"
            ? reached
                .slice(0, LISTED)
                .concat(
                  pickedStop >= 0 && !reached.slice(0, LISTED).some((r) => r.index === pickedStop) ? [{ stop: output.stops[pickedStop], index: pickedStop }] : [],
                )
            : (output?.stops ?? []).map((stop, index) => ({ stop, index }));

        // The HSL stop the view starts from, when it starts from one: its areas can be kept on the server.
        const startEntity = onNetwork ? entities.get(pointKey(view.at)) : undefined;
        const keptStop = startEntity && output && pickedStop >= 0 ? { id: startEntity, label: stopLabel(lang, output.stops[pickedStop], pickedStop) } : null;

        return (
          <Page label={t(lang, "page")}>
            {networkError && (
              <div className="jc-problem" role="alert">
                <strong>{t(lang, "networkUnreadable", { status: networkError.status })}</strong>
                <button type="button" className="jc-button" onClick={hsl.reload}>
                  {t(lang, "retry")}
                </button>
              </div>
            )}
            {history.error && (
              <div className="jc-problem" role="alert">
                <strong>{t(lang, "historyUnreadable", { status: history.error.status })}</strong>
                <button type="button" className="jc-button" onClick={history.reload}>
                  {t(lang, "retry")}
                </button>
              </div>
            )}
            {failed && (
              <div className="jc-problem" role="alert">
                <strong>{t(lang, "analysisFailed", { reason: failed.message })}</strong>
              </div>
            )}
            {output ? (
              <p className="app-summary" aria-live="polite">
                {summaryOf(lang, output)}
              </p>
            ) : networkLoading || history.loading ? (
              <Loading label={t(lang, "loading")} />
            ) : running ? (
              <Loading label={t(lang, "analysing")} />
            ) : null}
            {output && (
              <p className="app-note">
                {output.source === "network"
                  ? t(lang, "network", {
                      stops: number(lang, network.stops.length),
                      lines: number(lang, network.routes.length),
                      wait: number(lang, WAIT),
                    })
                  : output.readings === 0 || output.first === null || output.last === null
                    ? t(lang, "walkOnly")
                    : t(lang, "derived", {
                        vehicles: number(lang, output.vehicles),
                        from: moment(lang, output.first),
                        to: moment(lang, output.last),
                        wait: number(lang, WAIT),
                      })}
              </p>
            )}

            {onNetwork && <KeptReach lang={lang} api={api} stop={keptStop} />}

            <SaveOrigin
              lang={lang}
              api={api}
              at={view.at}
              stopName={output && pickedStop >= 0 ? output.stops[pickedStop].name || null : null}
              reach={output ? { source: output.source === "network" ? "network" : "derived", bands: output.bands } : null}
            />

            <form className="app-filters" aria-label={t(lang, "controls")} onSubmit={(event) => event.preventDefault()}>
              {output?.source !== "network" && (
                <label>
                  <span>{t(lang, "hours")}</span>
                  <select value={view.hours} onChange={(event) => setView({ ...view, hours: Number(event.target.value) as Hours })}>
                    {HOURS.map((hours) => (
                      <option key={hours} value={hours}>
                        {t(lang, "hoursOption", { n: number(lang, hours) })}
                      </option>
                    ))}
                  </select>
                </label>
              )}
              {output && offered.length > 0 && (
                <label>
                  <span>{t(lang, "startStop")}</span>
                  <select
                    value={pickedStop >= 0 ? String(pickedStop) : ""}
                    onChange={(event) => {
                      const stop = output.stops[Number(event.target.value)];
                      if (stop) setView({ ...view, at: { lon: stop.lon, lat: stop.lat } });
                    }}
                  >
                    <option value="">{t(lang, "pickedPoint")}</option>
                    {offered.map(({ stop, index }) => (
                      <option key={`${stop.lon},${stop.lat}`} value={index}>
                        {stopLabel(lang, stop, index)}
                      </option>
                    ))}
                  </select>
                </label>
              )}
              {(view.at.lon !== CENTRE.lon || view.at.lat !== CENTRE.lat) && (
                <button type="button" className="jc-button" onClick={() => setView({ ...view, at: CENTRE })}>
                  {t(lang, "centre")}
                </button>
              )}
            </form>

            <Card title={t(lang, "map")}>
              <ReachMap
                cells={output?.cells ?? []}
                stops={output?.stops ?? []}
                origin={view.at}
                bands={BANDS}
                label={t(lang, "map")}
                describe={(stop, index) => [
                  stopLabel(lang, stop, index),
                  stop.minutes === null
                    ? t(lang, "stopFar", { limit: number(lang, limit) })
                    : t(lang, "stopReached", {
                        minutes: decimal(lang, stop.minutes),
                      }),
                ]}
                onPick={(at) =>
                  setView((current) => ({
                    ...current,
                    at: {
                      lon: Number(at.lon.toFixed(5)),
                      lat: Number(at.lat.toFixed(5)),
                    },
                  }))
                }
              />
              <ul className="app-legend" aria-label={t(lang, "legend")}>
                {BANDS.map((minutes, i) => (
                  <li key={minutes}>
                    <span className="app-swatch" style={{ background: bandColours[Math.min(i, 2)] }} aria-hidden="true" />
                    {t(lang, "bandLegend", { minutes: number(lang, minutes) })}
                  </li>
                ))}
                <li>
                  <span className="app-swatch app-dot" style={{ background: colours.origin }} aria-hidden="true" />
                  {t(lang, "start")}
                </li>
                <li>
                  <span className="app-swatch app-dot" style={{ background: colours.stop }} aria-hidden="true" />
                  {t(lang, output?.source === "network" ? "stopLegendNetwork" : "stopLegend")}
                </li>
              </ul>
            </Card>

            <Card title={t(lang, "reached", { limit: number(lang, limit) })}>
              {!output ? (
                networkLoading || history.loading ? (
                  <Loading label={t(lang, "loading")} />
                ) : null
              ) : reached.length === 0 ? (
                <p className="app-note">{t(lang, "noReached", { limit: number(lang, limit) })}</p>
              ) : (
                <ol className="app-places" aria-label={t(lang, "reached", { limit: number(lang, limit) })}>
                  {reached.slice(0, LISTED).map(({ stop, index }) => (
                    <li key={index}>
                      <button
                        type="button"
                        className="app-link"
                        aria-label={t(lang, "startFrom", {
                          stop: stopLabel(lang, stop, index),
                        })}
                        onClick={() => setView({ ...view, at: { lon: stop.lon, lat: stop.lat } })}
                      >
                        {stopLabel(lang, stop, index)}
                      </button>
                      <span>
                        {t(lang, "stopReached", {
                          minutes: decimal(lang, stop.minutes ?? 0),
                        })}
                      </span>
                      {entities.has(pointKey(stop)) && (
                        <button
                          type="button"
                          className="jc-button app-details"
                          aria-label={t(lang, "detailsOf", { stop: stopLabel(lang, stop, index) })}
                          onClick={() => select({ id: entities.get(pointKey(stop)) as string, type: STOP })}
                        >
                          {t(lang, "details")}
                        </button>
                      )}
                    </li>
                  ))}
                </ol>
              )}
              {reached.length > LISTED && <p className="app-note">{t(lang, "more", { n: number(lang, reached.length - LISTED) })}</p>}
            </Card>
          </Page>
        );
      }
