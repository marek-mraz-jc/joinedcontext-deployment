apps:
  alerts-desk:
    .gitea__workflows__build.yml: |
      # The build of this application (AP-80, AP-100, AP-101, AP-104, ADR-N-028). The Portal writes this
      # file in the application's first commit and a run never changes it: only a version a reviewer
      # merged runs. It builds the default branch on every push to it, and again when the Portal's
      # Rebuild dispatches it (AP-103).
      #
      # Runs on the installation's `gitea-runner` (label node-22), whose image carries the SDK and the
      # template's packages already installed, so nothing is installed here (AP-82). No step fetches an
      # action: the runner reaches the forge and the Portal API only (AP-81), by the in-cluster
      # addresses it gives every job as JC_FORGE_URL and JC_PORTAL_URL; `gitea.server_url` is the
      # public host, which the runner cannot reach.
      #
      # Two jobs: `build` runs the application's code and holds the job token only; `propose` runs no
      # code of the application and is the only one that sees the lane's secret. The Portal checks the
      # uploaded bundle against the proposed digest and publishes the package itself (AP-104).
      name: build

      on:
        push:
          branches: [main]
        workflow_dispatch:

      jobs:
        # `build` runs in a pod of this App's own (label app-build-node), registered with this
        # repository's token alone and mounting this App's build cache; `propose` stays on the shared
        # runner and mounts no cache (AP-130, AP-131).
        build:
          runs-on: app-build-node
          timeout-minutes: 20
          env:
            JC_BUILD_DIR: ${{ runner.temp }}/jc-build
          outputs:
            digest: ${{ steps.upload.outputs.digest }}
            commit: ${{ steps.upload.outputs.commit }}
            sdk-version: ${{ steps.upload.outputs.sdk-version }}
            built-at: ${{ steps.upload.outputs.built-at }}
          steps:
            # Clones the commit, runs the tests, builds and bundles the functions; the application's
            # own code runs here, with the job token removed from its environment.
            - name: Test and build
              env:
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_APP_COMMIT: ${{ gitea.sha }}
                JC_FORGE_TOKEN: ${{ gitea.token }}
              run: JC_APP_REPO="$JC_FORGE_URL/$JC_REPOSITORY.git" build-app

            # bundle-{commit} and sbom-{commit}, the run's artifacts, for the Portal to check and publish.
            - name: Upload the build
              id: upload
              run: node /opt/template/lane.mjs upload "$JC_BUILD_DIR"

        propose:
          needs: build
          runs-on: node-22
          timeout-minutes: 5
          steps:
            # The one step that sees the lane's secret, and it runs no code of the application (AP-80).
            - name: Propose status.build
              env:
                JC_LANE_TOKEN: ${{ secrets.JC_LANE_TOKEN }}
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_DIGEST: ${{ needs.build.outputs.digest }}
                JC_COMMIT: ${{ needs.build.outputs.commit }}
                JC_SDK_VERSION: ${{ needs.build.outputs.sdk-version }}
                JC_BUILT_AT: ${{ needs.build.outputs.built-at }}
              run: node /opt/template/lane.mjs propose "$JC_REPOSITORY"
    .gitignore: |
      node_modules/
      dist/
      test-results/
      playwright-report/
    README.md: |
      # Alerts desk

      The capital region's traffic alerts (`Alert` of the `helsinki` space, fed by Fintraffic) as one
      table: sort by any column, filter by category, subcategory, free text and end date, export the
      rows shown as CSV or PDF, and open one alert, from its row (click or Enter), in the SDK's entity
      panel (SDK-40). It reads and never writes: the owner's decision (a) on T-3016, after the generated
      version's edit form asked for a write no person in the project holds. So the App's grant stays
      `queryEntity`/`retrieveEntity`, no attribute is edited here, and the panel links to the alert in
      the Portal, where a person with the rights changes it.

      It is the SDK template (`sdk/template/`) with one page, `src/pages/AlertDesk.tsx`, in the SDK's
      `AppShell` (SDK-39); the template's generic pages, map, charts, form and functions are left out
      because the desk uses none of them.

      Checks: `pnpm test` (the page, the template's components), `pnpm typecheck`, and `e2e/` at 375,
      768, 1440 and 2560 px, and an alert in the panel at 375 and 1440 px light and dark, against
      `src/fixtures.ts`, which holds invented alerts, never rows copied from the endpoint. The App is
      under the Apps' coverage gate (T-3373): vitest 95 % (branches 90 %), every control exercised.

      ## Related

      - `apps/helsinki-alerts` — the same alerts on a map, with a steward's record form
      - T-3016 — this application; T-3122 — its validation on dev
    app.yaml: |
      # The capital region's traffic alerts as one sortable, filterable grid (T-3016, owner decision
      # (a) of 2026-09-26): it reads and never writes. Hand written from the SDK template, so no
      # generated-by annotation; it replaces the generated version of 2026-09-22, whose edit form
      # needed a write no person in the project holds (AP-132, PF-70).
      #
      # A React frontend, `ui` with a Vite build. Its source is its own repository on the forge, which
      # the build lane builds at `ref` (AP-75, AP-80); this folder of the portal repository is where CI
      # tests the same tree before it is pushed there (T-2599).
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: alerts-desk
        namespace: helsinki
        title:
          en: "Alerts desk"
          fi: "Tiedotepöytä"
        description:
          en: "Every road work and traffic announcement in the capital region in one table: sort by any column, filter by category, subcategory, text and end date, export what is shown."
          fi: "Pääkaupunkiseudun tietyöt ja liikennetiedotteet yhdessä taulukossa: lajittele minkä tahansa sarakkeen mukaan, suodata luokan, alaluokan, tekstin ja päättymispäivän mukaan, vie näkyvät rivit."
      spec:
        kind: ui
        source:
          git:
            url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_alerts-desk.git
            ref: main
        build:
          node: "22"
        # Everyone in the project opens it: it shows what the city publishes anyway.
        visibility: project
        lifecycle: published
        dataNeeds:
          # The attributes of `Alert` in the `helsinki` model the desk shows; reads only.
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [Alert]
            attrs: [name, description, category, subCategory, address, dateIssued, validFrom, validTo, source]
            operations: [queryEntity, retrieveEntity]
            representations: [ngsi-ld, ogc-features]
    e2e__app.spec.ts: |
      import { expect, test, type Page } from "@playwright/test";
      import { LIVE_BLOCKS, WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { BASE, serve } from "./serve";

      // SDK-12, UI-84 (T-2827): every page the application offers, at a phone, a tablet, a laptop and
      // a wall: no sideways scroll, no two blocks over each other, no control cut off, nothing axe finds
      // at WCAG 2.1 AA, and every page rendered from the fixtures without an error. The build lane runs
      // this on every build, and a red width fails the build.

      /** Waits until the page has read its data and drawn its charts. */
      async function settled(page: Page): Promise<void> {
        await page.waitForLoadState("networkidle");
        await expect(page.locator(".jc-loading")).toHaveCount(0);
        const charts = page.locator(".jc-chart-canvas");
        for (let i = 0; i < (await charts.count()); i++) await expect(charts.nth(i).locator("canvas")).toBeVisible();
      }

      for (const size of WIDTHS) {
        test(`every page at ${size.width} px: no sideways scroll, no overlap, axe clean`, async ({ page }, testInfo) => {
          const served = await serve(page);
          await page.setViewportSize(size);
          await page.goto(BASE);
          await settled(page);
          // The pages are the application's own navigation; one without any is checked as it opens.
          const tabs = page.locator("header nav").first().getByRole("button");
          const count = await tabs.count();
          for (let i = 0; i < Math.max(count, 1); i++) {
            let name = "home";
            if (count > 0) {
              name = (await tabs.nth(i).innerText()).trim() || `page ${i + 1}`;
              await tabs.nth(i).click();
              await settled(page);
            }
            await testInfo.attach(`${name}-${size.width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await page.locator(".jc-problem").allInnerTexts(), `${name}: an error on screen`).toEqual([]);
            expect(await layoutProblems(page, LIVE_BLOCKS), `${name} at ${size.width} px`).toEqual([]);
          }
          expect(served).toEqual({ outside: [], missing: [], problems: [] });
        });
      }

      // T-3376, SDK-40: an alert opened in the SDK's entity panel from its row, at a phone and a laptop,
      // light and dark. The desk writes nothing, so the panel links to the alert in the Portal.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: an alert in the entity panel, linked to the Portal, axe clean`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(BASE);
            await settled(page);
            await page.getByRole("row").filter({ hasText: "Mannerheimintie resurfacing" }).click();
            const panel = page.getByRole("dialog", { name: "Mannerheimintie resurfacing" });
            await expect(panel.getByText("One lane closed northbound.")).toBeVisible();
            await expect(panel.getByRole("link", { name: "Open in the Portal" })).toBeVisible();
            await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
            expect(await layoutProblems(page, LIVE_BLOCKS)).toEqual([]);
            await page.keyboard.press("Escape");
            await expect(page.getByRole("dialog")).toHaveCount(0);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }
    e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { Page } from "@playwright/test";
      import type { FnHandler } from "@joinedcontext/sdk/server";
      import { fakeContext, stubTransport } from "@joinedcontext/sdk/testing";
      import { ROWS } from "../src/fixtures";

      // The built bundle; the build lane points `dist/` at the bundle it just built (T-2827).
      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      export const BASE = "http://app.test/";
      const SLUG = "app";
      // `portal`: where the entity panel links an alert for editing (SDK-40); shown, never followed.
      const CONFIG = { slug: SLUG, orgDomain: "example.org", space: "demo", transport: "origin", appName: "app", portal: "https://portal.example.org/projects/demo" };
      const TYPES: Record<string, string> = { ".html": "text/html", ".js": "text/javascript", ".css": "text/css", ".json": "application/json", ".svg": "image/svg+xml" };
      const FUNCTION = /^\/api\/functions\/([a-z][a-z0-9-]{0,39})$/;

      /** What the served page did that it should not: a host it called, a file it missed, an error it threw. */
      export interface Served {
        outside: string[];
        missing: string[];
        problems: string[];
      }

      /** The application's own function, run on the fixtures the way the functions runtime runs it. */
      async function callFunction(name: string, body: unknown): Promise<{ status: number; body: unknown }> {
        const file = fileURLToPath(new URL(`../functions/${name}.ts`, import.meta.url));
        if (!existsSync(file)) return { status: 404, body: { title: "Not Found", status: 404, detail: `Function ${name} not found` } };
        const handler = (await import(file)).default as FnHandler;
        try {
          const answer = await handler({ method: "POST", query: {}, body, user: null }, fakeContext({ entities: ROWS }));
          return { status: answer.status ?? 200, body: answer.body ?? null };
        } catch (error) {
          return { status: 500, body: { title: "Function failed", status: 500, detail: String(error) } };
        }
      }

      /**
       * Serves the bundle at the root of the App's own host, with `#jc-config` filled as the static
       * host fills it and the SDK's stub answering its endpoint, read-only, from `src/fixtures.ts`.
       * Nothing leaves the page: any other host is refused and reported.
       */
      export async function serve(page: Page): Promise<Served> {
        const transport = stubTransport({
          entities: ROWS,
          access: { permissions: [{ resource: { type: "*" }, actions: ["queryEntity", "retrieveEntity", "queryTemporal", "retrieveTemporal"], attributes: "*" }], prohibitions: [] },
        });
        const served: Served = { outside: [], missing: [], problems: [] };
        page.on("pageerror", (error) => served.problems.push(error.message));

        await page.route("**/*", async (route) => {
          const request = route.request();
          const url = new URL(request.url());
          if (url.origin !== new URL(BASE).origin) {
            served.outside.push(url.href);
            return route.abort();
          }
          const body = request.postData();
          const fn = FUNCTION.exec(url.pathname);
          if (fn && request.method() === "POST") {
            const answer = await callFunction(fn[1], body ? JSON.parse(body) : undefined);
            return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body) });
          }
          if (url.pathname.startsWith(`/api/endpoint/${SLUG}/`)) {
            const answer = await transport({ method: request.method() as "GET", path: url.pathname + url.search, body: body ? JSON.parse(body) : undefined });
            return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body ?? null) });
          }
          const file = normalize(url.pathname.slice(1) || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) {
            served.missing.push(url.pathname);
            return route.fulfill({ status: 404, body: "" });
          }
          let content = readFileSync(join(DIST, file));
          if (file === "index.html") {
            content = Buffer.from(
              content
                .toString("utf8")
                .replace('<script id="jc-config" type="application/json"></script>', `<script id="jc-config" type="application/json">${JSON.stringify(CONFIG)}</script>`),
            );
          }
          return route.fulfill({ status: 200, contentType: TYPES[extname(file)] ?? "application/octet-stream", body: content });
        });
        return served;
      }
