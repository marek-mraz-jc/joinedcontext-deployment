    src__App.tsx: |
      import { useMemo, useState } from "react";
      import { AppShell } from "@joinedcontext/sdk";
      import type { ShellPage } from "@joinedcontext/sdk";
      import { AccessProvider, useAccess } from "./access";
      import { History } from "./components/History";
      import { langOf, LANGS, t } from "./i18n";
      import type { Lang } from "./i18n";
      import { Origins } from "./pages/Origins";
      import { Reach } from "./pages/Reach";
      import { apiBase, reachApi } from "./server";
      import type { ReachApi } from "./server";
      import { useScheme } from "./theme";

      const LANGUAGES = [
        { code: "fi", label: "Suomi" },
        { code: "en", label: "English" },
        { code: "sv", label: "Svenska" },
      ];

      /** Who reads the page, in the shell's header: their role, or that they are signed out. */
      export function RoleBadge({ lang }: { lang: Lang }) {
        const { me, steward } = useAccess();
        if (me === undefined) return null;
        const role = me === null ? t(lang, "signedOut") : t(lang, steward ? "roleSteward" : "roleViewer");
        return (
          <span className="app-role" aria-label={`${t(lang, "roleLabel")}: ${role}`}>
            {role}
          </span>
        );
      }

      function Shell({ api }: { api: ReachApi }) {
        const { me } = useAccess();
        const [lang, setLang] = useState<Lang>(() => langOf(window.location.search, navigator.languages ?? [navigator.language]));
        const switchTo = (next: string) => {
          if (next === lang || !LANGS.includes(next as Lang)) return;
          setLang(next as Lang);
          try {
            const params = new URLSearchParams(window.location.search);
            params.set("lang", next);
            window.history.replaceState(null, "", `${window.location.pathname}?${params}${window.location.hash}`);
          } catch {
            // A sandboxed preview may refuse; the page still switches.
          }
        };
        document.documentElement.lang = lang;
        document.title = t(lang, "title");
        // A new scheme redraws the page, so the map and its legend take their colours again.
        const scheme = useScheme();
        const pages: ShellPage[] = [
          { id: "reach", label: t(lang, "page"), render: () => <Reach key={scheme} lang={lang} server={api} /> },
          { id: "origins", label: t(lang, "originsPage"), render: () => <Origins lang={lang} api={api} /> },
          { id: "history", label: t(lang, "historyPage"), render: () => <History lang={lang} api={api} /> },
        ];
        return (
          <AppShell
            title={t(lang, "title")}
            pages={pages}
            languages={LANGUAGES}
            language={lang}
            onLanguage={switchTo}
            userName={me?.name}
            actions={<RoleBadge lang={lang} />}
          />
        );
      }

      /**
       * How far one gets by transit in Helsinki, in Finnish, English or Swedish, the language kept in the
       * address; a signed-in visitor keeps origins to compare, a steward publishes a shared set (T-3826).
       */
      export default function App({ server }: { server?: ReachApi } = {}) {
        const api = useMemo(() => server ?? reachApi(apiBase()), [server]);
        return (
          <AccessProvider api={api}>
            <Shell api={api} />
          </AccessProvider>
        );
      }
    src__access.tsx: |
      import { createContext, useContext, useEffect, useState } from "react";
      import type { ReactNode } from "react";
      import type { Me } from "./server";

      /** The App role that publishes the shared set and changes any origin (app.yaml). */
      export const STEWARD = "steward";

      export interface Access {
        /** Who is signed in; `null` when signed out, `undefined` while it is asked. */
        me: Me | null | undefined;
        steward: boolean;
      }

      const AccessContext = createContext<Access>({ me: undefined, steward: false });

      /** Who the reader is, asked of the App's server once. What it offers, the server decides again. */
      export function AccessProvider({ api, children }: { api: { me: () => Promise<Me | null> }; children: ReactNode }) {
        const [me, setMe] = useState<Me | null | undefined>(undefined);
        useEffect(() => {
          let current = true;
          api.me().then(
            (who) => current && setMe(who),
            () => current && setMe(null),
          );
          return () => {
            current = false;
          };
        }, [api]);
        const steward = me?.roles.includes(STEWARD) ?? false;
        return <AccessContext.Provider value={{ me, steward }}>{children}</AccessContext.Provider>;
      }

      export function useAccess(): Access {
        return useContext(AccessContext);
      }
    src__analysis.test.ts: |
      import { act, renderHook, waitFor } from "@testing-library/react";
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { createElement } from "react";
      import type { ReactNode } from "react";
      import { AnalyserContext, parseAnswer, useAnalyser, useAnalysis, workerAnalyser } from "./analysis";
      import type { AnalysisInput, AnalysisOutput } from "./analysis";

      const OUTPUT = { source: "derived", vehicles: 0, readings: 0, first: null, last: null, stops: [], rides: 0, routes: [], cells: [], bands: [] } as unknown as AnalysisOutput;
      const INPUT = { vehicles: [], origin: { lon: 24.94, lat: 60.17 }, bands: [10], wait: 5 } as unknown as AnalysisInput;

      /** A worker of the page: what it was sent, and the means to answer as the real one does. */
      class FakeWorker {
        static made: FakeWorker[] = [];
        sent: Array<{ id: number; input: string }> = [];
        onmessage: ((event: MessageEvent) => void) | null = null;
        onerror: ((event: ErrorEvent) => void) | null = null;
        terminated = false;
        constructor() {
          FakeWorker.made.push(this);
        }
        postMessage(message: { id: number; input: string }) {
          this.sent.push(message);
        }
        terminate() {
          this.terminated = true;
        }
        answer(data: unknown) {
          this.onmessage?.({ data } as MessageEvent);
        }
      }

      afterEach(() => {
        FakeWorker.made.length = 0;
        vi.unstubAllGlobals();
      });

      describe("the analyser", () => {
        it("reads an answer, and says the module's own refusal", () => {
          expect(parseAnswer(JSON.stringify(OUTPUT))).toEqual(OUTPUT);
          expect(() => parseAnswer(JSON.stringify({ error: "no vehicles" }))).toThrow("no vehicles");
        });

        it("answers each call by its id from one worker, and starts a new one after it died", async () => {
          vi.stubGlobal("Worker", FakeWorker);
          const analyse = workerAnalyser();
          const first = analyse(INPUT);
          const second = analyse(INPUT);
          const worker = FakeWorker.made[0];
          expect(FakeWorker.made).toHaveLength(1);
          expect(worker.sent.map((m) => m.id)).toEqual([0, 1]);
          worker.answer({ id: 1, answer: JSON.stringify(OUTPUT) });
          worker.answer({ id: 99, answer: "{}" });
          worker.answer({ id: 0, error: "refused" });
          await expect(second).resolves.toEqual(OUTPUT);
          await expect(first).rejects.toThrow("refused");
          const broken = analyse(INPUT);
          worker.answer({ id: 2, answer: "not json" });
          await expect(broken).rejects.toThrow();
          const bad = analyse(INPUT);
          worker.answer({ id: 3, answer: JSON.stringify({ error: "bad point" }) });
          await expect(bad).rejects.toThrow("bad point");
          const lost = analyse(INPUT);
          const unsaid = analyse(INPUT);
          worker.onerror?.({ message: "out of memory" } as ErrorEvent);
          await expect(lost).rejects.toThrow("out of memory");
          await expect(unsaid).rejects.toThrow("out of memory");
          expect(worker.terminated).toBe(true);
          const again = analyse(INPUT);
          expect(FakeWorker.made).toHaveLength(2);
          FakeWorker.made[1].onerror?.({ message: "" } as ErrorEvent);
          await expect(again).rejects.toThrow("the analysis stopped");
        });

        it("uses the page's one worker when no test provides an analyser", () => {
          vi.stubGlobal("Worker", FakeWorker);
          const { result } = renderHook(() => useAnalyser());
          const { result: again } = renderHook(() => useAnalyser());
          expect(result.current).toBe(again.current);
        });

        it("runs again for a new input, drops a late answer, and says a failure", async () => {
          const calls: Array<{ resolve: (o: AnalysisOutput) => void; reject: (e: unknown) => void }> = [];
          const analyse = vi.fn(() => new Promise<AnalysisOutput>((resolve, reject) => calls.push({ resolve, reject })));
          const wrapper = ({ children }: { children: ReactNode }) => createElement(AnalyserContext.Provider, { value: analyse }, children);
          const { result, rerender } = renderHook(({ input }: { input: AnalysisInput | null }) => useAnalysis(input), { wrapper, initialProps: { input: null as AnalysisInput | null } });
          expect(result.current).toEqual({ output: null, running: false, error: null });
          rerender({ input: INPUT });
          expect(result.current.running).toBe(true);
          rerender({ input: { ...INPUT, bands: [20] } as AnalysisInput });
          await act(async () => calls[0].resolve(OUTPUT));
          expect(result.current.output).toBeNull();
          await act(async () => calls[1].reject(new Error("module failed")));
          await waitFor(() => expect(result.current.error?.message).toBe("module failed"));
          rerender({ input: { ...INPUT, bands: [30] } as AnalysisInput });
          await act(async () => calls[2].reject("not an error"));
          await waitFor(() => expect(result.current.error?.message).toBe("not an error"));
          rerender({ input: { ...INPUT, bands: [40] } as AnalysisInput });
          await act(async () => calls[3].resolve(OUTPUT));
          await waitFor(() => expect(result.current.output).toEqual(OUTPUT));
        });
      });
    src__analysis.ts: |
      /**
       * The analysis as the page sees it: what it hands the Rust module and what comes back, and the
       * analyser that runs it in a Web Worker so the page never waits on it (AP-142). A test hands the
       * page an analyser that calls the same module in-process (`AnalyserContext`).
       */
      import { createContext, useContext, useEffect, useState } from "react";

      export interface VehicleInput {
        id: string;
        /** `t` in milliseconds since the epoch; `speed` in metres a second. */
        points: { t: number; lon: number; lat: number; speed?: number; route?: string }[];
      }

      /** HSL's stops and lines (T-3356): a line names its stops by `id`. */
      export interface NetworkInput {
        stops: { id: string; lon: number; lat: number; name?: string; code?: string }[];
        routes: { name: string; mode?: string; stops: string[] }[];
      }

      export interface AnalysisInput {
        vehicles: VehicleInput[];
        /** Used over the vehicles when it holds a stop and a line. */
        network?: NetworkInput;
        origin: { lon: number; lat: number };
        /** The minutes each band ends at; default 10, 20 and 30. */
        bands?: number[];
        /** Minutes waited at each boarding; default 5. */
        wait?: number;
        hexSize?: number;
      }

      export interface StopOut {
        lon: number;
        lat: number;
        /** The name and sign code from HSL's register; `null` for a stop derived from the vehicles. */
        name: string | null;
        code: string | null;
        vehicles: number;
        routes: string[];
        /** When it is reached on foot from the point; `null` beyond the last band. */
        minutes: number | null;
      }

      export interface Cell {
        ring: [number, number][];
        minutes: number;
        band: number;
      }

      export interface Band {
        minutes: number;
        areaKm2: number;
        stops: number;
      }

      export interface AnalysisOutput {
        origin: { lon: number; lat: number };
        /** What the stops and rides came from. */
        source: "network" | "vehicles";
        vehicles: number;
        readings: number;
        first: number | null;
        last: number | null;
        stops: StopOut[];
        rides: number;
        routes: string[];
        cells: Cell[];
        bands: Band[];
      }

      export type Analyser = (input: AnalysisInput) => Promise<AnalysisOutput>;

      /** What the module answers: the output, or `{error}` for input it could not read. */
      export function parseAnswer(text: string): AnalysisOutput {
        const answer = JSON.parse(text) as AnalysisOutput | { error: string };
        if ("error" in answer) throw new Error(answer.error);
        return answer;
      }

      /** The analyser of the browser: one worker for the page, each call answered by its own id. */
      export function workerAnalyser(): Analyser {
        let worker: Worker | null = null;
        let next = 0;
        const waiting = new Map<number, { resolve: (out: AnalysisOutput) => void; reject: (error: Error) => void }>();
        const start = () => {
          worker = new Worker(new URL("./analysis.worker.ts", import.meta.url), { type: "module" });
          worker.onmessage = (event: MessageEvent<{ id: number; answer?: string; error?: string }>) => {
            const call = waiting.get(event.data.id);
            if (!call) return;
            waiting.delete(event.data.id);
            if (event.data.error !== undefined) call.reject(new Error(event.data.error));
            else {
              try {
                call.resolve(parseAnswer(event.data.answer ?? ""));
              } catch (error) {
                call.reject(error instanceof Error ? error : new Error(String(error)));
              }
            }
          };
          worker.onerror = (event) => {
            // A worker that died answers nobody: every waiting call is told, and the next one starts a new worker.
            for (const call of waiting.values()) call.reject(new Error(event.message || "the analysis stopped"));
            waiting.clear();
            worker?.terminate();
            worker = null;
          };
        };
        return (input) =>
          new Promise((resolve, reject) => {
            if (!worker) start();
            const id = next++;
            waiting.set(id, { resolve, reject });
            worker!.postMessage({ id, input: JSON.stringify(input) });
          });
      }

      export const AnalyserContext = createContext<Analyser | null>(null);

      let shared: Analyser | null = null;

      /** The page's analyser: the one a test provides, else the page's one worker. */
      export function useAnalyser(): Analyser {
        const provided = useContext(AnalyserContext);
        if (provided) return provided;
        shared ??= workerAnalyser();
        return shared;
      }

      /**
       * The analysis of an input, run again whenever the input changes; the answer to an older input
       * that arrives late is dropped.
       */
      export function useAnalysis(input: AnalysisInput | null): { output: AnalysisOutput | null; running: boolean; error: Error | null } {
        const analyse = useAnalyser();
        const [state, setState] = useState<{ output: AnalysisOutput | null; running: boolean; error: Error | null }>({
          output: null,
          running: input !== null,
          error: null,
        });
        const key = input === null ? null : JSON.stringify(input);
        // The input is compared by its JSON: a new object with the same vehicles and point is no new run.
        useEffect(() => {
          if (key === null) return;
          let current = true;
          setState((previous) => ({ ...previous, running: true, error: null }));
          analyse(JSON.parse(key) as AnalysisInput).then(
            (output) => current && setState({ output, running: false, error: null }),
            (error: unknown) => current && setState({ output: null, running: false, error: error instanceof Error ? error : new Error(String(error)) }),
          );
          return () => {
            current = false;
          };
        }, [key, analyse]);
        return state;
      }
    src__analysis.worker.ts: |
      // The analysis in its own thread (AP-142): the Rust module compiled to WebAssembly, loaded once
      // from the bundle's own hashed file, answering each call by the id it came with.
      import init, { analyse } from "../wasm/pkg/transit_reach.js";

      const ready = init();

      self.onmessage = async (event: MessageEvent<{ id: number; input: string }>) => {
        const { id, input } = event.data;
        try {
          await ready;
          self.postMessage({ id, answer: analyse(input) });
        } catch (error) {
          self.postMessage({ id, error: error instanceof Error ? error.message : String(error) });
        }
      };
