  transit-reach:
    .gitea__workflows__build.yml: |
      # The build of this application (AP-80, AP-100, AP-101, AP-104, ADR-N-028). The Portal writes this
      # file in the application's first commit and a run never changes it: only a version a reviewer
      # merged runs. It builds the default branch on every push to it, and again when the Portal's
      # Rebuild dispatches it (AP-103).
      #
      # Runs on the installation's `gitea-runner` (label node-22), whose image carries the SDK and the
      # template's packages already installed, so nothing is installed here (AP-82). No step fetches an
      # action: the runner reaches the forge and the Portal API only (AP-81), by the in-cluster
      # addresses it gives every job as JC_FORGE_URL and JC_PORTAL_URL; `gitea.server_url` is the
      # public host, which the runner cannot reach.
      #
      # Two jobs: `build` runs the application's code and holds the job token only; `propose` runs no
      # code of the application and is the only one that sees the lane's secret. The Portal checks the
      # uploaded bundle against the proposed digest and publishes the package itself (AP-104).
      name: build

      on:
        push:
          branches: [main]
        workflow_dispatch:

      jobs:
        # `build` runs in a pod of this App's own (label app-build-rust: Rust to WebAssembly, AP-142), registered with this
        # repository's token alone and mounting this App's build cache; `propose` stays on the shared
        # runner and mounts no cache (AP-130, AP-131).
        build:
          runs-on: app-build-rust
          timeout-minutes: 30
          env:
            JC_BUILD_DIR: ${{ runner.temp }}/jc-build
          outputs:
            digest: ${{ steps.upload.outputs.digest }}
            commit: ${{ steps.upload.outputs.commit }}
            sdk-version: ${{ steps.upload.outputs.sdk-version }}
            built-at: ${{ steps.upload.outputs.built-at }}
          steps:
            # Clones the commit, runs the tests, builds and bundles the functions; the application's
            # own code runs here, with the job token removed from its environment.
            - name: Test and build
              env:
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_APP_COMMIT: ${{ gitea.sha }}
                JC_FORGE_TOKEN: ${{ gitea.token }}
              run: JC_APP_REPO="$JC_FORGE_URL/$JC_REPOSITORY.git" build-app

            # bundle-{commit} and sbom-{commit}, the run's artifacts, for the Portal to check and publish.
            - name: Upload the build
              id: upload
              run: node /opt/template/lane.mjs upload "$JC_BUILD_DIR"

        propose:
          needs: build
          runs-on: node-22
          timeout-minutes: 5
          steps:
            # The one step that sees the lane's secret, and it runs no code of the application (AP-80).
            - name: Propose status.build
              env:
                JC_LANE_TOKEN: ${{ secrets.JC_LANE_TOKEN }}
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_DIGEST: ${{ needs.build.outputs.digest }}
                JC_COMMIT: ${{ needs.build.outputs.commit }}
                JC_SDK_VERSION: ${{ needs.build.outputs.sdk-version }}
                JC_BUILT_AT: ${{ needs.build.outputs.built-at }}
              run: node /opt/template/lane.mjs propose "$JC_REPOSITORY"
    .gitignore: |
      node_modules/
      dist/
      wasm/target/
      wasm/pkg/
      test-results
      playwright-report
    README.md: |
      # How far can I get by transit

      Click anywhere in Helsinki and see the area you reach in 10, 20 and 30 minutes: walking to a stop,
      waiting, riding, changing on foot and walking on.

      - one sentence that answers on arrival, from Rautatientori: the area each band reaches and how
        many stops are within 30 minutes;
      - a map with the area in three colours, the stops and the starting point; a click anywhere starts
        from there;
      - the stops reached, by minutes, each a button that starts from it, and a list to start from any
        stop with the keyboard; an HSL stop also opens in the SDK's entity panel, read only, with a link
        to the Portal (SDK-40, AP-140);
      - the starting point and the hours of vehicle history (1, 3 or 6) in the address, so a view is a
        link (`?at=24.95000,60.20000&hours=6&lang=en`).

      Finnish, English or Swedish (`?lang=fi|en|sv`, else the browser's language), chosen in the
      shell's language menu. Light and dark follow the reader's system. Times are Helsinki's.

      ## What the answer rests on

      HSL's own registers when the space holds them (T-3356): 8389 stops and platforms with their
      names and sign codes, and 1121 line variants with their stops in order. They carry no timetable,
      so a ride between two stops of a line takes the distance (1.2 times the straight line) at the
      mode's usual speed, stops included: metro 40 km/h, commuter train 50, bus 20, tram 15, ferry 18.

      Where the space holds no stops and lines, or refuses them, the App derives them from the vehicles'
      last hours instead:

      - a **stop** is where readings of at least two vehicles stood still (≤ 0.5 m/s, DBSCAN 35 m,
        three readings), so a traffic light two buses waited at counts too;
      - a **ride** is a vehicle's move from one such place to the next on one route, timed by its own
        readings (the median over runs, at most 20 minutes a hop).

      Either way the **trip** is: walking at 4.5 km/h along streets 1.3 times the straight line, a
      5-minute wait at each boarding, changes on foot up to 300 m. Staying aboard costs no second wait.
      The page says which of the two it used, under the answer.

      ## How it is built

      A `wasm` App (AP-142, ADR-N-044): React on the joinedcontext App SDK for the page, inside the SDK's
      `AppShell`, and the analysis in Rust, compiled to WebAssembly and run in a Web Worker in the
      visitor's browser, so a click anywhere answers at once. The static host serves its files, the
      endpoint answers the vehicles' history, and the App's server keeps what is worth keeping (below).

      - `wasm/` is the crate: `network.rs` (stops and rides from HSL's registers), `stops.rs` (stops
        and rides from the readings), `reach.rs` (Dijkstra over
        "on foot at a stop" and "aboard a route at a stop", then the hexagons each walk covers),
        `dbscan.rs` and `geo.rs` (from alerts-heatmap), `lib.rs` (`analyse`: JSON in, JSON out).
      - `src/network.ts` reads the stops and lines, every page (some 8400 stops, past the SDK's `all`).
      - `src/vehicles.ts` joins each vehicle's positions, speeds and routes by time; `src/history.ts`
        reads them through the temporal endpoint, at most six hours (`temporalQ`).
      - HSL's whole network answers in about 100 ms in the module, 0.6 to 1.1 s to the first answer in
        the page; 32 vehicles of 1000 readings each in about 100 ms.

      ## From a stop, on the server

      The App's server is a WebAssembly component on the platform's shared host (`server/`):

      - it reads HSL's stops and lines from the App's own Endpoint, as the page does, and keeps them as
        one file under the App's prefix, `networks/{version}.json`, where the version is the SHA-256 of
        the network as read (the same registers always give the same version); a version read more than
        six hours ago is read again when the page next asks, and a changed network drops the older
        version's areas;
      - **Download the areas from the start stop (GeoJSON)** asks it for the area reached from the stop
        the view starts from, on the kept network: computed once per version with the page's own crate
        (`../wasm`) and kept in the App's schema (`migrations/`) with its hexagons as GeoJSON,
        `tiles/{version}/{stop}.geojson`, downloaded through a URL valid for two minutes. Every visitor
        gets the same answer for the same stop and network. When the server has not read the network
        yet, the page asks it to once and then asks for the areas again.

      | Route | What it does |
      |---|---|
      | `GET /api/network` | the kept network's version, sizes, and whether it is due to be read again |
      | `POST /api/network` | HSL's registers read again; a new version when they changed |
      | `GET /api/reach?stop=` | the areas from a stop in each band; a URL their GeoJSON downloads from |

      ## Origins, roles and history

      The server decides from the signed-in person the platform names (`identity::caller()`, API/07),
      never from anything the page sends:

      - anyone, signed in or not, sees the **published origins** on the **Origins** page;
      - a **viewer** keeps the point the view starts from under a name (**Keep this origin**), with
        the area the browser reached from it in each band. The Origins page sets the kept origins side
        by side: the area in 10, 20 and 30 minutes and the stops within 30. A viewer renames and
        deletes their own; someone else's answers as if it did not exist;
      - a **steward** sees and changes every origin and **publishes** one into the shared set every
        visitor sees, or withdraws it.

      A control the reader's role cannot use stays on screen, disabled, with the reason as its tooltip.
      A rename, a deletion and a publication show at once and go back when the server refuses. Every
      change writes a row into the App's `app_audit` table in the same statement, so a refused or failed
      change leaves none. The **History** page reads that table: a viewer their own rows, a steward
      everyone's.

      | Route | Who | What it does |
      |---|---|---|
      | `GET /api/me` | anyone | the caller's name and roles, `null` when signed out |
      | `GET /api/origins` | anyone | the published origins, the caller's own, a steward's every one |
      | `POST /api/origins` `{name, lon, lat, source, bands}` | signed in | an origin kept, at most 50 a person |
      | `PUT /api/origins/{id}` `{name}` | owner, steward | renamed |
      | `DELETE /api/origins/{id}` | owner, steward | gone |
      | `PUT /api/origins/{id}/published` `{published}` | steward | in or out of the shared set |
      | `GET /api/history` | signed in | the newest 100 changes (a viewer: their own) |

      `server/host-test.json` plays every route on the real host as an anonymous visitor, a viewer,
      another viewer and a steward, and counts the rows after each refused write.

      ## Run the tests

      ```sh
      pnpm install
      pnpm wasm          # cargo build --target wasm32-unknown-unknown, then wasm-bindgen --target web
      (cd wasm && cargo test)
      pnpm test          # vitest, with the compiled module run in-process
      pnpm build
      pnpm e2e           # the built bundle in Chromium: 4 widths, light and dark, fi and en, axe, the panel
      (cd server && cargo test && cargo build --release --target wasm32-wasip2)   # the server component
      ```

      `server/host-test.json` is the server component's scenario on the real host: the portal
      repository's `tests/wasm-apps` (`tests/scenarios.rs`, ci-full) builds the component, runs
      `migrations/` twice as the reconciler does, and plays the scenario against Postgres, RustFS and a
      mock of the App's own Endpoint, with a second App that must see nothing.

      The coverage gate (T-3373): `sh ../../scripts/app-coverage-run.sh transit-reach --rust` holds the
      page at 95 % of lines and 90 % of branches, every control used by a test, and `wasm/` at 95 %
      (`cargo llvm-cov`). `wasm/pkg/` is generated and left out of the page's figure.

      `pnpm wasm` comes first: the tests, the type check and the build import `wasm/pkg/`. The build lane
      runs the same two steps itself (builder/build-wasm.sh) on the app-build-rust runner. It needs the
      `wasm32-unknown-unknown` target and `wasm-bindgen-cli` 0.2.129, the version the crate pins.
    app.yaml: |
      # How far a visitor gets by transit from any point of Helsinki in 10, 20 and 30 minutes (T-3331,
      # T-3356, T-3349). The analysis rides HSL's stops and lines (8389 stops, 1121 line variants), the
      # time of a ride from its distance at the mode's usual speed; where the space holds none, it
      # derives stops from where vehicles stood still in the last hours instead. Then it walks, waits,
      # rides and changes onto a hexagon grid. It runs in the visitor's browser as WebAssembly compiled
      # from the Rust crate in wasm/ (AP-142), answering a click anywhere at once. A server WASM App
      # (`kind: wasm`, ADR-N-044): its component on the shared host (server/) keeps HSL's network by
      # version and, from a stop, the area reached in each band with its GeoJSON, computed once per
      # version and kept in the App's own schema (migrations/) and prefix. A signed-in visitor keeps
      # origins to compare; a steward publishes a shared set (T-3826). Hand written, so no
      # generated-by annotation (AP-35).
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: transit-reach
        namespace: helsinki
        title:
          en: "How far can I get by transit"
          fi: "Kuinka pitkälle pääsen joukkoliikenteellä"
        description:
          en: "Click anywhere in Helsinki: the area you reach within 10, 20 and 30 minutes walking to a stop and riding, from where the city's vehicles actually went in the last hours."
          fi: "Napsauta mitä tahansa kohtaa Helsingissä: alue, jolle pääset 10, 20 ja 30 minuutissa kävellen pysäkille ja matkustaen, sen mukaan mihin kaupungin ajoneuvot viime tunteina kulkivat."
      spec:
        kind: wasm
        source:
          git:
            url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_transit-reach.git
            ref: main
        # The interface is built with Node; the crate in wasm/ with Rust, to wasm32 (AP-142).
        build:
          node: "22"
          rust: "1.90"
        storage:
          sql: { migrations: migrations, quotaMiB: 100 }
          # A network is some 2 MB; each stop's areas a few hundred kilobytes of GeoJSON.
          blob: { quotaMiB: 2048 }
        visibility: public
        lifecycle: published
        # Who keeps and publishes origins (T-3826); the server decides from identity::caller() alone,
        # and the city's data is only read.
        roles:
          - name: viewer
            title: { en: "Viewer", fi: "Katselija" }
            description: "Keeps origins of their own with the areas reached from them, compares them side by side, renames and deletes their own."
          - name: steward
            title: { en: "Steward", fi: "Ylläpitäjä" }
            description: "What a viewer does, and publishes origins into the shared set every visitor sees; changes any origin. Reads the whole history."
        access:
          - role: viewer
            subjects: [{ group: transit-reach-viewer }]
          - role: steward
            subjects: [{ group: transit-reach-steward }]
        dataNeeds:
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [Vehicle]
            # What the Vehicle entities carry on dev (2026-10-08, 32 live vehicles of the HFP pipeline):
            # where, how fast and on which route. Only their history is read, at most the six hours the
            # longest window offers; read only when the space holds no stops and lines.
            attrs: [location, speed, route]
            operations: [retrieveTemporal]
            temporalQ:
              window: PT6H
            representations: [ngsi-ld, ogc-features]
          # HSL's stops and lines (T-3356): where each stop is, its name and sign code; each line's
          # number, mode and stops in order.
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [GtfsStop]
            attrs: [name, stopCode, location]
            operations: [queryEntity]
            representations: [ngsi-ld]
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [PublicTransportRoute]
            attrs: [routeShortName, transportMode, stopSequence]
            operations: [queryEntity]
            representations: [ngsi-ld]
    e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { NETWORK_ROWS } from "../src/fixtures/network";
      import { BASE, STEWARD, VIEWER, serve } from "./serve";

      // T-3331: the page at a phone, a tablet, a laptop and a wall, light and dark, in Finnish and
      // English: the answer on arrival (computed by the WebAssembly module under the static host's CSP),
      // the map, the legend and the stops reached; no sideways scroll, no overlap, nothing axe finds.
      for (const scheme of ["light", "dark"] as const) {
        for (const lang of ["fi", "en"] as const) {
          for (const size of WIDTHS) {
            test(`${scheme} ${lang} at ${size.width} px: answers on arrival, no sideways scroll, no overlap, axe clean`, async ({ page }, testInfo) => {
              await page.emulateMedia({ colorScheme: scheme });
              const { outside, missing, problems } = await serve(page);
              await page.setViewportSize(size);
              await page.goto(`${BASE}?lang=${lang}`);
              const summary = lang === "fi" ? /^Saavutettava alue tästä pisteestä: 10 min .* Pysäkkejä 30 minuutissa: 4\/4\.$/ : /^Reachable from this point: 10 min .* Stops within 30 minutes: 4 of 4\.$/;
              await expect(page.locator(".app-summary")).toHaveText(summary);
              await expect(page.getByTestId("jc-map").locator("canvas")).toHaveCount(1);
              await expect(page.locator(".app-places li")).toHaveCount(4);
              await testInfo.attach(`${scheme}-${lang}-${size.width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
              // Sideways scroll, overlap, cut-off controls and what axe finds at WCAG 2.1 AA.
              expect(await layoutProblems(page)).toEqual([]);
              expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
            });
          }
        }
      }

      test("a click on the map starts from there, and the address keeps the point", async ({ page }) => {
        await serve(page);
        await page.setViewportSize({ width: 1440, height: 900 });
        await page.goto(`${BASE}?lang=en`);
        await expect(page.locator(".app-summary")).toHaveText(/Stops within 30 minutes: 4 of 4\./);
        const map = page.getByTestId("jc-map");
        const box = await map.boundingBox();
        if (!box) throw new Error("the map has no box");
        // Some 20 km east of the centre, past every stop (the notice of a missing basemap sits top left).
        await map.click({ position: { x: box.width - 60, y: box.height / 2 } });
        await expect(page.locator(".app-summary")).not.toHaveText(/Stops within 30 minutes: 4 of 4\./);
        expect(new URL(page.url()).searchParams.get("at")).toMatch(/^2[45]\.\d+,60\.\d+$/);
        await page.getByRole("button", { name: "Back to Rautatientori" }).click();
        await expect(page.locator(".app-summary")).toHaveText(/Stops within 30 minutes: 4 of 4\./);
      });

      test("no vehicle history answers with walking alone", async ({ page }) => {
        await serve(page, []);
        await page.goto(`${BASE}?lang=en`);
        await expect(page.getByText("No vehicle history: the area is walking distance only.")).toBeVisible();
        await expect(page.locator(".app-summary")).toHaveText(/Stops within 30 minutes: 0 of 0\./);
      });

      test("with HSL's stops and lines it rides the network, names the stops and asks for no vehicle history", async ({ page }) => {
        const { outside, missing, problems } = await serve(page, [], NETWORK_ROWS);
        const asked: string[] = [];
        page.on("request", (request) => asked.push(request.url()));
        await page.setViewportSize({ width: 1440, height: 900 });
        await page.goto(`${BASE}?lang=en`);
        await expect(page.locator(".app-summary")).toHaveText(/Stops within 30 minutes: 4 of 4\./);
        await expect(page.getByText(/^Stops and lines from HSL's registers \(4 stops, 2 line variants\)\./)).toBeVisible();
        await expect(page.getByRole("button", { name: "Kaisaniemi (H0012): lines 550, M1: start from here" })).toBeVisible();
        expect(asked.some((url) => url.includes("/temporal/"))).toBe(false);
        expect(await layoutProblems(page)).toEqual([]);
        expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
      });

      // SDK-40, AP-140: a reached HSL stop opens in the entity panel, light and dark: a Portal link, no Edit.
      for (const scheme of ["light", "dark"] as const) {
        for (const size of WIDTHS) {
          test(`${scheme} at ${size.width} px: a reached stop opens in the entity panel, read only, axe clean`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            const { outside, missing, problems } = await serve(page, [], NETWORK_ROWS);
            await page.setViewportSize(size);
            await page.goto(`${BASE}?lang=en`);
            await page.getByRole("button", { name: "Kaisaniemi (H0012): lines 550, M1: details" }).click();
            const panel = page.getByRole("dialog");
            await expect(panel).toBeVisible();
            await expect(panel.getByRole("link", { name: "Open in the Portal" })).toHaveAttribute("href", /^https:\/\/portal\.test\/projects\/helsinki\//);
            await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
            expect(await layoutProblems(page)).toEqual([]);
            await panel.getByRole("button", { name: "Close" }).click();
            await expect(panel).toHaveCount(0);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      // T-3826: a viewer keeps an origin and compares it with the published one; a steward publishes
      // one for everyone; at a phone and a laptop, light and dark.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: a viewer keeps an origin and compares, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page, [], NETWORK_ROWS, VIEWER);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}?lang=en`);
            await expect(page.getByLabel("Your role: Viewer")).toBeVisible();
            await page.getByRole("button", { name: "Kaisaniemi (H0012): lines 550, M1: start from here" }).click();
            await expect(page.getByRole("textbox", { name: "Name" })).toHaveValue("Kaisaniemi");
            await page.getByRole("button", { name: "Keep", exact: true }).click();
            await expect(page.getByText("Kept: Kaisaniemi. Compare it on the Origins page.")).toBeVisible();
            await page.getByRole("button", { name: "Origins" }).click();
            const table = page.getByRole("table", { name: "Origins side by side" });
            await expect(table.getByRole("rowheader")).toHaveText(["Kaisaniemi", "Pasila", "Kamppi"]);
            await expect(table.getByRole("button", { name: "Publish: Kaisaniemi" })).toBeDisabled();
            await testInfo.attach(`origins-viewer-${scheme}-${width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            await page.getByRole("button", { name: "History" }).click();
            await expect(page.getByText("added: kept the origin Kaisaniemi")).toBeVisible();
            expect(await layoutProblems(page)).toEqual([]);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });

          test(`${scheme} at ${width} px: a steward publishes an origin, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page, [], NETWORK_ROWS, STEWARD);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}?lang=en#origins`);
            await expect(page.getByLabel("Your role: Steward")).toBeVisible();
            const table = page.getByRole("table", { name: "Origins side by side" });
            await table.getByRole("button", { name: "Publish: Kamppi" }).click();
            await expect(page.getByText("Published for everyone: Kamppi.")).toBeVisible();
            await expect(table.getByRole("button", { name: "Withdraw: Kamppi" })).toBeVisible();
            await testInfo.attach(`origins-steward-${scheme}-${width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }
    e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { Page } from "@playwright/test";
      import type { Row } from "@joinedcontext/sdk";
      import { stubTransport } from "@joinedcontext/sdk/testing";
      import { HISTORY } from "../src/fixtures/vehicles";

      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      export const BASE = "http://portal.test/";
      const SLUG = "transitreach";
      const CONFIG = { slug: SLUG, orgDomain: "hel.fi", space: "helsinki", transport: "origin", appName: "transit-reach", portal: "https://portal.test/projects/helsinki" };
      // The static host's types (AP-142): a module the browser compiles must come as application/wasm.
      const TYPES: Record<string, string> = {
        ".html": "text/html",
        ".js": "text/javascript",
        ".css": "text/css",
        ".json": "application/json",
        ".svg": "image/svg+xml",
        ".woff2": "font/woff2",
        ".wasm": "application/wasm",
      };

      /** What the served page did that it should not: a host it called, a file it missed, an error it threw. */
      export interface Served {
        outside: string[];
        missing: string[];
        problems: string[];
      }

      /** Who the App's server says is signed in (T-3826): a viewer unless a test names a steward. */
      export const VIEWER = { id: "u-1", name: "Vierailija", roles: ["viewer"] };
      export const STEWARD = { id: "u-2", name: "Ylläpitäjä", roles: ["viewer", "steward"] };
      type Person = { id: string; name: string; roles: string[] };

      const BANDS = [
        { minutes: 10, areaKm2: 1.5, stops: 4 },
        { minutes: 20, areaKm2: 6.2, stops: 12 },
        { minutes: 30, areaKm2: 14, stops: 30 },
      ];

      /** Serves the built bundle at the root of the App's own host, with the SDK's stub answering its endpoint. */
      export async function serve(page: Page, temporal: unknown[] = HISTORY, entities: Row[] = [], me: Person = VIEWER): Promise<Served> {
        const transport = stubTransport({
          entities,
          temporal: temporal as { id: string; type: string }[],
          access: {
            permissions: [
              { resource: { type: "Vehicle" }, actions: ["retrieveTemporal"], attributes: "*" },
              { resource: { type: "GtfsStop" }, actions: ["queryEntity"], attributes: "*" },
              { resource: { type: "PublicTransportRoute" }, actions: ["queryEntity"], attributes: "*" },
            ],
            prohibitions: [],
          },
        });
        const served: Served = { outside: [], missing: [], problems: [] };
        // One origin a steward published, one of the viewer's own; the history of what changes here.
        const origins = [
          { id: 2, name: "Pasila", lon: 24.9334, lat: 60.1986, source: "network", bands: BANDS, published: true, owner: STEWARD.id, createdAt: "2030-10-07T06:00:00Z" },
          { id: 1, name: "Kamppi", lon: 24.9314, lat: 60.1688, source: "network", bands: BANDS, published: false, owner: VIEWER.id, createdAt: "2030-10-07T05:00:00Z" },
        ];
        const history: unknown[] = [];
        page.on("pageerror", (error) => served.problems.push(error.message));
        await page.route("**/*", async (route) => {
          const url = new URL(route.request().url());
          if (url.origin !== "http://portal.test") {
            served.outside.push(url.href);
            return route.abort();
          }
          if (url.pathname.startsWith(`/api/endpoint/${SLUG}/`)) {
            const body = route.request().postData();
            const answer = await transport({ method: route.request().method() as "GET", path: url.pathname + url.search, body: body ? JSON.parse(body) : undefined });
            return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body ?? null) });
          }
          // The App's own server (T-3826), deciding by `me` as the real one does; any other call is missing.
          const api = `/apps/${CONFIG.appName}/api`;
          const method = route.request().method();
          const json = (status: number, body: unknown) => route.fulfill({ status, contentType: "application/json", body: JSON.stringify(body) });
          const steward = me.roles.includes("steward");
          const shown = () =>
            origins.filter((o) => o.published || o.owner === me.id || steward).map(({ owner, ...o }) => ({ ...o, mine: owner === me.id }));
          if (url.pathname === `${api}/me` && method === "GET") return json(200, me);
          if (url.pathname === `${api}/origins` && method === "GET") return json(200, shown());
          if (url.pathname === `${api}/history` && method === "GET") return json(200, history);
          if (url.pathname === `${api}/origins` && method === "POST") {
            const made = { ...(JSON.parse(route.request().postData() ?? "{}") as { name: string }), id: origins.length + 1, published: false, owner: me.id, createdAt: "2030-10-07T07:00:00Z" };
            origins.unshift(made as (typeof origins)[number]);
            history.unshift({ id: history.length + 1, at: "2030-10-07T07:00:00Z", actorName: me.name, action: "insert", target: `origins/${made.id}`, summary: `kept the origin ${made.name}` });
            return json(201, { ...made, mine: true });
          }
          const published = url.pathname.match(new RegExp(`^${api}/origins/(\\d+)/published$`));
          if (published && method === "PUT") {
            if (!steward) return json(403, { detail: "this needs the role steward" });
            const found = origins.find((o) => o.id === Number(published[1]));
            if (!found) return json(404, { detail: "no such record, or not yours to change" });
            found.published = (JSON.parse(route.request().postData() ?? "{}") as { published: boolean }).published;
            history.unshift({ id: history.length + 1, at: "2030-10-07T07:00:00Z", actorName: me.name, action: "update", target: `origins/${found.id}`, summary: "published an origin" });
            return route.fulfill({ status: 204 });
          }
          const file = normalize(url.pathname.slice(1) || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) {
            served.missing.push(url.pathname);
            return route.fulfill({ status: 404, body: "" });
          }
          let body = readFileSync(join(DIST, file));
          if (file === "index.html") {
            body = Buffer.from(
              body.toString("utf8").replace('<script id="jc-config" type="application/json"></script>', `<script id="jc-config" type="application/json">${JSON.stringify(CONFIG)}</script>`),
            );
          }
          // The CSP the static host sends a `ui` App (AP-142): WebAssembly may compile, nothing evals.
          const headers = file === "index.html" ? { "Content-Security-Policy": "script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:" } : undefined;
          return route.fulfill({ status: 200, contentType: TYPES[extname(file)] ?? "application/octet-stream", body, headers });
        });
        return served;
      }
