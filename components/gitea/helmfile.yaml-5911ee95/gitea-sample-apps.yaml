    src__components__ReachMap.tsx: |
      import { useEffect, useMemo, useRef, useState } from "react";
      import { Map as MapLibreMap, Popup } from "maplibre-gl";
      import type { ExpressionSpecification, GeoJSONSource, MapGeoJSONFeature, MapMouseEvent } from "maplibre-gl";
      import { mapWorkerReady, NO_BASEMAP, styleFor, useClient } from "@joinedcontext/sdk";
      import type { Cell, StopOut } from "../analysis";
      import { reachColours } from "../theme";

      /**
       * The area reached on one map (T-3331): each hexagon in its band's colour (`near`, `mid`, `far` of
       * the scheme's `REACH` colours for the first three bands), the derived stops as dots, and the starting
       * point. A click on a stop names it in a popup built of text; a click anywhere else starts from
       * there.
       */
      export function ReachMap({
        cells,
        stops,
        origin,
        bands,
        label,
        describe,
        onPick,
        height = 480,
      }: {
        cells: Cell[];
        stops: StopOut[];
        origin: { lon: number; lat: number };
        /** The bands' minutes, ascending. */
        bands: number[];
        /** What a screen reader calls the map. */
        label: string;
        /** The popup's lines for a stop. */
        describe: (stop: StopOut, index: number) => string[];
        /** Called with the point a person clicks. */
        onPick: (point: { lon: number; lat: number }) => void;
        height?: number;
      }): React.JSX.Element {
        const client = useClient();
        const basemap = client.config.basemap;
        const container = useRef<HTMLDivElement | null>(null);
        const map = useRef<MapLibreMap | null>(null);
        const [ready, setReady] = useState(false);
        const describeRef = useRef(describe);
        describeRef.current = describe;
        const onPickRef = useRef(onPick);
        onPickRef.current = onPick;
        const tokens = useMemo(() => ({ map: reachColours() }), []);
        const lookup = useRef({ stops });
        lookup.current = { stops };

        const cellData = useMemo(
          () => ({
            type: "FeatureCollection" as const,
            features: cells.map((cell, index) => ({
              type: "Feature" as const,
              id: index,
              properties: { index, band: cell.band },
              geometry: { type: "Polygon" as const, coordinates: [cell.ring] },
            })),
          }),
          [cells],
        );
        const stopData = useMemo(
          () => ({
            type: "FeatureCollection" as const,
            features: stops.map((stop, index) => ({
              type: "Feature" as const,
              id: index,
              properties: { index, reached: stop.minutes !== null },
              geometry: { type: "Point" as const, coordinates: [stop.lon, stop.lat] },
            })),
          }),
          [stops],
        );
        const originData = useMemo(
          () => ({ type: "Feature" as const, properties: {}, geometry: { type: "Point" as const, coordinates: [origin.lon, origin.lat] } }),
          [origin],
        );

        useEffect(() => {
          let gone = false;
          let instance: MapLibreMap | null = null;
          void mapWorkerReady().then(() => {
            if (gone || !container.current || map.current) return;
            instance = new MapLibreMap({
              container: container.current,
              style: styleFor(basemap),
              center: [24.94, 60.19],
              zoom: 11,
              canvasContextAttributes: { preserveDrawingBuffer: true },
            });
            map.current = instance;
            // The page lays out after the map is built: the canvas follows its box, not its first size.
            const box = container.current;
            const observer = typeof ResizeObserver === "undefined" ? undefined : new ResizeObserver(() => instance?.resize());
            observer?.observe(box);
            instance.on("remove", () => observer?.disconnect());
            instance.on("error", (event) => console.error("transit-reach: map error", event.error?.message ?? event));
            instance.on("load", () => {
              if (gone || !instance) return;
              const empty = { type: "FeatureCollection" as const, features: [] };
              instance.addSource("cells", { type: "geojson", data: empty });
              instance.addSource("stops", { type: "geojson", data: empty });
              instance.addSource("origin", { type: "geojson", data: empty });
              instance.addLayer({
                id: "cells",
                type: "fill",
                source: "cells",
                paint: { "fill-color": tokens.map.far, "fill-opacity": 0.45, "fill-outline-color": tokens.map.stroke },
              });
              instance.addLayer({
                id: "stops",
                type: "circle",
                source: "stops",
                paint: {
                  "circle-color": tokens.map.stop,
                  "circle-opacity": ["case", ["get", "reached"], 1, 0.4],
                  "circle-stroke-color": tokens.map.stroke,
                  "circle-stroke-width": 1,
                  "circle-radius": 4,
                },
              });
              instance.addLayer({
                id: "origin",
                type: "circle",
                source: "origin",
                paint: { "circle-color": tokens.map.origin, "circle-stroke-color": tokens.map.stroke, "circle-stroke-width": 2, "circle-radius": 8 },
              });
              const popup = (event: MapMouseEvent, lines: string[]) => {
                if (!instance) return;
                const body = document.createElement("div");
                for (const line of lines) {
                  const p = document.createElement("p");
                  p.textContent = line;
                  body.append(p);
                }
                new Popup({ closeButton: true }).setLngLat(event.lngLat).setDOMContent(body).addTo(instance);
              };
              const indexOf = (features: MapGeoJSONFeature[] | undefined) => features?.[0]?.properties?.index;
              instance.on("click", (event) => {
                if (!instance) return;
                const onStop = instance.queryRenderedFeatures(event.point, { layers: ["stops"] });
                const stopIndex = indexOf(onStop);
                if (typeof stopIndex === "number" && lookup.current.stops[stopIndex]) {
                  popup(event, describeRef.current(lookup.current.stops[stopIndex], stopIndex));
                  return;
                }
                // Anywhere else starts from there.
                onPickRef.current({ lon: event.lngLat.lng, lat: event.lngLat.lat });
              });
              setReady(true);
            });
          });
          return () => {
            gone = true;
            instance?.remove();
            map.current = null;
          };
          // The map is built once; its data and colours reach it through the effect below.
        }, [basemap, tokens]);

        useEffect(() => {
          const instance = map.current;
          if (!ready || !instance) return;
          (instance.getSource("cells") as GeoJSONSource | undefined)?.setData(cellData);
          (instance.getSource("stops") as GeoJSONSource | undefined)?.setData(stopData);
          (instance.getSource("origin") as GeoJSONSource | undefined)?.setData(originData);
          // The bands in order, near to far; a fourth or later band takes the far colour.
          const colours = [tokens.map.near, tokens.map.mid, tokens.map.far];
          const steps = [
            "step",
            ["get", "band"],
            colours[0],
            ...bands.slice(0, -1).flatMap((minutes, i) => [minutes + 0.001, colours[Math.min(i + 1, colours.length - 1)]]),
          ] as ExpressionSpecification;
          instance.setPaintProperty("cells", "fill-color", steps);
        }, [ready, cellData, stopData, originData, bands, tokens]);

        // The whole reach in view: the cells' extent, else the starting point.
        useEffect(() => {
          const instance = map.current;
          if (!ready || !instance) return;
          if (cells.length === 0) {
            instance.easeTo({ center: [origin.lon, origin.lat], duration: 0 });
            return;
          }
          const lons = cells.flatMap((cell) => cell.ring.map((p) => p[0]));
          const lats = cells.flatMap((cell) => cell.ring.map((p) => p[1]));
          instance.fitBounds(
            [
              [Math.min(...lons), Math.min(...lats)],
              [Math.max(...lons), Math.max(...lats)],
            ],
            { padding: 24, maxZoom: 14, duration: 0 },
          );
        }, [ready, cells, origin]);

        return (
          <div className="jc-map" style={{ height }}>
            <div className="jc-map-canvas" ref={container} data-testid="jc-map" role="application" aria-label={label} />
            {!basemap && <span className="jc-map-notice">{NO_BASEMAP}</span>}
          </div>
        );
      }
    src__components__SaveOrigin.test.tsx: |
      import { fireEvent, render, screen } from "@testing-library/react";
      import { describe, expect, it, vi } from "vitest";
      import { AccessProvider } from "../access";
      import { BANDS, memory, VIEWER } from "../fixtures/memory";
      import type { Me } from "../server";
      import { ServerProblem } from "../server";
      import { SaveOrigin } from "./SaveOrigin";

      const AT = { lon: 24.93141, lat: 60.16882 };
      const REACH = { source: "network" as const, bands: BANDS };

      function show(me: Me | null, api = memory(me), props: Partial<Parameters<typeof SaveOrigin>[0]> = {}) {
        const view = render(
          <AccessProvider api={api}>
            <SaveOrigin lang="en" api={api} at={AT} stopName={null} reach={REACH} {...props} />
          </AccessProvider>,
        );
        return { api, view };
      }

      // T-3826: a signed-in visitor keeps the point the view starts from, with its areas.
      describe("SaveOrigin", () => {
        it("keeps the point under the name typed, with the areas reached from it", async () => {
          const { api } = show(VIEWER);
          const name = await screen.findByRole("textbox", { name: "Name" });
          expect(name).toHaveValue("Point 60.1688, 24.9314");
          fireEvent.change(name, { target: { value: "  Home  " } });
          fireEvent.click(screen.getByRole("button", { name: "Keep" }));
          expect(await screen.findByText("Kept: Home. Compare it on the Origins page.")).toBeInTheDocument();
          expect(api.keep).toHaveBeenCalledWith({ name: "Home", lon: AT.lon, lat: AT.lat, source: "network", bands: BANDS });
        });

        it("offers the stop's name, and a new start offers its own", async () => {
          const { api, view } = show(VIEWER, memory(VIEWER), { stopName: "Kamppi (H1234)" });
          expect(await screen.findByRole("textbox", { name: "Name" })).toHaveValue("Kamppi (H1234)");
          view.rerender(
            <AccessProvider api={api}>
              <SaveOrigin lang="en" api={api} at={AT} stopName="Kaisaniemi" reach={REACH} />
            </AccessProvider>,
          );
          expect(await screen.findByRole("textbox", { name: "Name" })).toHaveValue("Kaisaniemi");
        });

        it("closes the form with its reason when signed out, and keeps nothing", async () => {
          const { api } = show(null);
          expect(await screen.findByText("Sign in to keep origins.")).toBeInTheDocument();
          const keep = screen.getByRole("button", { name: "Keep" });
          expect(keep).toBeDisabled();
          expect(keep).toHaveAttribute("title", "Sign in to keep origins.");
          expect(screen.getByRole("textbox", { name: "Name" })).toBeDisabled();
          fireEvent.submit(screen.getByRole("form", { name: "Keep this origin" }));
          expect(api.keep).not.toHaveBeenCalled();
        });

        it("waits for the areas before it keeps, and never keeps an empty name", async () => {
          show(VIEWER, memory(VIEWER), { reach: null });
          expect(await screen.findByText("Wait until the area is worked out.")).toBeInTheDocument();
          expect(screen.getByRole("button", { name: "Keep" })).toBeDisabled();
        });

        it("says why the server refused, in the reader's language", async () => {
          const api = memory(VIEWER);
          api.keep = vi.fn(async () => {
            throw new ServerProblem(409, "at most 50 origins are kept; delete one first");
          });
          render(
            <AccessProvider api={api}>
              <SaveOrigin lang="sv" api={api} at={AT} stopName="Kamppi" reach={REACH} />
            </AccessProvider>,
          );
          fireEvent.click(await screen.findByRole("button", { name: "Spara" }));
          expect(await screen.findByText("Inte sparad: at most 50 origins are kept; delete one first")).toBeInTheDocument();
          fireEvent.change(screen.getByRole("textbox", { name: "Namn" }), { target: { value: " " } });
          expect(screen.getByRole("button", { name: "Spara" })).toBeDisabled();
        });
      });
    src__components__SaveOrigin.tsx: |
      import { useEffect, useState } from "react";
      import { Card } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { locale, t } from "../i18n";
      import type { Lang } from "../i18n";
      import { changeProblem } from "../origins";
      import type { KeptBand, ReachApi } from "../server";

      interface Props {
        lang: Lang;
        api: ReachApi;
        /** The point the view starts from. */
        at: { lon: number; lat: number };
        /** The stop it starts from, when it is one: the name offered. */
        stopName: string | null;
        /** The areas reached from it and what they rest on; `null` until they are worked out. */
        reach: { source: "network" | "derived"; bands: KeptBand[] } | null;
      }

      /** Keeps the point the view starts from, with its areas, under a name: the reader's own, compared on the Origins page. */
      export function SaveOrigin({ lang, api, at, stopName, reach }: Props) {
        const { me } = useAccess();
        const degrees = (value: number) => new Intl.NumberFormat(locale(lang), { minimumFractionDigits: 4, maximumFractionDigits: 4 }).format(value);
        const offered = stopName ?? t(lang, "pointName", { lat: degrees(at.lat), lon: degrees(at.lon) });
        const [name, setName] = useState(offered);
        const [busy, setBusy] = useState(false);
        const [message, setMessage] = useState<{ text: string; error: boolean } | null>(null);
        // A new starting point offers its own name.
        useEffect(() => setName(offered), [offered]);

        const why = me === null ? t(lang, "saveSignIn") : !reach ? t(lang, "saveWait") : null;
        const keep = async () => {
          if (why || !reach) return;
          setBusy(true);
          setMessage(null);
          try {
            const kept = await api.keep({ name: name.trim(), lon: at.lon, lat: at.lat, source: reach.source, bands: reach.bands });
            setMessage({ text: t(lang, "saved", { name: kept.name }), error: false });
          } catch (error) {
            setMessage({ text: changeProblem(lang, error, "saveFailed"), error: true });
          } finally {
            setBusy(false);
          }
        };

        return (
          <Card title={t(lang, "saveTitle")}>
            <p className="app-note">{t(lang, "saveHint")}</p>
            <form
              className="app-filters"
              aria-label={t(lang, "saveTitle")}
              onSubmit={(event) => {
                event.preventDefault();
                void keep();
              }}
            >
              <label>
                <span>{t(lang, "saveName")}</span>
                <input value={name} maxLength={80} required onChange={(event) => setName(event.target.value)} disabled={me === null} />
              </label>
              <button type="submit" className="jc-button" disabled={busy || why !== null || name.trim() === ""} title={why ?? undefined}>
                {busy ? t(lang, "saving") : t(lang, "save")}
              </button>
            </form>
            {why && me !== undefined && <p className="app-note">{why}</p>}
            <p role="status" aria-live="polite" className={message?.error ? "app-error" : "app-note"}>
              {message?.text ?? ""}
            </p>
          </Card>
        );
      }
    src__components__components.css: |
      /* The components' classes, over the token variables the SDK sets from design-tokens.json. Phone
         first (T-2777, UI-84): each view works from 375 px up, and widens by the room it is given. */

      /* The page is the app: no margin around the shell, so a framed app has one scrollbar, the frame's. */
      body {
        margin: 0;
      }

      .jc-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: var(--jc-font-body, "Inter", system-ui, -apple-system, "Segoe UI", sans-serif);
        color: var(--jc-color-ink, #0f172a);
        background: var(--jc-color-surface, #ffffff);
        font-size: var(--jc-font-size-md, 0.875rem);
        line-height: 1.5;
      }

      .jc-shell *, .jc-shell *::before, .jc-shell *::after {
        box-sizing: border-box;
      }

      .jc-header {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-header h1 {
        margin: 0;
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
      }

      /* Many pages scroll sideways on a phone rather than pushing the page wider than the screen. */
      .jc-header nav {
        display: flex;
        gap: var(--jc-space-1, 0.25rem);
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .jc-header nav button {
        all: unset;
        flex: none;
        cursor: pointer;
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 2px solid transparent;
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-header nav button[aria-current="page"] {
        color: var(--jc-color-accent, #0f766e);
        border-bottom-color: var(--jc-color-accent, #0f766e);
      }

      .jc-user {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-main {
        flex: 1;
        padding: var(--jc-space-4, 1rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--jc-space-4, 1rem);
        align-content: start;
      }

      .jc-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: var(--jc-space-3, 0.75rem);
      }

      .jc-tile {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-tile-label {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-tile-value {
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-table-wrap {
        container-type: inline-size;
        overflow-x: auto;
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
        background: var(--jc-color-surface, #ffffff);
      }

      .jc-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      .jc-table th {
        position: sticky;
        top: 0;
        background: var(--jc-color-card, #f8fafc);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        font-size: var(--jc-font-size-sm, 0.75rem);
        font-weight: 600;
      }

      .jc-table th button {
        all: unset;
        cursor: pointer;
        font: inherit;
        color: inherit;
        display: inline-flex;
        align-items: center;
        gap: var(--jc-space-1, 0.25rem);
      }

      .jc-table td {
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-table tbody tr:nth-child(even) {
        background: var(--jc-color-card, #f8fafc);
      }

      .jc-table tbody tr[aria-selected="true"] {
        background: color-mix(in srgb, var(--jc-color-accent, #0f766e) 15%, transparent);
      }

      .jc-table tbody tr[tabindex="0"] {
        cursor: pointer;
      }

      .jc-num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .jc-pager {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--jc-space-3, 0.75rem);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        border-top: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-detail {
        padding: var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-detail header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--jc-space-3, 0.75rem);
      }

      .jc-detail header h2 {
        margin: 0;
        font-size: var(--jc-font-size-lg, 1rem);
      }

      .jc-detail dl {
        display: grid;
        grid-template-columns: minmax(0, max-content) minmax(0, 1fr);
        gap: var(--jc-space-2, 0.5rem) var(--jc-space-4, 1rem);
        margin: 0;
      }

      .jc-detail dt {
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-detail dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .jc-filterbar {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: var(--jc-space-3, 0.75rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-filter {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        font-size: var(--jc-font-size-sm, 0.75rem);
      }

      .jc-filter span {
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-count {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        align-self: center;
      }

      .jc-form {
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-3, 0.75rem);
        max-width: 120rem;
      }

      /* One column on a phone, two from 40rem of the form's own width, three from 100rem (a form at
         1800 px and wider). */
      .jc-form-fields {
        display: grid;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }

      @container (width >= 40rem) {
        .jc-form-fields {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @container (width >= 100rem) {
        .jc-form-fields {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .jc-field {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
      }

      .jc-field span {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      /* One input per language of a LanguageProperty, stacked under the field's name. */
      .jc-field .jc-languages {
        display: grid;
        gap: var(--jc-space-1, 0.25rem);
        font-size: inherit;
        color: inherit;
        font-weight: inherit;
      }

      .jc-field-error {
        margin: 0;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-danger, #dc2626);
      }

      /* The form's buttons sit on one line, Save last. Without this the row was two stacked
         full-width buttons, which read as two unrelated actions (T-1060). */
      .jc-form-actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--jc-space-2, 0.5rem);
      }

      .jc-export {
        display: inline-flex;
        gap: var(--jc-space-2, 0.5rem);
      }

      .jc-chart {
        margin: 0;
        padding: var(--jc-space-3, 0.75rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-chart figcaption {
        font-weight: 600;
        margin-bottom: var(--jc-space-2, 0.5rem);
      }

      /* Its height follows its width, within what a screen can show; a `height` prop overrides it. */
      .jc-chart-canvas {
        width: 100%;
        aspect-ratio: 16 / 10;
        min-height: 14rem;
        max-height: 28rem;
      }

      /* The map fills the width; its height follows the window unless a `height` prop sets it. */
      .jc-map {
        height: clamp(18rem, 60vh, 44rem);
        position: relative;
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
        overflow: hidden;
      }

      .jc-map-canvas {
        position: absolute;
        inset: 0;
      }

      .jc-map-notice, .jc-map-count {
        position: absolute;
        z-index: 1;
        padding: var(--jc-space-1, 0.25rem) var(--jc-space-2, 0.5rem);
        border-radius: var(--jc-radius-sm, 4px);
        font-size: var(--jc-font-size-sm, 0.75rem);
        background: var(--jc-color-surface, #ffffff);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-map-notice {
        top: var(--jc-space-2, 0.5rem);
        left: var(--jc-space-2, 0.5rem);
      }

      .jc-map-count {
        bottom: var(--jc-space-2, 0.5rem);
        left: var(--jc-space-2, 0.5rem);
      }

      .jc-loading, .jc-empty {
        padding: var(--jc-space-4, 1rem);
        color: var(--jc-color-muted, #64748b);
        font-size: var(--jc-font-size-md, 0.875rem);
        text-align: center;
      }

      .jc-problem {
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        border-left: 4px solid var(--jc-color-danger, #dc2626);
        background: var(--jc-color-card, #f8fafc);
        border-radius: var(--jc-radius-sm, 4px);
      }

      .jc-problem strong {
        display: block;
        color: var(--jc-color-danger, #dc2626);
      }

      .jc-problem p {
        margin: var(--jc-space-1, 0.25rem) 0 0;
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-shell button, .jc-shell input, .jc-shell select {
        font: inherit;
        border-radius: var(--jc-radius-sm, 4px);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        padding: var(--jc-space-1, 0.25rem) var(--jc-space-2, 0.5rem);
        background: var(--jc-color-surface, #ffffff);
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-shell button {
        cursor: pointer;
      }

      .jc-shell button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .jc-shell button:focus-visible, .jc-shell input:focus-visible, .jc-shell select:focus-visible {
        outline: 2px solid var(--jc-color-accent, #0f766e);
        outline-offset: 1px;
      }

      /* A table narrower than 36rem shows each row as a card of label and value; the header row stays,
         as a line of sort buttons, so sorting still works. */
      @container (width < 36rem) {
        .jc-table,
        .jc-table tbody,
        .jc-table tr,
        .jc-table td {
          display: block;
        }
        .jc-table thead tr {
          display: flex;
          flex-wrap: wrap;
          gap: var(--jc-space-1, 0.25rem);
          padding: var(--jc-space-2, 0.5rem);
          background: var(--jc-color-card, #f8fafc);
          border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        }
        .jc-table thead th {
          position: static;
          padding: 0;
          border: none;
          background: transparent;
        }
        .jc-table thead th button {
          padding: var(--jc-space-1, 0.25rem) var(--jc-space-2, 0.5rem);
          border: 1px solid var(--jc-color-line, #e2e8f0);
          border-radius: var(--jc-radius-sm, 4px);
        }
        .jc-table tbody tr {
          padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
          border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        }
        .jc-table td {
          display: grid;
          grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
          gap: var(--jc-space-2, 0.5rem);
          padding: var(--jc-space-1, 0.25rem) 0;
          border: none;
          text-align: left;
          overflow-wrap: anywhere;
        }
        .jc-table td::before {
          content: attr(data-label);
          color: var(--jc-color-muted, #64748b);
          font-size: var(--jc-font-size-sm, 0.75rem);
          font-weight: 500;
        }
      }

      /* A finger, or a phone's width: every control at least 44 px tall, the map's buttons 44 px square. */
      @media (pointer: coarse), (width < 40rem) {
        .jc-shell :is(button, select, input:not([type="checkbox"], [type="radio"])),
        .jc-header nav button {
          min-height: var(--jc-target, 2.75rem);
        }
        .jc-header nav button {
          display: inline-flex;
          align-items: center;
        }
        .jc-table thead th button {
          display: inline-flex;
          align-items: center;
          min-height: var(--jc-target, 2.75rem);
        }
        .jc-map .maplibregl-ctrl-group button {
          width: var(--jc-target, 2.75rem);
          height: var(--jc-target, 2.75rem);
        }
      }

      @media (max-width: 40rem) {
        .jc-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .jc-header nav {
          width: 100%;
        }
        .jc-detail dl {
          grid-template-columns: minmax(0, 1fr);
        }
        .jc-detail dd {
          margin-bottom: var(--jc-space-2, 0.5rem);
        }
        .jc-filterbar {
          flex-direction: column;
          align-items: stretch;
        }
        .jc-count {
          margin-left: 0;
        }
      }
    src__design-tokens.json: |
      {
        "color": {
          "accent": "#0000bf",
