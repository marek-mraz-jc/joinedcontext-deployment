      import { afterEach, describe, expect, it, vi } from "vitest";
      import { apiBase, keptReach, reachApi, ServerProblem } from "./server";
      import type { KeptReach, ReachApi } from "./server";

      function answer(status: number, body: unknown): Response {
        return new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });
      }

      const KEPT: KeptReach = { version: "v1", stop: "urn:ngsi-ld:GtfsStop:HSL:1", bands: [{ minutes: 10, areaKm2: 1.5, stops: 3 }], cached: false, stale: false, url: "https://store.example/t.geojson" };

      afterEach(() => {
        vi.unstubAllGlobals();
        document.body.innerHTML = "";
      });

      // T-3349: the areas from a stop, kept on the App's own server.
      describe("reachApi", () => {
        it("names the App's own server, never a name that leaves its path", () => {
          document.body.innerHTML = `<script id="jc-config" type="application/json">{"appName":"transit-reach"}</script>`;
          expect(apiBase()).toBe("/apps/transit-reach/api");
          document.body.innerHTML = `<script id="jc-config" type="application/json">{"appName":"a/b"}</script>`;
          expect(apiBase()).toBe("/apps/transit-reach/api");
        });

        it("asks for a stop's areas with its id encoded, and reads a refusal's words", async () => {
          const fetch = vi.fn(async (_url: string, _init?: RequestInit) => answer(200, KEPT)).mockResolvedValueOnce(answer(200, KEPT)).mockResolvedValueOnce(answer(404, { detail: "HSL's network holds no such stop with a place" }));
          vi.stubGlobal("fetch", fetch);
          const api = reachApi("/a");
          await expect(api.reach("urn:ngsi-ld:GtfsStop:HSL:1&x")).resolves.toEqual(KEPT);
          expect(fetch.mock.calls[0][0]).toBe("/a/reach?stop=urn%3Angsi-ld%3AGtfsStop%3AHSL%3A1%26x");
          await expect(api.reach("urn:ngsi-ld:GtfsStop:HSL:9")).rejects.toMatchObject({ status: 404, message: "HSL's network holds no such stop with a place" });
          vi.stubGlobal("fetch", vi.fn().mockRejectedValue(new TypeError("offline")));
          await expect(api.refresh()).rejects.toMatchObject({ status: 0 });
        });
      });

      // T-3826: who is signed in, the origins and the history.
      describe("reachApi, origins", () => {
        it("calls each of the server's paths with its method and body, and reads a 204 as nothing", async () => {
          const fetch = vi.fn(async (_url: string, init?: RequestInit) => (["PUT", "DELETE"].includes(init?.method ?? "") ? new Response(null, { status: 204 }) : answer(200, null)));
          vi.stubGlobal("fetch", fetch);
          const api = reachApi("/a");
          expect(await api.me()).toBeNull();
          await api.origins();
          await api.keep({ name: "Kamppi", lon: 24.93, lat: 60.17, source: "network", bands: [] });
          expect(await api.rename(3, "Home")).toBeUndefined();
          await api.forget(3);
          await api.publish(3, true);
          await api.history();
          expect(fetch.mock.calls.map(([url, init]) => `${init?.method} ${url} ${init?.body ?? ""}`)).toEqual([
            "GET /a/me ",
            "GET /a/origins ",
            'POST /a/origins {"name":"Kamppi","lon":24.93,"lat":60.17,"source":"network","bands":[]}',
            'PUT /a/origins/3 {"name":"Home"}',
            "DELETE /a/origins/3 ",
            'PUT /a/origins/3/published {"published":true}',
            "GET /a/history ",
          ]);
          vi.stubGlobal("fetch", vi.fn(async () => new Response("<html>", { status: 403 })));
          await expect(api.publish(3, false)).rejects.toMatchObject({ status: 403, message: "" });
        });
      });

      describe("keptReach", () => {
        const api = (reach: ReachApi["reach"], refresh: ReachApi["refresh"] = vi.fn(async () => ({ version: "v1", stops: 3, routes: 2, changed: true }))): Pick<ReachApi, "reach" | "refresh"> => ({ reach, refresh });

        it("asks the server to read HSL's network once when it has none, then asks again", async () => {
          const reach = vi.fn<ReachApi["reach"]>().mockRejectedValueOnce(new ServerProblem(409, "not read yet")).mockResolvedValueOnce(KEPT);
          const server = api(reach);
          await expect(keptReach(server, KEPT.stop)).resolves.toEqual(KEPT);
          expect(server.refresh).toHaveBeenCalledTimes(1);
          expect(reach).toHaveBeenCalledTimes(2);
        });

        it("reads a network due again in the background, and passes any other refusal on", async () => {
          const server = api(vi.fn(async () => ({ ...KEPT, stale: true })), vi.fn().mockRejectedValue(new ServerProblem(502, "")));
          await expect(keptReach(server, KEPT.stop)).resolves.toMatchObject({ stale: true });
          expect(server.refresh).toHaveBeenCalledTimes(1);
          const refused = api(vi.fn().mockRejectedValue(new ServerProblem(403, "")));
          await expect(keptReach(refused, KEPT.stop)).rejects.toMatchObject({ status: 403 });
          expect(refused.refresh).not.toHaveBeenCalled();
        });
      });
    src__server.ts: |
      /**
       * The App's server, `/apps/transit-reach/api` (T-3349): HSL's network kept by version, and from a
       * stop the area reached in each band, computed once per version and kept with its GeoJSON, which
       * the browser downloads from the store through a short-lived URL the server hands out. A signed-in
       * visitor keeps origins with their areas to compare; a steward publishes a shared set (T-3826).
       */
      import { ServerProblem } from "./problem";

      export { ServerProblem };

      export interface KeptBand {
        minutes: number;
        areaKm2: number;
        stops: number;
      }

      export interface KeptReach {
        version: string;
        stop: string;
        bands: KeptBand[];
        /** Whether it was computed before, on this version of the network. */
        cached: boolean;
        /** Whether the network is due to be read again. */
        stale: boolean;
        url: string;
      }

      /** The signed-in person as the App's server knows them, `null` when signed out. */
      export interface Me {
        id: string;
        name: string;
        roles: string[];
      }

      /** An origin as the page sends it: a name, the point, and the areas reached from it. */
      export interface NewOrigin {
        name: string;
        lon: number;
        lat: number;
        source: "network" | "derived";
        bands: KeptBand[];
      }

      /** An origin the server keeps: the caller's own, a published one, or (for a steward) anyone's. */
      export interface Origin extends NewOrigin {
        id: number;
        published: boolean;
        mine: boolean;
        createdAt: string;
      }

      /** One change as the history keeps it. */
      export interface HistoryRow {
        id: number;
        at: string;
        actorName: string;
        action: "insert" | "update" | "delete" | "edit";
        target: string;
        summary: string;
      }

      /** Where the server answers: `/apps/{appName}/api`, the App's name from `#jc-config`. */
      export function apiBase(doc: Document = document): string {
        const text = doc.getElementById("jc-config")?.textContent ?? "";
        let name = "";
        try {
          name = String((JSON.parse(text || "{}") as { appName?: unknown }).appName ?? "");
        } catch {
          name = "";
        }
        return `/apps/${name && /^[a-z0-9-]+$/.test(name) ? name : "transit-reach"}/api`;
      }

      async function call<T>(base: string, method: string, path: string, body?: unknown): Promise<T> {
        let answer: Response;
        try {
          answer = await fetch(`${base}${path}`, {
            method,
            credentials: "same-origin",
            headers: body === undefined ? { Accept: "application/json" } : { Accept: "application/json", "Content-Type": "application/json" },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
        } catch {
          throw new ServerProblem(0, "");
        }
        if (!answer.ok) {
          const problem = (await answer.json().catch(() => ({}))) as { detail?: unknown };
          throw new ServerProblem(answer.status, typeof problem.detail === "string" ? problem.detail : "");
        }
        return (answer.status === 204 ? undefined : await answer.json()) as T;
      }

      export function reachApi(base: string) {
        return {
          reach: (stop: string) => call<KeptReach>(base, "GET", `/reach?${new URLSearchParams({ stop }).toString()}`),
          refresh: () => call<{ version: string; stops: number; routes: number; changed: boolean }>(base, "POST", "/network"),
          me: () => call<Me | null>(base, "GET", "/me"),
          origins: () => call<Origin[]>(base, "GET", "/origins"),
          keep: (origin: NewOrigin) => call<Origin>(base, "POST", "/origins", origin),
          rename: (id: number, name: string) => call<void>(base, "PUT", `/origins/${id}`, { name }),
          forget: (id: number) => call<void>(base, "DELETE", `/origins/${id}`),
          publish: (id: number, published: boolean) => call<void>(base, "PUT", `/origins/${id}/published`, { published }),
          history: () => call<HistoryRow[]>(base, "GET", "/history"),
        };
      }

      export type ReachApi = ReturnType<typeof reachApi>;

      /**
       * The kept areas from `stop`: when the server has not read HSL's network yet (409) it is asked to,
       * once, and then for the areas again; a network due to be read again is read in the background.
       */
      export async function keptReach(api: Pick<ReachApi, "reach" | "refresh">, stop: string): Promise<KeptReach> {
        let kept: KeptReach;
        try {
          kept = await api.reach(stop);
        } catch (error) {
          if (!(error instanceof ServerProblem) || error.status !== 409) throw error;
          await api.refresh();
          kept = await api.reach(stop);
        }
        if (kept.stale) api.refresh().catch(() => undefined);
        return kept;
      }
    src__test-analyser.ts: |
      // The analyser of the tests: the same module the worker loads, compiled for the browser, run
      // in-process (jsdom has no Worker). Vite inlines the module's bytes for the test, so no file is
      // read and no network is asked. `pnpm wasm` (or the lane's build-wasm) writes wasm/pkg first.
      import wasm from "../wasm/pkg/transit_reach_bg.wasm?url&inline";
      import { analyse, initSync } from "../wasm/pkg/transit_reach.js";
      import { parseAnswer } from "./analysis";
      import type { Analyser } from "./analysis";

      const base64 = wasm.slice(wasm.indexOf(",") + 1);
      initSync({ module: Uint8Array.from(atob(base64), (c) => c.charCodeAt(0)) });

      export const inProcess: Analyser = async (input) => parseAnswer(analyse(JSON.stringify(input)));
    src__testing__maplibre.ts: |
      /**
       * MapLibre needs WebGL, which jsdom has not: this stands in for it and keeps what the App asked
       * for (the sources and their data, the layers, the handlers, the fitted bounds and the popups),
       * so a test reads what the map would draw and plays a click on it.
       */
      type Handler = (event: unknown) => void;

      export class Map {
        static built: Map[] = [];
        readonly options: Record<string, unknown>;
        readonly layers: Array<Record<string, unknown>> = [];
        readonly sources: Record<string, { data: unknown; setData(data: unknown): void }> = {};
        readonly handlers: Array<{ event: string; layer?: string; handler: Handler }> = [];
        readonly fitted: unknown[] = [];
        readonly eased: unknown[] = [];
        readonly paints: Array<[string, string, unknown]> = [];
        /** What `queryRenderedFeatures` answers: the features under the next click. */
        under: Array<{ properties?: Record<string, unknown> }> = [];
        removed = false;

        constructor(options: Record<string, unknown>) {
          this.options = options;
          Map.built.push(this);
          queueMicrotask(() => this.fire("load", {}));
        }

        on(event: string, layerOrHandler: string | Handler, handler?: Handler): this {
          if (typeof layerOrHandler === "string") this.handlers.push({ event, layer: layerOrHandler, handler: handler as Handler });
          else this.handlers.push({ event, handler: layerOrHandler });
          return this;
        }

        fire(event: string, payload: unknown, layer?: string): void {
          for (const entry of this.handlers) if (entry.event === event && entry.layer === layer) entry.handler(payload);
        }

        addSource(id: string, spec: { data: unknown }): void {
          this.sources[id] = {
            data: spec.data,
            setData(data: unknown) {
              this.data = data;
            },
          };
        }

        getSource(id: string) {
          return this.sources[id];
        }

        addLayer(layer: Record<string, unknown>): void {
          this.layers.push(layer);
        }

        fitBounds(bounds: unknown): void {
          this.fitted.push(bounds);
        }

        easeTo(options: unknown): void {
          this.eased.push(options);
        }

        setPaintProperty(layer: string, property: string, value: unknown): void {
          this.paints.push([layer, property, value]);
        }

        queryRenderedFeatures(): Array<{ properties?: Record<string, unknown> }> {
          return this.under;
        }

        resize(): void {}

        remove(): void {
          this.removed = true;
          this.fire("remove", {});
        }
      }

      export class Popup {
        static opened: Popup[] = [];
        at: [number, number] | null = null;
        content: HTMLElement | null = null;
        setLngLat(at: [number, number]): this {
          this.at = at;
          return this;
        }
        setDOMContent(content: HTMLElement): this {
          this.content = content;
          return this;
        }
        addTo(): this {
          Popup.opened.push(this);
          return this;
        }
      }

      export function setWorkerUrl(): void {}
    src__testing__sweep.ts: |
      import { act, fireEvent } from "@testing-library/react";

      const nameOf = (element: HTMLElement) => element.getAttribute("aria-label") ?? element.textContent ?? "";

      /**
       * Every control under `root` used once, as a reader trying each would: each enabled button and
       * link pressed once by its name (a press may change what is shown, so the next is found anew), then
       * each choice of each list chosen.
       */
      export async function sweep(root: HTMLElement): Promise<void> {
        const pressed = new Set<string>();
        for (;;) {
          const next = [...root.querySelectorAll<HTMLElement>("button, a[href]")].find(
            (control) => !(control as HTMLButtonElement).disabled && !pressed.has(nameOf(control)),
          );
          if (!next) break;
          pressed.add(nameOf(next));
          await act(async () => {
            fireEvent.click(next);
          });
        }
        for (const select of root.querySelectorAll("select")) {
          for (const option of [...select.options].map((o) => o.value)) {
            await act(async () => {
              fireEvent.change(select, { target: { value: option } });
            });
          }
        }
      }
    src__theme.test.ts: |
      import { act, renderHook } from "@testing-library/react";
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { DARK, LIGHT, prefersDark, REACH, reachColours, startTokens, useScheme } from "./theme";

      /** A system that asks for `dark`, and tells its listeners when it changes. */
      function system(dark: boolean) {
        const listeners: Array<() => void> = [];
        const media = {
          matches: dark,
          addEventListener: (_: string, listener: () => void) => listeners.push(listener),
          removeEventListener: vi.fn(),
        };
        vi.stubGlobal("matchMedia", () => media);
        window.matchMedia = (() => media) as unknown as typeof window.matchMedia;
        return {
          media,
          turn(next: boolean) {
            media.matches = next;
            for (const listener of listeners) listener();
          },
        };
      }

      afterEach(() => {
        vi.unstubAllGlobals();
        Reflect.deleteProperty(window, "matchMedia");
      });

      describe("the scheme", () => {
        it("is light without a system to ask, and follows the system's choice", () => {
          Reflect.deleteProperty(window, "matchMedia");
          expect(prefersDark()).toBe(false);
          expect(reachColours()).toBe(REACH.light);
          expect(startTokens()).toBe(LIGHT);
          system(true);
          expect(prefersDark()).toBe(true);
          expect(reachColours()).toBe(REACH.dark);
          expect(startTokens()).toBe(DARK);
        });

        it("changes when the system switches, and stops listening when it is gone", () => {
          const { media, turn } = system(false);
          const { result, unmount } = renderHook(() => useScheme());
          expect(result.current).toBe("light");
          act(() => turn(true));
          expect(result.current).toBe("dark");
          act(() => turn(false));
          expect(result.current).toBe("light");
          unmount();
          expect(media.removeEventListener).toHaveBeenCalled();
        });

        it("keeps light when there is no system to listen to", () => {
          Reflect.deleteProperty(window, "matchMedia");
          const { result } = renderHook(() => useScheme());
          expect(result.current).toBe("light");
        });
      });
    src__theme.ts: |
      /**
       * Light and dark (T-3331, as alerts-heatmap): the SDK sets the tokens it is given and has no dark
       * variant, so the App picks the set the reader's system asks for and applies the other when the
       * system switches. The dark colours keep WCAG AA contrast on their surfaces.
       */
      import { useEffect, useState } from "react";
      import { applyTokens } from "@joinedcontext/sdk";
      import light from "./design-tokens.json";

      export const LIGHT = light;
      export const DARK = {
        ...light,
        color: {
          accent: "#93c5fd",
          ink: "#f1f5f9",
          muted: "#a3b1c6",
          surface: "#0f172a",
          card: "#1e293b",
          line: "#334155",
          danger: "#fca5a5",
          success: "#6ee7b7",
          warning: "#fcd34d",
        },
        map: { point: "#2dd4bf", selected: "#93c5fd", low: "#38bdf8", high: "#fb923c", stroke: "#0f172a" },
      };

      const QUERY = "(prefers-color-scheme: dark)";

      export function prefersDark(): boolean {
        return typeof window !== "undefined" && typeof window.matchMedia === "function" && window.matchMedia(QUERY).matches;
      }

      /**
       * The map's own colours: the bands near to far, the stops, the starting point, the outlines. The
       * SDK keeps only the token keys it knows, so these live here, per scheme.
       */
      export const REACH = {
        light: { near: "#0f766e", mid: "#0284c7", far: "#7c3aed", stop: "#1e293b", origin: "#dc2626", stroke: "#ffffff" },
        dark: { near: "#2dd4bf", mid: "#38bdf8", far: "#c4b5fd", stop: "#f1f5f9", origin: "#fca5a5", stroke: "#0f172a" },
      };

      /** The map's colours for the scheme in force. */
      export function reachColours(): typeof REACH.light {
        return prefersDark() ? REACH.dark : REACH.light;
      }

      /** The tokens to start with. */
      export function startTokens(): typeof LIGHT {
        return prefersDark() ? DARK : LIGHT;
      }

      /** The scheme in force, kept in step with the system; a change applies the other tokens. */
      export function useScheme(): "light" | "dark" {
        const [dark, setDark] = useState(prefersDark);
        useEffect(() => {
          if (typeof window.matchMedia !== "function") return;
          const media = window.matchMedia(QUERY);
          const changed = () => {
            applyTokens(media.matches ? DARK : LIGHT);
            setDark(media.matches);
          };
          media.addEventListener("change", changed);
          return () => media.removeEventListener("change", changed);
        }, []);
        return dark ? "dark" : "light";
      }
    src__vehicles.test.ts: |
      import { describe, expect, it } from "vitest";
      import type { TemporalRow } from "@joinedcontext/sdk";
      import { CENTRE, EMPTY, pointOf, readView, toVehicles, writeView } from "./vehicles";

      describe("the view in the address", () => {
        it("reads a point in the capital region and an offered window, else the defaults", () => {
          expect(readView("")).toEqual(EMPTY);
          expect(readView("?at=24.95,60.2&hours=6&lang=fi")).toEqual({ at: { lon: 24.95, lat: 60.2 }, hours: 6 });
          expect(readView("?at=2.35,48.85&hours=5")).toEqual(EMPTY);
          expect(pointOf("24.9,60.1,3")).toBeNull();
          expect(pointOf("x,60")).toBeNull();
          expect(pointOf(null)).toBeNull();
        });

        it("writes only what differs from the default and keeps the language", () => {
          expect(writeView("?lang=en", EMPTY)).toBe("?lang=en");
          expect(writeView("?lang=en", { at: { lon: 24.95, lat: 60.2 }, hours: 1 })).toBe("?lang=en&at=24.95000%2C60.20000&hours=1");
          expect(writeView("", { at: CENTRE, hours: 3 })).toBe("");
        });
      });

      describe("the readings handed to the module", () => {
        const at = (minute: number) => new Date(Date.UTC(2030, 9, 7, 6, minute)).toISOString();
        const row = (series: TemporalRow["series"]): TemporalRow => ({ id: "v", type: "Vehicle", series });

        it("joins position, speed and route by time, the route in force carried forward", () => {
          const [vehicle] = toVehicles([
            row({
              location: [
                { value: { type: "Point", coordinates: [24.9, 60.2] }, observedAt: at(2) },
                { value: { type: "Point", coordinates: [24.91, 60.2] }, observedAt: at(0) },
                { value: { type: "Point", coordinates: [24.92, 60.2] }, observedAt: at(4) },
              ],
              speed: [
                { value: 0, observedAt: at(0) },
                { value: 7, observedAt: at(2) },
              ],
              route: [
                { value: "550", observedAt: at(1) },
                { value: "560", observedAt: at(4) },
              ],
            }),
          ]);
          expect(vehicle.points).toEqual([
            { t: Date.parse(at(0)), lon: 24.91, lat: 60.2, speed: 0 },
            { t: Date.parse(at(2)), lon: 24.9, lat: 60.2, speed: 7, route: "550" },
            { t: Date.parse(at(4)), lon: 24.92, lat: 60.2, route: "560" },
          ]);
        });

        it("drops what is not a point, and a vehicle with no history is one with no readings", () => {
          const [vehicle, empty] = toVehicles([
            row({
              location: [
                { value: { type: "LineString", coordinates: [[24.9, 60.2]] }, observedAt: at(0) },
                { value: "24.9,60.2", observedAt: at(1) },
                { value: { type: "Point", coordinates: [24.9, 60.2] }, observedAt: "never" },
              ],
            }),
            row({}),
          ]);
          expect(vehicle.points).toEqual([]);
          expect(empty).toEqual({ id: "v", points: [] });
        });
      });
    src__vehicles.ts: |
      /**
       * The vehicles as the page reads them: their positions, speeds and routes over the last hours from
       * the temporal read, and the view in the address (`?at=24.9414,60.1710&hours=3`).
       */
      import type { TemporalPoint, TemporalRow } from "@joinedcontext/sdk";
      import type { VehicleInput } from "./analysis";

      export const VEHICLE = "Vehicle";
      /** What the Vehicle entities carry on dev (2026-10-08): where, how fast, on which route. */
      export const ATTRS = ["location", "speed", "route"];
      /** The history windows offered, in hours; the App's grant reads at most the longest (temporalQ PT6H). */
      export const HOURS = [1, 3, 6] as const;
      export type Hours = (typeof HOURS)[number];
      export const DEFAULT_HOURS: Hours = 3;
      /** The most instances the temporal read asks for per vehicle. */
      export const LAST_N = 1000;
      /** Where the page starts: the Central Railway Station's square, Rautatientori. */
      export const CENTRE = { lon: 24.9414, lat: 60.171 };

      export interface ViewState {
        at: { lon: number; lat: number };
        hours: Hours;
      }

      export const EMPTY: ViewState = { at: CENTRE, hours: DEFAULT_HOURS };

      /** A point in the capital region from `lon,lat`, or `null`. */
      export function pointOf(text: string | null): { lon: number; lat: number } | null {
        const [lon, lat, ...rest] = (text ?? "").split(",").map((part) => Number(part.trim()));
        if (rest.length > 0 || !Number.isFinite(lon) || !Number.isFinite(lat)) return null;
        // The capital region and a margin: a point elsewhere has no transit here to reach with.
        return lon >= 24 && lon <= 26 && lat >= 59.9 && lat <= 60.6 ? { lon, lat } : null;
      }

      export function readView(search: string): ViewState {
        const params = new URLSearchParams(search);
        const hours = Number(params.get("hours"));
        return {
          at: pointOf(params.get("at")) ?? CENTRE,
          hours: (HOURS as readonly number[]).includes(hours) ? (hours as Hours) : DEFAULT_HOURS,
        };
      }

      /** The address for a view, every other parameter (the language) kept; defaults are left out. */
      export function writeView(search: string, view: ViewState): string {
        const params = new URLSearchParams(search);
        params.delete("at");
        params.delete("hours");
        if (view.at.lon !== CENTRE.lon || view.at.lat !== CENTRE.lat) params.set("at", `${view.at.lon.toFixed(5)},${view.at.lat.toFixed(5)}`);
        if (view.hours !== DEFAULT_HOURS) params.set("hours", String(view.hours));
        const text = params.toString();
        return text ? `?${text}` : "";
      }

      const timeOf = (point: TemporalPoint) => Date.parse(point.observedAt);

      /**
       * Each vehicle's readings: a position with its time, the speed read at that time, and the route the
       * vehicle last named at or before it (a route is re-sent with every update, but need not be).
       */
      export function toVehicles(history: TemporalRow[]): VehicleInput[] {
        return history.map((row) => {
          const speeds = new Map<number, number>();
          for (const point of row.series.speed ?? []) {
            if (typeof point.value === "number") speeds.set(timeOf(point), point.value);
          }
          const routes = (row.series.route ?? [])
            .map((point) => ({ t: timeOf(point), route: point.value === null ? "" : String(point.value) }))
            .filter((r) => Number.isFinite(r.t))
            .sort((a, b) => a.t - b.t);
          const located = (row.series.location ?? [])
            .map((point) => ({ t: timeOf(point), geo: point.value }))
            .filter(({ t }) => Number.isFinite(t))
            .sort((a, b) => a.t - b.t);
          const points = [];
          let next = 0;
          let route = "";
          for (const { t, geo } of located) {
            // Both lists in time order: the route in force is the last one named at or before t.
            while (next < routes.length && routes[next].t <= t) route = routes[next++].route;
            if (geo === null || typeof geo !== "object" || geo.type !== "Point" || !Array.isArray(geo.coordinates)) continue;
            const [lon, lat] = geo.coordinates as unknown[];
            if (typeof lon !== "number" || typeof lat !== "number") continue;
            const speed = speeds.get(t);
            points.push({ t, lon, lat, ...(speed !== undefined ? { speed } : {}), ...(route ? { route } : {}) });
          }
          return { id: row.id, points };
        });
      }
    src__wasm.test.ts: |
      import { describe, expect, it } from "vitest";
      import type { TemporalRow } from "@joinedcontext/sdk";
      import { parseAnswer } from "./analysis";
      import { HISTORY, STOPS } from "./fixtures/vehicles";
      import { CENTRE, toVehicles } from "./vehicles";
      import { inProcess } from "./test-analyser";

      /** The fixture's temporal bodies as the SDK reads them. */
      const rows: TemporalRow[] = HISTORY.map((h) => ({
        id: h.id,
        type: h.type,
        series: {
          location: h.location.values.map(([value, observedAt]) => ({ value: value as { type: string; coordinates: unknown }, observedAt: String(observedAt) })),
          speed: h.speed.values.map(([value, observedAt]) => ({ value: value as number, observedAt: String(observedAt) })),
          route: h.route.values.map(([value, observedAt]) => ({ value: value as string, observedAt: String(observedAt) })),
        },
      }));

      // The page and the compiled module agree on the shape they exchange (AP-142).
      describe("the compiled reach", () => {
        it("derives the four stops and the rides, and rides east and changes north within the bands", async () => {
          const out = await inProcess({ vehicles: toVehicles(rows), origin: CENTRE });
          expect(out.vehicles).toBe(5);
          expect(out.stops).toHaveLength(4);
          expect(out.routes).toEqual(["4570", "550"]);
          // Rautatientori is where we stand; 2 km east is a wait and a ride away, 4 km east a ride
          // further, north a change and another ride.
          const near = (stop: { lon: number; lat: number }, at: readonly [number, number]) => Math.abs(stop.lon - at[0]) < 0.001 && Math.abs(stop.lat - at[1]) < 0.001;
          const minutes = (at: readonly [number, number]) => out.stops.find((s) => near(s, at))?.minutes;
          // 5 min wait, 4 min rides; the change at 4 km east waits again.
          expect(minutes(STOPS.centre)).toBe(0);
          expect(minutes(STOPS.east2)).toBe(9);
          expect(minutes(STOPS.east4)).toBe(13);
          expect(minutes(STOPS.north)).toBe(22);
          expect(out.bands.map((b) => b.stops)).toEqual([2, 3, 4]);
          expect(out.bands.map((b) => b.minutes)).toEqual([10, 20, 30]);
          expect(out.bands[0].areaKm2).toBeLessThan(out.bands[2].areaKm2);
        });

        it("answers walking alone with no vehicles", async () => {
          const out = await inProcess({ vehicles: [], origin: CENTRE });
          expect(out.stops).toEqual([]);
          expect(out.bands[2].areaKm2).toBeGreaterThan(5);
        });

        it("answers an error for what it cannot read, and the page throws it", async () => {
          await expect(inProcess({ vehicles: [], origin: { lon: 500, lat: 0 } })).rejects.toThrow("not on the globe");
          expect(() => parseAnswer(JSON.stringify({ error: "x" }))).toThrow("x");
        });
      });
