          fireEvent.click(within(row).getByRole("button", { name: /^Delete:/ }));
          fireEvent.click(screen.getByRole("button", { name: "Cancel" }));
          expect(screen.queryByRole("button", { name: "Delete for good" })).not.toBeInTheDocument();
          expect(within(row).getByRole("button", { name: /^Delete:/ })).toBeInTheDocument();
          expect(api.remove).not.toHaveBeenCalled();
          expect(api.saved).toHaveLength(1);
        });

        it("says in the operator's language why the server refused", async () => {
          const api = memory();
          api.save = vi.fn(async () => {
            throw new ServerProblem(400, "the van carries 1 to 200 bikes");
          });
          render(<SavedPlans lang="fi" api={api} current={CURRENT} onOpen={vi.fn()} />);
          fireEvent.change(await screen.findByLabelText("Auto tai tiimi"), { target: { value: "Auto 1" } });
          fireEvent.click(screen.getByRole("button", { name: "Tallenna suunnitelma" }));
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent("Ei tallennettu: the van carries 1 to 200 bikes"));
        });

        it("maps every refusal to words a person can act on", () => {
          expect(problemText("en", new ServerProblem(0, ""), "saveFailed")).toMatch(/could not be reached/);
          expect(problemText("en", new ServerProblem(401, ""), "saveFailed")).toMatch(/Sign in again/);
          expect(problemText("en", new ServerProblem(403, ""), "saveFailed")).toMatch(/may not do this/);
          expect(problemText("en", new ServerProblem(404, ""), "openFailed")).toMatch(/no longer there/);
          expect(problemText("en", new ServerProblem(507, ""), "saveFailed")).toMatch(/storage is full/);
          expect(problemText("en", new ServerProblem(502, ""), "saveFailed")).toMatch(/did not answer/);
          expect(problemText("en", new Error("x"), "saveFailed")).toMatch(/did not answer/);
        });

        it("hands a plan to another van at once for a steward, and says who now has it", async () => {
          const api = memory(STEWARD);
          await api.save({ ...CURRENT, operator: "Van 2" });
          renderAs(STEWARD, api);
          const row = (await screen.findByText(/^Van 2 ·/)).closest("li") as HTMLElement;
          fireEvent.click(await within(row).findByRole("button", { name: /^Hand over:/ }));
          const form = screen.getByRole("form", { name: "Hand over: Van 2" });
          fireEvent.change(within(form).getByLabelText("New van or crew"), { target: { value: " Van 7 " } });
          fireEvent.click(within(form).getByRole("button", { name: "Hand over" }));
          expect(await screen.findByText(/^Van 7 ·/)).toBeInTheDocument();
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent("The plan is handed to Van 7."));
          expect(api.handOver).toHaveBeenCalledWith(1, "Van 7");
          expect(api.saved[0].operator).toBe("Van 7");
        });

        it("puts the van back and says why when the server refuses the hand-over", async () => {
          const api = memory(STEWARD);
          await api.save({ ...CURRENT, operator: "Van 2" });
          api.handOver = vi.fn(async () => {
            throw new ServerProblem(403, "this needs the role steward");
          });
          renderAs(STEWARD, api);
          const row = (await screen.findByText(/^Van 2 ·/)).closest("li") as HTMLElement;
          fireEvent.click(await within(row).findByRole("button", { name: /^Hand over:/ }));
          fireEvent.change(screen.getByLabelText("New van or crew"), { target: { value: "Van 7" } });
          fireEvent.click(screen.getByRole("button", { name: "Hand over" }));
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent("Your account may not do this."));
          expect(screen.getByText(/^Van 2 ·/)).toBeInTheDocument();
          expect(screen.queryByText(/^Van 7 ·/)).toBeNull();
          fireEvent.click(screen.getByRole("button", { name: "Cancel" }));
          expect(screen.queryByLabelText("New van or crew")).toBeNull();
        });

        it("marks a plan someone else saved, which a steward sees beside their own", async () => {
          const api = memory(STEWARD);
          await api.save({ ...CURRENT, operator: "Van 2" });
          api.saved[0].owner = "u-other";
          renderAs(STEWARD, api);
          expect(await screen.findByText(/saved by someone else/)).toBeInTheDocument();
        });

        it("closes the hand-over to a viewer and says who may", async () => {
          const api = memory();
          await api.save({ ...CURRENT, operator: "Van 2" });
          renderAs({ id: "u-viewer", name: "V", roles: ["viewer"] }, api);
          const row = (await screen.findByText(/^Van 2 ·/)).closest("li") as HTMLElement;
          const hand = within(row).getByRole("button", { name: /^Hand over:/ });
          expect(hand).toBeDisabled();
          expect(hand).toHaveAttribute("title", "Only a steward hands a plan to another van or crew.");
          expect(hand).toHaveAccessibleDescription("Only a steward hands a plan to another van or crew.");
        });

        it("offers no save to a reader who is signed out, and says why", async () => {
          const api = memory(null);
          renderAs(null, api);
          fireEvent.change(await screen.findByLabelText("Van or crew"), { target: { value: "Van 2" } });
          const save = screen.getByRole("button", { name: "Save this plan" });
          await waitFor(() => expect(save).toHaveAccessibleDescription("Sign in to save plans."));
          expect(save).toBeDisabled();
          fireEvent.submit(save.closest("form") as HTMLFormElement);
          expect(api.save).not.toHaveBeenCalled();
        });
      });

      function renderAs(me: Me | null, api: ReturnType<typeof memory>) {
        api.me = vi.fn(async () => me);
        render(
          <AccessProvider api={api}>
            <SavedPlans lang="en" api={api} current={CURRENT} onOpen={vi.fn()} />
          </AccessProvider>,
        );
      }
    src__components__SavedPlans.tsx: |
      import { useCallback, useEffect, useId, useState } from "react";
      import { Card, Empty, Loading } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { localeOf, number, ZONE } from "../i18n";
      import type { Lang } from "../i18n";
      import { go } from "../go";
      import { ServerProblem } from "../plans";
      import type { NewPlan, PlanSummary, PlansApi, SavedPlan } from "../plans";
      import { t } from "../texts";
      import type { Key } from "../texts";
      import { useParam } from "../url";

      /** What the server's refusal means to the operator, in their language. */
      export function problemText(lang: Lang, error: unknown, action: Key): string {
        if (!(error instanceof ServerProblem)) return t(lang, "serverDown");
        if (error.status === 0) return t(lang, "serverOffline");
        if (error.status === 401) return t(lang, "signInAgain");
        if (error.status === 403) return t(lang, "noRight");
        if (error.status === 400 || error.status === 409) return `${t(lang, action)}: ${error.message}`;
        if (error.status === 404) return t(lang, "planGone");
        if (error.status === 507) return t(lang, "storageFull");
        return t(lang, "serverDown");
      }

      interface Props {
        lang: Lang;
        api: PlansApi;
        /** The choices on screen, saved as a plan. */
        current: Omit<NewPlan, "operator">;
        /** A saved plan's choices put back on screen. */
        onOpen: (plan: SavedPlan) => void;
      }

      /**
       * The plans kept on the server, of one operator (a van or a crew): save the plan on screen, open
       * one again, download its route sheet, record that it was driven, delete it. A viewer sees their
       * own plans; a steward sees everyone's and hands a plan to another van or crew.
       */
      export function SavedPlans({ lang, api, current, onOpen }: Props) {
        const [operator, setOperator] = useParam("op");
        const [plans, setPlans] = useState<PlanSummary[] | null>(null);
        const [busy, setBusy] = useState<string | null>(null);
        const [message, setMessage] = useState<{ text: string; error: boolean } | null>(null);
        const [confirming, setConfirming] = useState<number | null>(null);
        const [handing, setHanding] = useState<{ id: number; to: string } | null>(null);
        const { me, steward } = useAccess();
        const operatorId = useId();
        const handId = useId();

        const load = useCallback(async () => {
          try {
            setPlans(await api.list(operator));
          } catch (error) {
            setPlans([]);
            setMessage({ text: problemText(lang, error, "loadFailed"), error: true });
          }
        }, [api, operator, lang]);

        useEffect(() => {
          void load();
        }, [load]);

        const run = async (what: string, work: () => Promise<string>, failure: Key) => {
          setBusy(what);
          setMessage(null);
          try {
            setMessage({ text: await work(), error: false });
          } catch (error) {
            setMessage({ text: problemText(lang, error, failure), error: true });
          } finally {
            setBusy(null);
          }
        };

        const save = () =>
          run(
            "save",
            async () => {
              const saved = await api.save({ ...current, operator: operator.trim() });
              await load();
              return t(lang, "saved", { n: number(saved.stops.length), op: saved.operator });
            },
            "saveFailed",
          );
        const open = (id: number) =>
          run(
            `open-${id}`,
            async () => {
              const plan = await api.get(id);
              onOpen(plan);
              return t(lang, "opened", { id: number(id) });
            },
            "openFailed",
          );
        const sheet = (id: number) =>
          run(
            `sheet-${id}`,
            async () => {
              const url = await api.sheetUrl(id);
              go(url);
              return t(lang, "sheetReady");
            },
            "sheetFailed",
          );
        const driven = (id: number) =>
          run(
            `drive-${id}`,
            async () => {
              const plan = await api.get(id);
              await api.drive(id, plan.stops.map((stop) => stop.id));
              await load();
              return t(lang, "drivenSaved");
            },
            "driveFailed",
          );
        /** Shown at once; the list goes back as it was when the server refuses. */
        const handOver = (id: number, to: string) =>
          run(
            `hand-${id}`,
            async () => {
              const before = plans;
              setPlans((list) => list?.map((plan) => (plan.id === id ? { ...plan, operator: to.trim() } : plan)) ?? list);
              try {
                await api.handOver(id, to.trim());
              } catch (error) {
                setPlans(before);
                throw error;
              }
              setHanding(null);
              return t(lang, "handedOver", { op: to.trim() });
            },
            "handOverFailed",
          );
        const remove = (id: number) =>
          run(
            `delete-${id}`,
            async () => {
              await api.remove(id);
              setConfirming(null);
              await load();
              return t(lang, "deleted");
            },
            "deleteFailed",
          );

        const named = operator.trim().length > 0;
        const signedOut = me === null;
        const when = (iso: string) => {
          const at = new Date(iso);
          return Number.isNaN(at.getTime()) ? iso : at.toLocaleString(localeOf(lang), { dateStyle: "medium", timeStyle: "short", timeZone: ZONE });
        };

        return (
          <Card title={t(lang, "savedPlans")}>
            <form
              className="app-filters"
              aria-label={t(lang, "savedPlans")}
              onSubmit={(event) => {
                event.preventDefault();
                if (named && !signedOut && busy === null) void save();
              }}
            >
              <label htmlFor={operatorId}>
                <span>{t(lang, "operator")}</span>
              </label>
              <input id={operatorId} value={operator} maxLength={60} placeholder={t(lang, "operatorHint")} onChange={(event) => setOperator(event.target.value)} />
              <button
                type="submit"
                className="jc-button"
                disabled={!named || signedOut || busy !== null}
                aria-describedby={named && !signedOut ? undefined : `${operatorId}-why`}
                title={signedOut ? t(lang, "signInToSave") : undefined}
              >
                {busy === "save" ? t(lang, "saving") : t(lang, "savePlan")}
              </button>
              {(signedOut || !named) && (
                <span id={`${operatorId}-why`} className="app-updated">
                  {t(lang, signedOut ? "signInToSave" : "operatorFirst")}
                </span>
              )}
            </form>
            <p role="status" aria-live="polite" className={message?.error ? "app-error" : "app-updated"}>
              {message?.text ?? ""}
            </p>
            {plans === null ? (
              <Loading label={t(lang, "loadingPlans")} />
            ) : plans.length === 0 ? (
              <Empty>{named ? t(lang, "noPlansOf", { op: operator.trim() }) : t(lang, "noPlans")}</Empty>
            ) : (
              <>
              {!steward && (
                <p id={handId} className="app-updated">
                  {t(lang, "stewardHandsOver")}
                </p>
              )}
              <ul className="app-plans" aria-label={t(lang, "savedPlans")}>
                {plans.map((plan) => (
                  <li key={plan.id} className="app-plan">
                    <div>
                      <strong>
                        {plan.operator} · {when(plan.createdAt)}
                        {!plan.mine && <span className="app-updated"> · {t(lang, "someoneElses")}</span>}
                      </strong>
                      <p>{t(lang, "planLine", { moved: number(plan.moved), km: number(plan.km, 1), stops: number(plan.stopCount), drives: number(plan.drives) })}</p>
                    </div>
                    <div className="app-plan-actions">
                      <button type="button" className="jc-button" disabled={busy !== null} onClick={() => void open(plan.id)} aria-label={`${t(lang, "openPlan")}: ${plan.operator}, ${when(plan.createdAt)}`}>
                        {t(lang, "openPlan")}
                      </button>
                      <button type="button" className="jc-button" disabled={busy !== null} onClick={() => void sheet(plan.id)} aria-label={`${t(lang, "routeSheet")}: ${plan.operator}, ${when(plan.createdAt)}`}>
                        {t(lang, "routeSheet")}
                      </button>
                      <button type="button" className="jc-button" disabled={busy !== null || plan.stopCount === 0} onClick={() => void driven(plan.id)} aria-label={`${t(lang, "markDriven")}: ${plan.operator}, ${when(plan.createdAt)}`}>
                        {t(lang, "markDriven")}
                      </button>
                      {handing?.id === plan.id ? (
                        <form
                          className="app-filters"
                          aria-label={`${t(lang, "handOver")}: ${plan.operator}`}
                          onSubmit={(event) => {
                            event.preventDefault();
                            if (handing.to.trim()) void handOver(plan.id, handing.to);
                          }}
                        >
                          <label>
                            <span>{t(lang, "handOverTo")}</span>
                            <input value={handing.to} maxLength={60} autoFocus onChange={(event) => setHanding({ id: plan.id, to: event.target.value })} />
                          </label>
                          <button type="submit" className="jc-button" disabled={busy !== null || !handing.to.trim()}>
                            {t(lang, "handOverSave")}
                          </button>
                          <button type="button" className="jc-button" onClick={() => setHanding(null)}>
                            {t(lang, "cancel")}
                          </button>
                        </form>
                      ) : (
                        <button
                          type="button"
                          className="jc-button"
                          disabled={busy !== null || !steward}
                          title={steward ? undefined : t(lang, "stewardHandsOver")}
                          aria-describedby={steward ? undefined : handId}
                          onClick={() => setHanding({ id: plan.id, to: plan.operator })}
                          aria-label={`${t(lang, "handOver")}: ${plan.operator}, ${when(plan.createdAt)}`}
                        >
                          {t(lang, "handOver")}
                        </button>
                      )}
                      {confirming === plan.id ? (
                        <>
                          <button type="button" className="jc-button app-danger" disabled={busy !== null} onClick={() => void remove(plan.id)}>
                            {t(lang, "confirmDelete")}
                          </button>
                          <button type="button" className="jc-button" onClick={() => setConfirming(null)}>
                            {t(lang, "cancel")}
                          </button>
                        </>
                      ) : (
                        <button type="button" className="jc-button" disabled={busy !== null} onClick={() => setConfirming(plan.id)} aria-label={`${t(lang, "deletePlan")}: ${plan.operator}, ${when(plan.createdAt)}`}>
                          {t(lang, "deletePlan")}
                        </button>
                      )}
                    </div>
                  </li>
                ))}
              </ul>
              </>
            )}
          </Card>
        );
      }
    src__components__components.css: |
      /* The components' classes, over the token variables the SDK sets from design-tokens.json. Phone
         first (T-2777, UI-84): each view works from 375 px up, and widens by the room it is given. */

      /* The page is the app: no margin around the shell, so a framed app has one scrollbar, the frame's. */
      body {
        margin: 0;
      }

      .jc-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: var(--jc-font-body, "Inter", system-ui, -apple-system, "Segoe UI", sans-serif);
        color: var(--jc-color-ink, #0f172a);
        background: var(--jc-color-surface, #ffffff);
        font-size: var(--jc-font-size-md, 0.875rem);
        line-height: 1.5;
      }

      .jc-shell *, .jc-shell *::before, .jc-shell *::after {
        box-sizing: border-box;
      }

      .jc-header {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-header h1 {
        margin: 0;
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
      }

      /* Many pages scroll sideways on a phone rather than pushing the page wider than the screen. */
      .jc-header nav {
        display: flex;
        gap: var(--jc-space-1, 0.25rem);
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .jc-header nav button {
        all: unset;
        flex: none;
        cursor: pointer;
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 2px solid transparent;
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-header nav button[aria-current="page"] {
        color: var(--jc-color-accent, #0f766e);
        border-bottom-color: var(--jc-color-accent, #0f766e);
      }

      .jc-user {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-main {
        flex: 1;
        padding: var(--jc-space-4, 1rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--jc-space-4, 1rem);
        align-content: start;
      }

      .jc-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: var(--jc-space-3, 0.75rem);
      }

      .jc-tile {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-tile-label {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-tile-value {
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-table-wrap {
        container-type: inline-size;
        overflow-x: auto;
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
        background: var(--jc-color-surface, #ffffff);
      }

      .jc-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      .jc-table th {
        position: sticky;
        top: 0;
        background: var(--jc-color-card, #f8fafc);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        font-size: var(--jc-font-size-sm, 0.75rem);
        font-weight: 600;
      }

      .jc-table th button {
        all: unset;
        cursor: pointer;
        font: inherit;
        color: inherit;
        display: inline-flex;
        align-items: center;
        gap: var(--jc-space-1, 0.25rem);
      }

      .jc-table td {
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-table tbody tr:nth-child(even) {
        background: var(--jc-color-card, #f8fafc);
      }

      .jc-table tbody tr[aria-selected="true"] {
        background: color-mix(in srgb, var(--jc-color-accent, #0f766e) 15%, transparent);
      }

      .jc-table tbody tr[tabindex="0"] {
        cursor: pointer;
      }

      .jc-num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .jc-pager {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--jc-space-3, 0.75rem);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        border-top: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-detail {
        padding: var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-detail header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--jc-space-3, 0.75rem);
      }

      .jc-detail header h2 {
        margin: 0;
        font-size: var(--jc-font-size-lg, 1rem);
      }

      .jc-detail dl {
        display: grid;
        grid-template-columns: minmax(0, max-content) minmax(0, 1fr);
        gap: var(--jc-space-2, 0.5rem) var(--jc-space-4, 1rem);
        margin: 0;
      }

      .jc-detail dt {
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-detail dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .jc-filterbar {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: var(--jc-space-3, 0.75rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-filter {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        font-size: var(--jc-font-size-sm, 0.75rem);
      }

      .jc-filter span {
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-count {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        align-self: center;
      }

      .jc-form {
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-3, 0.75rem);
        max-width: 120rem;
      }

      /* One column on a phone, two from 40rem of the form's own width, three from 100rem (a form at
         1800 px and wider). */
      .jc-form-fields {
        display: grid;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }

      @container (width >= 40rem) {
        .jc-form-fields {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @container (width >= 100rem) {
        .jc-form-fields {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .jc-field {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
      }

      .jc-field span {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      /* One input per language of a LanguageProperty, stacked under the field's name. */
      .jc-field .jc-languages {
        display: grid;
        gap: var(--jc-space-1, 0.25rem);
        font-size: inherit;
        color: inherit;
        font-weight: inherit;
      }

      .jc-field-error {
        margin: 0;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-danger, #dc2626);
      }

      /* The form's buttons sit on one line, Save last. Without this the row was two stacked
         full-width buttons, which read as two unrelated actions (T-1060). */
      .jc-form-actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--jc-space-2, 0.5rem);
      }

      .jc-export {
        display: inline-flex;
        gap: var(--jc-space-2, 0.5rem);
      }

      .jc-chart {
        margin: 0;
        padding: var(--jc-space-3, 0.75rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
