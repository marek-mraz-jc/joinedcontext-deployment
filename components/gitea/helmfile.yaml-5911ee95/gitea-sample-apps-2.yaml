    map-worker.ts: |
      // The map's worker, for the built application only. MapLibre looks for its worker beside its own
      // script, and a Vite build has no such file, so the map would never draw; this bundles the worker
      // with the library's shared chunk and hands the library its address. index.html loads it before
      // the application. The Portal's preview builds its own document and inlines the worker instead
      // (the SDK's mapWorkerReady), so it never loads this file.
      import { setWorkerUrl } from "maplibre-gl";
      import mapWorker from "maplibre-gl/dist/maplibre-gl-worker.mjs?worker&url";

      setWorkerUrl(mapWorker);
    migrations__0001_itineraries.sql: |
      -- The days visitors shared (T-3347): each under a short id a link carries, its calendar file under
      -- the App's prefix, `shares/{code}.ics`. The reconciler runs this as the schema's owner at
      -- publish; the App itself never runs DDL (ADR-N-044 §2.3). Every statement may run again and
      -- change nothing.
      create table if not exists itineraries (
          code text primary key check (code ~ '^[a-z0-9]{12}$'),
          -- The Helsinki day, and the language the names were read in.
          day date not null,
          lang text not null check (lang in ('fi', 'en', 'sv')),
          -- The events picked, by the end of their id, as the page keeps them in `?pick=`.
          picks jsonb not null,
          -- The day as the planner made it when it was shared.
          items jsonb not null,
          conflicts jsonb not null default '[]',
          walk_km double precision not null check (walk_km >= 0),
          walk_minutes integer not null check (walk_minutes >= 0),
          created_at timestamptz not null default now()
      );
      -- A shared day is kept a week past the day itself; saving a new one clears the old ones.
      create index if not exists itineraries_day on itineraries (day);
    migrations__0002_roles.sql: |
      -- Roles and edits (T-3826, API/07): a day shared while signed in is the sharer's own ("My days"),
      -- one shared signed out is nobody's; a steward curates the featured events every visitor sees;
      -- every change leaves a row in app_audit. Every statement may run again and change nothing.
      alter table itineraries add column if not exists owner_id text not null default '';
      alter table itineraries add column if not exists id bigserial;
      create unique index if not exists itineraries_id on itineraries (id);
      create index if not exists itineraries_owner on itineraries (owner_id, id desc);

      -- The events a steward recommends, by their full id, with a short note, in the order added.
      create table if not exists featured (
          id bigserial primary key,
          owner_id text not null default '',
          event_id text not null unique check (length(event_id) between 1 and 256),
          note text not null default '' check (length(note) <= 200),
          created_at timestamptz not null default now()
      );

      -- jc_app_sdk::access::AUDIT_TABLE
      create table if not exists app_audit (
          id bigserial primary key,
          at timestamptz not null default now(),
          actor_id text not null,
          actor_name text not null,
          action text not null check (action in ('insert', 'update', 'delete', 'edit')),
          target text not null,
          summary text not null check (length(summary) <= 500)
      );
