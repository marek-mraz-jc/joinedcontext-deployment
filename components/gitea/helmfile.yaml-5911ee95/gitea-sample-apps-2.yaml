      # the Portal's does not load it.
      [package]
      name = "event-day-planner"
      version = "0.1.0"
      edition = "2021"
      publish = false
      license = "Apache-2.0"

      [lib]
      crate-type = ["cdylib", "rlib"]

      [dependencies]
      serde = { version = "1", features = ["derive"] }
      serde_json = "1"
      # The version the build lane binds with (builder/build-wasm.sh, AP-142). Only for the page: the
      # server component (server/, T-3347) runs the same code without the browser's bindings.
