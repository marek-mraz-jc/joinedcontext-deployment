apps:
  bike-rebalancing:
    .gitea__workflows__build.yml: |
      # The build of this application (AP-80, AP-100, AP-101, AP-104, ADR-N-028). The Portal writes this
      # file in the application's first commit and a run never changes it: only a version a reviewer
      # merged runs. It builds the default branch on every push to it, and again when the Portal's
      # Rebuild dispatches it (AP-103).
      #
      # Runs on the installation's `gitea-runner` (label node-22), whose image carries the SDK and the
      # template's packages already installed, so nothing is installed here (AP-82). No step fetches an
      # action: the runner reaches the forge and the Portal API only (AP-81), by the in-cluster
      # addresses it gives every job as JC_FORGE_URL and JC_PORTAL_URL; `gitea.server_url` is the
      # public host, which the runner cannot reach.
      #
      # Two jobs: `build` runs the application's code and holds the job token only; `propose` runs no
      # code of the application and is the only one that sees the lane's secret. The Portal checks the
      # uploaded bundle against the proposed digest and publishes the package itself (AP-104).
      name: build

      on:
        push:
          branches: [main]
        workflow_dispatch:

      jobs:
        # `build` runs in a pod of this App's own (label app-build-rust: Rust to WebAssembly, AP-142), registered with this
        # repository's token alone and mounting this App's build cache; `propose` stays on the shared
        # runner and mounts no cache (AP-130, AP-131).
        build:
          runs-on: app-build-rust
          timeout-minutes: 30
          env:
            JC_BUILD_DIR: ${{ runner.temp }}/jc-build
          outputs:
            digest: ${{ steps.upload.outputs.digest }}
            commit: ${{ steps.upload.outputs.commit }}
            sdk-version: ${{ steps.upload.outputs.sdk-version }}
            built-at: ${{ steps.upload.outputs.built-at }}
          steps:
            # Clones the commit, runs the tests, builds and bundles the functions; the application's
            # own code runs here, with the job token removed from its environment.
            - name: Test and build
              env:
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_APP_COMMIT: ${{ gitea.sha }}
                JC_FORGE_TOKEN: ${{ gitea.token }}
              run: JC_APP_REPO="$JC_FORGE_URL/$JC_REPOSITORY.git" build-app

            # bundle-{commit} and sbom-{commit}, the run's artifacts, for the Portal to check and publish.
            - name: Upload the build
              id: upload
              run: node /opt/template/lane.mjs upload "$JC_BUILD_DIR"

        propose:
          needs: build
          runs-on: node-22
          timeout-minutes: 5
          steps:
            # The one step that sees the lane's secret, and it runs no code of the application (AP-80).
            - name: Propose status.build
              env:
                JC_LANE_TOKEN: ${{ secrets.JC_LANE_TOKEN }}
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_DIGEST: ${{ needs.build.outputs.digest }}
                JC_COMMIT: ${{ needs.build.outputs.commit }}
                JC_SDK_VERSION: ${{ needs.build.outputs.sdk-version }}
                JC_BUILT_AT: ${{ needs.build.outputs.built-at }}
              run: node /opt/template/lane.mjs propose "$JC_REPOSITORY"
    .gitignore: |
      # The WebAssembly build: the lane (or `pnpm wasm`) writes wasm/pkg from wasm/.
      wasm/pkg/
      wasm/target/
      node_modules/
      dist/
      test-results/
      *.tsbuildinfo
      playwright-report/
      pnpm-lock.yaml
    README.md: |
      # City bike rebalancing planner

      For the operator of Helsinki's city bikes: which docking stations are about to run empty or full,
      and a route for one service van that takes bikes from the full ones to the empty ones. In Finnish,
      English or Swedish, three pages: the plan, the planner's levels and the history of changes. The
      plan page shows:

      - three numbers on opening: the stations about to run empty, those about to be full, and the
        bikes the van moves, over how many kilometres and stops;
      - the controls: the van's capacity and where it starts (the fullest station when none is chosen);
      - the map, every station in its state's colour and the van's route over them; a click on a station
        takes it into or out of the route and opens it in the entity panel;
      - the route, stop by stop: take or leave how many bikes, what is on board after, the distance from
        the last stop;
      - the stations most out of balance, each with its button to add it to the route or leave it out;
      - the stations by fill, in tenths.

      The page sits in the SDK's `AppShell` (SDK-39), with its Suomi/English/Svenska switch and the
      reader's name and role (Viewer, Steward or Not signed in) in the header. A station's name in
      the route or the table, and a station on the map, open the station in the shell's entity panel
      (SDK-40), read fresh through the App's endpoint. A station's choice button says what its click
      does: a station about to run empty or full is routed unless left out, so it reads "Leave out" even
      before the plan on screen has reached it.

      Every choice is kept in the address (`?van=`, `?start=`, `?add=`, `?skip=`, `?lang=`), so a reload
      or a shared link shows the same plan. The counts are read again every minute.

      ## How the plan is made

      The planner is Rust, in `wasm/`, compiled to WebAssembly and run in the reader's browser in a Web
      Worker, so the page never stalls:

      - a station's state from its bikes and places: empty, low (under 15 %), balanced, nearly full
        (over 85 %), full; a station with no count, or out of service, is never routed;
      - what it needs: the bikes above or below half its places;
      - the route: nearest neighbour from the start under the van's capacity, then 2-opt while the route
        brings more bikes, serves more stations or drives fewer kilometres (haversine distances). At
        most the 60 most urgent stations are planned over.

      The page sends the stations as JSON and gets the states and the route back (`plan` in
      `wasm/src/lib.rs`).

      ## Saved plans, drives and route sheets

      The page plans in the browser while the operator clicks; what is kept lives on the App's server, a
      WebAssembly component on the platform's shared host (`server/`, `kind: wasm`, ADR-N-044):

      - **Save this plan** sends the choices on screen (the van's capacity, the start, the stations added
        and left out) with the name of the van or crew it is for. The server reads the stations again
        from the gateway, as the signed-in caller through the App's own Endpoint, plans with the same Rust (`../wasm`, without the
        browser's bindings) and keeps the stops it made in the App's own schema (`migrations/`). What is
        kept is what the city's data said at that moment, never what a browser sent.
      - Each saved plan gets a **route sheet**, a CSV of its stops for the driver (what to take or leave,
        what is on board after, the leg's kilometres), stored under the App's own prefix and downloaded
        through a URL valid for two minutes. A cell that would start a spreadsheet formula is quoted.
      - **Mark as driven** records that the van drove the plan's stops; a plan lists how often it was
        driven. **Delete** takes the plan, its drives and its sheet away, after a second click.
      - The van or crew is kept in the address (`?op=`), so a reload or a shared link shows that van's
        plans. It is a label the operator types, not an account.

      ## Roles and history

      The server decides from the signed-in person the platform names (`identity::caller()`, API/07),
      never from anything the page sends:

      - a **viewer** saves plans of their own and sees, drives, downloads and deletes only those; a plan
        of someone else's answers as if it did not exist;
      - a **steward** does that for every plan, marked "saved by someone else" where it is not theirs,
        hands a plan to another van or crew, and sets the planner's **levels** (below what share a
        station is about to run empty, above what share it is about to be full, and the share the van
        brings it back to). Every plan saved after uses them, in the browser and on the server;
      - signed out, the page shows the stations and the levels and offers no save.

      A control the reader's role cannot use stays on screen, disabled, with the reason beside it and
      as its tooltip. A hand-over and a change of levels show at once and go back when the server
      refuses. Every change writes a row into the App's `app_audit` table in the same statement, so a
      refused or failed change leaves none; the **History** page reads it: a viewer their own rows, a
      steward everyone's.

      | Route | Who | What it does |
      |---|---|---|
      | `GET /api/me` | anyone | the caller's name and roles, `null` when signed out |
      | `GET /api/levels` | anyone | the planner's levels |
      | `PUT /api/levels` | steward | the levels changed for every plan after |
      | `GET /api/plans?operator=` | signed in | the latest 50 plans (a steward: everyone's), of one operator when named |
      | `POST /api/plans` | signed in | a plan made from the gateway's counts and kept, with its route sheet |
      | `GET /api/plans/{id}` | owner, steward | the plan, its stops and its drives |
      | `DELETE /api/plans/{id}` | owner, steward | the plan, its drives and its sheet gone |
      | `PUT /api/plans/{id}/operator` | steward | the plan handed to another van or crew |
      | `POST /api/plans/{id}/drives` | owner, steward | a drive recorded; its stops must be the plan's |
      | `GET /api/plans/{id}/sheet` | owner, steward | a URL the route sheet downloads from |
      | `GET /api/history` | signed in | the newest 100 changes (a viewer: their own) |

      `server/host-test.json` plays every route on the real host as an anonymous visitor, a viewer,
      another viewer and a steward, and counts the rows after each refused write.

      ## Data

      One data need on the Context Space `helsinki`: `BikeHireDockingStation` with `name`, `location`,
      `availableBikeNumber`, `freeSlotNumber`, `totalSlotNumber`, `status` and `dateModified`, as the
      bikes pipeline writes them from HSL's feed. The app reads through its own endpoint, in the
      browser and on its server alike, and writes nothing to the Context Space: its plans and drives are
      in its own schema.

      **What an operator edits here: nothing.** The `dataNeeds` keep `queryEntity` and
      `retrieveEntity`. Every station attribute is the feed's: the pipeline rewrites the counts each
      minute, so a value changed by hand would be gone at the next run. The panel never offers Edit; it
      links the station to the Portal.

      ## Run the tests

      Needs Rust with the `wasm32-unknown-unknown` target and `wasm-bindgen-cli` 0.2.129, the version
      `wasm/Cargo.lock` pins and the build lane binds with.

      ```sh
      pnpm install
      pnpm wasm          # cargo test of wasm/, then the module into wasm/pkg (the lane runs builder/build-wasm.sh)
      pnpm test          # vitest, with the real WebAssembly module; every control exercised (T-3373)
      pnpm build         # the bundle the build lane publishes
      pnpm e2e           # the built bundle in Chromium at four widths, light and dark (needs `pnpm build`)
      (cd server && cargo test && cargo build --release --target wasm32-wasip2)   # the server component
      ```

      `server/host-test.json` is the server component's scenario on the real host: the portal
      repository's `tests/wasm-apps` (`tests/scenarios.rs`, ci-full) builds the component, runs
      `migrations/` twice as the reconciler does, and plays the scenario against Postgres, RustFS and a
      mock of the App's own Endpoint, with a second App that must see nothing.

      ## Where it is built

      This tree is the repository `helsinki_bike-rebalancing` on the installation's forge. The build
      lane tests and compiles `wasm/` into `wasm/pkg` (builder/build-wasm.sh, AP-142) before `pnpm build`,
      tests `server/` and packs its component as `.jc/component.wasm` (builder/build-component.sh, AP-151),
      and serves the bundle by its digest; the static host allows `'wasm-unsafe-eval'` and nothing wider.
    app.yaml: |
      # The city bike rebalancing planner (T-3328, T-3346): which docking stations are about to run
      # empty or full, and a route for one service van that moves bikes between them. Hand written, so
      # no generated-by annotation (AP-35).
      #
      # A server WASM App (`kind: wasm`, ADR-N-044): React on the App SDK with the planner in Rust
      # compiled to WebAssembly, run in the reader's browser while they click (wasm/); and a server
      # component on the shared host (server/) that plans again from the gateway's counts when a plan is
      # saved, keeps the plans and the drives in the App's own schema (migrations/) and the route sheets
      # under its own prefix. Its source is its own repository on the forge, which the build lane builds
      # at `ref` (AP-75, AP-80, AP-151); this folder of the portal repository is where CI tests the same
      # tree before it is pushed there (T-2599).
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: bike-rebalancing
        namespace: helsinki
        title:
          en: "City bike rebalancing planner"
          fi: "Kaupunkipyörien tasaussuunnitelma"
        description:
          en: "Which docking stations are about to run empty or full, and a route for the service van that moves bikes between them, with saved plans, route sheets and the drives made."
          fi: "Mitkä asemat ovat tyhjenemässä tai täyttymässä, ja huoltoauton reitti, joka siirtää pyöriä niiden välillä, tallennetut suunnitelmat, reittilistat ja ajetut reitit."
      spec:
        kind: wasm
        source:
          git:
            url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_bike-rebalancing.git
            ref: main
        build:
          node: "22"
          rust: "1.90"
        storage:
          sql: { migrations: migrations, quotaMiB: 100 }
          # Route sheets are a few kilobytes each.
          blob: { quotaMiB: 256 }
        # For the operator: the people of the project, viewer and steward alike.
        visibility: project
        lifecycle: published
        roles:
          - name: viewer
            title: { en: "Viewer", fi: "Katselija" }
            description: "Reads the stations and the levels, plans the van's route, saves plans of their own, records drives on them and reads their own history."
          - name: steward
            title: { en: "Steward", fi: "Ylläpitäjä" }
            description: "What a viewer does, on every plan: hands a plan to another van or crew, deletes any plan, sets the planner's levels for everyone and reads the whole history. The city's data is only read."
        access:
          - role: viewer
            subjects: [{ group: bike-rebalancing-viewer }]
          - role: steward
            subjects: [{ group: bike-rebalancing-steward }]
        dataNeeds:
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [BikeHireDockingStation]
            # What the bikes pipeline writes on dev (helsinki-pipeline-bikes-bento.yaml) and the planner
            # reads: the counts, the capacity, whether the station is in service and where it is.
            attrs: [name, location, availableBikeNumber, freeSlotNumber, totalSlotNumber, status, dateModified]
            operations: [queryEntity, retrieveEntity]
            representations: [ngsi-ld, ogc-features]
    e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { BASE, STEWARD, VIEWER, serve } from "./serve";

      // T-3328, UI-84, SDK-12: the plan at a phone, a tablet, a laptop and a wall, light and dark, with
      // the WebAssembly planner run in its worker under the static host's policy: no sideways scroll, no
      // two blocks over each other, nothing axe finds at WCAG 2.1 AA.
      for (const scheme of ["light", "dark"] as const) {
        for (const size of WIDTHS) {
          test(`${scheme} at ${size.width} px: the route is planned, no sideways scroll, no overlap, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const { outside, missing, problems } = await serve(page);
            await page.setViewportSize(size);
            await page.goto(BASE);
            const plan = page.getByRole("region", { name: "Rebalancing" });
            await expect(plan.getByRole("list", { name: "Route" }).getByRole("listitem").first()).toBeVisible();
            await expect(plan.getByTestId("jc-map").locator("canvas")).toHaveCount(1);
            await expect(plan.locator(".jc-chart-canvas canvas")).toHaveCount(1);
            await testInfo.attach(`plan-${scheme}-${size.width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      test("a station left out stays out after a reload, by the address", async ({ page }) => {
        await serve(page);
        await page.goto(BASE);
        const route = page.getByRole("list", { name: "Route" });
        const first = route.getByRole("listitem").first();
        const name = (await first.locator("strong").textContent()) ?? "";
        await first.getByRole("button", { name: `Leave out of the route: ${name}` }).click();
        await expect(route.getByText(name, { exact: true })).toHaveCount(0);
        await page.reload();
        await expect(page.getByRole("list", { name: "Route" }).getByRole("listitem").first()).toBeVisible();
        await expect(page.getByRole("list", { name: "Route" }).getByText(name, { exact: true })).toHaveCount(0);
      });

      // T-3388, SDK-40: a stop of the route opened in the SDK's entity panel by its name, at a phone and a
      // laptop, light and dark. The operator may only read, so the panel links to the Portal, no Edit.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: a station in the entity panel, linked to the Portal, axe clean`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(BASE);
            const stop = page.getByRole("list", { name: "Route" }).getByRole("listitem").first();
            const name = (await stop.locator("strong").textContent()) ?? "";
            await stop.getByRole("button", { name, exact: true }).click();
            const panel = page.getByRole("dialog", { name });
            await expect(panel.getByText("BikeHireDockingStation")).toBeVisible();
            await expect(panel.getByRole("link", { name: "Open in the Portal" })).toBeVisible();
            await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
            expect(await layoutProblems(page)).toEqual([]);
            await page.keyboard.press("Escape");
            await expect(page.getByRole("dialog")).toHaveCount(0);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      // T-3826: the levels and the history as a viewer reads them and a steward changes them, at a phone
      // and a laptop, light and dark: the viewer's form closed with its reason, the steward's save shown
      // and then in the history.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          for (const [who, me] of [
            ["viewer", VIEWER],
            ["steward", STEWARD],
          ] as const) {
            test(`${scheme} at ${width} px: the levels and the history as a ${who}, axe clean`, async ({ page }, testInfo) => {
              await page.emulateMedia({ colorScheme: scheme });
              const served = await serve(page, me);
              await page.setViewportSize({ width, height: 900 });
              await page.goto(BASE);
              await expect(page.getByLabel(`Your role: ${who === "steward" ? "Steward" : "Viewer"}`)).toBeVisible();
              await page.getByRole("button", { name: "Levels" }).click();
              const low = page.getByRole("spinbutton", { name: "About to run empty below (%)" });
              await expect(low).toHaveValue("15");
              if (who === "viewer") {
                await expect(low).toBeDisabled();
                await expect(page.getByText("Only a steward changes the levels.")).toBeVisible();
              } else {
                await expect(low).toBeEnabled();
                await low.fill("20");
                await page.getByRole("button", { name: "Save the levels" }).click();
                await expect(page.getByRole("status")).toHaveText("The levels are saved. The next plans use them.");
              }
              await testInfo.attach(`levels-${who}-${scheme}-${width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
              expect(await layoutProblems(page)).toEqual([]);
              await page.getByRole("button", { name: "History" }).click();
              await expect(page.getByText(who === "steward" ? "changed: levels changed" : "No change yet.")).toBeVisible();
              await testInfo.attach(`history-${who}-${scheme}-${width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
              expect(await layoutProblems(page)).toEqual([]);
              expect(served).toEqual({ outside: [], missing: [], problems: [] });
            });
          }
        }
      }
    e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { Page } from "@playwright/test";
      import { stubTransport } from "@joinedcontext/sdk/testing";
      import { STATIONS } from "../src/fixtures/stations";

      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      export const BASE = "http://portal.test/";
      const SLUG = "bikerebalancing";
      // An operator of the project signed in; the panel links a station to the Portal (SDK-40), shown, never followed.
      const CONFIG = {
        slug: SLUG,
        orgDomain: "hel.fi",
        space: "helsinki",
        transport: "origin",
        appName: "bike-rebalancing",
        language: "en",
        user: { id: "u-1", name: "Operaattori" },
        portal: "https://portal.hel.fi/projects/helsinki",
      };
      const TYPES: Record<string, string> = {
        ".html": "text/html",
        ".js": "text/javascript",
        ".css": "text/css",
        ".json": "application/json",
        ".svg": "image/svg+xml",
        ".wasm": "application/wasm",
      };
      // What the Portal's static host sends for a `kind: ui` App once T-3327 allows WebAssembly: no
      // 'unsafe-eval', only 'wasm-unsafe-eval', and nothing from another host.
      const CSP = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'";

      /** What the served page did that it should not: a host it called, a file it missed, an error it threw. */
      export interface Served {
        outside: string[];
        missing: string[];
        problems: string[];
      }

      /** Who the App's server says is signed in (T-3826): a viewer unless a test names a steward. */
      export const VIEWER = { id: "u-1", name: "Operaattori", roles: ["viewer"] };
      export const STEWARD = { id: "u-2", name: "Ylläpitäjä", roles: ["viewer", "steward"] };

      /** Serves the built bundle at the root of the App's own host, with the SDK's stub answering its endpoint. */
      export async function serve(page: Page, me: { id: string; name: string; roles: string[] } = VIEWER): Promise<Served> {
        const transport = stubTransport({
          entities: STATIONS,
          access: { permissions: [{ resource: { type: "BikeHireDockingStation" }, actions: ["queryEntity", "retrieveEntity"], attributes: "*" }], prohibitions: [] },
        });
        const served: Served = { outside: [], missing: [], problems: [] };
        let levels = { low: 0.15, high: 0.85, target: 0.5 };
        const history: unknown[] = [];
        page.on("pageerror", (error) => served.problems.push(error.message));
        await page.clock.setFixedTime(new Date("2030-10-20T06:00:00Z"));

        await page.route("**/*", async (route) => {
          const url = new URL(route.request().url());
          if (url.origin !== "http://portal.test") {
            served.outside.push(url.href);
            return route.abort();
          }
          if (url.pathname.startsWith(`/api/endpoint/${SLUG}/`)) {
            const body = route.request().postData();
            const path = url.pathname + url.search;
            const answer = await transport({ method: route.request().method() as "GET", path, body: body ? JSON.parse(body) : undefined });
            return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body ?? null) });
          }
          // The App's own server (T-3346, T-3826): an operator with no plan saved yet, the levels, and
          // the history, deciding by `me` as the real one does; any other call is missing.
          const api = `/apps/${CONFIG.appName}/api`;
          const method = route.request().method();
          const json = (status: number, body: unknown) => route.fulfill({ status, contentType: "application/json", body: JSON.stringify(body) });
          if (url.pathname === `${api}/plans` && method === "GET") return json(200, []);
          if (url.pathname === `${api}/me` && method === "GET") return json(200, me);
          if (url.pathname === `${api}/levels` && method === "GET") return json(200, levels);
          if (url.pathname === `${api}/levels` && method === "PUT") {
            if (!me.roles.includes("steward")) return json(403, { detail: "this needs the role steward" });
            levels = JSON.parse(route.request().postData() ?? "{}");
            history.unshift({ id: history.length + 1, at: "2030-10-20T06:00:00Z", actorName: me.name, action: "update", target: "levels/1", summary: "levels changed" });
            return json(200, levels);
          }
          if (url.pathname === `${api}/history` && method === "GET") return json(200, history);
          const file = normalize(url.pathname.slice(1) || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) {
            served.missing.push(url.pathname);
            return route.fulfill({ status: 404, body: "" });
          }
          let body = readFileSync(join(DIST, file));
          if (file === "index.html") {
            body = Buffer.from(
              body.toString("utf8").replace('<script id="jc-config" type="application/json"></script>', `<script id="jc-config" type="application/json">${JSON.stringify(CONFIG)}</script>`),
            );
          }
          return route.fulfill({
            status: 200,
