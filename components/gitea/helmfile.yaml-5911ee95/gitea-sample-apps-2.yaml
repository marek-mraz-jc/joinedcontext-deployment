      import { fireEvent, render, screen, within } from "@testing-library/react";
      import { describe, expect, it, vi } from "vitest";
      import { AccessProvider } from "../access";
      import { memory, VIEWER } from "../fixtures/memory";
      import { ServerProblem } from "../share";
      import type { Me } from "../share";
      import { MyDays } from "./MyDays";

      async function show(me: Me | null, api = memory(me), lang: "en" | "fi" | "sv" = "en") {
        render(
          <AccessProvider api={api}>
            <MyDays lang={lang} api={api} />
          </AccessProvider>,
        );
        return api;
      }

      /** A viewer who shared two days while signed in. */
      async function sharedTwo() {
        const api = memory(VIEWER);
        await api.share("2030-10-20", ["urn:ngsi-ld:Event:x:a", "urn:ngsi-ld:Event:x:b"], "en");
        await api.share("2030-10-21", ["urn:ngsi-ld:Event:x:c"], "en");
        return api;
      }

      // T-3826: a signed-in visitor keeps the days they share and deletes one of their own.
      describe("MyDays", () => {
        it("lists the reader's days, opens one by its link, and deletes one after a confirm", async () => {
          const api = await show(VIEWER, await sharedTwo());
          const list = await screen.findByRole("list", { name: "The days I shared" });
          expect(within(list).getAllByRole("listitem")).toHaveLength(2);
          const open = within(list).getByRole("link", { name: /^Open: 20 Oct 2030 · 2 events/ });
          expect(open).toHaveAttribute("href", "?share=abc123def456&lang=en");
          fireEvent.click(open);

          fireEvent.click(within(list).getByRole("button", { name: /^Delete: 21 Oct 2030/ }));
          fireEvent.click(within(list).getByRole("button", { name: "Cancel" }));
          expect(api.forgetDay).not.toHaveBeenCalled();
          fireEvent.click(within(list).getByRole("button", { name: /^Delete: 21 Oct 2030/ }));
          fireEvent.click(within(list).getByRole("button", { name: "Delete for good" }));
          expect(await screen.findByText("The day and its calendar file are deleted.")).toBeInTheDocument();
          expect(api.forgetDay).toHaveBeenCalledWith(2);
          expect(within(list).getAllByRole("listitem")).toHaveLength(1);
        });

        it("puts a day back when the server refuses to delete it", async () => {
          const api = await sharedTwo();
          api.forgetDay = vi.fn(async () => {
            throw new ServerProblem(404, "no such day");
          });
          await show(VIEWER, api);
          const list = await screen.findByRole("list", { name: "The days I shared" });
          fireEvent.click(within(list).getByRole("button", { name: /^Delete: 20 Oct 2030/ }));
          fireEvent.click(within(list).getByRole("button", { name: "Delete for good" }));
          expect(await screen.findByText(/no longer there, or it is not yours/)).toBeInTheDocument();
          expect(within(list).getAllByRole("listitem")).toHaveLength(2);
        });

        it("says when nothing is kept", async () => {
          await show(VIEWER);
          expect(await screen.findByText("You have shared no day while signed in.")).toBeInTheDocument();
        });

        it("asks a signed-out reader to sign in and asks the server nothing", async () => {
          const api = await show(null);
          expect(await screen.findByText("Sign in to keep the days you share.")).toBeInTheDocument();
          expect(api.days).not.toHaveBeenCalled();
        });

        it("says why the days could not be read, and writes a date it cannot read as given", async () => {
          const api = memory(VIEWER);
          api.days = vi.fn(async () => {
            throw new ServerProblem(0, "");
          });
          await show(VIEWER, api);
          expect(await screen.findByText(/could not be reached/)).toBeInTheDocument();

          const odd = memory(VIEWER);
          odd.days = vi.fn(async () => [{ id: 9, code: "zzzzzzzzzzzz", day: "someday", events: 1, createdAt: "" }]);
          await show(VIEWER, odd, "sv");
          expect(await screen.findByText("someday · 1 evenemang")).toBeInTheDocument();
          fireEvent.click(screen.getByRole("link", { name: /^Öppna: someday/ }));
          fireEvent.click(screen.getByRole("button", { name: /^Ta bort: someday/ }));
          fireEvent.click(screen.getByRole("button", { name: "Ta bort för gott" }));
          // Not the server's to delete: the memory server holds no day 9.
          expect(await screen.findByText(/Den finns inte längre/)).toBeInTheDocument();
        });
      });
    src__components__MyDays.tsx: |
      import { useCallback, useEffect, useState } from "react";
      import { Card, Empty, Loading } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { localeOf, number, ZONE } from "../i18n";
      import type { Lang } from "../i18n";
      import type { KeptDay, ShareApi } from "../share";
      import { t } from "../texts";
      import { problemText } from "./ShareDay";

      /** The days the reader shared while signed in: open one again, or delete it (gone at once, back on a refusal). */
      export function MyDays({ lang, api }: { lang: Lang; api: ShareApi }) {
        const { me } = useAccess();
        const [days, setDays] = useState<KeptDay[] | null>(null);
        const [message, setMessage] = useState<{ text: string; error: boolean } | null>(null);
        const [confirming, setConfirming] = useState<number | null>(null);

        const load = useCallback(async () => {
          try {
            setDays(await api.days());
          } catch (error) {
            setDays([]);
            setMessage({ text: problemText(lang, error, "daysFailed", "gone"), error: true });
          }
        }, [api, lang]);

        useEffect(() => {
          if (me) void load();
        }, [me, load]);

        const forget = async (id: number) => {
          const before = days;
          setDays((now) => now?.filter((day) => day.id !== id) ?? now);
          setConfirming(null);
          setMessage(null);
          try {
            await api.forgetDay(id);
            setMessage({ text: t(lang, "dayDeleted"), error: false });
          } catch (error) {
            setDays(before);
            setMessage({ text: problemText(lang, error, "deleteFailed", "gone"), error: true });
          }
        };

        const when = (day: string) => {
          const at = new Date(`${day}T12:00:00Z`);
          return Number.isNaN(at.getTime()) ? day : at.toLocaleDateString(localeOf(lang), { dateStyle: "medium", timeZone: ZONE });
        };

        if (me === null)
          return (
            <Card title={t(lang, "daysTitle")}>
              <Empty>{t(lang, "daysSignIn")}</Empty>
            </Card>
          );
        return (
          <Card title={t(lang, "daysTitle")}>
            <p role="status" aria-live="polite" className={message?.error ? "app-error" : "app-lead"}>
              {message?.text ?? ""}
            </p>
            {days === null ? (
              <Loading label={t(lang, "daysLoading")} />
            ) : days.length === 0 ? (
              <Empty>{t(lang, "daysEmpty")}</Empty>
            ) : (
              <ul className="app-days" aria-label={t(lang, "daysTitle")}>
                {days.map((day) => {
                  const line = t(lang, "dayLine", { day: when(day.day), n: number(day.events) });
                  return (
                    <li key={day.id} className="app-event">
                      <strong>{line}</strong>
                      <div className="app-filters">
                        <a className="jc-button" href={`?share=${day.code}&lang=${lang}`} aria-label={`${t(lang, "openDay")}: ${line}`}>
                          {t(lang, "openDay")}
                        </a>
                        {confirming === day.id ? (
                          <>
                            <button type="button" className="jc-button app-danger" onClick={() => void forget(day.id)}>
                              {t(lang, "confirmDelete")}
                            </button>
                            <button type="button" className="jc-button" onClick={() => setConfirming(null)}>
                              {t(lang, "cancel")}
                            </button>
                          </>
                        ) : (
                          <button type="button" className="jc-button" onClick={() => setConfirming(day.id)} aria-label={`${t(lang, "deleteDay")}: ${line}`}>
                            {t(lang, "deleteDay")}
                          </button>
                        )}
                      </div>
                    </li>
                  );
                })}
              </ul>
            )}
          </Card>
        );
      }
    src__components__ShareDay.test.tsx: |
      import { fireEvent, render, screen, waitFor } from "@testing-library/react";
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { ServerProblem } from "../share";
      import type { ShareApi, SharedDay } from "../share";
      import { memory } from "../fixtures/memory";
      import { problemText, ShareDay } from "./ShareDay";

      const went: string[] = [];
      vi.mock("../go", () => ({ go: (url: string) => went.push(url) }));

      const SHARED: SharedDay = { code: "abc123def456", day: "2030-10-20", lang: "en", picks: ["a", "b"], items: [], conflicts: [], walkKm: 0, walkMinutes: 0 };

      function stub(): ShareApi {
        return {
          ...memory(),
          share: vi.fn(async () => ({ ...SHARED, items: [{ id: "a" }, { id: "b" }] as SharedDay["items"] })),
          get: vi.fn(async () => SHARED),
          icsUrl: vi.fn(async () => "https://store.example/apps/s1/x/shares/abc123def456.ics?X-Amz-Signature=x"),
        };
      }

      afterEach(() => vi.unstubAllGlobals());

      // T-3347: the visitor shares the picked day and gets a link to pass on.
      describe("ShareDay", () => {
        it("asks for picks first, then shares the day and shows the link to copy", async () => {
          const api = stub();
          const { rerender } = render(<ShareDay lang="en" api={api} day="2030-10-20" ids={[]} />);
          expect(screen.getByRole("button", { name: "Share this day" })).toBeDisabled();
          expect(screen.getByText("Pick events first to share the day.")).toBeInTheDocument();
          rerender(<ShareDay lang="en" api={api} day="2030-10-20" ids={["urn:ngsi-ld:Event:x:a", "urn:ngsi-ld:Event:x:b"]} />);
          fireEvent.click(screen.getByRole("button", { name: "Share this day" }));
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent("Day shared: 2 events."));
          expect(api.share).toHaveBeenCalledWith("2030-10-20", ["urn:ngsi-ld:Event:x:a", "urn:ngsi-ld:Event:x:b"], "en");
          expect(screen.getByLabelText("Link to the shared day")).toHaveValue(`${window.location.origin}${window.location.pathname}?share=abc123def456`);

          const writeText = vi.fn(async () => undefined);
          vi.stubGlobal("navigator", { clipboard: { writeText } });
          fireEvent.click(screen.getByRole("button", { name: "Copy link" }));
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent("Link copied."));
          expect(writeText).toHaveBeenCalledWith(expect.stringContaining("?share=abc123def456"));
        });

        it("gives the shared day's calendar file, and says so when the store cannot", async () => {
          const api = stub();
          render(<ShareDay lang="en" api={api} day="2030-10-20" ids={["urn:ngsi-ld:Event:x:a"]} />);
          fireEvent.click(screen.getByRole("button", { name: "Share this day" }));
          const link = await screen.findByLabelText("Link to the shared day");
          // A click puts the caret there and a focus selects the whole link, ready to copy.
          fireEvent.click(link);
          fireEvent.focus(link);
          expect((link as HTMLInputElement).selectionEnd).toBe((link as HTMLInputElement).value.length);
          fireEvent.click(screen.getByRole("button", { name: "Calendar file of the shared day" }));
          await waitFor(() => expect(went).toEqual(["https://store.example/apps/s1/x/shares/abc123def456.ics?X-Amz-Signature=x"]));
          api.icsUrl = vi.fn(async () => {
            throw new ServerProblem(404, "no day is shared under this link");
          });
          fireEvent.click(screen.getByRole("button", { name: "Calendar file of the shared day" }));
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent(/No day is shared under this link/));
        });

        it("selects the link for the keyboard when the clipboard is refused", async () => {
          render(<ShareDay lang="en" api={stub()} day="2030-10-20" ids={["urn:ngsi-ld:Event:x:a"]} />);
          fireEvent.click(screen.getByRole("button", { name: "Share this day" }));
          await screen.findByLabelText("Link to the shared day");
          vi.stubGlobal("navigator", { clipboard: { writeText: vi.fn().mockRejectedValue(new Error("denied")) } });
          fireEvent.click(screen.getByRole("button", { name: "Copy link" }));
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent("The link is selected: copy it with the keyboard."));
        });

        it("says in the visitor's language why the server refused", async () => {
          const api = stub();
          api.share = vi.fn(async () => {
            throw new ServerProblem(409, "none of the picked events takes place that day");
          });
          render(<ShareDay lang="fi" api={api} day="2030-10-20" ids={["urn:ngsi-ld:Event:x:a"]} />);
          fireEvent.click(screen.getByRole("button", { name: "Jaa tämä päivä" }));
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent("Ei jaettu: none of the picked events takes place that day"));
          expect(screen.queryByLabelText("Linkki jaettuun päivään")).toBeNull();
        });

        it("maps every refusal to words a person can act on", () => {
          expect(problemText("en", new ServerProblem(0, ""), "shareFailed")).toMatch(/could not be reached/);
          expect(problemText("en", new ServerProblem(404, ""), "openShareFailed")).toMatch(/cleared a week after/);
          expect(problemText("en", new ServerProblem(507, ""), "shareFailed")).toMatch(/storage is full/);
          expect(problemText("en", new ServerProblem(502, ""), "shareFailed")).toMatch(/did not answer/);
          expect(problemText("en", new ServerProblem(403, ""), "shareFailed")).toMatch(/may not do this/);
          expect(problemText("en", new ServerProblem(404, ""), "deleteFailed", "gone")).toMatch(/no longer there/);
        });
      });
    src__components__ShareDay.tsx: |
      import { useId, useState } from "react";
      import { go } from "../go";
      import type { Lang } from "../i18n";
      import { ServerProblem, shareLink } from "../share";
      import type { ShareApi } from "../share";
      import { t } from "../texts";
      import type { Key } from "../texts";

      /** What the server's refusal means to the visitor, in their language; a `404` reads as `gone`. */
      export function problemText(lang: Lang, error: unknown, action: Key, gone: Key = "shareGone"): string {
        if (!(error instanceof ServerProblem)) return t(lang, "serverDown");
        if (error.status === 0) return t(lang, "serverOffline");
        if (error.status === 401) return t(lang, "signInAgain");
        if (error.status === 403) return t(lang, "noRight");
        if (error.status === 400 || error.status === 409) return `${t(lang, action)}: ${error.message}`;
        if (error.status === 404) return t(lang, gone);
        if (error.status === 507) return t(lang, "storageFull");
        return t(lang, "serverDown");
      }

      interface Props {
        lang: Lang;
        api: ShareApi;
        /** The Helsinki day shown, `YYYY-MM-DD`. */
        day: string;
        /** The picked events' full ids. */
        ids: string[];
      }

      /**
       * Shares the picked day: the server plans it again from the city's data and keeps it under a
       * code; the visitor gets the link to copy and the calendar file of what was shared.
       */
      export function ShareDay({ lang, api, day, ids }: Props) {
        const [busy, setBusy] = useState(false);
        const [code, setCode] = useState<string | null>(null);
        const [message, setMessage] = useState<{ text: string; error: boolean } | null>(null);
        const linkId = useId();

        const share = async () => {
          setBusy(true);
          setMessage(null);
          try {
            const shared = await api.share(day, ids, lang);
            setCode(shared.code);
            setMessage({ text: t(lang, "shared", { n: shared.items.length }), error: false });
          } catch (error) {
            setMessage({ text: problemText(lang, error, "shareFailed"), error: true });
          } finally {
            setBusy(false);
          }
        };
        const copy = async () => {
          if (!code) return;
          try {
            await navigator.clipboard.writeText(shareLink(code));
            setMessage({ text: t(lang, "copied"), error: false });
          } catch {
            (document.getElementById(linkId) as HTMLInputElement | null)?.select();
            setMessage({ text: t(lang, "copyByHand"), error: false });
          }
        };
        const calendar = async () => {
          if (!code) return;
          try {
            go(await api.icsUrl(code));
          } catch (error) {
            setMessage({ text: problemText(lang, error, "icsFailed"), error: true });
          }
        };

        return (
          <div className="app-share">
            <button type="button" className="jc-button" onClick={() => void share()} disabled={busy || ids.length === 0} title={ids.length === 0 ? t(lang, "pickFirst") : undefined}>
              {busy ? t(lang, "sharing") : t(lang, "share")}
            </button>
            {ids.length === 0 && <p className="app-lead">{t(lang, "pickFirst")}</p>}
            {code && (
              <div className="app-share-link">
                <label htmlFor={linkId}>{t(lang, "shareLink")}</label>
                <input id={linkId} readOnly value={shareLink(code)} onFocus={(event) => event.currentTarget.select()} />
                <button type="button" className="jc-button" onClick={() => void copy()}>
                  {t(lang, "copy")}
                </button>
                <button type="button" className="jc-button" onClick={() => void calendar()}>
                  {t(lang, "sharedIcs")}
                </button>
              </div>
            )}
            <p role="status" aria-live="polite" className={message?.error ? "app-error" : "app-lead"}>
              {message?.text ?? ""}
            </p>
          </div>
        );
      }
    src__components__components.css: |
      /* The components' classes, over the token variables the SDK sets from design-tokens.json. Phone
         first (T-2777, UI-84): each view works from 375 px up, and widens by the room it is given. */

      /* The page is the app: no margin around the shell, so a framed app has one scrollbar, the frame's. */
      body {
        margin: 0;
      }

      .jc-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: var(--jc-font-body, "Inter", system-ui, -apple-system, "Segoe UI", sans-serif);
        color: var(--jc-color-ink, #0f172a);
        background: var(--jc-color-surface, #ffffff);
        font-size: var(--jc-font-size-md, 0.875rem);
        line-height: 1.5;
      }

      .jc-shell *, .jc-shell *::before, .jc-shell *::after {
        box-sizing: border-box;
      }

      .jc-header {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-header h1 {
        margin: 0;
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
      }

      /* Many pages scroll sideways on a phone rather than pushing the page wider than the screen. */
      .jc-header nav {
        display: flex;
        gap: var(--jc-space-1, 0.25rem);
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .jc-header nav button {
        all: unset;
        flex: none;
        cursor: pointer;
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 2px solid transparent;
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-header nav button[aria-current="page"] {
        color: var(--jc-color-accent, #0f766e);
        border-bottom-color: var(--jc-color-accent, #0f766e);
      }

      .jc-user {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-main {
        flex: 1;
        padding: var(--jc-space-4, 1rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--jc-space-4, 1rem);
        align-content: start;
      }

      .jc-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: var(--jc-space-3, 0.75rem);
      }

      .jc-tile {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-tile-label {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-tile-value {
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-table-wrap {
        container-type: inline-size;
        overflow-x: auto;
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
        background: var(--jc-color-surface, #ffffff);
      }

      .jc-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      .jc-table th {
        position: sticky;
        top: 0;
        background: var(--jc-color-card, #f8fafc);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        font-size: var(--jc-font-size-sm, 0.75rem);
        font-weight: 600;
      }

      .jc-table th button {
        all: unset;
        cursor: pointer;
        font: inherit;
        color: inherit;
        display: inline-flex;
        align-items: center;
        gap: var(--jc-space-1, 0.25rem);
      }

      .jc-table td {
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-table tbody tr:nth-child(even) {
        background: var(--jc-color-card, #f8fafc);
      }

      .jc-table tbody tr[aria-selected="true"] {
        background: color-mix(in srgb, var(--jc-color-accent, #0f766e) 15%, transparent);
      }

      .jc-table tbody tr[tabindex="0"] {
        cursor: pointer;
      }

      .jc-num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .jc-pager {
