                            type="button"
                            className="jc-button"
                            disabled={busy || one.id < 0}
                            onClick={() => void run(() => featured.remove(one.id), t(lang, "unfeatured", { name }), "unfeatureFailed")}
                            aria-label={`${t(lang, "unfeature")}: ${name}`}
                          >
                            {t(lang, "unfeature")}
                          </button>
                        </form>
                      )}
                    </li>
                  );
                })}
              </ul>
            )}
          </Card>
        );
      }
