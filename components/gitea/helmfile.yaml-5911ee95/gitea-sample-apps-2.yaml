    src__components__EntityMap.tsx: |
      import { useEffect, useMemo, useRef, useState } from "react";
      import { Map as MapLibreMap } from "maplibre-gl";
      import type { GeoJSONSource, IControl } from "maplibre-gl";
      import { MapboxOverlay } from "@deck.gl/mapbox";
      import { ScatterplotLayer } from "@deck.gl/layers";
      import { GridLayer, HexagonLayer } from "@deck.gl/aggregation-layers";

      import { currentTokens, displayName, extent, format, mapWorkerReady, NO_BASEMAP, NO_LOCATIONS, pointOf, styleFor, toFeatureCollection, useClient } from "@joinedcontext/sdk";
      import type { Cell, DesignTokens, Geo, Row } from "@joinedcontext/sdk";

      export const DECK_THRESHOLD = 50_000;
      export type MapMode = "auto" | "points" | "hexbin" | "grid";

      export function renderPath(count: number, mode: MapMode): "maplibre" | "deck-points" | "deck-hexbin" | "deck-grid" {
        if (mode === "hexbin") return "deck-hexbin";
        if (mode === "grid") return "deck-grid";
        if (mode === "points") return "maplibre";
        return count >= DECK_THRESHOLD ? "deck-points" : "maplibre";
      }

      function parseHexColor(hex: string): [number, number, number] {
        let cleaned = hex.replace(/^#/, "").trim();
        if (cleaned.length === 3) {
          cleaned = cleaned
            .split("")
            .map((c) => c + c)
            .join("");
        }
        if (cleaned.length !== 6) {
          return [0, 0, 0];
        }
        const num = parseInt(cleaned, 16);
        return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
      }

      function toHex(r: number, g: number, b: number): string {
        const clamp = (n: number) => Math.max(0, Math.min(255, Math.round(n)));
        const to2 = (n: number) => clamp(n).toString(16).padStart(2, "0");
        return `#${to2(r)}${to2(g)}${to2(b)}`;
      }

      export function colorRamp(value: Cell, range: [number, number] | null, tokens?: DesignTokens): string {
        const tks = tokens ?? currentTokens();
        if (typeof value !== "number" || !range || range[1] <= range[0] || Number.isNaN(value)) {
          return tks.map.point;
        }
        const t = Math.max(0, Math.min(1, (value - range[0]) / (range[1] - range[0])));
        const [r0, g0, b0] = parseHexColor(tks.map.low);
        const [r1, g1, b1] = parseHexColor(tks.map.high);
        return toHex(r0 + t * (r1 - r0), g0 + t * (g1 - g0), b0 + t * (b1 - b0));
      }

      function deckColorRange(tokens: DesignTokens): [number, number, number][] {
        const [r0, g0, b0] = parseHexColor(tokens.map.low);
        const [r1, g1, b1] = parseHexColor(tokens.map.high);
        const steps: [number, number, number][] = [];
        for (let i = 0; i < 6; i++) {
          const t = i / 5;
          steps.push([Math.round(r0 + t * (r1 - r0)), Math.round(g0 + t * (g1 - g0)), Math.round(b0 + t * (b1 - b0))]);
        }
        return steps;
      }

      /** The label of a row on the map: the `label` attribute when it holds text, else its display name. */
      function nameOf(row: Row, label?: string): string {
        const text = label ? format(row[label]).trim() : "";
        return text === "" ? displayName(row) : text;
      }

      interface PointRow {
        position: [number, number];
        rgb: [number, number, number];
        row: Row;
      }


      function extractCoordinates(geometry: Geo): Array<[number, number]> {
        const coords: Array<[number, number]> = [];
        function dig(val: unknown) {
          if (Array.isArray(val)) {
            if (val.length >= 2 && typeof val[0] === "number" && typeof val[1] === "number") {
              coords.push([val[0], val[1]]);
            } else {
              for (const item of val) dig(item);
            }
          }
        }
        dig(geometry.coordinates);
        return coords;
      }

      export function EntityMap({
        rows,
        location = "location",
        label,
        color,
        selected = null,
        onSelect,
        basemap,
        mode = "auto",
        height,
        radius = 500,
      }: {
        rows: Row[];
        location?: string;
        label?: string;
        color?: string;
        selected?: string | null;
        onSelect?: (row: Row) => void;
        basemap?: string;
        mode?: MapMode;
        height?: number;
        radius?: number;
      }): React.JSX.Element {
        const client = useClient();
        const effectiveBasemap = basemap ?? client.config.basemap;
        const tokens = currentTokens();

        const container = useRef<HTMLDivElement>(null);
        const map = useRef<MapLibreMap | null>(null);
        const overlayRef = useRef<MapboxOverlay | null>(null);
        const [ready, setReady] = useState(false);
        const fitted = useRef(false);

        const onSelectRef = useRef(onSelect);
        onSelectRef.current = onSelect;

        const path = renderPath(rows.length, mode);

        const ext = useMemo(() => (color ? extent(rows, color) : null), [rows, color]);

        const rowById = useMemo(() => {
          const map = new Map<string, Row>();
          for (const r of rows) map.set(r.id, r);
          return map;
        }, [rows]);

        const rowByIdRef = useRef(rowById);
        rowByIdRef.current = rowById;

        const collection = useMemo(() => {
          const base = toFeatureCollection(rows, location, [...(label ? [label] : []), ...(color ? [color] : [])]);
          const features = base.features.map((f) => {
            const r = rowById.get(f.id);
            const c = color && r ? colorRamp(r[color], ext, tokens) : tokens.map.point;
            const l = r ? nameOf(r, label) : f.id;
            return {
              ...f,
              properties: {
                ...f.properties,
                label: l,
                color: c,
              },
            };
          });
          return { type: "FeatureCollection" as const, features };
        }, [rows, location, label, color, ext, tokens, rowById]);

        const pointRows: PointRow[] = useMemo(() => {
          const pts: PointRow[] = [];
          for (const row of rows) {
            const pt = pointOf(row[location]);
            if (!pt) continue;
            const hex = color ? colorRamp(row[color], ext, tokens) : tokens.map.point;
            pts.push({
              position: pt,
              rgb: parseHexColor(hex),
              row,
            });
          }
          return pts;
        }, [rows, location, color, ext, tokens]);

        useEffect(() => {
          let gone = false;
          let instance: MapLibreMap | null = null;

          void mapWorkerReady().then(() => {
            if (gone || !container.current || map.current) return;
            instance = new MapLibreMap({
              container: container.current,
              style: styleFor(effectiveBasemap),
              center: [0, 0],
              zoom: 1,
              canvasContextAttributes: { preserveDrawingBuffer: true },
            });
            map.current = instance;

            instance.on("error", (event) => {
              console.error("jc: map error", event.error?.message ?? event);
            });

            instance.on("load", () => {
              if (gone) return;
              instance!.addSource("jc-rows", {
                type: "geojson",
                data: { type: "FeatureCollection", features: [] },
              });

              instance!.addLayer({
                id: "jc-fill",
                type: "fill",
                source: "jc-rows",
                filter: ["in", ["geometry-type"], ["literal", ["Polygon", "MultiPolygon"]]],
                paint: { "fill-opacity": 0.35, "fill-color": ["get", "color"] },
              });

              instance!.addLayer({
                id: "jc-line",
                type: "line",
                source: "jc-rows",
                filter: ["in", ["geometry-type"], ["literal", ["LineString", "MultiLineString"]]],
                paint: { "line-color": ["get", "color"], "line-width": 2 },
              });

              instance!.addLayer({
                id: "jc-points",
                type: "circle",
                source: "jc-rows",
                filter: ["in", ["geometry-type"], ["literal", ["Point", "MultiPoint"]]],
                paint: {
                  "circle-radius": 6,
                  "circle-color": ["case", ["==", ["get", "id"], selected ?? ""], tokens.map.selected, ["get", "color"]],
                  "circle-stroke-color": tokens.map.stroke,
                  "circle-stroke-width": 1.5,
                },
              });

              const handleClick = (e: { features?: Array<{ properties?: { id?: string } }> }) => {
                const id = e.features?.[0]?.properties?.id;
                if (typeof id === "string") {
                  const r = rowByIdRef.current.get(id);
                  if (r) onSelectRef.current?.(r);
                }
              };

              instance!.on("click", "jc-points", handleClick);
              instance!.on("click", "jc-fill", handleClick);
              instance!.on("click", "jc-line", handleClick);

              setReady(true);
            });
          });

          return () => {
            gone = true;
            if (overlayRef.current && map.current) {
              map.current.removeControl(overlayRef.current as unknown as IControl);
              overlayRef.current = null;
            }
            instance?.remove();
            map.current = null;
          };
        }, []);

        useEffect(() => {
          if (!ready || !map.current) return;
          map.current.setPaintProperty("jc-points", "circle-color", [
            "case",
            ["==", ["get", "id"], selected ?? ""],
            tokens.map.selected,
            ["get", "color"],
          ]);
        }, [ready, selected, tokens.map.selected]);

        useEffect(() => {
          if (!ready || !map.current) return;

          if (path.startsWith("deck-")) {
            const src = map.current.getSource("jc-rows") as GeoJSONSource | undefined;
            src?.setData({ type: "FeatureCollection", features: [] });

            let layer;
            if (path === "deck-points") {
              layer = new ScatterplotLayer({
                id: "jc-scatter",
                data: pointRows,
                getPosition: (d: PointRow) => d.position,
                getFillColor: (d: PointRow) => d.rgb,
                radiusMinPixels: 2,
                radiusMaxPixels: 8,
                pickable: true,
                onClick: (info: { object?: PointRow }) => info.object && onSelectRef.current?.(info.object.row),
              });
            } else if (path === "deck-hexbin") {
              layer = new HexagonLayer({
                id: "jc-hexagon",
                data: pointRows,
                getPosition: (d: PointRow) => d.position,
                radius,
                pickable: true,
                extruded: false,
                colorRange: deckColorRange(tokens),
              });
            } else {
              layer = new GridLayer({
                id: "jc-grid",
                data: pointRows,
                getPosition: (d: PointRow) => d.position,
                cellSize: radius,
                pickable: true,
                colorRange: deckColorRange(tokens),
              });
            }

            if (!overlayRef.current) {
              const overlay = new MapboxOverlay({ interleaved: false, layers: [layer] });
              overlayRef.current = overlay;
              map.current.addControl(overlay as unknown as IControl);
            } else {
              overlayRef.current.setProps({ layers: [layer] });
            }
          } else {
            if (overlayRef.current) {
              map.current.removeControl(overlayRef.current as unknown as IControl);
              overlayRef.current = null;
            }
            const src = map.current.getSource("jc-rows") as GeoJSONSource | undefined;
            src?.setData(collection as GeoJSON.FeatureCollection);
          }

          if (!fitted.current && collection.features.length > 0 && map.current.fitBounds) {
            fitted.current = true;
            // A loop, not Math.min(...xs): spreading 50 000 coordinates overflows the call stack.
            let [west, south, east, north] = [Infinity, Infinity, -Infinity, -Infinity];
            for (const f of collection.features) {
              for (const [x, y] of extractCoordinates(f.geometry)) {
                west = Math.min(west, x);
                south = Math.min(south, y);
                east = Math.max(east, x);
                north = Math.max(north, y);
              }
            }
            if (west <= east) {
              map.current.fitBounds(
                [
                  [west, south],
                  [east, north],
                ],
                { padding: 32, maxZoom: 14, duration: 0 },
              );
            }
          }
        }, [ready, path, collection, pointRows, radius, tokens]);

        const n = path === "maplibre" ? collection.features.length : pointRows.length;
        const chosen = selected ? rowById.get(selected) : null;
        const selectedLabel = chosen ? ` · ${nameOf(chosen, label)}` : "";

        return (
          <div className="jc-map" style={height === undefined ? undefined : { height }}>
            <div className="jc-map-canvas" ref={container} data-testid="jc-map" role="application" aria-label="Map" />
            {!effectiveBasemap && <span className="jc-map-notice">{NO_BASEMAP}</span>}
            {n === 0 && rows.length > 0 ? (
              <span className="jc-map-count">{NO_LOCATIONS}</span>
            ) : (
              <span className="jc-map-count">
                {n} on the map{selectedLabel}
              </span>
            )}
          </div>
        );
      }
    src__components__EntityTable.test.tsx: |
      import { fireEvent, render, screen } from "@testing-library/react";
      import { describe, expect, it, vi } from "vitest";
      import { ProblemError } from "@joinedcontext/sdk";
      import type { Row } from "@joinedcontext/sdk";
      import { EntityTable, defaultColumns } from "./EntityTable";

      const STATIONS: Row[] = [
        {
          id: "urn:ngsi-ld:Station:1",
          type: "Station",
          name: "Kaivopuisto",
          bikes: 10,
          location: { type: "Point", coordinates: [24.95, 60.15] },
        },
        {
          id: "urn:ngsi-ld:Station:2",
          type: "Station",
          name: "Kamppi",
          bikes: 5,
          location: { type: "Point", coordinates: [24.93, 60.17] },
        },
        {
          id: "urn:ngsi-ld:Station:3",
          type: "Station",
          name: "Kallio",
          bikes: 20,
          location: null,
        },
      ];

      describe("defaultColumns", () => {
        it("excludes id, type, @context, and geo columns, and caps at max", () => {
          const cols = defaultColumns(STATIONS, 8);
          expect(cols).toEqual(["name", "bikes"]);
          expect(cols).not.toContain("id");
          expect(cols).not.toContain("type");
          expect(cols).not.toContain("location");

          const capped = defaultColumns(STATIONS, 1);
          expect(capped).toHaveLength(1);
          expect(capped[0]).toBe("name");
        });
      });

      describe("EntityTable", () => {
        // T-3418: the hooks run before any early return, so an empty table keeps what the reader chose.
        it("keeps its sort when a filter empties it and then lets rows back in", () => {
          const view = render(<EntityTable rows={STATIONS} columns={["name", "bikes"]} />);
          fireEvent.click(screen.getByRole("button", { name: /^bikes/ }));
          const bikes = () => screen.getByRole("columnheader", { name: /^bikes/ });
          expect(bikes()).toHaveAttribute("aria-sort", "ascending");
          view.rerender(<EntityTable rows={[]} columns={["name", "bikes"]} />);
          expect(screen.queryByRole("table")).toBeNull();
          view.rerender(<EntityTable rows={STATIONS} columns={["name", "bikes"]} />);
          expect(bikes()).toHaveAttribute("aria-sort", "ascending");
          expect(screen.getAllByRole("row")[1]).toHaveTextContent("Kamppi");
        });

        it("renders Problem state when error is provided", () => {
          const error = new ProblemError(403, { title: "Forbidden", detail: "Read denied" });
          render(<EntityTable rows={[]} error={error} />);
          expect(screen.getByRole("alert")).toBeInTheDocument();
          // A one-word title is a code, not a sentence: the SDK names the refusal and keeps the code's
          // detail out (T-4200).
          expect(screen.getByText("You do not have the right to do this.")).toBeInTheDocument();
          expect(screen.queryByText("Read denied")).not.toBeInTheDocument();
        });

        it("renders Loading state when loading is true and rows are empty", () => {
          render(<EntityTable rows={[]} loading />);
          expect(screen.getByRole("status")).toHaveTextContent("Loading…");
        });

        it("renders Empty state when rows are empty", () => {
          render(<EntityTable rows={[]} empty="No stations found." />);
          expect(screen.getByText("No stations found.")).toBeInTheDocument();
        });

        it("renders columns and handles sort toggling asc/desc with aria-sort", () => {
          render(<EntityTable rows={STATIONS} columns={["name", "bikes"]} />);

          const nameBtn = screen.getByRole("button", { name: "name" });
          const nameTh = nameBtn.closest("th")!;
          expect(nameTh).toHaveAttribute("aria-sort", "none");

          // First click -> asc
          fireEvent.click(nameBtn);
          expect(nameTh).toHaveAttribute("aria-sort", "ascending");
          let cells = screen.getAllByRole("row").slice(1).map((r) => r.children[0].textContent);
          expect(cells).toEqual(["Kaivopuisto", "Kallio", "Kamppi"]);

          // Second click -> desc
          fireEvent.click(nameBtn);
          expect(nameTh).toHaveAttribute("aria-sort", "descending");
          cells = screen.getAllByRole("row").slice(1).map((r) => r.children[0].textContent);
          expect(cells).toEqual(["Kamppi", "Kallio", "Kaivopuisto"]);

          // Third click -> back to asc
          fireEvent.click(nameBtn);
          expect(nameTh).toHaveAttribute("aria-sort", "ascending");
          cells = screen.getAllByRole("row").slice(1).map((r) => r.children[0].textContent);
          expect(cells).toEqual(["Kaivopuisto", "Kallio", "Kamppi"]);
        });

        it("handles pagination and resets page on rows change or sort change", () => {
          const manyRows: Row[] = Array.from({ length: 65 }, (_, i) => ({
            id: `urn:station:${i}`,
            type: "Station",
            name: `Station ${String(i).padStart(2, "0")}`,
          }));

          const { rerender } = render(<EntityTable rows={manyRows} pageSize={50} columns={["name"]} />);

          expect(screen.getByText("Page 1 of 2")).toBeInTheDocument();
          const prevBtn = screen.getByRole("button", { name: "Previous" });
          const nextBtn = screen.getByRole("button", { name: "Next" });

          expect(prevBtn).toBeDisabled();
          expect(nextBtn).not.toBeDisabled();

          // Go to next page
          fireEvent.click(nextBtn);
          expect(screen.getByText("Page 2 of 2")).toBeInTheDocument();
          expect(nextBtn).toBeDisabled();
          expect(prevBtn).not.toBeDisabled();
          fireEvent.click(prevBtn);
          expect(screen.getByText("Page 1 of 2")).toBeInTheDocument();
          fireEvent.click(nextBtn);

          // Sort change resets page to 1
          const nameBtn = screen.getByRole("button", { name: "name" });
          fireEvent.click(nameBtn);
          expect(screen.getByText("Page 1 of 2")).toBeInTheDocument();

          // Advance to page 2 again
          fireEvent.click(nextBtn);
          expect(screen.getByText("Page 2 of 2")).toBeInTheDocument();

          // Changing rows length resets page to 1
          rerender(<EntityTable rows={manyRows.slice(0, 60)} pageSize={50} columns={["name"]} />);
          expect(screen.getByText("Page 1 of 2")).toBeInTheDocument();
        });

        it("handles onSelect on click and Enter, and marks aria-selected", () => {
          const onSelect = vi.fn();
          render(
            <EntityTable
              rows={STATIONS}
              columns={["name"]}
              selected="urn:ngsi-ld:Station:2"
              onSelect={onSelect}
            />,
          );

          const rows = screen.getAllByRole("row").slice(1);
          expect(rows[1]).toHaveAttribute("aria-selected", "true");
          expect(rows[0]).toHaveAttribute("aria-selected", "false");

          fireEvent.click(rows[0]);
          expect(onSelect).toHaveBeenCalledWith(STATIONS[0]);

          fireEvent.keyDown(rows[2], { key: "Enter" });
          expect(onSelect).toHaveBeenCalledWith(STATIONS[2]);
        });
      });
    src__components__EntityTable.tsx: |
      import { useMemo, useRef, useState, type ReactNode } from "react";
      import { columnKind, compare, format } from "@joinedcontext/sdk";
      import type { ProblemError, Row } from "@joinedcontext/sdk";
      import { Empty, Loading, Problem } from "@joinedcontext/sdk";

      export interface ColumnDef<T extends Row = Row> {
        attr: string;
        label?: string;
        render?: (row: T) => ReactNode;
      }

      export function defaultColumns(rows: Row[], max = 8): string[] {
        if (max <= 0) return [];
        const sample = rows.slice(0, 50);
        const seen = new Set<string>();
        const cols: string[] = [];

        for (const row of sample) {
          for (const key of Object.keys(row)) {
            if (key === "id" || key === "type" || key === "@context") continue;
            if (seen.has(key)) continue;
            seen.add(key);
            if (columnKind(sample, key) !== "geo") {
              cols.push(key);
              if (cols.length >= max) return cols;
            }
          }
        }

        return cols;
      }

      export function EntityTable<T extends Row = Row>({
        rows,
        columns,
        pageSize = 50,
        selected = null,
        onSelect,
        initialSort,
        loading = false,
        error = null,
        empty,
        caption,
      }: {
        rows: T[];
        columns?: Array<string | ColumnDef<T>>;
        pageSize?: number;
        selected?: string | null;
        onSelect?: (row: T) => void;
        initialSort?: { attr: string; dir: "asc" | "desc" };
        loading?: boolean;
        error?: ProblemError | Error | null;
        empty?: ReactNode;
        caption?: string;
      }): React.JSX.Element {
        const resolvedColumns = useMemo<ColumnDef<T>[]>(() => {
          const raw = columns ?? defaultColumns(rows);
          return raw.map((c) => (typeof c === "string" ? { attr: c, label: c } : c));
        }, [columns, rows]);

        const colKinds = useMemo(() => {
          const map: Record<string, string> = {};
          for (const col of resolvedColumns) {
            map[col.attr] = columnKind(rows, col.attr);
          }
          return map;
        }, [resolvedColumns, rows]);

        const [sort, setSort] = useState<{ attr: string; dir: "asc" | "desc" } | null>(initialSort ?? null);
        const [page, setPage] = useState(1);

        const prevLenRef = useRef(rows.length);
        if (prevLenRef.current !== rows.length) {
          prevLenRef.current = rows.length;
          if (page !== 1) {
            setPage(1);
          }
        }

        const toggleSort = (attr: string) => {
          setSort((prev) => {
            if (prev?.attr === attr) {
              return { attr, dir: prev.dir === "asc" ? "desc" : "asc" };
            }
            return { attr, dir: "asc" };
          });
          setPage(1);
        };

        const sorted = useMemo(() => {
          if (!sort) return rows;
          return [...rows].sort((a, b) => compare(a, b, sort.attr, sort.dir));
        }, [rows, sort]);

        const totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));
        const safePage = Math.min(page, totalPages);

        const pagedRows = useMemo(() => {
          const start = (safePage - 1) * pageSize;
          return sorted.slice(start, start + pageSize);
        }, [sorted, safePage, pageSize]);

        // After every hook (T-3418): React keeps no hook state across a render that called none, so an
        // early return above them forgot the sort and the page whenever a filter emptied the table.
        if (error) {
          return <Problem error={error} />;
        }

        if (loading && rows.length === 0) {
          return <Loading />;
        }

        if (rows.length === 0) {
          return <Empty>{empty}</Empty>;
        }

        return (
          <div className="jc-table-wrap">
            {/* The roles are spelled out: the narrow layout sets display on the table's parts, and
                some screen readers drop table semantics with it. */}
            <table className="jc-table" role="table">
              {caption && <caption>{caption}</caption>}
              <thead>
                <tr role="row">
                  {resolvedColumns.map((col) => {
                    const isNum = colKinds[col.attr] === "number";
                    const sortDir = sort?.attr === col.attr ? (sort.dir === "asc" ? "ascending" : "descending") : "none";
                    return (
                      <th
                        key={col.attr}
                        role="columnheader"
                        scope="col"
                        aria-sort={sortDir}
                        className={isNum ? "jc-num" : undefined}
                      >
                        <button type="button" onClick={() => toggleSort(col.attr)}>
                          {col.label ?? col.attr}
                          {/* aria-sort says the direction; the arrow is for the eye. */}
                          {sort?.attr === col.attr && <span aria-hidden="true">{sort.dir === "asc" ? " ▲" : " ▼"}</span>}
                        </button>
                      </th>
                    );
                  })}
                </tr>
              </thead>
              <tbody>
                {pagedRows.map((row) => (
                  <tr
                    key={row.id}
                    role="row"
                    aria-selected={row.id === selected}
                    tabIndex={onSelect ? 0 : undefined}
                    onClick={() => onSelect?.(row)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") onSelect?.(row);
                    }}
                  >
                    {resolvedColumns.map((col) => {
                      const kind = colKinds[col.attr] as "number" | "date" | "geo" | "text";
                      return (
                        <td
                          key={col.attr}
                          role="cell"
                          className={kind === "number" ? "jc-num" : undefined}
                          data-label={col.label ?? col.attr}
                        >
                          {col.render ? col.render(row) : format(row[col.attr], kind)}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
            {totalPages > 1 && (
              <div className="jc-pager">
                <button
                  type="button"
                  disabled={safePage === 1}
                  onClick={() => setPage((p) => Math.max(1, p - 1))}
                >
                  Previous
                </button>
                <span>
                  Page {safePage} of {totalPages}
                </span>
                <button
                  type="button"
                  disabled={safePage >= totalPages}
                  onClick={() => setPage((p) => Math.min(totalPages, p + 1))}
                >
                  Next
                </button>
              </div>
            )}
          </div>
        );
      }
    src__components__components.css: |
      /* The components' classes, over the token variables the SDK sets from design-tokens.json. Phone
         first (T-2777, UI-84): each view works from 375 px up, and widens by the room it is given. */

      /* The page is the app: no margin around the shell, so a framed app has one scrollbar, the frame's. */
      body {
        margin: 0;
      }

      .jc-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: var(--jc-font-body, "Inter", system-ui, -apple-system, "Segoe UI", sans-serif);
        color: var(--jc-color-ink, #0f172a);
        background: var(--jc-color-surface, #ffffff);
        font-size: var(--jc-font-size-md, 0.875rem);
        line-height: 1.5;
      }

      .jc-shell *, .jc-shell *::before, .jc-shell *::after {
        box-sizing: border-box;
      }

      .jc-header {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-header h1 {
        margin: 0;
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
      }

      /* Many pages scroll sideways on a phone rather than pushing the page wider than the screen. */
      .jc-header nav {
        display: flex;
        gap: var(--jc-space-1, 0.25rem);
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .jc-header nav button {
        all: unset;
        flex: none;
        cursor: pointer;
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 2px solid transparent;
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-header nav button[aria-current="page"] {
        color: var(--jc-color-accent, #0f766e);
        border-bottom-color: var(--jc-color-accent, #0f766e);
      }

      .jc-user {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-main {
        flex: 1;
        padding: var(--jc-space-4, 1rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--jc-space-4, 1rem);
        align-content: start;
      }

      .jc-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: var(--jc-space-3, 0.75rem);
      }

      .jc-tile {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-tile-label {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-tile-value {
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-table-wrap {
        container-type: inline-size;
        overflow-x: auto;
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
        background: var(--jc-color-surface, #ffffff);
      }

      .jc-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      .jc-table th {
        position: sticky;
        top: 0;
        background: var(--jc-color-card, #f8fafc);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        font-size: var(--jc-font-size-sm, 0.75rem);
        font-weight: 600;
      }

      .jc-table th button {
        all: unset;
        cursor: pointer;
        font: inherit;
        color: inherit;
        display: inline-flex;
        align-items: center;
        gap: var(--jc-space-1, 0.25rem);
      }

      .jc-table td {
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-table tbody tr:nth-child(even) {
        background: var(--jc-color-card, #f8fafc);
      }

      .jc-table tbody tr[aria-selected="true"] {
        background: color-mix(in srgb, var(--jc-color-accent, #0f766e) 15%, transparent);
      }

      .jc-table tbody tr[tabindex="0"] {
        cursor: pointer;
      }

      .jc-num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .jc-pager {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--jc-space-3, 0.75rem);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        border-top: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-detail {
        padding: var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-detail header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--jc-space-3, 0.75rem);
      }

      .jc-detail header h2 {
        margin: 0;
        font-size: var(--jc-font-size-lg, 1rem);
      }

      .jc-detail dl {
        display: grid;
        grid-template-columns: minmax(0, max-content) minmax(0, 1fr);
        gap: var(--jc-space-2, 0.5rem) var(--jc-space-4, 1rem);
        margin: 0;
      }

      .jc-detail dt {
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-detail dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .jc-filterbar {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: var(--jc-space-3, 0.75rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-filter {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        font-size: var(--jc-font-size-sm, 0.75rem);
      }

      .jc-filter span {
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-count {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        align-self: center;
      }

      .jc-form {
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-3, 0.75rem);
        max-width: 120rem;
      }

      /* One column on a phone, two from 40rem of the form's own width, three from 100rem (a form at
         1800 px and wider). */
      .jc-form-fields {
        display: grid;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }

      @container (width >= 40rem) {
        .jc-form-fields {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @container (width >= 100rem) {
        .jc-form-fields {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .jc-field {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
      }

      .jc-field span {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      /* One input per language of a LanguageProperty, stacked under the field's name. */
      .jc-field .jc-languages {
        display: grid;
        gap: var(--jc-space-1, 0.25rem);
        font-size: inherit;
        color: inherit;
        font-weight: inherit;
      }

      .jc-field-error {
        margin: 0;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-danger, #dc2626);
      }

      /* The form's buttons sit on one line, Save last. Without this the row was two stacked
         full-width buttons, which read as two unrelated actions (T-1060). */
      .jc-form-actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--jc-space-2, 0.5rem);
      }

      .jc-export {
        display: inline-flex;
        gap: var(--jc-space-2, 0.5rem);
      }

      .jc-chart {
        margin: 0;
        padding: var(--jc-space-3, 0.75rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-chart figcaption {
        font-weight: 600;
        margin-bottom: var(--jc-space-2, 0.5rem);
      }

      /* Its height follows its width, within what a screen can show; a `height` prop overrides it. */
      .jc-chart-canvas {
        width: 100%;
        aspect-ratio: 16 / 10;
        min-height: 14rem;
        max-height: 28rem;
      }

      /* The map fills the width; its height follows the window unless a `height` prop sets it. */
      .jc-map {
        height: clamp(18rem, 60vh, 44rem);
        position: relative;
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
        overflow: hidden;
      }

      .jc-map-canvas {
        position: absolute;
        inset: 0;
      }

      .jc-map-notice, .jc-map-count {
        position: absolute;
        z-index: 1;
        padding: var(--jc-space-1, 0.25rem) var(--jc-space-2, 0.5rem);
        border-radius: var(--jc-radius-sm, 4px);
        font-size: var(--jc-font-size-sm, 0.75rem);
        background: var(--jc-color-surface, #ffffff);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-map-notice {
        top: var(--jc-space-2, 0.5rem);
        left: var(--jc-space-2, 0.5rem);
      }

      .jc-map-count {
        bottom: var(--jc-space-2, 0.5rem);
        left: var(--jc-space-2, 0.5rem);
      }

      .jc-loading, .jc-empty {
        padding: var(--jc-space-4, 1rem);
        color: var(--jc-color-muted, #64748b);
        font-size: var(--jc-font-size-md, 0.875rem);
        text-align: center;
      }

      .jc-problem {
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        border-left: 4px solid var(--jc-color-danger, #dc2626);
        background: var(--jc-color-card, #f8fafc);
        border-radius: var(--jc-radius-sm, 4px);
      }

      .jc-problem strong {
        display: block;
        color: var(--jc-color-danger, #dc2626);
      }

      .jc-problem p {
        margin: var(--jc-space-1, 0.25rem) 0 0;
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-shell button, .jc-shell input, .jc-shell select {
        font: inherit;
        border-radius: var(--jc-radius-sm, 4px);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        padding: var(--jc-space-1, 0.25rem) var(--jc-space-2, 0.5rem);
        background: var(--jc-color-surface, #ffffff);
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-shell button {
        cursor: pointer;
      }

      .jc-shell button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .jc-shell button:focus-visible, .jc-shell input:focus-visible, .jc-shell select:focus-visible {
        outline: 2px solid var(--jc-color-accent, #0f766e);
        outline-offset: 1px;
      }

      /* A table narrower than 36rem shows each row as a card of label and value; the header row stays,
         as a line of sort buttons, so sorting still works. */
      @container (width < 36rem) {
        .jc-table,
        .jc-table tbody,
        .jc-table tr,
        .jc-table td {
          display: block;
        }
        .jc-table thead tr {
          display: flex;
          flex-wrap: wrap;
          gap: var(--jc-space-1, 0.25rem);
          padding: var(--jc-space-2, 0.5rem);
          background: var(--jc-color-card, #f8fafc);
          border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        }
        .jc-table thead th {
          position: static;
          padding: 0;
          border: none;
          background: transparent;
        }
        .jc-table thead th button {
          padding: var(--jc-space-1, 0.25rem) var(--jc-space-2, 0.5rem);
          border: 1px solid var(--jc-color-line, #e2e8f0);
          border-radius: var(--jc-radius-sm, 4px);
        }
        .jc-table tbody tr {
          padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
          border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        }
        .jc-table td {
          display: grid;
          grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
          gap: var(--jc-space-2, 0.5rem);
          padding: var(--jc-space-1, 0.25rem) 0;
          border: none;
          text-align: left;
          overflow-wrap: anywhere;
        }
        .jc-table td::before {
          content: attr(data-label);
          color: var(--jc-color-muted, #64748b);
          font-size: var(--jc-font-size-sm, 0.75rem);
          font-weight: 500;
        }
      }

      /* A finger, or a phone's width: every control at least 44 px tall, the map's buttons 44 px square. */
      @media (pointer: coarse), (width < 40rem) {
        .jc-shell :is(button, select, input:not([type="checkbox"], [type="radio"])),
        .jc-header nav button {
          min-height: var(--jc-target, 2.75rem);
        }
        .jc-header nav button {
          display: inline-flex;
          align-items: center;
        }
        .jc-table thead th button {
          display: inline-flex;
          align-items: center;
          min-height: var(--jc-target, 2.75rem);
        }
        .jc-map .maplibregl-ctrl-group button {
          width: var(--jc-target, 2.75rem);
          height: var(--jc-target, 2.75rem);
        }
      }

      @media (max-width: 40rem) {
        .jc-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .jc-header nav {
          width: 100%;
        }
        .jc-detail dl {
          grid-template-columns: minmax(0, 1fr);
        }
        .jc-detail dd {
          margin-bottom: var(--jc-space-2, 0.5rem);
        }
        .jc-filterbar {
          flex-direction: column;
          align-items: stretch;
        }
        .jc-count {
          margin-left: 0;
        }
      }
    src__components__filters.test.tsx: |
      import { fireEvent, render, screen } from "@testing-library/react";
      import { describe, expect, it } from "vitest";
      import { useFilters } from "@joinedcontext/sdk";
      import type { FilterDef, Row } from "@joinedcontext/sdk";
      import {
        DateRangeFilter,
        FilterBar,
        RangeFilter,
        SearchBox,
        SelectFilter,
      } from "./filters";

      const SAMPLE_ROWS: Row[] = [
        { id: "urn:1", type: "Station", name: "Kamppi", bikes: 5, status: "active", registered: "2024-05-09T10:00:00Z" },
        { id: "urn:2", type: "Station", name: "Kaivopuisto", bikes: 10, status: "inactive", registered: "2024-05-10T18:30:00Z" },
        { id: "urn:3", type: "Station", name: "Kallio", bikes: 20, status: "active", registered: "2024-05-11T09:00:00Z" },
      ];

      function TestHarness({
        rows = SAMPLE_ROWS,
        filters,
      }: {
        rows?: Row[];
        filters: FilterDef[];
      }) {
        const { shown, bind, reset } = useFilters(rows, filters);

        return (
          <div>
            <FilterBar onReset={reset} shown={shown.length} total={rows.length}>
              {filters.map((f, i) => {
                if (f.kind === "search") return <SearchBox key={i} binding={bind(i)} placeholder="Search..." />;
                if (f.kind === "select") return <SelectFilter key={i} binding={bind(i)} />;
                if (f.kind === "range") return <RangeFilter key={i} binding={bind(i)} />;
                if (f.kind === "dateRange") return <DateRangeFilter key={i} binding={bind(i)} />;
                return null;
              })}
            </FilterBar>
            <ul data-testid="results">
              {shown.map((r) => (
                <li key={r.id}>{String(r.name)}</li>
              ))}
            </ul>
          </div>
        );
      }

      describe("Filter UI components with useFilters", () => {
        it("SearchBox narrows results and clearing restores them", () => {
          const filters: FilterDef[] = [{ kind: "search", attrs: ["name"] }];
          render(<TestHarness filters={filters} />);

          expect(screen.getByText("3 of 3")).toBeInTheDocument();
          const input = screen.getByPlaceholderText("Search...");

          fireEvent.change(input, { target: { value: "Kamppi" } });
          expect(screen.getByText("1 of 3")).toBeInTheDocument();
          expect(screen.getByText("Kamppi")).toBeInTheDocument();
          expect(screen.queryByText("Kaivopuisto")).not.toBeInTheDocument();

          fireEvent.change(input, { target: { value: "" } });
          expect(screen.getByText("3 of 3")).toBeInTheDocument();
        });

        it("SelectFilter lists distinct values and 'All' resets selection", () => {
          const filters: FilterDef[] = [{ kind: "select", attr: "status" }];
          render(<TestHarness filters={filters} />);

          const select = screen.getByRole("combobox") as HTMLSelectElement;
          expect(select.options).toHaveLength(3); // All, active, inactive
          expect(select.options[0].text).toBe("All");

          fireEvent.change(select, { target: { value: "inactive" } });
          expect(screen.getByText("1 of 3")).toBeInTheDocument();
          expect(screen.getByText("Kaivopuisto")).toBeInTheDocument();

          fireEvent.change(select, { target: { value: "" } });
          expect(screen.getByText("3 of 3")).toBeInTheDocument();
        });

        it("RangeFilter supports open bounds on either side", () => {
          const filters: FilterDef[] = [{ kind: "range", attr: "bikes" }];
          render(<TestHarness filters={filters} />);

          const fromInput = screen.getByLabelText("bikes from");
          const toInput = screen.getByLabelText("bikes to");

          // Open upper bound: from 10, to blank
          fireEvent.change(fromInput, { target: { value: "10" } });
          expect(screen.getByText("2 of 3")).toBeInTheDocument();
          expect(screen.getByText("Kaivopuisto")).toBeInTheDocument();
          expect(screen.getByText("Kallio")).toBeInTheDocument();

          // Open lower bound: from blank, to 10
          fireEvent.change(fromInput, { target: { value: "" } });
          fireEvent.change(toInput, { target: { value: "10" } });
          expect(screen.getByText("2 of 3")).toBeInTheDocument();
          expect(screen.getByText("Kamppi")).toBeInTheDocument();
          expect(screen.getByText("Kaivopuisto")).toBeInTheDocument();

          // Both blank resets
          fireEvent.change(toInput, { target: { value: "" } });
          expect(screen.getByText("3 of 3")).toBeInTheDocument();
        });

        it("DateRangeFilter includes the whole 'to' day and displays first 10 characters", () => {
          const filters: FilterDef[] = [{ kind: "dateRange", attr: "registered" }];
          render(<TestHarness filters={filters} />);

          const toInput = screen.getByLabelText("registered to") as HTMLInputElement;

          // Row 2 is 2024-05-10T18:30:00Z; setting to "2024-05-10" includes it via T23:59:59.999Z
          fireEvent.change(toInput, { target: { value: "2024-05-10" } });

          expect(screen.getByText("2 of 3")).toBeInTheDocument();
          expect(screen.getByText("Kamppi")).toBeInTheDocument();
          expect(screen.getByText("Kaivopuisto")).toBeInTheDocument();
          expect(screen.queryByText("Kallio")).not.toBeInTheDocument();

          expect(toInput.value).toBe("2024-05-10");

          // From the 10th: only Kaivopuisto is left; both cleared, every station is back.
          const fromInput = screen.getByLabelText("registered from") as HTMLInputElement;
          fireEvent.change(fromInput, { target: { value: "2024-05-10" } });
          expect(screen.getByText("1 of 3")).toBeInTheDocument();
          fireEvent.change(fromInput, { target: { value: "" } });
          fireEvent.change(toInput, { target: { value: "" } });
          expect(screen.getByText("3 of 3")).toBeInTheDocument();
        });

        it("FilterBar displays count and Reset button restores all rows", () => {
          const filters: FilterDef[] = [{ kind: "search", attrs: ["name"] }];
          render(<TestHarness filters={filters} />);

          const input = screen.getByPlaceholderText("Search...");
          fireEvent.change(input, { target: { value: "Kamppi" } });
          expect(screen.getByText("1 of 3")).toBeInTheDocument();

          const resetBtn = screen.getByRole("button", { name: "Reset" });
          fireEvent.click(resetBtn);

          expect(screen.getByText("3 of 3")).toBeInTheDocument();
        });

        it("throws when a binding does not match component expectation", () => {
          const searchBinding = {
            def: { kind: "search" as const, attrs: ["name"] },
            rows: [],
            value: undefined,
            onChange: () => {},
          };
          const selectBinding = {
            def: { kind: "select" as const, attr: "status" },
            rows: [],
            value: undefined,
            onChange: () => {},
          };

          expect(() => render(<SearchBox binding={selectBinding as never} />)).toThrow(
            "SearchBox needs a search filter",
          );
          expect(() => render(<SelectFilter binding={searchBinding as never} />)).toThrow(
            "SelectFilter needs a select filter",
          );
          expect(() => render(<RangeFilter binding={searchBinding as never} />)).toThrow(
            "RangeFilter needs a range filter",
          );
          expect(() => render(<DateRangeFilter binding={searchBinding as never} />)).toThrow(
            "DateRangeFilter needs a dateRange filter",
          );
        });
      });
    src__components__filters.tsx: |
      import type { ReactNode } from "react";
      import { distinct, extent } from "@joinedcontext/sdk";
      import type { FilterBinding } from "@joinedcontext/sdk";

      export function FilterBar({
        children,
        onReset,
        shown,
        total,
      }: {
        children?: ReactNode;
        onReset?: () => void;
        shown?: number;
        total?: number;
      }): React.JSX.Element {
        return (
          <div className="jc-filterbar" role="search">
            {children}
            {shown !== undefined && total !== undefined && (
              <span className="jc-count">
                {shown} of {total}
              </span>
            )}
            {onReset && (
              <button type="button" onClick={onReset}>
                Reset
              </button>
            )}
          </div>
        );
      }

      export function SearchBox({
        binding,
        placeholder,
      }: {
        binding: FilterBinding;
        placeholder?: string;
      }): React.JSX.Element {
        if (binding.def.kind !== "search") {
          throw new Error("SearchBox needs a search filter");
        }
        const label = binding.def.label ?? "Search";
        const val = typeof binding.value === "string" ? binding.value : "";
        return (
          <label className="jc-filter">
            <span>{label}</span>
            <input
              type="search"
              placeholder={placeholder}
              value={val}
              onChange={(e) => binding.onChange(e.target.value === "" ? undefined : e.target.value)}
            />
          </label>
        );
      }

      export function SelectFilter({
        binding,
        allLabel,
      }: {
        binding: FilterBinding;
        allLabel?: string;
      }): React.JSX.Element {
        if (binding.def.kind !== "select") {
          throw new Error("SelectFilter needs a select filter");
        }
        const label = binding.def.label ?? binding.def.attr;
        const val = typeof binding.value === "string" ? binding.value : "";
        const options = distinct(binding.rows, binding.def.attr).slice(0, 200);
        return (
          <label className="jc-filter">
            <span>{label}</span>
            <select
              value={val}
              onChange={(e) => binding.onChange(e.target.value === "" ? undefined : e.target.value)}
            >
              <option value="">{allLabel ?? "All"}</option>
              {options.map((opt) => (
                <option key={opt} value={opt}>
                  {opt}
                </option>
              ))}
            </select>
          </label>
        );
      }

      export function RangeFilter({ binding }: { binding: FilterBinding }): React.JSX.Element {
        if (binding.def.kind !== "range") {
          throw new Error("RangeFilter needs a range filter");
        }
        const label = binding.def.label ?? binding.def.attr;
        const ext = extent(binding.rows, binding.def.attr);
        const arr = Array.isArray(binding.value) ? binding.value : undefined;
        const fromVal = arr && typeof arr[0] === "number" && arr[0] !== -Infinity ? String(arr[0]) : "";
        const toVal = arr && typeof arr[1] === "number" && arr[1] !== Infinity ? String(arr[1]) : "";

        const update = (nextFrom: string, nextTo: string) => {
          const trimmedFrom = nextFrom.trim();
          const trimmedTo = nextTo.trim();
          if (trimmedFrom === "" && trimmedTo === "") {
            binding.onChange(undefined);
          } else {
            const min = trimmedFrom === "" ? -Infinity : Number(trimmedFrom);
            const max = trimmedTo === "" ? Infinity : Number(trimmedTo);
            binding.onChange([min, max]);
          }
        };

        return (
          <label className="jc-filter">
            <span>{label}</span>
            <input
              type="number"
              aria-label={`${label} from`}
              placeholder={ext ? String(ext[0]) : undefined}
              value={fromVal}
              onChange={(e) => update(e.target.value, toVal)}
            />
            <input
              type="number"
              aria-label={`${label} to`}
              placeholder={ext ? String(ext[1]) : undefined}
              value={toVal}
              onChange={(e) => update(fromVal, e.target.value)}
            />
          </label>
        );
      }

      export function DateRangeFilter({ binding }: { binding: FilterBinding }): React.JSX.Element {
        if (binding.def.kind !== "dateRange") {
          throw new Error("DateRangeFilter needs a dateRange filter");
        }
        const label = binding.def.label ?? binding.def.attr;
        const arr = Array.isArray(binding.value) ? binding.value : undefined;
        const fromVal = arr && typeof arr[0] === "string" ? arr[0] : "";
        const toRaw = arr && typeof arr[1] === "string" ? arr[1] : "";
        const toVal = toRaw ? toRaw.slice(0, 10) : "";

        const update = (nextFrom: string, nextToDate: string) => {
          const trimmedFrom = nextFrom.trim();
          const trimmedTo = nextToDate.trim();
          if (trimmedFrom === "" && trimmedTo === "") {
            binding.onChange(undefined);
          } else {
            const toSent = trimmedTo !== "" ? `${trimmedTo}T23:59:59.999Z` : "";
            binding.onChange([trimmedFrom, toSent]);
          }
        };

        return (
          <label className="jc-filter">
            <span>{label}</span>
            <input
              type="date"
              aria-label={`${label} from`}
              value={fromVal}
              onChange={(e) => update(e.target.value, toVal)}
            />
            <input
              type="date"
              aria-label={`${label} to`}
              value={toVal}
              onChange={(e) => update(fromVal, e.target.value)}
            />
          </label>
        );
      }
