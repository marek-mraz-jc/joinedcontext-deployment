      export function themed<T extends { color?: Record<string, string> }>(tokens: T, dark: boolean): T {
        return dark ? { ...tokens, color: { ...tokens.color, ...DARK } } : tokens;
      }

      /** Whether the reader's system asks for a dark page. */
      export function prefersDark(): boolean {
        return typeof window !== "undefined" && typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches;
      }
    src__url.ts: |
      import { useCallback, useState } from "react";

      /** The page's filters, kept in the address so a reload or a shared link shows the same view. */
      export function readParams(search: string): URLSearchParams {
        return new URLSearchParams(search);
      }

      /** `params` written back into the address, keeping its path and its `#page`; a sandbox that refuses is ignored. */
      export function writeParams(params: URLSearchParams): void {
        try {
          const query = params.toString();
          window.history.replaceState(null, "", `${window.location.pathname}${query ? `?${query}` : ""}${window.location.hash}`);
        } catch {
          // A sandboxed preview may refuse to touch the address; the view still changes.
        }
      }

      /** One parameter of the address as state: read once, written on every change; `""` removes it. */
      export function useParam(name: string, fallback = ""): [string, (value: string) => void] {
        const [value, setValue] = useState(() => readParams(window.location.search).get(name) ?? fallback);
        const set = useCallback(
          (next: string) => {
            setValue(next);
            const params = readParams(window.location.search);
            if (next === "" || next === fallback) params.delete(name);
            else params.set(name, next);
            writeParams(params);
          },
          [name, fallback],
        );
        return [value, set];
      }

      /** A comma-separated list in the address, as a set of ids. */
      export function listOf(value: string): string[] {
        return value.split(",").map((part) => part.trim()).filter(Boolean);
      }
    test-setup.ts: |
      import "@testing-library/jest-dom/vitest";
      import { configure } from "@testing-library/react";
      import { afterAll } from "vitest";
      import { recordControls } from "@joinedcontext/sdk/testing";
      // The module as the build lane binds it into wasm/pkg (builder/build-wasm.sh, or `pnpm wasm`),
      // loaded once: jsdom has no worker, so the page calls it in place, and every test runs the real
      // WebAssembly. Vite inlines its bytes, so no file is read and no network is asked.
      import wasm from "./wasm/pkg/event_day_planner_bg.wasm?url&inline";
      import { initSync } from "./wasm/pkg/event_day_planner.js";

      initSync({ module: Uint8Array.from(atob(wasm.slice(wasm.indexOf(",") + 1)), (c) => c.charCodeAt(0)) });

      // The Apps' coverage gate reads which controls the tests rendered and which they exercised (T-3373).
      recordControls(afterAll);

      // ci-full runs every App's suite under v8 coverage, where the library's 1 s default for
      // findBy*/waitFor gives way: a different test missed it on each run (T-4350, as ui/tests/setup.ts).
      configure({ asyncUtilTimeout: 5_000 });
