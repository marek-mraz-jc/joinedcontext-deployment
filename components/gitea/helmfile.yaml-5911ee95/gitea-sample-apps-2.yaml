    src__components__ChartCard.tsx: |
      import type { ReactNode } from "react";
      import { useEffect, useRef } from "react";
      import * as echarts from "echarts/core";
      import { BarChart, LineChart, ScatterChart } from "echarts/charts";
      import { GridComponent, LegendComponent, MarkLineComponent, TooltipComponent } from "echarts/components";
      import { CanvasRenderer } from "echarts/renderers";

      // Only the charts and parts the app draws: the whole library would triple the bundle.
      echarts.use([BarChart, LineChart, ScatterChart, GridComponent, LegendComponent, MarkLineComponent, TooltipComponent, CanvasRenderer]);
      import { currentTokens, echartsTheme } from "@joinedcontext/sdk";
      import type { ProblemError } from "@joinedcontext/sdk";
      import { Empty, Loading, Problem } from "@joinedcontext/sdk";

      /** One ECharts chart with a caption, in the SDK's theme; the loading, error and empty states in its place. */
      export function ChartCard({
        title,
        option,
        height = 280,
        loading,
        error,
        empty,
        loadingLabel,
        onSelect,
      }: {
        title: string;
        option: Record<string, unknown> | null;
        height?: number;
        loading?: boolean;
        error?: ProblemError | Error | null;
        empty?: ReactNode;
        /** What the card says while the data is read, in the page's language. */
        loadingLabel?: string;
        /** Called with the category of the bar a person clicks. */
        onSelect?: (name: string) => void;
      }): React.JSX.Element {
        const containerRef = useRef<HTMLDivElement | null>(null);
        const chartRef = useRef<echarts.ECharts | null>(null);
        const showCanvas = !error && !loading && option !== null;
        const onSelectRef = useRef(onSelect);
        onSelectRef.current = onSelect;

        useEffect(() => {
          const el = containerRef.current;
          if (!showCanvas || !el) return;
          const chart = echarts.init(el, echartsTheme(currentTokens()), { renderer: "canvas" });
          chartRef.current = chart;
          chart.on("click", (params: unknown) => {
            const name = (params as { name?: unknown }).name;
            if (name !== undefined) onSelectRef.current?.(String(name));
          });
          const observer = typeof ResizeObserver === "undefined" ? undefined : new ResizeObserver(() => chart.resize());
          observer?.observe(el);
          return () => {
            observer?.disconnect();
            chart.dispose();
            chartRef.current = null;
          };
        }, [showCanvas]);

        useEffect(() => {
          if (chartRef.current && option) chartRef.current.setOption(option, true);
        }, [option, showCanvas]);

        return (
          <figure className="jc-chart">
            <figcaption>{title}</figcaption>
            {error ? (
              <Problem error={error} />
            ) : loading ? (
              <Loading label={loadingLabel} />
            ) : option === null ? (
              <Empty>{empty ?? "Nothing to chart yet."}</Empty>
            ) : (
              <div className="jc-chart-canvas" role="img" aria-label={title} style={{ height }} ref={containerRef} />
            )}
          </figure>
        );
      }
    src__components__FeaturedCard.tsx: |
      import { useState } from "react";
      import { Card, Empty, Loading } from "@joinedcontext/sdk";
      import type { Row } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { localOf, nameOf } from "../events";
      import type { Featured } from "../featured";
      import type { Lang } from "../i18n";
      import { t } from "../texts";
      import { problemText } from "./ShareDay";

      interface Props {
        lang: Lang;
        featured: Featured;
        /** The events of the day shown, by their full id: a featured one among them can be picked. */
        ofDay: Map<string, Row>;
        /** Every event read, by full id, for the names of featured events on other days. */
        known: Map<string, Row>;
        picks: string[];
        onToggle: (local: string) => void;
      }

      /**
       * The events a steward recommends, for every visitor: each picked into the day like any other.
       * A steward notes and removes them here, and features one from the list of the day's events.
       */
      export function FeaturedCard({ lang, featured, ofDay, known, picks, onToggle }: Props) {
        const { steward } = useAccess();
        // By event: a note typed while the server still features the event (id -1) keeps its draft.
        const [notes, setNotes] = useState<Record<string, string>>({});
        const [message, setMessage] = useState<{ text: string; error: boolean } | null>(null);
        const [busy, setBusy] = useState(false);

        const run = async (work: () => Promise<void>, done: string, failure: "noteFailed" | "unfeatureFailed") => {
          setBusy(true);
          setMessage(null);
          try {
            await work();
            setMessage({ text: done, error: false });
          } catch (error) {
            setMessage({ text: problemText(lang, error, failure, "gone"), error: true });
          } finally {
            setBusy(false);
          }
        };

        const list = featured.list;
        return (
          <Card title={t(lang, "featuredTitle")}>
            {!steward && <p className="app-lead">{t(lang, "featuredWho")}</p>}
            <p role="status" aria-live="polite" className={message?.error ? "app-error" : "app-lead"}>
              {message?.text ?? (featured.failed ? problemText(lang, featured.failed, "featureFailed") : "")}
            </p>
            {list === null ? (
              <Loading label={t(lang, "featuredLoading")} />
            ) : list.length === 0 ? (
