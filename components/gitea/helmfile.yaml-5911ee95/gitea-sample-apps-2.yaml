    map-worker.ts: |
      // The map's worker, for the built application only. MapLibre looks for its worker beside its own
      // script, and a Vite build has no such file, so the map would never draw; this bundles the worker
      // with the library's shared chunk and hands the library its address. index.html loads it before
      // the application. The Portal's preview builds its own document and inlines the worker instead
      // (the SDK's mapWorkerReady), so it never loads this file.
      import { setWorkerUrl } from "maplibre-gl";
      import mapWorker from "maplibre-gl/dist/maplibre-gl-worker.mjs?worker&url";

      setWorkerUrl(mapWorker);
    migrations__0001_plans.sql: |
      -- The saved rebalancing plans and the routes a van actually drove (T-3346). The reconciler runs
      -- this as the schema's owner at publish; the App itself never runs DDL (ADR-N-044 §2.3). Every
      -- statement may run again and change nothing.
      create table if not exists plans (
          id bigserial primary key,
          -- Who the plan is for: a van or a crew, as the operator names it. A label, not an account.
          operator text not null check (length(operator) between 1 and 60),
          van_capacity integer not null check (van_capacity between 1 and 200),
          -- The station the van starts at, the stations added to and left out of the route.
          start_station text,
          include jsonb not null default '[]',
          exclude jsonb not null default '[]',
          -- The stops as the planner made them from the counts read at `created_at`.
          stops jsonb not null,
          km double precision not null check (km >= 0),
          moved integer not null check (moved >= 0),
          -- The route sheet under the App's prefix, `sheets/{id}.csv`.
          sheet text,
          created_at timestamptz not null default now()
      );
      create index if not exists plans_operator on plans (operator, id desc);

      create table if not exists drives (
          id bigserial primary key,
          plan_id bigint not null references plans (id) on delete cascade,
          -- The station ids in the order the van reached them, a subset of the plan's stops.
          stops jsonb not null,
          km double precision check (km is null or km between 0 and 2000),
          note text check (note is null or length(note) <= 500),
          driven_at timestamptz not null default now()
      );
      create index if not exists drives_plan on drives (plan_id, id desc);
    migrations__0002_roles.sql: |
      -- Roles and edits (T-3826, API/07): a plan and a drive belong to the person who saved them, the
      -- planner's levels are one row a steward changes for everyone, and every change leaves a row in
      -- app_audit. Every statement may run again and change nothing.
      alter table plans add column if not exists owner_id text not null default '';
      alter table drives add column if not exists owner_id text not null default '';
      create index if not exists plans_owner on plans (owner_id, id desc);

      -- The shares of a station's places the planner reads: below `low` it is about to run empty, above
      -- `high` about to be full, and the van brings it back to `target`.
      create table if not exists levels (
          id bigint primary key check (id = 1),
          owner_id text not null default '',
          low double precision not null,
          high double precision not null,
          target double precision not null,
          check (0 <= low and low < target and target < high and high <= 1)
      );
      insert into levels (id, low, high, target) values (1, 0.15, 0.85, 0.5) on conflict (id) do nothing;

      -- jc_app_sdk::access::AUDIT_TABLE
      create table if not exists app_audit (
          id bigserial primary key,
          at timestamptz not null default now(),
          actor_id text not null,
          actor_name text not null,
          action text not null check (action in ('insert', 'update', 'delete', 'edit')),
          target text not null,
          summary text not null check (length(summary) <= 500)
      );
