    src__App.test.tsx: |
      import { act, fireEvent, render, screen, waitFor, within } from "@testing-library/react";
      import { beforeEach, describe, expect, it, vi } from "vitest";
      import { JcProvider } from "@joinedcontext/sdk";
      import { stubClient } from "@joinedcontext/sdk/testing";
      import App from "./App";
      import { STATIONS } from "./fixtures/stations";

      /** What a click on a station of the map hands the page, as MapLibre would; the last map built's. */
      let clickStation: (event: { features?: Array<{ properties?: { id?: string } }> }) => void = () => undefined;
      vi.mock("maplibre-gl", () => ({
        Map: class {
          on(event: string, layer: unknown, handler?: unknown) {
            if (event === "load" && typeof layer === "function") (layer as () => void)();
            if (event === "click" && layer === "jc-points") clickStation = handler as typeof clickStation;
          }
          addSource = vi.fn();
          addLayer = vi.fn();
          getSource = () => ({ setData: vi.fn() });
          fitBounds = vi.fn();
          setPaintProperty = vi.fn();
          remove = vi.fn();
        },
        setWorkerUrl: vi.fn(),
      }));
      vi.mock("@deck.gl/mapbox", () => ({ MapboxOverlay: class {} }));
      vi.mock("@deck.gl/layers", () => ({ ScatterplotLayer: class {} }));
      vi.mock("@deck.gl/aggregation-layers", () => ({ HexagonLayer: class {}, GridLayer: class {} }));
      // jsdom has no canvas; the charts themselves are tested in pages/Overview.test.tsx.
      vi.mock("echarts", () => ({ init: vi.fn(() => ({ setOption: vi.fn(), resize: vi.fn(), dispose: vi.fn(), on: vi.fn() })) }));

      const READ = {
        permissions: [{ resource: { type: "BikeHireDockingStation" }, actions: ["queryEntity", "retrieveEntity"], attributes: "*" as const }],
        prohibitions: [],
      };

      function app(entities = STATIONS) {
        const client = stubClient({ entities, access: READ }, { appName: "helsinki-bikes" });
        render(
          <JcProvider client={client}>
            <App />
          </JcProvider>,
        );
        return client;
      }

      describe("helsinki-bikes", () => {
        // The shell keeps the page in the address, so each case starts on the overview.
        beforeEach(() => {
          window.location.hash = "";
        });

        // AP-07, SDK-01: the overview is three numbers for the city, read through the app's endpoint.
        it("opens on the overview with stations, bikes available and stations empty", async () => {
          const client = app();
          const overview = await screen.findByRole("region", { name: "Overview" });
          const tile = (label: string) => within(overview).getByText(label).closest(".jc-tile") as HTMLElement;
          await waitFor(() => expect(within(tile("Stations")).getByText("5")).toBeInTheDocument());
          expect(within(tile("Bikes available")).getByText("15")).toBeInTheDocument();
          expect(within(tile("Stations empty")).getByText("2")).toBeInTheDocument();
          // AP-04: every read went to the app's own endpoint and nowhere else.
          expect(client.transport.calls.length).toBeGreaterThan(0);
          expect(client.transport.calls.every((call) => call.path.includes("/api/endpoint/"))).toBe(true);
          expect(client.transport.calls.every((call) => call.method === "GET")).toBe(true);
        });

        // AP-07: the stations page lists every station, and the filter hides the ones with no bike.
        it("lists the stations, filters to those with bikes and searches by name", async () => {
          app();
          fireEvent.click(await screen.findByRole("button", { name: "Stations" }));
          const page = screen.getByRole("region", { name: "Stations" });
          const table = await within(page).findByRole("table");
          for (const station of STATIONS) expect(await within(table).findByText(String(station.name))).toBeInTheDocument();
          expect(within(page).getByTestId("jc-map")).toBeInTheDocument();

          fireEvent.click(within(page).getByRole("checkbox", { name: "Only stations with bikes" }));
          await waitFor(() => expect(within(table).queryByText("Laivasillankatu")).not.toBeInTheDocument());
          expect(within(table).queryByText("Viiskulma")).not.toBeInTheDocument();
          expect(within(table).getByText("Kaivopuisto")).toBeInTheDocument();
          expect(within(table).getByText("Kapteeninpuistikko")).toBeInTheDocument();

          fireEvent.change(within(page).getByRole("searchbox", { name: "Station" }), { target: { value: "kaivo" } });
          await waitFor(() => expect(within(table).queryByText("Kapteeninpuistikko")).not.toBeInTheDocument());
          expect(within(table).getByText("Kaivopuisto")).toBeInTheDocument();

          // SDK-40: a station opens in the shell's entity panel; a public App writes nothing, so no Edit.
          fireEvent.click(within(table).getByText("Kaivopuisto"));
          const panel = await screen.findByRole("dialog", { name: "Kaivopuisto" });
          expect(within(panel).queryByRole("button", { name: "Edit" })).toBeNull();
          fireEvent.click(within(panel).getByRole("button", { name: "Close" }));
          expect(screen.queryByRole("dialog")).toBeNull();
        });

        it("says so when the endpoint has no station at all", async () => {
          app([]);
          const overview = await screen.findByRole("region", { name: "Overview" });
          const tile = within(overview).getByText("Stations").closest(".jc-tile") as HTMLElement;
          await waitFor(() => expect(within(tile).getByText("0")).toBeInTheDocument());
          fireEvent.click(screen.getByRole("button", { name: "Stations" }));
          const page = screen.getByRole("region", { name: "Stations" });
          expect(await within(page).findByText("No station matches.")).toBeInTheDocument();
        });

        // T-3373: every control of the stations page answers; a station opens from the map as from the
        // table, on either page; the filters reset; the overview is one click back.
        it("sorts by every column, opens a station from either map, resets the filters and goes back", async () => {
          app();
          await screen.findByText("15");
          act(() => clickStation({ features: [{ properties: { id: String(STATIONS[1].id) } }] }));
          expect(await screen.findByRole("dialog", { name: String(STATIONS[1].name) })).toBeInTheDocument();
          fireEvent.click(screen.getByRole("button", { name: "Close" }));
          fireEvent.click(screen.getByRole("button", { name: "Stations" }));
          const page = screen.getByRole("region", { name: "Stations" });
          const table = await within(page).findByRole("table");
          await within(table).findByText(String(STATIONS[0].name));
          for (const column of ["Station", "Bikes", "Free slots", "Capacity", "Status", "Updated"]) {
            fireEvent.click(within(table).getByRole("button", { name: column }));
          }
          act(() => clickStation({ features: [] }));
          act(() => clickStation({ features: [{ properties: { id: String(STATIONS[0].id) } }] }));
          expect(await screen.findByRole("dialog", { name: String(STATIONS[0].name) })).toBeInTheDocument();
          fireEvent.click(screen.getByRole("button", { name: "Close" }));
          fireEvent.click(within(page).getByRole("checkbox", { name: "Only stations with bikes" }));
          fireEvent.click(within(page).getByRole("button", { name: "Reset" }));
          expect(within(page).getByRole("checkbox", { name: "Only stations with bikes" })).not.toBeChecked();
          fireEvent.click(screen.getByRole("button", { name: "Overview" }));
          expect(await screen.findByRole("region", { name: "Overview" })).toBeInTheDocument();
        });
      });
    src__App.tsx: |
      import { AppShell } from "@joinedcontext/sdk";
      import type { ShellPage } from "@joinedcontext/sdk";
      import { Overview } from "./pages/Overview";
      import { Stations } from "./pages/Stations";

      const PAGES: ShellPage[] = [
        { id: "overview", label: "Overview", render: () => <Overview /> },
        { id: "stations", label: "Stations", render: () => <Stations /> },
      ];

      /**
       * Helsinki's city bikes in the SDK's shell (SDK-39): the numbers for the whole city, and every
       * station on a map and in a table; a station opens in the shell's entity panel (SDK-40).
       */
      export default function App() {
        return <AppShell title="Helsinki city bikes" pages={PAGES} language="en" />;
      }
    src__app.css: |
      /* The application's own layout, over the token variables the SDK sets from design-tokens.json. The
         screens are laid out by the SDK's primitives (Page, Grid, Card, Split); what is here is only what
         they do not cover. */

      /* T-2924: each overview number carries its colour from the design tokens. */
      .app-tile {
        border-left: 4px solid var(--app-tone, var(--jc-color-accent, #0000bf));
      }
      .app-tile[data-tone="success"] { --app-tone: var(--jc-color-success, #059669); }
      .app-tile[data-tone="danger"] { --app-tone: var(--jc-color-danger, #dc2626); }
      .app-tile .jc-tile-value { color: var(--app-tone, var(--jc-color-accent, #0000bf)); }

      .app-legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--jc-space-2, 0.5rem);
        margin-top: var(--jc-space-2, 0.5rem);
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }
      .app-legend-ramp {
        flex: 0 1 10rem;
        height: 0.6rem;
        border-radius: var(--jc-radius-sm, 4px);
      }

      /* A station's status as a coloured chip: ink on a tint of the status colour, its border in the colour
         itself. White on the success green read 3.8:1 (WCAG 1.4.3, T-2946), and a city's tokens can make
         that colour lighter still. */
      .app-chip {
        --app-chip-tone: var(--jc-color-muted, #64748b);
        display: inline-block;
        padding: 0 var(--jc-space-2, 0.5rem);
        border-radius: 999px;
        font-size: var(--jc-font-size-sm, 0.75rem);
        font-weight: 600;
        color: var(--jc-color-ink, #1a1a1a);
        background: color-mix(in srgb, var(--app-chip-tone) 16%, var(--jc-color-surface, #ffffff));
        border: 1px solid var(--app-chip-tone);
      }
      .app-chip[data-status="working"] { --app-chip-tone: var(--jc-color-success, #059669); }
    src__charts.test.ts: |
      /**
       * T-3127: a station at 100 % ends its bar at the plot's right edge, and its value label ("100 %")
       * is drawn right of it; the plot leaves room for it, or the label is cut to "10".
       */
      import { describe, expect, it } from "vitest";
      import { DEFAULT_TOKENS } from "@joinedcontext/sdk";
      import type { Row } from "@joinedcontext/sdk";
      import { rankedOption } from "./charts";

      const FULL: Row[] = [
        { id: "urn:ngsi-ld:BikeHireDockingStation:hel.fi:helsinki:1", type: "BikeHireDockingStation", name: "Sompasaari", availableBikeNumber: 20, freeSlotNumber: 0, totalSlotNumber: 20 } as Row,
      ];

      describe("the ranked station bars", () => {
        it("leave room right of a full bar for its whole value label", () => {
          const option = rankedOption(FULL, "fullest", 10, DEFAULT_TOKENS) as { grid: { right: number }; series: { label: { position: string } }[] };
          expect(option.series[0].label.position).toBe("right");
          // "100 %" at the chart's 12 px label font is about 40 px wide.
          expect(option.grid.right).toBeGreaterThanOrEqual(48);
        });
      });
    src__charts.ts: |
      import { currentTokens } from "@joinedcontext/sdk";
      import type { DesignTokens, Row } from "@joinedcontext/sdk";
      import { colorRamp } from "./components/EntityMap";
      import { BANDS, histogram, ranked } from "./stations";

      const GRID = { containLabel: true, left: 8, right: 24, top: 24, bottom: 8 };
      /** `containLabel` makes room for the axes' labels only: a bar's own value label ("100 %"),
       * drawn right of a full bar, needs the margin itself or is cut (T-3127). */
      const RANKED_GRID = { ...GRID, right: 52 };

      /** Stations by bikes available now, one bar per band, coloured along the map's ramp (T-2924). */
      export function histogramOption(rows: Row[], tokens?: DesignTokens): Record<string, unknown> {
        const t = tokens ?? currentTokens();
        const last = BANDS.length - 1;
        return {
          color: t.chart.palette,
          tooltip: { trigger: "axis" },
          grid: GRID,
          xAxis: { type: "category", name: "Bikes available", nameLocation: "middle", nameGap: 28, data: BANDS.map((band) => band.label) },
          yAxis: { type: "value", name: "Stations", minInterval: 1 },
          series: [
            {
              type: "bar",
              name: "Stations",
              data: histogram(rows).map((value, index) => ({ value, itemStyle: { color: colorRamp(index, [0, last], t) } })),
            },
          ],
        };
      }

      /**
       * The `n` fullest or emptiest stations as horizontal bars of their share of docks with a bike, the
       * first one on top; `null` when no station has both counts, so the card says there is nothing to chart.
       */
      export function rankedOption(rows: Row[], order: "fullest" | "emptiest", n = 10, tokens?: DesignTokens): Record<string, unknown> | null {
        const t = tokens ?? currentTokens();
        const top = ranked(rows, n, order);
        if (top.length === 0) return null;
        return {
          color: t.chart.palette,
          tooltip: { trigger: "axis", axisPointer: { type: "shadow" } },
          grid: RANKED_GRID,
          xAxis: { type: "value", min: 0, max: 100, axisLabel: { formatter: "{value} %" } },
          yAxis: { type: "category", inverse: true, data: top.map((station) => station.name) },
          series: [
            {
              type: "bar",
              name: "Docks with a bike (%)",
              label: { show: true, position: "right", formatter: "{c} %" },
              data: top.map((station) => ({ value: station.percent, itemStyle: { color: colorRamp(station.percent, [0, 100], t) } })),
            },
          ],
        };
      }
    src__components__ChartCard.tsx: |
      import type { ReactNode } from "react";
      import { useEffect, useRef } from "react";
      import * as echarts from "echarts";
      import { currentTokens, echartsTheme } from "@joinedcontext/sdk";
      import type { ProblemError } from "@joinedcontext/sdk";
      import { Empty, Loading, Problem } from "@joinedcontext/sdk";

      /** One ECharts chart with a caption, in the SDK's theme; the loading, error and empty states in its place. */
      export function ChartCard({
        title,
        option,
        height = 280,
        loading,
        error,
        empty,
      }: {
        title: string;
        option: Record<string, unknown> | null;
        height?: number;
        loading?: boolean;
        error?: ProblemError | Error | null;
        empty?: ReactNode;
      }): React.JSX.Element {
        const containerRef = useRef<HTMLDivElement | null>(null);
        const chartRef = useRef<echarts.ECharts | null>(null);
        const showCanvas = !error && !loading && option !== null;

        useEffect(() => {
          const el = containerRef.current;
          if (!showCanvas || !el) return;
          const chart = echarts.init(el, echartsTheme(currentTokens()), { renderer: "canvas" });
          chartRef.current = chart;
          const observer = typeof ResizeObserver === "undefined" ? undefined : new ResizeObserver(() => chart.resize());
          observer?.observe(el);
          return () => {
            observer?.disconnect();
            chart.dispose();
            chartRef.current = null;
          };
        }, [showCanvas]);

        useEffect(() => {
          if (chartRef.current && option) chartRef.current.setOption(option, true);
        }, [option, showCanvas]);

        return (
          <figure className="jc-chart">
            <figcaption>{title}</figcaption>
            {error ? (
              <Problem error={error} />
            ) : loading ? (
              <Loading />
            ) : option === null ? (
              <Empty>{empty ?? "Nothing to chart yet."}</Empty>
            ) : (
              <div className="jc-chart-canvas" role="img" aria-label={title} style={{ height }} ref={containerRef} />
            )}
          </figure>
        );
      }
