    src__components__LevelsCard.tsx: |
      import { useId, useState } from "react";
      import { Card } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import type { Lang } from "../i18n";
      import type { Levels } from "../plans";
      import { t } from "../texts";
      import { problemText } from "./SavedPlans";

      const FIELDS = [
        ["low", "levelLow"],
        ["target", "levelTarget"],
        ["high", "levelHigh"],
      ] as const;

      type Shown = Record<keyof Levels, string>;

      const percent = (share: number) => String(Math.round(share * 100));
      const shownOf = (levels: Levels): Shown => ({ low: percent(levels.low), target: percent(levels.target), high: percent(levels.high) });

      /** Whole percents as shares, when they keep `0 <= low < target < high <= 100`. */
      export function levelsOf(shown: Shown): Levels | null {
        const [low, target, high] = [shown.low, shown.target, shown.high].map((text) => (/^\d{1,3}$/.test(text.trim()) ? Number(text) : NaN));
        if (![low, target, high].every(Number.isFinite)) return null;
        if (!(low < target && target < high && high <= 100)) return null;
        return { low: low / 100, target: target / 100, high: high / 100 };
      }

      /**
       * The planner's levels for every station: a steward changes them, everyone else reads them with the
       * reason the form is closed to them. The form opens once the kept levels arrived, so a steward never
       * edits the defaults. A save shows at once and goes back when the server refuses.
       */
      export function LevelsCard({ lang }: { lang: Lang }) {
        const { levels, levelsKept, steward, saveLevels } = useAccess();
        const [shown, setShown] = useState<Shown>(() => shownOf(levels));
        // The levels that `shown` was taken from. New ones replace it in the same render, not in an
        // effect after it: the form opened one commit before the effect ran, and the first value a
        // steward typed went under the kept levels (T-4277).
        const [shownFrom, setShownFrom] = useState(levels);
        if (shownFrom !== levels) {
          setShownFrom(levels);
          setShown(shownOf(levels));
        }
        const [message, setMessage] = useState<{ text: string; error: boolean } | null>(null);
        const [busy, setBusy] = useState(false);
        const why = useId();

        const wanted = levelsOf(shown);
        const closed = !steward || !levelsKept || busy;
        const save = async () => {
          if (!wanted) return;
          const before = levels;
          setBusy(true);
          setMessage(null);
          try {
            await saveLevels(wanted);
            setMessage({ text: t(lang, "levelsSaved"), error: false });
          } catch (error) {
            setShown(shownOf(before));
            setMessage({ text: problemText(lang, error, "levelsFailed"), error: true });
          } finally {
            setBusy(false);
          }
        };

        return (
          <Card title={t(lang, "levelsTitle")}>
            <p className="app-updated">{t(lang, "levelsIntro")}</p>
            <form
              className="app-filters"
              aria-label={t(lang, "levelsTitle")}
              onSubmit={(event) => {
                event.preventDefault();
                void save();
              }}
            >
              <fieldset disabled={closed} aria-describedby={steward ? undefined : why} title={steward ? undefined : t(lang, "stewardSetsLevels")} className="app-levels">
                {FIELDS.map(([name, label]) => (
                  <label key={name}>
                    <span>{t(lang, label)}</span>
                    <input
                      type="number"
                      inputMode="numeric"
                      min={0}
                      max={100}
                      step={1}
                      disabled={closed}
                      value={shown[name]}
                      aria-invalid={wanted === null}
                      onChange={(event) => setShown((before) => ({ ...before, [name]: event.target.value }))}
                    />
                  </label>
                ))}
                <button type="submit" className="jc-button" disabled={closed || wanted === null}>
                  {t(lang, "levelsSave")}
                </button>
              </fieldset>
              {!steward && (
                <span id={why} className="app-updated">
                  {t(lang, "stewardSetsLevels")}
                </span>
              )}
              {steward && wanted === null && <span className="app-error">{t(lang, "levelsOrder")}</span>}
            </form>
            <p role="status" aria-live="polite" className={message?.error ? "app-error" : "app-updated"}>
              {message?.text ?? ""}
            </p>
          </Card>
        );
      }
    src__components__MapView.tsx: |
      import { useEffect, useRef, useState } from "react";
      import { LngLatBounds, Map as MapLibreMap, Popup } from "maplibre-gl";
      import type { GeoJSONSource, MapGeoJSONFeature, MapMouseEvent } from "maplibre-gl";
      import { currentTokens, mapWorkerReady, NO_BASEMAP, styleFor, useClient } from "@joinedcontext/sdk";

      /** One point on the map: where, in which colour, and the lines its popup shows (text only). */
      export interface MapPoint {
        id: string;
        at: [number, number];
        color: string;
        lines: string[];
      }

      /**
       * A MapLibre map of `points`, with `line` drawn under them when given (a route). It fits the
       * points once, when they first arrive, so a refresh never moves the reader's view; a click on a
       * point opens its popup and calls `onPick`.
       */
      export function MapView({
        points,
        line,
        label,
        onPick,
        height = 420,
      }: {
        points: MapPoint[];
        line?: Array<[number, number]>;
        /** What the map shows, for a screen reader: the list beside it carries the same. */
        label: string;
        onPick?: (id: string) => void;
        height?: number;
      }): React.JSX.Element {
        const client = useClient();
        const basemap = client.config.basemap;
        const container = useRef<HTMLDivElement>(null);
        const map = useRef<MapLibreMap | null>(null);
        const [ready, setReady] = useState(false);
        const fitted = useRef(false);
        const pointsRef = useRef(points);
        pointsRef.current = points;
        const onPickRef = useRef(onPick);
        onPickRef.current = onPick;

        useEffect(() => {
          let gone = false;
          let instance: MapLibreMap | null = null;
          void mapWorkerReady().then(() => {
            if (gone || !container.current) return;
            const tokens = currentTokens();
            instance = new MapLibreMap({
              container: container.current,
              style: styleFor(basemap),
              center: [24.94, 60.17],
              zoom: 10,
              canvasContextAttributes: { preserveDrawingBuffer: true },
            });
            map.current = instance;
            instance.on("error", (event) => console.error("map error", event.error?.message ?? event));
            instance.on("load", () => {
              if (gone || !instance) return;
              instance.addSource("app-line", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
              instance.addSource("app-points", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
              instance.addLayer({
                id: "app-line",
                type: "line",
                source: "app-line",
                paint: { "line-color": tokens.color.accent, "line-width": 3, "line-opacity": 0.8 },
              });
              instance.addLayer({
                id: "app-points",
                type: "circle",
                source: "app-points",
                paint: {
                  "circle-radius": 6,
                  "circle-color": ["get", "color"],
                  "circle-stroke-color": tokens.map.stroke,
                  "circle-stroke-width": 1.5,
                },
              });
              instance.on("click", "app-points", (event: MapMouseEvent & { features?: MapGeoJSONFeature[] }) => {
                const id: unknown = event.features?.[0]?.properties?.id;
                const point = pointsRef.current.find((p) => p.id === id);
                if (!point || !instance) return;
                onPickRef.current?.(point.id);
                // Text nodes only: an entity's values never reach the page as markup.
                const body = document.createElement("div");
                body.className = "jc-map-popup";
                for (const [index, text] of point.lines.entries()) {
                  const element = document.createElement(index === 0 ? "strong" : "p");
                  element.textContent = text;
                  body.append(element);
                }
                new Popup({ closeButton: true, maxWidth: "260px" }).setLngLat(point.at).setDOMContent(body).addTo(instance);
              });
              setReady(true);
            });
          });
          return () => {
            gone = true;
            instance?.remove();
            map.current = null;
          };
        }, [basemap]);

        useEffect(() => {
          const instance = map.current;
          if (!ready || !instance) return;
          (instance.getSource("app-points") as GeoJSONSource | undefined)?.setData({
            type: "FeatureCollection",
            features: points.map((p) => ({
              type: "Feature",
              id: p.id,
              properties: { id: p.id, color: p.color },
              geometry: { type: "Point", coordinates: p.at },
            })),
          });
          (instance.getSource("app-line") as GeoJSONSource | undefined)?.setData({
            type: "FeatureCollection",
            features: line && line.length > 1 ? [{ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: line } }] : [],
          });
          if (!fitted.current && points.length > 0) {
            fitted.current = true;
            const bounds = new LngLatBounds();
            for (const p of points) bounds.extend(p.at);
            instance.fitBounds(bounds, { padding: 32, maxZoom: 15, duration: 0 });
          }
        }, [ready, points, line]);

        return (
          <div className="jc-map" data-testid="jc-map" style={{ height }}>
            <div className="jc-map-canvas" ref={container} role="application" aria-label={label} />
            {!basemap && <span className="jc-map-notice">{NO_BASEMAP}</span>}
          </div>
        );
      }
