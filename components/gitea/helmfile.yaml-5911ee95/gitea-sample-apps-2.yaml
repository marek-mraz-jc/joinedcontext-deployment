    server__Cargo.toml: |
      # The server component of event-day-planner (T-3347, ADR-N-044): a wasm32-wasip2 component on the
      # shared host that keeps the days visitors share, under a short id, and their calendar files under
      # the App's own prefix. It plans with the page's own planner (../wasm), without the browser's
      # bindings. Its own workspace and lock, as the build lane builds it (AP-151).
      [package]
      name = "event-day-planner-server"
      version = "0.1.0"
      edition = "2021"
      publish = false
      license = "Apache-2.0"

      [lib]
      crate-type = ["cdylib", "rlib"]

      [dependencies]
      event-day-planner = { path = "../wasm", default-features = false }
      # The guest SDK at the platform commit with its role and history helpers (T-3825); its `gateway`
      # reaches the App's own Endpoint alone (AP-147, AP-157).
      jc-app-sdk = { git = "https://github.com/marek-mraz-jc/joinedcontext-platform.git", rev = "ef03418872f29c10bf895fdf84aaf899e651f205" }
      serde = { version = "1", features = ["derive"] }
      serde_json = "1"

      [profile.release]
      opt-level = "s"
      lto = true

      [workspace]
    server__host-test.json: |
      {
        "gateway": [
          {
            "path": "/ngsi-ld/v1/entities",
            "query": {
              "id": "urn:ngsi-ld:Event:helsinki:fair,urn:ngsi-ld:Event:helsinki:talk"
            },
            "file": "host-test/fair-and-talk.json",
            "anonymous": true
          },
          {
            "path": "/ngsi-ld/v1/entities",
            "query": {
              "id": "urn:ngsi-ld:Event:helsinki:later"
            },
            "file": "host-test/later.json"
          }
        ],
        "steps": [
          {
            "call": "POST /api/itineraries",
            "body": {
              "day": "2030-02-30",
              "ids": [
                "urn:ngsi-ld:Event:helsinki:fair"
              ],
              "lang": "en"
            },
