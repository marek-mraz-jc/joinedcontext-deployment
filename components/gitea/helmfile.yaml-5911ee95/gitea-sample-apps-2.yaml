    src__events.test.ts: |
      import { describe, expect, it } from "vitest";
      import type { Row } from "@joinedcontext/sdk";
      import { eventRows } from "./fixtures/events";
      import { dayBounds, during, eventsOfDay, localOf, perHour, planEvents, sourceOf, startHour, timeOf, upcomingQuery, zoneOffset } from "./events";

      const SUNDAY = dayBounds("2030-10-20") as [number, number];
      const EVENTS = await eventRows();

      describe("events", () => {
        it("knows where Helsinki's days begin, summer time and winter time", () => {
          expect(new Date(SUNDAY[0]).toISOString()).toBe("2030-10-19T21:00:00.000Z");
          expect(new Date(SUNDAY[1]).toISOString()).toBe("2030-10-20T21:00:00.000Z");
          // The clocks go back on 27 October 2030: that day has 25 hours.
          const [start, end] = dayBounds("2030-10-27") as [number, number];
          expect((end - start) / 3_600_000).toBe(25);
          expect(zoneOffset(Date.UTC(2030, 0, 1))).toBe(2 * 3_600_000);
          for (const wrong of ["", "2030-02-30", "20.10.2030", "2030-13-01"]) expect(dayBounds(wrong)).toBeNull();
        });

        it("takes the day's events, soonest first, an exhibition open for months among them", () => {
          const ids = eventsOfDay(EVENTS, SUNDAY).map((row) => localOf(row.id));
          expect(ids).toEqual(["hkm-5", "helsinki-agf1", "helsinki-agf2", "helsinki-agf3", "helsinki-agf6", "kulke-4"]);
          expect(eventsOfDay(EVENTS, SUNDAY, "STOA").map((row) => localOf(row.id))).toEqual(["kulke-4"]);
          expect(eventsOfDay(EVENTS, SUNDAY, "", 12).map((row) => localOf(row.id))).toEqual(["helsinki-agf2", "helsinki-agf3"]);
          expect(eventsOfDay([], SUNDAY)).toEqual([]);
        });

        it("counts the events starting each Helsinki hour, an earlier one at midnight", () => {
          const counts = perHour(eventsOfDay(EVENTS, SUNDAY), SUNDAY);
          expect(counts[0]).toBe(1);
          expect(counts[10]).toBe(1);
          expect(counts[12]).toBe(2);
          expect(counts[18]).toBe(1);
          expect(counts.reduce((a, b) => a + b, 0)).toBe(6);
          expect(startHour(EVENTS[0], SUNDAY)).toBe(10);
        });

        it("cuts each window to the day and keeps a missing place as unknown", () => {
          const [museum] = planEvents([EVENTS[4]], SUNDAY);
          expect([museum.start, museum.end]).toEqual(SUNDAY);
          const [undated] = planEvents([{ id: "urn:ngsi-ld:Event:x:y:z", type: "Event" } as Row], SUNDAY);
          expect([undated.start, undated.end, undated.lon, undated.lat, undated.name]).toEqual([null, null, null, null, "z"]);
          expect(during({ id: "a", type: "Event" } as Row, SUNDAY)).toBe(false);
        });

        it("asks only for events that have not ended, and links only an https source", () => {
          expect(upcomingQuery(SUNDAY[0])).toBe("endDate>=2030-10-19T21:00:00Z");
          expect(sourceOf(EVENTS[0])).toBe("https://api.hel.fi/linkedevents/v1/");
          expect(sourceOf({ id: "a", type: "Event", source: "javascript:alert(1)" } as Row)).toBe("");
        });

        // What a feed may send that the day still reads: no end, no start, a date that is no date.
        it("reads an event with no end as a moment, and one with no start or no date as none", () => {
          const at = (fields: Record<string, unknown>) => ({ id: "urn:ngsi-ld:Event:hel.fi:helsinki:x", type: "Event", ...fields }) as Row;
          const moment = at({ startDate: "2030-10-20T09:00:00Z" });
          expect(during(moment, SUNDAY)).toBe(true);
          const [planned] = planEvents([moment], SUNDAY);
          expect(planned.end).toBe(planned.start);
          expect(timeOf(at({ startDate: "soon" }), "startDate")).toBeNull();
          expect(timeOf(at({ startDate: 42 }), "startDate")).toBeNull();
          expect(during(at({ startDate: "soon" }), SUNDAY)).toBe(false);
          // No start: counted in the day's first hour, planned with no time.
          expect(perHour([at({})], SUNDAY)[0]).toBe(1);
          expect(planEvents([at({})], SUNDAY)[0]).toMatchObject({ start: null, end: null, lon: null, lat: null });
        });
      });
    src__events.ts: |
      import { format, pointOf } from "@joinedcontext/sdk";
      import type { Row } from "@joinedcontext/sdk";
      import { ZONE } from "./i18n";
      import type { PlanEvent } from "./planner";

      /** The one entity type the app's data need names (AP-04). */
      export const EVENT = "Event";

      /** The attributes the page reads, exactly those app.yaml names. */
      export const ATTRS = ["name", "description", "startDate", "endDate", "eventStatus", "address", "location", "source"];

      const HOUR = 3_600_000;

      /** The Helsinki calendar day of an instant, as `YYYY-MM-DD`. */
      export function dayOf(instant: Date): string {
        return instant.toLocaleDateString("sv-SE", { timeZone: ZONE });
      }

      /** How far Helsinki's clock is ahead of UTC at `ms`, in milliseconds (2 or 3 hours). */
      export function zoneOffset(ms: number): number {
        const parts = Object.fromEntries(
          new Intl.DateTimeFormat("en-US", {
            timeZone: ZONE,
            hourCycle: "h23",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          })
            .formatToParts(new Date(ms))
            .map((part) => [part.type, part.value]),
        );
        const asUtc = Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day), Number(parts.hour), Number(parts.minute), Number(parts.second));
        return asUtc - Math.floor(ms / 1000) * 1000;
      }

      /** The instants a Helsinki day `YYYY-MM-DD` starts and ends, as epoch milliseconds; `null` for no day. */
      export function dayBounds(day: string): [number, number] | null {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day);
        if (!match) return null;
        const [year, month, date] = [Number(match[1]), Number(match[2]), Number(match[3])];
        const midnight = (d: number) => {
          // Four digits of year: always an instant JavaScript can hold.
          const guess = Date.UTC(year, month - 1, d);
          // Twice: the offset at the guess, then at the corrected instant (a day the clock changes).
          const first = guess - zoneOffset(guess);
          return guess - zoneOffset(first);
        };
        const start = midnight(date);
        const end = midnight(date + 1);
        if (dayOf(new Date(start)) !== day) return null;
        return [start, end];
      }

      /** A date attribute as epoch milliseconds, or `null` when missing or not a date. */
      export function timeOf(row: Row, attr: "startDate" | "endDate"): number | null {
        const raw = row[attr];
        if (typeof raw !== "string") return null;
        const parsed = Date.parse(raw);
        return Number.isNaN(parsed) ? null : parsed;
      }

      /** A text attribute in the reader's language (the SDK resolves a language map). */
      export function textOf(row: Row, attr: string): string {
        return format(row[attr]).trim();
      }

      /** The end of an event's id: short enough for the address, unique in the city's feed. */
      export function localOf(id: string): string {
        return id.slice(id.lastIndexOf(":") + 1);
      }

      /** The event's name, else the end of its id. */
      export function nameOf(row: Row): string {
        return textOf(row, "name") || localOf(row.id);
      }

      export function cancelled(row: Row): boolean {
        return textOf(row, "eventStatus") === "EventCancelled";
      }

      /** The event's link to its source, only when it is an `https:` address. */
      export function sourceOf(row: Row): string {
        const source = textOf(row, "source");
        return /^https:\/\/[^\s]+$/.test(source) ? source : "";
      }

      /** The query of the events that have not ended before `from` (NGSI-LD q, a DateTime is unquoted). */
      export function upcomingQuery(from: number): string {
        return `endDate>=${new Date(from).toISOString().replace(/\.\d{3}Z$/, "Z")}`;
      }

      /** Whether the event takes place during [start, end): it starts before the end and ends after the start. */
      export function during(row: Row, [start, end]: [number, number]): boolean {
        const first = timeOf(row, "startDate");
        if (first === null) return false;
        const last = Math.max(timeOf(row, "endDate") ?? first, first);
        return first < end && (last > start || (last === first && first >= start));
      }

      const fold = (value: string) => value.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();

      /**
       * The day's events a reader asked for, soonest first: taking place that day, not cancelled unless
       * already chosen, holding every word of `query` in name, place or description (case and accents
       * ignored), and starting in `hour` (Helsinki, 0–23) when given.
       */
      export function eventsOfDay(rows: Row[], bounds: [number, number], query = "", hour: number | null = null): Row[] {
        const words = fold(query).split(/\s+/).filter(Boolean);
        return rows
          .filter((row) => {
            if (!during(row, bounds)) return false;
            if (hour !== null && startHour(row, bounds) !== hour) return false;
            const haystack = fold(`${textOf(row, "name")} ${textOf(row, "address")} ${textOf(row, "description")}`);
            return words.every((word) => haystack.includes(word));
          })
          .sort((a, b) => (timeOf(a, "startDate") ?? 0) - (timeOf(b, "startDate") ?? 0) || a.id.localeCompare(b.id));
      }

      /** The Helsinki hour an event starts that day; 0 for one that began before the day. */
      export function startHour(row: Row, [start]: [number, number]): number {
        const first = timeOf(row, "startDate") ?? start;
        return first <= start ? 0 : Math.floor((first - start - zoneOffset(start) + zoneOffset(first)) / HOUR);
      }

      /** How many of the day's events start in each hour, 0 to 23. */
      export function perHour(rows: Row[], bounds: [number, number]): number[] {
        const counts = Array.from({ length: 24 }, () => 0);
        for (const row of rows) counts[Math.min(23, Math.max(0, startHour(row, bounds)))] += 1;
        return counts;
      }

      /** The events as the planner reads them, each window cut to the day. */
      export function planEvents(rows: Row[], [start, end]: [number, number]): PlanEvent[] {
        return rows.map((row) => {
          const first = timeOf(row, "startDate");
          const last = timeOf(row, "endDate");
          const at = pointOf(row.location);
          return {
            id: localOf(row.id),
            name: nameOf(row),
            address: textOf(row, "address"),
            start: first === null ? null : Math.max(first, start),
            end: first === null ? null : Math.min(Math.max(last ?? first, first), end),
            lon: at ? at[0] : null,
            lat: at ? at[1] : null,
          };
        });
      }
    src__featured.ts: |
      import { useCallback, useEffect, useRef, useState } from "react";
      import type { FeaturedEvent, ShareApi } from "./share";

      export interface Featured {
        /** The featured events, `null` while they are read. */
        list: FeaturedEvent[] | null;
        /** Why they could not be read, if they could not. */
        failed: unknown;
        /** An event featured: shown at once, taken back when the server refuses (which throws on). */
        add: (eventId: string) => Promise<void>;
        /** A note changed, the same way. */
        setNote: (id: number, note: string) => Promise<void>;
        /** An event no longer featured, the same way. */
        remove: (id: number) => Promise<void>;
      }

      /** The featured events every visitor sees; a steward's changes show before the server answers. */
      export function useFeatured(api: ShareApi): Featured {
        const [list, setShown] = useState<FeaturedEvent[] | null>(null);
        const [failed, setFailed] = useState<unknown>(null);
        // What is on screen now, read by a change that has to put it back.
        const shown = useRef<FeaturedEvent[]>([]);
        const show = useCallback((next: FeaturedEvent[]) => {
          shown.current = next;
          setShown(next);
        }, []);

        useEffect(() => {
          let current = true;
          api.featured().then(
            (found) => current && show(found),
            (error: unknown) => {
              if (!current) return;
              show([]);
              setFailed(error);
            },
          );
          return () => {
            current = false;
          };
        }, [api, show]);

        /** `change` shown at once, then `work`; what was shown before comes back when it throws. */
        const optimistic = async (change: FeaturedEvent[], work: () => Promise<void>) => {
          const before = shown.current;
          show(change);
          try {
            await work();
          } catch (error) {
            show(before);
            throw error;
          }
        };

        const add = (eventId: string) =>
          optimistic([...shown.current, { id: -1, eventId, note: "" }], async () => {
            const made = await api.feature(eventId, "");
            show(shown.current.map((one) => (one.id === -1 && one.eventId === eventId ? made : one)));
          });
        const setNote = (id: number, note: string) =>
          optimistic(
            shown.current.map((one) => (one.id === id ? { ...one, note: note.trim() } : one)),
            () => api.changeNote(id, note.trim()),
          );
        const remove = (id: number) =>
          optimistic(
            shown.current.filter((one) => one.id !== id),
            () => api.unfeature(id),
          );

        return { list, failed, add, setNote, remove };
      }
