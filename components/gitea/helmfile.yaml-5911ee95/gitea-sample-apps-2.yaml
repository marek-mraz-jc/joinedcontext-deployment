    src__pages__Overview.tsx: |
      import { useMemo } from "react";
      import { Card, currentTokens, extent, Grid, Page, Split, useEntities } from "@joinedcontext/sdk";
      import { histogramOption, rankedOption } from "../charts";
      import { ChartCard } from "../components/ChartCard";
      import { EntityMap } from "../components/EntityMap";
      import { Problem, useEntitySelection } from "@joinedcontext/sdk";
      import { SHARE, STATION, totals, withShare } from "../stations";

      const TILES = [
        { key: "stations", label: "Stations", tone: "accent" },
        { key: "bikes", label: "Bikes available", tone: "success" },
        { key: "empty", label: "Stations empty", tone: "danger" },
      ] as const;

      /**
       * The city at a glance (T-2924): the three numbers in colour, every station on the map coloured by
       * the share of its docks holding a bike, how the stations spread over bikes available, and the ten
       * fullest and emptiest.
       */
      export function Overview() {
        const { selected, select } = useEntitySelection();
        const { rows, loading, error, reload } = useEntities(STATION);
        const sum = totals(rows);
        const shaded = useMemo(() => withShare(rows), [rows]);
        const range = useMemo(() => extent(shaded, SHARE), [shaded]);
        const histogram = useMemo(() => histogramOption(rows), [rows]);
        const fullest = useMemo(() => rankedOption(rows, "fullest"), [rows]);
        const emptiest = useMemo(() => rankedOption(rows, "emptiest"), [rows]);
        const number = new Intl.NumberFormat();
        const tokens = currentTokens();

        return (
          <Page label="Overview">
            <Problem error={error} onRetry={reload} />
            <section className="jc-tiles">
              {TILES.map((tile) => (
                <div className="jc-tile app-tile" data-tone={tile.tone} key={tile.key}>
                  <span className="jc-tile-label">{tile.label}</span>
                  <strong className="jc-tile-value">{loading ? "…" : number.format(sum[tile.key])}</strong>
                </div>
              ))}
            </section>
            <Split ratio="2:1">
              <Card title="Stations now">
                <EntityMap rows={shaded} location="location" label="name" color={SHARE} height={420} selected={selected?.id ?? null} onSelect={(row) => select({ id: row.id, type: STATION })} />
                <div className="app-legend" aria-label="Map colour: share of docks with a bike">
                  <span>{range ? `${range[0]} %` : "–"}</span>
                  <span
                    className="app-legend-ramp"
                    aria-hidden="true"
                    style={{ background: `linear-gradient(to right, ${tokens.map.low}, ${tokens.map.high})` }}
                  />
                  <span>{range ? `${range[1]} %` : "–"}</span>
                  <small>of docks with a bike</small>
                </div>
              </Card>
              <ChartCard title="Stations by bikes available" option={histogram} loading={loading && rows.length === 0} error={error} />
            </Split>
            <Grid columns={2}>
              <ChartCard title="Fullest stations" option={fullest} height={320} loading={loading && rows.length === 0} error={error} empty="No station reports its docks yet." />
              <ChartCard title="Emptiest stations" option={emptiest} height={320} loading={loading && rows.length === 0} error={error} empty="No station reports its docks yet." />
            </Grid>
          </Page>
        );
      }
    src__pages__Stations.tsx: |
      import { useMemo, useState } from "react";
      import { Card, Page, Split, useEntities, useEntitySelection, useFilters } from "@joinedcontext/sdk";
      import type { FilterDef } from "@joinedcontext/sdk";
      import { EntityMap } from "../components/EntityMap";
      import { EntityTable } from "../components/EntityTable";
      import type { ColumnDef } from "../components/EntityTable";
      import { FilterBar, SearchBox } from "../components/filters";
      import { STATION, hasBikes } from "../stations";

      const SEARCH: FilterDef[] = [{ kind: "search", attrs: ["name"], label: "Station" }];

      /** The table's columns in words, the status as a coloured chip (T-2924). */
      export const TABLE: ColumnDef[] = [
        { attr: "name", label: "Station" },
        { attr: "availableBikeNumber", label: "Bikes" },
        { attr: "freeSlotNumber", label: "Free slots" },
        { attr: "totalSlotNumber", label: "Capacity" },
        {
          attr: "status",
          label: "Status",
          render: (row) => {
            const status = typeof row.status === "string" && row.status !== "" ? row.status : "unknown";
            return (
              <span className="app-chip" data-status={status}>
                {status === "working" ? "Working" : status === "unknown" ? "Unknown" : status}
              </span>
            );
          },
        },
        { attr: "dateModified", label: "Updated" },
      ];

      /**
       * Every station: a search by name, "only stations with bikes", the map coloured by bikes and the
       * table; a station chosen on either opens in the shell's entity panel (SDK-40), linked to the
       * Portal: a public App writes nothing.
       */
      export function Stations() {
        const { rows, loading, error } = useEntities(STATION);
        const { shown: searched, bind, reset } = useFilters(rows, SEARCH);
        const [withBikes, setWithBikes] = useState(false);
        const shown = useMemo(() => (withBikes ? searched.filter(hasBikes) : searched), [searched, withBikes]);
        const { selected, select } = useEntitySelection();
        const selectedId = selected?.id ?? null;

        return (
          <Page label="Stations">
            <FilterBar
              shown={shown.length}
              total={rows.length}
              onReset={() => {
                reset();
                setWithBikes(false);
              }}
            >
              <SearchBox binding={bind(0)} />
              <label className="jc-filter">
                <input type="checkbox" checked={withBikes} onChange={(event) => setWithBikes(event.target.checked)} />
                <span>Only stations with bikes</span>
              </label>
            </FilterBar>
            <Split ratio="2:1">
              <EntityMap
                rows={shown}
                location="location"
                label="name"
                color="availableBikeNumber"
                selected={selectedId}
                onSelect={(row) => select({ id: row.id, type: STATION })}
              />
              <Card label="Station">
                <p>Choose a station on the map or in the table to see its bikes and free slots.</p>
              </Card>
            </Split>
            <EntityTable
              rows={shown}
              columns={TABLE}
              loading={loading}
              error={error}
              selected={selectedId}
              onSelect={(row) => select({ id: row.id, type: STATION })}
              initialSort={{ attr: "name", dir: "asc" }}
              caption="Stations"
              empty="No station matches."
            />
          </Page>
        );
      }
    src__stations.test.ts: |
      import { describe, expect, it } from "vitest";
      import type { Row } from "@joinedcontext/sdk";
      import { STATIONS } from "./fixtures/stations";
      import { BANDS, SHARE, bikes, hasBikes, histogram, isEmpty, ranked, share, totals, withShare } from "./stations";

      const row = (availableBikeNumber: unknown): Row => ({ id: "urn:x", type: "BikeHireDockingStation", availableBikeNumber }) as Row;

      describe("stations", () => {
        // AP-07: the tiles count what the feed says, and a station that says nothing is not empty.
        it("totals the five sampled stations", () => {
          expect(totals(STATIONS)).toEqual({ stations: 5, bikes: 15, empty: 2 });
          expect(totals([])).toEqual({ stations: 0, bikes: 0, empty: 0 });
        });

        it("reads a missing, negative or non-numeric count as unknown", () => {
          for (const value of [undefined, null, -1, "3", Number.NaN, Number.POSITIVE_INFINITY]) {
            expect(bikes(row(value)), String(value)).toBeNull();
            expect(isEmpty(row(value)), String(value)).toBe(false);
            expect(hasBikes(row(value)), String(value)).toBe(false);
          }
          expect(isEmpty(row(0))).toBe(true);
          expect(hasBikes(row(1))).toBe(true);
        });

        // T-2924: the map colours by the share of docks with a bike; a station missing a count has none.
        it("computes the share of docks holding a bike, and none without both counts", () => {
          const [kaivopuisto, laivasillankatu, kapteeninpuistikko, viiskulma] = STATIONS;
          expect(share(kaivopuisto)).toBeCloseTo(4 / 30);
          expect(share(laivasillankatu)).toBe(0);
          expect(share(viiskulma)).toBeNull();
          expect(share({ ...kapteeninpuistikko, totalSlotNumber: 0 })).toBeNull();
          expect(share({ ...kapteeninpuistikko, availableBikeNumber: 40, totalSlotNumber: 16 })).toBe(1);
          const shaded = withShare(STATIONS);
          expect(shaded[0][SHARE]).toBe(13);
          expect(SHARE in shaded[3]).toBe(false);
        });

        it("puts each station with a count in one band of the histogram", () => {
          expect(histogram(STATIONS)).toEqual([2, 0, 1, 0, 1, 0]);
          expect(histogram([])).toEqual(BANDS.map(() => 0));
          expect(histogram([row(1), row(2), row(21), row(500), row(undefined)])).toEqual([0, 2, 0, 0, 0, 2]);
        });

        it("ranks the fullest and the emptiest stations, leaving out one without counts", () => {
          expect(ranked(STATIONS, 2, "fullest")).toEqual([
            { name: "Kapteeninpuistikko", percent: 69, bikes: 11 },
            { name: "Kaivopuisto", percent: 13, bikes: 4 },
          ]);
          expect(ranked(STATIONS, 10, "emptiest").map((s) => s.name)).toEqual([
            "Laivasillankatu",
            "Sepänkatu",
            "Kaivopuisto",
            "Kapteeninpuistikko",
          ]);
          expect(ranked(STATIONS, 0, "fullest")).toEqual([]);
          expect(ranked([], 10, "emptiest")).toEqual([]);
        });
      });
    src__stations.ts: |
      import type { Row } from "@joinedcontext/sdk";

      /** The one entity type the app's data need names (AP-04). */
      export const STATION = "BikeHireDockingStation";

      /** The bikes a station has now, or `null` when the station did not say. */
      export function bikes(row: Row): number | null {
        const value = row.availableBikeNumber;
        return typeof value === "number" && Number.isFinite(value) && value >= 0 ? value : null;
      }

      /** A station that has at least one bike to take. */
      export function hasBikes(row: Row): boolean {
        return (bikes(row) ?? 0) > 0;
      }

      /** A station that says it has none; one that says nothing is unknown, not empty. */
      export function isEmpty(row: Row): boolean {
        return bikes(row) === 0;
      }

      export interface Totals {
        stations: number;
        bikes: number;
        empty: number;
      }

      export function totals(rows: Row[]): Totals {
        return {
          stations: rows.length,
          bikes: rows.reduce((sum, row) => sum + (bikes(row) ?? 0), 0),
          empty: rows.filter(isEmpty).length,
        };
      }

      /** The docks a station has, or `null` when it did not say. */
      function capacity(row: Row): number | null {
        const value = row.totalSlotNumber;
        return typeof value === "number" && Number.isFinite(value) && value > 0 ? value : null;
      }

      /** The share of a station's docks holding a bike now, 0 to 1, or `null` when either count is missing. */
      export function share(row: Row): number | null {
        const now = bikes(row);
        const docks = capacity(row);
        return now === null || docks === null ? null : Math.min(1, now / docks);
      }

      /** The attribute the map colours by: the share as a percentage, added to each row it can be computed for. */
      export const SHARE = "bikeShare";

      export function withShare(rows: Row[]): Row[] {
        return rows.map((row) => {
          const value = share(row);
          return value === null ? row : { ...row, [SHARE]: Math.round(value * 100) };
        });
      }

      /** The bands of the histogram, by bikes available now. */
      export const BANDS: Array<{ label: string; min: number; max: number }> = [
        { label: "0", min: 0, max: 0 },
        { label: "1–2", min: 1, max: 2 },
        { label: "3–5", min: 3, max: 5 },
        { label: "6–10", min: 6, max: 10 },
        { label: "11–20", min: 11, max: 20 },
        { label: "21+", min: 21, max: Infinity },
      ];

      /** How many stations fall in each band; a station that sent no count is in none. */
      export function histogram(rows: Row[]): number[] {
        const counts = BANDS.map(() => 0);
        for (const row of rows) {
          const now = bikes(row);
          if (now === null) continue;
          const band = BANDS.findIndex((b) => now >= b.min && now <= b.max);
          if (band >= 0) counts[band] += 1;
        }
        return counts;
      }

      /**
       * The `n` fullest (highest share of docks with a bike) or emptiest stations, with their share in
       * percent; a station without both counts is left out, ties go to the one with more bikes, then by name.
       */
      export function ranked(rows: Row[], n: number, order: "fullest" | "emptiest"): Array<{ name: string; percent: number; bikes: number }> {
        const known = rows.flatMap((row) => {
          const value = share(row);
          const now = bikes(row);
          return value === null || now === null ? [] : [{ name: String(row.name ?? row.id), percent: Math.round(value * 100), bikes: now }];
        });
        known.sort((a, b) =>
          order === "fullest"
            ? b.percent - a.percent || b.bikes - a.bikes || a.name.localeCompare(b.name)
            : a.percent - b.percent || a.bikes - b.bikes || a.name.localeCompare(b.name),
        );
        return known.slice(0, Math.max(0, n));
      }
    test-setup.ts: |
      import "@testing-library/jest-dom/vitest";
      import { configure } from "@testing-library/react";
      import { afterAll } from "vitest";
      import { recordControls } from "@joinedcontext/sdk/testing";

      // The Apps' coverage gate reads which controls the tests rendered and which they exercised (T-3373).
      recordControls(afterAll);

      // ci-full runs every App's suite under v8 coverage, where the library's 1 s default for
      // findBy*/waitFor gives way: a different test missed it on each run (T-4350, as ui/tests/setup.ts).
      configure({ asyncUtilTimeout: 5_000 });
