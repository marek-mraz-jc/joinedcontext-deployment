    e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { BASE, serve } from "./serve";

      // UI-84, SDK-12 (T-2825): every screen at a phone, a tablet, a laptop and a wall: no sideways
      // scroll, no two blocks over each other, nothing axe finds at WCAG 2.1 AA.
      const VIEWS = [
        { name: "overview", hash: "#overview", choose: null },
        { name: "stations", hash: "#stations", choose: null },
        { name: "a chosen station", hash: "#stations", choose: "Kaivopuisto" },
      ];

      for (const view of VIEWS) {
        for (const size of WIDTHS) {
          test(`${view.name} at ${size.width} px: no sideways scroll, no overlap, axe clean`, async ({ page }, testInfo) => {
            const { outside, missing, problems } = await serve(page);
            await page.setViewportSize(size);
            await page.goto(`${BASE}${view.hash}`);
            if (view.hash === "#overview") {
              await expect(page.getByText("Bikes available", { exact: true })).toBeVisible();
              // T-2924: the map and the three charts are drawn on the first screen, in colour.
              const overview = page.getByRole("region", { name: "Overview" });
              await expect(overview.getByTestId("jc-map").locator("canvas")).toHaveCount(1);
              await expect(overview.locator(".jc-chart-canvas canvas")).toHaveCount(3);
            } else {
              const stations = page.getByRole("region", { name: "Stations" });
              await expect(stations.getByRole("table").getByText("Kaivopuisto")).toBeVisible();
              await expect(stations.getByTestId("jc-map").locator("canvas")).toHaveCount(1);
              if (view.choose) {
                await stations.getByRole("table").getByText(view.choose).click();
                // SDK-40: the station opens in the shell's entity panel, linked to the Portal, no Edit.
                const panel = page.getByRole("dialog", { name: view.choose });
                await expect(panel.getByRole("link", { name: "Open in the Portal" })).toBeVisible();
                await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
              }
            }
            await testInfo.attach(`${view.name}-${size.width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      // The panel in the dark as well, at a phone and a laptop, and Escape closes it (SDK-40, T-3395).
      for (const width of [375, 1440]) {
        test(`dark at ${width} px: a station in the entity panel, axe clean, Escape closes it`, async ({ page }) => {
          await page.emulateMedia({ colorScheme: "dark" });
          const { outside, missing, problems } = await serve(page);
          await page.setViewportSize({ width, height: 900 });
          await page.goto(`${BASE}#stations`);
          await page.getByRole("region", { name: "Stations" }).getByRole("table").getByText("Kaivopuisto").click();
          await expect(page.getByRole("dialog", { name: "Kaivopuisto" })).toBeVisible();
          expect(await layoutProblems(page)).toEqual([]);
          await page.keyboard.press("Escape");
          await expect(page.getByRole("dialog")).toHaveCount(0);
          expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
        });
      }
    e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { Page } from "@playwright/test";
      import { stubTransport } from "@joinedcontext/sdk/testing";
      import { STATIONS } from "../src/fixtures/stations";

      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      export const BASE = "http://portal.test/";
      const SLUG = "helsinkibikes";
      // `portal`: where the entity panel links a station for editing (SDK-40); shown, never followed.
      const CONFIG = { slug: SLUG, orgDomain: "hel.fi", space: "helsinki", transport: "origin", appName: "helsinki-bikes", portal: "https://portal.test/projects/helsinki" };
      const TYPES: Record<string, string> = { ".html": "text/html", ".js": "text/javascript", ".css": "text/css", ".json": "application/json", ".svg": "image/svg+xml" };

      /** What the served page did that it should not: a host it called, a file it missed, an error it threw. */
      export interface Served {
        outside: string[];
        missing: string[];
        problems: string[];
      }

      /** Serves the built bundle at the root of the App's own host, with the SDK's stub answering its endpoint. */
      export async function serve(page: Page): Promise<Served> {
        const transport = stubTransport({
          entities: STATIONS,
          access: { permissions: [{ resource: { type: "BikeHireDockingStation" }, actions: ["queryEntity", "retrieveEntity"], attributes: "*" }], prohibitions: [] },
        });
        const served: Served = { outside: [], missing: [], problems: [] };
        page.on("pageerror", (error) => served.problems.push(error.message));

        await page.route("**/*", async (route) => {
          const url = new URL(route.request().url());
          if (url.origin !== "http://portal.test") {
            served.outside.push(url.href);
            return route.abort();
          }
          // A published app is served at the root of its own host and calls its endpoint unprefixed,
          // where the edge sets the session as the bearer (T-2670, T-2838); the stub answers that path.
          if (url.pathname.startsWith(`/api/endpoint/${SLUG}/`)) {
            const body = route.request().postData();
            const path = url.pathname + url.search;
            const answer = await transport({ method: route.request().method() as "GET", path, body: body ? JSON.parse(body) : undefined });
            return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body ?? null) });
          }
          const file = normalize(url.pathname.slice(1) || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) {
            served.missing.push(url.pathname);
            return route.fulfill({ status: 404, body: "" });
          }
          let body = readFileSync(join(DIST, file));
          if (file === "index.html") {
            body = Buffer.from(
              body.toString("utf8").replace('<script id="jc-config" type="application/json"></script>', `<script id="jc-config" type="application/json">${JSON.stringify(CONFIG)}</script>`),
            );
          }
          return route.fulfill({ status: 200, contentType: TYPES[extname(file)] ?? "application/octet-stream", body });
        });
        return served;
      }
    e2e__stations.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { STATIONS } from "../src/fixtures/stations";
      import { BASE, serve } from "./serve";

      // AP-07, AP-14: the served bundle lists the five stations and the filter hides the ones with none.
      test("the stations page shows the five stations and the filter hides the empty ones", async ({ page }) => {
        const { outside, missing, problems } = await serve(page);

        await page.goto(`${BASE}#stations`);
        const stations = page.getByRole("region", { name: "Stations" });
        const table = stations.getByRole("table");
        for (const station of STATIONS) await expect(table.getByText(String(station.name))).toBeVisible();

        await stations.getByRole("checkbox", { name: "Only stations with bikes" }).check();
        await expect(table.getByText("Laivasillankatu")).toHaveCount(0);
        await expect(table.getByText("Sepänkatu")).toHaveCount(0);
        await expect(table.getByText("Viiskulma")).toHaveCount(0);
        await expect(table.getByText("Kaivopuisto")).toBeVisible();

        // AP-11: nothing left the page for another host, and the bundle ran without an error. The
        // map's worker is part of the bundle: a published app has no library folder to find it in.
        await expect(stations.getByTestId("jc-map").locator("canvas")).toHaveCount(1);
        expect(missing).toEqual([]);
        expect(outside).toEqual([]);
        expect(problems).toEqual([]);
      });
