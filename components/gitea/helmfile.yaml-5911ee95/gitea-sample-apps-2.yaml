    .gitea__workflows__build.yml: |
      # The build of this application (AP-80, AP-100, AP-101, AP-104, ADR-N-028). The Portal writes this
      # file in the application's first commit and a run never changes it: only a version a reviewer
      # merged runs. It builds the default branch on every push to it, and again when the Portal's
      # Rebuild dispatches it (AP-103).
      #
      # Runs on the installation's `gitea-runner` (label node-22), whose image carries the SDK and the
      # template's packages already installed, so nothing is installed here (AP-82). No step fetches an
      # action: the runner reaches the forge and the Portal API only (AP-81), by the in-cluster
      # addresses it gives every job as JC_FORGE_URL and JC_PORTAL_URL; `gitea.server_url` is the
      # public host, which the runner cannot reach.
      #
      # Two jobs: `build` runs the application's code and holds the job token only; `propose` runs no
      # code of the application and is the only one that sees the lane's secret. The Portal checks the
      # uploaded bundle against the proposed digest and publishes the package itself (AP-104).
      name: build

      on:
        push:
          branches: [main]
        workflow_dispatch:

      jobs:
        # `build` runs in a pod of this App's own (label app-build-rust: Rust to WebAssembly, AP-142), registered with this
        # repository's token alone and mounting this App's build cache; `propose` stays on the shared
        # runner and mounts no cache (AP-130, AP-131).
        build:
          runs-on: app-build-rust
          timeout-minutes: 30
          env:
            JC_BUILD_DIR: ${{ runner.temp }}/jc-build
          outputs:
            digest: ${{ steps.upload.outputs.digest }}
            commit: ${{ steps.upload.outputs.commit }}
            sdk-version: ${{ steps.upload.outputs.sdk-version }}
            built-at: ${{ steps.upload.outputs.built-at }}
          steps:
            # Clones the commit, runs the tests, builds and bundles the functions; the application's
            # own code runs here, with the job token removed from its environment.
            - name: Test and build
              env:
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_APP_COMMIT: ${{ gitea.sha }}
                JC_FORGE_TOKEN: ${{ gitea.token }}
              run: JC_APP_REPO="$JC_FORGE_URL/$JC_REPOSITORY.git" build-app

            # bundle-{commit} and sbom-{commit}, the run's artifacts, for the Portal to check and publish.
            - name: Upload the build
              id: upload
              run: node /opt/template/lane.mjs upload "$JC_BUILD_DIR"

        propose:
          needs: build
          runs-on: node-22
          timeout-minutes: 5
          steps:
            # The one step that sees the lane's secret, and it runs no code of the application (AP-80).
            - name: Propose status.build
              env:
                JC_LANE_TOKEN: ${{ secrets.JC_LANE_TOKEN }}
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_DIGEST: ${{ needs.build.outputs.digest }}
                JC_COMMIT: ${{ needs.build.outputs.commit }}
                JC_SDK_VERSION: ${{ needs.build.outputs.sdk-version }}
                JC_BUILT_AT: ${{ needs.build.outputs.built-at }}
              run: node /opt/template/lane.mjs propose "$JC_REPOSITORY"
    .gitignore: |
      # The WebAssembly build: the lane (or `pnpm wasm`) writes wasm/pkg from wasm/.
      wasm/pkg/
      wasm/target/
      node_modules/
      dist/
      test-results/
      *.tsbuildinfo
      playwright-report/
      pnpm-lock.yaml
    README.md: |
      # My day of events

      For a visitor to Helsinki: which of the day's events to see, in which order, with the walk
      between them, in Finnish, Swedish or English (the events' own names as the Portal's language asks):

      - the day (today, or a later one) and a search;
      - the plan on opening: with nothing picked, a suggested day of events that follow one another on
        foot; with events picked, those events in the order that fits most of them, each with its time,
        the walk from the last one, and a mark when it starts before the visitor can get there or is out
        of reach; the events that take place at the same time are named;
      - the plan's stops on the map, with the walk between them;
      - the day's events, soonest first, each with a box to add it to the day (a cancelled one is shown
        and cannot be picked), its place, its source and what it is about;
      - how many events start each hour; a click on a bar lists that hour's;
      - the day as a calendar file (.ics) to save.

      An event's name in the plan or the list, or its stop on the map, opens it in the SDK shell's
      entity panel, in the page's language, with a link to the event in the Portal; the App writes
      never writes the city's data, so the panel offers no Edit. The language is the shell's switch,
      Suomi, English or Svenska.

      The day, the search, the hour and the picks are kept in the address (`?day=`, `?q=`, `?hour=`,
      `?pick=`, `?lang=`), so a reload or a shared link shows the same day.

      ## How the day is planned

      The planner is Rust, in `wasm/`, compiled to WebAssembly and run in the reader's browser in a Web
      Worker, so the page never stalls:

      - an event of up to three hours is sat through from its start; a longer one (an exhibition, a
        fair) is a place to drop by for an hour while it is open;
      - the walk between two places is the great-circle distance at 5 km/h; an event with no place adds
        no walk and says so;
      - up to eight picked events every order is tried, more by start time then 2-opt; the best order
        fits the most events, then is the least late, then walks the least; at most 20 are planned;
      - with nothing picked, the suggested day takes the events by earliest end, each reachable before
        it starts, at most four;
      - the calendar file is RFC 5545: UTC times, escaped text, lines folded at 75 octets.

      ## Sharing a day

      **Share this day** sends the day and the picked events' ids to the App's server, a WebAssembly
      component on the platform's shared host (`server/`, `kind: wasm`, ADR-N-044). The server reads those
      events again from the gateway, as the visitor (an anonymous visitor reads what the public role may),
      plans the day with the same Rust (`../wasm`, without the browser's bindings) and keeps it in the
      App's own schema (`migrations/`) under a code of 12 letters and digits; the calendar file goes
      under the App's own prefix, `shares/{code}.ics`. The visitor gets the link, `?share={code}`, to copy,
      and the calendar file of what was shared, downloaded through a URL valid for two minutes.

      Opening a link puts the shared day and picks into the address and drops the code, so the page then
      plans that day from the data of the moment and the visitor's own changes stay theirs. A shared day is
      cleared a week after its date, a few at each new share.

      | Route | What it does |
      |---|---|
      | `POST /api/itineraries` `{day, ids, lang}` | the day planned from the gateway and kept; its code |
      | `GET /api/itineraries/{code}` | the shared day, its picks and its plan |
      | `GET /api/itineraries/{code}/ics` | a URL the calendar file downloads from |

      ## Roles and history

      The server decides from the signed-in person the platform names (`identity::caller()`, API/07),
      never from anything the page sends:

      - anyone, signed in or not, plans and shares a day and sees the **featured events**;
      - a **viewer** finds the days they shared while signed in under **My days**, opens one again and
        deletes it with its calendar file; a day of someone else's answers as if it did not exist;
      - a **steward** features an event of the day from the list (**Feature**), writes a note for it
        and takes it back; every visitor sees the featured events above the list and picks them into
        their day like any other.

      A feature, a note, a removal and a deleted day show at once and go back when the server refuses.
      Every change writes a row into the App's `app_audit` table in the same statement, so a refused or
      failed change leaves none; the **History** page reads it: a viewer their own rows, a steward
      everyone's.

      | Route | Who | What it does |
      |---|---|---|
      | `GET /api/me` | anyone | the caller's name and roles, `null` when signed out |
      | `GET /api/days` | signed in | the latest 50 days the caller shared |
      | `DELETE /api/days/{id}` | the sharer | the day and its calendar file gone |
      | `GET /api/featured` | anyone | the featured events, at most 50 |
      | `POST /api/featured` `{eventId, note}` | steward | an event featured |
      | `PUT /api/featured/{id}` `{note}` | steward | its note changed |
      | `DELETE /api/featured/{id}` | steward | no longer featured |
      | `GET /api/history` | signed in | the newest 100 changes (a viewer: their own) |

      `server/host-test.json` plays every route on the real host as an anonymous visitor, a viewer,
      another viewer and a steward, and counts the rows after each refused write.

      ## Data

      One data need on the Context Space `helsinki`: `Event` with `name`, `description`, `startDate`,
      `endDate`, `eventStatus`, `address`, `location` and `source`, the Linked Events registers the
      events pipeline writes. Only events that have not ended are read. The app writes nothing to the
      Context Space: shared days, featured events and the history are kept in its own schema.

      ## Run the tests

      Needs Rust with the `wasm32-unknown-unknown` target and `wasm-bindgen-cli` 0.2.129, the version
      `wasm/Cargo.lock` pins and the build lane binds with.

      ```sh
      pnpm install
      pnpm wasm          # cargo test of wasm/, then the module into wasm/pkg (the lane runs builder/build-wasm.sh)
      pnpm test          # vitest, with the real WebAssembly module
      pnpm build         # the bundle the build lane publishes
      pnpm e2e           # the built bundle in Chromium at four widths, light and dark (needs `pnpm build`)
      (cd server && cargo test && cargo build --release --target wasm32-wasip2)   # the server component
      ```

      `server/host-test.json` is the server component's scenario on the real host: the portal
      repository's `tests/wasm-apps` (`tests/scenarios.rs`, ci-full) builds the component, runs
      `migrations/` twice as the reconciler does, and plays the scenario against Postgres, RustFS and a
      mock of the App's own Endpoint, with a second App that must see nothing.
    app.yaml: |
      # My day of events (T-3329): a visitor picks Helsinki's events they like and gets a plan for the
      # day: the order that fits most, when to be where, the walk between, what clashes, and the day as
      # a calendar file. Hand written, so no generated-by annotation (AP-35).
      #
      # A server WASM App (`kind: wasm`, ADR-N-044, T-3347): React on the App SDK with its Rust compiled
      # to WebAssembly and run in the reader's browser while they click (wasm/), and a server component
      # on the shared host (server/) that plans a day again from the gateway's events when a visitor
      # shares it, and keeps it under a short code with its calendar file. Its own schema (migrations/)
      # and its own files under its prefix are the App's alone. Its source is its own repository on the
      # forge, which the build lane builds at `ref` (AP-75, AP-80, AP-151); this folder of the portal
      # repository is where CI tests the same tree before it is pushed there (T-2599).
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: event-day-planner
        namespace: helsinki
        title:
          en: "My day of events"
          fi: "Tapahtumapäiväni"
        description:
          en: "Pick the events you like in Helsinki and get a plan for the day: the best order, walking times between them, what clashes, and a calendar file."
          fi: "Valitse Helsingin tapahtumat, jotka kiinnostavat, ja saat päivän suunnitelman: paras järjestys, kävelyajat, päällekkäisyydet ja kalenteritiedosto."
      spec:
        kind: wasm
        source:
          git:
            url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_event-day-planner.git
            ref: main
        build:
          node: "22"
          rust: "1.90"
        storage:
          sql: { migrations: migrations, quotaMiB: 100 }
          blob: { quotaMiB: 256 }
        # The events endpoint of Helsinki is public (GW22): an anonymous reader gets what the public
        # role is granted and nothing more.
        visibility: public
        lifecycle: published
        # Roles (T-3826): anyone plans and shares a day; a signed-in viewer keeps the days they shared;
        # a steward also curates the featured events every visitor sees. The server decides from the
        # caller the platform names, never from the request.
        roles:
          - name: viewer
            title: { en: "Viewer", fi: "Katselija" }
            description: "Plans a day, shares it and keeps the days they shared under My days, deleting their own."
          - name: steward
            title: { en: "Steward", fi: "Ylläpitäjä" }
            description: "What a viewer does, and curates the featured events: adds, notes and removes them. Reads the whole history. The city's data is only read."
        access:
          - role: viewer
            subjects: [{ group: event-day-planner-viewer }]
          - role: steward
            subjects: [{ group: event-day-planner-steward }]
        dataNeeds:
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [Event]
            # The attributes the Event entities carry on dev (read 2026-10-08 on the helsinki-events
            # endpoint): name and description in fi, sv and en, the times, status, place and source.
            attrs: [name, description, startDate, endDate, eventStatus, address, location, source]
            operations: [queryEntity, retrieveEntity]
            representations: [ngsi-ld, ogc-features]
    e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { BASE, STEWARD, VIEWER, serve } from "./serve";

      // T-3329, UI-84, SDK-12: the day at a phone, a tablet, a laptop and a wall, light and dark, with the
      // WebAssembly planner run in its worker under the static host's policy: no sideways scroll, no two
      // blocks over each other, nothing axe finds at WCAG 2.1 AA.
      for (const scheme of ["light", "dark"] as const) {
        for (const size of WIDTHS) {
          test(`${scheme} at ${size.width} px: a day is suggested, no sideways scroll, no overlap, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const { outside, missing, problems } = await serve(page);
            await page.setViewportSize(size);
            await page.goto(BASE);
            const day = page.getByRole("region", { name: "My day" });
            await expect(day.getByRole("list", { name: "The plan" }).getByRole("listitem").first()).toBeVisible();
            await expect(day.getByTestId("jc-map").locator("canvas")).toHaveCount(1);
            await expect(day.locator(".jc-chart-canvas canvas")).toHaveCount(1);
            await testInfo.attach(`day-${scheme}-${size.width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      test("picked events are planned in order and stay picked after a reload", async ({ page }) => {
        await serve(page);
        await page.goto(BASE);
        const list = page.getByRole("list", { name: "Events of the day" });
        await list.getByRole("checkbox", { name: /Jazz at Stoa/ }).check();
        await list.getByRole("checkbox", { name: /Workshop for Families/ }).check();
        const plan = page.getByRole("list", { name: "The plan" });
        await expect(plan.getByRole("listitem")).toHaveCount(2);
        await expect(plan.getByRole("listitem").first()).toContainText("Workshop for Families");
        await page.reload();
        await expect(page.getByRole("list", { name: "The plan" }).getByRole("listitem").last()).toContainText("Jazz at Stoa");
      });

      // SDK-40, T-3393: an event of the plan opens in the shell's entity panel, read through the app's
      // endpoint, at a phone and a laptop, light and dark; a public App writes nothing, so the panel links
      // to the Portal. Finnish speaks in the panel too.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: an event in the entity panel, linked to the Portal, axe clean`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            const { outside, missing, problems } = await serve(page);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(BASE);
            await page.getByRole("list", { name: "The plan" }).getByRole("button", { name: "Workshop for Families" }).click();
            const panel = page.getByRole("dialog");
            await expect(panel.getByText("Siltakatu 11, Helsinki")).toBeVisible();
            await expect(panel.getByRole("link", { name: "Open in the Portal" })).toBeVisible();
            await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
            expect(await layoutProblems(page)).toEqual([]);
            await page.keyboard.press("Escape");
            await expect(page.getByRole("dialog")).toHaveCount(0);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      test("switches to Finnish, and the panel speaks it", async ({ page }) => {
        await serve(page);
        await page.goto(BASE);
        await page.getByRole("combobox", { name: "Language" }).selectOption("fi");
        await expect(page.getByRole("heading", { level: 1, name: "Tapahtumapäiväni" })).toBeVisible();
        // The page's words switch; the events keep the language the Portal serves them in.
        await page.getByRole("list", { name: "Suunnitelma" }).getByRole("button", { name: "Workshop for Families" }).click();
        await expect(page.getByRole("dialog").getByRole("link", { name: "Avaa portaalissa" })).toBeVisible();
        await page.reload();
        await expect(page.getByRole("heading", { level: 1, name: "Tapahtumapäiväni" })).toBeVisible();
      });

      // T-3826: a steward features an event and notes it; a viewer finds it, keeps their days and reads
      // their history, at a phone and a laptop, light and dark.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: a steward features an event, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page, STEWARD);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(BASE);
            await expect(page.getByLabel("Your role: Steward")).toBeVisible();
            await page.getByRole("list", { name: "Events of the day" }).getByRole("button", { name: "Feature: Organ concert" }).click();
            const featured = page.getByRole("list", { name: "Featured events" });
            await expect(featured.getByText("Organ concert", { exact: true })).toBeVisible();
            await featured.getByRole("textbox", { name: "Note" }).fill("Free entry, come early");
            await featured.getByRole("button", { name: "Save the note" }).click();
            await expect(page.getByText("The note is saved.")).toBeVisible();
            await testInfo.attach(`featured-steward-${scheme}-${width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            await page.getByRole("button", { name: "History" }).click();
            await expect(page.getByText("changed: changed the note")).toBeVisible();
            expect(await layoutProblems(page)).toEqual([]);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });

          test(`${scheme} at ${width} px: a viewer's days and history, nothing to feature, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page, VIEWER);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(BASE);
            await expect(page.getByLabel("Your role: Viewer")).toBeVisible();
            await expect(page.getByText("A steward curates the featured events.")).toBeVisible();
            await expect(page.getByRole("button", { name: /^Feature:/ })).toHaveCount(0);
            await page.getByRole("button", { name: "My days" }).click();
            await expect(page.getByRole("link", { name: /^Open: .*2030 · 2 events/ })).toBeVisible();
            await testInfo.attach(`days-viewer-${scheme}-${width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            await page.getByRole("button", { name: "History" }).click();
            await expect(page.getByText("No change yet.")).toBeVisible();
            expect(await layoutProblems(page)).toEqual([]);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }
    e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { Page } from "@playwright/test";
      import { stubTransport } from "@joinedcontext/sdk/testing";
      import { EVENTS } from "../src/fixtures/events";

      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      export const BASE = "http://portal.test/";
      const SLUG = "eventdayplanner";
      // `portal`: where the entity panel links an event (SDK-40); shown, never followed.
      const CONFIG = { slug: SLUG, orgDomain: "hel.fi", space: "helsinki", transport: "origin", appName: "event-day-planner", language: "en", portal: "https://portal.test/projects/helsinki" };
      const TYPES: Record<string, string> = {
        ".html": "text/html",
        ".js": "text/javascript",
        ".css": "text/css",
        ".json": "application/json",
        ".svg": "image/svg+xml",
        ".wasm": "application/wasm",
      };
      // What the Portal's static host sends for a `kind: ui` App once T-3327 allows WebAssembly: no
      // 'unsafe-eval', only 'wasm-unsafe-eval', and nothing from another host.
      const CSP = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'";

      /** What the served page did that it should not: a host it called, a file it missed, an error it threw. */
      export interface Served {
        outside: string[];
        missing: string[];
        problems: string[];
      }

      /** Who the App's server says is signed in (T-3826): a viewer unless a test names a steward. */
      export const VIEWER = { id: "u-1", name: "Vierailija", roles: ["viewer"] };
      export const STEWARD = { id: "u-2", name: "Ylläpitäjä", roles: ["viewer", "steward"] };

      /** Serves the built bundle at the root of the App's own host, with the SDK's stub answering its endpoint. */
      export async function serve(page: Page, me: { id: string; name: string; roles: string[] } = VIEWER): Promise<Served> {
        const transport = stubTransport({
          entities: EVENTS,
          access: { permissions: [{ resource: { type: "Event" }, actions: ["queryEntity", "retrieveEntity"], attributes: "*" }], prohibitions: [] },
        });
        const served: Served = { outside: [], missing: [], problems: [] };
        // One day this viewer shared before, the featured events a steward keeps, and the history.
        const days = [{ id: 1, code: "abc123def456", day: "2030-10-20", events: 2, createdAt: "2030-10-19T09:00:00Z" }];
        const featured: { id: number; eventId: string; note: string }[] = [];
        const history: unknown[] = [];
        page.on("pageerror", (error) => served.problems.push(error.message));
        // Sunday 20 October 2030, 08:00 in Helsinki: the fixtures' day, before its first event.
        await page.clock.setFixedTime(new Date("2030-10-20T05:00:00Z"));

        await page.route("**/*", async (route) => {
          const url = new URL(route.request().url());
          if (url.origin !== "http://portal.test") {
            served.outside.push(url.href);
            return route.abort();
          }
          if (url.pathname.startsWith(`/api/endpoint/${SLUG}/`)) {
            const body = route.request().postData();
            const path = url.pathname + url.search;
            const answer = await transport({ method: route.request().method() as "GET", path, body: body ? JSON.parse(body) : undefined });
            return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body ?? null) });
          }
          // The App's own server (T-3347, T-3826), deciding by `me` as the real one does; any other call is missing.
          const api = `/apps/${CONFIG.appName}/api`;
          const method = route.request().method();
          const json = (status: number, body: unknown) => route.fulfill({ status, contentType: "application/json", body: JSON.stringify(body) });
          const steward = me.roles.includes("steward");
          const record = (action: string, target: string, summary: string) =>
            history.unshift({ id: history.length + 1, at: "2030-10-20T05:00:00Z", actorName: me.name, action, target, summary });
          if (url.pathname === `${api}/me` && method === "GET") return json(200, me);
          if (url.pathname === `${api}/days` && method === "GET") return json(200, days);
          if (url.pathname === `${api}/featured` && method === "GET") return json(200, featured);
          if (url.pathname === `${api}/history` && method === "GET") return json(200, history);
          if (url.pathname === `${api}/featured` && method === "POST") {
            if (!steward) return json(403, { detail: "this needs the role steward" });
            const made = { id: featured.length + 1, ...(JSON.parse(route.request().postData() ?? "{}") as { eventId: string; note: string }) };
            featured.push(made);
            record("insert", `featured/${made.id}`, `featured ${made.eventId}`);
            return json(201, made);
          }
          const one = url.pathname.match(new RegExp(`^${api}/featured/(\\d+)$`));
          if (one && method === "PUT") {
            if (!steward) return json(403, { detail: "this needs the role steward" });
            const found = featured.find((f) => f.id === Number(one[1]));
            if (!found) return json(404, { detail: "no such featured event" });
            found.note = (JSON.parse(route.request().postData() ?? "{}") as { note: string }).note;
            record("update", `featured/${found.id}`, "changed the note");
            return route.fulfill({ status: 204 });
          }
          const file = normalize(url.pathname.slice(1) || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) {
            served.missing.push(url.pathname);
            return route.fulfill({ status: 404, body: "" });
          }
          let body = readFileSync(join(DIST, file));
          if (file === "index.html") {
            body = Buffer.from(
              body.toString("utf8").replace('<script id="jc-config" type="application/json"></script>', `<script id="jc-config" type="application/json">${JSON.stringify(CONFIG)}</script>`),
            );
          }
          return route.fulfill({
            status: 200,
            contentType: TYPES[extname(file)] ?? "application/octet-stream",
            headers: { "content-security-policy": CSP },
            body,
          });
        });
        return served;
      }
