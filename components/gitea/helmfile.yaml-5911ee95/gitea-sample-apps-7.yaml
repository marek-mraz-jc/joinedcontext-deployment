          fireEvent.change(screen.getByRole("combobox", { name: "Period" }), { target: { value: "4" } });
          fireEvent.change(screen.getByRole("combobox", { name: "Number of topics" }), { target: { value: "3" } });
          fireEvent.change(screen.getByRole("searchbox", { name: "Search" }), { target: { value: "  tram  " } });
          expect(new URLSearchParams(window.location.hash.slice(window.location.hash.indexOf("?") + 1)).toString()).toBe("weeks=4&k=3&topic=0&q=tram");

          const toggle = screen.getByRole("button", { name: "Show the numbers as a table" });
          fireEvent.click(toggle);
          expect(toggle).toHaveAttribute("aria-expanded", "true");
          fireEvent.click(screen.getByRole("button", { name: /hide the table/i }));
          for (const link of screen.getAllByRole("link", { name: /^Read on hel\.fi/ })) fireEvent.click(link);
          vi.useRealTimers();
        });

        it("reads the address it was given, and falls back for what it cannot read", async () => {
          window.history.replaceState(null, "", "/#topics?weeks=99&k=42&topic=x&q=school");
          renderTopics(ARTICLES);
          await screen.findByRole("list", { name: /topics of the period/i });
          expect(screen.getByRole("combobox", { name: "Period" })).toHaveValue("all");
          expect(screen.getByRole("combobox", { name: "Number of topics" })).toHaveValue("5");
          expect(screen.getByRole("searchbox", { name: "Search" })).toHaveValue("school");
          // The search leaves only what it finds, so the empty answer of a narrowed list is the page's.
          fireEvent.change(screen.getByRole("searchbox", { name: "Search" }), { target: { value: "nothing like it" } });
          expect(await screen.findByText(/no news in this period/i)).toBeInTheDocument();
          // Back from somewhere else in the address.
          window.history.replaceState(null, "", "/#topics?weeks=8");
          window.dispatchEvent(new HashChangeEvent("hashchange"));
          await waitFor(() => expect(screen.getByRole("combobox", { name: "Period" })).toHaveValue("8"));
        });

        it("answers every control in Finnish", async () => {
          window.history.replaceState(null, "", "/?lang=fi");
          renderTopics(ARTICLES);
          await screen.findByRole("list", { name: /ajanjakson aiheet/i });
          fireEvent.change(screen.getByRole("combobox", { name: "Ajanjakso" }), { target: { value: "12" } });
          fireEvent.change(screen.getByRole("combobox", { name: "Aiheiden määrä" }), { target: { value: "4" } });
          fireEvent.change(screen.getByRole("searchbox", { name: "Hae" }), { target: { value: "" } });
          expect(window.location.hash).toBe("#topics?weeks=12&k=4");
          for (const topic of ["Aihe 1: school, education, pupils", "Aihe 2: traffic, tram, construction"]) fireEvent.click(screen.getByRole("button", { name: topic }));
          fireEvent.click(screen.getByRole("button", { name: "Aihe 1: school, education, pupils" }));
          fireEvent.click(screen.getByRole("button", { name: "Näytä luvut taulukkona" }));
          fireEvent.click(screen.getByRole("button", { name: "Piilota taulukko" }));
          for (const link of screen.getAllByRole("link", { name: /^Lue hel\.fi:ssä/ })) fireEvent.click(link);
        });

        // What the analysis or the feed may hand the page that it still shows.
        it("shows an undated and an unnamed article, a topic with no keyword and a week with no share", async () => {
          const undated: Row = { id: "urn:ngsi-ld:Article:hel.fi:helsinki:news-9", type: "Article" };
          mockTopicsState = {
            status: "ready",
            result: {
              topics: [
                { id: 0, keywords: [], articles: [undated.id, ARTICLES[0].id], share: 1 },
                { id: 1, keywords: [{ term: "tram", weight: 1 }], articles: ["urn:ngsi-ld:Article:hel.fi:helsinki:gone"], share: 0 },
              ],
              weeks: [{ week: "2026-W41", shares: [1] }],
              unassigned: [],
            },
            error: null,
          };
          window.history.replaceState(null, "", "/#topics?topic=7&weeks=4");
          renderTopics([...ARTICLES, undated]);
          const articles = await screen.findByRole("list", { name: /articles of topic/i });
          // The dated article first, the undated one after it, named by its id and said to have no date.
          const titles = within(articles).getAllByRole("heading").map((heading) => heading.textContent);
          expect(titles).toEqual(["New school opens in Kalasatama", undated.id]);
          expect(within(articles).getByText(/no date/i)).toBeInTheDocument();
          // The topic names arrive from the App's server after the first draw, and the chart draws again.
          const option = await waitFor(() => {
            const last = charts.at(-1)?.setOption.mock.calls.at(-1)?.[0];
            expect(last).toBeDefined();
            return last as { series: Array<{ name: string; data: number[] }>; tooltip: { valueFormatter: (value: unknown) => string } };
          });
          expect(option.series.map((series) => series.name)).toEqual(["Topic 1", "Topic 2: tram"]);
          expect(option.series[1].data).toEqual([0]);
          expect(option.tooltip.valueFormatter(12.345)).toBe("12.3%");
          expect(option.tooltip.valueFormatter("-")).toBe("-");
          fireEvent.click(screen.getByRole("button", { name: "Show the numbers as a table" }));
          expect(within(screen.getByRole("table", { name: /topic share/i })).getAllByText(/0\s*%/).length).toBeGreaterThan(0);
          // A topic none of whose articles the page holds says so; its button names it by its keywords.
          fireEvent.click(screen.getByRole("button", { name: "Topic 2: tram" }));
          expect(await screen.findByText(/no news in this period/i)).toBeInTheDocument();
          fireEvent.click(screen.getByRole("button", { name: "Topic 1" }));
          fireEvent.click(within(screen.getByRole("list", { name: /articles of topic/i })).getByRole("button", { name: undated.id }));
          fireEvent.click(within(screen.getByRole("list", { name: /articles of topic/i })).getByRole("button", { name: "New school opens in Kalasatama" }));
          fireEvent.click(screen.getByRole("link", { name: "Read on hel.fi: New school opens in Kalasatama" }));
          // Back to every default: the address keeps no parameter.
          fireEvent.change(screen.getByRole("combobox", { name: "Period" }), { target: { value: "all" } });
          fireEvent.click(screen.getByRole("button", { name: "Hide the table" }));
        });

        it("says it is analysing while the first answer is on its way, and has no weekly chart for an answer with no week", async () => {
          mockTopicsState = { status: "loading", result: null, error: null };
          renderTopics(ARTICLES);
          expect(await screen.findByRole("status")).toBeInTheDocument();
          cleanup();
          mockTopicsState = { status: "ready", result: { ...FIXED_TOPICS, weeks: [] }, error: null };
          renderTopics(ARTICLES);
          const chart = (await screen.findByText("Topic share per week", { selector: "figcaption" })).closest("figure") as HTMLElement;
          expect(within(chart).getByText(/no news in this period/i)).toBeInTheDocument();
          for (const name of ["Topic 1: school, education, pupils", "Topic 2: traffic, tram, construction"]) fireEvent.click(screen.getByRole("button", { name }));
          for (const name of ["New school opens in Kalasatama", "Education budget approved for next year"]) {
            fireEvent.click(screen.getByRole("button", { name: "Topic 1: school, education, pupils" }));
            fireEvent.click(within(screen.getByRole("list", { name: /articles of topic/i })).getByRole("button", { name }));
            fireEvent.click(screen.getByRole("link", { name: `Read on hel.fi: ${name}` }));
          }
          fireEvent.click(screen.getByRole("button", { name: "Show the numbers as a table" }));
        });
      });
    src__pages__Topics.tsx: |+
      import { useEffect, useMemo, useState } from "react";
      import { Card, Empty, Loading, Page, Problem, Split, currentTokens, format, useClient, useEntities, useEntitySelection } from "@joinedcontext/sdk";
      import type { Row } from "@joinedcontext/sdk";
      import { ChartCard } from "../components/ChartCard";
      import { FollowedCard, useFollows } from "../components/Follows";
      import { KeptWeeks } from "../components/KeptWeeks";
      import { NamesCard, useNames } from "../components/Names";
      import { useAccess } from "../access";
      import { formatDate, formatPercent, getLanguage, t } from "../i18n";
      import type { Lang } from "../i18n";
      import { mergeNamed, topTerm, useTopics } from "../topics";
      import type { Topic, WeekShare } from "../topics";
      import { useServer } from "../server";

      const ENTITY_TYPE = "Article";

      interface HashState {
        weeks: string;
        k: number;
        topic: number | null;
        q: string;
      }

      function readHash(): HashState {
        const hash = window.location.hash;
        // No `?` in the address: no parameter, so every default.
        const params = new URLSearchParams(hash.includes("?") ? hash.slice(hash.indexOf("?") + 1) : "");
        const rawWeeks = params.get("weeks");
        const weeks = rawWeeks === "4" || rawWeeks === "8" || rawWeeks === "12" || rawWeeks === "all" ? rawWeeks : "all";
        const rawK = parseInt(params.get("k") ?? "5", 10);
        const k = Number.isInteger(rawK) && rawK >= 3 && rawK <= 8 ? rawK : 5;
        const rawTopic = params.get("topic");
        const topic = rawTopic !== null && !Number.isNaN(parseInt(rawTopic, 10)) ? parseInt(rawTopic, 10) : null;
        const q = params.get("q") ?? "";
        return { weeks, k, topic, q };
      }

      function writeHash(state: HashState) {
        const params = new URLSearchParams();
        if (state.weeks !== "all") {
          params.set("weeks", state.weeks);
        }
        if (state.k !== 5) {
          params.set("k", String(state.k));
        }
        if (state.topic !== null) {
          params.set("topic", String(state.topic));
        }
        if (state.q.trim()) {
          params.set("q", state.q.trim());
        }
        const qs = params.toString();
        const nextHash = qs ? `#topics?${qs}` : "#topics";
        if (window.location.hash !== nextHash) {
          try {
            window.history.replaceState(null, "", nextHash);
          } catch {
            // Sandboxed previews may refuse replaceState
          }
        }
      }

      function filterRows(rows: Row[], weeks: string, query: string): Row[] {
        let result = rows;
        // `weeks` is "4", "8", "12" or "all": readHash takes nothing else.
        if (weeks !== "all") {
          const cutoff = Date.now() - Number(weeks) * 7 * 24 * 60 * 60 * 1000;
          result = result.filter((row) => {
            const time = typeof row.datePublished === "string" ? new Date(row.datePublished).getTime() : Number.NaN;
            return !Number.isNaN(time) && time >= cutoff;
          });
        }

        if (query.trim()) {
          const q = query.trim().toLowerCase();
          result = result.filter((row) => {
            const title = format(row.name).toLowerCase();
            return title.includes(q);
          });
        }

        return result;
      }

      function sortArticles(articles: Row[]): Row[] {
        return [...articles].sort((a, b) => {
          const da = typeof a.datePublished === "string" ? new Date(a.datePublished).getTime() : NaN;
          const db = typeof b.datePublished === "string" ? new Date(b.datePublished).getTime() : NaN;
          const aValid = !Number.isNaN(da);
          const bValid = !Number.isNaN(db);
          if (aValid && bValid) return db - da;
          if (aValid && !bValid) return -1;
          if (!aValid && bValid) return 1;
          return 0;
        });
      }

      /** A topic as the page names it: a steward's name, else its number. */
      export function topicLabel(topic: Topic, lang: Lang, nameOf: (term: string) => string | undefined = () => undefined): string {
        return nameOf(topTerm(topic)) ?? `${t("topicN", lang)} ${topic.id + 1}`;
      }

      export function buildWeeklyChartOption(
        weeks: WeekShare[],
        topics: Topic[],
        lang: Lang,
        labelOf: (topic: Topic) => string = (topic) => topicLabel(topic, lang),
      ): Record<string, unknown> | null {
        if (weeks.length === 0 || topics.length === 0) return null;
        const palette = currentTokens().chart.palette;
        const categories = weeks.map((w) => w.week);

        const series = topics.map((topic, index) => {
          const color = palette[index % palette.length];
          const topKeywords = topic.keywords.slice(0, 3).map((k) => k.term).join(", ");
          const name = `${labelOf(topic)}${topKeywords ? `: ${topKeywords}` : ""}`;
          const data = weeks.map((w) => {
            const share = w.shares[topic.id] ?? 0;
            return Math.round(share * 1000) / 10;
          });

          return {
            name,
            type: "bar",
            stack: "total",
            itemStyle: { color },
            emphasis: { focus: "series" },
            data,
          };
        });

        return {
          tooltip: {
            trigger: "axis",
            axisPointer: { type: "shadow" },
            valueFormatter: (value: unknown) => (typeof value === "number" ? `${value.toFixed(1)}%` : `${value}`),
          },
          legend: {
            bottom: 0,
            type: "scroll",
          },
          grid: {
            top: 24,
            left: 12,
            right: 24,
            bottom: 40,
            containLabel: true,
          },
          xAxis: {
            type: "category",
            data: categories,
          },
          yAxis: {
            type: "value",
            min: 0,
            max: 100,
            axisLabel: { formatter: "{value}%" },
          },
          series,
        };
      }

      export function Topics(): React.JSX.Element {
        const lang = getLanguage();
        const [hashState, setHashState] = useState<HashState>(readHash);
        const [showTable, setShowTable] = useState(false);
        const { select } = useEntitySelection();

        const { rows, loading: entitiesLoading, error: entitiesError, reload } = useEntities(ENTITY_TYPE);
        const server = useServer(useClient().config.appName);
        const { me } = useAccess();
        const names = useNames(server);
        const follows = useFollows(server);

        useEffect(() => {
          const onHashChange = () => {
            setHashState(readHash());
          };
          window.addEventListener("hashchange", onHashChange);
          return () => window.removeEventListener("hashchange", onHashChange);
        }, []);

        const filteredRows = useMemo(
          () => filterRows(rows, hashState.weeks, hashState.q),
          [rows, hashState.weeks, hashState.q],
        );

        const { status: topicsStatus, result: fitted, error: topicsError } = useTopics(filteredRows, hashState.k);
        // Topics a steward gave one name show as one (T-3828).
        const { nameOf } = names;
        const result = useMemo(() => (fitted ? mergeNamed(fitted, nameOf) : null), [fitted, nameOf]);
        const labelOf = (topic: Topic) => topicLabel(topic, lang, nameOf);

        const selectedTopic = useMemo(() => {
          if (!result || result.topics.length === 0) return null;
          if (hashState.topic !== null) {
            const match = result.topics.find((tp) => tp.id === hashState.topic);
            if (match) return match;
          }
          return result.topics[0];
        }, [result, hashState.topic]);

        const selectedArticles = useMemo(() => {
          if (!selectedTopic) return [];
          const articleMap = new Map(rows.map((r) => [r.id, r]));
          const matched = selectedTopic.articles
            .map((id) => articleMap.get(id))
            .filter((r): r is Row => r !== undefined);
          return sortArticles(matched);
        }, [selectedTopic, rows]);

        const chartOption = useMemo(
          () => (result ? buildWeeklyChartOption(result.weeks, result.topics, lang, (topic) => topicLabel(topic, lang, nameOf)) : null),
          [result, lang, nameOf],
        );

        const handlePeriodChange = (nextWeeks: string) => {
          const next = { ...hashState, weeks: nextWeeks };
          setHashState(next);
          writeHash(next);
        };

        const handleKChange = (nextK: number) => {
          const next = { ...hashState, k: nextK };
          setHashState(next);
          writeHash(next);
        };

        const handleSearchChange = (nextQ: string) => {
          const next = { ...hashState, q: nextQ };
          setHashState(next);
          writeHash(next);
        };

        const handleTopicClick = (topicId: number) => {
          const next = { ...hashState, topic: topicId };
          setHashState(next);
          writeHash(next);
        };

        const combinedError = entitiesError || topicsError;

        return (
          <Page label={t("pageTitle", lang)}>
            {combinedError && (
              <Problem error={combinedError} onRetry={entitiesError ? reload : undefined} />
            )}

            <form className="app-filters" role="search" aria-label={t("filters", lang)} onSubmit={(e) => e.preventDefault()}>
              <label>
                <span>{t("period", lang)}</span>
                <select value={hashState.weeks} onChange={(e) => handlePeriodChange(e.target.value)}>
                  <option value="4">{t("weeks4", lang)}</option>
                  <option value="8">{t("weeks8", lang)}</option>
                  <option value="12">{t("weeks12", lang)}</option>
                  <option value="all">{t("all", lang)}</option>
                </select>
              </label>
              <label>
                <span>{t("topicsCount", lang)}</span>
                <select value={hashState.k} onChange={(e) => handleKChange(Number(e.target.value))}>
                  {[3, 4, 5, 6, 7, 8].map((num) => (
                    <option key={num} value={num}>
                      {num}
                    </option>
                  ))}
                </select>
              </label>
              <label>
                <span>{t("search", lang)}</span>
                <input
                  type="search"
                  value={hashState.q}
                  onChange={(e) => handleSearchChange(e.target.value)}
                  placeholder={t("searchPlaceholder", lang)}
                />
              </label>
            </form>

            {entitiesLoading && rows.length === 0 ? (
              <Loading label={t("reading", lang)} />
            ) : filteredRows.length === 0 ? (
              <Empty>{t("empty", lang)}</Empty>
            ) : topicsStatus === "loading" && !result ? (
              <Loading label={t("loading", lang)} />
            ) : result && result.topics.length > 0 ? (
              <>
                <Split ratio="1:1">
                  <Card title={t("topicsTitle", lang)}>
                    <ul className="app-topics" aria-label={t("topicsTitle", lang)}>
                      {result.topics.map((item) => {
                        const isSelected = selectedTopic?.id === item.id;
                        const term = topTerm(item);
                        const following = follows.follows.some((follow) => follow.term === term);
                        return (
                          <li key={item.id}>
                            <button
                              type="button"
                              className="app-topic"
                              onClick={() => handleTopicClick(item.id)}
                              aria-pressed={isSelected}
                              aria-label={[`${t("topicN", lang)} ${item.id + 1}`, item.keywords.map((kw) => kw.term).join(", ")].filter(Boolean).join(": ")}
                              aria-describedby={`topic-${item.id}-name topic-${item.id}-share topic-${item.id}-count`}
                            >
                              <span className="app-topic-head">
                                <strong id={`topic-${item.id}-name`}>{labelOf(item)}</strong>
                                <span className="app-topic-share" id={`topic-${item.id}-share`}>{formatPercent(item.share, lang)}</span>
                              </span>
                              <span className="app-topic-keywords">
                                <span className="app-sr-only">{t("keywords", lang)}: </span>
                                {item.keywords.map((kw) => (
                                  <span key={kw.term} className="app-keyword">
                                    {kw.term}
                                  </span>
                                ))}
                              </span>
                              <span className="app-topic-count" id={`topic-${item.id}-count`}>
                                {item.articles.length} {t("articlesCount", lang)}
                              </span>
                            </button>
                            {term && (
                              <button
                                type="button"
                                className="jc-button app-follow"
                                aria-pressed={following}
                                aria-label={t("follow", lang, { name: term })}
                                disabled={!me}
                                title={me ? undefined : t("followSignIn", lang)}
                                onClick={() => void follows.toggle(term, lang)}
                              >
                                {t(following ? "followingShort" : "followShort", lang)}
                              </button>
                            )}
                          </li>
                        );
                      })}
                    </ul>
                  </Card>

                  <Card title={t("chartTitle", lang)}>
                    <ChartCard
                      title={t("chartTitle", lang)}
                      option={chartOption}
                      loading={topicsStatus === "loading"}
                      error={topicsError}
                      empty={result.weeks.length === 0 ? t("empty", lang) : undefined}
                    />
                    <div className="app-table-toggle">
                      <button
                        type="button"
                        className="jc-button"
                        onClick={() => setShowTable((prev) => !prev)}
                        aria-expanded={showTable}
                      >
                        {showTable ? t("hideTable", lang) : t("showTable", lang)}
                      </button>
                      {/* Hidden from the eye until asked for, never from a screen reader: the chart's text. */}
                      <div className={showTable ? "jc-table-wrap" : "app-sr-only"}>
                        <table className="jc-table" aria-label={t("tableAria", lang)}>
                          <thead>
                            <tr>
                              <th scope="col">{t("week", lang)}</th>
                              {result.topics.map((tp) => (
                                <th key={tp.id} scope="col">
                                  {labelOf(tp)}
                                </th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {result.weeks.map((w) => (
                              <tr key={w.week}>
                                <td>{w.week}</td>
                                {result.topics.map((tp) => (
                                  <td key={tp.id} className="jc-num">
                                    {formatPercent(w.shares[tp.id] ?? 0, lang)}
                                  </td>
                                ))}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </Card>
                </Split>

                <Card
                  title={`${t("articlesTitle", lang)}: ${selectedTopic ? labelOf(selectedTopic) : ""} (${selectedArticles.length})`}
                >
                  {selectedArticles.length === 0 ? (
                    <Empty>{t("empty", lang)}</Empty>
                  ) : (
                    <ul className="app-events" aria-label={t("articlesTitle", lang)}>
                      {selectedArticles.map((article) => {
                        const title = format(article.name) || article.id;
                        const desc = format(article.description);
                        // Only a web address is a link: a feed entry holding anything else gets none.
                        const url = /^https:\/\/\S+$/.test(format(article.url)) ? format(article.url) : "";
                        const pub = format(article.datePublished);
                        return (
                          <li key={article.id} className="app-event">
                            <div className="app-event-body">
                              <h3>
                                {/* SDK-40: the article opens in the shell's entity panel, linked to the Portal. */}
                                <button type="button" className="app-open" onClick={() => select({ id: article.id, type: ENTITY_TYPE })}>
                                  {title}
                                </button>
                              </h3>
                              <p className="app-event-when">
                                {pub ? (
                                  <time dateTime={pub}>{formatDate(pub, lang)}</time>
                                ) : (
                                  <span>{t("noDate", lang)}</span>
                                )}
                              </p>
                              {desc && <p>{desc}</p>}
                              {url && (
                                <p className="app-event-tags">
                                  <a href={url} target="_blank" rel="noopener noreferrer" aria-label={`${t("readOriginal", lang)}: ${title}`}>
                                    {t("readOriginal", lang)}
                                  </a>
                                </p>
                              )}
                            </div>
                          </li>
                        );
                      })}
                    </ul>
                  )}
                </Card>
              </>
            ) : (
              <Empty>{t("empty", lang)}</Empty>
            )}
            <Split ratio="1:1">
              <FollowedCard lang={lang} state={follows} present={(term) => (result?.topics ?? []).some((topic) => topic.keywords.some((kw) => kw.term === term))} />
              <NamesCard lang={lang} state={names} selected={selectedTopic} topics={result?.topics ?? []} labelOf={labelOf} />
            </Split>
            <KeptWeeks lang={lang} server={server} />
          </Page>
        );
      }

    src__roles.test.tsx: |
      /**
       * T-3828: who reads, and what they change. A signed-in reader follows topics by their top keyword
       * and finds them again in any period; a steward names a topic, renames it, merges two by giving
       * them one name, and takes a name back, which everyone reads. Each change shows at once and is
       * taken back when the server refuses; a closed control says why; the Changes page shows the history.
       */
      import { act, fireEvent, render, screen, waitFor, within } from "@testing-library/react";
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { JcProvider } from "@joinedcontext/sdk";
      import type { Row } from "@joinedcontext/sdk";
      import { stubClient } from "@joinedcontext/sdk/testing";
      import App from "./App";
      import type { AnalysisOutput } from "./topics";
      import type { Me } from "./server";
      import { ServerContext } from "./server";
      import { memory, STEWARD, VIEWER } from "./testing/server";
      import type { Memory } from "./testing/server";
      import { sweep } from "./testing/sweep";

