    src__components__ChartCard.tsx: |
      import type { ReactNode } from "react";
      import { useEffect, useRef } from "react";
      import * as echarts from "echarts";
      import { currentTokens, echartsTheme, Empty, Loading } from "@joinedcontext/sdk";

      /** One ECharts chart with a caption, in the SDK's theme; the loading and empty states in its place. */
      export function ChartCard({
        title,
        option,
        height = 280,
        loading,
        empty,
        onSelect,
      }: {
        title: string;
        option: Record<string, unknown> | null;
        height?: number;
        loading?: boolean;
        empty?: ReactNode;
        /** Called with the category of the bar a person clicks. */
        onSelect?: (name: string) => void;
      }): React.JSX.Element {
        const containerRef = useRef<HTMLDivElement | null>(null);
        const chartRef = useRef<echarts.ECharts | null>(null);
        const showCanvas = !loading && option !== null;
        const onSelectRef = useRef(onSelect);
        onSelectRef.current = onSelect;

        useEffect(() => {
          const el = containerRef.current;
          if (!showCanvas || !el) return;
          const chart = echarts.init(el, echartsTheme(currentTokens()), { renderer: "canvas" });
          chartRef.current = chart;
          chart.on("click", (params: unknown) => {
            const name = (params as { name?: unknown }).name;
            if (name !== undefined) onSelectRef.current?.(String(name));
          });
          const observer = typeof ResizeObserver === "undefined" ? undefined : new ResizeObserver(() => chart.resize());
          observer?.observe(el);
          return () => {
            observer?.disconnect();
            chart.dispose();
            chartRef.current = null;
          };
        }, [showCanvas]);

        useEffect(() => {
          if (chartRef.current && option) chartRef.current.setOption(option, true);
        }, [option, showCanvas]);

        return (
          <figure className="jc-chart">
            <figcaption>{title}</figcaption>
            {loading ? (
              <Loading />
            ) : option === null ? (
              <Empty>{empty}</Empty>
            ) : (
              <div className="jc-chart-canvas" role="img" aria-label={title} style={{ height }} ref={containerRef} />
            )}
          </figure>
        );
      }
    src__components__FindingAction.tsx: |
      import { useState } from "react";
      import { Card } from "@joinedcontext/sdk";
      import { t } from "../i18n";
      import type { Lang, Word } from "../i18n";
      import { problemText } from "../problems";
      import type { Resolutions } from "../resolutions";

      export type Kind = "text" | "number" | "boolean";

      /** The value as the server takes it, from the text typed and its kind; `null` when it is none. */
      export function valueOf(kind: Kind, text: string): string | number | boolean | null {
        const trimmed = text.trim();
        if (kind === "boolean") return trimmed === "true" ? true : trimmed === "false" ? false : null;
        if (kind === "number") {
          const n = Number(trimmed.replace(",", "."));
          return trimmed !== "" && Number.isFinite(n) ? n : null;
        }
        return trimmed !== "" && trimmed.length <= 500 ? trimmed : null;
      }

      interface Props {
        lang: Lang;
        resolutions: Resolutions;
        finding: { entity: string; attribute: string; id: string };
        onDone: (message: string) => void;
        onCancel: () => void;
      }

      /**
       * A steward's answer to one finding (T-3827): mark it resolved with a note, or correct the
       * attribute's value, which the App writes through its Endpoint, the Policy deciding again.
       */
      export function FindingAction({ lang, resolutions, finding, onDone, onCancel }: Props) {
        const [note, setNote] = useState("");
        const [kind, setKind] = useState<Kind>("text");
        const [text, setText] = useState("");
        const [busy, setBusy] = useState(false);
        const [message, setMessage] = useState<string | null>(null);
        const value = valueOf(kind, text);
        const noted = note.trim() !== "";
        const run = async (work: () => Promise<void>, done: Word) => {
          setBusy(true);
          setMessage(null);
          try {
            await work();
            onDone(t(lang, done));
          } catch (error) {
            setMessage(problemText(lang, error));
            setBusy(false);
          }
        };
        const title = t(lang, "actionTitle", { attribute: finding.attribute, id: finding.id });
        return (
          <Card title={title}>
            <form
              className="app-action"
              aria-label={title}
              onSubmit={(event) => {
                event.preventDefault();
                if (noted && !busy) void run(() => resolutions.resolve(finding.entity, finding.attribute, note.trim()), "resolvedDone");
              }}
            >
              <label>
                <span>{t(lang, "note")}</span>
                <input value={note} maxLength={200} required onChange={(event) => setNote(event.target.value)} />
              </label>
              <div className="app-actions">
                <button type="submit" className="jc-button" disabled={!noted || busy}>
                  {t(lang, "markResolved")}
                </button>
                <button type="button" className="jc-button" onClick={onCancel}>
                  {t(lang, "cancel")}
                </button>
              </div>
              <p className="app-note">{t(lang, "correctLead")}</p>
              <label>
                <span>{t(lang, "valueKind")}</span>
                <select
                  value={kind}
                  onChange={(event) => {
                    setKind(event.target.value as Kind);
                    setText(event.target.value === "boolean" ? "true" : "");
                  }}
                >
                  <option value="text">{t(lang, "kindText")}</option>
                  <option value="number">{t(lang, "kindNumber")}</option>
                  <option value="boolean">{t(lang, "kindBoolean")}</option>
                </select>
              </label>
              <label>
                <span>{t(lang, "value")}</span>
                {kind === "boolean" ? (
                  <select value={text} onChange={(event) => setText(event.target.value)}>
                    <option value="true">{t(lang, "yes")}</option>
                    <option value="false">{t(lang, "no")}</option>
                  </select>
                ) : (
                  <input value={text} inputMode={kind === "number" ? "decimal" : undefined} maxLength={500} onChange={(event) => setText(event.target.value)} />
                )}
              </label>
              <button
                type="button"
                className="jc-button"
                disabled={!noted || value === null || busy}
                onClick={() => value !== null && void run(() => resolutions.correct(finding.entity, finding.attribute, value, note.trim()), "correctedDone")}
              >
                {t(lang, "correct")}
              </button>
              <p role="status" aria-live="polite" className={message ? "app-error" : "app-note"}>
                {message ?? ""}
              </p>
            </form>
          </Card>
        );
      }
    src__components__History.tsx: |
      import { useCallback, useEffect, useState } from "react";
      import { Card, Empty, Loading } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { locale, t } from "../i18n";
      import type { Lang } from "../i18n";
      import type { HistoryRow, Server } from "../server";
      import { problemText } from "../problems";

      /** The App's history, from its `app_audit` table: a viewer's own changes, a steward's everyone's. */
      export function History({ lang, api }: { lang: Lang; api: Server }) {
        const { me, steward } = useAccess();
        const [rows, setRows] = useState<HistoryRow[] | null>(null);
        const [failed, setFailed] = useState<string | null>(null);

        const load = useCallback(async () => {
          setFailed(null);
          try {
            setRows(await api.history());
          } catch (error) {
            setRows([]);
            setFailed(problemText(lang, error));
          }
        }, [api, lang]);

        useEffect(() => {
          if (me) void load();
        }, [me, load]);

        const when = (iso: string) => {
          const at = Date.parse(iso);
          return Number.isNaN(at) ? iso : new Intl.DateTimeFormat(locale(lang), { timeZone: "Europe/Helsinki", dateStyle: "medium", timeStyle: "short" }).format(at);
        };

        if (me === null)
          return (
            <Card title={t(lang, "historyTitle")}>
              <Empty>{t(lang, "historySignIn")}</Empty>
            </Card>
          );
        return (
          <Card title={t(lang, "historyTitle")}>
            <p className="app-note">{t(lang, steward ? "historyAll" : "historyMine")}</p>
            <button type="button" className="jc-button" disabled={rows === null} onClick={() => void load()}>
              {t(lang, "refresh")}
            </button>
            {failed && <p className="app-error">{failed}</p>}
            {rows === null ? (
              <Loading label={t(lang, "historyLoading")} />
            ) : rows.length === 0 ? (
              failed ? null : <Empty>{t(lang, "historyEmpty")}</Empty>
            ) : (
              <table className="app-history">
                <caption className="app-sr">{t(lang, "historyTitle")}</caption>
                <thead>
                  <tr>
                    <th scope="col">{t(lang, "when")}</th>
                    <th scope="col">{t(lang, "who")}</th>
                    <th scope="col">{t(lang, "what")}</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((row) => (
                    <tr key={row.id}>
                      <td>{when(row.at)}</td>
                      <td>{row.actorName}</td>
                      <td>
                        {t(lang, row.action)}: {row.summary}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </Card>
        );
      }
    src__components__Trend.tsx: |
      import { useEffect, useState } from "react";
      import { Card, Empty } from "@joinedcontext/sdk";
      import { locale, number, t } from "../i18n";
      import type { Lang } from "../i18n";
      import type { Run, Server } from "../server";

      const reason = (error: unknown) => (error instanceof Error ? error.message : String(error));

      /** A share as a percentage in the language's way, or a dash for no score. */
      const percent = (lang: Lang, share: number | null) => (share === null ? "–" : `${number(lang, share * 100, 1)} %`);

      /** A run's time on Helsinki's clock. */
      function when(lang: Lang, iso: string): string {
        return new Intl.DateTimeFormat(locale(lang), { timeZone: "Europe/Helsinki", dateStyle: "medium", timeStyle: "short" }).format(Date.parse(iso));
      }

      /**
       * Quality over time (T-3354): every run the App's server kept, the newest first, with its
       * completeness, validity and findings, and each run's full per-entity report as a file. The
       * server's daily job makes the runs (T-3579): a run takes longer than a request may.
       */
      export function Trend({ lang, server }: { lang: Lang; server: Server }) {
        const [runs, setRuns] = useState<Run[] | null>(null);
        const [stale, setStale] = useState(false);
        const [failed, setFailed] = useState<string | null>(null);
        const [said, setSaid] = useState<string | null>(null);

        useEffect(() => {
          let gone = false;
          server.runs().then(
            (answer) => {
              if (gone) return;
              setRuns(answer.runs);
              setStale(answer.stale);
              setFailed(null);
            },
            (error: unknown) => !gone && setFailed(reason(error)),
          );
          return () => {
            gone = true;
          };
        }, [server]);

        const download = async (run: Run) => {
          try {
            window.open(await server.reportUrl(run.id), "_blank", "noopener");
          } catch (error) {
            setSaid(t(lang, "reportFailed", { reason: reason(error) }));
          }
        };

        return (
          <Card title={t(lang, "trend")}>
            <p className="app-note">{t(lang, "trendNote")}</p>
            {said && (
              <p className="jc-problem" role="alert">
                {said}
              </p>
            )}
            {failed ? (
              <p className="jc-problem" role="alert">
                {t(lang, "trendFailed", { reason: failed })}
              </p>
            ) : !runs ? (
              <p className="app-note">{t(lang, "trendReading")}</p>
            ) : runs.length === 0 ? (
              <Empty>{t(lang, "trendEmpty")}</Empty>
            ) : (
              <>
                {stale && <p className="app-note">{t(lang, "trendStale")}</p>}
                {/* Scrolls sideways on a phone: a keyboard reaches it as a named region (WCAG 2.1.1). */}
                <div className="jc-table-wrap" tabIndex={0} role="region" aria-label={t(lang, "trend")}>
                  <table className="jc-table" aria-label={t(lang, "trend")}>
                    <thead>
                      <tr>
                        <th scope="col">{t(lang, "ranAt")}</th>
                        <th scope="col">{t(lang, "entitiesColumn")}</th>
                        <th scope="col">{t(lang, "completeColumn")}</th>
                        <th scope="col">{t(lang, "validColumn")}</th>
                        <th scope="col">{t(lang, "findingsColumn")}</th>
                        <th scope="col">{t(lang, "fullReport")}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {runs.map((run) => (
                        <tr key={run.id}>
                          <th scope="row">{when(lang, run.ran_at)}</th>
                          <td className="jc-num">{number(lang, run.entities)}</td>
                          <td className="jc-num">{percent(lang, run.completeness)}</td>
                          <td className="jc-num">{percent(lang, run.valid)}</td>
                          <td className="jc-num">{number(lang, run.findings)}</td>
                          <td>
                            <button
                              type="button"
                              className="jc-button"
                              aria-label={t(lang, "fullReportOf", { when: when(lang, run.ran_at) })}
                              onClick={() => void download(run)}
                            >
                              {t(lang, "fullReport")}
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </>
            )}
          </Card>
        );
      }
