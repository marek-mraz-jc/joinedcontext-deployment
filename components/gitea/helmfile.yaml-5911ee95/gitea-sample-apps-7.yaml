      node_modules/
      dist/
      test-results/
      playwright-report/
      wasm/pkg/
      wasm/target/
    README.md: |
      # Helsinki news topics

      What the City of Helsinki's news talks about: topics, how their share changes week by week, and the articles behind each topic. One page, Topics:

      - a ranked list of topics for the chosen period with their keywords and share;
      - a stacked bar chart of topic share per ISO week (ECharts via ChartCard), with an accessible table alternative for screen readers;
      - the articles behind the selected topic, with links to original sources; an article's title opens it in the SDK shell's entity panel, with a link to it in the Portal (the App writes nothing, so the panel offers no Edit);
      - filters in the URL hash query (`#topics?weeks=8&topic=2&q=…`): period (4, 8, 12 weeks, or all), number of topics k (3–8, default 5), and title text search;
      - interface in English, Finnish and Swedish (`?lang=fi|en|sv`), switched in the header.

      Text analysis and clustering run client-side in WebAssembly (`news-topics-wasm` via Web Worker):
      - language detection and tokenisation (English and Finnish stop words, simple stemming);
      - TF-IDF sparse vector generation and L2 normalisation;
      - cosine k-means clustering with deterministic k-means++ initialisation;
      - keyword extraction from topic centroid weights;
      - ISO week bucketing and weekly topic share calculation.

      It is a `wasm` application on the joinedcontext App SDK (AP-148): React and Rust/WASM in the browser, read-only, one data need on Context Space `helsinki` (`Article`: `name`, `description`, `url`, `datePublished`, `source`). The Portal serves it under `/apps/news-topics/` and fills `#jc-config` with the endpoint configuration.

      Its server component (`server/`, `wasm32-wasip2` on `jc-app-sdk`, T-3352) runs on the shared WASM host and keeps what the browser cannot: the feed holds only its recent articles, so the server reads them through the App's own Endpoint with the reader's token, fits the same topic model (`wasm/` without wasm-bindgen, five topics) to each ISO week, and keeps every week's topics and keywords in its tables `topic_runs` and `week_topics` (`migrations/`), recomputed when older than six hours. The week's articles go to the App's storage prefix as `corpus/<week>.json`; the page downloads them through a presigned URL.

      | Route | What it does |
      |---|---|
      | `GET /apps/news-topics/api/weeks` | the topics of every kept week, the newest first |
      | `GET /apps/news-topics/api/weeks/{week}/corpus` | a URL to download the week's articles from (`2026-W41`) |

      ## Prerequisites

      Building the WebAssembly module requires the Rust `wasm32-unknown-unknown` target and `wasm-bindgen-cli`:

      ```sh
      rustup target add wasm32-unknown-unknown
      cargo install wasm-bindgen-cli --version 0.2.129
      ```

      ## Roles and history

      A signed-in reader follows topics of their own (T-3828), each by its top keyword, so a followed topic is found again in any period, at most 30; the topic list marks the followed ones and the Followed topics card says which are among the period's topics. A steward names a topic by its top keyword, renames it, and merges topics by giving them one name (the other topic's name, else its keywords); the page shows topics with one name as one, their shares summed. Everyone, signed in or not, reads the names. A viewer's naming controls stay closed with the reason as their tooltip. Every change shows at once and is taken back when the server refuses; the server records each in `app_audit`, and the Changes page lists a viewer's own and a steward's every one. Roles come from the caller's token through `identity::caller()`, never from the page.

      | Route | Who | What it does |
      |---|---|---|
      | `GET /apps/news-topics/api/me` | anyone | the caller's name and roles, `null` when signed out |
      | `GET /apps/news-topics/api/follows` | signed in | the caller's followed keywords, newest first |
      | `POST /apps/news-topics/api/follows` `{term}` | signed in | a keyword followed; 409 when followed already or past 30 |
      | `DELETE /apps/news-topics/api/follows/{id}` | owner | no longer followed |
      | `GET /apps/news-topics/api/names` | anyone | every topic name a steward gave |
      | `POST /apps/news-topics/api/names` `{term, name}` | steward | the topic of that top keyword named, or renamed |
      | `DELETE /apps/news-topics/api/names/{id}` | steward | the name taken back |
      | `GET /apps/news-topics/api/history` | signed in | the newest 100 changes (a viewer: their own) |

      The groups `news-topics-viewer` and `news-topics-steward` (`grants/users/groups/`) hold the demo viewer and steward. The App writes no context data, so its Endpoint's Policy stays read-only.

      ## Run the tests

      ```sh
      (cd wasm && CARGO_TARGET_DIR=target cargo test --locked)   # the Rust functions, natively
      pnpm install
      pnpm wasm          # compiles wasm/ to WebAssembly and binds it into wasm/pkg/
      pnpm test          # vitest, the module in wasm/pkg/ included
      pnpm build         # the Vite bundle, the .wasm a hashed asset beside the worker
      pnpm e2e           # Playwright at every width against the built bundle
      ```

      ## Run it locally against dev

      `pnpm dev` serves the application on `http://localhost:5173/`. Fill the `#jc-config` element in `index.html` with the endpoint of the application on dev before starting:

      ```json
      { "slug": "<the endpoint slug the App page shows>", "orgDomain": "hel.fi", "space": "helsinki", "transport": "origin", "appName": "news-topics" }
      ```

      Keep that edit out of the commit: the Portal writes the element when it serves the application.

      `server/` is tested natively with `cargo test`, built with `cargo build --release --target wasm32-wasip2`, and played on the host against Postgres and RustFS from `server/host-test.json` by the platform's `crates/wasm-host/tests/apps_tests.rs`.

      ## Where it is built

      This tree is the repository `helsinki_news-topics` on the installation's forge. Publishing a commit there builds it in the build lane (T-3327): `cargo test` and the WebAssembly build of `wasm/` against the lane's crate store, `wasm-bindgen --target web` into `wasm/pkg/`, then `pnpm test` and `pnpm build`.
    app.yaml: |
      # Helsinki news topics: the topics of the city's news, their weekly share and the articles
      # behind each topic, clustered in WASM (T-3334). Hand written, so no generated-by annotation (AP-35).
      #
      # A frontend on the App SDK: React with a client-side Rust/WASM clustering engine, read-only, and a
      # server component on the shared WASM host (T-3352, AP-148) that keeps every ISO week's topics in
      # the App's own schema and the week's articles as a file under its own storage prefix.
      # Its source is its own repository on the forge, which the build lane builds at `ref` (AP-75, AP-80);
      # this folder of the portal repository is where CI tests the same tree before it is pushed there (T-2599).
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: news-topics
        namespace: helsinki
        title:
          en: "Helsinki news topics"
          fi: "Helsingin uutisaiheet"
        description:
          en: "What the City of Helsinki's news talks about: the topics, how their share changes week by week, and the articles behind each topic."
          fi: "Mistä Helsingin kaupungin uutisissa puhutaan: aiheet, niiden osuuksien viikoittainen kehitys ja kunkin aiheen artikkelit."
      spec:
        kind: wasm
        source:
          git:
            url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_news-topics.git
            ref: main
        # The interface on Node, the topic clustering in wasm/ compiled to WebAssembly (AP-142).
        build:
          node: "22"
          rust: "1.90"
        # Its own schema, migrated from migrations/ at publish, and its own prefix for the corpus files.
        storage:
          sql:
            migrations: migrations
            quotaMiB: 50
          blob:
            quotaMiB: 512
        # The news endpoint of Helsinki is public (GW22): an anonymous reader gets what the public
        # role is granted and nothing more.
        visibility: public
        # Who edits what (T-3828): the App's own tables only, never the context data.
        roles:
          - name: viewer
            title: { en: "Viewer", fi: "Katselija" }
            description: "Follows topics of their own, each by its top keyword, and stops following them; reads every topic name."
          - name: steward
            title: { en: "Steward", fi: "Ylläpitäjä" }
            description: "What a viewer does, and names a topic, renames it or merges topics by giving them one name, which everyone reads. Reads the whole history."
        access:
          - role: viewer
            subjects: [{ group: news-topics-viewer }]
          - role: steward
            subjects: [{ group: news-topics-steward }]
        lifecycle: published
        dataNeeds:
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [Article]
            attrs: [name, description, url, datePublished, source]
            operations: [queryEntity, retrieveEntity]
            representations: [ngsi-ld, ogc-features]
    e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { BASE, STEWARD, serve } from "./serve";

      // UI-84, SDK-12, AP-138 (T-3334): the news topics page at a phone, a tablet, a laptop and a wall,
      // with its chart and topics list drawn: no sideways scroll, no two blocks over each other,
      // nothing axe finds at WCAG 2.1 AA.
      const VIEWS = [
        { name: "topics", search: null, lang: "en" },
        { name: "a search", search: "traffic", lang: "en" },
        { name: "topics in Finnish", search: null, lang: "fi" },
        { name: "topics in Swedish", search: null, lang: "sv" },
      ];

      for (const view of VIEWS) {
        for (const size of WIDTHS) {
          test(`${view.name} at ${size.width} px: no sideways scroll, no overlap, axe clean`, async ({ page }, testInfo) => {
            const { outside, missing, problems } = await serve(page);
            await page.setViewportSize(size);
            await page.goto(`${BASE}?lang=${view.lang}#topics`);
            const topicsList = page.getByRole("list", { name: /Topics|Aiheet/i }).or(page.locator(".app-topics"));
            await expect(topicsList.getByRole("listitem").first()).toBeVisible();
            await expect(page.locator(".jc-chart-canvas canvas")).toHaveCount(1);
            if (view.search) {
              await page.getByRole("searchbox").fill(view.search);
              await expect(topicsList.getByRole("listitem").first()).toBeVisible();
            }
            await testInfo.attach(`${view.name}-${size.width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      // SDK-40, T-3401: an article of the chosen topic opens in the shell's entity panel, read through the
      // app's endpoint, at a phone and a laptop, light and dark; a public App writes nothing, so the panel
      // links to the Portal.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: an article in the entity panel, linked to the Portal, axe clean`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            const { outside, missing, problems } = await serve(page);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}#topics`);
            const articles = page.getByRole("list", { name: /articles of topic/i });
            await articles.getByRole("heading").first().getByRole("button").click();
            const panel = page.getByRole("dialog");
            await expect(panel.getByRole("link", { name: "Open in the Portal" })).toBeVisible();
            await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
            expect(await layoutProblems(page)).toEqual([]);
            await page.keyboard.press("Escape");
            await expect(page.getByRole("dialog")).toHaveCount(0);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      // T-3352: the weeks the App's server keeps, still there after a reload, and a week's articles
      // downloaded from the store.
      test("the weeks the server keeps, after a reload too, and a week's articles as a file", async ({ page }) => {
        const { outside, missing, problems } = await serve(page);
        await page.setViewportSize({ width: 1440, height: 900 });
        await page.goto(`${BASE}?lang=en#topics`);
        const kept = page.getByRole("table", { name: "Topics week by week" });
        await expect(kept.getByRole("row")).toHaveCount(3);
        await expect(kept.getByRole("row").nth(1)).toContainText("raitiotie, liikenne (100%)");
        await page.reload();
        await expect(kept.getByRole("row").nth(2)).toContainText("kirjasto (50%); uimahalli (50%)");
        // The download opens in its own tab, which the page's routes do not reach: the context's do.
        await page.context().route("http://portal.test/store/**", (route) => route.fulfill({ status: 200, contentType: "application/json", body: "[]" }));
        const popup = page.waitForEvent("popup");
        await kept.getByRole("button", { name: "Download the articles of week 2026-W41" }).click();
        const tab = await popup;
        await tab.waitForLoadState();
        expect(tab.url()).toBe("http://portal.test/store/corpus/2026-W41.json");
        await tab.close();
        expect(await layoutProblems(page)).toEqual([]);
        expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
      });

      // T-3828: a viewer follows a topic and lets it go; a steward names a topic in Swedish, which the
      // list shows, and takes the name back; both see the history, at a phone and a laptop, light and dark.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: a viewer follows a topic and lets it go; naming stays a steward's`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            const { outside, missing, problems } = await serve(page);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}?lang=en#topics`);
            await expect(page.getByLabel("Role: Viewer")).toBeVisible();
            const follow = page.locator(".app-follow").first();
            await follow.click();
            await expect(follow).toHaveAttribute("aria-pressed", "true");
            const followed = page.getByRole("list", { name: "Followed topics" });
            await expect(followed.getByText("in this period's topics")).toBeVisible();
            const name = page.getByLabel("Name of the selected topic");
            await expect(name).toBeDisabled();
            await expect(name).toHaveAttribute("title", "Only a steward names and merges topics.");
            expect(await layoutProblems(page)).toEqual([]);
            await followed.getByRole("button", { name: /^Stop following / }).click();
            await expect(page.getByText("You follow no topic yet.")).toBeVisible();
            await page.getByRole("button", { name: "Changes" }).first().click();
            await expect(page.getByText(/^Added: followed /)).toBeVisible();
            expect(await layoutProblems(page)).toEqual([]);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });

          test(`${scheme} at ${width} px: a steward names a topic in Swedish and takes the name back`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            const { outside, missing, problems } = await serve(page, STEWARD);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}?lang=sv#topics`);
            await expect(page.getByLabel("Roll: Förvaltare")).toBeVisible();
            await page.getByLabel("Det valda ämnets namn").fill("Spårvägar");
            await page.getByRole("button", { name: "Namnge ämnet" }).click();
            await expect(page.getByText("Namngivet: Spårvägar")).toBeVisible();
            await expect(page.locator(".app-topics strong", { hasText: "Spårvägar" })).toBeVisible();
            expect(await layoutProblems(page)).toEqual([]);
            await page.getByRole("button", { name: /^Ångra namnet för / }).click();
            await expect(page.getByText("Inget ämne har ett namn ännu.")).toBeVisible();
            await page.getByRole("button", { name: "Ändringar" }).first().click();
            await expect(page.getByText("Allas ändringar, nyaste först.")).toBeVisible();
            expect(await layoutProblems(page)).toEqual([]);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }
    e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { Page } from "@playwright/test";
      import { stubTransport } from "@joinedcontext/sdk/testing";
      import { ARTICLES as NEWS } from "../src/fixtures/news";

      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      export const BASE = "http://portal.test/";
      const SLUG = "newstopics";
      // `portal`: where the entity panel links an article (SDK-40); shown, never followed.
      const CONFIG = { slug: SLUG, orgDomain: "hel.fi", space: "helsinki", transport: "origin", appName: "news-topics", portal: "https://portal.test/projects/helsinki" };
      const TYPES: Record<string, string> = {
        ".html": "text/html",
        ".js": "text/javascript",
        ".mjs": "text/javascript",
        ".css": "text/css",
        ".json": "application/json",
        ".svg": "image/svg+xml",
        ".wasm": "application/wasm",
      };

      /** What the served page did that it should not: a host it called, a file it missed, an error it threw. */
      export interface Served {
        outside: string[];
        missing: string[];
        problems: string[];
      }

      /** The App's server (T-3352) as the page sees it: two kept weeks and their corpus files. */
      const KEPT = {
        weeks: [
          { week: "2026-W42", articles: 3, computed_at: "2026-10-18T05:00:00Z", topics: [{ topic: 0, share: 1, articles: 3, keywords: [{ term: "raitiotie", weight: 0.9 }, { term: "liikenne", weight: 0.6 }] }] },
          { week: "2026-W41", articles: 2, computed_at: "2026-10-18T05:00:00Z", topics: [{ topic: 0, share: 0.5, articles: 1, keywords: [{ term: "kirjasto", weight: 0.8 }] }, { topic: 1, share: 0.5, articles: 1, keywords: [{ term: "uimahalli", weight: 0.7 }] }] },
        ],
        stale: false,
      };

      /** Who reads (T-3828): a viewer follows topics, a steward also names and merges them. */
      export const VIEWER = { id: "u-viewer", name: "Vera Viewer", roles: ["viewer"] };
      export const STEWARD = { id: "u-steward", name: "Sara Steward", roles: ["viewer", "steward"] };
      type Me = typeof VIEWER;

      /** The App's role routes in memory, deciding as the server does. */
      function roleServer(me: Me) {
        const follows: Array<{ id: number; term: string }> = [];
        const names: Array<{ id: number; term: string; name: string; ownerName: string }> = [];
        const history: Array<Record<string, unknown>> = [];
        let next = 1;
        const log = (action: string, summary: string) =>
          history.unshift({ id: next++, at: "2026-10-18T06:00:00Z", actorName: me.name, action, target: "", summary });
        return (method: string, path: string, body: Record<string, string> | undefined): { status: number; body: unknown } | null => {
          if (method === "GET" && path === "/me") return { status: 200, body: me };
          if (method === "GET" && path === "/history") return { status: 200, body: history };
          if (method === "GET" && path === "/follows") return { status: 200, body: follows };
          if (method === "POST" && path === "/follows") {
            const follow = { id: next++, term: body!.term };
            follows.unshift(follow);
            log("insert", `followed ${follow.term}`);
            return { status: 201, body: follow };
          }
          if (method === "GET" && path === "/names") return { status: 200, body: names };
          if (method === "POST" && path === "/names") {
            if (!me.roles.includes("steward")) return { status: 403, body: { title: "Forbidden", detail: "a steward names topics" } };
            const entry = { id: next++, term: body!.term, name: body!.name, ownerName: me.name };
            names.splice(0, names.length, ...names.filter((other) => other.term !== entry.term), entry);
            log("insert", `named the topic of ${entry.term} ${entry.name}`);
            return { status: 201, body: entry };
          }
          const gone = /^\/(follows|names)\/(\d+)$/.exec(path);
          if (method === "DELETE" && gone) {
            const list: Array<{ id: number }> = gone[1] === "follows" ? follows : names;
            list.splice(list.findIndex((one) => one.id === Number(gone[2])), 1);
            log("delete", `deleted ${gone[1]} ${gone[2]}`);
            return { status: 204, body: null };
          }
          return null;
        };
      }

      /** Serves the built bundle at the root of the App's own host, with the SDK's stub answering its endpoint. */
      export async function serve(page: Page, me: Me = VIEWER): Promise<Served> {
        const roles = roleServer(me);
        const transport = stubTransport({
          entities: NEWS,
          access: { permissions: [{ resource: { type: "Article" }, actions: ["queryEntity", "retrieveEntity"], attributes: "*" }], prohibitions: [] },
        });
        const served: Served = { outside: [], missing: [], problems: [] };
        page.on("pageerror", (error) => served.problems.push(error.message));
        // The page opens on today in Helsinki and filters by period (default 8 weeks): fixed to the
        // date the fixtures fall on, so the weekly chart and topics have articles to analyse.
        await page.clock.setFixedTime(new Date("2026-10-18T06:00:00Z"));

        await page.route("**/*", async (route) => {
          const url = new URL(route.request().url());
          if (url.origin !== "http://portal.test") {
            served.outside.push(url.href);
            return route.abort();
          }
          // A published app is served at the root of its own host and calls its endpoint unprefixed,
          // where the edge sets the session as the bearer (T-2670, T-2838); the stub answers that path.
          if (url.pathname.startsWith(`/api/endpoint/${SLUG}/`)) {
            const body = route.request().postData();
            const path = url.pathname + url.search;
            const answer = await transport({ method: route.request().method() as "GET", path, body: body ? JSON.parse(body) : undefined });
            return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body ?? null) });
          }
          if (url.pathname === "/apps/news-topics/api/weeks") {
            return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(KEPT) });
          }
          if (url.pathname.startsWith("/apps/news-topics/api/")) {
            const body = route.request().postData();
            const answer = roles(route.request().method(), url.pathname.slice("/apps/news-topics/api".length), body ? JSON.parse(body) : undefined);
            if (answer?.status === 204) return route.fulfill({ status: 204, body: "" });
            if (answer) return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body) });
          }
          const corpus = /^\/apps\/news-topics\/api\/weeks\/(\d{4}-W\d{2})\/corpus$/.exec(url.pathname);
          if (corpus) {
            return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ url: `http://portal.test/store/corpus/${corpus[1]}.json` }) });
          }
          // The store's presigned URL: the week's articles come from there, never through the server.
          if (url.pathname.startsWith("/store/corpus/")) {
            return route.fulfill({ status: 200, contentType: "application/json", body: "[]" });
          }
          const file = normalize(url.pathname.slice(1) || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) {
            served.missing.push(url.pathname);
            return route.fulfill({ status: 404, body: "" });
          }
          let body = readFileSync(join(DIST, file));
          if (file === "index.html") {
            body = Buffer.from(
              body.toString("utf8").replace('<script id="jc-config" type="application/json"></script>', `<script id="jc-config" type="application/json">${JSON.stringify(CONFIG)}</script>`),
            );
          }
          return route.fulfill({ status: 200, contentType: TYPES[extname(file)] ?? "application/octet-stream", body });
        });
        return served;
      }
