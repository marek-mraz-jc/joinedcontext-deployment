    migrations__0001_quality_runs.sql: |
      -- data-quality-inspector's own tables (T-3354). The reconciler runs this as the schema's owner, in
      -- the App's own schema, and records it; `if not exists` keeps a second run harmless.

      -- Every quality run over the Endpoint's data, so the page shows the trend: what it read, how
      -- complete and valid it was, how many findings it had. The full per-entity report of a run is a
      -- file under the App's prefix, `runs/<id>/report.json`.
      create table if not exists quality_runs (
          id bigserial primary key,
          ran_at timestamptz not null default now(),
          types integer not null check (types >= 0),
          entities integer not null check (entities >= 0),
          findings integer not null check (findings >= 0),
          completeness real not null check (completeness >= 0 and completeness <= 1),
          valid real check (valid >= 0 and valid <= 1)
      );

      -- One run's scores per entity type.
      create table if not exists run_types (
          run_id bigint not null references quality_runs (id) on delete cascade,
          type text not null,
          entities integer not null check (entities >= 0),
          completeness real not null check (completeness >= 0 and completeness <= 1),
          valid real check (valid >= 0 and valid <= 1),
          findings integer not null check (findings >= 0),
          freshness_median_seconds double precision,
          primary key (run_id, type)
      );
    migrations__0002_roles.sql: |
      -- Roles and edits (T-3827, API/07): a steward marks a finding resolved, with a note, or corrects
      -- the attribute through the App's Endpoint and so resolves it; every reader sees what was
      -- resolved, and any steward opens a finding again. Every change leaves a row in app_audit. Every
      -- statement may run again and change nothing.
      create table if not exists resolutions (
          id bigserial primary key,
          owner_id text not null,
          resolver_name text not null check (length(resolver_name) <= 200),
          entity text not null check (length(entity) <= 256),
          attribute text not null check (length(attribute) between 1 and 64),
          note text not null check (length(note) between 1 and 200),
          -- Whether the steward corrected the attribute through the Endpoint, or only marked it.
          corrected boolean not null default false,
          created_at timestamptz not null default now()
      );
      create index if not exists resolutions_finding on resolutions (entity, attribute);

      -- jc_app_sdk::access::AUDIT_TABLE
      create table if not exists app_audit (
          id bigserial primary key,
          at timestamptz not null default now(),
          actor_id text not null,
          actor_name text not null,
          action text not null check (action in ('insert', 'update', 'delete', 'edit')),
          target text not null,
          summary text not null check (length(summary) <= 500)
      );
