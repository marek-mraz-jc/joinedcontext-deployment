            )}
            <Trend lang={lang} server={server} />
          </Page>
        );
      }
    src__problems.ts: |
      import { t } from "./i18n";
      import type { Lang, Word } from "./i18n";
      import { Problem } from "./server";

      /** What the server's refusal means to the reader, in their language. */
      export function problemText(lang: Lang, error: unknown): string {
        if (!(error instanceof Problem)) return t(lang, "serverDown");
        const words: Partial<Record<number, Word>> = { 0: "serverOffline", 401: "signInAgain", 403: "noRight", 404: "gone" };
        const word = words[error.status];
        if (word) return t(lang, word);
        if (error.status === 400 || error.status === 409) return t(lang, "serverRefused", { why: error.message });
        return t(lang, "serverDown");
      }
    src__quality.test.ts: |
      import { describe, expect, it } from "vitest";
      import type { Row } from "@joinedcontext/sdk";
      import type { TypeQuality } from "./quality";
      import {
        KNOWN_TYPES,
        formatAge,
        formatRule,
        localId,
        percent,
        readHash,
        readView,
        resolveTypes,
        sortTypesByQuality,
        toInput,
        writeHash,
        writeView,
      } from "./quality";

      describe("toInput", () => {
        it("converts Map and Schema into inspector input shape", () => {
          const rows: Row[] = [
            { id: "urn:ngsi-ld:Event:1", type: "Event", name: "Music Festival" },
            { id: "urn:ngsi-ld:Event:2", type: "Event", name: "Art Fair" },
          ];
          const map = new Map<string, Row[]>([["Event", rows]]);
          const schema = {
            Event: {
              properties: { name: { type: "string" } },
            },
          };

          const input = toInput(1_700_000_000, schema, map);
          expect(input.now).toBe(1_700_000_000);
          expect(input.types).toHaveLength(1);
          expect(input.types[0].type).toBe("Event");
          expect(input.types[0].schema).toEqual({ properties: { name: { type: "string" } } });
          expect(input.types[0].rows).toHaveLength(2);
        });

        it("converts Record and null Schema into inspector input shape with schema null", () => {
          const record = {
            Vehicle: [{ id: "urn:ngsi-ld:Vehicle:1", type: "Vehicle", speed: 50 }],
          };
          const input = toInput(1_700_000_000, null, record);
          expect(input.now).toBe(1_700_000_000);
          expect(input.types).toHaveLength(1);
          expect(input.types[0].type).toBe("Vehicle");
          expect(input.types[0].schema).toBeNull();
          expect(input.types[0].rows).toHaveLength(1);
        });
      });

      describe("formatAge", () => {
        it("formats seconds into human words in Finnish and English", () => {
          // Under a minute
          expect(formatAge(30, "en")).toBe("30 s");
          expect(formatAge(30, "fi")).toBe("30 s");

          // Under an hour
          expect(formatAge(180, "en")).toBe("3 min");
          expect(formatAge(180, "fi")).toBe("3 min");

          // Under a day
          expect(formatAge(7200, "en")).toBe("2 h");
          expect(formatAge(7200, "fi")).toBe("2 h");

          // One day (singular in English)
          expect(formatAge(86400, "en")).toBe("1 day");
          expect(formatAge(86400, "fi")).toBe("1 pv");

          // Multiple days
          expect(formatAge(172800, "en")).toBe("2 days");
          expect(formatAge(172800, "fi")).toBe("2 pv");

          // Zero or negative or non-finite
          expect(formatAge(-10, "en")).toBe("0 min");
          expect(formatAge(Number.NaN, "fi")).toBe("0 min");
        });
      });

      describe("formatRule", () => {
        it("formats validation failure rules in Finnish and English", () => {
          // Format date-time, date, uri, other
          expect(formatRule("format", "date-time", "en")).toBe("not a date-time");
          expect(formatRule("format", "date-time", "fi")).toBe("ei kelvollinen aikaleima");

          expect(formatRule("format", "date", "en")).toBe("not a date");
          expect(formatRule("format", "date", "fi")).toBe("ei kelvollinen päivämäärä");

          expect(formatRule("format", "uri", "en")).toBe("not a URI");
          expect(formatRule("format", "uri", "fi")).toBe("ei kelvollinen URI");

          expect(formatRule("format", "email", "en")).toBe("not a valid email");
          expect(formatRule("format", "email", "fi")).toBe("ei kelvollinen email");

          // Minimum and maximum
          expect(formatRule("minimum", "0", "en")).toBe("below the minimum 0");
          expect(formatRule("minimum", "0", "fi")).toBe("alle minimin 0");

          expect(formatRule("maximum", "100", "en")).toBe("above the maximum 100");
          expect(formatRule("maximum", "100", "fi")).toBe("yli maksimin 100");

          // Enum
          expect(formatRule("enum", "active, inactive", "en")).toBe("not one of: active, inactive");
          expect(formatRule("enum", "active, inactive", "fi")).toBe("ei mikään näistä: active, inactive");

          // Required and unknown
          expect(formatRule("required", "location", "en")).toBe("missing, but required");
          expect(formatRule("required", "location", "fi")).toBe("puuttuu, mutta pakollinen");

          expect(formatRule("unknown", "extra", "en")).toBe("not in the model");
          expect(formatRule("unknown", "extra", "fi")).toBe("ei mallissa");

          // Pattern and type
          expect(formatRule("pattern", "^[0-9]+$", "en")).toBe("does not match pattern ^[0-9]+$");
          expect(formatRule("pattern", "^[0-9]+$", "fi")).toBe("ei vastaa säännöllistä lauseketta ^[0-9]+$");

          expect(formatRule("type", "integer", "en")).toBe("not of type integer");
          expect(formatRule("type", "integer", "fi")).toBe("ei tyyppiä integer");

          // Fallback for custom rule
          expect(formatRule("customRule", "detail-msg", "en")).toBe("customRule: detail-msg");
          expect(formatRule("customRule", "", "en")).toBe("customRule");
        });
      });

      describe("hash navigation state", () => {
        it("round trips type in hash view state", () => {
          const hash = writeHash("BikeHireDockingStation");
          expect(hash).toBe("#quality?type=BikeHireDockingStation");
          expect(readHash(hash)).toEqual({ type: "BikeHireDockingStation" });

          const nullHash = writeHash(null);
          expect(nullHash).toBe("#quality");
          expect(readHash(nullHash)).toEqual({ type: null });

          expect(readView).toBe(readHash);
          expect(writeView).toBe(writeHash);
        });

        it("handles URL encoded characters in type parameter", () => {
          const hash = writeHash("Public Area Permit");
          expect(hash).toBe("#quality?type=Public%20Area%20Permit");
          expect(readHash(hash)).toEqual({ type: "Public Area Permit" });
        });

        it("ignores junk and malformed hash parameters", () => {
          expect(readHash("")).toEqual({ type: null });
          expect(readHash("#")).toEqual({ type: null });
          expect(readHash("#quality")).toEqual({ type: null });
          expect(readHash("#quality?type=")).toEqual({ type: null });
          expect(readHash("#quality?type=   ")).toEqual({ type: null });
          expect(readHash("#other?foo=bar")).toEqual({ type: null });
          expect(readHash("?type=Event&extra=123")).toEqual({ type: "Event" });
        });
      });

      describe("localId", () => {
        it("extracts local id part after the last colon, handling URNs and bare IDs", () => {
          expect(localId("urn:ngsi-ld:BikeHireDockingStation:station-01")).toBe("station-01");
          expect(localId("urn:ngsi-ld:Alert:hel.fi:helsinki:GUID-42")).toBe("GUID-42");
          expect(localId("plain-id")).toBe("plain-id");
          expect(localId("")).toBe("");
        });
      });

      describe("percent", () => {
        it("formats numbers as rounded percentages and null/undefined/NaN as dash", () => {
          expect(percent(0.856, "en")).toBe("86 %");
          expect(percent(1, "fi")).toBe("100 %");
          expect(percent(0, "en")).toBe("0 %");
          expect(percent(null, "en")).toBe("—");
          expect(percent(undefined, "fi")).toBe("—");
          expect(percent(Number.NaN, "en")).toBe("—");
          expect(percent(Number.POSITIVE_INFINITY, "en")).toBe("—");
        });
      });

      describe("resolveTypes", () => {
        it("falls back to KNOWN_TYPES when schema is missing or empty", () => {
          expect(resolveTypes(null)).toEqual([...KNOWN_TYPES]);
          expect(resolveTypes({})).toEqual([...KNOWN_TYPES]);
        });

        it("returns sorted type names from published schema", () => {
          const schema = {
            Event: {},
            AirQualityObserved: {},
            BikeHireDockingStation: {},
          };
          expect(resolveTypes(schema)).toEqual(["AirQualityObserved", "BikeHireDockingStation", "Event"]);
        });
      });

      describe("sortTypesByQuality", () => {
        it("sorts worst valid first, placing types without schema (null) at the end", () => {
          const tBad: TypeQuality = {
            type: "BadType",
            entities: 10,
            completeness: 0.8,
            valid: 0.4,
            attributes: [],
            findings: [],
            findingsTotal: 6,
            freshness: null,
          };
          const tGood: TypeQuality = {
            type: "GoodType",
            entities: 10,
            completeness: 0.9,
            valid: 1.0,
            attributes: [],
            findings: [],
            findingsTotal: 0,
            freshness: null,
          };
          const tNoSchema: TypeQuality = {
            type: "NoSchemaType",
            entities: 5,
            completeness: 0.7,
            valid: null,
            attributes: [],
            findings: [],
            findingsTotal: 0,
            freshness: null,
          };
          const tTiedBad: TypeQuality = {
            type: "AnotherBad",
            entities: 10,
            completeness: 0.6,
            valid: 0.4,
            attributes: [],
            findings: [],
            findingsTotal: 6,
            freshness: null,
          };

          const sorted = sortTypesByQuality([tGood, tNoSchema, tBad, tTiedBad]);
          expect(sorted.map((t) => t.type)).toEqual(["AnotherBad", "BadType", "GoodType", "NoSchemaType"]);
        });
      });
    src__quality.ts: |
      /**
       * Types and pure transformations for data quality inspection: converting SDK rows and
       * JSON Schema into WASM inspector input, formatting failure rules and freshness ages,
       * sorting types by validity, and serializing/deserializing hash navigation state.
       */
      import type { Row } from "@joinedcontext/sdk";
      import type { Lang } from "./i18n";
      import { ageMessage, ruleMessage } from "./i18n";

      /** The 12 entity types served in Helsinki context space on dev today. */
      export const KNOWN_TYPES = [
        "AdministrativeArea",
        "AirQualityObserved",
        "Alert",
        "Article",
        "BikeHireDockingStation",
        "CityWork",
        "Event",
        "OnStreetParking",
        "PointOfInterest",
        "Vehicle",
        "WaterQualityObserved",
        "WeatherObserved",
      ] as const;

      /** Timestamp property candidates checked for freshness, in order of preference. */
      export const FRESHNESS_FIELDS = [
        "dateObserved",
        "dateModified",
        "datePublished",
        "dateIssued",
        "validFrom",
        "startDate",
      ] as const;

      export interface TypeInspectInput {
        type: string;
        schema: unknown;
        rows: Record<string, unknown>[];
      }

      export interface InspectInput {
        now: number;
        types: TypeInspectInput[];
      }

      export interface AttributeQuality {
        name: string;
        completeness: number;
        required: boolean;
        notChecked: number;
      }

      export interface Finding {
        entity: string;
        attribute: string;
        rule: "type" | "enum" | "minimum" | "maximum" | "pattern" | "format" | "required" | "unknown" | string;
        detail: string;
      }

      export interface FreshnessQuality {
        field: string;
        medianSeconds: number;
        maxSeconds: number;
        olderThanDay: number;
      }

      export interface TypeQuality {
        type: string;
        entities: number;
        completeness: number;
        valid: number | null;
        attributes: AttributeQuality[];
        findings: Finding[];
        findingsTotal: number;
        freshness: FreshnessQuality | null;
      }

      export interface InspectOutput {
        types: TypeQuality[];
      }

      export interface HashState {
        type: string | null;
      }

      /** Resolves entity types from the published schema definitions, falling back to known types. */
      export function resolveTypes(schema: Readonly<Record<string, unknown>> | null): string[] {
        if (!schema || Object.keys(schema).length === 0) {
          return [...KNOWN_TYPES];
        }
        return Object.keys(schema).sort();
      }

      /** Extracts the local ID part of an entity URN (after the last colon). */
      export function localId(id: string): string {
        if (!id) return "";
        const idx = id.lastIndexOf(":");
        return idx >= 0 ? id.slice(idx + 1) : id;
      }

      /** Formats a duration in seconds into human words ("3 min", "2 h", "5 days"). */
      export function formatAge(seconds: number, lang: Lang): string {
        return ageMessage(lang, seconds);
      }

      /** Formats a validation failure rule into human words. */
      export function formatRule(rule: string, detail: string, lang: Lang): string {
        return ruleMessage(lang, rule, detail);
      }

      /** Formats a ratio (0..1) as a percentage string ("95 %") or "—" for null. */
      export function percent(ratio: number | null | undefined, _lang: Lang): string {
        if (ratio === null || ratio === undefined || !Number.isFinite(ratio)) {
          return "—";
        }
        return `${Math.round(ratio * 100)} %`;
      }

      /** Converts rows and published schema into the shape expected by the WASM inspector. */
      export function toInput(
        now: number,
        // The published schema as JSON: the SDK's `Schema` type names only what forms read, while the
        // document carries every keyword the validator checks (format, pattern, enum, minimum…).
        schema: Readonly<Record<string, unknown>> | null,
        rowsByType: Map<string, Row[]> | Record<string, Row[]>,
      ): InspectInput {
        const entries =
          rowsByType instanceof Map ? Array.from(rowsByType.entries()) : Object.entries(rowsByType);

        const types: TypeInspectInput[] = entries.map(([type, rows]) => {
          const found = schema?.[type];
          // A definition with no properties publishes nothing to check: the type has no schema.
          const typeSchema = typeof found === "object" && found !== null && "properties" in found ? found : null;
          return {
            type,
            schema: typeSchema,
            rows: rows as Record<string, unknown>[],
          };
        });

        return { now, types };
      }

      /** Sorts types with the worst valid % first; types with no published schema (null) sit at the end. */
      export function sortTypesByQuality(types: TypeQuality[]): TypeQuality[] {
        return [...types].sort((a, b) => {
          if (a.valid !== null && b.valid !== null) {
            if (a.valid !== b.valid) return a.valid - b.valid;
            if (a.completeness !== b.completeness) return a.completeness - b.completeness;
            return a.type.localeCompare(b.type);
          }
          if (a.valid !== null) return -1;
          if (b.valid !== null) return 1;
          if (a.completeness !== b.completeness) return a.completeness - b.completeness;
          return a.type.localeCompare(b.type);
        });
      }

      /** Parses hash state `#quality?type=BikeHireDockingStation`. */
      export function readHash(hash: string): HashState {
        if (!hash) return { type: null };
        const qIdx = hash.indexOf("?");
        const search = qIdx >= 0 ? hash.slice(qIdx + 1) : hash.startsWith("#") ? hash.slice(1) : hash;
        const params = new URLSearchParams(search);
        const type = params.get("type");
        return { type: type && type.trim() !== "" ? type.trim() : null };
      }

      /** Serializes selected type to hash `#quality?type=BikeHireDockingStation` or `#quality`. */
      export function writeHash(type: string | null): string {
        if (!type) return "#quality";
        return `#quality?type=${encodeURIComponent(type)}`;
      }

      export const readView = readHash;
      export const writeView = writeHash;
    src__resolutions.ts: |
      import { useCallback, useEffect, useRef, useState } from "react";
      import type { Resolution, Server } from "./server";

      /** The key of a finding a resolution answers: its entity and attribute. */
      export const findingKey = (entity: string, attribute: string) => `${entity}\n${attribute}`;

      export interface Resolutions {
        /** By finding; empty while read. */
        byFinding: Map<string, Resolution>;
        failed: unknown;
        resolve: (entity: string, attribute: string, note: string) => Promise<void>;
        correct: (entity: string, attribute: string, value: string | number | boolean, note: string) => Promise<void>;
        /** Open at once, resolved again when the server refuses (which throws on). */
        reopen: (id: number) => Promise<void>;
      }

      /** What stewards resolved (T-3827), read once, and their changes to it. */
      export function useResolutions(server: Server): Resolutions {
        const [list, setShown] = useState<Resolution[]>([]);
        const [failed, setFailed] = useState<unknown>(null);
        const shown = useRef<Resolution[]>([]);
        const show = useCallback((next: Resolution[]) => {
          shown.current = next;
          setShown(next);
        }, []);

        useEffect(() => {
          let current = true;
          server.resolutions().then(
            (found) => current && show(found),
            (error: unknown) => current && setFailed(error),
          );
          return () => {
            current = false;
          };
        }, [server, show]);

        const byFinding = new Map<string, Resolution>();
        // The newest first, so an older resolution of the same finding never hides it.
        for (const r of list) if (!byFinding.has(findingKey(r.entity, r.attribute))) byFinding.set(findingKey(r.entity, r.attribute), r);

        return {
          byFinding,
          failed,
          resolve: async (entity, attribute, note) => {
            show([await server.resolve(entity, attribute, note), ...shown.current]);
          },
          correct: async (entity, attribute, value, note) => {
            const made = await server.correct(entity, attribute, value, note);
            if (made) show([made, ...shown.current]);
          },
          reopen: async (id) => {
            const before = shown.current;
            show(before.filter((r) => r.id !== id));
            try {
              await server.reopen(id);
            } catch (error) {
              show(before);
              throw error;
            }
          },
        };
      }
