      import { act, renderHook } from "@testing-library/react";
      import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
      import type { Row } from "@joinedcontext/sdk";
      import { mergeNamed, toInput, topTerm, useTopics } from "./topics";
      import type { AnalysisOutput } from "./topics";

      describe("toInput", () => {
        it("converts SDK rows with complete attributes to article inputs", () => {
          const rows: Row[] = [
            {
              id: "urn:ngsi-ld:Article:hel.fi:helsinki:news-1",
              type: "Article",
              name: "School opening in Kalasatama",
              description: "Modern facilities for children",
              datePublished: "2026-10-05T08:00:00Z",
              url: "https://www.hel.fi/en/news/school-opening",
            },
          ];

          const input = toInput(rows, 5);

          expect(input.k).toBe(5);
          expect(input.seed).toBe(1);
          expect(input.articles).toEqual([
            {
              id: "urn:ngsi-ld:Article:hel.fi:helsinki:news-1",
              title: "School opening in Kalasatama",
              summary: "Modern facilities for children",
              published: "2026-10-05T08:00:00Z",
            },
          ]);
        });

        it("omits summary when description is missing, undefined, null, or empty", () => {
          const rows: Row[] = [
            {
              id: "urn:ngsi-ld:Article:hel.fi:helsinki:news-no-desc",
              type: "Article",
              name: "Brief announcement",
              datePublished: "2026-10-06T10:00:00Z",
            },
            {
              id: "urn:ngsi-ld:Article:hel.fi:helsinki:news-null-desc",
              type: "Article",
              name: "Another notice",
              description: null,
              datePublished: "2026-10-06T11:00:00Z",
            },
            {
              id: "urn:ngsi-ld:Article:hel.fi:helsinki:news-empty-desc",
              type: "Article",
              name: "Notice with blank summary",
              description: "   ",
              datePublished: "2026-10-06T12:00:00Z",
            },
          ];

          const input = toInput(rows, 3);

          expect(input.articles[0].summary).toBeUndefined();
          expect(input.articles[1].summary).toBeUndefined();
          expect(input.articles[2].summary).toBeUndefined();
          expect(input.articles[0].title).toBe("Brief announcement");
          expect(input.articles[0].published).toBe("2026-10-06T10:00:00Z");
        });

        it("omits published when datePublished is missing, undefined, null, or empty", () => {
          const rows: Row[] = [
            {
              id: "urn:ngsi-ld:Article:hel.fi:helsinki:news-no-date",
              type: "Article",
              name: "Undated story",
              description: "Some summary",
            },
            {
              id: "urn:ngsi-ld:Article:hel.fi:helsinki:news-null-date",
              type: "Article",
              name: "Another undated story",
              datePublished: null,
            },
            {
              id: "urn:ngsi-ld:Article:hel.fi:helsinki:news-empty-date",
              type: "Article",
              name: "Story with blank date",
              datePublished: "   ",
            },
          ];

          const input = toInput(rows, 4);

          expect(input.articles[0].published).toBeUndefined();
          expect(input.articles[1].published).toBeUndefined();
          expect(input.articles[2].published).toBeUndefined();
          expect(input.articles[0].title).toBe("Undated story");
          expect(input.articles[0].summary).toBe("Some summary");
        });

        it("handles rows with both description and datePublished missing", () => {
          const rows: Row[] = [
            {
              id: "urn:ngsi-ld:Article:hel.fi:helsinki:news-minimal",
              type: "Article",
              name: "Only title",
            },
          ];

          const input = toInput(rows, 2);

          expect(input.articles).toEqual([
            {
              id: "urn:ngsi-ld:Article:hel.fi:helsinki:news-minimal",
              title: "Only title",
            },
          ]);
        });

        it("supports custom seed and handles empty rows array", () => {
          const emptyInput = toInput([], 5, 42);
          expect(emptyInput).toEqual({
            articles: [],
            k: 5,
            seed: 42,
          });
        });
      });

      // The page's clustering runs off its thread: one request at a time, a stale answer dropped, and
      // every way the worker can fail said in words.
      describe("useTopics", () => {
        const started: FakeWorker[] = [];
        class FakeWorker {
          onmessage: ((event: { data: unknown }) => void) | null = null;
          onerror: ((event: { message: string }) => void) | null = null;
          posted: Array<{ id: number }> = [];
          terminated = false;
          constructor() {
            started.push(this);
          }
          postMessage(message: { id: number }) {
            this.posted.push(message);
          }
          terminate() {
            this.terminated = true;
          }
        }
        const ROW: Row = { id: "urn:ngsi-ld:Article:hel.fi:helsinki:1", type: "Article", name: "Tram line opens" };
        const ANSWER: AnalysisOutput = { topics: [], weeks: [], unassigned: ["urn:ngsi-ld:Article:hel.fi:helsinki:1"] };

        beforeEach(() => {
          started.length = 0;
          vi.stubGlobal("Worker", FakeWorker);
        });
        afterEach(() => vi.unstubAllGlobals());

        it("answers the latest request only, and stops the worker with the page", () => {
          const view = renderHook(({ k }) => useTopics([ROW], k), { initialProps: { k: 3 } });
          const worker = started[0];
          expect(view.result.current.status).toBe("loading");
          view.rerender({ k: 4 });
          const [old, latest] = worker.posted;
          act(() => worker.onmessage?.({ data: { id: old.id, output: ANSWER } }));
          act(() => worker.onmessage?.({ data: null }));
          expect(view.result.current.status).toBe("loading");
          act(() => worker.onmessage?.({ data: { id: latest.id, output: ANSWER } }));
          expect(view.result.current).toEqual({ status: "ready", result: ANSWER, error: null });
          // A message with neither an answer nor an error changes nothing.
          act(() => worker.onmessage?.({ data: { id: latest.id } }));
          expect(view.result.current.status).toBe("ready");
          view.unmount();
          expect(worker.terminated).toBe(true);
        });

        it("says what the worker or the module could not do", () => {
          const view = renderHook(() => useTopics([ROW]));
          const worker = started[0];
          const id = worker.posted[0].id;
          act(() => worker.onmessage?.({ data: { id, error: "the module stopped" } }));
          expect(view.result.current.error?.message).toBe("the module stopped");
          act(() => worker.onmessage?.({ data: { id, output: { error: "Invalid input JSON" } } }));
          expect(view.result.current).toMatchObject({ status: "error", result: null });
          expect(view.result.current.error?.message).toBe("Invalid input JSON");
          act(() => worker.onerror?.({ message: "" }));
          expect(view.result.current.error?.message).toBe("Worker error");
          act(() => worker.onerror?.({ message: "out of memory" }));
          expect(view.result.current.error?.message).toBe("out of memory");
        });

        it("answers no article with no topic, without asking the worker", () => {
          const view = renderHook(() => useTopics([]));
          expect(view.result.current).toEqual({ status: "ready", result: { topics: [], weeks: [], unassigned: [] }, error: null });
          expect(started[0].posted).toEqual([]);
        });

        it("says so when no worker can be started", () => {
          vi.stubGlobal(
            "Worker",
            class {
              constructor() {
                throw new Error("Workers are blocked");
              }
            },
          );
          const view = renderHook(() => useTopics([ROW]));
          expect(view.result.current).toMatchObject({ status: "error" });
          expect(view.result.current.error?.message).toBe("Workers are blocked");
        });

        it("says so in words when the browser refuses a worker with no Error at all", () => {
          vi.stubGlobal(
            "Worker",
            class {
              constructor() {
                throw "refused";
              }
            },
          );
          const view = renderHook(() => useTopics([{ id: "urn:ngsi-ld:Article:hel.fi:helsinki:2", type: "Article" }]));
          expect(view.result.current.error?.message).toBe("refused");
        });
      });

      describe("mergeNamed", () => {
        const topic = (id: number, terms: string[], share: number, articles: string[]) => ({
          id,
          keywords: terms.map((term, i) => ({ term, weight: 1 - i / 10 })),
          articles,
          share,
        });
        const result = {
          topics: [topic(0, ["kirjasto", "laina"], 0.5, ["a"]), topic(1, ["raitiotie"], 0.3, ["b"]), topic(2, ["lukusali", "kirjasto"], 0.2, ["c"])],
          weeks: [
            { week: "2026-W40", shares: [0.4, 0.4, 0.2] },
            { week: "2026-W41", shares: [0.6] },
          ],
          unassigned: ["z"],
        };

        it("joins the topics a steward gave one name, and leaves the others as they are", () => {
          const names: Record<string, string> = { kirjasto: "Libraries", lukusali: "Libraries", raitiotie: "Trams" };
          const merged = mergeNamed(result, (term) => names[term]);
          expect(merged.topics).toHaveLength(2);
          expect(merged.topics[0]).toEqual({
            id: 0,
            keywords: [
              { term: "kirjasto", weight: 1 },
              { term: "laina", weight: 0.9 },
              { term: "lukusali", weight: 1 },
            ],
            articles: ["a", "c"],
            share: 0.7,
          });
          expect(merged.topics[1]).toBe(result.topics[1]);
          expect(merged.weeks[0].shares[0]).toBeCloseTo(0.6);
          // A week that held none of a merged topic's articles counts it as nothing.
          expect(merged.weeks[1].shares[0]).toBeCloseTo(0.6);
          expect(merged.unassigned).toEqual(["z"]);
        });

        it("changes nothing when no topic has a name, and a topic with no keyword has no top keyword", () => {
          const merged = mergeNamed(result, () => undefined);
          expect(merged.topics).toEqual(result.topics);
          expect(merged.weeks).toEqual(result.weeks);
          expect(topTerm(topic(3, [], 0, []))).toBe("");
        });
      });
    src__topics.ts: |
      import { useEffect, useMemo, useRef, useState } from "react";
      import { format } from "@joinedcontext/sdk";
      import type { Row } from "@joinedcontext/sdk";

      export interface ArticleInput {
        id: string;
        title: string;
        summary?: string;
        published?: string;
      }

      export interface AnalysisInput {
        articles: ArticleInput[];
        k: number;
        seed: number;
      }

      export interface Keyword {
        term: string;
        weight: number;
      }

      export interface Topic {
        id: number;
        keywords: Keyword[];
        articles: string[];
        share: number;
      }

      export interface WeekShare {
        week: string;
        shares: number[];
      }

      export interface AnalysisOutput {
        topics: Topic[];
        weeks: WeekShare[];
        unassigned: string[];
      }

      export type TopicStatus = "loading" | "ready" | "error";

      export interface TopicsHookResult {
        status: TopicStatus;
        result: AnalysisOutput | null;
        error: Error | null;
      }

      /** A cell as text; the SDK has already resolved a language map to the reader's language. */
      function textOf(cell: Row[string]): string {
        return format(cell).trim();
      }

      /** Formats SDK rows into the typed input expected by the WASM topic clusterer; the module clamps k. */
      export function toInput(rows: Row[], k = 5, seed = 1): AnalysisInput {
        const articles: ArticleInput[] = rows.map((row) => {
          const title = textOf(row.name) || row.id;
          const summary = textOf(row.description);
          const published = textOf(row.datePublished);
          const article: ArticleInput = {
            id: row.id,
            title,
          };
          if (summary) article.summary = summary;
          if (published) article.published = published;
          return article;
        });

        return { articles, k, seed };
      }

      /**
       * Runs topic clustering in a dedicated Web Worker, dropping stale requests
       * and managing loading and error states cleanly without crashing.
       */
      export function useTopics(rows: Row[], k = 5, seed = 1): TopicsHookResult {
        const [status, setStatus] = useState<TopicStatus>("loading");
        const [result, setResult] = useState<AnalysisOutput | null>(null);
        const [error, setError] = useState<Error | null>(null);

        const workerRef = useRef<Worker | null>(null);
        const nextIdRef = useRef(1);
        const activeIdRef = useRef<number | null>(null);

        useEffect(() => {
          let worker: Worker;
          try {
            worker = new Worker(new URL("./worker.ts", import.meta.url), { type: "module" });
          } catch (err) {
            setStatus("error");
            setError(err instanceof Error ? err : new Error(String(err)));
            return;
          }

          workerRef.current = worker;

          worker.onmessage = (
            event: MessageEvent<{ id: number; output?: AnalysisOutput | { error: string }; error?: string }>,
          ) => {
            const msg = event.data;
            if (!msg || msg.id !== activeIdRef.current) {
              return;
            }

            if (msg.error) {
              setStatus("error");
              setError(new Error(msg.error));
              setResult(null);
            } else if (msg.output) {
              if ("error" in msg.output && typeof msg.output.error === "string") {
                setStatus("error");
                setError(new Error(msg.output.error));
                setResult(null);
              } else {
                setStatus("ready");
                setResult(msg.output as AnalysisOutput);
                setError(null);
              }
            }
          };

          worker.onerror = (err) => {
            setStatus("error");
            setError(new Error(err.message || "Worker error"));
          };

          return () => {
            worker.terminate();
            workerRef.current = null;
          };
        }, []);

        const input = useMemo(() => toInput(rows, k, seed), [rows, k, seed]);
        const inputJson = useMemo(() => JSON.stringify(input), [input]);

        useEffect(() => {
          if (rows.length === 0) {
            setStatus("ready");
            setResult({ topics: [], weeks: [], unassigned: [] });
            setError(null);
            activeIdRef.current = null;
            return;
          }

          const worker = workerRef.current;
          if (!worker) {
            return;
          }

          const id = nextIdRef.current++;
          activeIdRef.current = id;
          setStatus("loading");

          worker.postMessage({ id, input });
        }, [inputJson, rows.length]);

        return { status, result, error };
      }

      /** A topic's top keyword: what a follow and a steward's name hold on to as topics are fitted again. */
      export const topTerm = (topic: Topic): string => topic.keywords[0]?.term ?? "";

      /**
       * Topics a steward gave one name, as one (T-3828): the first topic's id kept, the shares summed,
       * keywords and articles joined. A topic without a name stays as it is.
       */
      export function mergeNamed(result: AnalysisOutput, nameOf: (term: string) => string | undefined): AnalysisOutput {
        const groups = new Map<string, Topic[]>();
        for (const topic of result.topics) {
          const key = nameOf(topTerm(topic)) ?? `#${topic.id}`;
          groups.set(key, [...(groups.get(key) ?? []), topic]);
        }
        const topics = [...groups.values()].map(([first, ...rest]) =>
          rest.length === 0
            ? first
            : {
                id: first.id,
                keywords: [...first.keywords, ...rest.flatMap((topic) => topic.keywords)].filter(
                  (keyword, index, all) => all.findIndex((other) => other.term === keyword.term) === index,
                ),
                articles: [...first.articles, ...rest.flatMap((topic) => topic.articles)],
                share: rest.reduce((sum, topic) => sum + topic.share, first.share),
              },
        );
        const weeks = result.weeks.map((week) => {
          const shares = [...week.shares];
          for (const [first, ...rest] of groups.values()) {
            if (rest.length === 0) continue;
            shares[first.id] = rest.reduce((sum, topic) => sum + (week.shares[topic.id] ?? 0), week.shares[first.id] ?? 0);
          }
          return { week: week.week, shares };
        });
        return { ...result, topics, weeks };
      }
    src__wasm.test.ts: |
      import { describe, expect, it } from "vitest";
      import { initSync, analyse } from "../wasm/pkg/news_topics_wasm.js";
      import module from "../wasm/pkg/news_topics_wasm_bg.wasm?inline";
      import { ARTICLES } from "./fixtures/news";

      // The module the build lane compiled (wasm/pkg), its bytes as Vite inlines them.
      initSync({ module: Uint8Array.from(atob(module.slice(module.indexOf(",") + 1)), (c) => c.charCodeAt(0)) });

      interface TopicOutput {
        id: number;
        keywords: Array<{ term: string; weight: number }>;
        articles: string[];
        share: number;
      }

      interface WeekOutput {
        week: string;
        shares: number[];
      }

      interface AnalyseOutput {
        topics: TopicOutput[];
        weeks: WeekOutput[];
        unassigned: string[];
        error?: string;
      }

      function toArticleInput(row: (typeof ARTICLES)[number]) {
        const nameVal = row.name;
        const title =
          typeof nameVal === "object" && nameVal !== null && "languageMap" in nameVal
            ? (nameVal.languageMap as Record<string, string>).en
            : String(nameVal ?? "");
        const descVal = row.description;
        const summary =
          typeof descVal === "object" && descVal !== null && "languageMap" in descVal
            ? (descVal.languageMap as Record<string, string>).en
            : typeof descVal === "string"
              ? descVal
              : undefined;
        const published = typeof row.datePublished === "string" ? row.datePublished : undefined;
        return {
          id: row.id,
          title,
          ...(summary ? { summary } : {}),
          ...(published ? { published } : {}),
        };
      }

      describe("WASM topic analysis", () => {
        it("clusters news fixtures into ranked topics with keywords and weekly shares", () => {
          const articles = ARTICLES.map(toArticleInput);
          const input = JSON.stringify({ articles, k: 5, seed: 1 });
          const output: AnalyseOutput = JSON.parse(analyse(input));

          expect(output.error).toBeUndefined();
          expect(Array.isArray(output.topics)).toBe(true);
          expect(output.topics.length).toBe(5);

          // Topics are ranked by article count descending, renumbered 0..4
          for (let i = 0; i < output.topics.length; i++) {
            const topic = output.topics[i];
            expect(topic.id).toBe(i);
            expect(Array.isArray(topic.keywords)).toBe(true);
            expect(topic.keywords.length).toBeGreaterThan(0);
            expect(topic.keywords.length).toBeLessThanOrEqual(6);
            for (const kw of topic.keywords) {
              expect(typeof kw.term).toBe("string");
              expect(kw.term.length).toBeGreaterThanOrEqual(3);
              expect(typeof kw.weight).toBe("number");
              expect(kw.weight).toBeGreaterThan(0);
            }
            expect(Array.isArray(topic.articles)).toBe(true);
            expect(topic.articles.length).toBeGreaterThan(0);
            expect(typeof topic.share).toBe("number");
            expect(topic.share).toBeGreaterThan(0);

            if (i > 0) {
              expect(output.topics[i - 1].articles.length).toBeGreaterThanOrEqual(topic.articles.length);
            }
          }

          // Overall topic shares should sum to 1.0 (within float tolerance)
          const totalShare = output.topics.reduce((sum, t) => sum + t.share, 0);
          expect(totalShare).toBeCloseTo(1, 2);

          // Weeks are sorted in ISO format, and non-empty weeks sum to 1.0
          expect(Array.isArray(output.weeks)).toBe(true);
          expect(output.weeks.length).toBeGreaterThanOrEqual(6);

          for (let i = 0; i < output.weeks.length; i++) {
            const week = output.weeks[i];
            expect(week.week).toMatch(/^\d{4}-W\d{2}$/);
            expect(week.shares.length).toBe(output.topics.length);

            if (i > 0) {
              expect(week.week.localeCompare(output.weeks[i - 1].week)).toBeGreaterThan(0);
            }

            const weekSum = week.shares.reduce((a, b) => a + b, 0);
            if (weekSum > 0) {
              expect(weekSum).toBeCloseTo(1, 2);
            } else {
              expect(weekSum).toBe(0);
            }
          }
        });

        it("returns an error object for malformed JSON input without panicking", () => {
          const invalidJson = "{ malformed json: true ";
          const res1 = JSON.parse(analyse(invalidJson));
          expect(res1.error).toBeDefined();
          expect(typeof res1.error).toBe("string");

          const nonObject = analyse("null");
          const res2 = JSON.parse(nonObject);
          expect(res2.error).toBeDefined();

          const emptyString = analyse("");
          const res3 = JSON.parse(emptyString);
          expect(res3.error).toBeDefined();
        });

        it("handles empty articles list without panicking", () => {
          const res: AnalyseOutput = JSON.parse(analyse(JSON.stringify({ articles: [], k: 5, seed: 1 })));
          expect(res.topics).toEqual([]);
          expect(res.weeks).toEqual([]);
          expect(res.unassigned).toEqual([]);
        });

        it("produces deterministic output for the same seed", () => {
          const articles = ARTICLES.map(toArticleInput);
          const input = JSON.stringify({ articles, k: 5, seed: 42 });
          const run1 = analyse(input);
          const run2 = analyse(input);
          expect(run1).toBe(run2);
        });
      });
    src__worker.ts: |
      import init, { analyse } from "../wasm/pkg/news_topics_wasm.js";

      let initPromise: Promise<unknown> | null = null;

      function ensureInit(): Promise<unknown> {
        if (!initPromise) {
          initPromise = init();
        }
        return initPromise;
      }

      export interface WorkerRequest {
        id: number;
        input: unknown;
      }

      export interface WorkerSuccessResponse {
        id: number;
        output: unknown;
      }

      export interface WorkerErrorResponse {
        id: number;
        error: string;
      }

      export type WorkerResponse = WorkerSuccessResponse | WorkerErrorResponse;

      self.onmessage = async (event: MessageEvent<WorkerRequest>) => {
        const data = event.data;
        if (!data || typeof data.id !== "number") return;
        const { id, input } = data;

        try {
          await ensureInit();
          const raw = typeof input === "string" ? input : JSON.stringify(input);
          const json = analyse(raw);
          const parsed = JSON.parse(json) as Record<string, unknown>;
          if (
            typeof parsed === "object" &&
            parsed !== null &&
            "error" in parsed &&
            typeof parsed.error === "string"
          ) {
            self.postMessage({ id, error: parsed.error } satisfies WorkerErrorResponse);
          } else {
            self.postMessage({ id, output: parsed } satisfies WorkerSuccessResponse);
          }
        } catch (err) {
          const error = err instanceof Error ? err.message : String(err);
          self.postMessage({ id, error } satisfies WorkerErrorResponse);
        }
      };
