apps:
  data-quality-inspector:
    .gitea__workflows__build.yml: |
      # The build of this application (AP-80, AP-100, AP-101, AP-104, ADR-N-028). The Portal writes this
      # file in the application's first commit and a run never changes it: only a version a reviewer
      # merged runs. It builds the default branch on every push to it, and again when the Portal's
      # Rebuild dispatches it (AP-103).
      #
      # Runs on the installation's `gitea-runner` (label node-22), whose image carries the SDK and the
      # template's packages already installed, so nothing is installed here (AP-82). No step fetches an
      # action: the runner reaches the forge and the Portal API only (AP-81), by the in-cluster
      # addresses it gives every job as JC_FORGE_URL and JC_PORTAL_URL; `gitea.server_url` is the
      # public host, which the runner cannot reach.
      #
      # Two jobs: `build` runs the application's code and holds the job token only; `propose` runs no
      # code of the application and is the only one that sees the lane's secret. The Portal checks the
      # uploaded bundle against the proposed digest and publishes the package itself (AP-104).
      name: build

      on:
        push:
          branches: [main]
        workflow_dispatch:

      jobs:
        # `build` runs in a pod of this App's own (label app-build-rust: Rust to WebAssembly, AP-142), registered with this
        # repository's token alone and mounting this App's build cache; `propose` stays on the shared
        # runner and mounts no cache (AP-130, AP-131).
        build:
          runs-on: app-build-rust
          timeout-minutes: 30
          env:
            JC_BUILD_DIR: ${{ runner.temp }}/jc-build
          outputs:
            digest: ${{ steps.upload.outputs.digest }}
            commit: ${{ steps.upload.outputs.commit }}
            sdk-version: ${{ steps.upload.outputs.sdk-version }}
            built-at: ${{ steps.upload.outputs.built-at }}
          steps:
            # Clones the commit, runs the tests, builds and bundles the functions; the application's
            # own code runs here, with the job token removed from its environment.
            - name: Test and build
              env:
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_APP_COMMIT: ${{ gitea.sha }}
                JC_FORGE_TOKEN: ${{ gitea.token }}
              run: JC_APP_REPO="$JC_FORGE_URL/$JC_REPOSITORY.git" build-app

            # bundle-{commit} and sbom-{commit}, the run's artifacts, for the Portal to check and publish.
            - name: Upload the build
              id: upload
              run: node /opt/template/lane.mjs upload "$JC_BUILD_DIR"

        propose:
          needs: build
          runs-on: node-22
          timeout-minutes: 5
          steps:
            # The one step that sees the lane's secret, and it runs no code of the application (AP-80).
            - name: Propose status.build
              env:
                JC_LANE_TOKEN: ${{ secrets.JC_LANE_TOKEN }}
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_DIGEST: ${{ needs.build.outputs.digest }}
                JC_COMMIT: ${{ needs.build.outputs.commit }}
                JC_SDK_VERSION: ${{ needs.build.outputs.sdk-version }}
                JC_BUILT_AT: ${{ needs.build.outputs.built-at }}
              run: node /opt/template/lane.mjs propose "$JC_REPOSITORY"
    .gitignore: |
      node_modules/
      dist/
      wasm/target/
      wasm/pkg/
      test-results
      playwright-report
    README.md: |
      # Helsinki data quality

      Helsinki open data quality inspector for data stewards: how complete, fresh and valid the open data of the Helsinki space is, per entity type and per attribute, and which entities fail.

      - Overview tile per entity type showing entities read, completeness %, valid %, and median age of the newest timestamp (sorted with the lowest valid % first).
      - Bar chart of completeness across all entity types.
      - Type-level detail with completeness per schema attribute.
      - Failing entities table showing the local id, failing attribute, and reason in plain words (first 200 rows with count of remaining). The inspector names an entity by its whole id, so two with the same local id under different prefixes count as two; the id opens the entity in the SDK's entity panel (SDK-40), which links it to the Portal. A steward resolves a finding or corrects its attribute from the table (below).
      - Freshness metrics (median, oldest, share older than 24 h) based on the first timestamp property present in the type schema.
      - A rule behind a `$ref` (the enum definitions the SDK's schema leaves out) is counted as not checked, never as a failure.
      - Types without a published schema show completeness over the attributes they carry with a "no published schema" note.
      - URL hash navigation (`#quality?type=BikeHireDockingStation`).
      - Finnish, English and Swedish (`?lang=fi|en|sv`, else browser preference), switched in the SDK's `AppShell` (SDK-39), with light and dark themes; the loading, empty and error states are the SDK's.

      ## How it is built

      A `wasm` App (AP-142, AP-148): React on the Joined Context App SDK, schema validation and quality aggregation in Rust, compiled to WebAssembly and run in a Web Worker in the visitor's browser, and a server component on the shared WASM host that keeps the runs (T-3354).

      - `wasm/` is the crate:
        - `validate.rs`: custom validator checking `type`, `enum`, `minimum`, `maximum`, `pattern`, `format` (`date-time`, `date`, `uri`), `properties` + `required` for objects, and `x-ngsi-ld-kind: LanguageProperty`.
        - `quality.rs`: aggregates completeness, validity (entities with no findings / total), findings, and freshness ages against the timestamp properties.
        - `lib.rs`: `inspect` function (JSON in, JSON out).
      - Uses `regex` with `default-features = false` and `features = ["std"]` (no Unicode tables) instead of the `jsonschema` crate to keep the gzipped WebAssembly module under 300 KB (`jsonschema` measured 690 KB gzipped).
      - `src/inspect.worker.ts` loads the module once and answers each call; `src/inspect.ts` is the page's React hook.
      - Reads 12 entity types from Context Space `helsinki`: AirQualityObserved, Alert, BikeHireDockingStation, AdministrativeArea, CityWork, Event, Article, OnStreetParking, PointOfInterest, Vehicle, WaterQualityObserved, WeatherObserved.
      - `server/` is the server component (`wasm32-wasip2`, on `jc-app-sdk`), reusing `wasm/` without wasm-bindgen (`inspect_type_with` keeps every finding). Once a day, or when a reader presses Inspect now (at most once every ten minutes), it reads the Endpoint's published schema and its entities through the App's own Endpoint with the reader's token, rows flattened as the SDK flattens them, runs the same inspection and keeps the run's scores per type in `quality_runs` and `run_types` (`migrations/`), so the page shows the trend. The run's full report, every finding grouped by entity, goes to `runs/<id>/report.json` under the App's storage prefix and downloads through a presigned URL.

      | Route | What it does |
      |---|---|
      | `GET /apps/data-quality-inspector/api/runs` | the kept runs, newest first, with their scores per type |
      | `POST /apps/data-quality-inspector/api/runs` | a run now, at most one every ten minutes |
      | `GET /apps/data-quality-inspector/api/runs/{id}/report` | a URL to download the run's full report from |

      ## Roles and history

      The server decides from the signed-in person the platform names (`identity::caller()`, API/07),
      never from anything the page sends:

      - anyone, signed in or not, reads every finding and, in its **State** column, whether a steward
        resolved it, who and with what note;
      - a **viewer** reads the same and their own history;
      - a **steward** presses **Resolve** on a finding and either marks it resolved with a note, or
        corrects the attribute: a text, a number or a yes/no, which the server writes to the entity
        through the App's own Endpoint (`gateway::patch_entity`, `PATCH /ngsi-ld/v1/entities/{id}/attrs`)
        with the steward's token, and so resolves it. **Open again** takes a resolution back.

      The server checks the role first; the Endpoint's Policy is the second check: the App's data need
      grants `updateAttrs` on its 13 types to the role `steward` alone (`app.yaml`), never a create or a
      delete, so a correction the server would let through still fails at the gateway for anyone else.
      A correction never writes `id`, `type` or `location`. Anyone else finds the steward's buttons in
      sight, closed, with the reason as their tooltip. A finding opened again shows at once and comes
      back when the server refuses. Every resolution, reopening and correction writes a row into the
      App's `app_audit` table; the **History** page reads it: a viewer their own rows, a steward
      everyone's.

      | Route | Who | What it does |
      |---|---|---|
      | `GET /api/me` | anyone | the caller's name and roles, `null` when signed out |
      | `GET /api/resolutions` | anyone | the resolved findings, newest first, at most 500 |
      | `POST /api/resolutions` `{entity, attribute, note}` | steward | a finding marked resolved |
      | `DELETE /api/resolutions/{id}` | steward | the finding open again |
      | `POST /api/corrections` `{entity, attribute, value, note}` | steward | the attribute corrected through the Endpoint, the finding resolved |
      | `GET /api/history` | signed in | the newest 100 changes (a viewer: their own) |

      `server/host-test.json` plays every route on the real host as an anonymous visitor, a viewer,
      another viewer and a steward, with the gateway's `PATCH` mocked and counted: a refused
      correction never reaches it, and a correction the Policy refuses (`403`) leaves no row.

      ## Run the tests

      ```sh
      pnpm install
      pnpm wasm          # cargo build --target wasm32-unknown-unknown, then wasm-bindgen --target web
      (cd wasm && cargo test)
      (cd server && cargo test && cargo build --release --target wasm32-wasip2)
      pnpm test          # vitest, with the compiled module run in-process
      pnpm build
      pnpm e2e           # the built bundle in Chromium: 4 widths, light and dark, fi and en, axe
      ```

      `pnpm test`, `pnpm typecheck` and `pnpm build` import `wasm/pkg/`, so `pnpm wasm` runs first; the build lane runs it as `builder/build-wasm.sh` (T-3327).
      The build needs the `wasm32-unknown-unknown` target and `wasm-bindgen-cli` 0.2.129, the version the crate pins.
    app.yaml: |
      # Helsinki data quality (T-3336): how complete, fresh and valid the open data of the
      # Helsinki space is, per entity type and attribute, and which entities fail. The inspection
      # runs in the visitor's browser as WebAssembly compiled from the Rust crate in wasm/ (AP-142).
      # The server component in server/ runs on the shared WASM host (T-3354, AP-148): it keeps every
      # quality run's scores in the App's own schema, for the trend, and each run's full per-entity
      # report under its own storage prefix. Hand written, so no generated-by annotation (AP-35).
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: data-quality-inspector
        namespace: helsinki
        title:
          en: "Helsinki data quality"
          fi: "Helsingin datan laatu"
        description:
          en: "How complete, fresh and valid Helsinki open data is, per entity type and attribute, and which entities fail."
          fi: "Helsingin avoimen datan kattavuus, tuoreus ja virheettömyys tietotyypeittäin ja ominaisuuksittain sekä virheelliset kohteet."
      spec:
        kind: wasm
        source:
          git:
            url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_data-quality-inspector.git
            ref: main
        build:
          node: "22"
          rust: "1.90"
        # Its own schema, migrated from migrations/ at publish, and its own prefix for the reports.
        storage:
          sql:
            migrations: migrations
            quotaMiB: 50
          blob:
            quotaMiB: 1024
        # The quality run of every type, once a day at 02:40 UTC, as the App's own job principal through
        # its own Endpoint (AP-154, AP-159): a run reads about thirty pages, past a request's 5 s wall
        # time, so only the job runs one (T-3579).
        server:
          jobs:
            - name: daily-inspection
              schedule: "40 2 * * *"
              export: inspect-daily
        # Who does what (T-3827): the server decides from the signed-in person, never from the page.
        roles:
          - name: viewer
            title: { en: "Viewer", fi: "Katselija" }
            description: "Reads every finding and what stewards resolved; their own history."
          - name: steward
            title: { en: "Steward", fi: "Ylläpitäjä" }
            description: "What a viewer does, and marks a finding resolved with a note, or corrects the attribute of the entity through the App's Endpoint; opens a finding again. Reads the whole history."
        access:
          - role: viewer
            subjects: [{ group: data-quality-inspector-viewer }]
          - role: steward
            subjects: [{ group: data-quality-inspector-steward }]
        visibility: public
        lifecycle: published
        dataNeeds:
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types:
              - AirQualityObserved
              - Alert
              - BikeHireDockingStation
              - AdministrativeArea
              - Event
              - Article
              - OnStreetParking
              - PointOfInterest
              - CityWork
              - Vehicle
              - WaterQualityObserved
              - WeatherObserved
            operations: [queryEntity, retrieveEntity]
            representations: [ngsi-ld, ogc-features]
          # A steward corrects one attribute of an entity a finding names (T-3827, API/07 §4): the server
          # checks the role first and this Policy, held by the steward role alone, is the second check.
          # Never createEntity or deleteEntity, and no other role.
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types:
              - AirQualityObserved
              - Alert
              - BikeHireDockingStation
              - AdministrativeArea
              - Event
              - Article
              - OnStreetParking
              - PointOfInterest
              - CityWork
              - Vehicle
              - WaterQualityObserved
              - WeatherObserved
            operations: [updateAttrs]
            roles: [steward]
    e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { BASE, serve, STEWARD, VIEWER } from "./serve";

      for (const scheme of ["light", "dark"] as const) {
        for (const lang of ["fi", "en"] as const) {
          for (const size of WIDTHS) {
            test(`${scheme} ${lang} at ${size.width} px: types list has buttons, chart canvas drawn, choose BikeHireDockingStation shows failing table, axe clean`, async ({ page }, testInfo) => {
              await page.emulateMedia({ colorScheme: scheme });
              const { outside, missing, problems } = await serve(page);
              await page.setViewportSize(size);
              await page.goto(`${BASE}?lang=${lang}`);

              // The types list has buttons
              const typeButtons = page.locator(".app-type-btn");
              await expect(typeButtons).toHaveCount(4);

              // The chart canvas is drawn
              await expect(page.locator(".jc-chart-canvas")).toHaveCount(1);
              await expect(page.locator(".jc-chart-canvas canvas").first()).toBeVisible();

              // Choose BikeHireDockingStation and the failing table has rows
              await page.getByRole("button", { name: "BikeHireDockingStation", exact: true }).click();
              const failingTable = page.locator(
                lang === "fi" ? "table[aria-label='Virheelliset kohteet']" : "table[aria-label='Failing entities']",
              );
              await expect(failingTable).toBeVisible();
              await expect(failingTable.locator("tbody tr")).toHaveCount(4);

              await testInfo.attach(`${scheme}-${lang}-${size.width}.png`, {
                body: await page.screenshot({ fullPage: true }),
                contentType: "image/png",
              });

              // Sideways scroll, overlap, cut-off controls and what axe finds at WCAG 2.1 AA.
              expect(await layoutProblems(page)).toEqual([]);
              expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
            });
          }
        }
      }

      test("clicking back button returns to overview tiles and updates hash to #quality", async ({ page }) => {
        await serve(page);
        await page.setViewportSize({ width: 1440, height: 900 });
        await page.goto(`${BASE}?lang=en#quality?type=BikeHireDockingStation`);

        await expect(page.getByRole("button", { name: "BikeHireDockingStation", exact: true })).toHaveAttribute("aria-pressed", "true");
        await page.getByRole("button", { name: "← All types" }).click();
        await expect(page.locator(".jc-tiles .jc-tile")).toHaveCount(4);
        expect(new URL(page.url()).hash).toBe("#quality");
      });

      // T-3354: the runs the App's daily job keeps (T-3579: no run on request), and a run's full report
      // downloaded from the store.
      test("the kept runs are listed and a run's full report opens", async ({ page }) => {
        const { outside, missing, problems } = await serve(page);
        await page.setViewportSize({ width: 1440, height: 900 });
        await page.goto(`${BASE}?lang=en`);
        const trend = page.getByRole("table", { name: "Quality over time: the runs the server keeps" });
        await expect(trend.getByRole("row")).toHaveCount(3);
        await expect(page.getByRole("button", { name: "Inspect now" })).toHaveCount(0);
        await page.context().route("http://portal.test/store/**", (route) => route.fulfill({ status: 200, contentType: "application/json", body: "{}" }));
        const popup = page.waitForEvent("popup");
        await trend.getByRole("button", { name: /^Download the full report of the run at 21 Oct 2030/ }).click();
        const tab = await popup;
        await tab.waitForLoadState();
        expect(tab.url()).toBe("http://portal.test/store/runs/2/report.json");
        await tab.close();
        expect(await layoutProblems(page)).toEqual([]);
        expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
      });

      test("all types failing displays retryable problem message", async ({ page }) => {
        await serve(page, []);
        await page.goto(`${BASE}?lang=en`);
        // All types have 0 entities with empty rows, Vehicle has no schema
        await expect(page.locator(".jc-tiles")).toBeVisible();
      });

      // T-3391, SDK-40: a failing entity opened in the SDK's entity panel by its id, at a phone and a
      // laptop, light and dark. The App is public, so the panel links to the Portal and offers no Edit.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: a failing entity in the entity panel, linked to the Portal, axe clean`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}?lang=en`);
            await page.getByRole("button", { name: "BikeHireDockingStation", exact: true }).click();
            await page.getByRole("table", { name: "Failing entities" }).getByRole("button", { name: "fail-neg" }).first().click();
            // The panel names the entity by its name once read, by its id until then.
            const panel = page.getByRole("dialog");
            await expect(panel.getByText("BikeHireDockingStation")).toBeVisible();
            await expect(panel.getByRole("link", { name: "Open in the Portal" })).toBeVisible();
            await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
            expect(await layoutProblems(page)).toEqual([]);
            await page.keyboard.press("Escape");
            await expect(page.getByRole("dialog")).toHaveCount(0);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      // T-3827: a viewer sees the steward's buttons closed with the reason; a steward corrects a value,
      // which resolves the finding, and finds it in the history. At a phone and a laptop, light and dark.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: a viewer finds the steward's buttons closed, axe clean`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page, undefined, undefined, VIEWER);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}?lang=en#quality?type=BikeHireDockingStation`);
            await expect(page.getByLabel("Your role: Viewer")).toBeVisible();
            const resolve = page.getByRole("button", { name: "Resolve: availableBikeNumber fail-neg" });
            await expect(resolve).toBeDisabled();
            await expect(resolve).toHaveAttribute("title", "Only a steward resolves or corrects findings.");
            expect(await layoutProblems(page)).toEqual([]);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });

          test(`${scheme} at ${width} px: a steward corrects a value and finds it in the history, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page, undefined, undefined, STEWARD);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}?lang=en#quality?type=BikeHireDockingStation`);
            await expect(page.getByLabel("Your role: Steward")).toBeVisible();
            await page.getByRole("button", { name: "Resolve: availableBikeNumber fail-neg" }).click();
            const form = page.getByRole("form", { name: "Resolve: availableBikeNumber of fail-neg" });
            await form.getByRole("textbox", { name: "Note" }).fill("Counted on site");
            await form.getByRole("combobox", { name: "Kind of value" }).selectOption("number");
            await form.getByRole("textbox", { name: "Correct value" }).fill("4");
            await testInfo.attach(`correct-${scheme}-${width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            await form.getByRole("button", { name: "Correct the value" }).click();
            await expect(page.getByText("Corrected by Sami Steward: Counted on site")).toBeVisible();
            await expect(page.getByText("The value is corrected and the finding resolved.")).toBeVisible();
            await page.getByRole("button", { name: "History" }).click();
            await expect(page.getByText(/corrected availableBikeNumber: Counted on site/)).toBeVisible();
            expect(await layoutProblems(page)).toEqual([]);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }
    e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { Page } from "@playwright/test";
      import { stubTransport } from "@joinedcontext/sdk/testing";
      import { ENTITIES, NOW, SCHEMA_WITH_VEHICLE } from "../src/fixtures/quality";

      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      export const BASE = "http://portal.test/";
      const SLUG = "rywjgug3g32ayfjwkzr5j3tqom";
      const CONFIG = {
        slug: SLUG,
        orgDomain: "hel.fi",
        space: "helsinki",
        transport: "origin",
        appName: "data-quality-inspector",
        // Where the entity panel links an entity (SDK-40); shown, never followed.
        portal: "https://portal.hel.fi/projects/helsinki",
      };

      const TYPES: Record<string, string> = {
        ".html": "text/html",
        ".js": "text/javascript",
        ".css": "text/css",
        ".json": "application/json",
        ".svg": "image/svg+xml",
        ".woff2": "font/woff2",
        ".wasm": "application/wasm",
      };

      export interface Served {
        outside: string[];
        missing: string[];
        problems: string[];
      }

      const ACCESS = {
        permissions: [
          { resource: { type: "BikeHireDockingStation" }, actions: ["queryEntity", "retrieveEntity"], attributes: "*" },
          { resource: { type: "AdministrativeArea" }, actions: ["queryEntity", "retrieveEntity"], attributes: "*" },
          { resource: { type: "Event" }, actions: ["queryEntity", "retrieveEntity"], attributes: "*" },
          { resource: { type: "Vehicle" }, actions: ["queryEntity", "retrieveEntity"], attributes: "*" },
        ],
        prohibitions: [],
      };

      /** Who the App's server says is signed in (T-3827): signed out unless a test names someone. */
      export type Me = { id: string; name: string; roles: string[] } | null;
      export const VIEWER: Me = { id: "u-1", name: "Vilja Viewer", roles: ["viewer"] };
      export const STEWARD: Me = { id: "u-2", name: "Sami Steward", roles: ["viewer", "steward"] };

      /**
       * The App's server (T-3354) as the page sees it: the runs its daily job kept (T-3579), in memory;
       * who calls, a steward's resolutions and corrections and the history, deciding by `me` (T-3827).
       */
      function appServer(me: Me) {
        const resolutions: { id: number; entity: string; attribute: string; note: string; corrected: boolean; resolverName: string; resolvedAt: string }[] = [];
        const history: unknown[] = [];
        const at = "2030-10-20T09:00:00Z";
        const resolve = (entity: string, attribute: string, note: string, corrected: boolean) => {
          const made = { id: resolutions.length + 1, entity, attribute, note, corrected, resolverName: me?.name ?? "", resolvedAt: at };
          resolutions.unshift(made);
          history.unshift({ id: history.length + 1, at, actorName: me?.name, action: "insert", target: `resolutions/${made.id}`, summary: `resolved ${attribute} of ${entity}: ${note}` });
          return made;
        };
        const runs = [
          { id: 1, ran_at: "2030-10-20T09:00:00Z", types: [], entities: 40, findings: 3, completeness: 0.9, valid: 0.75 },
          { id: 2, ran_at: "2030-10-21T09:00:00Z", types: [], entities: 41, findings: 2, completeness: 0.92, valid: 0.8 },
        ];
        return (method: string, path: string, sent: Record<string, unknown>): { status: number; body: unknown } => {
          if (path === "/me") return { status: 200, body: me };
          if (path === "/resolutions" && method === "GET") return { status: 200, body: resolutions };
          if (path === "/history") return me ? { status: 200, body: history } : { status: 401, body: { detail: "sign in" } };
          if ((path === "/resolutions" || path === "/corrections") && method === "POST") {
            if (!me?.roles.includes("steward")) return { status: 403, body: { detail: "this needs the role steward" } };
            const { entity, attribute, note } = sent as { entity: string; attribute: string; note: string };
            if (path === "/corrections") history.unshift({ id: history.length + 1, at, actorName: me.name, action: "edit", target: entity, summary: `corrected ${attribute}: ${note}` });
            return { status: 201, body: resolve(entity, attribute, note, path === "/corrections") };
          }
          if (path === "/runs" && method === "GET") return { status: 200, body: { runs: [...runs].reverse(), stale: false } };
          const report = /^\/runs\/(\d+)\/report$/.exec(path);
          if (report && runs.some((r) => r.id === Number(report[1]))) return { status: 200, body: { url: `http://portal.test/store/runs/${report[1]}/report.json` } };
          return { status: 404, body: { title: "Not Found", detail: "no such run" } };
        };
      }

      /** Serves the built bundle at the root of the App's own host, with the SDK stub answering the endpoint. */
      export async function serve(page: Page, entities = ENTITIES, schema = SCHEMA_WITH_VEHICLE, me: Me = null): Promise<Served> {
        const transport = stubTransport({
          entities,
          schema,
          access: ACCESS,
        });
        const served: Served = { outside: [], missing: [], problems: [] };
        const api = appServer(me);
        page.on("pageerror", (error) => served.problems.push(error.message));
        // The page reads ages against the fixtures' moment, so they are the ones the unit tests assert.
        await page.clock.setFixedTime(new Date(NOW * 1000));
        await page.route("**/*", async (route) => {
          const url = new URL(route.request().url());
          if (url.origin !== "http://portal.test") {
            served.outside.push(url.href);
            return route.abort();
          }
          if (url.pathname.startsWith(`/api/endpoint/${SLUG}/`)) {
            const body = route.request().postData();
            const answer = await transport({
              method: route.request().method() as "GET",
              path: url.pathname + url.search,
              body: body ? JSON.parse(body) : undefined,
            });
            return route.fulfill({
              status: answer.status,
              contentType: "application/json",
              body: JSON.stringify(answer.body ?? null),
            });
          }
          if (url.pathname.startsWith("/apps/data-quality-inspector/api/")) {
            const answer = api(route.request().method(), url.pathname.slice("/apps/data-quality-inspector/api".length), JSON.parse(route.request().postData() ?? "{}"));
            return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body) });
          }
          const file = normalize(url.pathname.slice(1) || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) {
            served.missing.push(url.pathname);
            return route.fulfill({ status: 404, body: "" });
          }
          let body = readFileSync(join(DIST, file));
          if (file === "index.html") {
            body = Buffer.from(
              body
                .toString("utf8")
                .replace(
                  '<script id="jc-config" type="application/json"></script>',
                  `<script id="jc-config" type="application/json">${JSON.stringify(CONFIG)}</script>`,
                ),
            );
          }
          const headers =
            file === "index.html"
              ? { "Content-Security-Policy": "script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:" }
              : undefined;
          return route.fulfill({
            status: 200,
            contentType: TYPES[extname(file)] ?? "application/octet-stream",
            body,
            headers,
          });
        });
        return served;
      }
