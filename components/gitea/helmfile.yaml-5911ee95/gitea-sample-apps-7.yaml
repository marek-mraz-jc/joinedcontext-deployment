      import { afterEach, describe, expect, it, vi } from "vitest";
      import { apiBase, Problem, server } from "./server";

      const json = (status: number, body: unknown) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });

      describe("the App's server", () => {
        afterEach(() => vi.unstubAllGlobals());

        it("answers at /apps/{name}/api, and a name that is not an App's never builds a path", () => {
          expect(apiBase("data-quality-inspector")).toBe("/apps/data-quality-inspector/api");
          expect(apiBase(undefined)).toBe("/api");
          expect(apiBase("../x")).toBe("/api");
        });

        it("reads the runs, reads a report's URL, and an answer that is not a success is a Problem with its detail", async () => {
          const fetch = vi.fn(async (url: string, _init?: RequestInit) => {
            if (url === "/api/runs") return json(200, { runs: [], stale: false });
            if (url === "/api/runs/4/report") return json(200, { url: "https://store.test/r.json" });
            if (url === "/api/runs/5/report") return json(404, { title: "Not Found", detail: "no such run" });
            return new Response("<html>", { status: 502 });
          });
          vi.stubGlobal("fetch", fetch);
          const api = server("/api");
          expect(await api.runs()).toEqual({ runs: [], stale: false });
          expect(fetch.mock.calls[0]?.[1]).toMatchObject({ method: "GET", credentials: "same-origin" });
          expect(await api.reportUrl(4)).toBe("https://store.test/r.json");
          const refused = await api.reportUrl(5).catch((error: unknown) => error);
          expect(refused).toBeInstanceOf(Problem);
          expect(refused).toMatchObject({ status: 404, message: "no such run" });
          await expect(api.reportUrl(6)).rejects.toMatchObject({ status: 502, message: "HTTP 502" });
        });

        // T-3827: who calls, the resolutions, a correction and the history, each at its route.
        it("calls each route of the roles with its method and body, reads a 204 as nothing, and a correction of a resolved finding as no new resolution", async () => {
          const fetch = vi.fn(async (url: string, init?: RequestInit) => {
            if (init?.method === "DELETE") return new Response(null, { status: 204 });
            if (url === "/api/corrections") return json(200, { entity: "e", attribute: "a", corrected: true });
            return json(200, url.endsWith("/resolutions") && init?.method === "POST" ? { id: 3 } : []);
          });
          vi.stubGlobal("fetch", fetch);
          const api = server("/api");
          await api.me();
          await api.resolutions();
          await api.resolve("e", "a", "n");
          await expect(api.reopen(3)).resolves.toBeUndefined();
          await expect(api.correct("e", "a", 4, "n")).resolves.toBeNull();
          await api.history();
          expect(fetch.mock.calls.map(([url, init]) => `${init?.method} ${url}`)).toEqual([
            "GET /api/me",
            "GET /api/resolutions",
            "POST /api/resolutions",
            "DELETE /api/resolutions/3",
            "POST /api/corrections",
            "GET /api/history",
          ]);
          expect(JSON.parse(fetch.mock.calls[4][1]?.body as string)).toEqual({ entity: "e", attribute: "a", value: 4, note: "n" });
          vi.stubGlobal("fetch", vi.fn().mockRejectedValue(new TypeError("offline")));
          await expect(api.me()).rejects.toMatchObject({ status: 0 });
        });
      });
    src__server.ts: |
      /**
       * The App's server on the shared WASM host, `/apps/{name}/api` (T-3354): every quality run it has
       * kept with its scores, a run now, and a URL for a run's full per-entity report in the App's own
       * storage; who calls, the findings stewards resolved, a steward's correction of an attribute
       * through the App's Endpoint, and the history (T-3827). A test hands the page its own server
       * (`ServerContext`).
       */
      import { createContext, useContext, useMemo } from "react";

      export interface RunType {
        type: string;
        entities: number;
        completeness: number;
        /** `null` for a type without a published schema. */
        valid: number | null;
        findings: number;
        freshness_median_seconds: number | null;
      }

      export interface Run {
        id: number;
        ran_at: string;
        types: RunType[];
        entities: number;
        findings: number;
        completeness: number;
        valid: number | null;
      }

      export interface Runs {
        runs: Run[];
        /** The data could not be read just now: no new run, these are the runs as kept. */
        stale: boolean;
      }

      /** An answer of the server that is not a success, its `detail` as the message. */
      export class Problem extends Error {
        constructor(
          readonly status: number,
          detail: string,
        ) {
          super(detail);
        }
      }

      /** Who is signed in, as the server names them; `null` when signed out. */
      export interface Me {
        id: string;
        name: string;
        roles: string[];
      }

      /** A finding a steward resolved: marked, or corrected through the Endpoint. */
      export interface Resolution {
        id: number;
        entity: string;
        attribute: string;
        note: string;
        corrected: boolean;
        resolverName: string;
        resolvedAt: string;
      }

      export interface HistoryRow {
        id: number;
        at: string;
        actorName: string;
        action: "insert" | "update" | "delete" | "edit";
        target: string;
        summary: string;
      }

      export interface Server {
        me(): Promise<Me | null>;
        resolutions(): Promise<Resolution[]>;
        resolve(entity: string, attribute: string, note: string): Promise<Resolution>;
        reopen(id: number): Promise<void>;
        /** The attribute written through the Endpoint; the new resolution, or `null` when one stood. */
        correct(entity: string, attribute: string, value: string | number | boolean, note: string): Promise<Resolution | null>;
        history(): Promise<HistoryRow[]>;
        runs(): Promise<Runs>;
        /** A URL the run's full report can be downloaded from for two minutes. */
        reportUrl(id: number): Promise<string>;
      }

      /** Where the server answers: `/apps/{appName}/api`, or `/api` when the name is not an App's. */
      export function apiBase(appName: string | undefined): string {
        return appName && /^[a-z0-9-]+$/.test(appName) ? `/apps/${appName}/api` : "/api";
      }

      async function call<T>(url: string, method = "GET", body?: unknown): Promise<T> {
        let answer: Response;
        try {
          answer = await fetch(url, {
            method,
            credentials: "same-origin",
            headers: body === undefined ? { Accept: "application/json" } : { Accept: "application/json", "Content-Type": "application/json" },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
        } catch {
          throw new Problem(0, "the server could not be reached");
        }
        if (!answer.ok) {
          const problem = (await answer.json().catch(() => ({}))) as { detail?: unknown };
          throw new Problem(answer.status, typeof problem.detail === "string" ? problem.detail : `HTTP ${answer.status}`);
        }
        return (answer.status === 204 ? undefined : await answer.json()) as T;
      }

      export function server(base: string): Server {
        return {
          runs: () => call<Runs>(`${base}/runs`),
          reportUrl: async (id) => (await call<{ url: string }>(`${base}/runs/${id}/report`)).url,
          me: () => call<Me | null>(`${base}/me`),
          resolutions: () => call<Resolution[]>(`${base}/resolutions`),
          resolve: (entity, attribute, note) => call<Resolution>(`${base}/resolutions`, "POST", { entity, attribute, note }),
          reopen: (id) => call<void>(`${base}/resolutions/${id}`, "DELETE"),
          correct: async (entity, attribute, value, note) => {
            const answer = await call<Resolution | { corrected: true; id?: undefined }>(`${base}/corrections`, "POST", { entity, attribute, value, note });
            return answer.id === undefined ? null : answer;
          },
          history: () => call<HistoryRow[]>(`${base}/history`),
        };
      }

      /** The server the page talks to; `null` takes the App's own, from its name. */
      export const ServerContext = createContext<Server | null>(null);

      export function useServer(appName: string | undefined): Server {
        const given = useContext(ServerContext);
        return useMemo(() => given ?? server(apiBase(appName)), [given, appName]);
      }
    src__testing__roles.ts: |
      /**
       * The role half of the App's server in memory (T-3827): who calls is `who` (signed out unless a
       * test names someone), and it decides as the real server does: a steward resolves, reopens and
       * corrects; the history shows a viewer their own rows and a steward everyone's. `corrected` keeps
       * what a correction wrote, as the Endpoint would have.
       */
      import { vi } from "vitest";
      import { Problem } from "../server";
      import type { HistoryRow, Me, Resolution, Server } from "../server";

      export const VIEWER: Me = { id: "u-viewer", name: "Vilja Viewer", roles: ["viewer"] };
      export const STEWARD: Me = { id: "u-steward", name: "Sami Steward", roles: ["viewer", "steward"] };

      type RoleServer = Pick<Server, "me" | "resolutions" | "resolve" | "reopen" | "correct" | "history">;

      export interface Roles extends RoleServer {
        who: Me | null;
        resolved: Resolution[];
        corrected: { entity: string; attribute: string; value: unknown }[];
        log: (HistoryRow & { owner: string })[];
      }

      export function roles(who: Me | null = null): Roles {
        const m = { who, resolved: [], corrected: [], log: [] } as unknown as Roles;
        let next = 100;
        const steward = () => {
          if (!m.who) throw new Problem(401, "sign in to do this");
          if (!m.who.roles.includes("steward")) throw new Problem(403, "this needs the role steward");
          return m.who;
        };
        const write = (caller: Me, action: HistoryRow["action"], target: string, summary: string) =>
          m.log.unshift({ id: next++, at: new Date(Date.now()).toISOString(), actorName: caller.name, action, target, summary, owner: caller.id });
        const resolve = (caller: Me, entity: string, attribute: string, note: string, corrected: boolean): Resolution => {
          const made = { id: next++, entity, attribute, note, corrected, resolverName: caller.name, resolvedAt: new Date(Date.now()).toISOString() };
          m.resolved.unshift(made);
          write(caller, "insert", `resolutions/${made.id}`, `resolved ${attribute} of ${entity}: ${note}`);
          return made;
        };
        const open = (entity: string, attribute: string) => !m.resolved.some((r) => r.entity === entity && r.attribute === attribute);
        m.me = vi.fn(async () => m.who);
        m.resolutions = vi.fn(async () => [...m.resolved]);
        m.resolve = vi.fn(async (entity: string, attribute: string, note: string) => {
          const caller = steward();
          if (!open(entity, attribute)) throw new Problem(409, "this finding is resolved already");
          return resolve(caller, entity, attribute, note, false);
        });
        m.reopen = vi.fn(async (id: number) => {
          const caller = steward();
          const at = m.resolved.findIndex((r) => r.id === id);
          if (at < 0) throw new Problem(404, "no such record, or not yours to change");
          m.resolved.splice(at, 1);
          write(caller, "delete", `resolutions/${id}`, "reopened a finding");
        });
        m.correct = vi.fn(async (entity: string, attribute: string, value: string | number | boolean, note: string) => {
          const caller = steward();
          m.corrected.push({ entity, attribute, value });
          write(caller, "edit", entity, `corrected ${attribute}: ${note}`);
          return open(entity, attribute) ? resolve(caller, entity, attribute, note, true) : null;
        });
        m.history = vi.fn(async () => {
          if (!m.who) throw new Problem(401, "sign in to do this");
          const caller = m.who;
          const all = caller.roles.includes("steward");
          return m.log.filter((row) => all || row.owner === caller.id).map(({ owner: _, ...row }) => row);
        });
        return m;
      }
    src__testing__sweep.ts: |
      import { act, fireEvent } from "@testing-library/react";

      const nameOf = (element: HTMLElement) => element.getAttribute("aria-label") ?? element.textContent ?? "";

      /**
       * Every control under `root` used once, as a reader trying each would: each choice of each list
       * chosen and the list put back, each text field typed into and put back, each box ticked (a filter
       * it sets shows the button that clears it), then each enabled button
       * and link pressed once by its name (a press may change what is shown, so the next is found anew),
       * and the lists and fields a press showed used last. The shell's header is left alone: its language
       * list reloads the page.
       */
      export async function sweep(root: HTMLElement): Promise<void> {
        await fields(root);
        const pressed = new Set<string>();
        for (;;) {
          const next = [...root.querySelectorAll<HTMLElement>("button, a[href]")].find(
            (control) => outside(control) && !(control as HTMLButtonElement).disabled && !pressed.has(nameOf(control)),
          );
          if (!next) break;
          pressed.add(nameOf(next));
          await act(async () => {
            fireEvent.click(next);
          });
        }
        await fields(root);
      }

      const outside = (element: Element) => element.closest("header") === null;

      async function fields(root: HTMLElement): Promise<void> {
        for (const select of [...root.querySelectorAll("select")].filter(outside)) {
          const before = select.value;
          for (const value of [...[...select.options].map((o) => o.value), before]) {
            await act(async () => {
              fireEvent.change(select, { target: { value } });
            });
          }
        }
        for (const input of [...root.querySelectorAll("input")].filter(outside)) {
          if (input.type === "checkbox") {
            await act(async () => {
              fireEvent.click(input);
            });
            continue;
          }
          const before = input.value;
          await act(async () => {
            fireEvent.change(input, { target: { value: `${before}1` } });
            fireEvent.change(input, { target: { value: before } });
          });
        }
      }
    src__theme.test.ts: |
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { act, renderHook } from "@testing-library/react";
      import { currentTokens } from "@joinedcontext/sdk";
      import { DARK, LIGHT, prefersDark, startTokens, useScheme } from "./theme";

      /** A system colour scheme the test can switch, as `matchMedia` reports it. */
      function system(dark: boolean) {
        const listeners = new Set<() => void>();
        const media = {
          matches: dark,
          addEventListener: (_: string, listener: () => void) => listeners.add(listener),
          removeEventListener: (_: string, listener: () => void) => listeners.delete(listener),
        };
        vi.stubGlobal("matchMedia", () => media);
        return {
          switchTo(next: boolean) {
            media.matches = next;
            for (const listener of listeners) listener();
          },
          listeners,
        };
      }

      afterEach(() => vi.unstubAllGlobals());

      describe("light and dark", () => {
        it("starts in the scheme the system asks for", () => {
          system(true);
          expect(prefersDark()).toBe(true);
          expect(startTokens()).toBe(DARK);
          system(false);
          expect(startTokens()).toBe(LIGHT);
        });

        it("follows the system when it switches, and stops listening when gone", () => {
          const scheme = system(false);
          const { result, unmount } = renderHook(() => useScheme());
          expect(result.current).toBe("light");
          act(() => scheme.switchTo(true));
          expect(result.current).toBe("dark");
          expect(currentTokens().color.surface).toBe(DARK.color.surface);
          act(() => scheme.switchTo(false));
          expect(result.current).toBe("light");
          unmount();
          expect(scheme.listeners.size).toBe(0);
        });

        it("stays light where the browser cannot say", () => {
          vi.stubGlobal("matchMedia", undefined);
          expect(prefersDark()).toBe(false);
          const { result } = renderHook(() => useScheme());
          expect(result.current).toBe("light");
        });
      });
    src__theme.ts: |
      /**
       * Light and dark (T-3333): the SDK sets the tokens it is given and has no dark variant, so the App
       * picks the set the reader's system asks for and applies the other when the system switches.
       * The dark colours keep WCAG AA contrast on their surfaces.
       */
      import { useEffect, useState } from "react";
      import { applyTokens } from "@joinedcontext/sdk";
      import light from "./design-tokens.json";

      export const LIGHT = light;
      export const DARK = {
        ...light,
        color: {
          accent: "#93c5fd",
          ink: "#f1f5f9",
          muted: "#a3b1c6",
          surface: "#0f172a",
          card: "#1e293b",
          line: "#334155",
          danger: "#fca5a5",
          success: "#6ee7b7",
          warning: "#fcd34d",
        },
        map: { point: "#2dd4bf", selected: "#93c5fd", low: "#38bdf8", high: "#fb923c", stroke: "#0f172a" },
      };

      const QUERY = "(prefers-color-scheme: dark)";

      export function prefersDark(): boolean {
        return typeof window !== "undefined" && typeof window.matchMedia === "function" && window.matchMedia(QUERY).matches;
      }

      /** The tokens to start with. */
      export function startTokens(): typeof LIGHT {
        return prefersDark() ? DARK : LIGHT;
      }

      /** The scheme in force, kept in step with the system; a change applies the other tokens. */
      export function useScheme(): "light" | "dark" {
        const [dark, setDark] = useState(prefersDark);
        useEffect(() => {
          if (typeof window.matchMedia !== "function") return;
          const media = window.matchMedia(QUERY);
          const changed = () => {
            applyTokens(media.matches ? DARK : LIGHT);
            setDark(media.matches);
          };
          media.addEventListener("change", changed);
          return () => media.removeEventListener("change", changed);
        }, []);
        return dark ? "dark" : "light";
      }
    src__wasm.test.ts: |
      import { describe, expect, it } from "vitest";
      import wasm from "../wasm/pkg/data_quality_inspector_bg.wasm?url&inline";
      import { initSync, inspect } from "../wasm/pkg/data_quality_inspector.js";
      import { ENTITIES, NOW, ROWS_BY_TYPE, SCHEMA } from "./fixtures/quality";
      import { parseAnswer } from "./inspect";
      import type { InspectInput } from "./quality";
      import { toInput } from "./quality";

      const base64 = wasm.slice(wasm.indexOf(",") + 1);
      initSync({ module: Uint8Array.from(atob(base64), (c) => c.charCodeAt(0)) });

      describe("wasm inspect on fixtures", () => {
        const input = toInput(NOW, SCHEMA, ROWS_BY_TYPE);
        const rawAnswer = inspect(JSON.stringify(input));
        const out = parseAnswer(rawAnswer);

        it("calculates entities count for each type matching the fixture rows", () => {
          expect(ENTITIES.length).toBeGreaterThan(0);
          expect(out.types.length).toBe(Object.keys(ROWS_BY_TYPE).length);
          for (const [tName, rows] of Object.entries(ROWS_BY_TYPE)) {
            const tOut = out.types.find((t) => t.type === tName);
            expect(tOut).toBeDefined();
            expect(tOut?.entities).toBe(rows.length);
          }
        });

        it("calculates completeness as a valid ratio between 0 and 1 for all types", () => {
          for (const t of out.types) {
            expect(t.completeness).toBeGreaterThanOrEqual(0);
            expect(t.completeness).toBeLessThanOrEqual(1);
            for (const attr of t.attributes) {
              expect(attr.completeness).toBeGreaterThanOrEqual(0);
              expect(attr.completeness).toBeLessThanOrEqual(1);
            }
          }
        });

        it("computes valid share correctly: one of two Events is valid, lower for failing types, null for Vehicle", () => {
          const eventType = out.types.find((t) => t.type === "Event");
          expect(eventType).toBeDefined();
          // ev-fail carries an attribute the model does not have (additionalProperties: false).
          expect(eventType?.valid).toBe(0.5);
          expect(eventType?.findings.map((f) => [f.attribute, f.rule])).toEqual([["extraProp", "unknown"]]);

          const bikeType = out.types.find((t) => t.type === "BikeHireDockingStation");
          expect(bikeType).toBeDefined();
          expect(bikeType?.valid).not.toBeNull();
          expect(bikeType!.valid!).toBeLessThan(1.0);
          expect(bikeType!.valid!).toBeGreaterThan(0);

          const districtType = out.types.find((t) => t.type === "AdministrativeArea");
          expect(districtType).toBeDefined();
          expect(districtType?.valid).not.toBeNull();
          expect(districtType!.valid!).toBeLessThan(1.0);

          const vehicleType = out.types.find((t) => t.type === "Vehicle");
          expect(vehicleType).toBeDefined();
          expect(vehicleType?.valid).toBeNull();
          expect(vehicleType?.findings).toHaveLength(0);
        });

        it("produces findings with expected rule names and attributes for each failure type", () => {
          const bikeType = out.types.find((t) => t.type === "BikeHireDockingStation");
          expect(bikeType).toBeDefined();

          // 1. negative availableBikeNumber -> minimum
          const minFinding = bikeType?.findings.find(
            (f) => f.attribute === "availableBikeNumber" && f.rule === "minimum",
          );
          expect(minFinding).toBeDefined();
          expect(minFinding?.detail).toBe("0");

          // 2. non-integer availableBikeNumber (1.5) -> type
          const typeFinding = bikeType?.findings.find(
            (f) => f.attribute === "availableBikeNumber" && f.rule === "type",
          );
          expect(typeFinding).toBeDefined();
          expect(typeFinding?.detail).toBe("integer");

          // 3. invalid dateModified date-time -> format
          const formatFinding = bikeType?.findings.find(
            (f) => f.attribute === "dateModified" && f.rule === "format",
          );
          expect(formatFinding).toBeDefined();
          expect(formatFinding?.detail).toBe("date-time");


          // 5. location without coordinates -> required
          const reqFinding = bikeType?.findings.find(
            (f) => f.attribute === "location" && f.rule === "required",
          );
          expect(reqFinding).toBeDefined();
          expect(reqFinding?.detail).toBe("coordinates");

          // 6. districtCode with invalid pattern -> pattern
          const districtType = out.types.find((t) => t.type === "AdministrativeArea");
          expect(districtType).toBeDefined();
          const patternFinding = districtType?.findings.find(
            (f) => f.attribute === "districtCode" && f.rule === "pattern",
          );
          expect(patternFinding).toBeDefined();
          expect(patternFinding?.detail).toBe("^[0-9]{1,10}$");
        });

        it("counts $ref properties in notChecked and never fails them", () => {
          const districtType = out.types.find((t) => t.type === "AdministrativeArea");
          expect(districtType).toBeDefined();

          const divisionAttr = districtType?.attributes.find((a) => a.name === "divisionLevel");
          expect(divisionAttr).toBeDefined();
          expect(divisionAttr?.notChecked).toBeGreaterThan(0);

          const refFinding = districtType?.findings.find((f) => f.attribute === "divisionLevel");
          expect(refFinding).toBeUndefined();
        });

        it("computes freshness field and ages for types with timestamp properties, null when none", () => {
          const bikeType = out.types.find((t) => t.type === "BikeHireDockingStation");
          expect(bikeType?.freshness).not.toBeNull();
          expect(bikeType?.freshness?.field).toBe("dateModified");
          expect(typeof bikeType?.freshness?.medianSeconds).toBe("number");
          expect(bikeType!.freshness!.medianSeconds).toBeGreaterThanOrEqual(0);
          expect(bikeType!.freshness!.maxSeconds).toBeGreaterThanOrEqual(bikeType!.freshness!.medianSeconds);
          expect(bikeType!.freshness!.olderThanDay).toBeGreaterThanOrEqual(0);
          expect(bikeType!.freshness!.olderThanDay).toBeLessThanOrEqual(1);

          const vehicleType = out.types.find((t) => t.type === "Vehicle");
          expect(vehicleType?.freshness).toBeNull();

          const districtType = out.types.find((t) => t.type === "AdministrativeArea");
          expect(districtType?.freshness).toBeNull();
        });

        it("returns error JSON object when given bad JSON input, causing parseAnswer to throw", () => {
          const badJson = "not a valid json string";
          const answer = inspect(badJson);
          const parsed = JSON.parse(answer) as { error?: string };
          expect(parsed.error).toBeDefined();
          expect(parsed.error).toContain("the data could not be read");
          expect(() => parseAnswer(answer)).toThrow("the data could not be read");
        });
      });

      describe("wasm inspect isolated cases", () => {
        it("caps findings at 200 while keeping findingsTotal accurate", () => {
          const rows = Array.from({ length: 250 }, (_, i) => ({
            id: `urn:ngsi-ld:Test:${i}`,
            type: "Test",
            count: "not-an-integer",
          }));
          const input: InspectInput = {
            now: 1_700_000_000,
            types: [
              {
                type: "Test",
                schema: {
                  properties: { count: { type: "integer" } },
                },
                rows,
              },
            ],
          };

          const out = parseAnswer(inspect(JSON.stringify(input)));
          expect(out.types[0].findings).toHaveLength(200);
          expect(out.types[0].findingsTotal).toBe(250);
        });

        it("sorts types by lowest valid share first, placing no-schema types last", () => {
          const input: InspectInput = {
            now: 1_700_000_000,
            types: [
              {
                type: "Perfect",
                schema: { properties: { v: { type: "integer" } } },
                rows: [{ id: "p1", v: 10 }],
              },
              {
                type: "HalfValid",
                schema: { properties: { v: { type: "integer" } } },
                rows: [{ id: "h1", v: 10 }, { id: "h2", v: "wrong" }],
              },
              {
                type: "NoSchema",
                schema: null,
                rows: [{ id: "n1", v: 10 }],
              },
            ],
          };

          const out = parseAnswer(inspect(JSON.stringify(input)));
          expect(out.types[0].type).toBe("HalfValid");
          expect(out.types[1].type).toBe("Perfect");
          expect(out.types[2].type).toBe("NoSchema");
        });
      });
    test-setup.ts: |
      import "@testing-library/jest-dom/vitest";
      import { configure } from "@testing-library/react";
      import { afterAll } from "vitest";
      import { recordControls } from "@joinedcontext/sdk/testing";

      // jsdom has no ResizeObserver; every browser the app runs in does. The map's observer is inert here.
      class InertResizeObserver {
        observe(): void {}
        unobserve(): void {}
        disconnect(): void {}
      }
      if (!("ResizeObserver" in globalThis)) {
        Object.defineProperty(globalThis, "ResizeObserver", { value: InertResizeObserver, configurable: true });
      }

      // The Apps' coverage gate reads which controls the tests rendered and which they exercised (T-3373).
      recordControls(afterAll);

      // ci-full runs every App's suite under v8 coverage, where the library's 1 s default for
      // findBy*/waitFor gives way: a different test missed it on each run (T-4350, as ui/tests/setup.ts).
      configure({ asyncUtilTimeout: 5_000 });
