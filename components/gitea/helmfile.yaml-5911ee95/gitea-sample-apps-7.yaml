          fn output(
              name: &str,
              entities: usize,
              completeness: f64,
              valid: Option<f64>,
              findings: Vec<Finding>,
          ) -> TypeOutput {
              TypeOutput {
                  entity_type: name.into(),
                  entities,
                  completeness,
                  valid,
                  attributes: vec![],
                  findings_total: findings.len(),
