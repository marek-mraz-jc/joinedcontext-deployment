      import { apiBase, Problem, server } from "./server";

      const json = (status: number, body: unknown) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });

      describe("the App's server", () => {
        afterEach(() => vi.unstubAllGlobals());

        it("answers at /apps/{name}/api, and a name that is not an App's never builds a path", () => {
          expect(apiBase("news-topics")).toBe("/apps/news-topics/api");
          expect(apiBase(undefined)).toBe("/api");
          expect(apiBase("../x")).toBe("/api");
        });

        it("reads the weeks and a week's corpus URL, and an answer that is not a success is a Problem with its detail", async () => {
          const fetch = vi.fn(async (url: string, _init?: RequestInit) => {
            if (url === "/api/weeks") return json(200, { weeks: [], stale: false });
            if (url === "/api/weeks/2026-W41/corpus") return json(200, { url: "https://store.test/c.json" });
            if (url === "/api/weeks/2026-W40/corpus") return json(404, { title: "Not Found", detail: "the server keeps no such week" });
            return new Response("<html>", { status: 502 });
          });
          vi.stubGlobal("fetch", fetch);
          const api = server("/api");
          expect(await api.weeks()).toEqual({ weeks: [], stale: false });
          expect(fetch.mock.calls[0]?.[1]).toMatchObject({ credentials: "same-origin" });
          expect(await api.corpusUrl("2026-W41")).toBe("https://store.test/c.json");
          const refused = await api.corpusUrl("2026-W40").catch((error: unknown) => error);
          expect(refused).toBeInstanceOf(Problem);
          expect(refused).toMatchObject({ status: 404, message: "the server keeps no such week" });
          await expect(api.corpusUrl("x/../y")).rejects.toMatchObject({ status: 502, message: "HTTP 502" });
          expect(fetch.mock.calls.at(-1)?.[0]).toBe("/api/weeks/x%2F..%2Fy/corpus");
        });

        it("asks who reads, follows and names topics and reads the history (T-3828)", async () => {
          const calls: Array<[string, string, unknown]> = [];
          vi.stubGlobal(
            "fetch",
            vi.fn(async (url: string, init?: RequestInit) => {
              const method = init?.method ?? "GET";
              const body = init?.body ? JSON.parse(String(init.body)) : undefined;
              calls.push([method, url, body]);
              if (method === "DELETE") return new Response(null, { status: 204 });
              if (url.endsWith("/me")) return json(200, null);
              if (method === "POST") return json(201, { id: 3, ownerName: "Sara", ...body });
              return json(200, []);
            }),
          );
          const api = server("/api");
          expect(await api.me()).toBeNull();
          expect(await api.follows()).toEqual([]);
          expect(await api.follow("kirjasto")).toEqual({ id: 3, ownerName: "Sara", term: "kirjasto" });
          expect(await api.unfollow(3)).toBeUndefined();
          expect(await api.names()).toEqual([]);
          expect(await api.name("kirjasto", "Libraries")).toMatchObject({ id: 3, term: "kirjasto", name: "Libraries" });
          expect(await api.unname(3)).toBeUndefined();
          expect(await api.changes()).toEqual([]);
          expect(calls).toEqual([
            ["GET", "/api/me", undefined],
            ["GET", "/api/follows", undefined],
            ["POST", "/api/follows", { term: "kirjasto" }],
            ["DELETE", "/api/follows/3", undefined],
            ["GET", "/api/names", undefined],
            ["POST", "/api/names", { term: "kirjasto", name: "Libraries" }],
            ["DELETE", "/api/names/3", undefined],
            ["GET", "/api/history", undefined],
          ]);
        });
      });
    src__server.ts: |
      /**
       * The App's server on the shared WASM host, `/apps/{name}/api` (T-3352): the topics of every
       * week it has kept, and a URL for each week's articles as a file in the App's own storage. A
       * reader follows topics by their top keyword; a steward names and merges topics, which everyone
       * reads (T-3828). A test hands the page its own server (`ServerContext`).
       */
      import { createContext, useContext, useMemo } from "react";

      export interface KeptKeyword {
        term: string;
        weight: number;
      }

      export interface KeptTopic {
        topic: number;
        share: number;
        articles: number;
        keywords: KeptKeyword[];
      }

      export interface KeptWeek {
        /** The ISO week, `2026-W41`. */
        week: string;
        articles: number;
        computed_at: string;
        topics: KeptTopic[];
      }

      export interface Kept {
        weeks: KeptWeek[];
        /** The feed could not be read just now: these are the weeks as last kept. */
        stale: boolean;
      }

      /** Who is signed in, as the App's server knows them. */
      export interface Me {
        id: string;
        name: string;
        roles: string[];
      }

      /** A keyword the reader follows: a topic, found again by its top keyword. */
      export interface Follow {
        id: number;
        term: string;
      }

      /** A steward's name for the topic of a top keyword. */
      export interface TopicName {
        id: number;
        term: string;
        name: string;
        ownerName: string;
      }

      /** One line of the App's history (`app_audit`). */
      export interface Change {
        id: number;
        at: string;
        actorName: string;
        action: "insert" | "update" | "delete" | "edit";
        target: string;
        summary: string;
      }

      /** An answer of the server that is not a success, its `detail` as the message. */
      export class Problem extends Error {
        constructor(
          readonly status: number,
          detail: string,
        ) {
          super(detail);
        }
      }

      export interface Server {
        weeks(): Promise<Kept>;
        /** A URL the week's articles can be downloaded from for two minutes. */
        corpusUrl(week: string): Promise<string>;
        /** Who is signed in; `null` when nobody is. */
        me(): Promise<Me | null>;
        /** The reader's followed keywords, newest first. */
        follows(): Promise<Follow[]>;
        follow(term: string): Promise<Follow>;
        unfollow(id: number): Promise<void>;
        /** Every topic name a steward gave. */
        names(): Promise<TopicName[]>;
        /** Names, or renames, the topic of `term`. */
        name(term: string, name: string): Promise<TopicName>;
        unname(id: number): Promise<void>;
        /** The newest changes: a steward's everyone's, anyone else's their own. */
        changes(): Promise<Change[]>;
      }

      /** Where the server answers: `/apps/{appName}/api`, or `/api` when the name is not an App's. */
      export function apiBase(appName: string | undefined): string {
        return appName && /^[a-z0-9-]+$/.test(appName) ? `/apps/${appName}/api` : "/api";
      }

      async function get<T>(url: string, method = "GET", body?: unknown): Promise<T> {
        const answer = await fetch(url, {
          method,
          credentials: "same-origin",
          headers: body === undefined ? { Accept: "application/json" } : { Accept: "application/json", "Content-Type": "application/json" },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        if (!answer.ok) {
          const problem = (await answer.json().catch(() => ({}))) as { detail?: unknown };
          throw new Problem(answer.status, typeof problem.detail === "string" ? problem.detail : `HTTP ${answer.status}`);
        }
        return (answer.status === 204 ? undefined : await answer.json()) as T;
      }

      export function server(base: string): Server {
        return {
          weeks: () => get<Kept>(`${base}/weeks`),
          corpusUrl: async (week) => (await get<{ url: string }>(`${base}/weeks/${encodeURIComponent(week)}/corpus`)).url,
          me: () => get<Me | null>(`${base}/me`),
          follows: () => get<Follow[]>(`${base}/follows`),
          follow: (term) => get<Follow>(`${base}/follows`, "POST", { term }),
          unfollow: (id) => get<void>(`${base}/follows/${id}`, "DELETE"),
          names: () => get<TopicName[]>(`${base}/names`),
          name: (term, name) => get<TopicName>(`${base}/names`, "POST", { term, name }),
          unname: (id) => get<void>(`${base}/names/${id}`, "DELETE"),
          changes: () => get<Change[]>(`${base}/history`),
        };
      }

      /** The server the page talks to; `null` takes the App's own, from its name. */
      export const ServerContext = createContext<Server | null>(null);

      export function useServer(appName: string | undefined): Server {
        const given = useContext(ServerContext);
        return useMemo(() => given ?? server(apiBase(appName)), [given, appName]);
      }
    src__testing__server.ts: |
      /**
       * The App's server in memory (T-3828), deciding as the real one does: follows are the signed-in
       * reader's own, only a steward names topics, and the history shows a steward everyone's changes
       * and anyone else their own.
       */
      import { Problem } from "../server";
      import type { Change, Follow, Kept, Me, Server, TopicName } from "../server";

      export const VIEWER: Me = { id: "u-viewer", name: "Vera Viewer", roles: ["viewer"] };
      export const STEWARD: Me = { id: "u-steward", name: "Sara Steward", roles: ["steward", "viewer"] };

      export interface Memory extends Server {
        /** Who calls; `null` is signed out. */
        who: Me | null;
        kept: Kept;
        followed: Array<Follow & { owner: string }>;
        given: TopicName[];
        audit: Array<Change & { actorId: string }>;
        /** Names a method that fails with this text, as a refused or broken call would. */
        fail: Partial<Record<keyof Server, string>>;
      }

      export function memory(who: Me | null = null): Memory {
        let next = 1;
        const signedIn = () => {
          if (!mem.who) throw new Problem(401, "sign in first");
          return mem.who;
        };
        const steward = () => {
          const me = signedIn();
          if (!me.roles.includes("steward")) throw new Problem(403, "a steward names topics");
          return me;
        };
        const failing = (name: keyof Server) => {
          if (mem.fail[name]) throw new Problem(503, mem.fail[name]!);
        };
        const log = (actor: Me, action: Change["action"], target: string, summary: string) =>
