      import { useCallback, useEffect, useState } from "react";
      import { Card, Empty, Loading } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { formatDate, t } from "../i18n";
      import type { Lang } from "../i18n";
      import type { Change, Server } from "../server";

      /** The App's history, from its `app_audit` table: a viewer's own changes, a steward's everyone's. */
      export function Changes({ lang, api }: { lang: Lang; api: Server }) {
        const { me, steward } = useAccess();
        const [rows, setRows] = useState<Change[] | null>(null);
        const [failed, setFailed] = useState<string | null>(null);

        const load = useCallback(async () => {
          setFailed(null);
          try {
            setRows(await api.changes());
          } catch (error) {
            setRows([]);
            // The server and fetch fail with an Error each.
            setFailed((error as Error).message);
          }
        }, [api, lang]);

        useEffect(() => {
          if (me) void load();
        }, [me, load]);

        if (me === null)
          return (
            <Card title={t("changesTitle", lang)}>
              <Empty>{t("changesSignIn", lang)}</Empty>
            </Card>
          );
        return (
          <Card title={t("changesTitle", lang)}>
            <p className="app-note">{t(steward ? "changesAll" : "changesMine", lang)}</p>
            <button type="button" className="jc-button" disabled={rows === null} onClick={() => void load()}>
              {t("refresh", lang)}
            </button>
            {failed && <p className="jc-problem" role="alert">{t("changesFailed", lang, { reason: failed })}</p>}
            {rows === null ? (
              <Loading label={t("changesLoading", lang)} />
            ) : rows.length === 0 ? (
              failed ? null : <Empty>{t("changesEmpty", lang)}</Empty>
            ) : (
              <table className="app-history">
                <caption className="app-sr-only">{t("changesTitle", lang)}</caption>
                <thead>
                  <tr>
                    <th scope="col">{t("when", lang)}</th>
                    <th scope="col">{t("who", lang)}</th>
                    <th scope="col">{t("what", lang)}</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((row) => (
                    <tr key={row.id}>
                      <td>{formatDate(row.at, lang)}</td>
                      <td>{row.actorName}</td>
                      <td>
                        {t(row.action, lang)}: {row.summary}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </Card>
        );
      }
    src__components__ChartCard.test.tsx: |
      import { render, screen } from "@testing-library/react";
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { ProblemError } from "@joinedcontext/sdk";
      import { ChartCard } from "./ChartCard";

      const charts: Array<{ setOption: ReturnType<typeof vi.fn>; resize: ReturnType<typeof vi.fn>; dispose: ReturnType<typeof vi.fn> }> = [];
      vi.mock("echarts", () => ({
        init: vi.fn(() => {
          const chart = { setOption: vi.fn(), resize: vi.fn(), dispose: vi.fn() };
          charts.push(chart);
          return chart;
        }),
      }));

      describe("ChartCard", () => {
        afterEach(() => {
          charts.length = 0;
          vi.unstubAllGlobals();
        });

        it("says what went wrong, that it is reading, or that there is nothing to chart, in place of the chart", () => {
          const view = render(<ChartCard title="Share" option={{}} error={new ProblemError(503, { title: "Unavailable" })} />);
          // A one-word title is a code, not a sentence: the SDK says what failed instead (T-4200).
          expect(screen.getByRole("alert")).toHaveTextContent("The data could not be read. Try again later.");
          view.rerender(<ChartCard title="Share" option={{}} loading />);
          expect(screen.getByRole("status")).toBeInTheDocument();
          view.rerender(<ChartCard title="Share" option={null} />);
          expect(screen.getByText("Nothing to chart yet.")).toBeInTheDocument();
          view.rerender(<ChartCard title="Share" option={null} empty="No week to show." />);
          expect(screen.getByText("No week to show.")).toBeInTheDocument();
          expect(charts).toEqual([]);
        });

        it("draws the option, follows the size of its box, and lets the chart go with it", () => {
          let resized: () => void = () => undefined;
          vi.stubGlobal(
            "ResizeObserver",
            class {
              constructor(callback: () => void) {
                resized = callback;
              }
              observe() {}
              disconnect() {}
            },
          );
          const view = render(<ChartCard title="Share" option={{ series: [] }} />);
          expect(screen.getByRole("img", { name: "Share" })).toBeInTheDocument();
          expect(charts[0].setOption).toHaveBeenCalledWith({ series: [] }, true);
          resized();
          expect(charts[0].resize).toHaveBeenCalledTimes(1);
          view.unmount();
          expect(charts[0].dispose).toHaveBeenCalled();
        });

        it("draws without a ResizeObserver too", () => {
          vi.stubGlobal("ResizeObserver", undefined);
          render(<ChartCard title="Share" option={{ series: [] }} />);
          expect(charts[0].setOption).toHaveBeenCalled();
        });
      });
    src__components__ChartCard.tsx: |
      import type { ReactNode } from "react";
      import { useEffect, useRef } from "react";
      import * as echarts from "echarts";
      import { currentTokens, echartsTheme } from "@joinedcontext/sdk";
      import type { ProblemError } from "@joinedcontext/sdk";
      import { Empty, Loading, Problem } from "@joinedcontext/sdk";

      /** One ECharts chart with a caption, in the SDK's theme; the loading, error and empty states in its place. */
      export function ChartCard({
        title,
        option,
        height = 280,
        loading,
        error,
        empty,
      }: {
        title: string;
        option: Record<string, unknown> | null;
        height?: number;
        loading?: boolean;
        error?: ProblemError | Error | null;
        empty?: ReactNode;
      }): React.JSX.Element {
        const containerRef = useRef<HTMLDivElement | null>(null);
        const chartRef = useRef<echarts.ECharts | null>(null);
        const showCanvas = !error && !loading && option !== null;

        useEffect(() => {
          const el = containerRef.current;
          if (!showCanvas || !el) return;
          const chart = echarts.init(el, echartsTheme(currentTokens()), { renderer: "canvas" });
          chartRef.current = chart;
          const observer = typeof ResizeObserver === "undefined" ? undefined : new ResizeObserver(() => chart.resize());
          observer?.observe(el);
          return () => {
            observer?.disconnect();
            chart.dispose();
            chartRef.current = null;
          };
        }, [showCanvas]);

        useEffect(() => {
          if (chartRef.current && option) chartRef.current.setOption(option, true);
        }, [option, showCanvas]);

        return (
          <figure className="jc-chart">
            <figcaption>{title}</figcaption>
            {error ? (
              <Problem error={error} />
            ) : loading ? (
              <Loading />
            ) : option === null ? (
              <Empty>{empty ?? "Nothing to chart yet."}</Empty>
            ) : (
              <div className="jc-chart-canvas" role="img" aria-label={title} style={{ height }} ref={containerRef} />
            )}
          </figure>
        );
      }
    src__components__Follows.tsx: |
      import { useEffect, useState } from "react";
      import { Card, Empty, Loading } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { t } from "../i18n";
      import type { Lang } from "../i18n";
      import type { Follow, Server } from "../server";

      // The server and fetch fail with an Error each.
      const reason = (error: unknown) => (error as Error).message;

      export interface Follows {
        follows: Follow[];
        ready: boolean;
        failed: string | null;
        said: { text: string; problem: boolean } | null;
        /** Follows `term`, or stops following it; shown at once, taken back when refused. */
        toggle(term: string, lang: Lang): Promise<void>;
      }

      /** The signed-in reader's followed keywords, read once they are known. */
      export function useFollows(server: Server): Follows {
        const { me } = useAccess();
        const [follows, setFollows] = useState<Follow[]>([]);
        const [ready, setReady] = useState(false);
        const [failed, setFailed] = useState<string | null>(null);
        const [said, setSaid] = useState<Follows["said"]>(null);

        useEffect(() => {
          if (!me) return;
          let gone = false;
          server
            .follows()
            .then(
              (answer) => !gone && setFollows(answer),
              (error: unknown) => !gone && setFailed(reason(error)),
            )
            .finally(() => setReady(true));
          return () => {
            gone = true;
          };
        }, [server, me]);

        const toggle = async (term: string, lang: Lang) => {
          const kept = follows.find((follow) => follow.term === term);
          setSaid(null);
          if (kept) {
            setFollows((current) => current.filter((follow) => follow.id !== kept.id));
            try {
              await server.unfollow(kept.id);
              setSaid({ text: t("stoppedFollowing", lang, { name: term }), problem: false });
            } catch (error) {
              setFollows((current) => [kept, ...current]);
              setSaid({ text: t("refused", lang, { reason: reason(error) }), problem: true });
            }
            return;
          }
          const draft: Follow = { id: -Date.now(), term };
          setFollows((current) => [draft, ...current]);
          try {
            const made = await server.follow(term);
            setFollows((current) => current.map((follow) => (follow.id === draft.id ? made : follow)));
            setSaid({ text: t("startedFollowing", lang, { name: term }), problem: false });
          } catch (error) {
            setFollows((current) => current.filter((follow) => follow.id !== draft.id));
            setSaid({ text: t("refused", lang, { reason: reason(error) }), problem: true });
          }
        };

        return { follows, ready, failed, said, toggle };
      }

      /** The followed topics, each said to be among the period's topics or not, and let go of here. */
      export function FollowedCard({ lang, state, present }: { lang: Lang; state: Follows; present: (term: string) => boolean }) {
        const { me } = useAccess();
        return (
          <Card title={t("followed", lang)}>
            <p className="app-note">{t("followedNote", lang)}</p>
            {state.said && (
              <p className={state.said.problem ? "jc-problem" : "app-note"} role={state.said.problem ? "alert" : "status"}>
                {state.said.text}
              </p>
            )}
            {state.failed && (
              <p className="jc-problem" role="alert">
                {t("followedFailed", lang, { reason: state.failed })}
              </p>
            )}
            {me === null ? (
              <Empty>{t("followSignIn", lang)}</Empty>
            ) : !state.ready ? (
              <Loading label={t("reading", lang)} />
            ) : state.follows.length === 0 ? (
              state.failed ? null : <Empty>{t("followedNone", lang)}</Empty>
            ) : (
              <ul className="app-list" aria-label={t("followed", lang)}>
                {state.follows.map((follow) => (
                  <li key={follow.id}>
                    <strong>{follow.term}</strong>
                    <span className="app-note">{t(present(follow.term) ? "followedNow" : "followedNotNow", lang)}</span>
                    <button
                      type="button"
                      className="jc-button"
                      disabled={follow.id < 0}
                      aria-label={t("unfollow", lang, { name: follow.term })}
                      onClick={() => void state.toggle(follow.term, lang)}
                    >
                      ×
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </Card>
        );
      }
    src__components__KeptWeeks.test.tsx: |
      import { fireEvent, render, screen, waitFor, within } from "@testing-library/react";
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { KeptWeeks } from "./KeptWeeks";
      import { Problem } from "../server";
      import type { Kept, Server } from "../server";
      import { memory } from "../testing/server";

      const KEPT: Kept = {
        weeks: [
          {
            week: "2026-W42",
            articles: 3,
            computed_at: "2026-10-12T10:00:00Z",
            topics: [
              { topic: 0, share: 2 / 3, articles: 2, keywords: [{ term: "raitiotie", weight: 0.9 }, { term: "liikenne", weight: 0.7 }, { term: "ratikka", weight: 0.5 }, { term: "katu", weight: 0.1 }] },
              { topic: 1, share: 1 / 3, articles: 1, keywords: [{ term: "kirjasto", weight: 0.8 }] },
            ],
          },
          { week: "2026-W41", articles: 0, computed_at: "2026-10-12T10:00:00Z", topics: [] },
        ],
        stale: true,
      };

      function serverOf(kept: Kept | Error, corpus: string | Error = "https://store.test/corpus/2026-W42.json"): Server {
        return {
          ...memory(),
          weeks: async () => {
            if (kept instanceof Error) throw kept;
            return kept;
          },
          corpusUrl: async () => {
            if (corpus instanceof Error) throw corpus;
            return corpus;
          },
        };
      }

      describe("the weeks the server keeps", () => {
        afterEach(() => vi.restoreAllMocks());

        it("lists each week's topics by their keywords, the newest first, says they are as last kept, and opens a week's articles", async () => {
          const open = vi.spyOn(window, "open").mockReturnValue(null);
          render(<KeptWeeks lang="en" server={serverOf(KEPT)} />);
          const table = await screen.findByRole("table", { name: "Topics week by week" });
          expect(within(table).getAllByRole("row").map((row) => row.textContent)).toEqual([
            "WeekArticlesTopics, the largest firstArticles as a file",
            "2026-W423raitiotie, liikenne, ratikka (67%); kirjasto (33%)Articles as a file",
            "2026-W410–Articles as a file",
          ]);
          expect(screen.getByText("The feed could not be read just now: these are the weeks as last kept.")).toBeInTheDocument();
          expect(screen.getByRole("region", { name: "Topics week by week" })).toHaveAttribute("tabindex", "0");
          fireEvent.click(screen.getByRole("button", { name: "Download the articles of week 2026-W42" }));
          await waitFor(() => expect(open).toHaveBeenCalledWith("https://store.test/corpus/2026-W42.json", "_blank", "noopener"));
        });

        it("says in Finnish when a week's articles cannot be downloaded", async () => {
          render(<KeptWeeks lang="fi" server={serverOf(KEPT, new Problem(404, "the server keeps no such week"))} />);
          fireEvent.click(await screen.findByRole("button", { name: "Lataa viikon artikkelit 2026-W42" }));
          expect(await screen.findByRole("alert")).toHaveTextContent("Viikon artikkeleita ei voitu ladata: the server keeps no such week");
        });

        it("says when nothing is kept yet, and when the weeks cannot be read", async () => {
          const { unmount } = render(<KeptWeeks lang="en" server={serverOf({ weeks: [], stale: false })} />);
          expect(screen.getByText("Reading the kept weeks…")).toBeInTheDocument();
          expect(await screen.findByText("The server has not kept any week yet.")).toBeInTheDocument();
          unmount();
          render(<KeptWeeks lang="en" server={serverOf(new Problem(502, "the gateway could not answer right now; try again shortly (502)"))} />);
          expect(await screen.findByRole("alert")).toHaveTextContent("The kept weeks could not be read: the gateway could not answer right now; try again shortly (502)");
        });
      });
    src__components__KeptWeeks.tsx: |
      import { useEffect, useState } from "react";
      import { Card, Empty } from "@joinedcontext/sdk";
      import { formatPercent, t } from "../i18n";
      import type { Lang } from "../i18n";
      import type { Kept, KeptWeek, Server } from "../server";

      const reason = (error: unknown) => (error instanceof Error ? error.message : String(error));

      /** A week's topics in words: the three strongest keywords of each, with its share. */
      function topicsOf(week: KeptWeek, lang: Lang): string {
        return week.topics
          .map((topic) => `${topic.keywords.slice(0, 3).map((k) => k.term).join(", ")} (${formatPercent(topic.share, lang, 0)})`)
          .join("; ");
      }

      /**
       * The topics of every week the App's server has kept (T-3352), the newest first, each week's
       * articles downloadable as a file: the feed holds only its recent articles, the server keeps
       * each week's topics after the feed has dropped them.
       */
      export function KeptWeeks({ lang, server }: { lang: Lang; server: Server }) {
        const [kept, setKept] = useState<Kept | null>(null);
        const [failed, setFailed] = useState<string | null>(null);
        const [download, setDownload] = useState<string | null>(null);

        useEffect(() => {
          let gone = false;
          server.weeks().then(
            (answer) => !gone && setKept(answer),
            (error: unknown) => !gone && setFailed(reason(error)),
          );
          return () => {
            gone = true;
          };
        }, [server]);

        const corpus = async (week: string) => {
          setDownload(null);
          try {
            window.open(await server.corpusUrl(week), "_blank", "noopener");
          } catch (error) {
            setDownload(`${t("corpusFailed", lang)} ${reason(error)}`);
          }
        };

        return (
          <Card title={t("kept", lang)}>
            <p className="app-note">{t("keptNote", lang)}</p>
            {download && (
              <p className="jc-problem" role="alert">
                {download}
              </p>
            )}
            {failed ? (
              <p className="jc-problem" role="alert">
                {t("keptFailed", lang)} {failed}
              </p>
            ) : !kept ? (
              <p className="app-note">{t("keptReading", lang)}</p>
            ) : kept.weeks.length === 0 ? (
              <Empty>{t("keptEmpty", lang)}</Empty>
            ) : (
              <>
                {kept.stale && <p className="app-note">{t("keptStale", lang)}</p>}
                {/* Scrolls sideways on a phone: a keyboard reaches it as a named region (WCAG 2.1.1). */}
                <div className="jc-table-wrap" tabIndex={0} role="region" aria-label={t("keptTable", lang)}>
                  <table className="jc-table" aria-label={t("keptTable", lang)}>
                    <thead>
                      <tr>
                        <th scope="col">{t("week", lang)}</th>
                        <th scope="col">{t("keptArticles", lang)}</th>
                        <th scope="col">{t("keptTopics", lang)}</th>
                        <th scope="col">{t("corpus", lang)}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {kept.weeks.map((week) => (
                        <tr key={week.week}>
                          <th scope="row">{week.week}</th>
                          <td className="jc-num">{week.articles}</td>
                          <td>{topicsOf(week, lang) || "–"}</td>
                          <td>
                            <button type="button" className="jc-button" aria-label={`${t("corpusOf", lang)} ${week.week}`} onClick={() => void corpus(week.week)}>
                              {t("corpus", lang)}
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </>
            )}
          </Card>
        );
      }
    src__components__Names.tsx: |
      import { useCallback, useEffect, useMemo, useState } from "react";
      import type { FormEvent } from "react";
      import { Card, Empty } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { t } from "../i18n";
      import type { Lang } from "../i18n";
      import type { Server, TopicName } from "../server";
      import { topTerm } from "../topics";
      import type { Topic } from "../topics";

      // The server and fetch fail with an Error each.
      const reason = (error: unknown) => (error as Error).message;

      export interface Names {
        names: TopicName[];
        failed: string | null;
        /** A steward's name for the topic of `term`, if it has one. */
        nameOf(term: string): string | undefined;
        /** Names the topic of `term`; shown at once, the old name back when refused. Throws the refusal. */
        give(term: string, name: string, owner: string): Promise<void>;
        /** Takes a name back; shown at once, back when refused. Throws the refusal. */
        takeBack(entry: TopicName): Promise<void>;
      }

      /** The topic names everyone reads, read once. */
      export function useNames(server: Server): Names {
        const [names, setNames] = useState<TopicName[]>([]);
        const [failed, setFailed] = useState<string | null>(null);

        useEffect(() => {
          let gone = false;
          server.names().then(
            (answer) => !gone && setNames(answer),
            (error: unknown) => !gone && setFailed(reason(error)),
          );
          return () => {
            gone = true;
          };
        }, [server]);

        const byTerm = useMemo(() => new Map(names.map((entry) => [entry.term, entry.name])), [names]);
        const nameOf = useCallback((term: string) => byTerm.get(term), [byTerm]);

        const give = async (term: string, name: string, owner: string) => {
          const before = names.find((entry) => entry.term === term);
          const draft: TopicName = { id: before?.id ?? -Date.now(), term, name, ownerName: owner };
          setNames((current) => [...current.filter((entry) => entry.term !== term), draft]);
          try {
            const made = await server.name(term, name);
            setNames((current) => current.map((entry) => (entry.term === term ? made : entry)));
          } catch (error) {
            setNames((current) => [...current.filter((entry) => entry.term !== term), ...(before ? [before] : [])]);
            throw error;
          }
        };

        const takeBack = async (entry: TopicName) => {
          setNames((current) => current.filter((other) => other.id !== entry.id));
          try {
            await server.unname(entry.id);
          } catch (error) {
            setNames((current) => [...current, entry]);
            throw error;
          }
        };

        return { names, failed, nameOf, give, takeBack };
      }

      /**
       * A steward names the selected topic, or merges it with another by giving both one name: the
       * other's name, else its keywords. Everyone reads the names given; a viewer's controls stay
       * closed with the reason.
       */
      export function NamesCard({
        lang,
        state,
        selected,
        topics,
        labelOf,
      }: {
        lang: Lang;
        state: Names;
        selected: Topic | null;
        topics: Topic[];
        labelOf: (topic: Topic) => string;
      }) {
        const { me, steward } = useAccess();
        const [draft, setDraft] = useState("");
        const [into, setInto] = useState("");
        const [said, setSaid] = useState<{ text: string; problem: boolean } | null>(null);
        const why = steward ? undefined : t(me ? "stewardOnly" : "stewardSignIn", lang);
        const owner = me?.name ?? "";
        const others = topics.filter((topic) => topic.id !== selected?.id);

        const run = async (work: () => Promise<void>, done: string) => {
          setSaid(null);
          try {
            await work();
            setSaid({ text: done, problem: false });
          } catch (error) {
            setSaid({ text: t("refused", lang, { reason: reason(error) }), problem: true });
          }
        };

        const name = (event: FormEvent) => {
          event.preventDefault();
          const named = draft.trim();
          if (!selected || !named || named.length > 80) {
            setSaid({ text: t("nameNeeded", lang), problem: true });
            return;
          }
          setDraft("");
          void run(() => state.give(topTerm(selected), named, owner), t("named", lang, { name: named }));
        };

        const merge = (event: FormEvent) => {
          event.preventDefault();
          const target = others.find((topic) => String(topic.id) === into) ?? others[0];
          if (!selected || !target) return;
          const shared =
            state.nameOf(topTerm(target)) ??
            target.keywords
              .slice(0, 3)
              .map((keyword) => keyword.term)
              .join(", ");
          void run(async () => {
            if (!state.nameOf(topTerm(target))) await state.give(topTerm(target), shared, owner);
            await state.give(topTerm(selected), shared, owner);
          }, t("merged", lang, { name: shared }));
        };

        return (
          <Card title={t("names", lang)}>
            <p className="app-note">{t("namesNote", lang)}</p>
            {said && (
              <p className={said.problem ? "jc-problem" : "app-note"} role={said.problem ? "alert" : "status"}>
                {said.text}
              </p>
            )}
            {state.failed && (
              <p className="jc-problem" role="alert">
                {t("namesFailed", lang, { reason: state.failed })}
              </p>
            )}
            {selected && (
              <>
                <form className="app-filters" onSubmit={name}>
                  <label>
                    <span>{t("nameOf", lang)}</span>
                    <input value={draft} maxLength={80} disabled={!steward} title={why} onChange={(event) => setDraft(event.target.value)} />
                  </label>
                  <button type="submit" className="jc-button" disabled={!steward} title={why}>
                    {t("nameTopic", lang)}
                  </button>
                </form>
                {others.length > 0 && (
                  <form className="app-filters" onSubmit={merge}>
                    <label>
                      <span>{t("mergeWith", lang)}</span>
                      <select value={into} disabled={!steward} title={why} onChange={(event) => setInto(event.target.value)}>
                        {others.map((topic) => (
                          <option key={topic.id} value={topic.id}>
                            {labelOf(topic)}
                          </option>
                        ))}
                      </select>
                    </label>
                    <button type="submit" className="jc-button" disabled={!steward} title={why}>
                      {t("merge", lang)}
                    </button>
                  </form>
                )}
              </>
            )}
            {state.names.length === 0 ? (
              state.failed ? null : <Empty>{t("namesNone", lang)}</Empty>
            ) : (
              <ul className="app-list" aria-label={t("names", lang)}>
                {state.names.map((entry) => (
                  <li key={entry.term}>
                    <span>{t("nameLine", lang, { term: entry.term, name: entry.name, who: entry.ownerName })}</span>
                    <button
                      type="button"
                      className="jc-button"
                      disabled={!steward || entry.id < 0}
                      title={why}
                      aria-label={t("unname", lang, { term: entry.term })}
                      onClick={() => void run(() => state.takeBack(entry), t("unnamed", lang, { name: entry.name }))}
                    >
                      ×
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </Card>
        );
      }
    src__components__components.css: |
      /* The components' classes, over the token variables the SDK sets from design-tokens.json. Phone
         first (T-2777, UI-84): each view works from 375 px up, and widens by the room it is given. */

      /* The page is the app: no margin around the shell, so a framed app has one scrollbar, the frame's. */
      body {
        margin: 0;
      }

      .jc-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: var(--jc-font-body, "Inter", system-ui, -apple-system, "Segoe UI", sans-serif);
        color: var(--jc-color-ink, #0f172a);
        background: var(--jc-color-surface, #ffffff);
        font-size: var(--jc-font-size-md, 0.875rem);
        line-height: 1.5;
      }

      .jc-shell *, .jc-shell *::before, .jc-shell *::after {
        box-sizing: border-box;
      }

      .jc-header {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-header h1 {
        margin: 0;
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
      }

      /* Many pages scroll sideways on a phone rather than pushing the page wider than the screen. */
      .jc-header nav {
        display: flex;
        gap: var(--jc-space-1, 0.25rem);
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .jc-header nav button {
        all: unset;
        flex: none;
        cursor: pointer;
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 2px solid transparent;
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-header nav button[aria-current="page"] {
        color: var(--jc-color-accent, #0f766e);
        border-bottom-color: var(--jc-color-accent, #0f766e);
      }

      .jc-user {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-main {
        flex: 1;
        padding: var(--jc-space-4, 1rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--jc-space-4, 1rem);
        align-content: start;
      }

      .jc-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: var(--jc-space-3, 0.75rem);
      }

      .jc-tile {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-tile-label {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-tile-value {
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-table-wrap {
        container-type: inline-size;
        overflow-x: auto;
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
        background: var(--jc-color-surface, #ffffff);
      }

      .jc-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      .jc-table th {
        position: sticky;
        top: 0;
        background: var(--jc-color-card, #f8fafc);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        font-size: var(--jc-font-size-sm, 0.75rem);
        font-weight: 600;
      }

      .jc-table th button {
        all: unset;
        cursor: pointer;
        font: inherit;
        color: inherit;
        display: inline-flex;
        align-items: center;
        gap: var(--jc-space-1, 0.25rem);
