          }
          // The search narrows the station list, and the list picks the station.
          fireEvent.change(screen.getByRole("searchbox", { name: search }), { target: { value: String(STATION_3.name).slice(0, 4) } });
          const list = screen.getByRole("combobox", { name: station });
          expect(within(list).getAllByRole("option").map((option) => (option as HTMLOptionElement).value)).toContain(STATION_3.id);
          fireEvent.change(list, { target: { value: STATION_3.id } });
          expect(decodeURIComponent(window.location.hash)).toContain(STATION_3.id);
          // The Details button follows the chosen station.
          fireEvent.click(await screen.findByRole("button", { name: `${details}: ${STATION_3.name}` }));
          fireEvent.click(within(await screen.findByRole("dialog")).getByRole("button", { name: close }));
          // And the shell's language switch turns the page to the other language in place.
          const other = lang === "en" ? "fi" : "en";
          fireEvent.change(screen.getByRole("combobox", { name: lang === "en" ? "Language" : "Kieli" }), { target: { value: other } });
          expect(new URLSearchParams(window.location.search).get("lang")).toBe(other);
        });

        it("picks a station clicked on the map and opens it in the panel", async () => {
          show();
          await screen.findByRole("combobox", { name: "Station" });
          await waitFor(() => expect(map.click).not.toBeNull());
          act(() => map.click!({ features: [{ properties: { id: STATION_2.id } }] }));
          expect(await screen.findByRole("dialog", { name: String(STATION_2.name) })).toBeInTheDocument();
          expect(screen.getByRole("combobox", { name: "Station" })).toHaveValue(STATION_2.id);
          fireEvent.click(within(screen.getByRole("dialog")).getByRole("button", { name: "Close" }));
          fireEvent.click(await screen.findByRole("button", { name: `Details: ${STATION_2.name}` }));
          expect(await screen.findByRole("dialog", { name: String(STATION_2.name) })).toBeInTheDocument();
        });
      });
    src__App.tsx: |
      import { useState } from "react";
      import { AppShell, useClient } from "@joinedcontext/sdk";
      import type { ShellPage } from "@joinedcontext/sdk";
      import { AccessProvider, useAccess } from "./access";
      import { History } from "./components/History";
      import { langOf, t } from "./i18n";
      import type { Lang } from "./i18n";
      import { Station } from "./pages/Station";
      import { useServer } from "./server";
      import type { Server } from "./server";
      import { useScheme } from "./theme";

      const LANGUAGES = [
        { code: "fi", label: "Suomi" },
        { code: "en", label: "English" },
        { code: "sv", label: "Svenska" },
      ];

      /** Who reads the page, in the shell's header: their role, or that they are signed out. */
      export function RoleBadge({ lang }: { lang: Lang }) {
        const { me, steward } = useAccess();
        if (me === undefined) return null;
        const role = me === null ? t(lang, "signedOut") : t(lang, steward ? "roleSteward" : "roleViewer");
        return (
          <span className="app-role" aria-label={`${t(lang, "roleLabel")}: ${role}`}>
            {role}
          </span>
        );
      }

      function Shell({ server }: { server: Server }) {
        const { me } = useAccess();
        const [lang, setLang] = useState<Lang>(() =>
          langOf(window.location.search, navigator.languages ?? [navigator.language]),
        );

        const switchTo = (next: string) => {
          if (next !== "fi" && next !== "en" && next !== "sv") return;
          setLang(next);
          document.documentElement.lang = next;
          document.title = t(next, "title");
          try {
            const params = new URLSearchParams(window.location.search);
            params.set("lang", next);
            window.history.replaceState(null, "", `${window.location.pathname}?${params}${window.location.hash}`);
          } catch {
            // sandboxed preview may refuse
          }
        };

        document.documentElement.lang = lang;
        document.title = t(lang, "title");
        const scheme = useScheme();

        const pages: ShellPage[] = [
          {
            id: "station",
            label: t(lang, "page"),
            render: () => <Station key={scheme} lang={lang} />,
          },
          { id: "history", label: t(lang, "historyPage"), render: () => <History lang={lang} api={server} /> },
        ];

        return (
          <AppShell
            title={t(lang, "title")}
            pages={pages}
            languages={LANGUAGES}
            language={lang}
            onLanguage={switchTo}
            userName={me?.name}
            actions={<RoleBadge lang={lang} />}
          />
        );
      }

      /**
       * Bikes and the weather: availability and 6-hour forecast by station and weather, in the SDK's
       * shell (SDK-39). Everyone reads a station's model and its inputs; a steward tunes them (T-3827).
       */
      export default function App(): React.JSX.Element {
        const client = useClient();
        const server = useServer(client.config.appName);
        return (
          <AccessProvider api={server}>
            <Shell server={server} />
          </AccessProvider>
        );
      }
    src__access.tsx: |
      import { createContext, useContext, useEffect, useState } from "react";
      import type { ReactNode } from "react";
      import type { Me } from "./server";

      /** The App role that tunes a station's model inputs (app.yaml). */
      export const STEWARD = "steward";

      export interface Access {
        /** Who is signed in; `null` when signed out, `undefined` while it is asked. */
        me: Me | null | undefined;
        steward: boolean;
      }

      const AccessContext = createContext<Access>({ me: undefined, steward: false });

      /** Who the reader is, asked of the App's server once. What it offers, the server decides again. */
      export function AccessProvider({ api, children }: { api: { me: () => Promise<Me | null> }; children: ReactNode }) {
        const [me, setMe] = useState<Me | null | undefined>(undefined);
        useEffect(() => {
          let current = true;
          api.me().then(
            (who) => current && setMe(who),
            () => current && setMe(null),
          );
          return () => {
            current = false;
          };
        }, [api]);
        const steward = me?.roles.includes(STEWARD) ?? false;
        return <AccessContext.Provider value={{ me, steward }}>{children}</AccessContext.Provider>;
      }

      export function useAccess(): Access {
        return useContext(AccessContext);
      }
