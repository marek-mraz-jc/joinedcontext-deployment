    src__assets.rs: |
      //! The React build, embedded in the binary so the image is one artifact (AP-25).

      use std::borrow::Cow;
      use std::sync::Arc;

      use axum::body::Body;
      use axum::extract::State;
      use axum::http::{header, StatusCode, Uri};
      use axum::response::{IntoResponse, Response};
      use rust_embed::RustEmbed;

      use crate::{App, Config};

      #[derive(RustEmbed)]
      #[folder = "ui/dist"]
      pub struct Assets;

      /// Shown when the binary was built without a UI bundle, so the reason is on the page instead
      /// of in a log nobody reads.
      pub const PLACEHOLDER_HTML: &str = r#"<!doctype html>
      <html lang="en">
      <head><meta charset="utf-8" /><title>Air quality</title></head>
      <body><p>UI bundle not built. Run <code>pnpm build</code> in <code>ui/</code>.</p></body>
      </html>
      "#;

      pub async fn static_handler(State(app): State<Arc<App>>, uri: Uri) -> Response {
          let base = app.config.base_path.trim_end_matches('/');
          let path = uri
              .path()
              .strip_prefix(base)
              .unwrap_or(uri.path())
              .trim_start_matches('/');
          if path.is_empty() || path == "index.html" {
              return index(&app.config);
          }
          let Some(file) = Assets::get(path) else {
              // Anything with an extension is a real miss; everything else is a client route.
              return if path.rsplit('/').next().unwrap_or(path).contains('.') {
                  StatusCode::NOT_FOUND.into_response()
              } else {
                  index(&app.config)
              };
          };
          file_response(path, file.data)
      }

      /// One file of the bundle: its type from the name, and kept for a year when it is a hashed
      /// `assets/` file, which never changes under the same name.
      fn file_response(path: &str, data: Cow<'static, [u8]>) -> Response {
          let mime = mime_guess::from_path(path).first_or_octet_stream();
          let cache = if path.starts_with("assets/") {
              "public, max-age=31536000, immutable"
          } else {
              "no-cache"
          };
          (
              [
                  (header::CONTENT_TYPE, mime.as_ref()),
                  (header::CACHE_CONTROL, cache),
              ],
              Body::from(data),
          )
              .into_response()
      }

      /// The front page, with the reconciler's `#jc-config` first in its head when it was handed one
      /// (AP-67, AP-126).
      fn index(config: &Config) -> Response {
          let html = Assets::get("index.html")
              .map(|file| String::from_utf8_lossy(&file.data).into_owned())
              .unwrap_or_else(|| PLACEHOLDER_HTML.to_owned());
          let body = match &config.page_config {
              Some(json) => with_config(&html, json),
              None => html,
          };
          (
              [
                  (header::CONTENT_TYPE, "text/html; charset=utf-8"),
                  (header::CACHE_CONTROL, "no-cache"),
              ],
              Body::from(body),
          )
              .into_response()
      }

      /// `html` with `<script id="jc-config">` holding `json` right after `<head>`, where the page's
      /// scripts find it before they run.
      fn with_config(html: &str, json: &str) -> String {
          let element = format!(r#"<script id="jc-config" type="application/json">{json}</script>"#);
          let at = html
              .to_ascii_lowercase()
              .find("<head>")
              .map_or(0, |at| at + "<head>".len());
          format!("{}{element}{}", &html[..at], &html[at..])
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn a_hashed_asset_is_kept_for_a_year_and_anything_else_is_asked_for_again() {
              let script = file_response("assets/index-1a2b.js", Cow::Borrowed(b"export {}"));
              assert_eq!(
                  script.headers()[header::CACHE_CONTROL],
                  "public, max-age=31536000, immutable"
              );
              assert!(script.headers()[header::CONTENT_TYPE]
                  .to_str()
                  .unwrap()
                  .contains("javascript"));
              let icon = file_response("favicon.svg", Cow::Borrowed(b"<svg/>"));
              assert_eq!(icon.headers()[header::CACHE_CONTROL], "no-cache");
              assert_eq!(icon.headers()[header::CONTENT_TYPE], "image/svg+xml");
              let unknown = file_response("data.unknownext", Cow::Borrowed(b""));
              assert_eq!(
                  unknown.headers()[header::CONTENT_TYPE],
                  "application/octet-stream"
              );
          }
      }
    src__lib.rs: |
      //! The `air-quality` reference app (AP-34, AP-37, AP-39, AP-40).
      //!
      //! It shows the stations of one Context Space with their latest values and a day of history,
      //! and gives a steward a record form: add a station, correct its name, position and note, and
      //! remove a station a steward added (Architecture/16 §13). Everything it serves comes from a single
      //! Endpoint whose URL it is handed at run time; it opens no other connection, holds no
      //! credential of its own and contains no login, session or authorization logic. The platform
      //! edge (APISIX `openid-connect`) in front of it does the Keycloak login and hands over the
      //! user as `X-Userinfo` and the user's access token as `X-Access-Token`, and the gateway behind
      //! it decides what that token may see (AP-28, GW10, ADR-N-019).
      //!
      //! The one rule worth stating twice: a write without `X-Access-Token` is refused here and
      //! never retried anonymously (AP-40). An app that fell back would hand its own reachability to
      //! whoever asked.

      use std::sync::Arc;

      use axum::extract::{Path, State};
      use axum::http::{HeaderMap, StatusCode};
      use axum::response::{IntoResponse, Response};
      use axum::routing::{get, patch};
      use axum::{Json, Router};
      use base64::Engine as _;
      use serde::Deserialize;
      use serde_json::{json, Map, Value};
      use std::collections::BTreeMap;

      pub mod assets;

      /// The entity type this app was built for; it is also what the grant names.
      const TYPE: &str = "AirQualityObserved";
      /// The steward's free text on a station, one of the three attributes the form writes.
      const NOTE: &str = "stewardNote";
      /// A note is a sentence a person types, not a payload.
      const NOTE_MAX: usize = 500;

      /// What the reconciler hands the container (Architecture/16 §5).
      #[derive(Clone, Debug)]
      pub struct Config {
          /// `/apps/{name}/`, the path the app is served under.
          pub base_path: String,
          /// `https://{host}/api/endpoint/{slug}/`, the only data surface it may call (AP-04).
          pub endpoint_url: String,
          /// `true` on a `public` app, where a missing `X-Access-Token` is normal (AP-28).
          pub anonymous: bool,
          /// The Portal route that answers the caller's roles in this App (AP-109). Without it nobody
          /// holds a role, so the form is offered to nobody.
          pub me_url: Option<String>,
          /// `JC_APP_CONFIG`, the `#jc-config` object the reconciler hands a pod App (endpoints, and the
          /// project's `basemap` style URL when one is configured, AP-67), already escaped for the
          /// `<script>` element the page carries it in. `None`: the page is served as built.
          pub page_config: Option<String>,
      }

      impl Config {
          /// Reads the variables of Architecture/16 §5 and §13. A missing endpoint URL is fatal: an
          /// app with nowhere to read from has nothing to serve, and guessing a default would be
          /// guessing which data a user gets.
          pub fn from_env() -> Result<Self, String> {
              Self::from_vars(|name| std::env::var(name).ok())
          }

          /// [`Config::from_env`] over any lookup, so the parsing is tested without the process's
          /// environment, which tests running in parallel share.
          pub fn from_vars(var: impl Fn(&str) -> Option<String>) -> Result<Self, String> {
              let endpoint_url =
                  var("JC_ENDPOINT_URL").ok_or_else(|| "JC_ENDPOINT_URL is not set".to_owned())?;
              Ok(Self {
                  base_path: var("JC_BASE_PATH").unwrap_or_else(|| "/".to_owned()),
                  endpoint_url: with_trailing_slash(&endpoint_url),
                  anonymous: var("JC_ANONYMOUS").is_some_and(|value| value == "true"),
                  me_url: var("JC_ME_URL").filter(|url| !url.is_empty()),
                  page_config: match var("JC_APP_CONFIG") {
                      Some(raw) if !raw.trim().is_empty() => Some(page_config(&raw)?),
                      _ => None,
                  },
              })
          }
      }

      /// `JC_APP_CONFIG` as the body of a `<script type="application/json">`: a JSON object, or the
      /// app does not start. `<`, `>` and `&` only occur inside JSON strings, where their `\u` escapes
      /// read the same, so no value can close the element early.
      pub fn page_config(raw: &str) -> Result<String, String> {
          let value: Value =
              serde_json::from_str(raw).map_err(|err| format!("JC_APP_CONFIG is not JSON: {err}"))?;
          if !value.is_object() {
              return Err("JC_APP_CONFIG is not a JSON object".to_owned());
          }
          Ok(value
              .to_string()
              .replace('<', "\\u003c")
              .replace('>', "\\u003e")
              .replace('&', "\\u0026"))
      }

      fn with_trailing_slash(url: &str) -> String {
          if url.ends_with('/') {
              url.to_owned()
          } else {
              format!("{url}/")
          }
      }

      /// The application state: its configuration and the one client it makes requests with.
      pub struct App {
          pub config: Config,
          http: reqwest::Client,
      }

      impl App {
          pub fn new(config: Config) -> Self {
              Self {
                  config,
                  http: reqwest::Client::new(),
              }
          }

          fn url(&self, tail: &str) -> String {
              format!("{}{tail}", self.config.endpoint_url)
          }
      }

      /// The app's routes under its own base path, with the embedded UI behind them.
      ///
      /// The prefix is spelled into every route rather than nested. `Router::nest` does not match
      /// the prefix with a trailing slash, and `https://{host}/apps/air-quality/` with that slash
      /// is exactly what a browser follows from the Portal, so nesting would 404 the front page.
      pub fn router(app: Arc<App>) -> Router {
          let base = app.config.base_path.trim_end_matches('/').to_owned();
          let at = |tail: &str| format!("{base}{tail}");
          let router = Router::new()
              // The readiness probe of the pod, at the root and outside the base path: the kubelet
              // asks it, not a browser (Architecture/16 §5).
              .route("/healthz", get(healthz))
              .route(&at("/api/me"), get(me))
              .route(&at("/api/stations"), get(stations).post(create_station))
              .route(
                  &at("/api/stations/{id}"),
                  patch(update_station).delete(delete_station),
              )
              .route(&at("/api/stations/{id}/history"), get(history))
              // Both spellings of the front page: the edge routes the prefix, and a person who
              // types it without the slash is not a different visitor.
              .route(&at("/"), get(assets::static_handler))
              .route(&at("/{*path}"), get(assets::static_handler));
          // On its own host the base is `/` (AP-133), which `at("/")` already serves; axum refuses
          // an empty path, and the pod crashed at start on dev with it (T-2909).
          if base.is_empty() {
              router.with_state(app)
          } else {
              router
                  .route(&base, get(assets::static_handler))
                  .with_state(app)
          }
      }

      /// What the edge says about the caller (AP-28). None of it is trusted for a decision: the
      /// token is forwarded to the gateway, which is what actually decides; the userinfo is shown
      /// on the page and nowhere else.
      #[derive(Default)]
      struct Caller {
          token: Option<String>,
          email: Option<String>,
          user: Option<String>,
      }

      /// The forwarded token stays out of every log line.
      impl std::fmt::Debug for Caller {
          fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
              f.debug_struct("Caller")
                  .field("token", &self.token.as_ref().map(|_| "[redacted]"))
                  .field("email", &self.email)
                  .field("user", &self.user)
                  .finish()
          }
      }

      impl Caller {
          fn of(headers: &HeaderMap) -> Self {
              let header = |name: &str| {
                  headers
                      .get(name)
                      .and_then(|value| value.to_str().ok())
                      .map(str::trim)
                      .filter(|value| !value.is_empty())
                      .map(str::to_owned)
              };
              let userinfo = header("x-userinfo")
                  .and_then(|encoded| decode_userinfo(&encoded))
                  .unwrap_or_default();
              let field = |name: &str| userinfo.get(name)?.as_str().map(str::to_owned);
              Self {
                  token: header("x-access-token"),
                  email: field("email"),
                  user: field("preferred_username")
                      .or_else(|| field("name"))
                      .or_else(|| field("sub")),
              }
          }
      }

      /// `X-Userinfo` is the userinfo document, base64 encoded, the way lua-resty-openidc sends it.
      /// Padded standard base64 is what it produces; the other three spellings cost one line each
      /// and a header that is none of them is simply no userinfo.
      fn decode_userinfo(encoded: &str) -> Option<Value> {
          use base64::engine::general_purpose::{STANDARD, STANDARD_NO_PAD, URL_SAFE, URL_SAFE_NO_PAD};
          [STANDARD, STANDARD_NO_PAD, URL_SAFE, URL_SAFE_NO_PAD]
              .iter()
              .find_map(|engine| engine.decode(encoded).ok())
              .and_then(|bytes| serde_json::from_slice(&bytes).ok())
              .filter(Value::is_object)
      }

      /// The readiness answer the pod's probe reads: the process is up and can serve.
      async fn healthz() -> &'static str {
          "ok"
      }

      /// A failure the caller is allowed to see. The gateway's own problem document is passed
      /// through byte for byte where there is one, because its refusal is more precise than
      /// anything this app could invent (GW6).
      #[derive(Debug)]
      pub enum AppError {
          /// The app's own refusal.
          Refused(StatusCode, &'static str),
          /// The endpoint answered, and its answer is the answer.
          Upstream(StatusCode, String),
          /// The endpoint could not be reached at all.
          Unreachable,
      }

      impl IntoResponse for AppError {
          fn into_response(self) -> Response {
              let (status, body) = match self {
                  Self::Refused(status, detail) => (
                      status,
                      json!({
                          "type": "https://joinedcontext.com/errors/app",
                          "title": status.canonical_reason().unwrap_or("Error"),
                          "status": status.as_u16(),
                          "detail": detail,
                      })
                      .to_string(),
                  ),
                  Self::Upstream(status, body) => (status, body),
                  Self::Unreachable => (
                      StatusCode::BAD_GATEWAY,
                      json!({
                          "type": "https://joinedcontext.com/errors/app",
                          "title": "Bad Gateway",
                          "status": 502,
                          "detail": "the endpoint did not answer",
                      })
                      .to_string(),
                  ),
              };
              (
                  status,
                  [(axum::http::header::CONTENT_TYPE, "application/problem+json")],
                  body,
              )
                  .into_response()
          }
      }

      /// An entity id reaches the upstream URL as a path segment, so it is checked before it is
      /// used rather than escaped afterwards: the platform's ids are URNs of a known shape (R2),
      /// and anything else is a caller trying to steer the request somewhere else.
      fn valid_urn(id: &str) -> bool {
          id.starts_with("urn:ngsi-ld:")
              && id.len() <= 256
              && id
                  .chars()
                  .all(|c| c.is_ascii_alphanumeric() || matches!(c, ':' | '.' | '_' | '-'))
      }

      impl App {
          /// One GET against the endpoint, with the caller's own token when the edge handed one
          /// over. Without a token the call is anonymous, which is what a `public` app does (AP-28).
          async fn get(
              &self,
              tail: &str,
              query: &[(&str, String)],
              caller: &Caller,
          ) -> Result<Value, AppError> {
              let mut request = self.http.get(self.url(tail)).query(query);
              if let Some(token) = &caller.token {
                  request = request.bearer_auth(token);
              }
              let response = request.send().await.map_err(|_| AppError::Unreachable)?;
              let status =
                  StatusCode::from_u16(response.status().as_u16()).unwrap_or(StatusCode::BAD_GATEWAY);
              let body = response.text().await.map_err(|_| AppError::Unreachable)?;
              if !status.is_success() {
                  return Err(AppError::Upstream(status, body));
              }
              serde_json::from_str(&body).map_err(|_| AppError::Unreachable)
          }

          /// The caller's roles in this App, from the Portal's `/me` (AP-109, Architecture/16 §13).
          /// A failure to ask is no role: the form is hidden when the answer is not a clear list
          /// (fail closed). The roles only decide what the page offers; the gateway decides the write.
          async fn roles(&self, caller: &Caller) -> Vec<String> {
              let (Some(url), Some(token)) = (&self.config.me_url, &caller.token) else {
                  return Vec::new();
              };
              let Ok(response) = self.http.get(url).bearer_auth(token).send().await else {
                  return Vec::new();
              };
              if !response.status().is_success() {
                  return Vec::new();
              }
              response
                  .json::<Value>()
                  .await
                  .ok()
                  .and_then(|me| {
                      me.get("roles")?.as_array().map(|roles| {
                          roles
                              .iter()
                              .filter_map(|role| role.as_str().map(str::to_owned))
                              .collect()
                      })
                  })
                  .unwrap_or_default()
          }

          /// One write against the endpoint with the caller's token; the gateway's refusal is the
          /// answer, word for word (AP-40, GW6).
          async fn write(&self, request: reqwest::RequestBuilder) -> Result<StatusCode, AppError> {
              let response = request.send().await.map_err(|_| AppError::Unreachable)?;
              let status =
                  StatusCode::from_u16(response.status().as_u16()).unwrap_or(StatusCode::BAD_GATEWAY);
              if status.is_success() {
                  return Ok(status);
              }
              Err(AppError::Upstream(
                  status,
                  response.text().await.unwrap_or_default(),
              ))
          }
      }

      /// Who the browser is talking as, and the roles that decide whether the form is offered.
      async fn me(State(app): State<Arc<App>>, headers: HeaderMap) -> Response {
          let caller = Caller::of(&headers);
          let roles = app.roles(&caller).await;
          Json(json!({
              "signedIn": caller.token.is_some(),
              "email": caller.email,
              "user": caller.user,
              "anonymous": app.config.anonymous,
              "roles": roles,
          }))
          .into_response()
      }

      /// The station list, flattened out of the normalized NGSI-LD the endpoint serves.
      async fn stations(
          State(app): State<Arc<App>>,
          headers: HeaderMap,
      ) -> Result<Json<Value>, AppError> {
          let caller = Caller::of(&headers);
          let entities = app
              .get(
                  "ngsi-ld/v1/entities",
                  &[("type", TYPE.to_owned()), ("limit", "100".to_owned())],
                  &caller,
              )
              .await?;
          let list: Vec<Value> = entities
              .as_array()
              .map(|entities| entities.iter().map(station).collect())
              .unwrap_or_default();
          Ok(Json(json!(list)))
      }

      /// One day of one station, from the temporal surface the grant already covers.
      async fn history(
          State(app): State<Arc<App>>,
          Path(id): Path<String>,
          headers: HeaderMap,
      ) -> Result<Json<Value>, AppError> {
          if !valid_urn(&id) {
              return Err(AppError::Refused(
                  StatusCode::BAD_REQUEST,
                  "a station id is an NGSI-LD URN",
              ));
          }
          let caller = Caller::of(&headers);
          let entity = app
              .get(
                  &format!("ngsi-ld/v1/temporal/entities/{id}"),
                  &[
                      ("attrs", "pm10,pm25".to_owned()),
                      ("timerel", "after".to_owned()),
                      // The grant itself is windowed to P1D (AP-39); asking for more would be
                      // asking the PDP to narrow it again for nothing.
                      ("timeAt", day_ago()),
                  ],
                  &caller,
              )
              .await?;
          Ok(Json(entity))
      }

      /// The caller's token, or the refusal every write gives without one (AP-40). A public app reads
      /// anonymously, but nothing writes anonymously, so this does not look at `config.anonymous`:
      /// there is no configuration that turns it off.
      fn token_of(caller: &Caller) -> Result<&str, AppError> {
          caller.token.as_deref().ok_or(AppError::Refused(
              StatusCode::UNAUTHORIZED,
              "a write needs a signed-in user",
          ))
      }

      fn refused(detail: &'static str) -> AppError {
          AppError::Refused(StatusCode::BAD_REQUEST, detail)
      }

      /// What the record form sends. Only the station attributes a person may correct exist here and
      /// an unknown field is refused, so a measured value (`pm10`, `pm25`, `airQualityIndex`,
      /// `dateObserved`) or `source` can never be written through this app; the gateway's grant says
      /// the same a second time.
      #[derive(Debug, Default, Deserialize)]
      #[serde(deny_unknown_fields, rename_all = "camelCase")]
      pub struct StationFields {
          /// The last segment of a new station's URN; on create only.
          pub local_id: Option<String>,
          /// The station's name per language, written whole (a `LanguageProperty`).
          pub name: Option<BTreeMap<String, String>>,
          /// `[longitude, latitude]`.
          pub coordinates: Option<[f64; 2]>,
          pub steward_note: Option<String>,
      }

      /// `fi`, `en`, `sv`, `en-GB`: a BCP 47 language with an optional region, nothing longer.
      fn valid_language(tag: &str) -> bool {
          let mut parts = tag.split('-');
          let language = parts.next().unwrap_or_default();
          let region = parts.next();
          (2..=3).contains(&language.len())
              && language.chars().all(|c| c.is_ascii_lowercase())
              && region.is_none_or(|r| r.len() == 2 && r.chars().all(|c| c.is_ascii_uppercase()))
              && parts.next().is_none()
      }

      fn valid_local_id(id: &str) -> bool {
          (1..=64).contains(&id.len())
              && id
                  .chars()
                  .all(|c| c.is_ascii_alphanumeric() || matches!(c, '_' | '-'))
      }

      /// The NGSI-LD attributes of the fields that were sent, checked before anything leaves the pod.
      fn attributes(fields: &StationFields) -> Result<Map<String, Value>, AppError> {
          let mut attrs = Map::new();
          if let Some(names) = &fields.name {
              let mut map = Map::new();
              for (language, text) in names {
                  let text = text.trim();
                  if !valid_language(language) {
                      return Err(refused("a name's language is a code such as fi or en"));
                  }
                  if text.is_empty() {
                      continue;
                  }
                  if text.chars().count() > 200 {
                      return Err(refused("a name is at most 200 characters"));
                  }
                  map.insert(language.clone(), json!(text));
              }
              if map.is_empty() {
                  return Err(refused("a station has a name in at least one language"));
              }
              attrs.insert(
                  "name".to_owned(),
                  json!({ "type": "LanguageProperty", "languageMap": map }),
              );
          }
          if let Some([longitude, latitude]) = fields.coordinates {
              if !(-180.0..=180.0).contains(&longitude) || !(-90.0..=90.0).contains(&latitude) {
                  return Err(refused(
                      "a position is a longitude between -180 and 180 and a latitude between -90 and 90",
                  ));
              }
              attrs.insert(
                  "location".to_owned(),
                  json!({ "type": "GeoProperty", "value": { "type": "Point", "coordinates": [longitude, latitude] } }),
              );
          }
          if let Some(note) = &fields.steward_note {
              let note = note.trim();
              if note.is_empty() || note.chars().count() > NOTE_MAX {
                  return Err(refused("a note is between one and 500 characters"));
              }
              attrs.insert(
                  NOTE.to_owned(),
                  json!({ "type": "Property", "value": note }),
              );
          }
          Ok(attrs)
      }

      /// A new station: one `POST /entities` with the caller's token (AP-62).
      async fn create_station(
          State(app): State<Arc<App>>,
          headers: HeaderMap,
          Json(fields): Json<StationFields>,
      ) -> Result<Response, AppError> {
          let caller = Caller::of(&headers);
          let token = token_of(&caller)?;
          let local_id = fields.local_id.as_deref().unwrap_or_default();
          if !valid_local_id(local_id) {
              return Err(refused(
                  "a station id is 1 to 64 letters, digits, '-' or '_'",
              ));
          }
          if fields.name.is_none() || fields.coordinates.is_none() {
              return Err(refused("a new station has a name and a position"));
          }
          let attrs = attributes(&fields)?;
          // ponytail: the `{domain}:{space}` of the id is read off a station the endpoint already
          // serves, so the first record of an empty space cannot be added here; the reconciler handing
          // the app its organization domain and space would lift that.
          let known = app
              .get(
                  "ngsi-ld/v1/entities",
                  &[("type", TYPE.to_owned()), ("limit", "1".to_owned())],
                  &caller,
              )
              .await?;
          let Some(prefix) = known
              .as_array()
              .and_then(|list| list.first())
              .and_then(|entity| entity.get("id")?.as_str())
              .and_then(|id| id.rsplit_once(':'))
              .map(|(prefix, _)| prefix.to_owned())
          else {
              return Err(AppError::Refused(
                  StatusCode::CONFLICT,
                  "the space has no station yet to take the id's organization and space from",
              ));
          };
          let id = format!("{prefix}:{local_id}");
          if !valid_urn(&id) || !id.starts_with(&format!("urn:ngsi-ld:{TYPE}:")) {
              return Err(AppError::Unreachable);
          }
          let mut entity = attrs;
          entity.insert("id".to_owned(), json!(id));
          entity.insert("type".to_owned(), json!(TYPE));
          app.write(
              app.http
                  .post(app.url("ngsi-ld/v1/entities"))
                  .bearer_auth(token)
                  .json(&entity),
          )
          .await?;
          Ok((StatusCode::CREATED, Json(json!({ "id": id }))).into_response())
      }

      /// A correction: one `PATCH /entities/{id}/attrs` with only the attributes that were sent.
      async fn update_station(
          State(app): State<Arc<App>>,
          Path(id): Path<String>,
          headers: HeaderMap,
          Json(fields): Json<StationFields>,
      ) -> Result<Response, AppError> {
          let caller = Caller::of(&headers);
          let token = token_of(&caller)?;
          if !valid_urn(&id) {
              return Err(refused("a station id is an NGSI-LD URN"));
          }
          if fields.local_id.is_some() {
              return Err(refused("a station's id does not change"));
          }
          let attrs = attributes(&fields)?;
          if attrs.is_empty() {
              return Err(refused("nothing to change"));
          }
          app.write(
              app.http
                  .patch(app.url(&format!("ngsi-ld/v1/entities/{id}/attrs")))
                  .bearer_auth(token)
                  .json(&attrs),
          )
          .await?;
          Ok(StatusCode::NO_CONTENT.into_response())
      }

      /// A removal. The gateway admits it only for a station a steward added, one without `source`,
      /// by evaluating the grant's `q` against the stored entity (R45); this app does not repeat that.
      async fn delete_station(
          State(app): State<Arc<App>>,
          Path(id): Path<String>,
          headers: HeaderMap,
      ) -> Result<Response, AppError> {
          let caller = Caller::of(&headers);
          let token = token_of(&caller)?;
          if !valid_urn(&id) {
              return Err(refused("a station id is an NGSI-LD URN"));
          }
          app.write(
              app.http
                  .delete(app.url(&format!("ngsi-ld/v1/entities/{id}")))
                  .bearer_auth(token),
          )
          .await?;
          Ok(StatusCode::NO_CONTENT.into_response())
      }

      /// The normalized form carries `{"pm10": {"type": "Property", "value": 34.2}}`; the browser
      /// wants the number. An attribute the grant hides is simply absent, and stays absent here.
      fn station(entity: &Value) -> Value {
          let mut out = Map::new();
          out.insert("id".to_owned(), entity["id"].clone());
          for attr in ["name", "pm10", "pm25", "airQualityIndex", NOTE] {
              if let Some(value) = entity.get(attr).and_then(|attr| attr.get("value")) {
                  out.insert(attr.to_owned(), value.clone());
              }
          }
          // The `helsinki` model's `name` is a `LanguageProperty`: the form gets every language, the
          // card the English one, else the Finnish one, else whichever there is.
          if let Some(names) = entity
              .get("name")
              .and_then(|name| name.get("languageMap"))
              .and_then(Value::as_object)
          {
              if let Some(shown) = ["en", "fi"]
                  .iter()
                  .find_map(|language| names.get(*language))
                  .or_else(|| names.values().next())
              {
                  out.insert("name".to_owned(), shown.clone());
              }
              out.insert("names".to_owned(), Value::Object(names.clone()));
          }
          // A record a pipeline wrote says where it came from; a station a steward added does not,
          // and only that one is the steward's to remove.
          out.insert("own".to_owned(), json!(entity.get("source").is_none()));
          if let Some(coordinates) = entity
              .get("location")
              .and_then(|location| location.get("value"))
              .and_then(|geometry| geometry.get("coordinates"))
          {
              out.insert("coordinates".to_owned(), coordinates.clone());
          }
          if let Some(observed) = entity.get("pm10").and_then(|pm10| pm10.get("observedAt")) {
              out.insert("observedAt".to_owned(), observed.clone());
          }
          Value::Object(out)
      }

      /// An ISO 8601 instant 24 hours ago, formatted the way the temporal API wants it.
      fn day_ago() -> String {
          let seconds = std::time::SystemTime::now()
              .duration_since(std::time::UNIX_EPOCH)
              .map(|since| since.as_secs())
              .unwrap_or_default()
              .saturating_sub(24 * 60 * 60);
          format_utc(seconds)
      }

      /// `seconds` since the epoch as `YYYY-MM-DDThh:mm:ssZ`. The civil-date conversion is Howard
      /// Hinnant's, the same arithmetic every date library runs; a date crate for one call is a
      /// dependency for one call.
      fn format_utc(seconds: u64) -> String {
          let days = (seconds / 86_400) as i64;
          let time = seconds % 86_400;
          let z = days + 719_468;
          let era = z.div_euclid(146_097);
          let doe = z.rem_euclid(146_097);
          let yoe = (doe - doe / 1_460 + doe / 36_524 - doe / 146_096) / 365;
          let y = yoe + era * 400;
          let doy = doe - (365 * yoe + yoe / 4 - yoe / 100);
          let mp = (5 * doy + 2) / 153;
          let d = doy - (153 * mp + 2) / 5 + 1;
          let m = if mp < 10 { mp + 3 } else { mp - 9 };
          let y = if m <= 2 { y + 1 } else { y };
          format!(
              "{y:04}-{m:02}-{d:02}T{:02}:{:02}:{:02}Z",
              time / 3_600,
              (time % 3_600) / 60,
              time % 60
          )
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn a_caller_debug_never_shows_the_token() {
              let caller = Caller {
                  token: Some("s3cr3t-test".into()),
                  ..Caller::default()
              };
              let text = format!("{caller:?}");
              assert!(
                  !text.contains("s3cr3t-test") && text.contains("[redacted]"),
                  "{text}"
              );
          }

          #[test]
          fn only_ngsi_ld_urns_reach_the_upstream_path() {
              assert!(valid_urn(
                  "urn:ngsi-ld:AirQualityObserved:hel.fi:air-quality:station-01"
              ));
              assert!(!valid_urn("urn:ngsi-ld:X/../../admin"));
              assert!(!valid_urn("urn:ngsi-ld:X?type=Other"));
              assert!(!valid_urn("../secrets"));
              assert!(!valid_urn(""));
          }

          #[test]
          fn a_station_keeps_only_what_the_grant_returned() {
              let entity = json!({
                  "id": "urn:ngsi-ld:AirQualityObserved:hel.fi:air-quality:s1",
                  "type": TYPE,
                  "name": { "type": "Property", "value": "Kallio" },
                  "pm10": { "type": "Property", "value": 34.2, "observedAt": "2026-09-06T10:00:00Z" },
                  "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [19.1, 48.7] } }
              });
              let flat = station(&entity);
              assert_eq!(flat["pm10"], json!(34.2));
              assert_eq!(flat["coordinates"], json!([19.1, 48.7]));
              assert_eq!(flat["observedAt"], json!("2026-09-06T10:00:00Z"));
              // pm25 was not in the answer, so it is not in the card either.
              assert!(flat.get("pm25").is_none());
          }

          #[test]
          fn the_epoch_and_a_known_instant_format_the_way_the_temporal_api_reads_them() {
              assert_eq!(format_utc(0), "1970-01-01T00:00:00Z");
              assert_eq!(format_utc(1_788_696_000), "2026-09-06T12:00:00Z");
          }

          #[test]
          fn the_endpoint_url_always_ends_in_a_slash_so_paths_append_cleanly() {
              assert_eq!(
                  with_trailing_slash("https://h/api/endpoint/s"),
                  "https://h/api/endpoint/s/"
              );
              assert_eq!(
                  with_trailing_slash("https://h/api/endpoint/s/"),
                  "https://h/api/endpoint/s/"
              );
          }
      }
    src__main.rs: |
      //! The app process: read the four variables the reconciler sets, bind, serve.
      //!
      //! In the pod the reconciler sets `JC_BIND_ADDRESS` to `0.0.0.0:8080`, the port the APISIX edge
      //! upstreams to and the NetworkPolicy opens to nobody else (AP-26). The loopback default is for
      //! a laptop, where nothing stands in front of the process.

      use std::sync::Arc;

      use air_quality::{router, App, Config};

      #[tokio::main]
      async fn main() -> Result<(), Box<dyn std::error::Error>> {
          tracing_subscriber::fmt()
              .with_env_filter(
                  tracing_subscriber::EnvFilter::try_from_default_env().unwrap_or_else(|_| "info".into()),
              )
              .init();

          let config = Config::from_env()?;
          let bind = std::env::var("JC_BIND_ADDRESS").unwrap_or_else(|_| "127.0.0.1:8080".to_owned());
          tracing::info!(%bind, base = %config.base_path, "air-quality starting");

          let listener = tokio::net::TcpListener::bind(&bind).await?;
          let app = router(Arc::new(App::new(config)));
          axum::serve(listener, app)
              .with_graceful_shutdown(async {
                  let _ = tokio::signal::ctrl_c().await;
              })
              .await?;
          Ok(())
      }
    tests__e2e__auth_flow.spec.ts: |
      /**
       * The record form through the real binary (T-2617, AP-40, AP-62, AP-109, GW10): an anonymous
       * reader and a viewer get no form, a steward adds, corrects and removes a station, and a direct
       * write without a token or with a viewer's token is refused.
       */
      import { expect, test } from "@playwright/test";

      const BASE = "/apps/air-quality/";
      const ID = "urn:ngsi-ld:AirQualityObserved:hel.fi:helsinki:kallio";

      /** The headers the edge puts in front of the app for a signed-in person (AP-28, ADR-N-019). */
      const edge = (who: string) => ({
        "x-access-token": `token-for-${who}`,
        "x-userinfo": Buffer.from(
          JSON.stringify({ sub: `f:1:demo.${who}`, preferred_username: `demo.${who}@hel.fi`, email: `demo.${who}@hel.fi` }),
        ).toString("base64"),
      });

      test.describe("who may edit a station record", () => {
        test("an anonymous reader sees the measurements and no control", async ({ page }) => {
          await page.goto(BASE);

          await expect(page.getByRole("heading", { name: "Kallio", exact: true })).toBeVisible();
          await expect(page.getByText("34.2 µg/m³")).toBeVisible();
          await expect(page.getByText("You are viewing anonymously.")).toBeVisible();
          // Nothing that writes: no form and no Add, Edit, Save, Remove or Confirm. The station picker
          // beside the map (T-2925) is reading, and an anonymous reader has it like everyone else.
          await expect(page.getByRole("form")).toHaveCount(0);
          await expect(page.getByRole("button", { name: /^(Add|Edit|Save|Remove|Confirm)\b/ })).toHaveCount(0);
          await expect(page.getByRole("button", { name: /^Kallio/ })).toHaveAttribute("aria-pressed", "true");
        });

        test("a signed-in viewer is named on the page and sees Edit disabled with the reason", async ({ page }) => {
          await page.setExtraHTTPHeaders(edge("viewer"));
          await page.goto(BASE);

          await expect(page.getByText("demo.viewer@hel.fi", { exact: true })).toBeVisible();
          const edit = page.getByRole("button", { name: "Edit Kallio" });
          await expect(edit).toBeDisabled();
          await expect(edit).toHaveAccessibleDescription("Only a steward adds, corrects or removes station records.");
          await expect(page.getByRole("form")).toHaveCount(0);
        });

        test("a steward adds a station, corrects it and removes it", async ({ page }) => {
          await page.setExtraHTTPHeaders(edge("steward"));
          await page.goto(BASE);

          const add = page.getByRole("form", { name: "New station" });
          await add.getByLabel("Station id").fill("vallila");
          await add.getByLabel("Name in Finnish").fill("Vallila");
          await add.getByLabel("Longitude").fill("24.95");
          await add.getByLabel("Latitude").fill("60.19");
          await add.getByRole("button", { name: "Add station" }).click();
          await expect(page.getByRole("heading", { name: "Vallila", exact: true })).toBeVisible();

          await page.getByRole("button", { name: "Edit Vallila" }).click();
          const edit = page.getByRole("form", { name: "Edit Vallila" });
          await edit.getByLabel("Steward note").fill("Sensor cleaned.");
          await edit.getByRole("button", { name: "Save changes" }).click();
          await expect(page.getByText("Note: Sensor cleaned.")).toBeVisible();

          // The pipeline's station stays: its Remove is disabled and says why.
          await expect(page.getByRole("button", { name: "Remove Kallio" })).toBeDisabled();
          await page.getByRole("button", { name: "Remove Vallila" }).click();
          await page.getByRole("button", { name: "Confirm removal of Vallila" }).click();
          await expect(page.getByRole("heading", { name: "Vallila", exact: true })).toHaveCount(0);
        });

        // The buttons are a convenience; the refusal is the control. These call the app the way a
        // script would, with no page in the way, so what is asserted is the server's own answer.
        test("the app refuses a write with no access token and does not retry anonymously", async ({ request }) => {
          const response = await request.patch(`${BASE}api/stations/${encodeURIComponent(ID)}`, {
            data: { stewardNote: "Anyone at all." },
          });

          expect(response.status()).toBe(401);
          expect(await response.text()).toContain("signed-in");
        });

        test("a viewer who calls the write directly is refused in the gateway's own words", async ({ request }) => {
          const response = await request.patch(`${BASE}api/stations/${encodeURIComponent(ID)}`, {
            headers: edge("viewer"),
            data: { stewardNote: "Trying anyway." },
          });

          expect(response.status()).toBe(403);
          expect(await response.text()).toContain("needs the steward role");
        });
      });
    tests__e2e__stub-endpoint.mjs: |
      // The Endpoint and the Portal's `/me` the app talks to during the browser flow: one space, a
      // pipeline's station and whatever a steward adds. It is deliberately not the gateway; what it
      // reproduces is what the flow needs: the roles differ by bearer token (AP-109), a viewer's write
      // is refused with a problem document (GW10), and only a station without `source` may be removed
      // (the grant's `q: "!source"`, R45).
      import { createServer } from "node:http";

      const PORT = Number(process.env.STUB_PORT ?? 4319);
      const PREFIX = "urn:ngsi-ld:AirQualityObserved:hel.fi:helsinki";
      const ID = `${PREFIX}:kallio`;

      const stations = new Map([
        [
          ID,
          {
            id: ID,
            type: "AirQualityObserved",
            name: { type: "LanguageProperty", languageMap: { fi: "Kallio", en: "Kallio" } },
            pm10: { type: "Property", value: 34.2, observedAt: "2026-09-06T10:00:00Z" },
            pm25: { type: "Property", value: 21 },
            location: { type: "GeoProperty", value: { type: "Point", coordinates: [24.95, 60.18] } },
            source: { type: "Property", value: "https://example.org/air-quality" },
          },
        ],
      ]);

      const isSteward = (request) => (request.headers.authorization ?? "").includes("steward");

      const send = (response, status, body) => {
        if (body === undefined) {
          response.writeHead(status).end();
          return;
        }
        const payload = JSON.stringify(body);
        response.writeHead(status, {
          "content-type": status >= 400 ? "application/problem+json" : "application/json",
          "content-length": Buffer.byteLength(payload),
        });
        response.end(payload);
      };

      const forbidden = (detail) => ({ type: "https://joinedcontext.com/errors/forbidden", title: "Forbidden", status: 403, detail });

      const read = (request, then) => {
        let body = "";
        request.on("data", (chunk) => (body += chunk));
        request.on("end", () => then(JSON.parse(body || "{}")));
      };

      createServer((request, response) => {
        const { pathname } = new URL(request.url, `http://127.0.0.1:${PORT}`);
        const entity = /^\/ngsi-ld\/v1\/entities\/([^/]+)(\/attrs)?$/.exec(pathname);
        const id = entity ? decodeURIComponent(entity[1]) : null;

        if (pathname === "/health") {
          return send(response, 200, { ok: true });
        }
        if (pathname === "/me" && request.method === "GET") {
          const who = (request.headers.authorization ?? "").replace("Bearer token-for-", "");
          return send(response, 200, { id: `f:1:demo.${who}`, name: who, roles: [isSteward(request) ? "steward" : "viewer"] });
        }
        // One day of a station, as the temporal surface answers it (T-2925's chart): a reading every
        // three hours up to now, so the chart has a line to draw rather than an error to show.
        const temporal = /^\/ngsi-ld\/v1\/temporal\/entities\/([^/]+)$/.exec(pathname);
        if (temporal && request.method === "GET") {
          const station = stations.get(decodeURIComponent(temporal[1]));
          if (!station) {
            return send(response, 404, { type: "https://uri.etsi.org/ngsi-ld/errors/ResourceNotFound", title: "Not found", status: 404, detail: "no such station" });
          }
          const now = Date.now();
          const series = (base) =>
            Array.from({ length: 8 }, (_, step) => ({
              type: "Property",
              value: Math.round((base + (step % 3) * 2.5) * 10) / 10,
              observedAt: new Date(now - (7 - step) * 3 * 3600_000).toISOString(),
            }));
          return send(response, 200, { id: station.id, type: station.type, pm10: series(30), pm25: series(18) });
        }
        if (pathname === "/ngsi-ld/v1/entities" && request.method === "GET") {
          return send(response, 200, [...stations.values()]);
        }
        if (pathname === "/ngsi-ld/v1/entities" && request.method === "POST") {
          if (!isSteward(request)) {
            return send(response, 403, forbidden("createEntity on AirQualityObserved needs the steward role"));
          }
          return read(request, (body) => {
            stations.set(body.id, body);
            send(response, 201);
          });
        }
        if (id && entity[2] && request.method === "PATCH") {
          if (!isSteward(request)) {
            return send(response, 403, forbidden("updateAttrs on AirQualityObserved needs the steward role"));
          }
          return read(request, (body) => {
            stations.set(id, { ...stations.get(id), ...body });
            send(response, 204);
          });
        }
        if (id && !entity[2] && request.method === "DELETE") {
          if (!isSteward(request) || stations.get(id)?.source) {
            return send(response, 403, forbidden("deleteEntity is granted on records without source only"));
          }
          stations.delete(id);
          return send(response, 204);
        }
        return send(response, 404, { status: 404, detail: `no route for ${pathname}` });
      }).listen(PORT, "127.0.0.1", () => {
        process.stdout.write(`stub endpoint on http://127.0.0.1:${PORT}\n`);
      });
    tests__stations_api_tests.rs: |
      //! The app's own contract with its Endpoint and the Portal's `/me` (T-0310, T-2617, AP-04,
      //! AP-28, AP-39, AP-40, AP-62, AP-109, GW10).
      //!
      //! Every case runs the real router against a stubbed endpoint, so what is asserted is the
      //! request that actually leaves the pod: which URL, which token, which method. The point of
      //! the app is that it adds nothing to the caller's authority, and that is only observable
      //! from outside the process.

      use std::sync::Arc;

      use air_quality::{router, App, Config};
      use axum::body::Body;
      use axum::http::{Request, StatusCode};
      use http_body_util::BodyExt;
      use serde_json::{json, Value};
      use tower::ServiceExt;
      use wiremock::matchers::{body_json, header, method, path, query_param};
      use wiremock::{Mock, MockServer, ResponseTemplate};

      const STATION: &str = "urn:ngsi-ld:AirQualityObserved:hel.fi:air-quality:station-01";
      const BASE: &str = "/apps/air-quality/";
      // Not shaped like a JWT on purpose: a fixture that merely looks like a credential stops the
      // secret scan for no reason, and what these tests assert is that the value is carried through
      // unchanged, not what is inside it.
      const TOKEN: &str = "the-forwarded-access-token-of-demo-steward";

      fn app_at(endpoint: &MockServer) -> axum::Router {
          router(Arc::new(App::new(Config {
              base_path: BASE.to_owned(),
              endpoint_url: format!("{}/", endpoint.uri()),
              anonymous: false,
              me_url: Some(format!("{}/me", endpoint.uri())),
              page_config: None,
          })))
      }

      fn entity() -> Value {
          json!({
              "id": STATION,
              "type": "AirQualityObserved",
              "name": { "type": "LanguageProperty", "languageMap": { "fi": "Kallio 2", "en": "Kallio" } },
              "pm10": { "type": "Property", "value": 34.2, "observedAt": "2026-09-06T10:00:00Z" },
              "pm25": { "type": "Property", "value": 21.0 },
              "location": {
                  "type": "GeoProperty",
                  "value": { "type": "Point", "coordinates": [19.146, 48.736] }
              }
          })
      }

      /// A request as the edge delivers it (AP-28): the user's access token in `X-Access-Token` and
      /// the userinfo, base64 JSON, in `X-Userinfo`.
      fn signed_in(method: &str, path: &str, body: Option<Value>) -> Request<Body> {
          use base64::Engine as _;
          let userinfo = base64::engine::general_purpose::STANDARD.encode(
              json!({
                  "sub": "f:1:demo.steward",
                  "preferred_username": "demo.steward",
                  "email": "demo.steward@hel.fi",
                  "name": "Demo Steward",
              })
              .to_string(),
          );
          let builder = Request::builder()
              .method(method)
              .uri(path)
              .header("x-access-token", TOKEN)
              .header("x-userinfo", userinfo);
          match body {
              Some(body) => builder
                  .header("content-type", "application/json")
                  .body(Body::from(body.to_string()))
                  .expect("a request"),
              None => builder.body(Body::empty()).expect("a request"),
          }
      }

      fn anonymous(method: &str, path: &str, body: Option<Value>) -> Request<Body> {
          let builder = Request::builder().method(method).uri(path);
          match body {
              Some(body) => builder
                  .header("content-type", "application/json")
                  .body(Body::from(body.to_string()))
                  .expect("a request"),
              None => builder.body(Body::empty()).expect("a request"),
          }
      }

      async fn call(app: axum::Router, request: Request<Body>) -> (StatusCode, String) {
          let response = app.oneshot(request).await.expect("the app answers");
          let status = response.status();
          let body = response
              .into_body()
              .collect()
              .await
              .expect("a readable body")
              .to_bytes();
          (status, String::from_utf8_lossy(&body).into_owned())
      }

      /// Mocks the Portal's `/me`, which answers the caller's roles in the App (AP-109).
      async fn roles(endpoint: &MockServer, roles: &[&str]) {
          Mock::given(method("GET"))
              .and(path("/me"))
              .and(header("authorization", format!("Bearer {TOKEN}").as_str()))
              .respond_with(ResponseTemplate::new(200).set_body_json(json!({
                  "id": "f:1:demo.steward", "name": "Demo Steward", "roles": roles,
              })))
              .mount(endpoint)
              .await;
      }

      /// Nothing left the pod: the check this app makes before it forwards anything.
      async fn untouched(endpoint: &MockServer) -> bool {
          endpoint
              .received_requests()
              .await
              .is_some_and(|requests| requests.is_empty())
      }

      #[tokio::test]
      async fn the_station_list_is_read_with_the_users_own_token_and_flattened_for_the_browser() {
          let endpoint = MockServer::start().await;
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .and(query_param("type", "AirQualityObserved"))
              .and(header("authorization", format!("Bearer {TOKEN}").as_str()))
              .respond_with(ResponseTemplate::new(200).set_body_json(json!([entity()])))
              .expect(1)
              .mount(&endpoint)
              .await;

          let (status, body) = call(
              app_at(&endpoint),
              signed_in("GET", &format!("{BASE}api/stations"), None),
          )
          .await;

          assert_eq!(status, StatusCode::OK, "{body}");
          let stations: Value = serde_json::from_str(&body).expect("a list");
          assert_eq!(stations[0]["id"], json!(STATION));
          assert_eq!(stations[0]["pm10"], json!(34.2));
          assert_eq!(stations[0]["coordinates"], json!([19.146, 48.736]));
          assert_eq!(stations[0]["name"], json!("Kallio"));
          assert_eq!(
              stations[0]["names"],
              json!({ "fi": "Kallio 2", "en": "Kallio" })
          );
          // No `source`: a station a steward added, which the page offers to remove.
          assert_eq!(stations[0]["own"], json!(true));
      }

      /// AP-40, the property this whole app exists to demonstrate. Without `X-Access-Token` there is
      /// no write of any kind, and no second attempt without one either.
      #[tokio::test]
      async fn a_write_without_an_access_token_is_401_and_never_reaches_the_endpoint() {
          for (verb, uri, body) in [
              (
                  "POST",
                  format!("{BASE}api/stations"),
                  Some(json!({ "localId": "s9", "name": { "fi": "Uusi" }, "coordinates": [24.9, 60.2] })),
              ),
              (
                  "PATCH",
                  format!("{BASE}api/stations/{STATION}"),
                  Some(json!({ "stewardNote": "Sensor cleaned." })),
              ),
              ("DELETE", format!("{BASE}api/stations/{STATION}"), None),
          ] {
              let endpoint = MockServer::start().await;
              let (status, body) = call(app_at(&endpoint), anonymous(verb, &uri, body)).await;
              assert_eq!(status, StatusCode::UNAUTHORIZED, "{verb}: {body}");
              assert!(body.contains("signed-in"), "{body}");
              assert!(
                  untouched(&endpoint).await,
                  "{verb}: the app must not ask the endpoint on the caller's behalf"
              );
          }
      }

      /// AP-62: a correction is one PATCH of exactly the attributes the form sent, with the user's
      /// token and nothing of the app's own.
      #[tokio::test]
      async fn a_correction_is_one_patch_of_the_sent_attributes_with_the_forwarded_token() {
          let endpoint = MockServer::start().await;
          Mock::given(method("PATCH"))
              .and(path(format!("/ngsi-ld/v1/entities/{STATION}/attrs")))
              .and(header("authorization", format!("Bearer {TOKEN}").as_str()))
              .and(body_json(json!({
                  "name": { "type": "LanguageProperty", "languageMap": { "en": "Kallio", "fi": "Kallio" } },
                  "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [24.95, 60.18] } },
                  "stewardNote": { "type": "Property", "value": "Sensor cleaned." },
              })))
              .respond_with(ResponseTemplate::new(204))
              .expect(1)
              .mount(&endpoint)
              .await;

          let (status, body) = call(
              app_at(&endpoint),
              signed_in(
                  "PATCH",
                  &format!("{BASE}api/stations/{STATION}"),
                  Some(json!({
                      // An empty language is left out rather than written as "".
                      "name": { "fi": " Kallio ", "en": "Kallio", "sv": "" },
                      "coordinates": [24.95, 60.18],
                      "stewardNote": "  Sensor cleaned.  ",
                  })),
              ),
          )
          .await;

          assert_eq!(status, StatusCode::NO_CONTENT, "{body}");
      }

      /// Measured values are never writable: the form's body has no field for them, and one sent
      /// anyway is refused before anything leaves the pod.
      #[tokio::test]
      async fn a_measured_value_or_the_source_is_refused_by_the_app() {
          for field in [
              "pm10",
              "pm25",
              "airQualityIndex",
              "dateObserved",
              "source",
              "id",
          ] {
              let endpoint = MockServer::start().await;
              let (status, body) = call(
                  app_at(&endpoint),
                  signed_in(
                      "PATCH",
                      &format!("{BASE}api/stations/{STATION}"),
                      Some(json!({ field: 1, "stewardNote": "x" })),
                  ),
              )
              .await;
              assert!(status.is_client_error(), "{field}: {status} {body}");
              assert!(untouched(&endpoint).await, "{field} reached the endpoint");
          }
      }

      /// What the app refuses itself, each before a request leaves the pod.
      #[tokio::test]
      async fn an_invalid_field_is_refused_by_the_app_and_not_by_the_broker() {
          for (verb, uri, sent) in [
              (
                  "PATCH",
                  format!("{BASE}api/stations/{STATION}"),
                  json!({ "stewardNote": "   " }),
              ),
              (
                  "PATCH",
                  format!("{BASE}api/stations/{STATION}"),
                  json!({ "stewardNote": "x".repeat(501) }),
              ),
              ("PATCH", format!("{BASE}api/stations/{STATION}"), json!({})),
              (
                  "PATCH",
                  format!("{BASE}api/stations/{STATION}"),
                  json!({ "name": { "fi": "  " } }),
              ),
              (
                  "PATCH",
                  format!("{BASE}api/stations/{STATION}"),
                  json!({ "name": { "FI; x": "Kallio" } }),
              ),
              (
                  "PATCH",
                  format!("{BASE}api/stations/{STATION}"),
                  json!({ "coordinates": [181.0, 60.0] }),
              ),
              (
                  "PATCH",
                  format!("{BASE}api/stations/{STATION}"),
                  json!({ "coordinates": [24.9, -91.0] }),
              ),
              (
                  "PATCH",
                  format!("{BASE}api/stations/{STATION}"),
                  json!({ "localId": "other" }),
              ),
              (
                  "POST",
                  format!("{BASE}api/stations"),
                  json!({ "localId": "../x", "name": { "fi": "A" }, "coordinates": [24.9, 60.2] }),
              ),
              (
                  "POST",
                  format!("{BASE}api/stations"),
                  json!({ "localId": "", "name": { "fi": "A" }, "coordinates": [24.9, 60.2] }),
              ),
              (
                  "POST",
                  format!("{BASE}api/stations"),
                  json!({ "localId": "s9", "coordinates": [24.9, 60.2] }),
              ),
              (
                  "POST",
                  format!("{BASE}api/stations"),
                  json!({ "localId": "s9", "name": { "fi": "A" } }),
              ),
          ] {
              let endpoint = MockServer::start().await;
              let (status, body) =
                  call(app_at(&endpoint), signed_in(verb, &uri, Some(sent.clone()))).await;
              assert_eq!(status, StatusCode::BAD_REQUEST, "{sent}: {body}");
              assert!(untouched(&endpoint).await, "{sent} reached the endpoint");
          }
      }

      /// A new station is one POST under the organization and space of the stations the endpoint
      /// already serves, with the id the steward chose as its last segment.
      #[tokio::test]
      async fn a_new_station_is_one_post_under_the_spaces_own_id_prefix() {
          let endpoint = MockServer::start().await;
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .and(query_param("limit", "1"))
              .respond_with(ResponseTemplate::new(200).set_body_json(json!([entity()])))
              .mount(&endpoint)
              .await;
          let id = "urn:ngsi-ld:AirQualityObserved:hel.fi:air-quality:kumpula-2";
          Mock::given(method("POST"))
              .and(path("/ngsi-ld/v1/entities"))
              .and(header("authorization", format!("Bearer {TOKEN}").as_str()))
              .and(body_json(json!({
                  "id": id,
                  "type": "AirQualityObserved",
                  "name": { "type": "LanguageProperty", "languageMap": { "fi": "Kumpula" } },
                  "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [24.96, 60.2] } },
              })))
              .respond_with(ResponseTemplate::new(201))
              .expect(1)
              .mount(&endpoint)
              .await;

          let (status, body) = call(
              app_at(&endpoint),
              signed_in(
                  "POST",
                  &format!("{BASE}api/stations"),
                  Some(json!({ "localId": "kumpula-2", "name": { "fi": "Kumpula" }, "coordinates": [24.96, 60.2] })),
              ),
          )
          .await;

          assert_eq!(status, StatusCode::CREATED, "{body}");
          assert_eq!(
              serde_json::from_str::<Value>(&body).expect("json")["id"],
              json!(id)
          );
      }

      /// With no station to read the prefix from the app says so, and guesses no id.
      #[tokio::test]
      async fn a_new_station_in_an_empty_space_is_409_and_writes_nothing() {
          let endpoint = MockServer::start().await;
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .respond_with(ResponseTemplate::new(200).set_body_json(json!([])))
              .mount(&endpoint)
              .await;

          let (status, body) = call(
              app_at(&endpoint),
              signed_in(
                  "POST",
                  &format!("{BASE}api/stations"),
                  Some(json!({ "localId": "s9", "name": { "fi": "A" }, "coordinates": [24.9, 60.2] })),
              ),
          )
          .await;

          assert_eq!(status, StatusCode::CONFLICT, "{body}");
          let requests = endpoint.received_requests().await.expect("recorded");
          assert!(requests
              .iter()
              .all(|request| request.method.as_str() == "GET"));
      }

      /// A removal is one DELETE with the user's token; which station may go is the gateway's call.
      #[tokio::test]
      async fn a_removal_is_one_delete_with_the_forwarded_token() {
          let endpoint = MockServer::start().await;
          Mock::given(method("DELETE"))
              .and(path(format!("/ngsi-ld/v1/entities/{STATION}")))
              .and(header("authorization", format!("Bearer {TOKEN}").as_str()))
              .respond_with(ResponseTemplate::new(204))
              .expect(1)
              .mount(&endpoint)
              .await;

          let (status, body) = call(
              app_at(&endpoint),
              signed_in("DELETE", &format!("{BASE}api/stations/{STATION}"), None),
          )
          .await;

          assert_eq!(status, StatusCode::NO_CONTENT, "{body}");
      }

      /// GW10, AP-40: the gateway refuses a signed-in viewer, and the app repeats the refusal rather
      /// than paraphrasing it, for every kind of write.
      #[tokio::test]
      async fn the_endpoints_refusal_reaches_the_browser_word_for_word() {
          let problem = json!({
              "type": "https://joinedcontext.com/errors/forbidden",
              "title": "Forbidden",
              "status": 403,
              "detail": "updateAttrs on AirQualityObserved needs the steward role",
          });
          for (verb, upstream, body) in [
              (
                  "PATCH",
                  format!("/ngsi-ld/v1/entities/{STATION}/attrs"),
                  Some(json!({ "stewardNote": "x" })),
              ),
              ("DELETE", format!("/ngsi-ld/v1/entities/{STATION}"), None),
          ] {
              let endpoint = MockServer::start().await;
              Mock::given(method(verb))
                  .and(path(upstream))
                  .respond_with(
                      ResponseTemplate::new(403)
                          .set_body_json(problem.clone())
                          .insert_header("content-type", "application/problem+json"),
                  )
                  .mount(&endpoint)
                  .await;

              let (status, shown) = call(
                  app_at(&endpoint),
                  signed_in(verb, &format!("{BASE}api/stations/{STATION}"), body),
              )
              .await;

              assert_eq!(status, StatusCode::FORBIDDEN, "{verb}");
              assert_eq!(
                  serde_json::from_str::<Value>(&shown).expect("a problem"),
                  problem
              );
          }
      }

      /// AP-109: the roles come from the Portal's `/me`, asked with the forwarded token, and the
      /// identity from the edge.
      #[tokio::test]
      async fn the_roles_come_from_the_portal_and_the_identity_from_the_edge() {
          let endpoint = MockServer::start().await;
          roles(&endpoint, &["steward"]).await;

          let (status, body) = call(
              app_at(&endpoint),
              signed_in("GET", &format!("{BASE}api/me"), None),
          )
          .await;

          assert_eq!(status, StatusCode::OK, "{body}");
          let me: Value = serde_json::from_str(&body).expect("an identity");
          assert_eq!(me["signedIn"], json!(true));
          assert_eq!(me["email"], json!("demo.steward@hel.fi"));
          assert_eq!(me["user"], json!("demo.steward"));
          assert_eq!(me["roles"], json!(["steward"]));
      }

      /// The pod's readiness probe: at the root, outside the base path, and never a data call.
      #[tokio::test]
      async fn the_readiness_probe_answers_at_the_root() {
          let endpoint = MockServer::start().await;
          let (status, body) = call(app_at(&endpoint), anonymous("GET", "/healthz", None)).await;
          assert_eq!(status, StatusCode::OK);
          assert_eq!(body, "ok");
          assert!(untouched(&endpoint).await);
      }

      /// AP-67, AP-126: the front page carries the reconciler's `JC_APP_CONFIG` as `#jc-config`, so
      /// the map finds the project's basemap; a value that spells `</script>` cannot end the element.
      #[tokio::test]
      async fn the_front_page_carries_the_reconcilers_configuration_with_its_basemap() {
          let endpoint = MockServer::start().await;
          let basemap = "https://portal.hel.fi/api/v1/projects/hel/basemap/default/style.json";
          let raw =
              json!({ "slug": "s", "appName": "</script><script>alert(1)</script>", "basemap": basemap });
          let app = router(Arc::new(App::new(Config {
              base_path: BASE.to_owned(),
              endpoint_url: format!("{}/", endpoint.uri()),
              anonymous: true,
              me_url: None,
              page_config: Some(air_quality::page_config(&raw.to_string()).expect("an object")),
          })));

          let (status, page) = call(app, anonymous("GET", BASE, None)).await;
          assert_eq!(status, StatusCode::OK);
          let open = r#"<script id="jc-config" type="application/json">"#;
          let start = page.find(open).expect("the page carries #jc-config") + open.len();
          let end = start
              + page[start..]
                  .find("</script>")
                  .expect("the element is closed");
          let config: Value = serde_json::from_str(&page[start..end]).expect("the element holds JSON");
          assert_eq!(config["basemap"], basemap);
          assert_eq!(
              config["appName"], raw["appName"],
              "read back as it was handed over"
          );
          assert!(untouched(&endpoint).await);

          // Without one the page is served as built.
          let (_, plain) = call(app_at(&endpoint), anonymous("GET", BASE, None)).await;
          assert!(!plain.contains("jc-config"), "{plain}");
      }

      #[test]
      fn a_configuration_that_is_not_one_json_object_is_refused() {
          for raw in ["not json", "[1]", "\"basemap\""] {
              assert!(air_quality::page_config(raw).is_err(), "{raw} was accepted");
          }
      }

      /// A userinfo header that is not base64 JSON is nobody, not an error: the token still decides.
      #[tokio::test]
      async fn an_unreadable_userinfo_is_no_identity() {
          let endpoint = MockServer::start().await;
          roles(&endpoint, &[]).await;
          let request = Request::builder()
              .method("GET")
              .uri(format!("{BASE}api/me"))
              .header("x-access-token", TOKEN)
              .header("x-userinfo", "not base64 at all")
              .body(Body::empty())
              .expect("a request");

          let (status, body) = call(app_at(&endpoint), request).await;
          assert_eq!(status, StatusCode::OK, "{body}");
          let me: Value = serde_json::from_str(&body).expect("an identity");
          assert_eq!(me["signedIn"], json!(true));
          assert_eq!(me["email"], json!(null));
          assert_eq!(me["user"], json!(null));
      }

      /// A viewer holds a role and still gets no form; a Portal that cannot answer means no role
      /// (fail closed).
      #[tokio::test]
      async fn a_viewer_or_an_unanswered_me_holds_no_steward_role() {
          let endpoint = MockServer::start().await;
          roles(&endpoint, &["viewer"]).await;
          let (_, body) = call(
              app_at(&endpoint),
              signed_in("GET", &format!("{BASE}api/me"), None),
          )
          .await;
          let me: Value = serde_json::from_str(&body).expect("an identity");
          assert_eq!(me["roles"], json!(["viewer"]));

          let down = MockServer::start().await;
          Mock::given(method("GET"))
              .and(path("/me"))
              .respond_with(ResponseTemplate::new(503))
              .mount(&down)
              .await;
          let (_, body) = call(
              app_at(&down),
              signed_in("GET", &format!("{BASE}api/me"), None),
          )
          .await;
          let me: Value = serde_json::from_str(&body).expect("an identity");
          assert_eq!(me["signedIn"], json!(true));
          assert_eq!(me["roles"], json!([]));
      }

      /// An anonymous reader never even asks: no token, no roles, no round trip.
      #[tokio::test]
      async fn an_anonymous_reader_asks_the_portal_nothing() {
          let endpoint = MockServer::start().await;

          let (_, body) = call(
              app_at(&endpoint),
              anonymous("GET", &format!("{BASE}api/me"), None),
          )
          .await;

          let me: Value = serde_json::from_str(&body).expect("an identity");
          assert_eq!(me["signedIn"], json!(false));
          assert_eq!(me["roles"], json!([]));
          assert!(untouched(&endpoint).await);
      }

      /// An id is a path segment upstream, so a caller cannot use it to reach another URL.
      #[tokio::test]
      async fn an_id_that_is_not_a_urn_is_refused_before_anything_leaves_the_pod() {
          let endpoint = MockServer::start().await;

          let (status, _) = call(
              app_at(&endpoint),
              signed_in(
                  "PATCH",
                  &format!("{BASE}api/stations/urn:ngsi-ld:x%2f..%2f..%2fadmin"),
                  Some(json!({ "stewardNote": "hello" })),
              ),
          )
          .await;

          assert_eq!(status, StatusCode::BAD_REQUEST);
          assert!(untouched(&endpoint).await);
      }

      #[tokio::test]
      async fn the_history_asks_the_temporal_surface_for_the_last_day() {
          let endpoint = MockServer::start().await;
          Mock::given(method("GET"))
              .and(path(format!("/ngsi-ld/v1/temporal/entities/{STATION}")))
              .and(query_param("timerel", "after"))
              .and(query_param("attrs", "pm10,pm25"))
              .respond_with(ResponseTemplate::new(200).set_body_json(json!({ "id": STATION })))
              .expect(1)
              .mount(&endpoint)
              .await;

          let (status, body) = call(
              app_at(&endpoint),
              signed_in(
                  "GET",
                  &format!("{BASE}api/stations/{STATION}/history"),
                  None,
              ),
          )
          .await;

          assert_eq!(status, StatusCode::OK, "{body}");
      }

      /// The app lives under its base path and owns nothing above it: the edge routes one prefix,
      /// and a request outside it is not this app's to answer.
      #[tokio::test]
      async fn nothing_is_served_above_the_apps_own_base_path() {
          let endpoint = MockServer::start().await;
          let (status, _) = call(app_at(&endpoint), anonymous("GET", "/api/stations", None)).await;
          assert_eq!(status, StatusCode::NOT_FOUND);

          for front in [BASE, BASE.trim_end_matches('/')] {
              let (status, body) = call(app_at(&endpoint), anonymous("GET", front, None)).await;
              assert_eq!(status, StatusCode::OK, "{front}");
              assert!(body.contains("<!doctype html>"), "{body}");
          }
      }

      /// T-2909: on its own host the base path is `/`; the router must build there (it panicked at
      /// start on dev with an empty route) and serve the station list under it.
      #[tokio::test]
      async fn the_app_starts_on_its_own_host_at_the_root() {
          let endpoint = MockServer::start().await;
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .respond_with(ResponseTemplate::new(200).set_body_json(json!([entity()])))
              .mount(&endpoint)
              .await;
          let app = router(Arc::new(App::new(Config {
              base_path: "/".to_owned(),
              endpoint_url: format!("{}/", endpoint.uri()),
              anonymous: false,
              me_url: Some(format!("{}/me", endpoint.uri())),
              page_config: None,
          })));
          let (status, _) = call(
              app.clone(),
              Request::builder()
                  .uri("/healthz")
                  .body(Body::empty())
                  .unwrap(),
          )
          .await;
          assert_eq!(status, StatusCode::OK);
          let (status, body) = call(app, signed_in("GET", "/api/stations", None)).await;
          assert_eq!(status, StatusCode::OK, "{body}");
      }

      /// T-3374: the configuration a pod is started with, read without the process's environment.
      #[test]
      fn the_configuration_is_read_from_the_pods_variables() {
          let vars = |pairs: &'static [(&'static str, &'static str)]| {
              move |name: &str| {
                  pairs
                      .iter()
                      .find(|(key, _)| *key == name)
                      .map(|(_, value)| (*value).to_owned())
              }
          };
          assert_eq!(
              Config::from_vars(vars(&[])).err().as_deref(),
              Some("JC_ENDPOINT_URL is not set")
          );
          let plain = Config::from_vars(vars(&[("JC_ENDPOINT_URL", "https://h/api/endpoint/air")]))
              .expect("a configuration");
          assert_eq!(plain.endpoint_url, "https://h/api/endpoint/air/");
          assert_eq!(plain.base_path, "/");
          assert!(!plain.anonymous);
          assert_eq!(plain.me_url, None);
          assert_eq!(plain.page_config, None);

          let full = Config::from_vars(vars(&[
              ("JC_ENDPOINT_URL", "https://h/api/endpoint/air/"),
              ("JC_BASE_PATH", BASE),
              ("JC_ANONYMOUS", "true"),
              ("JC_ME_URL", ""),
              ("JC_APP_CONFIG", r#"{"basemap":"https://h/style.json"}"#),
          ]))
          .expect("a configuration");
          assert_eq!(full.endpoint_url, "https://h/api/endpoint/air/");
          assert_eq!(full.base_path, BASE);
          assert!(full.anonymous);
          assert_eq!(full.me_url, None, "an empty /me URL is none");
          assert!(full
              .page_config
              .expect("the page config")
              .contains("basemap"));

          let blank = Config::from_vars(vars(&[
              ("JC_ENDPOINT_URL", "https://h/"),
              ("JC_APP_CONFIG", "  "),
          ]))
          .expect("a configuration");
          assert_eq!(blank.page_config, None);
          assert!(Config::from_vars(vars(&[
              ("JC_ENDPOINT_URL", "https://h/"),
              ("JC_APP_CONFIG", "[1]")
          ]))
          .is_err());
          assert!(
              !Config::from_vars(vars(&[
                  ("JC_ENDPOINT_URL", "https://h/"),
                  ("JC_ANONYMOUS", "yes")
              ]))
              .expect("a configuration")
              .anonymous
          );
      }

      /// A file the bundle does not have is a 404; a path without an extension is a page of the App.
      #[tokio::test]
      async fn a_missing_file_is_404_and_a_client_route_is_the_front_page() {
          let endpoint = MockServer::start().await;
          let (status, _) = call(
              app_at(&endpoint),
              anonymous("GET", &format!("{BASE}assets/missing-1a2b.js"), None),
          )
          .await;
          assert_eq!(status, StatusCode::NOT_FOUND);
          let (status, body) = call(
              app_at(&endpoint),
              anonymous("GET", &format!("{BASE}stations/kallio"), None),
          )
          .await;
          assert_eq!(status, StatusCode::OK);
          assert!(body.contains("<!doctype html>"), "{body}");
      }

      /// An endpoint that does not answer is a 502 the browser can say, not a hang or a panic.
      #[tokio::test]
      async fn an_endpoint_that_does_not_answer_is_a_502() {
          let closed = {
              let listener = std::net::TcpListener::bind("127.0.0.1:0").expect("a free port");
              listener.local_addr().expect("its address")
          };
          let app = router(Arc::new(App::new(Config {
              base_path: BASE.to_owned(),
              endpoint_url: format!("http://{closed}/"),
              anonymous: false,
              me_url: Some(format!("http://{closed}/me")),
              page_config: None,
          })));
          let (status, body) = call(
              app.clone(),
              signed_in("GET", &format!("{BASE}api/stations"), None),
          )
          .await;
          assert_eq!(status, StatusCode::BAD_GATEWAY);
          assert!(body.contains("the endpoint did not answer"), "{body}");
          // Nobody could be asked for the roles: the identity holds none (fail closed).
          let (status, body) = call(app, signed_in("GET", &format!("{BASE}api/me"), None)).await;
          assert_eq!(status, StatusCode::OK);
          assert!(body.contains(r#""roles":[]"#), "{body}");
      }

      /// A read the endpoint refuses, or answers with something that is not JSON, reaches the browser
      /// as the refusal or a 502; a station's day under a bad id never leaves the pod.
      #[tokio::test]
      async fn a_refused_or_garbled_read_and_a_bad_history_id() {
          let endpoint = MockServer::start().await;
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .respond_with(
                  ResponseTemplate::new(403).set_body_json(json!({ "detail": "outside the grant" })),
              )
              .mount(&endpoint)
              .await;
          Mock::given(method("GET"))
              .and(path(format!("/ngsi-ld/v1/temporal/entities/{STATION}")))
              .respond_with(ResponseTemplate::new(200).set_body_string("<html>not json</html>"))
              .mount(&endpoint)
              .await;
          let (status, body) = call(
              app_at(&endpoint),
              signed_in("GET", &format!("{BASE}api/stations"), None),
          )
          .await;
          assert_eq!(status, StatusCode::FORBIDDEN);
          assert!(body.contains("outside the grant"), "{body}");
          let encoded = STATION.replace(':', "%3A");
          let (status, _) = call(
              app_at(&endpoint),
              signed_in(
                  "GET",
                  &format!("{BASE}api/stations/{encoded}/history"),
                  None,
              ),
          )
          .await;
          assert_eq!(status, StatusCode::BAD_GATEWAY);
          let before = endpoint.received_requests().await.unwrap_or_default().len();
          let (status, body) = call(
              app_at(&endpoint),
              signed_in(
                  "GET",
                  &format!("{BASE}api/stations/not-a-urn/history"),
                  None,
              ),
          )
          .await;
          assert_eq!(status, StatusCode::BAD_REQUEST);
          assert!(body.contains("NGSI-LD URN"), "{body}");
          assert_eq!(
              endpoint.received_requests().await.unwrap_or_default().len(),
              before
          );
      }

      /// The roles are none when `/me` refuses; a name over 200 characters and a removal under a bad id
      /// are refused by the App.
      #[tokio::test]
      async fn a_refused_me_a_long_name_and_a_bad_removal_id() {
          let endpoint = MockServer::start().await;
          Mock::given(method("GET"))
              .and(path("/me"))
              .respond_with(ResponseTemplate::new(500))
              .mount(&endpoint)
              .await;
          let (status, body) = call(
              app_at(&endpoint),
              signed_in("GET", &format!("{BASE}api/me"), None),
          )
          .await;
          assert_eq!(status, StatusCode::OK);
          assert!(body.contains(r#""roles":[]"#), "{body}");

          let encoded = STATION.replace(':', "%3A");
          let long = "x".repeat(201);
          let (status, body) = call(
              app_at(&endpoint),
              signed_in(
                  "PATCH",
                  &format!("{BASE}api/stations/{encoded}"),
                  Some(json!({ "name": { "fi": long } })),
              ),
          )
          .await;
          assert_eq!(status, StatusCode::BAD_REQUEST);
          assert!(body.contains("at most 200 characters"), "{body}");
          let (status, body) = call(
              app_at(&endpoint),
              signed_in("DELETE", &format!("{BASE}api/stations/not-a-urn"), None),
          )
          .await;
          assert_eq!(status, StatusCode::BAD_REQUEST);
          assert!(body.contains("NGSI-LD URN"), "{body}");
          assert!(untouched_writes(&endpoint).await);
      }

      async fn untouched_writes(endpoint: &MockServer) -> bool {
          endpoint
              .received_requests()
              .await
              .unwrap_or_default()
              .iter()
              .all(|request| request.method.as_str() == "GET")
      }

      /// The process's own environment goes through the same parsing: without an endpoint, no start.
      #[test]
      fn the_pod_does_not_start_without_its_endpoint() {
          assert_eq!(
              Config::from_env().is_ok(),
              std::env::var("JC_ENDPOINT_URL").is_ok()
          );
      }

      /// An id prefix the listing hands back that is not a station's is never written under.
      #[tokio::test]
      async fn a_new_station_is_not_written_under_another_types_prefix() {
          let endpoint = MockServer::start().await;
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .respond_with(
                  ResponseTemplate::new(200).set_body_json(
                      json!([{ "id": "urn:ngsi-ld:Other:hel.fi:x:one", "type": "Other" }]),
                  ),
              )
              .mount(&endpoint)
              .await;
          let (status, body) = call(
              app_at(&endpoint),
              signed_in(
                  "POST",
                  &format!("{BASE}api/stations"),
                  Some(json!({ "localId": "s9", "name": { "fi": "A" }, "coordinates": [24.9, 60.2] })),
              ),
          )
          .await;
          assert_eq!(status, StatusCode::BAD_GATEWAY, "{body}");
          assert!(untouched_writes(&endpoint).await);
      }
    ui__e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { LIVE_BLOCKS, WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";

      // UI-84, SDK-12 (T-2825): the stations as an anonymous reader sees them and with a steward's
      // form, through the real binary, at a phone, a tablet, a laptop and a wall: no sideways scroll, no
      // two blocks over each other, no control cut off, nothing axe finds at WCAG 2.1 AA.
      const BASE = "/apps/air-quality/";

      /** The headers the edge puts in front of the app for a signed-in person (AP-28, ADR-N-019). */
      const edge = (who: string) => ({
        "x-access-token": `token-for-${who}`,
        "x-userinfo": Buffer.from(
          JSON.stringify({ sub: `f:1:demo.${who}`, preferred_username: `demo.${who}@hel.fi`, email: `demo.${who}@hel.fi` }),
        ).toString("base64"),
      });

      // The page follows the reader's colour scheme, so a steward's view is checked in both.
      const VIEWS = [
        { who: "an anonymous reader", scheme: "light" },
        { who: "a steward", scheme: "light" },
        { who: "a steward", scheme: "dark" },
      ] as const;

      for (const { who, scheme } of VIEWS) {
        for (const size of WIDTHS) {
          test(`the stations for ${who}, ${scheme}, at ${size.width} px: no sideways scroll, no overlap, axe clean`, async ({ page }, testInfo) => {
            const problems: string[] = [];
            page.on("pageerror", (error) => problems.push(error.message));
            await page.emulateMedia({ colorScheme: scheme });
            if (who === "a steward") await page.setExtraHTTPHeaders(edge("steward"));
            await page.setViewportSize(size);
            await page.goto(BASE);
            await expect(page.getByRole("heading", { name: "Kallio", exact: true })).toBeVisible();
            if (who === "a steward") {
              await expect(page.getByRole("form", { name: "New station" })).toBeVisible();
              await page.getByRole("button", { name: "Edit Kallio" }).click();
              await expect(page.getByRole("form", { name: "Edit Kallio" })).toBeVisible();
            }
            await testInfo.attach(`${who}-${scheme}-${size.width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page, LIVE_BLOCKS)).toEqual([]);
            expect(problems).toEqual([]);
          });
        }
      }

      // T-3374, SDK-40: a station opened in the SDK's entity panel, at a phone and a laptop, light and
      // dark; a steward corrects the note there, which goes through the App's backend.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`a station in the entity panel, ${scheme}, at ${width} px: opened, edited by a steward, axe clean`, async ({ page }) => {
            const problems: string[] = [];
            page.on("pageerror", (error) => problems.push(error.message));
            await page.emulateMedia({ colorScheme: scheme });
            await page.setExtraHTTPHeaders(edge("steward"));
            await page.setViewportSize({ width, height: 900 });
            await page.goto(BASE);
            await page.getByRole("button", { name: "Details of Kallio" }).click();
            const panel = page.getByRole("dialog", { name: "Kallio" });
            await expect(panel.getByText("PM10 (µg/m³)")).toBeVisible();
            expect(await layoutProblems(page, LIVE_BLOCKS)).toEqual([]);

            await panel.getByRole("button", { name: "Edit" }).click();
            await panel.getByLabel("Steward note").fill(`Checked at ${width} px.`);
            await panel.getByRole("button", { name: "Review the change" }).click();
            await panel.getByRole("button", { name: "Save the change" }).click();
            await expect(page.getByText(`Note: Checked at ${width} px.`)).toBeVisible();
            await panel.getByRole("button", { name: "Close" }).click();
            await expect(page.getByRole("dialog")).toHaveCount(0);
            expect(problems).toEqual([]);
          });
        }
      }
