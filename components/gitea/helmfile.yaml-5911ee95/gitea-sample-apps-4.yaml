    ui__src__panel.ts: |
      import { ProblemError } from "@joinedcontext/sdk";
      import type { PanelSource, Row, Schema } from "@joinedcontext/sdk";
      import { ApiError, getStations, updateStation } from "./api";
      import type { Identity, Station } from "./api";

      /** The type every station of this App is (the `helsinki` model). */
      export const STATION_TYPE = "AirQualityObserved";

      /**
       * What the entity panel shows of a station and how it names each part (SDK-40). The note is the
       * one attribute a steward corrects in the panel: one to 500 characters, as the backend checks, so
       * it is required; the name per language and the position stay with the record form.
       */
      export const SCHEMA = {
        [STATION_TYPE]: {
          properties: {
            name: { type: "string", title: "Name" },
            pm10: { type: "number", title: "PM10 (µg/m³)" },
            pm25: { type: "number", title: "PM2.5 (µg/m³)" },
            airQualityIndex: { type: "number", title: "Air quality index" },
            dateObserved: { type: "string", title: "Measured" },
            stewardNote: { type: "string", title: "Steward note" },
          },
          required: ["stewardNote"],
        },
      } satisfies Schema;

      /** A station as the panel lists it: only what the backend answered, nothing invented. */
      export function rowOf(station: Station): Row {
        const row: Row = { id: station.id, type: STATION_TYPE };
        if (station.name !== undefined) row.name = station.name;
        if (station.pm10 !== undefined) row.pm10 = station.pm10;
        if (station.pm25 !== undefined) row.pm25 = station.pm25;
        if (station.airQualityIndex !== undefined) row.airQualityIndex = station.airQualityIndex;
        if (station.observedAt !== undefined) row.dateObserved = station.observedAt;
        if (station.stewardNote !== undefined) row.stewardNote = station.stewardNote;
        return row;
      }

      /**
       * The station's page in the Portal, for a reader who may not change it here. An App is served
       * on `{name}.apps.{domain}` (AP-133) and the Portal on `portal.{domain}`; on any other host (a
       * preview, a test) there is no link rather than a guessed one.
       */
      export function portalLinkOf(hostname: string, id: string): string | null {
        const match = /^[a-z0-9-]+\.apps\.([a-z0-9.-]+)$/.exec(hostname);
        if (!match) return null;
        return `https://portal.${match[1]}/projects/helsinki/explore?space=helsinki&entityId=${encodeURIComponent(id)}`;
      }

      function asProblem(cause: unknown): ProblemError {
        if (cause instanceof ApiError) return new ProblemError(cause.status, { title: cause.detail });
        return new ProblemError(0, { title: cause instanceof Error ? cause.message : String(cause) });
      }

      /**
       * The panel's source: this App's own backend, which holds the endpoint (AP-04). A steward may
       * change the note; everyone else reads, and is linked to the Portal. `onChanged` reloads the page.
       */
      export function stationSource(identity: Identity | null, onChanged: () => void, hostname = window.location.hostname): PanelSource {
        const steward = identity?.roles.includes("steward") ?? false;
        return {
          async get(entity) {
            let stations: Station[];
            try {
              stations = await getStations();
            } catch (cause) {
              throw asProblem(cause);
            }
            const found = stations.find((station) => station.id === entity.id);
            if (!found) throw new ProblemError(404, { title: "This station is no longer there." });
            return rowOf(found);
          },
          async update(entity, patch) {
            const note = patch.stewardNote;
            if (typeof note !== "string" || Object.keys(patch).some((name) => name !== "stewardNote")) {
              throw new ProblemError(400, { title: "Only the steward note is changed here." });
            }
            try {
              await updateStation(entity.id, { stewardNote: note });
            } catch (cause) {
              throw asProblem(cause);
            }
            onChanged();
          },
          mayEdit: (type, attr) => steward && type === STATION_TYPE && (attr === undefined || attr === "stewardNote"),
          portalLink: (entity) => (steward ? null : portalLinkOf(hostname, entity.id)),
          schema: SCHEMA,
          language: "en",
        };
      }
    ui__src__quality.ts: |
      /**
       * What a reading means, as pure functions over what the backend answered (T-2925): the index
       * band a station is drawn in, and one day of PM10 and PM2.5 as points a chart can draw. Tested
       * without a map, a browser or a network.
       */
      import type { Station } from "./api";

      /**
       * The Finnish Meteorological Institute's hourly air quality index (`AQINDEX_PT1H_avg`), which the
       * helsinki pipeline stores as `airQualityIndex`: 1 good … 5 very poor. `unknown` when a station
       * sends no index, never "good": a missing number is not clean air.
       */
      export type Band = "good" | "satisfactory" | "fair" | "poor" | "veryPoor" | "unknown";

      export const BANDS: Exclude<Band, "unknown">[] = ["good", "satisfactory", "fair", "poor", "veryPoor"];

      export const BAND_LABEL: Record<Band, string> = {
        good: "Good",
        satisfactory: "Satisfactory",
        fair: "Fair",
        poor: "Poor",
        veryPoor: "Very poor",
        unknown: "No index",
      };

      /** The index scale's own colours, green to purple; the legend repeats each band in words (UI-30). */
      export const BAND_COLOUR: Record<Band, string> = {
        good: "#1a9850",
        satisfactory: "#91cf60",
        fair: "#fdae61",
        poor: "#d73027",
        veryPoor: "#762a83",
        unknown: "#8c8c8c",
      };

      export function bandOf(index: number | undefined): Band {
        if (index === undefined || !Number.isFinite(index)) return "unknown";
        // The hourly average is a decimal; the band is the nearest step of the 1…5 scale.
        const step = Math.min(5, Math.max(1, Math.round(index)));
        return BANDS[step - 1];
      }

      /** Directive 2008/50/EC in µg/m³: the PM10 daily limit and the PM2.5 annual limit value. */
      export const LIMITS = { pm10: 50, pm25: 25 } as const;

      export type Pollutant = keyof typeof LIMITS;

      export interface Point {
        at: string;
        /** Milliseconds since the epoch, for the time axis. */
        time: number;
        value: number;
      }

      export type History = Record<Pollutant, Point[]>;

      /**
       * The temporal entity the backend forwards (`/api/stations/{id}/history`), normalized form: each
       * attribute an instance or a list of instances with `value` and `observedAt`. An instance without
       * a number or a time is dropped rather than drawn at zero or at the epoch.
       */
      export function historyOf(entity: unknown): History {
        const record = (entity ?? {}) as Record<string, unknown>;
        const pointsOf = (attribute: unknown): Point[] => {
          const instances = Array.isArray(attribute) ? attribute : attribute ? [attribute] : [];
          return instances
            .map((instance) => instance as { value?: unknown; observedAt?: unknown })
            .flatMap((instance) => {
              const time = typeof instance.observedAt === "string" ? Date.parse(instance.observedAt) : NaN;
              return typeof instance.value === "number" && Number.isFinite(instance.value) && Number.isFinite(time)
                ? [{ at: instance.observedAt as string, time, value: instance.value }]
                : [];
            })
            .sort((a, b) => a.time - b.time);
        };
        return { pm10: pointsOf(record.pm10), pm25: pointsOf(record.pm25) };
      }

      /**
       * A station as a map point. Declared here rather than taken from the ambient `GeoJSON` namespace,
       * which only an install brings in: the build lane links the template's store and has none (T-2935).
       */
      export type StationFeature = {
        type: "Feature";
        geometry: { type: "Point"; coordinates: [number, number] };
        properties: { id: string; name: string; colour: string };
      };

      export type StationCollection = { type: "FeatureCollection"; features: StationFeature[] };

      /** The stations with a position, as GeoJSON points carrying their id, name and band. */
      export function stationFeatures(stations: Station[]): StationCollection {
        return {
          type: "FeatureCollection",
          features: stations.flatMap((station) =>
            station.coordinates
              ? [
                  {
                    type: "Feature" as const,
                    geometry: { type: "Point" as const, coordinates: station.coordinates },
                    properties: {
                      id: station.id,
                      name: station.name ?? station.id,
                      colour: BAND_COLOUR[bandOf(station.airQualityIndex)],
                    },
                  },
                ]
              : [],
          ),
        };
      }
    ui__tests__app.test.tsx: |
      /**
       * The air-quality page (T-2617, AP-40, AP-62, AP-109, UI-44): the record form for a steward, the
       * disabled controls with their reason for a viewer, nothing for an anonymous reader, and one
       * request to the backend per save.
       */
      import { render, screen, waitFor, within } from "@testing-library/react";
      import userEvent from "@testing-library/user-event";
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { App } from "../src/App";

      const STATION = "urn:ngsi-ld:AirQualityObserved:hel.fi:helsinki:kallio";
      const OWN = "urn:ngsi-ld:AirQualityObserved:hel.fi:helsinki:kumpula";

      const measured = {
        id: STATION,
        name: "Kallio",
        names: { fi: "Kallio", en: "Kallio" },
        pm10: 34.2,
        pm25: 21,
        observedAt: "2026-09-06T10:00:00Z",
        coordinates: [24.95, 60.18],
        own: false,
      };
      const added = { id: OWN, name: "Kumpula", names: { fi: "Kumpula" }, coordinates: [24.96, 60.2], own: true };

      /** One day at Kallio as the temporal API answers it: PM10 above its limit once, PM2.5 below. */
      const kallioDay = {
        id: STATION,
        type: "AirQualityObserved",
        pm10: [
          { type: "Property", value: 18, observedAt: "2026-09-06T08:00:00Z" },
          { type: "Property", value: 57.5, observedAt: "2026-09-06T09:00:00Z" },
          { type: "Property", value: 34.2, observedAt: "2026-09-06T10:00:00Z" },
        ],
        pm25: [
          { type: "Property", value: 9, observedAt: "2026-09-06T08:00:00Z" },
          { type: "Property", value: 21, observedAt: "2026-09-06T10:00:00Z" },
        ],
      };

      function serve(identity: Record<string, unknown>, writeStatus = 204, writeDetail?: string) {
        const fetchMock = vi.fn((input: RequestInfo | URL, init?: RequestInit) => {
          const url = String(input);
          const json = (body: unknown, status = 200) =>
            Promise.resolve(new Response(status === 204 ? null : JSON.stringify(body), { status }));
          const method = init?.method ?? "GET";
          if (url.endsWith("api/me")) {
            return json(identity);
          }
          if (url.endsWith("api/stations") && method === "GET") {
            return json([measured, added]);
          }
          if (url.includes("/history") && method === "GET") {
            return json(url.includes(encodeURIComponent(STATION)) ? kallioDay : { id: OWN, type: "AirQualityObserved" });
          }
          if (method !== "GET") {
            if (writeDetail) {
              return json({ detail: writeDetail }, writeStatus);
            }
            return method === "POST" ? json({ id: `${OWN}-2` }, 201) : json({}, writeStatus);
          }
          return json({}, 404);
        });
        vi.stubGlobal("fetch", fetchMock);
        return fetchMock;
      }

      const writes = (fetchMock: ReturnType<typeof serve>) =>
        fetchMock.mock.calls.filter((call) => (call[1]?.method ?? "GET") !== "GET");

      const steward = { signedIn: true, email: "demo.steward@hel.fi", user: "demo.steward@hel.fi", anonymous: false, roles: ["steward"] };
      const viewer = { ...steward, email: "demo.viewer@hel.fi", roles: ["viewer"] };
      const nobody = { signedIn: false, email: null, user: null, anonymous: true, roles: [] };

      describe("air-quality app", () => {
        afterEach(() => {
          vi.restoreAllMocks();
        });

        it("shows the station metrics it was given and hides the ones it was not", async () => {
          serve(nobody);
          render(<App />);

          expect(await screen.findByRole("heading", { name: "Kallio" })).toBeInTheDocument();
          expect(screen.getByText("34.2 µg/m³")).toBeInTheDocument();
          expect(screen.getByText("21 µg/m³")).toBeInTheDocument();
          // The grant returned no index, so there is no row for it rather than a zero.
          expect(screen.queryByText("Index")).toBeNull();
        });

        it("offers an anonymous reader no control at all", async () => {
          serve(nobody);
          render(<App />);
          await screen.findByRole("heading", { name: "Kallio" });
          expect(screen.getByText("You are viewing anonymously.")).toBeInTheDocument();
          // Picking a station to look at, or opening its details, is reading; nothing that writes is
          // offered (AP-40).
          for (const button of screen.getAllByRole("button")) {
            if (/^Details of /.test(button.textContent ?? "")) continue;
            expect(button).toHaveAttribute("aria-pressed");
          }
          expect(screen.queryByRole("button", { name: /^(Edit|Remove|Add|Save)/ })).toBeNull();
          expect(screen.queryByRole("form")).toBeNull();
        });

        it("shows a viewer the controls disabled, with the reason, and no form", async () => {
          serve(viewer);
          render(<App />);
          const edit = await screen.findByRole("button", { name: "Edit Kallio" });
          expect(edit).toBeDisabled();
          expect(edit).toHaveAccessibleDescription("Only a steward adds, corrects or removes station records.");
          expect(screen.queryByRole("heading", { name: "Add a station" })).toBeNull();
          expect(screen.queryByRole("button", { name: /^Remove/ })).toBeNull();
        });

        it("a steward corrects a station in one PATCH of the attributes a person may correct", async () => {
          const user = userEvent.setup();
          const fetchMock = serve(steward);
          render(<App />);
          await user.click(await screen.findByRole("button", { name: "Edit Kallio" }));

          const form = screen.getByRole("form", { name: "Edit Kallio" });
          expect(form).toHaveTextContent("PM10, PM2.5 and the index are measured by the station and cannot be edited.");
          const inside = within(form);
          expect(inside.queryByLabelText(/PM10/)).toBeNull();
          await user.clear(inside.getByLabelText("Name in English"));
          await user.type(inside.getByLabelText("Name in English"), "Kallio station");
          await user.type(inside.getByLabelText("Steward note"), "Sensor cleaned.");
          await user.click(inside.getByRole("button", { name: "Save changes" }));

          await waitFor(() => expect(writes(fetchMock)).toHaveLength(1));
          const [url, init] = writes(fetchMock)[0];
          expect(init?.method).toBe("PATCH");
          expect(String(url)).toContain(`api/stations/${encodeURIComponent(STATION)}`);
          expect(JSON.parse(String(init?.body))).toEqual({
