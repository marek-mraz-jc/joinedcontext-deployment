    ui__tests__charts.test.tsx: |
      /**
       * The chart and the map (T-2925, AP-56): one day of PM10 and PM2.5 per station with each EU
       * limit, and the stations on a map coloured by their air quality index band; a click on the map
       * picks the station the chart is about.
       */
      import { fireEvent, render, screen, waitFor, within } from "@testing-library/react";
      import { act } from "react";
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { App } from "../src/App";
      import { Chart } from "../src/Chart";
      import { basemapOf, StationMap } from "../src/StationMap";
      import { BAND_COLOUR, bandOf, historyOf, LIMITS, stationFeatures, type StationCollection } from "../src/quality";
      import type { Station } from "../src/api";
      import { Map as FakeMap } from "./maplibre";

      const KALLIO = "urn:ngsi-ld:AirQualityObserved:hel.fi:helsinki:kallio";
      const KUMPULA = "urn:ngsi-ld:AirQualityObserved:hel.fi:helsinki:kumpula";
      const LOST = "urn:ngsi-ld:AirQualityObserved:hel.fi:helsinki:lost";

      const stations: Station[] = [
        { id: KALLIO, name: "Kallio", pm10: 34.2, pm25: 21, airQualityIndex: 3.4, coordinates: [24.95, 60.18] },
        { id: KUMPULA, name: "Kumpula", pm10: 8, airQualityIndex: 1, coordinates: [24.96, 60.2] },
        // A station a steward added without a position: listed, never drawn at 0,0.
        { id: LOST, name: "Lost", own: true },
      ];

      const kallioDay = {
        id: KALLIO,
        pm10: [
          { type: "Property", value: 57.5, observedAt: "2026-09-06T09:00:00Z" },
          { type: "Property", value: 18, observedAt: "2026-09-06T08:00:00Z" },
        ],
        pm25: { type: "Property", value: 21, observedAt: "2026-09-06T10:00:00Z" },
      };

      function serve(history: (url: string) => Response) {
        vi.stubGlobal(
          "fetch",
          vi.fn((input: RequestInfo | URL) => {
            const url = String(input);
            if (url.endsWith("api/me")) {
              return Promise.resolve(new Response(JSON.stringify({ signedIn: false, email: null, user: null, anonymous: true, roles: [] })));
            }
            if (url.endsWith("api/stations")) return Promise.resolve(new Response(JSON.stringify(stations)));
            return Promise.resolve(history(url));
          }),
        );
      }

      afterEach(() => {
        vi.restoreAllMocks();
        FakeMap.built.length = 0;
      });

      describe("what a reading means", () => {
        it("bands the 1…5 index to the nearest step and never calls a missing index good", () => {
          expect([1, 2.4, 2.5, 4, 5.6].map(bandOf)).toEqual(["good", "satisfactory", "fair", "poor", "veryPoor"]);
          expect(bandOf(undefined)).toBe("unknown");
          expect(bandOf(Number.NaN)).toBe("unknown");
          expect(bandOf(0)).toBe("good");
        });

        it("reads a day in time order, a single instance too, and drops what has no number or no time", () => {
          const day = historyOf({
            pm10: [
              { value: 30, observedAt: "2026-09-06T10:00:00Z" },
              { value: 20, observedAt: "2026-09-06T09:00:00Z" },
              { value: "high", observedAt: "2026-09-06T11:00:00Z" },
              { value: 40 },
            ],
            pm25: { value: 12, observedAt: "2026-09-06T09:00:00Z" },
          });
          expect(day.pm10.map((point) => point.value)).toEqual([20, 30]);
          expect(day.pm25.map((point) => point.value)).toEqual([12]);
          expect(historyOf(null)).toEqual({ pm10: [], pm25: [] });
        });

        it("puts one feature on the map per station with a position, in its band's colour", () => {
          const collection = stationFeatures(stations);
          expect(collection.features.map((feature) => feature.properties.id)).toEqual([KALLIO, KUMPULA]);
          expect(collection.features[0].properties.colour).toBe(BAND_COLOUR.fair);
          expect(collection.features[1].properties.colour).toBe(BAND_COLOUR.good);
        });
      });

      describe("the basemap", () => {
        it("is the project's style from the page's #jc-config, and nothing when the page has none or it is broken", () => {
          const page = (text: string | null) => {
            const doc = document.implementation.createHTMLDocument("app");
            if (text !== null) {
              const script = doc.createElement("script");
              script.id = "jc-config";
              script.type = "application/json";
              script.textContent = text;
              doc.body.append(script);
            }
            return doc;
          };
          expect(basemapOf(page('{"basemap":"https://portal.example/api/v1/projects/helsinki/basemap/style.json"}'))).toBe(
            "https://portal.example/api/v1/projects/helsinki/basemap/style.json",
          );
          expect(basemapOf(page(null))).toBeUndefined();
          expect(basemapOf(page("{not json"))).toBeUndefined();
          expect(basemapOf(page('{"basemap":42}'))).toBeUndefined();
        });
      });

      describe("the chart", () => {
        it("draws one line per pollutant and each pollutant's limit, and says the latest values in words", () => {
          const { container } = render(<Chart history={historyOf(kallioDay)} station="Kallio" />);
          expect(container.querySelectorAll("polyline")).toHaveLength(2);
          expect(container.querySelectorAll("line.limit")).toHaveLength(2);
          const figure = screen.getByRole("img");
          expect(figure).toHaveAccessibleName(
            `PM readings at Kallio over the last 24 hours. Latest: PM10 57.5 µg/m³ (limit ${LIMITS.pm10}), PM2.5 21 µg/m³ (limit ${LIMITS.pm25}).`,
          );
          // The series take the token palette, never a colour from the data.
          const [pm10, pm25] = [...container.querySelectorAll("polyline")].map((line) => line.getAttribute("stroke"));
          expect(pm10).not.toBe(pm25);
        });

        it("puts a single reading in the middle rather than dividing by a zero-length day", () => {
          const { container } = render(<Chart history={historyOf({ pm10: { value: 12, observedAt: "2026-09-06T10:00:00Z" } })} station="Kumpula" />);
          const [line] = [...container.querySelectorAll("polyline")];
          expect(line.getAttribute("points")).not.toMatch(/NaN/);
        });

        it("says a station sent nothing today rather than drawing an empty axis", () => {
          render(<Chart history={historyOf({})} station="Kumpula" />);
          expect(screen.getByRole("status")).toHaveTextContent("No PM10 or PM2.5 readings from Kumpula in the last 24 hours.");
          expect(screen.queryByRole("img")).toBeNull();
        });
      });

      describe("the page", () => {
        it("draws the located stations on the map and a click on one shows that station's day", async () => {
          serve((url) =>
            new Response(JSON.stringify(url.includes(encodeURIComponent(KALLIO)) ? kallioDay : { id: KUMPULA })),
          );
          render(<App />);
          expect(await screen.findByRole("img", { name: /at Kallio/ })).toBeInTheDocument();

          // The map is built after the chart shows, a beat later on a loaded runner (T-2994).
          const map = await waitFor(() => {
            const [built] = FakeMap.built;
            expect((built?.sources.stations?.data as StationCollection | undefined)?.features).toHaveLength(2);
            return built!;
          });
          const drawn = map.sources.stations.data as StationCollection;
          expect(drawn.features).toHaveLength(2);
          expect(map.layers[0]).toMatchObject({ type: "circle", paint: { "circle-color": ["get", "colour"] } });

          act(() => map.fire("click", { features: [{ properties: { id: KUMPULA } }] }, "stations"));
          expect(await screen.findByText("No PM10 or PM2.5 readings from Kumpula in the last 24 hours.")).toBeInTheDocument();
          expect(screen.getByRole("button", { name: /^Kumpula/ })).toHaveAttribute("aria-pressed", "true");
          // The legend says every band in words beside its colour (UI-30).
          const legend = screen.getByRole("list", { name: "Air quality index" });
          expect(within(legend).getAllByRole("listitem").map((item) => item.textContent)).toEqual([
            "Good",
            "Satisfactory",
            "Fair",
            "Poor",
            "Very poor",
          ]);
        });

        it("picks a station from the list for the chart and opens it in the panel, one without a position too", async () => {
          serve((url) => new Response(JSON.stringify(url.includes(encodeURIComponent(KALLIO)) ? kallioDay : { id: KUMPULA })));
          render(<App />);
          const list = await screen.findByRole("list", { name: "Stations" });
          fireEvent.click(within(list).getByRole("button", { name: "Kumpula: Good" }));
          expect(within(list).getByRole("button", { name: "Kumpula: Good" })).toHaveAttribute("aria-pressed", "true");
          expect(await screen.findByRole("dialog", { name: "Kumpula" })).toBeInTheDocument();
          fireEvent.click(within(list).getByRole("button", { name: "Kallio: Fair" }));
          expect(await screen.findByRole("dialog", { name: "Kallio" })).toBeInTheDocument();
          fireEvent.click(within(list).getByRole("button", { name: "Lost: No index" }));
          expect(await screen.findByRole("dialog", { name: "Lost" })).toBeInTheDocument();
          fireEvent.click(screen.getByRole("button", { name: "Close" }));
          await waitFor(() => expect(screen.queryByRole("dialog")).toBeNull());
          fireEvent.click(screen.getByRole("button", { name: "Details of Lost" }));
          expect(await screen.findByRole("dialog", { name: "Lost" })).toBeInTheDocument();
          for (const name of ["Details of Kallio", "Details of Kumpula"]) fireEvent.click(screen.getByRole("button", { name }));
        });

        it("centres on Helsinki and says so when no station has a position, and names a station by its id when it has no name", async () => {
          const onSelect = vi.fn();
          render(<StationMap stations={[{ id: LOST }]} selected={null} onSelect={onSelect} />);
          expect(screen.getByRole("status")).toBeInTheDocument();
          fireEvent.click(screen.getByRole("button", { name: `${LOST}: No index` }));
          expect(onSelect).toHaveBeenCalledWith(LOST);
          const [map] = FakeMap.built;
          expect(map.options.center).toEqual([24.94, 60.17]);
          // A click on the map beside every station, or on a feature without an id, picks nothing.
          act(() => map.fire("click", { features: [] }, "stations"));
          act(() => map.fire("click", { features: [{ properties: { id: 7 } }] }, "stations"));
          expect(onSelect).toHaveBeenCalledTimes(1);
        });

        it("shows the gateway's own words when the day cannot be read", async () => {
          serve(() => new Response(JSON.stringify({ detail: "queryTemporal is outside this app's window" }), { status: 403 }));
          render(<App />);
          expect(await screen.findByRole("alert")).toHaveTextContent("queryTemporal is outside this app's window");
        });
      });
    ui__tests__maplibre.ts: |
      /**
       * MapLibre needs WebGL, which jsdom has not: this stands in for it and keeps what the app asked
       * for — the sources, their data, the layers and the click handlers — so a test reads what the
       * map would draw and plays a click on it (T-2925).
       */
      type Handler = (event: unknown) => void;

      export class Map {
        static built: Map[] = [];
        readonly options: Record<string, unknown>;
        readonly layers: Array<Record<string, unknown>> = [];
        readonly sources: Record<string, { data: unknown; setData(data: unknown): void }> = {};
        readonly handlers: Array<{ event: string; layer?: string; handler: Handler }> = [];

        constructor(options: Record<string, unknown>) {
          this.options = options;
          Map.built.push(this);
          queueMicrotask(() => this.fire("load", {}));
        }

        on(event: string, layerOrHandler: string | Handler, handler?: Handler): this {
          if (typeof layerOrHandler === "string") this.handlers.push({ event, layer: layerOrHandler, handler: handler as Handler });
          else this.handlers.push({ event, handler: layerOrHandler });
          return this;
        }

        fire(event: string, payload: unknown, layer?: string): void {
          for (const entry of this.handlers) if (entry.event === event && entry.layer === layer) entry.handler(payload);
        }

        addSource(id: string, spec: { data: unknown }): void {
          this.sources[id] = {
            data: spec.data,
            setData(data: unknown) {
              this.data = data;
            },
          };
        }

        getSource(id: string) {
          return this.sources[id];
        }

        addLayer(layer: Record<string, unknown>): void {
          this.layers.push(layer);
        }

        remove(): void {}
      }

      export function setWorkerUrl(): void {}
    ui__tests__panel.test.tsx: |
      /**
       * T-3374, SDK-39, SDK-40: the App in the SDK's shell, and a station on the map or its card opening
       * the SDK's entity panel, which reads and writes through this App's backend. A steward corrects the
       * note there; anyone else reads it, and is linked to the station in the Portal.
       */
      import { act, fireEvent, render, screen, waitFor, within } from "@testing-library/react";
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { ProblemError } from "@joinedcontext/sdk";
      import { App } from "../src/App";
      import { ApiError } from "../src/api";
      import type { Identity, Station } from "../src/api";
      import { STATION_TYPE, portalLinkOf, rowOf, stationSource } from "../src/panel";

      const KALLIO = "urn:ngsi-ld:AirQualityObserved:hel.fi:helsinki:kallio";
      const KUMPULA = "urn:ngsi-ld:AirQualityObserved:hel.fi:helsinki:kumpula";

      const stations: Station[] = [
        { id: KALLIO, name: "Kallio", names: { fi: "Kallio" }, pm10: 34.2, pm25: 21, airQualityIndex: 2, observedAt: "2026-09-06T10:00:00Z", coordinates: [24.95, 60.18], own: false },
        { id: KUMPULA, name: "Kumpula", names: { fi: "Kumpula" }, stewardNote: "Moved in May", coordinates: [24.96, 60.2], own: true },
      ];

      const steward: Identity = { signedIn: true, email: "demo.steward@hel.fi", user: "demo.steward@hel.fi", anonymous: false, roles: ["steward"] };
      const viewer: Identity = { ...steward, email: "demo.viewer@hel.fi", roles: ["viewer"] };

      function serve(identity: Identity, patch: { status: number; detail?: string } = { status: 204 }) {
        const fetchMock = vi.fn((input: RequestInfo | URL, init?: RequestInit) => {
          const url = String(input);
          const method = init?.method ?? "GET";
          const json = (body: unknown, status = 200) => Promise.resolve(new Response(status === 204 ? null : JSON.stringify(body), { status }));
          if (url.endsWith("api/me")) return json(identity);
          if (url.endsWith("api/stations") && method === "GET") return json(stations);
          if (url.includes("/history")) return json({ id: KALLIO, type: STATION_TYPE });
          if (method === "PATCH") return patch.detail ? json({ detail: patch.detail }, patch.status) : json({}, patch.status);
          return json({}, 404);
        });
        vi.stubGlobal("fetch", fetchMock);
        return fetchMock;
      }

      afterEach(() => {
        vi.restoreAllMocks();
      });

      describe("the App in the SDK's shell (T-3374)", () => {
        it("has the shell's title and the reader's name, and opens a station from its card and from the map", async () => {
          serve(steward);
          render(<App />);
          expect(await screen.findByRole("heading", { level: 1, name: "Air quality" })).toBeInTheDocument();
          expect(screen.getByText("demo.steward@hel.fi", { selector: ".jc-user" })).toBeInTheDocument();
          // The shell names the reader; the page does not say it a second time.
          expect(screen.getAllByText(/demo\.steward@hel\.fi/)).toHaveLength(1);

          fireEvent.click(await screen.findByRole("button", { name: "Details of Kallio" }));
          const panel = await screen.findByRole("dialog", { name: "Kallio" });
          expect(within(panel).getByText("PM10 (µg/m³)")).toBeInTheDocument();
          expect(within(panel).getByText("34.2")).toBeInTheDocument();
          fireEvent.click(within(panel).getByRole("button", { name: "Close" }));
          await waitFor(() => expect(screen.queryByRole("dialog")).toBeNull());

          fireEvent.click(within(screen.getByRole("list", { name: "Stations" })).getByRole("button", { name: /^Kumpula/ }));
          expect(await screen.findByRole("dialog", { name: "Kumpula" })).toBeInTheDocument();
          fireEvent.keyDown(window, { key: "Escape" });
          fireEvent.click(within(screen.getByRole("list", { name: "Stations" })).getByRole("button", { name: /^Kallio/ }));
          expect(await screen.findByRole("dialog", { name: "Kallio" })).toBeInTheDocument();
          fireEvent.click(screen.getByRole("button", { name: "Details of Kumpula" }));
          expect(await screen.findByRole("dialog", { name: "Kumpula" })).toBeInTheDocument();
        });

        it("lets a steward correct the note in the panel: checked, shown, then written through the backend", async () => {
          const fetchMock = serve(steward);
          render(<App />);
          fireEvent.click(await screen.findByRole("button", { name: "Details of Kumpula" }));
          const panel = await screen.findByRole("dialog", { name: "Kumpula" });
          fireEvent.click(await within(panel).findByRole("button", { name: "Edit" }));
          // Only the note is an input; the name and the position stay with the record form.
          expect(within(panel).queryByLabelText("Name")).toBeNull();
          const note = within(panel).getByLabelText("Steward note");
          fireEvent.change(note, { target: { value: "" } });
          fireEvent.click(within(panel).getByRole("button", { name: "Review the change" }));
          expect(within(panel).getByText("Required.")).toBeInTheDocument();

          fireEvent.change(note, { target: { value: "Moved to the school yard" } });
          fireEvent.click(within(panel).getByRole("button", { name: "Review the change" }));
          expect(within(panel).getByText("Steward note: Moved in May → Moved to the school yard")).toBeInTheDocument();
          await act(async () => {
            fireEvent.click(within(panel).getByRole("button", { name: "Save the change" }));
          });
          const patches = fetchMock.mock.calls.filter((call) => call[1]?.method === "PATCH");
          expect(patches).toHaveLength(1);
          expect(String(patches[0][0])).toContain(`api/stations/${encodeURIComponent(KUMPULA)}`);
          expect(JSON.parse(String(patches[0][1]?.body))).toEqual({ stewardNote: "Moved to the school yard" });
        });

        it("says the backend's refusal in the panel in its own words", async () => {
          serve(steward, { status: 403, detail: "the grant does not allow stewardNote" });
          render(<App />);
          fireEvent.click(await screen.findByRole("button", { name: "Details of Kumpula" }));
          const panel = await screen.findByRole("dialog", { name: "Kumpula" });
          fireEvent.click(await within(panel).findByRole("button", { name: "Edit" }));
          fireEvent.change(within(panel).getByLabelText("Steward note"), { target: { value: "x" } });
          fireEvent.click(within(panel).getByRole("button", { name: "Review the change" }));
          await act(async () => {
            fireEvent.click(within(panel).getByRole("button", { name: "Save the change" }));
          });
          expect(await within(panel).findByRole("alert")).toHaveTextContent("You may not change this entity: the grant does not allow stewardNote");
        });

        it("offers a viewer no Edit in the panel", async () => {
          serve(viewer);
          render(<App />);
          fireEvent.click(await screen.findByRole("button", { name: "Details of Kallio" }));
          const panel = await screen.findByRole("dialog", { name: "Kallio" });
          await within(panel).findByText("PM10 (µg/m³)");
          expect(within(panel).queryByRole("button", { name: "Edit" })).toBeNull();
        });

        it("lets a steward open and cancel the record form of a station", async () => {
          serve(steward);
          render(<App />);
          fireEvent.click(await screen.findByRole("button", { name: "Edit Kumpula" }));
          expect(screen.getByRole("form", { name: "Edit Kumpula" })).toBeInTheDocument();
          fireEvent.click(screen.getByRole("button", { name: "Cancel" }));
          expect(screen.queryByRole("form", { name: "Edit Kumpula" })).toBeNull();
        });
      });

      describe("the panel's source", () => {
        it("lists only what the backend answered", () => {
          expect(rowOf(stations[1])).toEqual({ id: KUMPULA, type: STATION_TYPE, name: "Kumpula", stewardNote: "Moved in May" });
          expect(rowOf({ id: KALLIO })).toEqual({ id: KALLIO, type: STATION_TYPE });
          expect(rowOf(stations[0])).toMatchObject({ pm10: 34.2, pm25: 21, airQualityIndex: 2, dateObserved: "2026-09-06T10:00:00Z" });
        });

        it("links to the Portal only from an App host, the id escaped", () => {
          expect(portalLinkOf("air-quality.apps.dev.joinedcontext.com", "urn:a&b")).toBe(
            "https://portal.dev.joinedcontext.com/projects/helsinki/explore?space=helsinki&entityId=urn%3Aa%26b",
          );
          expect(portalLinkOf("localhost", KALLIO)).toBeNull();
          expect(portalLinkOf("evil.example/air-quality.apps.dev", KALLIO)).toBeNull();
        });

        it("reads a station fresh, says one that is gone, and turns the backend's refusal into the panel's", async () => {
          serve(steward);
          const source = stationSource(steward, () => undefined, "localhost");
          expect(await source.get({ id: KALLIO, type: STATION_TYPE })).toMatchObject({ name: "Kallio" });
          await expect(source.get({ id: "urn:ngsi-ld:AirQualityObserved:gone", type: STATION_TYPE })).rejects.toMatchObject({ status: 404 });
          vi.stubGlobal("fetch", vi.fn(() => Promise.resolve(new Response(JSON.stringify({ detail: "the endpoint did not answer" }), { status: 502 }))));
          await expect(source.get({ id: KALLIO, type: STATION_TYPE })).rejects.toMatchObject({ status: 502, title: "the endpoint did not answer" });
        });

        it("writes only the note and reloads the page after it", async () => {
          serve(steward);
          const changed = vi.fn();
          const source = stationSource(steward, changed, "localhost");
          await source.update({ id: KUMPULA, type: STATION_TYPE }, { stewardNote: "ok" });
          expect(changed).toHaveBeenCalledTimes(1);
          await expect(source.update({ id: KUMPULA, type: STATION_TYPE }, { name: "x" })).rejects.toBeInstanceOf(ProblemError);
          await expect(source.update({ id: KUMPULA, type: STATION_TYPE }, { stewardNote: 5 })).rejects.toMatchObject({ status: 400 });
          vi.stubGlobal("fetch", vi.fn(() => Promise.reject(new TypeError("network down"))));
          await expect(source.update({ id: KUMPULA, type: STATION_TYPE }, { stewardNote: "ok" })).rejects.toMatchObject({ status: 0, title: "network down" });
          vi.stubGlobal("fetch", vi.fn(() => Promise.reject("offline")));
          await expect(source.update({ id: KUMPULA, type: STATION_TYPE }, { stewardNote: "ok" })).rejects.toMatchObject({ status: 0, title: "offline" });
        });

        it("lets a steward edit the note alone, and links anyone else to the Portal", () => {
          const own = stationSource(steward, () => undefined, "air-quality.apps.dev.joinedcontext.com");
          expect(own.mayEdit(STATION_TYPE)).toBe(true);
          expect(own.mayEdit(STATION_TYPE, "stewardNote")).toBe(true);
          expect(own.mayEdit(STATION_TYPE, "pm10")).toBe(false);
          expect(own.mayEdit("Other")).toBe(false);
          expect(own.portalLink?.({ id: KALLIO, type: STATION_TYPE })).toBeNull();
          const other = stationSource(viewer, () => undefined, "air-quality.apps.dev.joinedcontext.com");
          expect(other.mayEdit(STATION_TYPE)).toBe(false);
          expect(other.portalLink?.({ id: KALLIO, type: STATION_TYPE })).toContain("entityId=");
          expect(stationSource(null, () => undefined, "localhost").mayEdit(STATION_TYPE)).toBe(false);
        });

        it("keeps an ApiError's words and status", () => {
          expect(new ApiError(409, "conflict").status).toBe(409);
        });
      });
