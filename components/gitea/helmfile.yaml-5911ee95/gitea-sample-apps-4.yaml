              perDegree: "+0.5",
              rain: "−2.0",
              hours: 48,
            }),
          ).toBe("1 °C warmer: +0.5 bikes; rain: −2.0 bikes; from 48 hours with weather");

          expect(
            t("fi", "weatherEffect", {
              perDegree: "+0.5",
              rain: "−2.0",
              hours: 48,
