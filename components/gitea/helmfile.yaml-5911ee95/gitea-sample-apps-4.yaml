    .gitea__workflows__build.yml: |
      # The build of this application (AP-80, AP-100, AP-101, AP-104, ADR-N-028). The Portal writes this
      # file in the application's first commit and a run never changes it: only a version a reviewer
      # merged runs. It builds the default branch on every push to it, and again when the Portal's
      # Rebuild dispatches it (AP-103).
      #
      # Runs on the installation's `gitea-runner` (label node-22), whose image carries the SDK and the
      # template's packages already installed, so nothing is installed here (AP-82). No step fetches an
      # action: the runner reaches the forge and the Portal API only (AP-81), by the in-cluster
      # addresses it gives every job as JC_FORGE_URL and JC_PORTAL_URL; `gitea.server_url` is the
      # public host, which the runner cannot reach.
      #
      # Two jobs: `build` runs the application's code and holds the job token only; `propose` runs no
      # code of the application and is the only one that sees the lane's secret. The Portal checks the
      # uploaded bundle against the proposed digest and publishes the package itself (AP-104).
      name: build

      on:
        push:
          branches: [main]
        workflow_dispatch:

      jobs:
        # `build` runs in a pod of this App's own (label app-build-rust: Rust to WebAssembly, AP-142), registered with this
        # repository's token alone and mounting this App's build cache; `propose` stays on the shared
        # runner and mounts no cache (AP-130, AP-131).
        build:
          runs-on: app-build-rust
          timeout-minutes: 30
          env:
            JC_BUILD_DIR: ${{ runner.temp }}/jc-build
          outputs:
            digest: ${{ steps.upload.outputs.digest }}
            commit: ${{ steps.upload.outputs.commit }}
            sdk-version: ${{ steps.upload.outputs.sdk-version }}
            built-at: ${{ steps.upload.outputs.built-at }}
          steps:
            # Clones the commit, runs the tests, builds and bundles the functions; the application's
            # own code runs here, with the job token removed from its environment.
            - name: Test and build
              env:
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_APP_COMMIT: ${{ gitea.sha }}
                JC_FORGE_TOKEN: ${{ gitea.token }}
              run: JC_APP_REPO="$JC_FORGE_URL/$JC_REPOSITORY.git" build-app

            # bundle-{commit} and sbom-{commit}, the run's artifacts, for the Portal to check and publish.
            - name: Upload the build
              id: upload
              run: node /opt/template/lane.mjs upload "$JC_BUILD_DIR"

        propose:
          needs: build
          runs-on: node-22
          timeout-minutes: 5
          steps:
            # The one step that sees the lane's secret, and it runs no code of the application (AP-80).
            - name: Propose status.build
              env:
                JC_LANE_TOKEN: ${{ secrets.JC_LANE_TOKEN }}
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_DIGEST: ${{ needs.build.outputs.digest }}
                JC_COMMIT: ${{ needs.build.outputs.commit }}
                JC_SDK_VERSION: ${{ needs.build.outputs.sdk-version }}
                JC_BUILT_AT: ${{ needs.build.outputs.built-at }}
              run: node /opt/template/lane.mjs propose "$JC_REPOSITORY"
    .gitignore: |
      node_modules/
      dist/
      wasm/target/
      wasm/pkg/
      test-results/
      playwright-report/
      *.tsbuildinfo
    README.md: |
      # Bikes and the weather (Pyörät ja sää)

      "Will there be a bike at my station?" For one city-bike station: its availability by hour of the week, how temperature and rain change it, and an estimate for the next 6 hours with its uncertainty.

      Built with React 19, TypeScript, and a WebAssembly analysis engine compiled from Rust (`wasm-bindgen`). Runs completely in the browser as a static `ui` bundle without requiring server pods.

      ## Data sources

      - **BikeHireDockingStation**: Current state and 7-day temporal history (`availableBikeNumber`) for the chosen station.
      - **WeatherObserved**: Current road weather observations and 7-day temporal history (`temperature`, `precipitation`) from the nearest station within 10 km (calculated via haversine distance), or the weather station and radius a steward set for the station.

      ## In the shell

      The page sits in the SDK's `AppShell` (SDK-39) with its Suomi/English/Svenska switch, and uses the SDK's
      loading, empty and error states. A station picked on the map, and the chosen station and its
      weather station by their Details buttons, open in the shell's entity panel (SDK-40), read fresh
      through the App's endpoint. The App is public, so the panel never offers Edit and links the entity
      to the Portal (AP-140); the stations and the weather are their feeds' pipelines', and the App writes
      nothing. Retry on a history that could not be read reads it again.

      ## Analysis engine

      - Computes Europe/Helsinki hours of week (0..=167) accounting for EU daylight saving time transitions.
      - Evaluates the baseline hour-of-week profile with fallback to day-hour averages.
      - Fits the weather terms with the within-slot estimator: the residual bike count, the temperature and rain are each taken from their slot group's mean before the 3×3 least-squares fit, so the profile does not absorb weather effects that follow the time of day (a plain residual fit came out biased toward zero).
      - Projects availability over the next 6 hours with an 80 % prediction interval (±1.28 σ), assuming the weather stays as last observed: the data holds no forecast.
      - Reads one station's history only, through the SDK's temporal `id` parameter: a week of every station's minute-by-minute availability would be millions of points.

      ## Server component

      A `wasm` App (AP-148, T-3355): beside the browser's module, `server/` (`wasm32-wasip2`, on `jc-app-sdk`) runs on the shared WASM host and reuses `wasm/` without wasm-bindgen. The broker keeps only a station's last seven days, so once a day per station, on the first request for it, the server reads the station's week and the nearest weather station's (within 10 km, as the page picks it) through the App's own Endpoint with the reader's token, trains the same model and keeps its weather coefficients, spread and hour-of-week profile in its table `station_models` (`migrations/`). The data it trained on goes to `training/<day>/<hash>.json` under the App's storage prefix. The page shows the selected station's models day by day and downloads a day's training data through a presigned URL.

      | Route | What it does |
      |---|---|
      | `GET /apps/bike-weather-demand/api/models?station=<urn>` | the station's kept models, newest first |
      | `GET /apps/bike-weather-demand/api/models/{id}/snapshot` | a URL to download the data a model was trained on |

      ## Roles and history

      A steward tunes a station's model inputs (T-3827): a weather station to read instead of the nearest, how far the nearest may be (1 to 25 km, default 10) and how many days the model trains on (1 to 7, default 7), with a note. The server keeps them in `station_inputs`, drops today's model of that station so the next read trains it again on them, and records each change in `app_audit`. Every reader sees the inputs above the kept models, and the page's own estimate reads with them too. A viewer's controls are disabled, each with its reason as a tooltip; a save shows at once and is taken back when the server refuses. History lists a viewer's own changes and a steward's every one. The roles come from the caller's token through `identity::caller()`, never from the page.

      | Route | Who | What it does |
      |---|---|---|
      | `GET /apps/bike-weather-demand/api/me` | anyone | the caller's name and roles, `null` when signed out |
      | `GET /apps/bike-weather-demand/api/inputs?station=<urn>` | anyone | the station's model inputs, the defaults when none are set |
      | `PUT /apps/bike-weather-demand/api/inputs?station=<urn>` `{weatherStation, radiusKm, days, note}` | steward | inputs set; today's model trained again |
      | `DELETE /apps/bike-weather-demand/api/inputs?station=<urn>` | steward | back to the defaults |
      | `GET /apps/bike-weather-demand/api/history` | signed in | the newest 100 changes (a viewer: their own) |

      The groups `bike-weather-demand-viewer` and `bike-weather-demand-steward` (`grants/users/groups/`) hold the demo viewer and steward. The App writes no context data, so its Endpoint's Policy stays read-only.

      `server/` is tested natively (`cargo test`), built with `cargo build --release --target wasm32-wasip2`, and played on the host against Postgres and RustFS from `server/host-test.json` by the platform's `crates/wasm-host/tests/apps_tests.rs`.

      ## Development

      ```bash
      # Build the WebAssembly module
      pnpm wasm

      # Run development server
      pnpm dev

      # Run unit and integration tests (every control exercised, the coverage gate of T-3373)
      pnpm test

      # Check types and produce production bundle
      pnpm build

      # Run Playwright responsive end-to-end tests
      pnpm e2e
      ```
    app.yaml: |
      # Helsinki bike and weather demand (T-3337): availability by hour of the week,
      # weather sensitivity, and 6-hour forecast with uncertainty for city-bike stations.
      # Runs in the browser via WebAssembly compiled from wasm/ (AP-142); the server component in server/
      # runs on the shared WASM host (T-3355, AP-148) and keeps each station's daily model in the App's
      # own schema and the data it trained on under its own storage prefix.
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: bike-weather-demand
        namespace: helsinki
        title:
          en: "Bikes and the weather"
          fi: "Pyörät ja sää"
        description:
          en: "Will there be a bike at my station? Availability by hour of the week, weather effects, and an estimate for the next 6 hours with its uncertainty."
          fi: "Onko asemallani pyörää? Saatavuus viikon tunneittain, sään vaikutus ja arvio seuraaville 6 tunnille epävarmuuksineen."
      spec:
        kind: wasm
        source:
          git:
            url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_bike-weather-demand.git
            ref: main
        build:
          node: "22"
          rust: "1.90"
        # Its own schema, migrated from migrations/ at publish, and its own prefix for the training data.
        storage:
          sql:
            migrations: migrations
            quotaMiB: 100
          blob:
            quotaMiB: 1024
        visibility: public
        roles:
          - name: viewer
            title: { en: "Viewer", fi: "Katselija" }
            description: "Reads every station's model, its inputs and its kept history; sees their own changes in History."
          - name: steward
            title: { en: "Steward", fi: "Ylläpitäjä" }
            description: "Tunes a station's model inputs: a weather station instead of the nearest, how far the nearest may be, and how many days it trains on; today's model is trained again on them. Reads the whole history."
        access:
          - role: viewer
            subjects: [{ group: bike-weather-demand-viewer }]
          - role: steward
            subjects: [{ group: bike-weather-demand-steward }]
        lifecycle: published
        dataNeeds:
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [BikeHireDockingStation]
            attrs: [name, location, availableBikeNumber, freeSlotNumber, totalSlotNumber, status, dateModified]
            operations: [queryEntity, retrieveEntity, queryTemporal, retrieveTemporal]
            temporalQ:
              window: P7D
            representations: [ngsi-ld, ogc-features]
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [WeatherObserved]
            attrs: [name, location, temperature, precipitation, dateObserved]
            operations: [queryEntity, retrieveEntity, queryTemporal, retrieveTemporal]
            temporalQ:
              window: P7D
            representations: [ngsi-ld]
    e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { BASE, STEWARD, VIEWER, serve } from "./serve";

      for (const scheme of ["light", "dark"] as const) {
        for (const lang of ["fi", "en", "sv"] as const) {
          for (const size of WIDTHS) {
            test(`${scheme} ${lang} at ${size.width} px: answers on arrival, map canvas, tiles, chart, heat table, axe clean`, async ({ page }, testInfo) => {
              await page.emulateMedia({ colorScheme: scheme });
              const { outside, missing, problems } = await serve(page);
              await page.setViewportSize(size);
              await page.goto(`${BASE}?lang=${lang}`);

              // The map canvas is drawn
              await expect(page.getByTestId("jc-map").locator("canvas")).toHaveCount(1);

              // The station selector is present
              const combobox = page.getByRole("combobox", { name: lang === "fi" ? "Asema" : "Station", exact: true });
              await expect(combobox).toBeVisible();

              // Availability tiles are visible
              const tiles = page.locator(".jc-tiles .jc-tile");
              await expect(tiles).toHaveCount(3);

              // The chart canvas is drawn
              await expect(page.locator(".jc-chart-canvas")).toHaveCount(1);

              // The profile heat table is visible
              await expect(page.locator(".app-heat-table")).toBeVisible();

              await testInfo.attach(`${scheme}-${lang}-${size.width}.png`, {
                body: await page.screenshot({ fullPage: true }),
                contentType: "image/png",
              });

              expect(await layoutProblems(page)).toEqual([]);
              expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
            });
          }
        }
      }

      test("changing the station in combobox updates URL hash and tiles", async ({ page }) => {
        await serve(page);
        await page.setViewportSize({ width: 1440, height: 900 });
        await page.goto(`${BASE}?lang=en`);

        const combobox = page.getByRole("combobox", { name: "Station", exact: true });
        await expect(combobox).toBeVisible();

        await combobox.selectOption({ label: "Hakaniemi (10 / 20)" });
        expect(page.url()).toContain("id=urn%3Angsi-ld%3ABikeHireDockingStation%3Ahel.fi%3Ahelsinki%3Astation-2");

        await expect(page.getByText("No history available for this station.").first()).toBeVisible();
      });

      test("switching language toggles between Finnish and English", async ({ page }) => {
        await serve(page);
        await page.setViewportSize({ width: 1440, height: 900 });
        await page.goto(`${BASE}?lang=fi`);

        await expect(page.getByRole("heading", { level: 1, name: "Pyörät ja sää" })).toBeVisible();

        await page.getByRole("combobox", { name: "Kieli" }).selectOption("en");
        await expect(page.getByRole("heading", { level: 1, name: "Bikes and the weather" })).toBeVisible();
        expect(page.url()).toContain("lang=en");
      });

      // T-3355: the station's models the App's server keeps, after a reload too, and a day's training
      // data downloaded from the store.
      test("the station's kept models, after a reload too, and a day's training data", async ({ page }) => {
        const { outside, missing, problems } = await serve(page);
        await page.setViewportSize({ width: 1440, height: 900 });
        await page.goto(`${BASE}?lang=en`);
        const models = page.getByRole("table", { name: "The station's model over time: kept by the server" });
        await expect(models.getByRole("row")).toHaveCount(3);
        await page.reload();
        await expect(models.getByRole("row").nth(1)).toContainText("+0.42");
        await page.context().route("http://portal.test/store/**", (route) => route.fulfill({ status: 200, contentType: "application/json", body: "{}" }));
        const popup = page.waitForEvent("popup");
        await models.getByRole("button", { name: "Download the training data of 21 Oct 2030" }).click();
        const tab = await popup;
        await tab.waitForLoadState();
        expect(tab.url()).toBe("http://portal.test/store/training/2.json");
        await tab.close();
        expect(await layoutProblems(page)).toEqual([]);
        expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
      });

      test("empty stations shows message instead of broken UI", async ({ page }) => {
        await serve(page, []);
        await page.goto(`${BASE}?lang=en`);
        await expect(page.getByText("No bike stations readable.")).toBeVisible();
      });

      // T-3390, SDK-40: the chosen station opened in the SDK's entity panel by its Details button, at a
      // phone and a laptop, light and dark. The App is public, so the panel links to the Portal, no Edit.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: the station in the entity panel, linked to the Portal, axe clean`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}?lang=en`);
            await page.getByRole("button", { name: "Details: Rautatientori" }).click();
            const panel = page.getByRole("dialog", { name: "Rautatientori" });
            await expect(panel.getByText("BikeHireDockingStation")).toBeVisible();
            await expect(panel.getByRole("link", { name: "Open in the Portal" })).toBeVisible();
            await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
            expect(await layoutProblems(page)).toEqual([]);
            await page.keyboard.press("Escape");
            await expect(page.getByRole("dialog")).toHaveCount(0);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      // T-3827: a viewer reads a station's model inputs, every control closed with its reason; a steward
      // sets them and finds the change in History. At a phone and a laptop, light and dark.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: a viewer reads the model inputs, closed with the reason, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page, undefined, undefined, VIEWER);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}?lang=en`);
            await expect(page.getByLabel("Role: Viewer")).toBeVisible();
            const form = page.getByRole("form", { name: "Model inputs" });
            await expect(page.getByTestId("inputs-now")).toHaveText("The model reads the weather of the nearest within 10 km and trains on 7 days. The defaults.");
            await expect(form.getByLabel("Days to train on (1–7)")).toBeDisabled();
            await expect(form.getByLabel("Days to train on (1–7)")).toHaveAttribute("title", "Only a steward changes the model inputs.");
            await expect(form.getByRole("button", { name: "Save inputs" })).toBeDisabled();
            await form.scrollIntoViewIfNeeded();
            await testInfo.attach(`viewer-${scheme}-${width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });

          test(`${scheme} at ${width} px: a steward sets the model inputs and finds them in History, in Swedish, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page, undefined, undefined, STEWARD);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}?lang=sv`);
            await expect(page.getByLabel("Roll: Förvaltare")).toBeVisible();
            const form = page.getByRole("form", { name: "Modellens indata" });
            await form.getByLabel("Väderstation").selectOption({ label: "Kaisaniemi" });
            await form.getByLabel("Dagar att träna på (1–7)").fill("3");
            await form.getByLabel("Anteckning").fill("Närmare station");
            await form.getByRole("button", { name: "Spara indata" }).click();
            await expect(page.getByText("Sparat: dagens modell tränas på nytt.")).toBeVisible();
            await expect(page.getByTestId("inputs-now")).toContainText("Modellen läser vädret från Kaisaniemi och tränar på 3 dagar. Satt av Sami Steward");
            await expect(page.getByText(/Vald väderstation: Kaisaniemi/)).toBeVisible();
            await form.scrollIntoViewIfNeeded();
            await testInfo.attach(`steward-${scheme}-${width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            await page.getByRole("button", { name: "Historik" }).click();
            await expect(page.getByRole("table", { name: "Ändringar" })).toContainText("Sami Steward");
            expect(await layoutProblems(page)).toEqual([]);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }
    e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { Page } from "@playwright/test";
      import { stubTransport } from "@joinedcontext/sdk/testing";
      import { ENTITIES, NOW, TEMPORAL } from "../src/fixtures/bikes";

      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      export const BASE = "http://portal.test/";
      const SLUG = "r7bxzgiatcruw4b7l2rrkufidz";
      const CONFIG = {
        slug: SLUG,
        orgDomain: "hel.fi",
        space: "helsinki",
        transport: "origin",
        appName: "bike-weather-demand",
        // Where the entity panel links a station (SDK-40); shown, never followed.
        portal: "https://portal.hel.fi/projects/helsinki",
      };

      const TYPES: Record<string, string> = {
        ".html": "text/html",
        ".js": "text/javascript",
        ".css": "text/css",
        ".json": "application/json",
        ".svg": "image/svg+xml",
        ".woff2": "font/woff2",
        ".wasm": "application/wasm",
      };

      export interface Served {
        outside: string[];
        missing: string[];
        problems: string[];
      }

      /** The App's server (T-3355) as the page sees it: two kept models of whichever station is asked. */
      const MODELS = {
        models: [
          { id: 2, trained_on: "2030-10-21", trained_at: "2030-10-21T06:00:00Z", hours: 160, enough: true, per_degree: 0.42, rain: -1.5, sigma: 2.25, weather_station: "urn:ngsi-ld:WeatherObserved:w1" },
          { id: 1, trained_on: "2030-10-20", trained_at: "2030-10-20T06:00:00Z", hours: 150, enough: true, per_degree: 0.4, rain: -1.2, sigma: 2.5, weather_station: "urn:ngsi-ld:WeatherObserved:w1" },
        ],
        stale: false,
      };

      /** Who the App's server says is signed in (T-3827): a viewer unless a test names a steward. */
      export const VIEWER = { id: "u-1", name: "Vilja Viewer", roles: ["viewer"] };
      export const STEWARD = { id: "u-2", name: "Sami Steward", roles: ["viewer", "steward"] };

      /** Serves the built bundle at the root of the App's own host, with the SDK stub answering the endpoint. */
      export async function serve(page: Page, entities = ENTITIES, temporal = TEMPORAL, me: { id: string; name: string; roles: string[] } = VIEWER): Promise<Served> {
        await page.clock.setFixedTime(new Date(NOW * 1000));
        const transport = stubTransport({
          entities,
          temporal,
          access: {
            permissions: [
              { resource: { type: "BikeHireDockingStation" }, actions: ["queryEntity", "retrieveEntity", "retrieveTemporal"], attributes: "*" },
              { resource: { type: "WeatherObserved" }, actions: ["queryEntity", "retrieveEntity", "retrieveTemporal"], attributes: "*" },
            ],
            prohibitions: [],
          },
        });
        const served: Served = { outside: [], missing: [], problems: [] };
        // The App's server's inputs and history (T-3827), deciding by `me` as the real one does.
        const kept = new Map<string, Record<string, unknown>>();
        const history: unknown[] = [];
        const defaults = (station: string) => ({ station, weatherStation: null, radiusKm: 10, days: 7, note: "", custom: false, updatedBy: null, updatedAt: null });
        page.on("pageerror", (error) => served.problems.push(error.message));
        await page.route("**/*", async (route) => {
          const url = new URL(route.request().url());
          if (url.origin !== "http://portal.test") {
            served.outside.push(url.href);
            return route.abort();
          }
          if (url.pathname.startsWith(`/api/endpoint/${SLUG}/`)) {
            const body = route.request().postData();
            const answer = await transport({
              method: route.request().method() as "GET",
              path: url.pathname + url.search,
              body: body ? JSON.parse(body) : undefined,
            });
            return route.fulfill({
              status: answer.status,
              contentType: "application/json",
              body: JSON.stringify(answer.body ?? null),
            });
          }
          const api = "/apps/bike-weather-demand/api";
          const method = route.request().method();
          const json = (status: number, body: unknown) => route.fulfill({ status, contentType: "application/json", body: JSON.stringify(body) });
          if (url.pathname === `${api}/me`) return json(200, me);
          if (url.pathname === `${api}/history`) return json(200, history);
          const station = url.searchParams.get("station") ?? "";
          if (url.pathname === `${api}/inputs` && station.startsWith("urn:")) {
            if (method === "GET") return json(200, kept.get(station) ?? defaults(station));
            if (!me.roles.includes("steward")) return json(403, { detail: "this needs the role steward" });
            if (method === "PUT") {
              const set = { ...defaults(station), ...JSON.parse(route.request().postData() ?? "{}"), custom: true, updatedBy: me.name, updatedAt: "2030-10-21T06:00:00Z" };
              kept.set(station, set);
              history.unshift({ id: history.length + 1, at: "2030-10-21T06:00:00Z", actorName: me.name, action: "update", target: "inputs/station-1", summary: `${set.days} days` });
              return json(200, set);
            }
            kept.delete(station);
            return route.fulfill({ status: 204, body: "" });
          }
          if (url.pathname === "/apps/bike-weather-demand/api/models" && url.searchParams.get("station")?.startsWith("urn:")) {
            return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(MODELS) });
          }
          const snapshot = /^\/apps\/bike-weather-demand\/api\/models\/(\d+)\/snapshot$/.exec(url.pathname);
          if (snapshot) {
            return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ url: `http://portal.test/store/training/${snapshot[1]}.json` }) });
          }
          const file = normalize(url.pathname.slice(1) || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) {
            served.missing.push(url.pathname);
            return route.fulfill({ status: 404, body: "" });
          }
          let body = readFileSync(join(DIST, file));
          if (file === "index.html") {
            body = Buffer.from(
              body
                .toString("utf8")
                .replace(
                  '<script id="jc-config" type="application/json"></script>',
                  `<script id="jc-config" type="application/json">${JSON.stringify(CONFIG)}</script>`,
                ),
            );
          }
          const headers =
            file === "index.html"
              ? { "Content-Security-Policy": "script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:" }
              : undefined;
          return route.fulfill({
            status: 200,
            contentType: TYPES[extname(file)] ?? "application/octet-stream",
            body,
            headers,
          });
        });
        return served;
      }
