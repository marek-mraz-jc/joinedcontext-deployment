    src__bikes.test.ts: |
      import { describe, expect, it } from "vitest";
      import type { Row, TemporalPoint } from "@joinedcontext/sdk";
      import {
        defaultStationId,
        haversineKm,
        nearestWeatherStation,
        readHash,
        daysAgoIso,
        stationBikes,
        stationFreeSlots,
        stationName,
        stationSlots,
        toInput,
        writeHash,
      } from "./bikes";

      describe("nearestWeatherStation", () => {
        const bikeStation: Row = {
          id: "urn:ngsi-ld:BikeHireDockingStation:hel.fi:helsinki:001",
          type: "BikeHireDockingStation",
          name: "Rautatientori",
          location: { type: "Point", coordinates: [24.94, 60.17] },
        };

        it("finds the nearest weather station within 10 km", () => {
          const nearWeather: Row = {
            id: "urn:ngsi-ld:WeatherObserved:hel.fi:helsinki:near",
            type: "WeatherObserved",
            name: "Kaisaniemi",
            location: { type: "Point", coordinates: [24.94, 60.18] },
          };
          const farWeather: Row = {
            id: "urn:ngsi-ld:WeatherObserved:hel.fi:helsinki:far",
            type: "WeatherObserved",
            name: "Vantaa",
            location: { type: "Point", coordinates: [24.94, 60.35] },
          };

          const match = nearestWeatherStation(bikeStation, [nearWeather, farWeather]);
          expect(match).not.toBeNull();
          expect(match?.station.id).toBe("urn:ngsi-ld:WeatherObserved:hel.fi:helsinki:near");
          expect(match?.distanceKm).toBeCloseTo(1.11, 1);
          expect(match!.distanceKm).toBeLessThan(10);
        });

        it("returns null when all weather stations are beyond 10 km", () => {
          const farWeather: Row = {
            id: "urn:ngsi-ld:WeatherObserved:hel.fi:helsinki:far",
            type: "WeatherObserved",
            name: "Vantaa",
            location: { type: "Point", coordinates: [24.94, 60.35] },
          };

          const match = nearestWeatherStation(bikeStation, [farWeather]);
          expect(match).toBeNull();
        });

        it("returns null when bike station or weather stations lack valid coordinates", () => {
          const unlocatedBike: Row = {
            id: "urn:ngsi-ld:BikeHireDockingStation:hel.fi:helsinki:none",
            type: "BikeHireDockingStation",
            location: null,
          };
          const nearWeather: Row = {
            id: "urn:ngsi-ld:WeatherObserved:hel.fi:helsinki:near",
            type: "WeatherObserved",
            location: { type: "Point", coordinates: [24.94, 60.18] },
          };

          expect(nearestWeatherStation(unlocatedBike, [nearWeather])).toBeNull();

          const unlocatedWeather: Row = {
            id: "urn:ngsi-ld:WeatherObserved:hel.fi:helsinki:none",
            type: "WeatherObserved",
            location: null,
          };
          expect(nearestWeatherStation(bikeStation, [unlocatedWeather])).toBeNull();
        });
      });

      describe("haversineKm", () => {
        it("calculates zero distance for identical coordinates", () => {
          expect(haversineKm(24.94, 60.17, 24.94, 60.17)).toBe(0);
        });

        it("calculates expected distance across Helsinki area", () => {
          const dist = haversineKm(24.94, 60.17, 24.65, 60.20);
          expect(dist).toBeGreaterThan(15);
          expect(dist).toBeLessThan(18);
        });
      });

      describe("station properties and defaults", () => {
        it("formats stationName, stripping URN or falling back to id", () => {
          expect(stationName({ id: "s1", type: "BikeHireDockingStation", name: "Kamppi" })).toBe("Kamppi");
          expect(stationName({ id: "s2", type: "BikeHireDockingStation", name: "urn:ngsi-ld:BikeHireDockingStation:s2" })).toBe("s2");
          expect(stationName({ id: "s3", type: "BikeHireDockingStation", name: "" })).toBe("s3");
          expect(stationName({ id: "s4", type: "BikeHireDockingStation", name: null })).toBe("s4");
        });

        it("reads numeric slots, available bikes, and free slots", () => {
          const row: Row = {
            id: "s1",
            type: "BikeHireDockingStation",
            totalSlotNumber: 25,
            availableBikeNumber: 10,
            freeSlotNumber: 15,
          };
          expect(stationSlots(row)).toBe(25);
          expect(stationBikes(row)).toBe(10);
          expect(stationFreeSlots(row)).toBe(15);

          const invalid: Row = {
            id: "s2",
            type: "BikeHireDockingStation",
            totalSlotNumber: "invalid",
            availableBikeNumber: -4,
            freeSlotNumber: null,
          };
          expect(stationSlots(invalid)).toBe(0);
          expect(stationBikes(invalid)).toBe(0);
          expect(stationFreeSlots(invalid)).toBe(0);
        });

        it("defaultStationId selects the station with the most slots, breaking ties by name", () => {
          expect(defaultStationId([])).toBeNull();

          const s1: Row = { id: "s1", type: "BikeHireDockingStation", name: "Station B", totalSlotNumber: 20 };
          const s2: Row = { id: "s2", type: "BikeHireDockingStation", name: "Station A", totalSlotNumber: 30 };
          const s3: Row = { id: "s3", type: "BikeHireDockingStation", name: "Station C", totalSlotNumber: 10 };
          expect(defaultStationId([s1, s2, s3])).toBe("s2");

          const sTie1: Row = { id: "s-z", type: "BikeHireDockingStation", name: "Z-Station", totalSlotNumber: 30 };
          const sTie2: Row = { id: "s-a", type: "BikeHireDockingStation", name: "A-Station", totalSlotNumber: 30 };
          expect(defaultStationId([sTie1, sTie2])).toBe("s-a");
        });
      });

      describe("readHash and writeHash", () => {
        it("round trips station id in URL hash", () => {
          const urn = "urn:ngsi-ld:BikeHireDockingStation:hel.fi:helsinki:001";
          const hash = writeHash(urn);
          expect(hash).toBe(`#station?id=${encodeURIComponent(urn)}`);
          expect(readHash(hash)).toEqual({ stationId: urn });
        });

        it("ignores junk and malformed parameters", () => {
          expect(readHash("")).toEqual({ stationId: null });
          expect(readHash("#")).toEqual({ stationId: null });
          expect(readHash("#station")).toEqual({ stationId: null });
          expect(readHash("#station?other=123")).toEqual({ stationId: null });
          expect(readHash("#station?id=")).toEqual({ stationId: null });
          expect(readHash("#station?id=   ")).toEqual({ stationId: null });
          expect(readHash("#station?id=valid-id&other=xyz")).toEqual({ stationId: "valid-id" });
        });
      });

      describe("daysAgoIso", () => {
        it("returns the exact ISO string 7 days prior to given date", () => {
          const fixed = new Date("2026-10-15T12:00:00.000Z");
          const result = daysAgoIso(7, fixed);
          expect(daysAgoIso(3, fixed)).toBe("2026-10-12T12:00:00.000Z");
          expect(result).toBe("2026-10-08T12:00:00.000Z");
          expect(fixed.getTime() - new Date(result).getTime()).toBe(7 * 24 * 60 * 60 * 1000);
        });

        it("defaults to 7 days before current time when called without arguments", () => {
          const before = Date.now();
          const result = daysAgoIso();
          const after = Date.now();
          const diff = before - new Date(result).getTime();
          expect(diff).toBeGreaterThanOrEqual(7 * 24 * 60 * 60 * 1000 - 50);
          expect(after - new Date(result).getTime()).toBeLessThanOrEqual(7 * 24 * 60 * 60 * 1000 + 50);
        });
      });

      describe("toInput", () => {
        it("drops non-numeric bike values while preserving valid ones", () => {
          const bikePoints: TemporalPoint[] = [
            { observedAt: "2026-10-01T10:00:00Z", value: 12 },
            { observedAt: "2026-10-01T11:00:00Z", value: "15" },
            { observedAt: "2026-10-01T12:00:00Z", value: "non-numeric" },
            { observedAt: "2026-10-01T13:00:00Z", value: null },
            { observedAt: "2026-10-01T14:00:00Z", value: NaN },
            { observedAt: "2026-10-01T15:00:00Z", value: Infinity },
            { observedAt: "2026-10-01T16:00:00Z", value: "" },
            { observedAt: "2026-10-01T17:00:00Z", value: 0 },
          ];

          const input = toInput({
            nowSec: 1_700_000_000,
            totalSlots: 30,
            bikePoints,
          });

          expect(input.now).toBe(1_700_000_000);
          expect(input.totalSlots).toBe(30);
          expect(input.bikes).toEqual([
            { at: "2026-10-01T10:00:00Z", value: 12 },
            { at: "2026-10-01T11:00:00Z", value: 15 },
            { at: "2026-10-01T17:00:00Z", value: 0 },
          ]);
        });

        it("merges temperature and precipitation points, dropping non-numeric values", () => {
          const tempPoints: TemporalPoint[] = [
            { observedAt: "2026-10-01T10:00:00Z", value: 14.5 },
            { observedAt: "2026-10-01T11:00:00Z", value: "bad-temp" },
            { observedAt: "2026-10-01T12:00:00Z", value: 16.0 },
          ];
          const precPoints: TemporalPoint[] = [
            { observedAt: "2026-10-01T10:00:00Z", value: 0.0 },
            { observedAt: "2026-10-01T11:00:00Z", value: 2.5 },
            { observedAt: "2026-10-01T13:00:00Z", value: 1.0 },
          ];

          const input = toInput({
            nowSec: 1_700_000_000,
            totalSlots: 20,
            bikePoints: [],
            tempPoints,
            precPoints,
          });

          expect(input.weather).toEqual([
            { at: "2026-10-01T10:00:00Z", temperature: 14.5, precipitation: 0.0 },
            { at: "2026-10-01T11:00:00Z", temperature: null, precipitation: 2.5 },
            { at: "2026-10-01T12:00:00Z", temperature: 16.0, precipitation: null },
            { at: "2026-10-01T13:00:00Z", temperature: null, precipitation: 1.0 },
          ]);
        });

        it("preserves pre-aligned weatherPoints directly when provided", () => {
          const weatherPoints = [{ at: "2026-10-01T10:00:00Z", temperature: 15.0, precipitation: 0.0 }];
          const input = toInput({
            nowSec: 1_700_000_000,
            totalSlots: 20,
            bikePoints: [],
            weatherPoints,
          });
          expect(input.weather).toBe(weatherPoints);
        });
      });
    src__bikes.ts: |
      /**
       * Types and helper functions for city-bike station history, weather alignment,
       * spatial nearest-station selection, hash serialization, and WASM estimation input.
       */
      import type { Cell, Row, TemporalPoint } from "@joinedcontext/sdk";
      import { format, pointOf } from "@joinedcontext/sdk";

      export interface BikeHistoryPoint {
        at: string;
        value: number;
      }

      export interface WeatherHistoryPoint {
        at: string;
        temperature: number | null;
        precipitation: number | null;
      }

      export interface EstimateInput {
        now: number;
        totalSlots: number;
        bikes: BikeHistoryPoint[];
        weather: WeatherHistoryPoint[];
      }

      export interface ProfileSlot {
        slot: number; // 0..167 (Monday 00:00 to Sunday 23:00 Europe/Helsinki)
        mean: number | null;
        count: number;
      }

      export interface WeatherEffect {
        perDegree: number;
        rain: number;
        hours: number;
      }

      export interface HourlyEstimate {
        at: string;
        mean: number;
        low: number;
        high: number;
      }

      export interface WeatherAssumption {
        temperature: number;
        raining: boolean;
      }

      export interface EstimateOutput {
        hours: number;
        profile: ProfileSlot[];
        weather: WeatherEffect | null;
        sigma: number | null;
        estimate: HourlyEstimate[];
        assumption: WeatherAssumption | null;
        enough: boolean;
      }

      /** Great-circle distance between two longitude/latitude points in kilometres. */
      export function haversineKm(lon1: number, lat1: number, lon2: number, lat2: number): number {
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return 6371 * c;
      }

      /** Finds the weather station nearest to the given bike station within maxDistanceKm (default 10 km). */
      export function nearestWeatherStation(
        bikeStation: Row,
        weatherStations: Row[],
        maxDistanceKm = 10,
      ): { station: Row; distanceKm: number } | null {
        const bikePt = pointOf(bikeStation.location);
        if (!bikePt) return null;
        let nearest: { station: Row; distanceKm: number } | null = null;
        for (const w of weatherStations) {
          const wPt = pointOf(w.location);
          if (!wPt) continue;
          const dist = haversineKm(bikePt[0], bikePt[1], wPt[0], wPt[1]);
          if (dist <= maxDistanceKm) {
            if (!nearest || dist < nearest.distanceKm) {
              nearest = { station: w, distanceKm: dist };
            }
          }
        }
        return nearest;
      }

      /** Display name for a station entity. */
      export function stationName(row: Row): string {
        const name = format(row.name).trim();
        return (name.startsWith("urn:") ? "" : name) || row.id;
      }

      /** Total docking slots of a station. */
      export function stationSlots(row: Row): number {
        const n = Number(row.totalSlotNumber);
        return Number.isFinite(n) && n > 0 ? n : 0;
      }

      /** Available bikes now at a station. */
      export function stationBikes(row: Row): number {
        const n = Number(row.availableBikeNumber);
        return Number.isFinite(n) && n >= 0 ? n : 0;
      }

      /** Free docking slots now at a station. */
      export function stationFreeSlots(row: Row): number {
        const n = Number(row.freeSlotNumber);
        return Number.isFinite(n) && n >= 0 ? n : 0;
      }

      /** Selects the station with the most docking slots, breaking ties by name. */
      export function defaultStationId(stations: Row[]): string | null {
        if (stations.length === 0) return null;
        const sorted = [...stations].sort((a, b) => {
          const slotsDiff = stationSlots(b) - stationSlots(a);
          if (slotsDiff !== 0) return slotsDiff;
          return stationName(a).localeCompare(stationName(b));
        });
        return sorted[0]?.id ?? null;
      }

      /** Parses station id from hash `#station?id=<urn>`. */
      export function readHash(hash: string): { stationId: string | null } {
        const qIdx = hash.indexOf("?");
        if (qIdx < 0) return { stationId: null };
        const params = new URLSearchParams(hash.slice(qIdx + 1));
        const id = params.get("id");
        return { stationId: id && id.trim() !== "" ? id.trim() : null };
      }

      /** Formats station id into hash `#station?id=<urn>`. */
      export function writeHash(stationId: string, page = "station"): string {
        return `#${page}?id=${encodeURIComponent(stationId)}`;
      }

      /** The ISO 8601 instant exactly `days` days before `now`. */
      export function daysAgoIso(days = 7, now: Date = new Date()): string {
        return new Date(now.getTime() - days * 24 * 60 * 60 * 1000).toISOString();
      }

      export interface ToInputParams {
        nowSec?: number;
        totalSlots: number;
        bikePoints: TemporalPoint[];
        tempPoints?: TemporalPoint[];
        precPoints?: TemporalPoint[];
        weatherPoints?: WeatherHistoryPoint[];
      }

      function parseNumericCell(val: Cell): number | null {
        if (typeof val === "number" && Number.isFinite(val)) return val;
        if (typeof val === "string" && val.trim() !== "") {
          const parsed = Number(val);
          if (Number.isFinite(parsed)) return parsed;
        }
        return null;
      }

      /** Transforms raw SDK temporal points into the shape expected by the Rust/WASM module. */
      export function toInput({
        nowSec,
        totalSlots,
        bikePoints,
        tempPoints = [],
        precPoints = [],
        weatherPoints,
      }: ToInputParams): EstimateInput {
        const bikes: BikeHistoryPoint[] = bikePoints
          .map((p) => {
            const v = parseNumericCell(p.value);
            return v !== null ? { at: p.observedAt, value: v } : null;
          })
          .filter((p): p is BikeHistoryPoint => p !== null);

        let weather: WeatherHistoryPoint[] = [];
        if (weatherPoints) {
          weather = weatherPoints;
        } else {
          const map = new Map<string, { temperature: number | null; precipitation: number | null }>();
          for (const p of tempPoints) {
            const v = parseNumericCell(p.value);
            const entry = map.get(p.observedAt) ?? { temperature: null, precipitation: null };
            entry.temperature = v;
            map.set(p.observedAt, entry);
          }
          for (const p of precPoints) {
            const v = parseNumericCell(p.value);
            const entry = map.get(p.observedAt) ?? { temperature: null, precipitation: null };
            entry.precipitation = v;
            map.set(p.observedAt, entry);
          }
          weather = Array.from(map.entries())
            .map(([at, data]) => ({ at, temperature: data.temperature, precipitation: data.precipitation }))
            .sort((a, b) => a.at.localeCompare(b.at));
        }

        return {
          now: nowSec ?? Math.floor(Date.now() / 1000),
          totalSlots,
          bikes,
          weather,
        };
      }
    src__components__ChartCard.tsx: |
      import type { ReactNode } from "react";
      import { useEffect, useRef } from "react";
      import * as echarts from "echarts";
      import { currentTokens, echartsTheme, Empty, Loading } from "@joinedcontext/sdk";

      /** One ECharts chart with a caption, in the SDK's theme; the loading and empty states in its place. */
      export function ChartCard({
        title,
        option,
        height = 280,
        loading,
        empty,
      }: {
        title: string;
        option: Record<string, unknown> | null;
        height?: number;
        loading?: boolean;
        empty?: ReactNode;
      }): React.JSX.Element {
        const containerRef = useRef<HTMLDivElement | null>(null);
        const chartRef = useRef<echarts.ECharts | null>(null);
        const showCanvas = !loading && option !== null;

        useEffect(() => {
          const el = containerRef.current;
          if (!showCanvas || !el) return;
          const chart = echarts.init(el, echartsTheme(currentTokens()), { renderer: "canvas" });
          chartRef.current = chart;
          const observer = typeof ResizeObserver === "undefined" ? undefined : new ResizeObserver(() => chart.resize());
          observer?.observe(el);
          return () => {
            observer?.disconnect();
            chart.dispose();
            chartRef.current = null;
          };
        }, [showCanvas]);

        useEffect(() => {
          if (chartRef.current && option) chartRef.current.setOption(option, true);
        }, [option, showCanvas]);

        return (
          <figure className="jc-chart">
            <figcaption>{title}</figcaption>
            {loading ? (
              <Loading />
            ) : option === null ? (
              <Empty>{empty}</Empty>
            ) : (
              <div className="jc-chart-canvas" role="img" aria-label={title} style={{ height }} ref={containerRef} />
            )}
          </figure>
        );
      }
    src__components__History.tsx: |
      import { useCallback, useEffect, useState } from "react";
      import { Card, Empty, Loading } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { moment, t } from "../i18n";
      import type { Lang } from "../i18n";
      import type { HistoryRow, Server } from "../server";

      /** The App's history, from its `app_audit` table: a viewer's own changes, a steward's everyone's. */
      export function History({ lang, api }: { lang: Lang; api: Server }) {
        const { me, steward } = useAccess();
        const [rows, setRows] = useState<HistoryRow[] | null>(null);
        const [failed, setFailed] = useState<string | null>(null);

        const load = useCallback(async () => {
          setFailed(null);
          try {
            setRows(await api.history());
          } catch (error) {
            setRows([]);
            setFailed(error instanceof Error ? error.message : String(error));
          }
        }, [api, lang]);

        useEffect(() => {
          if (me) void load();
        }, [me, load]);

        const when = (iso: string) => {
          const at = Date.parse(iso);
          return Number.isNaN(at) ? iso : moment(lang, at);
        };

        if (me === null)
          return (
            <Card title={t(lang, "historyTitle")}>
              <Empty>{t(lang, "historySignIn")}</Empty>
            </Card>
          );
        return (
          <Card title={t(lang, "historyTitle")}>
            <p className="app-note">{t(lang, steward ? "historyAll" : "historyMine")}</p>
            <button type="button" className="jc-button" disabled={rows === null} onClick={() => void load()}>
              {t(lang, "refresh")}
            </button>
            {failed && <p className="app-error">{failed}</p>}
            {rows === null ? (
              <Loading label={t(lang, "historyLoading")} />
            ) : rows.length === 0 ? (
              failed ? null : <Empty>{t(lang, "historyEmpty")}</Empty>
            ) : (
              <table className="app-history">
                <caption className="app-sr">{t(lang, "historyTitle")}</caption>
                <thead>
                  <tr>
                    <th scope="col">{t(lang, "when")}</th>
                    <th scope="col">{t(lang, "who")}</th>
                    <th scope="col">{t(lang, "what")}</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((row) => (
                    <tr key={row.id}>
                      <td>{when(row.at)}</td>
                      <td>{row.actorName}</td>
                      <td>
                        {t(lang, row.action)}: {row.summary}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </Card>
        );
      }
    src__components__ModelHistory.test.tsx: |
      import { render, screen, waitFor, within } from "@testing-library/react";
      import userEvent from "@testing-library/user-event";
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { ModelHistory } from "./ModelHistory";
      import { Problem } from "../server";
      import { memory } from "../testing/server";
      import type { Model, Models, Server } from "../server";

      const STATION = "urn:ngsi-ld:BikeHireDockingStation:hel.fi:helsinki:001";

      const model = (id: number, day: string, per: number | null, rain: number | null, sigma: number | null): Model => ({
        id,
        trained_on: day,
        trained_at: `${day}T06:00:00Z`,
        hours: 160,
        enough: true,
        per_degree: per,
        rain,
        sigma,
        weather_station: per === null ? null : "urn:ngsi-ld:WeatherObserved:w1",
      });

      function serverOf(kept: Models | Error, snapshot: string | Error = "https://store.test/training/2030-10-21/ab.json"): Server & { asked: string[] } {
        const asked: string[] = [];
        return {
          ...memory(),
          asked,
          models: async (station) => {
            asked.push(station);
            if (kept instanceof Error) throw kept;
            return kept;
          },
          snapshotUrl: async () => {
            if (snapshot instanceof Error) throw snapshot;
            return snapshot;
          },
        };
      }

      describe("the station's model over time", () => {
        afterEach(() => vi.restoreAllMocks());

        it("lists the kept models, the newest first, says they are as last kept, and opens a day's training data", async () => {
          const server = serverOf({ models: [{ ...model(2, "2030-10-21", 0.42, -1.5, 2.25), days: 3 }, model(1, "2030-10-20", null, null, null)], stale: true });
          const open = vi.spyOn(window, "open").mockReturnValue(null);
          const { rerender } = render(<ModelHistory lang="en" server={server} station={STATION} />);
          const table = await screen.findByRole("table", { name: "The station's model over time: kept by the server" });
          expect(within(table).getAllByRole("row").map((row) => row.textContent)).toEqual([
            "Trained onDaysHoursBikes per °CRainSpread (σ)Training data",
            "21 Oct 20303160+0.42-1.52.25Training data",
            "20 Oct 20307160–––Training data",
          ]);
          expect(server.asked).toEqual([STATION]);
          // A steward's change of the inputs reads the models again.
          rerender(<ModelHistory lang="en" server={server} station={STATION} version={1} />);
          await waitFor(() => expect(server.asked).toEqual([STATION, STATION]));
          expect(screen.getByText("The data could not be read just now: these are the models as kept.")).toBeInTheDocument();
          const user = userEvent.setup();
          await user.click(screen.getByRole("button", { name: "Download the training data of 21 Oct 2030" }));
          await user.click(screen.getByRole("button", { name: "Download the training data of 20 Oct 2030" }));
          await waitFor(() => expect(open).toHaveBeenCalledTimes(2));
          expect(open).toHaveBeenCalledWith("https://store.test/training/2030-10-21/ab.json", "_blank", "noopener");
        });

        it("says in Finnish when a day's training data cannot be downloaded", async () => {
          render(<ModelHistory lang="fi" server={serverOf({ models: [model(2, "2030-10-21", 0.4, 0, 1)], stale: false }, new Problem(404, "no such model"))} station={STATION} />);
          await userEvent.setup().click(await screen.findByRole("button", { name: "Lataa 21.10.2030 opetusdata" }));
          expect(await screen.findByRole("alert")).toHaveTextContent("Opetusdataa ei voitu ladata: no such model");
        });

        it("says when nothing is kept yet, and when the models cannot be read", async () => {
          const { unmount } = render(<ModelHistory lang="en" server={serverOf({ models: [], stale: false })} station={STATION} />);
          expect(screen.getByText("Reading the kept models…")).toBeInTheDocument();
          expect(await screen.findByText("The server has not kept a model of this station yet.")).toBeInTheDocument();
          unmount();
          render(<ModelHistory lang="en" server={serverOf(new Problem(404, "the Endpoint holds no such station"))} station={STATION} />);
          expect(await screen.findByRole("alert")).toHaveTextContent("The models could not be read: the Endpoint holds no such station");
        });
      });
    src__components__ModelHistory.tsx: |
      import { useEffect, useState } from "react";
      import { Card, Empty } from "@joinedcontext/sdk";
      import { locale, number, t } from "../i18n";
      import type { Lang } from "../i18n";
      import type { Models, Server } from "../server";

      const reason = (error: unknown) => (error instanceof Error ? error.message : String(error));

      /** A kept day, `YYYY-MM-DD`, in the language's way; noon so every zone reads the same day. */
      function dayOf(lang: Lang, date: string): string {
        return new Intl.DateTimeFormat(locale(lang), { timeZone: "Europe/Helsinki", dateStyle: "medium" }).format(Date.parse(`${date}T12:00:00Z`));
      }

      /** A coefficient with its sign, or a dash where the model has none. */
      const signed = (lang: Lang, value: number | null) => (value === null ? "–" : `${value > 0 ? "+" : ""}${number(lang, value, 2)}`);

      /**
       * The selected station's model day by day as the App's server kept it (T-3355): its weather
       * coefficients and spread, and the data each day's model was trained on as a file.
       */
      export function ModelHistory({ lang, server, station, version = 0 }: { lang: Lang; server: Server; station: string; version?: number }) {
        const [kept, setKept] = useState<Models | null>(null);
        const [failed, setFailed] = useState<string | null>(null);
        const [download, setDownload] = useState<string | null>(null);

        useEffect(() => {
          setKept(null);
          setFailed(null);
          let gone = false;
          server.models(station).then(
            (answer) => !gone && setKept(answer),
            (error: unknown) => !gone && setFailed(reason(error)),
          );
          return () => {
            gone = true;
          };
        }, [server, station, version]);

        const open = async (id: number) => {
          setDownload(null);
          try {
            window.open(await server.snapshotUrl(id), "_blank", "noopener");
          } catch (error) {
            setDownload(t(lang, "trainingFailed", { reason: reason(error) }));
          }
        };

        return (
          <Card title={t(lang, "models")}>
            <p className="app-note">{t(lang, "modelsNote")}</p>
            {download && (
              <p className="jc-problem" role="alert">
                {download}
              </p>
            )}
            {failed ? (
              <p className="jc-problem" role="alert">
                {t(lang, "modelsFailed", { reason: failed })}
              </p>
            ) : !kept ? (
              <p className="app-note">{t(lang, "modelsReading")}</p>
            ) : kept.models.length === 0 ? (
              <Empty>{t(lang, "modelsEmpty")}</Empty>
            ) : (
              <>
                {kept.stale && <p className="app-note">{t(lang, "modelsStale")}</p>}
                {/* Scrolls sideways on a phone: a keyboard reaches it as a named region (WCAG 2.1.1). */}
                <div className="jc-table-wrap" tabIndex={0} role="region" aria-label={t(lang, "models")}>
                  <table className="jc-table" aria-label={t(lang, "models")}>
                    <thead>
                      <tr>
                        <th scope="col">{t(lang, "trainedOn")}</th>
                        <th scope="col">{t(lang, "trainedDays")}</th>
                        <th scope="col">{t(lang, "trainedHours")}</th>
                        <th scope="col">{t(lang, "perDegree")}</th>
                        <th scope="col">{t(lang, "rainEffect")}</th>
                        <th scope="col">{t(lang, "spread")}</th>
                        <th scope="col">{t(lang, "trainingData")}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {kept.models.map((model) => (
                        <tr key={model.id}>
                          <th scope="row">{dayOf(lang, model.trained_on)}</th>
                          <td className="jc-num">{model.days ?? 7}</td>
                          <td className="jc-num">{number(lang, model.hours, 0)}</td>
                          <td className="jc-num">{signed(lang, model.per_degree)}</td>
                          <td className="jc-num">{signed(lang, model.rain)}</td>
                          <td className="jc-num">{model.sigma === null ? "–" : number(lang, model.sigma, 2)}</td>
                          <td>
                            <button
                              type="button"
                              className="jc-button"
                              aria-label={t(lang, "trainingDataOf", { day: dayOf(lang, model.trained_on) })}
                              onClick={() => void open(model.id)}
                            >
                              {t(lang, "trainingData")}
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </>
            )}
          </Card>
        );
      }
    src__components__ModelInputs.tsx: |
      import { useEffect, useState } from "react";
      import { Card } from "@joinedcontext/sdk";
      import type { Row } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { stationName } from "../bikes";
      import { moment, number, t } from "../i18n";
      import type { Lang } from "../i18n";
      import type { Inputs, NewInputs, Server } from "../server";

      const reason = (error: unknown) => (error instanceof Error ? error.message : String(error));

      const draftOf = (inputs: Inputs) => ({ weatherStation: inputs.weatherStation ?? "", radiusKm: String(inputs.radiusKm), days: String(inputs.days), note: inputs.note });

      /** The draft as the server would take it, or the word that says what is wrong. */
      export function checkedDraft(draft: { weatherStation: string; radiusKm: string; days: string; note: string }): NewInputs | "radiusRange" | "daysRange" | "noteLong" {
        const radiusKm = Number(draft.radiusKm.replace(",", "."));
        const days = Number(draft.days);
        if (!draft.radiusKm.trim() || !Number.isFinite(radiusKm) || radiusKm < 1 || radiusKm > 25) return "radiusRange";
        if (!Number.isInteger(days) || days < 1 || days > 7) return "daysRange";
        if (draft.note.trim().length > 200) return "noteLong";
        return { weatherStation: draft.weatherStation || null, radiusKm, days, note: draft.note.trim() };
      }

      /**
       * A station's model inputs (T-3827): which weather station its model reads, how far the nearest may
       * be, and how many days it trains on. Everyone reads them; a steward changes them, saved at once on
       * screen and taken back when the server refuses; today's model is trained again on them.
       */
      export function ModelInputs({
        lang,
        server,
        station,
        weatherStations,
        inputs,
        failed,
        onInputs,
        onSaved,
      }: {
        lang: Lang;
        server: Server;
        station: string;
        weatherStations: Row[];
        inputs: Inputs | null;
        /** Why the inputs could not be read. */
        failed: string | null;
        onInputs: (inputs: Inputs) => void;
        onSaved: () => void;
      }) {
        const { me, steward } = useAccess();
        const [draft, setDraft] = useState({ weatherStation: "", radiusKm: "10", days: "7", note: "" });
        const [busy, setBusy] = useState(false);
        const [problem, setProblem] = useState<string | null>(null);
        const [done, setDone] = useState<string | null>(null);

        // The form takes the inputs as read, and as saved; a refused save leaves what was typed, to try again.
        const loaded = inputs === null ? null : inputs.station;
        useEffect(() => {
          if (inputs) setDraft(draftOf(inputs));
        }, [loaded]);
        useEffect(() => {
          setProblem(null);
          setDone(null);
        }, [station]);

        // The reason a control is closed, as its tooltip: never a silent no-op.
        const closed = steward ? undefined : t(lang, me ? "inputsStewardOnly" : "inputsSignIn");
        const checked = checkedDraft(draft);

        const change = async (next: Inputs, write: () => Promise<Inputs>, word: "inputsSaved" | "inputsReset") => {
          if (!inputs) return;
          const before = inputs;
          setBusy(true);
          setProblem(null);
          setDone(null);
          onInputs(next);
          try {
            const saved = await write();
            onInputs(saved);
            setDraft(draftOf(saved));
            setDone(t(lang, word));
            onSaved();
          } catch (error) {
            onInputs(before);
            setProblem(t(lang, "inputsRefused", { reason: reason(error) }));
          } finally {
            setBusy(false);
          }
        };

        const save = () => {
          if (typeof checked === "string" || !inputs) return;
          void change(
            { ...inputs, ...checked, custom: true, updatedBy: me?.name ?? null, updatedAt: new Date().toISOString() },
            () => server.setInputs(station, checked),
            "inputsSaved",
          );
        };
        const reset = () => {
          if (!inputs) return;
          void change(
            { station, weatherStation: null, radiusKm: 10, days: 7, note: "", custom: false, updatedBy: null, updatedAt: null },
            async () => {
              await server.resetInputs(station);
              return server.inputs(station);
            },
            "inputsReset",
          );
        };

        const nameOf = (id: string) => {
          const found = weatherStations.find((w) => w.id === id);
          return found ? stationName(found) : id;
        };
        const updated = inputs?.updatedAt ? Date.parse(inputs.updatedAt) : NaN;

        return (
          <Card title={t(lang, "inputsTitle")}>
            {failed ? (
              <p className="jc-problem" role="alert">
                {t(lang, "inputsFailed", { reason: failed })}
              </p>
            ) : !inputs ? (
              <p className="app-note">{t(lang, "inputsReading")}</p>
            ) : (
              <>
                <p className="app-note" data-testid="inputs-now">
                  {t(lang, "inputsNow", {
                    weather: inputs.weatherStation ? nameOf(inputs.weatherStation) : t(lang, "inputsNearest", { km: number(lang, inputs.radiusKm, 1) }),
                    days: inputs.days,
                  })}{" "}
                  {inputs.custom
                    ? t(lang, "inputsSetBy", { who: inputs.updatedBy ?? "–", at: Number.isNaN(updated) ? "–" : moment(lang, updated) })
                    : t(lang, "inputsDefaults")}
                </p>
                {inputs.custom && inputs.note && <blockquote className="app-quote">{inputs.note}</blockquote>}
                <form
                  className="app-inputs"
                  aria-label={t(lang, "inputsTitle")}
                  onSubmit={(event) => {
                    event.preventDefault();
                    save();
                  }}
                >
                  <p className="app-note">{steward ? t(lang, "inputsLead") : closed}</p>
                  <label>
                    <span>{t(lang, "inputsWeather")}</span>
                    <select
                      value={draft.weatherStation}
                      disabled={!steward || busy}
                      title={closed}
                      onChange={(event) => setDraft({ ...draft, weatherStation: event.target.value })}
                    >
                      <option value="">{t(lang, "inputsNearestOption")}</option>
                      {weatherStations.map((w) => (
                        <option key={w.id} value={w.id}>
                          {stationName(w)}
                        </option>
                      ))}
                    </select>
                  </label>
                  <label>
                    <span>{t(lang, "inputsRadius")}</span>
                    <input
                      inputMode="decimal"
                      value={draft.radiusKm}
                      disabled={!steward || busy}
                      title={closed}
                      aria-invalid={checked === "radiusRange"}
                      onChange={(event) => setDraft({ ...draft, radiusKm: event.target.value })}
                    />
                  </label>
                  <label>
                    <span>{t(lang, "inputsDays")}</span>
                    <input
                      inputMode="numeric"
                      value={draft.days}
                      disabled={!steward || busy}
                      title={closed}
                      aria-invalid={checked === "daysRange"}
                      onChange={(event) => setDraft({ ...draft, days: event.target.value })}
                    />
                  </label>
                  <label>
                    <span>{t(lang, "inputsNote")}</span>
                    <input
                      value={draft.note}
                      maxLength={200}
                      disabled={!steward || busy}
                      title={closed}
                      onChange={(event) => setDraft({ ...draft, note: event.target.value })}
                    />
                  </label>
                  {steward && typeof checked === "string" && (
                    <p className="app-error" role="alert">
                      {t(lang, checked)}
                    </p>
                  )}
                  <div className="app-inputs-actions">
                    <button type="submit" className="jc-button" disabled={!steward || busy || typeof checked === "string"} title={closed}>
                      {t(lang, "inputsSave")}
                    </button>
                    <button
                      type="button"
                      className="jc-button"
                      disabled={!steward || busy || !inputs.custom}
                      title={closed ?? (inputs.custom ? undefined : t(lang, "inputsAlreadyDefaults"))}
                      onClick={reset}
                    >
                      {t(lang, "inputsResetButton")}
                    </button>
                  </div>
                </form>
                {problem && (
                  <p className="app-error" role="alert">
                    {problem}
                  </p>
                )}
                {done && (
                  <p className="app-note" role="status">
                    {done}
                  </p>
                )}
              </>
            )}
          </Card>
        );
      }
    src__components__StationMap.test.tsx: |
      import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
      import { render, waitFor } from "@testing-library/react";
      import { JcProvider } from "@joinedcontext/sdk";
      import { stubClient } from "@joinedcontext/sdk/testing";
      import { STATION_1, STATION_2, STATION_3 } from "../fixtures/bikes";
      import { StationMap } from "./StationMap";

      type Handler = (event?: unknown) => void;

      /** A MapLibre double that keeps every handler the map registers, and what it was given. */
      const maps = vi.hoisted(() => ({
        made: [] as Array<{
          handlers: Record<string, Handler>;
          data: unknown[];
          fitted: unknown[];
          resized: number;
          canvas: { style: { cursor: string } };
          removed: boolean;
        }>,
      }));

      vi.mock("maplibre-gl", () => ({
        Map: class {
          state = { handlers: {} as Record<string, Handler>, data: [] as unknown[], fitted: [] as unknown[], resized: 0, canvas: { style: { cursor: "" } }, removed: false };
          constructor() {
            maps.made.push(this.state);
          }
          on(event: string, layerOrHandler: unknown, handler?: Handler) {
            this.state.handlers[typeof layerOrHandler === "string" ? `${event}:${layerOrHandler}` : event] = (handler ?? layerOrHandler) as Handler;
          }
          once(event: string, handler: Handler) {
            this.state.handlers[`once:${event}`] = handler;
          }
          addSource = vi.fn();
          addLayer = vi.fn();
          setPaintProperty = vi.fn();
          getSource = () => ({ setData: (data: unknown) => this.state.data.push(data) });
          fitBounds = (bounds: unknown) => this.state.fitted.push(bounds);
          resize = () => {
            this.state.resized += 1;
          };
          getCanvas = () => this.state.canvas;
          remove = () => {
            this.state.removed = true;
            this.state.handlers["once:remove"]?.();
          };
        },
        setWorkerUrl: vi.fn(),
      }));

      /** The ResizeObserver the map watches its box with, kept so a test can say the box changed. */
      let resized: (() => void) | null = null;
      let disconnected = 0;

      beforeEach(() => {
        maps.made.length = 0;
        vi.stubGlobal(
          "ResizeObserver",
          class {
            constructor(callback: () => void) {
              resized = callback;
            }
            observe() {}
            disconnect() {
              disconnected += 1;
            }
          },
        );
      });
      afterEach(() => vi.unstubAllGlobals());

      const NOWHERE = { ...STATION_2, id: "urn:ngsi-ld:BikeHireDockingStation:nowhere", location: null };

      function draw(onSelect = vi.fn(), basemap?: string) {
        const view = render(
          <JcProvider client={stubClient({}, { appName: "bike-weather-demand", ...(basemap ? { basemap } : {}) })}>
            <StationMap stations={[STATION_1, STATION_3, NOWHERE]} selectedId={STATION_1.id} onSelect={onSelect} label="Stations on map" />
          </JcProvider>,
        );
        return { view, onSelect };
      }

      describe("the station map", () => {
        it("draws the stations that have a position, the chosen one marked, and fits them once", async () => {
          draw();
          await waitFor(() => expect(maps.made).toHaveLength(1));
          const [map] = maps.made;
          map.handlers.load();
          await waitFor(() => expect(map.data).toHaveLength(1));
          const drawn = map.data[0] as { features: Array<{ id: string; properties: { selected: number } }> };
          expect(drawn.features.map((feature) => feature.id)).toEqual([STATION_1.id, STATION_3.id]);
          expect(drawn.features[0].properties.selected).toBe(1);
          expect(map.fitted).toHaveLength(1);
        });

        it("picks a station by its circle, ignores a click on nothing, and shows a pointer over a circle", async () => {
          const { onSelect } = draw();
          await waitFor(() => expect(maps.made).toHaveLength(1));
          const [map] = maps.made;
          map.handlers.load();
          map.handlers["click:stations-circle"]({ features: [] });
          expect(onSelect).not.toHaveBeenCalled();
          map.handlers["click:stations-circle"]({ features: [{ properties: { id: STATION_3.id } }] });
          expect(onSelect).toHaveBeenCalledWith(STATION_3.id);
          map.handlers["mouseenter:stations-circle"]();
          expect(map.canvas.style.cursor).toBe("pointer");
          map.handlers["mouseleave:stations-circle"]();
          expect(map.canvas.style.cursor).toBe("");
        });

        it("keeps its fit when the box changes, says a map error, and lets go of the box when removed", async () => {
          const errors = vi.spyOn(console, "error").mockImplementation(() => undefined);
          const { view } = draw(vi.fn(), "https://tiles.example.org/style.json");
          await waitFor(() => expect(maps.made).toHaveLength(1));
          const [map] = maps.made;
          resized?.();
          expect(map.resized).toBe(1);
          map.handlers.load();
          await waitFor(() => expect(map.fitted).toHaveLength(1));
          resized?.();
          expect(map.resized).toBe(2);
          expect(map.fitted).toHaveLength(2);
          map.handlers.error({ error: { message: "tile refused" } });
          map.handlers.error({});
          expect(errors).toHaveBeenCalledWith("bike-weather-demand: map error", "tile refused");
          const before = disconnected;
          view.unmount();
          expect(map.removed).toBe(true);
          expect(disconnected).toBe(before + 1);
          // Gone: a late resize or load does nothing.
          resized?.();
          map.handlers.load();
          expect(map.resized).toBe(2);
        });

        it("makes no map when it is gone before the map's worker is ready", async () => {
          const { view } = draw();
          view.unmount();
          await new Promise((settle) => setTimeout(settle, 0));
          expect(maps.made).toHaveLength(0);
        });
      });
    src__components__StationMap.tsx: |
      import { useEffect, useMemo, useRef, useState } from "react";
      import { Map as MapLibreMap } from "maplibre-gl";
      import type { GeoJSONSource, MapGeoJSONFeature, MapMouseEvent } from "maplibre-gl";
      import { currentTokens, mapWorkerReady, NO_BASEMAP, pointOf, styleFor, useClient } from "@joinedcontext/sdk";
      import type { Row } from "@joinedcontext/sdk";
      import { stationBikes, stationName, stationSlots } from "../bikes";

      export interface StationMapProps {
        stations: Row[];
        selectedId: string | null;
        onSelect: (id: string) => void;
        label: string;
      }

      /**
       * Renders city-bike stations as circle markers on MapLibre: circles are coloured by available
       * bikes now and high-contrast borders highlight the currently selected station. Clicking selects.
       */
      export function StationMap({ stations, selectedId, onSelect, label }: StationMapProps): React.JSX.Element {
        const client = useClient();
        const basemap = client.config.basemap;
        const container = useRef<HTMLDivElement | null>(null);
        const map = useRef<MapLibreMap | null>(null);
        const [ready, setReady] = useState(false);
        const fitted = useRef(false);
        const extent = useRef<[[number, number], [number, number]] | null>(null);
        const onSelectRef = useRef(onSelect);
        onSelectRef.current = onSelect;
        const tokens = useMemo(() => currentTokens(), []);

        const maxBikes = useMemo(() => {
          const vals = stations.map(stationBikes);
          return vals.length > 0 ? Math.max(...vals, 1) : 1;
        }, [stations]);

        const geoData = useMemo(() => {
          const features = stations
            .map((s) => {
              const pt = pointOf(s.location);
              if (!pt) return null;
              const avail = stationBikes(s);
              const slots = stationSlots(s);
              return {
                type: "Feature" as const,
                id: s.id,
                properties: {
                  id: s.id,
                  name: stationName(s),
                  available: avail,
                  slots,
                  selected: s.id === selectedId ? 1 : 0,
                },
                geometry: {
                  type: "Point" as const,
                  coordinates: pt,
                },
              };
            })
            .filter((f): f is NonNullable<typeof f> => f !== null);

          return {
            type: "FeatureCollection" as const,
            features,
          };
        }, [stations, selectedId]);

        const allCoords = useMemo(() => {
          const coords: [number, number][] = [];
          for (const s of stations) {
            const pt = pointOf(s.location);
            if (pt) coords.push(pt);
          }
          return coords;
        }, [stations]);

        useEffect(() => {
          let gone = false;
          let instance: MapLibreMap | null = null;

          void mapWorkerReady().then(() => {
            if (gone || !container.current || map.current) return;
            instance = new MapLibreMap({
              container: container.current,
              style: styleFor(basemap),
              center: [24.94, 60.19],
              zoom: 11,
              canvasContextAttributes: { preserveDrawingBuffer: true },
            });
            map.current = instance;

            const box = new ResizeObserver(() => {
              if (gone || !instance) return;
              instance.resize();
              if (extent.current) instance.fitBounds(extent.current, { padding: 24, maxZoom: 14, duration: 0 });
            });
            box.observe(container.current);
            instance.once("remove", () => box.disconnect());
            instance.on("error", (event) => console.error("bike-weather-demand: map error", event.error?.message ?? event));

            instance.on("load", () => {
              if (gone || !instance) return;
              instance.addSource("stations", { type: "geojson", data: { type: "FeatureCollection", features: [] } });

              instance.addLayer({
                id: "stations-circle",
                type: "circle",
                source: "stations",
                paint: {
                  "circle-radius": [
                    "case",
                    ["==", ["get", "selected"], 1],
                    9,
                    6,
                  ],
                  "circle-color": [
                    "interpolate-lab",
                    ["linear"],
                    ["get", "available"],
                    0,
                    tokens.map.low,
                    maxBikes,
                    tokens.map.high,
                  ],
                  "circle-stroke-color": [
                    "case",
                    ["==", ["get", "selected"], 1],
                    tokens.map.selected,
                    tokens.map.stroke,
                  ],
                  "circle-stroke-width": [
                    "case",
                    ["==", ["get", "selected"], 1],
                    3,
                    1.5,
                  ],
                },
              });

              instance.on("click", "stations-circle", (event: MapMouseEvent & { features?: MapGeoJSONFeature[] }) => {
                const id = event.features?.[0]?.properties?.id;
                if (typeof id === "string") {
                  onSelectRef.current(id);
                }
              });

              instance.on("mouseenter", "stations-circle", () => {
                if (map.current) map.current.getCanvas().style.cursor = "pointer";
              });
              instance.on("mouseleave", "stations-circle", () => {
                if (map.current) map.current.getCanvas().style.cursor = "";
              });

              setReady(true);
            });
          });

          return () => {
            gone = true;
            instance?.remove();
            map.current = null;
          };
        }, [basemap, tokens, maxBikes]);

        useEffect(() => {
          const instance = map.current;
          if (!ready || !instance) return;

          const source = instance.getSource("stations") as GeoJSONSource | undefined;
          if (source) {
            source.setData(geoData);
          }

          instance.setPaintProperty("stations-circle", "circle-radius", [
            "case",
            ["==", ["get", "selected"], 1],
            9,
            6,
          ]);
          instance.setPaintProperty("stations-circle", "circle-stroke-color", [
            "case",
            ["==", ["get", "selected"], 1],
            tokens.map.selected,
            tokens.map.stroke,
          ]);
          instance.setPaintProperty("stations-circle", "circle-stroke-width", [
            "case",
            ["==", ["get", "selected"], 1],
            3,
            1.5,
          ]);
          instance.setPaintProperty("stations-circle", "circle-color", [
            "interpolate-lab",
            ["linear"],
            ["get", "available"],
            0,
            tokens.map.low,
            maxBikes,
            tokens.map.high,
          ]);

          if (!fitted.current && allCoords.length > 0) {
            fitted.current = true;
            const lons = allCoords.map((c) => c[0]);
            const lats = allCoords.map((c) => c[1]);
            extent.current = [
              [Math.min(...lons), Math.min(...lats)],
              [Math.max(...lons), Math.max(...lats)],
            ];
            instance.fitBounds(extent.current, { padding: 24, maxZoom: 14, duration: 0 });
          }
        }, [ready, geoData, maxBikes, tokens, allCoords]);

        return (
          <div className="jc-map">
            <div
              className="jc-map-canvas"
              ref={container}
              data-testid="jc-map"
              role="application"
              aria-label={label}
            />
            {!basemap && <span className="jc-map-notice">{NO_BASEMAP}</span>}
          </div>
        );
      }
    src__components__components.css: |
      /* The components' classes, over the token variables the SDK sets from design-tokens.json. Phone
         first (T-2777, UI-84): each view works from 375 px up, and widens by the room it is given. */

      /* The page is the app: no margin around the shell, so a framed app has one scrollbar, the frame's. */
      body {
        margin: 0;
      }

      .jc-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: var(--jc-font-body, "Inter", system-ui, -apple-system, "Segoe UI", sans-serif);
        color: var(--jc-color-ink, #0f172a);
        background: var(--jc-color-surface, #ffffff);
        font-size: var(--jc-font-size-md, 0.875rem);
        line-height: 1.5;
      }

      .jc-shell *, .jc-shell *::before, .jc-shell *::after {
        box-sizing: border-box;
      }

      .jc-header {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-header h1 {
        margin: 0;
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
      }

      /* Many pages scroll sideways on a phone rather than pushing the page wider than the screen. */
      .jc-header nav {
        display: flex;
        gap: var(--jc-space-1, 0.25rem);
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .jc-header nav button {
        all: unset;
        flex: none;
        cursor: pointer;
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 2px solid transparent;
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-header nav button[aria-current="page"] {
        color: var(--jc-color-accent, #0f766e);
        border-bottom-color: var(--jc-color-accent, #0f766e);
      }

      .jc-user {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-main {
        flex: 1;
        padding: var(--jc-space-4, 1rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--jc-space-4, 1rem);
        align-content: start;
      }

      .jc-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: var(--jc-space-3, 0.75rem);
      }

      .jc-tile {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-tile-label {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-tile-value {
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-table-wrap {
        container-type: inline-size;
        overflow-x: auto;
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
        background: var(--jc-color-surface, #ffffff);
      }

      .jc-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      .jc-table th {
        position: sticky;
        top: 0;
        background: var(--jc-color-card, #f8fafc);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        font-size: var(--jc-font-size-sm, 0.75rem);
        font-weight: 600;
      }

      .jc-table th button {
        all: unset;
        cursor: pointer;
        font: inherit;
        color: inherit;
        display: inline-flex;
        align-items: center;
        gap: var(--jc-space-1, 0.25rem);
      }

      .jc-table td {
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-table tbody tr:nth-child(even) {
        background: var(--jc-color-card, #f8fafc);
      }

      .jc-table tbody tr[aria-selected="true"] {
        background: color-mix(in srgb, var(--jc-color-accent, #0f766e) 15%, transparent);
      }

      .jc-table tbody tr[tabindex="0"] {
        cursor: pointer;
      }

      .jc-num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .jc-pager {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--jc-space-3, 0.75rem);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        border-top: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-detail {
        padding: var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-detail header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--jc-space-3, 0.75rem);
      }

      .jc-detail header h2 {
        margin: 0;
        font-size: var(--jc-font-size-lg, 1rem);
      }

      .jc-detail dl {
        display: grid;
        grid-template-columns: minmax(0, max-content) minmax(0, 1fr);
        gap: var(--jc-space-2, 0.5rem) var(--jc-space-4, 1rem);
        margin: 0;
      }

      .jc-detail dt {
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-detail dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .jc-filterbar {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: var(--jc-space-3, 0.75rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-filter {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        font-size: var(--jc-font-size-sm, 0.75rem);
      }

      .jc-filter span {
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-count {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        align-self: center;
      }

      .jc-form {
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-3, 0.75rem);
        max-width: 120rem;
      }

      /* One column on a phone, two from 40rem of the form's own width, three from 100rem (a form at
         1800 px and wider). */
      .jc-form-fields {
        display: grid;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }

      @container (width >= 40rem) {
        .jc-form-fields {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @container (width >= 100rem) {
        .jc-form-fields {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .jc-field {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
      }

      .jc-field span {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      /* One input per language of a LanguageProperty, stacked under the field's name. */
      .jc-field .jc-languages {
        display: grid;
        gap: var(--jc-space-1, 0.25rem);
        font-size: inherit;
        color: inherit;
