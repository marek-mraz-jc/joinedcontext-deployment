    map-worker.ts: |
      // The map's worker, for the built application only. MapLibre looks for its worker beside its own
      // script, and a Vite build has no such file, so the map would never draw; this bundles the worker
      // with the library's shared chunk and hands the library its address. index.html loads it before
      // the application. The Portal's preview builds its own document and inlines the worker instead
      // (the SDK's mapWorkerReady), so it never loads this file.
      import { setWorkerUrl } from "maplibre-gl";
      import mapWorker from "maplibre-gl/dist/maplibre-gl-worker.mjs?worker&url";

      setWorkerUrl(mapWorker);
    migrations__0001_station_models.sql: |
      -- bike-weather-demand's own table (T-3355). The reconciler runs this as the schema's owner, in
      -- the App's own schema, and records it; `if not exists` keeps a second run harmless.

      -- One model per station and day on Helsinki's calendar, trained on the seven days before: the
      -- weather coefficients, the spread of what they leave, the hour-of-week profile, and the key of
      -- the training data under the App's prefix. Kept, so a station's model has a history.
      create table if not exists station_models (
          id bigserial primary key,
          station text not null check (length(station) between 5 and 300),
          trained_on date not null,
          trained_at timestamptz not null default now(),
          hours integer not null check (hours >= 0),
          enough boolean not null,
          per_degree double precision,
          rain double precision,
          sigma double precision,
          weather_station text,
          profile jsonb not null,
          snapshot text not null,
          unique (station, trained_on)
      );
    migrations__0002_roles.sql: |
      -- Roles and edits (T-3827, API/07): a steward tunes a station's model inputs, a weather station to
      -- use instead of the nearest, how far the nearest may be and how many days a model trains on; each
      -- model keeps the days it trained on; every change leaves a row in app_audit. Every statement may
      -- run again and change nothing.
      create table if not exists station_inputs (
          station text primary key check (length(station) between 5 and 300),
          weather_station text check (length(weather_station) <= 300),
          radius_km double precision not null check (radius_km >= 1 and radius_km <= 25),
          days integer not null check (days between 1 and 7),
          note text not null default '' check (length(note) <= 200),
          updated_by text not null,
          updated_by_name text not null,
          updated_at timestamptz not null default now()
      );

      alter table station_models add column if not exists days integer check (days between 1 and 7);

      -- jc_app_sdk::access::AUDIT_TABLE
      create table if not exists app_audit (
          id bigserial primary key,
          at timestamptz not null default now(),
          actor_id text not null,
          actor_name text not null,
          action text not null check (action in ('insert', 'update', 'delete', 'edit')),
          target text not null,
          summary text not null check (length(summary) <= 500)
      );
