      import { afterEach, describe, expect, it, vi } from "vitest";
      import { apiBase, Problem, server } from "./server";

      const json = (status: number, body: unknown) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });

      describe("the App's server", () => {
        afterEach(() => vi.unstubAllGlobals());

        it("answers at /apps/{name}/api, and a name that is not an App's never builds a path", () => {
          expect(apiBase("bike-weather-demand")).toBe("/apps/bike-weather-demand/api");
          expect(apiBase(undefined)).toBe("/api");
          expect(apiBase("../x")).toBe("/api");
        });

        it("asks for a station's models and a model's training data, and an answer that is not a success is a Problem with its detail", async () => {
          const fetch = vi.fn(async (url: string, _init?: RequestInit) => {
            if (url === "/api/models?station=urn%3Angsi-ld%3AB%3A1") return json(200, { models: [], stale: false });
            if (url === "/api/models/3/snapshot") return json(200, { url: "https://store.test/t.json" });
            if (url === "/api/models/4/snapshot") return json(404, { title: "Not Found", detail: "no such model" });
            return new Response("<html>", { status: 502 });
          });
          vi.stubGlobal("fetch", fetch);
          const api = server("/api");
          expect(await api.models("urn:ngsi-ld:B:1")).toEqual({ models: [], stale: false });
          expect(fetch.mock.calls[0]?.[1]).toMatchObject({ credentials: "same-origin" });
          expect(await api.snapshotUrl(3)).toBe("https://store.test/t.json");
          const refused = await api.snapshotUrl(4).catch((error: unknown) => error);
          expect(refused).toBeInstanceOf(Problem);
          expect(refused).toMatchObject({ status: 404, message: "no such model" });
          await expect(api.snapshotUrl(5)).rejects.toMatchObject({ status: 502, message: "HTTP 502" });
        });

        it("reads who is signed in, sets a station's inputs as JSON, resets them, and reads the history", async () => {
          const station = "urn:ngsi-ld:B:1";
          const at = `/api/inputs?station=${encodeURIComponent(station)}`;
          const fetch = vi.fn(async (url: string, init?: RequestInit) => {
            if (url === "/api/me") return json(200, null);
            if (url === at && init?.method === "PUT") return json(200, { ...JSON.parse(String(init.body)), station, custom: true });
            if (url === at && init?.method === "DELETE") return new Response(null, { status: 204 });
            if (url === at) return json(200, { station, custom: false });
            if (url === "/api/history") return json(403, { detail: "this needs the role steward" });
            return new Response("<html>", { status: 502 });
          });
          vi.stubGlobal("fetch", fetch);
          const api = server("/api");
          expect(await api.me()).toBeNull();
          expect(await api.inputs(station)).toEqual({ station, custom: false });
          const set = { weatherStation: null, radiusKm: 5, days: 3, note: "n" };
          expect(await api.setInputs(station, set)).toMatchObject({ ...set, custom: true });
          expect(fetch.mock.calls[2]?.[1]).toMatchObject({ method: "PUT", headers: { "Content-Type": "application/json" } });
          expect(await api.resetInputs(station)).toBeUndefined();
          await expect(api.history()).rejects.toMatchObject({ status: 403, message: "this needs the role steward" });
        });
      });
    src__server.ts: |
      /**
       * The App's server on the shared WASM host, `/apps/{name}/api` (T-3355): the models it has kept of
       * a station, one a day, and a URL for the data a model was trained on, in the App's own storage;
       * who reads, a station's model inputs a steward tunes, and the history of changes (T-3827). A test
       * hands the page its own server (`ServerContext`).
       */
      import { createContext, useContext, useMemo } from "react";

      export interface Model {
        id: number;
        /** `YYYY-MM-DD`, the day on Helsinki's calendar. */
        trained_on: string;
        trained_at: string;
        hours: number;
        enough: boolean;
        /** Bikes per degree, and with rain; `null` without weather terms. */
        per_degree: number | null;
        rain: number | null;
        sigma: number | null;
        weather_station: string | null;
        /** The days of history it trained on; `null` for a model kept before a steward could set them. */
        days?: number | null;
      }

      /** Who reads, as the server's `identity::caller()` says; roles from the token, never the page. */
      export interface Me {
        id: string;
        name: string;
        roles: string[];
      }

      /** What a steward sets for a station's model. */
      export interface NewInputs {
        /** A weather station instead of the nearest; `null` for the nearest within the radius. */
        weatherStation: string | null;
        radiusKm: number;
        days: number;
        note: string;
      }

      /** A station's model inputs: a steward's, else the defaults (`custom: false`). */
      export interface Inputs extends NewInputs {
        station: string;
        custom: boolean;
        updatedBy: string | null;
        updatedAt: string | null;
      }

      /** One change, from the App's `app_audit` table. */
      export interface HistoryRow {
        id: number;
        at: string;
        actorName: string;
        action: "insert" | "update" | "delete" | "edit";
        target: string;
        summary: string;
      }

      export interface Models {
        models: Model[];
        /** The data could not be read just now: no model today, these are the models as kept. */
        stale: boolean;
      }

      /** An answer of the server that is not a success, its `detail` as the message. */
      export class Problem extends Error {
        constructor(
          readonly status: number,
          detail: string,
        ) {
          super(detail);
        }
      }

      export interface Server {
        models(station: string): Promise<Models>;
        /** A URL the model's training data can be downloaded from for two minutes. */
        snapshotUrl(id: number): Promise<string>;
        /** Who is signed in; `null` when nobody is. */
        me(): Promise<Me | null>;
        inputs(station: string): Promise<Inputs>;
        /** A steward's; today's model is trained again on them. */
        setInputs(station: string, inputs: NewInputs): Promise<Inputs>;
        /** A steward's: back to the defaults. */
        resetInputs(station: string): Promise<void>;
        history(): Promise<HistoryRow[]>;
      }

      /** Where the server answers: `/apps/{appName}/api`, or `/api` when the name is not an App's. */
      export function apiBase(appName: string | undefined): string {
        return appName && /^[a-z0-9-]+$/.test(appName) ? `/apps/${appName}/api` : "/api";
      }

      async function call<T>(url: string, method = "GET", body?: unknown): Promise<T> {
        const answer = await fetch(url, {
          method,
          credentials: "same-origin",
          headers: body === undefined ? { Accept: "application/json" } : { Accept: "application/json", "Content-Type": "application/json" },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        if (!answer.ok) {
          const problem = (await answer.json().catch(() => ({}))) as { detail?: unknown };
          throw new Problem(answer.status, typeof problem.detail === "string" ? problem.detail : `HTTP ${answer.status}`);
        }
        return (answer.status === 204 ? undefined : await answer.json()) as T;
      }

      export function server(base: string): Server {
        const at = (station: string) => `${base}/inputs?station=${encodeURIComponent(station)}`;
        return {
          models: (station) => call<Models>(`${base}/models?station=${encodeURIComponent(station)}`),
          snapshotUrl: async (id) => (await call<{ url: string }>(`${base}/models/${id}/snapshot`)).url,
          me: () => call<Me | null>(`${base}/me`),
          inputs: (station) => call<Inputs>(at(station)),
          setInputs: (station, inputs) => call<Inputs>(at(station), "PUT", inputs),
          resetInputs: (station) => call<void>(at(station), "DELETE"),
          history: () => call<HistoryRow[]>(`${base}/history`),
        };
      }

      /** The server the page talks to; `null` takes the App's own, from its name. */
      export const ServerContext = createContext<Server | null>(null);

      export function useServer(appName: string | undefined): Server {
        const given = useContext(ServerContext);
        return useMemo(() => given ?? server(apiBase(appName)), [given, appName]);
      }
    src__testing__server.ts: |
      /**
       * The App's server in memory, for the page's tests (T-3827): no model and no inputs kept until a
       * test keeps them. Who calls is `who` (signed out unless a test names someone), and it decides as
       * the real server does: a steward sets and resets a station's inputs, anyone reads them, the
       * history shows a viewer their own rows and a steward everyone's.
       */
      import { vi } from "vitest";
      import { Problem } from "../server";
      import type { HistoryRow, Inputs, Me, Models, NewInputs, Server } from "../server";

      export const VIEWER: Me = { id: "u-viewer", name: "Vilja Viewer", roles: ["viewer"] };
      export const STEWARD: Me = { id: "u-steward", name: "Sami Steward", roles: ["viewer", "steward"] };
      export const DEFAULTS: NewInputs = { weatherStation: null, radiusKm: 10, days: 7, note: "" };

      export type Memory = Server & {
        who: Me | null;
        kept: Map<string, Inputs>;
        log: (HistoryRow & { owner: string })[];
        /** What `models` answers. */
        modelsOf: (station: string) => Models;
      };

      export function memory(who: Me | null = null): Memory {
        let next = 100;
        const m = {
          who,
          kept: new Map<string, Inputs>(),
          log: [],
          modelsOf: () => ({ models: [], stale: false }),
        } as unknown as Memory;
        const signedIn = () => {
          if (!m.who) throw new Problem(401, "sign in to do this");
          return m.who;
        };
        const steward = () => {
          if (!signedIn().roles.includes("steward")) throw new Problem(403, "this needs the role steward");
          return signedIn();
        };
        const read = (station: string): Inputs => m.kept.get(station) ?? { ...DEFAULTS, station, custom: false, updatedBy: null, updatedAt: null };
        m.models = vi.fn(async (station: string) => m.modelsOf(station));
        m.snapshotUrl = vi.fn(async (id: number) => `https://store.test/training/${id}.json`);
        m.me = vi.fn(async () => m.who);
        m.inputs = vi.fn(async (station: string) => read(station));
        m.setInputs = vi.fn(async (station: string, inputs: NewInputs) => {
          const caller = steward();
          if (inputs.days < 1 || inputs.days > 7) throw new Problem(400, "a model trains on 1 to 7 days");
          const kept: Inputs = { ...inputs, station, custom: true, updatedBy: caller.name, updatedAt: new Date(Date.now()).toISOString() };
          m.kept.set(station, kept);
          m.log.unshift({ id: next++, at: kept.updatedAt!, actorName: caller.name, action: "update", target: `inputs/${station}`, summary: `${inputs.days} days`, owner: caller.id });
          return kept;
        });
        m.resetInputs = vi.fn(async (station: string) => {
          const caller = steward();
          if (!m.kept.delete(station)) throw new Problem(404, "the station has the defaults already");
          m.log.unshift({ id: next++, at: new Date(Date.now()).toISOString(), actorName: caller.name, action: "delete", target: `inputs/${station}`, summary: "back to the defaults", owner: caller.id });
        });
        m.history = vi.fn(async () => {
          const caller = signedIn();
          return m.log.filter((row) => row.owner === caller.id || caller.roles.includes("steward")).map(({ owner: _, ...row }) => row);
        });
        return m;
      }
    src__testing__sweep.ts: |
      import { act, fireEvent, waitFor } from "@testing-library/react";

      const nameOf = (element: HTMLElement) => element.getAttribute("aria-label") ?? element.textContent ?? "";

      /**
       * Every control under `root` used once, as a reader trying each would: each choice of each list
       * chosen and the list put back, each text field typed into and put back, each box ticked (a filter
       * it sets shows the button that clears it), then each enabled button
       * and link pressed once by its name (a press may change what is shown, so the next is found anew),
       * and the lists and fields a press showed used last. The shell's header is left alone: its language
       * list reloads the page.
       */
      export async function sweep(root: HTMLElement): Promise<void> {
        await fields(root);
        const pressed = new Set<string>();
        const unpressed = () =>
          [...root.querySelectorAll<HTMLElement>("button, a[href]")].find(
            (control) => outside(control) && !(control as HTMLButtonElement).disabled && !pressed.has(nameOf(control)),
          );
        for (;;) {
          // A press answered by the server opens its controls again a moment later.
          const next =
            unpressed() ??
            (await waitFor(
              () => {
                const found = unpressed();
                if (!found) throw new Error("no control left");
                return found;
              },
              { timeout: 200 },
            ).catch(() => undefined));
          if (!next) break;
          pressed.add(nameOf(next));
          await act(async () => {
            fireEvent.click(next);
          });
        }
        await fields(root);
      }

      const outside = (element: Element) => element.closest("header") === null;

      // Each field is found anew: a choice may draw the fields after it again (a station's own form).
      async function fields(root: HTMLElement): Promise<void> {
        for (let i = 0; ; i++) {
          const select = [...root.querySelectorAll("select")].filter(outside)[i];
          if (!select) break;
          const before = select.value;
          for (const value of [...[...select.options].map((o) => o.value), before]) {
            await act(async () => {
              fireEvent.change([...root.querySelectorAll("select")].filter(outside)[i] ?? select, { target: { value } });
            });
          }
        }
        for (let i = 0; ; i++) {
          const input = [...root.querySelectorAll("input")].filter(outside)[i];
          if (!input) break;
          if (input.type === "checkbox") {
            await act(async () => {
              fireEvent.click(input);
            });
            continue;
          }
          const before = input.value;
          await act(async () => {
            fireEvent.change(input, { target: { value: `${before}1` } });
            fireEvent.change(input, { target: { value: before } });
          });
        }
      }
    src__theme.test.ts: |
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { act, renderHook } from "@testing-library/react";
      import { currentTokens } from "@joinedcontext/sdk";
      import { DARK, LIGHT, prefersDark, startTokens, useScheme } from "./theme";

      /** A system colour scheme the test can switch, as `matchMedia` reports it. */
      function system(dark: boolean) {
        const listeners = new Set<() => void>();
        const media = {
          matches: dark,
          addEventListener: (_: string, listener: () => void) => listeners.add(listener),
          removeEventListener: (_: string, listener: () => void) => listeners.delete(listener),
        };
        vi.stubGlobal("matchMedia", () => media);
        return {
          switchTo(next: boolean) {
            media.matches = next;
            for (const listener of listeners) listener();
          },
          listeners,
        };
      }

      afterEach(() => vi.unstubAllGlobals());

      describe("light and dark", () => {
        it("starts in the scheme the system asks for", () => {
          system(true);
          expect(prefersDark()).toBe(true);
          expect(startTokens()).toBe(DARK);
          system(false);
          expect(startTokens()).toBe(LIGHT);
        });

        it("follows the system when it switches, and stops listening when gone", () => {
          const scheme = system(false);
          const { result, unmount } = renderHook(() => useScheme());
          expect(result.current).toBe("light");
          act(() => scheme.switchTo(true));
          expect(result.current).toBe("dark");
          expect(currentTokens().color.surface).toBe(DARK.color.surface);
          act(() => scheme.switchTo(false));
          expect(result.current).toBe("light");
          unmount();
          expect(scheme.listeners.size).toBe(0);
        });

        it("stays light where the browser cannot say", () => {
          vi.stubGlobal("matchMedia", undefined);
          expect(prefersDark()).toBe(false);
          const { result } = renderHook(() => useScheme());
          expect(result.current).toBe("light");
        });
      });
    src__theme.ts: |
      /**
       * Light and dark (T-3333): the SDK sets the tokens it is given and has no dark variant, so the App
       * picks the set the reader's system asks for and applies the other when the system switches.
       * The dark colours keep WCAG AA contrast on their surfaces.
       */
      import { useEffect, useState } from "react";
      import { applyTokens } from "@joinedcontext/sdk";
      import light from "./design-tokens.json";

      export const LIGHT = light;
      export const DARK = {
        ...light,
        color: {
          accent: "#93c5fd",
          ink: "#f1f5f9",
          muted: "#a3b1c6",
          surface: "#0f172a",
          card: "#1e293b",
          line: "#334155",
          danger: "#fca5a5",
          success: "#6ee7b7",
          warning: "#fcd34d",
        },
        map: { point: "#2dd4bf", selected: "#93c5fd", low: "#38bdf8", high: "#fb923c", stroke: "#0f172a" },
      };

      const QUERY = "(prefers-color-scheme: dark)";

      export function prefersDark(): boolean {
        return typeof window !== "undefined" && typeof window.matchMedia === "function" && window.matchMedia(QUERY).matches;
      }

      /** The tokens to start with. */
      export function startTokens(): typeof LIGHT {
        return prefersDark() ? DARK : LIGHT;
      }

      /** The scheme in force, kept in step with the system; a change applies the other tokens. */
      export function useScheme(): "light" | "dark" {
        const [dark, setDark] = useState(prefersDark);
        useEffect(() => {
          if (typeof window.matchMedia !== "function") return;
          const media = window.matchMedia(QUERY);
          const changed = () => {
            applyTokens(media.matches ? DARK : LIGHT);
            setDark(media.matches);
          };
          media.addEventListener("change", changed);
          return () => media.removeEventListener("change", changed);
        }, []);
        return dark ? "dark" : "light";
      }
    src__wasm.test.ts: |
      import { describe, expect, it } from "vitest";
      import wasm from "../wasm/pkg/bike_weather_demand_bg.wasm?url&inline";
      import { estimate, initSync } from "../wasm/pkg/bike_weather_demand.js";
      import { parseAnswer } from "./estimate";
      import type { Cell, TemporalPoint } from "@joinedcontext/sdk";
      import { toInput } from "./bikes";
      import { ENTITIES, NOW, TEMPORAL } from "./fixtures/bikes";

      const base64 = wasm.slice(wasm.indexOf(",") + 1);
      initSync({ module: Uint8Array.from(atob(base64), (c) => c.charCodeAt(0)) });

      function extractPoints(attr: unknown): TemporalPoint[] {
        if (!attr) return [];
        if (Array.isArray(attr)) {
          return attr.map((entry: unknown) => {
            if (Array.isArray(entry)) return { value: entry[0] as Cell, observedAt: String(entry[1]) };
            return entry as TemporalPoint;
          });
        }
        if (typeof attr === "object" && attr !== null) {
          const values = (attr as { values?: unknown[] }).values;
          if (Array.isArray(values)) {
            return values.map((entry: unknown) => {
              if (Array.isArray(entry)) return { value: entry[0] as Cell, observedAt: String(entry[1]) };
              return entry as TemporalPoint;
            });
          }
        }
        return [];
      }

      describe("wasm estimate on fixtures", () => {
        const bikeStation =
          ENTITIES.find((e) => e.type === "BikeHireDockingStation" && (e.totalSlotNumber === 30 || e.totalSlotNumber === "30")) ??
          ENTITIES.find((e) => e.type === "BikeHireDockingStation");
        const totalSlots = Number(bikeStation?.totalSlotNumber ?? 30);
        const stationId = bikeStation?.id;

        const bikeTemporal =
          TEMPORAL.find((t) => (stationId ? t.id === stationId : t.type === "BikeHireDockingStation")) ??
          TEMPORAL.find((t) => t.type === "BikeHireDockingStation");
        const weatherTemporal = TEMPORAL.find((t) => t.type === "WeatherObserved");

        const bikePoints = extractPoints((bikeTemporal as Record<string, unknown> | undefined)?.availableBikeNumber);
        const tempPoints = extractPoints((weatherTemporal as Record<string, unknown> | undefined)?.temperature);
        const precPoints = extractPoints((weatherTemporal as Record<string, unknown> | undefined)?.precipitation);

        const input = toInput({
          nowSec: NOW,
          totalSlots,
          bikePoints,
          tempPoints,
          precPoints,
        });

        const rawAnswer = estimate(JSON.stringify(input));
        const out = parseAnswer(rawAnswer);

        it("recovers 0.5 per degree and -2 for rain within 1e-3, with enough true", () => {
          expect(out.enough).toBe(true);
          expect(out.weather).toBeDefined();
          expect(out.weather).not.toBeNull();
          expect(out.weather?.perDegree).toBeCloseTo(0.5, 3);
          expect(out.weather?.rain).toBeCloseTo(-2.0, 3);
        });

        it("produces six estimate hours clamped to 0..=30 with low <= mean <= high", () => {
          expect(out.estimate).toHaveLength(6);
          for (const hour of out.estimate) {
            expect(hour.mean).toBeGreaterThanOrEqual(0);
            expect(hour.mean).toBeLessThanOrEqual(30);
            expect(hour.low).toBeGreaterThanOrEqual(0);
            expect(hour.high).toBeLessThanOrEqual(30);
            expect(hour.low).toBeLessThanOrEqual(hour.mean);
            expect(hour.mean).toBeLessThanOrEqual(hour.high);
          }
        });

        it("yields enough false and no weather when history is too short (12 hours)", () => {
          const shortBikePoints = bikePoints.slice(0, 12);
          const shortTempPoints = tempPoints.slice(0, 12);
          const shortPrecPoints = precPoints.slice(0, 12);

          const shortInput = toInput({
            nowSec: NOW,
            totalSlots,
            bikePoints: shortBikePoints,
            tempPoints: shortTempPoints,
            precPoints: shortPrecPoints,
          });

          const shortRaw = estimate(JSON.stringify(shortInput));
          const shortOut = parseAnswer(shortRaw);

          expect(shortOut.enough).toBe(false);
          expect(shortOut.weather).toBeNull();
          expect(shortOut.estimate).toHaveLength(0);
        });

        it("returns an error object on bad JSON and parseAnswer throws", () => {
          const badRaw = estimate("not valid json");
          const parsed = JSON.parse(badRaw) as { error?: string };

          expect(parsed.error).toBeDefined();
          expect(parsed.error).toContain("the estimate could not be read");
          expect(() => parseAnswer(badRaw)).toThrow("the estimate could not be read");
        });
      });
    test-setup.ts: |
      import "@testing-library/jest-dom/vitest";
      import { configure } from "@testing-library/react";
      import { afterAll } from "vitest";
      import { recordControls } from "@joinedcontext/sdk/testing";

      // jsdom has no ResizeObserver; every browser the app runs in does. The map's observer is inert here.
      class InertResizeObserver {
        observe(): void {}
        unobserve(): void {}
        disconnect(): void {}
      }
      if (!("ResizeObserver" in globalThis)) {
        Object.defineProperty(globalThis, "ResizeObserver", { value: InertResizeObserver, configurable: true });
      }

      // The Apps' coverage gate reads which controls the tests rendered and which they exercised (T-3373).
      recordControls(afterAll);

      // ci-full runs every App's suite under v8 coverage, where the library's 1 s default for
      // findBy*/waitFor gives way: a different test missed it on each run (T-4350, as ui/tests/setup.ts).
      configure({ asyncUtilTimeout: 5_000 });
