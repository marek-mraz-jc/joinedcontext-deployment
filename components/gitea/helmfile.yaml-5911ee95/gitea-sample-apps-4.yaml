    ui__playwright.config.ts: |
      import { defineConfig, devices } from "@playwright/test";

      const APP_PORT = 4318;
      const STUB_PORT = 4319;
      const BASE_PATH = "/apps/air-quality/";
      const BASE_URL = `http://127.0.0.1:${APP_PORT}`;

      // The flow runs against the real binary behind its real base path, with a stub in the
      // endpoint's place. Playwright plays the edge: it sets the X-Access-Token and X-Userinfo headers
      // the openid-connect plugin would set, which is the only way to see the difference between a
      // steward and a viewer.
      export default defineConfig({
        fullyParallel: false,
        forbidOnly: Boolean(process.env.CI),
        retries: process.env.CI ? 1 : 0,
        reporter: process.env.CI ? "github" : "list",
        use: { baseURL: BASE_URL, trace: "on-first-retry" },
        projects: [
          { name: "chromium", testDir: "../tests/e2e", use: { ...devices["Desktop Chrome"] } },
          // The four-width check sits beside the bundle, where `@joinedcontext/sdk` resolves (T-2825).
          { name: "widths", testDir: "./e2e", use: { ...devices["Desktop Chrome"] } },
        ],
        webServer: [
          {
            command: `node ../tests/e2e/stub-endpoint.mjs`,
            url: `http://127.0.0.1:${STUB_PORT}/health`,
            env: { STUB_PORT: String(STUB_PORT) },
            reuseExistingServer: !process.env.CI,
            timeout: 30_000,
          },
          {
            // The bundle first: a debug build of rust-embed reads ui/dist from disk, so the binary
            // serves whatever was last built without being recompiled.
            command: `npx vite build && cargo run -q --manifest-path ../Cargo.toml --bin air-quality`,
            url: `${BASE_URL}${BASE_PATH}`,
            env: {
              JC_BIND_ADDRESS: `127.0.0.1:${APP_PORT}`,
              JC_BASE_PATH: BASE_PATH,
              JC_ENDPOINT_URL: `http://127.0.0.1:${STUB_PORT}/`,
              JC_ME_URL: `http://127.0.0.1:${STUB_PORT}/me`,
            },
            reuseExistingServer: !process.env.CI,
            timeout: 300_000,
          },
        ],
      });
    ui__src__App.tsx: |
      import { useCallback, useEffect, useId, useMemo, useState } from "react";
      import type { JSX } from "react";
      import { AppShell, Card, Grid, Page, Split, useEntitySelection } from "@joinedcontext/sdk";
      import type { ShellPage } from "@joinedcontext/sdk";
      import { ApiError, createStation, deleteStation, getHistory, getIdentity, getStations, updateStation } from "./api";
      import { Chart } from "./Chart";
      import { historyOf } from "./quality";
      import type { History } from "./quality";
      import { STATION_TYPE, stationSource } from "./panel";
      import { StationMap } from "./StationMap";
      import type { Identity, Station, StationFields } from "./api";

      /** Why a signed-in person without the role sees the controls disabled (UI-44). */
      const READ_ONLY = "Only a steward adds, corrects or removes station records.";
      /** Why the measured values have no field in the form. */
      const MEASURED = "PM10, PM2.5 and the index are measured by the station and cannot be edited.";

      /**
       * The whole app in the SDK's shell (SDK-39): who you are, what the stations read, and the record
       * form for a steward. A station on the map or its card opens the SDK's entity panel (SDK-40),
       * which reads and writes through this App's backend. The form follows the roles the Portal
       * answered (AP-109); what it hides here the gateway also refuses, and a refusal is shown in the
       * gateway's own words (AP-40).
       */
      export function App(): JSX.Element {
        const [identity, setIdentity] = useState<Identity | null>(null);
        const [stations, setStations] = useState<Station[] | null>(null);
        const [error, setError] = useState<string | null>(null);

        const load = useCallback(async () => {
          try {
            const [me, list] = await Promise.all([getIdentity(), getStations()]);
            setIdentity(me);
            setStations(list);
            setError(null);
          } catch (cause) {
            setError(problem(cause));
          }
        }, []);

        useEffect(() => {
          void load();
        }, [load]);

        const source = useMemo(() => stationSource(identity, () => void load()), [identity, load]);
        const pages = useMemo(
          (): ShellPage[] => [
            { id: "stations", label: "Stations", render: () => <StationsPage identity={identity} stations={stations} error={error} load={load} /> },
          ],
          [identity, stations, error, load],
        );
        const name = identity?.signedIn ? (identity.email ?? identity.user ?? undefined) : undefined;
        return <AppShell title="Air quality" userName={name} source={source} pages={pages} />;
      }

      function StationsPage({
        identity,
        stations,
        error,
        load,
      }: {
        identity: Identity | null;
        stations: Station[] | null;
        error: string | null;
        load: () => Promise<void>;
      }): JSX.Element {
        const { select } = useEntitySelection();
        // The station the map and the chart are about: the one a person picked, else the first.
        const [picked, setPicked] = useState<string | null>(null);
        const selected = stations?.find((station) => station.id === picked) ?? stations?.[0] ?? null;

        const steward = identity?.roles.includes("steward") ?? false;
        const readOnly = (identity?.signedIn ?? false) && !steward;

        const list = (
          <>
            {stations && stations.length === 0 && <p>No stations here yet.</p>}
            {stations && stations.length > 0 && (
              <Grid columns={steward ? 2 : 4}>
                {stations.map((station) => (
                  <StationCard
                    key={station.id}
                    station={station}
                    steward={steward}
                    readOnly={readOnly}
                    onSaved={load}
                    onOpen={() => select({ id: station.id, type: STATION_TYPE })}
                  />
                ))}
              </Grid>
            )}
          </>
        );

        return (
          <Page>
            {/* The shell names a signed-in reader; the page says only what the shell cannot. */}
            {identity && !identity.signedIn && <p className="identity">You are viewing anonymously.</p>}
            {readOnly && <p id="read-only-reason">{READ_ONLY}</p>}

            {error && <p role="alert">{error}</p>}
            {!stations && !error && <p role="status">Loading stations…</p>}

            {stations && stations.length > 0 && (
              <Split ratio="1:1">
                <Card title="Stations by air quality index">
                  <StationMap
                    stations={stations}
                    selected={selected?.id ?? null}
                    onSelect={(id) => {
                      setPicked(id);
                      select({ id, type: STATION_TYPE });
                    }}
                  />
                </Card>
                <Card title={`Last 24 hours at ${selected?.name ?? selected?.id ?? ""}`}>
                  {selected && <StationHistory id={selected.id} name={selected.name ?? selected.id} />}
                </Card>
              </Split>
            )}

            {steward ? (
              <Split ratio="1:2">
                <Card title="Add a station">
                  <StationForm onSaved={load} />
                </Card>
                {list}
              </Split>
            ) : (
              list
            )}
          </Page>
        );
      }

      /** One day of the picked station, read again when another station is picked. */
      function StationHistory({ id, name }: { id: string; name: string }): JSX.Element {
        const [history, setHistory] = useState<{ id: string; data: History } | null>(null);
        const [error, setError] = useState<{ id: string; text: string } | null>(null);
        useEffect(() => {
          let current = true;
          getHistory(id)
            .then((entity) => current && setHistory({ id, data: historyOf(entity) }))
            .catch((cause: unknown) => current && setError({ id, text: problem(cause) }));
          return () => {
            current = false;
          };
        }, [id]);
        if (error?.id === id) return <p role="alert">{error.text}</p>;
        if (history?.id !== id) return <p role="status">Loading the last 24 hours…</p>;
        return <Chart history={history.data} station={name} />;
      }

      function problem(cause: unknown): string {
        return cause instanceof ApiError ? cause.detail : String(cause);
      }

      function StationCard({
        station,
        steward,
        readOnly,
        onSaved,
        onOpen,
      }: {
        station: Station;
        steward: boolean;
        readOnly: boolean;
        onSaved: () => Promise<void>;
        onOpen: () => void;
      }): JSX.Element {
        const [editing, setEditing] = useState(false);
        const title = station.name ?? station.id;
        return (
          <Card
            title={title}
            actions={
              <button type="button" onClick={onOpen}>
                Details of {title}
              </button>
            }
          >
            <dl>
              <Metric label="PM10" value={station.pm10} unit="µg/m³" />
              <Metric label="PM2.5" value={station.pm25} unit="µg/m³" />
              <Metric label="Index" value={station.airQualityIndex} />
            </dl>
            {station.observedAt && <p className="identity">Measured: {station.observedAt}</p>}
            {station.stewardNote && <p>Note: {station.stewardNote}</p>}
            {readOnly && (
              <button type="button" disabled aria-describedby="read-only-reason">
                Edit {title}
              </button>
            )}
            {steward && !editing && (
              <div className="actions">
                <button type="button" onClick={() => setEditing(true)}>
                  Edit {title}
                </button>
                <RemoveButton station={station} title={title} onSaved={onSaved} />
              </div>
            )}
            {steward && editing && (
              <StationForm
                station={station}
                onSaved={async () => {
                  setEditing(false);
                  await onSaved();
                }}
                onCancel={() => setEditing(false)}
              />
            )}
          </Card>
        );
      }

      /** Removes a station a steward added, after a second click; a pipeline's station says why not. */
      function RemoveButton({
        station,
        title,
        onSaved,
      }: {
        station: Station;
        title: string;
        onSaved: () => Promise<void>;
      }): JSX.Element {
        const [asked, setAsked] = useState(false);
        const [error, setError] = useState<string | null>(null);
        const reason = useId();
        if (!station.own) {
          return (
            <>
              <button type="button" disabled aria-describedby={reason}>
                Remove {title}
              </button>
              <span id={reason} className="identity">
                {" "}Only a station a steward added can be removed.
              </span>
            </>
          );
        }
        return (
          <>
            <button
              type="button"
              onClick={() => {
                if (!asked) {
                  setAsked(true);
                  return;
                }
                deleteStation(station.id)
                  .then(onSaved)
                  .catch((cause: unknown) => {
                    setAsked(false);
                    setError(problem(cause));
                  });
              }}
            >
              {asked ? `Confirm removal of ${title}` : `Remove ${title}`}
            </button>
            {error && <p role="alert">{error}</p>}
          </>
        );
      }

      function Metric({
        label,
        value,
        unit,
      }: {
        label: string;
        value: number | undefined;
        unit?: string;
      }): JSX.Element | null {
        // An attribute the grant hides never arrives, and an empty row would suggest a zero.
        if (value === undefined) {
          return null;
        }
        return (
          <>
            <dt>{label}</dt>
            <dd>
              {value}
              {unit ? ` ${unit}` : ""}
            </dd>
          </>
        );
      }

      /**
       * The record form: a new station when `station` is absent, a correction of it otherwise. A save
       * is one request to the backend, which makes one write through the endpoint (AP-62).
       */
      function StationForm({
        station,
        onSaved,
        onCancel,
      }: {
        station?: Station;
        onSaved: () => Promise<void>;
        onCancel?: () => void;
      }): JSX.Element {
        const id = useId();
        const [localId, setLocalId] = useState("");
        const [fi, setFi] = useState(station?.names?.fi ?? (station?.names ? "" : (station?.name ?? "")));
        const [en, setEn] = useState(station?.names?.en ?? "");
        const [longitude, setLongitude] = useState(station?.coordinates ? String(station.coordinates[0]) : "");
        const [latitude, setLatitude] = useState(station?.coordinates ? String(station.coordinates[1]) : "");
        const [note, setNote] = useState(station?.stewardNote ?? "");
        const [saving, setSaving] = useState(false);
        const [error, setError] = useState<string | null>(null);

        const complete = (fi.trim() !== "" || en.trim() !== "") && longitude !== "" && latitude !== "" && (station || localId.trim() !== "");
        const field = (name: string) => `${id}-${name}`;

        return (
          <form
            className="note"
            aria-label={station ? `Edit ${station.name ?? station.id}` : "New station"}
            onSubmit={(event) => {
              event.preventDefault();
              const fields: StationFields = {
                name: { ...station?.names, fi: fi.trim(), en: en.trim() },
                coordinates: [Number(longitude), Number(latitude)],
                ...(note.trim() ? { stewardNote: note.trim() } : {}),
                ...(station ? {} : { localId: localId.trim() }),
              };
              setSaving(true);
              setError(null);
              (station ? updateStation(station.id, fields) : createStation(fields))
                .then(async () => {
                  if (!station) {
                    setLocalId("");
                    setFi("");
                    setEn("");
                    setLongitude("");
                    setLatitude("");
                    setNote("");
                  }
                  await onSaved();
                })
                // The gateway's refusal is the message: it names what the writer is missing.
                .catch((cause: unknown) => setError(problem(cause)))
                .finally(() => setSaving(false));
            }}
          >
            <p className="identity">{MEASURED}</p>
            {!station && (
              <>
                <label htmlFor={field("id")}>Station id</label>
                <input
                  id={field("id")}
                  required
                  pattern="[A-Za-z0-9_-]{1,64}"
                  maxLength={64}
                  value={localId}
                  onChange={(event) => setLocalId(event.target.value)}
                />
              </>
            )}
            <label htmlFor={field("fi")}>Name in Finnish</label>
            <input id={field("fi")} maxLength={200} value={fi} onChange={(event) => setFi(event.target.value)} />
            <label htmlFor={field("en")}>Name in English</label>
            <input id={field("en")} maxLength={200} value={en} onChange={(event) => setEn(event.target.value)} />
            <label htmlFor={field("lon")}>Longitude</label>
            <input
              id={field("lon")}
              type="number"
              required
              step="any"
              min={-180}
              max={180}
              value={longitude}
              onChange={(event) => setLongitude(event.target.value)}
            />
            <label htmlFor={field("lat")}>Latitude</label>
            <input
              id={field("lat")}
              type="number"
              required
              step="any"
              min={-90}
              max={90}
              value={latitude}
              onChange={(event) => setLatitude(event.target.value)}
            />
            <label htmlFor={field("note")}>Steward note</label>
            <textarea id={field("note")} rows={2} maxLength={500} value={note} onChange={(event) => setNote(event.target.value)} />
            <div className="note-actions">
              <button type="submit" disabled={saving || !complete}>
                {station ? "Save changes" : "Add station"}
              </button>
              {onCancel && (
                <button type="button" onClick={onCancel}>
                  Cancel
                </button>
              )}
            </div>
            {error && <p role="alert">{error}</p>}
          </form>
        );
      }
    ui__src__Chart.tsx: |
      /**
       * One day of PM10 and PM2.5 at one station, with each pollutant's EU limit as a dashed line
       * (T-2925). ponytail: an SVG line chart, two series and two reference lines; a chart library when
       * a screen wants zoom, brushing or more than a handful of series.
       */
      import type { JSX } from "react";
      import { rechartsPalette } from "@joinedcontext/sdk";
      import { LIMITS } from "./quality";
      import type { History, Pollutant } from "./quality";

      const WIDTH = 640;
      const HEIGHT = 240;
      const PAD = { top: 16, right: 16, bottom: 28, left: 40 };

      const NAME: Record<Pollutant, string> = { pm10: "PM10", pm25: "PM2.5" };
      const LIMIT_NAME: Record<Pollutant, string> = { pm10: "PM10 daily limit", pm25: "PM2.5 annual limit" };

      function hour(time: number): string {
        return new Date(time).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      }

      export function Chart({ history, station }: { history: History; station: string }): JSX.Element {
        const pollutants = (Object.keys(LIMITS) as Pollutant[]).filter((p) => history[p].length > 0);
        if (pollutants.length === 0) {
          return <p role="status">No PM10 or PM2.5 readings from {station} in the last 24 hours.</p>;
        }
        // The token palette colours the series (AP-123): the first colour is PM10, the second PM2.5.
        const [first, second] = rechartsPalette();
        const colour: Record<Pollutant, string> = { pm10: first, pm25: second };

        const points = pollutants.flatMap((p) => history[p]);
        const start = Math.min(...points.map((p) => p.time));
        const end = Math.max(...points.map((p) => p.time));
        const top = Math.max(...points.map((p) => p.value), ...pollutants.map((p) => LIMITS[p])) * 1.1;
        const x = (time: number) =>
          PAD.left + (end === start ? 0.5 : (time - start) / (end - start)) * (WIDTH - PAD.left - PAD.right);
        const y = (value: number) => HEIGHT - PAD.bottom - (value / top) * (HEIGHT - PAD.top - PAD.bottom);
        const ticks = [0, 0.25, 0.5, 0.75, 1].map((share) => Math.round(top * share));

        const latest = pollutants
          .map((p) => `${NAME[p]} ${history[p][history[p].length - 1].value} µg/m³ (limit ${LIMITS[p]})`)
          .join(", ");

        return (
          <figure className="chart">
            <svg
              viewBox={`0 0 ${WIDTH} ${HEIGHT}`}
              role="img"
              aria-label={`PM readings at ${station} over the last 24 hours. Latest: ${latest}.`}
            >
              {ticks.map((tick) => (
                <g key={tick}>
                  <line className="grid" x1={PAD.left} x2={WIDTH - PAD.right} y1={y(tick)} y2={y(tick)} />
                  <text className="axis" x={PAD.left - 6} y={y(tick) + 4} textAnchor="end">
                    {tick}
                  </text>
                </g>
              ))}
              <text className="axis" x={PAD.left} y={HEIGHT - 8}>
                {hour(start)}
              </text>
              <text className="axis" x={WIDTH - PAD.right} y={HEIGHT - 8} textAnchor="end">
                {hour(end)}
              </text>
              {pollutants.map((p) => (
                <g key={p} data-series={p}>
                  <line
                    className="limit"
                    stroke={colour[p]}
                    x1={PAD.left}
                    x2={WIDTH - PAD.right}
                    y1={y(LIMITS[p])}
                    y2={y(LIMITS[p])}
                  />
                  <polyline
                    fill="none"
                    stroke={colour[p]}
                    strokeWidth={2.5}
                    points={history[p].map((point) => `${x(point.time)},${y(point.value)}`).join(" ")}
                  />
                </g>
              ))}
            </svg>
            <figcaption>
              <ul className="legend">
                {pollutants.map((p) => (
                  <li key={p}>
                    <span className="swatch" style={{ background: colour[p] }} aria-hidden="true" />
                    {NAME[p]} (µg/m³), dashed: {LIMIT_NAME[p]} {LIMITS[p]}
                  </li>
                ))}
              </ul>
            </figcaption>
          </figure>
        );
      }
    ui__src__StationMap.tsx: |
      /**
       * The stations on a map, each coloured by its air quality index band, with the bands in words
       * beside it (T-2925, UI-30). Clicking a station selects it, as its button in the legend does.
       */
      import { useEffect, useMemo, useRef } from "react";
      import type { JSX } from "react";
      import { Map as MapLibreMap } from "maplibre-gl";
      import type { GeoJSONSource, MapLayerMouseEvent } from "maplibre-gl";
      import "maplibre-gl/dist/maplibre-gl.css";
      import { mapColors, NO_LOCATIONS, styleFor } from "@joinedcontext/sdk";
      import type { Station } from "./api";
      import { BAND_COLOUR, BAND_LABEL, BANDS, bandOf, stationFeatures } from "./quality";

      const SOURCE = "stations";
      /** Helsinki, where the `helsinki` space's stations are, when no station has a position. */
      const HELSINKI: [number, number] = [24.94, 60.17];

      /**
       * The project's basemap style, from the `#jc-config` the Portal writes into an App's page (AP-67,
       * T-2928); `undefined` when the page has none or it does not parse, and the map keeps the page's
       * plain background.
       */
      export function basemapOf(doc: Document = document): string | undefined {
        try {
          const config = JSON.parse(doc.getElementById("jc-config")?.textContent || "{}") as { basemap?: unknown };
          return typeof config.basemap === "string" && config.basemap.trim() !== "" ? config.basemap : undefined;
        } catch {
          return undefined;
        }
      }

      export function StationMap({
        stations,
        selected,
        onSelect,
        basemap = basemapOf(),
      }: {
        stations: Station[];
        selected: string | null;
        onSelect: (id: string) => void;
        /** A style URL; the page's `#jc-config` by default, else the plain background. */
        basemap?: string;
      }): JSX.Element {
        const holder = useRef<HTMLDivElement>(null);
        const map = useRef<MapLibreMap | null>(null);
        const select = useRef(onSelect);
        select.current = onSelect;
        const features = useMemo(() => stationFeatures(stations), [stations]);
        // The map's load handler reads the stations of the moment it fires, not of its first render.
        const latest = useRef(features);
        latest.current = features;

        useEffect(() => {
          if (!holder.current) return;
          const first = latest.current.features[0]?.geometry.coordinates as [number, number] | undefined;
          const drawn = new MapLibreMap({ container: holder.current, style: styleFor(basemap), center: first ?? HELSINKI, zoom: 10 });
          map.current = drawn;
          drawn.on("load", () => {
            drawn.addSource(SOURCE, { type: "geojson", data: stationFeatures([]) });
            drawn.addLayer({
              id: SOURCE,
              type: "circle",
              source: SOURCE,
              paint: {
                "circle-radius": 8,
                "circle-color": ["get", "colour"],
                "circle-stroke-color": mapColors().stroke,
                "circle-stroke-width": 2,
              },
            });
            (drawn.getSource(SOURCE) as GeoJSONSource).setData(latest.current);
          });
          drawn.on("click", SOURCE, (event: MapLayerMouseEvent) => {
            const id = event.features?.[0]?.properties?.id;
            if (typeof id === "string") select.current(id);
          });
          return () => {
            drawn.remove();
            map.current = null;
          };
          // The map is built once per basemap; the stations reach it through setData below.
        }, [basemap]);

        useEffect(() => {
          const source = map.current?.getSource(SOURCE) as GeoJSONSource | undefined;
          source?.setData(features);
        }, [features]);

        return (
          <div className="station-map">
            <div ref={holder} className="map" role="region" aria-label="Stations on a map, coloured by air quality index" />
            {features.features.length === 0 && <p role="status">{NO_LOCATIONS}</p>}
            <ul className="legend" aria-label="Air quality index">
              {BANDS.map((band) => (
                <li key={band}>
                  <span className="swatch" style={{ background: BAND_COLOUR[band] }} aria-hidden="true" />
                  {BAND_LABEL[band]}
                </li>
              ))}
            </ul>
            <ul className="stations" aria-label="Stations">
              {stations.map((station) => {
                const band = bandOf(station.airQualityIndex);
                return (
                  <li key={station.id}>
                    <button type="button" aria-pressed={selected === station.id} onClick={() => onSelect(station.id)}>
                      <span className="swatch" style={{ background: BAND_COLOUR[band] }} aria-hidden="true" />
                      {station.name ?? station.id}: {BAND_LABEL[band]}
                    </button>
                  </li>
                );
              })}
            </ul>
          </div>
        );
      }
    ui__src__api.ts: |
      /**
       * The app's own backend, and nothing else. The endpoint URL never reaches the browser: the
       * server holds it, forwards the user's token to it and answers with what came back (AP-04).
       */
      const BASE = import.meta.env.BASE_URL;

      export interface Identity {
        signedIn: boolean;
        email: string | null;
        user: string | null;
        anonymous: boolean;
        /** The caller's roles in this App, from the Portal's `/me` (AP-109). */
        roles: string[];
      }

      export interface Station {
        id: string;
        name?: string;
        /** The name per language, for the form. */
        names?: Record<string, string>;
        pm10?: number;
        pm25?: number;
        airQualityIndex?: number;
        stewardNote?: string;
        observedAt?: string;
        coordinates?: [number, number];
        /** Added by a steward rather than a pipeline, so a steward may remove it. */
        own?: boolean;
      }

      /** What the record form writes: the station attributes a person may correct, nothing measured. */
      export interface StationFields {
        localId?: string;
        name?: Record<string, string>;
        coordinates?: [number, number];
        stewardNote?: string;
      }

      /** A refusal carries the gateway's own words, which is what the user needs to read. */
      export class ApiError extends Error {
        constructor(
          readonly status: number,
          readonly detail: string,
        ) {
          super(detail);
        }
      }

      async function call<T>(path: string, init?: RequestInit): Promise<T> {
        const response = await fetch(`${BASE}api/${path}`, {
          ...init,
          headers: { "Content-Type": "application/json", ...(init?.headers ?? {}) },
        });
        if (!response.ok) {
          const problem = (await response.json().catch(() => null)) as { detail?: string } | null;
          throw new ApiError(response.status, problem?.detail ?? response.statusText);
        }
        return response.status === 204 ? (undefined as T) : ((await response.json()) as T);
      }

      export const getIdentity = (): Promise<Identity> => call<Identity>("me");
      export const getStations = (): Promise<Station[]> => call<Station[]>("stations");
      const station = (id: string): string => `stations/${encodeURIComponent(id)}`;
      export const createStation = (fields: StationFields): Promise<{ id: string }> =>
        call<{ id: string }>("stations", { method: "POST", body: JSON.stringify(fields) });
      export const updateStation = (id: string, fields: StationFields): Promise<void> =>
        call<void>(station(id), { method: "PATCH", body: JSON.stringify(fields) });
      export const deleteStation = (id: string): Promise<void> =>
        call<void>(station(id), { method: "DELETE" });
      /** One day of the station's PM10 and PM2.5, the temporal entity as the endpoint answered it. */
      export const getHistory = (id: string): Promise<unknown> => call<unknown>(`${station(id)}/history`);
    ui__src__index.css: |
      /* The columns, the heading and the cards are the SDK's layout primitives (T-2825, SDK-12); what
         is left here is the page's own gutter, the record form and the muted lines. */
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      /* The page follows the reader's colour scheme; the SDK's cards take their colours from these. */
      @media (prefers-color-scheme: dark) {
        :root {
          --jc-color-card: #1e1e22;
          --jc-color-line: #3a3a3a;
        }
      }

      body {
        margin: 0;
      }

      main {
        padding: var(--jc-gutter, 1rem);
      }

      .identity {
        font-size: 0.875rem;
        opacity: 0.75;
        margin: 0 0 0.75rem;
      }

      /* The station cards' own lists; the SDK's panel lays out its own. */
      .jc-card dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 1rem;
        margin: 0.5rem 0;
      }

      .jc-card dt {
        opacity: 0.75;
      }

      .jc-card dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }

      [role="alert"] {
        color: #b3261e;
      }

      /* The same red on the dark card is unreadable (axe color-contrast): a lighter one of the hue. */
      @media (prefers-color-scheme: dark) {
        [role="alert"] {
          color: #ff8a80;
        }
      }

      /* One label above its field, the buttons in a row that wraps, every control a finger's size. */
      .note {
        display: grid;
        gap: 0.25rem;
        margin-top: 0.75rem;
      }

      .note label {
        margin-top: 0.5rem;
      }

      .note :is(input, textarea) {
        box-sizing: border-box;
        width: 100%;
        min-height: var(--jc-target, 2.75rem);
        font: inherit;
      }

      .note-actions,
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      button {
        min-height: var(--jc-target, 2.75rem);
        padding: 0 1rem;
        font: inherit;
      }

      /* The map, its legend and the chart (T-2925): colours come from the index scale and the token
         palette, the layout from the SDK's cards. */
      .map {
        height: clamp(260px, 45vh, 420px);
        border-radius: 8px;
        overflow: hidden;
      }

      .legend,
      .stations {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1rem;
        list-style: none;
        padding: 0;
        margin: 0.75rem 0 0;
        font-size: 0.875rem;
      }

      .stations button {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        min-height: 44px;
        padding: 0 0.75rem;
        border-radius: 999px;
        border: 1px solid var(--jc-color-line, #d0d7de);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      .stations button[aria-pressed="true"] {
        border-color: var(--jc-color-accent, #0f766e);
        box-shadow: inset 0 0 0 1px var(--jc-color-accent, #0f766e);
      }

      .swatch {
        display: inline-block;
        width: 0.8rem;
        height: 0.8rem;
        border-radius: 50%;
        margin-right: 0.35rem;
        vertical-align: middle;
      }

      .chart {
        margin: 0;
      }

      .chart svg {
        width: 100%;
        height: auto;
      }

      .chart .grid {
        stroke: var(--jc-color-line, #d0d7de);
        stroke-width: 1;
      }

      .chart .limit {
        stroke-dasharray: 6 4;
        stroke-width: 1.5;
      }

      .chart .axis {
        font-size: 11px;
        fill: currentColor;
        opacity: 0.7;
      }

      /* MapLibre's attribution is a link inside a line of text, told apart by colour alone
         (axe link-in-text-block, T-3045); the element is the library's DOM, so it is dressed here. */
      .maplibregl-ctrl-attrib a {
        text-decoration: underline;
      }
