            </JcProvider>,
          );
          await waitFor(() => expect(mapInstances.length).toBeGreaterThan(0));
          loadHandler?.();
          await waitFor(() => expect(mockOverlayInstances).toHaveLength(1));
          const layer = mockOverlayInstances[0].props.layers[0];
          expect(layer).toBeInstanceOf(ScatterplotLayer);
          const first = layer.props.data[0];
          expect(layer.props.getPosition(first)).toEqual([24.9, 60.1]);
          expect(layer.props.getFillColor(first)).toHaveLength(3);
          layer.props.onClick({});
          expect(onSelect).not.toHaveBeenCalled();
          layer.props.onClick({ object: first });
          expect(onSelect).toHaveBeenCalledWith(many[0]);
          applyTokens(DEFAULT_TOKENS);
        });

        it("aggregates into a grid, the hexagons read their positions, and the overlay goes for plain points", async () => {
          const client = stubClient({ entities: STATIONS });
          const view = (mode: "grid" | "hexbin" | "points") => (
            <JcProvider client={client}>
              <EntityMap rows={STATIONS} location="location" mode={mode} />
            </JcProvider>
          );
          const { rerender } = render(view("grid"));
          await waitFor(() => expect(mapInstances.length).toBeGreaterThan(0));
          const map = mapInstances[0];
          loadHandler?.();
          await waitFor(() => expect(mockOverlayInstances).toHaveLength(1));
          const grid = mockOverlayInstances[0].props.layers[0];
          expect(grid).toBeInstanceOf(GridLayer);
          expect(grid.props.getPosition(grid.props.data[0])).toEqual([24.95, 60.155]);
          rerender(view("hexbin"));
          await waitFor(() => expect(mockOverlayInstances[0].props.layers[0]).toBeInstanceOf(HexagonLayer));
          const hex = mockOverlayInstances[0].props.layers[0];
          expect(hex.props.getPosition(hex.props.data[1])).toEqual([24.93, 60.17]);
          rerender(view("points"));
          await waitFor(() => expect(map.removeControl).toHaveBeenCalled());
        });

        // T-2923: the events map colours each point by its register and clusters close ones; a click on a
        // cluster zooms in on it, on a point selects its row, and what is no cluster or no row does nothing.
        it("colours by the app's own palette, clusters, and zooms in on a clicked cluster only", async () => {
          const colorOf = (row: Row) => (row.id.endsWith("001") ? "#112233" : "#445566");
          const onSelect = vi.fn();
          const error = vi.spyOn(console, "error").mockImplementation(() => undefined);
          render(
            <JcProvider client={stubClient({ entities: [] })}>
              <EntityMap rows={STATIONS} location="location" colorOf={colorOf} cluster onSelect={onSelect} />
            </JcProvider>,
          );
          await waitFor(() => expect(mapInstances.length).toBeGreaterThan(0));
          const map = mapInstances[0];
          loadHandler?.();
          expect(map.addSource).toHaveBeenCalledWith("jc-rows", expect.objectContaining({ cluster: true, clusterRadius: 40 }));
          expect(map.addLayer).toHaveBeenCalledWith(expect.objectContaining({ id: "jc-clusters", filter: ["has", "point_count"] }));
          await waitFor(() => expect(map.setData).toHaveBeenCalled());
          expect(map.setData.mock.calls.at(-1)[0].features.map((f: any) => f.properties.color)).toEqual(["#112233", "#445566"]);

          const zoomIn = clickHandlers["jc-clusters"];
          const at = { type: "Point", coordinates: [24.94, 60.17] };
          zoomIn({ features: [{ properties: { cluster_id: 3 }, geometry: at }] });
          await waitFor(() => expect(map.easeTo).toHaveBeenCalledWith({ center: [24.94, 60.17], zoom: 14 }));
          expect(map.expansion).toHaveBeenCalledWith(3);
          // No cluster id, no point, no feature: nothing to zoom to.
          zoomIn({ features: [{ properties: {}, geometry: at }] });
          zoomIn({ features: [{ properties: { cluster_id: 4 }, geometry: { type: "LineString", coordinates: [] } }] });
          zoomIn({});
          expect(map.expansion).toHaveBeenCalledTimes(1);
          // A source the map lost, and one that cannot say the zoom: logged, never thrown.
          map.getSource.mockReturnValueOnce(undefined);
          zoomIn({ features: [{ properties: { cluster_id: 5 }, geometry: at }] });
          map.expansion.mockRejectedValueOnce(new Error("gone"));
          zoomIn({ features: [{ properties: { cluster_id: 6 }, geometry: at }] });
          await waitFor(() => expect(error).toHaveBeenCalledWith("jc: cluster zoom", expect.any(Error)));
          expect(map.easeTo).toHaveBeenCalledTimes(1);

          clickHandlers["jc-points"]({ features: [{ properties: { id: "urn:ngsi-ld:Station:404" } }] });
          clickHandlers["jc-points"]({ features: [{ properties: {} }] });
          expect(onSelect).not.toHaveBeenCalled();
        });

        it("colours deck.gl's points by the app's own palette too", async () => {
          const many: Row[] = Array.from({ length: 50_000 }, (_, i) => ({ id: `urn:x:${i}`, type: "S", location: { type: "Point", coordinates: [24.9, 60.1] } }));
          render(
            <JcProvider client={stubClient({ entities: [] })}>
              <EntityMap rows={many} location="location" colorOf={() => "#ff0000"} />
            </JcProvider>,
          );
          await waitFor(() => expect(mapInstances.length).toBeGreaterThan(0));
          loadHandler?.();
          await waitFor(() => expect(mockOverlayInstances).toHaveLength(1));
          const layer = mockOverlayInstances[0].props.layers[0];
          expect(layer.props.getFillColor(layer.props.data[0])).toEqual([255, 0, 0]);
        });

        it("logs what the map says went wrong", async () => {
          const logged = vi.spyOn(console, "error").mockImplementation(() => undefined);
          render(
            <JcProvider client={stubClient({ entities: STATIONS })}>
              <EntityMap rows={STATIONS} location="location" />
            </JcProvider>,
          );
          await waitFor(() => expect(errorHandler).toBeDefined());
          errorHandler?.({ error: { message: "tile 404" } });
          errorHandler?.({});
          expect(logged).toHaveBeenCalledWith("jc: map error", "tile 404");
          expect(logged).toHaveBeenCalledTimes(2);
        });
      });
    src__components__EntityMap.tsx: |
      import { useEffect, useMemo, useRef, useState } from "react";
      import { Map as MapLibreMap } from "maplibre-gl";
      import type { GeoJSONSource, IControl, MapGeoJSONFeature, MapMouseEvent } from "maplibre-gl";
      import { MapboxOverlay } from "@deck.gl/mapbox";
      import { ScatterplotLayer } from "@deck.gl/layers";
      import { GridLayer, HexagonLayer } from "@deck.gl/aggregation-layers";

      import { currentTokens, displayName, extent, format, mapWorkerReady, NO_BASEMAP, NO_LOCATIONS, pointOf, styleFor, toFeatureCollection, useClient } from "@joinedcontext/sdk";
      import type { Cell, DesignTokens, Geo, Row } from "@joinedcontext/sdk";

      export const DECK_THRESHOLD = 50_000;
      export type MapMode = "auto" | "points" | "hexbin" | "grid";

      export function renderPath(count: number, mode: MapMode): "maplibre" | "deck-points" | "deck-hexbin" | "deck-grid" {
        if (mode === "hexbin") return "deck-hexbin";
        if (mode === "grid") return "deck-grid";
        if (mode === "points") return "maplibre";
        return count >= DECK_THRESHOLD ? "deck-points" : "maplibre";
      }

      function parseHexColor(hex: string): [number, number, number] {
        let cleaned = hex.replace(/^#/, "").trim();
        if (cleaned.length === 3) {
          cleaned = cleaned
            .split("")
            .map((c) => c + c)
            .join("");
        }
        if (cleaned.length !== 6) {
          return [0, 0, 0];
        }
        const num = parseInt(cleaned, 16);
        return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
      }

      function toHex(r: number, g: number, b: number): string {
        const clamp = (n: number) => Math.max(0, Math.min(255, Math.round(n)));
        const to2 = (n: number) => clamp(n).toString(16).padStart(2, "0");
        return `#${to2(r)}${to2(g)}${to2(b)}`;
      }

      export function colorRamp(value: Cell, range: [number, number] | null, tokens?: DesignTokens): string {
        const tks = tokens ?? currentTokens();
        if (typeof value !== "number" || !range || range[1] <= range[0] || Number.isNaN(value)) {
          return tks.map.point;
        }
        const t = Math.max(0, Math.min(1, (value - range[0]) / (range[1] - range[0])));
        const [r0, g0, b0] = parseHexColor(tks.map.low);
        const [r1, g1, b1] = parseHexColor(tks.map.high);
        return toHex(r0 + t * (r1 - r0), g0 + t * (g1 - g0), b0 + t * (b1 - b0));
      }

      function deckColorRange(tokens: DesignTokens): [number, number, number][] {
        const [r0, g0, b0] = parseHexColor(tokens.map.low);
        const [r1, g1, b1] = parseHexColor(tokens.map.high);
        const steps: [number, number, number][] = [];
        for (let i = 0; i < 6; i++) {
          const t = i / 5;
          steps.push([Math.round(r0 + t * (r1 - r0)), Math.round(g0 + t * (g1 - g0)), Math.round(b0 + t * (b1 - b0))]);
        }
        return steps;
      }

      /** The label of a row on the map: the `label` attribute when it holds text, else its display name. */
      function nameOf(row: Row, label?: string): string {
        const text = label ? format(row[label]).trim() : "";
        return text === "" ? displayName(row) : text;
      }

      interface PointRow {
        position: [number, number];
        rgb: [number, number, number];
        row: Row;
      }


      function extractCoordinates(geometry: Geo): Array<[number, number]> {
        const coords: Array<[number, number]> = [];
        function dig(val: unknown) {
          if (Array.isArray(val)) {
            if (val.length >= 2 && typeof val[0] === "number" && typeof val[1] === "number") {
              coords.push([val[0], val[1]]);
            } else {
              for (const item of val) dig(item);
            }
          }
        }
        dig(geometry.coordinates);
        return coords;
      }

      export function EntityMap({
        rows,
        location = "location",
        label,
        color,
        colorOf,
        cluster = false,
        selected = null,
        onSelect,
        basemap,
        mode = "auto",
        height,
        radius = 500,
      }: {
        rows: Row[];
        location?: string;
        label?: string;
        color?: string;
        /** A colour per row from the app's own palette (a category), in place of the `color` ramp. */
        colorOf?: (row: Row) => string;
        /** Close points drawn as one circle sized by their count; a click zooms in on it. Read once, when the map loads. */
        cluster?: boolean;
        selected?: string | null;
        onSelect?: (row: Row) => void;
        basemap?: string;
        mode?: MapMode;
        height?: number;
        radius?: number;
      }): React.JSX.Element {
        const client = useClient();
        const effectiveBasemap = basemap ?? client.config.basemap;
        const tokens = currentTokens();

        const container = useRef<HTMLDivElement>(null);
        const map = useRef<MapLibreMap | null>(null);
        const overlayRef = useRef<MapboxOverlay | null>(null);
        const [ready, setReady] = useState(false);
        const fitted = useRef(false);

        const onSelectRef = useRef(onSelect);
        onSelectRef.current = onSelect;

        const path = renderPath(rows.length, mode);

        const ext = useMemo(() => (color ? extent(rows, color) : null), [rows, color]);

        const rowById = useMemo(() => {
          const map = new Map<string, Row>();
          for (const r of rows) map.set(r.id, r);
          return map;
        }, [rows]);

        const rowByIdRef = useRef(rowById);
        rowByIdRef.current = rowById;

        const collection = useMemo(() => {
          const base = toFeatureCollection(rows, location, [...(label ? [label] : []), ...(color ? [color] : [])]);
          const features = base.features.map((f) => {
            const r = rowById.get(f.id);
            const c = r && colorOf ? colorOf(r) : color && r ? colorRamp(r[color], ext, tokens) : tokens.map.point;
            const l = r ? nameOf(r, label) : f.id;
            return {
              ...f,
              properties: {
                ...f.properties,
                label: l,
                color: c,
              },
            };
          });
          return { type: "FeatureCollection" as const, features };
        }, [rows, location, label, color, colorOf, ext, tokens, rowById]);

        const pointRows: PointRow[] = useMemo(() => {
          const pts: PointRow[] = [];
          for (const row of rows) {
            const pt = pointOf(row[location]);
            if (!pt) continue;
            const hex = colorOf ? colorOf(row) : color ? colorRamp(row[color], ext, tokens) : tokens.map.point;
            pts.push({
              position: pt,
              rgb: parseHexColor(hex),
              row,
            });
          }
          return pts;
        }, [rows, location, color, colorOf, ext, tokens]);

        useEffect(() => {
          let gone = false;
          let instance: MapLibreMap | null = null;

          void mapWorkerReady().then(() => {
            if (gone || !container.current || map.current) return;
            instance = new MapLibreMap({
              container: container.current,
              style: styleFor(effectiveBasemap),
              center: [0, 0],
              zoom: 1,
              canvasContextAttributes: { preserveDrawingBuffer: true },
            });
            map.current = instance;

            instance.on("error", (event) => {
              console.error("jc: map error", event.error?.message ?? event);
            });

            instance.on("load", () => {
              if (gone) return;
              instance!.addSource("jc-rows", {
                type: "geojson",
                data: { type: "FeatureCollection", features: [] },
                cluster,
                clusterRadius: 40,
                clusterMaxZoom: 15,
              });

              if (cluster) {
                // No count label: a symbol layer needs the basemap's glyphs, which a blank map has not.
                instance!.addLayer({
                  id: "jc-clusters",
                  type: "circle",
                  source: "jc-rows",
                  filter: ["has", "point_count"],
                  paint: {
                    "circle-color": tokens.map.point,
                    "circle-opacity": 0.85,
                    "circle-radius": ["step", ["get", "point_count"], 12, 10, 16, 50, 22],
                    "circle-stroke-color": tokens.map.stroke,
                    "circle-stroke-width": 2,
                  },
                });
                instance!.on("click", "jc-clusters", (e: MapMouseEvent & { features?: MapGeoJSONFeature[] }) => {
                  const feature = e.features?.[0];
                  const id: unknown = feature?.properties?.cluster_id;
                  const at = feature?.geometry.type === "Point" ? pointOf(feature.geometry as Geo) : null;
                  const source = instance!.getSource("jc-rows") as GeoJSONSource | undefined;
                  if (typeof id !== "number" || !at || !source) return;
                  source
                    .getClusterExpansionZoom(id)
                    .then((zoom) => instance?.easeTo({ center: at, zoom }))
                    .catch((error: unknown) => console.error("jc: cluster zoom", error));
                });
              }

              instance!.addLayer({
                id: "jc-fill",
                type: "fill",
                source: "jc-rows",
                filter: ["in", ["geometry-type"], ["literal", ["Polygon", "MultiPolygon"]]],
                paint: { "fill-opacity": 0.35, "fill-color": ["get", "color"] },
              });

              instance!.addLayer({
                id: "jc-line",
                type: "line",
                source: "jc-rows",
                filter: ["in", ["geometry-type"], ["literal", ["LineString", "MultiLineString"]]],
                paint: { "line-color": ["get", "color"], "line-width": 2 },
              });

              instance!.addLayer({
                id: "jc-points",
                type: "circle",
                source: "jc-rows",
                filter: ["all", ["in", ["geometry-type"], ["literal", ["Point", "MultiPoint"]]], ["!", ["has", "point_count"]]],
                paint: {
                  "circle-radius": 6,
                  "circle-color": ["case", ["==", ["get", "id"], selected ?? ""], tokens.map.selected, ["get", "color"]],
                  "circle-stroke-color": tokens.map.stroke,
                  "circle-stroke-width": 1.5,
                },
              });

              const handleClick = (e: { features?: Array<{ properties?: { id?: string } }> }) => {
                const id = e.features?.[0]?.properties?.id;
                const r = typeof id === "string" ? rowByIdRef.current.get(id) : undefined;
                if (r) onSelectRef.current?.(r);
              };

              instance!.on("click", "jc-points", handleClick);
              instance!.on("click", "jc-fill", handleClick);
              instance!.on("click", "jc-line", handleClick);

              setReady(true);
            });
          });

          return () => {
            gone = true;
            if (overlayRef.current && map.current) {
              map.current.removeControl(overlayRef.current as unknown as IControl);
              overlayRef.current = null;
            }
            instance?.remove();
            map.current = null;
          };
        }, []);

        useEffect(() => {
          if (!ready || !map.current) return;
          map.current.setPaintProperty("jc-points", "circle-color", [
            "case",
            ["==", ["get", "id"], selected ?? ""],
            tokens.map.selected,
            ["get", "color"],
          ]);
        }, [ready, selected, tokens.map.selected]);

        useEffect(() => {
          if (!ready || !map.current) return;

          if (path.startsWith("deck-")) {
            const src = map.current.getSource("jc-rows") as GeoJSONSource | undefined;
            src?.setData({ type: "FeatureCollection", features: [] });

            let layer;
            if (path === "deck-points") {
              layer = new ScatterplotLayer({
                id: "jc-scatter",
                data: pointRows,
                getPosition: (d: PointRow) => d.position,
                getFillColor: (d: PointRow) => d.rgb,
                radiusMinPixels: 2,
                radiusMaxPixels: 8,
                pickable: true,
                onClick: (info: { object?: PointRow }) => info.object && onSelectRef.current?.(info.object.row),
              });
            } else if (path === "deck-hexbin") {
              layer = new HexagonLayer({
                id: "jc-hexagon",
                data: pointRows,
                getPosition: (d: PointRow) => d.position,
                radius,
                pickable: true,
                extruded: false,
                colorRange: deckColorRange(tokens),
              });
            } else {
              layer = new GridLayer({
                id: "jc-grid",
                data: pointRows,
                getPosition: (d: PointRow) => d.position,
                cellSize: radius,
                pickable: true,
                colorRange: deckColorRange(tokens),
              });
            }

            if (!overlayRef.current) {
              const overlay = new MapboxOverlay({ interleaved: false, layers: [layer] });
              overlayRef.current = overlay;
              map.current.addControl(overlay as unknown as IControl);
            } else {
              overlayRef.current.setProps({ layers: [layer] });
            }
          } else {
            if (overlayRef.current) {
              map.current.removeControl(overlayRef.current as unknown as IControl);
              overlayRef.current = null;
            }
            const src = map.current.getSource("jc-rows") as GeoJSONSource | undefined;
            src?.setData(collection as GeoJSON.FeatureCollection);
          }

          if (!fitted.current && collection.features.length > 0 && map.current.fitBounds) {
            fitted.current = true;
            // A loop, not Math.min(...xs): spreading 50 000 coordinates overflows the call stack.
            let [west, south, east, north] = [Infinity, Infinity, -Infinity, -Infinity];
            for (const f of collection.features) {
              for (const [x, y] of extractCoordinates(f.geometry)) {
                west = Math.min(west, x);
                south = Math.min(south, y);
                east = Math.max(east, x);
                north = Math.max(north, y);
              }
            }
            if (west <= east) {
              map.current.fitBounds(
                [
                  [west, south],
                  [east, north],
                ],
                { padding: 32, maxZoom: 14, duration: 0 },
              );
            }
          }
        }, [ready, path, collection, pointRows, radius, tokens]);

        const n = path === "maplibre" ? collection.features.length : pointRows.length;
        const chosen = selected ? rowById.get(selected) : null;
        const selectedLabel = chosen ? ` · ${nameOf(chosen, label)}` : "";

        return (
          <div className="jc-map" style={height === undefined ? undefined : { height }}>
            <div className="jc-map-canvas" ref={container} data-testid="jc-map" role="application" aria-label="Map" />
            {!effectiveBasemap && <span className="jc-map-notice">{NO_BASEMAP}</span>}
            {n === 0 && rows.length > 0 ? (
              <span className="jc-map-count">{NO_LOCATIONS}</span>
            ) : (
              <span className="jc-map-count">
                {n} on the map{selectedLabel}
              </span>
            )}
          </div>
        );
      }
    src__components__components.css: |
      /* The components' classes, over the token variables the SDK sets from design-tokens.json. Phone
         first (T-2777, UI-84): each view works from 375 px up, and widens by the room it is given. */

      /* The page is the app: no margin around the shell, so a framed app has one scrollbar, the frame's. */
      body {
        margin: 0;
      }

      .jc-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: var(--jc-font-body, "Inter", system-ui, -apple-system, "Segoe UI", sans-serif);
        color: var(--jc-color-ink, #0f172a);
        background: var(--jc-color-surface, #ffffff);
        font-size: var(--jc-font-size-md, 0.875rem);
        line-height: 1.5;
      }

      .jc-shell *, .jc-shell *::before, .jc-shell *::after {
        box-sizing: border-box;
      }

      .jc-header {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-header h1 {
        margin: 0;
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
      }

      /* Many pages scroll sideways on a phone rather than pushing the page wider than the screen. */
      .jc-header nav {
        display: flex;
        gap: var(--jc-space-1, 0.25rem);
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .jc-header nav button {
        all: unset;
        flex: none;
        cursor: pointer;
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 2px solid transparent;
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-header nav button[aria-current="page"] {
        color: var(--jc-color-accent, #0f766e);
        border-bottom-color: var(--jc-color-accent, #0f766e);
      }

      .jc-user {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-main {
        flex: 1;
        padding: var(--jc-space-4, 1rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--jc-space-4, 1rem);
        align-content: start;
      }

      .jc-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: var(--jc-space-3, 0.75rem);
      }

      .jc-tile {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-tile-label {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-tile-value {
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-table-wrap {
        container-type: inline-size;
        overflow-x: auto;
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
        background: var(--jc-color-surface, #ffffff);
      }

      .jc-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      .jc-table th {
        position: sticky;
        top: 0;
        background: var(--jc-color-card, #f8fafc);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        font-size: var(--jc-font-size-sm, 0.75rem);
        font-weight: 600;
      }

      .jc-table th button {
        all: unset;
        cursor: pointer;
        font: inherit;
        color: inherit;
        display: inline-flex;
        align-items: center;
        gap: var(--jc-space-1, 0.25rem);
      }

      .jc-table td {
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-table tbody tr:nth-child(even) {
        background: var(--jc-color-card, #f8fafc);
      }

      .jc-table tbody tr[aria-selected="true"] {
        background: color-mix(in srgb, var(--jc-color-accent, #0f766e) 15%, transparent);
      }

      .jc-table tbody tr[tabindex="0"] {
        cursor: pointer;
      }

      .jc-num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .jc-pager {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: var(--jc-space-3, 0.75rem);
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        border-top: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-detail {
        padding: var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-detail header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--jc-space-3, 0.75rem);
      }

      .jc-detail header h2 {
        margin: 0;
        font-size: var(--jc-font-size-lg, 1rem);
      }

      .jc-detail dl {
        display: grid;
        grid-template-columns: minmax(0, max-content) minmax(0, 1fr);
        gap: var(--jc-space-2, 0.5rem) var(--jc-space-4, 1rem);
        margin: 0;
      }

      .jc-detail dt {
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-detail dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .jc-filterbar {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: var(--jc-space-3, 0.75rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-filter {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        font-size: var(--jc-font-size-sm, 0.75rem);
      }

      .jc-filter span {
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-count {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        align-self: center;
      }

      .jc-form {
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-3, 0.75rem);
        max-width: 120rem;
      }

      /* One column on a phone, two from 40rem of the form's own width, three from 100rem (a form at
         1800 px and wider). */
      .jc-form-fields {
        display: grid;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }

      @container (width >= 40rem) {
        .jc-form-fields {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @container (width >= 100rem) {
        .jc-form-fields {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .jc-field {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
      }

      .jc-field span {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      /* One input per language of a LanguageProperty, stacked under the field's name. */
      .jc-field .jc-languages {
        display: grid;
        gap: var(--jc-space-1, 0.25rem);
        font-size: inherit;
        color: inherit;
        font-weight: inherit;
      }

      .jc-field-error {
        margin: 0;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-danger, #dc2626);
      }

      /* The form's buttons sit on one line, Save last. Without this the row was two stacked
         full-width buttons, which read as two unrelated actions (T-1060). */
      .jc-form-actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--jc-space-2, 0.5rem);
      }

      .jc-export {
        display: inline-flex;
        gap: var(--jc-space-2, 0.5rem);
      }

      .jc-chart {
        margin: 0;
        padding: var(--jc-space-3, 0.75rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-chart figcaption {
        font-weight: 600;
        margin-bottom: var(--jc-space-2, 0.5rem);
      }

      /* Its height follows its width, within what a screen can show; a `height` prop overrides it. */
      .jc-chart-canvas {
        width: 100%;
        aspect-ratio: 16 / 10;
        min-height: 14rem;
        max-height: 28rem;
      }

      /* The map fills the width; its height follows the window unless a `height` prop sets it. */
      .jc-map {
        height: clamp(18rem, 60vh, 44rem);
        position: relative;
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
        overflow: hidden;
      }

      .jc-map-canvas {
        position: absolute;
        inset: 0;
      }

      .jc-map-notice, .jc-map-count {
        position: absolute;
        z-index: 1;
        padding: var(--jc-space-1, 0.25rem) var(--jc-space-2, 0.5rem);
        border-radius: var(--jc-radius-sm, 4px);
        font-size: var(--jc-font-size-sm, 0.75rem);
        background: var(--jc-color-surface, #ffffff);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-map-notice {
        top: var(--jc-space-2, 0.5rem);
        left: var(--jc-space-2, 0.5rem);
      }

      .jc-map-count {
        bottom: var(--jc-space-2, 0.5rem);
        left: var(--jc-space-2, 0.5rem);
      }

      .jc-loading, .jc-empty {
        padding: var(--jc-space-4, 1rem);
        color: var(--jc-color-muted, #64748b);
        font-size: var(--jc-font-size-md, 0.875rem);
        text-align: center;
      }

      .jc-problem {
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        border-left: 4px solid var(--jc-color-danger, #dc2626);
        background: var(--jc-color-card, #f8fafc);
        border-radius: var(--jc-radius-sm, 4px);
      }

      .jc-problem strong {
        display: block;
        color: var(--jc-color-danger, #dc2626);
      }

      .jc-problem p {
        margin: var(--jc-space-1, 0.25rem) 0 0;
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-shell button, .jc-shell input, .jc-shell select {
        font: inherit;
        border-radius: var(--jc-radius-sm, 4px);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        padding: var(--jc-space-1, 0.25rem) var(--jc-space-2, 0.5rem);
        background: var(--jc-color-surface, #ffffff);
        color: var(--jc-color-ink, #0f172a);
      }

      .jc-shell button {
        cursor: pointer;
      }

      .jc-shell button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .jc-shell button:focus-visible, .jc-shell input:focus-visible, .jc-shell select:focus-visible {
        outline: 2px solid var(--jc-color-accent, #0f766e);
        outline-offset: 1px;
      }

      /* A table narrower than 36rem shows each row as a card of label and value; the header row stays,
         as a line of sort buttons, so sorting still works. */
      @container (width < 36rem) {
        .jc-table,
        .jc-table tbody,
        .jc-table tr,
        .jc-table td {
          display: block;
        }
        .jc-table thead tr {
          display: flex;
          flex-wrap: wrap;
          gap: var(--jc-space-1, 0.25rem);
          padding: var(--jc-space-2, 0.5rem);
          background: var(--jc-color-card, #f8fafc);
          border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        }
        .jc-table thead th {
          position: static;
          padding: 0;
          border: none;
          background: transparent;
        }
        .jc-table thead th button {
          padding: var(--jc-space-1, 0.25rem) var(--jc-space-2, 0.5rem);
          border: 1px solid var(--jc-color-line, #e2e8f0);
          border-radius: var(--jc-radius-sm, 4px);
        }
        .jc-table tbody tr {
          padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
          border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
        }
        .jc-table td {
          display: grid;
          grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
          gap: var(--jc-space-2, 0.5rem);
          padding: var(--jc-space-1, 0.25rem) 0;
          border: none;
          text-align: left;
          overflow-wrap: anywhere;
        }
        .jc-table td::before {
          content: attr(data-label);
          color: var(--jc-color-muted, #64748b);
          font-size: var(--jc-font-size-sm, 0.75rem);
          font-weight: 500;
        }
      }

      /* A finger, or a phone's width: every control at least 44 px tall, the map's buttons 44 px square. */
      @media (pointer: coarse), (width < 40rem) {
        .jc-shell :is(button, select, input:not([type="checkbox"], [type="radio"])),
        .jc-header nav button {
          min-height: var(--jc-target, 2.75rem);
        }
        .jc-header nav button {
          display: inline-flex;
          align-items: center;
        }
        .jc-table thead th button {
          display: inline-flex;
          align-items: center;
          min-height: var(--jc-target, 2.75rem);
        }
        .jc-map .maplibregl-ctrl-group button {
          width: var(--jc-target, 2.75rem);
          height: var(--jc-target, 2.75rem);
        }
      }

      @media (max-width: 40rem) {
        .jc-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .jc-header nav {
          width: 100%;
        }
        .jc-detail dl {
          grid-template-columns: minmax(0, 1fr);
        }
        .jc-detail dd {
          margin-bottom: var(--jc-space-2, 0.5rem);
        }
        .jc-filterbar {
          flex-direction: column;
          align-items: stretch;
        }
        .jc-count {
          margin-left: 0;
        }
      }
    src__design-tokens.json: |
