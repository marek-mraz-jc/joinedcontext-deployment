apps:
  helsinki-alerts:
    .gitea__workflows__build.yml: |
      # The build of this application (AP-80, AP-100, AP-101, AP-104, ADR-N-028). The Portal writes this
      # file in the application's first commit and a run never changes it: only a version a reviewer
      # merged runs. It builds the default branch on every push to it, and again when the Portal's
      # Rebuild dispatches it (AP-103).
      #
      # Runs on the installation's `gitea-runner` (label node-22), whose image carries the SDK and the
      # template's packages already installed, so nothing is installed here (AP-82). No step fetches an
      # action: the runner reaches the forge and the Portal API only (AP-81), by the in-cluster
      # addresses it gives every job as JC_FORGE_URL and JC_PORTAL_URL; `gitea.server_url` is the
      # public host, which the runner cannot reach.
      #
      # Two jobs: `build` runs the application's code and holds the job token only; `propose` runs no
      # code of the application and is the only one that sees the lane's secret. The Portal checks the
      # uploaded bundle against the proposed digest and publishes the package itself (AP-104).
      name: build

      on:
        push:
          branches: [main]
        workflow_dispatch:

      jobs:
        # `build` runs in a pod of this App's own (label app-build-node), registered with this
        # repository's token alone and mounting this App's build cache; `propose` stays on the shared
        # runner and mounts no cache (AP-130, AP-131).
        build:
          runs-on: app-build-node
          timeout-minutes: 20
          env:
            JC_BUILD_DIR: ${{ runner.temp }}/jc-build
          outputs:
            digest: ${{ steps.upload.outputs.digest }}
            commit: ${{ steps.upload.outputs.commit }}
            sdk-version: ${{ steps.upload.outputs.sdk-version }}
            built-at: ${{ steps.upload.outputs.built-at }}
          steps:
            # Clones the commit, runs the tests, builds and bundles the functions; the application's
            # own code runs here, with the job token removed from its environment.
            - name: Test and build
              env:
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_APP_COMMIT: ${{ gitea.sha }}
                JC_FORGE_TOKEN: ${{ gitea.token }}
              run: JC_APP_REPO="$JC_FORGE_URL/$JC_REPOSITORY.git" build-app

            # bundle-{commit} and sbom-{commit}, the run's artifacts, for the Portal to check and publish.
            - name: Upload the build
              id: upload
              run: node /opt/template/lane.mjs upload "$JC_BUILD_DIR"

        propose:
          needs: build
          runs-on: node-22
          timeout-minutes: 5
          steps:
            # The one step that sees the lane's secret, and it runs no code of the application (AP-80).
            - name: Propose status.build
              env:
                JC_LANE_TOKEN: ${{ secrets.JC_LANE_TOKEN }}
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_DIGEST: ${{ needs.build.outputs.digest }}
                JC_COMMIT: ${{ needs.build.outputs.commit }}
                JC_SDK_VERSION: ${{ needs.build.outputs.sdk-version }}
                JC_BUILT_AT: ${{ needs.build.outputs.built-at }}
              run: node /opt/template/lane.mjs propose "$JC_REPOSITORY"
    .gitignore: |
      node_modules/
      dist/
      test-results/
      playwright-report/
    README.md: |
      # helsinki-alerts

      Road works and traffic announcements in the capital region, read from the `helsinki` context
      space: an overview with the counts the `summary` function computes, and an Alerts page with
      filters, a map, a table and the detail of one alert. Sample application 3 of 3 (T-2598): a React
      frontend on the App SDK plus serverless functions, with two roles.

      | Role | Who (dev) | May |
      |---|---|---|
      | `viewer` | `demo.viewer@hel.fi` | read every alert and the summary |
      | `steward` | `demo.steward@hel.fi` | also add alerts, correct their fields, and remove the alerts a steward added |

      The roles are enforced by the gateway, not by this page (AP-96): `app.yaml` grants the write items
      to `steward` only, and the delete item carries `q: "!source"`, so only a record with no `source`
      (one a steward added, never Fintraffic's) can be removed. An alert on the map or in the table
      opens in the SDK shell's entity panel (SDK-40). There a steward corrects the plain fields the
      `steward` write item grants (`category`, `subCategory`, `address`, `dateIssued`, `validFrom`,
      `validTo`): the change is shown first and saved as one PATCH, and the table reads the alerts again.
      A viewer gets no Edit, only the link to the alert in the Portal. The App's own form, from the
      toolbar above the map, adds an alert and corrects what the panel leaves to the Portal: `name` and
      `description` language by language, keeping the others, and the `location`. It writes every
      attribute of `Alert` but `source` and lists the fields it leaves alone and why. The data needs are
      unchanged: the write items were the steward's before the panel came. A later run of the traffic-messages pipeline overwrites a correction of
      a Fintraffic record's fields.

      ## Functions

      - `functions/summary.ts`: counts per `category` and `subCategory`, the oldest open alert, and for
        a steward the number of alerts stewards added (`request.user.roles`).
      - `functions/expiring.ts`: the alerts whose `validTo` falls in the next `hours` (1 to 168).

      Both read only through `ctx.jc` with the caller's own grants and hold no secret.

      ## Run it

      ```sh
      pnpm install
      pnpm test                 # the pages and both functions
      pnpm build && pnpm e2e    # the built bundle in Chromium against the SDK's stub
      ```

      Against dev, `pnpm dev` with `JC_ENDPOINT_SLUG` set to the app's endpoint serves the pages with
      your own sign-in. The repository of record is
      `https://dev.joinedcontext.com/git/joinedcontext/helsinki_helsinki-alerts.git`; the build lane
      builds `main` with `.gitea/workflows/build.yml` (AP-75, AP-80).
    app.yaml: |
      # Traffic alerts in the capital region: road works and traffic announcements on a map and in a
      # table, a summary computed by a serverless function, and a steward who keeps the records
      # (AP-01, AP-04, AP-09, AP-40, AP-90…AP-97, T-2598). Hand written, so no generated-by annotation.
      #
      # A React frontend with functions: `static` with a Vite build, and `functions/` bundled by the
      # lane (AP-84). Its source is its own repository on the forge, which the build lane builds at
      # `ref` (AP-75, AP-80); this folder of the portal repository is where CI tests the same tree
      # before it is pushed there (T-2599).
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: helsinki-alerts
        namespace: helsinki
        title:
          en: "Helsinki traffic alerts"
          fi: "Helsingin liikennetiedotteet"
        description:
          en: "Road works and traffic announcements in the capital region on a map and in a table, with a steward who adds, corrects and removes records."
          fi: "Tietyöt ja liikennetiedotteet pääkaupunkiseudulla kartalla ja taulukossa; ylläpitäjä lisää, korjaa ja poistaa tiedotteita."
      spec:
        kind: ui
        source:
          git:
            url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_helsinki-alerts.git
            ref: main
        build:
          node: "22"
        # Only a person holding a role of the application opens it (AP-92).
        visibility: roles
        lifecycle: published
        roles:
          - name: viewer
            title: { en: "Viewer", fi: "Katselija" }
            description: "Reads every alert and the summary."
          - name: steward
            title: { en: "Steward", fi: "Ylläpitäjä" }
            description: "Also adds alerts, corrects their fields and removes the alerts a steward added."
        # Each role goes to its default group, `{app}-{role}`, committed beside the App under
        # grants/users/groups/ (AP-118, ADR-N-031): who holds a role is that group's members.
        access:
          - role: viewer
            subjects: [{ group: helsinki-alerts-viewer }]
          - role: steward
            subjects: [{ group: helsinki-alerts-steward }]
        dataNeeds:
          # Everyone the application admits reads the alerts: the attributes of `Alert` in the
          # `helsinki` model. It has no severity, so the page filters by category and subCategory.
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [Alert]
            attrs: [name, description, category, subCategory, address, dateIssued, validFrom, validTo, location, source]
            operations: [queryEntity, retrieveEntity]
            representations: [ngsi-ld, ogc-features]
          # The steward's record form (AP-09, red lane on purpose): create and correct every attribute
          # of `Alert` but `source`, which says where Fintraffic published a record and stays
          # read-only. `name` and `description` are per-language maps, written whole (T-2628).
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [Alert]
            attrs: [name, description, category, subCategory, address, dateIssued, validFrom, validTo, location]
            operations: [createEntity, updateAttrs]
            roles: [steward]
          # A steward removes only an alert a steward added: those carry no `source`, and the gateway
          # evaluates this filter against the stored entity before it forwards the delete (R45).
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [Alert]
            operations: [deleteEntity]
            q: "!source"
            roles: [steward]
    e2e__alerts.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { STEWARD, VIEWER } from "../src/fixtures/access";
      import { SLUG, serve } from "./serve";

      // AP-09, AP-96, SDK-40: the viewer reads an alert in the entity panel, linked to the Portal, and is
      // offered no way to change one.
      test("a viewer reads the alerts and gets no form, no edit and no delete", async ({ page }) => {
        const { alerts, writes, outside, problems } = await serve(page, "viewer", VIEWER);

        await alerts.getByRole("table").getByText("Kauppatori, Helsinki").click();
        const panel = page.getByRole("dialog");
        await expect(panel.getByRole("link", { name: "Open in the Portal" })).toBeVisible();
        await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
        for (const name of ["New alert", "Correct names and place", "Delete"]) await expect(alerts.getByRole("button", { name })).toHaveCount(0);
        await page.keyboard.press("Escape");
        await expect(panel).toHaveCount(0);
        expect(writes).toEqual([]);
        expect(outside).toEqual([]);
        expect(problems).toEqual([]);
      });

      // AP-62, SDK-40: the steward corrects an alert in the entity panel: the change shown first, then one
      // PATCH of the attribute that changed, and nothing else.
      test("a steward corrects an alert with one PATCH of the changed attribute", async ({ page }) => {
        const { alerts, writes, outside, problems } = await serve(page, "steward", STEWARD);

        await alerts.getByRole("table").getByText("Mannerheimintie resurfacing").click();
        const panel = page.getByRole("dialog");
        await panel.getByRole("button", { name: "Edit" }).click();
        await panel.getByLabel(/address/i).fill("Mannerheimintie 14, Helsinki");
        await panel.getByRole("button", { name: "Review the change" }).click();
        expect(writes).toEqual([]);
        await panel.getByRole("button", { name: "Save the change" }).click();
        await expect(panel.getByText("Saved.")).toBeVisible();

        expect(writes).toEqual([
          {
            method: "PATCH",
            path: `/api/endpoint/${SLUG}/ngsi-ld/v1/entities/${encodeURIComponent("urn:ngsi-ld:Alert:hel.fi:helsinki:GUID50001")}/attrs`,
            body: { address: { type: "Property", value: "Mannerheimintie 14, Helsinki" } },
          },
        ]);
        await expect(alerts.getByRole("table").getByText("Mannerheimintie 14, Helsinki")).toBeVisible();
        expect(outside).toEqual([]);
        expect(problems).toEqual([]);
      });

      // AP-09: a steward adds an alert, and removes only an alert a steward added.
      test("a steward adds an alert and deletes it, and cannot delete Fintraffic's", async ({ page }) => {
        const { alerts, writes, problems } = await serve(page, "steward", STEWARD);

        await alerts.getByRole("button", { name: "New alert" }).click();
        const form = alerts.getByRole("form", { name: "New alert" });
        await form.getByLabel("Local id").fill("steward-closure");
        await form.getByLabel("address", { exact: true }).fill("Senaatintori, Helsinki");
        await form.getByLabel("category", { exact: true }).fill("event");
        await form.getByRole("button", { name: "Save" }).click();
        await expect(form).toHaveCount(0);

        await alerts.getByRole("table").getByText("Mannerheimintie resurfacing").click();
        await expect(alerts.getByRole("button", { name: "Delete" })).toHaveCount(0);

        await alerts.getByRole("table").getByText("Senaatintori, Helsinki").click();
        await alerts.getByRole("button", { name: "Delete" }).click();
        await expect(alerts.getByRole("table").getByText("Senaatintori, Helsinki")).toHaveCount(0);

        expect(writes.map((write) => write.method)).toEqual(["POST", "DELETE"]);
        expect(writes[0].body).not.toHaveProperty("source");
        expect(writes[1].path).toContain(encodeURIComponent("urn:ngsi-ld:Alert:hel.fi:helsinki:steward-closure"));
        expect(problems).toEqual([]);
      });
    e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { STEWARD, VIEWER } from "../src/fixtures/access";
      import { serve } from "./serve";

      // UI-84, SDK-12 (T-2825): every screen at a phone, a tablet, a laptop and a wall: no sideways
      // scroll, no two blocks over each other, nothing axe finds at WCAG 2.1 AA. The steward's views
      // carry the record form, the viewer's only what they may read.
      const VIEWS = [
        { name: "overview", role: "viewer", access: VIEWER, open: "overview" },
        { name: "alerts", role: "viewer", access: VIEWER, open: "list" },
        { name: "a chosen alert", role: "viewer", access: VIEWER, open: "detail" },
        { name: "the steward's new alert form", role: "steward", access: STEWARD, open: "new" },
        { name: "the steward's edit in the panel", role: "steward", access: STEWARD, open: "panel" },
        { name: "the steward's names and place form", role: "steward", access: STEWARD, open: "edit" },
      ] as const;

      for (const view of VIEWS) {
        for (const size of WIDTHS) {
          test(`${view.name} at ${size.width} px: no sideways scroll, no overlap, axe clean`, async ({ page }, testInfo) => {
            await page.setViewportSize(size);
            const { alerts, outside, problems } = await serve(page, view.role, view.access);
            await expect(alerts.getByTestId("jc-map").locator("canvas")).toHaveCount(1);
            if (view.open === "overview") {
              await page.goto("http://portal.test/#overview");
              await expect(page.getByRole("heading", { name: "Summary" })).toBeVisible();
            } else if (view.open === "new") {
              await alerts.getByRole("button", { name: "New alert" }).click();
              await expect(alerts.getByRole("form", { name: "New alert" })).toBeVisible();
            } else if (view.open !== "list") {
              await alerts.getByRole("table").getByText("Mannerheimintie resurfacing").click();
              const panel = page.getByRole("dialog");
              if (view.open === "edit") {
                // On a phone the panel covers the page: closed, the alert's actions stay above the map.
                await page.keyboard.press("Escape");
                await alerts.getByRole("button", { name: "Correct names and place" }).click();
                await expect(alerts.getByRole("form", { name: "Edit Alert" })).toBeVisible();
              } else if (view.open === "panel") {
                await panel.getByRole("button", { name: "Edit" }).click();
                await expect(panel.getByRole("button", { name: "Review the change" })).toBeVisible();
              } else {
                await expect(panel.getByRole("link", { name: "Open in the Portal" })).toBeVisible();
              }
            }
            await testInfo.attach(`${view.name}-${size.width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            expect({ outside, problems }).toEqual({ outside: [], problems: [] });
          });
        }
      }

      // SDK-40, T-3394: an alert in the entity panel, light and dark, at a phone and a laptop: a viewer
      // is linked to the Portal, a steward gets Edit; Escape closes it.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: an alert in the entity panel, axe clean`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            await page.setViewportSize({ width, height: 900 });
            const { alerts, outside, problems } = await serve(page, "steward", STEWARD);
            await alerts.getByRole("table").getByText("Mannerheimintie resurfacing").click();
            const panel = page.getByRole("dialog");
            await expect(panel.getByRole("button", { name: "Edit" })).toBeVisible();
            expect(await layoutProblems(page)).toEqual([]);
            await page.keyboard.press("Escape");
            await expect(panel).toHaveCount(0);
            expect({ outside, problems }).toEqual({ outside: [], problems: [] });
          });
        }
      }
    e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import { expect, type Page } from "@playwright/test";
      import { stubTransport } from "@joinedcontext/sdk/testing";
      import type { AccessDocument } from "@joinedcontext/sdk";
      import { ALERTS } from "../src/fixtures/alerts";
      import { SCHEMA } from "../src/fixtures/schema";

      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      /** The App is served at the root of its own host (T-2838). */
      const APP = "/";
      export const SLUG = "helsinkialerts";
      const TYPES: Record<string, string> = { ".html": "text/html", ".js": "text/javascript", ".css": "text/css", ".json": "application/json", ".svg": "image/svg+xml" };

      interface Call {
        method: string;
        path: string;
        body: unknown;
      }

      /** Serves the built bundle as the static host does, opens the Alerts page,, `#jc-config` filled for `role`, and the endpoint from the SDK's stub. */
      export async function serve(page: Page, role: "viewer" | "steward", access: AccessDocument) {
        const transport = stubTransport({ entities: ALERTS, schema: SCHEMA, access });
        const config = {
          slug: SLUG,
          orgDomain: "hel.fi",
          space: "helsinki",
          transport: "origin",
          appName: "helsinki-alerts",
          user: { id: `demo.${role}`, name: `Demo ${role}`, roles: [role] },
          // Where the entity panel links an alert (SDK-40); shown, never followed.
          portal: "https://portal.test/projects/helsinki",
        };
        const writes: Call[] = [];
        const outside: string[] = [];
        const problems: string[] = [];
        page.on("pageerror", (error) => problems.push(error.message));
        page.on("dialog", (dialog) => void dialog.accept());

        await page.route("**/*", async (route) => {
          const request = route.request();
          const url = new URL(request.url());
          if (url.origin !== "http://portal.test") {
            outside.push(url.href);
            return route.abort();
          }
          // A published app calls its endpoint unprefixed on its own host, where the edge sets the
          // session as the bearer (T-2670, T-2838); the stub answers the gateway's path.
          if (url.pathname.startsWith(`${APP}api/endpoint/${SLUG}/`)) {
            const raw = request.postData();
            const body = raw ? JSON.parse(raw) : undefined;
            const path = url.pathname.slice(APP.length - 1);
            if (request.method() !== "GET") writes.push({ method: request.method(), path, body });
            const answer = await transport({ method: request.method() as "GET", path: path + url.search, body });
            return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body ?? null) });
          }
          const file = normalize(url.pathname.slice(APP.length) || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) return route.fulfill({ status: 404, body: "" });
          let body = readFileSync(join(DIST, file));
          if (file === "index.html") {
            body = Buffer.from(
              body.toString("utf8").replace('<script id="jc-config" type="application/json"></script>', `<script id="jc-config" type="application/json">${JSON.stringify(config)}</script>`),
            );
          }
          return route.fulfill({ status: 200, contentType: TYPES[extname(file)] ?? "application/octet-stream", body });
        });

        await page.goto(`http://portal.test${APP}#alerts`);
        const alerts = page.getByRole("region", { name: "Alerts" });
        await expect(alerts.getByRole("table").getByText("Mannerheimintie resurfacing")).toBeVisible();
        return { alerts, writes, outside, problems };
      }
    functions__expiring.test.ts: |
      import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
      import { fakeContext } from "@joinedcontext/sdk/testing";
      import { ALERTS } from "../src/fixtures/alerts";
      import expiring from "./expiring";

      const post = (hours: unknown) => ({ method: "POST" as const, query: {}, body: { hours }, user: null });

      describe("expiring", () => {
        beforeEach(() => {
          vi.useFakeTimers();
          vi.setSystemTime(new Date("2026-09-22T09:00:00Z"));
        });
        afterEach(() => {
          vi.useRealTimers();
        });

        // AP-40: the alerts ending in the next N hours, soonest first; ended and open-ended ones are not.
        it("lists the alerts that end within the window, soonest first", async () => {
          const ctx = fakeContext({ entities: ALERTS });

          const day = await expiring(post(24), ctx);
          expect(day.status).toBe(200);
          expect(day.body).toEqual({ hours: 24, alerts: [{ id: "urn:ngsi-ld:Alert:hel.fi:helsinki:GUID50002", name: "Ring I lane closure", validTo: "2026-09-22T12:00:00Z" }] });

          const twoDays = await expiring(post(48), ctx);
          expect((twoDays.body as { alerts: Array<{ id: string }> }).alerts.map((alert) => alert.id)).toEqual([
            "urn:ngsi-ld:Alert:hel.fi:helsinki:GUID50002",
            "urn:ngsi-ld:Alert:hel.fi:helsinki:steward-market-day",
          ]);
        });

        it("reads the hours from the query string on GET", async () => {
          const res = await expiring({ method: "GET", query: { hours: "3" }, body: null, user: null }, fakeContext({ entities: ALERTS }));

          expect(res.body).toEqual({ hours: 3, alerts: [{ id: "urn:ngsi-ld:Alert:hel.fi:helsinki:GUID50002", name: "Ring I lane closure", validTo: "2026-09-22T12:00:00Z" }] });
        });

        // AP-40: a window that is not a whole number of hours is refused before anything is read.
        it.each([[undefined], ["soon"], ["12"], [0], [-1], [1.5], [169], [Number.NaN], [null], [[24]]])(
          "refuses hours %j with 400 before reading anything",
          async (hours) => {
            const ctx = fakeContext({ entities: ALERTS });

            const res = await expiring(post(hours), ctx);

            expect(res.status).toBe(400);
            expect(ctx.logs).toEqual([]);
          },
        );

        it("refuses a non-numeric query string", async () => {
          const res = await expiring({ method: "GET", query: { hours: "2h" }, body: null, user: null }, fakeContext({ entities: ALERTS }));

          expect(res.status).toBe(400);
        });
      });
    functions__expiring.ts: |
      import type { FnHandler } from "@joinedcontext/sdk/server";

      export interface Expiring {
        hours: number;
        alerts: Array<{ id: string; name: string | null; validTo: string }>;
      }

      const MAX_HOURS = 168;
      const HOUR = 3600 * 1000;

      /** The alerts whose `validTo` falls in the next N hours, soonest first; N is 1 to 168. */
      const expiring: FnHandler = async (request, ctx) => {
        const given: unknown = request.method === "POST" ? request.body?.hours : request.query.hours;
        // A query string is text; a JSON body carries the number itself.
        const hours = request.method === "GET" && typeof given === "string" && /^\d+$/.test(given) ? Number(given) : given;
        if (typeof hours !== "number" || !Number.isInteger(hours) || hours < 1 || hours > MAX_HOURS) {
          return { status: 400, body: { title: `hours must be a whole number from 1 to ${MAX_HOURS}` } };
        }
        const now = Date.now();
        const until = now + hours * HOUR;
        const rows = await ctx.jc.entities.all("Alert", { limit: 5000 });
        const alerts = rows
          .flatMap((row) => {
            const end = typeof row.validTo === "string" ? Date.parse(row.validTo) : Number.NaN;
            return end > now && end <= until ? [{ id: row.id, name: typeof row.name === "string" ? row.name : null, validTo: String(row.validTo), end }] : [];
          })
          .sort((a, b) => a.end - b.end)
          .map(({ id, name, validTo }) => ({ id, name, validTo }));
        ctx.log("expiring", hours, alerts.length);
        return { status: 200, body: { hours, alerts } satisfies Expiring };
      };

      export default expiring;
    functions__summary.test.ts: |
      import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
      import { fakeContext } from "@joinedcontext/sdk/testing";
      import { ALERTS } from "../src/fixtures/alerts";
      import summary from "./summary";

      const request = (roles: string[] | null) => ({
        method: "GET" as const,
        query: {},
        body: null,
        user: roles ? { id: "u1", roles } : null,
      });

      describe("summary", () => {
        beforeEach(() => {
          vi.useFakeTimers();
          vi.setSystemTime(new Date("2026-09-22T09:00:00Z"));
        });
        afterEach(() => {
          vi.useRealTimers();
        });

        // AP-40, SDK-21: counts per category and subCategory, and the open alert issued first.
        it("counts the alerts and names the oldest open one for a viewer, with no steward field", async () => {
          const ctx = fakeContext({ entities: ALERTS });

          const res = await summary(request(["viewer"]), ctx);

          expect(res.status).toBe(200);
          expect(res.body).toEqual({
            total: 5,
            byCategory: { traffic: 4, event: 1 },
            bySubCategory: { roadWorks: 3, carAccident: 1, MARKET: 1 },
            // GUID50002 ends at 12:00 today and is still open; GUID50004 ended on the 14th.
            oldestOpen: { id: "urn:ngsi-ld:Alert:hel.fi:helsinki:GUID50002", name: "Ring I lane closure", dateIssued: "2026-09-18T08:00:00Z" },
          });
          expect(res.body).not.toHaveProperty("ownRecords");
          expect(ctx.logs).toEqual([["summary", 5, "alerts"]]);
        });

        // AP-93: the steward's number is there for the steward only.
        it("adds the count of the steward's own records for a steward", async () => {
          const res = await summary(request(["viewer", "steward"]), fakeContext({ entities: ALERTS }));

          expect(res.body).toMatchObject({ total: 5, ownRecords: 1 });
        });

        // An alert with no category is counted, as unknown; a name that is no text is no name.
        it("counts an alert with no category as unknown, and gives a name that is no text as none", async () => {
          const odd = { ...ALERTS[1], category: "", subCategory: undefined, name: 42 } as unknown as (typeof ALERTS)[number];
          const res = await summary(request(["viewer"]), fakeContext({ entities: [odd] }));

          expect(res.body).toMatchObject({
            byCategory: { unknown: 1 },
            bySubCategory: { unknown: 1 },
            oldestOpen: { id: "urn:ngsi-ld:Alert:hel.fi:helsinki:GUID50002", name: null },
          });
        });

        it("gives an anonymous caller no steward field, and an empty space no oldest alert", async () => {
          const res = await summary(request(null), fakeContext({ entities: [] }));

          expect(res.body).toEqual({ total: 0, byCategory: {}, bySubCategory: {}, oldestOpen: null });
        });
      });
    functions__summary.ts: |
      import type { FnHandler, Row } from "@joinedcontext/sdk/server";

      export interface Summary {
        total: number;
        byCategory: Record<string, number>;
        bySubCategory: Record<string, number>;
        /** The open alert issued first: no end, or an end still ahead. */
        oldestOpen: { id: string; name: string | null; dateIssued: string } | null;
        /** For a steward only: the alerts a steward added, the ones they may remove. */
        ownRecords?: number;
      }

      const MAX_ROWS = 5000;

      function countBy(rows: Row[], attr: string): Record<string, number> {
        const counts: Record<string, number> = {};
        for (const row of rows) {
          const key = typeof row[attr] === "string" && row[attr] !== "" ? (row[attr] as string) : "unknown";
          counts[key] = (counts[key] ?? 0) + 1;
        }
        return counts;
      }

      function isOpen(row: Row, now: number): boolean {
        if (row.validTo === null || row.validTo === undefined || row.validTo === "") return true;
        const end = Date.parse(String(row.validTo));
        return Number.isNaN(end) || end > now;
      }

      /** Counts per category and subCategory and the oldest open alert, read with the caller's own grants. */
      const summary: FnHandler = async (request, ctx) => {
        const rows = await ctx.jc.entities.all("Alert", { limit: MAX_ROWS });
        const now = Date.now();
        let oldest: Row | null = null;
        for (const row of rows) {
          if (!isOpen(row, now) || typeof row.dateIssued !== "string") continue;
          if (!oldest || Date.parse(row.dateIssued) < Date.parse(String(oldest.dateIssued))) oldest = row;
        }
        const body: Summary = {
          total: rows.length,
          byCategory: countBy(rows, "category"),
          bySubCategory: countBy(rows, "subCategory"),
          oldestOpen: oldest
            ? { id: oldest.id, name: typeof oldest.name === "string" ? oldest.name : null, dateIssued: String(oldest.dateIssued) }
            : null,
        };
        // AP-93, SDK-21: the host sets request.user from the person's app roles; a viewer never sees
        // the steward's number, not even as zero.
        if (request.user?.roles?.includes("steward")) {
          body.ownRecords = rows.filter((row) => row.source === null || row.source === undefined || row.source === "").length;
        }
        ctx.log("summary", rows.length, "alerts");
        return { status: 200, body };
      };

      export default summary;
