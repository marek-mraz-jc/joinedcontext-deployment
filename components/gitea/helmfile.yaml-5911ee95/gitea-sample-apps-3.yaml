          it("leaves an unchanged map out of the patch", async () => {
            const client = stubClient({ schema: multilingual, entities: [alert] });
            const onSaved = vi.fn();
            render(
              <JcProvider client={client}>
                <EntityForm type="Alert" row={shown} onSaved={onSaved} />
              </JcProvider>,
