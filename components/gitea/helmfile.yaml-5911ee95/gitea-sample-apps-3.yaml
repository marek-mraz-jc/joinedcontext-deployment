    .gitea__workflows__build.yml: |
      # The build of this application (AP-80, AP-100, AP-101, AP-104, ADR-N-028). The Portal writes this
      # file in the application's first commit and a run never changes it: only a version a reviewer
      # merged runs. It builds the default branch on every push to it, and again when the Portal's
      # Rebuild dispatches it (AP-103).
      #
      # Runs on the installation's `gitea-runner` (label node-22), whose image carries the SDK and the
      # template's packages already installed, so nothing is installed here (AP-82). No step fetches an
      # action: the runner reaches the forge and the Portal API only (AP-81), by the in-cluster
      # addresses it gives every job as JC_FORGE_URL and JC_PORTAL_URL; `gitea.server_url` is the
      # public host, which the runner cannot reach.
      #
      # Two jobs: `build` runs the application's code and holds the job token only; `propose` runs no
      # code of the application and is the only one that sees the lane's secret. The Portal checks the
      # uploaded bundle against the proposed digest and publishes the package itself (AP-104).
      name: build

      on:
        push:
          branches: [main]
        workflow_dispatch:

      jobs:
        # `build` runs in a pod of this App's own (label app-build-node), registered with this
        # repository's token alone and mounting this App's build cache; `propose` stays on the shared
        # runner and mounts no cache (AP-130, AP-131).
        build:
          runs-on: app-build-node
          timeout-minutes: 20
          env:
            JC_BUILD_DIR: ${{ runner.temp }}/jc-build
          outputs:
            digest: ${{ steps.upload.outputs.digest }}
            commit: ${{ steps.upload.outputs.commit }}
            sdk-version: ${{ steps.upload.outputs.sdk-version }}
            built-at: ${{ steps.upload.outputs.built-at }}
          steps:
            # Clones the commit, runs the tests, builds and bundles the functions; the application's
            # own code runs here, with the job token removed from its environment.
            - name: Test and build
              env:
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_APP_COMMIT: ${{ gitea.sha }}
                JC_FORGE_TOKEN: ${{ gitea.token }}
              run: JC_APP_REPO="$JC_FORGE_URL/$JC_REPOSITORY.git" build-app

            # bundle-{commit} and sbom-{commit}, the run's artifacts, for the Portal to check and publish.
            - name: Upload the build
              id: upload
              run: node /opt/template/lane.mjs upload "$JC_BUILD_DIR"

        propose:
          needs: build
          runs-on: node-22
          timeout-minutes: 5
          steps:
            # The one step that sees the lane's secret, and it runs no code of the application (AP-80).
            - name: Propose status.build
              env:
                JC_LANE_TOKEN: ${{ secrets.JC_LANE_TOKEN }}
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_DIGEST: ${{ needs.build.outputs.digest }}
                JC_COMMIT: ${{ needs.build.outputs.commit }}
                JC_SDK_VERSION: ${{ needs.build.outputs.sdk-version }}
                JC_BUILT_AT: ${{ needs.build.outputs.built-at }}
              run: node /opt/template/lane.mjs propose "$JC_REPOSITORY"
    .gitignore: |
      node_modules/
      dist/
      test-results/
      playwright-report/
    README.md: |
      # Helsinki events

      Upcoming events in Helsinki and Espoo from the Linked Events registers. One page, Events:

      - a search by name, place or words, and a From and To date;
      - a chart of the events per day for the next 30 days, and a chart of the events per register;
        clicking a bar shows only that day or that register;
      - every event with a location on the map, coloured by its register, with a legend;
      - the list, soonest first: date, time, place, register, a Cancelled mark, the source link and
        the description.

      An event's name in the list, or its marker on the map, opens it in the SDK shell's entity panel,
      with a link to the event in the Portal; the application writes nothing, so the panel offers no Edit.

      The Event entities carry no category. The one grouping they do carry is the register that
      publishes them, which the prefix of the local id names (`helsinki-agf…` is the City of Helsinki,
      `espoo_le-…` the City of Espoo, `kulke-…` the culture centres). The map colours and the second
      chart group by that register.

      It is a `static` application on the joinedcontext App SDK: React, read-only, one data need on the
      Context Space `helsinki` (`Event`). The Portal serves it under `/apps/helsinki-events/` and fills
      `#jc-config` with the application's own endpoint; the bundle talks to that endpoint and to nothing
      else. The query asks only for events that have not ended (`endDate>=` the start of today).

      The plain-HTML version this application replaces is the SDK's teaching example of a static App
      with no build step: `sdk/examples/plain-html-events` in the portal repository.

      ## Run the tests

      ```sh
      pnpm install
      pnpm test          # vitest, against the SDK's stub transport and six sampled events
      pnpm build         # the bundle the build lane publishes
      pnpm e2e           # the built bundle in Chromium, answered by the same stub (needs `pnpm build`)
      ```

      ## Run it locally against dev

      `pnpm dev` serves the application on `http://localhost:5173/`. Fill the `#jc-config` element in
      `index.html` with the endpoint of the application on dev before you start:

      ```json
      { "slug": "<the endpoint slug the App page shows>", "orgDomain": "hel.fi", "space": "helsinki", "transport": "origin", "appName": "helsinki-events" }
      ```

      Keep that edit out of the commit: the Portal writes the element when it serves the application.

      ## Where it is built

      This tree is the repository `helsinki_helsinki-events` on the installation's forge. Publishing a
      commit there is what the build lane builds: `pnpm install --offline`, `pnpm test`, `pnpm build`,
      and the bundle is served by its digest.
    app.yaml: |
      # Helsinki's upcoming events: a search and a date range, the events per day and per register in
      # charts, every located event on a coloured map, and the list (AP-138, T-2923). Hand written, so no
      # generated-by annotation (AP-35).
      #
      # A frontend only: React on the App SDK, read-only, so `static` with a Vite build. Its source is
      # its own repository on the forge, which the build lane builds at `ref` (AP-75, AP-80); this folder
      # of the portal repository is where CI tests the same tree before it is pushed there (T-2599). The
      # plain-HTML version it replaces stays as the SDK's teaching example, sdk/examples/plain-html-events.
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: helsinki-events
        namespace: helsinki
        title:
          en: "Helsinki events"
          fi: "Helsingin tapahtumat"
        description:
          en: "Upcoming events in Helsinki and Espoo from the Linked Events registers: search, filter by date, see how many there are each day and where they are on the map."
          fi: "Tulevat tapahtumat Helsingissä ja Espoossa Linked Events -rekistereistä: hae, rajaa päivämäärällä, katso tapahtumien määrä päivittäin ja sijainti kartalla."
      spec:
        kind: ui
        source:
          git:
            url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_helsinki-events.git
            ref: main
        build:
          node: "22"
        # The events endpoint of Helsinki is public (GW22): an anonymous reader gets what the public
        # role is granted and nothing more.
        visibility: public
        lifecycle: published
        dataNeeds:
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [Event]
            # The attributes the Event entities carry on dev (2026-09-22); contactPoint is hidden by
            # the endpoint's projection and is not asked for.
            attrs: [name, description, startDate, endDate, eventStatus, address, location, source]
            operations: [queryEntity, retrieveEntity]
            representations: [ngsi-ld, ogc-features]
    e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { BASE, serve } from "./serve";

      // UI-84, SDK-12, AP-138 (T-2923): the events page at a phone, a tablet, a laptop and a wall, with
      // its two charts and its map drawn: no sideways scroll, no two blocks over each other, nothing axe
      // finds at WCAG 2.1 AA.
      const VIEWS = [
        { name: "events", search: null },
        { name: "a search", search: "jazz" },
      ];

      for (const view of VIEWS) {
        for (const size of WIDTHS) {
          test(`${view.name} at ${size.width} px: no sideways scroll, no overlap, axe clean`, async ({ page }, testInfo) => {
            const { outside, missing, problems } = await serve(page);
            await page.setViewportSize(size);
            await page.goto(`${BASE}#events`);
            const events = page.getByRole("region", { name: "Events" });
            await expect(events.getByRole("list", { name: "Upcoming events" }).getByRole("listitem").first()).toBeVisible();
            await expect(events.getByTestId("jc-map").locator("canvas")).toHaveCount(1);
            await expect(events.locator(".jc-chart-canvas canvas")).toHaveCount(2);
            if (view.search) {
              await events.getByRole("searchbox", { name: "Search" }).fill(view.search);
              await expect(events.getByRole("heading", { name: "Jazz at Stoa" })).toBeVisible();
            }
            await testInfo.attach(`${view.name}-${size.width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      // SDK-40, T-3397: an event opens in the shell's entity panel, read through the app's endpoint, at a
      // phone and a laptop, light and dark; a public App writes nothing, so the panel links to the Portal.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: an event in the entity panel, linked to the Portal, axe clean`, async ({ page }) => {
            const { outside, missing, problems } = await serve(page);
            await page.emulateMedia({ colorScheme: scheme });
            await page.setViewportSize({ width, height: 900 });
            await page.goto(`${BASE}#events`);
            await page.getByRole("list", { name: "Upcoming events" }).getByRole("button", { name: "Organ concert" }).click();
            const panel = page.getByRole("dialog");
            await expect(panel.getByText("Unioninkatu 29, Helsinki")).toBeVisible();
            await expect(panel.getByRole("link", { name: "Open in the Portal" })).toBeVisible();
            await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
            expect(await layoutProblems(page)).toEqual([]);
            await page.keyboard.press("Escape");
            await expect(page.getByRole("dialog")).toHaveCount(0);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }
    e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { Page } from "@playwright/test";
      import { stubTransport } from "@joinedcontext/sdk/testing";
      import { EVENTS } from "../src/fixtures/events";

      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      export const BASE = "http://portal.test/";
      const SLUG = "helsinkievents";
      // `portal`: where the entity panel links an event (SDK-40); shown, never followed.
      const CONFIG = { slug: SLUG, orgDomain: "hel.fi", space: "helsinki", transport: "origin", appName: "helsinki-events", portal: "https://portal.test/projects/helsinki" };
      const TYPES: Record<string, string> = { ".html": "text/html", ".js": "text/javascript", ".css": "text/css", ".json": "application/json", ".svg": "image/svg+xml" };

      /** What the served page did that it should not: a host it called, a file it missed, an error it threw. */
      export interface Served {
        outside: string[];
        missing: string[];
        problems: string[];
      }

      /** Serves the built bundle at the root of the App's own host, with the SDK's stub answering its endpoint. */
      export async function serve(page: Page): Promise<Served> {
        const transport = stubTransport({
          entities: EVENTS,
          access: { permissions: [{ resource: { type: "Event" }, actions: ["queryEntity", "retrieveEntity"], attributes: "*" }], prohibitions: [] },
        });
        const served: Served = { outside: [], missing: [], problems: [] };
        page.on("pageerror", (error) => served.problems.push(error.message));
        // The page opens on today in Helsinki and charts the next 30 days: the day the fixtures fall on,
        // so both charts have bars to draw (T-3029). Only the date is fixed; timers still run.
        await page.clock.setFixedTime(new Date("2030-10-20T06:00:00Z"));

        await page.route("**/*", async (route) => {
          const url = new URL(route.request().url());
          if (url.origin !== "http://portal.test") {
            served.outside.push(url.href);
            return route.abort();
          }
          // A published app is served at the root of its own host and calls its endpoint unprefixed,
          // where the edge sets the session as the bearer (T-2670, T-2838); the stub answers that path.
          if (url.pathname.startsWith(`/api/endpoint/${SLUG}/`)) {
            const body = route.request().postData();
            const path = url.pathname + url.search;
            const answer = await transport({ method: route.request().method() as "GET", path, body: body ? JSON.parse(body) : undefined });
            return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body ?? null) });
          }
          const file = normalize(url.pathname.slice(1) || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) {
            served.missing.push(url.pathname);
            return route.fulfill({ status: 404, body: "" });
          }
          let body = readFileSync(join(DIST, file));
          if (file === "index.html") {
            body = Buffer.from(
              body.toString("utf8").replace('<script id="jc-config" type="application/json"></script>', `<script id="jc-config" type="application/json">${JSON.stringify(CONFIG)}</script>`),
            );
          }
          return route.fulfill({ status: 200, contentType: TYPES[extname(file)] ?? "application/octet-stream", body });
        });
        return served;
      }
