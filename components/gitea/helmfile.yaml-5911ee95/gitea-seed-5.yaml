      apiVersion: joinedcontext.com/v1alpha1
      kind: ServiceAccount
      metadata:
        name: pipelines
        namespace: bbsk
        title: { sk: Dávkovacie kanály kraja, en: Region ingestion pipelines }
      spec:
        owner: { user: de300000-0000-4000-8000-000000000001 } # demo.steward
        purpose: The Bento streams of the region demo write the published cube rows into bbsk-kraj, the indicators computed from them into bbsk-kpi, the region's registers into bbsk-registre, and every other table of its catalogue into bbsk-otvorene-data (T-4255), and the events of Slovakia into bbsk-podujatia (T-4895)
        roles:
