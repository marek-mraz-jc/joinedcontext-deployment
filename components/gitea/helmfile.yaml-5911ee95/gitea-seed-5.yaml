    projects__bbsk__pipelines__mosty__bento.yaml: |
      # The mapping of the mosty pipeline (PL-03): one Bridge per bridge of the road network in the
      # region, 1 651 of them, keyed by its number in the national road databank (ID_mosta). The line
      # is the bridge's axis as the region's layer draws it.

      pipeline:
        processors:
          - mapping: |
              map road_class {
                root = match this {
                  "diaľnica" => "motorway",
                  "cesta I. triedy" => "firstClass",
                  "cesta II. triedy" => "secondClass",
                  "cesta III. triedy" => "thirdClass",
                  "miestna neurčená" => "local",
                  this.has_prefix("účelová cesta") => "service",
                  _ => null,
                }
              }
              map heritage {
                root = match this {
                  "most, ktorý nie je pamiatka" => "notListed",
                  "kultúrna pamiatka" => "cultural",
                  "kultúrna + technická pamiatka" => "culturalAndTechnical",
                  _ => null,
                }
              }
              map text {
                root = if this.or("").string().trim() == "" { null } else { { "type": "Property", "value": this.string().trim() } }
              }
              root = this.features.or([]).filter(f -> f.properties.ID_mosta.or("").string().re_match("^M[0-9]+$") && f.geometry.or(null) != null).map_each(f -> f.properties.assign({ "_geometry": f.geometry })).map_each(p -> {
                "id": "urn:ngsi-ld:%v:%v:%v:%v".format("Bridge", "bbsk.sk", env("JC_SPACE"), p.ID_mosta),
                "type": "Bridge",
                # A bridge the register names with a blank is named by its id (M1020 on dev, T-4745).
                "name": { "type": "Property", "value": if p."Názov_mosta".or("").string().trim() == "" { p.ID_mosta.string() } else { p."Názov_mosta".string().trim() } },
                "bridgeCode": { "type": "Property", "value": p.ID_mosta },
                "roadClass": if p.Trieda_PK.or("").apply("road_class") == null { null } else { { "type": "Property", "value": p.Trieda_PK.apply("road_class") } },
                "roadNumber": p."Číslo_PK".apply("text"),
                "yearBuilt": if p.Rok_postavenia.type() == "number" && p.Rok_postavenia >= 1000 { { "type": "Property", "value": p.Rok_postavenia.int64() } } else { null },
                "spanCount": if p."Počet_otvorov".type() == "number" && p."Počet_otvorov" >= 0 { { "type": "Property", "value": p."Počet_otvorov".int64() } } else { null },
                "bridgedLength": if p."Dĺžka_premostenia___m".type() == "number" && p."Dĺžka_premostenia___m" >= 0 { { "type": "Property", "value": p."Dĺžka_premostenia___m", "unitCode": "MTR" } } else { null },
                "structureMaterial": p.materialText.apply("text"),
                "structureKind": p.druhKonstrukcieText.apply("text"),
                "heritageStatus": if p.mostAkoPamiatkaText.or("").apply("heritage") == null { null } else { { "type": "Property", "value": p.mostAkoPamiatkaText.apply("heritage") } },
                "managerName": p."Správca_mostu".apply("text"),
                "districtName": p.Okres.apply("text"),
                "location": { "type": "GeoProperty", "value": p._geometry },
                "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj, opendata.bbsk.sk (CC BY-SA 4.0)" },
                "source": { "type": "Property", "value": "https://opendata.bbsk.sk/" }
              }.filter(entry -> entry.value != null))
    projects__bbsk__pipelines__od-cyklisti-nehodovost__pipeline.yaml: |
      # One RoadAccident per row of "Cyklisti_nehodovosť" (T-4255); generated from the T-4254 mapping.
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: od-cyklisti-nehodovost
        namespace: bbsk
        title:
          sk: Cyklisti_nehodovosť
          en: Cyklisti_nehodovosť
      spec:
        class: scheduled
        enabled: true
        schedule: 7 1 * * 1
        source:
          dataSourceRef:
            kind: DataSource
            name: od-cyklisti-nehodovost
        targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
        output:
          type: RoadAccident
          mode: replace
        quotas:
          maxMemoryMb: 128
          cpuMillicores: 100
    projects__bbsk__pipelines__od-cykloscitace-miesta__bento.yaml: |
      # The mapping of the od-cykloscitace-miesta pipeline, generated from the T-4254 mapping: one PointOfInterest per row of
      # "Cyklosčítače - miesta" (https://opendata.dev.joinedcontext.com/dataset/bbsk-cykloscitace-miesta-6e967d). Do not edit: change the mapping and run scripts/open-data/generate.py.

      pipeline:
        processors:
          # A layer that answers an error or no feature list is the service failing, so the run fails
          # where it can be seen rather than writing nothing.
          - mapping: |
              root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
          # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
          # every further page of them is read (T-5288). One run holds every page, so a layer past
          # 10000 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
          - branch:
              request_map: |
                root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
              processors:
                - http:
                    url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/S%C4%8D%C3%ADta%C4%8De_detail_ECOVISIO/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
                    verb: GET
                    headers:
                      Accept: application/json
                    timeout: 60s
                    retries: 2
                    rate_limit: pipeline_egress
              result_map: |
                root.rowCount = this.count.or(this.error.message.or("no count"))
          - mapping: |
              let rows = this.rowCount.or(null)
              root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 10000 { [{ "problem": "the layer holds %v rows, more than the 10000 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
          - unarchive:
              format: json_array
          - switch:
              - check: this.offset.or(null) != null
                processors:
                  - mapping: |
                      meta offset = this.offset
                      meta rows = this.rowCount
                      root = ""
                  - http:
                      url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/S%C4%8D%C3%ADta%C4%8De_detail_ECOVISIO/FeatureServer/0/query?where=1%3D1&outFields=ID,S%C4%8D%C3%ADta%C4%8D,Miesto,Vytvoren%C3%BD,Dom%C3%A9na,Koment%C3%A1r,LAT,LON&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000&orderByFields=FID"
                      verb: GET
                      headers:
                        Accept: application/geo+json
                      timeout: 60s
                      retries: 2
                      rate_limit: pipeline_egress
                  - mapping: |
                      root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else if this.features.or(null) == null { { "problem": "the page at %v answered no features: %v".format(@offset, this.error.message.or("")) } } else if this.features.length() < [1000, @rows - @offset].min() { { "problem": "the page at %v answered %v rows where %v were due".format(@offset, this.features.length(), [1000, @rows - @offset].min()) } } else { this }
          # A refusal above fails the run and writes none of its message's rows.
          - mapping: |
              root = if this.problem.or(null) != null { throw(this.problem) } else { this }
          - mapping: |
              root = this.features.or([])
          - unarchive:
              format: json_array
          - mapping: |
              # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
              # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
              map number {
                let s = this.string().re_replace_all("[ 	  ]", "")
                let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
                root = $t.number().catch(null)
              }
              map integer {
                let v = if this == null { null } else { this.apply("number") }
                root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
              }
              map float {
                let v = if this == null { null } else { this.apply("number") }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              map string {
                let v = if this == null { "" } else { this.string().trim() }
                root = if $v == "" { null } else { { "type": "Property", "value": $v } }
              }
              map string_list {
                let v = if this == null { "" } else { this.string().trim() }
                root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
              }
              map uri {
                root = this.apply("string")
              }
              # An Esri date is milliseconds since the epoch; a WordPress one is text.
              # `match` rebinds `this` to what it matches, so the value is named first.
              map datetime {
                let x = this
                let v = match $x.type() {
                  "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
                  "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
                  _ => null,
                }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
              # anything else reads as a datetime (T-4288).
              map observed {
                let x = this
                root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
                  $x.apply("datetime").value.catch(null)
                }
              }
              # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
              map stamped {
                root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
              }
              map date {
                let x = this
                let v = match $x.type() {
                  "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
                  # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
                  "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
                    $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
                  },
                  _ => null,
                }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              let local = "cykloscitace-miesta-" + [this.properties."ID"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
              root = {
                "id": "urn:ngsi-ld:%v:%v:%v:%v".format("PointOfInterest", "bbsk.sk", env("JC_SPACE"), $local),
                "type": "PointOfInterest",
                "iD": this.properties."ID".apply("integer"),
                "scitac": this.properties."Sčítač".apply("string"),
                "name": this.properties."Miesto".apply("string"),
                "vytvoreny": this.properties."Vytvorený".apply("date"),
                "domena": this.properties."Doména".apply("string"),
                "komentar": this.properties."Komentár".apply("string"),
                "lAT": this.properties."LAT".apply("float"),
                "lON": this.properties."LON".apply("float"),
                "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
                "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
                "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/S%C4%8D%C3%ADta%C4%8De_detail_ECOVISIO/FeatureServer/0/query?where=1%3D1&outFields=ID,S%C4%8D%C3%ADta%C4%8D,Miesto,Vytvoren%C3%BD,Dom%C3%A9na,Koment%C3%A1r,LAT,LON&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000&orderByFields=FID" },
                "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-cykloscitace-miesta-6e967d" }
              }.filter(entry -> entry.value != null)
          # One request per run's batch rather than one per row.
          - split:
              size: 1000
              byte_size: 2097152
          - archive:
              format: json_array
    projects__bbsk__pipelines__od-cykloturisticke-trasy-nosic-infotabula-o__pipeline.yaml: |
      # One PointOfInterest per row of "Cykloturistické trasy - nosič/infotabuľa/odpočívadlo/značenie" (T-4255); signposts, boards and rest stops.
