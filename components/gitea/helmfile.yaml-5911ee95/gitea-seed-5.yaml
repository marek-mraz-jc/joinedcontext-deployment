    projects__bbsk__spaces__bbsk-kpi__datamodels__key-performance-indicator.linkml.yaml: |
      id: https://bbsk.sk/models/kpi/key-performance-indicator
      name: key-performance-indicator
      title: One computed indicator
      description: >-
        One number for one window, with the provenance that makes it auditable (PF-54, PF-55). An
        indicator is computed by a pipeline from the rows of a raw space and lives in the project's
        indicator space, never beside the rows it was computed from.

        The attribute set is fixed and the published schema closes the object, so `state` and
        `threshold` are absent by decision and not by omission: a threshold is the judgement of
        whoever reads the number, it changes without the number changing, and two departments may
        hold different ones. The state a view paints is what that view computes from the value and
        its own threshold.

        The territory an indicator describes is the last segment of its `{localId}`, and therefore of
        its `name`: the entity carries no attribute for it, because a number labelled with a body and
        no territory is a number a viewer has to guess about.
      license: https://joinedcontext.com/licenses/cc-by-4.0
      prefixes:
        linkml: https://w3id.org/linkml/
        jc: https://joinedcontext.com/models/
        ngsi-ld: https://uri.etsi.org/ngsi-ld/
        ucefact: https://vocabulary.uncefact.org/UnitMeasureCode#
      default_prefix: jc
      default_range: string
      imports:
        - linkml:types
        - ngsi-ld-core

      slots:
        name:
          slot_uri: jc:name
          description: >-
            The indicator's own name, equal to the `{localId}` of its id, so the territory is legible
            without parsing the URN.
          required: true
          annotations: { ngsi_ld_kind: Property }
        title:
          slot_uri: jc:title
          description: >-
            The indicator's human name, one text per language of the space, such as `{sk: Index
            starnutia, en: Ageing index}`: what a table labels the row with, because `name` is the
            slug. Optional: an indicator written before it, or by a writer that names none, has none.
          annotations:
            label:
              tag: label
              value:
                sk: Názov ukazovateľa
                cs: Název ukazatele
                en: Indicator title
                de: Indikatortitel
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: LanguageProperty
        currentValue:
          slot_uri: jc:currentValue
          description: >-
            The number, with its unit on the Property as `unitCode`, a UN/CEFACT common code, and the
            instant it describes as `observedAt`. A window with no reading in it carries the string
            `not measured` instead of a number, and never a zero: a zero reads as a measurement.
          required: true
          range: Any
          inlined: true
          any_of:
            - range: float
            - range: string
          annotations:
            ngsi_ld_kind: Property
            upstream_source: https://vocabulary.uncefact.org/UnitMeasureCode#
        calculationPeriod:
          slot_uri: jc:calculationPeriod
          description: >-
            The window the value actually covers, as `{ start, end }` RFC 3339 instants. It is the
            window the pipeline used and not the one it was asked for, so the distance between
            `calculationPeriod.end` and `updatedAt` is how stale the source is.
          required: true
          range: CalculationPeriod
          inlined: true
          annotations: { ngsi_ld_kind: Property }
        calculationFormula:
          slot_uri: jc:calculationFormula
          description: >-
            How the value was computed, in words a reader can check the number against: the measure,
            the aggregation, the window and any divisor, such as `per km² of the district's own area`.
            English plain text: a table leaves it out, so a Slovak answer never shows English prose.
          required: true
          annotations: { ngsi_ld_kind: Property, hidden: true }
        derivedFrom:
          slot_uri: jc:derivedFrom
          description: >-
            The Endpoint the sources were read through, as its URN. The endpoint and not the space:
            what an indicator could see is what that endpoint's policy let it see.
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Zdroj údajov
                cs: Zdroj dat
                en: Derived from
                de: Abgeleitet von
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        computedBy:
          slot_uri: jc:computedBy
          description: The Pipeline that computed it, as its URN.
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Vypočítané procesom
                cs: Vypočteno procesem
                en: Computed by
                de: Berechnet von
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        updatedAt:
          slot_uri: jc:updatedAt
          description: >-
            When the pipeline last ran, as an NGSI-LD DateTime. It is the run and not the window:
            an indicator whose source stopped moving keeps its window and gains a newer `updatedAt`,
            which is the visible fact that the source is static.
          range: datetime
          required: true
          annotations: { ngsi_ld_kind: Property }
        start:
          slot_uri: jc:start
          description: The first instant the window covers.
          range: datetime
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Začiatok
                cs: Začátek
                en: Start
                de: Beginn
              annotations: { generated: sk cs en de }
        end:
          slot_uri: jc:end
          description: The last instant the window covers.
          range: datetime
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Koniec
                cs: Konec
                en: End
                de: Ende
              annotations: { generated: sk cs en de }

      classes:
        KeyPerformanceIndicator:
          class_uri: jc:KeyPerformanceIndicator
          description: One number for one window, with the provenance that makes it auditable.
          is_a: Entity
          slots:
            - name
            - title
            - currentValue
            - calculationPeriod
            - calculationFormula
            - derivedFrom
            - computedBy
            - updatedAt
          slot_usage:
            name:
              rank: 1
              annotations:
                summary: true
                label:
                  tag: label
                  value:
                    sk: Názov
                    cs: Název
                    fi: Nimi
                    en: Name
                    de: Name
                  annotations: { generated: de }
            currentValue:
              rank: 2
              annotations:
                summary: true
                label:
                  tag: label
                  value:
                    sk: Hodnota
                    cs: Hodnota
                    fi: Arvo
                    en: Value
                    de: Wert
                  annotations: { generated: de }
            calculationPeriod:
              rank: 3
              annotations:
                summary: true
                label:
                  tag: label
                  value:
                    sk: Obdobie
                    cs: Období
                    fi: Jakso
                    en: Period
                    de: Berechnungszeitraum
                  annotations: { generated: de }
            updatedAt:
              rank: 4
              annotations:
                summary: true
                label:
                  tag: label
                  value:
                    sk: Aktualizované
                    cs: Aktualizováno
                    fi: Päivitetty
                    en: Updated
                    de: Zuletzt berechnet
                  annotations: { generated: de }
            calculationFormula:
              annotations:
                label:
                  tag: label
                  value:
                    sk: Výpočet
                    cs: Výpočet
                    fi: Laskentakaava
                    en: Formula
                    de: Berechnungsmethode
                  annotations: { generated: de }

        CalculationPeriod:
          class_uri: jc:CalculationPeriod
          description: >-
            The value of `calculationPeriod`: the window an indicator covers, never an entity of
            its own.
          slots: [start, end]

        Any:
          class_uri: linkml:Any
          description: >-
            Any value, which the slot's `any_of` narrows: `currentValue` is a number or the string
            `not measured`.
          annotations:
            upstream_source: https://w3id.org/linkml/Any
    projects__bbsk__spaces__bbsk-kraj__space.yaml: |
      # What the region's publishers published, as they published it: one entity per cube cell, the
      # publisher's own codes kept verbatim, nothing renamed on the way in. The indicators computed
      # from it live next door in `bbsk-kpi` and never here (PF-54).
      apiVersion: joinedcontext.com/v1alpha1
      kind: ContextSpace
      metadata:
        name: bbsk-kraj
        namespace: bbsk
        title:
          sk: Banskobystrický kraj — zdrojové údaje
          en: Banská Bystrica Region, raw data
        description:
          sk: Riadky otvorených dát pre kraj SK032 a jeho 13 okresov, tak ako ich publikoval ŠÚ SR.
          en: Open data rows for the kraj SK032 and its 13 districts, as ŠÚ SR published them.
      spec:
        # The space name is the segment its ids carry, pinned so it cannot drift (PF-84).
        urnSegment: bbsk-kraj
        isSandbox: false
        # The one model of this space: a write of a type it does not declare is refused (DM-61).
        dataModelRef: { kind: DataModel, name: statistical-observation }
        defaultLocale: sk
        # History per type (DM-82, ADR-N-046 2.3, T-4275): a measurement series keeps 30 days, every
        # other type keeps its current state only. Owners change it on the space's Retention tab.
        retention:
          - entityType: KeyPerformanceIndicator
            history: P30D
            # Written on every run without an observedAt: one row per change and one a week,
            # not one per run (T-4844, DM-108, DM-109; scripts/temporal-audit.py).
            attributes:
              dataSet: { record: onChange, heartbeat: P7D }
