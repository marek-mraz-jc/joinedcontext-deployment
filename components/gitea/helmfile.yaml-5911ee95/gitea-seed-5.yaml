    projects__bbsk__mcp__otvorene-data.yaml: |
      # The region's open data as one public, read-only MCP connector (T-4141, T-5367, ADR-N-043):
      # `https://{domain}/api/mcp/bbsk/otvorene-data`. It selects every public Endpoint of the project
      # bbsk; the steward's `bbsk-kraj` is not public and stays out. Every call is still that Endpoint's
      # own call, decided by its anonymous Policy, and the gateway lists anonymous callers read-only
      # tools only (T-4168). The edge counts anonymous calls per client IP (context-mcp-named).
      apiVersion: joinedcontext.com/v1alpha1
      kind: McpServer
      metadata:
        name: otvorene-data
        namespace: bbsk
        # What an AI client reads as serverInfo and initialize.instructions (EP-92).
        title:
          sk: Banskobystrický samosprávny kraj — otvorené údaje
          en: Banská Bystrica Region, open data
        description:
          sk: 'Otvorené údaje Banskobystrického samosprávneho kraja, len na čítanie: registre kraja (okresy, obce, organizácie, nemocnice, sociálne služby, mosty), ročné údaje ŠÚ SR za kraj a okresy, ukazovatele kraja a všetky ďalšie tabuľky portálu opendata.bbsk.sk (sčítanie, školy, cesty a mosty, zmluvy, faktúry, dotácie, zastupiteľstvo, investície, zdravotníctvo). Zdroje: Banskobystrický samosprávny kraj, Štatistický úrad SR; CC BY-SA 4.0. Pri citovaní uveďte zdroj.'
          en: "Read-only open data of the Banská Bystrica Self-Governing Region (BBSK), Slovakia: its registers (districts, municipalities, the region's organisations, hospitals, social services, bridges), the Statistical Office's yearly figures for the region and its districts, the region's indicators, and every other table of its open-data portal (census, schools, roads and bridges, contracts, invoices, grants, the council, investments, health care), each entity linking its catalogue page in `isPartOf`. Each tool answers per Endpoint. Start with list_endpoints or search, then query_entities naming one endpoint, with a small limit. Texts are in Slovak. Sources: BBSK (https://opendata.bbsk.sk/) and the Statistical Office of the Slovak Republic; CC BY-SA 4.0, credit the source when you quote it."
      spec:
        # Every public Endpoint of the project, resolved on each call (MF-55, T-5367): a new one joins
        # without an edit here, one that stops being public leaves.
        select:
          projects: [bbsk]
          accessLevel: [public]
        audience: public
    projects__bbsk__pipelines__cyklisti__bento.yaml: |
      # The mapping of the cyklisti pipeline (PL-03, T-5930): one KeyPerformanceIndicator per bicycle counter per month,
      # the sum of the layer's hourly counts. The DataSource answers the months the layer holds (Rok + Mesiac, its row
      # count, first and last day); each month is then read whole (at most 744 hours, under the layer's 2000-row page) and
      # summed here, because the layer refuses a sum over its text columns. A counter whose every hour of the month is
      # empty gets no row: an empty cell is not a zero.
      # A counter the region adds is a new column: it reaches this space when its column joins the URL and COUNTERS below.

      pipeline:
        processors:
          # An answer with an error or no month list is the layer failing: the run fails where it can be seen.
          - mapping: |
              root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no months: %v".format(this.error.message.or(""))) } else {
                this.features.map_each(f -> f.attributes).filter(m -> m.hodiny.or(0) > 0).map_each(m -> {
                  "rok": m.Rok, "mesiac": m.Mesiac, "hodiny": m.hodiny, "od": m.od, "do": m.do,
                  "where": "Rok='%v' AND Mesiac='%v'".format(m.Rok, m.Mesiac).escape_url_query()
                })
              }
          - unarchive: { format: json_array }
          - mapping: |
              meta where = this.where
              meta month = this.without("where").format_json(no_indent: true)
              root = ""
          - http:
              url: https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Scitace_new/FeatureServer/0/query?where=${! @where }&outFields=Hali%C4%8D,Kl%C3%A1tna,Kr%C3%A1%C4%BEova_ho%C4%BEa,O%C5%BEdiansky_tunel,Pastierska,Polt%C3%A1r,Rimava,Rimavsk%C3%A1_Sobota,Rove%C5%88,Sedlo_Javoriny,Ve%C4%BEk%C3%A1_L%C3%BAka,%C5%A0portov%C3%A1,Vlkanov%C3%A1&returnGeometry=false&resultRecordCount=2000&orderByFields=FID&f=json
              verb: GET
              headers: { Accept: application/json }
              timeout: 60s
              retries: 2
              rate_limit: pipeline_egress
          - mapping: |
              # Column -> the counter's place as od-cykloscitace-miesta names it (Miesto) and its ID there.
              let COUNTERS = {
                "Halič": ["Halič", "300021968"],
                "Klátna": ["Klátna", "300042364"],
                "Kráľova_hoľa": ["Kráľova Hoľa", "300029132"],
                "Oždiansky_tunel": ["Oždiansky tunel", "300036678"],
                "Pastierska": ["Pastierska", "300041235"],
                "Poltár": ["Poltár", "300034552"],
                "Rimava": ["Rimava", "300041334"],
                "Rimavská_Sobota": ["Rimavská Sobota", "300036680"],
                "Roveň": ["Roveň", "300042312"],
                "Sedlo_Javoriny": ["Sedlo Javoriny", "300041254"],
                "Veľká_Lúka": ["Veľká Lúka", "300041219"],
                "Športová": ["Športová", "300021910"],
                "Vlkanová": ["Vlkanová", "300066305"]
              }
              let m = @month.parse_json()
              let source_url = "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Scitace_new/FeatureServer/0"
              let rows = if errored() { throw("the month %v %v did not come: %v".format($m.rok, $m.mesiac, error())) } else if this.features.or(null) == null { throw("the month %v %v answered no rows: %v".format($m.rok, $m.mesiac, this.error.message.or(""))) } else { this.features.map_each(f -> f.attributes) }
              # A month answered short would be summed short and look like a quiet month.
              let checked = if $rows.length() != $m.hodiny { throw("the month %v %v answered %v hours where the layer counts %v".format($m.rok, $m.mesiac, $rows.length(), $m.hodiny)) } else { $rows }
              let period = $m.od.slice(0, 7)
              let at = $m.do + "T23:00:00Z"
              root = $COUNTERS.keys().sort().map_each(col -> {
                "col": col,
                "values": $checked.map_each(r -> r.get(col)).filter(v -> v != null).map_each(v -> v.string().number())
              }).filter(c -> c.values.length() > 0).map_each(c -> {
                "id": "urn:ngsi-ld:KeyPerformanceIndicator:%v:%v:scitace-new-%v-%v".format("bbsk.sk", env("JC_SPACE"), $COUNTERS.get(c.col).index(1), $period),
                "type": "KeyPerformanceIndicator",
                "dataSet": { "type": "Property", "value": "Scitace_new" },
                "indicator": { "type": "Property", "value": "pocet-cyklistov" },
                "refArea": { "type": "Property", "value": $COUNTERS.get(c.col).index(0) },
                "refPeriod": { "type": "Property", "value": $period },
                "kpiValue": { "type": "Property", "value": c.values.sum(), "unitCode": "C62", "observedAt": $at },
                "unitText": { "type": "Property", "value": "cyklisti za mesiac" },
                "source": { "type": "Property", "value": $source_url },
                "dateObserved": { "type": "Property", "value": $at }
              })
    projects__bbsk__pipelines__od-dodavatelia__bento.yaml: |
      # The mapping of the od-dodavatelia pipeline, generated from the T-4254 mapping: one Organization per row of
      # "Dodávatelia" (https://opendata.dev.joinedcontext.com/dataset/bbsk-dodavatelia-825cd0). Do not edit: change the mapping and run scripts/open-data/generate.py.

      pipeline:
        processors:
          # A layer that answers an error or no feature list is the service failing, so the run fails
          # where it can be seen rather than writing nothing.
          - mapping: |
              root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
          # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
          # every further page of them is read (T-5288). One run holds every page, so a layer past
          # 10132 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
          - branch:
              request_map: |
                root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
              processors:
                - http:
                    url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Pokus_dodavatelia/FeatureServer/0/query?where=ICO%20IS%20NOT%20NULL%20AND%20ICO%20%3C%3E%20%27%27&returnCountOnly=true&f=json"
                    verb: GET
                    headers:
                      Accept: application/json
                    timeout: 60s
                    retries: 2
                    rate_limit: pipeline_egress
              result_map: |
                root.rowCount = this.count.or(this.error.message.or("no count"))
          - mapping: |
              let rows = this.rowCount.or(null)
              root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 10132 { [{ "problem": "the layer holds %v rows, more than the 10132 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
          - unarchive:
              format: json_array
          - switch:
              - check: this.offset.or(null) != null
                processors:
                  - mapping: |
                      meta offset = this.offset
                      meta rows = this.rowCount
                      root = ""
                  - http:
                      url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Pokus_dodavatelia/FeatureServer/0/query?where=ICO%20IS%20NOT%20NULL%20AND%20ICO%20%3C%3E%20%27%27&outFields=ICO,Nazov,Obec,PSC&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000&orderByFields=FID"
                      verb: GET
                      headers:
                        Accept: application/geo+json
                      timeout: 60s
                      retries: 2
                      rate_limit: pipeline_egress
                  - mapping: |
                      root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else if this.features.or(null) == null { { "problem": "the page at %v answered no features: %v".format(@offset, this.error.message.or("")) } } else if this.features.length() < [1000, @rows - @offset].min() { { "problem": "the page at %v answered %v rows where %v were due".format(@offset, this.features.length(), [1000, @rows - @offset].min()) } } else { this }
          # A refusal above fails the run and writes none of its message's rows.
          - mapping: |
              root = if this.problem.or(null) != null { throw(this.problem) } else { this }
          - mapping: |
              root = this.features.or([])
          - unarchive:
              format: json_array
          # A row stays only when its ICO looks like one, which no Esri SQL can ask:
          # a row without an IČO, or with a name where the IČO belongs, can name a natural person (T-4255).
          - mapping: |
              root = if this.properties."ICO".or("").string().trim().re_match("^[0-9]{6,8}( ?[0-9]{4})?$") { this } else { deleted() }
          - mapping: |
              # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
              # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
              map number {
                let s = this.string().re_replace_all("[ 	  ]", "")
                let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
                root = $t.number().catch(null)
              }
              map integer {
                let v = if this == null { null } else { this.apply("number") }
                root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
              }
              map float {
                let v = if this == null { null } else { this.apply("number") }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              map string {
                let v = if this == null { "" } else { this.string().trim() }
                root = if $v == "" { null } else { { "type": "Property", "value": $v } }
