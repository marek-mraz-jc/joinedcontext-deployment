    projects__bbsk__spaces__bbsk-kpi__datamodels__key-performance-indicator.yaml: |
      # The model the region's indicator space publishes. It states the contract the platform already
      # enforces — `schemas/kinds/KeyPerformanceIndicator.json` closes the object and requires every
      # attribute — so a reader of this space can see what an indicator is without reading the code,
      # and the look-inside view has a type to count (DM-01, PF-54, Development/10 §4).
      apiVersion: joinedcontext.com/v1alpha1
      kind: DataModel
      metadata:
        name: key-performance-indicator
        namespace: bbsk
        title: { sk: Ukazovateľ, en: Indicator }
      spec:
        contextSpaceRef: bbsk-kpi
        linkml: ./key-performance-indicator.linkml.yaml
        version: 1.0.0
        lifecycle: published
        classes: [KeyPerformanceIndicator]
        # A published model commits all four artifacts (DM-02); the gateway opens them beside the
        # manifest and serves schema/v1 from them (DM-22, EP-49). Regenerate: see README.md.
        artifacts:
          jsonSchema: ./key-performance-indicator.v1.schema.json
          context: ./key-performance-indicator.v1.context.jsonld
          docs: ./key-performance-indicator.v1.md
          example: ./key-performance-indicator.v1.example.jsonld
    projects__bbsk__spaces__bbsk-kpi__space.yaml: |
      # The region's indicator space (PF-54): every KPI a pipeline computes for `bbsk` is one
      # KeyPerformanceIndicator entity here, never in the raw space it reads.
      apiVersion: joinedcontext.com/v1alpha1
      kind: ContextSpace
      metadata:
        name: bbsk-kpi
        namespace: bbsk
        title: { sk: Ukazovatele kraja, en: Region indicators }
        description:
          sk: Jeden záznam na ukazovateľ a územie, s jeho vzorcom, oknom a zdrojmi.
          en: One entity per indicator and territory, with its formula, its window and its sources.
      spec:
        urnSegment: bbsk-kpi
        isSandbox: false
        # The one model of this space: a write of a type it does not declare is refused (DM-61).
        dataModelRef: { kind: DataModel, name: key-performance-indicator }
        defaultLocale: sk
        # History per type (DM-82, ADR-N-046 2.3, T-4275): a measurement series keeps 30 days, every
        # other type keeps its current state only. Owners change it on the space's Retention tab.
        retention:
          - entityType: KeyPerformanceIndicator
            history: P30D
            # Written on every run without an observedAt: one row per change and one a week,
            # not one per run (T-4844, DM-108, DM-109; scripts/temporal-audit.py).
            attributes:
              calculationFormula: { record: onChange, heartbeat: P7D }
              calculationPeriod: { record: onChange, heartbeat: P7D }
              computedBy: { record: onChange, heartbeat: P7D }
              derivedFrom: { record: onChange, heartbeat: P7D }
              name: { record: onChange, heartbeat: P7D }
              title: { record: onChange, heartbeat: P7D }
              # updatedAt is the run's own clock, new on every run: no history of its own (DM-132, T-5848).
              updatedAt: { record: never }
        # The space's place (T-4525): the catalogue's Dataset carries it, so georel=near finds the space.
        # the Banská Bystrica Region with a margin; a KeyPerformanceIndicator outside it is flagged, never refused (DM-87).
        quality:
          - name: in-area
            entityType: KeyPerformanceIndicator
            kind: area
            attribute: location
            bbox: [18.3, 47.9, 20.5, 49.2]
    projects__bbsk__spaces__bbsk-kraj__datamodels__statistical-observation.v1.md: |
      # One published statistical cell (`statistical-observation` 1.1.0)

      The model the raw spaces of `bbsk` and `banskabystrica` publish, generated from
      `statistical-observation.linkml.yaml`. One class, `KeyPerformanceIndicator`, specialising the
      shared `Entity` of `ngsi-ld-core`.

      | Attribute | NGSI-LD kind | Range | Unit | IRI |
      |---|---|---|---|---|
      | `id` | Property | uri | | `ngsi-ld:hasId` |
      | `type` | Property | string | | `ngsi-ld:hasType` |
      | `location` | GeoProperty | GeoJSON geometry | | `geojson:geometry` |
      | `observedAt` | Property | datetime | | `ngsi-ld:observedAt` |
      | `dataSet` | Property | string | | `qb:dataSet` |
      | `indicator` | Property | string | | `jc:indicator` |
      | `refArea` | Property | string | | `sdmx-dim:refArea` |
      | `refPeriod` | Property | string | | `sdmx-dim:refPeriod` |
      | `dimensionKey` | Property | string | | `jc:dimensionKey` |
      | `kpiValue` | Property | float | varies, on the Property as `unitCode` | `sdm-kpi:kpiValue` |
      | `unitText` | Property | string | | `jc:unitText` |
      | `source` | Property | string | | `jc:source` |
      | `dateObserved` | Property | datetime | | `jc:dateObserved` |
      | `stewardNote` | Property | string | | `jc:stewardNote` |

      `dataSet`, `indicator`, `refArea`, `refPeriod`, `kpiValue`, `source`, `dateObserved`, `id` and
      `type` are required.

      `stewardNote` is the one attribute no pipeline writes (1.1.0). Every other attribute of a row
      belongs to the publisher and is replaced on the next run, so an application that offered one of
      them for editing would lose what a person typed without telling them. The note is where the
      person who keeps the data writes what they checked and what looks wrong; a Policy grants
      `updateAttrs` on this name alone, and a write to any other attribute from the same person is the
      gateway's own `403` (EP-14, AP-62). It holds at most 500 characters and no angle brackets.

      The `{localId}` of an entity is the publisher's own key, in the publisher's own spelling:
      `{dataSet}-{refArea}-{refPeriod}-{indicator}` and then one segment per remaining dimension, so
      `zp3803rs-SK032-2023-PROD_TONY-1`. Nothing is renamed on the way in, which is what makes a row
      traceable back to the request in `source`.

      The unit is on the Property and not on the slot, because one cube serves several indicators with
      different units. `unitCode` carries the UN/CEFACT common code and `unitText` carries the
      publisher's own words, which is where a scale factor like "v tis. m3" survives.

      The class IRI is the Smart Data Model's `KeyPerformanceIndicator`, and the model deliberately declares no Data
      Structure Definition: DM-60 puts the observations of a declared DSD in the project's indicator
      space, which would leave the raw space holding nothing. DM-60 is the upgrade the day an
      indicator has to be sliced by a dimension.
