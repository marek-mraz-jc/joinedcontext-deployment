      # Generated by seeds/bbsk-events/generate.py from the inventory row Hontianske Tesáre (lego-html),
      # read 2026-10-21: https://www.hontiansketesare.sk/urad/kalendar-akcii/ (T-4896). Do not edit: change the template or the CSV.
      pipeline:
        processors:
        - mapping: |
            let paths = content().string().re_find_all_object("href=\"(?:https?://www\\.hontiansketesare\\.sk)?(?P<p>/urad/kalendar\\-akcii/[A-Za-z0-9._~%/-]{1,300}-[0-9]{1,9}(?:_[0-9]{1,9})?[a-z]{2}\\.html)\"").map_each(m -> m.p).unique()
