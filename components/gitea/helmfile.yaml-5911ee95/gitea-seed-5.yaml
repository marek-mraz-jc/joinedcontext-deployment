    projects__bbsk__pipelines__od-dilatacne-celky-v-banskobystrickom-kraji__bento.yaml: |
      # The mapping of the od-dilatacne-celky-v-banskobystrickom-kraji pipeline, generated from the T-4254 mapping: one RoadStructure per row of
      # "Dilatačné celky v Banskobystrickom kraji (public view)" (https://opendata.dev.joinedcontext.com/dataset/bbsk-dilatacne-celky-v-banskobystrickom-kraji-public-view-6ff77a). Do not edit: change the mapping and run scripts/open-data/generate.py.

      pipeline:
        processors:
          # A layer that answers an error or no feature list is the service failing, so the run fails
          # where it can be seen rather than writing nothing.
          - mapping: |
              root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
          # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
          # every further page of them is read (T-5288). One run holds every page, so a layer past
          # 10000 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
          - branch:
              request_map: |
                root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
              processors:
                - http:
                    url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Dilata%C4%8Dn%C3%A9_celky_v_Banskobystrickom_kraji_(organization)_view/FeatureServer/2/query?where=1%3D1&returnCountOnly=true&f=json"
                    verb: GET
                    headers:
                      Accept: application/json
                    timeout: 60s
                    retries: 2
                    rate_limit: pipeline_egress
              result_map: |
                root.rowCount = this.count.or(this.error.message.or("no count"))
          - mapping: |
              let rows = this.rowCount.or(null)
              root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 10000 { [{ "problem": "the layer holds %v rows, more than the 10000 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
          - unarchive:
              format: json_array
          - switch:
              - check: this.offset.or(null) != null
                processors:
                  - mapping: |
                      meta offset = this.offset
                      meta rows = this.rowCount
                      root = ""
                  - http:
                      url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Dilata%C4%8Dn%C3%A9_celky_v_Banskobystrickom_kraji_(organization)_view/FeatureServer/2/query?where=1%3D1&outFields=Trieda_PK,%C4%8C%C3%ADslo_PK,ID_DC,Stavebno_technick%C3%BD_stav,Druh_kon%C5%A1trukcie,Material,Norm%C3%A1na_za%C5%A5a%C5%BEite%C4%BEnost___t,V%C3%BDhradn%C3%A1_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5___t,V%C3%BDnimo%C4%8Dn%C3%A1_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5___t,Predmet_premostenia,Vlastn%C3%ADk_mostu,Spr%C3%A1vca_mostu,Okres,Vlastn%C3%ADk_%C3%BAseku,Spr%C3%A1vca_%C3%BAseku&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000&orderByFields=OBJECTID"
                      verb: GET
                      headers:
                        Accept: application/geo+json
                      timeout: 60s
                      retries: 2
                      rate_limit: pipeline_egress
                  - mapping: |
                      root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else if this.features.or(null) == null { { "problem": "the page at %v answered no features: %v".format(@offset, this.error.message.or("")) } } else if this.features.length() < [1000, @rows - @offset].min() { { "problem": "the page at %v answered %v rows where %v were due".format(@offset, this.features.length(), [1000, @rows - @offset].min()) } } else { this }
          # A refusal above fails the run and writes none of its message's rows.
          - mapping: |
              root = if this.problem.or(null) != null { throw(this.problem) } else { this }
          - mapping: |
              root = this.features.or([])
          - unarchive:
              format: json_array
          - mapping: |
              # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
              # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
              map number {
                let s = this.string().re_replace_all("[ 	  ]", "")
                let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
                root = $t.number().catch(null)
              }
              map integer {
                let v = if this == null { null } else { this.apply("number") }
                root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
              }
              map float {
                let v = if this == null { null } else { this.apply("number") }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              map string {
                let v = if this == null { "" } else { this.string().trim() }
                root = if $v == "" { null } else { { "type": "Property", "value": $v } }
              }
              map string_list {
                let v = if this == null { "" } else { this.string().trim() }
                root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
              }
              map uri {
                root = this.apply("string")
              }
              # An Esri date is milliseconds since the epoch; a WordPress one is text.
              # `match` rebinds `this` to what it matches, so the value is named first.
              map datetime {
                let x = this
                let v = match $x.type() {
                  "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
                  "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
                  _ => null,
                }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
              # anything else reads as a datetime (T-4288).
              map observed {
                let x = this
                root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
                  $x.apply("datetime").value.catch(null)
                }
              }
              # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
              map stamped {
                root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
              }
              map date {
                let x = this
                let v = match $x.type() {
                  "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
                  # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
                  "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
                    $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
                  },
                  _ => null,
                }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              let local = "dilatacne-celky-v-banskobystrickom-kraji-" + [this.properties."ID_DC"].map_each(v -> v.string()).join("-").re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
              root = {
                "id": "urn:ngsi-ld:%v:%v:%v:%v".format("RoadStructure", "bbsk.sk", env("JC_SPACE"), $local),
                "type": "RoadStructure",
                "triedaPK": this.properties."Trieda_PK".apply("string"),
                "cisloPK": this.properties."Číslo_PK".apply("string"),
                "name": this.properties."ID_DC".apply("string"),
                "stavebnoTechnickyStav": this.properties."Stavebno_technický_stav".apply("string"),
                "druhKonstrukcie": this.properties."Druh_konštrukcie".apply("string"),
                "material": this.properties."Material".apply("string"),
                "normanaZatazitelnostT": this.properties."Normána_zaťažiteľnost___t".apply("integer"),
                "vyhradnaZatazitelnostT": this.properties."Výhradná_zaťažiteľnosť___t".apply("string"),
                "vynimocnaZatazitelnostT": this.properties."Výnimočná_zaťažiteľnosť___t".apply("string"),
                "predmetPremostenia": this.properties."Predmet_premostenia".apply("string"),
                "vlastnikMostu": this.properties."Vlastník_mostu".apply("string"),
                "spravcaMostu": this.properties."Správca_mostu".apply("string"),
                "okres": this.properties."Okres".apply("string"),
                "vlastnikUseku": this.properties."Vlastník_úseku".apply("string"),
                "spravcaUseku": this.properties."Správca_úseku".apply("string"),
                "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
                "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
                "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Dilata%C4%8Dn%C3%A9_celky_v_Banskobystrickom_kraji_(organization)_view/FeatureServer/2/query?where=1%3D1&outFields=Trieda_PK,%C4%8C%C3%ADslo_PK,ID_DC,Stavebno_technick%C3%BD_stav,Druh_kon%C5%A1trukcie,Material,Norm%C3%A1na_za%C5%A5a%C5%BEite%C4%BEnost___t,V%C3%BDhradn%C3%A1_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5___t,V%C3%BDnimo%C4%8Dn%C3%A1_za%C5%A5a%C5%BEite%C4%BEnos%C5%A5___t,Predmet_premostenia,Vlastn%C3%ADk_mostu,Spr%C3%A1vca_mostu,Okres,Vlastn%C3%ADk_%C3%BAseku,Spr%C3%A1vca_%C3%BAseku&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000&orderByFields=OBJECTID" },
                "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-dilatacne-celky-v-banskobystrickom-kraji-public-view-6ff77a" }
              }.filter(entry -> entry.value != null)
          # One request per run's batch rather than one per row.
          - split:
              size: 1000
              byte_size: 2097152
          - archive:
              format: json_array
    projects__bbsk__pipelines__od-ekologicky-potencial-vodnych-utvarov__bento.yaml: |
      # The mapping of the od-ekologicky-potencial-vodnych-utvarov pipeline, generated from the T-4254 mapping: one WaterBodyStatus per row of
      # "Ekologický potenciál vodných útvarov" (https://opendata.dev.joinedcontext.com/dataset/bbsk-ekologicky-potencial-vodnych-utvarov-672eca). Do not edit: change the mapping and run scripts/open-data/generate.py.

      pipeline:
        processors:
          # A layer that answers an error or no feature list is the service failing, so the run fails
          # where it can be seen rather than writing nothing.
          - mapping: |
              root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
          # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
          # every further page of them is read (T-5288). One run holds every page, so a layer past
          # 10000 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
          - branch:
              request_map: |
                root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
              processors:
