          - kind: oauth-client
            name: main
    projects__bbsk__apps__bbsk-data__app.yaml: |
      # Seeded from joinedcontext-portal apps/bbsk-data/app.yaml, whose bundle the Portal image ships
      # under JC_PORTAL_APPS_DIR (T-2784): the static host serves only an App the configuration
      # repository holds, so the manifest is committed here like every other one. Keep the two equal.
      # Registre Banskobystrického kraja — the region's public registers as grids (T-2784, AP-07, AP-14,
      # UI-64). Hand written, so no generated-by annotation.
      #
      # It reads and never writes, so it is `static`: a bundle the Portal static host serves under
      # /apps/bbsk-data/. The register space and its endpoint are public, so the app never asks anybody
      # to sign in and never holds a token (AP-28).
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: bbsk-data
        namespace: bbsk
        title: { sk: Registre Banskobystrického kraja, en: Registers of the Banská Bystrica region }
        description:
          sk: 'Nemocnice, sociálne služby, mosty, organizácie a územné členenie kraja v tabuľkách: filter na každom stĺpci, hodnoty číselníkov na výber, detail riadku a stiahnutie v CSV a GeoJSON.'
          en: "The region's hospitals, social services, bridges, organizations and territorial division as tables: a filter on every column, code lists picked, each row whole, and a CSV or GeoJSON download."
        annotations:
          # The Portal image ships this bundle (Dockerfile, /srv/apps), so the App names no
          # repository of its own; the Portal accepts the mark only where the bundle is (AP-87).
          joinedcontext.com/shipped-with: portal
      spec:
        kind: ui
        source:
          path: ./apps/bbsk-data
        build: { node: '22' }
        visibility: public
        lifecycle: published
        embeddable: true
        dataNeeds:
          # The five registers of the region's public space with every column the grids show; the
          # downloads are the endpoint's own files, under the same grant (API/02 §3, §4).
          - contextSpaceRef: { kind: ContextSpace, name: bbsk-registre }
            types: [PointOfInterest, Bridge, PublicOrganization, AdministrativeArea]
            attrs:
              - name
              - category
              - hospitalKind
              - operatorName
              - medicalSpecialties
              - address
              - legalId
              - serviceKind
              - serviceForm
              - targetGroup
              - capacity
              - providerKind
              - districtName
              - url
              - bridgeCode
              - roadClass
              - roadNumber
              - yearBuilt
              - spanCount
              - bridgedLength
              - structureMaterial
              - heritageStatus
              - managerName
              - alternateName
              - organizationCategory
              - areaCode
              - divisionLevel
              - surfaceArea
              - location
            operations: [queryEntity, retrieveEntity]
            representations: [ngsi-ld, csv, ogc-features]
    projects__bbsk__datasources__bbsk-mosty.yaml: |
      # Hub item 3b46759b, layer 2, from SSC Model cestnej siete (Cestná databanka 01.01.2024), updated yearly; 1 651 bridges, 1 MB with 6-decimal coordinates. Read from the region's own ArcGIS FeatureServer, the service behind its open-data portal (opendata.bbsk.sk): the query asks for the columns the mapping reads, in WGS 84 (outSR=4326). No key. CC BY-SA 4.0, read from the Hub DCAT feed (opendata.bbsk.sk/api/feed/dcat-us/1.1.json) and the item's licenseInfo on arcgis.com.
      apiVersion: joinedcontext.com/v1alpha1
      kind: DataSource
      metadata:
        name: bbsk-mosty
        namespace: bbsk
        title: { sk: Mosty v Banskobystrickom kraji (BBSK), en: Bridges in the region (BBSK) }
      spec:
        type: http
        http:
          url: https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mosty_v_Banskobystrickom_kraji_(public_view)/FeatureServer/2/query?where=1%3D1&outFields=ID_mosta,N%C3%A1zov_mosta,Trieda_PK,%C4%8C%C3%ADslo_PK,Rok_postavenia,Po%C4%8Det_otvorov,D%C4%BA%C5%BEka_premostenia___m,materialText,druhKonstrukcieText,mostAkoPamiatkaText,Spr%C3%A1vca_mostu,Okres&returnGeometry=true&f=geojson&outSR=4326&geometryPrecision=6
          verb: GET
          headers:
            Accept: application/geo+json, application/json
          timeout: 60s
