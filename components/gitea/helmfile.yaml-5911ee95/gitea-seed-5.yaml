    projects__bbsk__pipelines__socialne-sluzby__bento.yaml: |
      # The mapping of the socialne-sluzby pipeline (PL-03): one PointOfInterest per service a
      # municipality, a town or the region registered. The DataSource asks for public providers only
      # (private ones can be a person running a care service) and never for the service's e-mail or
      # telephone. The register has no row id, so the localId is the provider's IČO and a hash of what
      # tells two of its services apart (kind, form, target group, street, municipality). The register
      # lists some services twice, identically; they are one entity, written once.

      pipeline:
        processors:
          - mapping: |
              map form {
                root = match this {
                  "terénna" => "field",
                  "ambulantná" => "outpatient",
                  "pobytová - ročná" => "residentialYearRound",
                  "pobytová - týždenná" => "residentialWeekly",
                  this.has_prefix("iná forma") => "remote",
                  _ => null,
                }
              }
              map provider {
                root = match this {
                  "obec/mesto" => "municipality",
                  "právnická osoba zriadená alebo založená obcou/mestom" => "municipalityFounded",
                  "právnická osoba zriadená alebo založená samosprávnym krajom" => "regionFounded",
                  _ => null,
                }
              }
              root = this.features.or([]).map_each(f -> f.properties).filter(p -> p."IČO".or("").string().re_match("^[0-9]{8}$") && p."Druh_poskytovanej_sociálnej_slu".or("").trim() != "" && p."Typ_poskytovateľa".or("").apply("provider") != null).map_each(p -> {
                "id": "urn:ngsi-ld:%v:%v:%v:%v-%v".format("PointOfInterest", "bbsk.sk", env("JC_SPACE"), p."IČO", [p."Druh_poskytovanej_sociálnej_slu", p."Forma_poskytovanej_sociálnej_sl", p."Cieľova_skupina_fyzických_osôb_", p."Ulica_sociálnej_služby", p."Obec_sociálnej_služby"].map_each(v -> v.or("").string()).join("|").hash("xxhash64").string()),
                "type": "PointOfInterest",
                "category": { "type": "Property", "value": ["socialService"] },
                "name": { "type": "Property", "value": "%v, %v".format(p."Druh_poskytovanej_sociálnej_slu".trim(), p."Obchodné_meno".or("").trim()).trim_suffix(", ") },
                "serviceKind": { "type": "Property", "value": p."Druh_poskytovanej_sociálnej_slu".trim() },
                "serviceForm": if p."Forma_poskytovanej_sociálnej_sl".or("").apply("form") == null { null } else { { "type": "Property", "value": p."Forma_poskytovanej_sociálnej_sl".apply("form") } },
                "targetGroup": if p."Cieľova_skupina_fyzických_osôb_".or("").trim() == "" { null } else { { "type": "Property", "value": p."Cieľova_skupina_fyzických_osôb_".trim() } },
                "capacity": if p.Kapacita.type() == "number" && p.Kapacita >= 0 { { "type": "Property", "value": p.Kapacita.int64() } } else { null },
                "providerKind": { "type": "Property", "value": p."Typ_poskytovateľa".apply("provider") },
                "legalId": { "type": "Property", "value": p."IČO" },
                "address": if p."Obec_sociálnej_služby".or("").trim() == "" { null } else { { "type": "Property", "value": {
                  "streetAddress": p."Ulica_sociálnej_služby".or("").trim(),
                  "postalCode": p."PSČ_sociálnej_služby".or("").string().re_replace_all(" +", "").trim(),
                  "addressLocality": p."Obec_sociálnej_služby".trim(),
                  "addressCountry": "SK"
                }.filter(f -> f.value != "") } },
                "districtName": if p."Okres_sociálnej_služby".or("").trim() == "" { null } else { { "type": "Property", "value": p."Okres_sociálnej_služby".trim() } },
                "url": if p."Webová_adresa".or("").trim() == "" { null } else { { "type": "Property", "value": if p."Webová_adresa".trim().re_match("^https?://") { p."Webová_adresa".trim() } else { "http://" + p."Webová_adresa".trim() } } },
                "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj, opendata.bbsk.sk (CC BY-SA 4.0)" },
                "source": { "type": "Property", "value": "https://opendata.bbsk.sk/" }
              }.filter(entry -> entry.value != null)).unique(e -> e.id)
