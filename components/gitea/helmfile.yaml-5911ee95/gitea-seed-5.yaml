                  Accept: text/html
                timeout: 20s
                retries: 1
            result_map: |
              # "3. 11. 2026, 8:30" is Bratislava's wall time; "3. 11. 2026" alone a whole day.
              map at {
                let m = this.or("").re_find_object("^(?P<d>[0-9]{1,2})\\. ?(?P<m>[0-9]{1,2})\\. ?(?P<y>[0-9]{4})(?:,? *(?P<h>[0-9]{1,2}):(?P<i>[0-9]{2}))?")
                let day = if $m.y.or("") == "" { null } else { "%s-%02d-%02d".format($m.y, $m.m.number().int64(), $m.d.number().int64()) }
