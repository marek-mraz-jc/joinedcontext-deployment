                      url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mapa_SODB_2021_materinsk%C3%BD_jazyk/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN4,NM4,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,LAU2,LAU2_CODE,K%C3%B3d,%C3%9Azemn%C3%A1_jednotka,Spolu,slovensk%C3%BD__abs__,slovensk%C3%BD____,ma%C4%8Farsk%C3%BD__abs__,ma%C4%8Farsk%C3%BD____,r%C3%B3msky__abs__,r%C3%B3msky____,rus%C3%ADnsky__abs__,rus%C3%ADnsky____,%C4%8Desk%C3%BD__abs__,%C4%8Desk%C3%BD____,ukrajinsk%C3%BD__abs__,ukrajinsk%C3%BD____,nemeck%C3%BD__abs__,nemeck%C3%BD____,po%C4%BEsk%C3%BD__abs__,po%C4%BEsk%C3%BD____,rusk%C3%BD__abs__,rusk%C3%BD____,vietnamsk%C3%BD__abs__,vietnamsk%C3%BD____,anglick%C3%BD__abs__,anglick%C3%BD____,chorv%C3%A1tsky__abs__,chorv%C3%A1tsky____,srbsk%C3%BD__abs__,srbsk%C3%BD____,taliansky__abs__,taliansky____,jidi%C5%A1_alebo_hebrejsk%C3%BD__abs__,jidi%C5%A1_alebo_hebrejsk%C3%BD____,arabsk%C3%BD__abs__,arabsk%C3%BD____,franc%C3%BAzsky__abs__,franc%C3%BAzsky____,rumunsk%C3%BD__abs__,rumunsk%C3%BD____,alb%C3%A1nsky__abs__,alb%C3%A1nsky____,%C5%A1panielsky__abs__,%C5%A1panielsky____,slovensk%C3%BD_posunkov%C3%BD_jazyk__abs_,slovensk%C3%BD_posunkov%C3%BD_jazyk____,%C4%8D%C3%ADnsky__abs__,%C4%8D%C3%ADnsky____,bulharsk%C3%BD__abs__,bulharsk%C3%BD____,k%C3%B3rejsk%C3%BD__abs__,k%C3%B3rejsk%C3%BD____,tureck%C3%BD__abs__,tureck%C3%BD____,perzsk%C3%BD__abs__,perzsk%C3%BD____,in%C3%BD__abs__,in%C3%BD____,nezisten%C3%BD__abs__,nezisten%C3%BD____&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000&orderByFields=ObjectId"
                      verb: GET
                      headers:
