              root = {
                "id": "urn:ngsi-ld:%v:%v:%v:%v".format("Petition", "bbsk.sk", env("JC_SPACE"), $local),
                "type": "Petition",
                "identifier": this.properties."P_č_".apply("string"),
                "vybavovatelPeticie": this.properties."Vybavovateľ_petície".apply("string"),
                "name": this.properties."Názov_petície".apply("string"),
                "text": this.properties."Text".apply("string"),
                "jeKvorova": this.properties."Je_kvórová".apply("string"),
                "datumDorucenia": this.properties."Dátum_doručenia".apply("date"),
                "datumVybavenia": this.properties."Dátum_vybavenia".apply("date"),
                "zverejnenieVysledkuVybavenia": this.properties."Zverejnenie_výsledku_vybavenia".apply("date"),
                "pocetOsobPodporujucichPetici": this.properties."Počet_osôb_podporujúcich_petíci".apply("integer"),
                "sposobVybavenia": this.properties."Spôsob_vybavenia".apply("string"),
                "poznamka": this.properties."Poznámka".apply("string"),
                "link": this.properties."Link".apply("string"),
                "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
                "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Pet%C3%ADcie/FeatureServer/0/query?where=1%3D1&outFields=P_%C4%8D_,Vybavovate%C4%BE_pet%C3%ADcie,N%C3%A1zov_pet%C3%ADcie,Text,Je_kv%C3%B3rov%C3%A1,D%C3%A1tum_doru%C4%8Denia,D%C3%A1tum_vybavenia,Zverejnenie_v%C3%BDsledku_vybavenia,Po%C4%8Det_os%C3%B4b_podporuj%C3%BAcich_pet%C3%ADci,Sp%C3%B4sob_vybavenia,Pozn%C3%A1mka,Link&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000&orderByFields=FID" },
                "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-peticie-f80530" }
              }.filter(entry -> entry.value != null)
          # One request per run's batch rather than one per row.
          - split:
              size: 1000
              byte_size: 2097152
          - archive:
              format: json_array
