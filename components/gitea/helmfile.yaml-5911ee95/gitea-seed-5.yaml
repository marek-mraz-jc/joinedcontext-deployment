    projects__bbsk__pipelines__okresy__bento.yaml: |
      # The mapping of the okresy pipeline (PL-03): one AdministrativeArea per district (okres) of the
      # region, 13 of them, its outline and its LAU 1 code. The id's localId is that code, the same one
      # the ŠÚ SR cubes in `bbsk-kraj` carry in `refArea`, so a figure finds its district without a
      # lookup table.

      pipeline:
        processors:
          - mapping: |
              root = this.features.or([]).filter(f -> f.properties.LAU1_CODE.or("").string().re_match("^SK032[1-9A-D]$") && f.geometry.or(null) != null).map_each(f -> {
                "id": "urn:ngsi-ld:%v:%v:%v:%v".format("AdministrativeArea", "bbsk.sk", env("JC_SPACE"), f.properties.LAU1_CODE),
                "type": "AdministrativeArea",
                "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-okresy-bbk-hranice-17725f" },
                "name": { "type": "Property", "value": "Okres " + f.properties.NM3.string() },
                "areaCode": { "type": "Property", "value": f.properties.LAU1_CODE },
                "divisionLevel": { "type": "Property", "value": "district" },
                "surfaceArea": if f.properties.VYMERA.type() == "number" { { "type": "Property", "value": f.properties.VYMERA, "unitCode": "MTK" } } else { null },
                "location": { "type": "GeoProperty", "value": f.geometry },
                "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj, opendata.bbsk.sk (CC BY-SA 4.0)" },
                "source": { "type": "Property", "value": "https://opendata.bbsk.sk/" }
              }.filter(entry -> entry.value != null))
    projects__bbsk__pipelines__podujatia-brezno__bento.yaml: |
      # Generated by seeds/bbsk-events/generate.py from the inventory row Brezno (eventphp-html),
      # read 2026-10-20: https://www.brezno.sk/event.php?work=events (T-4896). Do not edit: change the template or the CSV.
      pipeline:
        processors:
        - mapping: |
            let places = content().string().re_find_object("var places = \\[\\[(?P<v>[\\s\\S]*?)\\]\\];").v.or("")
            let slugs = $places.re_find_all_object("<a href=\"https?://www\\.brezno\\.sk/(?P<s>[a-z0-9-]{1,200})/\">").map_each(m -> m.s).unique()
            root = $slugs.slice(0, [$slugs.length(), 50].min()).map_each(s -> { "url": "https://www.brezno.sk/" + s + "/", "path": "/" + s + "/", "sourceId": "/" + s + "/" })
        - unarchive:
            format: json_array
        - branch:
            request_map: |
              root = ""
              meta event_path = this.path.trim_prefix("/")
            processors:
            - sleep:
                duration: 1s
            - http:
                url: https://www.brezno.sk/${! @event_path }
                verb: GET
                headers:
                  User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
                  Accept: text/html
                timeout: 20s
                retries: 1
            result_map: |
              # "29.10.2026" and "16:00" are Bratislava's wall time; a date without its time a whole day.
              map at {
                let m = this.d.re_find_object("^(?P<d>[0-9]{1,2})\\.(?P<m>[0-9]{1,2})\\.(?P<y>[0-9]{4})$")
                let day = if $m.y.or("") == "" { null } else { "%s-%02d-%02d".format($m.y, $m.m.number().int64(), $m.d.number().int64()) }
                let t = this.t.or("").re_find_object("^(?P<h>[0-9]{1,2}):(?P<i>[0-9]{2})$")
                let local = if $day != null && $t.h.or("") != "" { "%sT%02d:%s:00".format($day, $t.h.number().int64(), $t.i) } else { null }
                root = if $local != null { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") } else { $day }
              }
              let page = content().string()
              let name = $page.re_find_object("<h1>(?P<v>[^<]{1,500})</h1>").v.or("")
              let dates = $page.re_find_all_object("glyphicon-calendar text-muted\"></span>\\s*<strong>(?P<d>[0-9.]{8,10})</strong>\\s*<span class=\"glyphicon glyphicon-map-marker text-muted\"></span>(?P<v>[^<]{0,300})(?:<span class=\"pull-right\"><strong>(?P<t>[0-9]{1,2}:[0-9]{2})</strong>)?")
              root.name = if $name == "" { null } else { $name }
              # The place as the CMS writes it ("Mestská veža, Námestie M. R. Štefánika, 977 01 Brezno"): the venue table
              # matches the whole text; a postcode and its town give the address.
              root.shows = $dates.map_each(s -> {
                "start": s.apply("at"),
                "venue": s.v.trim().(v -> if v == "" { null } else { v }),
                "postalCode": s.v.re_find_object("(?:^|,)\\s*(?P<z>[0-9]{3} ?[0-9]{2})\\s+[^,]+").z.or("").(v -> if v == "" { null } else { v }),
                "locality": s.v.re_find_object("(?:^|,)\\s*[0-9]{3} ?[0-9]{2}\\s+(?P<l>[^,]+?)\\s*(?:,|$)").l.or("").(v -> if v == "" { null } else { v })
              })
        - mapping: |
            let event = this.without("shows", "path")
            root = this.shows.or([]).map_each(s -> $event.merge(s))
        - unarchive:
            format: json_array
        - archive:
