    projects__bbsk__pipelines__od-peticie__bento.yaml: |
      # The mapping of the od-peticie pipeline, generated from the T-4254 mapping: one Petition per row of
      # "Petície" (https://opendata.dev.joinedcontext.com/dataset/bbsk-peticie-f80530). Do not edit: change the mapping and run scripts/open-data/generate.py.

      pipeline:
        processors:
          # A layer that answers an error or no feature list is the service failing, so the run fails
          # where it can be seen rather than writing nothing.
