      | `community-civic` |  |
      | `other` | No other code fits; only the decision model gives it, never the rule table. |

      ### EventAudience

      The Smart Data Models Event audience codes the pipelines write.

      | Value | Meaning |
      |---|---|
      | `children` |  |
      | `family` |  |
