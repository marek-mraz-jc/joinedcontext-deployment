      import { useMemo } from "react";
      import { AppShell } from "@joinedcontext/sdk";
      import type { ShellPage } from "@joinedcontext/sdk";
      import { AccessProvider, useAccess } from "./access";
      import { History } from "./components/History";
      import { LANGS, useLang } from "./i18n";
      import type { Lang } from "./i18n";
      import { Explore } from "./pages/Explore";
      import { Places } from "./pages/Places";
      import { airApi, apiBase } from "./server";
      import type { AirApi } from "./server";
      import { t } from "./texts";
      import { readParams, writeParams } from "./url";

      const LANGUAGES = [
        { code: "fi", label: "Suomi" },
        { code: "en", label: "English" },
        { code: "sv", label: "Svenska" },
      ];

      /**
       * Suomi, English or Svenska: the choice is written into the address (`?lang=`) and the page reloads in it,
       * so every text, number and date follows at once and a shared link keeps the language.
       */
      export function chooseLanguage(next: string, current: Lang, reload: () => void = () => window.location.reload()): void {
        if (next === current || !LANGS.includes(next as Lang)) return;
        const params = readParams(window.location.search);
        params.set("lang", next);
        writeParams(params);
        reload();
      }

      /** Who reads the page, in the shell's header: their role, or that they are signed out. */
      export function RoleBadge({ lang }: { lang: Lang }) {
        const { me, steward } = useAccess();
        if (me === undefined) return null;
        const role = me === null ? t(lang, "signedOut") : t(lang, steward ? "roleSteward" : "roleViewer");
        return (
          <span className="app-role" aria-label={`${t(lang, "roleLabel")}: ${role}`}>
            {role}
          </span>
        );
      }

      function Shell({ api }: { api: AirApi }) {
        const lang = useLang();
        const { me } = useAccess();
        const pages: ShellPage[] = [
          { id: "compare", label: t(lang, "page"), render: () => <Explore server={api} /> },
          { id: "places", label: t(lang, "placesPage"), render: () => <Places lang={lang} api={api} /> },
          { id: "history", label: t(lang, "historyPage"), render: () => <History lang={lang} api={api} /> },
        ];
        return (
          <AppShell
            title={t(lang, "title")}
            pages={pages}
            languages={LANGUAGES}
            language={lang}
            onLanguage={(next) => chooseLanguage(next, lang)}
            userName={me?.name}
            actions={<RoleBadge lang={lang} />}
          />
        );
      }

      /**
       * How Helsinki's weather moves its air quality, station by station, in the SDK's shell (SDK-39);
       * a reader keeps places with alert levels, a steward marks faulty readings (T-3827).
       */
      export default function App({ server }: { server?: AirApi } = {}) {
        const api = useMemo(() => server ?? airApi(apiBase()), [server]);
        return (
          <AccessProvider api={api}>
            <Shell api={api} />
          </AccessProvider>
        );
      }
    src__access.tsx: |
      import { createContext, useContext, useEffect, useState } from "react";
      import type { ReactNode } from "react";
      import type { Me } from "./server";

      /** The App role that marks readings faulty (app.yaml). */
      export const STEWARD = "steward";

      export interface Access {
        /** Who is signed in; `null` when signed out, `undefined` while it is asked. */
        me: Me | null | undefined;
        steward: boolean;
      }

      const AccessContext = createContext<Access>({ me: undefined, steward: false });

      /** Who the reader is, asked of the App's server once. What it offers, the server decides again. */
      export function AccessProvider({ api, children }: { api: { me: () => Promise<Me | null> }; children: ReactNode }) {
        const [me, setMe] = useState<Me | null | undefined>(undefined);
        useEffect(() => {
          let current = true;
          api.me().then(
            (who) => current && setMe(who),
            () => current && setMe(null),
          );
          return () => {
            current = false;
          };
        }, [api]);
        const steward = me?.roles.includes(STEWARD) ?? false;
        return <AccessContext.Provider value={{ me, steward }}>{children}</AccessContext.Provider>;
      }

      export function useAccess(): Access {
        return useContext(AccessContext);
      }
    src__analysis.test.ts: |
      import { afterEach, describe, expect, it, vi } from "vitest";
      import { analyseHere, computeAnalysis, readAnswer, strength, strongest } from "./analysis";

      const HOUR = 3_600_000;
      const T0 = Date.UTC(2030, 9, 20);
      const hours = (f: (h: number) => number, n = 12): Array<[number, number]> => Array.from({ length: n }, (_, h) => [T0 + h * HOUR, f(h)]);

      // The real WebAssembly statistics (test-setup.ts loads them), called as the page calls them.
      describe("analysis", () => {
        it("finds that PM2.5 falls as the wind rises", async () => {
          const result = await analyseHere({ air: { pm25: hours((h) => 30 - 2 * h) }, weather: { windSpeed: hours((h) => 1 + h) }, settings: { window: 1 } });
          expect(result.hours).toHaveLength(12);
          expect(result.pairs).toHaveLength(1);
          expect(result.pairs[0]).toMatchObject({ air: "pm25", weather: "windSpeed", n: 12 });
          expect(result.pairs[0].pearson).toBeCloseTo(-1, 9);
          expect(result.pairs[0].spearman).toBeCloseTo(-1, 9);
          expect(strongest(result.pairs)?.weather).toBe("windSpeed");
        });

        it("marks an outlying reading and smooths with the rolling mean", async () => {
          const result = await computeAnalysis({ air: { pm25: hours((h) => (h === 5 ? 90 : 10 + (h % 2))) }, weather: {}, settings: { window: 3 } });
          expect(result.air[0].outliers).toEqual([5]);
          expect(result.air[0].smooth[2]).toBeCloseTo((10 + 11 + 10) / 3, 9);
        });

        it("answers nothing for no readings", async () => {
          const result = await analyseHere({ air: {}, weather: {}, settings: {} });
          expect(result).toEqual({ hours: [], air: [], weather: [], pairs: [] });
          expect(strongest([])).toBeNull();
        });

        it("names the strength of a correlation", () => {
          expect([0.1, -0.3, 0.5, -0.9].map(strength)).toEqual(["none", "weak", "moderate", "strong"]);
        });

        it("says in words what it could not read", () => {
          expect(() => readAnswer(JSON.stringify({ error: "the readings could not be read: x" }))).toThrow("the readings could not be read");
        });
      });

      /** A worker that answers as the given function says, so the page's side of the messages is tested. */
      class FakeWorker {
        static last: FakeWorker | null = null;
        static answer: (worker: FakeWorker, id: number) => void = () => undefined;
        onmessage: ((event: { data: unknown }) => void) | null = null;
        onerror: (() => void) | null = null;
        constructor() {
          FakeWorker.last = this;
        }
        postMessage(message: { id: number }): void {
          queueMicrotask(() => FakeWorker.answer(this, message.id));
        }
      }

      describe("the analysis off the page's thread", () => {
        afterEach(() => {
          vi.unstubAllGlobals();
        });

        it("hands each answer to its own question, an error in its words, and ignores a stray one", async () => {
          vi.stubGlobal("Worker", FakeWorker);
          const result = { hours: [], air: [], weather: [], pairs: [] };
          FakeWorker.answer = (worker, id) => {
            worker.onmessage?.({ data: { id: id + 1000, result } });
            worker.onmessage?.({ data: { id, result } });
          };
          await expect(computeAnalysis({ air: {}, weather: {}, settings: {} })).resolves.toEqual(result);
          FakeWorker.answer = (worker, id) => worker.onmessage?.({ data: { id, error: "the readings could not be read: x" } });
          await expect(computeAnalysis({ air: {}, weather: {}, settings: {} })).rejects.toThrow("the readings could not be read: x");
          FakeWorker.answer = (worker, id) => worker.onmessage?.({ data: { id } });
          await expect(computeAnalysis({ air: {}, weather: {}, settings: {} })).rejects.toThrow("The analysis did not answer.");
        });

        it("says the analysis stopped when the worker dies, and starts a new one for the next question", async () => {
          vi.stubGlobal("Worker", FakeWorker);
          FakeWorker.answer = (worker) => worker.onerror?.();
          const first = FakeWorker.last;
          await expect(computeAnalysis({ air: {}, weather: {}, settings: {} })).rejects.toThrow("The analysis stopped. Reload the page.");
          FakeWorker.answer = (worker, id) => worker.onmessage?.({ data: { id, result: { hours: [1], air: [], weather: [], pairs: [] } } });
          await expect(computeAnalysis({ air: {}, weather: {}, settings: {} })).resolves.toMatchObject({ hours: [1] });
          expect(FakeWorker.last).not.toBe(first);
        });
      });
    src__analysis.ts: |
      import init, { analyse } from "../wasm/pkg/air_weather_explorer.js";

      export interface Series {
        name: string;
        hourly: Array<number | null>;
        smooth: Array<number | null>;
        outliers: number[];
      }

      export interface Pair {
        air: string;
        weather: string;
        n: number;
        pearson: number | null;
        spearman: number | null;
      }

      export interface Analysis {
        hours: number[];
        air: Series[];
        weather: Series[];
        pairs: Pair[];
      }

      export interface AnalysisInput {
        air: Record<string, Array<[number, number]>>;
        weather: Record<string, Array<[number, number]>>;
        settings: { window?: number; threshold?: number };
      }

      /** What the module answers: the analysis, or the sentence of what it could not read. */
      export function readAnswer(answer: string): Analysis {
        const parsed = JSON.parse(answer) as Analysis | { error: string };
        if ("error" in parsed) throw new Error(parsed.error);
        return parsed;
      }

      /** Runs in the worker, and in the page where there is no worker (a test, an old browser). */
      export async function analyseHere(input: AnalysisInput): Promise<Analysis> {
        await init();
        return readAnswer(analyse(JSON.stringify(input)));
      }

      let worker: Worker | null = null;
      let next = 0;
      const waiting = new Map<number, { resolve: (result: Analysis) => void; reject: (error: Error) => void }>();

      function theWorker(): Worker {
        if (worker) return worker;
        worker = new Worker(new URL("./analysis.worker.ts", import.meta.url), { type: "module" });
        worker.onmessage = (event: MessageEvent<{ id: number; result?: Analysis; error?: string }>) => {
          const entry = waiting.get(event.data.id);
          if (!entry) return;
          waiting.delete(event.data.id);
          if (event.data.result) entry.resolve(event.data.result);
          else entry.reject(new Error(event.data.error ?? "The analysis did not answer."));
        };
        worker.onerror = () => {
          for (const entry of waiting.values()) entry.reject(new Error("The analysis stopped. Reload the page."));
          waiting.clear();
          worker = null;
        };
        return worker;
      }

      /** The analysis, computed off the page's thread so the screen never stalls while it runs. */
      export function computeAnalysis(input: AnalysisInput): Promise<Analysis> {
        if (typeof Worker === "undefined") return analyseHere(input);
        const id = (next += 1);
        return new Promise<Analysis>((resolve, reject) => {
          waiting.set(id, { resolve, reject });
          theWorker().postMessage({ id, input });
        });
      }

      /** The pair to show first: the strongest Spearman correlation over enough hours; `null` for none. */
      export function strongest(pairs: Pair[]): Pair | null {
        let best: Pair | null = null;
        for (const pair of pairs) {
          if (pair.spearman === null) continue;
          if (!best || Math.abs(pair.spearman) > Math.abs(best.spearman ?? 0)) best = pair;
        }
        return best;
      }

      /** How strong a correlation is, in the page's words: under 0.2 it says nothing. */
      export function strength(rho: number): "none" | "weak" | "moderate" | "strong" {
        const size = Math.abs(rho);
        return size < 0.2 ? "none" : size < 0.4 ? "weak" : size < 0.7 ? "moderate" : "strong";
      }
    src__analysis.worker.ts: |
      /// <reference lib="webworker" />
      import { analyseHere } from "./analysis";
      import type { AnalysisInput } from "./analysis";

      // The WebAssembly statistics, off the page's thread (T-3330): one message in, one result or one error out.
      self.onmessage = async (event: MessageEvent<{ id: number; input: AnalysisInput }>) => {
        const { id, input } = event.data;
        try {
          self.postMessage({ id, result: await analyseHere(input) });
        } catch (error) {
          self.postMessage({ id, error: error instanceof Error ? error.message : String(error) });
        }
      };
