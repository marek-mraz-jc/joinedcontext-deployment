    src__assets.rs: |
      //! The React build, embedded in the binary so the image is one artifact (AP-25).

      use std::sync::Arc;

      use axum::body::Body;
      use axum::extract::State;
      use axum::http::{header, StatusCode, Uri};
      use axum::response::{IntoResponse, Response};
      use rust_embed::RustEmbed;

      use crate::{App, Config};

      #[derive(RustEmbed)]
      #[folder = "ui/dist"]
      pub struct Assets;

      /// Shown when the binary was built without a UI bundle, so the reason is on the page instead
      /// of in a log nobody reads.
      pub const PLACEHOLDER_HTML: &str = r#"<!doctype html>
      <html lang="en">
      <head><meta charset="utf-8" /><title>HSL live</title></head>
      <body><p>UI bundle not built. Run <code>pnpm build</code> in <code>ui/</code>.</p></body>
      </html>
      "#;

      pub async fn static_handler(State(app): State<Arc<App>>, uri: Uri) -> Response {
          let base = app.config.base_path.trim_end_matches('/');
          let path = uri
              .path()
              .strip_prefix(base)
              .unwrap_or(uri.path())
              .trim_start_matches('/');
          if path.is_empty() || path == "index.html" {
              return index(&app.config);
          }
          let Some(file) = Assets::get(path) else {
              // Anything with an extension is a real miss; everything else is a client route.
              return if path.rsplit('/').next().unwrap_or(path).contains('.') {
                  StatusCode::NOT_FOUND.into_response()
              } else {
                  index(&app.config)
              };
          };
          let mime = mime_guess::from_path(path).first_or_octet_stream();
          let cache = if path.starts_with("assets/") {
              "public, max-age=31536000, immutable"
          } else {
              "no-cache"
          };
          (
              [
                  (header::CONTENT_TYPE, mime.as_ref()),
                  (header::CACHE_CONTROL, cache),
              ],
              Body::from(file.data),
          )
              .into_response()
      }

      /// The front page, with the reconciler's `#jc-config` first in its head when it was handed one
      /// (AP-67, AP-126).
      fn index(config: &Config) -> Response {
          let html = Assets::get("index.html")
              .map(|file| String::from_utf8_lossy(&file.data).into_owned())
              .unwrap_or_else(|| PLACEHOLDER_HTML.to_owned());
          let body = match &config.page_config {
              Some(json) => with_config(&html, json),
              None => html,
          };
          (
              [
                  (header::CONTENT_TYPE, "text/html; charset=utf-8"),
                  (header::CACHE_CONTROL, "no-cache"),
              ],
              Body::from(body),
          )
              .into_response()
      }

      /// `html` with `<script id="jc-config">` holding `json` right after `<head>`, where the page's
      /// scripts find it before they run.
      fn with_config(html: &str, json: &str) -> String {
          let element = format!(r#"<script id="jc-config" type="application/json">{json}</script>"#);
          let at = html
              .to_ascii_lowercase()
              .find("<head>")
              .map_or(0, |at| at + "<head>".len());
          format!("{}{element}{}", &html[..at], &html[at..])
      }
    src__board.rs: |
      //! The departures and service alerts beside the map (T-3895).
      //!
      //! Read from the same Endpoint as the fleet, every [`BOARD_SECONDS`], in the simplified
      //! representation: the stops that carry departures (T-3891, a curated set of about 230), the
      //! headsign of each line and direction from PublicTransportRoute, HSL's service alerts (T-3892) and the
      //! stops those alerts name, so the map can place them. A read that fails keeps the last board,
      //! as a failed fleet poll keeps the last positions.

      use std::collections::{BTreeMap, BTreeSet};

      use serde::Serialize;
      use serde_json::Value;

      use crate::PollError;

      /// How often the board is read. Departures change every 30 s upstream (T-3891).
      pub const BOARD_SECONDS: u64 = 30;
      /// A page of the Endpoint; the board pages on until a short one.
      const PAGE: usize = 1000;
      /// The pages read at most per type: a runaway answer stops here rather than looping.
      const PAGES: usize = 5;
      /// Ids per lookup of the stops alerts name, so the query string stays short.
      const IDS_PER_ASK: usize = 50;
      /// `(line, GTFS direction 0 or 1)` to the headsign.
      pub type Headsigns = BTreeMap<(String, u8), String>;

      /// The alerts this app shows are HSL's; the space also holds Digitraffic's road alerts.
      pub const HSL_ALERTS: &str = "https://realtime.hsl.fi/realtime/service-alerts/v2/hsl";

      #[derive(Clone, Debug, Default, PartialEq, Serialize)]
      pub struct Board {
          pub departures: Vec<StopBoard>,
          pub alerts: Vec<AlertView>,
      }

      /// One stop and its next departures, soonest first.
      #[derive(Clone, Debug, PartialEq, Serialize)]
      pub struct StopBoard {
          pub id: String,
          pub name: String,
          #[serde(skip_serializing_if = "Option::is_none")]
          pub coordinates: Option<[f64; 2]>,
          pub departures: Vec<Departure>,
      }

      #[derive(Clone, Debug, PartialEq, Serialize)]
      pub struct Departure {
          /// The line as GTFS names it (`2550`, `1009`, `31M1`).
          pub line: String,
          #[serde(skip_serializing_if = "Option::is_none")]
          pub headsign: Option<String>,
          pub expected: String,
          /// scheduled, skipped or canceled.
          pub status: String,
          #[serde(skip_serializing_if = "Option::is_none")]
          pub delay: Option<i64>,
      }

      /// One HSL service alert, its text as HSL wrote it: the browser renders it as text, never HTML.
      #[derive(Clone, Debug, PartialEq, Serialize)]
      pub struct AlertView {
          pub id: String,
          pub title: String,
          #[serde(skip_serializing_if = "String::is_empty")]
          pub body: String,
          #[serde(skip_serializing_if = "Option::is_none")]
          pub severity: Option<String>,
          #[serde(rename = "validFrom", skip_serializing_if = "Option::is_none")]
          pub valid_from: Option<String>,
          #[serde(rename = "validTo", skip_serializing_if = "Option::is_none")]
          pub valid_to: Option<String>,
          /// The lines it affects, linked or kept as text (`unknownReference`).
          pub lines: Vec<String>,
          /// The stops it affects, by GTFS stop id.
          pub stops: Vec<String>,
          /// Where those stops are, for the ones the space holds.
          pub places: Vec<Place>,
      }

      #[derive(Clone, Debug, PartialEq, Serialize)]
      pub struct Place {
          pub stop: String,
          pub coordinates: [f64; 2],
      }

      /// Reads the Endpoint once per call. `headsigns` is the cache the caller keeps between reads.
      pub async fn read(
          http: &reqwest::Client,
          endpoint: &str,
          headsigns: &mut Headsigns,
      ) -> Result<Board, PollError> {
          if headsigns.is_empty() {
              *headsigns = headsigns_of(
                  &list(
                      http,
                      endpoint,
                      "PublicTransportRoute",
                      "route,directionId,headsign",
                      &[],
                  )
                  .await?,
              );
          }
          let stops = list(
              http,
              endpoint,
              "GtfsStop",
              "name,location,departures",
              &[("q", "departures")],
          )
          .await?;
          let alerts = alerts(
              &list(
                  http,
                  endpoint,
                  "Alert",
                  "name,description,severity,validFrom,validTo,refRoute,refStop,unknownReference,source",
                  &[],
              )
              .await?,
          );
          let named: BTreeSet<String> = alerts.iter().flat_map(stop_urns).collect();
          let mut places = BTreeMap::new();
          let named: Vec<String> = named.into_iter().collect();
          for ids in named.chunks(IDS_PER_ASK) {
              for stop in list(
                  http,
                  endpoint,
                  "GtfsStop",
                  "location",
                  &[("id", &ids.join(","))],
              )
              .await?
              {
                  if let (Some(id), Some(at)) = (stop.get("id").and_then(Value::as_str), point(&stop)) {
                      places.insert(id.to_owned(), at);
                  }
              }
          }
          Ok(Board {
              departures: boards(&stops, headsigns),
              alerts: alerts
                  .into_iter()
                  .map(|alert| alert.placed(&places))
                  .collect(),
          })
      }

      /// Every entity of `kind`, simplified, page by page.
      async fn list(
          http: &reqwest::Client,
          endpoint: &str,
          kind: &str,
          attrs: &str,
          extra: &[(&str, &str)],
      ) -> Result<Vec<Value>, PollError> {
          let mut all = Vec::new();
          for page in 0..PAGES {
              let offset = (page * PAGE).to_string();
              let limit = PAGE.to_string();
              let response = http
                  .get(format!("{endpoint}ngsi-ld/v1/entities"))
                  .query(&[
                      ("type", kind),
                      ("attrs", attrs),
                      ("options", "keyValues"),
                      ("limit", &limit),
                      ("offset", &offset),
                  ])
                  .query(extra)
                  .header(axum::http::header::ACCEPT, "application/json")
                  .send()
                  .await
                  .map_err(|_| PollError::Unreachable)?;
              if !response.status().is_success() {
                  return Err(PollError::Refused(response.status().as_u16()));
              }
              let body: Value = response.json().await.map_err(|_| PollError::Unreadable)?;
              let entities = body.as_array().ok_or(PollError::Unreadable)?;
              all.extend(entities.iter().cloned());
              if entities.len() < PAGE {
                  break;
              }
          }
          Ok(all)
      }

      /// `(line, GTFS direction 0 or 1)` to the headsign. PublicTransportRoute counts directions from 1, as
      /// HSL does; GTFS-RT from 0.
      pub fn headsigns_of(routes: &[Value]) -> Headsigns {
          routes
              .iter()
              .filter_map(|route| {
                  let line = text(route.get("route")?)?;
                  let direction = match route.get("directionId")? {
                      Value::Number(n) => n.as_u64()?,
                      Value::String(s) => s.parse().ok()?,
                      _ => return None,
                  };
                  let headsign = text(route.get("headsign")?)?;
                  (1..=2)
                      .contains(&direction)
                      .then(|| ((line, (direction - 1) as u8), headsign))
              })
              .collect()
      }

      /// The stops with at least one departure, by name.
      pub fn boards(stops: &[Value], headsigns: &Headsigns) -> Vec<StopBoard> {
          let mut boards: Vec<StopBoard> = stops
              .iter()
              .filter_map(|stop| {
                  let departures: Vec<Departure> = stop
                      .get("departures")?
                      .as_array()?
                      .iter()
                      .filter_map(|departure| {
                          let line = departure.get("routeId")?.as_str()?.to_owned();
                          let direction = departure.get("directionId").and_then(Value::as_u64);
                          Some(Departure {
                              headsign: direction
                                  .and_then(|d| headsigns.get(&(line.clone(), d as u8)).cloned()),
                              expected: departure.get("expected")?.as_str()?.to_owned(),
                              status: departure
                                  .get("status")
                                  .and_then(Value::as_str)
                                  .unwrap_or("scheduled")
                                  .to_owned(),
                              delay: departure.get("delay").and_then(Value::as_i64),
                              line,
                          })
                      })
                      .collect();
                  if departures.is_empty() {
                      return None;
                  }
                  let id = stop.get("id")?.as_str()?.to_owned();
                  Some(StopBoard {
                      name: stop
                          .get("name")
                          .and_then(text)
                          .unwrap_or_else(|| last(&id).to_owned()),
                      coordinates: point(stop),
                      departures,
                      id,
                  })
              })
              .collect();
          boards.sort_by(|a, b| a.name.cmp(&b.name).then_with(|| a.id.cmp(&b.id)));
          boards
      }

      /// HSL's alerts, most severe first, then by id; an alert from any other source is left out.
      pub fn alerts(entities: &[Value]) -> Vec<AlertView> {
          let rank = |severity: &Option<String>| match severity.as_deref() {
              Some("high") => 0,
              Some("medium") => 1,
              Some("informational") => 2,
              _ => 3,
          };
          let mut alerts: Vec<AlertView> = entities
              .iter()
              .filter(|alert| alert.get("source").and_then(text).as_deref() == Some(HSL_ALERTS))
              .filter_map(|alert| {
                  let unknown: Vec<String> = alert
                      .get("unknownReference")
                      .map(objects)
                      .unwrap_or_default();
                  let named = |slot: &str, prefix: &str| -> Vec<String> {
                      let mut ids: Vec<String> = alert
                          .get(slot)
                          .map(objects)
                          .unwrap_or_default()
                          .iter()
                          .map(|urn| last(urn).to_owned())
                          .collect();
                      ids.extend(
                          unknown
                              .iter()
                              .filter_map(|text| text.strip_prefix(prefix))
                              .map(str::to_owned),
                      );
                      ids.sort();
                      ids.dedup();
                      ids
                  };
                  Some(AlertView {
                      id: alert.get("id")?.as_str()?.to_owned(),
                      title: alert.get("name").and_then(text).unwrap_or_default(),
                      body: alert.get("description").and_then(text).unwrap_or_default(),
                      severity: alert.get("severity").and_then(text),
                      valid_from: alert.get("validFrom").and_then(text),
                      valid_to: alert.get("validTo").and_then(text),
                      lines: named("refRoute", "route:"),
                      stops: named("refStop", "stop:"),
                      places: Vec::new(),
                  })
              })
              .collect();
          alerts.sort_by(|a, b| {
              rank(&a.severity)
                  .cmp(&rank(&b.severity))
                  .then_with(|| a.id.cmp(&b.id))
          });
          alerts
      }

      impl AlertView {
          fn placed(mut self, places: &BTreeMap<String, [f64; 2]>) -> Self {
              self.places = places
                  .iter()
                  .filter(|(urn, _)| self.stops.iter().any(|stop| stop == last(urn)))
                  .map(|(urn, at)| Place {
                      stop: last(urn).to_owned(),
                      coordinates: *at,
                  })
                  .collect();
              self
          }
      }

      /// The GtfsStop URNs of the stops an alert links: same space and domain as the alert itself.
      fn stop_urns(alert: &AlertView) -> Vec<String> {
          let Some((prefix, _)) = alert.id.rsplit_once(':') else {
              return Vec::new();
          };
          let space = prefix.trim_start_matches("urn:ngsi-ld:Alert:");
          alert
              .stops
              .iter()
              .map(|stop| format!("urn:ngsi-ld:GtfsStop:{space}:{stop}"))
              .collect()
      }

      /// A Relationship's object, one or many, in the simplified representation; or a Property's list.
      fn objects(value: &Value) -> Vec<String> {
          match value {
              Value::String(one) => vec![one.clone()],
              Value::Array(many) => many
                  .iter()
                  .filter_map(Value::as_str)
                  .map(str::to_owned)
                  .collect(),
              Value::Object(fields) => fields
                  .get("object")
                  .or_else(|| fields.get("value"))
                  .map(objects)
                  .unwrap_or_default(),
              _ => Vec::new(),
          }
      }

      /// A text, from a plain value or a language map (English first, then Finnish, then Swedish).
      fn text(value: &Value) -> Option<String> {
          let found = match value {
              Value::String(text) => Some(text.as_str()),
              Value::Object(map) => ["en", "fi", "sv"]
                  .iter()
                  .find_map(|language| map.get(*language).and_then(Value::as_str))
                  .or_else(|| map.get("value").and_then(Value::as_str))
                  .or_else(|| map.values().find_map(Value::as_str)),
              _ => None,
          }?;
          let found = found.trim();
          (!found.is_empty()).then(|| found.to_owned())
      }

      fn point(entity: &Value) -> Option<[f64; 2]> {
          let location = entity.get("location")?;
          let location = location.get("value").unwrap_or(location);
          if location.get("type")?.as_str()? != "Point" {
              return None;
          }
          let coordinates = location.get("coordinates")?.as_array()?;
          Some([
              coordinates.first()?.as_f64()?,
              coordinates.get(1)?.as_f64()?,
          ])
      }

      fn last(urn: &str) -> &str {
          urn.rsplit(':').next().unwrap_or(urn)
      }
    src__lib.rs: |
      //! The `hsl-transport` reference app (AP-34, AP-37, AP-38, AP-41).
      //!
      //! It shows the vehicles of one Context Space on a map and keeps them moving: the HFP fleet of
      //! four bus trunk lines and every tram, metro, train and ferry, capped per mode upstream
      //! (T-3893), with the departures of the curated stops and HSL's service alerts beside it
      //! ([`board`], T-3895). Everything it
      //! serves comes from a single Endpoint whose URL it is handed at run time; it opens no other
      //! connection, holds no credential and contains no authorization logic. The Endpoint it is
      //! bound to is public, so the app never sees a user and asks nobody to sign in (AP-28).
      //!
      //! The fleet comes from the Endpoint's WebSocket ([`live`], API/07): one socket for the
      //! process, the last known position of each bus in memory, and what moved pushed to every
      //! connected browser as Server-Sent Events. A hundred open maps are still one socket, and the
      //! browser never learns the Endpoint URL.

      use std::collections::BTreeMap;
      use std::convert::Infallible;
      use std::sync::{Arc, RwLock};
      use std::time::Duration;

      use axum::extract::State;
      use axum::http::StatusCode;
      use axum::response::sse::{Event, KeepAlive, Sse};
      use axum::response::{IntoResponse, Response};
      use axum::routing::get;
      use axum::{Json, Router};
      use serde::Serialize;
      use serde_json::{json, Value};
      use tokio_stream::{Stream, StreamExt};

      pub mod assets;
      pub mod board;
      pub mod live;
      pub mod metrics;

      /// The entity type this app was built for; it is also what the grant names.
      const TYPE: &str = "Vehicle";
      /// The fleet the demo runs, and the cap the Endpoint is asked for (AP-38): the sum of the
      /// pipeline's per-mode caps, 30 buses, 30 trams, 10 metros, 15 trains and 5 ferries (T-3893).
      const FLEET: usize = 90;
      /// The headsigns are read again after this many board reads (an hour at 30 s): lines change
      /// with the timetable, not by the minute.
      const HEADSIGN_READS: u64 = 120;
      /// A slow browser must not hold the socket back, so the channel drops the oldest batch
      /// instead of blocking. A viewer that falls this far behind still has the fleet route.
      const BROADCAST_DEPTH: usize = 16;

      /// What the reconciler hands the container (Architecture/16 §5).
      #[derive(Clone, Debug)]
      pub struct Config {
          /// `/apps/{name}/`, the path the app is served under.
          pub base_path: String,
          /// `https://{host}/api/endpoint/{slug}/`, the only data surface it may call (AP-04).
          pub endpoint_url: String,
          /// `JC_APP_CONFIG`, the `#jc-config` object the reconciler hands a pod App (endpoints, and the
          /// project's `basemap` style URL when one is configured, AP-67), already escaped for the
          /// `<script>` element the page carries it in. `None`: the page is served as built.
          pub page_config: Option<String>,
      }

      impl Config {
          /// Reads the variables of Architecture/16 §5. A missing endpoint URL is fatal: an app
          /// with nowhere to read from has nothing to serve, and guessing a default would be
          /// guessing which data a user gets.
          pub fn from_env() -> Result<Self, String> {
              let endpoint_url = std::env::var("JC_ENDPOINT_URL")
                  .map_err(|_| "JC_ENDPOINT_URL is not set".to_owned())?;
              Ok(Self {
                  base_path: std::env::var("JC_BASE_PATH").unwrap_or_else(|_| "/".to_owned()),
                  endpoint_url: with_trailing_slash(&endpoint_url),
                  page_config: match std::env::var("JC_APP_CONFIG") {
                      Ok(raw) if !raw.trim().is_empty() => Some(page_config(&raw)?),
                      _ => None,
                  },
              })
          }
      }

      /// `JC_APP_CONFIG` as the body of a `<script type="application/json">`: a JSON object, or the
      /// app does not start. `<`, `>` and `&` only occur inside JSON strings, where their `\u` escapes
      /// read the same, so no value can close the element early.
      pub fn page_config(raw: &str) -> Result<String, String> {
          let value: Value =
              serde_json::from_str(raw).map_err(|err| format!("JC_APP_CONFIG is not JSON: {err}"))?;
          if !value.is_object() {
              return Err("JC_APP_CONFIG is not a JSON object".to_owned());
          }
          Ok(value
              .to_string()
              .replace('<', "\\u003c")
              .replace('>', "\\u003e")
              .replace('&', "\\u0026"))
      }

      fn with_trailing_slash(url: &str) -> String {
          if url.ends_with('/') {
              url.to_owned()
          } else {
              format!("{url}/")
          }
      }

      /// One bus, as the browser draws it. Every field but the position is optional because a
      /// Policy may hide an attribute, and a hidden attribute is absent rather than defaulted.
      #[derive(Clone, Debug, PartialEq, Serialize)]
      pub struct Vehicle {
          pub id: String,
          /// `[longitude, latitude]`, the GeoJSON order.
          pub coordinates: [f64; 2],
          #[serde(skip_serializing_if = "Option::is_none")]
          pub bearing: Option<f64>,
          #[serde(skip_serializing_if = "Option::is_none")]
          pub speed: Option<f64>,
          #[serde(rename = "refLine", skip_serializing_if = "Option::is_none")]
          pub ref_line: Option<String>,
          /// bus, tram, metro, train or ferry (`transportMode`).
          #[serde(skip_serializing_if = "Option::is_none")]
          pub mode: Option<String>,
      }

      /// The application state: its configuration, the one client it makes requests with, the last
      /// known fleet, the channel every open map listens on and since when the live feed is lost.
      pub struct App {
          pub config: Config,
          http: reqwest::Client,
          fleet: RwLock<BTreeMap<String, Vehicle>>,
          changes: tokio::sync::broadcast::Sender<Vec<Vehicle>>,
          /// `Some(time)` while the socket is down or the map may have missed a move; `None` live.
          /// Before the first socket the feed is lost since the start.
          feed: tokio::sync::watch::Sender<Option<String>>,
          pub metrics: metrics::Metrics,
          board: RwLock<Option<board::Board>>,
          headsigns: tokio::sync::Mutex<(u64, board::Headsigns)>,
      }

      impl App {
          pub fn new(config: Config) -> Self {
              Self {
                  config,
                  http: reqwest::Client::new(),
                  fleet: RwLock::new(BTreeMap::new()),
                  changes: tokio::sync::broadcast::channel(BROADCAST_DEPTH).0,
                  feed: tokio::sync::watch::channel(Some(
                      chrono::Utc::now().to_rfc3339_opts(chrono::SecondsFormat::Secs, true),
                  ))
                  .0,
                  metrics: metrics::Metrics::default(),
                  board: RwLock::new(None),
                  headsigns: tokio::sync::Mutex::new((0, BTreeMap::new())),
              }
          }

          /// The departures and alerts as the last board read left them; `None` before the first.
          pub fn board(&self) -> Option<board::Board> {
              self.board.read().ok().and_then(|board| board.clone())
          }

          /// One read of the departures and alerts. A failed read keeps the last board.
          pub async fn poll_board(&self) -> Result<board::Board, PollError> {
              let mut headsigns = self.headsigns.lock().await;
              let (reads, cache) = &mut *headsigns;
              if reads.is_multiple_of(HEADSIGN_READS) {
                  cache.clear();
              }
              *reads += 1;
              let read = board::read(&self.http, &self.config.endpoint_url, cache).await?;
              if let Ok(mut board) = self.board.write() {
                  *board = Some(read.clone());
              }
              Ok(read)
          }

          /// The fleet as it stands, ordered by id so two viewers see the same list.
          pub fn snapshot(&self) -> Vec<Vehicle> {
              self.fleet
                  .read()
                  .map(|fleet| fleet.values().cloned().collect())
                  .unwrap_or_default()
          }

          /// Since when the live feed is lost; `None` while it is live.
          pub fn feed_lost_since(&self) -> Option<String> {
              self.feed.borrow().clone()
          }

          /// One full read of the Endpoint: read the fleet, keep what moved, tell the browsers. The
          /// socket asks for it when the stream alone cannot be trusted to be complete.
          ///
          /// Returns the buses that changed, which is what the tests assert on and what goes out
          /// over SSE. A bus that has not moved since the last read is not sent again.
          pub async fn reload(&self) -> Result<Vec<Vehicle>, PollError> {
              let fetched = self.fetch().await?;
              let mut changed = Vec::new();
              {
                  let mut fleet = self.fleet.write().map_err(|_| PollError::Unreachable)?;
                  for vehicle in fetched {
                      if fleet.get(&vehicle.id) != Some(&vehicle) {
                          fleet.insert(vehicle.id.clone(), vehicle.clone());
                          changed.push(vehicle);
                      }
                  }
              }
              if !changed.is_empty() {
                  // An error here means nobody is watching, which is not a failure.
                  let _ = self.changes.send(changed.clone());
              }
              Ok(changed)
          }

          /// The departures and alerts, read every [`board::BOARD_SECONDS`]: timetables, not
          /// positions, so they are not on the socket.
          pub async fn read_board(self: Arc<Self>) {
              loop {
                  if let Err(error) = self.poll_board().await {
                      tracing::warn!(%error, "board read failed, keeping the last departures and alerts");
                  }
                  tokio::time::sleep(Duration::from_secs(board::BOARD_SECONDS)).await;
              }
          }

          /// The Endpoint's GeoJSON representation of the fleet (EP-05), capped at the fleet size.
          ///
          /// Anonymous on purpose: the Endpoint is public, one reader serves every viewer, and a
          /// per-viewer token could not be used for a shared read anyway (AP-28).
          async fn fetch(&self) -> Result<Vec<Vehicle>, PollError> {
              let response = self
                  .http
                  .get(format!("{}ngsi-ld/v1/entities", self.config.endpoint_url))
                  .query(&[("type", TYPE), ("limit", &FLEET.to_string())])
                  .header(axum::http::header::ACCEPT, "application/geo+json")
                  .send()
                  .await
                  .map_err(|_| PollError::Unreachable)?;
              if !response.status().is_success() {
                  return Err(PollError::Refused(response.status().as_u16()));
              }
              let body: Value = response.json().await.map_err(|_| PollError::Unreadable)?;
              Ok(vehicles(&body))
          }
      }

      /// Why a poll did not produce a fleet. None of it reaches the browser: the map keeps the last
      /// known positions and the reason goes to the log.
      #[derive(Debug, Clone, Copy, PartialEq, Eq)]
      pub enum PollError {
          /// The Endpoint could not be reached.
          Unreachable,
          /// The Endpoint answered with a status that is not a fleet.
          Refused(u16),
          /// The Endpoint answered with something that is not GeoJSON.
          Unreadable,
      }

      impl std::fmt::Display for PollError {
          fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
              match self {
                  Self::Unreachable => write!(f, "the endpoint did not answer"),
                  Self::Refused(status) => write!(f, "the endpoint answered {status}"),
                  Self::Unreadable => write!(f, "the endpoint's answer is not GeoJSON"),
              }
          }
      }

      /// The buses of one GeoJSON `FeatureCollection`.
      ///
      /// A feature with no point geometry is dropped rather than defaulted to a coordinate: a bus
      /// the map cannot place is a bus the map must not draw somewhere wrong.
      pub fn vehicles(collection: &Value) -> Vec<Vehicle> {
          let features = collection
              .get("features")
              .and_then(Value::as_array)
              .map(Vec::as_slice)
              .unwrap_or_default();
          features.iter().filter_map(vehicle).take(FLEET).collect()
      }

      fn vehicle(feature: &Value) -> Option<Vehicle> {
          let geometry = feature.get("geometry")?;
          if geometry.get("type").and_then(Value::as_str) != Some("Point") {
              return None;
          }
          let coordinates = geometry.get("coordinates")?.as_array()?;
          let [longitude, latitude] = [
              coordinates.first()?.as_f64()?,
              coordinates.get(1)?.as_f64()?,
          ];
          // NGSI-LD GeoJSON keeps the entity id at the top level and the attributes in `properties`.
          let properties = feature.get("properties");
          let id = feature
              .get("id")
              .or_else(|| properties.and_then(|properties| properties.get("id")))?
              .as_str()?
              .to_owned();
          let number = |name: &str| properties?.get(name).and_then(simple_value)?.as_f64();
          let text = |name: &str| {
              properties?
                  .get(name)
                  .and_then(simple_value)?
                  .as_str()
                  .map(str::to_owned)
          };
          Some(Vehicle {
              id,
              coordinates: [longitude, latitude],
              // The `helsinki` model names them `heading` and `route` (HFP's `hdg` and `route`); the
              // browser keeps the names it always had.
              bearing: number("heading"),
              speed: number("speed"),
              ref_line: text("route"),
              mode: text("transportMode"),
          })
      }

      /// An attribute is a bare value in the simplified representation and `{"value": …}` in the
      /// normalized one; the Endpoint may serve either, so both are read.
      pub(crate) fn simple_value(attribute: &Value) -> Option<&Value> {
          match attribute {
              Value::Object(fields) => fields.get("value"),
              other => Some(other),
          }
      }

      /// The app's routes under its own base path, with the embedded UI behind them.
      ///
      /// The prefix is spelled into every route rather than nested. `Router::nest` does not match
      /// the prefix with a trailing slash, and `https://{host}/apps/hsl-transport/` with that slash
      /// is exactly what a browser follows from the Portal, so nesting would 404 the front page.
      pub fn router(app: Arc<App>) -> Router {
          let base = app.config.base_path.trim_end_matches('/').to_owned();
          let at = |tail: &str| format!("{base}{tail}");
          let router = Router::new()
              // The readiness probe of the pod, at the root and outside the base path
              // (Architecture/16 §5).
              .route("/healthz", get(|| async { "ok" }))
              .route(&at("/api/vehicles"), get(fleet))
              .route(&at("/api/stream"), get(stream))
              .route(&at("/metrics"), get(metrics_text))
              .route(&at("/api/departures"), get(departures))
              .route(&at("/api/alerts"), get(alerts))
              // Both spellings of the front page: the edge routes the prefix, and a person who
              // types it without the slash is not a different visitor.
              .route(&at("/"), get(assets::static_handler))
              .route(&at("/{*path}"), get(assets::static_handler));
          // On its own host the base is `/` (AP-133), which `at("/")` already serves; axum refuses
          // an empty path, and the pod crashed at start on dev with it (T-2909).
          if base.is_empty() {
              router.with_state(app)
          } else {
              router
                  .route(&base, get(assets::static_handler))
                  .with_state(app)
          }
      }

      /// The answer before the first read: not the same as nothing to show.
      fn not_yet(what: &str) -> Response {
          (
              StatusCode::SERVICE_UNAVAILABLE,
              [(axum::http::header::CONTENT_TYPE, "application/problem+json")],
              json!({
                  "type": "https://joinedcontext.com/errors/app",
                  "title": "Service Unavailable",
                  "status": 503,
                  "detail": format!("the first read of the endpoint has not produced {what} yet"),
              })
              .to_string(),
          )
              .into_response()
      }

      /// The stops with departures, by name, each with its next departures.
      async fn departures(State(app): State<Arc<App>>) -> Response {
          match app.board() {
              Some(board) => Json(board.departures).into_response(),
              None => not_yet("departures"),
          }
      }

      /// HSL's service alerts, most severe first.
      async fn alerts(State(app): State<Arc<App>>) -> Response {
          match app.board() {
              Some(board) => Json(board.alerts).into_response(),
              None => not_yet("alerts"),
          }
      }

      /// The fleet as the app last saw it. A map that has just loaded draws from this, so it is not
      /// blank until the first bus moves.
      async fn fleet(State(app): State<Arc<App>>) -> Response {
          let fleet = app.snapshot();
          if fleet.is_empty() {
              // Nothing polled yet is not the same as an empty fleet, and a map should say so.
              return (
                  StatusCode::SERVICE_UNAVAILABLE,
                  [(axum::http::header::CONTENT_TYPE, "application/problem+json")],
                  json!({
                      "type": "https://joinedcontext.com/errors/app",
                      "title": "Service Unavailable",
                      "status": 503,
                      "detail": "the first poll of the endpoint has not produced a fleet yet",
                  })
                  .to_string(),
              )
                  .into_response();
          }
          Json(fleet).into_response()
      }

      /// The app's counters and the update latency (T-3581).
      async fn metrics_text(State(app): State<Arc<App>>) -> Response {
          (
              [(
                  axum::http::header::CONTENT_TYPE,
                  "text/plain; version=0.0.4",
              )],
              app.metrics.text(app.snapshot().len()),
          )
              .into_response()
      }

      /// Every bus that moves, as Server-Sent Events, and whether the feed is live.
      ///
      /// The first event is the whole fleet, so a browser that connects here alone is drawing
      /// immediately and every later event is a difference. A `feed` event carries
      /// `{"lostSince": time}` while the socket is down and `{"lostSince": null}` once it is live.
      async fn stream(State(app): State<Arc<App>>) -> Sse<impl Stream<Item = Result<Event, Infallible>>> {
          let receiver = app.changes.subscribe();
          let first = tokio_stream::iter([app.snapshot()]);
          let rest = tokio_stream::wrappers::BroadcastStream::new(receiver).filter_map(Result::ok);
          let vehicles = first.chain(rest).map(|vehicles| {
              Event::default()
                  .event("vehicles")
                  .data(serde_json::to_string(&vehicles).unwrap_or_else(|_| "[]".to_owned()))
          });
          let feed = tokio_stream::wrappers::WatchStream::new(app.feed.subscribe()).map(|lost| {
              Event::default()
                  .event("feed")
                  .data(json!({ "lostSince": lost }).to_string())
          });
          Sse::new(vehicles.merge(feed).map(Ok)).keep_alive(KeepAlive::default())
      }
    src__live.rs: |
      //! The fleet from the Endpoint's WebSocket (API/07, EP-106, T-3581).
      //!
      //! One socket for the whole process, however many browsers watch: it opens
      //! `{endpoint}ws` anonymously (the Endpoint is public, AP-28), subscribes to `Vehicle` on
      //! `location`, and each notification moves the buses it names. The socket closes every five
      //! minutes by design (`x-closing: lifetime`); the next one resumes from the last `x-seq`, so
      //! nothing inside the 30-second window is lost. Whenever the stream cannot be trusted to be
      //! complete (a fresh subscription, `x-gap`, a failed resume) the fleet is read once over REST.
      //! While no socket is up, the map says since when the feed is lost.

      use std::sync::Arc;
      use std::time::{Duration, Instant, SystemTime};

      use futures_util::{SinkExt, StreamExt};
      use serde_json::{json, Value};
      use tokio::io::{AsyncRead, AsyncWrite};
      use tokio::net::TcpStream;
      use tokio_rustls::rustls::pki_types::ServerName;
      use tokio_rustls::rustls::{ClientConfig, RootCertStore};
      use tokio_rustls::TlsConnector;
      use tokio_tungstenite::tungstenite::client::IntoClientRequest;
      use tokio_tungstenite::tungstenite::handshake::client::Request;
      use tokio_tungstenite::tungstenite::http::HeaderValue;
      use tokio_tungstenite::tungstenite::Message;
      use tokio_tungstenite::WebSocketStream;

      use crate::{simple_value, App, Vehicle, FLEET, TYPE};

      /// The subprotocol of the Endpoint's socket (API/07 §1).
      const PROTOCOL: &str = "ngsi-ld-ws";
      /// The attributes a notification carries: what the map draws.
      const ATTRIBUTES: [&str; 5] = ["location", "heading", "speed", "route", "transportMode"];
      /// The longest wait between two connection attempts.
      const MAX_BACKOFF: Duration = Duration::from_secs(30);

      /// Where the last socket left off, so the next one resumes instead of starting over.
      #[derive(Clone, Default)]
      struct Resume {
          connection: String,
          token: String,
          seq: u64,
      }

      /// The resume secret stays out of every log line.
      impl std::fmt::Debug for Resume {
          fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
              f.debug_struct("Resume")
                  .field("connection", &self.connection)
                  .field("token", &"[redacted]")
                  .field("seq", &self.seq)
                  .finish()
          }
      }

      /// A plain or TLS stream under the socket.
      trait Io: AsyncRead + AsyncWrite + Unpin + Send {}
      impl<T: AsyncRead + AsyncWrite + Unpin + Send> Io for T {}

      /// Opens the socket: TCP, then for `wss` rustls with the webpki-roots 1.x public roots (the same
      /// roots as the REST client), then the WebSocket upgrade.
      async fn open(request: Request) -> Result<WebSocketStream<Box<dyn Io>>, String> {
          let uri = request.uri();
          let host = uri
              .host()
              .ok_or("the socket URL has no host")?
              .trim_start_matches('[')
              .trim_end_matches(']')
              .to_owned();
          let tls = match uri.scheme_str() {
              Some("wss") => true,
              Some("ws") => false,
              _ => return Err(format!("the socket URL {uri} is not ws:// or wss://")),
          };
          let port = uri.port_u16().unwrap_or(if tls { 443 } else { 80 });
          let tcp = TcpStream::connect((host.as_str(), port))
              .await
              .map_err(|e| format!("connecting to {host}:{port}: {e}"))?;
          let stream: Box<dyn Io> = if tls {
              let name = ServerName::try_from(host).map_err(|e| e.to_string())?;
              let roots = RootCertStore {
                  roots: webpki_roots::TLS_SERVER_ROOTS.to_vec(),
              };
              let config = ClientConfig::builder_with_provider(Arc::new(
                  tokio_rustls::rustls::crypto::ring::default_provider(),
              ))
              .with_safe_default_protocol_versions()
              .map_err(|e| e.to_string())?
              .with_root_certificates(roots)
              .with_no_client_auth();
              let tls = TlsConnector::from(Arc::new(config))
                  .connect(name, tcp)
                  .await
                  .map_err(|e| e.to_string())?;
              Box::new(tls)
          } else {
              Box::new(tcp)
          };
          let (socket, _) = tokio_tungstenite::client_async(request, stream)
              .await
              .map_err(|e| e.to_string())?;
          Ok(socket)
      }

      /// `{endpoint}ws`, with the scheme a WebSocket client speaks.
      pub fn socket_url(endpoint_url: &str) -> String {
          let url = format!("{endpoint_url}ws");
          if let Some(rest) = url.strip_prefix("https://") {
              format!("wss://{rest}")
          } else if let Some(rest) = url.strip_prefix("http://") {
              format!("ws://{rest}")
          } else {
              url
          }
      }

      /// The subscription the socket asks for: every `Vehicle`, told on a move.
      pub fn subscription() -> Value {
          json!({
              "metadata": { "x-op": "x-subscribe", "x-id": "fleet" },
              "body": {
                  "type": "Subscription",
                  "entities": [{ "type": TYPE }],
                  "watchedAttributes": ["location"],
                  "notification": { "attributes": ATTRIBUTES },
              },
          })
      }

      /// One bus from a notification's normalized entity, merged over what the map already holds: an
      /// attribute the notification leaves out keeps its value, and a bus the map has never placed
      /// needs a point. `None` for anything else.
      pub fn vehicle_of(entity: &Value, known: Option<&Vehicle>) -> Option<Vehicle> {
          let id = entity.get("id")?.as_str()?.to_owned();
          let point = entity
              .get("location")
              .and_then(simple_value)
              .and_then(|geometry| {
                  if geometry.get("type")?.as_str()? != "Point" {
                      return None;
                  }
                  let coordinates = geometry.get("coordinates")?.as_array()?;
                  Some([
                      coordinates.first()?.as_f64()?,
                      coordinates.get(1)?.as_f64()?,
                  ])
              });
          let coordinates = point.or_else(|| known.map(|vehicle| vehicle.coordinates))?;
          let number = |name: &str| entity.get(name).and_then(simple_value)?.as_f64();
          let text = |name: &str| {
              entity
                  .get(name)
                  .and_then(simple_value)?
                  .as_str()
                  .map(str::to_owned)
          };
          Some(Vehicle {
              id,
              coordinates,
              bearing: number("heading").or_else(|| known?.bearing),
              speed: number("speed").or_else(|| known?.speed),
              ref_line: text("route").or_else(|| known?.ref_line.clone()),
              mode: text("transportMode").or_else(|| known?.mode.clone()),
          })
      }

      /// The time the bus was at its point, from `location.observedAt`, for the latency (T-3581).
      fn observed_at(entity: &Value) -> Option<SystemTime> {
          let at = entity.get("location")?.get("observedAt")?.as_str()?;
          let parsed = chrono::DateTime::parse_from_rfc3339(at).ok()?;
          let millis = u64::try_from(parsed.timestamp_millis()).ok()?;
          Some(SystemTime::UNIX_EPOCH + Duration::from_millis(millis))
      }

      impl App {
          /// Moves the buses of one notification and tells the browsers what moved.
          pub fn notified(&self, body: &Value) -> Vec<Vehicle> {
              let entities = body
                  .get("data")
                  .and_then(Value::as_array)
                  .map(Vec::as_slice)
                  .unwrap_or_default();
              let now = SystemTime::now();
              let mut changed = Vec::new();
              if let Ok(mut fleet) = self.fleet.write() {
                  for entity in entities {
                      if let Some(at) = observed_at(entity) {
                          if let Ok(late) = now.duration_since(at) {
                              self.metrics.latency(late);
                          }
                      }
                      let id = entity.get("id").and_then(Value::as_str).unwrap_or_default();
                      let known = fleet.get(id);
                      if known.is_none() && fleet.len() >= FLEET {
                          continue;
                      }
                      if let Some(vehicle) = vehicle_of(entity, known) {
                          if known != Some(&vehicle) {
                              fleet.insert(vehicle.id.clone(), vehicle.clone());
                              changed.push(vehicle);
                          }
                      }
                  }
              }
              if !changed.is_empty() {
                  let _ = self.changes.send(changed.clone());
              }
              changed
          }

          /// The socket, for the process: connect, subscribe or resume, follow, and again.
          pub async fn follow(self: Arc<Self>) {
              let url = socket_url(&self.config.endpoint_url);
              let mut resume: Option<Resume> = None;
              let mut backoff = Duration::from_secs(1);
              loop {
                  let opened = Instant::now();
                  match self.session(&url, &mut resume).await {
                      Ok(reason) => tracing::info!(%reason, "the socket closed"),
                      Err(error) => tracing::warn!(%error, "the socket failed"),
                  }
                  self.metrics.reconnect();
                  // A lifetime close is the protocol at work; resuming at once keeps the map live.
                  if resume.is_some() && opened.elapsed() > MAX_BACKOFF {
                      backoff = Duration::from_secs(1);
                      continue;
                  }
                  self.feed_lost();
                  tokio::time::sleep(backoff).await;
                  backoff = (backoff * 2).min(MAX_BACKOFF);
              }
          }

          /// One socket from upgrade to close; `Ok` names why the server closed it.
          async fn session(&self, url: &str, resume: &mut Option<Resume>) -> Result<String, String> {
              let mut request = url.into_client_request().map_err(|e| e.to_string())?;
              request
                  .headers_mut()
                  .insert("sec-websocket-protocol", HeaderValue::from_static(PROTOCOL));
              let mut socket = open(request).await?;
              let mut welcome: Option<Resume> = None;
              while let Some(frame) = socket.next().await {
                  let text = match frame.map_err(|e| e.to_string())? {
                      Message::Text(text) => text,
                      Message::Close(_) => return Ok("closed".to_owned()),
                      _ => continue,
                  };
                  let Ok(message) = serde_json::from_str::<Value>(&text) else {
                      continue;
                  };
                  let metadata = &message["metadata"];
                  let field = |name: &str| metadata[name].as_str().unwrap_or_default().to_owned();
                  match metadata["x-op"].as_str().unwrap_or_default() {
                      "x-welcome" => {
                          welcome = Some(Resume {
                              connection: field("x-connection"),
                              token: field("x-resume-token"),
                              seq: 0,
                          });
                          let first = match resume.take() {
                              Some(previous) => json!({ "metadata": {
                                  "x-op": "x-resume", "x-id": "resume",
                                  "x-connection": previous.connection,
                                  "x-resume-token": previous.token,
                                  "x-seq": previous.seq,
                              } }),
                              None => subscription(),
                          };
                          socket
                              .send(Message::text(first.to_string()))
                              .await
                              .map_err(|e| e.to_string())?;
                      }
                      "x-result" => {
                          let status = metadata["x-status"].as_u64().unwrap_or_default();
                          match (metadata["x-id"].as_str(), status) {
                              (Some("resume"), 200..=299) => self.feed_live(),
                              // The window passed: start over, and read what the gap hid.
                              (Some("resume"), _) => socket
                                  .send(Message::text(subscription().to_string()))
                                  .await
                                  .map_err(|e| e.to_string())?,
                              (Some("fleet"), 200..=299) => self.reread().await,
                              (_, status) => return Err(format!("the subscription answered {status}")),
                          }
                      }
                      "x-notification" => {
                          if let Some(current) = welcome.as_mut() {
                              current.seq = metadata["x-seq"].as_u64().unwrap_or(current.seq);
                          }
                          self.metrics.notification();
                          self.notified(&message["body"]);
                      }
                      "x-gap" => {
                          self.metrics.gap();
                          self.feed_lost();
                          self.reread().await;
                      }
                      "x-closing" => {
                          *resume = welcome.take();
                          return Ok(field("x-reason"));
                      }
                      _ => {}
                  }
                  // Every frame moves the resume point, so a close without `x-closing` resumes too.
                  resume.clone_from(&welcome);
              }
              Ok("ended".to_owned())
          }

          /// The whole fleet over REST, after which the map is complete again.
          async fn reread(&self) {
              match self.reload().await {
                  Ok(_) => self.feed_live(),
                  Err(error) => tracing::warn!(%error, "the fleet was not read again"),
              }
          }

          fn feed_live(&self) {
              self.feed.send_if_modified(|lost| lost.take().is_some());
          }

          fn feed_lost(&self) {
              self.feed.send_if_modified(|lost| {
                  if lost.is_some() {
                      return false;
                  }
                  *lost = Some(chrono::Utc::now().to_rfc3339_opts(chrono::SecondsFormat::Secs, true));
                  true
              });
          }
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[tokio::test]
          async fn a_socket_url_without_a_websocket_scheme_is_refused() {
              let request = "http://127.0.0.1:9/ws"
                  .into_client_request()
                  .expect("a request");
              let error = open(request).await.err().expect("refused");
              assert!(error.contains("not ws:// or wss://"), "{error}");
          }

          #[test]
          fn a_resume_debug_never_shows_the_token() {
              let resume = Resume {
                  token: "s3cr3t-test".into(),
                  ..Resume::default()
              };
              let text = format!("{resume:?}");
              assert!(
                  !text.contains("s3cr3t-test") && text.contains("[redacted]"),
                  "{text}"
              );
          }

          #[test]
          fn the_socket_url_follows_the_endpoints_scheme() {
              assert_eq!(
                  socket_url("https://h/api/endpoint/s/"),
                  "wss://h/api/endpoint/s/ws"
              );
              assert_eq!(
                  socket_url("http://127.0.0.1:9/api/endpoint/s/"),
                  "ws://127.0.0.1:9/api/endpoint/s/ws"
              );
          }

          #[test]
          fn a_partial_notification_keeps_what_it_leaves_out_and_an_unplaced_bus_waits() {
              let known = Vehicle {
                  id: "urn:ngsi-ld:Vehicle:1".into(),
                  coordinates: [24.9, 60.1],
                  bearing: Some(90.0),
                  speed: Some(5.0),
                  ref_line: Some("550".into()),
                  mode: Some("bus".into()),
              };
              let moved = vehicle_of(
                  &json!({ "id": "urn:ngsi-ld:Vehicle:1", "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [25.0, 60.2] } } }),
                  Some(&known),
              )
              .expect("a bus");
              assert_eq!(moved.coordinates, [25.0, 60.2]);
              assert_eq!(
                  (moved.bearing, moved.ref_line.as_deref()),
                  (Some(90.0), Some("550"))
              );
              assert_eq!(
                  vehicle_of(&json!({ "id": "urn:ngsi-ld:Vehicle:2", "speed": 3 }), None),
                  None
              );
          }
      }
    src__main.rs: |
      //! The app process: read the variables the reconciler sets, bind, follow the socket, serve.
      //!
      //! In the pod the reconciler sets `JC_BIND_ADDRESS` to `0.0.0.0:8080`, the port the APISIX edge
      //! upstreams to and the NetworkPolicy opens to nobody else (AP-26). The loopback default is for
      //! a laptop. On a public app the edge passes anonymous requests straight through, without
      //! `X-Access-Token` (AP-28).

      use std::sync::Arc;

      use hsl_transport::{router, App, Config};

      #[tokio::main]
      async fn main() -> Result<(), Box<dyn std::error::Error>> {
          tracing_subscriber::fmt()
              .with_env_filter(
                  tracing_subscriber::EnvFilter::try_from_default_env().unwrap_or_else(|_| "info".into()),
              )
              .init();

          let config = Config::from_env()?;
          let bind = std::env::var("JC_BIND_ADDRESS").unwrap_or_else(|_| "127.0.0.1:8080".to_owned());
          tracing::info!(%bind, base = %config.base_path, "hsl-transport starting");

          let app = Arc::new(App::new(config));
          // One socket for the whole process, however many browsers are watching.
          tokio::spawn(Arc::clone(&app).follow());
          tokio::spawn(Arc::clone(&app).read_board());

          let listener = tokio::net::TcpListener::bind(&bind).await?;
          axum::serve(listener, router(app))
              .with_graceful_shutdown(async {
                  let _ = tokio::signal::ctrl_c().await;
              })
              .await?;
          Ok(())
      }
    src__metrics.rs: |
      //! The app's own `/metrics` (T-3581): what the socket delivered, and how late.
      //!
      //! The latency is the hop the app sees: from the HFP position's `observedAt` to the moment its
      //! notification arrived here, which is MQTT, the pipeline, the broker and the WebSocket
      //! together. Quantiles cover the last ten minutes.

      use std::collections::VecDeque;
      use std::sync::atomic::{AtomicU64, Ordering};
      use std::sync::Mutex;
      use std::time::{Duration, Instant};

      /// How far back the latency quantiles look.
      const WINDOW: Duration = Duration::from_secs(600);
      /// Samples kept at most: the fleet moves about once a second per vehicle.
      const SAMPLES: usize = 100_000;

      #[derive(Debug, Default)]
      pub struct Metrics {
          notifications: AtomicU64,
          gaps: AtomicU64,
          reconnects: AtomicU64,
          latencies: Mutex<VecDeque<(Instant, u64)>>,
      }

      impl Metrics {
          pub fn notification(&self) {
              self.notifications.fetch_add(1, Ordering::Relaxed);
          }

          pub fn gap(&self) {
              self.gaps.fetch_add(1, Ordering::Relaxed);
          }

          pub fn reconnect(&self) {
              self.reconnects.fetch_add(1, Ordering::Relaxed);
          }

          pub fn latency(&self, late: Duration) {
              let mut samples = self.latencies.lock().unwrap_or_else(|e| e.into_inner());
              if samples.len() >= SAMPLES {
                  samples.pop_front();
              }
              samples.push_back((Instant::now(), late.as_millis() as u64));
          }

          /// The `q` quantile, in milliseconds, of the latencies inside the window.
          pub fn quantile(&self, q: f64) -> Option<u64> {
              let mut samples = self.latencies.lock().unwrap_or_else(|e| e.into_inner());
              while samples.front().is_some_and(|(at, _)| at.elapsed() > WINDOW) {
                  samples.pop_front();
              }
              let mut sorted: Vec<u64> = samples.iter().map(|(_, ms)| *ms).collect();
              if sorted.is_empty() {
                  return None;
              }
              sorted.sort_unstable();
              let at = ((sorted.len() - 1) as f64 * q).round() as usize;
              sorted.get(at).copied()
          }

          /// The Prometheus text of everything above; a quantile without samples is left out.
          pub fn text(&self, vehicles: usize) -> String {
              let mut out = format!(
                  "# TYPE hsl_ws_notifications_total counter\nhsl_ws_notifications_total {}\n\
                   # TYPE hsl_ws_gaps_total counter\nhsl_ws_gaps_total {}\n\
                   # TYPE hsl_ws_reconnects_total counter\nhsl_ws_reconnects_total {}\n\
                   # TYPE hsl_vehicles gauge\nhsl_vehicles {vehicles}\n\
                   # TYPE hsl_update_latency_ms summary\n",
                  self.notifications.load(Ordering::Relaxed),
                  self.gaps.load(Ordering::Relaxed),
                  self.reconnects.load(Ordering::Relaxed),
              );
              for q in [0.5, 0.95] {
                  if let Some(ms) = self.quantile(q) {
                      out.push_str(&format!("hsl_update_latency_ms{{quantile=\"{q}\"}} {ms}\n"));
                  }
              }
              out
          }
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn the_quantiles_read_the_samples_and_none_without_any() {
              let metrics = Metrics::default();
              assert_eq!(metrics.quantile(0.5), None);
              assert!(!metrics.text(0).contains("quantile"));
              for ms in 1..=100 {
                  metrics.latency(Duration::from_millis(ms));
              }
              assert_eq!(metrics.quantile(0.5), Some(51));
              assert_eq!(metrics.quantile(0.95), Some(95));
              assert!(metrics.text(3).contains("hsl_vehicles 3\n"));
          }
      }
    tests__live_tests.rs: |
      //! The fleet from the Endpoint's WebSocket (T-3581, API/07).
      //!
      //! A stand-in Endpoint serves the REST read and the socket the way the gateway relays the
      //! broker's view: a welcome, the subscription's result, numbered notifications, a close and a
      //! resume, a gap. What is asserted is what the app sends and what the map then holds. Which
      //! entities and attributes a view lets through is the broker's and the gateway's (Antares
      //! T-3517, gateway T-3885), tested there.

      use std::sync::atomic::{AtomicUsize, Ordering};
      use std::sync::{Arc, Mutex};
      use std::time::Duration;

      use axum::extract::ws::{Message, WebSocket, WebSocketUpgrade};
      use axum::extract::State;
      use axum::routing::get;
      use axum::{Json, Router};
      use hsl_transport::{App, Config};
      use serde_json::{json, Value};

      const BUS: &str = "urn:ngsi-ld:Vehicle:hsl.fi:transport:bus-01";
      const TRAM: &str = "urn:ngsi-ld:Vehicle:hsl.fi:transport:tram-07";

      /// What each socket the app opens is sent, frame by frame; `None` closes it without a word.
      type Script = Vec<Vec<Option<Value>>>;

      #[derive(Default)]
      struct Endpoint {
          script: Mutex<Script>,
          /// The first message of each socket the app opened.
          first: Mutex<Vec<Value>>,
          reads: AtomicUsize,
      }

      fn op(op: &str, extra: Value, body: Option<Value>) -> Option<Value> {
          let mut metadata = json!({ "x-op": op });
          if let (Some(fields), Some(target)) = (extra.as_object(), metadata.as_object_mut()) {
              target.extend(fields.clone());
          }
          Some(match body {
              Some(body) => json!({ "metadata": metadata, "body": body }),
              None => json!({ "metadata": metadata }),
          })
      }

      fn moved(seq: u64, id: &str, longitude: f64) -> Option<Value> {
          op(
              "x-notification",
              json!({ "x-seq": seq }),
              Some(json!({ "type": "Notification", "data": [{
                  "id": id, "type": "Vehicle",
                  "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [longitude, 60.2] },
                                "observedAt": "2026-10-12T08:00:00Z" },
                  "route": { "type": "Property", "value": "550" }
              }] })),
          )
      }

      async fn socket(
          State(endpoint): State<Arc<Endpoint>>,
          upgrade: WebSocketUpgrade,
      ) -> axum::response::Response {
          upgrade
              .protocols(["ngsi-ld-ws"])
              .on_upgrade(move |socket| converse(endpoint, socket))
      }

      async fn converse(endpoint: Arc<Endpoint>, mut socket: WebSocket) {
          let n = endpoint.first.lock().unwrap().len();
          let welcome = op(
              "x-welcome",
              json!({ "x-connection": format!("c{n}"), "x-resume-token": format!("t{n}") }),
              None,
          );
          let _ = socket
              .send(Message::text(welcome.unwrap().to_string()))
              .await;
          let Some(Ok(Message::Text(first))) = socket.recv().await else {
              return;
          };
          let first: Value = serde_json::from_str(&first).unwrap();
          let answer = if first["metadata"]["x-op"] == "x-resume" {
              op(
                  "x-result",
                  json!({ "x-id": "resume", "x-status": 200 }),
                  None,
              )
          } else {
              op(
                  "x-result",
                  json!({ "x-id": "fleet", "x-status": 201 }),
                  Some(json!({ "id": "urn:ngsi-ld:Subscription:1" })),
              )
          };
          endpoint.first.lock().unwrap().push(first);
          let _ = socket
              .send(Message::text(answer.unwrap().to_string()))
              .await;
          let frames = {
              let mut script = endpoint.script.lock().unwrap();
              if script.is_empty() {
                  Vec::new()
              } else {
                  script.remove(0)
              }
          };
          for frame in frames {
              match frame {
                  Some(frame) => {
                      let _ = socket.send(Message::text(frame.to_string())).await;
                  }
                  None => return,
              }
          }
          // Hold the socket open, as a live feed does.
          while socket.recv().await.is_some() {}
      }

      async fn entities(State(endpoint): State<Arc<Endpoint>>) -> Json<Value> {
          endpoint.reads.fetch_add(1, Ordering::SeqCst);
          Json(json!({ "type": "FeatureCollection", "features": [{
              "id": TRAM, "type": "Feature",
              "geometry": { "type": "Point", "coordinates": [24.9, 60.1] },
              "properties": { "type": "Vehicle", "transportMode": { "type": "Property", "value": "tram" } }
          }] }))
      }

      async fn start(script: Script) -> (Arc<App>, Arc<Endpoint>) {
          let endpoint = Arc::new(Endpoint {
              script: Mutex::new(script),
              ..Endpoint::default()
          });
          let routes = Router::new()
              .route("/api/endpoint/s/ws", get(socket))
              .route("/api/endpoint/s/ngsi-ld/v1/entities", get(entities))
              .with_state(Arc::clone(&endpoint));
          let listener = tokio::net::TcpListener::bind("127.0.0.1:0").await.unwrap();
          let address = listener.local_addr().unwrap();
          tokio::spawn(async move { axum::serve(listener, routes).await });
          let app = Arc::new(App::new(Config {
              base_path: "/".to_owned(),
              endpoint_url: format!("http://{address}/api/endpoint/s/"),
              page_config: None,
          }));
          tokio::spawn(Arc::clone(&app).follow());
          (app, endpoint)
      }

      /// Waits until `done` holds, at most five seconds.
      async fn until(what: &str, done: impl Fn() -> bool) {
          for _ in 0..500 {
              if done() {
                  return;
              }
              tokio::time::sleep(Duration::from_millis(10)).await;
          }
          panic!("never: {what}");
      }

      fn at(app: &App, id: &str) -> Option<[f64; 2]> {
          app.snapshot()
              .into_iter()
              .find(|v| v.id == id)
              .map(|v| v.coordinates)
      }

      #[tokio::test]
      async fn the_socket_subscribes_reads_once_and_moves_the_buses() {
          let (app, endpoint) = start(vec![vec![moved(1, BUS, 25.0), moved(2, BUS, 25.1)]]).await;
          until("the bus moved twice", || {
              at(&app, BUS) == Some([25.1, 60.2])
          })
          .await;
          let first = endpoint.first.lock().unwrap()[0].clone();
          assert_eq!(first["metadata"]["x-op"], "x-subscribe");
          assert_eq!(first["body"]["entities"], json!([{ "type": "Vehicle" }]));
          assert_eq!(first["body"]["watchedAttributes"], json!(["location"]));
          // One full read after the subscription, so a vehicle that has not moved yet is drawn.
          assert_eq!(at(&app, TRAM), Some([24.9, 60.1]));
          assert_eq!(endpoint.reads.load(Ordering::SeqCst), 1);
          assert_eq!(app.feed_lost_since(), None);
          assert!(app.metrics.text(0).contains("hsl_ws_notifications_total 2"));
      }

      #[tokio::test]
      async fn a_dropped_socket_resumes_from_the_last_seq_and_reads_nothing_again() {
          let (app, endpoint) = start(vec![
              vec![moved(1, BUS, 25.0), moved(2, BUS, 25.1), None],
              vec![moved(1, BUS, 25.2)],
          ])
          .await;
          until("the bus moved after the resume", || {
              at(&app, BUS) == Some([25.2, 60.2])
          })
          .await;
          let resume = endpoint.first.lock().unwrap()[1].clone();
          assert_eq!(resume["metadata"]["x-op"], "x-resume");
          assert_eq!(resume["metadata"]["x-connection"], "c0");
          assert_eq!(resume["metadata"]["x-resume-token"], "t0");
          assert_eq!(resume["metadata"]["x-seq"], 2);
          assert_eq!(
              endpoint.reads.load(Ordering::SeqCst),
              1,
              "a resume reads nothing again"
          );
          until("the feed is live again", || app.feed_lost_since().is_none()).await;
      }

      #[tokio::test]
      async fn a_gap_reads_the_fleet_again() {
          let (app, endpoint) = start(vec![vec![
              moved(1, BUS, 25.0),
              op("x-gap", json!({ "x-from": 2, "x-to": 9 }), None),
          ]])
          .await;
          until("the gap read", || {
              endpoint.reads.load(Ordering::SeqCst) == 2
          })
          .await;
          assert_eq!(at(&app, BUS), Some([25.0, 60.2]));
          until("the feed is live again", || app.feed_lost_since().is_none()).await;
          assert!(app.metrics.text(0).contains("hsl_ws_gaps_total 1"));
      }

      #[tokio::test]
      async fn no_endpoint_is_a_lost_feed_with_its_time() {
          let app = Arc::new(App::new(Config {
              base_path: "/".to_owned(),
              endpoint_url: "http://127.0.0.1:9/api/endpoint/s/".to_owned(),
              page_config: None,
          }));
          tokio::spawn(Arc::clone(&app).follow());
          tokio::time::sleep(Duration::from_millis(200)).await;
          let since = app.feed_lost_since().expect("lost");
          assert!(since.ends_with('Z'), "{since}");
          assert!(app.snapshot().is_empty());
      }
    tests__server_tests.rs: |
      //! The app's own contract with its Endpoint (T-0309, AP-04, AP-28, AP-38, AP-41).
      //!
      //! Every case runs the real router and the real poll against a stubbed endpoint, so what is
      //! asserted is the request that actually leaves the pod: which URL, which representation,
      //! and which credential. The point of a public reference app is that it adds nothing at all
      //! to the caller's authority, and that is only observable from outside the process.

      use std::sync::Arc;

      use axum::body::Body;
      use axum::http::{Request, StatusCode};
      use hsl_transport::board::HSL_ALERTS;
      use hsl_transport::{router, App, Config, PollError};
      use http_body_util::BodyExt;
      use serde_json::{json, Value};
      use tower::ServiceExt;
      use wiremock::matchers::{header, method, path, query_param};
      use wiremock::{Mock, MockServer, ResponseTemplate};

      const BASE: &str = "/apps/hsl-transport/";
      const BUS: &str = "urn:ngsi-ld:Vehicle:hsl.fi:transport:bus-01";

      fn app_at(endpoint: &MockServer) -> Arc<App> {
          Arc::new(App::new(Config {
              base_path: BASE.to_owned(),
              endpoint_url: format!("{}/", endpoint.uri()),
              page_config: None,
          }))
      }

      /// One bus as the Endpoint's GeoJSON representation carries it.
      fn feature(id: &str, longitude: f64, latitude: f64) -> Value {
          json!({
              "id": id,
              "type": "Feature",
              "geometry": { "type": "Point", "coordinates": [longitude, latitude] },
              "properties": {
                  "type": "Vehicle",
                  "heading": { "type": "Property", "value": 143.0 },
                  "speed": { "type": "Property", "value": 8.5 },
                  "route": { "type": "Property", "value": "550" }
              }
          })
      }

      fn collection(features: Vec<Value>) -> Value {
          json!({ "type": "FeatureCollection", "features": features })
      }

      /// Answers every fleet request with this collection.
      async fn serving(endpoint: &MockServer, body: Value) {
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .respond_with(ResponseTemplate::new(200).set_body_json(body))
              .mount(endpoint)
              .await;
      }

      async fn text_of(response: axum::response::Response) -> String {
          let bytes = response
              .into_body()
              .collect()
              .await
              .expect("a body")
              .to_bytes();
          String::from_utf8_lossy(&bytes).into_owned()
      }

      /// AP-04, AP-38: the fleet comes from the Endpoint's GeoJSON representation, capped at 30.
      #[tokio::test]
      async fn the_fleet_is_read_from_the_endpoints_geojson_representation() {
          let endpoint = MockServer::start().await;
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .and(query_param("type", "Vehicle"))
              .and(query_param("limit", "90"))
              .and(header("accept", "application/geo+json"))
              .respond_with(
                  ResponseTemplate::new(200).set_body_json(collection(vec![feature(BUS, 24.94, 60.17)])),
              )
              .expect(1)
              .mount(&endpoint)
              .await;

          let app = app_at(&endpoint);
          let changed = app.reload().await.expect("a fleet");

          assert_eq!(changed.len(), 1);
          assert_eq!(changed[0].id, BUS);
          assert_eq!(changed[0].coordinates, [24.94, 60.17]);
          assert_eq!(changed[0].ref_line.as_deref(), Some("550"));
      }

      /// AP-28: the Endpoint is public and the app never sees a user, so nothing it sends carries a
      /// credential. An app that sent one would be lending an authority no caller asked for.
      #[tokio::test]
      async fn the_poll_carries_no_credential_at_all() {
          let endpoint = MockServer::start().await;
          serving(&endpoint, collection(vec![feature(BUS, 24.94, 60.17)])).await;

          app_at(&endpoint).reload().await.expect("a fleet");

          let requests = endpoint.received_requests().await.expect("the requests");
          assert_eq!(requests.len(), 1);
          for name in ["authorization", "cookie", "x-access-token"] {
              assert!(
                  requests[0].headers.get(name).is_none(),
                  "the poll sent a `{name}` header"
              );
          }
      }

      /// The Endpoint is the app's whole world: no broker, no database, no second host.
      #[tokio::test]
      async fn every_call_the_app_makes_goes_to_its_own_endpoint() {
          let endpoint = MockServer::start().await;
          serving(&endpoint, collection(vec![feature(BUS, 24.94, 60.17)])).await;
          let app = app_at(&endpoint);

          app.reload().await.expect("a fleet");
          // Serving a browser must not produce a call of its own; the fleet is already in memory.
          router(Arc::clone(&app))
              .oneshot(
                  Request::builder()
                      .uri(format!("{BASE}api/vehicles"))
                      .body(Body::empty())
                      .expect("a request"),
              )
              .await
              .expect("a response");

          let requests = endpoint.received_requests().await.expect("the requests");
          assert_eq!(requests.len(), 1, "a browser must not cost a query");
          assert!(requests[0].url.path().starts_with("/ngsi-ld/v1/"));
      }

      /// A hundred open maps are one query per interval, so only what moved travels.
      #[tokio::test]
      async fn a_bus_that_has_not_moved_is_not_sent_again() {
          let endpoint = MockServer::start().await;
          serving(&endpoint, collection(vec![feature(BUS, 24.94, 60.17)])).await;
          let app = app_at(&endpoint);

          assert_eq!(app.reload().await.expect("a fleet").len(), 1);
          assert!(
              app.reload().await.expect("a fleet").is_empty(),
              "an unchanged fleet produced a change"
          );
          assert_eq!(app.snapshot().len(), 1, "the bus left the map");
      }

      #[tokio::test]
      async fn a_bus_that_moves_is_reported_once_and_the_others_stay_quiet() {
          let endpoint = MockServer::start().await;
          let other = "urn:ngsi-ld:Vehicle:hsl.fi:transport:bus-02";
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .respond_with(ResponseTemplate::new(200).set_body_json(collection(vec![
                  feature(BUS, 24.94, 60.17),
                  feature(other, 24.80, 60.20),
              ])))
              .up_to_n_times(1)
              .mount(&endpoint)
              .await;
          serving(
              &endpoint,
              collection(vec![
                  feature(BUS, 24.95, 60.18),
                  feature(other, 24.80, 60.20),
              ]),
          )
          .await;
          let app = app_at(&endpoint);

          assert_eq!(app.reload().await.expect("a fleet").len(), 2);
          let moved = app.reload().await.expect("a fleet");

          assert_eq!(moved.len(), 1);
          assert_eq!(moved[0].id, BUS);
          assert_eq!(moved[0].coordinates, [24.95, 60.18]);
      }

      /// AP-38, T-3893: the map draws at most ninety vehicles, the pipeline's caps summed, whatever the
      /// space holds.
      #[tokio::test]
      async fn the_fleet_is_capped_at_ninety_vehicles() {
          let endpoint = MockServer::start().await;
          let features = (0..120)
              .map(|n| {
                  feature(
                      &format!("urn:ngsi-ld:Vehicle:hsl.fi:transport:bus-{n:02}"),
                      24.0 + f64::from(n) / 100.0,
                      60.0,
                  )
              })
              .collect();
          serving(&endpoint, collection(features)).await;

          let app = app_at(&endpoint);
          assert_eq!(app.reload().await.expect("a fleet").len(), 90);
          assert_eq!(app.snapshot().len(), 90);
      }

      /// A bus the map cannot place is a bus the map must not draw somewhere wrong.
      #[tokio::test]
      async fn a_feature_with_no_point_is_dropped_rather_than_placed_at_zero() {
          let endpoint = MockServer::start().await;
          serving(
              &endpoint,
              collection(vec![
                  json!({ "id": "urn:ngsi-ld:Vehicle:hsl.fi:transport:bus-99", "type": "Feature", "geometry": Value::Null, "properties": {} }),
                  feature(BUS, 24.94, 60.17),
              ]),
          )
          .await;

          let fleet = app_at(&endpoint).reload().await.expect("a fleet");
          assert_eq!(fleet.len(), 1);
          assert_eq!(fleet[0].id, BUS);
      }

      /// An attribute a Policy hides is absent from the app's own answer too, never a zero that a
      /// reader would take for a measurement (R9).
      #[tokio::test]
      async fn an_attribute_the_grant_hides_is_absent_and_not_defaulted() {
          let endpoint = MockServer::start().await;
          serving(
              &endpoint,
              collection(vec![json!({
                  "id": BUS,
                  "type": "Feature",
                  "geometry": { "type": "Point", "coordinates": [24.94, 60.17] },
                  "properties": { "type": "Vehicle" }
              })]),
          )
          .await;
          let app = app_at(&endpoint);
          app.reload().await.expect("a fleet");

          let response = router(Arc::clone(&app))
              .oneshot(
                  Request::builder()
                      .uri(format!("{BASE}api/vehicles"))
                      .body(Body::empty())
                      .expect("a request"),
              )
              .await
              .expect("a response");
          let fleet: Value = serde_json::from_str(&text_of(response).await).expect("json");

          assert_eq!(fleet[0]["coordinates"], json!([24.94, 60.17]));
          for hidden in ["bearing", "speed", "refLine"] {
              assert!(fleet[0].get(hidden).is_none(), "`{hidden}` was invented");
          }
      }

      /// Nothing polled yet is not an empty fleet, and a map should be told the difference.
      #[tokio::test]
      async fn the_fleet_route_says_so_before_the_first_poll_has_produced_anything() {
          let endpoint = MockServer::start().await;
          let response = router(app_at(&endpoint))
              .oneshot(
                  Request::builder()
                      .uri(format!("{BASE}api/vehicles"))
                      .body(Body::empty())
                      .expect("a request"),
              )
              .await
              .expect("a response");

          assert_eq!(response.status(), StatusCode::SERVICE_UNAVAILABLE);
          assert_eq!(
              response
                  .headers()
                  .get("content-type")
                  .and_then(|value| value.to_str().ok()),
              Some("application/problem+json")
          );
      }

      /// AP-41: a browser that has just connected draws immediately, so the stream opens with the
      /// whole fleet and every later event is a difference.
      #[tokio::test]
      async fn the_stream_opens_with_the_whole_fleet() {
          let endpoint = MockServer::start().await;
          serving(&endpoint, collection(vec![feature(BUS, 24.94, 60.17)])).await;
          let app = app_at(&endpoint);
          app.reload().await.expect("a fleet");

          let response = router(app)
              .oneshot(
                  Request::builder()
                      .uri(format!("{BASE}api/stream"))
                      .body(Body::empty())
                      .expect("a request"),
              )
              .await
              .expect("a response");

          assert_eq!(response.status(), StatusCode::OK);
          assert_eq!(
              response
                  .headers()
                  .get("content-type")
                  .and_then(|value| value.to_str().ok()),
              Some("text/event-stream")
          );
          let frame = response
              .into_body()
              .frame()
              .await
              .expect("a frame")
              .expect("a data frame");
          let first = String::from_utf8_lossy(frame.data_ref().expect("data")).into_owned();
          assert!(first.contains("event: vehicles"), "got {first}");
          assert!(first.contains(BUS), "got {first}");
      }

      /// A poll that fails leaves the last known fleet on every open map: the buses stop moving
      /// rather than disappearing, and the reason goes to the log rather than to the browser.
      #[tokio::test]
      async fn an_endpoint_that_refuses_leaves_the_last_known_fleet_in_place() {
          let endpoint = MockServer::start().await;
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .respond_with(
                  ResponseTemplate::new(200).set_body_json(collection(vec![feature(BUS, 24.94, 60.17)])),
              )
              .up_to_n_times(1)
              .mount(&endpoint)
              .await;
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .respond_with(ResponseTemplate::new(403))
              .mount(&endpoint)
              .await;
          let app = app_at(&endpoint);

          app.reload().await.expect("a fleet");
          assert_eq!(app.reload().await, Err(PollError::Refused(403)));
          assert_eq!(app.snapshot().len(), 1, "a refusal emptied the map");
      }

      /// The Portal links the app with the trailing slash and a person types it without; they are
      /// not different visitors.
      #[tokio::test]
      async fn the_front_page_answers_on_both_spellings_of_the_prefix() {
          let endpoint = MockServer::start().await;
          let app = app_at(&endpoint);
          for uri in [BASE.trim_end_matches('/'), BASE] {
              let response = router(Arc::clone(&app))
                  .oneshot(
                      Request::builder()
                          .uri(uri)
                          .body(Body::empty())
                          .expect("a request"),
                  )
                  .await
                  .expect("a response");
              assert_eq!(response.status(), StatusCode::OK, "{uri} did not answer");
          }
      }

      /// The pod's readiness probe: at the root, outside the base path, and never a query.
      #[tokio::test]
      async fn the_readiness_probe_answers_at_the_root_without_a_query() {
          let endpoint = MockServer::start().await;
          let response = router(app_at(&endpoint))
              .oneshot(
                  Request::builder()
                      .uri("/healthz")
                      .body(Body::empty())
                      .unwrap(),
              )
              .await
              .expect("the app answers");
          assert_eq!(response.status(), StatusCode::OK);
          assert_eq!(text_of(response).await, "ok");
          assert!(endpoint
              .received_requests()
              .await
              .is_some_and(|r| r.is_empty()));
      }

      /// T-2909: on its own host the base path is `/`; the router must build there (it panicked at
      /// start on dev with an empty route) and serve the fleet under it.
      #[tokio::test]
      async fn the_app_starts_on_its_own_host_at_the_root() {
          let endpoint = MockServer::start().await;
          let app = Arc::new(App::new(Config {
              base_path: "/".to_owned(),
              endpoint_url: format!("{}/", endpoint.uri()),
              page_config: None,
          }));
          for uri in ["/healthz", "/api/vehicles"] {
              let response = router(app.clone())
                  .oneshot(Request::builder().uri(uri).body(Body::empty()).unwrap())
                  .await
                  .expect("the app answers");
              // The fleet answers 503 until its first poll: routed, not missing.
              assert!(
                  [StatusCode::OK, StatusCode::SERVICE_UNAVAILABLE].contains(&response.status()),
                  "{uri}: {}",
                  response.status()
              );
          }
      }

      /// AP-67, AP-126: the front page carries the reconciler's `JC_APP_CONFIG` as `#jc-config`, so
      /// the map finds the project's basemap; a value that spells `</script>` cannot end the element.
      #[tokio::test]
      async fn the_front_page_carries_the_reconcilers_configuration_with_its_basemap() {
          let endpoint = MockServer::start().await;
          let basemap = "https://portal.hel.fi/api/v1/projects/hel/basemap/default/style.json";
          let raw = json!({ "appName": "</script><script>alert(1)</script>", "basemap": basemap });
          let page = |page_config: Option<String>| {
              let app = Arc::new(App::new(Config {
                  base_path: "/".to_owned(),
                  endpoint_url: format!("{}/", endpoint.uri()),
                  page_config,
              }));
              async move {
                  let response = router(app)
                      .oneshot(
                          Request::builder()
                              .uri("/")
                              .body(Body::empty())
                              .expect("a request"),
                      )
                      .await
                      .expect("the app answers");
                  assert_eq!(response.status(), StatusCode::OK);
                  let body = response
                      .into_body()
                      .collect()
                      .await
                      .expect("a body")
                      .to_bytes();
                  String::from_utf8_lossy(&body).into_owned()
              }
          };

          let served = page(Some(
              hsl_transport::page_config(&raw.to_string()).expect("an object"),
          ))
          .await;
          let open = r#"<script id="jc-config" type="application/json">"#;
          let start = served.find(open).expect("the page carries #jc-config") + open.len();
          let end = start
              + served[start..]
                  .find("</script>")
                  .expect("the element is closed");
          let config: Value = serde_json::from_str(&served[start..end]).expect("the element holds JSON");
          assert_eq!(config["basemap"], basemap);
          assert_eq!(
              config["appName"], raw["appName"],
              "read back as it was handed over"
          );

          // Without one the page is served as built, and anything but one JSON object is refused.
          assert!(!page(None).await.contains("jc-config"));
          for raw in ["not json", "[1]", "\"basemap\""] {
              assert!(
                  hsl_transport::page_config(raw).is_err(),
                  "{raw} was accepted"
              );
          }
      }

      /// Answers the board's reads of one type with these entities, simplified.
      async fn board_serving(endpoint: &MockServer, kind: &str, body: Value) {
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .and(query_param("type", kind))
              .and(query_param("options", "keyValues"))
              .respond_with(ResponseTemplate::new(200).set_body_json(body))
              .mount(endpoint)
              .await;
      }

      const SPACE: &str = "hel.fi:helsinki";

      async fn board_endpoint() -> MockServer {
          let endpoint = MockServer::start().await;
          board_serving(&endpoint, "PublicTransportRoute", json!([
              { "id": "urn:ngsi-ld:PublicTransportRoute:x:550-1", "route": "2550", "directionId": 1, "headsign": "Itäkeskus" },
              { "id": "urn:ngsi-ld:PublicTransportRoute:x:550-2", "route": "2550", "directionId": "2", "headsign": "Westendinasema" }
          ])).await;
          // Only stops that carry departures are asked for; the endpoint is told so.
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .and(query_param("type", "GtfsStop"))
              .and(query_param("q", "departures"))
              .respond_with(ResponseTemplate::new(200).set_body_json(json!([
                  { "id": format!("urn:ngsi-ld:GtfsStop:{SPACE}:2222"), "name": { "fi": "Tapiola", "en": "Tapiola (M)" },
                    "location": { "type": "Point", "coordinates": [24.80, 60.17] },
                    "departures": [
                      { "route": "x", "routeId": "2550", "directionId": 1, "expected": "2026-10-12T08:01:00Z", "status": "scheduled", "delay": 60 },
                      { "routeId": "31M1", "directionId": 0, "expected": "2026-10-12T08:03:00Z", "status": "canceled" }
                    ] },
                  { "id": format!("urn:ngsi-ld:GtfsStop:{SPACE}:1111"), "name": "Aalto-yliopisto", "departures": [] }
              ])))
              .mount(&endpoint)
              .await;
          Mock::given(method("GET"))
              .and(path("/ngsi-ld/v1/entities"))
              .and(query_param("type", "GtfsStop"))
              // Both stops the alerts name, in one ask; the space holds one of them.
              .and(query_param(
                  "id",
                  format!("urn:ngsi-ld:GtfsStop:{SPACE}:1392501,urn:ngsi-ld:GtfsStop:{SPACE}:9999"),
              ))
              .respond_with(ResponseTemplate::new(200).set_body_json(json!([
                  { "id": format!("urn:ngsi-ld:GtfsStop:{SPACE}:1392501"), "location": { "type": "Point", "coordinates": [25.03, 60.27] } }
              ])))
              .mount(&endpoint)
              .await;
          board_serving(&endpoint, "Alert", json!([
              { "id": format!("urn:ngsi-ld:Alert:{SPACE}:hsl-2"), "name": { "fi": "Poikkeus", "en": "<b>Detour</b>" },
                "description": "Line 550 takes a detour.", "severity": "medium",
                "refRoute": format!("urn:ngsi-ld:GtfsRoute:{SPACE}:2550"), "unknownReference": ["route:100HE", "stop:9999"],
                "validFrom": "2026-10-12T05:00:00Z", "source": HSL_ALERTS },
              { "id": format!("urn:ngsi-ld:Alert:{SPACE}:hsl-1"), "name": { "fi": "Pysäkki suljettu" }, "severity": "high",
                "refStop": [format!("urn:ngsi-ld:GtfsStop:{SPACE}:1392501")], "source": HSL_ALERTS },
              { "id": format!("urn:ngsi-ld:Alert:{SPACE}:digitraffic-7"), "name": "Road works",
                "source": "https://tie.digitraffic.fi/api/traffic-message/v1/messages" }
          ])).await;
          endpoint
      }

      /// T-3895: a stop's departures carry the headsign of their line and direction, and a stop with
      /// none is not listed.
      #[tokio::test]
      async fn departures_name_their_headsign_and_only_stops_with_departures_are_listed() {
          let endpoint = board_endpoint().await;
          let app = app_at(&endpoint);
          let response = router(app.clone())
              .oneshot(
                  Request::get(format!("{BASE}api/departures"))
                      .body(Body::empty())
                      .expect("a request"),
              )
              .await
              .expect("a response");
          assert_eq!(response.status(), StatusCode::SERVICE_UNAVAILABLE);

          app.poll_board().await.expect("a board");
          let response = router(app)
              .oneshot(
                  Request::get(format!("{BASE}api/departures"))
                      .body(Body::empty())
                      .expect("a request"),
              )
              .await
              .expect("a response");
          assert_eq!(response.status(), StatusCode::OK);
          let stops: Value = serde_json::from_str(&text_of(response).await).expect("JSON");
          assert_eq!(
              stops,
              json!([{
                  "id": format!("urn:ngsi-ld:GtfsStop:{SPACE}:2222"), "name": "Tapiola (M)", "coordinates": [24.80, 60.17],
                  "departures": [
                      { "line": "2550", "headsign": "Westendinasema", "expected": "2026-10-12T08:01:00Z", "status": "scheduled", "delay": 60 },
                      { "line": "31M1", "expected": "2026-10-12T08:03:00Z", "status": "canceled" }
                  ]
              }])
          );
      }

      /// T-3892, T-3895: HSL's alerts only, the most severe first, each with its lines and stops,
      /// linked or kept as text, and where the stops are; the text goes out as HSL wrote it, for the
      /// browser to render as text.
      #[tokio::test]
      async fn alerts_are_hsls_most_severe_first_with_their_lines_stops_and_places() {
          let endpoint = board_endpoint().await;
          let app = app_at(&endpoint);
          let board = app.poll_board().await.expect("a board");
          let alerts = serde_json::to_value(&board.alerts).expect("JSON");
          assert_eq!(
              alerts,
              json!([
                  { "id": format!("urn:ngsi-ld:Alert:{SPACE}:hsl-1"), "title": "Pysäkki suljettu", "severity": "high",
                    "lines": [], "stops": ["1392501"], "places": [{ "stop": "1392501", "coordinates": [25.03, 60.27] }] },
                  { "id": format!("urn:ngsi-ld:Alert:{SPACE}:hsl-2"), "title": "<b>Detour</b>", "body": "Line 550 takes a detour.",
                    "severity": "medium", "validFrom": "2026-10-12T05:00:00Z", "lines": ["100HE", "2550"], "stops": ["9999"], "places": [] }
              ])
          );
      }

      /// A board read that fails keeps the last board on every open page.
      #[tokio::test]
      async fn a_failed_board_read_keeps_the_last_board() {
          let endpoint = board_endpoint().await;
          let app = app_at(&endpoint);
          let first = app.poll_board().await.expect("a board");
          endpoint.reset().await;
          Mock::given(method("GET"))
              .respond_with(ResponseTemplate::new(502))
              .mount(&endpoint)
              .await;
          assert_eq!(app.poll_board().await, Err(PollError::Refused(502)));
          assert_eq!(app.board(), Some(first));
      }

      /// T-3893: a vehicle says its mode, as the pipeline writes it.
      #[tokio::test]
      async fn a_vehicle_carries_its_mode() {
          let endpoint = MockServer::start().await;
          let mut tram = feature("urn:ngsi-ld:Vehicle:hel.fi:helsinki:40-3", 24.94, 60.17);
          tram["properties"]["transportMode"] = json!({ "type": "Property", "value": "tram" });
          serving(&endpoint, collection(vec![tram])).await;
          let app = app_at(&endpoint);
          let fleet = app.reload().await.expect("a fleet");
          assert_eq!(fleet[0].mode.as_deref(), Some("tram"));
      }
    ui__e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { LIVE_BLOCKS, WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { BASE, serve } from "./serve";

      // UI-84, SDK-12 (T-2825, T-2926): the live map, its lines and its charts at a phone, a tablet, a laptop and a wall,
      // light and dark: no sideways scroll, no two blocks over each other, no control cut off, nothing
      // axe finds at WCAG 2.1 AA.
      for (const scheme of ["light", "dark"] as const) {
        for (const size of WIDTHS) {
          test(`the buses, ${scheme}, at ${size.width} px: no sideways scroll, no overlap, axe clean`, async ({ page }, testInfo) => {
            const { missing, problems } = await serve(page);
            await page.emulateMedia({ colorScheme: scheme });
            await page.setViewportSize(size);
            await page.goto(BASE);
            await expect(page.getByRole("status")).toContainText("6 vehicles");
            await expect(page.getByRole("list", { name: "Departures from Tapiola (M)" })).toBeVisible();
            await expect(page.getByRole("list", { name: "Service alerts" })).toBeVisible();
            await expect(page.getByTestId("map").locator("canvas")).toHaveCount(1);
            await expect(page.getByRole("list", { name: "Lines on the map" }).getByText("1000N")).toBeVisible();
            // The two charts, coloured (T-2926): one bar per line in view, every speed band.
            const perLine = page.getByRole("list", { name: "Vehicles per line" });
            await expect(perLine.getByRole("listitem").first()).toBeVisible();
            await expect(page.getByRole("list", { name: "Speed" }).getByRole("listitem")).toHaveCount(7);
            await expect(perLine.getByTestId("bar-fill").first()).not.toHaveCSS("background-color", "rgba(0, 0, 0, 0)");
            await testInfo.attach(`buses-${scheme}-${size.width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page, LIVE_BLOCKS)).toEqual([]);
            expect({ missing, problems }).toEqual({ missing: [], problems: [] });
          });
        }
      }

      // SDK-40, T-3399: a bus chosen from those in view opens in the shell's entity panel, read from the
      // app's own backend, at a phone and a laptop, light and dark; the app writes nothing, so the panel
      // links the bus to the Portal.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: a bus in the entity panel, linked to the Portal, axe clean`, async ({ page }) => {
            const { missing, problems } = await serve(page);
            await page.emulateMedia({ colorScheme: scheme });
            await page.setViewportSize({ width, height: 900 });
            await page.goto(BASE);
            await page.getByRole("combobox", { name: "Open a vehicle" }).selectOption("3");
            const panel = page.getByRole("dialog");
            await expect(panel.getByText("23", { exact: true })).toBeVisible();
            await expect(panel.getByRole("link", { name: "Open in the Portal" })).toBeVisible();
            await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
            expect(await layoutProblems(page, LIVE_BLOCKS)).toEqual([]);
            await page.keyboard.press("Escape");
            await expect(page.getByRole("dialog")).toHaveCount(0);
            expect({ missing, problems }).toEqual({ missing: [], problems: [] });
          });
        }
      }
    ui__e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { Page } from "@playwright/test";

      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      // The App is the whole of its own host, `{name}.apps.{domain}`, and built with base `/` (AP-133).
      const ORIGIN = "http://hsl-transport.apps.test";
      export const BASE = `${ORIGIN}/`;
      const TYPES: Record<string, string> = { ".html": "text/html", ".js": "text/javascript", ".css": "text/css", ".json": "application/json", ".svg": "image/svg+xml" };

      /** The page's `JC_APP_CONFIG` as the reconciler hands it, without `user`; the Portal is shown, never followed. */
      const CONFIG = { space: "helsinki", appName: "hsl-transport", portal: "https://portal.test/projects/helsinki" };

      /** Six vehicles on four lines around the centre, in the shape the backend's snapshot answers. */
      export const FLEET = [
        { id: "1", coordinates: [24.941, 60.171], bearing: 90, speed: 8.2, refLine: "550" },
        { id: "2", coordinates: [24.952, 60.168], bearing: 180, speed: 0, refLine: "550", mode: "bus" },
        { id: "3", coordinates: [24.93, 60.18], bearing: 45, speed: 11, refLine: "23", mode: "tram" },
        { id: "4", coordinates: [24.96, 60.19], bearing: 270, refLine: "71" },
        { id: "5", coordinates: [24.9, 60.2], bearing: 0, speed: 5, refLine: "1000N" },
        { id: "6", coordinates: [24.97, 60.16], bearing: 300 },
      ];

      /** One stop's departures a few minutes after the run's own clock, and one of HSL's alerts (T-3895). */
      const later = (minutes: number) => new Date(Date.now() + minutes * 60_000).toISOString();
      export const DEPARTURES = [
        { id: "urn:ngsi-ld:GtfsStop:hel.fi:helsinki:2222", name: "Tapiola (M)", departures: [
          { line: "2550", headsign: "Itäkeskus via Pasila and a long way round", expected: later(3), status: "scheduled" },
          { line: "31M1", headsign: "Vuosaari", expected: later(6), status: "canceled" },
        ] },
      ];
      export const ALERTS = [
        { id: "urn:ngsi-ld:Alert:hel.fi:helsinki:hsl-1", title: "Tapiola: lifts out of order at the metro station entrance", severity: "medium",
          body: "Use the stairs or the escalators at the other end of the platform.", lines: ["2550"], stops: ["2222"],
          places: [{ stop: "2222", coordinates: [24.805, 60.175] }] },
      ];

      /** What the served page did that it should not: a file it missed, an error it threw. */
      export interface Served {
        missing: string[];
        problems: string[];
      }

      /**
       * Serves the built bundle at the root of the App's host the way the binary does, with its snapshot and
       * one frame of its stream answered from `FLEET`. Other hosts (the basemap's tiles) are refused.
       */
      export async function serve(page: Page): Promise<Served> {
        const served: Served = { missing: [], problems: [] };
        page.on("pageerror", (error) => served.problems.push(error.message));

        await page.route("**/*", async (route) => {
          const url = new URL(route.request().url());
          if (url.origin !== ORIGIN) return route.abort();
          const path = url.pathname.slice(1);
          if (path === "api/vehicles") return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(FLEET) });
          if (path === "api/departures") return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(DEPARTURES) });
          if (path === "api/alerts") return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(ALERTS) });
          if (path === "api/stream") {
            return route.fulfill({ status: 200, contentType: "text/event-stream", body: `event: vehicles\ndata: ${JSON.stringify(FLEET)}\n\n` });
          }
          const file = normalize(path || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) {
            served.missing.push(url.pathname);
            return route.fulfill({ status: 404, body: "" });
          }
          let body = readFileSync(join(DIST, file));
          // The backend writes JC_APP_CONFIG into its page; the entity panel links a bus from it (SDK-40).
          if (file === "index.html") {
            body = Buffer.from(body.toString("utf8").replace("<head>", `<head><script id="jc-config" type="application/json">${JSON.stringify(CONFIG)}</script>`));
          }
          return route.fulfill({ status: 200, contentType: TYPES[extname(file)] ?? "application/octet-stream", body });
        });
        return served;
      }
    ui__index.html: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>HSL live</title>
        </head>
        <body>
          <div id="root"></div>
          <script type="module" src="/map-worker.ts"></script>
          <script type="module" src="/src/main.tsx"></script>
        </body>
      </html>
    ui__map-worker.ts: |
      // The map's worker, for the built application only. MapLibre looks for its worker beside its own
      // script, and a Vite build has no such file, so the map would never draw; this bundles the worker
      // with the library's shared chunk and hands the library its address. index.html loads it before
      // the application. The Portal's preview builds its own document and inlines the worker instead
      // (the SDK's mapWorkerReady), so it never loads this file.
      import { setWorkerUrl } from "maplibre-gl";
      import mapWorker from "maplibre-gl/dist/maplibre-gl-worker.mjs?worker&url";

      setWorkerUrl(mapWorker);
    ui__package.json: |
      {
        "name": "hsl-transport-ui",
        "private": true,
        "type": "module",
        "packageManager": "pnpm@10.20.0",
        "scripts": {
          "dev": "vite",
          "build": "tsc -b && vite build",
          "preview": "vite preview",
          "typecheck": "tsc -b --noEmit",
          "test": "vitest run",
          "e2e": "playwright test"
        },
        "dependencies": {
          "@joinedcontext/sdk": "0.1.0",
          "maplibre-gl": "^6.7.0",
          "react": "^19.2.8",
          "react-dom": "^19.2.8"
        },
        "devDependencies": {
          "@playwright/test": "1.63.0",
          "@testing-library/dom": "^10.4.0",
          "@testing-library/jest-dom": "^7.0.1",
          "@testing-library/react": "^16.3.3",
          "@testing-library/user-event": "^14.6.7",
          "@types/react": "^19.2.0",
          "@types/react-dom": "^19.2.0",
          "@vitejs/plugin-react": "^6.1.1",
          "jsdom": "^30.0.1",
          "typescript": "~5.9.3",
          "vite": "^8.2.2",
          "vitest": "^5.0.0"
        }
      }
    ui__playwright.config.ts: |
      import { defineConfig, devices } from "@playwright/test";

      // The built bundle in a real browser, the backend's snapshot and stream answered by e2e/serve.ts:
      // no binary and no endpoint. Run `pnpm build` first; the spec serves `dist/` itself.
      export default defineConfig({
        testDir: "./e2e",
        forbidOnly: Boolean(process.env.CI),
        reporter: process.env.CI ? "github" : "list",
        projects: [{ name: "chromium", use: { ...devices["Desktop Chrome"] } }],
      });
    ui__src__App.tsx: |
      import { useEffect, useMemo, useRef, useState } from "react";
      import { Map as MapLibreMap } from "maplibre-gl";
      import type { GeoJSONSource } from "maplibre-gl";
      import "maplibre-gl/dist/maplibre-gl.css";
      import { AppShell, Card, currentTokens, NO_BASEMAP, Page, Split, styleFor, useEntitySelection } from "@joinedcontext/sdk";
      import {
        alertPlaces,
        alertsFor,
        featureCollection,
        getAlerts,
        getDepartures,
        getVehicles,
        MODES,
        ofModes,
        when,
        type AlertView,
        type StopBoard,
        inView,
        lineColor,
        panelSource,
        perLine,
        speedBands,
        subscribe,
        type Bar,
        type Bounds,
        type Vehicle,
        type VehicleCollection,
      } from "./api";

      const SOURCE = "vehicles";
      const ALERTS = "alerts";
      /** The departures and alerts are read again this often; the backend reads them every 30 s. */
      const BOARD_MS = 30_000;
      const ARROW = "heading-arrow";
      const ARROW_SIZE = 24;
      const HELSINKI: [number, number] = [24.94, 60.17];

      /**
       * The project's basemap, as the page the App's server writes carries it: `#jc-config.basemap`,
       * the Portal's basemap route (AP-67, T-2928). The App names no tile host of its own; without a
       * configured basemap the map is the SDK's plain background and says so.
       */
      export function basemapOf(doc: Document = document): string | undefined {
        const basemap = pageConfig(doc).basemap;
        return typeof basemap === "string" && basemap.startsWith("https://") ? basemap : undefined;
      }

      /** The `#jc-config` the App's server writes into its page (`JC_APP_CONFIG`), or nothing. */
      function pageConfig(doc: Document): Record<string, unknown> {
        const text = doc.getElementById("jc-config")?.textContent;
        if (!text) return {};
        try {
          const parsed: unknown = JSON.parse(text);
          return parsed !== null && typeof parsed === "object" ? (parsed as Record<string, unknown>) : {};
        } catch {
          return {};
        }
      }

      /** The project's page in the Portal and the space, for the entity panel's link (SDK-40). */
      export function portalOf(doc: Document = document): { portal?: string; space?: string } {
        const { portal, space } = pageConfig(doc);
        return {
          ...(typeof portal === "string" && portal.startsWith("https://") ? { portal } : {}),
          ...(typeof space === "string" ? { space } : {}),
        };
      }

      /**
       * A white arrow pointing north on a transparent square, drawn pixel by pixel so the map needs no
       * sprite sheet and no canvas; the symbol layer turns it to each bus's heading.
       */
      export function arrowImage(size = ARROW_SIZE): { width: number; height: number; data: Uint8Array } {
        const data = new Uint8Array(size * size * 4);
        const middle = (size - 1) / 2;
        for (let y = 0; y < size; y += 1) {
          // Tip at the top, base at three quarters of the height, a third of the square wide there.
          const top = size * 0.2;
          const bottom = size * 0.72;
          if (y < top || y > bottom) continue;
          const half = ((y - top) / (bottom - top)) * (size * 0.26);
          for (let x = 0; x < size; x += 1) {
            if (Math.abs(x - middle) <= half) {
              data.set([255, 255, 255, 255], (y * size + x) * 4);
            }
          }
        }
        return { width: size, height: size, data };
      }

      /**
       * How live the map is: updating while the backend's feed is live, and since when it is lost when
       * it is not (T-3581), so a map that stopped moving says so instead of looking calm.
       */
      export function feedState(live: boolean, lostSince: string | null): string {
        if (lostSince) {
          const at = new Date(lostSince);
          const time = Number.isNaN(at.getTime())
            ? lostSince
            : at.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Helsinki" });
          return `, live feed lost since ${time}`;
        }
        return live ? ", updating live" : "";
      }

      /**
       * The fleet, seeded from the backend's snapshot and kept current by the stream. A message
       * carries only what moved, so it is merged into what is already on the map rather than
       * replacing it (AP-41).
       */
      export function useVehicles(): { vehicles: Vehicle[]; live: boolean; lostSince: string | null } {
        const [byId, setById] = useState<Map<string, Vehicle>>(new Map());
        const [live, setLive] = useState(false);
        const [lostSince, setLostSince] = useState<string | null>(null);

        useEffect(() => {
          let cancelled = false;
          const merge = (batch: Vehicle[]) => {
            if (cancelled || batch.length === 0) {
              return;
            }
            setById((current) => {
              const next = new Map(current);
              for (const vehicle of batch) {
                next.set(vehicle.id, vehicle);
              }
              return next;
            });
          };
          void getVehicles().then(merge);
          const close = subscribe(
            (batch) => {
              setLive(true);
              merge(batch);
            },
            (since) => !cancelled && setLostSince(since),
          );
          return () => {
            cancelled = true;
            close();
          };
        }, []);

        return { vehicles: [...byId.values()], live, lostSince };
      }

      /**
       * The departures and alerts, read when the page opens and every half minute after; what was read
       * last stays on the page when a read fails.
       */
      export function useBoard(): { stops: StopBoard[]; alerts: AlertView[] } {
        const [stops, setStops] = useState<StopBoard[]>([]);
        const [alerts, setAlerts] = useState<AlertView[]>([]);
        useEffect(() => {
          let cancelled = false;
          const read = () => {
            void getDepartures().then((next) => !cancelled && next.length > 0 && setStops(next));
            void getAlerts().then((next) => !cancelled && setAlerts(next));
          };
          read();
          const timer = setInterval(read, BOARD_MS);
          return () => {
            cancelled = true;
            clearInterval(timer);
          };
        }, []);
        return { stops, alerts };
      }

      type AlertCollection = ReturnType<typeof alertPlaces>;
      const NO_ALERTS: AlertCollection = alertPlaces([]);

      /** The map, and the one source every update writes to. */
      export function VehicleMap({
        collection,
        alerts = NO_ALERTS,
        onView,
        onPick,
        basemap,
      }: {
        collection: VehicleCollection;
        /** The stops HSL's alerts name, marked on the map. */
        alerts?: AlertCollection;
        /** The basemap's style URL; the SDK's plain background without one. */
        basemap?: string;
        /** Where the map looks, once it has loaded and after every pan or zoom. */
        onView?: (bounds: Bounds) => void;
        /** Called with the id of the bus a person clicks. */
        onPick?: (id: string) => void;
      }) {
        const reportView = useRef(onView);
        const pick = useRef(onPick);
        useEffect(() => {
          reportView.current = onView;
          pick.current = onPick;
        }, [onView, onPick]);
        const container = useRef<HTMLDivElement>(null);
        const map = useRef<MapLibreMap | null>(null);
        const [ready, setReady] = useState(false);

        useEffect(() => {
          if (!container.current || map.current) {
            return;
          }
          const instance = new MapLibreMap({
            container: container.current,
            style: styleFor(basemap),
            center: HELSINKI,
            zoom: 11,
          });
          map.current = instance;
          instance.on("load", () => {
            // The alerts' stops under the vehicles: a ring in the tokens' danger colour.
            instance.addSource(ALERTS, { type: "geojson", data: alerts });
            instance.addLayer({
              id: "alert-stops",
              type: "circle",
              source: ALERTS,
              paint: {
                "circle-radius": 7,
                "circle-color": "#ffffff",
                "circle-stroke-width": 3,
                "circle-stroke-color": currentTokens().color.danger,
              },
            });
            instance.addSource(SOURCE, { type: "geojson", data: collection });
            instance.addLayer({
              id: "vehicle-dots",
              type: "circle",
              source: SOURCE,
              paint: {
                "circle-radius": 9,
                "circle-color": ["get", "color"],
                "circle-stroke-width": 2,
                "circle-stroke-color": "#ffffff",
              },
            });
            if (!instance.hasImage(ARROW)) {
              instance.addImage(ARROW, arrowImage());
            }
            // The heading, on top of the line's colour: the arrow turns with the map, so north on the
            // bus is north on the ground.
            instance.addLayer({
              id: "vehicle-heading",
              type: "symbol",
              source: SOURCE,
              layout: {
                "icon-image": ARROW,
                "icon-size": 0.6,
                "icon-rotate": ["get", "bearing"],
                "icon-rotation-alignment": "map",
                "icon-allow-overlap": true,
                "icon-ignore-placement": true,
              },
            });
            setReady(true);
            // The container may have taken its final size after the map measured it (the page's grid
            // settles once the charts beside it render): measure again before saying where it looks.
            instance.resize();
            reportView.current?.(instance.getBounds().toArray() as Bounds);
          });
          // A bus clicked opens in the shell's entity panel; the map is built once, so the handler
          // calls whichever pick the page holds now.
          instance.on("click", "vehicle-dots", (event: { features?: Array<{ properties?: Record<string, unknown> }> }) => {
            const id = event.features?.[0]?.properties?.id;
            if (typeof id === "string") pick.current?.(id);
          });
          const report = () => reportView.current?.(instance.getBounds().toArray() as Bounds);
          instance.on("moveend", report);
          instance.on("resize", report);
          return () => {
            instance.remove();
            map.current = null;
          };
          // The collection is deliberately not a dependency: the map is built once and every later
          // fleet reaches it through setData below, which is what keeps a moving bus from
          // rebuilding the layer on every frame.
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, []);

        useEffect(() => {
          if (!ready) {
            return;
          }
          const source = map.current?.getSource(SOURCE) as GeoJSONSource | undefined;
          source?.setData(collection);
        }, [collection, ready]);

        useEffect(() => {
          if (!ready) {
            return;
          }
          const source = map.current?.getSource(ALERTS) as GeoJSONSource | undefined;
          source?.setData(alerts);
        }, [alerts, ready]);

        return (
          <>
            <div className="map" ref={container} data-testid="map" role="application" aria-label="Vehicle map" />
            {!basemap && <p className="note">{NO_BASEMAP}</p>}
          </>
        );
      }

      /**
       * A bar per row as plain HTML: a screen reader reads it as the list it is, it wraps on a phone,
       * and the bar's length is the only style computed from the data (its colour is a token).
       */
      export function BarChart({ title, bars, note }: { title: string; bars: Bar[]; note?: string }) {
        const most = Math.max(1, ...bars.map((bar) => bar.value));
        return (
          <Card title={title}>
            {bars.every((bar) => bar.value === 0) ? (
              <p className="empty">No vehicles in view.</p>
            ) : (
              <ol className="bars" aria-label={title}>
                {bars.map((bar) => (
                  <li className="bar" key={bar.label}>
                    <span className="bar-label">{bar.label}</span>
                    <span className="bar-track" aria-hidden="true">
                      <span
                        className="bar-fill"
                        data-testid="bar-fill"
                        style={{ width: `${(bar.value / most) * 100}%`, background: bar.color }}
                      />
                    </span>
                    <span className="bar-value">{bar.value}</span>
                  </li>
                ))}
              </ol>
            )}
            {note && <p className="note">{note}</p>}
          </Card>
        );
      }

      /**
       * The live buses in the SDK's shell (SDK-39): a bus clicked on the map, or chosen from the list of
       * those in view, opens in the shell's entity panel (SDK-40), read from this app's own backend.
       */
      export function App() {
        const source = useMemo(() => panelSource(portalOf()), []);
        return <AppShell title="HSL live" pages={[{ id: "buses", label: "HSL live", render: () => <BusesLive /> }]} source={source} language="en" />;
      }

      /** The modes to draw: every one at first; a person ticks off what they do not want to see. */
      export function ModeFilter({ vehicles, modes, onChange }: { vehicles: Vehicle[]; modes: ReadonlySet<string>; onChange: (modes: Set<string>) => void }) {
        const count = (mode: string) => vehicles.filter((vehicle) => (vehicle.mode ?? "bus") === mode).length;
        return (
          <fieldset className="modes">
            <legend>Show</legend>
            {MODES.map((mode) => (
              <label key={mode}>
                <input
                  type="checkbox"
                  checked={modes.has(mode)}
                  onChange={(event) => {
                    const next = new Set(modes);
                    if (event.target.checked) next.add(mode);
                    else next.delete(mode);
                    onChange(next);
                  }}
                />
                {`${mode} (${count(mode)})`}
              </label>
            ))}
          </fieldset>
        );
      }

      /** The next departures from one stop, chosen from the stops that have them. */
      export function Departures({ stops, now = Date.now() }: { stops: StopBoard[]; now?: number }) {
        const [chosen, setChosen] = useState("");
        const stop = stops.find((candidate) => candidate.id === chosen) ?? stops[0];
        return (
          <Card title="Departures">
            {stops.length === 0 ? (
              <p className="empty">No departures yet.</p>
            ) : (
              <>
                <label className="pick">
                  <span>Stop</span>
                  <select value={stop?.id ?? ""} onChange={(event) => setChosen(event.target.value)}>
                    {stops.map((candidate) => (
                      <option key={candidate.id} value={candidate.id}>
                        {candidate.name}
                      </option>
                    ))}
                  </select>
                </label>
                <ol className="departures" aria-label={`Departures from ${stop.name}`}>
                  {stop.departures.map((departure, index) => (
                    <li key={`${departure.line}-${departure.expected}-${index}`} className={departure.status === "scheduled" ? "departure" : "departure off"}>
                      <span className="departure-line">{departure.line}</span>
                      <span className="departure-to">{departure.headsign ?? ""}</span>
                      <span className="departure-when">
                        {departure.status === "canceled" ? "cancelled" : departure.status === "skipped" ? "skips this stop" : when(departure.expected, now)}
                      </span>
                    </li>
                  ))}
                </ol>
              </>
            )}
          </Card>
        );
      }

      /** HSL's service alerts, all or those on one line; the text is HSL's and rendered as text. */
      export function Alerts({ alerts }: { alerts: AlertView[] }) {
        const [line, setLine] = useState("");
        const lines = useMemo(
          () => [...new Set(alerts.flatMap((alert) => alert.lines))].sort((a, b) => a.localeCompare(b, "en", { numeric: true })),
          [alerts],
        );
        const shown = alertsFor(alerts, line || undefined);
        return (
          <Card title="Service alerts">
            {alerts.length === 0 ? (
              <p className="empty">No service alerts.</p>
            ) : (
              <>
                {lines.length > 0 && (
                  <label className="pick">
                    <span>Line</span>
                    <select value={line} onChange={(event) => setLine(event.target.value)}>
                      <option value="">All lines</option>
                      {lines.map((candidate) => (
                        <option key={candidate} value={candidate}>
                          {candidate}
                        </option>
                      ))}
                    </select>
                  </label>
                )}
                {shown.length === 0 ? (
                  <p className="empty">{`No alerts on line ${line}.`}</p>
                ) : (
                  <ul className="alerts" aria-label="Service alerts">
                    {shown.map((alert) => (
                      <li key={alert.id} className={`alert ${alert.severity ?? ""}`}>
                        <strong>{alert.title}</strong>
                        {alert.body && <p>{alert.body}</p>}
                        {alert.lines.length > 0 && <p className="note">{`Lines ${alert.lines.join(", ")}`}</p>}
                      </li>
                    ))}
                  </ul>
                )}
              </>
            )}
          </Card>
        );
      }

      function BusesLive() {
        const { vehicles: fleet, live, lostSince } = useVehicles();
        const { stops, alerts } = useBoard();
        const [modes, setModes] = useState<Set<string>>(() => new Set(MODES));
        const vehicles = useMemo(() => ofModes(fleet, modes), [fleet, modes]);
        const places = useMemo(() => alertPlaces(alerts), [alerts]);
        const { selected, select } = useEntitySelection();
        const [bounds, setBounds] = useState<Bounds | undefined>(undefined);
        const [basemap] = useState(() => basemapOf());
        const collection = useMemo(() => featureCollection(vehicles), [vehicles]);
        // The charts and the legend follow the map: what they count is what the person looks at.
        const shown = useMemo(() => inView(vehicles, bounds), [vehicles, bounds]);
        const lines = useMemo(() => perLine(shown), [shown]);
        const speeds = useMemo(() => speedBands(shown), [shown]);
        const legend = useMemo(
          () => [...new Set(shown.map((vehicle) => vehicle.refLine).filter(Boolean))].sort((a, b) =>
            (a as string).localeCompare(b as string, "en", { numeric: true }),
          ) as string[],
          [shown],
        );

        return (
          <div className="app">
            <Page width="full">
              <p className="status" role="status">
                {vehicles.length === 0
                  ? fleet.length === 0
                    ? "Waiting for the first positions"
                    : "No vehicles of the chosen modes"
                  : `${vehicles.length} vehicles${feedState(live, lostSince)}${bounds && shown.length !== vehicles.length ? `, ${shown.length} in view` : ""}`}
              </p>
              <Split ratio="2:1">
                <div className="map-pane">
                  <ModeFilter vehicles={fleet} modes={modes} onChange={setModes} />
                  <VehicleMap collection={collection} alerts={places} onView={setBounds} onPick={(id) => select({ id, type: "Vehicle" })} basemap={basemap} />
                  {shown.length > 0 && (
                    <label className="pick">
                      <span>Open a vehicle</span>
                      <select value={selected?.id ?? ""} onChange={(event) => event.target.value && select({ id: event.target.value, type: "Vehicle" })}>
                        <option value="">—</option>
                        {[...shown]
                          .sort((a, b) => a.id.localeCompare(b.id, "en", { numeric: true }))
                          .map((vehicle) => (
                            <option key={vehicle.id} value={vehicle.id}>
                              {`${vehicle.id.slice(vehicle.id.lastIndexOf(":") + 1)}${vehicle.refLine ? `, line ${vehicle.refLine}` : ""}`}
                            </option>
                          ))}
                      </select>
                    </label>
                  )}
                  {legend.length > 0 && (
                    <ul className="lines" aria-label="Lines on the map">
                      {legend.map((line) => (
                        <li className="line" key={line}>
                          <span className="swatch" style={{ background: lineColor(line) }} />
                          {line}
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
                <div className="charts">
                  <Departures stops={stops} />
                  <Alerts alerts={alerts} />
                  <BarChart title="Vehicles per line" bars={lines} />
                  <BarChart
                    title="Speed"
                    bars={speeds.bars}
                    note={speeds.unknown > 0 ? `${speeds.unknown} without a speed reading` : undefined}
                  />
                </div>
              </Split>
            </Page>
          </div>
        );
      }
    ui__src__api.ts: |
      /**
       * The app's own backend, and nothing else. The Endpoint URL never reaches the browser: the
       * server holds it, follows its WebSocket once for every viewer and pushes what moved down this stream
       * (AP-04, AP-41). There is no login anywhere in this file, because the Endpoint behind the
       * app is public and the app never sees a user (AP-28).
       */
      import { currentTokens, portalLinkOf, ProblemError, type DesignTokens, type PanelSource, type Row, type SelectedEntity } from "@joinedcontext/sdk";

      const BASE = import.meta.env.BASE_URL;

      export interface Vehicle {
        id: string;
        /** `[longitude, latitude]`, the GeoJSON order. */
        coordinates: [number, number];
        bearing?: number;
        speed?: number;
        refLine?: string;
        /** bus, tram, metro, train or ferry; a vehicle written before modes were (T-3893) is a bus. */
        mode?: string;
      }

      export interface VehicleFeature {
        type: "Feature";
        id: string;
        geometry: { type: "Point"; coordinates: [number, number] };
        properties: { id: string; color: string; bearing: number; refLine: string; speed?: number };
      }

      export interface VehicleCollection {
        type: "FeatureCollection";
        features: VehicleFeature[];
      }

      /** The fleet as the backend last saw it. A 503 means no read has produced one yet. */
      export async function getVehicles(): Promise<Vehicle[]> {
        const response = await fetch(`${BASE}api/vehicles`);
        if (!response.ok) {
          return [];
        }
        return (await response.json()) as Vehicle[];
      }

      /**
       * Every bus that moves. The first message carries the whole fleet, so a browser that opens
       * the stream alone is already drawing. `onFeed` hears since when the backend's live feed is
       * lost (an ISO time), or `null` once it is live again (T-3581). Returns the function that
       * closes the stream.
       */
      export function subscribe(
        onVehicles: (vehicles: Vehicle[]) => void,
        onFeed: (lostSince: string | null) => void = () => {},
      ): () => void {
        const source = new EventSource(`${BASE}api/stream`);
        source.addEventListener("vehicles", (event) => {
          try {
            onVehicles(JSON.parse((event as MessageEvent<string>).data) as Vehicle[]);
          } catch {
            // A malformed frame is one lost update, not a reason to tear the map down.
          }
        });
        source.addEventListener("feed", (event) => {
          try {
            const { lostSince } = JSON.parse((event as MessageEvent<string>).data) as { lostSince?: unknown };
            onFeed(typeof lostSince === "string" ? lostSince : null);
          } catch {
            // As above: one lost status, the next one comes with the next change.
          }
        });
        return () => source.close();
      }

      /**
       * One colour per line, from the design tokens' chart palette (AP-123), so two buses on the 550
       * look like the same route without anybody maintaining a colour table, and no entity value ever
       * becomes CSS. A line the Policy hides falls back to the tokens' muted colour.
       */
      export function lineColor(refLine: string | undefined, tokens: DesignTokens = currentTokens()): string {
        if (!refLine) {
          return tokens.color.muted;
        }
        let hash = 0;
        for (const character of refLine) {
          hash = (hash * 31 + character.charCodeAt(0)) % 9973;
        }
        // A grey in the palette reads as "no line"; lines take the palette's colours only.
        const colours = tokens.chart.palette.filter(chromatic);
        const palette = colours.length > 0 ? colours : tokens.chart.palette;
        return palette[hash % palette.length];
      }

      function channels(hex: string): [number, number, number] | undefined {
        const match = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
        return match ? [parseInt(match[1], 16), parseInt(match[2], 16), parseInt(match[3], 16)] : undefined;
      }

      /** A colour, not a grey: its channels spread by more than a fifth of the range. */
      function chromatic(hex: string): boolean {
        const rgb = channels(hex);
        return rgb !== undefined && Math.max(...rgb) - Math.min(...rgb) > 51;
      }

      /** `share` of the way from `from` to `to`, both `#rrggbb`; `from` when either is not. */
      export function mix(from: string, to: string, share: number): string {
        const a = channels(from);
        const b = channels(to);
        if (!a || !b) return from;
        const t = Math.min(1, Math.max(0, share));
        return `#${a.map((value, index) => Math.round(value + (b[index] - value) * t).toString(16).padStart(2, "0")).join("")}`;
      }

      /** `[[west, south], [east, north]]`, as MapLibre's `getBounds().toArray()` answers. */
      export type Bounds = [[number, number], [number, number]];

      /** The buses inside the map's view; every bus while the map has not said where it looks. */
      export function inView(vehicles: Vehicle[], bounds: Bounds | undefined): Vehicle[] {
        if (!bounds) {
          return vehicles;
        }
        const [[west, south], [east, north]] = bounds;
        return vehicles.filter(({ coordinates: [longitude, latitude] }) =>
          longitude >= west && longitude <= east && latitude >= south && latitude <= north,
        );
      }

      export interface Bar {
        label: string;
        value: number;
        color: string;
      }

      /** What the per-line chart calls a bus whose line the Policy hides. */
      export const NO_LINE = "Line not shown";

      /** Buses per line, most first, a tie in line order, at most `top` lines (the rest are summed). */
      export function perLine(vehicles: Vehicle[], top = 15, tokens: DesignTokens = currentTokens()): Bar[] {
        const counts = new Map<string, number>();
        for (const { refLine } of vehicles) {
          const line = refLine || NO_LINE;
          counts.set(line, (counts.get(line) ?? 0) + 1);
        }
        const sorted = [...counts].sort(([a, x], [b, y]) => y - x || a.localeCompare(b, "en", { numeric: true }));
        const bars = sorted.slice(0, top).map(([line, value]) => ({
          label: line,
          value,
          color: lineColor(line === NO_LINE ? undefined : line, tokens),
        }));
        const rest = sorted.slice(top).reduce((sum, [, value]) => sum + value, 0);
        return rest > 0 ? [...bars, { label: "Other lines", value: rest, color: tokens.color.muted }] : bars;
      }

      /** The speed chart's bands in km/h: the stream carries metres per second (HFP `spd`). */
      export const SPEED_BANDS = [0, 10, 20, 30, 40, 50, 60] as const;

      /**
       * Buses per speed band, every band present so the chart keeps its shape; a bus that reports no
       * speed is counted apart rather than as standing still.
       */
      export function speedBands(vehicles: Vehicle[], tokens: DesignTokens = currentTokens()): { bars: Bar[]; unknown: number } {
        const counts: number[] = SPEED_BANDS.map(() => 0);
        let unknown = 0;
        for (const { speed } of vehicles) {
          if (speed === undefined || !Number.isFinite(speed) || speed < 0) {
            unknown += 1;
            continue;
          }
          const kmh = speed * 3.6;
          let band = SPEED_BANDS.length - 1;
          while (band > 0 && kmh < SPEED_BANDS[band]) band -= 1;
          counts[band] += 1;
        }
        // Slow to fast through the tokens' own colours: the map's low, success, warning, the map's high
        // and danger, each band on the way between two of them (AP-123).
        const ramp = [tokens.map.low, tokens.color.success, tokens.color.warning, tokens.map.high, tokens.color.danger];
        const at = (share: number): string => {
          const position = share * (ramp.length - 1);
          const stop = Math.min(ramp.length - 2, Math.floor(position));
          return mix(ramp[stop], ramp[stop + 1], position - stop);
        };
        const bars = SPEED_BANDS.map((from, index) => ({
          label: index === SPEED_BANDS.length - 1 ? `${from}+ km/h` : `${from}–${SPEED_BANDS[index + 1]} km/h`,
          value: counts[index],
          color: at(index / (SPEED_BANDS.length - 1)),
        }));
        return { bars, unknown };
      }

      /** The fleet as the map source reads it. */
      export function featureCollection(vehicles: Vehicle[]): VehicleCollection {
        return {
          type: "FeatureCollection",
          features: vehicles.map((vehicle) => ({
            type: "Feature",
            id: vehicle.id,
            geometry: { type: "Point", coordinates: vehicle.coordinates },
            properties: {
              id: vehicle.id,
              color: lineColor(vehicle.refLine),
              // The arrow needs a number; a hidden bearing points north rather than disappearing.
              bearing: vehicle.bearing ?? 0,
              refLine: vehicle.refLine ?? "",
              ...(vehicle.speed === undefined ? {} : { speed: vehicle.speed }),
            },
          })),
        };
      }

      /**
       * Where the shell's entity panel reads a bus (SDK-40): from this app's own backend, which holds
       * the endpoint, the bus as the last notification left it. The app writes nothing, so the panel never offers
       * Edit; it links the bus to the Portal when the page names the project's page there.
       */
      export function panelSource(page: { portal?: string; space?: string }): PanelSource {
        return {
          async get(entity: SelectedEntity): Promise<Row> {
            const vehicle = (await getVehicles()).find((candidate) => candidate.id === entity.id);
            if (!vehicle) throw new ProblemError(404, { title: "This bus is no longer reported." });
            return {
              id: vehicle.id,
              type: "Vehicle",
              location: { type: "Point", coordinates: vehicle.coordinates },
              ...(vehicle.refLine ? { route: vehicle.refLine } : {}),
              ...(vehicle.speed !== undefined ? { speed: vehicle.speed } : {}),
              ...(vehicle.bearing !== undefined ? { heading: vehicle.bearing } : {}),
            };
          },
          async update() {
            throw new ProblemError(403, { title: "This app writes nothing." });
          },
          mayEdit: () => false,
          portalLink: (entity) => (page.portal && page.space ? portalLinkOf(page.portal, page.space, entity.id) : null),
          language: "en",
        };
      }

      /** HSL's modes, in the order the filter shows them (T-3893). */
      export const MODES = ["bus", "tram", "metro", "train", "ferry"] as const;

      /** The vehicles of the chosen modes; one without a mode counts as a bus. */
      export function ofModes(vehicles: Vehicle[], modes: ReadonlySet<string>): Vehicle[] {
        return vehicles.filter((vehicle) => modes.has(vehicle.mode ?? "bus"));
      }

      export interface Departure {
        line: string;
        headsign?: string;
        /** ISO 8601, UTC. */
        expected: string;
        /** scheduled, skipped or canceled. */
        status: string;
        /** Seconds behind the timetable, when HSL sends it. */
        delay?: number;
      }

      export interface StopBoard {
        id: string;
        name: string;
        coordinates?: [number, number];
        departures: Departure[];
      }

      export interface AlertView {
        id: string;
        /** HSL's text; rendered as text, never as HTML. */
        title: string;
        body?: string;
        severity?: string;
        validFrom?: string;
        validTo?: string;
        lines: string[];
        stops: string[];
        places: Array<{ stop: string; coordinates: [number, number] }>;
      }

      /** A JSON array from the backend, or nothing: a 503 before its first read, or no backend. */
      async function listOf(path: string): Promise<unknown[]> {
        try {
          const response = await fetch(`${BASE}${path}`);
          if (!response.ok) return [];
          const body: unknown = await response.json();
          return Array.isArray(body) ? body : [];
        } catch {
          return [];
        }
      }

      /** The stops with departures, by name (T-3891). */
      export async function getDepartures(): Promise<StopBoard[]> {
        return (await listOf("api/departures")).filter(
          (stop): stop is StopBoard =>
            typeof (stop as StopBoard)?.id === "string" && Array.isArray((stop as StopBoard).departures),
        );
      }

      /** HSL's service alerts, most severe first (T-3892). */
      export async function getAlerts(): Promise<AlertView[]> {
        return (await listOf("api/alerts")).filter(
          (alert): alert is AlertView =>
            typeof (alert as AlertView)?.title === "string" && Array.isArray((alert as AlertView).lines),
        );
      }

      /** The alerts on a line, or every alert without one. */
      export function alertsFor(alerts: AlertView[], line: string | undefined): AlertView[] {
        return line ? alerts.filter((alert) => alert.lines.includes(line)) : alerts;
      }

      /** Whole minutes from `now` to `expected`, never below zero; undefined for a time it cannot read. */
      export function minutesUntil(expected: string, now: number = Date.now()): number | undefined {
        const at = Date.parse(expected);
        if (Number.isNaN(at)) return undefined;
        return Math.max(0, Math.floor((at - now) / 60000));
      }

      /** "now", "1 min", "12 min", or the clock time an hour or more ahead. */
      export function when(expected: string, now: number = Date.now()): string {
        const minutes = minutesUntil(expected, now);
        if (minutes === undefined) return "";
        if (minutes === 0) return "now";
        if (minutes < 60) return `${minutes} min`;
        return new Date(expected).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Helsinki" });
      }

      export interface AlertFeature {
        type: "Feature";
        id: string;
        geometry: { type: "Point"; coordinates: [number, number] };
        properties: { alert: string; stop: string; title: string };
      }

      /** One point per stop an alert names and the space places, for the map's alert layer. */
      export function alertPlaces(alerts: AlertView[]): { type: "FeatureCollection"; features: AlertFeature[] } {
        return {
          type: "FeatureCollection",
          features: alerts.flatMap((alert) =>
            alert.places.map((place) => ({
              type: "Feature" as const,
              id: `${alert.id}#${place.stop}`,
              geometry: { type: "Point" as const, coordinates: place.coordinates },
              properties: { alert: alert.id, stop: place.stop, title: alert.title },
            })),
          ),
        };
      }
    ui__src__index.css: |
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        --surface: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #0f172a;
          --ink: #e2e8f0;
          --muted: #94a3b8;
          --line: #1e293b;
          /* The SDK's shell, panel and cards read these; without them they stay light under the dark
             page's ink. */
          --jc-color-surface: #0f172a;
          --jc-color-accent: #93c5fd;
          --jc-color-card: #111c33;
          --jc-color-line: #1e293b;
          --jc-color-ink: #e2e8f0;
          --jc-color-muted: #94a3b8;
        }
      }

      .jc-card {
        color: var(--ink);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--surface);
      }

      /* The SDK's Page and Header (T-2825, SDK-12) around the map and its charts: on a laptop and wider
         the map takes two thirds of the window's height beside the charts, on a phone the map comes
         first at a phone's worth of height and the charts follow below it (T-2926). */
      .app .jc-page {
        padding: var(--jc-gutter, 0.75rem);
      }

      .status {
        color: var(--muted);
        font-size: 0.875rem;
      }

      .map-pane {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        min-width: 0;
      }

      .map {
        height: 60dvh;
        min-height: 18rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }

      @media (min-width: 48rem) {
        .map {
          height: calc(100dvh - 9rem);
        }
      }

      .charts {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-width: 0;
      }

      .bars {
        display: grid;
        gap: 0.35rem;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 0.875rem;
      }

      .bar {
        display: grid;
        grid-template-columns: minmax(3.5rem, 7rem) 1fr 2.5rem;
        align-items: center;
        gap: 0.5rem;
      }

      .bar-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .bar-track {
        height: 0.8rem;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }

      .bar-fill {
        display: block;
        height: 100%;
        border-radius: 3px;
      }

      .bar-value {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .empty,
      .note {
        margin: 0.4rem 0 0;
        color: var(--muted);
        font-size: 0.875rem;
      }

      .lines {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 0.875rem;
      }

      .line {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }

      .swatch {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
      }

      /* MapLibre's attribution is a link inside a line of text, told apart by colour alone
         (axe link-in-text-block, T-3045); the element is the library's DOM, so it is dressed here. */
      .maplibregl-ctrl-attrib a {
        text-decoration: underline;
      }

      /* The keyboard's way to a bus: the ones in view, by fleet number, each opening in the panel. */
      .pick {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--jc-space-2, 0.5rem);
        margin-top: var(--jc-space-2, 0.5rem);
      }
      .pick select {
        font: inherit;
        max-width: 100%;
      }

      /* T-3895: the mode filter above the map, the departures and the service alerts beside it. */
      .modes {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 0.9rem;
        margin: 0;
        padding: 0.4rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      .modes label {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        min-height: 2.75rem;
      }

      .departures,
      .alerts {
        list-style: none;
        margin: 0.5rem 0 0;
        padding: 0;
      }

      .departure {
        display: grid;
        grid-template-columns: 4.5rem minmax(0, 1fr) auto;
        gap: 0.5rem;
        padding: 0.3rem 0;
        border-bottom: 1px solid var(--line);
      }

      .departure.off {
        color: var(--muted);
        text-decoration: line-through;
      }

      .departure-line {
        font-weight: 600;
      }

      .departure-to {
        overflow-wrap: anywhere;
      }

      .alert {
        padding: 0.4rem 0;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }

      .alert p {
        margin: 0.25rem 0 0;
      }
