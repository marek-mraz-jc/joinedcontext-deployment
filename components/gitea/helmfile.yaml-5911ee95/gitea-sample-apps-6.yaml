    src__server.ts: |
      /**
       * The App's server, `/apps/air-weather-explorer/api` (T-3348): each station's hourly means, kept
       * on the server and read from the city's data only for the hours it has not kept yet; comparisons
       * saved under a code a link carries; and CSV exports, downloaded from the store through a
       * short-lived URL the server hands out.
       */
      import { ServerProblem } from "./problem";
      import type { Pollutant, Variable } from "./stations";

      export { ServerProblem };

      /** Each attribute's hourly means, `[hour start ms, value]`. */
      export type Hourly = Record<string, Array<[number, number]>>;

      export interface Series {
        air: Hourly;
        weather: Hourly;
      }

      export interface Comparison {
        name: string | null;
        /** The stations' full ids. */
        station: string;
        weather: string;
        days: number;
        smoothing: number;
        air: Pollutant | null;
        variable: Variable | null;
      }

      /** The signed-in person as the App's server knows them, `null` when signed out. */
      export interface Me {
        id: string;
        name: string;
        roles: string[];
      }

      /** A place a reader keeps: an air quality station, a pollutant, the level that alerts them. */
      export interface NewPlace {
        station: string;
        name: string;
        attr: "pm10" | "pm25" | "airQualityIndex";
        threshold: number;
      }

      /** A kept place, with the latest hourly mean the server holds for it (`null` before any). */
      export interface Place extends NewPlace {
        id: number;
        latest: number | null;
        latestHour: number | null;
      }

      /** A period of a station's readings a steward marked faulty, in epoch milliseconds. */
      export interface Fault {
        id: number;
        station: string;
        from: number;
        to: number;
        note: string;
      }

      /** One change as the history keeps it. */
      export interface HistoryRow {
        id: number;
        at: string;
        actorName: string;
        action: "insert" | "update" | "delete" | "edit";
        target: string;
        summary: string;
      }

      /** Where the server answers: `/apps/{appName}/api`, the App's name from `#jc-config`. */
      export function apiBase(doc: Document = document): string {
        const text = doc.getElementById("jc-config")?.textContent ?? "";
        let name = "";
        try {
          name = String((JSON.parse(text || "{}") as { appName?: unknown }).appName ?? "");
        } catch {
          name = "";
        }
        return `/apps/${name && /^[a-z0-9-]+$/.test(name) ? name : "air-weather-explorer"}/api`;
      }

      /** A code as the server makes them: 12 lowercase letters or digits. */
      export function isCode(code: string): boolean {
        return /^[a-z0-9]{12}$/.test(code);
      }

      async function call<T>(base: string, method: string, path: string, body?: unknown): Promise<T> {
        let answer: Response;
        try {
          answer = await fetch(`${base}${path}`, {
            method,
            credentials: "same-origin",
            headers: body === undefined ? { Accept: "application/json" } : { Accept: "application/json", "Content-Type": "application/json" },
            body: body === undefined ? undefined : JSON.stringify(body),
          });
        } catch {
          throw new ServerProblem(0, "");
        }
        if (!answer.ok) {
          const problem = (await answer.json().catch(() => ({}))) as { detail?: unknown };
          throw new ServerProblem(answer.status, typeof problem.detail === "string" ? problem.detail : "");
        }
        return (answer.status === 204 ? undefined : await answer.json()) as T;
      }

      export function airApi(base: string) {
        return {
          series: (air: string, weather: string, days: number) =>
            call<Series>(base, "GET", `/series?${new URLSearchParams({ air, weather, days: String(days) }).toString()}`),
          save: (comparison: Comparison) => call<{ code: string; name: string | null }>(base, "POST", "/comparisons", comparison),
          open: (code: string) => call<Comparison & { code: string }>(base, "GET", `/comparisons/${encodeURIComponent(code)}`),
          exportUrl: async (air: string, weather: string, days: number) => (await call<{ url: string }>(base, "POST", "/exports", { air, weather, days })).url,
          me: () => call<Me | null>(base, "GET", "/me"),
          places: () => call<Place[]>(base, "GET", "/places"),
          addPlace: (place: NewPlace) => call<Place>(base, "POST", "/places", place),
          changePlace: (id: number, name: string, threshold: number) => call<void>(base, "PUT", `/places/${id}`, { name, threshold }),
          removePlace: (id: number) => call<void>(base, "DELETE", `/places/${id}`),
          faults: (station: string) => call<Fault[]>(base, "GET", `/faults?${new URLSearchParams({ station }).toString()}`),
          markFault: (fault: Omit<Fault, "id">) => call<Fault>(base, "POST", "/faults", fault),
          unmarkFault: (id: number) => call<void>(base, "DELETE", `/faults/${id}`),
          history: () => call<HistoryRow[]>(base, "GET", "/history"),
        };
      }

      export type AirApi = ReturnType<typeof airApi>;

      /** The address that opens a saved comparison: this page with `?compare=` and nothing else. */
      export function compareLink(code: string, location: Pick<Location, "origin" | "pathname"> = window.location): string {
        return `${location.origin}${location.pathname}?compare=${code}`;
      }
    src__stations.test.ts: |
      import { describe, expect, it } from "vitest";
      import type { Row } from "@joinedcontext/sdk";
      import { kmBetween, localOf, nearest, stationsOf } from "./stations";

      const station = (local: string, name: string, at: [number, number] | null) =>
        ({ id: `urn:ngsi-ld:WeatherObserved:hel.fi:helsinki:${local}`, type: "WeatherObserved", name, ...(at ? { location: { type: "Point", coordinates: at } } : {}) }) as Row;

      describe("stations", () => {
        it("lists the stations by name, an unnamed one by its id", () => {
          const list = stationsOf([station("b", "Pasila", [24.93, 60.2]), station("a", "", null), station("c", "Kallio", [24.95, 60.18])]);
          expect(list.map((s) => s.name)).toEqual(["a", "Kallio", "Pasila"]);
          expect(list[0].at).toBeNull();
          expect(localOf("urn:ngsi-ld:WeatherObserved:hel.fi:helsinki:fmi-100971")).toBe("fmi-100971");
        });

        it("pairs a station with the nearest weather station that has a place", () => {
          const weather = stationsOf([station("airport", "Airport", [24.97, 60.33]), station("lost", "Lost", null), station("kaisaniemi", "Kaisaniemi", [24.94, 60.18])]);
          const kallio = stationsOf([station("kallio", "Kallio", [24.95, 60.19])])[0];
          const found = nearest(kallio, weather);
          expect(found?.station.local).toBe("kaisaniemi");
          expect(found?.km).toBeCloseTo(kmBetween([24.95, 60.19], [24.94, 60.18]), 6);
          expect(nearest(kallio, [])).toBeNull();
          const nowhere = stationsOf([station("x", "X", null)])[0];
          expect(nearest(nowhere, weather)?.km).toBeNull();
        });

        it("measures the great circle, across the antimeridian too", () => {
          expect(kmBetween([24.9446, 60.1752], [24.9727, 60.3294])).toBeCloseTo(17.2, 1);
          expect(kmBetween([180, 0], [-180, 0])).toBeCloseTo(0, 6);
        });
      });
    src__stations.ts: |
      import { format, pointOf } from "@joinedcontext/sdk";
      import type { Row } from "@joinedcontext/sdk";

      /** The two entity types the app's data needs name (AP-04). */
      export const AIR = "AirQualityObserved";
      export const WEATHER = "WeatherObserved";

      /** What the page compares, exactly the attributes app.yaml names. */
      export const POLLUTANTS = ["pm10", "pm25", "airQualityIndex"] as const;
      export const VARIABLES = ["temperature", "windSpeed", "relativeHumidity", "precipitation"] as const;
      export type Pollutant = (typeof POLLUTANTS)[number];
      export type Variable = (typeof VARIABLES)[number];

      /** The attributes the station lists read. */
      export const PLACE_ATTRS = ["name", "location", "dateObserved"];

      export interface Station {
        id: string;
        local: string;
        name: string;
        at: [number, number] | null;
      }

      /** The end of an id: short enough for the address, unique in the city's feed. */
      export function localOf(id: string): string {
        return id.slice(id.lastIndexOf(":") + 1);
      }

      /** The rows as stations, by name. */
      export function stationsOf(rows: Row[]): Station[] {
        return rows
          .map((row) => ({ id: row.id, local: localOf(row.id), name: format(row.name).trim() || localOf(row.id), at: pointOf(row.location) }))
          .sort((a, b) => a.name.localeCompare(b.name, "fi") || a.id.localeCompare(b.id));
      }

      /** The great-circle distance between two `[lon, lat]` points, in kilometres. */
      export function kmBetween(a: [number, number], b: [number, number]): number {
        const rad = Math.PI / 180;
        const dlat = (b[1] - a[1]) * rad;
        const dlon = (b[0] - a[0]) * rad;
        const h = Math.sin(dlat / 2) ** 2 + Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dlon / 2) ** 2;
        return 2 * 6371.0088 * Math.asin(Math.min(1, Math.sqrt(h)));
      }

      /** The weather station nearest `to`, with its distance; the first by name when places are missing. */
      export function nearest(to: Station | undefined, weather: Station[]): { station: Station; km: number | null } | null {
        if (weather.length === 0) return null;
        if (!to?.at) return { station: weather[0], km: null };
        let best: { station: Station; km: number | null } = { station: weather[0], km: null };
        for (const station of weather) {
          if (!station.at) continue;
          const km = kmBetween(to.at, station.at);
          if (best.km === null || km < best.km) best = { station, km };
        }
        return best;
      }
    src__testing__hourly.ts: |
      /**
       * A station's readings in the fixture as the App's server keeps them (T-3348): hourly means,
       * humidity in per cent. For the page's tests and the bundle's local Playwright run alike.
       */
      import type { Hourly } from "../server";

      const HOUR = 3_600_000;

      /** One station's readings as hourly means from `from` on. */
      export function hourlyOf(history: ReadonlyArray<Record<string, unknown>>, id: string, from: number): Hourly {
        const entity = history.find((e) => e.id === id);
        const out: Hourly = {};
        for (const [attr, property] of Object.entries(entity ?? {})) {
          const values = (property as { values?: unknown }).values;
          if (!Array.isArray(values)) continue;
          const sums = new Map<number, [number, number]>();
          for (const entry of values) {
            const [value, at] = entry as [unknown, unknown];
            const ms = typeof at === "string" ? Date.parse(at) : NaN;
            if (typeof value !== "number" || !Number.isFinite(value) || Number.isNaN(ms)) continue;
            const hour = Math.floor(ms / HOUR) * HOUR;
            const [sum, n] = sums.get(hour) ?? [0, 0];
            sums.set(hour, [sum + (attr === "relativeHumidity" ? value * 100 : value), n + 1]);
          }
          const points = [...sums].filter(([hour]) => hour >= from).sort(([a], [b]) => a - b).map(([hour, [sum, n]]) => [hour, sum / n] as [number, number]);
          if (points.length > 0) out[attr] = points;
        }
        return out;
      }
    src__testing__maplibre.ts: |
      /**
       * MapLibre needs WebGL, which jsdom has not: this stands in for it and keeps what the App asked
       * for (the sources and their data, the layers, the handlers, the fitted bounds and the popups),
       * so a test reads what the map would draw and plays a click on it.
       */
      type Handler = (event: unknown) => void;

      export class Map {
        static built: Map[] = [];
        readonly options: Record<string, unknown>;
        readonly layers: Array<Record<string, unknown>> = [];
        readonly sources: Record<string, { data: unknown; setData(data: unknown): void }> = {};
        readonly handlers: Array<{ event: string; layer?: string; handler: Handler }> = [];
        readonly fitted: unknown[] = [];
        removed = false;

        constructor(options: Record<string, unknown>) {
          this.options = options;
          Map.built.push(this);
          queueMicrotask(() => this.fire("load", {}));
        }

        on(event: string, layerOrHandler: string | Handler, handler?: Handler): this {
          if (typeof layerOrHandler === "string") this.handlers.push({ event, layer: layerOrHandler, handler: handler as Handler });
          else this.handlers.push({ event, handler: layerOrHandler });
          return this;
        }

        fire(event: string, payload: unknown, layer?: string): void {
          for (const entry of this.handlers) if (entry.event === event && entry.layer === layer) entry.handler(payload);
        }

        addSource(id: string, spec: { data: unknown }): void {
          this.sources[id] = {
            data: spec.data,
            setData(data: unknown) {
              this.data = data;
            },
          };
        }

        getSource(id: string) {
          return this.sources[id];
        }

        addLayer(layer: Record<string, unknown>): void {
          this.layers.push(layer);
        }

        fitBounds(bounds: unknown): void {
          this.fitted.push(bounds);
        }

        remove(): void {
          this.removed = true;
        }
      }

      export class LngLatBounds {
        readonly points: Array<[number, number]> = [];
        extend(point: [number, number]): this {
          this.points.push(point);
          return this;
        }
      }

      export class Popup {
        static opened: Popup[] = [];
        at: [number, number] | null = null;
        content: HTMLElement | null = null;
        setLngLat(at: [number, number]): this {
          this.at = at;
          return this;
        }
        setDOMContent(content: HTMLElement): this {
          this.content = content;
          return this;
        }
        addTo(): this {
          Popup.opened.push(this);
          return this;
        }
      }

      export function setWorkerUrl(): void {}
    src__testing__server.ts: |
      /**
       * The App's server in memory, for the page's tests (T-3348): the fixture's readings kept as the
       * server keeps them, hourly means with humidity in per cent, served for the chosen stations and
       * period; comparisons kept under codes; an export answered with a URL. Who calls is `who`
       * (signed out unless a test names someone), and it decides as the real server does (T-3827): a
       * reader's own places, a steward's marks of faulty readings, the history of both.
       */
      import { vi } from "vitest";
      import { HISTORY, NOW } from "../fixtures/stations";
      import { ServerProblem } from "../problem";
      import type { AirApi, Comparison, Fault, HistoryRow, Me, Place } from "../server";
      import { hourlyOf } from "./hourly";

      export const VIEWER: Me = { id: "u-viewer", name: "Vilja Viewer", roles: ["viewer"] };
      export const STEWARD: Me = { id: "u-steward", name: "Sami Steward", roles: ["viewer", "steward"] };

      const HOUR = 3_600_000;
      const DAY = 24 * HOUR;

      type Memory = AirApi & {
        /** The readings the server holds, as the broker's temporalValues answer them. */
        readings: ReadonlyArray<Record<string, unknown>>;
        saved: Map<string, Comparison>;
        /** Who calls; `null` signed out. */
        who: Me | null;
        kept: (Place & { owner: string })[];
        marks: Fault[];
        log: (HistoryRow & { owner: string })[];
        /** Back to the fixture's history, nothing saved, nobody signed in, fresh call records. */
        reset(): void;
      };

      /** The server's routes as fresh mocks over `memory`'s history and saved comparisons. */
      function fill(memory: Partial<Memory> & Pick<Memory, "readings" | "saved">): Memory {
        memory.series = vi.fn(async (air: string, weather: string, days: number) => {
          const from = Math.floor((NOW - days * DAY) / HOUR) * HOUR;
          return { air: hourlyOf(memory.readings, air, from), weather: hourlyOf(memory.readings, weather, from) };
        });
        memory.save = vi.fn(async (comparison: Comparison) => {
          const code = `c${String(memory.saved.size + 1).padStart(11, "0")}`;
          memory.saved.set(code, comparison);
          return { code, name: comparison.name };
        });
        memory.open = vi.fn(async (code: string) => {
          const found = memory.saved.get(code);
          if (!found) throw new ServerProblem(404, "no comparison is saved under this link");
          return { ...found, code };
        });
        memory.exportUrl = vi.fn(async () => "https://store.example/apps/s1/x/exports/c00000000001.csv?X-Amz-Signature=x");
        const m = memory as Memory;
        const signedIn = () => {
          if (!m.who) throw new ServerProblem(401, "sign in to do this");
          return m.who;
        };
        const steward = () => {
          if (!signedIn().roles.includes("steward")) throw new ServerProblem(403, "this needs the role steward");
        };
        const write = (action: HistoryRow["action"], target: string, summary: string) => {
          const caller = signedIn();
          m.log.unshift({ id: m.log.length + 1, at: new Date(NOW).toISOString(), actorName: caller.name, action, target, summary, owner: caller.id });
        };
        const own = (id: number) => {
          const caller = signedIn();
          const found = m.kept.find((p) => p.id === id && p.owner === caller.id);
          if (!found) throw new ServerProblem(404, "no such record, or not yours to change");
          return found;
        };
        m.me = vi.fn(async () => m.who);
        m.places = vi.fn(async () => {
          const caller = signedIn();
          return m.kept.filter((p) => p.owner === caller.id).map(({ owner: _, ...p }) => p);
        });
        m.addPlace = vi.fn(async (place) => {
          const caller = signedIn();
          const made = { ...place, id: m.kept.length + 1, latest: null, latestHour: null, owner: caller.id };
          m.kept.unshift(made);
          write("insert", `places/${made.id}`, `kept the place ${place.name}`);
          const { owner: _, ...shown } = made;
          return shown;
        });
        m.changePlace = vi.fn(async (id, name, threshold) => {
          Object.assign(own(id), { name, threshold });
          write("update", `places/${id}`, `changed the place ${name}`);
        });
        m.removePlace = vi.fn(async (id) => {
          own(id);
          m.kept.splice(
            m.kept.findIndex((p) => p.id === id),
            1,
          );
          write("delete", `places/${id}`, "deleted a place");
        });
        m.faults = vi.fn(async (station) => m.marks.filter((f) => f.station === station));
        m.markFault = vi.fn(async (fault) => {
          steward();
          const made = { ...fault, id: m.marks.length + 1 };
          m.marks.unshift(made);
          write("insert", `faults/${made.id}`, `marked faulty: ${fault.note}`);
          return made;
        });
        m.unmarkFault = vi.fn(async (id) => {
          steward();
          const at = m.marks.findIndex((f) => f.id === id);
          if (at < 0) throw new ServerProblem(404, "no such record, or not yours to change");
          m.marks.splice(at, 1);
          write("delete", `faults/${id}`, "took back a faulty mark");
        });
        m.history = vi.fn(async () => {
          const caller = signedIn();
          const all = caller.roles.includes("steward");
          return m.log.filter((row) => all || row.owner === caller.id).map(({ owner: _, ...row }) => row);
        });
        return m;
      }

      export function memoryServer(): Memory {
        const memory: Partial<Memory> & Pick<Memory, "readings" | "saved"> = { readings: HISTORY, saved: new Map(), who: null, kept: [], marks: [], log: [] };
        memory.reset = () => {
          memory.readings = HISTORY;
          memory.saved.clear();
          memory.who = null;
          memory.kept = [];
          memory.marks = [];
          memory.log = [];
          fill(memory);
        };
        return fill(memory);
      }

      /** The one the page's module gets in the tests that mock `../server`. */
      export const server = memoryServer();
    src__testing__sweep.ts: |
      import { act, fireEvent } from "@testing-library/react";

      const nameOf = (element: HTMLElement) => element.getAttribute("aria-label") ?? element.textContent ?? "";

      /**
       * Every control under `root` used once, as a reader trying each would: each choice of each list
       * chosen and the list put back, each text field typed into and put back, then each enabled button
       * and link pressed once by its name (a press may change what is shown, so the next is found anew),
       * and the lists and fields a press showed used last. The shell's header is left alone: its language
       * list reloads the page.
       */
      export async function sweep(root: HTMLElement): Promise<void> {
        await fields(root);
        const pressed = new Set<string>();
        for (;;) {
          const next = [...root.querySelectorAll<HTMLElement>("button, a[href]")].find(
            (control) => outside(control) && !(control as HTMLButtonElement).disabled && !pressed.has(nameOf(control)),
          );
          if (!next) break;
          pressed.add(nameOf(next));
          await act(async () => {
            fireEvent.click(next);
          });
        }
        await fields(root);
      }

      const outside = (element: Element) => element.closest("header") === null;

      async function fields(root: HTMLElement): Promise<void> {
        for (const select of [...root.querySelectorAll("select")].filter(outside)) {
          const before = select.value;
          for (const value of [...[...select.options].map((o) => o.value), before]) {
            await act(async () => {
              fireEvent.change(select, { target: { value } });
            });
          }
        }
        for (const input of [...root.querySelectorAll("input")].filter(outside)) {
          const before = input.value;
          await act(async () => {
            fireEvent.change(input, { target: { value: `${before}1` } });
            fireEvent.change(input, { target: { value: before } });
          });
        }
      }
