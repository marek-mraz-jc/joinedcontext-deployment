    server__Cargo.toml: |
      # The server component of air-weather-explorer (T-3348, ADR-N-044): a wasm32-wasip2 component on
      # the shared host that keeps each station's hourly readings, saved comparisons and CSV exports in
      # the App's own schema and prefix. It averages with the page's own statistics (../wasm), without
      # the browser's bindings. Its own workspace and lock, as the build lane builds it (AP-151).
      [package]
      name = "air-weather-explorer-server"
      version = "0.1.0"
      edition = "2021"
      publish = false
      license = "Apache-2.0"

      [lib]
      crate-type = ["cdylib", "rlib"]

      [dependencies]
      air-weather-explorer = { path = "../wasm", default-features = false }
      # The guest SDK at the platform commit with the role helpers (T-3825); its `gateway` reaches the
      # App's own Endpoint alone (AP-147, AP-157).
      jc-app-sdk = { git = "https://github.com/marek-mraz-jc/joinedcontext-platform.git", rev = "ef03418872f29c10bf895fdf84aaf899e651f205" }
      serde = { version = "1", features = ["derive"] }
      serde_json = "1"

      [profile.release]
      opt-level = "s"
      lto = true

      [workspace]
