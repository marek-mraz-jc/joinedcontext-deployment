    src__components__ChartCard.tsx: |
      import type { ReactNode } from "react";
      import { useEffect, useRef } from "react";
      import * as echarts from "echarts/core";
      import { BarChart, HeatmapChart, LineChart, ScatterChart } from "echarts/charts";
      import { GridComponent, LegendComponent, MarkLineComponent, TooltipComponent, VisualMapComponent } from "echarts/components";
      import { CanvasRenderer } from "echarts/renderers";

      // Only the charts and parts the app draws: the whole library would triple the bundle.
      echarts.use([BarChart, HeatmapChart, LineChart, ScatterChart, GridComponent, LegendComponent, MarkLineComponent, TooltipComponent, VisualMapComponent, CanvasRenderer]);
      import { currentTokens, echartsTheme, Empty, Loading } from "@joinedcontext/sdk";

      /** One ECharts chart with a caption, in the SDK's theme; the loading, error and empty states in its place. */
      export function ChartCard({
        title,
        option,
        height = 280,
        loading,
        empty,
        loadingLabel,
        onSelect,
      }: {
        title: string;
        option: Record<string, unknown> | null;
        height?: number;
        loading?: boolean;
        empty?: ReactNode;
        /** What the card says while the data is read, in the page's language. */
        loadingLabel?: string;
        /** Called with the category of the bar a person clicks. */
        onSelect?: (name: string) => void;
      }): React.JSX.Element {
        const containerRef = useRef<HTMLDivElement | null>(null);
        const chartRef = useRef<echarts.ECharts | null>(null);
        const showCanvas = !loading && option !== null;
        const onSelectRef = useRef(onSelect);
        onSelectRef.current = onSelect;

        useEffect(() => {
          const el = containerRef.current;
          if (!showCanvas || !el) return;
          const chart = echarts.init(el, echartsTheme(currentTokens()), { renderer: "canvas" });
          chartRef.current = chart;
          chart.on("click", (params: unknown) => {
            const name = (params as { name?: unknown }).name;
            if (name !== undefined) onSelectRef.current?.(String(name));
          });
          const observer = typeof ResizeObserver === "undefined" ? undefined : new ResizeObserver(() => chart.resize());
          observer?.observe(el);
          return () => {
            observer?.disconnect();
            chart.dispose();
            chartRef.current = null;
          };
        }, [showCanvas]);

        useEffect(() => {
          if (chartRef.current && option) chartRef.current.setOption(option, true);
        }, [option, showCanvas]);

        return (
          <figure className="jc-chart">
            <figcaption>{title}</figcaption>
            {loading ? (
              <Loading label={loadingLabel} />
            ) : option === null ? (
              <Empty>{empty}</Empty>
            ) : (
              <div className="jc-chart-canvas" role="img" aria-label={title} style={{ height }} ref={containerRef} />
            )}
          </figure>
        );
      }
    src__components__FaultsCard.tsx: |
      import { useState } from "react";
      import { Card, Empty, Loading } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import type { Faults } from "../faults";
      import { helsinkiMs, helsinkiWall } from "../faults";
      import { localeOf, number, ZONE } from "../i18n";
      import type { Lang } from "../i18n";
      import { t } from "../texts";
      import type { Key } from "../texts";
      import { problemText } from "./Keep";

      const HOUR = 3_600_000;

      interface Props {
        lang: Lang;
        faults: Faults;
        /** The station the marks are of, its id and name; `null` before one is chosen. */
        station: { id: string; name: string } | null;
        /** The hours the comparison left out for them. */
        leftOut: number;
      }

      /**
       * The periods a steward marked a station's readings faulty (T-3827), shown to everyone and left
       * out of the comparison; a steward marks one with a reason and takes one back.
       */
      export function FaultsCard({ lang, faults, station, leftOut }: Props) {
        const { steward } = useAccess();
        const [now] = useState(() => Date.now());
        const [from, setFrom] = useState(() => helsinkiWall(now - 6 * HOUR));
        const [to, setTo] = useState(() => helsinkiWall(now));
        const [note, setNote] = useState("");
        const [busy, setBusy] = useState(false);
        const [message, setMessage] = useState<{ text: string; error: boolean } | null>(null);

        const when = (ms: number) => new Date(ms).toLocaleString(localeOf(lang), { dateStyle: "short", timeStyle: "short", timeZone: ZONE });
        const run = async (work: () => Promise<void>, done: Key, failed: Key) => {
          setBusy(true);
          setMessage(null);
          try {
            await work();
            setMessage({ text: t(lang, done), error: false });
          } catch (error) {
            setMessage({ text: problemText(lang, error, failed, "gone"), error: true });
          } finally {
            setBusy(false);
          }
        };
        const start = helsinkiMs(from);
        const end = helsinkiMs(to);
        const ready = station !== null && start !== null && end !== null && start < end && note.trim() !== "";

        return (
          <Card title={t(lang, "faultsTitle")}>
            <p className="app-lead">{t(lang, "faultsLead")}</p>
            <p role="status" aria-live="polite" className={message?.error ? "app-error" : "app-lead"}>
              {message?.text ?? (faults.failed ? problemText(lang, faults.failed, "faultsFailed", "gone") : "")}
            </p>
            {faults.list === null ? (
              <Loading label={t(lang, "reading")} />
            ) : faults.list.length === 0 ? (
              faults.failed ? null : <Empty>{t(lang, "faultsNone")}</Empty>
            ) : (
              <ul className="app-faults" aria-label={t(lang, "faultsTitle")}>
                {faults.list.map((fault) => {
                  const text = t(lang, "faultLine", { from: when(fault.from), to: when(fault.to), note: fault.note });
                  return (
                    <li key={fault.id}>
                      <span>{text}</span>
                      {steward && (
                        <button
                          type="button"
                          className="jc-button"
                          disabled={busy}
                          aria-label={`${t(lang, "unmark")}: ${text}`}
                          onClick={() => void run(() => faults.unmark(fault.id), "unmarked", "unmarkFailed")}
                        >
                          {t(lang, "unmark")}
                        </button>
                      )}
                    </li>
                  );
                })}
              </ul>
            )}
            {leftOut > 0 && <p className="app-lead">{t(lang, "faultsLeftOut", { n: number(leftOut) })}</p>}
            {steward ? (
              <form
                className="app-filters"
                aria-label={t(lang, "markFaulty")}
                onSubmit={(event) => {
                  event.preventDefault();
                  if (!ready || start === null || end === null || !station) return;
                  void run(
                    async () => {
                      await faults.mark({ station: station.id, from: start, to: end, note: note.trim() });
                      setNote("");
                    },
                    "marked",
                    "markFailed",
                  );
                }}
              >
                <label>
                  <span>{t(lang, "faultFrom")}</span>
                  <input type="datetime-local" value={from} required onChange={(event) => setFrom(event.target.value)} />
                </label>
                <label>
                  <span>{t(lang, "faultTo")}</span>
                  <input type="datetime-local" value={to} required onChange={(event) => setTo(event.target.value)} />
                </label>
                <label>
                  <span>{t(lang, "faultNote")}</span>
                  <input value={note} maxLength={200} required onChange={(event) => setNote(event.target.value)} />
                </label>
                <button type="submit" className="jc-button" disabled={busy || !ready}>
                  {t(lang, "markFaulty")}
                </button>
              </form>
            ) : (
              <p className="app-lead">{t(lang, "markOnly")}</p>
            )}
          </Card>
        );
      }
    src__components__History.tsx: |
      import { useCallback, useEffect, useState } from "react";
      import { Card, Empty, Loading } from "@joinedcontext/sdk";
      import { useAccess } from "../access";
      import { localeOf, ZONE } from "../i18n";
      import type { Lang } from "../i18n";
      import type { AirApi, HistoryRow } from "../server";
      import { t } from "../texts";
      import { problemText } from "./Keep";

      /** The App's history, from its `app_audit` table: a viewer's own changes, a steward's everyone's. */
      export function History({ lang, api }: { lang: Lang; api: AirApi }) {
        const { me, steward } = useAccess();
        const [rows, setRows] = useState<HistoryRow[] | null>(null);
        const [failed, setFailed] = useState<string | null>(null);

        const load = useCallback(async () => {
          setFailed(null);
          try {
            setRows(await api.history());
          } catch (error) {
            setRows([]);
            setFailed(problemText(lang, error, "historyFailed", "gone"));
          }
        }, [api, lang]);

        useEffect(() => {
          if (me) void load();
        }, [me, load]);

        const when = (iso: string) => {
          const at = new Date(iso);
          return Number.isNaN(at.getTime()) ? iso : at.toLocaleString(localeOf(lang), { dateStyle: "medium", timeStyle: "short", timeZone: ZONE });
        };

        if (me === null) return <Card title={t(lang, "historyTitle")}>{<Empty>{t(lang, "historySignIn")}</Empty>}</Card>;
        return (
          <Card title={t(lang, "historyTitle")}>
            <p className="app-lead">{t(lang, steward ? "historyAll" : "historyMine")}</p>
            <button type="button" className="jc-button" disabled={rows === null} onClick={() => void load()}>
              {t(lang, "refresh")}
            </button>
            {failed && <p className="app-error">{failed}</p>}
            {rows === null ? (
              <Loading label={t(lang, "historyLoading")} />
            ) : rows.length === 0 ? (
              failed ? null : <Empty>{t(lang, "historyEmpty")}</Empty>
            ) : (
              <table className="app-history">
                <caption className="app-sr">{t(lang, "historyTitle")}</caption>
                <thead>
                  <tr>
                    <th scope="col">{t(lang, "when")}</th>
                    <th scope="col">{t(lang, "who")}</th>
                    <th scope="col">{t(lang, "what")}</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((row) => (
                    <tr key={row.id}>
                      <td>{when(row.at)}</td>
                      <td>{row.actorName}</td>
                      <td>
                        {t(lang, row.action)}: {row.summary}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </Card>
        );
      }
    src__components__Keep.test.tsx: |
      import { fireEvent, render, screen, waitFor } from "@testing-library/react";
      import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
      import { ServerProblem } from "../server";
      import { server } from "../testing/server";
      import { Keep, problemText } from "./Keep";

      const went: string[] = [];
      vi.mock("../go", () => ({ go: (url: string) => went.push(url) }));

      const COMPARISON = { station: "urn:ngsi-ld:AirQualityObserved:x:kallio", weather: "urn:ngsi-ld:WeatherObserved:x:kaisaniemi", days: 7, smoothing: 6, air: "pm25" as const, variable: "windSpeed" as const };

      beforeEach(() => {
        server.reset();
        went.length = 0;
      });
      afterEach(() => vi.unstubAllGlobals());

      // T-3348: the comparison on screen kept under a link, and its hours given as CSV.
      describe("Keep", () => {
        it("waits for both stations, then saves the comparison with its name and shows the link", async () => {
          const { rerender } = render(<Keep lang="en" api={server} comparison={null} />);
          expect(screen.getByRole("button", { name: "Save the comparison" })).toBeDisabled();
          expect(screen.getByRole("button", { name: "Export the hours (CSV)" })).toBeDisabled();
          rerender(<Keep lang="en" api={server} comparison={COMPARISON} />);
          fireEvent.change(screen.getByLabelText("Name of the comparison (optional)"), { target: { value: "  Kallio and the wind " } });
          fireEvent.click(screen.getByRole("button", { name: "Save the comparison" }));
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent("Comparison saved."));
          expect(server.save).toHaveBeenCalledWith({ ...COMPARISON, name: "Kallio and the wind" });
          const link = screen.getByLabelText("Link to the comparison") as HTMLInputElement;
          expect(link.value).toContain("?compare=c00000000001");
          fireEvent.click(link);
          fireEvent.focus(link);
          expect(link.selectionEnd).toBe(link.value.length);

          const writeText = vi.fn(async () => undefined);
          vi.stubGlobal("navigator", { clipboard: { writeText } });
          fireEvent.click(screen.getByRole("button", { name: "Copy link" }));
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent("Link copied."));
          vi.stubGlobal("navigator", { clipboard: { writeText: vi.fn().mockRejectedValue(new Error("denied")) } });
          fireEvent.click(screen.getByRole("button", { name: "Copy link" }));
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent("The link is selected: copy it with the keyboard."));
        });

        it("saves an unnamed comparison as one without a name", async () => {
          render(<Keep lang="en" api={server} comparison={COMPARISON} />);
          fireEvent.submit(screen.getByRole("form", { name: "Keep or export the comparison" }));
          await waitFor(() => expect(server.save).toHaveBeenCalledWith({ ...COMPARISON, name: null }));
        });

        it("downloads the hours, and says in the reader's language why the server refused", async () => {
          render(<Keep lang="fi" api={server} comparison={COMPARISON} />);
          fireEvent.change(screen.getByLabelText("Vertailun nimi (valinnainen)"), { target: { value: "Kallio ja tuuli" } });
          fireEvent.click(screen.getByRole("button", { name: "Vie tunnit (CSV)" }));
          await waitFor(() => expect(went).toEqual(["https://store.example/apps/s1/x/exports/c00000000001.csv?X-Amz-Signature=x"]));
          expect(server.exportUrl).toHaveBeenCalledWith(COMPARISON.station, COMPARISON.weather, 7);
          server.save = vi.fn(async () => {
            throw new ServerProblem(400, "a name is one line of at most 80 characters");
          });
          fireEvent.click(screen.getByRole("button", { name: "Tallenna vertailu" }));
          await waitFor(() => expect(screen.getByRole("status")).toHaveTextContent("Ei tallennettu: a name is one line of at most 80 characters"));
        });

        it("maps every refusal to words a person can act on", () => {
          expect(problemText("en", new ServerProblem(0, ""), "saveFailed")).toMatch(/could not be reached/);
          expect(problemText("en", new ServerProblem(401, ""), "saveFailed")).toMatch(/Sign in again/);
          expect(problemText("en", new ServerProblem(403, ""), "saveFailed")).toMatch(/may not do this/);
          expect(problemText("en", new ServerProblem(404, ""), "openFailed")).toMatch(/No comparison is saved/);
          expect(problemText("en", new ServerProblem(507, ""), "saveFailed")).toMatch(/storage is full/);
          expect(problemText("en", new ServerProblem(502, ""), "exportFailed")).toMatch(/did not answer/);
          expect(problemText("en", "odd", "exportFailed")).toMatch(/did not answer/);
        });
      });
    src__components__Keep.tsx: |
      import { useId, useState } from "react";
      import { go } from "../go";
      import type { Lang } from "../i18n";
      import { compareLink, ServerProblem } from "../server";
      import type { AirApi, Comparison } from "../server";
      import { t } from "../texts";
      import type { Key } from "../texts";

      /** What the server's refusal means to the reader, in their language; a `404` reads as `gone`. */
      export function problemText(lang: Lang, error: unknown, action: Key, gone: Key = "compareGone"): string {
        if (!(error instanceof ServerProblem)) return t(lang, "serverDown");
        if (error.status === 0) return t(lang, "serverOffline");
        if (error.status === 401) return t(lang, "signInAgain");
        if (error.status === 403) return t(lang, "noRight");
        if (error.status === 400 || error.status === 409) return `${t(lang, action)}: ${error.message}`;
        if (error.status === 404) return t(lang, gone);
        if (error.status === 507) return t(lang, "storageFull");
        return t(lang, "serverDown");
      }

      interface Props {
        lang: Lang;
        api: AirApi;
        /** The comparison on screen; `null` until both stations are known. */
        comparison: Omit<Comparison, "name"> | null;
      }

      /** Keeps the comparison on screen under a link, and gives its hours as CSV. */
      export function Keep({ lang, api, comparison }: Props) {
        const [name, setName] = useState("");
        const [busy, setBusy] = useState<"save" | "export" | null>(null);
        const [code, setCode] = useState<string | null>(null);
        const [message, setMessage] = useState<{ text: string; error: boolean } | null>(null);
        const nameId = useId();
        const linkId = useId();

        const run = async (what: "save" | "export", work: () => Promise<string>, failure: Key) => {
          setBusy(what);
          setMessage(null);
          try {
            setMessage({ text: await work(), error: false });
          } catch (error) {
            setMessage({ text: problemText(lang, error, failure), error: true });
          } finally {
            setBusy(null);
          }
        };
        const save = () =>
          run(
            "save",
            async () => {
              if (!comparison) return "";
              const saved = await api.save({ ...comparison, name: name.trim() || null });
              setCode(saved.code);
              return t(lang, "saved");
            },
            "saveFailed",
          );
        const exportCsv = () =>
          run(
            "export",
            async () => {
              if (!comparison) return "";
              go(await api.exportUrl(comparison.station, comparison.weather, comparison.days));
              return t(lang, "exporting");
            },
            "exportFailed",
          );
        const copy = async () => {
          if (!code) return;
          try {
            await navigator.clipboard.writeText(compareLink(code));
            setMessage({ text: t(lang, "copied"), error: false });
          } catch {
            (document.getElementById(linkId) as HTMLInputElement | null)?.select();
            setMessage({ text: t(lang, "copyByHand"), error: false });
          }
        };

        return (
          <section className="app-keep" aria-label={t(lang, "keep")}>
            <form
              className="app-filters"
              aria-label={t(lang, "keep")}
              onSubmit={(event) => {
                event.preventDefault();
                if (comparison && busy === null) void save();
              }}
            >
              <label htmlFor={nameId}>
                <span>{t(lang, "compareName")}</span>
              </label>
              <input id={nameId} value={name} maxLength={80} placeholder={t(lang, "compareNameHint")} onChange={(event) => setName(event.target.value)} />
              <button type="submit" className="jc-button" disabled={!comparison || busy !== null}>
                {busy === "save" ? t(lang, "saving") : t(lang, "save")}
              </button>
              <button type="button" className="jc-button" disabled={!comparison || busy !== null} onClick={() => void exportCsv()}>
                {busy === "export" ? t(lang, "exportBusy") : t(lang, "export")}
              </button>
            </form>
            {code && (
              <div className="app-keep-link">
                <label htmlFor={linkId}>{t(lang, "compareLink")}</label>
                <input id={linkId} readOnly value={compareLink(code)} onFocus={(event) => event.currentTarget.select()} />
                <button type="button" className="jc-button" onClick={() => void copy()}>
                  {t(lang, "copy")}
                </button>
              </div>
            )}
            <p role="status" aria-live="polite" className={message?.error ? "app-error" : "app-lead"}>
              {message?.text ?? ""}
            </p>
          </section>
        );
      }
    src__components__MapView.tsx: |
      import { useEffect, useRef, useState } from "react";
      import { LngLatBounds, Map as MapLibreMap, Popup } from "maplibre-gl";
      import type { GeoJSONSource, MapGeoJSONFeature, MapMouseEvent } from "maplibre-gl";
      import { currentTokens, mapWorkerReady, NO_BASEMAP, styleFor, useClient } from "@joinedcontext/sdk";

      /** One point on the map: where, in which colour, and the lines its popup shows (text only). */
      export interface MapPoint {
        id: string;
        at: [number, number];
        color: string;
        lines: string[];
      }

      /**
       * A MapLibre map of `points`. It fits the
       * points once, when they first arrive, so a refresh never moves the reader's view; a click on a
       * point opens its popup and calls `onPick`.
       */
      export function MapView({
        points,
        label,
        onPick,
        height = 420,
      }: {
        points: MapPoint[];
        /** What the map shows, for a screen reader: the list beside it carries the same. */
        label: string;
        onPick?: (id: string) => void;
        height?: number;
      }): React.JSX.Element {
        const client = useClient();
        const basemap = client.config.basemap;
        const container = useRef<HTMLDivElement>(null);
        const map = useRef<MapLibreMap | null>(null);
        const [ready, setReady] = useState(false);
        const fitted = useRef(false);
        const pointsRef = useRef(points);
        pointsRef.current = points;
        const onPickRef = useRef(onPick);
        onPickRef.current = onPick;

        useEffect(() => {
          let gone = false;
          let instance: MapLibreMap | null = null;
          void mapWorkerReady().then(() => {
            if (gone || !container.current) return;
            const tokens = currentTokens();
            instance = new MapLibreMap({
              container: container.current,
              style: styleFor(basemap),
              center: [24.94, 60.17],
              zoom: 10,
              canvasContextAttributes: { preserveDrawingBuffer: true },
            });
            map.current = instance;
            instance.on("error", (event) => console.error("map error", event.error?.message ?? event));
            instance.on("load", () => {
              if (gone || !instance) return;
              instance.addSource("app-points", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
              instance.addLayer({
                id: "app-points",
                type: "circle",
                source: "app-points",
                paint: {
                  "circle-radius": 6,
                  "circle-color": ["get", "color"],
                  "circle-stroke-color": tokens.map.stroke,
                  "circle-stroke-width": 1.5,
                },
              });
              instance.on("click", "app-points", (event: MapMouseEvent & { features?: MapGeoJSONFeature[] }) => {
                const id: unknown = event.features?.[0]?.properties?.id;
                const point = pointsRef.current.find((p) => p.id === id);
                if (!point || !instance) return;
                onPickRef.current?.(point.id);
                // Text nodes only: an entity's values never reach the page as markup.
                const body = document.createElement("div");
                body.className = "jc-map-popup";
                for (const [index, text] of point.lines.entries()) {
                  const element = document.createElement(index === 0 ? "strong" : "p");
                  element.textContent = text;
                  body.append(element);
                }
                new Popup({ closeButton: true, maxWidth: "260px" }).setLngLat(point.at).setDOMContent(body).addTo(instance);
              });
              setReady(true);
            });
          });
          return () => {
            gone = true;
            instance?.remove();
            map.current = null;
          };
        }, [basemap]);

        useEffect(() => {
          const instance = map.current;
          if (!ready || !instance) return;
          (instance.getSource("app-points") as GeoJSONSource | undefined)?.setData({
            type: "FeatureCollection",
            features: points.map((p) => ({
              type: "Feature",
              id: p.id,
              properties: { id: p.id, color: p.color },
              geometry: { type: "Point", coordinates: p.at },
            })),
          });
          if (!fitted.current && points.length > 0) {
            fitted.current = true;
            const bounds = new LngLatBounds();
            for (const p of points) bounds.extend(p.at);
            instance.fitBounds(bounds, { padding: 32, maxZoom: 15, duration: 0 });
          }
        }, [ready, points]);

        return (
          <div className="jc-map" data-testid="jc-map" style={{ height }}>
            <div className="jc-map-canvas" ref={container} role="application" aria-label={label} />
            {!basemap && <span className="jc-map-notice">{NO_BASEMAP}</span>}
          </div>
        );
      }
    src__components__components.css: |
      /* The components' classes, over the token variables the SDK sets from design-tokens.json. Phone
         first (T-2777, UI-84): each view works from 375 px up, and widens by the room it is given. */

      /* The page is the app: no margin around the shell, so a framed app has one scrollbar, the frame's. */
      body {
        margin: 0;
      }

      .jc-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: var(--jc-font-body, "Inter", system-ui, -apple-system, "Segoe UI", sans-serif);
        color: var(--jc-color-ink, #0f172a);
        background: var(--jc-color-surface, #ffffff);
        font-size: var(--jc-font-size-md, 0.875rem);
        line-height: 1.5;
      }

      .jc-shell *, .jc-shell *::before, .jc-shell *::after {
        box-sizing: border-box;
      }

      .jc-header {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        border-bottom: 1px solid var(--jc-color-line, #e2e8f0);
      }

      .jc-header h1 {
        margin: 0;
        font-size: var(--jc-font-size-xl, 1.25rem);
        font-weight: 700;
      }

      /* Many pages scroll sideways on a phone rather than pushing the page wider than the screen. */
      .jc-header nav {
        display: flex;
        gap: var(--jc-space-1, 0.25rem);
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .jc-header nav button {
        all: unset;
        flex: none;
        cursor: pointer;
        padding: var(--jc-space-2, 0.5rem) var(--jc-space-3, 0.75rem);
        border-bottom: 2px solid transparent;
        color: var(--jc-color-muted, #64748b);
        font-weight: 500;
      }

      .jc-header nav button[aria-current="page"] {
        color: var(--jc-color-accent, #0f766e);
        border-bottom-color: var(--jc-color-accent, #0f766e);
      }

      .jc-user {
        margin-left: auto;
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

      .jc-main {
        flex: 1;
        padding: var(--jc-space-4, 1rem);
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: var(--jc-space-4, 1rem);
        align-content: start;
      }

      .jc-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: var(--jc-space-3, 0.75rem);
      }

      .jc-tile {
        display: flex;
        flex-direction: column;
        gap: var(--jc-space-1, 0.25rem);
        padding: var(--jc-space-3, 0.75rem) var(--jc-space-4, 1rem);
        background: var(--jc-color-card, #f8fafc);
        border: 1px solid var(--jc-color-line, #e2e8f0);
        border-radius: var(--jc-radius-md, 6px);
      }

      .jc-tile-label {
        font-size: var(--jc-font-size-sm, 0.75rem);
        color: var(--jc-color-muted, #64748b);
      }

