apps:
  air-weather-explorer:
    .gitea__workflows__build.yml: |
      # The build of this application (AP-80, AP-100, AP-101, AP-104, ADR-N-028). The Portal writes this
      # file in the application's first commit and a run never changes it: only a version a reviewer
      # merged runs. It builds the default branch on every push to it, and again when the Portal's
      # Rebuild dispatches it (AP-103).
      #
      # Runs on the installation's `gitea-runner` (label node-22), whose image carries the SDK and the
      # template's packages already installed, so nothing is installed here (AP-82). No step fetches an
      # action: the runner reaches the forge and the Portal API only (AP-81), by the in-cluster
      # addresses it gives every job as JC_FORGE_URL and JC_PORTAL_URL; `gitea.server_url` is the
      # public host, which the runner cannot reach.
      #
      # Two jobs: `build` runs the application's code and holds the job token only; `propose` runs no
      # code of the application and is the only one that sees the lane's secret. The Portal checks the
      # uploaded bundle against the proposed digest and publishes the package itself (AP-104).
      name: build

      on:
        push:
          branches: [main]
        workflow_dispatch:

      jobs:
        # `build` runs in a pod of this App's own (label app-build-rust: Rust to WebAssembly, AP-142), registered with this
        # repository's token alone and mounting this App's build cache; `propose` stays on the shared
        # runner and mounts no cache (AP-130, AP-131).
        build:
          runs-on: app-build-rust
          timeout-minutes: 30
          env:
            JC_BUILD_DIR: ${{ runner.temp }}/jc-build
          outputs:
            digest: ${{ steps.upload.outputs.digest }}
            commit: ${{ steps.upload.outputs.commit }}
            sdk-version: ${{ steps.upload.outputs.sdk-version }}
            built-at: ${{ steps.upload.outputs.built-at }}
          steps:
            # Clones the commit, runs the tests, builds and bundles the functions; the application's
            # own code runs here, with the job token removed from its environment.
            - name: Test and build
              env:
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_APP_COMMIT: ${{ gitea.sha }}
                JC_FORGE_TOKEN: ${{ gitea.token }}
              run: JC_APP_REPO="$JC_FORGE_URL/$JC_REPOSITORY.git" build-app

            # bundle-{commit} and sbom-{commit}, the run's artifacts, for the Portal to check and publish.
            - name: Upload the build
              id: upload
              run: node /opt/template/lane.mjs upload "$JC_BUILD_DIR"

        propose:
          needs: build
          runs-on: node-22
          timeout-minutes: 5
          steps:
            # The one step that sees the lane's secret, and it runs no code of the application (AP-80).
            - name: Propose status.build
              env:
                JC_LANE_TOKEN: ${{ secrets.JC_LANE_TOKEN }}
                JC_REPOSITORY: ${{ gitea.repository }}
                JC_DIGEST: ${{ needs.build.outputs.digest }}
                JC_COMMIT: ${{ needs.build.outputs.commit }}
                JC_SDK_VERSION: ${{ needs.build.outputs.sdk-version }}
                JC_BUILT_AT: ${{ needs.build.outputs.built-at }}
              run: node /opt/template/lane.mjs propose "$JC_REPOSITORY"
    .gitignore: |
      # The WebAssembly build: the lane (or `pnpm wasm`) writes wasm/pkg from wasm/.
      wasm/pkg/
      wasm/target/
      node_modules/
      dist/
      test-results/
      *.tsbuildinfo
      playwright-report/
      pnpm-lock.yaml
    README.md: |
      # Air quality and weather

      How the weather moves Helsinki's air quality, station by station. One page, in Finnish or
      English:

      - the answer on opening, in one sentence: at the first air quality station, compared with the
        nearest weather station over three days, which pollutant moves most with which weather variable,
        which way and how strongly, with the Spearman and Pearson correlations and the number of hours
        they are computed over;
      - the choices: the air quality station, the weather station (the nearest named with its distance),
        the period (1, 3 or 7 days), the rolling mean (1 to 12 hours), the pollutant and the variable;
      - the chosen pair hour by hour on one chart, the pollutant's outlying readings marked;
      - every pollutant against every weather variable as a heat map; a click on a cell shows that pair;
      - the stations on the map; a click chooses one and opens it in the entity panel;
      - every pair in a table, with Spearman, Pearson and the hours.

      The page sits in the SDK's `AppShell` (SDK-39), which carries the language switch. A station on the
      map, or the "Details of" button of each chosen station, opens it in the SDK's entity panel
      (SDK-40): its attributes as the App's grant reads them, and a link to it in the Portal, where a
      person with the rights changes it. The App is public and writes nothing, so the panel offers no
      Edit (AP-140).

      Every choice is kept in the address (`?station=`, `?weather=`, `?days=`, `?window=`, `?air=`,
      `?w=`, `?lang=`).

      ## How it is computed

      The statistics are Rust, in `wasm/`, compiled to WebAssembly and run in the reader's browser in a
      Web Worker, so every change of smoothing or pair is answered at once:

      - each attribute's readings are averaged per hour, and all of them put on the same hours;
      - a rolling mean over the chosen window smooths each series, skipping missing hours;
      - Pearson's and Spearman's correlation (ranks, ties shared) over the hours both sides have, at
        least six; a constant side says nothing;
      - an outlier is a reading more than 3.5 robust standard deviations (1.4826 × MAD) from the median.

      The strength words are: under 0.2 "hardly", under 0.4 "weakly", under 0.7 "moderately", else
      "strongly". A correlation is not a cause: the page says how they move together, nothing more.

      ## The server: kept hours, saved comparisons, exports

      The App's server is a WebAssembly component on the platform's shared host (`server/`,
      `kind: wasm`, ADR-N-044). It keeps each station's readings as hourly means in the App's own schema
      (`migrations/`), and reads the App's own Endpoint, as the visitor, only for the hours it has not
      kept yet (from the last kept hour, at most a week back, at most every 15 minutes). The page asks it
      for the two chosen stations' hours of the period instead of reading a week of every station's raw
      readings; the correlations stay in the browser. The Endpoint is public and its policies are its own
      role, so every visitor reads the same readings and what one visitor's request kept, another may be
      shown. A station's hours older than eight days are dropped.

      - **Save the comparison** keeps the choices on screen (the stations, the period, the smoothing, the
        pair and an optional name) under a code of 12 letters and digits. The link, `?compare={code}`,
        opens them again: the page puts them into the address and drops the code. Comparisons are cleared
        half a year after they were saved, a few at each new one.
      - **Export the hours (CSV)** writes the two stations' hourly means of the period, one row per hour
        and a column per attribute, under the App's own prefix, `exports/{code}.csv`, and downloads it
        through a URL valid for two minutes. Exports are cleared a day after they were written.

      | Route | What it does |
      |---|---|
      | `GET /api/series?air=&weather=&days=` | both stations' hourly means over the last 1, 3 or 7 days |
      | `POST /api/comparisons` | a comparison kept; its code |
      | `GET /api/comparisons/{code}` | the comparison's choices |
      | `POST /api/exports` | the hours as CSV; a URL it downloads from |

      ## Roles and history

      The server decides from the signed-in person the platform names (`identity::caller()`, API/07),
      never from anything the page sends:

      - anyone, signed in or not, compares stations and sees the periods marked faulty;
      - a **viewer** keeps up to 20 **places** of their own under **My places**: a station, a pollutant
        and a level. The page shows whether the latest hourly mean is above it and opens the station in
        the comparison. They change and delete their own places; a place of someone else's answers as if
        it did not exist;
      - a **steward** marks a period of a station's readings **faulty** with a reason (at most 31 days)
        and takes a mark back. The comparison leaves every hour a mark covers out of the analysis, for
        everyone, and says how many hours went.

      A change, a deleted place and a mark taken back show at once and go back when the server refuses.
      Every change writes a row into the App's `app_audit` table in the same statement, so a refused or
      failed change leaves none; the **History** page reads it: a viewer their own rows, a steward
      everyone's.

      | Route | Who | What it does |
      |---|---|---|
      | `GET /api/me` | anyone | the caller's name and roles, `null` when signed out |
      | `GET /api/places` | signed in | the caller's places, each with the latest hourly mean |
      | `POST /api/places` `{station, name, attr, threshold}` | signed in | a place kept, at most 20 |
      | `PUT /api/places/{id}` `{name, threshold}` | the owner | its name and level changed |
      | `DELETE /api/places/{id}` | the owner | the place gone |
      | `GET /api/faults?station=` | anyone | the station's faulty marks |
      | `POST /api/faults` `{station, from, to, note}` | steward | a period marked faulty |
      | `DELETE /api/faults/{id}` | steward | the mark taken back |
      | `GET /api/history` | signed in | the newest 100 changes (a viewer: their own) |

      `server/host-test.json` plays every route on the real host as an anonymous visitor, a viewer,
      another viewer and a steward, and counts the rows after each refused write.

      ## Data

      Two data needs on the Context Space `helsinki`, each with a week of history (`retrieveTemporal`,
      window `P7D`): `AirQualityObserved` with `pm10`, `pm25` and `airQualityIndex`, and
      `WeatherObserved` with `temperature`, `windSpeed`, `relativeHumidity` (stored as a share, shown in
      per cent) and `precipitation`, each with `name`, `location` and `dateObserved`. The app writes
      nothing to the Context Space: what it keeps is in its own schema.

      ## Run the tests

      Needs Rust with the `wasm32-unknown-unknown` target and `wasm-bindgen-cli` 0.2.129, the version
      `wasm/Cargo.lock` pins and the build lane binds with.

      ```sh
      pnpm install
      pnpm wasm          # cargo test of wasm/, then the module into wasm/pkg (the lane runs builder/build-wasm.sh)
      pnpm test          # vitest, with the real WebAssembly module
      pnpm build         # the bundle the build lane publishes
      pnpm e2e           # the built bundle in Chromium at four widths, light and dark, and a station in the panel (needs `pnpm build`)
      (cd server && cargo test && cargo build --release --target wasm32-wasip2)   # the server component
      ```

      `server/host-test.json` is the server component's scenario on the real host: the portal
      repository's `tests/wasm-apps` (`tests/scenarios.rs`, ci-full) builds the component, runs
      `migrations/` twice as the reconciler does, and plays the scenario against Postgres, RustFS and a
      mock of the App's own Endpoint, with a second App that must see nothing.
      The page's tests and `e2e/serve.ts` answer the server's routes from the fixture
      (`src/testing/`).

      The App is under the Apps' coverage gate (T-3373): `sh ../../scripts/app-coverage-run.sh
      air-weather-explorer --rust` in a throwaway copy, vitest 95 % (branches 90 %) with every control
      exercised, and `cargo llvm-cov` of `wasm/` at 95 % lines. wasm-bindgen's generated glue in
      `wasm/pkg` is not counted.
    app.yaml: |
      # Air quality and weather (T-3330): how the weather moves the air, station by station: a pollutant
      # series against a weather station's over common hours, rolling means, Pearson and Spearman
      # correlation, and the readings far from the rest. Hand written, so no generated-by annotation
      # (AP-35).
      #
      # A server WASM App (`kind: wasm`, ADR-N-044, T-3348): React on the App SDK with its Rust compiled
      # to WebAssembly and run in the reader's browser while they click (wasm/), and a server component
      # on the shared host (server/) that keeps each station's readings as hourly means, read from the
      # App's own Endpoint only for the hours not yet kept, and keeps saved comparisons and CSV exports.
      # Its own schema (migrations/) and its own files under its prefix are the App's alone. Its source
      # is its own repository on the forge, which the build lane builds at `ref` (AP-75, AP-80, AP-151);
      # this folder of the portal repository is where CI tests the same tree before it is pushed there
      # (T-2599).
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: air-weather-explorer
        namespace: helsinki
        title:
          en: "Air quality and weather"
          fi: "Ilmanlaatu ja sää"
        description:
          en: "How the weather moves Helsinki's air quality: pollutants against wind, temperature, humidity and rain, hour by hour, with the correlations computed in the browser."
          fi: "Miten sää vaikuttaa Helsingin ilmanlaatuun: saasteet tuulta, lämpötilaa, kosteutta ja sadetta vasten tunneittain, korrelaatiot laskettuna selaimessa."
      spec:
        kind: wasm
        source:
          git:
            url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_air-weather-explorer.git
            ref: main
        build:
          node: "22"
          rust: "1.90"
        storage:
          sql: { migrations: migrations, quotaMiB: 100 }
          blob: { quotaMiB: 256 }
        visibility: public
        lifecycle: published
        # Who keeps places and marks readings faulty (T-3827); the server decides from identity::caller()
        # alone, and the city's data is only read.
        roles:
          - name: viewer
            title: { en: "Viewer", fi: "Katselija" }
            description: "Keeps places of their own: an air quality station, a pollutant and the level above which the page alerts them; changes and deletes their own."
          - name: steward
            title: { en: "Steward", fi: "Ylläpitäjä" }
            description: "What a viewer does, and marks a station's readings faulty for a period with a reason, shown to everyone and left out of every comparison. Reads the whole history."
        access:
          - role: viewer
            subjects: [{ group: air-weather-explorer-viewer }]
          - role: steward
            subjects: [{ group: air-weather-explorer-steward }]
        dataNeeds:
          # The stations HSY's feed writes (helsinki-pipeline-air-quality), with a week of history: the
          # attributes the air-quality app reads on dev.
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [AirQualityObserved]
            attrs: [name, location, dateObserved, pm10, pm25, airQualityIndex]
            operations: [queryEntity, retrieveEntity, queryTemporal, retrieveTemporal]
            temporalQ:
              window: P7D
            representations: [ngsi-ld, ogc-features]
          # The weather stations the FMI and road-weather pipelines write (read on dev 2026-10-08:
          # temperature, windSpeed and relativeHumidity on every station, precipitation on road ones).
          - contextSpaceRef:
              kind: ContextSpace
              name: helsinki
            types: [WeatherObserved]
            attrs: [name, location, dateObserved, temperature, windSpeed, relativeHumidity, precipitation]
            operations: [queryEntity, retrieveEntity, queryTemporal, retrieveTemporal]
            temporalQ:
              window: P7D
            representations: [ngsi-ld]
    e2e__responsive.spec.ts: |
      import { expect, test } from "@playwright/test";
      import { WIDTHS, layoutProblems } from "@joinedcontext/sdk/responsive";
      import { BASE, STEWARD, VIEWER, serve } from "./serve";

      // T-3330, UI-84, SDK-12: the comparison at a phone, a tablet, a laptop and a wall, light and dark,
      // with the WebAssembly statistics run in their worker under the static host's policy: no sideways
      // scroll, no two blocks over each other, nothing axe finds at WCAG 2.1 AA.
      for (const scheme of ["light", "dark"] as const) {
        for (const size of WIDTHS) {
          test(`${scheme} at ${size.width} px: the answer is given, no sideways scroll, no overlap, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const { outside, missing, problems } = await serve(page);
            await page.setViewportSize(size);
            await page.goto(BASE);
            const compare = page.getByRole("region", { name: "Compare" });
            await expect(compare.getByRole("region", { name: "The answer" })).toContainText("falls as wind speed");
            await expect(compare.getByTestId("jc-map").locator("canvas")).toHaveCount(1);
            // Each chart draws (a chart may stack a second canvas for its hover layer).
            await expect(compare.locator(".jc-chart-canvas").filter({ has: page.locator("canvas") })).toHaveCount(2);
            await testInfo.attach(`compare-${scheme}-${size.width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      test("a longer period and another station stay chosen after a reload", async ({ page }) => {
        await serve(page);
        await page.goto(BASE);
        await page.getByRole("combobox", { name: "Period" }).selectOption("7");
        await page.getByRole("combobox", { name: "Air quality station" }).selectOption("makelankatu");
        await page.reload();
        await expect(page.getByRole("combobox", { name: "Period" })).toHaveValue("7");
        await expect(page.getByRole("combobox", { name: "Air quality station" })).toHaveValue("makelankatu");
      });

      // T-3375, SDK-40, AP-140: a station opened in the SDK's entity panel at a phone and a laptop, light
      // and dark. A public App: the panel reads the station and links to it in the Portal, with no Edit.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: a station in the entity panel, linked to the Portal, axe clean`, async ({ page }) => {
            await page.emulateMedia({ colorScheme: scheme });
            const { outside, missing, problems } = await serve(page);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(BASE);
            await page.getByRole("button", { name: "Details of Kallio 2" }).click();
            const panel = page.getByRole("dialog", { name: "Kallio 2" });
            await expect(panel.getByRole("link", { name: "Open in the Portal" })).toHaveAttribute("href", /entityId=urn%3Angsi-ld%3AAirQualityObserved/);
            await expect(panel.getByRole("button", { name: "Edit" })).toHaveCount(0);
            expect(await layoutProblems(page)).toEqual([]);
            await panel.getByRole("button", { name: "Close" }).click();
            await expect(page.getByRole("dialog")).toHaveCount(0);
            expect({ outside, missing, problems }).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }

      // T-3827: a viewer keeps a place and finds it in their history; a steward marks a station's
      // readings faulty and the comparison leaves those hours out. At a phone and a laptop, light and dark.
      for (const scheme of ["light", "dark"] as const) {
        for (const width of [375, 1440]) {
          test(`${scheme} at ${width} px: a viewer keeps a place, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page, VIEWER);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(BASE);
            await expect(page.getByLabel("Your role: Viewer")).toBeVisible();
            await expect(page.getByText("Only a steward marks readings faulty.")).toBeVisible();
            await page.getByRole("button", { name: "My places" }).click();
            const add = page.getByRole("form", { name: "Add the place" });
            await expect(add.getByRole("textbox", { name: "Name" })).toHaveValue("Kallio 2");
            await add.getByRole("button", { name: "Add the place" }).click();
            await expect(page.getByRole("status")).toHaveText("Place added: Kallio 2.");
            await expect(page.getByRole("link", { name: "Open in the comparison: Kallio 2" })).toBeVisible();
            await testInfo.attach(`places-${scheme}-${width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            await page.getByRole("button", { name: "History" }).click();
            await expect(page.getByText(/kept the place Kallio 2/)).toBeVisible();
            expect(await layoutProblems(page)).toEqual([]);
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });

          test(`${scheme} at ${width} px: a steward marks readings faulty, axe clean`, async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: scheme });
            const served = await serve(page, STEWARD);
            await page.setViewportSize({ width, height: 900 });
            await page.goto(BASE);
            await expect(page.getByLabel("Your role: Steward")).toBeVisible();
            const form = page.getByRole("form", { name: "Mark faulty" });
            await form.getByLabel("Reason").fill("sensor cleaned");
            await form.getByRole("button", { name: "Mark faulty" }).click();
            await expect(page.getByText("Marked faulty.")).toBeVisible();
            await expect(page.getByText("6 hours left out as faulty.")).toBeVisible();
            await expect(page.getByRole("button", { name: /^Take the mark back: / })).toBeVisible();
            await testInfo.attach(`faults-${scheme}-${width}.png`, { body: await page.screenshot({ fullPage: true }), contentType: "image/png" });
            expect(await layoutProblems(page)).toEqual([]);
            await page.getByRole("button", { name: "History" }).click();
            await expect(page.getByText(/marked faulty: sensor cleaned/)).toBeVisible();
            expect(served).toEqual({ outside: [], missing: [], problems: [] });
          });
        }
      }
    e2e__serve.ts: |
      import { existsSync, readFileSync } from "node:fs";
      import { extname, join, normalize } from "node:path";
      import { fileURLToPath } from "node:url";
      import type { Page } from "@playwright/test";
      import { stubTransport } from "@joinedcontext/sdk/testing";
      import { AIR_STATIONS, HISTORY, NOW, WEATHER_STATIONS } from "../src/fixtures/stations";
      import { hourlyOf } from "../src/testing/hourly";

      const DIST = fileURLToPath(new URL("../dist/", import.meta.url));
      export const BASE = "http://portal.test/";
      const SLUG = "airweatherexplorer";
      const CONFIG = {
        slug: SLUG,
        orgDomain: "hel.fi",
        space: "helsinki",
        transport: "origin",
        appName: "air-weather-explorer",
        language: "en",
        // Where the entity panel links a station for editing (SDK-40); the link is shown, never followed.
        portal: "https://portal.test/projects/helsinki",
      };
      const TYPES: Record<string, string> = {
        ".html": "text/html",
        ".js": "text/javascript",
        ".css": "text/css",
        ".json": "application/json",
        ".svg": "image/svg+xml",
        ".wasm": "application/wasm",
      };
      // What the Portal's static host sends for a `kind: ui` App once T-3327 allows WebAssembly: no
      // 'unsafe-eval', only 'wasm-unsafe-eval', and nothing from another host.
      const CSP = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'";

      /** What the served page did that it should not: a host it called, a file it missed, an error it threw. */
      export interface Served {
        outside: string[];
        missing: string[];
        problems: string[];
      }

      /** Who the App's server says is signed in (T-3827): a viewer unless a test names a steward. */
      export const VIEWER = { id: "u-1", name: "Vilja Viewer", roles: ["viewer"] };
      export const STEWARD = { id: "u-2", name: "Sami Steward", roles: ["viewer", "steward"] };

      /** Serves the built bundle at the root of the App's own host, with the SDK's stub answering its endpoint. */
      export async function serve(page: Page, me: { id: string; name: string; roles: string[] } = VIEWER): Promise<Served> {
        const transport = stubTransport({
          entities: [...AIR_STATIONS, ...WEATHER_STATIONS],
          temporal: HISTORY,
          access: {
            permissions: ["AirQualityObserved", "WeatherObserved"].map((type) => ({ resource: { type }, actions: ["queryEntity", "retrieveEntity", "retrieveTemporal"], attributes: "*" as const })),
            prohibitions: [],
          },
        });
        const served: Served = { outside: [], missing: [], problems: [] };
        const places: { id: number; name: string }[] = [];
        const faults: { id: number; station: string; note: string }[] = [];
        const history: unknown[] = [];
        page.on("pageerror", (error) => served.problems.push(error.message));
        await page.clock.setFixedTime(new Date(NOW));

        await page.route("**/*", async (route) => {
          const url = new URL(route.request().url());
          if (url.origin !== "http://portal.test") {
            served.outside.push(url.href);
            return route.abort();
          }
          // The App's server (T-3348): the stations' hourly means, as it keeps them.
          if (url.pathname === "/apps/air-weather-explorer/api/series") {
            const days = Number(url.searchParams.get("days") ?? "3");
            const from = Math.floor((NOW - days * 86_400_000) / 3_600_000) * 3_600_000;
            const air = hourlyOf(HISTORY, url.searchParams.get("air") ?? "", from);
            const weather = hourlyOf(HISTORY, url.searchParams.get("weather") ?? "", from);
            return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ air, weather }) });
          }
          // The roles (T-3827): the reader's places, a steward's marks and the history, deciding by `me`
          // as the real server does.
          const api = "/apps/air-weather-explorer/api";
          const method = route.request().method();
          const json = (status: number, body: unknown) => route.fulfill({ status, contentType: "application/json", body: JSON.stringify(body) });
          const sent = () => JSON.parse(route.request().postData() ?? "{}");
          const log = (action: string, target: string, summary: string) =>
            history.unshift({ id: history.length + 1, at: new Date(NOW).toISOString(), actorName: me.name, action, target, summary });
          const steward = me.roles.includes("steward");
          if (url.pathname === `${api}/me`) return json(200, me);
          if (url.pathname === `${api}/history`) return json(200, history);
          if (url.pathname === `${api}/places` && method === "GET") return json(200, places);
          if (url.pathname === `${api}/places` && method === "POST") {
            const place = { ...sent(), id: places.length + 1, latest: null, latestHour: null };
            places.unshift(place);
            log("insert", `places/${place.id}`, `kept the place ${place.name}`);
            return json(201, place);
          }
          if (url.pathname === `${api}/faults` && method === "GET") return json(200, faults.filter((f) => f.station === url.searchParams.get("station")));
          if (url.pathname === `${api}/faults` && method === "POST") {
            if (!steward) return json(403, { detail: "this needs the role steward" });
            const fault = { ...sent(), id: faults.length + 1 };
            faults.unshift(fault);
            log("insert", `faults/${fault.id}`, `marked faulty: ${fault.note}`);
            return json(201, fault);
          }
          if (url.pathname.startsWith(`${api}/`)) {
            served.missing.push(`${method} ${url.pathname}`);
            return json(404, { detail: "no such route" });
          }
          if (url.pathname.startsWith(`/api/endpoint/${SLUG}/`)) {
            const body = route.request().postData();
            const path = url.pathname + url.search;
            const answer = await transport({ method: route.request().method() as "GET", path, body: body ? JSON.parse(body) : undefined });
            return route.fulfill({ status: answer.status, contentType: "application/json", body: JSON.stringify(answer.body ?? null) });
          }
          const file = normalize(url.pathname.slice(1) || "index.html");
          if (file.startsWith("..") || !existsSync(join(DIST, file))) {
            served.missing.push(url.pathname);
            return route.fulfill({ status: 404, body: "" });
          }
          let body = readFileSync(join(DIST, file));
          if (file === "index.html") {
            body = Buffer.from(
              body.toString("utf8").replace('<script id="jc-config" type="application/json"></script>', `<script id="jc-config" type="application/json">${JSON.stringify(CONFIG)}</script>`),
            );
          }
          return route.fulfill({
            status: 200,
            contentType: TYPES[extname(file)] ?? "application/octet-stream",
            headers: { "content-security-policy": CSP },
            body,
          });
        });
        return served;
      }
