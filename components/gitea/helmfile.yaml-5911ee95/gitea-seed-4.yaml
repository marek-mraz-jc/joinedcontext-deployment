                cs: Výměra
                en: Area
                de: Fläche
            ngsi_ld_kind: Property
        legalId:
          slot_uri: jc:legalId
          description: The body's identification number (IČO) in the Slovak register of legal persons.
          pattern: ^[0-9]{8}$
          annotations:
            label:
              tag: label
