                let local = if $day != null && $m.t.or("") != "" { "%sT%s:%s:00".format($day, $m.t.slice(0, 2), $m.t.slice(2, 4)) } else { null }
                root = if $local != null { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") } else { $day }
              }
              let page = content().string()
              let when = $page.re_find_object("data-date-start=\"(?P<s>[0-9T]*)\" data-date-end=\"(?P<e>[0-9T]*)\"")
              root.name = $page.re_find_object("<h1[^>]*>(?P<v>[^<]{1,500})</h1>").v.or(null)
              root.start = $when.s.or(null).apply("at")
              root.end = $when.e.or(null).apply("at")
              root.venue = $page.re_find_object("class=\"venue\">(?:<i[^>]*></i>)?(?:<span[^>]*>[^<]*</span>)?(?P<v>[^<]{1,300})</h2>").v.or(null)
              root.category = $page.re_find_object("Typ akcie:(?P<v>[^<]{1,200})<").v.or(null)
              root.description = $page.re_find_object("<p id=\"action-detail\">(?P<v>[\\s\\S]*?)</p>").v.or(null)
        - archive:
            format: json_array
        - mutation: |
            meta events = {"category_cache": {}, "category_default": null, "facts_only": true, "grace": 0, "home": {"poi":"osm-way-85611382","match":"obecný úrad poniky","town":"poniky","venue":"Obecný úrad poniky","streetAddress":"Malá stráňa 32/12","addressLocality":"Poniky","lat":48.7097417,"lon":19.2898686,"checked_by":"overpass"}, "lease": 187200, "listing": "https://www.poniky.sk/aktualne/kalendar-akcii/", "organizer": {"name": "Obec Poniky", "url": "https://www.poniky.sk"}, "provider": "Poniky, poniky.sk (licencia neuvedená)", "region": "Banskobystrický kraj", "scope": "/SK/BB", "self": ["celá obec", "mesto", "mesto poniky", "mestský úrad", "mestský úrad poniky", "obec", "obec poniky", "obecný úrad", "obecný úrad poniky", "poniky", "poniky - celá obec", "v obci"], "source": "https://www.poniky.sk/aktualne/kalendar-akcii/", "space": env("JC_SPACE"), "town": "Poniky", "town_scope": "/SK/BB/poniky", "towns": [["Poniky","poniky",48.70974,19.28987,"office"]], "venues": [{"poi":"osm-way-85611382","match":"obecný úrad poniky","town":"poniky","venue":"Obecný úrad poniky","streetAddress":"Malá stráňa 32/12","addressLocality":"Poniky","lat":48.7097417,"lon":19.2898686,"checked_by":"overpass"}]}
