        title:
          sk: Podjazdy v Banskobystrickom kraji (public view)
          en: Podjazdy v Banskobystrickom kraji (public view)
      spec:
        class: scheduled
        enabled: true
        schedule: 18 2 * * 5
        source:
          dataSourceRef:
            kind: DataSource
            name: od-podjazdy-v-banskobystrickom-kraji-public
        targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-otvorene-data:bbsk-otvorene-data
