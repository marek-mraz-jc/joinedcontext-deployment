            upstream_source: https://schema.org/PostalAddress
          slots: [streetAddress, postalCode, addressLocality, addressCountry]
        Bridge:
          class_uri: jc:Bridge
          description: One bridge of the road network in the region, its road, its age, its size and who manages it, as the Smart Data Model extension Bridge (PointOfInterest base).
          is_a: Entity
          annotations:
            upstream_source: https://github.com/marek-mraz/joinedcontext-deployment/blob/main/scripts/open-data/sdm/extensions/Bridge
          slots:
            - name
            - bridgeCode
            - roadClass
            - roadNumber
            - yearBuilt
            - spanCount
            - bridgedLength
            - structureMaterial
            - structureKind
            - heritageStatus
            - managerName
            - districtName
            - dataProvider
            - source

