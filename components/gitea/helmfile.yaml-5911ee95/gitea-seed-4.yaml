            - isPartOf
            - dataProvider
            - source
            - childAreas
            - publicOrganizations
        PublicOrganization:
          class_uri: sdm-cpsv:PublicOrganization
          description: >-
            One organisation the region founded: a secondary school, a social-care home, a theatre, a
            museum or an office. The FIWARE Smart Data Model CPSV-AP PublicOrganization.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP
          slots:
            - name
            - preferredLabel
            - spatial
            - alternateName
            - legalId
            - organizationCategory
            - address
            - refMunicipality
            - dataProvider
            - source
        PointOfInterest:
          class_uri: sdm-poi:PointOfInterest
