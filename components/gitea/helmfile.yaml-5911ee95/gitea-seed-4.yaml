        - mapping: |
            root = {
              "id": "urn:ngsi-ld:PointOfInterest:%s:%s".format(env("JC_SPACE"), this.index(0)),
              "type": "PointOfInterest",
              "scope": this.index(6),
              "name": { "type": "Property", "value": this.index(1) },
              "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [this.index(5), this.index(4)] } },
              "address": { "type": "Property", "value": { "streetAddress": this.index(2), "addressLocality": this.index(3), "addressCountry": this.index(6).split("/").index(1) }.filter(kv -> kv.value != null) },
              "areaServed": { "type": "Property", "value": this.index(7) },
              "source": { "type": "Property", "value": if this.index(0).has_prefix("osm-") { "https://www.openstreetmap.org/" + this.index(0).trim_prefix("osm-").replace("-", "/") } else { "https://github.com/marek-mraz-jc/joinedcontext-deployment/blob/main/seeds/bbsk-events/venues.csv" } },
              "dataProvider": { "type": "Property", "value": "© OpenStreetMap contributors, ODbL 1.0" }
            }
        - archive:
            format: json_array
    projects__bbsk__pipelines__obyvatelstvo__pipeline.yaml: |
      # One KeyPerformanceIndicator per territory per year from the ŠÚ SR resident-population cube. Writes through the space's one Endpoint with the runner's service account, so the Policy applies to it as to anybody (PL-18, PF-39).
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: obyvatelstvo
        namespace: bbsk
        title: { sk: Stav obyvateľstva kraja a okresov, en: Population of the region and its districts }
      spec:
        class: auto
        # Annual data. Polling it weekly is already ten times more often than it changes, and it is
        # the publisher's bandwidth being spent (PL-26, PL-27).
        period: 168h
        schedule: '13 3 * * 1'
        source:
          dataSourceRef: { kind: DataSource, name: susr-om7102rr }
        targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-kraj:bbsk-kraj
        output: { type: KeyPerformanceIndicator, mode: upsert }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__bbsk__pipelines__od-cyklisti-nehodovost__bento.yaml: |
      # The mapping of the od-cyklisti-nehodovost pipeline, generated from the T-4254 mapping: one RoadAccident per row of
      # "Cyklisti_nehodovosť" (https://opendata.dev.joinedcontext.com/dataset/bbsk-cyklisti-nehodovost-addf0f). Do not edit: change the mapping and run scripts/open-data/generate.py.

      pipeline:
        processors:
          # A layer that answers an error or no feature list is the service failing, so the run fails
          # where it can be seen rather than writing nothing.
          - mapping: |
              root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
          # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
          # every further page of them is read (T-5288). One run holds every page, so a layer past
          # 10000 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
          - branch:
              request_map: |
                root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
              processors:
                - http:
                    url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Cyklisti_nehodovos%C5%A5_(1)/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
                    verb: GET
                    headers:
                      Accept: application/json
                    timeout: 60s
                    retries: 2
                    rate_limit: pipeline_egress
              result_map: |
                root.rowCount = this.count.or(this.error.message.or("no count"))
          - mapping: |
              let rows = this.rowCount.or(null)
              root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 10000 { [{ "problem": "the layer holds %v rows, more than the 10000 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
          - unarchive:
              format: json_array
          - switch:
              - check: this.offset.or(null) != null
                processors:
                  - mapping: |
                      meta offset = this.offset
                      meta rows = this.rowCount
                      root = ""
                  - http:
