    projects__bbsk__pipelines__od-pohyb-obyvatelstva-v-obciach__pipeline.yaml: |
      # One KeyPerformanceIndicator per row of "Pohyb obyvateľstva v obciach (1996 - 2024)" (T-4255); one row per area (and year).
