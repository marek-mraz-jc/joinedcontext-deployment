    projects__bbsk__spaces__bbsk-podujatia__endpoints__bbsk-podujatia-zapis.yaml: |
      # The write door of bbsk-podujatia (T-5033): the podujatia-* pipelines upsert through it. Each Pipeline writes as
      # its own derived account pl-{pipeline} under a derived Policy (PL-19, PL-20), and an Endpoint binds those only
      # without a policyRef, as helsinki-all and zilina-mesto do; the public Endpoints keep their read policyRef.
      # Writes here are granted to the pipelines' accounts alone; the audience keeps out anyone outside the organization.
      apiVersion: joinedcontext.com/v1alpha1
      kind: Endpoint
      metadata:
        name: bbsk-podujatia-zapis
        namespace: bbsk
        title: { sk: "Podujatia: zápis kanálov", en: "Events: pipeline writes" }
        description:
          sk: "Interný vstup, cez ktorý zberné kanály zapisujú podujatia; čítajú sa cez verejný Endpoint bbsk-podujatia."
          en: "The internal door the ingestion pipelines write the events through; people read them through the public Endpoint bbsk-podujatia."
      spec:
        contextSpaceRef: bbsk-podujatia
        slug: xfkyiscytdlbjkx4ija36etw3sreihhw
        audience: organization
        enabledRepresentations: [ngsi-ld, websocket, ogc-features, mcp]
    projects__bbsk__spaces__bbsk-podujatia__endpoints__bbsk-podujatia.yaml: |
      # The region's events (T-4895): the events of bbsk-podujatia whose scope is /SK/BB, read through a Policy that narrows by scopeQ.
      # The space holds the region's own sources since T-5047; the national store is slovensko-podujatia in the Slovakia project.
      apiVersion: joinedcontext.com/v1alpha1
      kind: Endpoint
      metadata:
        name: bbsk-podujatia
        namespace: bbsk
        title: { sk: "Podujatia v Banskobystrickom kraji", en: "Events in the Banská Bystrica Region" }
        description:
          sk: "Nadchádzajúce podujatia miest, obcí a inštitúcií Banskobystrického kraja s časom a miestom konania, aj ako kalendár na odber."
          en: "Upcoming events of the towns, municipalities and bodies of the Banská Bystrica Region with their time and place, also as a calendar to subscribe to."
      spec:
        contextSpaceRef: bbsk-podujatia
        slug: hqgmj6ieuq57y37g5g4ckz5eyhebklox
        audience: public
        policyRef: urn:ngsi-ld:Policy:bbsk.sk:bbsk-podujatia:podujatia-kraj-read
        # ical: the calendars a person subscribes to, /api/endpoint/{slug}/ical/v1/{name}.ics, one per output of
        # representations.ical (EP-125, EP-159); events.ics is the first one (deprecated alias).
        enabledRepresentations: [ngsi-ld, csv, websocket, ogc-features, odata, mcp, ical]
        representations:
          ical:
            - name: vsetky
              title: { sk: "Všetky podujatia v kraji", en: "All events in the region" }
              lang: sk
              timezone: Europe/Bratislava
              sources:
                - type: Event
                  preset: sdm-event
                  mapping: { LAST-MODIFIED: dateModified, CATEGORIES: eventCategory }
            - name: kultura
              title: { sk: "Kultúra v kraji", en: "Culture in the region" }
              lang: sk
              timezone: Europe/Bratislava
              sources:
                - type: Event
                  preset: sdm-event
                  mapping: { LAST-MODIFIED: dateModified, CATEGORIES: eventCategory }
              filter: { q: 'eventCategory~="(?i)kult|koncert|divadl|výstav|festival|film"' }
            - name: sport
              title: { sk: "Šport v kraji", en: "Sports in the region" }
              lang: sk
              timezone: Europe/Bratislava
              sources:
                - type: Event
                  preset: sdm-event
                  mapping: { LAST-MODIFIED: dateModified, CATEGORIES: eventCategory }
              filter: { q: 'eventCategory~="(?i)šport|sport|turnaj|beh"' }
            - name: deti
              title: { sk: "Pre deti a rodiny", en: "For children and families" }
              lang: sk
              timezone: Europe/Bratislava
              sources:
                - type: Event
                  preset: sdm-event
                  mapping: { LAST-MODIFIED: dateModified, CATEGORIES: eventCategory }
              filter: { q: 'eventCategory~="(?i)det[ií]|rodin"' }
        publish:
          ckan:
            instanceRef: { kind: CkanInstance, name: bbsk }
            license: cc-by
        catalog:
          publisher: { name: { sk: "Banskobystrický samosprávny kraj", en: "Banská Bystrica Self-Governing Region" }, uri: "https://www.bbsk.sk/" }
          # Public events of public bodies: a record names an event and its place, never a person.
          personalData: does-not-contain
          license: CC_BY_4_0
          attribution: { sk: "Zdroj: webové stránky miest, obcí a inštitúcií, ktoré podujatie zverejnili (atribút source); polohy miest konania © prispievatelia OpenStreetMap, ODbL 1.0", en: "Source: the web sites of the towns, municipalities and bodies that announced each event (attribute source); venue points © OpenStreetMap contributors, ODbL 1.0" }
          themes: [EDUC, SOCI]
          keywords:
            sk: ["podujatia", "kultúra", "kalendár"]
            en: ["events", "culture", "calendar"]
          spatial:
            - "SK032"
          frequency: DAILY
          # BEGIN sources generated by seeds/bbsk-events/generate.py (T-4898): do not edit by hand
          source:
            - url: "https://www.banskabystrica.sk/podujatia/"
              title: { sk: "Banská Bystrica, banskabystrica.sk", en: "Banská Bystrica, banskabystrica.sk" }
              description:
                sk: "Podujatia zo stránky https://www.banskabystrica.sk/podujatia/; licencia CC-BY-4.0."
                en: "Events from https://www.banskabystrica.sk/podujatia/; licence CC-BY-4.0."
