    projects__bbsk__pipelines__od-pohyb-obyvatelstva-v-okresoch__bento.yaml: |
      # The mapping of the od-pohyb-obyvatelstva-v-okresoch pipeline, generated from the T-4254 mapping: one KeyPerformanceIndicator per row of
      # "Pohyb obyvateľstva v okresoch (1996 - 2024)" (https://opendata.dev.joinedcontext.com/dataset/bbsk-pohyb-obyvatelstva-v-okresoch-1996-2024-8b7fa1). Do not edit: change the mapping and run scripts/open-data/generate.py.

      pipeline:
        processors:
          # A layer that answers an error or no feature list is the service failing, so the run fails
          # where it can be seen rather than writing nothing.
          - mapping: |
              root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
          # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
          # every further page of them is read (T-5288). One run holds every page, so a layer past
          # 10000 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
          - branch:
              request_map: |
                root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
              processors:
                - http:
                    url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/pohyb_okresy_view/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
                    verb: GET
                    headers:
                      Accept: application/json
                    timeout: 60s
                    retries: 2
                    rate_limit: pipeline_egress
              result_map: |
                root.rowCount = this.count.or(this.error.message.or("no count"))
          - mapping: |
              let rows = this.rowCount.or(null)
              root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 10000 { [{ "problem": "the layer holds %v rows, more than the 10000 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
          - unarchive:
              format: json_array
          - switch:
              - check: this.offset.or(null) != null
                processors:
                  - mapping: |
                      meta offset = this.offset
                      meta rows = this.rowCount
                      root = ""
                  - http:
                      url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/pohyb_okresy_view/FeatureServer/0/query?where=1%3D1&outFields=DOW,FACC,IDN3,NM3,IDN2,NM2,VYMERA,NUTS1,NUTS1_CODE,NUTS2,NUTS2_CODE,NUTS3,NUTS3_CODE,LAU1,LAU1_CODE,Okres_ID,Okres_dlh%C3%BD_n%C3%A1zov,Kraj_ID,Kraj_dlh%C3%BD_n%C3%A1zov,Rok,Stav_trvale_b%C3%BDvaj%C3%BAceho_obyvate%C4%BE,Stav_trvale_b%C3%BDvaj%C3%BAceho_obyvat_1,Stav_trvale_b%C3%BDvaj%C3%BAceho_obyvat_2,Naroden%C3%AD__Osoba_,Hrub%C3%A1_miera_%C5%BEivorodenosti__Prom,Potraty__Po%C4%8Det_v_jednotk%C3%A1ch_,Hrub%C3%A1_miera_potratovosti__Promi,Index_potratovosti__Percento_,Ukon%C4%8Den%C3%A9_tehotenstv%C3%A1__Po%C4%8Det_v_j,Hrub%C3%A1_miera_ukon%C4%8Den%C3%BDch_tehotens,Zomret%C3%AD__Osoba_,Hrub%C3%A1_miera_%C3%BAmrtnosti__Promile_,Doj%C4%8Densk%C3%A1_%C3%BAmrtnos%C5%A5__Osoba_,Miera_doj%C4%8Denskej_%C3%BAmrtnosti__Pro,Novorodeneck%C3%A1_%C3%BAmrtnos%C5%A5__Osoba_,Miera_novorodeneckej_%C3%BAmrtnosti_,Perinat%C3%A1lna_%C3%BAmrtnos%C5%A5__Osoba_,Miera_perinat%C3%A1lnej_%C3%BAmrtnosti__P,%C5%A0tandardn%C3%A1_doj%C4%8Densk%C3%A1_%C3%BAmrtnos%C5%A5__,%C5%A0tandardn%C3%A1_novorodeneck%C3%A1_%C3%BAmrtno,Sob%C3%A1%C5%A1e__Po%C4%8Det_v_jednotk%C3%A1ch_,Hrub%C3%A1_miera_sob%C3%A1%C5%A1nosti__Promile,Rozvody__Po%C4%8Det_v_jednotk%C3%A1ch_,Hrub%C3%A1_miera_rozvodovosti__Promi,Index_rozvodovosti__Percento_,Prirodzen%C3%BD_pr%C3%ADrastok_obyvate%C4%BEst,Hrub%C3%A1_miera_prirodzen%C3%A9ho_pr%C3%ADras,Pris%C5%A5ahovan%C3%AD_na_trval%C3%BD_pobyt__O,Vys%C5%A5ahovan%C3%AD_z_trval%C3%A9ho_pobytu__,Migra%C4%8Dn%C3%A9_saldo__Osoba_,Hrub%C3%A1_miera_migra%C4%8Dn%C3%A9ho_salda__P,Celkov%C3%BD_pr%C3%ADrastok_obyvate%C4%BEstva_,Hrub%C3%A1_miera_celkov%C3%A9ho_pr%C3%ADrastku,%C5%BDivonaroden%C3%AD__Osoba_&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000&orderByFields=ObjectId"
                      verb: GET
                      headers:
                        Accept: application/geo+json
                      timeout: 60s
                      retries: 2
                      rate_limit: pipeline_egress
                  - mapping: |
                      root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else if this.features.or(null) == null { { "problem": "the page at %v answered no features: %v".format(@offset, this.error.message.or("")) } } else if this.features.length() < [1000, @rows - @offset].min() { { "problem": "the page at %v answered %v rows where %v were due".format(@offset, this.features.length(), [1000, @rows - @offset].min()) } } else { this }
