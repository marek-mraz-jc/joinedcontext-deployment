    projects__bbsk__pipelines__podujatia-centralslovakia__bento.yaml: |
      # Generated by seeds/bbsk-events/generate.py from the inventory row Banskobystrický kraj (ical),
      # read 2026-10-20: https://centralslovakia.eu/events/ (T-4896). Do not edit: change the template or the CSV.
      pipeline:
        processors:
        - mapping: |
            let text = content().string()
            root = if !$text.contains("BEGIN:VCALENDAR") { throw("the answer is no iCalendar") } else { $text.re_replace_all("\r\n", "\n").re_replace_all("\n[ \t]", "") }
        - mapping: |
            map unescape {
              root = this.replace_all("\\n", " ").replace_all("\\N", " ").replace_all("\\,", ",").replace_all("\\;", ";").replace_all("\\\\", "\\")
            }
            # DTSTART/DTEND: a date, a UTC instant, or local time in the TZID (Europe/Bratislava here).
