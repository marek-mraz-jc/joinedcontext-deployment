54","match":"zimný štadión vo zvolen","town":"zvolen","venue":"Zimný štadión Zvolen","streetAddress":"Pod Dráhami 2292/21","addressLocality":"Zvolen","lat":48.5662224,"lon":19.1209496,"checked_by":"nominatim"},{"poi":"osm-node-313179869","match":"divadlo jozefa gregora tajovského","town":"zvolen","venue":"Divadlo Jozefa Gregora Tajovského","streetAddress":null,"addressLocality":"Zvolen","lat":48.5786614,"lon":19.1270324,"checked_by":"nominatim"},{"poi":"osm-node-1709872011","match":"mestský úrad zvolen","town":"zvolen","venue":"Mestský úrad","streetAddress":null,"addressLocality":"Zvolen","lat":48.5782821,"lon":19.1235398,"checked_by":"overpass"}]}
