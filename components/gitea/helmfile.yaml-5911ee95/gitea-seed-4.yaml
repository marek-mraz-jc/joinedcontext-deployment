            format: json_array
        - mutation: |
            meta events = {"category_cache": {}, "category_default": null, "facts_only": true, "grace": 0, "home": {"poi":"osm-node-11649090950","match":"obecný úrad prša","town":"prsa","venue":"Obecný úrad Prša","streetAddress":null,"addressLocality":"Prša","lat":48.3000502,"lon":19.7917208,"checked_by":"nominatim"}, "lease": 187200, "listing": "https://obecprsa.sk/events/", "organizer": {"name": "Obec Prša", "url": "https://obecprsa.sk"}, "provider": "Prša, obecprsa.sk (licencia neuvedená)", "region": "Banskobystrický kraj", "scope": "/SK/BB", "self": ["celá obec", "mesto", "mesto prša", "mestský úrad", "mestský úrad prša", "obec", "obec prša", "obecný úrad", "obecný úrad prša", "prša", "prša - celá obec", "v obci"], "source": "https://obecprsa.sk/events/", "space": env("JC_SPACE"), "town": "Prša", "town_scope": "/SK/BB/prsa", "towns": [["Prša","prsa",48.30005,19.79172,"office"]], "venues": [{"poi":"osm-node-11649090950","match":"obecný úrad prša","town":"prsa","venue":"Obecný úrad Prša","streetAddress":null,"addressLocality":"Prša","lat":48.3000502,"lon":19.7917208,"checked_by":"nominatim"}]}
