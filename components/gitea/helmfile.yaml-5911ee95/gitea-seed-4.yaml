    projects__bbsk__pipelines__nemocnice__pipeline.yaml: |
      # One PointOfInterest (category hospital) per record of `bbsk-nemocnice`, written into the register space through its one Endpoint (PL-18, T-2783).
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: nemocnice
        namespace: bbsk
        title: { sk: Nemocnice v kraji, en: Hospitals in the region }
      spec:
        class: auto
        # A register the region revises a few times a year: weekly is already more than it needs (PL-26).
        period: 168h
        schedule: '49 3 * * 1'
        source:
          dataSourceRef: { kind: DataSource, name: bbsk-nemocnice }
        targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-registre:bbsk-registre
        # Each register is a full snapshot this pipeline alone writes: replace makes every entity exactly the
        # record, so an attribute the mapping dropped or retyped leaves at the next run (PL-79, T-5167).
        output: { type: PointOfInterest, mode: replace }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__bbsk__pipelines__obyvatelstvo__bento.yaml: |
      # The mapping of the obyvatelstvo pipeline (PL-03): one KeyPerformanceIndicator per territory per
      # year from the resident-population cube of ŠÚ SR, for the kraj SK032 and its 13 okresy. Nothing
      # is renamed and nothing is recomputed: the publisher’s own codes go in as published and the
      # request that produced the row travels with it in `source`.

      pipeline:
        processors:
          - mapping: |
              # --- the cube this stream reads ---------------------------------------
              let cube = "om7102rr"
              let area_dim = "om7102rr_vuc"
              let period_dim = "om7102rr_obd"
              let indicator_dim = "om7102rr_ukaz"
              let key_dims = []
              let unit_code = "C62"
              let unit_text = "osoby"
              # A cell times this is in the unit unitCode names: 1000 for a cube stated in thousands
              # ("v tis. m3"), else 1 (F-BNT1-015).
              let scale = 1
              let source_url = "https://data.statistics.sk/api/v2/dataset/om7102rr/SK032,SK0321,SK0322,SK0323,SK0324,SK0325,SK0326,SK0327,SK0328,SK0329,SK032A,SK032B,SK032C,SK032D/*/IN010115/SPOLU?lang=sk&type=json"
              let domain = "bbsk.sk"
              # JSON-stat 2.0, decoded by the index and never by the order. `value` is flat and
              # row-major over `size`; the position of a code inside a dimension is
              # `dimension.{name}.category.index`, which is NOT sorted: the period dimension comes back
              # newest first (`["2024", "2023"]`). Reading it as ascending puts every figure against the
              # wrong year, and the number is real, so nothing about it looks wrong (T-2304 correction).
              let ds = this
              let ids = this.id
              let sizes = this.size
              let n = $sizes.length()
              let codes = $ids.map_each(d -> $ds.dimension.get(d).category.index.key_values().sort_by(kv -> kv.value).map_each(kv -> kv.key))
              let strides = range(0, $n, 1).map_each(k -> if k + 1 >= $n { 1 } else { $sizes.slice(k + 1, $n).fold(1, t -> t.tally * t.value) })
              # The publisher's own "last updated", which is what a cell was observed at. A cube with none
              # yields null and the entity carries no dateObserved rather than an invented one.
              let updated = $ds.update.or("").ts_parse("2006-01-02").ts_format("2006-01-02T15:04:05Z07:00", "UTC").catch(null)
              # One entity per cell that carries a number. A cell the publisher left empty is not a zero.
              root = range(0, $ds.value.length(), 1).map_each(p -> { "at": range(0, $n, 1).map_each(k -> { $ids.index(k): $codes.index(k).index(((p / $strides.index(k)).floor().int64()) % $sizes.index(k)) }).squash(), "cell": $ds.value.index(p) }).filter(c -> c.cell != null).map_each(c -> {
                "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", $domain, env("JC_SPACE"), [$cube, c.at.get($area_dim), c.at.get($period_dim), c.at.get($indicator_dim)].concat($key_dims.map_each(d -> c.at.get(d))).join("-")),
                "type": "KeyPerformanceIndicator",
                "dataSet": { "type": "Property", "value": $cube },
                "indicator": { "type": "Property", "value": c.at.get($indicator_dim) },
                "refArea": { "type": "Property", "value": c.at.get($area_dim) },
                "refPeriod": { "type": "Property", "value": c.at.get($period_dim) },
                "dimensionKey": if $key_dims.length() == 0 { null } else { { "type": "Property", "value": $key_dims.map_each(d -> c.at.get(d)).join("-") } },
                # `observedAt` belongs to the attribute, never to the entity: CIM 009 4.5.1 makes it a
                # core non-reified term, and the broker refuses a whole entity that carries one as an
                # attribute of its own — 400 per entity, dropped by `drop_on`, so the space stayed empty
                # in silence (T-2445). A cube that states no update time gets no `observedAt` at all.
                # A unit with no UN/CEFACT code (a currency) and a cube with no update time leave their
                # term out rather than write a null the broker refuses.
                "kpiValue": { "type": "Property", "value": c.cell * $scale, "unitCode": $unit_code, "observedAt": $updated }.filter(entry -> entry.value != null),
                "unitText": { "type": "Property", "value": $unit_text },
                "source": { "type": "Property", "value": $source_url },
                "dateObserved": if $updated == null { null } else { { "type": "Property", "value": $updated } }
              }.filter(entry -> entry.value != null))
    projects__bbsk__pipelines__od-cykloturisticke-trasy-nosic-infotabula-o__bento.yaml: |
      # The mapping of the od-cykloturisticke-trasy-nosic-infotabula-o pipeline, generated from the T-4254 mapping: one PointOfInterest per row of
      # "Cykloturistické trasy - nosič/infotabuľa/odpočívadlo/značenie" (https://opendata.dev.joinedcontext.com/dataset/bbsk-cykloturisticke-trasy-nosic-infotabula-odpocivadlo-znacenie-f3c643). Do not edit: change the mapping and run scripts/open-data/generate.py.

      pipeline:
        processors:
          # A layer that answers an error or no feature list is the service failing, so the run fails
          # where it can be seen rather than writing nothing.
          - mapping: |
              root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
          # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
          # every further page of them is read (T-5288). One run holds every page, so a layer past
          # 10000 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
          - branch:
              request_map: |
                root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
              processors:
                - http:
                    url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/nosic_info_odpoc_WGS_ML/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
                    verb: GET
                    headers:
                      Accept: application/json
                    timeout: 60s
                    retries: 2
                    rate_limit: pipeline_egress
              result_map: |
                root.rowCount = this.count.or(this.error.message.or("no count"))
          - mapping: |
              let rows = this.rowCount.or(null)
              root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 10000 { [{ "problem": "the layer holds %v rows, more than the 10000 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
          - unarchive:
              format: json_array
          - switch:
              - check: this.offset.or(null) != null
                processors:
                  - mapping: |
                      meta offset = this.offset
                      meta rows = this.rowCount
                      root = ""
                  - http:
                      url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/nosic_info_odpoc_WGS_ML/FeatureServer/0/query?where=1%3D1&outFields=mal_znac,stlp_ex,stlp_mat,stlp_stav,nedost_typ,trasa_spr,typ,zdroj,name,id,Pozn,nedost,trasa_no,trasa_farb,dopln_stp,stn,obtiazmost,nedostatok&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000&orderByFields=FID"
                      verb: GET
                      headers:
                        Accept: application/geo+json
                      timeout: 60s
                      retries: 2
                      rate_limit: pipeline_egress
                  - mapping: |
                      root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else if this.features.or(null) == null { { "problem": "the page at %v answered no features: %v".format(@offset, this.error.message.or("")) } } else if this.features.length() < [1000, @rows - @offset].min() { { "problem": "the page at %v answered %v rows where %v were due".format(@offset, this.features.length(), [1000, @rows - @offset].min()) } } else { this }
          # A refusal above fails the run and writes none of its message's rows.
          - mapping: |
              root = if this.problem.or(null) != null { throw(this.problem) } else { this }
          - mapping: |
              root = this.features.or([])
          - unarchive:
              format: json_array
          - mapping: |
              # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
              # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
              map number {
                let s = this.string().re_replace_all("[ 	  ]", "")
                let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
                root = $t.number().catch(null)
              }
              map integer {
                let v = if this == null { null } else { this.apply("number") }
                root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
              }
              map float {
                let v = if this == null { null } else { this.apply("number") }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              map string {
                let v = if this == null { "" } else { this.string().trim() }
                root = if $v == "" { null } else { { "type": "Property", "value": $v } }
              }
              map string_list {
                let v = if this == null { "" } else { this.string().trim() }
                root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
              }
              map uri {
                root = this.apply("string")
              }
              # An Esri date is milliseconds since the epoch; a WordPress one is text.
              # `match` rebinds `this` to what it matches, so the value is named first.
              map datetime {
                let x = this
                let v = match $x.type() {
                  "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
                  "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
                  _ => null,
                }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
              # anything else reads as a datetime (T-4288).
              map observed {
                let x = this
                root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
                  $x.apply("datetime").value.catch(null)
                }
              }
              # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
              map stamped {
                root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
              }
              map date {
                let x = this
                let v = match $x.type() {
                  "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
                  # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
                  "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
                    $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
                  },
                  _ => null,
                }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              let local = "cykloturisticke-trasy-nosic-infotabula-o-" + {"mal_znac": this.properties."mal_znac", "stlp_ex": this.properties."stlp_ex", "stlp_mat": this.properties."stlp_mat", "stlp_stav": this.properties."stlp_stav", "nedost_typ": this.properties."nedost_typ", "trasa_spr": this.properties."trasa_spr", "typ": this.properties."typ", "zdroj": this.properties."zdroj", "name": this.properties."name", "id": this.properties."id", "Pozn": this.properties."Pozn", "nedost": this.properties."nedost", "trasa_no": this.properties."trasa_no", "trasa_farb": this.properties."trasa_farb", "dopln_stp": this.properties."dopln_stp", "stn": this.properties."stn", "obtiazmost": this.properties."obtiazmost", "nedostatok": this.properties."nedostatok"}.format_json(no_indent: true).hash("sha256").encode("hex").slice(0, 24).re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
              root = {
                "id": "urn:ngsi-ld:%v:%v:%v:%v".format("PointOfInterest", "bbsk.sk", env("JC_SPACE"), $local),
                "type": "PointOfInterest",
                "malZnac": this.properties."mal_znac".apply("integer"),
                "stlpEx": this.properties."stlp_ex".apply("integer"),
                "stlpMat": this.properties."stlp_mat".apply("string"),
                "stlpStav": this.properties."stlp_stav".apply("string"),
                "nedostTyp": this.properties."nedost_typ".apply("string"),
                "trasaSpr": this.properties."trasa_spr".apply("string"),
                "typ": this.properties."typ".apply("string"),
                "zdroj": this.properties."zdroj".apply("string"),
                "name": this.properties."name".apply("string"),
                "sourceId": this.properties."id".apply("string"),
                "pozn": this.properties."Pozn".apply("string"),
                "nedost": this.properties."nedost".apply("integer"),
                "trasaNo": this.properties."trasa_no".apply("string"),
                "trasaFarb": this.properties."trasa_farb".apply("string"),
                "doplnStp": this.properties."dopln_stp".apply("integer"),
                "stn": this.properties."stn".apply("integer"),
                "obtiazmost": this.properties."obtiazmost".apply("string"),
                "nedostatok": this.properties."nedostatok".apply("string"),
                "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
                "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
                "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/nosic_info_odpoc_WGS_ML/FeatureServer/0/query?where=1%3D1&outFields=mal_znac,stlp_ex,stlp_mat,stlp_stav,nedost_typ,trasa_spr,typ,zdroj,name,id,Pozn,nedost,trasa_no,trasa_farb,dopln_stp,stn,obtiazmost,nedostatok&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000&orderByFields=FID" },
                "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-cykloturisticke-trasy-nosic-infotabula-odpocivadlo-znacenie-f3c643" }
              }.filter(entry -> entry.value != null)
          # One request per run's batch rather than one per row.
          - split:
              size: 1000
              byte_size: 2097152
          - archive:
              format: json_array
    projects__bbsk__pipelines__od-dilatacne-celky-v-banskobystrickom-kraji__pipeline.yaml: |
