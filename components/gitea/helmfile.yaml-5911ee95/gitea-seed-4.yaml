  s4-bbsk--7:
    projects__bbsk__apps__bbsk-zaznamy__app.yaml: |
      # Seeded from joinedcontext-portal apps/bbsk-zaznamy/app.yaml, whose bundle the Portal image ships
      # under JC_PORTAL_APPS_DIR (T-3596, as T-2916 did for banskabystrica-zaznamy): the static host serves
      # only an App the configuration repository holds, so the manifest is committed here like every
      # other one. Keep the two equal.
      # Záznamy kraja — the region's records, with the one attribute a person may write (AP-09, AP-40,
      # AP-62, EP-14, T-2437). Hand written, so no generated-by annotation.
      #
      # It is `ui`: a bundle the Portal serves under /apps/bbsk-zaznamy/ on the platform
      # origin, so a write carries the person's own session and CSRF header and the gateway decides it
      # (Architecture/16 §8). The application holds no credential of its own.
      #
      # The city's grid is the same bundle with its own manifest, `apps/banskabystrica-zaznamy`: which
      # body's records a screen shows comes from the space its configuration names, never from its code.
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: bbsk-zaznamy
        namespace: bbsk
        title: { sk: Záznamy Banskobystrického kraja, en: Records of the Banská Bystrica region }
        description:
          sk: Zverejnené štatistické riadky kraja po stranách, s filtrom v každom stĺpci, ktorý zodpovie endpoint. Čísla patria vydavateľovi a sú len na čítanie; upraviť sa dá poznámka správcu.
          en: The region's published statistical rows by the page, with a filter on every column that the endpoint answers itself. The figures belong to the publisher and are read-only; the steward's note is what can be edited.
        annotations:
          # The Portal image ships this bundle (Dockerfile, /srv/apps), so the App names no
          # repository of its own; the Portal accepts the mark only where the bundle is (AP-87).
          joinedcontext.com/shipped-with: portal
      spec:
        kind: ui
        source:
          path: ./apps/bbsk-zaznamy
        build: { node: '22' }
        # Not public: the rows are somebody else's published data mirrored here, and the endpoint's
        # audience is `organization` (AP-18).
        visibility: project
        lifecycle: published
        # Every member of the project reads the table; only a steward writes the note (T-5091: the
        # write sat on the caller role, so the project's viewers could type notes too).
        roles:
          - name: steward
            title: { sk: Správca, en: Steward }
            description: Also writes the steward's note on a record.
        access:
          - role: steward
            subjects:
              - group: bbsk-zaznamy-steward
        embeddable: true
        dataNeeds:
          # One space, one type, and one write on one attribute — which is what puts this publication
          # in the red lane on purpose (AP-09, AP-39).
          - contextSpaceRef: { kind: ContextSpace, name: bbsk-kraj }
            types: [KeyPerformanceIndicator]
            # The columns the table shows and filters on, and the one attribute it writes. A filter
            # names an attribute, so an attribute missing here is a filter the endpoint refuses.
            attrs:
              - indicator
              - refArea
              - refPeriod
              - kpiValue
              - unitText
              - dateObserved
              - stewardNote
              - location
            operations: [queryEntity, retrieveEntity]
            representations: [ngsi-ld, ogc-features]
          # The one write, a need of its own: a need's attrs bound every operation it names, so the
          # write named beside the columns above would let a person type over a published figure the
          # next pipeline run overwrites (AP-62, T-3596).
          - contextSpaceRef: { kind: ContextSpace, name: bbsk-kraj }
            types: [KeyPerformanceIndicator]
            attrs: [stewardNote]
            operations: [updateAttrs]
            representations: [ngsi-ld]
            roles: [steward]
    projects__bbsk__assistant__sources__catalogue.yaml: |
      # The project's own NGSI-LD catalogue as knowledge (T-3225, AG-116): one page per public Endpoint
      # of its spaces, written from this repository (the types of each space's model, every attribute
      # the Endpoint serves with its description and unit, its address and its CKAN dataset), with the
      # entities of each type counted anonymously through the gateway. Public: a private space's
      # Endpoint is never read into it. Read again within a minute of a change to an Endpoint or a model,
      # and every hour for the counts.
      apiVersion: joinedcontext.com/v1alpha1
      kind: KnowledgeSource
      metadata:
        name: catalogue
        namespace: bbsk
        title: { en: 'Banskobystrický samosprávny kraj: the data catalogue' }
      spec:
        source: catalogue
        schedule: '7 * * * *'
        languages: [sk, en]
        visibility: public
