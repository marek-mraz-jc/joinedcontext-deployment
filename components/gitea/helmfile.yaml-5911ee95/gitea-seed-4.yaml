    projects__bbsk__spaces__bbsk-kraj__datamodels__statistical-observation.linkml.yaml: |
      id: https://bbsk.sk/models/kraj/statistical-observation
      name: statistical-observation
      title: One published statistical cell
      description: >-
        One cell of a published statistical table, as its publisher published it (DM-01, DM-09).
        A territory code, a period, the publisher's own indicator code, the remaining dimensions of
        the cube and the number, with the request that produced it. Nothing is renamed and nothing is
        recomputed on the way in, so a row can always be traced back to the URL it came from. The
        type is the FIWARE Smart Data Model `KeyPerformanceIndicator` (dataModel.KeyPerformanceIndicator) and the number its `kpiValue`; the indicators computed from these rows are the same
        type in the project's indicator space (PF-54, PF-55).

        It is deliberately not a Data Structure Definition in the sense of DM-60: a declared DSD puts
        its observations in the project's indicator space, and this space would then hold nothing.
        DM-60 is the upgrade the day an indicator has to be sliced by a dimension rather than read as
        one number per territory.
      license: https://joinedcontext.com/licenses/cc-by-4.0
      prefixes:
        linkml: https://w3id.org/linkml/
        jc: https://joinedcontext.com/models/
        ngsi-ld: https://uri.etsi.org/ngsi-ld/
        qb: http://purl.org/linked-data/cube#
        sdmx-dim: http://purl.org/linked-data/sdmx/2009/dimension#
        ucefact: https://vocabulary.uncefact.org/UnitMeasureCode#
        sdm-kpi: https://smartdatamodels.org/dataModel.KeyPerformanceIndicator/
      default_prefix: jc
      default_range: string
      imports:
        - linkml:types
        - ngsi-ld-core

      slots:
        dataSet:
          slot_uri: qb:dataSet
          description: The publisher's own code for the table this cell comes from, such as `zp3803rs`.
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Tabuľka
                cs: Tabulka
                en: Table
                de: Tabelle
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: http://purl.org/linked-data/cube#
        indicator:
          slot_uri: jc:indicator
          description: The publisher's own code for the measure, such as `ODPAD_TONY_KM2`.
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Ukazovateľ
                cs: Ukazatel
                en: Indicator
                de: Indikator
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        refArea:
          slot_uri: sdmx-dim:refArea
          description: >-
            The territory the cell describes, as the publisher codes it: a NUTS code for the kraj or
            an okres (`SK032`, `SK0323`), a LAU code for a municipality (`SK0321508438`).
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Územie
                cs: Území
                en: Area
                de: Gebiet
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: http://purl.org/linked-data/sdmx/2009/dimension#
        refPeriod:
          slot_uri: sdmx-dim:refPeriod
          description: The period the cell covers, as the publisher labels it, such as `2023` or `2025Q2`.
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Obdobie
                cs: Období
                en: Period
                de: Zeitraum
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: http://purl.org/linked-data/sdmx/2009/dimension#
        dimensionKey:
          slot_uri: jc:dimensionKey
          description: >-
            The cube's remaining dimensions beyond territory and period, as their codes joined by a
            hyphen and in the cube's own dimension order, such as `1` for the solid-emissions
            pollutant. It is the tail of the `{localId}`, repeated here so a query can select a slice
            without matching on an id pattern. Absent when the table has no further dimension.
          annotations:
            label:
              tag: label
              value:
                sk: Ďalšie členenie
                cs: Další členění
                en: Further breakdown
                de: Weitere Gliederung
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        kpiValue:
          slot_uri: sdm-kpi:kpiValue
          description: >-
            The number, exactly as published. Its unit varies with the indicator and travels on the
            Property as `unitCode`, a UN/CEFACT common code, beside `unitText`.
          range: float
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Hodnota
                cs: Hodnota
                en: Value
                de: Wert
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
        unitText:
          slot_uri: jc:unitText
          description: The unit in the publisher's own words, such as `v tis. m3`, kept because a UN/CEFACT code loses the scale factor.
          annotations:
            label:
              tag: label
              value:
                sk: Jednotka
                cs: Jednotka
                en: Unit
                de: Einheit
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        source:
          slot_uri: jc:source
          description: The exact URL the row was fetched from, with its query, so the cell can be fetched again.
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Zdroj
                cs: Zdroj
                en: Source
                de: Quelle
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        dateObserved:
          slot_uri: jc:dateObserved
          description: When the publisher last updated the table, as the table itself reports it.
          range: datetime
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Čas merania
                cs: Čas měření
                en: Observed at
                de: Messzeitpunkt
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property

        stewardNote:
          slot_uri: jc:stewardNote
          description: >-
            A note by the person who keeps this data: what was checked, what looks wrong, whom to
            ask. The one attribute of this model no pipeline writes and no pipeline overwrites, so
            an application may offer it for editing without the next run silently taking the words
            back (AP-62, EP-14). Every figure beside it belongs to the publisher and is read-only.
            At most 500 characters and no angle brackets, because it is a note and not a document.
          pattern: ^[^<>]{0,500}$
          annotations:
            label:
              tag: label
              value:
                sk: Poznámka správcu
                cs: Poznámka správce
                en: Steward's note
                de: Anmerkung des Datenverwalters
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property

      classes:
        KeyPerformanceIndicator:
          class_uri: sdm-kpi:KeyPerformanceIndicator
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
          description: One cell of one published statistical table.
          is_a: Entity
          slots:
            - dataSet
            - indicator
            - refArea
            - refPeriod
            - dimensionKey
            - kpiValue
            - unitText
            - source
            - dateObserved
            - stewardNote
    projects__bbsk__spaces__bbsk-kraj__endpoints__app-bbsk-zaznamy.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Endpoint
      metadata:
        name: app-bbsk-zaznamy
        namespace: bbsk
        title: { en: Records of the Banská Bystrica region, sk: Záznamy Banskobystrického kraja }
        annotations: { joinedcontext.com/generated-by: portal/app-reconciler }
      spec:
        allowedProjects: [bbsk]
        audience: project-list
        callerRole: true
        contextSpaceRef: { kind: ContextSpace, name: bbsk-kraj }
        enabledRepresentations: [ngsi-ld, mcp, ogc-features, odata]
        roles:
          - name: steward
            subjects:
              - group: bbsk-zaznamy-steward
        slug: 66kkv3xr4lau6pjg2i5ef5lonc
    projects__bbsk__spaces__bbsk-kraj__policies__kraj-public-read.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Policy
      metadata:
        name: kraj-public-read
        namespace: bbsk
        title: { sk: Verejné čítanie zdrojových riadkov kraja, en: "Public read: the region's raw rows" }
      spec:
        contextSpaceRef: { kind: ContextSpace, name: bbsk-kraj }
        assigner: did:web:bbsk.sk
        assignee: { kind: role, id: public }
        # Read only, and every published column of the statistics office's rows. stewardNote is the
        # region's own annotation (statistical-observation 1.1.0), written by its steward and not open
        # data, so it is left out (T-2934).
        # Discovery beside the reads (T-4258, EP-116): which types and attributes the Endpoint holds,
        # narrowed to this grant (EP-26), so an anonymous MCP client finds them before it queries.
        operations:
          - retrieveOps
          - retrieveEntityTypes
          - retrieveEntityTypeDetails
          - retrieveEntityTypeInfo
          - retrieveAttrTypes
          - retrieveAttrTypeDetails
          - retrieveAttrTypeInfo
          - createSubscription
          - retrieveSubscription
          - updateSubscription
          - deleteSubscription
          - queryTemporal
          - retrieveTemporal
        # Its types keep history: anyone reads it, as far back as the space keeps it (T-4372).
        temporalQ: timerel=after;timeAt=P-30D
        information:
          - entities:
              - type: KeyPerformanceIndicator
            propertyNames:
              - dataSet
              - indicator
              - refArea
              - refPeriod
              - dimensionKey
              - kpiValue
              - unitText
              - source
              - dateObserved
    projects__bbsk__spaces__bbsk-kraj__policies__pipelines-write.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Policy
      metadata:
        name: pipelines-write
        namespace: bbsk
        title: { sk: Kanály zapisujú zdrojový priestor, en: The ingestion pipelines write the raw space }
      spec:
        contextSpaceRef: { kind: ContextSpace, name: bbsk-kraj }
        assigner: did:web:bbsk.sk
        assignee: { kind: serviceAccount, id: pipelines }
        # Upsert is what an annual re-poll does: the same cell, published again. Create and query are
        # what a stream needs to start from nothing and to check itself. No delete: a published cube
        # row is never withdrawn, it is superseded by the next year's.
        # `queryEntity` is `GET /entities`, and that is how the indicator pipeline reads the rows it
        # computes from: `queryBatch` is only the `POST /entityOperations/query` form, so without this
        # the read was refused `403 Access Denied by Policy`, the stream's `errored()` guard dropped
        # the whole tick, and the indicator space stayed empty in silence (T-2445). Granted by name
        # and not as the `retrieveOps` group: one operation is what this account does.
