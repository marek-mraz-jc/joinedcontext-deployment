    projects__bbsk__spaces__bbsk-podujatia__space.yaml: |
      # Public events of the Banská Bystrica Region's towns, municipalities and cultural bodies (T-4895). Since T-5047
      # (owner 2026-10-21) the region keeps its own sources here and the national store is slovensko-podujatia in the
      # Slovakia project. The pipelines of seeds/bbsk-events/generate.py write it; nobody else does.
      apiVersion: joinedcontext.com/v1alpha1
      kind: ContextSpace
      metadata:
        name: bbsk-podujatia
        namespace: bbsk
        title: { sk: Podujatia v Banskobystrickom kraji, en: Events in the Banská Bystrica Region }
        description:
          sk: >-
            Nadchádzajúce verejné podujatia miest, obcí a kultúrnych inštitúcií Banskobystrického kraja s časom a miestom
            konania (GPS). Každé podujatie má rozsah /SK/{kraj}/{obec}, napríklad /SK/BB/banska_bystrica,
            a zostáva v priestore do svojho konca. Zdroj: webové stránky a kanály, ktoré podujatie zverejnili.
          en: >-
            Upcoming public events of the Banská Bystrica Region's towns, municipalities and cultural bodies with their time
            and place (GPS). Each event carries the scope /SK/{region}/{municipality}, for example
            /SK/BB/banska_bystrica, and stays in the space until it ends. Source: the web sites and feeds
            that announced it.
      spec:
        # The space name is the segment its ids carry, pinned so it cannot drift (PF-84).
        urnSegment: bbsk-podujatia
        isSandbox: false
        # The one model of this space: a write of a type it does not declare is refused (DM-61).
        dataModelRef: { kind: DataModel, name: bbsk-podujatia }
        defaultLocale: sk
        # Current state only (DM-82): an event's past versions help nobody, and it leaves the space at
        # its end through the expiresAt its pipeline writes (T-4838).
        retention:
          - entityType: Event
            history: 'off'
          # Venues change rarely; the daily miesta-podujati upsert would write one history row per attribute per day.
          - entityType: PointOfInterest
            history: 'off'
        # Slovakia with a margin: a point outside it is flagged (DM-87); the pipelines refuse it first.
        quality:
          - name: in-slovakia
            entityType: Event
            kind: area
            attribute: location
            bbox: [16.8, 47.7, 22.6, 49.7]
    projects__bbsk__spaces__bbsk-registre__datamodels__bbsk-registre.linkml.yaml: |
      id: https://joinedcontext.com/models/bbsk/bbsk-registre
      name: bbsk-registre
      title: Registers of the Banská Bystrica region
      description: >-
        What the region's register space carries side by side (DM-01, DM-61): the outlines of its 13
        districts and 516 municipalities, the organisations the region founded, the hospitals, the
        social services run by public bodies, and the bridges of the road network, each read from the
        region's own open-data portal (opendata.bbsk.sk). One model, one space, one public endpoint.
        Where Smart Data Models has the class, its IRI is cited rather than minted (DM-04, DM-16).
      license: https://joinedcontext.com/licenses/cc-by-4.0
      prefixes:
        linkml: https://w3id.org/linkml/
        jc: https://joinedcontext.com/models/
        sdm: https://smartdatamodels.org/
        sdm-poi: https://smartdatamodels.org/dataModel.PointOfInterest/
        sdm-cpsv: https://smartdatamodels.org/dataModel.CPSV-AP/
        ngsi-ld: https://uri.etsi.org/ngsi-ld/
      default_prefix: sdm
      default_range: string
      imports:
        - linkml:types
        - ngsi-ld-core

      slots:
        name:
          slot_uri: schema:name
          description: The name as the publisher writes it, in Slovak; a string, as every Smart Data Model's `name` is.
          range: string
          annotations:
            label:
              tag: label
              value:
                sk: Názov
                cs: Název
                en: Name
                de: Name
            ngsi_ld_kind: Property
            upstream_source: https://schema.org/name
        alternateName:
          slot_uri: schema:alternateName
          description: The shorter name the organisation goes by, when it differs from the official one.
          annotations:
            label:
              tag: label
              value:
                sk: Skrátený názov
                cs: Zkrácený název
                en: Short name
                de: Kurzname
            ngsi_ld_kind: Property
            upstream_source: https://schema.org/alternateName
        address:
          slot_uri: schema:address
          description: >-
            The postal address as the register publishes it, field by field (Smart Data Models' common PostalAddress); a field the register leaves out is absent, never guessed.
          range: PostalAddress
          inlined: true
          annotations:
            label:
              tag: label
              value:
                sk: Adresa
                cs: Adresa
                en: Address
                de: Adresse
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/data-models/blob/master/common-schema.json
        streetAddress:
          slot_uri: schema:streetAddress
          description: The street and the house number, or the venue.
          annotations:
            label:
              tag: label
              value:
                sk: Ulica a číslo
                cs: Ulice a číslo
                en: Street
                de: Straße
            upstream_source: https://schema.org/streetAddress
        postalCode:
          slot_uri: schema:postalCode
          description: The postal code.
          annotations:
            label:
              tag: label
              value:
                sk: PSČ
                cs: PSČ
                en: Postal code
                de: Postleitzahl
            upstream_source: https://schema.org/postalCode
        addressLocality:
          slot_uri: schema:addressLocality
          description: The town or the municipality.
          annotations:
            label:
              tag: label
              value:
                sk: Obec
                cs: Obec
                en: Town
                de: Ort
            upstream_source: https://schema.org/addressLocality
        addressCountry:
          slot_uri: schema:addressCountry
          description: The country, as an ISO 3166-1 alpha-2 code.
          annotations:
            label:
              tag: label
              value:
                sk: Krajina
                cs: Země
                en: Country
                de: Land
            upstream_source: https://schema.org/addressCountry
        category:
          slot_uri: sdm-poi:category
          description: >-
            What kind of place it is: `hospital` or `socialService`. The two registers share the
            Smart Data Model PointOfInterest, and an application asks for one with
            `q=category=="hospital"`.
          range: PlaceCategory
          multivalued: true
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Druh
                cs: Druh
                en: Kind
                de: Art
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest
        preferredLabel:
          slot_uri: sdm-cpsv:preferredLabel
          description: The organisation's official name, as CPSV-AP's PublicOrganization requires it.
          annotations:
            label:
              tag: label
              value:
                sk: Úradný názov
                cs: Úřední název
                en: Official name
                de: Amtlicher Name
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP
        spatial:
          slot_uri: sdm-cpsv:spatial
          description: The municipality the organisation is in, by name, as CPSV-AP's PublicOrganization requires it.
          multivalued: true
          annotations:
            label:
              tag: label
              value:
                sk: Obec
                cs: Obec
                en: Municipality
                de: Gemeinde
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.CPSV-AP
        url:
          slot_uri: schema:url
          description: The web page the publisher gives for it.
          annotations:
            label:
              tag: label
              value:
                sk: Webová stránka
                cs: Webová stránka
                en: Web page
                de: Webseite
            ngsi_ld_kind: Property
            upstream_source: https://schema.org/url
        dataProvider:
          slot_uri: sdm:dataProvider
          description: >-
            Who publishes the data the entity was read from, with the credit its licence asks for, as
            an application shows it beside the data.
          annotations:
            label:
              tag: label
              value:
                sk: Poskytovateľ údajov
                cs: Poskytovatel dat
                en: Data provider
                de: Datenanbieter
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/data-models
        source:
          slot_uri: sdm:source
          description: The open-data service the entity was read from.
          range: uri
          annotations:
            label:
              tag: label
              value:
                sk: Zdroj
                cs: Zdroj
                en: Source
                de: Quelle
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/data-models
        isPartOf:
          slot_uri: jc:isPartOf
          description: The catalogue dataset the record belongs to, which tells the region's districts from its municipalities in one type.
          range: uri
          annotations:
            label:
              tag: label
              value:
                sk: Dataset
                cs: Datová sada
                en: Dataset
                de: Datensatz
            ngsi_ld_kind: Property
        areaCode:
          slot_uri: jc:areaCode
          description: >-
            The area's statistical code: LAU 1 (`SK0321`) for a district, LAU 2 (`SK0321508438`) for a
            municipality, the same codes the Statistical Office's cubes carry in `refArea`.
          required: true
          pattern: ^SK032[0-9A-D]([0-9]{6})?$
          examples:
            - value: SK0321508438
          annotations:
            label:
              tag: label
              value:
                sk: Kód územia
                cs: Kód území
                en: Area code
                de: Gebietscode
            ngsi_ld_kind: Property
        divisionLevel:
          slot_uri: jc:divisionLevel
          description: Which tier of the territorial division the area is.
          range: DivisionLevel
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Úroveň
                cs: Úroveň
                en: Level
                de: Ebene
            ngsi_ld_kind: Property
        refParentArea:
          slot_uri: jc:refParentArea
          description: The district a municipality lies in; absent on a district.
          range: AdministrativeArea
          inverse: childAreas
          inlined: false
          annotations:
            label:
              tag: label
              value:
                sk: Okres
                cs: Okres
