    projects__bbsk__spaces__bbsk-podujatia__policies__podujatia-kraj-read.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Policy
      metadata:
        name: podujatia-kraj-read
        namespace: bbsk
        title: { sk: 'Verejné čítanie: podujatia v Banskobystrickom kraji' }
      spec:
        contextSpaceRef: { kind: ContextSpace, name: bbsk-podujatia }
        assigner: did:web:bbsk.sk
        assignee: { kind: role, id: public }
        # The Endpoint bbsk-podujatia reads the region's events of the national space by their scope: the
        # events exist once, the region is a view (owner 2026-10-20). Events and their venues, no entity write.
        operations:
          - retrieveOps
          - retrieveEntityTypes
          - retrieveEntityTypeDetails
          - retrieveEntityTypeInfo
          - retrieveAttrTypes
          - retrieveAttrTypeDetails
          - retrieveAttrTypeInfo
          - createSubscription
          - retrieveSubscription
          - updateSubscription
          - deleteSubscription
        information:
          - entities:
              - type: Event
              - type: PointOfInterest
        scopeQ: /SK/BB/#
    projects__bbsk__spaces__bbsk-registre__space.yaml: |
      # The region's own registers as it publishes them on its open-data portal (T-2783): the outlines
      # of its districts and municipalities, the organisations it founded, the hospitals, the social
      # services public bodies run and the bridges of the road network. Every source is BBSK's, under
      # CC BY-SA 4.0, read from opendata.bbsk.sk; the statistics stay in `bbsk-kraj`.
      apiVersion: joinedcontext.com/v1alpha1
      kind: ContextSpace
      metadata:
        name: bbsk-registre
        namespace: bbsk
        title:
          sk: Banskobystrický kraj — registre
          en: Banská Bystrica Region, registers
        description:
          sk: >-
            Hranice okresov a obcí, organizácie v zriaďovateľskej pôsobnosti kraja, nemocnice, sociálne
            služby verejných poskytovateľov a mosty cestnej siete. Zdroj: Banskobystrický samosprávny
            kraj, opendata.bbsk.sk, licencia CC BY-SA 4.0.
          en: >-
            District and municipality outlines, the organisations the region founded, hospitals, the
            social services of public providers and the bridges of the road network. Source: Banská
            Bystrica Self-Governing Region, opendata.bbsk.sk, licensed CC BY-SA 4.0.
      spec:
        # The space name is the segment its ids carry, pinned so it cannot drift (PF-84).
        urnSegment: bbsk-registre
        isSandbox: false
        # The one model of this space: a write of a type it does not declare is refused (DM-61).
        dataModelRef: { kind: DataModel, name: bbsk-registre }
        defaultLocale: sk
        # History per type (DM-82, ADR-N-046 2.3, T-4275): a measurement series keeps 30 days, every
        # other type keeps its current state only. Owners change it on the space's Retention tab.
        retention:
          - entityType: AdministrativeArea
            history: 'off'
          - entityType: Bridge
            history: 'off'
          - entityType: PublicOrganization
            history: 'off'
          - entityType: PointOfInterest
            history: 'off'
        # The space's place (T-4525): the catalogue's Dataset carries it, so georel=near finds the space.
        # the Banská Bystrica Region with a margin; a PublicOrganization outside it is flagged, never refused (DM-87).
        quality:
          - name: in-area
            entityType: PublicOrganization
            kind: area
            attribute: location
            bbox: [18.3, 47.9, 20.5, 49.2]
  s4-bbsk--5:
    projects__bbsk__apps__bbsk-ukazovatele__app.yaml: |
      # Seeded from joinedcontext-portal apps/bbsk-ukazovatele/app.yaml, whose bundle the Portal image
      # ships under JC_PORTAL_APPS_DIR (T-2457): the static host serves only an App the configuration
      # repository holds, so the manifest is committed here like every other one. Keep the two equal.
      # The indicators of the Banskobystrický kraj and of the city of Banská Bystrica, side by side
      # (AP-07, AP-14, AP-18, T-2308). Hand written, so no generated-by annotation.
      #
      # It reads and never writes, so it is `ui`: a bundle the Portal static host serves under
      # /apps/bbsk-ukazovatele/, calling the endpoints with the reader's own token (AP-07). Every card
      # comes from a KeyPerformanceIndicator entity computed by the pipelines of T-2307; the
      # application derives nothing but the threshold state, which is its own (Development/11 §2).
      apiVersion: joinedcontext.com/v1alpha1
      kind: App
      metadata:
        name: bbsk-ukazovatele
        namespace: bbsk
        title: { sk: Ukazovatele kraja a mesta, en: Indicators of the region and the city }
        description:
          sk: 'Ukazovatele Banskobystrického samosprávneho kraja a mesta Banská Bystrica vedľa seba: hodnota, jednotka, obdobie a čas výpočtu, pri každom je uvedené, koho číslo to je.'
          en: 'The indicators of the Banská Bystrica self-governing region and of the city of Banská Bystrica side by side: value, unit, window and when it was computed, each card saying whose number it is.'
        annotations:
          # The Portal image ships this bundle (Dockerfile, /srv/apps), so the App names no
          # repository of its own; the Portal accepts the mark only where the bundle is (AP-87).
          joinedcontext.com/shipped-with: portal
      spec:
        kind: ui
        source:
          path: ./apps/bbsk-ukazovatele
        build: { node: '22' }
        # Anyone who may open the region's own KPI endpoint; the city's indicators are published by the
        # city and reached through the SharedSpaceReference `mesto-kpi` the region declares (EP-15,
        # Development/10 §8), so this app never widens either body's grant.
        visibility: project
        lifecycle: published
        embeddable: true
        dataNeeds:
          # Its own space first: the reconciler renders one Endpoint per app from it (AP-04), and the
          # app's own is on the region's indicators. The city's endpoint arrives in the served
          # configuration's `endpoints` (SDK-02) and is read with the same reader's token.
          - contextSpaceRef: { kind: ContextSpace, name: bbsk-kpi }
            types: [KeyPerformanceIndicator]
            # PF-54 fixes the attribute set; the app reads all of it and writes none of it.
            attrs:
              - name
              - currentValue
              - calculationPeriod
              - calculationFormula
              - derivedFrom
              - computedBy
              - updatedAt
              - location
            operations: [queryEntity, retrieveEntity]
            representations: [ngsi-ld, ogc-features]
          # The further space (AP-04, T-2933): the district outlines of the region's register, read only
          # through that space's public Endpoint `bbsk-registre`. Compiled into no grant: that endpoint
          # already answers anyone, and the map draws each district in the colour of its indicator.
          - contextSpaceRef: { kind: ContextSpace, name: bbsk-registre }
            types: [AdministrativeArea]
            attrs: [name, divisionLevel, location]
            operations: [queryEntity]
            representations: [ngsi-ld]
          # The second further space (AP-04, T-2934): the region's yearly rows, read only through
          # bbsk-kraj's public Endpoint `bbsk-kraj-verejne`, for the trend line on each region card.
          # Compiled into no grant: that endpoint answers anyone already, steward's notes left out.
          - contextSpaceRef: { kind: ContextSpace, name: bbsk-kraj }
            types: [KeyPerformanceIndicator]
            attrs: [dataSet, indicator, refArea, refPeriod, dimensionKey, kpiValue]
            operations: [queryEntity]
            representations: [ngsi-ld]
