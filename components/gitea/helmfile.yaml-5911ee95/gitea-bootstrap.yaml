                joinedcontext.com/endpoint: "{{ endpoint }}"
            spec:
              kind: "{{ kind }}"
              source:
                path: "apps/{{ name }}"
              build: { node: "22" }
              visibility: organization
              lifecycle: draft
              dataNeeds:
                - contextSpaceRef: { kind: ContextSpace, name: "{{ contextSpace }}" }
                  types: []
                  attrs: []
                  operations: [queryEntity, retrieveEntity]
  blueprints__gbfs-stations__blueprint.yaml: |
    # A Bento flow for a GBFS 2.x city-bike feed: station_status every minute into
    # BikeHireDockingStation entities (PL-01, PL-04, CC-23..CC-27). What the helsinki-bikes stream
    # is, as a card any project can run against its own operator's feed.
    apiVersion: joinedcontext.com/v1alpha1
    kind: Blueprint
    metadata:
      name: gbfs-stations
      namespace: org
      title:
        en: City-bike stations from a GBFS feed
        fi: Kaupunkipyöräasemat GBFS-syötteestä
        sk: Stanice mestských bicyklov z kanála GBFS
        cs: Stanice sdílených kol z kanálu GBFS
        de: Leihrad-Stationen aus einem GBFS-Feed
      description:
        en: Reads the stations' free bikes and docks from a GBFS feed and writes them into a Context Space.
        sk: Číta voľné bicykle a stojany staníc z kanála GBFS a zapisuje ich do kontextového priestoru.
        cs: Čte volná kola a stojany stanic z kanálu GBFS a zapisuje je do kontextového prostoru.
        de: Liest freie Räder und Stellplätze der Stationen aus einem GBFS-Feed und schreibt sie in einen Kontextbereich.
    spec:
      version: 1.0.0
      category: ingestion
      riskClass: yellow
      allowedRoles: [portal-approver]
      parameterSchema:
        type: object
        required: [name, stationStatusUrl]
        additionalProperties: false
        properties:
          name:
            type: string
            title: Flow name
            x-jc-title: { sk: Názov toku, cs: Název toku, de: Name des Ablaufs }
            pattern: ^[a-z][a-z0-9-]{1,40}$
            default: citybikes
          stationStatusUrl:
            type: string
            title: station_status.json URL
            x-jc-title:
              sk: URL súboru station_status.json
              cs: URL souboru station_status.json
              de: URL der station_status.json
            format: uri
            default: https://gbfs.theta.fifteen.eu/gbfs/2.2/helsinki/en/station_status.json
          period:
            type: string
            title: Poll every
            x-jc-title: { sk: Načítať každých, cs: Načíst každých, de: Abfragen alle }
            default: 1m
            oneOf:
              - const: '1m'
                title: Minute
                x-jc-title: { sk: Minútu, cs: Minutu, de: Minute }
              - const: '5m'
                title: '5 minutes'
                x-jc-title: { sk: '5 minút', cs: '5 minut', de: '5 Minuten' }
              - const: '15m'
                title: '15 minutes'
                x-jc-title: { sk: '15 minút', cs: '15 minut', de: '15 Minuten' }
          targetEndpoint:
            type: string
            title: Endpoint the flow writes through
            x-jc-title:
              sk: Endpoint, cez ktorý tok zapisuje
              cs: Endpoint, přes který tok zapisuje
              de: Endpoint, über den der Ablauf schreibt
            default: urn:ngsi-ld:Endpoint:hel.fi:helsinki:helsinki-all
      templates:
        - name: datasource
          template: |
            apiVersion: joinedcontext.com/v1alpha1
            kind: DataSource
            metadata:
              name: "{{ name }}-gbfs"
              title: { en: "GBFS station status ({{ name }})" }
            spec:
              type: http
              http:
                url: "{{ stationStatusUrl }}"
                verb: GET
                headers: { Accept: application/json }
                timeout: 15s
        - name: pipeline
          template: |
            apiVersion: joinedcontext.com/v1alpha1
            kind: Pipeline
            metadata:
              name: "{{ name }}-gbfs"
              title: { en: "BikeHireDockingStation from {{ name }}" }
            spec:
              class: auto
              period: "{{ period }}"
              schedule: "* * * * *"
              source:
                dataSourceRef: { kind: DataSource, name: "{{ name }}-gbfs" }
              targetEndpoint: "{{ targetEndpoint }}"
              quotas:
                maxMemoryMb: 128
                cpuMillicores: 100
  blueprints__http-json-feed__blueprint.yaml: |
    # A Bento flow that polls a JSON resource and writes one entity type into a space (PL-01,
    # PL-04, CC-23..CC-27). The gallery card the steward runs from the Flows view; it renders the
    # DataSource and the Pipeline of one fetch, the same pair the Linked Events feed is made of.
    apiVersion: joinedcontext.com/v1alpha1
    kind: Blueprint
    metadata:
      name: http-json-feed
      namespace: org
      title:
        en: Poll a JSON feed into a Context Space
        fi: Lue JSON-syöte kontekstitilaan
        sk: Načítavať kanál JSON do kontextového priestoru
        cs: Načítat kanál JSON do kontextového prostoru
        de: Einen JSON-Feed in einen Kontextbereich abfragen
      description:
        en: Fetches a JSON resource on a schedule and writes its records as entities of one type; the record-to-entity mapping is added in the Pipeline editor.
        sk: Podľa plánu načíta zdroj JSON a jeho záznamy zapíše ako entity jedného typu; mapovanie záznamu na entitu doplníte v editore Pipeline.
        cs: Podle plánu načte zdroj JSON a jeho záznamy zapíše jako entity jednoho typu; mapování záznamu na entitu doplníte v editoru Pipeline.
        de: Ruft eine JSON-Ressource nach Zeitplan ab und schreibt ihre Datensätze als Entitäten eines Typs; die Abbildung eines Datensatzes auf eine Entität ergänzen Sie im Pipeline-Editor.
    spec:
      version: 1.0.0
      category: ingestion
      riskClass: yellow
      allowedRoles: [portal-approver]
      parameterSchema:
        type: object
        required: [name, url, entityType, period]
        additionalProperties: false
        properties:
          name:
            type: string
            title: Flow name
            x-jc-title: { sk: Názov toku, cs: Název toku, de: Name des Ablaufs }
            pattern: ^[a-z][a-z0-9-]{1,40}$
            description: Names the DataSource and the Pipeline, one word with hyphens.
            x-jc-description:
              sk: Pomenuje zdroj údajov a pipelinu, jedno slovo so spojovníkmi.
              cs: Pojmenuje zdroj dat a pipeline, jedno slovo se spojovníky.
              de: Benennt die Datenquelle und die Pipeline, ein Wort mit Bindestrichen.
          url:
            type: string
            title: URL of the JSON resource
            x-jc-title: { sk: URL zdroja JSON, cs: URL zdroje JSON, de: URL der JSON-Ressource }
            format: uri
          entityType:
            type: string
            title: Entity type written
            x-jc-title:
              sk: Zapisovaný typ entity
              cs: Zapisovaný typ entity
              de: Geschriebener Entitätstyp
            pattern: ^[A-Z][A-Za-z0-9]+$
            default: Event
          period:
            type: string
            title: Poll every
            x-jc-title: { sk: Načítať každých, cs: Načíst každých, de: Abfragen alle }
            default: 30m
            oneOf:
              - const: '1m'
                title: Minute
                x-jc-title: { sk: Minútu, cs: Minutu, de: Minute }
              - const: '5m'
                title: '5 minutes'
                x-jc-title: { sk: '5 minút', cs: '5 minut', de: '5 Minuten' }
              - const: '15m'
                title: '15 minutes'
                x-jc-title: { sk: '15 minút', cs: '15 minut', de: '15 Minuten' }
              - const: '30m'
                title: '30 minutes'
                x-jc-title: { sk: '30 minút', cs: '30 minut', de: '30 Minuten' }
              - const: '1h'
                title: Hour
                x-jc-title: { sk: Hodinu, cs: Hodinu, de: Stunde }
              - const: '1d'
                title: Day
                x-jc-title: { sk: Deň, cs: Den, de: Tag }
          schedule:
            type: string
            title: Cron schedule
            x-jc-title: { sk: Plán cron, cs: Plán cron, de: Cron-Zeitplan }
            default: '*/30 * * * *'
            pattern: ^[0-9*/,-]+( [0-9*/,-]+){4}$
            description: The cron line of the period above.
            x-jc-description:
              sk: Riadok cron pre interval vyššie.
              cs: Řádek cron pro interval výše.
              de: Die Cron-Zeile des Intervalls oben.
          targetEndpoint:
            type: string
            title: Endpoint the flow writes through
            x-jc-title:
              sk: Endpoint, cez ktorý tok zapisuje
              cs: Endpoint, přes který tok zapisuje
              de: Endpoint, über den der Ablauf schreibt
            default: urn:ngsi-ld:Endpoint:hel.fi:helsinki:helsinki-all
      templates:
        - name: datasource
          template: |
            apiVersion: joinedcontext.com/v1alpha1
            kind: DataSource
            metadata:
              name: "{{ name }}"
              title: { en: "{{ name }} ({{ entityType }})" }
            spec:
              type: http
              http:
                url: "{{ url }}"
                verb: GET
                headers: { Accept: application/json }
                timeout: 30s
        - name: pipeline
          template: |
            apiVersion: joinedcontext.com/v1alpha1
            kind: Pipeline
            metadata:
              name: "{{ name }}"
              title: { en: "{{ entityType }} from {{ name }}" }
            spec:
              class: auto
              period: "{{ period }}"
              schedule: "{{ schedule }}"
              source:
                dataSourceRef: { kind: DataSource, name: "{{ name }}" }
              targetEndpoint: "{{ targetEndpoint }}"
              output: { type: "{{ entityType }}", mode: upsert }
              quotas:
                maxMemoryMb: 128
                cpuMillicores: 100
  blueprints__mqtt-feed__blueprint.yaml: |
    # A resident Bento flow on an MQTT topic tree (PL-01, PL-03, CC-23..CC-27): what the HSL
    # trunk-line feed is, as a card. Push-based, so no schedule: the runner keeps the subscription.
    apiVersion: joinedcontext.com/v1alpha1
    kind: Blueprint
    metadata:
      name: mqtt-feed
      namespace: org
      title:
        en: Subscribe to an MQTT feed
        fi: Tilaa MQTT-syöte
        sk: Odoberať kanál MQTT
        cs: Odebírat kanál MQTT
        de: Einen MQTT-Feed abonnieren
      description:
        en: Listens to an MQTT topic and writes each message as an entity of one type.
        sk: Počúva tému MQTT a každú správu zapíše ako entitu jedného typu.
        cs: Poslouchá téma MQTT a každou zprávu zapíše jako entitu jednoho typu.
        de: Hört ein MQTT-Thema ab und schreibt jede Nachricht als Entität eines Typs.
    spec:
      version: 1.0.0
      category: ingestion
      riskClass: yellow
      allowedRoles: [portal-approver]
      parameterSchema:
        type: object
        required: [name, brokerUrl, topic, entityType]
        additionalProperties: false
        properties:
          name:
            type: string
            title: Flow name
            x-jc-title: { sk: Názov toku, cs: Název toku, de: Name des Ablaufs }
            pattern: ^[a-z][a-z0-9-]{1,40}$
          brokerUrl:
            type: string
            title: Broker URL
            x-jc-title: { sk: URL brokera, cs: URL brokeru, de: Broker-URL }
            default: wss://mqtt.hsl.fi:443/
            description: tls://host:8883 or wss://host:443/; the cluster lets 443 out.
            x-jc-description:
              sk: tls://host:8883 alebo wss://host:443/; klaster púšťa von port 443.
              cs: tls://host:8883 nebo wss://host:443/; cluster pouští ven port 443.
              de: tls://host:8883 oder wss://host:443/; der Cluster lässt Port 443 hinaus.
          topic:
            type: string
            title: Topic filter
            x-jc-title: { sk: Filter tém, cs: Filtr témat, de: Themenfilter }
            default: /hfp/v2/journey/ongoing/vp/bus/+/+/2510/#
          entityType:
            type: string
            title: Entity type written
            x-jc-title:
              sk: Zapisovaný typ entity
              cs: Zapisovaný typ entity
              de: Geschriebener Entitätstyp
            pattern: ^[A-Z][A-Za-z0-9]+$
            default: Vehicle
          targetEndpoint:
            type: string
            title: Endpoint the flow writes through
            x-jc-title:
              sk: Endpoint, cez ktorý tok zapisuje
              cs: Endpoint, přes který tok zapisuje
              de: Endpoint, über den der Ablauf schreibt
            default: urn:ngsi-ld:Endpoint:hel.fi:helsinki:helsinki-all
      templates:
        - name: datasource
          template: |
            apiVersion: joinedcontext.com/v1alpha1
            kind: DataSource
            metadata:
              name: "{{ name }}"
              title: { en: "MQTT {{ topic }}" }
            spec:
              type: mqtt
              mqtt:
                urls:
                  - "{{ brokerUrl }}"
                topics:
                  - "{{ topic }}"
                qos: 0
                cleanSession: true
        - name: pipeline
          template: |
            apiVersion: joinedcontext.com/v1alpha1
            kind: Pipeline
            metadata:
              name: "{{ name }}"
              title: { en: "{{ entityType }} from {{ name }}" }
            spec:
              class: auto
              source:
                dataSourceRef: { kind: DataSource, name: "{{ name }}" }
              targetEndpoint: "{{ targetEndpoint }}"
              quotas:
                maxMemoryMb: 128
                cpuMillicores: 250
  mcp__open-data.yaml: |
    # The whole portal's public data as one read-only MCP connector (T-5367, ADR-N-043):
    # `https://{domain}/api/mcp/org/open-data`. It selects every public Endpoint of the installation,
    # every publisher's, resolved on each call; it reads each Endpoint where it lives and copies no
    # data. Every call is still that Endpoint's own call under its anonymous Policy, and a public
    # server lists read tools only, whoever calls (EP-141). The publishers' own connectors are
    # `{project}/otvorene-data` (barcelona/dades-obertes).
    apiVersion: joinedcontext.com/v1alpha1
    kind: McpServer
    metadata:
      name: open-data
      namespace: org
      # What an AI client reads as serverInfo and initialize.instructions (EP-92).
      title:
        sk: Otvorené údaje — všetci vydavatelia
        en: Open data, every publisher
      description:
        sk: 'Všetky verejné údaje portálu, len na čítanie: Žilina, Banská Bystrica, Banskobystrický samosprávny kraj, Bratislava, Slovensko, Praha, Helsinki a Barcelona. Začnite nástrojom search, potom query_entities s jedným endpoint. Pri citovaní uveďte zdroj, ktorý Endpoint uvádza.'
        en: 'Every public dataset of the portal, read-only: Žilina, Banská Bystrica, the Banská Bystrica Region, Bratislava, Slovakia, Prague, Helsinki and Barcelona. Start with search (the question in plain words, place or theme), then query_entities naming the endpoint a hit names, with a small limit. Credit the source each Endpoint names when you quote it.'
    spec:
      # Every public Endpoint of every project, resolved on each call (MF-55, T-5367).
      select:
        accessLevel: [public]
      audience: public
  organizations__barcelona.yaml: |
    # Ajuntament de Barcelona, an Organization of its own in this installation (ADR-N-058, PF-121,
    # T-5260), set up as Mesto Žilina is (T-5242). Helsinki (organizations/hel.yaml) stays the
    # installation's. A project of this Organization publishes under barcelona.cat or a subdomain of
    # it (PF-122); its Keycloak group subtree is /barcelona and its CKAN organisation `barcelona`.
    apiVersion: joinedcontext.com/v1alpha1
    kind: Organization
    metadata:
      name: barcelona
      namespace: org
      title: { ca: Ajuntament de Barcelona, es: Ayuntamiento de Barcelona, en: Barcelona City Council }
    spec:
      domain: barcelona.cat
      locales: [ca, es, en]
      defaultLocale: ca
      # No national profile: DCAT-AP-ES is not one the platform serves, DCAT-AP 3.0 always is (EP-27).
      # The publisher a project of this Organization names when it names none of its own
      # (ADR-N-058 2.3, EP-127): the city council by its DIR3 code in datos.gob.es.
      catalog:
        publisher:
          name:
            ca: Ajuntament de Barcelona
            es: Ayuntamiento de Barcelona
            en: Barcelona City Council
          uri: http://datos.gob.es/recurso/sector-publico/org/Organismo/L01080193
        contactPoint: { name: joinedcontext platform, email: hello@joinedcontext.com }
      projects:
        # Its people read its projects through barcelona-viewers; a project is opened by org-admin (PF-61, PF-65).
        visibility: organization
        creation: org-admin
        # The demo's quota (T-2873, PF-73): the mechanism stays, nobody reaches it.
        quota:
          contextSpaces: 100
          residentPipelines: 100
          publicEndpoints: 100
          apps: 100
          ingestEventsPerSecond: 500
          agentRunsPerDay: 2000
          entitiesPerSpace: 1000000
          requestsPerMinute: 6000
  organizations__bratislava.yaml: |
    # Hlavné mesto SR Bratislava, an Organization of its own in this installation (ADR-N-058, PF-121,
    # T-5271), set up as Mesto Žilina is (T-5242). Helsinki (organizations/hel.yaml) stays the
    # installation's. A project of this Organization publishes under bratislava.sk or a subdomain of
    # it (PF-122); its Keycloak group subtree is /bratislava and its CKAN organisation `bratislava`.
    apiVersion: joinedcontext.com/v1alpha1
    kind: Organization
    metadata:
      name: bratislava
      namespace: org
      title: { sk: Hlavné mesto SR Bratislava, en: City of Bratislava }
    spec:
      domain: bratislava.sk
      locales: [sk, en]
      defaultLocale: sk
      dcatProfiles: [dcat-ap-sk]
      # The publisher a project of this Organization names in its catalogue when it names none of
      # its own (ADR-N-058 2.3, EP-127): the capital by its registry IRI (IČO 00603481).
      catalog:
        publisher:
          name: { sk: Hlavné mesto SR Bratislava, en: City of Bratislava }
          uri: https://data.gov.sk/id/legal-subject/00603481
        contactPoint: { name: joinedcontext platform, email: hello@joinedcontext.com }
      projects:
        # Its people read its projects through bratislava-viewers; a project is opened by org-admin (PF-61, PF-65).
        visibility: organization
        creation: org-admin
        # The demo's quota (T-2873, PF-73): the mechanism stays, nobody reaches it.
        quota:
          contextSpaces: 100
          residentPipelines: 100
          publicEndpoints: 100
          apps: 100
          ingestEventsPerSecond: 500
          agentRunsPerDay: 2000
          entitiesPerSpace: 1000000
          requestsPerMinute: 6000
  organizations__hel.yaml: |
    apiVersion: joinedcontext.com/v1alpha1
    kind: Organization
    metadata:
      name: hel
      namespace: org
      title: { en: City of Helsinki, fi: Helsingin kaupunki, sk: Mesto Helsinki }
    spec:
      domain: hel.fi
      # The installation's Organization (PF-121, ADR-N-058): it owns the repository, the gateway's
      # {orgDomain} and the installation-wide kinds; organizations/zilina.yaml is the second one.
      installation: true
      # fi: the city's own language, so its models are titled in Finnish (T-4829).
      locales: [en, fi, sk]
      defaultLocale: en
      # The national DCAT-AP renderings its records and catalogues are also served in (API/08 §5):
      # Banská Bystrica and BBSK publish to data.slovensko.sk, Praha to data.gov.cz (T-4586).
      dcatProfiles: [dcat-ap-sk, dcat-ap-cz]
      projects:
        # Every signed-in person of the organization holds the seeded viewer role (PF-61), and a
        # project is opened by whoever holds propose on Project (PF-65).
        visibility: organization
        creation: org-admin
        # What a project of this organization starts from (PF-73). Owner, 2026-09-25 (T-2873): no
        # demo work and no city dataset is refused by a quota, so 100 of each countable kind and
        # runtime ceilings nobody reaches; the quota stays as the mechanism, and what the one node
        # holds is the operator's bounds file (PF-97). Every App in `preview` or `published` counts
        # and the reconciler serves only the first `apps` by name (PF-74, T-2633).
        quota:
          contextSpaces: 100
          residentPipelines: 100
          publicEndpoints: 100
          apps: 100
          ingestEventsPerSecond: 500
          # Owner, 2026-09-25: the model keys have no spending limit, so the cap must never stop a
          # live check or a demo; it stays as the mechanism (AG-41) at a ceiling nobody reaches.
          agentRunsPerDay: 2000
          entitiesPerSpace: 1000000
