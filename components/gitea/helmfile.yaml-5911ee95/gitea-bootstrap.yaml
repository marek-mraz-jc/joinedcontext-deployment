  users__roles__editor.yaml: |
    # PF-56, CC-34, PF-50: the person who writes the configuration and administers nothing. They
    # propose and approve the demo kinds, and they may not delete any of them — which is what makes
    # their own change the plain self-approval refusal and not the PF-58 administrator exception the
    # steward gets (`administers` is `approve` *and* `delete`, joinedcontext-portal
    # ui/src/api/approval.ts:100-106).
    #
    # T-2231 asked for a role with `propose` and no `approve`, and reusing `endpoint-editor` if its
    # verbs fit. Neither reaches what the task is for, and both were read before this role was
    # written:
    #   * `endpoint-editor` stops at `Endpoint` and `ModelProjection`, so its holder cannot open the
    #     grant form at all and the PF-50 refusal would again read "you may not propose a
    #     RoleBinding" — the viewer's weaker statement, which `roles-refusals.spec.ts` already plays;
    #   * a role with no `approve` never reaches the self-approval rule either: `approvalStanding`
    #     answers `needsRole` before it looks at who wrote the change (approval.ts:88), so such a
    #     person gets the missing-role refusal the viewer already proves.
    # The verb that must be absent is `delete`, and it is absent here.
    #
    # The holder is still strictly below `demo.steward`, who also holds `org-admin` with `delete`
    # over every kind.
    apiVersion: joinedcontext.com/v1alpha1
    kind: Role
    metadata:
      name: editor
      namespace: org
    spec:
      rules:
        - kinds:
            - ContextSpace
            - DataModel
            - Mapping
            - Policy
            - Endpoint
            - ModelProjection
            - Pipeline
            - DataSource
          verbs: [propose, approve]
        # Granting a role is proposing a binding, and it is never this role's to decide: what the
        # holder may hand out is bounded by the verbs they hold themselves (PF-50), and somebody
        # else approves the grant.
        - kinds: [RoleBinding]
          verbs: [propose]
  users__roles__endpoint-editor.yaml: |
    # PF-56: the person who publishes data proposes Endpoints; the lane policy decides who
    # approves a public one (CC-63).
    apiVersion: joinedcontext.com/v1alpha1
    kind: Role
    metadata:
      name: endpoint-editor
      namespace: org
    spec:
      rules:
        - kinds:
            - Endpoint
            # An endpoint that names a projection carries one, and the Portal proposes the two
            # as one import: a role that may act on the endpoint and not on its projection cannot
            # check its own proposal (MP-01, T-1222).
            - ModelProjection
          verbs: [propose]
  users__roles__janitor.yaml: |
    # The residue sweep's role on dev (T-2627, PF-49): it approves and deletes only what a live journey
    # or a recorded take named as its own, and proposes nothing, so a removal the steward proposes is
    # approved by somebody else and no demo person gains a delete. The pattern is the sweep's own
    # (joinedcontext-portal ui/e2e/live/residue.spec.ts): a journey's `t1234-…` or `t1234r-…` (any
    # four-digit task, T-4993), a take's `…-0915`, the policy-new-user journey's `newuser-policy-…`, and
    # the fixed names a take's acts create. It matches the whole name, and no
    # seeded name falls inside it (tests/test_seed_identity_contract.py): `city-bikes`, which a take
    # once created, is the seeded dashboard now.
    apiVersion: joinedcontext.com/v1alpha1
    kind: Role
    metadata:
      name: janitor
      namespace: org
    spec:
      rules:
        - kinds:
            - ContextSpace
            - DataModel
            - Endpoint
            - ModelProjection
            - Policy
            - Pipeline
            - DataSource
            - Dashboard
            - Layer
            - ContextSourceRegistration
            - CkanInstance
            - App
            - ServiceAccount
            - Subscription
            - SyncSource
            - KnowledgeSource
            - AssistantDeployment
          verbs: [approve, delete]
          constraints:
            - field: metadata.name
              pattern: t[0-9]{4}[a-z]?-[a-z0-9-]+|newuser-policy-[a-z0-9]+|[a-z0-9-]+-[0-9]{4}|bikes-regional-[a-z0-9]+|large-map-city
  users__roles__model-editor.yaml: |
    # The role taxonomy every organization starts from (PF-56, T-0602): the modeller proposes
    # changes to data models and mappings and nothing else; approval stays with the steward.
    apiVersion: joinedcontext.com/v1alpha1
    kind: Role
    metadata:
      name: model-editor
      namespace: org
    spec:
      rules:
        - kinds: [DataModel, Mapping]
          verbs: [propose]
  users__roles__org-admin.yaml: |
    # PF-56: the organization administrator proposes, approves and deletes every kind, roles and
    # bindings included; the one role that approves the red lane (CC-70). A binding under
    # users/assignments/ hands it to a person; the Portal checks the binding before a Change
    # exists (PF-50).
    apiVersion: joinedcontext.com/v1alpha1
    kind: Role
    metadata:
      name: org-admin
      namespace: org
    spec:
      rules:
        - kinds:
            - Organization
            - Project
            - ContextSpace
            - DataModel
            - Mapping
            - Policy
            - ScopeDefinition
            - Endpoint
            # An endpoint that names a projection carries one, and the Portal proposes the two
            # as one import: a role that may act on the endpoint and not on its projection cannot
            # check its own proposal (MP-01, T-1222).
            - ModelProjection
            - SharedSpaceReference
            - ContextSourceRegistration
            - ServiceAccount
            - Pipeline
            - DataSource
            - MqttBroker
            - App
            - CkanInstance
            # The knowledge assistant's sources and deployments (MF-51, MF-52, T-3057).
            - KnowledgeSource
            - AssistantDeployment
            - McpServer
            - Blueprint
            - DataSpaceParticipant
            - DataOffer
            - DataAgreement
            - SyncSource
            - Bundle
            - UiSchema
            - Role
            - RoleBinding
            # Who is in a group is who a binding names, so the administrator who writes bindings
            # writes groups too; without it Organization → Groups refused its own administrator
            # (PF-62, T-2625).
            - Group
            # Administration lists both as its own sections: without them its administrator met a
            # missing page on Environments and a refused "New agent profile" (T-4831). Environment
            # stays a red-lane kind, which this role is the one to approve (CC-73, CC-70).
            - AgentProfile
            - Environment
            - Subscription
            - Entity
            - Dashboard
            - Layer
          verbs: [propose, approve, delete]
        # The people of the realm (PF-91): a person is a Keycloak user and never a manifest, so the
        # Portal's people routes check these verbs, which no other kind takes.
        - kinds: [Person]
          verbs: [read, create, update, disable, delete]
  users__roles__people-admin.yaml: |
    # PF-91: creates, edits, disables and deletes the people of the organization's realm; what they
    # may do stays with the bindings. The Portal refuses a people administrator every write on a
    # person who holds a right they lack (PF-93), so this role opens no stronger account.
    apiVersion: joinedcontext.com/v1alpha1
    kind: Role
    metadata:
      name: people-admin
      namespace: org
    spec:
      rules:
        - kinds: [Person]
          verbs: [read, create, update, disable, delete]
  users__roles__pipeline-editor.yaml: |
    # PF-56: the integration developer proposes pipelines and their sources; a public Endpoint
    # is another role's (PF-52).
    apiVersion: joinedcontext.com/v1alpha1
    kind: Role
    metadata:
      name: pipeline-editor
      namespace: org
    spec:
      rules:
        - kinds: [Pipeline, DataSource]
          verbs: [propose]
  users__roles__steward.yaml: |
    # Roles as code (PF-49, PF-56): the steward is the domain lead of the demonstration instance,
    # proposing and approving every project kind (the yellow lane). Deletion, roles and bindings
    # belong to org-admin. A binding under users/assignments/ hands it to a person; the Portal
    # checks the binding before a Change exists (PF-50, T-0526).
    apiVersion: joinedcontext.com/v1alpha1
    kind: Role
    metadata:
      name: steward
      namespace: org
    spec:
      rules:
        - kinds:
            - ContextSpace
            - DataModel
            - Mapping
            - Policy
            - ScopeDefinition
            - Endpoint
            # An endpoint that names a projection carries one, and the Portal proposes the two
            # as one import: a role that may act on the endpoint and not on its projection cannot
            # check its own proposal (MP-01, T-1222).
            - ModelProjection
            - SharedSpaceReference
            - ContextSourceRegistration
            - ServiceAccount
            - Pipeline
            - DataSource
            - MqttBroker
            - App
            # No CkanInstance: an instance is the administrator's, handed out per instance by its
            # ckan-admin-{project}-{name} role (PF-107).
            - Blueprint
            - DataSpaceParticipant
            - DataOffer
            - DataAgreement
            - SyncSource
            - Bundle
            - UiSchema
            - Subscription
            - Entity
            - Dashboard
            - Layer
          verbs: [propose, approve]
  users__roles__viewer.yaml: |
    # PF-56, PF-61: the role every signed-in person of the organization holds. It reads every
    # project kind and changes nothing; `read` is a verb of its own since PF-59, and `approve`
    # implies none of it, so without this role an approver's own Portal answers 404 on every list.
    # `Role` and `RoleBinding` are not here on purpose: who holds which role is read by the
    # administrator who grants it (org-admin), not by everyone who signs in.
    apiVersion: joinedcontext.com/v1alpha1
    kind: Role
    metadata:
      name: viewer
      namespace: org
    spec:
      rules:
        - kinds:
            - Organization
            - Project
            - ContextSpace
            - DataModel
            - Mapping
            - Policy
            - ScopeDefinition
            - Endpoint
            - ModelProjection
            - SharedSpaceReference
            - ContextSourceRegistration
            - ServiceAccount
            - Pipeline
            - DataSource
            - MqttBroker
            - App
            - CkanInstance
            # The knowledge assistant's sources and deployments (MF-51, MF-52, T-3057).
            - KnowledgeSource
            - AssistantDeployment
            - McpServer
            - Blueprint
            - AgentProfile
            - DataSpaceParticipant
            - DataOffer
            - DataAgreement
            - SyncSource
            - Bundle
            - UiSchema
            - Subscription
            - Entity
            - Dashboard
            - Layer
          verbs: [read]
