  configMaps: gitea-sample-apps
  project: helsinki
  publicBase: https://smartcity.joinedcontext.com/git
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
seed:
  agentprofiles__app-builder.yaml: |
    apiVersion: joinedcontext.com/v1alpha1
    kind: AgentProfile
    metadata:
      name: app-builder
      namespace: org
      title: { en: "Application builder" }
    spec:
      role: builder
      # The runner image of the workspace runs (AG-27); a `static` run never starts one, the
      # Portal builds it in-process from one model call (AP-56). Pinned by digest all the same:
      # the profile is refused without one.
      runtime:
        image: ghcr.io/all-hands-ai/agent-server
        digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      # The first run's one big call (SDK-26): Gemini 3.8 Flash through OpenRouter, thinking at
      # medium on every call of the run (AG-72). The budget covers the run's whole conversation:
      # the build itself takes about 250k tokens and every edit after it reads the files again,
      # so 400k ended a run at its first edit ("budget exhausted", T-0896); at Flash prices two
      # million tokens are about one euro.
      model:
        provider: openai-compatible
        name: google/gemini-3.8-flash
        maxTokensPerRun: 2000000
        reasoningEffort: medium
      limits:
        stepsPerRun: 120
        wallClock: PT20M
        concurrentRunsPerOrganization: 2
        requestsPerMinute: 60
        maxResponseBytes: 2097152
      egress:
        allowedHosts: [registry.npmjs.org, static.crates.io]
      tools: [shell, pnpm, git]
      # What an assistant run may call, intersected with the person who starts it (AG-70): the
      # catalog search, the share and KPI steps, space completion, opening a change or a removal of
      # any project resource and a grant of a role for the person to propose (AG-77). Read and propose
      # only: the run never approves and never removes, the person does, and a grant never exceeds
      # what that person holds (PF-52). Without this block a run gets read-only operations only.
      access:
        # Everything that reads or proposes; a person's own grants narrow each call and a person
        # approves. Never here: approvals, deletions, service-account keys, project create, delete,
        # import and export, jc_flow_start, jc_draft_drop, jc_workspace_discard, jc_workspace_propose
        # (AG-11, AG-82, T-1475).
        operations:
          - jc_catalog_search
          - jc_endpoint_propose
          - jc_kpi_compute
          - jc_space_complete
          - jc_pipeline_test
          - jc_pipeline_sample_source
          - jc_pipeline_try_mapping
          - jc_pipeline_validate
          - jc_resource_propose
          - jc_resource_list
          - jc_resource_get
          - jc_project_get
          - jc_project_revisions
          - jc_endpoint_list_all
          - jc_federation_graph
          - jc_activity_list
          - jc_change_list
          - jc_change_get
          - jc_draft_list
          - jc_draft_get
          - jc_draft_put
          - jc_manifest_dry_run
          - jc_datasource_check
          - jc_model_infer
          - jc_model_source_get
          - jc_pipeline_metrics
          - jc_syncsource_status
          - jc_ckan_status
          - jc_run_list
          - jc_run_get
          - jc_workspace_open
          - jc_workspace_list
          - jc_workspace_get
          - jc_workspace_compare
          - jc_workspace_update_from_main
          - jc_workspace_preview_start
          - jc_workspace_preview_get
          - jc_workspace_preview_stop
        kinds:
          - kind: ContextSpace
            verbs: [read, propose]
          - kind: Endpoint
            verbs: [read, propose]
          - kind: SharedSpaceReference
            verbs: [read, propose]
          - kind: DataSource
            verbs: [read, propose]
          - kind: Pipeline
            verbs: [read, propose]
          - kind: Policy
            verbs: [read, propose]
          - kind: Dashboard
            verbs: [read, propose]
          - kind: Layer
            verbs: [read, propose]
          - kind: App
            verbs: [read, propose]
          - kind: SyncSource
            verbs: [read, propose]
          - kind: ContextSourceRegistration
            verbs: [read, propose]
          - kind: CkanInstance
            verbs: [read, propose]
          - kind: ServiceAccount
            verbs: [read, propose]
          - kind: DataModel
            verbs: [read, propose]
          - kind: RoleBinding
            verbs: [read, propose]
      workspace: { cpu: "1", memory: 2Gi, ephemeralStorage: 4Gi }
  agentprofiles__chat.yaml: |
    apiVersion: joinedcontext.com/v1alpha1
    kind: AgentProfile
    metadata:
      name: chat
      namespace: org
      title: { en: "Assistant conversations" }
    spec:
      # The Portal's assistant conversations run on this profile (T-2770, AG-72): no workspace, no
      # coding tools and no internet, so a steward; the run is the Portal's own model calls.
      role: steward
      # Required by the kind and never started: a conversation runs in the Portal (AP-56).
      runtime:
        image: ghcr.io/all-hands-ai/agent-server
        digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      # Gemini 3.8 Flash at `low`: measured through OpenRouter on 2026-09-25, `low` answers with no
      # reasoning tokens (1.8 s) where no setting thinks 135 tokens (2.1 s), and `none` is refused
      # ("Reasoning is mandatory for this endpoint", HTTP 400). A build keeps app-builder's `medium`.
      # The budget is a long conversation's, a quarter of a build's.
      model:
        provider: openai-compatible
        name: google/gemini-3.8-flash
        maxTokensPerRun: 500000
        reasoningEffort: low
      # A pool of its own: a build or a test on app-builder never queues a person's chat.
      limits:
        stepsPerRun: 200
        wallClock: PT1H
        concurrentRunsPerOrganization: 10
        requestsPerMinute: 60
        maxResponseBytes: 2097152
      # No host at all: a conversation reads through the endpoints, never the internet (AG-50).
      egress: {}
      tools: []
      # What an assistant run may call, intersected with the person who starts it (AG-70): the
      # catalog search, the share and KPI steps, space completion, opening a change or a removal of
      # any project resource and a grant of a role for the person to propose (AG-77). Read and propose
      # only: the run never approves and never removes, the person does, and a grant never exceeds
      # what that person holds (PF-52). Without this block a run gets read-only operations only.
      access:
        # Everything that reads or proposes; a person's own grants narrow each call and a person
        # approves. Never here: approvals, deletions, service-account keys, project create, delete,
        # import and export, jc_flow_start, jc_draft_drop, jc_workspace_discard, jc_workspace_propose
        # (AG-11, AG-82, T-1475).
        operations:
          - jc_catalog_search
          - jc_endpoint_propose
          - jc_kpi_compute
          - jc_space_complete
          - jc_pipeline_test
          - jc_pipeline_sample_source
          - jc_pipeline_try_mapping
          - jc_pipeline_validate
          - jc_resource_propose
          - jc_resource_list
          - jc_resource_get
          - jc_project_get
          - jc_project_revisions
          - jc_endpoint_list_all
          - jc_federation_graph
          - jc_activity_list
          - jc_change_list
          - jc_change_get
          - jc_draft_list
          - jc_draft_get
          - jc_draft_put
          - jc_manifest_dry_run
          - jc_datasource_check
          - jc_model_infer
          - jc_model_source_get
          - jc_pipeline_metrics
          - jc_syncsource_status
          - jc_ckan_status
          - jc_run_list
          - jc_run_get
          - jc_workspace_open
          - jc_workspace_list
          - jc_workspace_get
          - jc_workspace_compare
          - jc_workspace_update_from_main
          - jc_workspace_preview_start
          - jc_workspace_preview_get
          - jc_workspace_preview_stop
        kinds:
          - kind: ContextSpace
            verbs: [read, propose]
          - kind: Endpoint
            verbs: [read, propose]
          - kind: SharedSpaceReference
            verbs: [read, propose]
          - kind: DataSource
            verbs: [read, propose]
          - kind: Pipeline
            verbs: [read, propose]
          - kind: Policy
            verbs: [read, propose]
          - kind: Dashboard
            verbs: [read, propose]
          - kind: Layer
            verbs: [read, propose]
          - kind: App
            verbs: [read, propose]
          - kind: SyncSource
            verbs: [read, propose]
          - kind: ContextSourceRegistration
            verbs: [read, propose]
          - kind: CkanInstance
            verbs: [read, propose]
          - kind: ServiceAccount
            verbs: [read, propose]
          - kind: DataModel
            verbs: [read, propose]
          - kind: RoleBinding
            verbs: [read, propose]
      workspace: { cpu: "100m", memory: 128Mi, ephemeralStorage: 64Mi }
  blueprints__app-from-prompt__blueprint.yaml: |
    # The gallery card of the application builder (AP-56, T-0524): "Generate your own app" in the
    # Portal starts an agent run of the `app-builder` profile (POST …/agent-runs), and the form shows
    # only where this Blueprint exists. The template is the App manifest a run files once the app
    # is built, so a Flows run of this card yields the same manifest by hand.
    #
    # The contract every generated app has to meet (ADR-N-019, AP-23, AP-40), stated here where
    # the builder and its reviewer both read it:
    #   - the app is served behind the platform edge under /apps/{name}/;
    #   - the signed-in person arrives as X-Userinfo (base64 JSON); every endpoint call carries
    #     X-Access-Token; a write without it is answered 401;
    #   - no login, session, OIDC, PKCE or token-refresh code, and no OIDC library;
    #   - it listens on JC_BIND_ADDRESS and serves /healthz;
    #   - apps/air-quality in the Portal repository is the model.
    apiVersion: joinedcontext.com/v1alpha1
    kind: Blueprint
    metadata:
      name: app-from-prompt
      namespace: org
      title: { en: "An application from a prompt", fi: "Sovellus kehotteesta", sk: "Aplikácia zo zadania", cs: "Aplikace ze zadání", de: "Eine App aus einer Beschreibung" }
      description:
        en: "Describe what the app should show; the builder reads the endpoint's schema and writes the app."
        sk: "Opíšte, čo má aplikácia ukazovať; zostavovač prečíta schému endpointu a aplikáciu napíše."
        cs: "Popište, co má aplikace ukazovat; sestavovač přečte schéma endpointu a aplikaci napíše."
        de: "Beschreiben Sie, was die App zeigen soll; der Builder liest das Schema des Endpoints und schreibt die App."
    spec:
      version: 1.0.0
      category: application
      riskClass: yellow
      allowedRoles: [portal-approver]
      parameterSchema:
        type: object
        required: [name, kind, prompt, endpoint]
        additionalProperties: false
        properties:
          name: { type: string, title: "App name", x-jc-title: { sk: "Názov aplikácie", cs: "Název aplikace", de: "Name der App" }, pattern: "^[a-z][a-z0-9-]{1,40}$", description: "The path the app is served at: /apps/{name}/.", x-jc-description: { sk: "Adresa, na ktorej sa aplikácia otvorí: /apps/{name}/.", cs: "Adresa, na které se aplikace otevře: /apps/{name}/.", de: "Die Adresse, unter der die App öffnet: /apps/{name}/." } }
          kind:
            type: string
            title: "How it is built and served"
            x-jc-title: { sk: "Ako sa zostaví a poskytuje", cs: "Jak se sestaví a poskytuje", de: "Wie sie gebaut und bereitgestellt wird" }
            default: static
            oneOf:
              - { const: static, title: "Static (screens only)", x-jc-title: { sk: "Statická (len obrazovky)", cs: "Statická (jen obrazovky)", de: "Statisch (nur Bildschirme)" } }
              - { const: service, title: "Service (backend only, no screens)", x-jc-title: { sk: "Služba (len backend, bez obrazoviek)", cs: "Služba (jen backend, bez obrazovek)", de: "Dienst (nur Backend, keine Bildschirme)" } }
              - { const: fullstack, title: "Full stack (Rust backend and React screens)", x-jc-title: { sk: "Celá (backend v Ruste a obrazovky v Reacte)", cs: "Celá (backend v Rustu a obrazovky v Reactu)", de: "Komplett (Rust-Backend und React-Bildschirme)" } }
          prompt: { type: string, title: "What should the app do", x-jc-title: { sk: "Čo má aplikácia robiť", cs: "Co má aplikace dělat", de: "Was soll die App tun" }, minLength: 10, maxLength: 2000, x-jc-widget: textarea }
          endpoint:
            type: string
            title: "Endpoint it reads"
            x-jc-title: { sk: "Endpoint, ktorý číta", cs: "Endpoint, který čte", de: "Endpoint, den sie liest" }
            pattern: "^[a-z][a-z0-9-]{1,60}$"
            description: "An Endpoint of this project; the app reads only what it publishes."
            x-jc-description: { sk: "Endpoint tohto projektu; aplikácia číta len to, čo zverejňuje.", cs: "Endpoint tohoto projektu; aplikace čte jen to, co zveřejňuje.", de: "Ein Endpoint dieses Projekts; die App liest nur, was er veröffentlicht." }
            x-jc-widget: resourcePicker
            x-jc-options: { plural: endpoints }
          contextSpace:
            type: string
            title: "Context Space behind the endpoint"
            x-jc-title: { sk: "Kontextový priestor za endpointom", cs: "Kontextový prostor za endpointem", de: "Kontextbereich hinter dem Endpoint" }
            pattern: "^[a-z][a-z0-9-]{1,60}$"
            default: helsinki
            x-jc-widget: resourcePicker
            x-jc-options: { plural: spaces }
      templates:
        - name: app
