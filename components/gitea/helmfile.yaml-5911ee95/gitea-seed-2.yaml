    projects__barcelona__pipelines__accidents__bento.yaml: "# The mapping of the accidents pipeline (PL-03, T-5374): one RoadAccident per police file of Open\n# Data BCN `accidents-gu-bcn`, the newest year's CSV (YYYY_accidents_gu_bcn.csv, CRLF lines):\n# Numero_expedient, the place (street, number, barri, district, WGS84 point), the local day and\n# hour, and the counts of dead (Numero_morts), slightly and seriously injured, vehicles, and the\n# pedestrian's cause where the police name one. Nothing about a person is in the file or written.\n#\n# The four detail tables of the same year join each accident by file number (owner 2026-10-22,\n# rows 1..6 of docs Research/barcelona-open-data.md): its kinds (accidents-tipus-gu-bcn), its\n# mediate and drivers' causes (accidents-causes-gu-bcn, accidents_causa_conductor_gu_bcn), the\n# kind of each vehicle (accidents-vehicles-gu-bcn; no make, model, colour or licence) and the\n# passengers and pedestrians injured or dead (accidents-persones-gu-bcn, as counts; no age, sex or\n# trip purpose leaves the city's database). One package_search names the five records, and one\n# DataStore SQL query aggregates them per file on the city's side; only resource ids of the UUID\n# form reach the SQL. A year whose detail tables are not all published fails the run.\n#\n# The DataSource's answer is the dataset's CKAN record: the newest CSV resource whose name starts\n# with a year is read, only from the city's dataset path; a newest year more than two years old\n# fails the run, so a dataset the city renamed does not go quiet.\n#\n# Plausibility (owner 2026-10-22): a row without a file number (YYYYS + 6 digits), a day or hour\n# that is no date, a point that is no number or lies outside the municipality's 1 km margin (the\n# space's in-area bbox), a count that is negative or above 100 (no vehicle at all), a second row\n# of one file number, and an accident dated after now are dropped, each counted by reason in the\n# run's log line. A file with no accident at all fails the run, which writes nothing.\n\npipeline:\n  processors:\n    - try:\n        - mapping: |\n            let record = if content().length() > 1048576 { throw(\"the dataset record is %d bytes, more than the 1 MiB read\".format(content().length())) } else { content().string().parse_json().catch({}) }\n            let files = $record.result.resources.or([]).filter(r -> r.format.or(\"\").uppercase() == \"CSV\" && r.name.or(\"\").lowercase().re_match(\"^[0-9]{4}_accidents_gu_bcn\\\\.csv$\")).sort_by(r -> r.name.slice(0, 4))\n            let newest = if $files.length() == 0 { throw(\"the dataset record names no YYYY_accidents_gu_bcn.csv\") } else { $files.index(-1) }\n            meta accidents_year = $newest.name.slice(0, 4)\n            let file = $newest.url.or(\"\").trim_prefix(\"https://opendata-ajuntament.barcelona.cat/data/dataset/\")\n            meta accidents_path = if !$newest.url.or(\"\").has_prefix(\"https://opendata-ajuntament.barcelona.cat/data/dataset/\") || !$file.re_match(\"^[0-9a-f-]{36}/resource/[0-9a-f-]{36}/download/[0-9]{4}_accidents_gu_bcn\\\\.csv$\") { throw(\"the newest accidents file is not on the city's dataset path\") } else if $newest.name.slice(0, 4).number() < now().ts_format(\"2006\", \"UTC\").number() - 2 { throw(\"the newest accidents file is of %v, more than two years old\".format($newest.name.slice(0, 4))) } else { $file }\n            root = \"\"\n        - http:\n            url: https://opendata-ajuntament.barcelona.cat/data/dataset/${! @accidents_path }\n            verb: GET\n            headers:\n              Accept: text/csv\n              User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)\n            timeout: 60s\n            retries: 1\n            rate_limit: barcelona_opendata\n        - mapping: |\n            let text = if content().length() > 4194304 { throw(\"the accidents file is %d bytes, more than the 4 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\").replace_all(\"\\r\", \"\") }\n            let bbox = [2.04, 41.3, 2.24, 41.48]\n            let now = now().ts_unix()\n            let rows = $text.parse_csv(true, \",\").catch([])\n            let numbered = $rows.filter(r -> r.Numero_expedient.or(\"\").trim().re_match(\"^[0-9]{4}S[0-9]{6}$\"))\n            let dated = $numbered.map_each(r -> {\n              \"id\": r.Numero_expedient.trim(),\n              \"at\": \"%04d-%02d-%02dT%02d:00:00\".format(r.NK_Any.number().int64().catch(0), r.Mes_any.number().int64().catch(0), r.Dia_mes.number().int64().catch(0), r.Hora_dia.number().int64().catch(99)).(local -> (local + (local + \"Z\").ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_format(\"-07:00\", \"Europe/Madrid\")).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix()).catch(null),\n              \"lon\": r.Longitud_WGS84.or(\"\").trim().number().catch(null),\n              \"lat\": r.Latitud_WGS84.or(\"\").trim().number().catch(null),\n              \"dead\": r.Numero_morts.or(\"\").trim().(n -> if n == \"\" { 0 } else { n.number().catch(-1) }),\n              \"slight\": r.Numero_lesionats_lleus.or(\"\").trim().(n -> if n == \"\" { 0 } else { n.number().catch(-1) }),\n              \"serious\": r.Numero_lesionats_greus.or(\"\").trim().(n -> if n == \"\" { 0 } else { n.number().catch(-1) }),\n              \"vehicles\": r.Numero_vehicles_implicats.or(\"\").trim().number().catch(-1),\n              \"cause\": r.Descripcio_causa_vianant.or(\"\").trim(),\n              \"street\": r.Nom_carrer.or(\"\").trim(),\n              \"number\": r.get(\"Num_postal \").or(r.Num_postal).or(\"\").trim(),\n              \"barri\": r.Nom_barri.or(\"\").trim(),\n              \"district\": r.Nom_districte.or(\"\").trim()\n            }).filter(a -> a.at != null)\n            let placed = $dated.filter(a -> a.lon != null && a.lat != null)\n            let inside = $placed.filter(a -> a.lon >= $bbox.index(0) && a.lon <= $bbox.index(2) && a.lat >= $bbox.index(1) && a.lat <= $bbox.index(3))\n            let counted = $inside.filter(a -> a.dead >= 0 && a.dead <= 100 && a.slight >= 0 && a.slight <= 100 && a.serious >= 0 && a.serious <= 100 && a.vehicles >= 1 && a.vehicles <= 100)\n            let past = $counted.filter(a -> a.at <= $now)\n            let first = $past.fold({ \"seen\": {}, \"kept\": [] }, t -> if t.tally.seen.exists(t.value.id) { t.tally } else { { \"seen\": t.tally.seen.merge({ t.value.id: true }), \"kept\": t.tally.kept.append(t.value) } }).kept\n            root.dropped = {\n              \"noFileNumber\": $rows.length() - $numbered.length(),\n              \"noDate\": $numbered.length() - $dated.length(),\n              \"noPoint\": $dated.length() - $placed.length(),\n              \"outsideTheCity\": $placed.length() - $inside.length(),\n              \"countOutOfRange\": $inside.length() - $counted.length(),\n              \"dateInFuture\": $counted.length() - $past.length(),\n              \"duplicateFileNumber\": $past.length() - $first.length()\n            }\n            root.accidents = if $first.length() == 0 { throw(\"the accidents file of %v holds no accident\".format(@accidents_year)) } else { $first }\n        - branch:\n            request_map: root = \"\"\n            processors:\n              - http:\n                  url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/package_search?rows=10&fq=name:(accidents-tipus-gu-bcn%20OR%20accidents-causes-gu-bcn%20OR%20accidents_causa_conductor_gu_bcn%20OR%20accidents-vehicles-gu-bcn%20OR%20accidents-persones-gu-bcn)\n                  verb: GET\n                  headers:\n                    Accept: application/json\n                    User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)\n                  timeout: 30s\n                  retries: 1\n                  rate_limit: barcelona_opendata\n              - mapping: |\n                  let uuid = \"^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$\"\n                  let year = @accidents_year\n                  let packages = if content().length() > 1048576 { throw(\"the accident detail records are %d bytes, more than the 1 MiB read\".format(content().length())) } else { content().string().parse_json().catch({}).result.results.or([]) }\n                  let tables = [[\"accidents-tipus-gu-bcn\", \"accidents_tipus_gu_bcn\"], [\"accidents-causes-gu-bcn\", \"accidents_causes_gu_bcn\"], [\"accidents_causa_conductor_gu_bcn\", \"accidents_causa_conductor_gu_bcn\"], [\"accidents-vehicles-gu-bcn\", \"accidents_vehicles_gu_bcn\"], [\"accidents-persones-gu-bcn\", \"accidents_persones_gu_bcn\"]]\n                  let ids = $tables.map_each(w -> $packages.filter(p -> p.name.or(\"\") == w.index(0)).index(0).or({}).resources.or([]).filter(r -> r.datastore_active.or(false) == true && r.id.or(\"\").re_match($uuid) && r.name.or(\"\").lowercase() == $year + \"_\" + w.index(1) + \".csv\").index(0).or({}).id.or(\"\"))\n                  let missing = $tables.enumerated().filter(t -> $ids.index(t.index) == \"\").map_each(t -> t.value.index(0))\n                  let t = if $missing.length() > 0 { throw(\"the accident detail tables of %v are not all in the DataStore: %v\".format($year, $missing.join(\", \"))) } else { $ids }\n                  meta details_sql = (\"SELECT id, types, causes, drivers, vehicles, pi::text, pd::text, wi::text, wd::text FROM (SELECT trim(\\\"Numero_expedient\\\") AS id, string_agg(DISTINCT nullif(trim(\\\"Descripcio_tipus_accident\\\"), ''), '|') AS types FROM \\\"\" + $t.index(0) + \"\\\" GROUP BY 1) a FULL JOIN (SELECT trim(\\\"Numero_expedient\\\") AS id, string_agg(DISTINCT nullif(trim(\\\"Descripcio_causa_mediata\\\"), ''), '|') AS causes FROM \\\"\" + $t.index(1) + \"\\\" GROUP BY 1) b USING (id) FULL JOIN (SELECT trim(\\\"Número_expedient\\\") AS id, string_agg(DISTINCT nullif(trim(\\\"Causa conductor\\\"), ''), '|') AS drivers FROM \\\"\" + $t.index(2) + \"\\\" GROUP BY 1) c USING (id) FULL JOIN (SELECT trim(\\\"Numero_expedient\\\") AS id, string_agg(nullif(trim(\\\"Descripcio_tipus_vehicle\\\"), ''), '|' ORDER BY trim(\\\"Descripcio_tipus_vehicle\\\")) AS vehicles FROM \\\"\" + $t.index(3) + \"\\\" GROUP BY 1) d USING (id) FULL JOIN (SELECT trim(\\\"Numero_expedient\\\") AS id, count(*) FILTER (WHERE \\\"Descripcio_tipus_persona\\\" = 'Passatger' AND \\\"Descripcio_victimitzacio\\\" LIKE 'Ferit%') AS pi, count(*) FILTER (WHERE \\\"Descripcio_tipus_persona\\\" = 'Passatger' AND \\\"Descripcio_victimitzacio\\\" LIKE 'Mort (%') AS pd, count(*) FILTER (WHERE \\\"Descripcio_tipus_persona\\\" = 'Vianant' AND \\\"Descripcio_victimitzacio\\\" LIKE 'Ferit%') AS wi, count(*) FILTER (WHERE \\\"Descripcio_tipus_persona\\\" = 'Vianant' AND \\\"Descripcio_victimitzacio\\\" LIKE 'Mort (%') AS wd FROM \\\"\" + $t.index(4) + \"\\\" GROUP BY 1) e USING (id) LIMIT 50000\").escape_url_query()\n                  root = \"\"\n              - http:\n                  url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/datastore_search_sql?sql=${! @details_sql }\n                  verb: GET\n                  headers:\n                    Accept: application/json\n                    User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)\n                  timeout: 60s\n                  retries: 1\n                  rate_limit: barcelona_opendata\n              - mapping: |\n                  let answer = if content().length() > 8388608 { throw(\"the accident details answer is %d bytes, more than the 8 MiB read\".format(content().length())) } else { content().string().parse_json().catch({}) }\n                  root = if $answer.success.or(false) != true { throw(\"Open Data BCN refused the accident details query: %s\".format($answer.error.format_json(no_indent: true).or(\"no reason given\"))) } else if $answer.result.records.or([]).length() >= 50000 { throw(\"the accident details answered %d rows, the LIMIT 50000 of its query: raise it, or the rows past it are dropped\".format($answer.result.records.length())) } else { $answer.result.records.or([]).filter(r -> r.id.or(\"\").type() == \"string\").map_each(r -> { r.id: r }).squash() }\n            result_map: root.details = this\n        - mapping: |\n            # The city's labels, in Catalan, stay as the city writes them (accidentKind, accidentCause,\n            # vehicleKind); the Smart Data Model's coded lists (accidentType, vehiclesInvolved) carry\n            # a label only where its code means the same thing, never a nearest guess. A count the\n            # persons table cannot give (no row of the file) stays out of the entity.\n            map split {\n              root = if this.or(\"\") == \"\" { [] } else { this.split(\"|\") }\n            }\n            map count {\n              root = this.or(\"\").string().number().int64().catch(null)\n            }\n            let typeCodes = [[\"Col.lisió frontal\", \"1\"], [\"Col.lisió fronto-lateral\", \"2\"], [\"Col.lisió lateral\", \"3\"], [\"Abast\", \"4\"], [\"Abast multiple\", \"4\"], [\"Encalç\", \"4\"], [\"Atropellament\", \"5\"], [\"Xoc contra element estàtic\", \"8\"]]\n            let vehicleCodes = [[\"Bicicleta\", \"1\"], [\"Bicicleta pedaleig assistit\", \"1\"], [\"Autobús\", \"3\"], [\"Autobús articulat\", \"3\"], [\"Autocar\", \"3\"], [\"Microbús <= 17\", \"4\"], [\"Turisme\", \"5\"], [\"Taxi\", \"5\"], [\"Tot terreny\", \"5\"], [\"Tren o tramvia\", \"7\"], [\"Camió rígid <= 3,5 tones\", \"11\"], [\"Camió rígid > 3,5 tones\", \"11\"], [\"Tractor camió\", \"11\"], [\"Ciclomotor\", \"12\"], [\"Motocicleta\", \"14\"], [\"Furgoneta\", \"18\"], [\"Maquinària d'obres i serveis\", \"20\"]]\n            let details = this.details\n            root.dropped = this.dropped\n            root.accidents = this.accidents.map_each(a -> $details.get(a.id).or({}).(d -> a.assign({\n              \"kinds\": d.types.apply(\"split\"),\n              \"typeCodes\": d.types.apply(\"split\").map_each(k -> $typeCodes.filter(c -> c.index(0) == k).index(0).or([]).index(1).or(\"\")).filter(c -> c != \"\").unique(),\n              \"causes\": d.causes.apply(\"split\").concat(d.drivers.apply(\"split\")),\n              \"vehicleKinds\": d.vehicles.apply(\"split\"),\n              \"vehicleCodes\": d.vehicles.apply(\"split\").map_each(k -> $vehicleCodes.filter(c -> c.index(0) == k).index(0).or([]).index(1).or(\"\")).filter(c -> c != \"\"),\n              \"passengersInjured\": d.pi.apply(\"count\"),\n              \"passengersDead\": d.pd.apply(\"count\"),\n              \"pedestriansInjured\": d.wi.apply(\"count\"),\n              \"pedestriansDead\": d.wd.apply(\"count\")\n            })))\n            root.withDetails = this.accidents.filter(a -> $details.exists(a.id)).length()\n        - log:\n            level: INFO\n            message: 'accidents ${! @accidents_year }: ${! json(\"accidents\").length() } written, ${! json(\"withDetails\") } with details; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n        - mapping: root = this.accidents\n        - unarchive: { format: json_array }\n        - mapping: |\n            root = {\n              \"id\": \"urn:ngsi-ld:%v:%v:%v:accident-%v\".format(\"RoadAccident\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), this.id.lowercase()),\n              \"type\": \"RoadAccident\",\n              \"localId\": { \"type\": \"Property\", \"value\": this.id },\n              \"status\": { \"type\": \"Property\", \"value\": \"archived\" },\n              \"accidentDate\": { \"type\": \"Property\", \"value\": this.at.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\") },\n              \"totalInjured\": { \"type\": \"Property\", \"value\": this.slight + this.serious },\n              \"seriouslyInjured\": { \"type\": \"Property\", \"value\": this.serious },\n              \"slightlyInjured\": { \"type\": \"Property\", \"value\": this.slight },\n              \"deadCount\": { \"type\": \"Property\", \"value\": this.dead },\n              \"vehicleCount\": { \"type\": \"Property\", \"value\": this.vehicles },\n              \"pedestriansInvolved\": if this.cause == \"\" { null } else { { \"type\": \"Property\", \"value\": true } },\n              \"pedestrianCause\": if this.cause == \"\" { null } else { { \"type\": \"Property\", \"value\": this.cause } },\n              \"accidentKind\": if this.kinds.or([]).length() == 0 { null } else { { \"type\": \"Property\", \"value\": this.kinds } },\n              \"accidentType\": if this.typeCodes.or([]).length() == 0 { null } else { { \"type\": \"Property\", \"value\": this.typeCodes } },\n              \"accidentCause\": if this.causes.or([]).length() == 0 { null } else { { \"type\": \"Property\", \"value\": this.causes } },\n              \"vehicleKind\": if this.vehicleKinds.or([]).length() == 0 { null } else { { \"type\": \"Property\", \"value\": this.vehicleKinds } },\n              \"vehiclesInvolved\": if this.vehicleCodes.or([]).length() == 0 { null } else { { \"type\": \"Property\", \"value\": this.vehicleCodes } },\n              \"numPassengersInjured\": if this.passengersInjured == null { null } else { { \"type\": \"Property\", \"value\": this.passengersInjured } },\n              \"numPassengersDead\": if this.passengersDead == null { null } else { { \"type\": \"Property\", \"value\": this.passengersDead } },\n              \"numPedestrianInjured\": if this.pedestriansInjured == null { null } else { { \"type\": \"Property\", \"value\": this.pedestriansInjured } },\n              \"numPedestrianDead\": if this.pedestriansDead == null { null } else { { \"type\": \"Property\", \"value\": this.pedestriansDead } },\n              \"address\": { \"type\": \"Property\", \"value\": {\n                \"streetAddress\": if this.street == \"\" { null } else if this.number == \"\" { this.street } else { this.street + \" \" + this.number },\n                \"addressLocality\": \"Barcelona\",\n                \"district\": if this.district == \"\" { null } else { this.district },\n                \"addressCountry\": \"ES\"\n              }.filter(entry -> entry.value != null) },\n              \"areaServed\": if this.barri == \"\" { null } else { { \"type\": \"Property\", \"value\": this.barri } },\n              \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": \"Point\", \"coordinates\": [this.lon, this.lat] } },\n              \"dataProvider\": { \"type\": \"Property\", \"value\": \"Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)\" },\n              \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/accidents-gu-bcn\" }\n            }.filter(entry -> entry.value != null)\n"
    projects__barcelona__pipelines__agenda__pipeline.yaml: |
      # The agendas change once a day at the source (frequency DIARIA); one run a day after the city's
      # morning update writes them (T-5265).
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: agenda
        namespace: barcelona
        title:
          ca: Agenda d'activitats de Barcelona
          es: Agenda de actividades de Barcelona
          en: Barcelona activity agenda
      spec:
        class: auto
        schedule: '17 6 * * *'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-agenda }
        # Every stream writes through the one endpoint that evaluates the pipelines-write Policy.
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        output: { type: Event, mode: upsert }
        # Measured: the whole agenda (7,670 rows) maps inside a 128 MiB container.
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__city-works__bento.yaml: "# The mapping of the city-works pipeline (PL-03, T-5264): one CityWork per public work of Open Data\n# BCN's obres_espai_public.json (dataset obres, rewritten daily): every work on the city's public\n# space since 2010, one row per work and district or barri it touches, each repeating the work's\n# code, its dates and its outline (WKT, geometria_wgs84). So the work is keyed by its code and its\n# rows become one entity whose territorialArea names every district; refDistrict points at the\n# district's AdministrativeArea when the work lies in one district only (code 11, \"Àmbit ciutat\",\n# is the whole city). The file writes a missing value as the string \"None\". The constructor is\n# left out, because it can name a person. The promoter is mostly a public body, a utility or a\n# company, but a private building's promoter can be a person (2 of 295 current works on\n# 2026-10-23): it is kept only when it is one of the city's bodies or utilities the allow-list\n# below names (BIMSA, ENDESA, Ajuntament BCN...) or a company by its legal form (S.A., S.L.,\n# S.L.U., SCCL, SOCIMI, UTE), and otherwise left out and counted.\n#\n# Which works: those in execution or stopped, and the finished ones for 30 days after their end;\n# the older finished works (about 1,600 of 1,900) stay in the source's own archive. `expiresAt`\n# (NGSI-LD 4.22): a work leaves every read three days after the file last listed it (three\n# update periods), a finished one also 30 days after its end, so a work the file drops goes\n# instead of standing with its last state.\n#\n# Plausibility (owner 2026-10-22): a row with no code, an unknown state, a start or end that is no\n# date, an end before the start, no outline or a vertex outside the municipality's 1 km margin\n# (the space's in-area bbox) is dropped; a budget below 0 or above 1,000 million euros is left\n# out of the entity; each is counted by reason in `dropped`, which the next step logs. A file\n# with no work in execution at all fails the run, so the works stand instead of going quiet.\n\npipeline:\n  processors:\n    - mapping: |\n        let text = if content().length() > 33554432 { throw(\"the works file is %d bytes, more than the 32 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        # The run's clock; a test sets bcn_now to read a recorded file as of its own day.\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix()\n        let lease = $now + 3 * 86400\n        let bbox = [2.04, 41.3, 2.24, 41.48]\n        let states = { \"En execució\": \"open\", \"Aturada\": \"other\", \"Finalitzada\": \"completed\" }\n        map text {\n          root = if this == null || this.string().trim() == \"\" || this.string().trim() == \"None\" || this.string().trim() == \"-\" { null } else { this.string().trim() }\n        }\n        # A local \"2025-12-17 00:00:00\" as UTC seconds: read as UTC, then moved by Madrid's offset. The\n        # file wrote \".000\" after the seconds until 2026-10-23 05:31Z and none since; both are read.\n        map instant {\n          let naive = this.apply(\"text\").or(\"\").re_replace_all(\"\\\\.[0-9]+$\", \"\").ts_parse(\"2006-01-02 15:04:05\").ts_unix().catch(null)\n          root = if $naive == null { null } else { $naive - $naive.ts_format(\"-07\", \"Europe/Madrid\").number() * 3600 }\n        }\n        map organisation {\n          let name = this.apply(\"text\")\n          let body = \"^(BIMSA|AGBAR|BCASA|IMU|IMHAB|IMMB|BSM|BSAV|TMB|AMB|ATM|ATLL|ADIF|FGC|FMB|REE|ENDESA|NEDGIA|DISTRICLIMA|ECOENERGIES|VODAFONE|CATSALUT|INCAS[OÒ]L|TRAM|FIRA (DE )?BARCELONA|PORT DE BARCELONA|FUTBOL CLUB BARCELONA)$|^(AJUNTAMENT (BCN|DE BARCELONA)|INFRAESTRUCTURES\\\\.CAT|E-DISTRIBUCI[OÓ]N|AIG[UÜ]ES DE BARCELONA|FERROCARRILS DE LA GENERALITAT|CONSORCI |FUNDACI[OÓ] |JUNTA DE COMPENSACI[OÓ] |BARCELONA D'INFRAESTRUCTURES MUNICIPALS|UNIVERSITAT |GERENCIA DE INFRAESTRUCTURAS)\"\n          let company = \"(^|[ ,])(S\\\\.? ?A\\\\.?|S\\\\.? ?L\\\\.?|S\\\\.?A\\\\.?U\\\\.?|S\\\\.?L\\\\.?U\\\\.?|SCCL|SOCIMI|UTE)([ ,.]|$)\"\n          root = if $name != null && ($name.uppercase().re_match($body) || $name.uppercase().re_match($company)) { $name } else { null }\n        }\n        map amount {\n          let value = this.apply(\"text\").number().catch(null)\n          root = if $value == null || $value < 0 || $value > 1000000000 { null } else { $value }\n        }\n        let rows = $text.parse_json().catch([]).or([]).map_each(r -> r.assign({\n          \"code\": r.codi.apply(\"text\").or(\"\"),\n          \"start\": r.data_inici.apply(\"instant\"),\n          \"end\": r.data_fi.apply(\"instant\")\n        }))\n        let coded = $rows.filter(r -> r.code.re_match(\"^[0-9]{2}-[0-9]{4}[A-Z][0-9]{4}$\"))\n        let known = $coded.filter(r -> $states.exists(r.estat.or(\"\")))\n        let dated = $known.filter(r -> r.start != null && r.end != null)\n        let ordered = $dated.filter(r -> r.start <= r.end)\n        let current = $ordered.filter(r -> r.estat != \"Finalitzada\" || r.end + 30 * 86400 >= $now)\n        let shaped = $current.map_each(r -> r.assign({\n          \"wkt\": r.geometria_wgs84.apply(\"text\").or(\"\")\n        })).map_each(r -> r.assign({\n          \"shape\": if r.wkt.has_prefix(\"MULTIPOLYGON\") { \"MultiPolygon\" } else if r.wkt.has_prefix(\"POLYGON\") { \"Polygon\" } else { null },\n          \"coordinates\": r.wkt.re_replace_all(\"^[A-Z]+ *\", \"\").re_replace_all(\"(-?[0-9.]+) (-?[0-9.]+)\", \"[$1,$2]\").replace_all(\"(\", \"[\").replace_all(\")\", \"]\").parse_json().catch(null)\n        })).filter(r -> r.shape != null && r.coordinates != null)\n        let inside = $shaped.filter(r -> (if r.shape == \"MultiPolygon\" { r.coordinates.flatten().flatten() } else { r.coordinates.flatten() }).all(p -> p.index(0) >= $bbox.index(0) && p.index(0) <= $bbox.index(2) && p.index(1) >= $bbox.index(1) && p.index(1) <= $bbox.index(3)))\n        # One work per code: its first row stands, the districts of every row are gathered.\n        let works = $inside.fold({}, item -> item.tally.assign({ item.value.code: item.tally.get(item.value.code).or(item.value.assign({ \"districts\": [] })).merge({ \"districts\": [ { \"code\": item.value.codi_districte.apply(\"text\").or(\"\"), \"name\": item.value.nom_districte.apply(\"text\").or(\"\") } ] }) })).values().sort_by(w -> w.code)\n        let promoters = $works.map_each(w -> w.promotor.apply(\"text\")).filter(p -> p != null)\n        let budgets = $works.map_each(w -> [w.pressupost_licitacio, w.pressupost_adjudicacio]).flatten().filter(b -> b.apply(\"text\") != null)\n        root.dropped = {\n          \"noCode\": $rows.length() - $coded.length(),\n          \"unknownState\": $coded.length() - $known.length(),\n          \"noDate\": $known.length() - $dated.length(),\n          \"endBeforeStart\": $dated.length() - $ordered.length(),\n          \"finishedOver30DaysAgo\": $ordered.length() - $current.length(),\n          \"noOutline\": $current.length() - $shaped.length(),\n          \"outsideTheCity\": $shaped.length() - $inside.length(),\n          \"rowPerAreaMerged\": $inside.length() - $works.length(),\n          \"promoterLeftOut\": $promoters.length() - $promoters.filter(p -> p.apply(\"organisation\") != null).length(),\n          \"budgetOutOfRange\": $budgets.length() - $budgets.filter(b -> b.apply(\"amount\") != null).length()\n        }\n        root.entities = if $works.filter(w -> w.estat == \"En execució\").length() == 0 { throw(\"the works file holds no work in execution\") } else { $works.map_each(w -> w.assign({\n          \"areas\": w.districts.filter(d -> d.code.re_match(\"^(0[1-9]|10)$\")).map_each(d -> d.code).unique().sort(),\n          \"names\": w.districts.map_each(d -> d.name).filter(n -> n != \"\").unique().sort()\n        })).map_each(w -> {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:%v\".format(\"CityWork\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), w.code),\n          \"type\": \"CityWork\",\n          \"expiresAt\": (if w.estat == \"Finalitzada\" { [w.end + 30 * 86400, $lease].min() } else { $lease }).ts_format(\"2006-01-02T15:04:05Z\", \"UTC\"),\n          \"name\": { \"type\": \"Property\", \"value\": w.titol.apply(\"text\").or(w.ubicacio.apply(\"text\")).or(w.code) },\n          \"description\": if w.descripcio.apply(\"text\") == null { null } else { { \"type\": \"Property\", \"value\": w.descripcio.apply(\"text\") } },\n          \"workNumber\": { \"type\": \"Property\", \"value\": w.code },\n          \"workState\": { \"type\": \"Property\", \"value\": $states.get(w.estat) },\n          \"workStateLabel\": { \"type\": \"Property\", \"value\": w.estat },\n          \"workCategory\": if w.tipusobra.apply(\"text\") == null { null } else { { \"type\": \"Property\", \"value\": w.tipusobra.apply(\"text\") } },\n          \"startDate\": { \"type\": \"Property\", \"value\": w.start.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\") },\n          \"endDate\": { \"type\": \"Property\", \"value\": w.end.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\") },\n          \"contractingAuthority\": if w.promotor.apply(\"organisation\") == null { null } else { { \"type\": \"Property\", \"value\": w.promotor.apply(\"organisation\") } },\n          \"tenderAmount\": if w.pressupost_licitacio.apply(\"amount\") == null { null } else { { \"type\": \"Property\", \"value\": w.pressupost_licitacio.apply(\"amount\") } },\n          \"awardAmount\": if w.pressupost_adjudicacio.apply(\"amount\") == null { null } else { { \"type\": \"Property\", \"value\": w.pressupost_adjudicacio.apply(\"amount\") } },\n          \"areaServed\": if w.ubicacio.apply(\"text\") == null { null } else { { \"type\": \"Property\", \"value\": w.ubicacio.apply(\"text\").replace_all(\"''\", \"'\") } },\n          \"territorialArea\": if w.names.length() == 0 { null } else { { \"type\": \"Property\", \"value\": w.names.join(\"; \") } },\n          \"refDistrict\": if w.areas.length() != 1 { null } else {\n            { \"type\": \"Relationship\", \"object\": \"urn:ngsi-ld:%v:%v:%v:district-%v\".format(\"AdministrativeArea\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), w.areas.index(0)) }\n          },\n          \"seeAlso\": if w.url_web_obres.apply(\"text\").or(\"\").re_match(\"^https?://\") { { \"type\": \"Property\", \"value\": w.url_web_obres.apply(\"text\") } } else { null },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": w.shape, \"coordinates\": w.coordinates } },\n          \"dataProvider\": { \"type\": \"Property\", \"value\": \"Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)\" },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/obres\" }\n        }.filter(entry -> entry.value != null)) }\n    - log:\n        level: INFO\n        message: 'city works: ${! json(\"entities\").length() } written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.entities\n"
    projects__barcelona__pipelines__city-works__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: city-works
        namespace: barcelona
        title:
          ca: Obres a l'espai públic de Barcelona, cada dia
          es: Obras en el espacio público de Barcelona, cada día
          en: Barcelona works on the public space, daily
      spec:
        class: auto
        # The city rewrites the file once a day at about 05:30 UTC.
        schedule: '40 6 * * *'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-city-works }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert: a work the file drops leaves by its expiresAt, three days after its last listing (T-5264).
        output: { type: CityWork, mode: upsert }
        # The whole 7.7 MB file ran in 128 MiB on 2026-10-23; 192 leaves room for its growth.
        quotas: { maxMemoryMb: 192, cpuMillicores: 200 }
    projects__barcelona__pipelines__ev-charging__pipeline.yaml: |
      # The charging points of Endolla Barcelona into the space barcelona every five minutes (T-5262):
      # one EVChargingStation per point with its free ports now.
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: ev-charging
        namespace: barcelona
        title:
          ca: Punts de recàrrega elèctrica, cada 5 minuts
          es: Puntos de recarga eléctrica, cada 5 minutos
          en: EV charging points, every 5 min
      spec:
        class: auto
        period: 300s
        source:
          dataSourceRef: { kind: DataSource, name: bcn-ev-charging }
        targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:barcelona:barcelona
        output: { type: EVChargingStation, mode: upsert }
        quotas: { maxMemoryMb: 64, cpuMillicores: 50 }
    projects__barcelona__pipelines__neighbourhoods__bento.yaml: "# The mapping of the neighbourhoods pipeline (PL-03, T-5264): one AdministrativeArea per barri of\n# Barcelona (73), its outline, its code and the district it belongs to, from Open Data BCN's\n# BarcelonaCiutat_Barris.csv (dataset 20170706-districtes-barris): columns codi_districte,\n# nom_districte, codi_barri, nom_barri, geometria_etrs89 and geometria_wgs84. The outline is read\n# as barcelona-pipeline-districts-bento.yaml reads it, and so are the checks; the barri codes run\n# 01..73 across the city, so the code alone keys the area.\n#\n# Plausibility (owner 2026-10-22): a row whose code is not two digits, whose outline is no polygon\n# or has a vertex outside the municipality's 1 km margin (the space's in-area bbox), and a second\n# row of one code are each dropped and counted by reason in `dropped`, which the next step logs.\n# A file with no neighbourhood at all fails the run, so the areas stand instead of going stale.\n\npipeline:\n  processors:\n    - mapping: |\n        let text = if content().length() > 4194304 { throw(\"the neighbourhoods file is %d bytes, more than the 4 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        let bbox = [2.04, 41.3, 2.24, 41.48]\n        let rows = $text.parse_csv(true, \",\").map_each(r -> {\n          \"code\": r.codi_barri.or(\"\").trim(),\n          \"district\": r.codi_districte.or(\"\").trim(),\n          \"name\": r.nom_barri.or(\"\").trim(),\n          \"wkt\": r.geometria_wgs84.or(\"\").trim()\n        })\n        let coded = $rows.filter(r -> r.code.re_match(\"^[0-9]{2}$\") && r.district.re_match(\"^[0-9]{2}$\") && r.name != \"\")\n        let shaped = $coded.map_each(r -> r.assign({\n          \"type\": if r.wkt.has_prefix(\"MULTIPOLYGON\") { \"MultiPolygon\" } else if r.wkt.has_prefix(\"POLYGON\") { \"Polygon\" } else { null },\n          \"coordinates\": r.wkt.re_replace_all(\"^[A-Z]+ *\", \"\").re_replace_all(\"(-?[0-9.]+) (-?[0-9.]+)\", \"[$1,$2]\").replace_all(\"(\", \"[\").replace_all(\")\", \"]\").parse_json().catch(null)\n        })).filter(r -> r.type != null && r.coordinates != null).map_each(r -> r.assign({\n          \"points\": if r.type == \"MultiPolygon\" { r.coordinates.flatten().flatten() } else { r.coordinates.flatten() }\n        }))\n        let inside = $shaped.filter(r -> r.points.all(p -> p.index(0) >= $bbox.index(0) && p.index(0) <= $bbox.index(2) && p.index(1) >= $bbox.index(1) && p.index(1) <= $bbox.index(3)))\n        # One area per code: the first row of a code stands, a later one is a duplicate.\n        let first = $inside.enumerated().fold({}, item -> if item.tally.exists(item.value.value.code) { item.tally } else { item.tally.assign({ item.value.value.code: item.value.index }) })\n        let unique = $inside.enumerated().filter(e -> $first.get(e.value.code) == e.index).map_each(e -> e.value)\n        root.dropped = {\n          \"noCodeOrName\": $rows.length() - $coded.length(),\n          \"noPolygon\": $coded.length() - $shaped.length(),\n          \"outsideTheCity\": $shaped.length() - $inside.length(),\n          \"duplicateCode\": $inside.length() - $unique.length()\n        }\n        root.entities = if $unique.length() == 0 { throw(\"the neighbourhoods file holds no neighbourhood\") } else { $unique.map_each(r -> {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:neighbourhood-%v\".format(\"AdministrativeArea\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), r.code),\n          \"type\": \"AdministrativeArea\",\n          \"name\": { \"type\": \"Property\", \"value\": r.name },\n          \"districtCode\": { \"type\": \"Property\", \"value\": r.code },\n          \"divisionLevel\": { \"type\": \"Property\", \"value\": \"neighbourhood\" },\n          \"refParentDistrict\": { \"type\": \"Relationship\", \"object\": \"urn:ngsi-ld:%v:%v:%v:district-%v\".format(\"AdministrativeArea\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), r.district) },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": r.type, \"coordinates\": r.coordinates } },\n          \"dataProvider\": { \"type\": \"Property\", \"value\": \"Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)\" },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/20170706-districtes-barris\" }\n        }) }\n    - log:\n        level: INFO\n        message: 'neighbourhoods: ${! json(\"entities\").length() } written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.entities\n"
    projects__barcelona__pipelines__ornamental-fountains__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: ornamental-fountains
        namespace: barcelona
        title:
          ca: Fonts ornamentals de Barcelona, cada setmana
          es: Fuentes ornamentales de Barcelona, cada semana
          en: Barcelona ornamental fountains, weekly
      spec:
        class: auto
        # The city publishes a new file each March; a weekly run renews each fountain's three-week
        # expiresAt and picks up the new file within a week of its upload.
        schedule: '40 5 * * 3'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-ornamental-fountains }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert: a fountain the file drops leaves by its expiresAt, three weeks after its last listing.
        output: { type: PointOfInterest, mode: upsert }
        # A file under 300 kB, read whole.
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__parking-sections__bento.yaml: "# The mapping of the parking-sections pipeline (PL-03, T-5262): one OnStreetParking per regulated\n# surface parking section of B:SM and kind of zone, from Open Data BCN trams-aparcament-superficie.\n#\n# The file has one row per curb piece: a section (ID_TRAM) of one kind (TIPUS_TRAM) spans up to 28\n# pieces, each with its start and end, and repeats the section's address, places (PLACES) and rate\n# and timetable codes on every piece (10,596 sections of 17,275 rows on 2026-10-22, the codes and\n# places the same on every piece of a section). The section becomes one entity, its pieces one\n# MultiLineString (a LineString when it has one).\n#\n# Kinds: AZL blue zone, VM green zone (mixed), VR green zone for residents, DUM loading and\n# unloading, BUS coaches; each named in the Smart Data Models category enum, the code kept as\n# zoneCode. The rate and timetable codes (tarifes- and horaris-aparcament-superficie) are kept\n# as tariffCode, rate/timetable.\n#\n# Plausibility (owner 2026-10-22): a row with an unknown kind, a non-numeric id or position, places\n# outside 0..1000 or not whole, an end outside Barcelona (lon 2.04..2.24, lat 41.30..41.48, the\n# space's area; a swapped or 0,0 position falls outside it) is left out, and a piece listed twice\n# in its section is kept once; each counted by its reason in the run's log line. A file that is\n# not the parking CSV, or names no section, fails the run and writes nothing.\n\npipeline:\n  processors:\n    - try:\n        - mapping: |\n            root = if content().length() > 16777216 { throw(\"the parking file is %d bytes, more than the 16 MB read\".format(content().length())) } else { content().string() }\n        - mapping: |\n            let rows = content().string().trim_prefix(\"\uFEFF\").parse_csv().catch([])\n            let need = [\"ID_TRAM\", \"TIPUS_TRAM\", \"ADREÇA\", \"PLACES\", \"ID_TARIFA\", \"ID_HORARIO\", \"LATITUD_I\", \"LONGITUD_I\", \"LATITUD_F\", \"LONGITUD_F\"]\n            let header = $rows.index(0).catch({}).keys()\n            root = if $rows.length() == 0 || !$need.all(k -> $header.contains(k)) { throw(\"the parking file does not have the columns %v\".format($need.join(\", \"))) } else { $rows }\n        - mapping: |\n            let kinds = [\"AZL\", \"VM\", \"VR\", \"DUM\", \"BUS\"]\n            let rows = this.map_each(r -> {\n              \"k\": r.ID_TRAM.or(\"\").trim() + \"-\" + r.TIPUS_TRAM.or(\"\").trim(),\n              \"id\": r.ID_TRAM.or(\"\").trim(),\n              \"z\": r.TIPUS_TRAM.or(\"\").trim(),\n              \"a\": r.get(\"ADREÇA\").or(\"\").trim(),\n              \"n\": r.PLACES.or(\"\").trim().number().catch(null),\n              \"t\": r.ID_TARIFA.or(\"\").trim() + \"/\" + r.ID_HORARIO.or(\"\").trim(),\n              \"p\": [[r.LONGITUD_I.or(\"\").trim().number().catch(null), r.LATITUD_I.or(\"\").trim().number().catch(null)],\n                    [r.LONGITUD_F.or(\"\").trim().number().catch(null), r.LATITUD_F.or(\"\").trim().number().catch(null)]]\n            })\n            let shaped = $rows.filter(r -> r.id.re_match(\"^[0-9]{1,9}$\") && $kinds.contains(r.z) && r.p.flatten().all(v -> v != null))\n            let counted = $shaped.filter(r -> r.n != null && r.n >= 0 && r.n <= 1000 && r.n == r.n.floor())\n            let inside = $counted.filter(r -> r.p.all(q -> q.index(0) >= 2.04 && q.index(0) <= 2.24 && q.index(1) >= 41.30 && q.index(1) <= 41.48))\n            let sorted = $inside.sort_by(r -> r.k)\n            let groups = $sorted.enumerated().map_each(e -> if e.index > 0 && $sorted.index(e.index - 1).k != e.value.k { [\"|\", e.value] } else { [e.value] }).flatten().split_by(x -> x == \"|\")\n            let category = {\n              \"AZL\": [\"blueZone\", \"feeCharged\"],\n              \"VM\": [\"greenZone\", \"feeCharged\"],\n              \"VR\": [\"greenZone\", \"forResidents\", \"onlyWithPermit\"],\n              \"DUM\": [\"forLoadUnload\", \"onlyWithPermit\"],\n              \"BUS\": [\"feeCharged\"]\n            }\n            let vehicle = { \"AZL\": [\"car\"], \"VM\": [\"car\"], \"VR\": [\"car\"], \"DUM\": [\"van\", \"lorry\"], \"BUS\": [\"bus\"] }\n            let entities = $groups.filter(g -> g.length() > 0).map_each(g -> g.index(0).(f -> g.map_each(r -> r.p).unique(p -> p.format_json()).(lines -> {\n              \"id\": \"urn:ngsi-ld:%v:%v:%v:bsm-%v-%v\".format(\"OnStreetParking\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), f.id, f.z.lowercase()),\n              \"type\": \"OnStreetParking\",\n              \"name\": if f.a == \"\" { null } else { { \"type\": \"Property\", \"value\": f.a } },\n              \"location\": { \"type\": \"GeoProperty\", \"value\": if lines.length() == 1 { { \"type\": \"LineString\", \"coordinates\": lines.index(0) } } else { { \"type\": \"MultiLineString\", \"coordinates\": lines } } },\n              \"category\": { \"type\": \"Property\", \"value\": $category.get(f.z) },\n              \"allowedVehicleType\": { \"type\": \"Property\", \"value\": $vehicle.get(f.z) },\n              \"totalSpotNumber\": { \"type\": \"Property\", \"value\": f.n.int64() },\n              \"zoneCode\": { \"type\": \"Property\", \"value\": f.z },\n              \"tariffCode\": { \"type\": \"Property\", \"value\": f.t },\n              \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/ca/dataset/trams-aparcament-superficie\" }\n            }.filter(kv -> kv.value != null))))\n            let pieces = $entities.map_each(e -> if e.location.value.type == \"LineString\" { 1 } else { e.location.value.coordinates.length() }).sum()\n            root = if $entities.length() == 0 { throw(\"the parking file names no section\") } else { {\n              \"entities\": $entities,\n              \"dropped\": {\n                \"malformedRow\": $rows.length() - $shaped.length(),\n                \"placesOutOfRange\": $shaped.length() - $counted.length(),\n                \"pieceOutOfArea\": $counted.length() - $inside.length(),\n                \"duplicatePiece\": $inside.length() - $pieces\n              }\n            } }\n        - log:\n            level: INFO\n            message: 'parking-sections: ${! json(\"entities\").length() } sections written, left out by reason ${! json(\"dropped\").format_json(no_indent: true) }'\n        - mapping: root = this.entities\n        - unarchive: { format: json_array }\n"
    projects__barcelona__pipelines__parking-sections__pipeline.yaml: |
      # The regulated surface parking sections into the space barcelona once a day (T-5262): one
      # OnStreetParking per section and kind of zone. The file changes monthly; a daily read keeps the
      # space within a day of it.
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: parking-sections
        namespace: barcelona
        title:
          ca: Trams d'aparcament en superfície, cada dia
          es: Tramos de aparcamiento en superficie, cada día
          en: Surface parking sections, daily
      spec:
        class: auto
        schedule: '20 4 * * *'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-parking-sections }
        targetEndpoint: urn:ngsi-ld:Endpoint:{orgDomain}:barcelona:barcelona
        output: { type: OnStreetParking, mode: upsert }
        quotas: { maxMemoryMb: 320, cpuMillicores: 200 }
    projects__barcelona__pipelines__pedestrian-crossings__bento.yaml: "# The mapping of the pedestrian-crossings pipeline (PL-03, T-5264): one PedestrianCrossing per\n# crossing of Open Data BCN's street inventory (dataset infraestructures-inventari-pas-vianants,\n# Infraestructures_Inventari_Pas_Vianants.csv, rewritten weekly): ID_Pas, the marking's kind\n# (Codi_Pas, three kinds the typology dataset names), its painted area in m² (M2_Pas), its barri\n# (Codi_Barri, empty for a crossing on the city's edge), WGS84 Longitud/Latitud and the dates it\n# entered (Data_Alta) and left (Data_Baixa) the inventory. The file keeps every crossing ever\n# painted: a row with a Data_Baixa is gone from the street and is not written (28,210 of 39,237 on\n# 2026-10-23). Data_Alta is left out: half the rows carry the inventory's start, 2000/01/01, not\n# the day the crossing was painted. `expiresAt`: a crossing the file drops or marks as gone leaves\n# every read three weeks (three update periods) after the file last listed it.\n#\n# Plausibility (owner 2026-10-22): a row with no numeric id or an unknown kind, a point that is no\n# number or lies outside the municipality's 1 km margin (the space's in-area bbox), a second row of\n# one id, and a second crossing of one kind within the same ~1 m cell (5 decimals of a degree: the\n# file lists 50 crossings twice on 2026-10-23, an old record beside its repainting, of which the\n# newer Data_Alta stands) are dropped; an area of 0 or below or above 500 m² is left out of the\n# entity. Each is counted by reason in `dropped`, which the next step logs. A file with no current\n# crossing at all fails the run, so the crossings stand instead of going quiet.\n\npipeline:\n  processors:\n    - mapping: |\n        let text = if content().length() > 8388608 { throw(\"the crossings file is %d bytes, more than the 8 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        let bbox = [2.04, 41.3, 2.24, 41.48]\n        let kinds = {\n          \"255000000_Pastilla\": \"stripes\", \"255128000_Taco\": \"blocks\", \"000000255_Ciclista\": \"cycle\"\n        }\n        # Only the current rows are parsed (a third of the file): Data_Baixa is the last column, so\n        # a current row ends with its comma (or ,\"\" when quoted). Parsing all 39k rows needed 256 MiB.\n        let lines = $text.replace_all(\"\\r\", \"\").split(\"\\n\").filter(l -> l.trim() != \"\")\n        let current = if $lines.length() == 0 || !$lines.index(0).re_match(\"Data_Baixa\\\"?$\") { throw(\"the crossings file has no Data_Baixa column last\") } else { ([$lines.index(0)].concat($lines.slice(1).filter(l -> l.re_match(\",(\\\"\\\")?$\")))).join(\"\\n\").parse_csv(true, \",\") }\n        let coded = $current.filter(r -> r.ID_Pas.or(\"\").trim().re_match(\"^[0-9]{1,12}$\") && $kinds.exists(r.Codi_Pas.or(\"\").trim()))\n        let placed = $coded.map_each(r -> {\n          \"id\": r.ID_Pas.trim(),\n          \"code\": r.Codi_Pas.trim(),\n          \"lon\": r.Longitud.or(\"\").trim().number().catch(null),\n          \"lat\": r.Latitud.or(\"\").trim().number().catch(null),\n          \"area\": r.M2_Pas.or(\"\").trim().number().catch(null),\n          \"barri\": r.Codi_Barri.or(\"\").trim().number().catch(0),\n          \"since\": r.Data_Alta.or(\"\").trim()\n        }).filter(c -> c.lon != null && c.lat != null)\n        let inside = $placed.filter(c -> c.lon >= $bbox.index(0) && c.lon <= $bbox.index(2) && c.lat >= $bbox.index(1) && c.lat <= $bbox.index(3))\n        # One crossing per id, then per kind and ~1 m cell: sorted, so a repeat sits beside its first.\n        let by_id = $inside.sort_by(c -> c.id)\n        let ids = $by_id.enumerated().filter(e -> e.index == 0 || $by_id.index(e.index - 1).id != e.value.id).map_each(e -> e.value)\n        let by_cell = $ids.map_each(c -> c.assign({ \"cell\": \"%v %.5f %.5f\".format(c.code, c.lon, c.lat) })).sort_by(c -> c.cell + \" \" + c.since)\n        let unique = $by_cell.enumerated().filter(e -> e.index == $by_cell.length() - 1 || $by_cell.index(e.index + 1).cell != e.value.cell).map_each(e -> e.value)\n        root.dropped = {\n          \"removed\": $lines.length() - 1 - $current.length(),\n          \"noIdOrKind\": $current.length() - $coded.length(),\n          \"noPoint\": $coded.length() - $placed.length(),\n          \"outsideTheCity\": $placed.length() - $inside.length(),\n          \"duplicateId\": $inside.length() - $ids.length(),\n          \"sameKindWithin1m\": $ids.length() - $unique.length(),\n          \"areaOutOfRange\": $unique.filter(c -> c.area == null || c.area <= 0 || c.area > 500).length()\n        }\n        # The crossings leave as small rows, one message each, and each becomes its entity on its\n        # own: building all 11k entities in one message needed 192 MiB, the whole run now 160.\n        root.crossings = if $unique.length() == 0 { throw(\"the crossings file holds no current crossing\") } else { $unique.map_each(c -> c.without(\"cell\", \"since\")) }\n    - log:\n        level: INFO\n        message: 'pedestrian crossings: ${! json(\"crossings\").length() } written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.crossings\n    - unarchive: { format: json_array }\n    - mapping: |\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix()\n        let kinds = {\n          \"255000000_Pastilla\": { \"kind\": \"stripes\", \"label\": \"Pas de pastilles\" },\n          \"255128000_Taco\": { \"kind\": \"blocks\", \"label\": \"Pas de tacs\" },\n          \"000000255_Ciclista\": { \"kind\": \"cycle\", \"label\": \"Pas de bicicletes\" }\n        }\n        # The run's clock (a test sets bcn_now to read a recorded file as of its own day) and the\n        # kinds the typology dataset infraestructures-tipologia-pas-vianants names.\n        root = {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:%v\".format(\"PedestrianCrossing\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), this.id),\n          \"type\": \"PedestrianCrossing\",\n          \"expiresAt\": ($now + 21 * 86400).ts_format(\"2006-01-02T15:04:05Z\", \"UTC\"),\n          \"crossingType\": { \"type\": \"Property\", \"value\": $kinds.get(this.code).kind },\n          \"crossingTypeLabel\": { \"type\": \"Property\", \"value\": $kinds.get(this.code).label },\n          \"markedArea\": if this.area == null || this.area <= 0 || this.area > 500 { null } else { { \"type\": \"Property\", \"value\": this.area, \"unitCode\": \"MTK\" } },\n          \"refNeighbourhood\": if this.barri < 1 || this.barri > 73 { null } else {\n            { \"type\": \"Relationship\", \"object\": \"urn:ngsi-ld:%v:%v:%v:neighbourhood-%02d\".format(\"AdministrativeArea\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), this.barri.int64()) }\n          },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": \"Point\", \"coordinates\": [this.lon, this.lat] } },\n          \"dataProvider\": { \"type\": \"Property\", \"value\": \"Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)\" },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/infraestructures-inventari-pas-vianants\" }\n        }.filter(entry -> entry.value != null)\n"
    projects__barcelona__pipelines__speed-reducers__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: speed-reducers
        namespace: barcelona
        title:
          ca: Reductors de velocitat de Barcelona, cada setmana
          es: Reductores de velocidad de Barcelona, cada semana
          en: Barcelona speed reducers, weekly
      spec:
        class: auto
        # The city rewrites the file weekly (last-modified Tuesday 00:43 UTC on 2026-10-20).
        schedule: '50 5 * * 2'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-speed-reducers }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert: a reducer the file drops or marks as gone leaves by its expiresAt, three weeks after
        # its last listing.
        output: { type: StreetFurniture, mode: upsert }
        # A 0.65 MB file of 1,774 rows, read whole (the 5.1 MB crossings file needs 160 MiB).
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__statistics__bento.yaml: |
      # The mapping of the statistics pipeline (T-5266): one Smart Data Model KeyPerformanceIndicator per
      # (indicator, area) of the city's statistics on Open Data BCN (Departament d'Estadística i Difusió
      # de Dades): the Padró (population, households), the cadastre, the notaries' sales and the vehicle
      # register, each for the 73 barris, the 10 districts and the whole city, the newest period of each.
      # One pipeline for every table: each is one CKAN DataStore resource of the same host, and each
      # names only its period, area, value and breakdown columns below.
      #
      # The DataSource's answer is the Padró's own code list (pad-dimensions): it labels the coded
      # breakdowns (SEXE 1 Dona, 2 Home; EDAT_Q; NACIONALITAT_G...) and lists the 73 barri codes, the
      # register an indicator's refArea must name, because the space refuses a whole entity whose
      # relationship names an entity it does not hold. Each table then costs two calls to
      # opendata-ajuntament.barcelona.cat only, one every two seconds (rate limit bcn_stat; a burst of
      # downloads answered 403 for an hour on 2026-10-23): package_show finds the newest yearly CSV
      # resource the DataStore holds, and one datastore_search_sql sums its rows (census sections) to
      # barri, district and city in the source's database (GROUPING SETS), 60 s (the API answers in 8 to
      # 20 s) and 8 MiB each.
      #
      # Ids: urn:ngsi-ld:KeyPerformanceIndicator:{domain}:{space}:stat-{theme}-{table}-{breakdown
      # codes}-{city | district-NN | neighbourhood-NN}; the theme segment is what each theme's Endpoint
      # Policy selects by idPattern. kpiValue carries the period's day as observedAt (a stock its
      # reference day, a flow its period's last day), so the space records one history row per period.
      #
      # Plausibility (owner 2026-10-22): a value is dropped and counted by reason when the source hides
      # it (".." for fewer than 5) or a sum would include a hidden cell, when it is negative, when its
      # district or barri code is no area of the city, when a coded breakdown names a code pad-dimensions
      # lacks, when its period starts in the future, or when a second value has the same id. A table
      # whose newest period is older than its maxAgeDays, that answers nothing, or that answers no usable
      # value fails its message (the run is failed, nothing is deleted); the counts go to the runner
      # log, one line per table.

      pipeline:
        processors:
          - try:
              - mapping: |
                  let records = this.result.records.or([])
                  let register = $records.filter(r -> r.Desc_Dimensio.or("") == "CODI_BARRI_DEST").map_each(r -> r.Codi_Valor.string().trim()).filter(c -> c.re_match("^[0-9]{1,2}$")).map_each(c -> "%02d".format(c.number().int64())).sort()
                  let labels = $records.filter(r -> r.Desc_Dimensio.or("") != "" && r.Desc_Dimensio != "CODI_BARRI_DEST").fold({}, item -> item.tally.merge({ item.value.Desc_Dimensio: { item.value.Codi_Valor.string().trim(): item.value.Desc_Valor_CA.string().re_replace_all(" ", " ").trim() } }))
                  # period: the period columns ([Data_Referencia] a reference day, [Any] a year, [Any, Mes]
                  # a month); observe: start (a stock on 1 January, the Padró and the cadastre) or end (a
                  # flow over the period); coded: the breakdown columns pad-dimensions labels; unitDim:
                  # the column whose value names the unit (€ euros, m2 square metres, else a count).
                  let padro = {"theme": "population", "every": "yearly", "district": "Codi_Districte", "districtName": "Nom_Districte", "barri": "Codi_Barri", "barriName": "Nom_Barri", "value": "Valor", "coded": true}
                  let census = $padro.assign({"period": ["Data_Referencia"], "observe": "start"})
                  let flows = $padro.assign({"period": ["Any"], "observe": "end", "dims": []})
                  let cadastre = {"theme": "housing", "every": "yearly", "period": ["Any"], "observe": "start", "district": "Codi_districte", "districtName": "Nom_districte", "barri": "Codi_barri", "barriName": "Nom_barri", "value": "Nombre"}
                  let vehicles = {"theme": "vehicles", "every": "yearly", "period": ["Any"], "observe": "end", "district": "Codi_Districte", "districtName": "Nom_Districte", "barri": "Codi_Barri", "barriName": "Nom_Barri", "value": "Nombre"}
                  let notaries = {"theme": "housing", "every": "monthly", "period": ["Any", "Mes"], "observe": "end", "district": "Codi_Districte", "districtName": "Nom_Districte", "barri": "Codi_Barri", "barriName": "Nom_Barri", "dims": ["Tipologia_Us_Desc"], "maxAgeDays": 366}
                  let tables = [
                    $census.assign({"id": "pad_mdbas", "dims": []}),
                    $census.assign({"id": "pad_mdbas_sexe", "dims": ["SEXE"]}),
                    $census.assign({"id": "pad_mdbas_edat-q", "dims": ["EDAT_Q"]}),
                    $census.assign({"id": "pad_mdbas_nacionalitat-g_sexe", "dims": ["NACIONALITAT_G", "SEXE"]}),
                    $census.assign({"id": "pad_mdbas_niv-educa-esta_sexe", "dims": ["NIV_EDUCA_esta", "SEXE"]}),
                    $census.assign({"id": "pad_mdbas_lloc-naix_sexe", "dims": ["LLOC_NAIX", "SEXE"]}),
                    $flows.assign({"id": "pad_nai_mdbas"}),
                    $flows.assign({"id": "pad_def_mdbas"}),
                    $flows.assign({"id": "pad_imm_mdbas"}),
                    $flows.assign({"id": "pad_emi_mdbas"}),
                    $flows.assign({"id": "pad_alt_mdbas"}),
                    $flows.assign({"id": "pad_bai_mdbas"}),
                    $census.assign({"id": "pad_dom_mdbas_n-persones", "theme": "housing", "dims": ["N_PERSONES_AGG"]}),
                    $census.assign({"id": "pad_dom_mdbas_tipus-domicili", "theme": "housing", "dims": ["TIPUS_DOMICILI"]}),
                    $cadastre.assign({"id": "est-cadastre-habitatges-superficie", "dims": ["Desc_sup"]}),
                    $cadastre.assign({"id": "est-cadastre-habitatges-any-const", "dims": ["Any_construccio"]}),
                    $cadastre.assign({"id": "est-cadastre-finques-regim-propietat", "dims": ["Regim_propietat"]}),
                    $notaries.assign({"id": "notaris_compravendes_trans_tip_us", "value": "Nombre"}),
                    $notaries.assign({"id": "notaris_compravendes_trans_tip_us_sup", "value": "Superficie_m2", "unit": "MTK"}),
                    $vehicles.assign({"id": "est-vehicles-tipologia-parc-vehicles", "value": "Nombre_vehicles", "dims": ["Tipologia_parc"]}),
                    $vehicles.assign({"id": "est_vehicles_propulsio", "dims": ["Tipus_Propulsio"]}),
                    $vehicles.assign({"id": "est_vehicles_servei", "value": "Total", "dims": ["Tipus_Servei"]}),
                    $vehicles.assign({"id": "est_vehicles_evolucio_total", "value": "Total", "dims": []}),
                    $vehicles.assign({"id": "est-vehicles-tipus-propietari", "district": "Codi_districte", "districtName": "Nom_districte", "barri": "Codi_barri", "barriName": "Nom_barri", "dims": ["Tipus_Vehicles", "Desc_tipus_propietari"]}),
                    $census.assign({"id": "pad_mdbas_nacionalitat-continent_sexe", "dims": ["NACIONALITAT_CONTINENT", "SEXE"]}),
                    $flows.assign({"id": "pad_imm_mdbas_nacionalitat-g", "dims": ["NACIONALITAT_G"]}),
                    $flows.assign({"id": "pad_emi_mdbas_nacionalitat-g", "dims": ["NACIONALITAT_G"]}),
                    $census.assign({"id": "pad_dom_mdbas_dones", "theme": "housing", "dims": ["DOM_DONES"]}),
                    $census.assign({"id": "pad_dom_mdbas_homes", "theme": "housing", "dims": ["DOM_HOMES"]}),
                    $census.assign({"id": "pad_dom_mdbas_edat-0018", "theme": "housing", "dims": ["DOM_00_18"]}),
                    $census.assign({"id": "pad_dom_mdbas_edat-1864", "theme": "housing", "dims": ["DOM_18_64"]}),
                    $census.assign({"id": "pad_dom_mdbas_edat-6599", "theme": "housing", "dims": ["DOM_65_99"]}),
                    $census.assign({"id": "pad_dom_mdbas_nacionalitat", "theme": "housing", "dims": ["NACIONALITAT_DOMICILI"]}),
                    $cadastre.assign({"id": "est-cadastre-carrecs-tipus-propietari", "value": "Valor", "dims": ["Desc_tipus_propietari", "Concepte"], "unitDim": "Concepte"}),
                    $cadastre.assign({"id": "est-cadastre-edificacions-any-const", "dims": ["Any_construccio"]}),
                    $cadastre.assign({"id": "est-cadastre-edificacions-nombre-locals", "dims": ["Desc_locals"]}),
                    $cadastre.assign({"id": "est-cadastre-edificacions-superficie", "value": "Superficie_m2", "unit": "MTK", "dims": ["Tipus_sup"]}),
                    $cadastre.assign({"id": "est-cadastre-finques-superficie", "value": "Superficie_m2", "unit": "MTK", "dims": ["Desc_sup"]}),
                    $cadastre.assign({"id": "est-cadastre-locals-sup", "value": "Superficie_m2", "unit": "MTK", "dims": ["Us_del_local"]}),
                    # The unit values (€/m2) of these two are means a sum would falsify: the totals only.
                    $cadastre.assign({"id": "est-cadastre-habitatges-valor-cadastral", "value": "Valors", "unit": "EUR", "dims": ["Desc_valors"], "only": {"Desc_valors": ["Valor_cadastral_total_€", "Valor_construcció_més_serveis_total_€", "Valor_sòl_total_€"]}}),
                    $cadastre.assign({"id": "est-cadastre-locals-valors-total-unitaris", "value": "Valors", "unit": "EUR", "dims": ["Desc_valors"], "only": {"Desc_valors": ["Valor_cadastral_total_€", "Valor_construcció_més_serveis_total_€", "Valor_sòl_total_€"]}}),
                    $vehicles.assign({"id": "est-vehicles-cilindrada-motos", "value": "Nombre_Motos", "dims": ["Cilindrada_Motos"]}),
                    $vehicles.assign({"id": "est-vehicles-nacionalitat-propietari", "district": "Codi_districte", "districtName": "Nom_districte", "barri": "Codi_barri", "barriName": "Nom_barri", "dims": ["Tipus_Vehicles", "Nacionalitat_propietari"]}),
                    $vehicles.assign({"id": "est-vehicles-potencia-fiscal-turismes", "value": "Nombre_Turismes", "dims": ["Potencia_Fiscal"]})
                  ]
                  root = if $register.length() == 0 { throw("pad-dimensions listed no barri code (CODI_BARRI_DEST)") } else { $tables.map_each(t -> { "table": t, "register": $register, "labels": if t.coded.or(false) { t.dims.map_each(d -> { d: $labels.get(d).or({}) }).squash() } else { {} } }) }
              - unarchive: { format: json_array }
              - branch:
                  request_map: |
                    meta bcn_package = if this.table.id.re_match("^[a-z0-9_-]{3,80}$") { this.table.id } else { throw("not an Open Data BCN dataset name: %v".format(this.table.id)) }
                    root = ""
                  processors:
                    - http:
                        url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/package_show?id=${! @bcn_package }
                        verb: GET
                        headers:
                          Accept: application/json
                          User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)
                        timeout: 60s
                        retries: 1
                        rate_limit: bcn_stat
                    - mapping: |
                        root = if content().length() > 8388608 { throw("package_show answered %v bytes, more than 8388608".format(content().length())) } else { this }
                  result_map: |
                    # The newest yearly CSV resource the DataStore holds: the year its name starts with.
                    let held = this.result.resources.or([]).filter(r -> r.format.or("").uppercase() == "CSV" && r.datastore_active.or(false) == true && r.id.or("").re_match("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))
                    let dated = $held.map_each(r -> r.assign({ "year": r.name.or("").re_find_all("(^|[^0-9])20[0-9]{2}([^0-9]|$)").map_each(y -> y.re_replace_all("[^0-9]", "").number().int64()).sort().index(-1).catch(0) }))
                    let newest = $dated.sort_by(r -> r.year).index(-1).catch(null)
                    root.resource = if $newest == null { throw("%v has no CSV resource in the DataStore".format(this.table.id)) } else { { "id": $newest.id, "name": $newest.name } }
                    root.title = this.result.title_translated.ca.or(this.result.title).or(this.table.id)
              - branch:
                  request_map: |
                    # The query is built from the seed's own column names and a resource id of the
                    # DataStore's UUID shape only; a name outside that alphabet fails the table.
                    map col {
                      root = if this.re_match("^[A-Za-z][A-Za-z0-9_€]{0,40}$") { "\"%v\"".format(this) } else { throw("not a column name: %v".format(this)) }
                    }
                    let t = this.table
                    let p = $t.period.map_each(c -> c.apply("col"))
                    let d = $t.district.apply("col")
                    let b = $t.barri.apply("col")
                    let k = $t.dims.map_each(c -> c.apply("col"))
                    let v = $t.value.apply("col")
                    let num = "%v::text ~ '^-?[0-9]+([.][0-9]+)?$'".format($v)
                    let keys = $p.concat($k)
                    let sets = [$keys.concat([$d, $b]), $keys.concat([$d]), $keys].map_each(s -> "(%v)".format(s.join(", "))).join(", ")
                    let select = $p.enumerated().map_each(e -> "%v AS p%v".format(e.value, e.index)).concat($k.enumerated().map_each(e -> "%v AS k%v".format(e.value, e.index))).concat([
                      "%v AS d".format($d), "%v AS b".format($b),
                      "MAX(%v) AS dn".format($t.districtName.apply("col")), "MAX(%v) AS bn".format($t.barriName.apply("col")),
                      "GROUPING(%v) AS gd".format($d), "GROUPING(%v) AS gb".format($b),
                      "SUM(CASE WHEN %v THEN %v::numeric END) AS v".format($num, $v),
                      "COUNT(*) FILTER (WHERE (%v) IS NOT TRUE) AS s".format($num),
                      "COUNT(*) AS n"
                    ]).join(", ")
                    # A table may keep only listed values of a column; each value is the seed's own, without a quote.
                    let where = $t.only.or({}).key_values().map_each(kv -> "%v IN (%v)".format(kv.key.apply("col"), kv.value.map_each(x -> if x.re_match("^[^'\\\\]{1,80}$") { "'%v'".format(x) } else { throw("not a plain value: %v".format(x)) }).join(", ")))
                    let select = if $where.length() == 0 { $select } else { "%v FROM \"%v\" WHERE %v".format($select, this.resource.id, $where.join(" AND ")) }
                    root.sql = if this.resource.id.re_match("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$") { if $where.length() == 0 { "SELECT %v FROM \"%v\" GROUP BY GROUPING SETS (%v)".format($select, this.resource.id, $sets) } else { "SELECT %v GROUP BY GROUPING SETS (%v)".format($select, $sets) } } else { throw("not a DataStore resource id: %v".format(this.resource.id)) }
                  processors:
                    - http:
                        url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/datastore_search_sql
                        verb: POST
                        headers:
                          Content-Type: application/json
                          Accept: application/json
                          User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)
                        timeout: 60s
                        retries: 1
                        rate_limit: bcn_stat
                    - mapping: |
                        root = if content().length() > 8388608 { throw("datastore_search_sql answered %v bytes, more than 8388608".format(content().length())) } else { this }
                  result_map: root.answer = this.result.records.or([])
              - mapping: |
                  # A Concepte names its unit: Valor_cad_€ euros, Superfície_m2 square metres, Nombre a count.
                  map unit_of {
                    root = if this.contains("€") || this.contains("Valor") { "EUR" } else if this.contains("m2") { "MTK" } else { "C62" }
                  }
                  map two {
                    root = "%02d".format(this.string().trim().number().int64())
                  }
                  let t = this.table
                  let register = this.register
                  let labels = this.labels
                  let recs = this.answer.map_each(r -> r.assign({
                    "pk": if $t.period.length() == 2 { "%04d-%02d".format(r.p0.string().number().int64(), r.p1.string().number().int64()) } else { r.p0.string().slice(0, if r.p0.string().length() >= 10 { 10 } else { 4 }) }.catch("")
                  }))
                  let newest = $recs.map_each(r -> r.pk).filter(k -> k != "").sort().index(-1).catch("")
                  # The period's first and last day: a reference day (2026-01-01), a year (2025) or a month (2026-02).
                  let y = $newest.slice(0, 4).number().int64().catch(0)
                  let from = if $newest.length() == 10 { $newest } else if $newest.length() == 7 { "%v-01".format($newest) } else { "%04d-01-01".format($y) }
                  let next = if $newest.length() == 10 { $newest } else if $newest.length() == 7 { if $newest.slice(5).number().int64() == 12 { "%04d-01-01".format($y + 1) } else { "%04d-%02d-01".format($y, $newest.slice(5).number().int64() + 1) } } else { "%04d-01-01".format($y + 1) }
                  let to = if $newest.length() == 10 { $newest } else { ($next.ts_parse("2006-01-02").ts_unix() - 86400).ts_format("2006-01-02", "UTC") }
                  let observed = "%vT00:00:00Z".format(if $t.observe == "start" { $from } else { $to })
                  let age_days = ((now().ts_unix() - $to.ts_parse("2006-01-02").ts_unix().catch(0)) / 86400).floor()
                  let max_age = $t.maxAgeDays.or(if $t.every == "monthly" { 92 } else { 1096 })
                  let future = $from.ts_parse("2006-01-02").ts_unix().catch(0) > now().ts_unix() + 86400
                  let rows = $recs.filter(r -> r.pk == $newest).map_each(r -> r.assign({
                    "level": if r.gd.string() == "1" { "city" } else if r.gb.string() == "1" { "district" } else { "neighbourhood" },
                    "dc": r.d.apply("two").catch(""),
                    "bc": r.b.apply("two").catch(""),
                    "codes": $t.dims.enumerated().map_each(e -> r.get("k%v".format(e.index)).or("").string().trim())
                  })).map_each(r -> r.assign({
                    "parts": $t.dims.enumerated().map_each(e -> if $t.coded.or(false) { $labels.get(e.value).or({}).get(r.codes.index(e.index)) } else { r.codes.index(e.index) }),
                    "key": if $t.dims.length() == 0 { "total" } else { r.codes.map_each(c -> c.re_replace_all("[^A-Za-z0-9]+", "_").trim("_")).map_each(c -> if c == "" { "blank" } else { c }).join("-") },
                    "place": if r.level == "city" { "city" } else if r.level == "district" { "district-%v".format(r.dc) } else { "neighbourhood-%v".format(r.bc) },
                    "areaName": if r.level == "city" { "Barcelona" } else if r.level == "district" { r.dn.or("").string() } else { r.bn.or("").string() },
                    "number": r.v.string().number().catch(null)
                  })).map_each(r -> r.assign({
                    "unit": $t.unit.or(if $t.unitDim == null { "C62" } else { r.codes.index($t.dims.enumerated().filter(e -> e.value == $t.unitDim).index(0).index).apply("unit_of") }),
                    "id": "urn:ngsi-ld:%v:%v:%v:stat-%v-%v-%v-%v".format("KeyPerformanceIndicator", env("JC_ORG_DOMAIN"), env("JC_SPACE"), $t.theme, $t.id, r.key, r.place),
                    "reason": if r.level == "district" && !r.dc.re_match("^(0[1-9]|10)$") { "not a district of the city" } else if r.level == "neighbourhood" && !$register.contains(r.bc) { "not a barri of the register" } else if r.parts.any(p -> p == null) { "a code pad-dimensions does not list" } else if r.s.string().number().catch(1) > 0 && r.number == null { "hidden by the source (fewer than 5)" } else if r.s.string().number().catch(1) > 0 { "a sum over a hidden cell" } else if r.number == null { "no value" } else if r.number < 0 { "negative count or amount" } else { "" }
                  }))
                  let kept = $rows.filter(r -> r.reason == "")
                  let unique = $kept.unique(r -> r.id)
                  let reasons = $rows.filter(r -> r.reason != "").map_each(r -> r.reason)
                  let dropped = $reasons.unique().map_each(r -> { r: $reasons.filter(x -> x == r).length() }).squash()
                  let dropped = if $kept.length() > $unique.length() { $dropped.merge({ "duplicate id": $kept.length() - $unique.length() }) } else { $dropped }
                  let source = "https://opendata-ajuntament.barcelona.cat/data/dataset/%v".format($t.id)
                  let title = this.title
                  let resource = this.resource.name
                  root = if $recs.length() == 0 { throw("%v answered no row".format($t.id)) } else if $y == 0 { throw("%v answered no period: %v".format($t.id, $newest)) } else if $future { throw("%v holds a period that starts in the future: %v".format($t.id, $newest)) } else if $age_days > $max_age { throw("%v is stale: its newest period %v ended %v days ago, more than %v".format($t.id, $newest, $age_days, $max_age)) } else if $unique.length() == 0 { throw("%v answered no usable value: %v".format($t.id, $dropped.format_json(no_indent: true))) } else { {
                    "table": $t.id,
                    "resource": $resource,
                    "period": $newest,
                    "dropped": $dropped,
                    "entities": $unique.map_each(r -> {
                      "id": r.id,
                      "type": "KeyPerformanceIndicator",
                      "name": { "type": "Property", "value": if r.parts.length() == 0 { "%v – %v".format($title, r.areaName) } else { "%v: %v – %v".format($title, r.parts.join(", "), r.areaName) } },
                      "description": { "type": "Property", "value": $title },
                      "kpiValue": { "type": "Property", "value": r.number, "unitCode": r.unit, "observedAt": $observed },
                      "calculationPeriod": { "type": "Property", "value": { "from": $from, "to": $to } },
                      "calculationFrequency": { "type": "Property", "value": $t.every },
                      "calculatedBy": { "type": "Property", "value": "Ajuntament de Barcelona, Departament d'Estadística i Difusió de Dades" },
                      "organization": { "type": "Property", "value": "Ajuntament de Barcelona" },
                      "process": { "type": "Property", "value": $title },
                      "area": { "type": "Property", "value": r.areaName },
                      "districtCode": if r.level == "city" { null } else if r.level == "district" { { "type": "Property", "value": r.dc } } else { { "type": "Property", "value": r.bc } },
                      "divisionLevel": { "type": "Property", "value": r.level },
                      "refArea": if r.level == "city" { null } else { { "type": "Relationship", "object": "urn:ngsi-ld:%v:%v:%v:%v".format("AdministrativeArea", env("JC_ORG_DOMAIN"), env("JC_SPACE"), r.place) } },
                      "statisticsTable": { "type": "Property", "value": $t.id },
                      "dimensionKey": { "type": "Property", "value": if $t.dims.length() == 0 { "total" } else { $t.dims.enumerated().map_each(e -> "%v=%v".format(e.value, r.codes.index(e.index))).join(";") } },
                      "dataProvider": { "type": "Property", "value": "Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)" },
                      "source": { "type": "Property", "value": $source }
                    }.filter(kv -> kv.value != null))
                  } }
              - log:
                  level: INFO
                  message: 'statistics ${! this.table } ${! this.period } (${! this.resource }): ${! this.entities.length() } written, dropped ${! this.dropped.format_json(no_indent: true) }'
              - mapping: root = this.entities
    projects__barcelona__pipelines__statistics__pipeline.yaml: |
      # One KeyPerformanceIndicator per (indicator, area) of the city's statistics on Open Data BCN: the
      # Padró, the cadastre, the notaries' sales and the vehicle register, for each barri, district and
      # the whole city (T-5266). Which tables, and why, is in the mapping and in the task's matrix.
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: statistics
        namespace: barcelona
        title:
          ca: Estadístiques de Barcelona per barris
          es: Estadísticas de Barcelona por barrios
          en: Barcelona statistics by neighbourhood
      spec:
        class: auto
        # Yearly and monthly tables, each published on its own day: a daily read finds a new period
        # within a day and writes no history row when nothing changed (record: onChange).
        schedule: '40 5 * * *'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-statistics-dimensions }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        output: { type: KeyPerformanceIndicator, mode: upsert }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__traffic-counters__pipeline.yaml: |
      # The mean working-day intensity of each traffic and bicycle counter into the traffic dataset of
      # the space barcelona (T-5374): one TrafficFlowObserved per counter, the newest month published.
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: traffic-counters
        namespace: barcelona
        title:
          ca: Aforaments de trànsit i de bicicletes, cada setmana
          es: Aforos de tráfico y de bicicletas, cada semana
          en: Traffic and bicycle counters, weekly
      spec:
        class: auto
        # The city publishes a year's readings once, months after the year ends: a weekly read is enough
        # and keeps each counter inside the 30 days the space keeps a TrafficFlowObserved it no longer
        # writes.
        schedule: '20 6 * * 3'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-traffic-counters }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        output: { type: TrafficFlowObserved, mode: upsert }
        quotas: { maxMemoryMb: 64, cpuMillicores: 50 }
    projects__barcelona__pipelines__traffic-routes__bento.yaml: "# The mapping of the traffic-routes pipeline (PL-03, T-5262): one TrafficFlowObserved per traffic\n# route of Open Data BCN `itineraris` (78 routes on 2026-10-23), its travel time now and the time\n# the city expects from its history of the same kind of day, with the lines of the route's\n# sections (`transit-relacio-trams-per-itinerari`, `transit-relacio-trams`) and its name.\n#\n# The DataSource's answer is the route file, one line per route: id#available#yyyymmddhhmmss#now#\n# usual#future#factor#trend, the time local to Barcelona, the times in seconds. A route the city\n# reports no reading for (available 0, or a time of 0) keeps its last travel time, whose observedAt\n# tells when it was read. The future, factor and trend codes (-1..2) carry no published meaning\n# and are not kept.\n#\n# Plausibility (owner 2026-10-22): a line that is not eight numeric fields, a reading outside\n# 1..7200 s (two hours across the city) or a usual time outside 0..7200 s, a time more than a day\n# ahead, a route named twice, a route with no section in the route list or no section line inside\n# Barcelona (lon 2.04..2.24, lat 41.30..41.48) is left out, each counted by its reason in the run's\n# log line. A file with no route, a file older than three periods (15 min) or a list that does not\n# answer fails the run, which writes nothing and leaves the entities as they were.\n\npipeline:\n  processors:\n    - try:\n        - mapping: |\n            root = if content().length() > 262144 { throw(\"the route file is %d bytes, more than the 256 kB read\".format(content().length())) } else { content().string() }\n        - mapping: |\n            let lines = content().string().split(\"\\n\").map_each(l -> l.trim()).filter(l -> l != \"\")\n            let rows = $lines.map_each(l -> l.split(\"#\"))\n            let shaped = $rows.filter(r -> r.length() == 8 && r.index(0).re_match(\"^[0-9]{1,4}$\") && r.index(1).re_match(\"^[01]$\") && r.index(2).re_match(\"^[0-9]{14}$\") && r.slice(3).all(v -> v.re_match(\"^-?[0-9]{1,6}$\")))\n            let read = $shaped.map_each(r -> r.append(r.index(1) == \"1\" && r.index(3).number() > 0))\n            let ranged = $read.filter(r -> !r.index(8) || (r.index(3).number() <= 7200 && r.index(4).number() >= 0 && r.index(4).number() <= 7200))\n            let timed = $ranged.map_each(r -> r.append((r.index(2).slice(0, 4) + \"-\" + r.index(2).slice(4, 6) + \"-\" + r.index(2).slice(6, 8) + \"T\" + r.index(2).slice(8, 10) + \":\" + r.index(2).slice(10, 12) + \":\" + r.index(2).slice(12, 14)).(local -> (local + (local + \"Z\").ts_format(\"-07:00\", \"Europe/Madrid\")).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix())))\n            let present = $timed.filter(r -> r.index(9) <= now().ts_unix() + 86400)\n            let first = $present.fold({}, t -> if t.tally.exists(t.value.index(0)) { t.tally } else { t.tally.merge({ t.value.index(0): t.value }) })\n            let newest = $present.fold(0, t -> if t.value.index(9) > t.tally { t.value.index(9) } else { t.tally })\n            root = if $present.length() == 0 { throw(\"the route file names no route\") } else if $newest < now().ts_unix() - 900 { throw(\"the route file is from %v, older than three 5-minute periods\".format($newest.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\"))) } else { {\n              \"rows\": $first.values().sort_by(r -> r.index(0).number()),\n              \"dropped\": {\n                \"malformedLine\": $rows.length() - $shaped.length(),\n                \"travelTimeOutOfRange\": $read.length() - $ranged.length(),\n                \"timeInFuture\": $timed.length() - $present.length(),\n                \"duplicateRoute\": $present.length() - $first.keys().length()\n              }\n            } }\n        - branch:\n            request_map: root = \"\"\n            processors:\n              - http:\n                  url: https://opendata-ajuntament.barcelona.cat/data/dataset/446dcd8e-445a-45eb-8979-c73376ea340e/resource/8d6239d1-995a-4e65-9fce-8b98baf693ed/download/transit_relacio_tram_per_itinerari.csv\n                  verb: GET\n                  headers:\n                    Accept: text/csv\n                    User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)\n                  timeout: 30s\n                  retries: 1\n                  rate_limit: barcelona_opendata\n              - mapping: |\n                  root = if content().length() > 1048576 { throw(\"the route list is %d bytes, more than the 1 MB read\".format(content().length())) } else { content().string() }\n            result_map: root.routes = content().string()\n        - branch:\n            request_map: root = \"\"\n            processors:\n              - http:\n                  url: https://opendata-ajuntament.barcelona.cat/data/dataset/1090983a-1c40-4609-8620-14ad49aae3ab/resource/1d6c814c-70ef-4147-aa16-a49ddb952f72/download/transit_relacio_trams.csv\n                  verb: GET\n                  headers:\n                    Accept: text/csv\n                    User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)\n                  timeout: 30s\n                  retries: 1\n                  rate_limit: barcelona_opendata\n              - mapping: |\n                  root = if content().length() > 2097152 { throw(\"the section list is %d bytes, more than the 2 MB read\".format(content().length())) } else { content().string() }\n            result_map: root.sections = content().string()\n        - mapping: |\n            let routes = this.routes.trim_prefix(\"\uFEFF\").parse_csv().catch([])\n            let sections = this.sections.trim_prefix(\"\uFEFF\").parse_csv().catch([])\n            root = if $routes.length() == 0 || !$routes.index(0).exists(\"Itinerari\") || !$routes.index(0).exists(\"Tram\") { throw(\"the route list does not have the columns Itinerari, Tram, Descripció\") } else if $sections.length() == 0 || !$sections.index(0).exists(\"Tram\") || !$sections.index(0).exists(\"Coordenades\") { throw(\"the section list does not have the columns Tram, Descripció, Coordenades\") } else { this }\n        - mapping: |\n            let routes = this.routes.trim_prefix(\"\uFEFF\").parse_csv()\n            let parsed = this.sections.trim_prefix(\"\uFEFF\").parse_csv().map_each(s -> s.merge({ \"c\": s.Coordenades.or(\"\").split(\",\").map_each(v -> v.trim().number().catch(null)) }))\n            let shaped = $parsed.filter(s -> s.c.length() >= 4 && s.c.length() % 2 == 0 && s.c.all(v -> v != null))\n            let points = $shaped.map_each(s -> { \"id\": s.Tram.string().trim(), \"line\": range(0, s.c.length(), 2).map_each(i -> [s.c.index(i), s.c.index(i + 1)]) })\n            let lines = $points.filter(s -> s.line.all(p -> p.index(0) >= 2.04 && p.index(0) <= 2.24 && p.index(1) >= 41.30 && p.index(1) <= 41.48)).map_each(s -> { s.id: s.line }).squash()\n            let names = $routes.filter(r -> r.Tram.string().trim() == \"0\").map_each(r -> { r.Itinerari.string().trim(): r.get(\"Descripció\").or(\"\").trim() }).squash()\n            let members = $routes.filter(r -> r.Tram.string().trim() != \"0\").fold({}, t -> t.value.Itinerari.string().trim().(k -> t.tally.assign({ k: t.tally.get(k).or([]).append(t.value.Tram.string().trim()) })))\n            let drawn = this.rows.map_each(r -> r.append($members.get(r.index(0)).or([]).filter(m -> $lines.exists(m)).map_each(m -> $lines.get(m))))\n            let known = $drawn.filter(r -> r.index(10).length() > 0)\n            let entities = $known.map_each(r -> r.index(9).ts_format(\"2006-01-02T15:04:05Z\", \"UTC\").(at -> {\n              \"id\": \"urn:ngsi-ld:%v:%v:%v:itinerari-%v\".format(\"TrafficFlowObserved\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), r.index(0)),\n              \"type\": \"TrafficFlowObserved\",\n              \"name\": { \"type\": \"Property\", \"value\": $names.get(r.index(0)).or(\"Itinerari %v\".format(r.index(0))) },\n              \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": \"MultiLineString\", \"coordinates\": r.index(10) } },\n              \"dateObserved\": { \"type\": \"Property\", \"value\": at },\n              \"travelTime\": if r.index(8) { { \"type\": \"Property\", \"value\": r.index(3).number().int64(), \"unitCode\": \"SEC\", \"observedAt\": at } } else { deleted() },\n              \"usualTravelTime\": if r.index(8) { { \"type\": \"Property\", \"value\": r.index(4).number().int64(), \"unitCode\": \"SEC\", \"observedAt\": at } } else { deleted() },\n              \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/ca/dataset/itineraris\" }\n            }))\n            root = if $entities.length() == 0 { throw(\"no route of the route file has a section line in the section list\") } else { {\n              \"entities\": $entities,\n              \"dropped\": this.dropped.merge({\n                \"routeWithoutLine\": this.rows.length() - $known.length(),\n                \"lineMalformed\": $parsed.length() - $shaped.length(),\n                \"lineOutOfArea\": $points.length() - $lines.keys().length()\n              })\n            } }\n        - log:\n            level: INFO\n            message: 'traffic-routes: ${! json(\"entities\").length() } routes written, left out by reason ${! json(\"dropped\").format_json(no_indent: true) }'\n        - mapping: root = this.entities\n        - unarchive: { format: json_array }\n"
    projects__barcelona__pipelines__traffic-routes__pipeline.yaml: |
