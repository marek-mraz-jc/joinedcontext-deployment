          keywords:
            ca: [agenda, activitats, cultura, esports]
            es: [agenda, actividades, cultura, deportes]
            en: [events, culture, sport, leisure]
          spatial:
            - ES511
            - https://sws.geonames.org/3128760/
          frequency: DAILY
          source:
            - url: https://opendata-ajuntament.barcelona.cat/data/ca/dataset/agenda-diaria
              title: { ca: Agenda diària, en: Daily agenda }
              description:
                ca: Activitats de l'agenda diària de Barcelona, CC BY 4.0.
