apps:
  s2-barcelona:
    projects__barcelona__ckan__barcelona.yaml: |
      # The open-data catalogue the project's cleared Endpoints publish to (EP-62, EP-67). jcctl opens
      # the CKAN organisation `barcelona` with the first Endpoint that publishes, titled in the space's
      # language (ca) and kept in step on every run (ADR-N-058 2.6). The API token is a reference.
      apiVersion: joinedcontext.com/v1alpha1
      kind: CkanInstance
      metadata:
        name: barcelona
        namespace: barcelona
        title: { ca: Ajuntament de Barcelona, es: Ayuntamiento de Barcelona, en: Barcelona City Council }
      spec:
        url: https://opendata.dev.joinedcontext.com
        organizationDefault: barcelona
        apiTokenRef: { name: ckan-api-token, key: token, envVar: CKAN_API_TOKEN }
    projects__barcelona__datasources__bcn-accidents.yaml: |
      # Open Data BCN `accidents-gu-bcn` (CC BY 4.0): the accidents the Guàrdia Urbana handled, one CSV
      # per year (2010..2025 on 2026-10-23, the newest 1.26 MB, 7,741 accidents). The DataSource reads
      # the dataset's CKAN record (about 30 kB); the mapping picks the newest year's CSV from it, so the
      # file of a new year is read the week the city adds it. No key.
      apiVersion: joinedcontext.com/v1alpha1
      kind: DataSource
      metadata:
        name: bcn-accidents
        namespace: barcelona
        title:
          ca: Accidents gestionats per la Guàrdia Urbana (Open Data BCN)
          es: Accidentes gestionados por la Guardia Urbana (Open Data BCN)
          en: Accidents handled by the local police (Open Data BCN)
      spec:
        type: http
        http:
          url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/package_show?id=accidents-gu-bcn
          verb: GET
          headers: { Accept: application/json }
          timeout: 30s
    projects__barcelona__datasources__bcn-drinking-fountains.yaml: |
      # Open Data BCN's package fonts (CC BY 4.0): the city's 1,760 drinking fountains (281 kB in 2026), one CSV file a
      # year, each March under a new name. The DataSource answers the package; the pipeline reads its
      # newest CSV file from the same host. No credential (T-5431).
      apiVersion: joinedcontext.com/v1alpha1
      kind: DataSource
      metadata:
        name: bcn-drinking-fountains
        namespace: barcelona
        title:
          ca: Fonts de beure de Barcelona (Open Data BCN)
          es: Fuentes de agua potable de Barcelona (Open Data BCN)
          en: Barcelona drinking fountains (Open Data BCN)
      spec:
        type: http
        http:
          url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/package_show?id=fonts
          verb: GET
          headers: { Accept: application/json }
          timeout: 60s
    projects__barcelona__datasources__bcn-groundwater.yaml: |
      # Open Data BCN's groundwater readings (dataset piezometres_detall, CC BY 4.0): every reading of the
      # city's piezometers and wells since 2000, one resource the city rewrites about once a month. About
      # 420 KB; the mapping refuses more than 2 MiB.
      apiVersion: joinedcontext.com/v1alpha1
      kind: DataSource
      metadata:
        name: bcn-groundwater
        namespace: barcelona
        title:
          ca: Piezòmetres i pous, mesures (Open Data BCN)
          es: Piezómetros y pozos, medidas (Open Data BCN)
          en: Piezometers and wells, readings (Open Data BCN)
      spec:
        type: http
        http:
          url: https://opendata-ajuntament.barcelona.cat/data/dataset/15427ab9-65ab-42ae-be8a-f2f69c0a7c54/resource/2c64d077-3cb8-4d82-9de3-458a35267d74/download
          verb: GET
          headers: { Accept: text/csv }
          timeout: 30s
    projects__barcelona__datasources__bcn-local-trees.yaml: |
      # Open Data BCN's trees of local interest (dataset arbres-interes-local, CC BY 4.0): the 208 trees
      # the city protects for their age, size or history, entries of its register (Guia BCN). The
      # DataStore resource of the CSV is read with one SQL query, one row per tree (main address first);
      # the CSV itself is UTF-16, which a pipeline cannot read. About 54 KB; no credential. T-5413.
      apiVersion: joinedcontext.com/v1alpha1
      kind: DataSource
      metadata:
        name: bcn-local-trees
        namespace: barcelona
        title:
          ca: Arbres d'interès local (Open Data BCN)
          es: Árboles de interés local (Open Data BCN)
          en: Trees of local interest (Open Data BCN)
      spec:
        type: http
        http:
          url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/datastore_search_sql?sql=SELECT%20DISTINCT%20ON%20%28id%29%20replace%28register_id%2C%20U%26%27%5CFEFF%27%2C%20%27%27%29%20AS%20id%2C%20name%2C%20addresses_road_name%20AS%20street%2C%20addresses_start_street_number%20AS%20num%2C%20addresses_district_name%20AS%20district%2C%20geo_epgs_4326_lat%20AS%20lat%2C%20geo_epgs_4326_lon%20AS%20lon%2C%20modified%20FROM%20%225bedd7c3-3201-4d9b-9062-1af8e9288ab1%22%20ORDER%20BY%20id%2C%20addresses_main_address%20%3D%20%27True%27%20DESC%20LIMIT%201000
          verb: GET
          headers: { Accept: application/json }
          timeout: 60s
    projects__barcelona__datasources__bcn-ornamental-fountains.yaml: |
      # Open Data BCN's package fonts-ornamentals (CC BY 4.0): the city's 335 ornamental fountains (67 kB in 2026), one CSV file a
      # year, each March under a new name. The DataSource answers the package; the pipeline reads its
      # newest CSV file from the same host. No credential (T-5431).
      apiVersion: joinedcontext.com/v1alpha1
      kind: DataSource
      metadata:
        name: bcn-ornamental-fountains
        namespace: barcelona
        title:
          ca: Fonts ornamentals de Barcelona (Open Data BCN)
          es: Fuentes ornamentales de Barcelona (Open Data BCN)
          en: Barcelona ornamental fountains (Open Data BCN)
      spec:
        type: http
        http:
          url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/package_show?id=fonts-ornamentals
          verb: GET
          headers: { Accept: application/json }
          timeout: 60s
    projects__barcelona__datasources__bcn-traffic-routes.yaml: |
      # Open Data BCN `itineraris` (T-5262): the travel time of each of the city's 78 traffic routes now
      # and as usual, rewritten every five minutes as one small text file (78 lines, 2.7 kB on
      # 2026-10-23), one line per route: id#available#time#now#usual#future#factor#trend. The dataset's
      # download link answers 302 to this file on www.bcn.cat, the city's traffic site the package
      # names as its source; the pipeline reads it there. No key. CC BY 4.0, Ajuntament de Barcelona.
      apiVersion: joinedcontext.com/v1alpha1
      kind: DataSource
      metadata:
        name: bcn-traffic-routes
        namespace: barcelona
        title:
          ca: Temps de recorregut per itineraris (Open Data BCN)
          es: Tiempo de recorrido por itinerarios (Open Data BCN)
          en: Travel time by route (Open Data BCN)
      spec:
        type: http
        http:
          url: https://www.bcn.cat/transit/dades/dadesitineraris.dat
          verb: GET
          headers: { Accept: text/plain }
          timeout: 20s
    projects__barcelona__datasources__bcn-traffic-state.yaml: |
      # Open Data BCN `trams` (T-5262): the traffic state of every street section of the city's network,
      # rewritten every five minutes as one small text file (532 lines, 13 kB on 2026-10-22), one line
      # per section: id#time#state#forecast. No key. CC BY 4.0, Ajuntament de Barcelona.
      apiVersion: joinedcontext.com/v1alpha1
      kind: DataSource
      metadata:
        name: bcn-traffic-state
        namespace: barcelona
        title:
          ca: Estat del trànsit per trams (Open Data BCN)
          es: Estado del tráfico por tramos (Open Data BCN)
          en: Traffic state by street section (Open Data BCN)
      spec:
        type: http
        http:
          url: https://opendata-ajuntament.barcelona.cat/data/dataset/8319c2b1-4c21-4962-9acd-6db4c5ff1148/resource/2d456eb5-4ea6-4f68-9794-2f3f1a58a933/download
          verb: GET
          headers: { Accept: text/plain }
          timeout: 20s
    projects__barcelona__pipelines__agenda__bento.yaml: |
      # The mapping of the agenda pipeline (T-5265): every current and upcoming activity of the
      # Ajuntament's three agendas (agenda diària, agenda cultural, agenda d'activitats esportives) as
      # a Smart Data Models Event. The bcn-agenda DataSource answers one Open Data BCN DataStore SQL
      # query over the three resources, one row per activity (about 7,700 on 2026-10-22, 2.9 MB); the
      # reconciler renders that poll in front and the endpoint upsert after (PL-39, PL-16). Past
      # activities stay in the space; nothing here deletes.
      pipeline:
        processors:
          # An answer over 16 MiB is not the agenda; an empty agenda is a broken source, not a quiet
          # city; an agenda whose newest change is older than three days (three of its daily updates)
          # is stale; an answer of 20000 rows reached the LIMIT of the bcn-agenda query and may be cut
          # short. Each fails the run visibly instead of writing nothing, old rows or part of them.
          - mapping: |
              let rows = this.result.records.or([])
              let newest = $rows.map_each(r -> r.modified.or("")).sort().index(-1).or("")
              let floor = now().ts_sub_iso8601("P3D").ts_format("2006-01-02T15:04:05", "Europe/Madrid")
              root = if content().length() > 16777216 {
                throw("the agenda answer is %d bytes, more than the 16 MiB read".format(content().length()))
              } else if this.success.or(false) != true {
                throw("Open Data BCN refused the agenda query: %s".format(this.error.format_json(no_indent: true).or("no reason given")))
              } else if $rows.length() == 0 {
                throw("the Barcelona agendas list no current activity: nothing is written")
              } else if $rows.length() >= 20000 {
                throw("the Barcelona agendas answered %d rows, the LIMIT 20000 of the bcn-agenda query: raise it, or the rows past it are dropped".format($rows.length()))
              } else if $newest < $floor {
                throw("the Barcelona agendas are stale: the newest change is %s, more than three days old".format($newest))
              } else { $rows }

          # Plausibility (owner 2026-10-22T18:10Z): a row a map or a calendar cannot use is dropped and
          # counted by reason, never guessed at: no position; a point outside Barcelona and 1 km around
          # it (the agenda carries activities in neighbouring towns, and a few rows at 0,0 where the
          # city's projection had no point); a start day missing (the permanent collections) or before
          # 2000, or an end before the start; one activity listed twice under two ids (same name, same
          # place within 20 m, same start day).
          - mapping: |
              # Two rows are one place when their names match and they lie within 20 m (owner
              # 2026-10-22T18:10Z): rows sorted by name, each compared with the kept points of its name.
              map near {
                let lat = this.value.lat.number()
                let lon = this.value.lon.number()
                let pts = if this.tally.name == this.value._key { this.tally.pts } else { [] }
                # Metres at Barcelona's latitude: 111,320 m a degree north, 83,520 m a degree east.
                let near = $pts.any(p -> (p.index(0) - $lat) * (p.index(0) - $lat) * 12392142400 + (p.index(1) - $lon) * (p.index(1) - $lon) * 6975590400 <= 400)
                root = if $near { this.tally.assign({ "dup": this.tally.dup.append(this.value.id) }) } else {
                  { "name": this.value._key, "pts": $pts.append([$lat, $lon]), "dup": this.tally.dup }
                }
              }
              map reason {
                let lat = this.lat.or("").number().catch(null)
                let lon = this.lon.or("").number().catch(null)
                let start = this.starts.or("")
                root = if $lat == null || $lon == null { "no position" }
                  else if $lon < 2.04 || $lon > 2.24 || $lat < 41.3 || $lat > 41.48 { "outside Barcelona" }
                  else if !$start.re_match("^(19|2[0-9])[0-9]{2}-[01][0-9]-[0-3][0-9]$") || $start < "2000" { "start day missing or before 2000" }
                  else if this.ends.or(null) != null && this.ends < $start { "ends before it starts" }
                  else if !this.id.or("").re_match("^[0-9]{1,20}$") { "no id" }
                  else if this.name.or("").trim() == "" { "no name" }
                  else { null }
              }
              let rows = this.map_each(e -> e.assign({ "_drop": e.apply("reason") }))
              let usable = $rows.filter(e -> e._drop == null).unique(e -> e.id)
              let keyed = $usable.map_each(e -> e.assign({ "_key": [e.name.trim().lowercase(), e.starts].format_json(no_indent: true) })).sort_by(e -> e._key)
              let dup = $keyed.fold({ "name": "", "pts": [], "dup": [] }, item -> item.apply("near")).dup
              let kept = $usable.filter(e -> !$dup.contains(e.id))
              let tally = $rows.filter(e -> e._drop != null).fold({}, item -> item.tally.assign({ item.value._drop: item.tally.get(item.value._drop).or(0) + 1 }))
              let dups = $rows.filter(e -> e._drop == null).length() - $kept.length()
              meta dropped = (if $dups > 0 { $tally.assign({ "duplicate": $dups }) } else { $tally }).format_json(no_indent: true)
              meta kept = $kept.length().string()
              root = $kept.map_each(e -> e.without("_drop"))
          - log:
              level: INFO
              message: 'agenda: ${! @kept } events kept, dropped by reason ${! @dropped }'
          - unarchive: { format: json_array }

          - mapping: |
              # The event leaves the space by itself (NGSI-LD 4.22 expiresAt): at the end of its last day
              # (`ends`, a local day), or three daily runs after the newest run that listed it, whichever
              # comes first; an hour after `now` at least, so a write never carries a past expiry. The
              # last day ends at the next local midnight, with the next day's own offset (a summer time
              # change makes that day 23 or 25 hours long). `now` is an argument, so a test pins the clock.
              map expiry {
                let next_day = if this.ends == null { null } else {
                  ((this.ends + "T12:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_unix() + 86400).ts_format("2006-01-02", "UTC")
                }
                let ends_at = if $next_day == null { null } else {
                  ($next_day + "T00:00:00" + ($next_day + "T00:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_tz("Europe/Madrid").ts_format("Z07:00")).ts_parse("2006-01-02T15:04:05Z07:00").ts_unix()
                }
                let lease = this.now + 259200
                root = [if $ends_at == null { $lease } else { [$ends_at, $lease].min() }, this.now + 3600].max()
              }
              # The domain comes from the deployment, never from this file (PF-44); the agenda's
              # register_id is the local id.
              let urn = "urn:ngsi-ld:%v:%v:%v:%v"
              let name = this.name.trim()
              let words = $name.lowercase()
              # The main category (T-5363's fifteen codes) from the first words of the Catalan name,
              # first rule that matches, then from a word that opens a later part of it ("Setmana de
              # l'Àlbum. Taller ..."); the sports agenda is sport whatever the name. The Smart Data
              # Models category and sub-category follow where one fits. No rule, no category.
              let rules = [
                ["children-family", "^(contacontes|narraci|contes?|sessi[óo] de contes|hora del conte|espectacle infantil|activitat familiar|en fam[ií]lia)|infantil|fam[ií]lies"],
                ["music", "^(concerts?|[òo]pera|recital|m[uú]sica|cantada|coral|jazz|sardanes|audici[óo])"],
                ["theatre-dance", "^(teatre|espectacles?|dansa|ball|mon[òo]leg|circ|titelles|lectura (dramatitzada|escenificada)|improvisaci|m[àa]gia)"],
                ["film", "^(projecci[óo]|cinema|cinef[òo]rum|cicle de cinema|documental|pel[·.]?l[ií]cula|curtmetratges?)"],
                ["exhibition-museum", "^(exposici[óo]|mostra|museu|instal[·.]?laci[óo])"],
                ["festival-fair", "^(festa|fira|festival|castanyada|celebraci[óo]|carnaval|revetlla|cavalcada|festes)"],
                ["sport", "^(b[àa]squet|futbol|cursa|partit|handbol|hoquei|nataci[óo]|atletisme|voleibol|tennis|marat[óo]|torneig|campionat|travessa|caminada|bicicletada)"],
                ["history-heritage", "^(sortida cultural|visit(a|es)|itineraris?|ruta|patis|passeig)"],
                ["outdoor-nature", "^(sortida|passejada|excursi[óo]|ruta natural|observaci[óo] d.ocells)"],
                ["education-talk", "^(xerrada|confer[èe]ncia|seminari|col[·.]?loqui|curs|taula rodona|presentaci[óo]|jornad(a|es)|debat|sessi[óo] informativa|lectura|club de lectura|tert[úu]lia|di[àa]leg|classe)"],
                ["food-market", "^(mercat|vermut|tast|degustaci[óo]|mercadet)"],
                ["hobby-workshop", "^(tallers?|joc|jocs|concurs)"],
                ["health-wellness", "^(ioga|meditaci[óo]|pilates|tai.?txi|salut)"],
                ["faith-tradition", "^(missa|processó|pessebre)"],
                ["community-civic", "^(trobada|espai (de trobada|obert)|grup|campanya|casal|assemblea|reuni[óo]|punt d.informaci[óo]|portes obertes|voluntariat)"]
              ]
              let main = if this.src == "agenda-activitats-esportives" { "sport" } else {
                $rules.filter(r -> $words.re_match(r.index(1))).map_each(r -> r.index(0)).index(0).or(
                  $rules.filter(r -> $words.re_match(r.index(1).replace_all("^(", "(^|[ .,:'\"‘«(])("))).map_each(r -> r.index(0)).index(0).or(null))
              }
              let sdm = {
                "music": ["spectacle"], "theatre-dance": ["spectacle"], "film": ["spectacle"],
                "festival-fair": ["spectacle"], "exhibition-museum": ["museum"],
                "outdoor-nature": ["outdoorActivities"], "history-heritage": ["history"],
                "food-market": ["gastronomy"], "faith-tradition": ["religiousWorship"], "health-wellness": ["wellness"]
              }
              let sub = { "music": ["music"], "theatre-dance": ["theater"] }
              # The agenda's date is a day: its hours sit in a free-text timetable. The day starts at
              # local midnight in Barcelona, at the offset that holds then: 00:00Z is local 01:00 or 02:00,
              # before either summer time change (01:00Z), while noon already has the new offset.
              let offset = (this.starts + "T00:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_tz("Europe/Madrid").ts_format("Z07:00")
              let end_offset = if this.ends.or(null) == null { null } else {
                (this.ends + "T00:00:00Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_tz("Europe/Madrid").ts_format("Z07:00")
              }
              let expires = {"ends": this.ends.or(null), "now": timestamp_unix()}.apply("expiry")
              # The register writes 9999 for a place with no street number (97 of them on 2026-10-23).
              let street = [this.street.or("").trim(), this.num.or("").trim()].filter(s -> s != "" && s != "9999").join(" ")
              let town = this.town.or("").trim()
              let phone = this.phone.or("").trim()
              root = {
                "id": $urn.format("Event", env("JC_ORG_DOMAIN"), env("JC_SPACE"), this.id),
                "type": "Event",
                "name": { "type": "Property", "value": $name },
                "startDate": { "type": "Property", "value": this.starts + "T00:00:00" + $offset },
                "endDate": if $end_offset == null { null } else {
                  { "type": "Property", "value": this.ends + "T00:00:00" + $end_offset }
                },
                "category": if $main == null { null } else {
                  { "type": "Property", "value": [$main].concat($sdm.get($main).or([])) }
                },
                "subCategory": if $main == null || $sub.get($main) == null { null } else {
                  { "type": "Property", "value": $sub.get($main) }
                },
                "location": { "type": "GeoProperty", "value": {
                  "type": "Point", "coordinates": [(this.lon.number() * 1000000).round() / 1000000, (this.lat.number() * 1000000).round() / 1000000]
                } },
                "address": { "type": "Property", "value": {
                  "streetAddress": $street,
                  "postalCode": this.zip.or(""),
                  # The agenda writes the town in capitals as often as not ("BARCELONA").
                  "addressLocality": if $town.uppercase() == "BARCELONA" { "Barcelona" } else { $town },
                  "district": this.district.or("").trim(),
                  "addressCountry": "ES"
                }.filter(entry -> entry.value != "") },
                "contactPoint": if $phone == "" || !$phone.re_match("^[0-9 .+()/-]{6,40}$") { null } else {
                  { "type": "Property", "value": { "telephone": $phone } }
                },
                "source": { "type": "Property", "value": "https://opendata-ajuntament.barcelona.cat/data/dataset/" + this.src },
                "expiresAt": $expires.ts_format("2006-01-02T15:04:05Z", "UTC")
              }
              root = root.filter(entry -> entry.value != null)

          # 500 events per request to the endpoint: one run never holds one 7,700-entity write.
          - split: { size: 500 }
          - archive: { format: json_array }
    projects__barcelona__pipelines__bike-lanes__bento.yaml: |
      # The mapping of the bike-lanes pipeline (PL-03, T-5374): one BikeLane per segment of Open Data
      # BCN's bike network, the open lanes (carril-bici, CARRIL_BICI.geojson, the DataSource's answer)
      # the bike corridors (corredors-bici-bcn, CORREDORS_BICI.geojson: lanes shared with buses or
      # traffic calmed for bicycles) and the lanes under construction (carrils-bici-en-construccio,
      # CARRIL_BICI_CONSTRUCCIO.geojson), both read here from the same host. Each feature is a LineString with ID (the map layer's segment
      # code, GL followed by digits) and TOOLTIP (its label in Catalan). The length is summed over the
      # line's points on a local plane at 41.4° N, within 0.2 % across the city.
      #
      # Plausibility (owner 2026-10-22): a feature with no GL code, a geometry that is no LineString of
      # at least two numeric points, a line with a point outside the municipality's 1 km margin (the
      # space's in-area bbox), and a second feature of one code (an open lane listed again under
      # construction keeps its open state) are dropped; a length of 0 or above 20 km is left out of the
      # entity. Each is counted in the run's log line. An open-lane layer with no segment, or a layer
      # that does not answer or is no GeoJSON, fails the run, which writes nothing.

      pipeline:
        processors:
          - try:
              - mapping: |
                  root = if content().length() > 4194304 { throw("the bike lane layer is %d bytes, more than the 4 MiB read".format(content().length())) } else { content().string().parse_json() }
              - branch:
                  request_map: root = ""
                  processors:
                    - http:
                        url: https://opendata-ajuntament.barcelona.cat/resources/bcn/CarrilsBici/CORREDORS_BICI.geojson
                        verb: GET
                        headers:
                          Accept: application/geo+json
                          User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)
                        timeout: 30s
                        retries: 1
                        rate_limit: barcelona_opendata
                    - mapping: |
                        root = if content().length() > 1048576 { throw("the corridor layer is %d bytes, more than the 1 MiB read".format(content().length())) } else { content().string() }
                  result_map: root.corridors = content().string()
              - branch:
                  request_map: root = ""
                  processors:
                    - http:
                        url: https://opendata-ajuntament.barcelona.cat/resources/bcn/CarrilsBici/CARRIL_BICI_CONSTRUCCIO.geojson
                        verb: GET
                        headers:
                          Accept: application/geo+json
                          User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)
                        timeout: 30s
                        retries: 1
                        rate_limit: barcelona_opendata
                    - mapping: |
                        root = if content().length() > 1048576 { throw("the construction layer is %d bytes, more than the 1 MiB read".format(content().length())) } else { content().string() }
                  result_map: root.construction = content().string()
              - mapping: |
                  let bbox = [2.04, 41.3, 2.24, 41.48]
                  let open = if this.type.or("") != "FeatureCollection" || this.features.type() != "array" { throw("the bike lane layer is no GeoJSON FeatureCollection") } else { this.features.map_each(f -> f.assign({ "state": "inService", "layer": "carril-bici" })) }
                  let corridors = this.corridors.parse_json().catch({}).(c -> if c.type.or("") != "FeatureCollection" || c.features.type() != "array" { throw("the corridor layer is no GeoJSON FeatureCollection") } else { c.features.map_each(f -> f.assign({ "state": "inService", "layer": "corredors-bici-bcn" })) })
                  let building = this.construction.parse_json().catch({}).(c -> if c.type.or("") != "FeatureCollection" || c.features.type() != "array" { throw("the construction layer is no GeoJSON FeatureCollection") } else { c.features.map_each(f -> f.assign({ "state": "underConstruction", "layer": "carrils-bici-en-construccio" })) })
                  let all = $open.concat($corridors, $building)
                  let coded = $all.filter(f -> f.properties.ID.or("").string().re_match("^GL[0-9]{1,12}$"))
                  let lined = $coded.filter(f -> f.geometry.type.or("") == "LineString" && f.geometry.coordinates.type() == "array" && f.geometry.coordinates.length() >= 2 && f.geometry.coordinates.all(p -> p.type() == "array" && p.length() >= 2 && p.index(0).type() == "number" && p.index(1).type() == "number"))
                  let inside = $lined.filter(f -> f.geometry.coordinates.all(p -> p.index(0) >= $bbox.index(0) && p.index(0) <= $bbox.index(2) && p.index(1) >= $bbox.index(1) && p.index(1) <= $bbox.index(3)))
                  # Open lanes come first, then corridors, so a code listed again under construction keeps its open state.
                  let lanes = $inside.fold({ "seen": {}, "kept": [] }, t -> if t.tally.seen.exists(t.value.properties.ID) { t.tally } else { { "seen": t.tally.seen.merge({ t.value.properties.ID: true }), "kept": t.tally.kept.append(t.value) } }).kept.map_each(f -> {
                    "id": f.properties.ID,
                    "name": f.properties.TOOLTIP.or("").string().trim(),
                    "state": f.state,
                    "layer": f.layer,
                    "line": f.geometry.coordinates.map_each(p -> [p.index(0), p.index(1)]),
                    "length": f.geometry.coordinates.enumerated().slice(1).fold(0, t -> t.tally + (((t.value.value.index(0) - f.geometry.coordinates.index(t.value.index - 1).index(0)) * 83550).pow(2) + ((t.value.value.index(1) - f.geometry.coordinates.index(t.value.index - 1).index(1)) * 111050).pow(2)).pow(0.5)).round()
                  })
                  root.dropped = {
                    "noSegmentCode": $all.length() - $coded.length(),
                    "lineMalformed": $coded.length() - $lined.length(),
                    "outsideTheCity": $lined.length() - $inside.length(),
                    "duplicateSegment": $inside.length() - $lanes.length(),
                    "lengthOutOfRange": $lanes.filter(l -> l.length <= 0 || l.length > 20000).length()
                  }
                  root.lanes = if $lanes.filter(l -> l.layer == "carril-bici").length() == 0 { throw("the bike lane layer holds no open lane") } else { $lanes }
              - log:
                  level: INFO
                  message: 'bike lanes: ${! json("lanes").length() } written; dropped ${! json("dropped").format_json(no_indent: true) }'
              - mapping: root = this.lanes
              - unarchive: { format: json_array }
              - mapping: |
                  let now = now().ts_unix()
                  root = {
                    "id": "urn:ngsi-ld:%v:%v:%v:carril-%v".format("BikeLane", env("JC_ORG_DOMAIN"), env("JC_SPACE"), this.id.lowercase()),
                    "type": "BikeLane",
                    "expiresAt": ($now + 21 * 86400).ts_format("2006-01-02T15:04:05Z", "UTC"),
                    "name": if this.name == "" { null } else { { "type": "Property", "value": this.name } },
                    "localId": { "type": "Property", "value": this.id },
                    "bikeLaneState": { "type": "Property", "value": this.state },
                    "laneLength": if this.length <= 0 || this.length > 20000 { null } else { { "type": "Property", "value": this.length, "unitCode": "MTR" } },
                    "location": { "type": "GeoProperty", "value": { "type": "LineString", "coordinates": this.line } },
                    "dataProvider": { "type": "Property", "value": "Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)" },
                    "source": { "type": "Property", "value": "https://opendata-ajuntament.barcelona.cat/data/dataset/" + this.layer }
                  }.filter(entry -> entry.value != null)
    projects__barcelona__pipelines__bike-lanes__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: bike-lanes
        namespace: barcelona
        title:
          ca: Carrils bici de Barcelona, cada setmana
          es: Carriles bici de Barcelona, cada semana
          en: Barcelona bike lanes, weekly
      spec:
        class: auto
        # The city redraws the layers on request (carril-bici last on 2026-10-02): a weekly read is enough.
        schedule: '35 5 * * 3'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-bike-lanes }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert: a segment the layers drop leaves by its expiresAt, three weeks after its last listing.
        output: { type: BikeLane, mode: upsert }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__districts__bento.yaml: "# The mapping of the districts pipeline (PL-03, T-5264): one AdministrativeArea per district of\n# Barcelona, its outline and its code, from Open Data BCN's BarcelonaCiutat_Districtes.csv\n# (dataset 20170706-districtes-barris): columns Codi_Districte, nom_districte, geometria_etrs89 and\n# geometria_wgs84, the outline as WKT. Only the WGS84 column is read; its WKT becomes GeoJSON by\n# turning each \"x y\" pair into [x,y] and each bracket into a JSON one, which serves POLYGON and\n# MULTIPOLYGON alike.\n#\n# Plausibility (owner 2026-10-22): a row whose code is not two digits, whose outline is no polygon\n# or has a vertex outside the municipality's 1 km margin (the space's in-area bbox), and a second\n# row of one code are each dropped and counted by reason in `dropped`, which the next step logs.\n# A file with no district at all fails the run, so the areas stand instead of going stale.\n\npipeline:\n  processors:\n    - mapping: |\n        let text = if content().length() > 4194304 { throw(\"the districts file is %d bytes, more than the 4 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        let bbox = [2.04, 41.3, 2.24, 41.48]\n        let rows = $text.parse_csv(true, \",\").map_each(r -> {\n          \"code\": r.Codi_Districte.or(\"\").trim(),\n          \"name\": r.nom_districte.or(\"\").trim(),\n          \"wkt\": r.geometria_wgs84.or(\"\").trim()\n        })\n        let coded = $rows.filter(r -> r.code.re_match(\"^[0-9]{2}$\") && r.name != \"\")\n        let shaped = $coded.map_each(r -> r.assign({\n          \"type\": if r.wkt.has_prefix(\"MULTIPOLYGON\") { \"MultiPolygon\" } else if r.wkt.has_prefix(\"POLYGON\") { \"Polygon\" } else { null },\n          \"coordinates\": r.wkt.re_replace_all(\"^[A-Z]+ *\", \"\").re_replace_all(\"(-?[0-9.]+) (-?[0-9.]+)\", \"[$1,$2]\").replace_all(\"(\", \"[\").replace_all(\")\", \"]\").parse_json().catch(null)\n        })).filter(r -> r.type != null && r.coordinates != null).map_each(r -> r.assign({\n          \"points\": if r.type == \"MultiPolygon\" { r.coordinates.flatten().flatten() } else { r.coordinates.flatten() }\n        }))\n        let inside = $shaped.filter(r -> r.points.all(p -> p.index(0) >= $bbox.index(0) && p.index(0) <= $bbox.index(2) && p.index(1) >= $bbox.index(1) && p.index(1) <= $bbox.index(3)))\n        # One area per code: the first row of a code stands, a later one is a duplicate.\n        let first = $inside.enumerated().fold({}, item -> if item.tally.exists(item.value.value.code) { item.tally } else { item.tally.assign({ item.value.value.code: item.value.index }) })\n        let unique = $inside.enumerated().filter(e -> $first.get(e.value.code) == e.index).map_each(e -> e.value)\n        root.dropped = {\n          \"noCodeOrName\": $rows.length() - $coded.length(),\n          \"noPolygon\": $coded.length() - $shaped.length(),\n          \"outsideTheCity\": $shaped.length() - $inside.length(),\n          \"duplicateCode\": $inside.length() - $unique.length()\n        }\n        root.entities = if $unique.length() == 0 { throw(\"the districts file holds no district\") } else { $unique.map_each(r -> {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:district-%v\".format(\"AdministrativeArea\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), r.code),\n          \"type\": \"AdministrativeArea\",\n          \"name\": { \"type\": \"Property\", \"value\": r.name },\n          \"districtCode\": { \"type\": \"Property\", \"value\": r.code },\n          \"divisionLevel\": { \"type\": \"Property\", \"value\": \"district\" },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": r.type, \"coordinates\": r.coordinates } },\n          \"dataProvider\": { \"type\": \"Property\", \"value\": \"Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)\" },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/20170706-districtes-barris\" }\n        }) }\n    - log:\n        level: INFO\n        message: 'districts: ${! json(\"entities\").length() } written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.entities\n"
    projects__barcelona__pipelines__districts__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: districts
        namespace: barcelona
        title: { ca: Districtes de Barcelona, es: Distritos de Barcelona, en: Barcelona districts }
      spec:
        class: auto
        # The division changes a few times a decade; weekly is already more than it needs.
        schedule: '10 4 * * 1'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-districts }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert: an area missing from one file keeps its outline (T-5264).
        output: { type: AdministrativeArea, mode: upsert }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__dog-areas__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: dog-areas
        namespace: barcelona
        title:
          ca: Àrees de gossos de Barcelona, cada setmana
          es: Áreas para perros de Barcelona, cada semana
          en: Barcelona dog areas, weekly
      spec:
        class: auto
        # The city rewrites the file about twice a year on no fixed day; a weekly run finds it.
        schedule: '25 6 * * 3'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-dog-areas }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert, as the equipaments: both write PointOfInterest, so a replace would delete the other's.
        # An area the file drops leaves by its expiresAt, three weeks after its last listing.
        output: { type: PointOfInterest, mode: upsert }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__drinking-fountains__bento.yaml: "# The mapping of the drinking-fountains pipeline (PL-03, T-5431): one PointOfInterest of category\n# drinking-fountain per fountain of Open Data BCN's register (dataset fonts, the newest file: fonts_beure_2026.csv,\n# a new file each March): CODI (district and number, 01-004), NOM (empty for 349 of 1,760 on\n# 2026-10-23: then \"Font de beure\" and the code), CARRER and NUMERO_CARRER, NOM_DISTRICTE and WGS84\n# LATITUD/LONGITUD. `expiresAt`: a fountain the file drops leaves every read three weeks (three\n# update periods) after the file last listed it.\n#\n# Plausibility (owner 2026-10-22): a row with no code of the form 00-000, a point that is no number\n# or lies outside the municipality's 1 km margin (the space's in-area bbox) and a second row of one\n# code are dropped, each counted by reason in `dropped`, which the next step logs. A file over 2 MiB\n# or 10,000 rows (281 kB and 1,760 rows on 2026-10-23) is refused, and a file with no fountain at\n# all fails the run, so the fountains stand instead of going quiet.\n\npipeline:\n  processors:\n    # The DataSource answers the package (package_show?id=fonts). The city adds a new file each\n    # March under a new name and keeps the old ones, so the run reads the newest CSV resource of\n    # the package, never a fixed file; only a download on Open Data BCN's own host is fetched. A\n    # package whose newest file is more than 13 months old (one missed March) fails the run.\n    - mapping: |\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\")\n        let files = if content().length() > 1048576 { throw(\"the fonts package answer is %d bytes, more than the 1 MiB read\".format(content().length())) } else if this.success.or(false) != true { throw(\"Open Data BCN refused the fonts package\") } else { this.result.resources.or([]) }\n        let newest = $files.filter(r -> r.format.or(\"\") == \"CSV\" && r.url.or(\"\").re_match(\"^https://opendata-ajuntament[.]barcelona[.]cat/data/dataset/[0-9a-f-]{36}/resource/[0-9a-f-]{36}/download/[A-Za-z0-9_.-]+[.]csv$\")).sort_by(r -> r.last_modified.or(\"\")).index(-1).or(null)\n        let floor = $now.ts_sub_iso8601(\"P13M\").ts_format(\"2006-01-02T15:04:05\", \"UTC\")\n        meta file = if $newest == null { throw(\"the fonts package lists no CSV file on Open Data BCN\") } else if $newest.last_modified.or(\"\") < $floor { throw(\"the newest drinking fountains file is from %s, more than 13 months old\".format($newest.last_modified.or(\"an unknown day\"))) } else { $newest.url.trim_prefix(\"https://opendata-ajuntament.barcelona.cat/data/dataset/\") }\n        root = \"\"\n    - http:\n        url: https://opendata-ajuntament.barcelona.cat/data/dataset/${! @file }\n        verb: GET\n        headers:\n          Accept: text/csv\n          User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public open data)\n        timeout: 60s\n        retries: 2\n    - mapping: |\n        root = if errored() { throw(\"the drinking fountains file was not read: %s\".format(error())) } else { content() }\n    - mapping: |\n        let text = if content().length() > 2097152 { throw(\"the fountains file is %d bytes, more than the 2 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        let bbox = [2.04, 41.3, 2.24, 41.48]\n        let rows = $text.parse_csv(true, \",\")\n        let read = if $rows.length() > 10000 { throw(\"the fountains file holds %d rows, more than the 10,000 read\".format($rows.length())) } else { $rows }\n        let coded = $read.filter(r -> r.CODI.or(\"\").trim().re_match(\"^[0-9]{2}-[0-9]{3}$\"))\n        let placed = $coded.map_each(r -> {\n          \"id\": r.CODI.trim(),\n          \"name\": r.NOM.or(\"\").trim(),\n          \"street\": [r.CARRER.or(\"\").trim(), r.NUMERO_CARRER.or(\"\").trim()].filter(s -> s != \"\").join(\" \"),\n          \"district\": r.NOM_DISTRICTE.or(\"\").trim(),\n          \"lon\": r.LONGITUD.or(\"\").trim().number().catch(null),\n          \"lat\": r.LATITUD.or(\"\").trim().number().catch(null)\n        }).filter(f -> f.lon != null && f.lat != null)\n        let inside = $placed.filter(f -> f.lon >= $bbox.index(0) && f.lon <= $bbox.index(2) && f.lat >= $bbox.index(1) && f.lat <= $bbox.index(3))\n        # One fountain per code: sorted, so a repeat sits beside its first.\n        let by_id = $inside.sort_by(f -> f.id)\n        let unique = $by_id.enumerated().filter(e -> e.index == 0 || $by_id.index(e.index - 1).id != e.value.id).map_each(e -> e.value)\n        root.dropped = {\n          \"noCode\": $read.length() - $coded.length(),\n          \"noPoint\": $coded.length() - $placed.length(),\n          \"outsideTheCity\": $placed.length() - $inside.length(),\n          \"duplicateCode\": $inside.length() - $unique.length()\n        }\n        root.fountains = if $unique.length() == 0 { throw(\"the fountains file holds no fountain\") } else { $unique }\n    - log:\n        level: INFO\n        message: 'drinking fountains: ${! json(\"fountains\").length() } written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.fountains\n    - unarchive: { format: json_array }\n    - mapping: |\n        # The run's clock (a test sets bcn_now to read a recorded file as of its own day).\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix()\n        root = {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:drinking-fountain-%v\".format(\"PointOfInterest\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), this.id),\n          \"type\": \"PointOfInterest\",\n          \"expiresAt\": ($now + 21 * 86400).ts_format(\"2006-01-02T15:04:05Z\", \"UTC\"),\n          \"name\": { \"type\": \"Property\", \"value\": if this.name != \"\" { this.name } else { \"Font de beure \" + this.id } },\n          \"category\": { \"type\": \"Property\", \"value\": [\"drinking-fountain\"] },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": \"Point\", \"coordinates\": [this.lon, this.lat] } },\n          \"address\": { \"type\": \"Property\", \"value\": {\n            \"streetAddress\": this.street,\n            \"addressLocality\": \"Barcelona\",\n            \"district\": this.district,\n            \"addressCountry\": \"ES\"\n          }.filter(entry -> entry.value != \"\") },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/fonts\" }\n        }\n"
    projects__barcelona__pipelines__drinking-fountains__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: drinking-fountains
        namespace: barcelona
        title:
          ca: Fonts de beure de Barcelona, cada setmana
          es: Fuentes de agua potable de Barcelona, cada semana
          en: Barcelona drinking fountains, weekly
      spec:
        class: auto
        # The city publishes a new file each March; a weekly run renews each fountain's three-week
        # expiresAt and picks up the new file within a week of its upload.
        schedule: '30 5 * * 3'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-drinking-fountains }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert: a fountain the file drops leaves by its expiresAt, three weeks after its last listing.
        output: { type: PointOfInterest, mode: upsert }
        # A file under 300 kB, read whole.
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__equipaments__bento.yaml: |
      # The mapping of the equipaments pipeline (T-5265): the city's register of facilities (Guia BCN)
      # as Smart Data Models PointOfInterest, sixteen of its families and seven thematic extracts in
      # one run: culture and leisure, sports, education, social services, public administration,
      # markets, information centres, places of worship, environment, animals and plants, cemeteries,
      # media, utility companies, restaurants, transport (car parks, petrol stations, taxi ranks,
      # loading zones), pharmacies, hospitals and primary care, hotels, public toilets, beach showers,
      # tourist information points and climate shelters. The bcn-equipaments DataSource answers Open
      # Data BCN's list of those packages; each one's DataStore resource is then read with one SQL
      # query, one row per facility (main address first, a telephone where it lists one, every kind
      # the register gives it: a municipal library is also a library and a study room). Skipped:
      # equipament-associacions (8,165 associations, many at a member's home address) and
      # equipament-sanitat (no change since 2024-01-02 and no geo_epgs_4326_lat/lon; its pharmacies
      # and hospitals come live from sanitat-farmacies and sanitat-hospitals-atencio-primaria).
      # Nothing here deletes.
      pipeline:
        processors:
          - mapping: |
              # Each family the run reads, by package name, and the code its PointOfInterest carries
              # first in `category`. A package not listed here is never read. The register writes a
              # facility listed in two families once, under the first family of this list; the thematic
              # extracts (farmacies, hotels, toilets, showers, tourist points, climate shelters) come
              # after the families. "no kind": the extract has no secondary_filters_name column.
              let families = [
                ["equipament-cultura-i-lleure", "culture-leisure"],
                ["equipament-esports", "sports"],
                ["equipament-educacio", "education"],
                ["equipament-serveis-socials", "social-services"],
                ["equipament-administracio", "public-administration"],
                ["equipament-mercats-i-centres-comercials", "markets-shopping"],
                ["equipament-centres-d-informacio", "information-centres"],
                ["equipament-serveis-religiosos", "religious-services"],
                ["equipament-medi-ambient-i-serveis-relacionats", "environment"],
                ["equipament-animals-i-plantes", "animals-plants"],
                ["equipament-cementiris-i-serveis-relacionats", "cemeteries"],
                ["equipament-mitjans-de-comunicacio-i-serveis-relacionats", "media"],
                ["equipament-companyies-de-serveis", "utility-companies"],
                ["equipament-restaurants", "restaurants"],
                ["equipament-transports-i-serveis-relacionats", "transport"],
                ["equipaments-relacionats-amb-transports", "transport"],
                ["sanitat-farmacies", "health"],
                ["sanitat-hospitals-atencio-primaria", "health"],
                ["allotjaments-hotels", "accommodation"],
                ["lavabos-publics", "public-toilets"],
                ["dutxes-platges", "beach-showers"],
                ["punts-informacio-turistica", "tourist-information", "no kind"],
                ["xarxa-refugis-climatics", "climate-shelters", "no kind"]
              ]
              let listed = this.result.results.or([])
              let found = $families.map_each(f -> $listed.filter(p -> p.name.or("") == f.index(0)).index(0).or(null).(p -> if p == null { null } else { {
                "family": f.index(1),
                "package": p.name,
                "kind": f.index(2).or("") != "no kind",
                "resource": p.resources.or([]).filter(r -> r.datastore_active.or(false) == true && r.format.or("") == "CSV" && r.id.or("").re_match("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")).index(0).id.or(null)
              } })).filter(f -> f != null && f.resource != null)
              # The package list is a few hundred kB; an empty or refused one is a broken portal, and a
              # run that reads no family writes nothing, so it fails visibly instead.
              root = if content().length() > 4194304 {
                throw("the equipaments package list is %d bytes, more than the 4 MiB read".format(content().length()))
              } else if this.success.or(false) != true {
                throw("Open Data BCN refused the equipaments package list")
              } else if $found.length() == 0 {
                throw("Open Data BCN lists none of the equipaments families: nothing is written")
              } else { $found }
          - unarchive: { format: json_array }

          # One family a request. The resource id is checked against the UUID form above before it
          # goes into the query, so no text of the portal's answer reaches the SQL.
          - branch:
              request_map: |
                let columns = "replace(register_id, U&'\\FEFF', '') AS id, name, to_char(modified, 'YYYY-MM-DD\"T\"HH24:MI:SS') AS modified, addresses_road_name AS street, addresses_start_street_number::text AS num, to_char(addresses_zip_code, 'FM00000') AS zip, addresses_town AS town, addresses_district_name AS district, addresses_main_address AS main, geo_epgs_4326_lat::text AS lat, geo_epgs_4326_lon::text AS lon, " + (if this.kind { "secondary_filters_name AS kind, array_agg(secondary_filters_name) OVER (PARTITION BY register_id)" } else { "NULL::text AS kind, ARRAY[]::text[]" }) + " AS kinds, CASE WHEN values_category = 'Telèfons' AND values_value ~ '[0-9]' THEN values_value END AS phone"
                meta sql = ("SELECT DISTINCT ON (id) * FROM (SELECT " + $columns + " FROM \"" + this.resource + "\") t ORDER BY id, main = 'True' DESC, phone IS NULL, kind LIMIT 20000").escape_url_query()
                root = ""
              processors:
                - sleep: { duration: '300ms' }
                - http:
                    url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/datastore_search_sql?sql=${! @sql }
                    verb: GET
                    headers:
                      Accept: application/json
                      User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public open data)
                    timeout: 60s
                    retries: 2
              result_map: |
                root.records = if content().length() > 16777216 {
                  throw("the family answer is over 16 MiB")
                } else if this.success.or(false) != true {
                  throw("Open Data BCN refused the query: %s".format(this.error.format_json(no_indent: true).or("no reason given")))
                } else if this.result.records.or([]).length() >= 20000 {
                  throw("the family answered %d rows, the LIMIT 20000 of its query: raise it, or the rows past it are dropped".format(this.result.records.length()))
                } else { this.result.records.or([]) }
          # A family the portal refuses is logged and left out of this run; the others still write.
          - catch:
              - log:
                  level: WARN
                  message: 'equipaments: ${! json("package") } not read: ${! error() }'
          - archive: { format: json_array }

          # The whole register at once: a facility listed in two families is one PointOfInterest, the
          # first family's. A register whose newest change is older than three weeks (three of its
          # weekly updates) is stale and fails the run.
          - mapping: |
              let rows = this.map_each(f -> f.records.or([]).map_each(r -> r.assign({ "family": f.family, "package": f.package }))).flatten()
              let newest = $rows.map_each(r -> r.modified.or("")).sort().index(-1).or("")
              let floor = now().ts_sub_iso8601("P21D").ts_format("2006-01-02T15:04:05", "Europe/Madrid")
              root = if $rows.length() == 0 {
                throw("the equipaments families list no facility: nothing is written")
              } else if $newest < $floor {
                throw("the Barcelona equipaments are stale: the newest change is %s, more than three weeks old".format($newest))
              } else { $rows }

          # Plausibility (owner 2026-10-22T18:10Z): dropped and counted by reason, never guessed at: no
          # position; a point outside Barcelona and 1 km around it (the register's missing geometry
          # converts to a point near 0,0); no name; one facility under two ids (same name, same place
          # within 20 m); a facility listed in a second family is kept once, with the families and
          # kinds of every listing (T-5692: one kind a facility hid 51 of 52 municipal libraries).
          - mapping: |
              # Two rows are one place when their names match and they lie within 20 m (owner
              # 2026-10-22T18:10Z): rows sorted by name, each compared with the kept points of its name.
              map near {
                let lat = this.value.lat.number()
                let lon = this.value.lon.number()
                let pts = if this.tally.name == this.value._key { this.tally.pts } else { [] }
                # Metres at Barcelona's latitude: 111,320 m a degree north, 83,520 m a degree east.
                let near = $pts.any(p -> (p.index(0) - $lat) * (p.index(0) - $lat) * 12392142400 + (p.index(1) - $lon) * (p.index(1) - $lon) * 6975590400 <= 400)
                root = if $near { this.tally.assign({ "dup": this.tally.dup.append(this.value.id) }) } else {
                  { "name": this.value._key, "pts": $pts.append([$lat, $lon]), "dup": this.tally.dup }
                }
              }
              map reason {
                let lat = this.lat.or("").number().catch(null)
                let lon = this.lon.or("").number().catch(null)
                root = if $lat == null || $lon == null { "no position" }
                  else if $lon < 2.04 || $lon > 2.24 || $lat < 41.3 || $lat > 41.48 { "outside Barcelona" }
                  else if !this.id.or("").re_match("^[0-9]{1,20}$") { "no id" }
                  else if this.name.or("").trim() == "" { "no name" }
                  else { null }
              }
              let rows = this.map_each(e -> e.assign({ "_drop": e.apply("reason") }))
              let usable = $rows.filter(e -> e._drop == null)
              let once = $usable.unique(e -> e.id)
              let keyed = $once.map_each(e -> e.assign({ "_key": e.name.trim().lowercase() })).sort_by(e -> e._key)
              let dup = $keyed.fold({ "name": "", "pts": [], "dup": [] }, item -> item.apply("near")).dup
              # squash concatenates the arrays of one id's listings: every family and kind it has.
              let listed = $usable.map_each(e -> { (e.id): { "families": [e.family], "kinds": e.kinds.or([]) } }).squash()
              let kept = $once.filter(e -> !$dup.contains(e.id)).map_each(e -> e.assign({ "_listed": $listed.get(e.id) }))
              let tally = $rows.filter(e -> e._drop != null).fold({}, item -> item.tally.assign({ item.value._drop: item.tally.get(item.value._drop).or(0) + 1 }))
              let second = $usable.length() - $once.length()
              let dups = $once.length() - $kept.length()
              let counted = if $second > 0 { $tally.assign({ "listed in a second family": $second }) } else { $tally }
              meta dropped = (if $dups > 0 { $counted.assign({ "duplicate": $dups }) } else { $counted }).format_json(no_indent: true)
              meta kept = $kept.length().string()
              root = $kept.map_each(e -> e.without("_drop", "kinds"))
          - log:
              level: INFO
              message: 'equipaments: ${! @kept } facilities kept, dropped by reason ${! @dropped }'
          - unarchive: { format: json_array }

          - mapping: |
              # The domain comes from the deployment, never from this file (PF-44); the register's
              # register_id is the local id, the one the agendas' venues share.
              # The register writes 9999 for a place with no street number (97 of them on 2026-10-23).
              let street = [this.street.or("").trim(), this.num.or("").trim()].filter(s -> s != "" && s != "9999").join(" ")
              let town = this.town.or("").trim()
              let phone = this.phone.or("").trim()
              let kinds = this._listed.kinds.filter(k -> k != null).map_each(k -> k.string().trim()).filter(k -> k != "").unique().sort()
              root = {
                "id": "urn:ngsi-ld:%v:%v:%v:%v".format("PointOfInterest", env("JC_ORG_DOMAIN"), env("JC_SPACE"), this.id),
                "type": "PointOfInterest",
                "name": { "type": "Property", "value": this.name.trim() },
                # The first family's code, the other families' codes, then the register's own kinds in
                # Catalan ("Biblioteques", "Biblioteques municipals").
                "category": { "type": "Property", "value": [this.family].concat(this._listed.families).concat($kinds).unique() },
                "location": { "type": "GeoProperty", "value": {
                  "type": "Point", "coordinates": [(this.lon.number() * 1000000).round() / 1000000, (this.lat.number() * 1000000).round() / 1000000]
                } },
                "address": { "type": "Property", "value": {
                  "streetAddress": $street,
                  "postalCode": this.zip.or(""),
                  "addressLocality": if $town.uppercase() == "BARCELONA" || $town == "" { "Barcelona" } else { $town },
                  "district": this.district.or("").trim(),
                  "addressCountry": "ES"
                }.filter(entry -> entry.value != "") },
                "contactPoint": if $phone == "" || !$phone.re_match("^[0-9 .+()/-]{6,40}$") { null } else {
                  { "type": "Property", "value": { "telephone": $phone } }
                },
                "source": { "type": "Property", "value": "https://opendata-ajuntament.barcelona.cat/data/dataset/" + this.package }
              }
              root = root.filter(entry -> entry.value != null)

          - split: { size: 500 }
          - archive: { format: json_array }
    projects__barcelona__pipelines__local-trees__bento.yaml: |
      # The mapping of the local-trees pipeline (PL-03, T-5413): one PointOfInterest per tree of local
      # interest of Open Data BCN (dataset arbres-interes-local, 208 trees on 2026-10-23), read from the
      # DataStore of its CSV as the bcn-local-trees DataSource's one SQL query answers it: the register
      # id, the name the city gives the tree (species and place, "Tipuanes de la plaça Sant Felip Neri"),
      # its address, district and point in WGS84. The id carries the prefix local-tree-, so a tree never
      # meets a facility of the same register (equipaments) and the Endpoint local-trees reads them by
      # idPattern. Written: name, category [environment, local-interest-tree], location, address and
      # source.
      #
      # Plausibility (owner 2026-10-22): a row whose id is no number or with no name, whose point is no
      # number or lies outside the municipality's 1 km margin (the space's in-area bbox), and a second
      # row of one id or of one point (within ~1 m, 5 decimals of a degree) are each dropped and counted
      # by reason in `dropped`, which the next step logs. An answer the portal refuses, or one with no
      # tree at all, fails the run, so the trees stand instead of going quiet. `expiresAt`: a tree the
      # register drops leaves every read three weeks (three weekly runs) after it was last listed.

      pipeline:
        processors:
          - mapping: |
              let bbox = [2.04, 41.3, 2.24, 41.48]
              let rows = if content().length() > 2097152 {
                throw("the trees answer is %d bytes, more than the 2 MiB read".format(content().length()))
              } else if this.success.or(false) != true {
                throw("Open Data BCN refused the trees query: %s".format(this.error.format_json(no_indent: true).or("no reason given")))
              } else if this.result.records.or([]).length() >= 1000 {
                throw("the trees answered %d rows, the LIMIT 1000 of its query: raise it, or the rows past it are dropped".format(this.result.records.length()))
              } else { this.result.records.or([]) }
              let placed = $rows.map_each(r -> {
                "id": r.id.or("").string().trim(),
                "name": r.name.or("").string().trim(),
                "street": [r.street.or("").string().trim(), r.num.or("").string().trim()].filter(s -> s != "" && s != "9999").join(" "),
                "district": r.district.or("").string().trim(),
                "lon": r.lon.or("").string().trim().number().catch(null),
                "lat": r.lat.or("").string().trim().number().catch(null)
              })
              let coded = $placed.filter(t -> t.id.re_match("^[0-9]{1,20}$") && t.name != "")
              let pointed = $coded.filter(t -> t.lon != null && t.lat != null)
              let inside = $pointed.filter(t -> t.lon >= $bbox.index(0) && t.lon <= $bbox.index(2) && t.lat >= $bbox.index(1) && t.lat <= $bbox.index(3))
              # One tree per id, then per ~1 m cell: sorted, so a repeat sits beside its first.
              let by_id = $inside.sort_by(t -> t.id)
              let ids = $by_id.enumerated().filter(e -> e.index == 0 || $by_id.index(e.index - 1).id != e.value.id).map_each(e -> e.value)
              let by_cell = $ids.map_each(t -> t.assign({ "cell": "%.5f %.5f".format(t.lon, t.lat) })).sort_by(t -> t.cell + " " + t.id)
              let unique = $by_cell.enumerated().filter(e -> e.index == 0 || $by_cell.index(e.index - 1).cell != e.value.cell).map_each(e -> e.value)
              root.dropped = {
                "noIdOrName": $placed.length() - $coded.length(),
                "noPoint": $coded.length() - $pointed.length(),
                "outsideTheCity": $pointed.length() - $inside.length(),
                "duplicateId": $inside.length() - $ids.length(),
                "samePoint": $ids.length() - $unique.length()
              }
              root.trees = if $unique.length() == 0 { throw("the trees answer holds no tree") } else { $unique.map_each(t -> t.without("cell")) }
          - log:
              level: INFO
              message: 'local trees: ${! json("trees").length() } written; dropped ${! json("dropped").format_json(no_indent: true) }'
          - mapping: root = this.trees
          - unarchive: { format: json_array }
          - mapping: |
              # The domain comes from the deployment, never from this file (PF-44); the run's clock is
              # bcn_now when a test sets it.
              let now = @bcn_now.or(now()).ts_parse("2006-01-02T15:04:05Z07:00").ts_unix()
              root = {
                "id": "urn:ngsi-ld:%v:%v:%v:local-tree-%v".format("PointOfInterest", env("JC_ORG_DOMAIN"), env("JC_SPACE"), this.id),
                "type": "PointOfInterest",
                "expiresAt": ($now + 21 * 86400).ts_format("2006-01-02T15:04:05Z", "UTC"),
                "name": { "type": "Property", "value": this.name },
                "category": { "type": "Property", "value": ["environment", "local-interest-tree"] },
                "location": { "type": "GeoProperty", "value": {
                  "type": "Point", "coordinates": [(this.lon * 1000000).round() / 1000000, (this.lat * 1000000).round() / 1000000]
                } },
                "address": { "type": "Property", "value": {
                  "streetAddress": this.street,
                  "addressLocality": "Barcelona",
                  "district": this.district,
                  "addressCountry": "ES"
                }.filter(entry -> entry.value != "") },
                "source": { "type": "Property", "value": "https://opendata-ajuntament.barcelona.cat/data/dataset/arbres-interes-local" }
              }
    projects__barcelona__pipelines__local-trees__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: local-trees
        namespace: barcelona
        title:
          ca: Arbres d'interès local de Barcelona, cada setmana
          es: Árboles de interés local de Barcelona, cada semana
          en: Barcelona trees of local interest, weekly
      spec:
        class: auto
        # The register changes a few trees a year (newest change 2026-09-15); a weekly run finds it.
        schedule: '35 6 * * 3'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-local-trees }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert, as the equipaments: both write PointOfInterest, so a replace would delete the other's.
        # A tree the register drops leaves by its expiresAt, three weeks after its last listing.
        output: { type: PointOfInterest, mode: upsert }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__ornamental-fountains__bento.yaml: "# The mapping of the ornamental-fountains pipeline (PL-03, T-5431): one PointOfInterest of category\n# ornamental-fountain per fountain of Open Data BCN's register (dataset fonts-ornamentals,\n# the newest file: fonts_ornamentals_2026.csv, a new file each March): CODI (district and number, 01-001), NOM (the\n# code first in 239 of 335 rows on 2026-10-23, \"01-001. Font d'Emili Vendrell\": the code is cut\n# off), ADREÇA, NOM_DISTRICTE and WGS84 LONGITUD/LATITUD. `expiresAt`: a fountain the file drops\n# leaves every read three weeks (three update periods) after the file last listed it.\n#\n# Plausibility (owner 2026-10-22): a row with no code of the form 00-000, a point that is no number\n# or lies outside the municipality's 1 km margin (the space's in-area bbox) and a second row of one\n# code are dropped, each counted by reason in `dropped`, which the next step logs. A file over 2 MiB\n# or 10,000 rows (67 kB and 335 rows on 2026-10-23) is refused, and a file with no fountain at all\n# fails the run, so the fountains stand instead of going quiet.\n\npipeline:\n  processors:\n    # The DataSource answers the package (package_show?id=fonts-ornamentals). The city adds a new file each\n    # March under a new name and keeps the old ones, so the run reads the newest CSV resource of\n    # the package, never a fixed file; only a download on Open Data BCN's own host is fetched. A\n    # package whose newest file is more than 13 months old (one missed March) fails the run.\n    - mapping: |\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\")\n        let files = if content().length() > 1048576 { throw(\"the fonts-ornamentals package answer is %d bytes, more than the 1 MiB read\".format(content().length())) } else if this.success.or(false) != true { throw(\"Open Data BCN refused the fonts-ornamentals package\") } else { this.result.resources.or([]) }\n        let newest = $files.filter(r -> r.format.or(\"\") == \"CSV\" && r.url.or(\"\").re_match(\"^https://opendata-ajuntament[.]barcelona[.]cat/data/dataset/[0-9a-f-]{36}/resource/[0-9a-f-]{36}/download/[A-Za-z0-9_.-]+[.]csv$\")).sort_by(r -> r.last_modified.or(\"\")).index(-1).or(null)\n        let floor = $now.ts_sub_iso8601(\"P13M\").ts_format(\"2006-01-02T15:04:05\", \"UTC\")\n        meta file = if $newest == null { throw(\"the fonts-ornamentals package lists no CSV file on Open Data BCN\") } else if $newest.last_modified.or(\"\") < $floor { throw(\"the newest ornamental fountains file is from %s, more than 13 months old\".format($newest.last_modified.or(\"an unknown day\"))) } else { $newest.url.trim_prefix(\"https://opendata-ajuntament.barcelona.cat/data/dataset/\") }\n        root = \"\"\n    - http:\n        url: https://opendata-ajuntament.barcelona.cat/data/dataset/${! @file }\n        verb: GET\n        headers:\n          Accept: text/csv\n          User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public open data)\n        timeout: 60s\n        retries: 2\n    - mapping: |\n        root = if errored() { throw(\"the ornamental fountains file was not read: %s\".format(error())) } else { content() }\n    - mapping: |\n        let text = if content().length() > 2097152 { throw(\"the fountains file is %d bytes, more than the 2 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        let bbox = [2.04, 41.3, 2.24, 41.48]\n        let rows = $text.parse_csv(true, \",\")\n        let read = if $rows.length() > 10000 { throw(\"the fountains file holds %d rows, more than the 10,000 read\".format($rows.length())) } else { $rows }\n        let coded = $read.filter(r -> r.CODI.or(\"\").trim().re_match(\"^[0-9]{2}-[0-9]{3}$\"))\n        let placed = $coded.map_each(r -> {\n          \"id\": r.CODI.trim(),\n          \"name\": r.NOM.or(\"\").trim().re_replace_all(\"^[0-9]{2}-[0-9]{3}[.]? *\", \"\"),\n          \"street\": r.get(\"ADREÇA\").or(\"\").trim(),\n          \"district\": r.NOM_DISTRICTE.or(\"\").trim(),\n          \"lon\": r.LONGITUD.or(\"\").trim().number().catch(null),\n          \"lat\": r.LATITUD.or(\"\").trim().number().catch(null)\n        }).filter(f -> f.lon != null && f.lat != null)\n        let inside = $placed.filter(f -> f.lon >= $bbox.index(0) && f.lon <= $bbox.index(2) && f.lat >= $bbox.index(1) && f.lat <= $bbox.index(3))\n        # One fountain per code: sorted, so a repeat sits beside its first.\n        let by_id = $inside.sort_by(f -> f.id)\n        let unique = $by_id.enumerated().filter(e -> e.index == 0 || $by_id.index(e.index - 1).id != e.value.id).map_each(e -> e.value)\n        root.dropped = {\n          \"noCode\": $read.length() - $coded.length(),\n          \"noPoint\": $coded.length() - $placed.length(),\n          \"outsideTheCity\": $placed.length() - $inside.length(),\n          \"duplicateCode\": $inside.length() - $unique.length()\n        }\n        root.fountains = if $unique.length() == 0 { throw(\"the fountains file holds no fountain\") } else { $unique }\n    - log:\n        level: INFO\n        message: 'ornamental fountains: ${! json(\"fountains\").length() } written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.fountains\n    - unarchive: { format: json_array }\n    - mapping: |\n        # The run's clock (a test sets bcn_now to read a recorded file as of its own day).\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix()\n        root = {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:ornamental-fountain-%v\".format(\"PointOfInterest\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), this.id),\n          \"type\": \"PointOfInterest\",\n          \"expiresAt\": ($now + 21 * 86400).ts_format(\"2006-01-02T15:04:05Z\", \"UTC\"),\n          \"name\": { \"type\": \"Property\", \"value\": if this.name != \"\" { this.name } else { \"Font ornamental \" + this.id } },\n          \"category\": { \"type\": \"Property\", \"value\": [\"ornamental-fountain\"] },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": \"Point\", \"coordinates\": [this.lon, this.lat] } },\n          \"address\": { \"type\": \"Property\", \"value\": {\n            \"streetAddress\": this.street,\n            \"addressLocality\": \"Barcelona\",\n            \"district\": this.district,\n            \"addressCountry\": \"ES\"\n          }.filter(entry -> entry.value != \"\") },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/fonts-ornamentals\" }\n        }\n"
    projects__barcelona__pipelines__pedestrian-crossings__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: pedestrian-crossings
        namespace: barcelona
        title:
          ca: Passos de vianants de Barcelona, cada setmana
          es: Pasos de peatones de Barcelona, cada semana
          en: Barcelona pedestrian crossings, weekly
      spec:
        class: auto
        # The city rewrites the file weekly (last-modified Tuesday 02:00 UTC on 2026-10-20).
        schedule: '20 5 * * 2'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-pedestrian-crossings }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert: a crossing the file drops or marks as gone leaves by its expiresAt, three weeks after
        # its last listing (T-5264).
        output: { type: PedestrianCrossing, mode: upsert }
        # The whole 5.1 MB file ran in 160 MiB on 2026-10-23 (128 was too little); 192 leaves room for its growth.
        quotas: { maxMemoryMb: 192, cpuMillicores: 200 }
    projects__barcelona__pipelines__tourist-flats__bento.yaml: "# The mapping of the tourist-flats pipeline (PL-03, T-5417): one TouristRental per licensed tourist\n# flat (habitatge d'ús turístic, HUT) of Open Data BCN's register (dataset habitatges-us-turistic,\n# the DataStore resource hut_comunicacio_opendata.csv, CC BY 4.0): the licence file N_EXPEDIENT as\n# the id, the places (NUMERO_PLACES) as `capacity`, the Generalitat's tourism register number\n# (NUMERO_REGISTRE_GENERALITAT, HUTB-nnnnnn), the street and number, the district and barri, and\n# the WGS84 point LONGITUD_X/LATITUD_Y the city geocodes from that address.\n#\n# Privacy (T-5417): BLOC, PORTAL, ESCALA, PIS and PORTA locate one household inside a building and\n# are never read past the parse; the address stops at the street and number and the point is the\n# building's, rounded to 6 decimals (0.1 m, the city's 14 add nothing). No holder is in the file.\n#\n# Plausibility (owner 2026-10-22): a row with no licence id of the form 01-2009-0354, a point that\n# is no number or lies outside the municipality's 1 km margin (the space's in-area bbox), a second\n# row of one licence and a second licence holding a register number already taken are dropped; a\n# place count that is missing or outside 1..100 (the register's largest is 79 on 2026-10-23) and a\n# register number not of the form HUTB-nnnnnn once its blanks are gone (`HUTB- 077183`\n# is read as HUTB-077183) are left out of the entity. Each is counted by reason\n# in `dropped`, which the next step logs. A file with no licence fails the run, and so does one\n# whose newest licence file is older than last year (the city opens files each month: 221 in 2025,\n# 21 by 2026-10-01), so the flats stand instead of going stale. `expiresAt`: a licence the file\n# drops leaves every read three weeks (three update periods) after the file last listed it.\n\npipeline:\n  processors:\n    - mapping: |\n        let text = if content().length() > 4194304 { throw(\"the tourist flats file is %d bytes, more than the 4 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        let bbox = [2.04, 41.3, 2.24, 41.48]\n        let year = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_format(\"2006\", \"UTC\").number()\n        let head = $text.split(\"\\n\").index(0).or(\"\").trim()\n        let columns = [\"N_EXPEDIENT\", \"NOM_DISTRICTE\", \"NOM_BARRI\", \"TIPUS_CARRER\", \"CARRER\", \"NUM1\", \"LLETRA1\", \"NUM2\", \"LLETRA2\", \"NUMERO_REGISTRE_GENERALITAT\", \"NUMERO_PLACES\", \"LONGITUD_X\", \"LATITUD_Y\"]\n        let rows = if $columns.any(c -> !$head.split(\",\").contains(c)) { throw(\"the tourist flats file lacks a column of %s\".format($columns.join(\", \"))) } else { $text.parse_csv(true, \",\") }\n        let coded = $rows.filter(r -> r.N_EXPEDIENT.or(\"\").trim().re_match(\"^[0-9]{2}-[0-9]{4}-[0-9]{4}$\"))\n        let placed = $coded.map_each(r -> {\n          \"id\": r.N_EXPEDIENT.trim(),\n          \"street\": r.TIPUS_CARRER.or(\"\").trim() + \" \" + r.CARRER.or(\"\").trim(),\n          \"number\": r.NUM1.or(\"\").trim() + r.LLETRA1.or(\"\").trim() + if r.NUM2.or(\"\").trim() == \"\" { \"\" } else { \"-\" + r.NUM2.trim() + r.LLETRA2.or(\"\").trim() },\n          \"district\": r.NOM_DISTRICTE.or(\"\").trim(),\n          \"barri\": r.NOM_BARRI.or(\"\").trim(),\n          \"register\": r.NUMERO_REGISTRE_GENERALITAT.or(\"\").re_replace_all(\"[\\\\s\\\\x{00A0}]+\", \"\").uppercase(),\n          \"places\": r.NUMERO_PLACES.or(\"\").trim().number().catch(null),\n          \"lon\": r.LONGITUD_X.or(\"\").trim().number().catch(null),\n          \"lat\": r.LATITUD_Y.or(\"\").trim().number().catch(null)\n        }).filter(l -> l.lon != null && l.lat != null)\n        let inside = $placed.filter(l -> l.lon >= $bbox.index(0) && l.lon <= $bbox.index(2) && l.lat >= $bbox.index(1) && l.lat <= $bbox.index(3))\n        # One flat per licence, then per register number: sorted, so a repeat sits beside its first.\n        let by_id = $inside.sort_by(l -> l.id)\n        let ids = $by_id.enumerated().filter(e -> e.index == 0 || $by_id.index(e.index - 1).id != e.value.id).map_each(e -> e.value)\n        let by_register = $ids.sort_by(l -> (if l.register == \"\" { \"~\" + l.id } else { l.register }) + \" \" + l.id)\n        let unique = $by_register.enumerated().filter(e -> e.index == 0 || e.value.register == \"\" || $by_register.index(e.index - 1).register != e.value.register).map_each(e -> e.value)\n        let newest = $unique.map_each(l -> l.id.slice(3, 7).number()).sort().index(-1).or(0)\n        root.dropped = {\n          \"noLicenceId\": $rows.length() - $coded.length(),\n          \"noPoint\": $coded.length() - $placed.length(),\n          \"outsideTheCity\": $placed.length() - $inside.length(),\n          \"duplicateLicence\": $inside.length() - $ids.length(),\n          \"duplicateRegisterNumber\": $ids.length() - $unique.length(),\n          \"placesMissing\": $unique.filter(l -> l.places == null).length(),\n          \"placesOutOfRange\": $unique.filter(l -> l.places != null && (l.places < 1 || l.places > 100 || l.places.round() != l.places)).length(),\n          \"registerNumberMalformed\": $unique.filter(l -> l.register != \"\" && !l.register.re_match(\"^HUTB-[0-9]{6}$\")).length()\n        }\n        root.flats = if $unique.length() == 0 { throw(\"the tourist flats file holds no licence\") } else if $newest < $year - 1 { throw(\"the tourist flats file is stale: its newest licence file is from %v\".format($newest)) } else { $unique }\n    - log:\n        level: INFO\n        message: 'tourist flats: ${! json(\"flats\").length() } written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.flats\n    - unarchive: { format: json_array }\n    - mapping: |\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix()\n        let register = if this.register.re_match(\"^HUTB-[0-9]{6}$\") { this.register } else { null }\n        # The run's clock: a test sets bcn_now to read a recorded file as of its own day.\n        root = {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:%v\".format(\"TouristRental\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), this.id),\n          \"type\": \"TouristRental\",\n          \"expiresAt\": ($now + 21 * 86400).ts_format(\"2006-01-02T15:04:05Z\", \"UTC\"),\n          \"name\": { \"type\": \"Property\", \"value\": \"Habitatge d'ús turístic %v\".format($register.or(this.id)) },\n          \"capacity\": if this.places == null || this.places < 1 || this.places > 100 || this.places.round() != this.places { null } else { { \"type\": \"Property\", \"value\": this.places.int64() } },\n          \"registerNumber\": if $register == null { null } else { { \"type\": \"Property\", \"value\": $register } },\n          \"address\": { \"type\": \"Property\", \"value\": {\n            \"streetAddress\": if this.number == \"\" { this.street } else { this.street + \", \" + this.number },\n            \"district\": this.district,\n            \"addressLocality\": \"Barcelona\",\n            \"addressCountry\": \"ES\"\n          }.filter(entry -> entry.value != \"\") },\n          \"areaServed\": if this.barri == \"\" { null } else { { \"type\": \"Property\", \"value\": this.barri } },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": \"Point\", \"coordinates\": [(this.lon * 1000000).round() / 1000000, (this.lat * 1000000).round() / 1000000] } },\n          \"dataProvider\": { \"type\": \"Property\", \"value\": \"Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)\" },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/habitatges-us-turistic\" }\n        }.filter(entry -> entry.value != null)\n"
    projects__barcelona__pipelines__weather__bento.yaml: "# The mapping of the weather pipeline (PL-03, T-5263): one WeatherObserved per station of the\n# Catalan weather service (Meteocat, XEMA network) inside Barcelona, with the newest day's values.\n# The source is Open Data BCN's <year>_MeteoCat_Detall_Estacions.csv (dataset\n# mesures-estacions-meteorologiques, rewritten every night at about 03:00 UTC): one row per day,\n# station and variable (ACRÒNIM) since 1 January, the day in DATA_LECTURA, the time of an extreme in\n# DATA_EXTREM. The stations' names and places are not in it; they are listed here, read from the\n# dataset metadades-estacions-meteorologiques (2020_MeteoCat_Estacions.csv, 2026-10-23). That list\n# gives el Raval (X4) district Sarrià-Sant Gervasi and Zona Universitària (X8) district Ciutat\n# Vella and barri Sant Gervasi - Galvany: the two rows carry each other's districts (el Raval is in\n# Ciutat Vella; the UB tracks at 41.37919, 2.1054 lie in les Corts), so they are written as the\n# coordinates place them and X8 carries no barri. Zoo (X2) is in the list and has no row in 2026.\n#\n# Variables written, in Smart Data Models' names and units: TM temperature (mean, °C), TX and TN\n# maxTemperature and minTemperature (°C, properties of this model), HRM relativeHumidity (mean, %\n# as a 0..1 fraction), PM atmosphericPressure (mean at the station's height, hPa), PPT\n# precipitation (mm = l/m² of the day), VVM10 and DVM10 windSpeed (m/s) and windDirection (°, the\n# day's means at 10 m), VVX10 gustSpeed (the day's strongest gust, m/s) and RS24h solarRadiation\n# (the day's global irradiation in MJ/m², written as the day's mean irradiance in W/m²: x 1e6 /\n# 86400). Left out: the humidity and pressure extremes (HRX, HRN, PX, PN) and the gust direction\n# (DVVX10), which the model has no attribute for.\n#\n# Plausibility (owner 2026-10-22): a variable not listed above, a station not listed, a value that\n# is no number or outside its physical range, a day more than a day ahead, and a second row for one\n# station, variable and day are each dropped and counted by reason in `dropped`, which the next\n# step logs. A file with no valid value, or whose newest day ended more than four days ago (the\n# city's one-day delay plus three update periods), fails the run and leaves the entities as they\n# were. The file is one per year: on 1 January the city opens a new resource, this one stops\n# moving and the run fails as stale until the DataSource names the new year's file.\n# ponytail: one resource id per year, the DataSource is moved each January; upgrade path: resolve\n# the newest resource through package_show in the mapping, as soon as the runner tests mappings\n# with an http step offline.\n\npipeline:\n  processors:\n    - mapping: |\n        let text = if content().length() > 2097152 { throw(\"the daily file is %d bytes, more than the 2 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        # The run's clock; a test sets bcn_now to read a recorded file as of its own day.\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix()\n        let stations = {\n          \"D5\": { \"name\": \"Barcelona - Observatori Fabra\", \"street\": \"Observatori Fabra\", \"district\": \"Sarrià-Sant Gervasi\", \"barri\": \"Vallvidrera, el Tibidabo i les Planes\", \"altitude\": 411, \"coordinates\": [2.12379, 41.41864] },\n          \"X2\": { \"name\": \"Barcelona - Zoo\", \"street\": \"Zoo\", \"district\": \"Ciutat Vella\", \"barri\": \"Sant Pere, Santa Caterina i la Ribera\", \"altitude\": 7, \"coordinates\": [2.18847, 41.38943] },\n          \"X4\": { \"name\": \"Barcelona - el Raval\", \"street\": \"Facultat de Geografia i Història. c. Montalegre nº6, 6a\", \"district\": \"Ciutat Vella\", \"barri\": \"el Raval\", \"altitude\": 33, \"coordinates\": [2.16775, 41.3839] },\n          \"X8\": { \"name\": \"Barcelona - Zona Universitària\", \"street\": \"Pistes UB\", \"district\": \"les Corts\", \"altitude\": 79, \"coordinates\": [2.1054, 41.37919] }\n        }\n        # acronym -> attribute, UN/CEFACT unit, physical range, and the factor that turns the file's\n        # unit into the model's.\n        let variables = {\n          \"TM\": { \"attribute\": \"temperature\", \"unit\": \"CEL\", \"min\": -40, \"max\": 50 },\n          \"TX\": { \"attribute\": \"maxTemperature\", \"unit\": \"CEL\", \"min\": -40, \"max\": 50 },\n          \"TN\": { \"attribute\": \"minTemperature\", \"unit\": \"CEL\", \"min\": -40, \"max\": 50 },\n          \"HRM\": { \"attribute\": \"relativeHumidity\", \"unit\": \"C62\", \"min\": 0, \"max\": 100, \"factor\": 0.01 },\n          \"PM\": { \"attribute\": \"atmosphericPressure\", \"unit\": \"A97\", \"min\": 850, \"max\": 1100 },\n          \"PPT\": { \"attribute\": \"precipitation\", \"unit\": \"MMT\", \"min\": 0, \"max\": 500 },\n          \"VVM10\": { \"attribute\": \"windSpeed\", \"unit\": \"MTS\", \"min\": 0, \"max\": 60 },\n          \"DVM10\": { \"attribute\": \"windDirection\", \"unit\": \"DD\", \"min\": 0, \"max\": 360 },\n          \"VVX10\": { \"attribute\": \"gustSpeed\", \"unit\": \"MTS\", \"min\": 0, \"max\": 90 },\n          \"RS24h\": { \"attribute\": \"solarRadiation\", \"unit\": \"D54\", \"min\": 0, \"max\": 45, \"factor\": 11.574074074074074 }\n        }\n        let rows = $text.parse_csv(true, \",\").map_each(r -> {\n          \"station\": r.CODI_ESTACIO.or(\"\").trim(),\n          \"variable\": r.get(\"ACRÒNIM\").or(\"\").trim(),\n          \"day\": r.DATA_LECTURA.or(\"\").trim(),\n          \"value\": r.VALOR.or(\"\").trim().number().catch(null)\n        })\n        let known = $rows.filter(r -> $stations.exists(r.station) && $variables.exists(r.variable))\n        # One row per station, variable and day; a repeated row is a duplicate, its first stands.\n        let keyed = $known.enumerated().map_each(e -> e.value.assign({ \"key\": \"%v|%v|%v\".format(e.value.station, e.value.variable, e.value.day), \"position\": e.index }))\n        let first = $keyed.fold({}, item -> if item.tally.exists(item.value.key) { item.tally } else { item.tally.assign({ item.value.key: item.value.position }) })\n        let unique = $keyed.filter(r -> $first.get(r.key) == r.position)\n        # The day's end, local midnight, as UTC: the day read as UTC plus a day, less Madrid's offset.\n        let timed = $unique.map_each(r -> r.assign({ \"naive\": (r.day + \"T00:00:00Z\").ts_parse(\"2006-01-02T15:04:05Z07:00\").catch(null) })).map_each(r -> if r.naive == null { r.assign({ \"instant\": null }) } else {\n          r.assign({ \"instant\": r.naive.ts_unix() + 86400 - (r.naive.ts_unix() + 86400).ts_format(\"-07\", \"Europe/Madrid\").number() * 3600 })\n        })\n        let dated = $timed.filter(r -> r.instant != null)\n        let numeric = $dated.filter(r -> r.value != null)\n        let ranged = $numeric.filter(r -> r.value >= $variables.get(r.variable).min && r.value <= $variables.get(r.variable).max)\n        let valid = $ranged.filter(r -> r.instant <= $now + 86400)\n        let newest = $valid.map_each(r -> r.instant).sort().index(-1).catch(null)\n        root.dropped = {\n          \"unknownStationOrVariable\": $rows.length() - $known.length(),\n          \"duplicateRow\": $known.length() - $unique.length(),\n          \"notADate\": $unique.length() - $dated.length(),\n          \"notANumber\": $dated.length() - $numeric.length(),\n          \"outOfRange\": $numeric.length() - $ranged.length(),\n          \"inTheFuture\": $ranged.length() - $valid.length()\n        }\n        let by_station = if $newest == null { throw(\"the daily file holds no valid value of a known station\") } else if $newest < $now - 4 * 86400 { throw(\"the newest day of the daily file ended %v, more than four days ago\".format($newest.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\"))) } else {\n          $valid.sort_by(r -> r.instant).fold({}, item -> item.tally.assign({ item.value.station + \"|\" + item.value.variable: item.value })).values().fold({}, item -> item.tally.assign({ item.value.station: item.tally.get(item.value.station).or([]).append(item.value) }))\n        }\n        root.entities = $by_station.key_values().sort_by(s -> s.key).map_each(s -> $stations.get(s.key).assign({ \"code\": s.key, \"readings\": s.value })).map_each(st -> {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:meteocat-%v\".format(\"WeatherObserved\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), st.code),\n          \"type\": \"WeatherObserved\",\n          \"name\": { \"type\": \"Property\", \"value\": st.name },\n          \"stationCode\": { \"type\": \"Property\", \"value\": st.code },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": \"Point\", \"coordinates\": st.coordinates } },\n          \"altitude\": { \"type\": \"Property\", \"value\": st.altitude },\n          \"address\": { \"type\": \"Property\", \"value\": { \"streetAddress\": st.street, \"addressLocality\": \"Barcelona\", \"district\": st.district, \"addressCountry\": \"ES\" } },\n          \"areaServed\": if st.barri.or(null) == null { deleted() } else { { \"type\": \"Property\", \"value\": st.barri } },\n          \"dateObserved\": { \"type\": \"Property\", \"value\": st.readings.map_each(r -> r.instant).sort().index(-1).ts_format(\"2006-01-02T15:04:05Z\", \"UTC\") },\n          \"dataProvider\": { \"type\": \"Property\", \"value\": \"Ajuntament de Barcelona, Open Data BCN, from Meteocat (CC BY 4.0)\" },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/mesures-estacions-meteorologiques\" }\n        }.merge(st.readings.fold({}, item -> item.tally.assign({ $variables.get(item.value.variable).attribute: {\n          \"type\": \"Property\", \"value\": ((item.value.value * $variables.get(item.value.variable).factor.or(1)) * 1000).round() / 1000,\n          \"unitCode\": $variables.get(item.value.variable).unit,\n          \"observedAt\": item.value.instant.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\")\n        } }))))\n    - log:\n        level: INFO\n        message: 'weather: ${! json(\"entities\").length() } stations written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.entities\n"
    projects__barcelona__spaces__barcelona__datamodels__barcelona.v1.example.jsonld: |
