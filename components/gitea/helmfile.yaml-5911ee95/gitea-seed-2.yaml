  - from: '(?m)^[ \t]*- user: de300000-0000-4000-8000-[0-9a-f]{12}[^\n]*\n'
    to: ""
  - from: 'de300000-0000-4000-8000-[0-9a-f]{12}( # demo\.[a-z]+)?'
    to: fc3b55df-5fd4-4679-af5e-bb9dca22b0d7
