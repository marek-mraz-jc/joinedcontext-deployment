            EUR euros, MTK square metres) and the period's last day as `observedAt`, so the history
            holds one value per period.
          range: float
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Hodnota ukazovateľa
                cs: Hodnota ukazatele
                en: Indicator value
                de: Indikatorwert
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
        calculationPeriod:
          slot_uri: sdm:calculationPeriod
          description: The period the value covers, its first and last day.
          range: KpiPeriod
          inlined: true
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Obdobie výpočtu
                cs: Období výpočtu
                en: Calculation period
                de: Berechnungszeitraum
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
        from:
          slot_uri: sdm:from
          description: The first day of the period.
          range: date
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Od
                cs: Od
                en: From
                de: Von
              annotations: { generated: sk cs en de }
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
        to:
          slot_uri: sdm:to
          description: The last day of the period.
          range: date
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Do
                cs: Do
                en: To
                de: Bis
              annotations: { generated: sk cs en de }
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
        calculationFrequency:
          slot_uri: sdm:calculationFrequency
          description: How often the source publishes a new period.
          range: CalculationFrequency
          annotations:
            label:
              tag: label
              value:
                sk: Frekvencia výpočtu
                cs: Frekvence výpočtu
                en: Calculation frequency
                de: Berechnungshäufigkeit
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
        calculatedBy:
          slot_uri: sdm:calculatedBy
          description: The organization that computes the value.
          annotations:
            label:
              tag: label
              value:
                sk: Vypočítal
                cs: Vypočítal
                en: Calculated by
                de: Berechnet von
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
        organization:
          slot_uri: sdm:organization
          description: The organization the indicator describes.
          annotations:
            label:
              tag: label
              value:
                sk: Organizácia
                cs: Organizace
                en: Organization
                de: Organisation
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
        process:
          slot_uri: sdm:process
          description: The statistics dataset the value comes from, its Open Data BCN title in Catalan.
          annotations:
            label:
              tag: label
              value:
                sk: Proces
                cs: Proces
                en: Process
                de: Prozess
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
        area:
          slot_uri: sdm:area
          description: The name of the area the value describes, a barri, a district or the whole city.
          annotations:
            label:
              tag: label
              value:
                sk: Oblasť
                cs: Oblast
                en: Area
                de: Gebiet
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
        refArea:
          slot_uri: jc:refArea
          description: >-
            The district or barri (AdministrativeArea) the value describes; none for the whole city.
          range: AdministrativeArea
          inverse: indicators
          inlined: false
          annotations:
            label:
              tag: label
              value:
                sk: Územie
                cs: Území
                en: Area unit
                de: Gebietseinheit
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Relationship
            on_delete: restrict
        indicators:
          slot_uri: jc:indicators
          description: The statistics indicators of this district or barri, computed from their refArea and never stored.
          range: KeyPerformanceIndicator
          multivalued: true
          inverse: refArea
          inlined: false
          annotations:
            label:
              tag: label
              value:
                sk: Ukazovatele
                cs: Ukazatele
                en: Indicators
                de: Indikatoren
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Relationship
        statisticsTable:
          slot_uri: jc:statisticsTable
          description: The Open Data BCN dataset the value comes from, such as pad_mdbas, which `source` links to.
          pattern: ^[a-z0-9_-]+$
          annotations:
            label:
              tag: label
              value:
                sk: Štatistická tabuľka
                cs: Statistická tabulka
                en: Statistics table
                de: Statistiktabelle
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        dimensionKey:
          slot_uri: jc:dimensionKey
          description: >-
            Which breakdown of the dataset the value is: each kept column and its value as the source
            writes it, such as SEXE=2; total when the dataset has no breakdown.
          annotations:
            label:
              tag: label
              value:
                sk: Členenie
                cs: Členění
                en: Breakdown
                de: Aufschlüsselung
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property

      classes:
        AirQualityObserved:
          class_uri: sdm:AirQualityObserved
          description: One air-quality station of Barcelona and its hourly means.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.Environment
            label:
              tag: label
              value:
                sk: Meranie kvality ovzdušia
                cs: Měření kvality ovzduší
                en: Air quality reading
                de: Luftqualitätsmessung
          slots:
            - name
            - dateObserved
            - pm10
            - pm25
            - no2
            - o3
            - so2
            - co
            - 'no'
            - nox
            - blackCarbon
            - stationCode
            - address
            - areaServed
            - dataProvider
            - source
        WeatherObserved:
          class_uri: sdm:WeatherObserved
          description: One Meteocat weather station in Barcelona and its newest day's values.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.Weather
          slots:
            - name
            - dateObserved
            - temperature
            - maxTemperature
            - minTemperature
            - relativeHumidity
            - atmosphericPressure
            - precipitation
            - windSpeed
            - windDirection
            - gustSpeed
            - solarRadiation
            - stationCode
            - altitude
            - address
            - areaServed
            - dataProvider
            - source
        WeatherForecast:
          class_uri: sdm:WeatherForecast
          description: >-
            Meteocat's forecast for the comarca of Barcelonès, one entity per day ahead (day-1 tomorrow,
            day-2 the day after), as Open Data BCN republishes it.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.Weather
          slots:
            - name
            - dateIssued
            - validFrom
            - validTo
            - dayMaximum
            - dayMinimum
            - weatherType
            - address
            - areaServed
            - dataProvider
            - source
        PhreaticObserved:
          class_uri: sdm:PhreaticObserved
          description: One piezometer or well of Barcelona and its newest groundwater reading.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.Environment
          slots:
            - name
            - dateObserved
            - measurementType
            - waterTable
            - piezometricLevel
            - investigationDepth
            - aquifer
            - stationCode
            - address
            - areaServed
            - dataProvider
            - source
        TrafficFlowObserved:
          class_uri: sdm:TrafficFlowObserved
          description: >-
            One street section of the city's traffic-state network with its line, its state now and
            the state forecast for 15 minutes, every five minutes (Open Data BCN trams and
            transit-relacio-trams); one route of sections with its travel time (itineraris); or one
            traffic or bicycle counter with its mean working-day intensity of the newest month
            (aforaments-descriptiu and aforaments-detall).
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.Transportation
          slots:
            - name
            - dateObserved
            - congested
            - trafficState
            - trafficStateForecast
            - travelTime
            - usualTravelTime
            - intensity
            - dateObservedFrom
            - dateObservedTo
            - vehicleType
            - source
        OnStreetParking:
          class_uri: sdm:OnStreetParking
          description: >-
            One regulated surface parking section of B:SM (blue, green, residents, loading or coach
            zone), its curb lines, its places and its rate and timetable codes (Open Data BCN
            trams-aparcament-superficie).
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.Parking
          slots: [name, category, allowedVehicleType, totalSpotNumber, zoneCode, tariffCode, source]
          slot_usage:
            category: { range: StreetParkingCategory }
        EVChargingStation:
          class_uri: sdm:EVChargingStation
          description: >-
            One public charging point of the Endolla Barcelona network run by B:SM, its ports, socket
            kinds and how many are free now, every five minutes (Open Data BCN
            informacio-punts-recarrega-electric, which carries the port states of
            estat-ports-recarrega-electric too).
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.Transportation
          slots:
            - name
            - address
            - dateObserved
            - capacity
            - socketNumber
            - availableCapacity
            - socketType
            - allowedVehicleType
            - status
            - network
            - operator
            - openingHours
            - source
        AdministrativeArea:
          class_uri: jc:AdministrativeArea
          description: >-
            One district (10) or barri (73) of Barcelona, its outline and its code, as the Smart Data
            Model extension AdministrativeArea (PointOfInterest base).
          is_a: Entity
          annotations:
            upstream_source: https://github.com/marek-mraz/joinedcontext-deployment/blob/main/scripts/open-data/sdm/extensions/AdministrativeArea
          slots:
            - name
            - districtCode
            - divisionLevel
            - refParentDistrict
            - neighbourhoods
            - cityWorks
            - pedestrianCrossings
            - indicators
            - dataProvider
            - source
        CityWork:
          class_uri: sdm:CityWork
          description: >-
            One work on Barcelona's public space, in execution, stopped or finished within 30 days, with
            its outline, its dates and its promoter. The constructor is left out.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.Transportation
          slots:
            - name
            - description
            - workNumber
            - workState
            - workStateLabel
            - workCategory
            - startDate
            - endDate
            - contractingAuthority
            - tenderAmount
            - awardAmount
            - areaServed
            - territorialArea
            - refDistrict
            - seeAlso
            - dataProvider
            - source
          slot_usage:
            endDate: { required: true }
        PedestrianCrossing:
          class_uri: jc:PedestrianCrossing
          description: >-
            One pedestrian or cycle crossing painted on Barcelona's streets, from the city's street
            inventory, with its kind, its painted area and its barri. Smart Data Models has no crossing
            model; the class is the project's own, with SDM's common names where they exist (location,
            dataProvider, source).
          is_a: Entity
          slots: [crossingType, crossingTypeLabel, markedArea, refNeighbourhood, dataProvider, source]
        StreetFurniture:
          class_uri: jc:StreetFurniture
          description: >-
            One piece of furniture standing on Barcelona's streets, from the city's street inventory:
            today its speed reducers, each with its kind, its model and its address. Smart Data Models
            has no street furniture model; the class is the project's own, with SDM's common names where
            they exist (location, address, dataProvider, source).
          is_a: Entity
          slots: [furnitureType, furnitureTypeLabel, address, dataProvider, source]
        BikeLane:
          class_uri: sdm:BikeLane
          description: >-
            One segment of Barcelona's bike network as the city's map layer draws it, open
            (carril-bici) or under construction (carrils-bici-en-construccio), with its line and length.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.Transportation
          slots: [name, localId, bikeLaneState, laneLength, dataProvider, source]
        RoadAccident:
          class_uri: sdm:RoadAccident
          description: >-
            One road accident the Guàrdia Urbana handled (accidents-gu-bcn), its hour, place and the
            people injured or dead as counts, with its kinds, causes and the kinds of vehicle involved
            from the four detail tables joined by file number; nothing about a person.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.Transportation
          slots:
            - localId
            - status
            - accidentDate
            - totalInjured
            - seriouslyInjured
            - slightlyInjured
            - deadCount
            - vehicleCount
            - pedestriansInvolved
            - pedestrianCause
            - accidentKind
            - accidentType
            - accidentCause
            - vehicleKind
            - vehiclesInvolved
            - numPassengersInjured
            - numPassengersDead
            - numPedestrianInjured
            - numPedestrianDead
            - address
            - areaServed
            - dataProvider
            - source
          slot_usage:
            status: { range: RoadAccidentStatus, required: true }

        Event:
          class_uri: sdm:Event
          description: >-
            One activity of the Ajuntament's agendas (agenda diària, agenda cultural, agenda
            d'activitats esportives), the day it starts and ends, where it happens and its category.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
          slots: [name, startDate, endDate, category, subCategory, address, contactPoint, source]
        TouristRental:
          class_uri: sdm:TouristRental
          description: >-
            One tourist flat (habitatge d'ús turístic) the city has licensed, by its licence file: the
            guests it admits, its Generalitat register number, and the building it is in (street and
            number, district, barri and point). Floor, door, staircase and block are never written: they
            locate a household. Smart Data Models' TouristRental is a facility rented to tourists; the
            licence register names the facility, so no rental dates or tourist.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.TourismDestinations
          slots: [name, capacity, registerNumber, address, areaServed, dataProvider, source]
        PointOfInterest:
          class_uri: sdm:PointOfInterest
          description: >-
            One facility of the city's register (Guia BCN equipaments): a library, a sports hall, a
            school, a market, a social services centre; its family, where it is and its telephone.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.PointOfInterest
          slots: [name, category, address, contactPoint, source]
        KeyPerformanceIndicator:
          class_uri: sdm:KeyPerformanceIndicator
          description: >-
            One indicator of the city's statistics (Departament d'Estadística, Open Data BCN) for one
            barri, district or the whole city: the newest period's value, its history one row per
            period. Read daily from Open Data BCN.
          is_a: Entity
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.KeyPerformanceIndicator
          slots:
            - name
            - description
            - kpiValue
            - calculationPeriod
            - calculationFrequency
            - area
            - districtCode
            - divisionLevel
            - refArea
            - process
            - statisticsTable
            - dimensionKey
            - calculatedBy
            - organization
            - dataProvider
            - source
          slot_usage:
            name:
              rank: 1
              annotations: { summary: true }
            kpiValue:
              rank: 2
              annotations: { summary: true }
            area:
              rank: 3
              annotations: { summary: true }
            districtCode: { required: false }
        KpiPeriod:
          class_uri: jc:KpiPeriod
          description: The value of `calculationPeriod`, never an entity of its own.
          slots: [from, to]
        PostalAddress:
          class_uri: schema:PostalAddress
          description: "The value of `address`: a postal address, never an entity of its own (Smart Data Models' common schema)."
          annotations:
            upstream_source: https://schema.org/PostalAddress
          slots: [streetAddress, postalCode, addressLocality, district, addressCountry]
        ContactPoint:
          class_uri: schema:ContactPoint
          description: 'The value of `contactPoint`: how to reach the organizer, never an entity of its own.'
          annotations:
            upstream_source: https://schema.org/ContactPoint
          slots: [telephone]
        DayExtremes:
          class_uri: schema:StructuredValue
          description: 'The value of `dayMaximum` or `dayMinimum`: the forecast extremes of one day, never an entity of its own.'
          annotations:
            upstream_source: https://github.com/smart-data-models/dataModel.Weather
          slots: [temperature]
          slot_usage:
            temperature: { description: The air temperature forecast as the day's highest or lowest. }
      enums:
        MeasurementType:
          description: What a PhreaticObserved measures (Smart Data Models' enum).
          permissible_values:
            depth: {}
            volume: {}
            quality: {}
            other: {}
        TrafficState:
          description: Open Data BCN's traffic state codes 0 to 6, named in English, the Catalan name in each description.
          permissible_values:
            noData: { description: '0 sense dades: no reading this period.' }
            veryFluid: { description: '1 molt fluid.' }
            fluid: { description: '2 fluid.' }
            dense: { description: '3 dens.' }
            veryDense: { description: '4 molt dens.' }
            congestion: { description: '5 congestió.' }
            closed: { description: '6 tallat.' }
        SocketType:
          description: The EVChargingStation `socketType` values the Endolla connector types map to, a subset of the Smart Data Model's enum.
          permissible_values:
            CCS/SAE:
              description: CCS_TYPE_2, the combined DC socket.
            CHAdeMO: { description: CHADEMO. }
            Type2:
              description: MENNEKES, and a WALL_OUTLET above 3.7 kW (the 22 kW AC outlets).
            Wall_Euro:
              description: A WALL_OUTLET up to 3.7 kW, the household socket.
        ChargingStationStatus:
          description: The EVChargingStation `status` values the port states map to, a subset of the Smart Data Model's enum.
          permissible_values:
            working: { description: At least one port AVAILABLE. }
            full: { description: No port free and at least one IN_USE. }
            outOfService:
              description: Every port OUT_OF_ORDER, UNAVAILABLE or UNKNOWN.
        StreetParkingCategory:
          description: The OnStreetParking `category` values the B:SM section types map to, a subset of the Smart Data Model's enum.
          permissible_values:
            blueZone:
              description: AZL, the blue zone anyone parks in for a fee.
            greenZone:
              description: VM and VR, the green zone.
            feeCharged:
              description: Parking costs by the time parked (AZL, VM, BUS).
            forResidents:
              description: VR, residents of the area only.
            forLoadUnload:
              description: DUM, urban goods distribution.
            onlyWithPermit:
              description: VR and DUM, a resident permit or the DUM app registration is needed.
        CalculationFrequency:
          permissible_values:
            monthly: { description: A new value every month. }
            yearly: { description: A new value every year. }
        DivisionLevel:
          permissible_values:
            city: { description: The whole city (statistics only). }
            district:
              description: A district (districte), 10 of them.
            neighbourhood:
              description: A barri, 73 of them, each inside one district.
        WorkState:
          description: The Smart Data Model CityWork workState values the city's states map to.
          permissible_values:
            open: { description: In execution (En execució). }
            other: { description: Stopped (Aturada). }
            completed: { description: Finished (Finalitzada). }
        StreetFurnitureType:
          description: The kinds of street furniture the city's street inventory lists that the space carries.
          permissible_values:
            speedCushion:
              description: 'A Berlin cushion: a raised block a car straddles (Coixí berlinés).'
            speedBump: { description: A speed bump or rumble band across the lane (Banda reductora). }
        CrossingType:
          description: The three kinds of crossing marking the city's typology names.
          permissible_values:
            stripes:
              description: Painted bars across the road, the zebra crossing (Pas de pastilles).
            blocks: { description: A crossing marked with painted square blocks (Pas de tacs). }
            cycle: { description: A crossing for bicycles (Pas de bicicletes). }
        BikeLaneState:
          description: Which of the city's two bike lane layers the segment is read from.
          permissible_values:
            inService: { description: Open to cycling (carril-bici). }
            underConstruction: { description: Being built (carrils-bici-en-construccio). }
        RoadAccidentStatus:
          description: The Smart Data Model RoadAccident status; a police file the city publishes is closed.
          permissible_values:
            archived: { description: A closed police file of a past accident. }
        CountedVehicleType:
          description: The Smart Data Model vehicleType a counter counts, where it counts one kind only.
          permissible_values:
            bicycle: { description: A counter of the bicycle network (Bicis). }
    projects__barcelona__spaces__barcelona__datamodels__barcelona.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: DataModel
      metadata:
        name: barcelona
        namespace: barcelona
        title:
          ca: Barcelona — dades obertes
          es: Barcelona — datos abiertos
          en: Barcelona, open data
      spec:
        contextSpaceRef: barcelona
        linkml: ./barcelona.linkml.yaml
        version: 1.6.0
        lifecycle: published
        classes:
          - AirQualityObserved
          - WeatherObserved
          - WeatherForecast
          - PhreaticObserved
          - TrafficFlowObserved
          - OnStreetParking
          - EVChargingStation
          - Event
          - PointOfInterest
          - AdministrativeArea
          - CityWork
          - PedestrianCrossing
          - StreetFurniture
          - TouristRental
          - KeyPerformanceIndicator
          - BikeLane
          - RoadAccident
        # A published model commits all four artifacts (DM-02); the gateway serves schema/v1 from them
