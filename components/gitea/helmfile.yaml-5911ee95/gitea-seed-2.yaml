s\": [2.1529057, 41.3350653] },\n          \"08019-0294\": { \"name\": \"QLSub - Ajmt Bcn P5 - Pou C. Mestres\", \"place\": \"C. Mestres (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 11.9, \"barri\": \"la Marina del Port\", \"district\": \"Sants - Montjuïc\", \"coordinates\": [2.1447678, 41.359785] },\n          \"08019-0302\": { \"name\": \"QLSub - Ajmt Bcn S5 - Pou Torre De Les Aigües\", \"place\": \"Torre de les Aigües (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 40, \"barri\": \"la Dreta de l'Eixample\", \"district\": \"Eixample\", \"coordinates\": [2.1697478, 41.3932687] },\n          \"08019-1300\": { \"name\": \"QLSub - Ordu (Ajuntament Barcelona)\", \"place\": \"C. Orduña (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 23, \"barri\": \"el Turó de la Peira\", \"district\": \"Nou Barris\", \"coordinates\": [2.1728002, 41.4337554] },\n          \"08019-0129\": { \"name\": \"QLSub - Pou 1 Antonio Puig Sa\", \"place\": \"C. de Potosí (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 29.4, \"barri\": \"el Bon Pastor\", \"district\": \"Sant Andreu\", \"coordinates\": [2.2042917, 41.4434804] },\n          \"08019-0014\": { \"name\": \"QLSub - Pou 3 Sant Andreu Central Besòs\", \"place\": \"Trinitat Vella - Besòs (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 25.1, \"barri\": \"la Trinitat Vella\", \"district\": \"Sant Andreu\", \"coordinates\": [2.1899711, 41.4572338] },\n          \"08019-0104\": { \"name\": \"QLSub - Pou Barcelona (Inst.Catala De La Salut Generalitat Catalunya (Ics 3a Admi))\", \"place\": \"C. Manso - ICS (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 24.15, \"barri\": \"Sant Antoni\", \"district\": \"Eixample\", \"coordinates\": [2.1593898, 41.3755569] },\n          \"08019-0010\": { \"name\": \"QLSub - Pou Barcelona (Residencia De La Inmaculada)\", \"place\": \"Res. De la Immaculada (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 14, \"barri\": \"Horta\", \"district\": \"Horta - Guinardó\", \"coordinates\": [2.156903, 41.4346443] },\n          \"08019-0411\": { \"name\": \"QLSub - Pou Montsolís Sgab\", \"place\": \"C. Santander / Fra Juniper Serra (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 34.5, \"barri\": \"el Bon Pastor\", \"district\": \"Sant Andreu\", \"coordinates\": [2.2052907, 41.4321433] },\n          \"08019-0024\": { \"name\": \"QLSub - Pou Reial Club De Tennis Barcelona 1889\", \"place\": \"Club de Tennis Barcelona (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 20, \"barri\": \"Pedralbes\", \"district\": \"les Corts\", \"coordinates\": [2.1171731, 41.3926435] },\n          \"08019-0021\": { \"name\": \"QLSub - Pou Temple Sagrada Familia\", \"place\": \"Temple Sagrada Família (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 29, \"barri\": \"la Sagrada Família\", \"district\": \"Eixample\", \"coordinates\": [2.1741711, 41.4039686] },\n          \"08019-0082\": { \"name\": \"QLSub - Pozo Floridablanca\", \"place\": \"C. de Floridablanca (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 8, \"barri\": \"Sant Antoni\", \"district\": \"Eixample\", \"coordinates\": [2.1626761, 41.3814388] },\n          \"08019-1301\": { \"name\": \"QLSub - Trme (Ajuntament De Barcelona)\", \"place\": \"C. Trinxant (Pou QLSub)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 15, \"barri\": \"el Camp de l’Arpa del Clot\", \"district\": \"Sant Martí\", \"coordinates\": [2.1865961, 41.4139743] }\n        }\n        let rows = $text.parse_csv(true, \",\").map_each(r -> {\n          \"well\": r.Codi_Estacio_ACA.or(\"\").trim(),\n          \"day\": r.Data_Mesura.or(\"\").trim(),\n          \"depth\": r.Fondaria_Aigua.or(\"\").trim().number().catch(null),\n          \"level\": r.Cota_Nivell_Piezometric.or(\"\").trim().number().catch(null)\n        })\n        let known = $rows.filter(r -> $wells.exists(r.well))\n        # One row per well and day; a repeated row is a duplicate, its first stands.\n        let keyed = $known.enumerated().map_each(e -> e.value.assign({ \"key\": e.value.well + \"|\" + e.value.day, \"position\": e.index }))\n        let first = $keyed.fold({}, item -> if item.tally.exists(item.value.key) { item.tally } else { item.tally.assign({ item.value.key: item.value.position }) })\n        let unique = $keyed.filter(r -> $first.get(r.key) == r.position)\n        let dated = $unique.map_each(r -> r.assign({ \"instant\": (r.day + \"T12:00:00Z\").ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix().catch(null) })).filter(r -> r.instant != null)\n        let numeric = $dated.filter(r -> r.depth != null && r.level != null)\n        let ranged = $numeric.filter(r -> r.depth >= 0 && r.depth <= $wells.get(r.well).wellDepth.or(150) && r.level >= -50 && r.level <= 200)\n        let valid = $ranged.filter(r -> r.instant <= $now + 86400)\n        let newest = $valid.map_each(r -> r.instant).sort().index(-1).catch(null)\n        let latest = if $newest == null { throw(\"the readings file holds no valid reading of a known well\") } else if $newest < $now - 270 * 86400 { throw(\"the newest reading of the readings file is of %v, more than 270 days old\".format($newest.ts_format(\"2006-01-02\", \"UTC\"))) } else {\n          $valid.sort_by(r -> r.instant).fold({}, item -> item.tally.assign({ item.value.well: item.value })).values()\n        }\n        let current = $latest.filter(r -> r.instant >= $now - 1826 * 86400)\n        root.dropped = {\n          \"unknownWell\": $rows.length() - $known.length(),\n          \"duplicateRow\": $known.length() - $unique.length(),\n          \"notADate\": $unique.length() - $dated.length(),\n          \"notANumber\": $dated.length() - $numeric.length(),\n          \"outOfRange\": $numeric.length() - $ranged.length(),\n          \"inTheFuture\": $ranged.length() - $valid.length(),\n          \"noReadingInFiveYears\": $latest.length() - $current.length()\n        }\n        root.entities = $current.sort_by(r -> r.well).map_each(r -> $wells.get(r.well).assign({ \"code\": r.well, \"reading\": r })).map_each(w -> {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:aca-%v\".format(\"PhreaticObserved\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), w.code),\n          \"type\": \"PhreaticObserved\",\n          \"name\": { \"type\": \"Property\", \"value\": w.name },\n          \"stationCode\": { \"type\": \"Property\", \"value\": w.code },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": \"Point\", \"coordinates\": w.coordinates } },\n          \"address\": { \"type\": \"Property\", \"value\": { \"streetAddress\": w.place, \"addressLocality\": \"Barcelona\", \"district\": w.district, \"addressCountry\": \"ES\" } },\n          \"areaServed\": { \"type\": \"Property\", \"value\": w.barri },\n          \"aquifer\": { \"type\": \"Property\", \"value\": w.aquifer },\n          \"measurementType\": { \"type\": \"Property\", \"value\": [\"depth\"] },\n          \"investigationDepth\": if w.wellDepth == null { deleted() } else { { \"type\": \"Property\", \"value\": w.wellDepth } },\n          \"waterTable\": { \"type\": \"Property\", \"value\": w.reading.depth, \"unitCode\": \"MTR\", \"observedAt\": w.reading.instant.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\") },\n          \"piezometricLevel\": { \"type\": \"Property\", \"value\": w.reading.level, \"unitCode\": \"MTR\", \"observedAt\": w.reading.instant.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\") },\n          \"dateObserved\": { \"type\": \"Property\", \"value\": w.reading.instant.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\") },\n          \"dataProvider\": { \"type\": \"Property\", \"value\": \"Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)\" },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/piezometres_detall\" }\n        })\n    - log:\n        level: INFO\n        message: 'groundwater: ${! json(\"entities\").length() } wells written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.entities\n"
    projects__barcelona__pipelines__groundwater__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: groundwater
        namespace: barcelona
        title:
          ca: Aigües subterrànies de Barcelona, cada dia
          es: Aguas subterráneas de Barcelona, cada día
          en: Barcelona groundwater, daily
      spec:
        class: auto
        # The city rewrites the file about once a month on no fixed day; once a day finds it.
        schedule: '35 5 * * *'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-groundwater }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert, never replace: a well missing from one file keeps its last reading (T-5263).
        output: { type: PhreaticObserved, mode: upsert }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__neighbourhoods__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: neighbourhoods
        namespace: barcelona
        title: { ca: Barris de Barcelona, es: Barrios de Barcelona, en: Barcelona neighbourhoods }
      spec:
        class: auto
        # The division changes a few times a decade; weekly is already more than it needs.
        schedule: '50 4 * * 1'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-neighbourhoods }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert: an area missing from one file keeps its outline (T-5264).
        output: { type: AdministrativeArea, mode: upsert }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__speed-reducers__bento.yaml: "# The mapping of the speed-reducers pipeline (PL-03, T-5431): one StreetFurniture per speed reducer\n# of Open Data BCN's street inventory (dataset infraestructures-inventari-reductors-velocitat,\n# Infraestruc_Mobiliari_Urba_Reductors_Velocitat.csv, rewritten weekly): gis_id, the model code\n# (codi: Coixi Berlines, the Berlin cushion, or BRE, BRE 2, BRE 3, the bands), its description in\n# Catalan (descripcio), nom_carrer and num_carrer, nom_districte, WGS84 longitud/latitud and the day\n# it left the inventory (data_baixa, 9999-12-31 while it stands). A row whose data_baixa lies before\n# 9999 is gone from the street and is not written (none of 1,774 on 2026-10-23). `expiresAt`: a\n# reducer the file drops leaves every read three weeks (three update periods) after the file last\n# listed it.\n#\n# Plausibility (owner 2026-10-22): a row with no numeric id or a model code the mapping does not\n# know, a point that is no number or lies outside the municipality's 1 km margin (the space's\n# in-area bbox) and a second row of one id are dropped, each counted by reason in `dropped`, which\n# the next step logs. A file over 4 MiB or 20,000 rows (654 kB and 1,774 rows on 2026-10-23) is\n# refused, and a file with no current reducer fails the run, so the reducers stand instead of going quiet.\n\npipeline:\n  processors:\n    - mapping: |\n        let text = if content().length() > 4194304 { throw(\"the speed reducers file is %d bytes, more than the 4 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        let bbox = [2.04, 41.3, 2.24, 41.48]\n        let kinds = {\n          \"Coixi Berlines\": \"speedCushion\", \"BRE\": \"speedBump\", \"BRE 2\": \"speedBump\", \"BRE 3\": \"speedBump\"\n        }\n        let rows = $text.parse_csv(true, \",\")\n        let read = if $rows.length() > 20000 { throw(\"the speed reducers file holds %d rows, more than the 20,000 read\".format($rows.length())) } else { $rows }\n        let current = $read.filter(r -> r.data_baixa.or(\"\").trim() == \"\" || r.data_baixa.trim().has_prefix(\"9999\"))\n        let coded = $current.filter(r -> r.gis_id.or(\"\").trim().re_match(\"^[0-9]{1,12}$\") && $kinds.exists(r.codi.or(\"\").trim()))\n        let placed = $coded.map_each(r -> {\n          \"id\": r.gis_id.trim(),\n          \"kind\": $kinds.get(r.codi.trim()),\n          \"label\": r.descripcio.or(\"\").trim(),\n          \"street\": [r.nom_carrer.or(\"\").trim(), r.num_carrer.or(\"\").trim()].filter(s -> s != \"\").join(\" \"),\n          \"district\": r.nom_districte.or(\"\").trim(),\n          \"lon\": r.longitud.or(\"\").trim().number().catch(null),\n          \"lat\": r.latitud.or(\"\").trim().number().catch(null)\n        }).filter(c -> c.lon != null && c.lat != null)\n        let inside = $placed.filter(c -> c.lon >= $bbox.index(0) && c.lon <= $bbox.index(2) && c.lat >= $bbox.index(1) && c.lat <= $bbox.index(3))\n        # One reducer per id: sorted, so a repeat sits beside its first.\n        let by_id = $inside.sort_by(c -> c.id)\n        let unique = $by_id.enumerated().filter(e -> e.index == 0 || $by_id.index(e.index - 1).id != e.value.id).map_each(e -> e.value)\n        root.dropped = {\n          \"removed\": $read.length() - $current.length(),\n          \"noIdOrKind\": $current.length() - $coded.length(),\n          \"noPoint\": $coded.length() - $placed.length(),\n          \"outsideTheCity\": $placed.length() - $inside.length(),\n          \"duplicateId\": $inside.length() - $unique.length()\n        }\n        root.reducers = if $unique.length() == 0 { throw(\"the speed reducers file holds no current reducer\") } else { $unique }\n    - log:\n        level: INFO\n        message: 'speed reducers: ${! json(\"reducers\").length() } written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.reducers\n    - unarchive: { format: json_array }\n    - mapping: |\n        # The run's clock (a test sets bcn_now to read a recorded file as of its own day).\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix()\n        root = {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:speed-reducer-%v\".format(\"StreetFurniture\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), this.id),\n          \"type\": \"StreetFurniture\",\n          \"expiresAt\": ($now + 21 * 86400).ts_format(\"2006-01-02T15:04:05Z\", \"UTC\"),\n          \"furnitureType\": { \"type\": \"Property\", \"value\": this.kind },\n          \"furnitureTypeLabel\": if this.label == \"\" { null } else { { \"type\": \"Property\", \"value\": this.label } },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": \"Point\", \"coordinates\": [this.lon, this.lat] } },\n          \"address\": { \"type\": \"Property\", \"value\": {\n            \"streetAddress\": this.street,\n            \"addressLocality\": \"Barcelona\",\n            \"district\": this.district,\n            \"addressCountry\": \"ES\"\n          }.filter(entry -> entry.value != \"\") },\n          \"dataProvider\": { \"type\": \"Property\", \"value\": \"Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)\" },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/infraestructures-inventari-reductors-velocitat\" }\n        }.filter(entry -> entry.value != null)\n"
    projects__barcelona__pipelines__tourist-flats__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: tourist-flats
        namespace: barcelona
        title:
          ca: Habitatges d'ús turístic de Barcelona, cada setmana
          es: Viviendas de uso turístico de Barcelona, cada semana
          en: Barcelona licensed tourist flats, weekly
      spec:
        class: auto
        # The city lists the register as weekly (SETMANAL); the file changed between its May and
        # October copies.
        schedule: '35 5 * * 3'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-tourist-flats }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert: a licence the file drops leaves by its expiresAt, three weeks after its last listing.
        output: { type: TouristRental, mode: upsert }
        # The whole 1.4 MB file ran in under 96 MiB on 2026-10-23 (docker run --memory 96m).
        quotas: { maxMemoryMb: 128, cpuMillicores: 200 }
    projects__barcelona__pipelines__traffic-counters__bento.yaml: |
      # The mapping of the traffic-counters pipeline (PL-03, T-5374): one TrafficFlowObserved per traffic
      # or bicycle counter of Open Data BCN (aforaments-descriptiu, 881 counters in 2025: 452 of motor
      # traffic, 62 on the ring roads, 412 of bicycles) with its mean working-day intensity (IMD,
      # `laborables`) of the newest month the city published (aforaments-detall, one CSV a year, months
      # 1..12, the year's file a few months after it ends).
      #
      # The DataSource's answer is the CKAN record of aforaments-detall; the newest year's DataStore
      # resource is taken from it, the counter register's resource of that year (or the newest before
      # it) from the record of aforaments-descriptiu, and both are read with one DataStore SQL query
      # that joins a counter's reading to its place. Only resource ids of the UUID form reach the SQL,
      # so no other text of the portal's answers becomes part of the query. A newest year more than two
      # years old fails the run, so a dataset the city renamed does not go quiet.
      #
      # Plausibility (owner 2026-10-22): a row without a counter id (digits, or a ring-road code such as
      # 10-SMD-1), a reading the city marks
      # `Mesura no disponible`, a counter the register does not place (no numeric point), a point outside
      # the municipality's 1 km margin (the space's in-area bbox), an intensity above 200,000 a day (the
      # busiest counter read 96,694 in 2025) and a second row of one counter are dropped, each counted by
      # reason in the run's log line. An answer with no counter at all fails the run, which writes
      # nothing.

      pipeline:
        processors:
          - try:
              - mapping: |
                  let uuid = "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                  let record = if content().length() > 1048576 { throw("the counter readings record is %d bytes, more than the 1 MiB read".format(content().length())) } else { content().string().parse_json().catch({}) }
                  let files = $record.result.resources.or([]).filter(r -> r.datastore_active.or(false) == true && r.id.or("").re_match($uuid) && r.name.or("").lowercase().re_match("^[0-9]{4}_aforaments?_detall(_valor)?\\.csv$")).sort_by(r -> r.name.slice(0, 4))
                  let newest = if $files.length() == 0 { throw("the counter readings record names no YYYY_aforament_detall_valor.csv in the DataStore") } else { $files.index(-1) }
                  meta counters_year = $newest.name.slice(0, 4)
                  meta counters_readings = if $newest.name.slice(0, 4).number() < now().ts_format("2006", "UTC").number() - 2 { throw("the newest counter readings are of %v, more than two years old".format($newest.name.slice(0, 4))) } else { $newest.id }
                  root = ""
              - http:
                  url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/package_show?id=aforaments-descriptiu
                  verb: GET
                  headers:
                    Accept: application/json
                    User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)
                  timeout: 30s
                  retries: 1
                  rate_limit: barcelona_opendata
              - mapping: |
                  let uuid = "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                  let record = if content().length() > 1048576 { throw("the counter register record is %d bytes, more than the 1 MiB read".format(content().length())) } else { content().string().parse_json().catch({}) }
                  let files = $record.result.resources.or([]).filter(r -> r.datastore_active.or(false) == true && r.id.or("").re_match($uuid) && r.name.or("").lowercase().re_match("^[0-9]{4}_aforaments?_descripcio\\.csv$") && r.name.slice(0, 4) <= @counters_year).sort_by(r -> r.name.slice(0, 4))
                  let register = if $files.length() == 0 { throw("the counter register record names no YYYY_aforament_descripcio.csv of %v or before in the DataStore".format(@counters_year)) } else { $files.index(-1).id }
                  let readings = @counters_readings
                  meta sql = ("SELECT v.\"Id_aforament\" AS id, v.\"Any\"::int::text AS year, v.\"Mes\"::int::text AS month, v.\"Valor_IMD\" AS imd, d.\"Desc_aforament\" AS name, d.\"Desc_tipus_aforament\" AS kind, d.\"Longitud\" AS lon, d.\"Latitud\" AS lat FROM \"" + $readings + "\" v LEFT JOIN \"" + $register + "\" d ON d.\"Id_aforament\" = v.\"Id_aforament\" WHERE v.\"Codi_tipus_dia\" = 2 AND v.\"Mes\" = (SELECT max(\"Mes\") FROM \"" + $readings + "\") ORDER BY v.\"Id_aforament\" LIMIT 5000").escape_url_query()
                  root = ""
              - http:
                  url: https://opendata-ajuntament.barcelona.cat/data/api/3/action/datastore_search_sql?sql=${! @sql }
                  verb: GET
                  headers:
                    Accept: application/json
                    User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)
                  timeout: 60s
                  retries: 1
                  rate_limit: barcelona_opendata
              - mapping: |
                  let answer = if content().length() > 4194304 { throw("the counter readings answer is %d bytes, more than the 4 MiB read".format(content().length())) } else { content().string().parse_json().catch({}) }
                  let rows = if $answer.success.or(false) != true { throw("Open Data BCN refused the counter readings query: %s".format($answer.error.format_json(no_indent: true).or("no reason given"))) } else if $answer.result.records.or([]).length() >= 5000 { throw("the counter readings answered %d rows, the LIMIT 5000 of its query: raise it, or the rows past it are dropped".format($answer.result.records.length())) } else { $answer.result.records.or([]) }
                  let bbox = [2.04, 41.3, 2.24, 41.48]
                  let numbered = $rows.filter(r -> r.id.or("").string().trim().re_match("^[0-9A-Za-z][0-9A-Za-z-]{0,19}$"))
                  let measured = $numbered.filter(r -> r.imd.or("").string().trim().re_match("^[0-9]{1,9}$"))
                  let placed = $measured.map_each(r -> {
                    "id": r.id.string().trim(),
                    "year": r.year.or("").string().number().int64().catch(0),
                    "month": r.month.or("").string().number().int64().catch(0),
                    "imd": r.imd.string().trim().number().int64(),
                    "name": r.name.or("").string().trim(),
                    "bicycle": r.kind.or("").string().trim() == "Bicis",
                    "lon": r.lon.or("").string().trim().number().catch(null),
                    "lat": r.lat.or("").string().trim().number().catch(null)
                  }).filter(c -> c.lon != null && c.lat != null && c.year >= 2000 && c.month >= 1 && c.month <= 12)
                  let inside = $placed.filter(c -> c.lon >= $bbox.index(0) && c.lon <= $bbox.index(2) && c.lat >= $bbox.index(1) && c.lat <= $bbox.index(3))
                  let ranged = $inside.filter(c -> c.imd <= 200000)
                  let first = $ranged.fold({ "seen": {}, "kept": [] }, t -> if t.tally.seen.exists(t.value.id) { t.tally } else { { "seen": t.tally.seen.merge({ t.value.id: true }), "kept": t.tally.kept.append(t.value) } }).kept
                  root.dropped = {
                    "noCounterId": $rows.length() - $numbered.length(),
                    "noMeasurement": $numbered.length() - $measured.length(),
                    "noPlace": $measured.length() - $placed.length(),
                    "outsideTheCity": $placed.length() - $inside.length(),
                    "intensityOutOfRange": $inside.length() - $ranged.length(),
                    "duplicateCounter": $ranged.length() - $first.length()
                  }
                  root.counters = if $first.length() == 0 { throw("the counter readings of %v hold no counter".format(@counters_year)) } else { $first }
              - log:
                  level: INFO
                  message: 'traffic counters ${! @counters_year }: ${! json("counters").length() } written; dropped ${! json("dropped").format_json(no_indent: true) }'
              - mapping: root = this.counters
              - unarchive: { format: json_array }
              - mapping: |
                  # The month runs from its first midnight in Barcelona to the next month's, both in UTC.
                  map utc {
                    let local = "%04d-%02d-01T00:00:00".format(this.index(0), this.index(1))
                    root = ($local + ($local + "Z").ts_parse("2006-01-02T15:04:05Z07:00").ts_format("-07:00", "Europe/Madrid")).ts_parse("2006-01-02T15:04:05Z07:00").ts_format("2006-01-02T15:04:05Z", "UTC")
                  }
                  let from = [this.year, this.month].apply("utc")
                  let to = (if this.month == 12 { [this.year + 1, 1] } else { [this.year, this.month + 1] }).apply("utc")
                  root = {
                    "id": "urn:ngsi-ld:%v:%v:%v:aforament-%v".format("TrafficFlowObserved", env("JC_ORG_DOMAIN"), env("JC_SPACE"), this.id.lowercase()),
                    "type": "TrafficFlowObserved",
                    "name": if this.name == "" { null } else { { "type": "Property", "value": this.name } },
                    "dateObserved": { "type": "Property", "value": $to },
                    "dateObservedFrom": { "type": "Property", "value": $from },
                    "dateObservedTo": { "type": "Property", "value": $to },
                    "intensity": { "type": "Property", "value": this.imd },
                    "vehicleType": if this.bicycle { { "type": "Property", "value": "bicycle" } } else { null },
                    "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [this.lon, this.lat] } },
                    "source": { "type": "Property", "value": "https://opendata-ajuntament.barcelona.cat/data/dataset/aforaments-detall" }
                  }.filter(entry -> entry.value != null)
    projects__barcelona__pipelines__traffic-state__bento.yaml: "# The mapping of the traffic-state pipeline (PL-03, T-5262): one TrafficFlowObserved per street\n# section of Open Data BCN `trams`, with its line and name from `transit-relacio-trams` (526\n# sections on 2026-10-22), its state now and the state forecast for 15 minutes.\n#\n# The DataSource's answer is the state file, one line per section: id#yyyymmddhhmmss#state#forecast,\n# the time local to Barcelona. The sections' lines come from transit_relacio_trams.csv (130 kB),\n# read each run from the same host, so a section the city adds gets its line the run it appears.\n#\n# Codes: 0 sense dades, 1 molt fluid, 2 fluid, 3 dens, 4 molt dens, 5 congestió, 6 tallat, named in\n# English (noData .. closed); congested is true for 4 and 5 only.\n#\n# Plausibility (owner 2026-10-22): a line that is not id#time#code#code, a code outside 0..6, a time\n# more than a day ahead, a section named twice, a section without a line, or a line that leaves\n# Barcelona (lon 2.04..2.24, lat 41.30..41.48, the space's area) or has fewer than two points is left\n# out, each counted by its reason in the run's log line. A file with no section, a file older than\n# three periods (15 min) or a section list that does not answer fails the run, which writes nothing\n# and leaves the entities as they were.\n\npipeline:\n  processors:\n    - try:\n        - mapping: |\n            root = if content().length() > 262144 { throw(\"the traffic state file is %d bytes, more than the 256 kB read\".format(content().length())) } else { content().string() }\n        - mapping: |\n            let lines = content().string().split(\"\\n\").map_each(l -> l.trim()).filter(l -> l != \"\")\n            let rows = $lines.map_each(l -> l.split(\"#\"))\n            let shaped = $rows.filter(r -> r.length() == 4 && r.index(0).re_match(\"^[0-9]{1,6}$\") && r.index(1).re_match(\"^[0-9]{14}$\") && r.index(2).re_match(\"^-?[0-9]+$\") && r.index(3).re_match(\"^-?[0-9]+$\"))\n            let coded = $shaped.filter(r -> r.index(2).number() >= 0 && r.index(2).number() <= 6 && r.index(3).number() >= 0 && r.index(3).number() <= 6)\n            let timed = $coded.map_each(r -> r.append((r.index(1).slice(0, 4) + \"-\" + r.index(1).slice(4, 6) + \"-\" + r.index(1).slice(6, 8) + \"T\" + r.index(1).slice(8, 10) + \":\" + r.index(1).slice(10, 12) + \":\" + r.index(1).slice(12, 14)).(local -> (local + (local + \"Z\").ts_format(\"-07:00\", \"Europe/Madrid\")).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix())))\n            let present = $timed.filter(r -> r.index(4) <= now().ts_unix() + 86400)\n            let first = $present.fold({}, t -> if t.tally.exists(t.value.index(0)) { t.tally } else { t.tally.merge({ t.value.index(0): t.value }) })\n            let newest = $present.fold(0, t -> if t.value.index(4) > t.tally { t.value.index(4) } else { t.tally })\n            root = if $present.length() == 0 { throw(\"the traffic state file names no section\") } else if $newest < now().ts_unix() - 900 { throw(\"the traffic state file is from %v, older than three 5-minute periods\".format($newest.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\"))) } else { {\n              \"rows\": $first.values().sort_by(r -> r.index(0).number()),\n              \"dropped\": {\n                \"malformedLine\": $rows.length() - $shaped.length(),\n                \"stateOutOfRange\": $shaped.length() - $coded.length(),\n                \"timeInFuture\": $timed.length() - $present.length(),\n                \"duplicateSection\": $present.length() - $first.keys().length()\n              }\n            } }\n        - branch:\n            request_map: root = \"\"\n            processors:\n              - http:\n                  url: https://opendata-ajuntament.barcelona.cat/data/dataset/1090983a-1c40-4609-8620-14ad49aae3ab/resource/1d6c814c-70ef-4147-aa16-a49ddb952f72/download/transit_relacio_trams.csv\n                  verb: GET\n                  headers:\n                    Accept: text/csv\n                    User-Agent: joinedcontext-barcelona/1.0 (+https://dev.joinedcontext.com)\n                  timeout: 30s\n                  retries: 1\n                  rate_limit: barcelona_opendata\n              - mapping: |\n                  root = if content().length() > 2097152 { throw(\"the section list is %d bytes, more than the 2 MB read\".format(content().length())) } else { content().string() }\n            result_map: root.sections = content().string()\n        - mapping: |\n            let csv = this.sections.trim_prefix(\"\uFEFF\").parse_csv()\n            root = if $csv.length() == 0 || !$csv.index(0).exists(\"Tram\") || !$csv.index(0).exists(\"Coordenades\") { throw(\"the section list does not have the columns Tram, Descripció, Coordenades\") } else { this }\n        - mapping: |\n            let csv = this.sections.trim_prefix(\"\uFEFF\").parse_csv()\n            let parsed = $csv.map_each(s -> s.merge({ \"c\": s.Coordenades.or(\"\").split(\",\").map_each(v -> v.trim().number().catch(null)) }))\n            let shaped = $parsed.filter(s -> s.c.length() >= 4 && s.c.length() % 2 == 0 && s.c.all(v -> v != null))\n            let points = $shaped.map_each(s -> s.merge({ \"line\": range(0, s.c.length(), 2).map_each(i -> [s.c.index(i), s.c.index(i + 1)]) }))\n            let inside = $points.filter(s -> s.line.all(p -> p.index(0) >= 2.04 && p.index(0) <= 2.24 && p.index(1) >= 41.30 && p.index(1) <= 41.48))\n            let lines = $inside.map_each(s -> { s.Tram.string().trim(): s }).squash()\n            let codes = [\"noData\", \"veryFluid\", \"fluid\", \"dense\", \"veryDense\", \"congestion\", \"closed\"]\n            let known = this.rows.filter(r -> $lines.exists(r.index(0)))\n            let entities = $known.map_each(r -> $lines.get(r.index(0)).(s -> r.index(4).ts_format(\"2006-01-02T15:04:05Z\", \"UTC\").(at -> {\n              \"id\": \"urn:ngsi-ld:%v:%v:%v:tram-%v\".format(\"TrafficFlowObserved\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), r.index(0)),\n              \"type\": \"TrafficFlowObserved\",\n              \"name\": { \"type\": \"Property\", \"value\": s.get(\"Descripció\").or(\"\").trim() },\n              \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": \"LineString\", \"coordinates\": s.line } },\n              \"dateObserved\": { \"type\": \"Property\", \"value\": at },\n              \"trafficState\": { \"type\": \"Property\", \"value\": $codes.index(r.index(2).number()), \"observedAt\": at },\n              \"trafficStateForecast\": { \"type\": \"Property\", \"value\": $codes.index(r.index(3).number()), \"observedAt\": at },\n              \"congested\": { \"type\": \"Property\", \"value\": [4, 5].contains(r.index(2).number()), \"observedAt\": at },\n              \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/ca/dataset/trams\" }\n            })))\n            root = if $entities.length() == 0 { throw(\"no section of the state file has a line in the section list\") } else { {\n              \"entities\": $entities,\n              \"dropped\": this.dropped.merge({\n                \"sectionWithoutLine\": this.rows.length() - $known.length(),\n                \"lineMalformed\": $parsed.length() - $shaped.length(),\n                \"lineOutOfArea\": $shaped.length() - $inside.length()\n              })\n            } }\n        - log:\n            level: INFO\n            message: 'traffic-state: ${! json(\"entities\").length() } sections written, left out by reason ${! json(\"dropped\").format_json(no_indent: true) }'\n        - mapping: root = this.entities\n        - unarchive: { format: json_array }\n"
    projects__barcelona__pipelines__weather-forecast__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: weather-forecast
        namespace: barcelona
        title:
          ca: Predicció meteorològica del Barcelonès, cada mitja hora
          es: Predicción meteorológica del Barcelonès, cada media hora
          en: Barcelonès weather forecast, every half hour
      spec:
        class: auto
        # Open Data BCN lists the file as refreshed every 30 minutes; Meteocat issues a new forecast a
        # few times a day, and a run that finds the same issue writes nothing new.
        schedule: '10,40 * * * *'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-weather-forecast }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Replace: only this pipeline writes WeatherForecast, and a day the newest issue no longer lists
        # leaves. A file the mapping refuses fails the run and deletes nothing.
        output: { type: WeatherForecast, mode: replace }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__spaces__barcelona__datamodels__barcelona.linkml.yaml: |
      id: https://joinedcontext.com/models/barcelona/barcelona
      name: barcelona
      title: Barcelona, open data
      description: >-
        What the space barcelona carries (DM-01, DM-61): the open data of Barcelona City Council
        (Open Data BCN) as Smart Data Models types, their IRIs cited rather than minted (DM-04, DM-16).
        The first type is AirQualityObserved, one entity per station of the city's air-quality
        network with the hourly mean of each pollutant it measures; Event holds the city's activity
        agendas (cultural, daily and sports); PointOfInterest the city's register of facilities
        (equipaments); each Open Data BCN batch adds its own classes. Transport: TrafficFlowObserved,
        the traffic state of each street section and each route of sections the city reports every
        five minutes, OnStreetParking, each regulated surface parking section (blue, green, loading
        and bus zones), and EVChargingStation, each public charging point of the Endolla Barcelona
        network with its live socket states, BikeLane, each segment of the bike network open or under
        construction, RoadAccident, each accident the Guàrdia Urbana handled, as counts only, and
        each traffic counter's monthly intensity as TrafficFlowObserved. Urbanism: the districts and barris as
        AdministrativeArea, the works on the public space as CityWork and the street inventory's
        crossings as PedestrianCrossing, its speed reducers as StreetFurniture and the drinking and
        ornamental fountains as PointOfInterest. Tourism: each licensed tourist flat (habitatge d'ús
        turístic) as TouristRental, at the building's address and point. Statistics: the city's
        statistics per barri, district and city as KeyPerformanceIndicator.
      license: https://joinedcontext.com/licenses/cc-by-4.0
      prefixes:
        linkml: https://w3id.org/linkml/
        jc: https://joinedcontext.com/models/
        sdm: https://smartdatamodels.org/
        ngsi-ld: https://uri.etsi.org/ngsi-ld/
      default_prefix: sdm
      default_range: string
      imports:
        - linkml:types
        - ngsi-ld-core

      slots:
        name:
          slot_uri: schema:name
          description: The name as the city publishes it, in Catalan (a station, an event, a facility, a street section and its stretch, a street address, a district or barri, a work, a tourist flat by its register number).
          annotations:
            label:
              tag: label
              value:
                sk: Názov
                cs: Název
                en: Name
                de: Name
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://schema.org/name
        dateObserved:
          slot_uri: sdm:dateObserved
          description: >-
            The end of the period the entity's newest readings cover, UTC: the hour of an air-quality
            mean, the local day of a weather station's values, the day of a well's reading, a traffic
            state's report, a charging point's newest port change.
          range: datetime
          required: true
          annotations:
            label:
              tag: label
              value:
                sk: Čas merania
                cs: Čas měření
                en: Observed at
                de: Messzeitpunkt
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.Environment
        pm10:
          slot_uri: sdm:pm10
          description: Particulate matter up to 10 µm, the hour's mean at the station.
          range: float
          minimum_value: 0
          unit: { ucum_code: ug/m3 }
          annotations:
            label:
              tag: label
              value:
                sk: PM10
                cs: PM10
                en: PM10
                de: PM10
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.Environment
        pm25:
          slot_uri: sdm:pm25
          description: Particulate matter up to 2.5 µm, the hour's mean at the station.
          range: float
          minimum_value: 0
          unit: { ucum_code: ug/m3 }
          annotations:
            label:
              tag: label
              value:
                sk: PM2,5
                cs: PM2,5
                en: PM2.5
                de: PM2,5
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.Environment
        no2:
          slot_uri: sdm:no2
          description: Nitrogen dioxide, the hour's mean at the station.
          range: float
          minimum_value: 0
          unit: { ucum_code: ug/m3 }
          annotations:
            label:
              tag: label
              value:
                sk: NO₂
                cs: NO₂
                en: NO₂
                de: NO₂
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.Environment
        o3:
          slot_uri: sdm:o3
          description: Ozone, the hour's mean at the station.
          range: float
          minimum_value: 0
          unit: { ucum_code: ug/m3 }
          annotations:
            label:
              tag: label
              value:
                sk: O₃
                cs: O₃
                en: O₃
                de: O₃
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.Environment
        congested:
          slot_uri: sdm:congested
          description: >-
            Whether the section is congested now: true for the city's states 4 (very dense) and 5
            (congestion), false otherwise, as SDM reads an absent flag (no data and closed included;
            trafficState tells those apart).
          range: boolean
          annotations:
            label:
              tag: label
              value:
                sk: Zápcha
                cs: Zácpa
                en: Congested
                de: Stau
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.Transportation
        trafficState:
          slot_uri: jc:trafficState
          description: >-
            The city's own traffic state of the section (custom: TrafficFlowObserved has only
            `congested`), its code 1 to 6 named in English; Open Data BCN dataset trams.
          range: TrafficState
          annotations:
            label:
              tag: label
              value:
                sk: Stav dopravy
                cs: Stav dopravy
                en: Traffic state
                de: Verkehrslage
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        trafficStateForecast:
          slot_uri: jc:trafficStateForecast
          description: The state the city forecasts for the section in 15 minutes, same codes as trafficState (custom).
          range: TrafficState
          annotations:
            label:
              tag: label
              value:
                sk: Predpoveď stavu dopravy
                cs: Předpověď stavu dopravy
                en: Traffic state forecast
                de: Verkehrslageprognose
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        travelTime:
          slot_uri: jc:travelTime
          description: >-
            How long a vehicle takes now to drive the route, in seconds (custom: TrafficFlowObserved
            has no travel time); Open Data BCN dataset itineraris, its fourth field. Absent while the
            city reports no reading for the route.
          range: integer
          minimum_value: 0
          unit: { ucum_code: s }
          annotations:
            label:
              tag: label
              value:
                sk: Čas jazdy (s)
                cs: Doba jízdy (s)
                en: Travel time (s)
                de: Fahrzeit (s)
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        usualTravelTime:
          slot_uri: jc:usualTravelTime
          description: >-
            The time the city expects for the route now from its history of the same kind of day, in
            seconds (custom; itineraris, its fifth field, temps previst). travelTime above it means
            slower traffic than usual.
          range: integer
          minimum_value: 0
          unit: { ucum_code: s }
          annotations:
            label:
              tag: label
              value:
                sk: Bežný čas jazdy (s)
                cs: Obvyklá doba jízdy (s)
                en: Usual travel time (s)
                de: Übliche Fahrzeit (s)
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        allowedVehicleType:
          slot_uri: sdm:allowedVehicleType
          description: >-
            What may park there, the section's own kind first; at a charging point, what its sockets
            serve (car for Type 2, CCS and CHAdeMO and for a car park's household sockets, motorcycle
            for the 3.6 kW household sockets).
          multivalued: true
          annotations:
            label:
              tag: label
              value:
                sk: Povolené vozidlá
                cs: Povolená vozidla
                en: Allowed vehicles
                de: Zugelassene Fahrzeuge
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.Parking
        totalSpotNumber:
          slot_uri: sdm:totalSpotNumber
          description: The parking places of the section as B:SM counts them (PLACES).
          range: integer
          minimum_value: 0
          annotations:
            label:
              tag: label
              value:
                sk: Počet miest
                cs: Počet míst
                en: Parking places
                de: Stellplätze
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.Parking
        zoneCode:
          slot_uri: jc:zoneCode
          description: The section type as B:SM codes it (AZL, VM, VR, DUM, BUS), kept as published (custom).
          annotations:
            label:
              tag: label
              value:
                sk: Typ úseku
                cs: Typ úseku
                en: Section type
                de: Abschnittstyp
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
        tariffCode:
          slot_uri: jc:tariffCode
          description: >-
            The B:SM rate (ID_TARIFA) and timetable (ID_HORARIO) codes of the section, joined as
            rate/timetable, kept as published (custom; Open Data BCN tarifes- and
            horaris-aparcament-superficie).
          annotations:
            label:
              tag: label
              value:
                sk: Kód tarify
                cs: Kód tarifu
                en: Tariff code
                de: Tarifcode
              annotations: { generated: sk cs en de }
        so2:
          slot_uri: sdm:so2
          description: Sulphur dioxide, the hour's mean at the station.
          range: float
          minimum_value: 0
          unit: { ucum_code: ug/m3 }
          annotations:
            label:
              tag: label
              value:
                sk: SO₂
                cs: SO₂
                en: SO₂
                de: SO₂
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.Environment
        co:
          slot_uri: sdm:co
          description: Carbon monoxide, the hour's mean at the station, in mg/m³ as the city measures it.
          range: float
          minimum_value: 0
          unit: { ucum_code: mg/m3 }
          annotations:
            label:
              tag: label
              value:
                sk: CO
                cs: CO
                en: CO
                de: CO
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.Environment
        'no':
          slot_uri: sdm:no
          description: Nitrogen monoxide, the hour's mean at the station.
          range: float
          minimum_value: 0
          unit: { ucum_code: ug/m3 }
          annotations:
            label:
              tag: label
              value:
                sk: 'NO'
                cs: 'NO'
                en: 'NO'
                de: 'NO'
              annotations: { generated: sk cs en de }
            ngsi_ld_kind: Property
            upstream_source: https://github.com/smart-data-models/dataModel.Environment
        nox:
          slot_uri: sdm:nox
          description: Nitrogen oxides (NO + NO2 as NO2), the hour's mean at the station.
