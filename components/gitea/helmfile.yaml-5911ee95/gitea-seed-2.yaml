    projects__barcelona__mcp__dades-obertes.yaml: |
      # Barcelona's public data as one read-only MCP connector (T-5367, ADR-N-043), named in the city's
      # own language: `https://{domain}/api/mcp/barcelona/dades-obertes`. It selects every public
      # Endpoint of the project barcelona, so each dataset a later batch adds joins without an edit here;
      # every call is still that Endpoint's own call under its anonymous Policy, and a public server
      # lists read tools only, whoever calls (EP-141).
      apiVersion: joinedcontext.com/v1alpha1
      kind: McpServer
      metadata:
        name: dades-obertes
        namespace: barcelona
        # What an AI client reads as serverInfo and initialize.instructions (EP-92).
        title:
          ca: Barcelona — dades obertes
          es: Barcelona — datos abiertos
          en: Barcelona, open data
        description:
          ca: "Dades obertes de l'Ajuntament de Barcelona (Open Data BCN), només de lectura: l'agenda d'activitats i els equipaments de la ciutat. Font: Ajuntament de Barcelona, Open Data BCN, CC BY 4.0. Citeu la font."
          es: 'Datos abiertos del Ayuntamiento de Barcelona (Open Data BCN), solo lectura: la agenda de actividades y los equipamientos de la ciudad. Fuente: Ayuntamiento de Barcelona, Open Data BCN, CC BY 4.0. Cite la fuente.'
          en: "Read-only open data of Barcelona City Council (Open Data BCN): the city's events agenda and its public facilities. Start with list_endpoints or search, then query_entities naming one endpoint, with a small limit. Texts are in Catalan and Spanish. Source: Barcelona City Council (Ajuntament de Barcelona), Open Data BCN, CC BY 4.0; credit it when you quote it."
      spec:
        # Every public Endpoint of the project, resolved on each call (MF-55, T-5367): a new one joins
        # without an edit here, one that stops being public leaves.
        select:
          projects: [barcelona]
          accessLevel: [public]
        audience: public
    projects__barcelona__pipelines__accidents__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: accidents
        namespace: barcelona
        title:
          ca: Accidents de trànsit de Barcelona, cada setmana
          es: Accidentes de tráfico de Barcelona, cada semana
          en: Barcelona road accidents, weekly
      spec:
        class: auto
        # The city publishes a year's file once, months after the year ends (2025 on 2026-05-19), and
        # corrects it rarely: a weekly read is enough.
        schedule: '50 5 * * 3'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-accidents }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert without expiry: the accidents of every year read stay, so the dataset grows a year at a
        # time (about 8,000 accidents each).
        output: { type: RoadAccident, mode: upsert }
        quotas: { maxMemoryMb: 192, cpuMillicores: 200 }
    projects__barcelona__pipelines__air-quality__bento.yaml: "# The mapping of the air-quality pipeline (PL-03, T-5263): one AirQualityObserved per station of\n# Barcelona's air-quality network, with the newest valid hourly mean of each pollutant it measures.\n# The source is Open Data BCN's Qualitat_Aire_Detall.csv (dataset qualitat-aire-detall-bcn,\n# rewritten every hour): one row per station, pollutant and day for the last four days, columns\n# H01..H24 the means of the hours ending 01:00..24:00 local time, V01..V24 \"V\" for a valid value\n# and \"N\" for none. The stations' names and places are not in it; they are listed here, read from\n# the dataset qualitat-aire-estacions-bcn (2026_qualitat_aire_estacions.csv, 2026-10-22). That\n# list also names station 81 at Navas with station 60's EoI code and place; the hourly file has no\n# 81, so it is left out as the duplicate it is. The pollutant codes are the dataset\n# contaminants-estacions-mesura-qualitat-aire (qualitat_aire_contaminants.csv): the codes 1xx\n# (\"SO2*\" and so on), the analysers' internal flows (995..998), the biomass share of black carbon\n# (999, a percentage) and the codes that list does not name (11, 901) are no reading of this model.\n#\n# Plausibility (owner 2026-10-22): an hour the file marks \"N\", a value that is no number, below 0\n# or above its pollutant's ceiling, an hour more than a day ahead, and a second row for the same\n# station, pollutant and day are each dropped and counted by reason in `dropped`, which the next\n# step logs; the hour before the dropped one then stands. A file with no valid reading at all, or\n# whose newest reading is more than three hours old (three update periods), fails the run, so the\n# entities keep their last values instead of going quiet.\n\npipeline:\n  processors:\n    - mapping: |\n        let text = if content().length() > 1048576 { throw(\"the hourly file is %d bytes, more than the 1 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        # The run's clock; a test sets bcn_now to read a recorded file as of its own day.\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix()\n        let stations = {\n          \"004\": { \"code\": \"8019004\", \"name\": \"Barcelona - Poblenou\", \"street\": \"Plaça Josep Trueta (Pujades - Lope de Vega)\", \"district\": \"Sant Marti\", \"barri\": \"el Poblenou\", \"coordinates\": [2.2045, 41.4039] },\n          \"042\": { \"code\": \"8019042\", \"name\": \"Barcelona - Sants\", \"street\": \"Jardins de Can Mantega (Joan Güell - Violant d’Hongria)\", \"district\": \"Sants-Montjuic\", \"barri\": \"Sants\", \"coordinates\": [2.1331, 41.3788] },\n          \"043\": { \"code\": \"8019043\", \"name\": \"Barcelona - Eixample\", \"street\": \"Av. Roma - c/ Comte Urgell\", \"district\": \"Eixample\", \"barri\": \"la Nova Esquerra de l'Eixample\", \"coordinates\": [2.1538, 41.3853] },\n          \"044\": { \"code\": \"8019044\", \"name\": \"Barcelona - Gràcia\", \"street\": \"Plaça Gal·la Placídia (Via Augusta - Travessera de Gràcia)\", \"district\": \"Gracia\", \"barri\": \"la Vila de Gracia\", \"coordinates\": [2.1534, 41.3987] },\n          \"050\": { \"code\": \"8019050\", \"name\": \"Barcelona - Ciutadella\", \"street\": \"Parc de la Ciutadella\", \"district\": \"Ciutat Vella\", \"barri\": \"Sant Pere, Santa Caterina i la Ribera\", \"coordinates\": [2.1874, 41.3864] },\n          \"054\": { \"code\": \"8019054\", \"name\": \"Barcelona - Vall Hebron\", \"street\": \"Parc de la Vall d’Hebron. c/ Martí Codolar - c/ Granja Vella\", \"district\": \"Horta-Guinardo\", \"barri\": \"la Vall d'Hebron\", \"coordinates\": [2.1480, 41.4261] },\n          \"057\": { \"code\": \"8019057\", \"name\": \"Barcelona - Palau Reial\", \"street\": \"c/ John Maynard Keynes - c/ de Jordi Girona\", \"district\": \"Les Corts\", \"barri\": \"Pedralbes\", \"coordinates\": [2.1151, 41.3875] },\n          \"058\": { \"code\": \"8019058\", \"name\": \"Barcelona - Observatori Fabra\", \"street\": \"Camí de l'Observatori-s/n\", \"district\": \"Sarria-Sant Gervasi\", \"barri\": \"Vallvidrera-el Tibidabo-les Planes\", \"coordinates\": [2.1239, 41.41843] },\n          \"060\": { \"code\": \"8019060\", \"name\": \"Barcelona - Navas\", \"street\": \"Av. Meridiana 216\", \"district\": \"Sant Andreu\", \"barri\": \"Navas\", \"coordinates\": [2.1871, 41.4159] }\n        }\n        # code -> attribute, UN/CEFACT unit (GQ µg/m³, GP mg/m³) and the highest hourly mean taken\n        # as a reading: several times the worst hour a European city station has reported. Black\n        # carbon comes in ng/m³ although the pollutant list says µg/m³: its hours (median 502, up to\n        # 4030 in the 2026-10-22 file) stand above the same station's PM2.5 (about 10 µg/m³), of\n        # which black carbon is a part, so it is divided by 1000 (T-5263).\n        let pollutants = {\n          \"1\": { \"attribute\": \"so2\", \"unit\": \"GQ\", \"ceiling\": 1000 },\n          \"6\": { \"attribute\": \"co\", \"unit\": \"GP\", \"ceiling\": 50 },\n          \"7\": { \"attribute\": \"no\", \"unit\": \"GQ\", \"ceiling\": 2000 },\n          \"8\": { \"attribute\": \"no2\", \"unit\": \"GQ\", \"ceiling\": 1000 },\n          \"9\": { \"attribute\": \"pm25\", \"unit\": \"GQ\", \"ceiling\": 1000 },\n          \"10\": { \"attribute\": \"pm10\", \"unit\": \"GQ\", \"ceiling\": 1000 },\n          \"12\": { \"attribute\": \"nox\", \"unit\": \"GQ\", \"ceiling\": 3000 },\n          \"14\": { \"attribute\": \"o3\", \"unit\": \"GQ\", \"ceiling\": 800 },\n          \"22\": { \"attribute\": \"blackCarbon\", \"unit\": \"GQ\", \"ceiling\": 100, \"divisor\": 1000 }\n        }\n        let rows = $text.parse_csv(true, \",\").map_each(r -> r.assign({\n          \"station\": r.ESTACIO.or(\"\").trim(),\n          \"code\": r.CODI_CONTAMINANT.or(\"\").trim().number().catch(-1).string(),\n          \"day\": \"%04d-%02d-%02d\".format(r.ANY.number().catch(0).int64(), r.MES.number().catch(0).int64(), r.DIA.number().catch(0).int64())\n        }))\n        let known = $rows.filter(r -> $stations.exists(r.station) && $pollutants.exists(r.code))\n        # One row per station, pollutant and day; a repeated row is a duplicate, its first stands.\n        let keyed = $known.enumerated().map_each(e -> e.value.assign({ \"key\": \"%v|%v|%v\".format(e.value.station, e.value.code, e.value.day), \"position\": e.index }))\n        let first = $keyed.fold({}, item -> if item.tally.exists(item.value.key) { item.tally } else { item.tally.assign({ item.value.key: item.value.position }) })\n        let unique = $keyed.filter(r -> $first.get(r.key) == r.position)\n        let hours = $unique.map_each(r -> range(1, 25).map_each(h -> {\n          \"station\": r.station,\n          \"code\": r.code,\n          \"flag\": r.get(\"V%02d\".format(h)).or(\"\").trim(),\n          \"raw\": r.get(\"H%02d\".format(h)).or(\"\").trim(),\n          # The hour's end as local time read as UTC, then moved by Madrid's offset at that time.\n          \"naive\": (r.day + \"T00:00:00Z\").ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix() + h * 3600\n        })).flatten().map_each(x -> x.assign({\n          \"instant\": x.naive - x.naive.ts_format(\"-07\", \"Europe/Madrid\").number() * 3600,\n          \"value\": x.raw.number().catch(null)\n        })).map_each(x -> if x.value == null { x } else { x.assign({ \"value\": x.value / $pollutants.get(x.code).divisor.or(1) }) })\n        let marked = $hours.filter(x -> x.flag == \"V\")\n        let numeric = $marked.filter(x -> x.value != null)\n        let ranged = $numeric.filter(x -> x.value >= 0 && x.value <= $pollutants.get(x.code).ceiling)\n        let valid = $ranged.filter(x -> x.instant <= $now + 86400)\n        let newest = $valid.map_each(x -> x.instant).sort().index(-1).catch(null)\n        root.dropped = {\n          \"unknownStationOrPollutant\": $rows.length() - $known.length(),\n          \"duplicateRow\": $known.length() - $unique.length(),\n          \"notValid\": $hours.length() - $marked.length(),\n          \"notANumber\": $marked.length() - $numeric.length(),\n          \"outOfRange\": $numeric.length() - $ranged.length(),\n          \"inTheFuture\": $ranged.length() - $valid.length()\n        }\n        let by_station = if $newest == null { throw(\"the hourly file holds no valid reading of a known station\") } else if $newest < $now - 3 * 3600 { throw(\"the newest reading of the hourly file is %v, more than three hours old\".format($newest.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\"))) } else {\n          $valid.sort_by(x -> x.instant).fold({}, item -> item.tally.assign({ item.value.station + \"|\" + item.value.code: item.value })).values().fold({}, item -> item.tally.assign({ item.value.station: item.tally.get(item.value.station).or([]).append(item.value) }))\n        }\n        root.entities = $by_station.key_values().sort_by(s -> s.key).map_each(s -> $stations.get(s.key).assign({ \"readings\": s.value })).map_each(st -> {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:xvpca-%v\".format(\"AirQualityObserved\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), st.code),\n          \"type\": \"AirQualityObserved\",\n          \"name\": { \"type\": \"Property\", \"value\": st.name },\n          \"stationCode\": { \"type\": \"Property\", \"value\": st.code },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": { \"type\": \"Point\", \"coordinates\": st.coordinates } },\n          \"address\": { \"type\": \"Property\", \"value\": { \"streetAddress\": st.street, \"addressLocality\": \"Barcelona\", \"district\": st.district, \"addressCountry\": \"ES\" } },\n          \"areaServed\": { \"type\": \"Property\", \"value\": st.barri },\n          \"dateObserved\": { \"type\": \"Property\", \"value\": st.readings.map_each(x -> x.instant).sort().index(-1).ts_format(\"2006-01-02T15:04:05Z\", \"UTC\") },\n          \"dataProvider\": { \"type\": \"Property\", \"value\": \"Ajuntament de Barcelona, Open Data BCN (CC BY 4.0)\" },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/qualitat-aire-detall-bcn\" }\n        }.merge(st.readings.fold({}, item -> item.tally.assign({ $pollutants.get(item.value.code).attribute: {\n          \"type\": \"Property\", \"value\": item.value.value, \"unitCode\": $pollutants.get(item.value.code).unit,\n          \"observedAt\": item.value.instant.ts_format(\"2006-01-02T15:04:05Z\", \"UTC\")\n        } }))))\n    - log:\n        level: INFO\n        message: 'air quality: ${! json(\"entities\").length() } stations written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.entities\n"
    projects__barcelona__pipelines__air-quality__pipeline.yaml: |
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: air-quality
        namespace: barcelona
        title:
          ca: Qualitat de l'aire de Barcelona, cada hora
          es: Calidad del aire de Barcelona, cada hora
          en: Barcelona air quality, hourly
      spec:
        class: auto
        # The city rewrites the file every hour; twice an hour catches each new hour within half an hour.
        schedule: '20,50 * * * *'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-air-quality }
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        # Upsert, never replace: a station missing from one file keeps its last readings (T-5263).
        output: { type: AirQualityObserved, mode: upsert }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__barcelona__pipelines__dog-areas__bento.yaml: "# The mapping of the dog-areas pipeline (PL-03, T-5413): one PointOfInterest per dog area of Open\n# Data BCN's arees_gossos_i_esbarjo_gossos.csv (dataset arees-esbarjo-gossos-bcn, 92 areas on\n# 2026-10-23, every one of kind tipus_id 76 \"ÀREA DE GOSSOS\"): its id, the park or square it lies\n# in (espai_verd), its address (adreca), barri and district, its centre in WGS84 (latitud,\n# longitud) and its fenced area in m² (superficie_m2). The id carries the prefix dog-area-, so the\n# areas never meet a facility of the register (equipaments) and the Endpoint dog-areas reads them\n# by idPattern. Written: name (\"Àrea de gossos, <park>\"), category [animals-plants, dog-area],\n# address (street, district) and source. Left out: the polygon (GEOM_WGS84; the places Endpoint\n# shows every PointOfInterest as a point), the barri (PointOfInterest has no refNeighbourhood) and\n# the area (no PointOfInterest slot; it only gates plausibility).\n#\n# Plausibility (owner 2026-10-22): a row whose id is no number, whose kind is not 76, whose point\n# is no number or lies outside the municipality's 1 km margin (the space's in-area bbox), whose\n# area is 0, below or above 50,000 m², and a second row of one id or of one point (within ~1 m, 5\n# decimals of a degree) are each dropped and counted by reason in `dropped`, which the next step\n# logs. A file with no area at all fails the run, so the areas stand instead of going quiet.\n# `expiresAt`: an area the file drops leaves every read three weeks (three weekly runs) after the\n# file last listed it.\n\npipeline:\n  processors:\n    - mapping: |\n        let text = if content().length() > 2097152 { throw(\"the dog areas file is %d bytes, more than the 2 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        let bbox = [2.04, 41.3, 2.24, 41.48]\n        let rows = $text.replace_all(\"\\r\", \"\").parse_csv(true, \",\")\n        let placed = $rows.map_each(r -> {\n          \"id\": r.id.or(\"\").trim(),\n          \"kind\": r.tipus_id.or(\"\").trim(),\n          \"park\": r.espai_verd.or(\"\").trim(),\n          \"street\": r.adreca.or(\"\").trim(),\n          \"district\": r.nom_districte.or(\"\").trim(),\n          \"lon\": r.longitud.or(\"\").trim().number().catch(null),\n          \"lat\": r.latitud.or(\"\").trim().number().catch(null),\n          \"area\": r.superficie_m2.or(\"\").trim().number().catch(null)\n        })\n        let coded = $placed.filter(a -> a.id.re_match(\"^[0-9]{1,12}$\") && a.kind == \"76\")\n        let pointed = $coded.filter(a -> a.lon != null && a.lat != null)\n        let inside = $pointed.filter(a -> a.lon >= $bbox.index(0) && a.lon <= $bbox.index(2) && a.lat >= $bbox.index(1) && a.lat <= $bbox.index(3))\n        let sized = $inside.filter(a -> a.area != null && a.area > 0 && a.area <= 50000)\n        # One area per id, then per ~1 m cell: sorted, so a repeat sits beside its first.\n        let by_id = $sized.sort_by(a -> a.id)\n        let ids = $by_id.enumerated().filter(e -> e.index == 0 || $by_id.index(e.index - 1).id != e.value.id).map_each(e -> e.value)\n        let by_cell = $ids.map_each(a -> a.assign({ \"cell\": \"%.5f %.5f\".format(a.lon, a.lat) })).sort_by(a -> a.cell + \" \" + a.id)\n        let unique = $by_cell.enumerated().filter(e -> e.index == 0 || $by_cell.index(e.index - 1).cell != e.value.cell).map_each(e -> e.value)\n        root.dropped = {\n          \"noIdOrKind\": $placed.length() - $coded.length(),\n          \"noPoint\": $coded.length() - $pointed.length(),\n          \"outsideTheCity\": $pointed.length() - $inside.length(),\n          \"areaOutOfRange\": $inside.length() - $sized.length(),\n          \"duplicateId\": $sized.length() - $ids.length(),\n          \"samePoint\": $ids.length() - $unique.length()\n        }\n        root.areas = if $unique.length() == 0 { throw(\"the dog areas file holds no dog area\") } else { $unique.map_each(a -> a.without(\"cell\", \"kind\")) }\n    - log:\n        level: INFO\n        message: 'dog areas: ${! json(\"areas\").length() } written; dropped ${! json(\"dropped\").format_json(no_indent: true) }'\n    - mapping: root = this.areas\n    - unarchive: { format: json_array }\n    - mapping: |\n        # The domain comes from the deployment, never from this file (PF-44); the run's clock is\n        # bcn_now when a test sets it.\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix()\n        root = {\n          \"id\": \"urn:ngsi-ld:%v:%v:%v:dog-area-%v\".format(\"PointOfInterest\", env(\"JC_ORG_DOMAIN\"), env(\"JC_SPACE\"), this.id),\n          \"type\": \"PointOfInterest\",\n          \"expiresAt\": ($now + 21 * 86400).ts_format(\"2006-01-02T15:04:05Z\", \"UTC\"),\n          \"name\": { \"type\": \"Property\", \"value\": if this.park == \"\" { \"Àrea de gossos\" } else { \"Àrea de gossos, \" + this.park } },\n          \"category\": { \"type\": \"Property\", \"value\": [\"animals-plants\", \"dog-area\"] },\n          \"location\": { \"type\": \"GeoProperty\", \"value\": {\n            \"type\": \"Point\", \"coordinates\": [(this.lon * 1000000).round() / 1000000, (this.lat * 1000000).round() / 1000000]\n          } },\n          \"address\": { \"type\": \"Property\", \"value\": {\n            \"streetAddress\": this.street,\n            \"addressLocality\": \"Barcelona\",\n            \"district\": this.district,\n            \"addressCountry\": \"ES\"\n          }.filter(entry -> entry.value != \"\") },\n          \"source\": { \"type\": \"Property\", \"value\": \"https://opendata-ajuntament.barcelona.cat/data/dataset/arees-esbarjo-gossos-bcn\" }\n        }\n"
    projects__barcelona__pipelines__equipaments__pipeline.yaml: |
      # The register is republished weekly (frequency SETMANAL); a daily run shows a change within a day
      # and heals a missed run (T-5265).
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: equipaments
        namespace: barcelona
        title: { ca: Equipaments de Barcelona, es: Equipamientos de Barcelona, en: Barcelona facilities }
      spec:
        class: auto
        schedule: '47 6 * * *'
        source:
          dataSourceRef: { kind: DataSource, name: bcn-equipaments }
        # Every stream writes through the one endpoint that evaluates the pipelines-write Policy.
        targetEndpoint: urn:ngsi-ld:Endpoint:barcelona.cat:barcelona:barcelona
        output: { type: PointOfInterest, mode: upsert }
        # Measured 2026-10-23: the 23 packages (25,469 rows, 23,337 kept) peak at 392 MiB in one run.
        quotas: { maxMemoryMb: 448, cpuMillicores: 100 }
    projects__barcelona__pipelines__ev-charging__bento.yaml: |
      # The mapping of the ev-charging pipeline (PL-03, T-5262): one EVChargingStation per public
      # charging point of Endolla Barcelona, from Open Data BCN informacio-punts-recarrega-electric (134
      # points, 872 stations, 1,366 ports on 2026-10-23).
      #
      # The file nests location -> stations -> ports; the stations of a location stand at its own
      # coordinates (0 m apart on 2026-10-23), so the location is the charging point and its ports are
      # its sockets: capacity and socketNumber count them, availableCapacity counts those AVAILABLE now.
      # Sockets: CCS_TYPE_2 is CCS/SAE, CHADEMO CHAdeMO, MENNEKES and a WALL_OUTLET over 3.7 kW (the
      # 22 kW AC outlets) Type2, a WALL_OUTLET up to 3.7 kW (the 3.6 kW household sockets Endolla offers
      # motorcycles) Wall_Euro. A car may use the first three, and a household socket in a car park
      # (onstreet_location false: cars and motorcycles share them there); a motorcycle a household
      # socket, which on the street stands in a motorcycle bay. Status: working
      # while a port is free, full when none is free and one charges, outOfService otherwise.
      #
      # Plausibility (owner 2026-10-22): a point without a numeric id, coordinates or stations, a point
      # outside Barcelona (lon 2.04..2.24, lat 41.30..41.48, the space's area; a swapped or 0,0 position
      # falls outside it), a port with an unknown socket or state or a power outside 0..400 kW, a point
      # with no port left, a point whose newest port change is more than a day ahead, and a point listed
      # twice (the same id, or the same address within 20 m) are left out, each counted by its reason in
      # the run's log line. A file with no point, or whose newest port change is more than six hours old
      # (the network changes about 60 ports in 15 minutes by day), fails the run and writes nothing.

      pipeline:
        processors:
          - try:
              - mapping: |
                  root = if content().length() > 2097152 { throw("the charging point file is %d bytes, more than the 2 MB read".format(content().length())) } else { content().string() }
              - mapping: |
                  let all = content().string().parse_json().catch({}).(d -> d.locations.catch(null))
                  root = if $all.type() != "array" || $all.length() == 0 { throw("the charging point file names no charging point") } else { $all }
              - mapping: |
                  let sockets = { "CCS_TYPE_2": "CCS/SAE", "CHADEMO": "CHAdeMO", "MENNEKES": "Type2" }
                  let states = ["AVAILABLE", "IN_USE", "OUT_OF_ORDER", "UNAVAILABLE", "UNKNOWN"]
                  let days = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"]
                  let shaped = this.filter(l -> (l.id.string().re_match("^[0-9]{1,8}$") && l.coordinates.latitude.type() == "number" && l.coordinates.longitude.type() == "number" && l.stations.type() == "array").catch(false))
                  let inside = $shaped.filter(l -> l.coordinates.longitude >= 2.04 && l.coordinates.longitude <= 2.24 && l.coordinates.latitude >= 41.30 && l.coordinates.latitude <= 41.48)
                  let ported = $inside.map_each(l -> l.merge({ "all": l.stations.map_each(s -> s.ports.catch([])).flatten() }))
                  let checked = $ported.map_each(l -> l.merge({ "ok": l.all.filter(p -> (($sockets.exists(p.connector_type) || p.connector_type == "WALL_OUTLET") && p.power_kw > 0 && p.power_kw <= 400 && $states.contains(p.port_status.index(0).status) && p.last_updated.ts_parse("2006-01-02T15:04:05Z07:00").ts_unix() > 0).catch(false)) }))
                  let usable = $checked.filter(l -> l.ok.length() > 0).map_each(l -> l.merge({ "at": l.ok.map_each(p -> p.last_updated.ts_parse("2006-01-02T15:04:05Z07:00").ts_unix()).fold(0, t -> if t.value > t.tally { t.value } else { t.tally }) }))
                  let present = $usable.filter(l -> l.at <= now().ts_unix() + 86400)
                  let unique = $present.fold({ "ids": {}, "kept": [] }, t -> if t.tally.ids.exists(t.value.id.string()) || t.tally.kept.any(k -> k.address.address_string.or("").lowercase().trim() == t.value.address.address_string.or("").lowercase().trim() && (k.coordinates.latitude - t.value.coordinates.latitude).abs() < 0.00018 && (k.coordinates.longitude - t.value.coordinates.longitude).abs() < 0.00024) { t.tally } else { { "ids": t.tally.ids.merge({ t.value.id.string(): true }), "kept": t.tally.kept.append(t.value) } }).kept
                  let newest = $unique.fold(0, t -> if t.value.at > t.tally { t.value.at } else { t.tally })
                  let entities = $unique.map_each(l -> l.at.ts_format("2006-01-02T15:04:05Z", "UTC").(at -> l.ok.map_each(p -> p.port_status.index(0).status).(st -> l.ok.map_each(p -> if $sockets.exists(p.connector_type) { $sockets.get(p.connector_type) } else if p.power_kw > 3.7 { "Type2" } else { "Wall_Euro" }).unique().sort().(kinds -> {
                    "id": "urn:ngsi-ld:%v:%v:%v:endolla-%v".format("EVChargingStation", env("JC_ORG_DOMAIN"), env("JC_SPACE"), l.id.string()),
                    "type": "EVChargingStation",
                    "name": { "type": "Property", "value": l.address.address_string.or("Endolla %v".format(l.id.string())).trim() },
                    "address": { "type": "Property", "value": {
                      "streetAddress": l.address.address_string.or("").trim(),
                      "postalCode": l.address.postal_code.or("").string().trim(),
                      "addressLocality": l.address.locality.or("").trim(),
                      "addressCountry": l.address.country_code.or("").trim()
                    }.filter(kv -> kv.value != "") },
                    "location": { "type": "GeoProperty", "value": { "type": "Point", "coordinates": [l.coordinates.longitude, l.coordinates.latitude] } },
                    "dateObserved": { "type": "Property", "value": at },
                    "capacity": { "type": "Property", "value": l.ok.length() },
                    "socketNumber": { "type": "Property", "value": l.ok.length() },
                    "availableCapacity": { "type": "Property", "value": st.filter(s -> s == "AVAILABLE").length(), "observedAt": at },
                    "status": { "type": "Property", "value": if st.contains("AVAILABLE") { "working" } else if st.contains("IN_USE") { "full" } else { "outOfService" }, "observedAt": at },
                    "socketType": { "type": "Property", "value": kinds },
                    "allowedVehicleType": { "type": "Property", "value": (if kinds.any(k -> k != "Wall_Euro") || l.onstreet_location.or(true) == false { ["car"] } else { [] }).concat(if kinds.contains("Wall_Euro") { ["motorcycle"] } else { [] }) },
                    "network": { "type": "Property", "value": l.network_brand_name.or("Endolla Barcelona") },
                    "operator": { "type": "Property", "value": l.network_name.or("Barcelona de Serveis Municipals S.A.") },
                    "openingHours": l.opening_hours.map_each(o -> $days.index(o.weekday_begin - 1) + (if o.weekday_end != o.weekday_begin { "-" + $days.index(o.weekday_end - 1) } else { "" }) + " " + o.hour_begin + "-" + o.hour_end).join("; ").(h -> { "type": "Property", "value": h }).catch(deleted()),
                    "source": { "type": "Property", "value": "https://opendata-ajuntament.barcelona.cat/data/ca/dataset/informacio-punts-recarrega-electric" }
                  }))))
                  root = if $entities.length() == 0 { throw("the charging point file names no usable charging point") } else if $newest < now().ts_unix() - 21600 { throw("the charging point file's newest port change is from %v, more than six hours ago".format($newest.ts_format("2006-01-02T15:04:05Z", "UTC"))) } else { {
                    "entities": $entities,
                    "dropped": {
                      "pointMalformed": this.length() - $shaped.length(),
                      "pointOutOfArea": $shaped.length() - $inside.length(),
                      "portOutOfRange": $checked.map_each(l -> l.all.length() - l.ok.length()).sum(),
                      "pointWithoutPort": $checked.length() - $usable.length(),
                      "timeInFuture": $usable.length() - $present.length(),
                      "duplicatePoint": $present.length() - $unique.length()
                    }
                  } }
              - log:
                  level: INFO
                  message: 'ev-charging: ${! json("entities").length() } charging points written, left out by reason ${! json("dropped").format_json(no_indent: true) }'
              - mapping: root = this.entities
              - unarchive: { format: json_array }
    projects__barcelona__pipelines__groundwater__bento.yaml: "# The mapping of the groundwater pipeline (PL-03, T-5263): one PhreaticObserved per piezometer or\n# well the city reads, with its newest reading. The source is Open Data BCN's piezometres_detall.csv\n# (dataset piezometres_detall, one resource the city rewrites about once a month, its readings\n# taken by hand and published some months late): one row per reading, the day in Data_Mesura, the\n# well's Catalan water agency (ACA) code, the depth from the surface to the water (Fondaria_Aigua,\n# m) and the water's height above sea level (Cota_Nivell_Piezometric, m, below 0 near the sea).\n# The wells' names and places are not in it; they are listed here, read from the dataset\n# piezometres_equipaments (piezometres_equipaments.csv, 2026-10-23, 54 wells, each with readings).\n# Written: waterTable (the depth to the water, Smart Data Models' name), investigationDepth (the\n# well's depth), piezometricLevel (a property of this model) and measurementType depth. The file\n# gives the day only: dateObserved is that day at 12:00 UTC, the same date in every European zone.\n#\n# Plausibility (owner 2026-10-22): a well not listed, a value that is no number, a depth to the\n# water below 0 or below the well's own depth, a level outside -50..200 m, a day more than a day\n# ahead, and a second row for one well and day are each dropped and counted by reason in\n# `dropped`, which the next step logs. A well whose newest reading is more than five years old\n# is no longer read and is left out, counted as `noReadingInFiveYears`. A file with no valid\n# reading, or whose newest reading is more than 270 days old (the city's months of delay plus\n# three monthly updates), fails the run and leaves the entities as they were.\n\npipeline:\n  processors:\n    - mapping: |\n        let text = if content().length() > 2097152 { throw(\"the readings file is %d bytes, more than the 2 MiB read\".format(content().length())) } else { content().string().trim_prefix(\"\uFEFF\") }\n        # The run's clock; a test sets bcn_now to read a recorded file as of its own day.\n        let now = @bcn_now.or(now()).ts_parse(\"2006-01-02T15:04:05Z07:00\").ts_unix()\n        let wells = {\n          \"08019-0179\": { \"name\": \"Piezòmetre - 36 Barcelona-1 (Mou 3)\", \"place\": \"C. Cristóbal de Moura 1 (Piezòmetre 36 BCN1)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 55.5, \"barri\": \"Provençals del Poblenou\", \"district\": \"Sant Martí\", \"coordinates\": [2.2075819, 41.4120394] },\n          \"08019-0180\": { \"name\": \"Piezòmetre - 36 Barcelona-2 (Mou 4)\", \"place\": \"C. Cristóbal de Moura 2 (Piezòmetre 36 BCN2)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 23.5, \"barri\": \"Provençals del Poblenou\", \"district\": \"Sant Martí\", \"coordinates\": [2.2075641, 41.4120321] },\n          \"08019-1305\": { \"name\": \"Piezòmetre - 36 Barcelona-3\", \"place\": \"C. Puigcerdà / Cristóbal Moura (Piezòmetre 36 BCN3)\", \"aquifer\": \"Baix Besòs i Pla de Barcelona\", \"wellDepth\": 20, \"barri\": \"el Besòs i el Maresme\", \"district\": \"Sant Martí\", \"coordinates\": [2.2105961, 41.414291] },\n          \"08019-1157\": { \"name\": \"Piezòmetre - 39 Barcelona-3 (Pz1 Port De Ningbó)\", \"place\": \"Moll de l’Energia (Piezòmetre 39 BCN3 Pz2)\", \"aquifer\": \"Vall baixa i Delta del Llobregat\", \"wellDepth\": 36, \"barri\": \"la Marina del Prat Vermell\", \"district\": \"Sants - Montjuïc\", \"coordinates\": [2.1604749, 41.3308859] },\n          \"08019-1158\": { \"name\": \"Piezòmetre - 39 Barcelona-4 (Pz2 Port De Ningbó)\", \"place\": \"Moll de l’Energia (Piezòmetre 39 BCN4 Pz2)\", \"aquifer\": \"Vall baixa i Delta del Llobregat\", \"wellDepth\": 72, \"barri\": \"la Marina del Prat Vermell\", \"district\": \"Sants - Montjuïc\", \"coordinates\": [2.1613227, 41.3327953] },\n          \"08019-0146\": { \"name\": \"Piezòmetre - A-10'-A\", \"place\": \"Moll de l’Energia (Piezò