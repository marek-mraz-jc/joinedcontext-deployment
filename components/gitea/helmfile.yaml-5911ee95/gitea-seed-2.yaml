    projects__barcelona__spaces__barcelona__endpoints__barcelona-events.yaml: |
      # The Ajuntament's activity agendas as one public dataset (T-5265): every current and upcoming
      # activity as a Smart Data Models Event, refreshed daily from Open Data BCN.
      apiVersion: joinedcontext.com/v1alpha1
