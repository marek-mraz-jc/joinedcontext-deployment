          es: 'Población por barrio, distrito y ciudad según el Padrón Municipal de Habitantes: total, sexo, edad quinquenal, nacionalidad, nivel de estudios y lugar de nacimiento a 1 de enero; nacimientos, defunciones, inmigrantes, emigrantes, altas por omisión y bajas por inscripción indebida de cada año. Un KeyPerformanceIndicator de los Smart Data Models por indicador y área. Fuente: Ayuntamiento de Barcelona, Open Data BCN, CC BY 4.0.'
          en: "Population by barri, district and city from the Municipal Register of Inhabitants (Padró): total, sex, five-year age group, nationality, level of education and birthplace on 1 January; births, deaths, immigrants, emigrants, registrations by omission and cancellations of each year. One Smart Data Models KeyPerformanceIndicator per indicator and area, the newest period as kpiValue and the earlier periods in its history. Properties beyond the model: districtCode (the city's two-digit code of the district or barri), divisionLevel (city, district or neighbourhood), refArea (the AdministrativeArea), statisticsTable and dimensionKey (the source dataset and breakdown). Source: Barcelona City Council (Ajuntament de Barcelona), Open Data BCN, CC BY 4.0."
