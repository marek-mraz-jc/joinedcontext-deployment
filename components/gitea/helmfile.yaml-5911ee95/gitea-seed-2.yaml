    projects__barcelona__spaces__barcelona__datamodels__barcelona.v1.schema.json: |
      {
        "$id": "https://joinedcontext.com/models/barcelona/barcelona",
        "$schema": "http://json-schema.org/draft-07/schema#",
        "additionalProperties": true,
        "definitions": {
          "AdministrativeArea": {
            "additionalProperties": false,
            "description": "One district (10) or barri (73) of Barcelona, its outline and its code, as the Smart Data Model extension AdministrativeArea (PointOfInterest base).",
            "properties": {
              "dataProvider": {
                "description": "Who publishes the data the entity was read from, with the credit its licence asks for.",
                "type": [
                  "string",
                  "null"
                ],
                "x-ngsi-ld-kind": "Property"
              },
              "districtCode": {
                "description": "The city's own two-digit code of the area: the district number 01..10, or for a barri its number 01..73, which runs across the whole city.",
                "pattern": "^[0-9]{2}$",
                "type": "string",
                "x-ngsi-ld-kind": "Property"
              },
              "divisionLevel": {
                "$ref": "#/definitions/DivisionLevel",
                "description": "Which of the city's two divisions the area belongs to; for a statistics indicator also the whole city.",
                "x-ngsi-ld-kind": "Property"
              },
              "id": {
                "description": "The entity id, urn:ngsi-ld:{Type}:{orgDomain}:{space}:{localId}.",
                "type": "string",
                "x-ngsi-ld-kind": "Property"
              },
              "location": {
                "description": "Where the entity is, as GeoJSON geometry.",
                "properties": {
                  "coordinates": {
                    "type": "array"
                  },
                  "type": {
                    "enum": [
                      "Point",
                      "MultiPoint",
                      "LineString",
                      "MultiLineString",
                      "Polygon",
                      "MultiPolygon"
                    ],
                    "type": "string"
                  }
                },
                "required": [
                  "type",
                  "coordinates"
                ],
                "type": [
                  "object",
                  "null"
                ],
                "x-ngsi-ld-kind": "GeoProperty"
              },
              "name": {
                "description": "The name as the city publishes it, in Catalan (a station, an event, a facility, a street section and its stretch, a street address, a district or barri, a work, a tourist flat by its register number).",
                "type": [
                  "string",
                  "null"
                ],
                "x-ngsi-ld-kind": "Property"
              },
              "observedAt": {
                "description": "When the observation the entity reports was made.",
                "format": "date-time",
                "type": [
                  "string",
                  "null"
                ],
                "x-ngsi-ld-kind": "Property"
              },
              "refParentDistrict": {
                "description": "The district a barri belongs to.",
                "pattern": "^urn:ngsi-ld:AdministrativeArea:",
                "type": "string",
                "x-ngsi-ld-kind": "Relationship",
                "x-ngsi-ld-relationship": {
                  "cardinality": "many-to-one",
                  "inverse": "neighbourhoods",
                  "onDelete": "restrict",
                  "target": "AdministrativeArea",
                  "unique": false
                }
              },
              "source": {
                "description": "The open-data file or the Open Data BCN dataset the entity was read from.",
                "format": "uri",
                "type": [
                  "string",
                  "null"
                ],
                "x-ngsi-ld-kind": "Property"
              },
              "type": {
                "description": "The entity type, one class of a published data model.",
                "type": "string",
                "x-ngsi-ld-kind": "Property"
              }
            },
            "required": [
              "districtCode",
              "divisionLevel",
              "id",
              "type"
            ],
            "title": "AdministrativeArea",
            "type": "object"
          },
          "AirQualityObserved": {
            "additionalProperties": false,
            "description": "One air-quality station of Barcelona and its hourly means.",
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "$ref": "#/definitions/PostalAddress"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Where the station, the well, the event, the facility, the charging point or the street furniture is, as the city publishes it, field by field (Smart Data Models' common PostalAddress); a field the source leaves out is absent.",
                "x-ngsi-ld-kind": "Property"
              },
              "areaServed": {
                "description": "Where the entity is as the city names it: the barri of a station, a well or a tourist flat, the place of a work (a street and number, a square, a park).",
                "type": [
                  "string",
                  "null"
                ],
                "x-ngsi-ld-kind": "Property"
              },
              "blackCarbon": {
                "description": "Black carbon, the hour's mean at the station. A property of this model: the Smart Data Model AirQualityObserved names no black carbon attribute. The city's file gives it in ng/m\u00b3 under a \u00b5g/m\u00b3 label; the pipeline divides by 1000.",
                "minimum": 0,
                "type": [
                  "number",
                  "null"
                ],
                "x-ngsi-ld-kind": "Property",
                "x-unit": {
                  "ucumCode": "ug/m3"
                }
              },
              "co": {
                "description": "Carbon monoxide, the hour's mean at the station, in mg/m\u00b3 as the city measures it.",
                "minimum": 0,
                "type": [
                  "number",
                  "null"
                ],
                "x-ngsi-ld-kind": "Property",
                "x-unit": {
                  "ucumCode": "mg/m3"
                }
