containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
deployment:
  env:
    - name: GITEA_OAUTH_KEY_0
      value: gitea
    - name: GITEA_OAUTH_SECRET_0
      valueFrom:
        secretKeyRef:
          key: client-secret
          name: keycloak-client-gitea
fullnameOverride: gitea
gitea:
  additionalConfigFromEnvs:
    - name: GITEA__database__PASSWD
      valueFrom:
        secretKeyRef:
          key: password
          name: db-gitea
  admin:
    email: marek.mraz@joinedcontext.com
    existingSecret: gitea-admin-credentials
    passwordMode: initialOnlyNoReset
  config:
    APP_NAME: joinedcontext configuration forge
    actions:
      DEFAULT_ACTIONS_URL: self
      ENABLED: true
    cron.git_gc_repos:
      ENABLED: true
      SCHEDULE: '@midnight'
    database:
      DB_TYPE: postgres
      HOST: postgres-cluster-rw.smartcity.svc.cluster.local:5432
      MAX_IDLE_CONNS: 2
      MAX_OPEN_CONNS: 3
      NAME: gitea
      SSL_MODE: require
      USER: gitea
    git.config:
      gc_0X2E_auto: 0
      receive_0X2E_autogc: false
    migrations:
      ALLOW_LOCALNETWORKS: true
      ALLOWED_DOMAINS: gitea-http.smartcity.svc.cluster.local
    oauth2_client:
      ACCOUNT_LINKING: auto
      ENABLE_AUTO_REGISTRATION: true
      UPDATE_AVATAR: false
    packages:
      ENABLED: true
    repository:
      ALLOW_FORK_WITHOUT_MAXIMUM_LIMIT: false
      DEFAULT_BRANCH: main
      ENABLE_PUSH_CREATE_ORG: false
      ENABLE_PUSH_CREATE_USER: false
      MAX_CREATION_LIMIT: 0
    server:
      DISABLE_SSH: true
      DOMAIN: smartcity.joinedcontext.com
      HTTP_PORT: 3000
      OFFLINE_MODE: true
      ROOT_URL: https://smartcity.joinedcontext.com/git/
      START_SSH_SERVER: false
    service:
      DEFAULT_ALLOW_CREATE_ORGANIZATION: false
      DISABLE_REGISTRATION: true
      SHOW_REGISTRATION_BUTTON: false
    session:
      PROVIDER: db
    webhook:
      ALLOWED_HOST_LIST: portal.smartcity.svc.cluster.local
  oauth:
    - adminGroup: /forge-admins
      autoDiscoverUrl: https://idm.smartcity.joinedcontext.com/realms/smartcity/.well-known/openid-configuration
      groupClaimName: groups
      groupTeamMap: '{"/banskabystrica-readers":{"joinedcontext":["banskabystrica-readers"]},"/banskabystrica-writers":{"joinedcontext":["banskabystrica-writers"]},"/bbsk-readers":{"joinedcontext":["bbsk-readers"]},"/bbsk-writers":{"joinedcontext":["bbsk-writers"]},"/helsinki-mobility-readers":{"joinedcontext":["helsinki-mobility-readers"]},"/helsinki-mobility-writers":{"joinedcontext":["helsinki-mobility-writers"]},"/helsinki-readers":{"joinedcontext":["helsinki-readers"]},"/helsinki-writers":{"joinedcontext":["helsinki-writers"]},"/platform-readers":{"joinedcontext":["readers"],"joinedcontext-apps":["readers"]},"/praha-readers":{"joinedcontext":["praha-readers"]},"/praha-writers":{"joinedcontext":["praha-writers"]},"/slovensko-readers":{"joinedcontext":["slovensko-readers"]},"/slovensko-writers":{"joinedcontext":["slovensko-writers"]},"/zilina-readers":{"joinedcontext":["zilina-readers"]},"/zilina-writers":{"joinedcontext":["zilina-writers"]}}'
      groupTeamMapRemoval: true
      name: keycloak
      provider: openidConnect
  podAnnotations:
    config.linkerd.io/skip-outbound-ports: "443"
    linkerd.io/inject: enabled
image:
  digest: sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2
  pullPolicy: IfNotPresent
  registry: docker.gitea.com
  repository: gitea
  rootless: true
  tag: 1.27.3
initContainers:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
persistence:
  accessModes:
    - ReadWriteOnce
  claimName: gitea-shared-storage
  create: true
  enabled: true
  size: 20Gi
  storageClass: local-path
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
postgresql:
  enabled: false
postgresql-ha:
  enabled: false
replicaCount: 1
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 320Mi
service:
  http:
    clusterIP: ""
    port: 3000
serviceAccount:
  automountServiceAccountToken: false
  create: true
strategy:
  type: Recreate
test:
  enabled: false
valkey:
  enabled: false
valkey-cluster:
  enabled: false
