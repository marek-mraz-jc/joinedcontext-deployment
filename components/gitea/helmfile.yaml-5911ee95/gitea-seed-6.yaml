          # A layer that answers an error or no feature list is the service failing, so the run fails
          # where it can be seen rather than writing nothing.
          - mapping: |
              root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
          # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
          # every further page of them is read (T-5288). One run holds every page, so a layer past
          # 10000 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
          - branch:
              request_map: |
                root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
              processors:
                - http:
                    url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/V%C5%A0/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
                    verb: GET
                    headers:
                      Accept: application/json
                    timeout: 60s
                    retries: 2
                    rate_limit: pipeline_egress
              result_map: |
                root.rowCount = this.count.or(this.error.message.or("no count"))
          - mapping: |
              let rows = this.rowCount.or(null)
              root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 10000 { [{ "problem": "the layer holds %v rows, more than the 10000 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
          - unarchive:
              format: json_array
          - switch:
              - check: this.offset.or(null) != null
                processors:
                  - mapping: |
                      meta offset = this.offset
                      meta rows = this.rowCount
                      root = ""
                  - http:
                      url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/V%C5%A0/FeatureServer/0/query?where=1%3D1&outFields=Okres,Mesto,Univerzita,Fakulta,Fakulta___%C5%A1tatistick%C3%A1_ro%C4%8Denka,Typ_univerzity,Akademick%C3%BD_rok,GPS_x,GPS_y,Po%C4%8Det_%C5%A1tudentov___denn%C3%AD__I__a_I,Po%C4%8Det_%C5%A1tudentov___extern%C3%AD__I__a,Po%C4%8Det_absolventov___denn%C3%AD__I__a,Po%C4%8Det_absolventov___extern%C3%AD__I_,Obr%C3%A1zok_odkaz&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000&orderByFields=FID"
                      verb: GET
                      headers:
                        Accept: application/geo+json
                      timeout: 60s
                      retries: 2
                      rate_limit: pipeline_egress
                  - mapping: |
                      root = if errored() { throw("the page at %v did not come: %v".format(@offset, error())) } else if this.features.or(null) == null { { "problem": "the page at %v answered no features: %v".format(@offset, this.error.message.or("")) } } else if this.features.length() < [1000, @rows - @offset].min() { { "problem": "the page at %v answered %v rows where %v were due".format(@offset, this.features.length(), [1000, @rows - @offset].min()) } } else { this }
          # A refusal above fails the run and writes none of its message's rows.
          - mapping: |
              root = if this.problem.or(null) != null { throw(this.problem) } else { this }
          - mapping: |
              root = this.features.or([])
          - unarchive:
              format: json_array
          - mapping: |
              # Slovak notation: a space (or a no-break one) between thousands, a comma before the decimals, so
              # "10 700,01" is 10700.01 (T-4324); a text without a comma keeps its dot, "1.5" is one and a half.
              map number {
                let s = this.string().re_replace_all("[ 	  ]", "")
                let t = if $s.contains(",") { $s.replace_all(".", "").replace_all(",", ".") } else { $s }
                root = $t.number().catch(null)
              }
              map integer {
                let v = if this == null { null } else { this.apply("number") }
                root = if $v == null { null } else { { "type": "Property", "value": $v.round().int64() } }
              }
              map float {
                let v = if this == null { null } else { this.apply("number") }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              map string {
                let v = if this == null { "" } else { this.string().trim() }
                root = if $v == "" { null } else { { "type": "Property", "value": $v } }
              }
              map string_list {
                let v = if this == null { "" } else { this.string().trim() }
                root = if $v == "" { null } else { { "type": "Property", "value": [$v] } }
              }
              map uri {
                root = this.apply("string")
              }
              # An Esri date is milliseconds since the epoch; a WordPress one is text.
              # `match` rebinds `this` to what it matches, so the value is named first.
              map datetime {
                let x = this
                let v = match $x.type() {
                  "number" => ($x / 1000).ts_format("2006-01-02T15:04:05Z", "UTC").catch(null),
                  "string" => $x.ts_parse("2006-01-02T15:04:05").ts_format("2006-01-02T15:04:05Z", "UTC").catch($x.ts_format("2006-01-02T15:04:05Z", "UTC").catch(null)),
                  _ => null,
                }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              # The instant a row was observed, from its `observedAt` column: a bare year is its first instant,
              # anything else reads as a datetime (T-4288).
              map observed {
                let x = this
                root = if $x == null { null } else if $x.string().re_match("^[0-9]{4}$") { $x.string() + "-01-01T00:00:00Z" } else {
                  $x.apply("datetime").value.catch(null)
                }
              }
              # A measured Property with the instant it holds, so SensorThings charts it (T-4288).
              map stamped {
                root = if this.p == null || this.at == null { this.p } else { this.p.merge({ "observedAt": this.at }) }
              }
              map date {
                let x = this
                let v = match $x.type() {
                  "number" => ($x / 1000).ts_format("2006-01-02", "UTC").catch(null),
                  # ISO, or the Slovak "29.08.2026" and "1. 3. 2024".
                  "string" => if $x.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}") { $x.slice(0, 10) } else {
                    $x.re_replace_all("[.] +", ".").trim().ts_parse("2.1.2006").ts_format("2006-01-02", "UTC").catch(null)
                  },
                  _ => null,
                }
                root = if $v == null { null } else { { "type": "Property", "value": $v } }
              }
              let mapping_rev = "2026-10-27"
              let local = "vysoke-skoly-v-banskobystrickom-kraji-" + {"Okres": this.properties."Okres", "Mesto": this.properties."Mesto", "Univerzita": this.properties."Univerzita", "Fakulta": this.properties."Fakulta", "Fakulta___štatistická_ročenka": this.properties."Fakulta___štatistická_ročenka", "Typ_univerzity": this.properties."Typ_univerzity", "Akademický_rok": this.properties."Akademický_rok", "GPS_x": this.properties."GPS_x", "GPS_y": this.properties."GPS_y", "Počet_študentov___denní__I__a_I": this.properties."Počet_študentov___denní__I__a_I", "Počet_študentov___externí__I__a": this.properties."Počet_študentov___externí__I__a", "Počet_absolventov___denní__I__a": this.properties."Počet_absolventov___denní__I__a", "Počet_absolventov___externí__I_": this.properties."Počet_absolventov___externí__I_", "Obrázok_odkaz": this.properties."Obrázok_odkaz"}.format_json(no_indent: true).hash("sha256").encode("hex").slice(0, 24).re_replace_all("[^A-Za-z0-9._~-]", "-").slice(0, 80)
              root = {
                "id": "urn:ngsi-ld:%v:%v:%v:%v".format("Organization", "bbsk.sk", env("JC_SPACE"), $local),
                "type": "Organization",
                "okres": this.properties."Okres".apply("string"),
                "mesto": this.properties."Mesto".apply("string"),
                "univerzita": this.properties."Univerzita".apply("string"),
                "name": this.properties."Fakulta".apply("string"),
                "fakultaStatistickaRocenka": this.properties."Fakulta___štatistická_ročenka".apply("string"),
                "typUniverzity": this.properties."Typ_univerzity".apply("string"),
                "akademickyRok": this.properties."Akademický_rok".apply("string"),
                "gPSX": this.properties."GPS_x".apply("float"),
                "gPSY": this.properties."GPS_y".apply("float"),
                "pocetStudentovDenniIAI": this.properties."Počet_študentov___denní__I__a_I".apply("integer"),
                "pocetStudentovExterniIA": this.properties."Počet_študentov___externí__I__a".apply("integer"),
                "pocetAbsolventovDenniIA": this.properties."Počet_absolventov___denní__I__a".apply("integer"),
                "pocetAbsolventovExterniI": this.properties."Počet_absolventov___externí__I_".apply("integer"),
                "obrazokOdkaz": this.properties."Obrázok_odkaz".apply("string"),
                "location": if this.geometry.or(null) == null { null } else { { "type": "GeoProperty", "value": this.geometry } },
                "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
                "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/V%C5%A0/FeatureServer/0/query?where=1%3D1&outFields=Okres,Mesto,Univerzita,Fakulta,Fakulta___%C5%A1tatistick%C3%A1_ro%C4%8Denka,Typ_univerzity,Akademick%C3%BD_rok,GPS_x,GPS_y,Po%C4%8Det_%C5%A1tudentov___denn%C3%AD__I__a_I,Po%C4%8Det_%C5%A1tudentov___extern%C3%AD__I__a,Po%C4%8Det_absolventov___denn%C3%AD__I__a,Po%C4%8Det_absolventov___extern%C3%AD__I_,Obr%C3%A1zok_odkaz&returnGeometry=true&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000&orderByFields=FID" },
                "isPartOf": { "type": "Property", "value": "https://opendata.dev.joinedcontext.com/dataset/bbsk-vysoke-skoly-v-banskobystrickom-kraji-b0be47" }
              }.filter(entry -> entry.value != null)
          # One request per run's batch rather than one per row.
          - split:
              size: 1000
              byte_size: 2097152
          - archive:
              format: json_array
    projects__bbsk__pipelines__od-vyvoj-emisii-v-bbk__pipeline.yaml: |
      # One KeyPerformanceIndicator per row of "Vývoj emisií v BBK" (T-4255); one row per station or source and year.
