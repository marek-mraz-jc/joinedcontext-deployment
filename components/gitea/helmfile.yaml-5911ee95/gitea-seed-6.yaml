    projects__bbsk__pipelines__mosty__pipeline.yaml: |
      # One Bridge per record of `bbsk-mosty`, written into the register space through its one Endpoint (PL-18, T-2783).
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: mosty
        namespace: bbsk
        title: { sk: Mosty v kraji, en: Bridges in the region }
      spec:
        class: auto
        # A register the region revises a few times a year: weekly is already more than it needs (PL-26).
        period: 168h
        schedule: '57 3 * * 1'
        source:
          dataSourceRef: { kind: DataSource, name: bbsk-mosty }
        targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-registre:bbsk-registre
        # Each register is a full snapshot this pipeline alone writes: replace makes every entity exactly the
        # record, so an attribute the mapping dropped or retyped leaves at the next run (PL-79, T-5167).
        output: { type: Bridge, mode: replace }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__bbsk__pipelines__obce__pipeline.yaml: |
      # One AdministrativeArea per record of `bbsk-obce`, written into the register space through its one Endpoint (PL-18, T-2783).
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: obce
        namespace: bbsk
        title: { sk: Obce kraja, en: Municipalities of the region }
      spec:
        class: auto
        # A register the region revises a few times a year: weekly is already more than it needs (PL-26).
        period: 168h
        schedule: '41 3 * * 1'
        source:
          dataSourceRef: { kind: DataSource, name: bbsk-obce }
        targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-registre:bbsk-registre
        # Each register is a full snapshot this pipeline alone writes: replace makes every entity exactly the
        # record, so an attribute the mapping dropped or retyped leaves at the next run (PL-79, T-5167).
        output: { type: AdministrativeArea, mode: replace }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
