              processors:
                - http:
                    url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/PPA_dataset_AGOL_2/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
                    verb: GET
                    headers:
                      Accept: application/json
                    timeout: 60s
                    retries: 2
                    rate_limit: pipeline_egress
              result_map: |
                root.rowCount = this.count.or(this.error.message.or("no count"))
          - mapping: |
              let rows = this.rowCount.or(null)
              root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 27500 { [{ "problem": "the layer holds %v rows, more than the 27500 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
          - unarchive:
              format: json_array
          - switch:
              - check: this.offset.or(null) != null
                processors:
                  - mapping: |
                      meta offset = this.offset
                      meta rows = this.rowCount
                      root = ""
