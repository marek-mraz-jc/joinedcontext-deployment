              request_map: |
                root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
              processors:
                - http:
                    url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/Mapa_SODB_2021_%C4%8Fal%C5%A1ia_n%C3%A1rodnos%C5%A5_okresy/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
                    verb: GET
