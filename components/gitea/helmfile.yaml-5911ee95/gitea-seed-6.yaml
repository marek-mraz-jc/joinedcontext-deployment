            request_map: |
              let path = this.url.or("").re_find_object("^https?://potoky\\.sk/(?P<p>[A-Za-z0-9._~%/-]{1,300})$").p.or(null)
              root = if $path == null || $path.contains("..") { deleted() } else { "" }
