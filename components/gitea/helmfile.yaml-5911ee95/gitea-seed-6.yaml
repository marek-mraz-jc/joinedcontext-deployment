            request_map: |
              root = if this.path.contains("..") { deleted() } else { "" }
              meta event_path = this.path.trim_prefix("/")
            processors:
            - sleep:
                duration: 3s
            - http:
                url: https://www.breziny.sk/${! @event_path }
                verb: GET
                headers:
                  User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
                  Accept: text/html
                timeout: 20s
                retries: 1
            result_map: |
              # 20261018T150000 is Bratislava's wall time; 20261018 alone a whole day.
              map at {
                let m = this.or("").re_find_object("^(?P<d>[0-9]{8})(T(?P<t>[0-9]{4}))?")
                let day = if $m.d.or(null) == null { null } else { "%s-%s-%s".format($m.d.slice(0, 4), $m.d.slice(4, 6), $m.d.slice(6, 8)) }
