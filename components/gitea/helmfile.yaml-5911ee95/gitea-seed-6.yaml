    projects__slovensko__pipelines__podujatia-visitbratislava__bento.yaml: |
      # Generated by seeds/bbsk-events/generate.py from the inventory row Bratislava (wp-rest-fields),
      # read 2026-10-20: https://www.visitbratislava.com/event-categories/top-events/ (T-4896). Do not edit: change the template or the CSV.
      pipeline:
        processors:
        - mapping: |
            root = if this.type() != "array" { throw("the events API answered no list") } else { this }
        - mapping: |
            let f = {"start": "event_date.start_date", "end": "event_date.end_date"}
            map at {
              let d = this.date.or("").string().trim()
              let d = if $d.re_match("^[0-9]{9,10}$") { $d.number().ts_format("2006-01-02", "UTC") } else { $d }
              let d = if $d.re_match("^[0-9]{8}$") { "%s-%s-%s".format($d.slice(0, 4), $d.slice(4, 6), $d.slice(6, 8)) } else { $d }
              let t = this.time.or("").string().re_find_all("[0-9]{1,2}:[0-9]{2}").index(0).catch(null)
              let t = $t.or($d.slice(10).catch("").re_find_all("[0-9]{1,2}:[0-9]{2}").index(0).catch(null))
              let day = $d.slice(0, 10).catch("")
              # 00:00 is the field left empty (ACF writes 00:00:00 for no time): the event keeps its day.
              let hm = if $t != null && !$t.re_match("^0?0:00$") { $t.split(":").map_each(x -> x.number().int64()) } else { null }
              let local = if $hm != null { "%sT%02d:%02d:00".format($day, $hm.index(0), $hm.index(1)) } else { null }
              root = if !$day.re_match("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") { null } else if $local == null { $day } else { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") }
            }
            map at_field {
              root = if this.path == null { null } else { this.item.get(this.path).catch(null) }
            }
            # A post titled only by a day ("23. 10. 2026 (PIATOK)", zilina.sk) is that day's programme page, no event.
            root = this.filter(e -> !e.title.rendered.or("").string().unescape_html().re_match("^[0-9]{1,2}\\.[\\s\\p{Z}]*[0-9]{1,2}\\.[\\s\\p{Z}]*[0-9]{4}")).map_each(e -> {
              "name": e.title.rendered.or(null),
              "start": { "date": { "item": e, "path": $f.start }.apply("at_field"), "time": { "item": e, "path": $f.time_start.or(null) }.apply("at_field") }.apply("at"),
              "end": { "date": { "item": e, "path": $f.end.or(null) }.apply("at_field"), "time": { "item": e, "path": $f.time_end.or(null) }.apply("at_field") }.apply("at"),
              "venue": { "item": e, "path": $f.venue.or(null) }.apply("at_field"),
              "lat": { "item": e, "path": $f.lat.or(null) }.apply("at_field"),
              "lon": { "item": e, "path": $f.lon.or(null) }.apply("at_field"),
              "url": e.link.or(null),
              "description": e.excerpt.rendered.or(null),
              "sourceId": e.id.or(null),
              "modified": e.modified_gmt.or(null).(m -> if m != null { m + "Z" } else { null })
            })
        - mutation: |
            meta events = {"category_cache": {}, "category_default": null, "facts_only": true, "grace": 86400, "home": null, "lease": 28800, "listing": "https://www.visitbratislava.com/event-categories/top-events/", "organizer": null, "provider": "Bratislava, visitbratislava.com (licencia neuvedená)", "region": "Bratislavský kraj", "scope": "/SK/BA", "self": ["bratislava"], "source": "https://www.visitbratislava.com/event-categories/top-events/", "space": env("JC_SPACE"), "town": "Bratislava", "town_scope": "/SK/BA/bratislava", "towns": [["Dubnica nad Váhom","dubnica-nad-vahom",48.95758,18.16566,"office"],["Jablonec","jablonec",48.33242,17.4481,"office"],["Kostolná pri Dunaji","kostolna-pri-dunaji",48.18472,17.43602,"office"],["Kuchyňa","kuchyna",48.40734,17.15973,"office"],["Malinovo","malinovo",48.15655,17.29792,"office"],["Marianka","marianka",48.2495,17.05765,"office"],["Nitra","nitra",48.30563,18.08377,"office"],["Pernek","pernek",48.36778,17.14382,"office"],["Prešov","presov",49.00001,21.23921,"centre"],["Reca","reca",48.2301,17.45832,"office"],["Tomášov","tomasov",48.14252,17.3366,"office"],["Trenčín","trencin",48.89435,18.04058,"office"],["Tureň","turen",48.19197,17.38952,"office"],["Veľký Biel","velky-biel",48.21306,17.3597,"office"],["Vištuk","vistuk",48.33494,17.39631,"office"],["Častá","casta",48.39413,17.35264,"office"],["Čataj","cataj",48.27231,17.47512,"office"],["Bratislava","bratislava",48.14418,17.10942,"office"],["Doľany","dolany",48.416,17.37593,"office"],["Senec","senec",48.2198,17.39732,"office"],["Budmerice","budmerice",48.35653,17.40783,"office"],["Ivanka pri Dunaji","ivanka-pri-dunaji",48.19017,17.25719,"office"],["Šenkvice","senkvice",48.29653,17.34672,"office"]], "venues": [{"poi":"osm-node-1470667811","match":"divadlo gunagu","town":"bratislava","venue":"Divadlo GUnaGU","streetAddress":"Františkánske námestie 7","addressLocality":"Bratislava","lat":48.1441205,"lon":17.1078533,"checked_by":"hand"},{"poi":"osm-ra-5988763","match":"múzeum já