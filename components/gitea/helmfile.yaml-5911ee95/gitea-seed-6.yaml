          url: https://data.statistics.sk/api/v2/dataset/pr5001rr/SK032,SK0321,SK0322,SK0323,SK0324,SK0325,SK0326,SK0327,SK0328,SK0329,SK032A,SK032B,SK032C,SK032D/*/*?lang=sk&type=json
