    projects__bbsk__pipelines__podujatia-ff__bento.yaml: |
      # Generated by seeds/bbsk-events/generate.py from the inventory row Banská Bystrica (umb-cms),
      # read 2026-10-21: https://www.ff.umb.sk/filozoficka-fakulta-umb/kalendar-udalosti/ (T-4896). Do not edit: change the template or the CSV.
      pipeline:
        processors:
        - mapping: |
            let paths = content().string().re_find_all_object("<h3 class=\"title\"><a href=\"(?:https?://www\\.ff\\.umb\\.sk)?(?P<p>/filozoficka\\-fakulta\\-umb/kalendar\\-udalosti/[A-Za-z0-9._~%/-]{1,300}\\.html)\"").map_each(m -> m.p).unique()
            root = $paths.slice(0, [$paths.length(), 50].min()).map_each(p -> { "url": "https://www.ff.umb.sk" + p, "path": p, "sourceId": p })
        - unarchive:
            format: json_array
        - branch:
            request_map: |
              root = if this.path.contains("..") { deleted() } else { "" }
              meta event_path = this.path.trim_prefix("/")
            processors:
            - sleep:
                duration: 1s
            - http:
                url: https://www.ff.umb.sk/${! @event_path }
                verb: GET
                headers:
                  User-Agent: joinedcontext-platform/1.0 (+https://dev.joinedcontext.com; public events)
                  Accept: text/html
                timeout: 20s
                retries: 1
            result_map: |
              # "3. 11. 2026, 8:30" is Bratislava's wall time; "3. 11. 2026" alone a whole day.
              map at {
                let m = this.or("").re_find_object("^(?P<d>[0-9]{1,2})\\. ?(?P<m>[0-9]{1,2})\\. ?(?P<y>[0-9]{4})(?:,? *(?P<h>[0-9]{1,2}):(?P<i>[0-9]{2}))?")
                let day = if $m.y.or("") == "" { null } else { "%s-%02d-%02d".format($m.y, $m.m.number().int64(), $m.d.number().int64()) }
                let local = if $day != null && $m.h.or("") != "" { "%sT%02d:%s:00".format($day, $m.h.number().int64(), $m.i) } else { null }
                root = if $local != null { $local + ($local + "Z").ts_format("-07:00", "Europe/Bratislava") } else { $day }
