    projects__bbsk__pipelines__ukazovatele__pipeline.yaml: |
      # The region's indicators (PL-45, PF-54, PF-55): one KeyPerformanceIndicator per
      # indicator and territory, 28 of them, from the raw cube rows of `bbsk-kraj`. The
      # indicators and their formulas are `joinedcontext-docs/Development/11-banska-bystrica-kpis.md`;
      # neither of them is judged against a threshold, because neither has a published one, and
      # the application shows them as a value and a direction and never as a colour.
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: ukazovatele
        namespace: bbsk
        title: { sk: Ukazovatele kraja, en: Region indicators }
      spec:
        class: scheduled
        # Daily, though the cubes change weekly: a tick the runner misses (a restart, a stream
        # replaced at that minute) then costs a day of stale indicators, not a week (T-4081).
        schedule: '11 4 * * *'
        # Read through the space's own Endpoint and not the store, so the Policy applies to this
        # pipeline exactly as it applies to anybody else (PL-18, PF-39, PL-45). Only the two cubes
        # the compute reads: bbsk-kraj holds ~7,700 rows of seven cubes, and an endpoint source is
        # read as one page of 1000 (T-3132), which left zp3803rs out and every emissions indicator
        # "not measured" (T-3125).
        source:
          endpointRef: { kind: Endpoint, name: bbsk-kraj }
          query:
            type: KeyPerformanceIndicator
            q: dataSet=="om7102rr","zp3803rs"
        targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-kpi:bbsk-kpi
        output: { type: KeyPerformanceIndicator, mode: upsert }
        # Every run rewrites every indicator its cubes carry, so one missing for three weeks is an
        # indicator the region stopped publishing: it is removed rather than shown with a stale value (PL-64).
        # Safe here and only here: this pipeline is the one writer of bbsk-kpi.
        expiry:
          after: 21d
          types: [KeyPerformanceIndicator]
        compute:
          kind: bloblang
          bloblang: |
            # The contract's territory tokens (Development/10 §6), keyed by the code the publishers use.
            let territory = {
              "SK032": "kraj", "SK0321": "okres-banska-bystrica", "SK0322": "okres-banska-stiavnica",
              "SK0323": "okres-brezno", "SK0324": "okres-detva", "SK0325": "okres-krupina",
              "SK0326": "okres-lucenec", "SK0327": "okres-poltar", "SK0328": "okres-revuca",
              "SK0329": "okres-rimavska-sobota", "SK032A": "okres-velky-krtis", "SK032B": "okres-zvolen",
              "SK032C": "okres-zarnovica", "SK032D": "okres-ziar-nad-hronom"
            }
            # Each territory's name in the indicator's title (Development/11 §4), by the same code.
            let territory_title = {
              "SK032": { "sk": "Banskobystrický kraj", "en": "Banská Bystrica Region" },
              "SK0321": { "sk": "okres Banská Bystrica", "en": "Banská Bystrica district" },
              "SK0322": { "sk": "okres Banská Štiavnica", "en": "Banská Štiavnica district" },
              "SK0323": { "sk": "okres Brezno", "en": "Brezno district" },
              "SK0324": { "sk": "okres Detva", "en": "Detva district" },
              "SK0325": { "sk": "okres Krupina", "en": "Krupina district" },
              "SK0326": { "sk": "okres Lučenec", "en": "Lučenec district" },
              "SK0327": { "sk": "okres Poltár", "en": "Poltár district" },
              "SK0328": { "sk": "okres Revúca", "en": "Revúca district" },
              "SK0329": { "sk": "okres Rimavská Sobota", "en": "Rimavská Sobota district" },
              "SK032A": { "sk": "okres Veľký Krtíš", "en": "Veľký Krtíš district" },
              "SK032B": { "sk": "okres Zvolen", "en": "Zvolen district" },
              "SK032C": { "sk": "okres Žarnovica", "en": "Žarnovica district" },
              "SK032D": { "sk": "okres Žiar nad Hronom", "en": "Žiar nad Hronom district" }
            }
            # The indicators of Development/11 §3, keyed by the cube each one reads.
            let indicator = {
              "om7102rr": { "name": "obyvatelstvo-stav", "title": { "sk": "Stav trvale bývajúceho obyvateľstva na konci obdobia", "en": "Resident population at the end of the period" }, "unit": "C62", "formula": "the published value of om7102rr/IN010115/SPOLU for the territory and the latest year the cube carries" },
              "zp3803rs": { "name": "emisie-tuhe-km2", "title": { "sk": "Emisie tuhých znečisťujúcich látok na km²", "en": "Solid particulate emissions per square kilometre" }, "unit": "TNE", "formula": "the published value of zp3803rs/ODPAD_TONY_KM2, pollutant 1, in tonnes per km2, for the territory and the latest year the cube carries" }
            }
            let domain = "bbsk.sk"
            let space = env("JC_SPACE")
            let ran = now().ts_format("2006-01-02T15:04:05Z07:00", "UTC")
            let source_endpoint = "urn:ngsi-ld:Endpoint:%v:%v:%v".format($domain, env("JC_SOURCE_SPACE"), env("JC_SOURCE_SPACE"))

            let rows = this.filter(r -> $indicator.keys().contains(r.dataSet.value) && $territory.keys().contains(r.refArea.value) && r.kpiValue.value.type() == "number")
            let wanted = $indicator.keys().map_each(c -> $territory.keys().map_each(a -> { "cube": c, "area": a })).flatten()

            # An answer with no row of either cube is a read that brought nothing (the endpoint
            # refused the pipeline, or answered a page of something else), never 28 territories that
            # stopped publishing: writing "not measured" over all of them wiped every indicator on dev
            # (T-3113, 2026-10-05). Nothing is written then; an indicator that really stops is removed
            # by the expiry above.
            root = if $rows.length() == 0 { deleted() } else { $wanted.map_each(w -> {
              "spec": $indicator.get(w.cube),
              "token": $territory.get(w.area),
              "place": $territory_title.get(w.area),
              "pick": $rows.filter(r -> r.dataSet.value == w.cube && r.refArea.value == w.area).sort_by(r -> r.refPeriod.value).index(-1).catch(null)
            # A territory the cube carries no row for is left out rather than written as "not measured"
            # over a zero period (T-4081): the last value it had stays until the expiry removes it.
            }).filter(c -> c.pick != null).map_each(c -> {
              "id": "urn:ngsi-ld:KeyPerformanceIndicator:%v:%v:%v-%v".format($domain, $space, c.spec.name, c.token),
              "type": "KeyPerformanceIndicator",
