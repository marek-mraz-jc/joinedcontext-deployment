    projects__bbsk__pipelines__byty__bento.yaml: |
      # The mapping of the byty pipeline (PL-03): one KeyPerformanceIndicator per territory per year per
      # indicator from the housing cube of ŠÚ SR: dwellings under construction at the start and the
      # end of the year, started and completed. The average floor area is left out, because one
      # stream writes one unit and it is square metres.
      # Decoded by the same JSON-stat decoder as every cube stream; nothing is renamed or recomputed.

      pipeline:
        processors:
          - mapping: |
              # --- the cube this stream reads ---------------------------------------
              let cube = "st3004rr"
              let area_dim = "nuts14"
              let period_dim = "st3004rr_rok"
              let indicator_dim = "st3004rr_ukaz"
              let key_dims = []
              let unit_code = "C62"
              let unit_text = "byty"
              # A cell times this is in the unit unitCode names: 1000 for a cube stated in thousands
              # ("v tis. m3"), else 1 (F-BNT1-015).
              let scale = 1
              let source_url = "https://data.statistics.sk/api/v2/dataset/st3004rr/SK032,SK0321,SK0322,SK0323,SK0324,SK0325,SK0326,SK0327,SK0328,SK0329,SK032A,SK032B,SK032C,SK032D/*/ROZOST_BYT_ZAC,ZAC_BYT,DOKONC_BYT,ROZOST_BYT_KON?lang=sk&type=json"
              let domain = "bbsk.sk"
              # JSON-stat 2.0, decoded by the index and never by the order. `value` is flat and
              # row-major over `size`; the position of a code inside a dimension is
              # `dimension.{name}.category.index`, which is NOT sorted: the period dimension comes back
              # newest first (`["2024", "2023"]`). Reading it as ascending puts every figure against the
              # wrong year, and the number is real, so nothing about it looks wrong (T-2304 correction).
              let ds = this
              let ids = this.id
              let sizes = this.size
              let n = $sizes.length()
              let codes = $ids.map_each(d -> $ds.dimension.get(d).category.index.key_values().sort_by(kv -> kv.value).map_each(kv -> kv.key))
              let strides = range(0, $n, 1).map_each(k -> if k + 1 >= $n { 1 } else { $sizes.slice(k + 1, $n).fold(1, t -> t.tally * t.value) })
              # The publisher's own "last updated", which is what a cell was observed at. A cube with none
              # yields null and the entity carries no dateObserved rather than an invented one.
              let updated = $ds.update.or("").ts_parse("2006-01-02").ts_format("2006-01-02T15:04:05Z07:00", "UTC").catch(null)
              # One entity per cell that carries a number. A cell the publisher left empty is not a zero.
              root = range(0, $ds.value.length(), 1).map_each(p -> { "at": range(0, $n, 1).map_each(k -> { $ids.index(k): $codes.index(k).index(((p / $strides.index(k)).floor().int64()) % $sizes.index(k)) }).squash(), "cell": $ds.value.index(p) }).filter(c -> c.cell != null).map_each(c -> {
                "id": "urn:ngsi-ld:%v:%v:%v:%v".format("KeyPerformanceIndicator", $domain, env("JC_SPACE"), [$cube, c.at.get($area_dim), c.at.get($period_dim), c.at.get($indicator_dim)].concat($key_dims.map_each(d -> c.at.get(d))).join("-")),
                "type": "KeyPerformanceIndicator",
                "dataSet": { "type": "Property", "value": $cube },
                "indicator": { "type": "Property", "value": c.at.get($indicator_dim) },
                "refArea": { "type": "Property", "value": c.at.get($area_dim) },
                "refPeriod": { "type": "Property", "value": c.at.get($period_dim) },
                "dimensionKey": if $key_dims.length() == 0 { null } else { { "type": "Property", "value": $key_dims.map_each(d -> c.at.get(d)).join("-") } },
                # `observedAt` belongs to the attribute, never to the entity: CIM 009 4.5.1 makes it a
                # core non-reified term, and the broker refuses a whole entity that carries one as an
                # attribute of its own — 400 per entity, dropped by `drop_on`, so the space stayed empty
                # in silence (T-2445). A cube that states no update time gets no `observedAt` at all.
                # A unit with no UN/CEFACT code (a currency) and a cube with no update time leave their
                # term out rather than write a null the broker refuses.
                "kpiValue": { "type": "Property", "value": c.cell * $scale, "unitCode": $unit_code, "observedAt": $updated }.filter(entry -> entry.value != null),
                "unitText": { "type": "Property", "value": $unit_text },
                "source": { "type": "Property", "value": $source_url },
                "dateObserved": if $updated == null { null } else { { "type": "Property", "value": $updated } }
              }.filter(entry -> entry.value != null))
    projects__bbsk__pipelines__mzdy__pipeline.yaml: |
      # One KeyPerformanceIndicator per cell of the ŠÚ SR cube np3110rr, written through the space's one Endpoint with the runner's service account (PL-18, PF-39, T-2783).
      apiVersion: joinedcontext.com/v1alpha1
      kind: Pipeline
      metadata:
        name: mzdy
        namespace: bbsk
        title: { sk: Priemerná mzda v kraji a okresoch, en: Average wage in the region and its districts }
      spec:
        class: auto
        # Annual or quarterly data: a weekly read is already far more often than it changes (PL-26, PL-27).
        period: 168h
        schedule: '25 3 * * 1'
        source:
          dataSourceRef: { kind: DataSource, name: susr-np3110rr }
        targetEndpoint: urn:ngsi-ld:Endpoint:bbsk.sk:bbsk-kraj:bbsk-kraj
        output: { type: KeyPerformanceIndicator, mode: upsert }
        quotas: { maxMemoryMb: 128, cpuMillicores: 100 }
    projects__bbsk__pipelines__od-clenovia-samospravy__bento.yaml: |
      # The mapping of the od-clenovia-samospravy pipeline, generated from the T-4254 mapping: one Person per row of
      # "Členovia samosprávy" (https://opendata.dev.joinedcontext.com/dataset/bbsk-clenovia-samospravy-efc2f3). Do not edit: change the mapping and run scripts/open-data/generate.py.

      pipeline:
        processors:
          # A layer that answers an error or no feature list is the service failing, so the run fails
          # where it can be seen rather than writing nothing.
          - mapping: |
              root = if this.error.or(null) != null || this.features.or(null) == null { throw("the layer answered no features: %v".format(this.error.message.or(""))) } else { this }
          # Page 0 as it came. When the layer says there is more, it is asked how many rows it holds and
          # every further page of them is read (T-5288). One run holds every page, so a layer past
          # 10000 rows fails the run with its count: regenerate the mapping and size the pipeline's quota.
          - branch:
              request_map: |
                root = if this.properties.exceededTransferLimit.or(false) { "" } else { deleted() }
              processors:
                - http:
                    url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/%C4%8Clenovia_samospr%C3%A1vy/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
                    verb: GET
                    headers:
                      Accept: application/json
                    timeout: 60s
                    retries: 2
                    rate_limit: pipeline_egress
              result_map: |
                root.rowCount = this.count.or(this.error.message.or("no count"))
          - mapping: |
              let rows = this.rowCount.or(null)
              root = if !this.properties.exceededTransferLimit.or(false) { [this] } else if errored() || $rows.type() != "number" { [{ "problem": "the layer did not say how many rows it holds: %v".format(error().or($rows)) }] } else if $rows > 10000 { [{ "problem": "the layer holds %v rows, more than the 10000 one run reads: regenerate the mapping with scripts/open-data/generate.py".format($rows) }] } else if this.features.length() < [1000, $rows].min() { [{ "problem": "the layer answered %v rows where 1000 were asked, so its pages would skip rows".format(this.features.length()) }] } else if $rows <= 1000 { [this] } else { [this].concat(range(1, (($rows + 999) / 1000).floor()).map_each(p -> { "offset": p * 1000, "rowCount": $rows })) }
          - unarchive:
              format: json_array
          - switch:
              - check: this.offset.or(null) != null
                processors:
                  - mapping: |
                      meta offset = this.offset
                      meta rows = this.rowCount
                      root = ""
                  - http:
