      metadata:
        name: registre-read
        namespace: bbsk
        title: { sk: Verejné čítanie registrov, en: 'Public read: registers' }
      spec:
        contextSpaceRef: { kind: ContextSpace, name: bbsk-registre }
        assigner: did:web:bbsk.sk
        assignee: { kind: role, id: public }
        # Discovery beside the reads (T-4258, EP-116): which types and attributes the Endpoint holds,
        # narrowed to this grant (EP-26), so an anonymous MCP client finds them before it queries.
        operations:
          - retrieveOps
          - retrieveEntityTypes
          - retrieveEntityTypeDetails
          - retrieveEntityTypeInfo
          - retrieveAttrTypes
          - retrieveAttrTypeDetails
          - retrieveAttrTypeInfo
          - createSubscription
          - retrieveSubscription
          - updateSubscription
          - deleteSubscription
        # Every type of the space: each is the region's open data, and no mapping writes a person's
        # name, telephone or e-mail.
        information:
          - entities:
              - type: AdministrativeArea
              - type: PublicOrganization
              - type: PointOfInterest
              - type: Bridge
