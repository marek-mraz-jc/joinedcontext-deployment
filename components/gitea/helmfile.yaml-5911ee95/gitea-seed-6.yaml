                "type": "Grant",
                "rokKampan": this.properties."Rok___kampaň".apply("integer"),
                "dotacnyTitul": this.properties."Dotačný_titul".apply("string"),
                "popisDotacnehoTitulu": this.properties."Popis_dotačného_titulu".apply("string"),
                "obecPO": this.properties."Obec__PO_".apply("string"),
                "okres": this.properties."Okres".apply("string"),
                "ePZFSucet": this.properties."EPZF___súčet".apply("float"),
                "ePFRVSucet": this.properties."EPFRV___súčet".apply("float"),
                "sRSRSucet": this.properties."ŠR_SR___súčet".apply("float"),
                "vyplatenaSumaSpoluSucet": this.properties."Vyplatená_suma_spolu___súčet".apply("float"),
                "identifier": { "type": "Property", "value": $local },
                "dataProvider": { "type": "Property", "value": "Banskobystrický samosprávny kraj (CC BY-SA 4.0)" },
                "source": { "type": "Property", "value": "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/PPA_dataset_AGOL_2/FeatureServer/0/query?where=1%3D1&outFields=Rok___kampa%C5%88,Dota%C4%8Dn%C3%BD_titul,Popis_dota%C4%8Dn%C3%A9ho_titulu,Obec__PO_,Okres,EPZF___s%C3%BA%C4%8Det,EPFRV___s%C3%BA%C4%8Det,%C5%A0R_SR___s%C3%BA%C4%8Det,Vyplaten%C3%A1_suma_spolu___s%C3%BA%C4%8Det&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=0&resultRecordCount=1000&orderByFields=FID" },
