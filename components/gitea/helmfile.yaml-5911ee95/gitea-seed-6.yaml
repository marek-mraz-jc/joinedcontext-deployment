        scope: { projects: [banskabystrica, zilina, praha, helsinki, slovensko] }
        allowedOrigins: [https://opendata.smartcity.joinedcontext.com]
        # The city assistants' limits (T-4149 item 1, T-4286: 300 questions per visitor a month by
        # default); $1 a day. One data question over five publishers measured 33,744 tokens on dev
        # (2026-10-16, 5 model calls). T-4660: the owner's third question used up 80,000 (117,171
        # tokens in 3 questions), so a conversation gets 300,000 and each question's loop answers by
        # 60,000 (the platform's QUESTION_TOKENS); the day's cost cap still binds first. T-4737: data
        # answers measured 194,597 tokens mean and 296,985 p90 (dev turns, 2026-10-19), so 300,000 refused
        # the owner's second question on prod; 3,000,000 holds 10 answers at the p90 and the day's cost
        # cap binds before it.
        rateLimit: { requestsPerMinute: 30, perClientPerMinute: 10, perClientPerHour: 60, perClientPerDay: 200, streamsPerClient: 2 }
        budget:
          tokensPerDay: 5000000
          tokensPerConversation: 3000000
          costPerDayUsd: 1
          costPerConversationUsd: 0.15
          outputTokensPerAnswer: 700
          messagesPerConversation: 30
          questionChars: 1000
          # T-5928: the region office trying it shares one address; the rate above paces it.
          visitorSharePercent: 100
        model: { router: google/gemini-3.8-flash, answer: google/gemini-3.8-flash }
        # Title and greeting per language (T-4365); the title is the catalogue's own name unless the
        # assistant sets one, and the widget writes "Asistent"/"Assistant" beside it.
        theme:
          title:
            sk: "Otvorené dáta"
            en: "Open data"
            fi: "Avoin data"
          greeting:
            sk: "Dobrý deň! Pýtajte sa na otvorené dáta zo všetkých miest a krajov v katalógu."
            en: "Hello! Ask about the open data of every city and region in the catalogue."
            fi: "Hei! Kysy kaikkien katalogin kaupunkien ja alueiden avoimesta datasta."
        suggestions:
          sk:
            - "Koľko mostov je v registri mostov BBSK?"
            - "Ako pripojím katalóg cez MCP do Clauda?"
          en:
            - "How many bridges are in the BBSK bridge register?"
            - "How do I add the catalogue to Claude via MCP?"
          fi:
            - "Montako siltaa BBSK:n siltarekisterissä on?"
            - "Miten yhdistän katalogin Claudeen MCP:n kautta?"
        disclaimer:
          sk: "Odpovede tvorí umelá inteligencia z katalógu a z otvorených dát jeho vydavateľov. Môžu obsahovať chyby, overte si ich v uvedených zdrojoch. Nezadávajte osobné údaje."
          en: "Answers are written by AI from the catalogue and its publishers' open data. They may contain mistakes; check them in the linked sources. Do not enter personal data."
          fi: "Vastaukset kirjoittaa tekoäly katalogista ja sen julkaisijoiden avoimesta datasta. Niissä voi olla virheitä; tarkista ne linkitetyistä lähteistä. Älä anna henkilötietoja."
        languages: [sk, en, fi]
    projects__bbsk__assistant__sources__portal.yaml: |
      # Every public dataset of data.dev for the catalogue's general assistant (T-4342, owner
      # 2026-10-16): the CKAN source with no `organizations`, so all five bodies' datasets, read
      # anonymously, so no private one reaches the index. It reads catalogue records, never a website:
      # titles, descriptions, publishers, keywords, licences, frequencies and distributions. Read
      # nightly after the harvest (charts/ckan harvest.schedule, 03:23).
      apiVersion: joinedcontext.com/v1alpha1
      kind: KnowledgeSource
      metadata:
        name: portal
        namespace: bbsk
        title:
          sk: Všetky datasety katalógu opendata.dev
          en: Every dataset of the opendata.dev catalogue
      spec:
        source: ckan
        ckanInstanceRef: bbsk
        schedule: '50 3 * * *'
        maxPages: 2000
        languages: [sk, cs, en, fi]
        visibility: public
