                      url: "https://services-eu1.arcgis.com/ODrCBoJHlKVMl3Cg/arcgis/rest/services/PPA_dataset_AGOL_2/FeatureServer/0/query?where=1%3D1&outFields=Rok___kampa%C5%88,Dota%C4%8Dn%C3%BD_titul,Popis_dota%C4%8Dn%C3%A9ho_titulu,Obec__PO_,Okres,EPZF___s%C3%BA%C4%8Det,EPFRV___s%C3%BA%C4%8Det,%C5%A0R_SR___s%C3%BA%C4%8Det,Vyplaten%C3%A1_suma_spolu___s%C3%BA%C4%8Det&returnGeometry=false&outSR=4326&geometryPrecision=6&f=geojson&resultOffset=${! @offset }&resultRecordCount=1000&orderByFields=FID"
                      verb: GET
                      headers:
                        Accept: application/geo+json
                      timeout: 60s
                      retries: 2
                      rate_limit: pipeline_egress
