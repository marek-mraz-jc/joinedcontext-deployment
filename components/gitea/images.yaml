---
gitea:
  forge:
    # images/patched-gitea: docker.gitea.com/gitea 1.27.3-rootless rebuilt with `apk upgrade`
    # (T-7124), because 1.27.3, the newest 1.27 patch, ships openssh-keygen 10.3_p1-r0
    # (CVE-2026-123158 CRITICAL, fixed in 10.3_p1-r2) and brotli-libs 1.2.0-r1. Published and
    # signed by .github/workflows/image-patched.yml, whose run summary prints the digest. The chart
    # builds `<registry>/<repository>:<tag>-rootless@<digest>`, so the image is published as
    # 1.27.3-rootless and the tag here carries no suffix. Re-pin when image-patched rebuilds it
    # (monthly) and drop the rebuild once an upstream 1.27 tag scans clean or the forge moves to 28.
    # 1.27.1 fixes CVE-2026-60004 (git-hook RCE, CISA KEV), owner decision 2026-10-07 (T-3231);
    # the bundled runner's CRITICAL is excused in .ci/pinned-images-ignore.yaml (T-6696).
    registry: 'ghcr.io'
    repository: 'marek-mraz-jc/joinedcontext-gitea'
    tag: '1.27.3'
    digest: 'sha256:20218ff12543238061ee1931b0e35b081324b5981180781d8311e84a403e7726'
