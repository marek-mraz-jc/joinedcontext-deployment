---
gitea:
  forge:
    # The chart builds the reference as `<registry>/<repository>:<tag>-rootless@<digest>`,
    # so this digest is the one of docker.gitea.com/gitea:1.27.1-rootless, not of the
    # root-based tag. Re-pin both together:
    #   curl -sI -H 'Accept: application/vnd.oci.image.index.v1+json' \
    #     https://docker.gitea.com/v2/gitea/manifests/<tag>-rootless | grep -i docker-content-digest
    registry: 'docker.gitea.com'
    repository: 'gitea'
    # 1.27.1 fixes CVE-2026-60004 (git-hook RCE, CISA KEV), owner decision 2026-10-07 (T-3231).
    tag: '1.27.1'
    digest: 'sha256:36cce26be71609091e1236d5b5de2c66a81fb8a7d45756a5fd3b7a28c11733b7'
