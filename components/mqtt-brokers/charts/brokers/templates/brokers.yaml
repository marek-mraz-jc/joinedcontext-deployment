{{- /*
  One RMQTT per MqttBroker (ADR-N-048, PL-74). Two listeners, both plain MQTT inside the pod:
  `internal` on 1883 for the pipeline runner only, `external` on 1884 behind the ingress
  controller, which terminates TLS on 8883 and passes the client's address in a PROXY header.
  Every CONNECT goes to the gateway (rmqtt-auth-http); its answer carries the client's ACL and
  the broker's own last rule denies everything else. No storage plugin: nothing on disk.
*/}}
{{- $root := . }}
{{- $hosts := dict }}
{{- range .Values.brokers }}
{{- $release := .release | default (include "brokers.release" .) }}
{{- if gt (len $release) 63 }}
{{- fail (printf "broker %s/%s: release %q is longer than a DNS label; pass the bounded name as `release`" .project .name $release) }}
{{- end }}
{{- $host := printf "%s.%s.mqtt.%s" .name .project (required "domain names the brokers' hosts" $root.Values.domain) }}
{{- if hasKey $hosts $host }}
{{- fail (printf "two brokers answer on %s" $host) }}
{{- end }}
{{- $_ := set $hosts $host true }}
{{- $limits := .limits | default dict }}
{{- $maxBytes := $limits.maxMessageBytes | default 65536 | int }}
{{- $perSecond := $limits.messagesPerSecond | default 10 | int }}
{{- $connections := $limits.maxConnections | default 1000 | int }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $release }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "brokers.labels" $root | nindent 4 }}
    app.kubernetes.io/instance: {{ $release }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $release }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "brokers.labels" $root | nindent 4 }}
    app.kubernetes.io/instance: {{ $release }}
data:
  rmqtt.toml: |
    node.id = 1
    # Standard output only: the root filesystem is read-only and nothing is kept.
    log.to = "console"
    log.level = "info"
    plugins.dir = "/etc/rmqtt/plugins/"
    plugins.default_startups = ["rmqtt-acl", "rmqtt-auth-http"]
    # Started by the binary unless named here: an HTTP API and dashboard on 6060 with no token.
    plugins.disabled_default_startups = ["rmqtt-http-api"]
    # The node-to-node gRPC of a cluster; one node, so loopback.
    rpc.server_addr = "127.0.0.1:5363"
    # The binary opens these by default, with the self-signed certificate inside the image.
    listener.tls.external.enable = false
    listener.ws.external.enable = false
    listener.wss.external.enable = false
    listener.quic.external.enable = false
    # ponytail: RMQTT 0.24 has no per-publisher rate; `mqueue_rate_limit` caps delivery to each
    # subscriber, so a publisher above messagesPerSecond loses the overflow, not its connection.
    {{- range $listener := list (dict "name" "internal" "port" 1883 "proxy" false) (dict "name" "external" "port" 1884 "proxy" true) }}
    {{- $l := printf "listener.tcp.%s" $listener.name }}
    {{ $l }}.enable = true
    {{ $l }}.addr = "0.0.0.0:{{ $listener.port }}"
    {{ $l }}.max_connections = {{ $connections }}
    {{ $l }}.max_packet_size = "{{ $maxBytes }}B"
    {{ $l }}.allow_anonymous = false
    {{ $l }}.max_qos_allowed = 1
    {{ $l }}.session_expiry_interval = "0s"
    {{ $l }}.max_session_expiry_interval = "0s"
    {{ $l }}.max_mqueue_len = 1000
    {{ $l }}.mqueue_rate_limit = "{{ $perSecond }},1s"
    {{ $l }}.proxy_protocol = {{ $listener.proxy }}
    {{- end }}
  rmqtt-auth-http.toml: |
    http_timeout = "5s"
    disconnect_if_pub_rejected = true
    # The token's `exp` ends the connection; the device reconnects with a fresh one.
    disconnect_if_expiry = true
    # The gateway unreachable is a refusal, never a pass to the next plugin.
    deny_if_error = true
    http_auth_req.url = {{ required "authUrl names the gateway's CONNECT check" $root.Values.authUrl | quote }}
    http_auth_req.method = "post"
    http_auth_req.headers = { content-type = "application/json" }
    http_auth_req.params = { clientid = "%c", username = "%u", password = "%P", ipaddr = "%a" }
    # No http_acl_req: the ACL comes with the CONNECT answer.
  rmqtt-acl.toml: |
    disconnect_if_pub_rejected = true
    # The last member of the chain: whatever the gateway did not allow is refused.
    rules = [["deny", "all"]]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $release }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "brokers.labels" $root | nindent 4 }}
    app.kubernetes.io/instance: {{ $release }}
  annotations:
    config.linkerd.io/opaque-ports: "1883,1884"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mqtt-broker
    app.kubernetes.io/instance: {{ $release }}
  ports:
    - name: mqtt-internal
      port: 1883
      targetPort: 1883
      protocol: TCP
    - name: mqtt-external
      port: 1884
      targetPort: 1884
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $release }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "brokers.labels" $root | nindent 4 }}
    app.kubernetes.io/name: mqtt-broker
    app.kubernetes.io/instance: {{ $release }}
spec:
  replicas: 1
  # No state to hand over: a new pod starts empty and the clients reconnect.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt-broker
      app.kubernetes.io/instance: {{ $release }}
  template:
    metadata:
      labels:
        {{- include "brokers.labels" $root | nindent 8 }}
        app.kubernetes.io/name: mqtt-broker
        app.kubernetes.io/instance: {{ $release }}
        joinedcontext.com/project: {{ .project | quote }}
      annotations:
        checksum/config: {{ printf "%s%s%s%d%d%d" $root.Values.authUrl $release $host $maxBytes $perSecond $connections | sha256sum }}
        {{- if $root.Values.serviceMesh.enabled }}
        linkerd.io/inject: enabled
        config.linkerd.io/opaque-ports: "1883,1884"
        {{- end }}
    spec:
      serviceAccountName: {{ $release }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: rmqtt
          image: {{ include "brokers.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: ["-f", "/etc/rmqtt/rmqtt.toml"]
          securityContext:
            {{- toYaml $root.Values.securityContext | nindent 12 }}
          ports:
            - name: mqtt-internal
              containerPort: 1883
              protocol: TCP
            - name: mqtt-external
              containerPort: 1884
              protocol: TCP
          # No probe: a TCP probe from the kubelet is an unmeshed peer, which the Linkerd Servers
          # below refuse on both ports, and RMQTT serves no HTTP health without its HTTP API.
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/rmqtt
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $release }}
            items:
              - key: rmqtt.toml
                path: rmqtt.toml
              - key: rmqtt-auth-http.toml
                path: plugins/rmqtt-auth-http.toml
              - key: rmqtt-acl.toml
                path: plugins/rmqtt-acl.toml
---
# TLS ends at the ingress controller with a certificate for this one host (HTTP-01, never a
# wildcard); the broker sees the client's address in the PROXY header.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $release }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "brokers.labels" $root | nindent 4 }}
    app.kubernetes.io/instance: {{ $release }}
spec:
  secretName: {{ $release }}-tls
  issuerRef:
    name: {{ $root.Values.clusterIssuer | quote }}
    kind: ClusterIssuer
  dnsNames:
    - {{ $host | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ $release }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "brokers.labels" $root | nindent 4 }}
    app.kubernetes.io/instance: {{ $release }}
spec:
  entryPoints:
    - {{ $root.Values.entryPoint }}
  routes:
    - match: HostSNI(`{{ $host }}`)
      services:
        - name: {{ $release }}
          port: 1884
          proxyProtocol:
            version: 2
  tls:
    secretName: {{ $release }}-tls
{{- if $root.Values.serviceMesh.enabled }}
{{- range $listener := list (dict "name" "internal" "port" 1883 "sa" $root.Values.runner.serviceAccount "ns" $root.Values.runner.namespace) (dict "name" "external" "port" 1884 "sa" $root.Values.ingress.serviceAccount "ns" $root.Values.ingress.namespace) }}
{{- $server := printf "%s-%s" $release $listener.name }}
---
# {{ $listener.port }} refuses every identity but the one below, whatever the NetworkPolicy lets through.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: {{ $server }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "brokers.labels" $root | nindent 4 }}
    app.kubernetes.io/instance: {{ $release }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mqtt-broker
      app.kubernetes.io/instance: {{ $release }}
  port: {{ $listener.port }}
  proxyProtocol: opaque
  accessPolicy: deny
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: {{ $server }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "brokers.labels" $root | nindent 4 }}
    app.kubernetes.io/instance: {{ $release }}
spec:
  identityRefs:
    - kind: ServiceAccount
      name: {{ required "the client's ServiceAccount" $listener.sa }}
      namespace: {{ required "the client's namespace" $listener.ns }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: {{ $server }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "brokers.labels" $root | nindent 4 }}
    app.kubernetes.io/instance: {{ $release }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: {{ $server }}
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: {{ $server }}
{{- end }}
{{- end }}
{{- end }}
