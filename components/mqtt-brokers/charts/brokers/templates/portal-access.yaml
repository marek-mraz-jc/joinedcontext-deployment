{{- if .Values.portal.namespace }}
{{- /*
  What the Portal does in the brokers' namespace (ADR-N-048 §2.6, T-3994): read the template
  above, and apply, list and delete the objects of each broker it stamps from it. RBAC cannot
  bind `create` or `list` to a name, so the Portal's own client refuses every object not named
  `mqtt-…` and every kind not in the template (src/apps/kube.rs, MQTT_KINDS); the template is
  `broker-template` and stays out of its reach.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal-mqtt-brokers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "brokers.labels" (dict "root" . "managedBy" .Release.Service) | nindent 4 }}
    app.kubernetes.io/component: portal-access
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts", "configmaps", "services"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    # middlewaretcps: a broker's allowedSources filter, `mqtt-…-sources` (PF-129, T-5870).
    resources: ["ingressroutetcps", "middlewaretcps"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["policy.linkerd.io"]
    resources: ["servers", "httproutes", "meshtlsauthentications", "authorizationpolicies"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal-mqtt-brokers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "brokers.labels" (dict "root" . "managedBy" .Release.Service) | nindent 4 }}
    app.kubernetes.io/component: portal-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portal-mqtt-brokers
subjects:
  - kind: ServiceAccount
    name: {{ required "portal.serviceAccount" .Values.portal.serviceAccount }}
    namespace: {{ .Values.portal.namespace }}
---
{{- /*
  T-6719, G-1: RBAC lets the Portal (jc's account on jc-prod) create any Deployment here, and
  restricted Pod Security refuses only the pods such a Deployment would start. The API server
  refuses the Deployment itself unless it is a broker the template describes: named mqtt-…, the
  chart's RMQTT digest in every container, nothing privileged, no host namespace, no host path.
  A native policy, so no webhook can fail open and no Kyverno action softens it.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Release.Namespace }}-portal-mqtt-brokers
  labels:
    {{- include "brokers.labels" (dict "root" . "managedBy" .Release.Service) | nindent 4 }}
    app.kubernetes.io/component: portal-access
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    - name: the-portal
      expression: request.userInfo.username == "system:serviceaccount:{{ .Values.portal.namespace }}:{{ .Values.portal.serviceAccount }}"
  variables:
    - name: pod
      expression: object.spec.template.spec
    - name: containers
      expression: "variables.pod.containers + (has(variables.pod.initContainers) ? variables.pod.initContainers : [])"
  validations:
    - expression: object.metadata.name.startsWith("mqtt-")
      messageExpression: '"The Portal writes only brokers named mqtt-…, not " + object.metadata.name + " (T-6719)."'
    - expression: variables.containers.all(c, c.image == {{ include "brokers.image" . | quote }})
      messageExpression: '"A broker runs only the pinned RMQTT image {{ include "brokers.image" . }} (T-6719)."'
    - expression: >-
        variables.containers.all(c, !has(c.securityContext)
          || ((!has(c.securityContext.privileged) || !c.securityContext.privileged)
            && (!has(c.securityContext.allowPrivilegeEscalation) || !c.securityContext.allowPrivilegeEscalation)
            && (!has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add)
              || size(c.securityContext.capabilities.add) == 0)))
      message: A broker container is never privileged, never escalates and adds no capability (T-6719).
    - expression: >-
        !(has(variables.pod.hostNetwork) && variables.pod.hostNetwork)
        && !(has(variables.pod.hostPID) && variables.pod.hostPID)
        && !(has(variables.pod.hostIPC) && variables.pod.hostIPC)
        && (!has(variables.pod.volumes) || variables.pod.volumes.all(v, !has(v.hostPath)))
      message: A broker uses no host namespace and mounts no host path (T-6719).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Release.Namespace }}-portal-mqtt-brokers
  labels:
    {{- include "brokers.labels" (dict "root" . "managedBy" .Release.Service) | nindent 4 }}
    app.kubernetes.io/component: portal-access
spec:
  policyName: {{ .Release.Namespace }}-portal-mqtt-brokers
  validationActions: [Deny]
{{- end }}
