---
# Re-pin a digest with:
#   T=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:alpine/kubectl:pull" | jq -r .token)
#   curl -sI -H "Authorization: Bearer $T" \
#     -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
#     https://registry-1.docker.io/v2/alpine/kubectl/manifests/<tag> | grep -i docker-content-digest
sandbox-reaper:
  reaper:
    # kubectl on Alpine, one minor behind the newest Kubernetes release so it stays inside
    # the supported client skew of any cluster this deploys to. The Kubernetes project's own
    # `registry.k8s.io/kubectl` is distroless and carries no shell, and the reaper is a shell
    # script around two kubectl calls, so it cannot run there.
    repository: 'alpine/kubectl'
    tag: '1.33.4'
    digest: 'sha256:f032392d7c23894ac391425ff5ff9658c064279d8519df8eb8c7d38dde867ce5'
