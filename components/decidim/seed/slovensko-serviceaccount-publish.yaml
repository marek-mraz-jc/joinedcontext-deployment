# Decidim's Publish to context space (T-6458): the platform's own Decidim pushes the outputs of a
# process into slovensko-participacia. Its client `slovensko-decidim-publish` is a platform client
# (components/decidim/keycloak-clients.yaml), so the secret reaches Sidekiq by secretRef and nobody
# issues one by hand; the Portal leaves a client it did not make alone.
apiVersion: joinedcontext.com/v1alpha1
kind: ServiceAccount
metadata:
  name: decidim-publish
  namespace: slovensko
  title: { sk: Zverejňovanie z Decidimu, en: Decidim publishing }
spec:
  owner: { user: de300000-0000-4000-8000-000000000001 } # demo.steward
  purpose: Decidim's background jobs write the published outputs of a process into the space slovensko-participacia
  roles:
    - role: space-writer
      scope: { contextSpace: slovensko-participacia }
      types: [ParticipatoryProcess, Proposal, BudgetProject, Result, Meeting]
  credentials:
    - kind: oauth-client
      name: main
