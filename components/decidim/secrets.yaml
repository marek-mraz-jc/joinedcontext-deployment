---
decidim:
  web:
    db-decidim:
      username: 'decidim'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - decidim
        - postgres
    # Rails' SECRET_KEY_BASE: session cookies, signed ids and every password-reset or
    # confirmation token derive from it. Rotating it signs everyone out, hence generated once and
    # kept; the image ships no credentials file to fall back to.
    decidim-secret-key-base:
      secret:
        length: 64
        generate: true
      componentNamespaces:
        - decidim
