args:
  - --save
  - ""
  - --appendonly
  - "no"
  - --maxmemory
  - 96mb
  - --maxmemory-policy
  - noeviction
containerPort: 6379
fullnameOverride: decidim-redis
image:
  digest: sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
  pullPolicy: IfNotPresent
  repository: docker.io/library/redis
  tag: 7-alpine
nameOverride: decidim-redis
podSecurityContext:
  fsGroup: 999
  runAsGroup: 999
  runAsNonRoot: true
  runAsUser: 999
  seccompProfile:
    type: RuntimeDefault
preStopSleepSeconds: 0
probes:
  enabled: false
  readinessExec:
    - redis-cli
    - ping
replicaCount: 1
resources:
  limits:
    cpu: 250m
    memory: 160Mi
  requests:
    cpu: 20m
    memory: 64Mi
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
service:
  enabled: true
  name: redis
  port: 6379
  targetPort: 6379
  type: ClusterIP
serviceAccount:
  automountServiceAccountToken: false
  create: false
serviceMesh:
  enabled: true
