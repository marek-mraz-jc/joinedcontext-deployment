{{- /*
Pod Security Standards, vendored verbatim from github.com/kyverno/policies (files/upstream,
re-vendored by .ci/policies/vendor-upstream-policies.sh) so the manifests CI evaluates and
the manifests admission evaluates are the same file. Two things are set here rather than in
the vendored copy, because the copy must stay editable only by the vendor script:

  failureAction  — the vendored policies carry the deprecated spec.validationFailureAction;
                   move it to the per-rule validate.failureAction Kyverno reads now, at the
                   environment's setting (Audit in development, Enforce in production).
  namespaces     — the vendored policies match every namespace. These are the namespaces
                   this deployment owns. Enforcing Pod Security Standards on the namespaces
                   the cluster distribution owns (linkerd, traefik, cert-manager,
                   system-upgrade) would block that distribution's own upgrades, which is
                   not a trade this chart gets to make on an operator's behalf.
*/ -}}
{{- if and .Values.podSecurity.enabled .Values.podSecurity.namespaces }}
{{- range $name := .Values.podSecurity.policies }}
{{- $policy := $.Files.Get (printf "files/upstream/%s.yaml" $name) | fromYaml }}
{{- if not $policy.spec }}
{{- fail (printf "files/upstream/%s.yaml did not parse as a ClusterPolicy — re-run .ci/policies/vendor-upstream-policies.sh" $name) }}
{{- end }}
{{- $_ := unset $policy.spec "validationFailureAction" }}
{{- range $rule := $policy.spec.rules }}
{{- $_ := set $rule.validate "failureAction" $.Values.failureAction }}
{{- range $matcher := $rule.match.any }}
{{- $_ := set $matcher.resources "namespaces" $.Values.podSecurity.namespaces }}
{{- end }}
{{- end }}
---
{{ toYaml $policy }}
{{- end }}
{{- end }}
