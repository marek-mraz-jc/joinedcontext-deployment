---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-app-build-jobs
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: The Portal Starts Only Walled Application Builds
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Job
    policies.kyverno.io/description: >-
      The Portal's Role lets it create Jobs so that its reconciler can build an
      application from its repository (AP-80, ADR-N-026). That build runs the
      application's own code, so the Job is only safe inside the walls the
      deployment puts around it (AP-81): the `app-builder` NetworkPolicy, which
      selects pods by their name label, and the `app-builder` ServiceAccount,
      which has no token and no Role. A Job the Portal creates without both, or
      with a token mounted, or without a deadline, would run untrusted code with
      the network or the identity of something else, and is refused.
spec:
  background: false
  rules:
    - name: portal-jobs-are-walled-app-builds
      match:
        any:
          - resources:
              kinds: [Job]
              operations: [CREATE]
              namespaces: KYVERNO_NAMESPACES
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: Equals
            value: "system:serviceaccount:*:portal"
      validate:
        failureAction: KYVERNO_FAILURE_ACTION
        message: >-
          A Job the Portal starts is an application build (AP-80): it must carry the
          app.kubernetes.io/name=app-builder label on the Job and its pods and run as the
          app-builder ServiceAccount with no token mounted (AP-81).
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: app-builder
          spec:
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: app-builder
              spec:
                serviceAccountName: app-builder
                automountServiceAccountToken: false
    - name: portal-app-builds-are-bounded
      match:
        any:
          - resources:
              kinds: [Job]
              operations: [CREATE]
              namespaces: KYVERNO_NAMESPACES
      preconditions:
        all:
          - key: "{{ request.userInfo.username }}"
            operator: Equals
            value: "system:serviceaccount:*:portal"
      validate:
        failureAction: KYVERNO_FAILURE_ACTION
        message: >-
          An application build runs for at most 15 minutes: activeDeadlineSeconds must be set
          and no more than 900 (AP-81).
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.activeDeadlineSeconds || `0` }}"
                operator: LessThan
                value: 1
              - key: "{{ request.object.spec.activeDeadlineSeconds || `0` }}"
                operator: GreaterThan
                value: 900
