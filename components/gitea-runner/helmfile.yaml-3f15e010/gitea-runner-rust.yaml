command:
  - /usr/local/bin/runner
configMap:
  data:
    runner.yaml: |
      log:
        level: info
      runner:
        file: /tmp/runner/.runner
        capacity: 1
        # A build past this is a build that hangs; the forge's own job limit is longer.
        timeout: 30m
        labels: ["rust-1.90:host"]
        envs:
          JC_FORGE_URL: "http://gitea-http.smartcity.svc.cluster.local:3000"
          JC_PORTAL_URL: "http://portal.smartcity.svc.cluster.local:8080"
      # One repository's cache is never another repository's input.
      cache:
        enabled: false
  enabled: true
  mountPath: /opt/runner
env:
  GITEA_INSTANCE: http://gitea-http.smartcity.svc.cluster.local:3000
extraInitContainers:
  - command:
      - /bin/sh
      - -c
      - cp /secret/token /tmp/runner-secret/token
    image: ghcr.io/marek-mraz-jc/joinedcontext-app-builder-rust:main@sha256:3d3b06ce0e1fde61e7c157735798df0d9907bb5e20a960e25d5549f9265c43c5
    name: registration-token
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
      - mountPath: /secret
        name: registration
        readOnly: true
      - mountPath: /tmp/runner-secret
        name: runner-secret
extraVolumeMounts:
  - mountPath: /tmp/runner-secret
    name: runner-secret
extraVolumes:
  - name: registration
    secret:
      items:
        - key: token
          path: token
      secretName: gitea-runner-registration
  - emptyDir:
      medium: Memory
      sizeLimit: 1Mi
    name: runner-secret
fullnameOverride: gitea-runner-rust
image:
  digest: sha256:3d3b06ce0e1fde61e7c157735798df0d9907bb5e20a960e25d5549f9265c43c5
  pullPolicy: IfNotPresent
  repository: ghcr.io/marek-mraz-jc/joinedcontext-app-builder-rust
  tag: main
nameOverride: gitea-runner
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
probes:
  enabled: false
  readiness:
    failureThreshold: 6
    periodSeconds: 10
  readinessExec:
    - test
    - -s
    - /tmp/runner/.runner
replicaCount: 1
resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: 250m
    memory: 256Mi
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
service:
  enabled: false
serviceAccount:
  automountServiceAccountToken: false
  create: true
serviceMesh:
  enabled: true
