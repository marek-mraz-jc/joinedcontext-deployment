---
gitea-runner:
  runner:
    # The Portal release's builder image (AP-82), which also carries the forge's runner binary
    # and its loop (builder/Dockerfile of the portal repository). Published by the portal's
    # image.yml as joinedcontext-app-builder; digest read from the registry for the `main` tag.
    # Pinned to portal f8ea81e: build-app derives JC_APP_BUILD itself and lane.mjs has upload and
    # propose, the contract the seeded workflows call (T-2609, T-2633). Portal 7fc3df50: the same
    # builder and SDK, apt layers refreshed daily, curl 8.14.1-2+deb13u7 (CVE-2026-8286, T-3834). Portal 91c865f5: lane.mjs SDK-46 matches a
    # real data-jc-src stamp, not the SDK's own attribute name (T-3578).
    repository: 'ghcr.io/marek-mraz-jc/joinedcontext-app-builder'
    tag: 'main'
    digest: 'sha256:212bdba47a775d18805ff72af2ad4791a5a18b9b2fff914ff76a9fe7af2ed74b'
  # The rust-1.90 runner (AP-106): the same Dockerfile's `rust` stage, published by the portal's
  # image.yml as joinedcontext-app-builder-rust. Pinned to portal f8ea81e, the same commit as the
  # node runner (T-2633). gitea-runner.rust stays off until the node has room (T-2616).
  rust:
    repository: 'ghcr.io/marek-mraz-jc/joinedcontext-app-builder-rust'
    tag: 'main'
    # Portal 7fc3df50: same stage, rebuilt with the curl fix (T-3834). Portal 91c865f5 (T-3578).
    digest: 'sha256:9420b0c36ad873cc1411bf3608595693996ab09f37e5916d76dc9a5ae95ed536'
