    # Pinned to portal 3618101: build-app derives JC_APP_BUILD itself and lane.mjs has upload and
    # propose, the contract the seeded workflows call (T-2609, T-2633).
    repository: 'ghcr.io/marek-mraz-jc/joinedcontext-app-builder'
    tag: 'main'
    digest: 'sha256:0fcff164ff9a82e72b6db0a5fcfc021589e8761c5c3ed7edf56253f2454408e9'
  # The rust-1.90 runner (AP-106): the same Dockerfile's `rust` stage, published by the portal's
  # image.yml as joinedcontext-app-builder-rust. Pinned to portal 3618101, the same commit as the
  # node runner (T-2633). gitea-runner.rust stays off until the node has room (T-2616).
  rust:
    repository: 'ghcr.io/marek-mraz-jc/joinedcontext-app-builder-rust'
    tag: 'main'
    digest: 'sha256:30bba07ed02d9822bbea3b8e7418d2f4a27e43dfbfc040dfef8838d03a7beb0f'
