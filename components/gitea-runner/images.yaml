    # Pinned to portal 0741b34: build-app derives JC_APP_BUILD itself and lane.mjs has upload and
    # propose, the contract the seeded workflows call (T-2609, T-2633).
    repository: 'ghcr.io/marek-mraz-jc/joinedcontext-app-builder'
    tag: 'main'
    digest: 'sha256:ff2201543315b31abfc1c939b5c00d0cf9e60e6f1fbdddf2920ef1ed83a64514'
  # The rust-1.90 runner (AP-106): the same Dockerfile's `rust` stage, published by the portal's
  # image.yml as joinedcontext-app-builder-rust. Pinned to portal 0741b34, the same commit as the
  # node runner (T-2633). gitea-runner.rust stays off until the node has room (T-2616).
  rust:
    repository: 'ghcr.io/marek-mraz-jc/joinedcontext-app-builder-rust'
    tag: 'main'
    digest: 'sha256:841c69fbd49d24584f4af1422990e8d73171c41c64f77a09916b5982d2b73d62'
