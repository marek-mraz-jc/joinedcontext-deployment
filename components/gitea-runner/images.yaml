    # Pinned to portal f0d402a: build-app derives JC_APP_BUILD itself and lane.mjs has upload and
    # propose, the contract the seeded workflows call (T-2609, T-2633).
    repository: 'ghcr.io/marek-mraz-jc/joinedcontext-app-builder'
    tag: 'main'
    digest: 'sha256:ee816677efe1cd3b7312a0bf9e79cd91b6af682cbe582c3696b3a4d1e67582a7'
  # The rust-1.90 runner (AP-106): the same Dockerfile's `rust` stage, published by the portal's
  # image.yml as joinedcontext-app-builder-rust. Pinned to portal f0d402a, the same commit as the
  # node runner (T-2633). gitea-runner.rust stays off until the node has room (T-2616).
  rust:
    repository: 'ghcr.io/marek-mraz-jc/joinedcontext-app-builder-rust'
    tag: 'main'
    digest: 'sha256:7f505827bb389c9fd5900ceed20a6669bbd191a667732379a06b2ac515b08368'
