---
# The runner executes the workflow of every application repository, so an application's own
# install, test and build code runs here (T-1707, ADR-N-028 §5). It reaches exactly what a
# build needs (AP-81): the forge to take jobs, clone and publish the package, the Portal API to
# propose `status.build`, and DNS. No ingress at all: nothing calls a runner.
gitea-runner:
  podSelector:
    app.kubernetes.io/name: gitea-runner
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
              app.kubernetes.io/instance: gitea-forge
          componentNamespace: gitea
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal-portal
          componentNamespace: portal
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# The other half of the Portal leg: the Portal's own policy admits the edge alone.
portal-ingress-from-gitea-runner:
  componentNamespace: portal
  podSelector:
    app.kubernetes.io/name: portal-portal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea-runner
          componentNamespace: gitea-runner
      ports:
        - protocol: TCP
          port: 8080
