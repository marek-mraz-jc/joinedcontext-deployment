{{- if not .Values.host }}{{ fail "basemap: host is required" }}{{ end }}
{{- if not .Values.regions }}{{ fail "basemap: name at least one region" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tiles.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiles.labels" . | nindent 4 }}
data:
  refresh.sh: |
    {{- .Files.Get "files/refresh.sh" | nindent 4 }}
  default.conf: |
    {{- .Files.Get "files/nginx.conf" | replace "__CORS_DOMAIN_RE__" (.Values.corsDomain | replace "." "\\.") | nindent 4 }}
---
# The style per language with every URL on this host (files/styles, generated by
# scripts/basemap-style.mjs): a page that draws the map asks no other host for anything.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tiles.fullname" . }}-styles
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiles.labels" . | nindent 4 }}
data:
  {{- range .Values.languages }}
  light-{{ . }}.json: {{ $.Files.Get (printf "files/styles/light-%s.json" .) | replace "__HOST__" $.Values.host | replace "__FILE__" $.Values.file | quote }}
  {{- end }}
