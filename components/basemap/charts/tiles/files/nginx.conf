# T-4638: the basemap's files, read-only. nginx answers range requests on a static file by
# itself (Accept-Ranges, 206); a PMTiles reader asks for nothing else.
map $http_origin $cors_origin {
    default "";
    "~^https://([a-z0-9-]+\.)*__CORS_DOMAIN_RE__$" $http_origin;
}

server {
    listen 8080;
    server_tokens off;
    root /data;
    autoindex off;
    # The swap's temporary file and the commit marker are nobody's business.
    location ~ /\. { return 404; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # A browser may ask before a range request from another origin (CORS preflight).
        limit_except GET OPTIONS { deny all; }
        types {
            application/vnd.pmtiles pmtiles;
            application/x-protobuf pbf;
            application/json json;
            image/png png;
        }
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Accept-Ranges" always;
        add_header Vary Origin always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /styles/ {
        alias /styles/;
        limit_except GET { deny all; }
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary Origin always;
        add_header X-Content-Type-Options nosniff always;
    }
}
