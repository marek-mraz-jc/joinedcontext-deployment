---
# The server answers the edge and dials nothing but CoreDNS (its mesh proxy resolves): it reads
# its volume.
basemap-server:
  podSelector:
    app.kubernetes.io/name: tiles
    app.kubernetes.io/instance: basemap-tiles
    app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
          componentNamespace: apisix
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# The refresh job listens on nothing and fetches over HTTPS: the Protomaps daily build (range
# reads), the pmtiles release on GitHub and the fonts and sprites from codeload.github.com.
# Those hosts sit behind CDNs whose addresses change, so the rule names the port, not addresses.
basemap-refresh:
  podSelector:
    app.kubernetes.io/name: tiles
    app.kubernetes.io/instance: basemap-tiles
    app.kubernetes.io/component: refresh
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - publicInternet: true
      ports:
        - protocol: TCP
          port: 443

# The edge's side of the route on tiles.{domain}.
apisix-egress-to-basemap:
  componentNamespace: apisix
  podSelector:
    app.kubernetes.io/name: apisix
    app.kubernetes.io/instance: apisix-apisix
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tiles
              app.kubernetes.io/component: server
          componentNamespace: basemap
      ports:
        - protocol: TCP
          port: 8080
