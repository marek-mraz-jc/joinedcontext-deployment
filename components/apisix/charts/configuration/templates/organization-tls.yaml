{{- /*
  Certificates of the Organizations on hosts of their own (T-6991 §8, T-6975 §6).

  - A Certificate per host that resolves to the edge (`resolved`, what `jc doctor domains` reports),
    so a record not made yet blocks only its own host; `certificate: organization` folds them into
    one Certificate once every host resolves.
  - `host: auto`: `<org>.<domain>` alone; the shared open data, API and sign-in hosts are the
    installation's, on `apisix-edge`.
  - The Apps wildcard `*.<hosts.apps>` by DNS-01 in the operator's validation zone
    (global.ingress.dns01): the customer adds `_acme-challenge.<apps> CNAME <label>.<zone>` once and
    hands over no DNS key; the token in the Secret writes TXT records in that zone alone. Without a
    zone every App keeps a certificate of its own by HTTP-01.
  - Staged: at most 10 Certificates not in `issuedCertificates` per render (Let's Encrypt allows 50
    new a week per registered domain, jc-dev and jc-prod together).
*/}}
{{- $edge := .Values.edge }}
{{- $dns01 := $edge.dns01 | default dict }}
{{- $zone := $dns01.validationZone | default "" }}
{{- $ns := .Release.Namespace }}
{{- if $zone }}
{{- if not (has ($dns01.provider | default "") (list "cloudflare" "rfc2136")) }}
{{- fail (printf "global.ingress.dns01.provider: %q is none of cloudflare, rfc2136 (cert-manager's built-in solvers this deployment renders)" ($dns01.provider | default "")) }}
{{- end }}
{{- $ref := $dns01.secretRef | default dict }}
{{- if not (and $ref.name $ref.key) }}
{{- fail "global.ingress.dns01.secretRef: name and key of the operator's Secret in cert-manager's namespace are required (the zone's token never sits in values)" }}
{{- end }}
---
# The validation zone's solver (T-6975 §6). A ClusterIssuer, so its Secret stays in cert-manager's
# own namespace; named after this release's namespace, so two instances on one cluster own one each.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: jc-dns01-{{ $ns }}
  labels:
    {{- include "configuration.labels" . | nindent 4 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: jc-dns01-{{ $ns }}-account-key
    solvers:
      - dns01:
          # Every `_acme-challenge.<name>` is a CNAME into the validation zone.
          cnameStrategy: Follow
          {{- if eq $dns01.provider "cloudflare" }}
          cloudflare:
            apiTokenSecretRef:
              name: {{ $ref.name | quote }}
              key: {{ $ref.key | quote }}
          {{- else }}
          {{- $r := $dns01.rfc2136 | default dict }}
          {{- if not (and $r.nameserver $r.tsigKeyName) }}
          {{- fail "global.ingress.dns01.rfc2136: nameserver and tsigKeyName are required" }}
          {{- end }}
          rfc2136:
            nameserver: {{ $r.nameserver | quote }}
            tsigKeyName: {{ $r.tsigKeyName | quote }}
            tsigAlgorithm: {{ $r.tsigAlgorithm | default "HMACSHA256" | quote }}
            tsigSecretSecretRef:
              name: {{ $ref.name | quote }}
              key: {{ $ref.key | quote }}
          {{- end }}
{{- end }}
{{- if and $edge.enabled $edge.organizations }}
{{- $seen := dict }}
{{- range concat ($edge.hosts | default list) ($edge.untrustedHosts | default list) }}
{{- $_ := set $seen . "the installation" }}
{{- end }}
{{- $certs := list }}
{{- range $org := $edge.organizations }}
{{- $own := list }}
{{- if eq (toString $org.host) "auto" }}
{{- $own = list (printf "%s.%s" $org.name $.Values.domain) }}
{{- else }}
{{- $h := $org.hosts | default dict }}
{{- if not $h.portal }}
{{- fail (printf "jc.server.organizations %s: hosts.portal (the working host) is required, or host: auto" $org.name) }}
{{- end }}
{{- $own = list $h.portal }}
{{- range list $h.opendata $h.api }}{{ if . }}{{ $own = append $own . }}{{ end }}{{ end }}
{{- $own = concat $own ($h.portals | default list) }}
{{- end }}
{{- range $host := $own }}
{{- with index $seen $host }}
{{- fail (printf "jc.server.organizations %s: host %q is already %s's" $org.name $host .) }}
{{- end }}
{{- $_ := set $seen $host $org.name }}
{{- end }}
{{- $resolved := $org.resolved | default list }}
{{- if eq (toString $org.host) "auto" }}
{{- $certs = append $certs (dict "name" (printf "jc-org-%s" $org.name) "hosts" $own "issuer" "") }}
{{- else if eq ($org.certificate | default "hosts") "organization" }}
{{- range $own }}
{{- if not (has . $resolved) }}
{{- fail (printf "jc.server.organizations %s: certificate organization needs every host resolving, %q is not in resolved (jc doctor domains)" $org.name .) }}
{{- end }}
{{- end }}
{{- $certs = append $certs (dict "name" (printf "jc-org-%s" $org.name) "hosts" $own "issuer" "") }}
{{- else }}
{{- range $own }}
{{- if has . $resolved }}
{{- $certs = append $certs (dict "name" (printf "jc-org-%s-%s" $org.name (replace "." "-" .)) "hosts" (list .) "issuer" "") }}
{{- end }}
{{- end }}
{{- end }}
{{- with ($org.hosts | default dict).apps }}
{{- if $zone }}
{{- $certs = append $certs (dict "name" (printf "jc-org-%s-apps" $org.name) "hosts" (list (printf "*.%s" .)) "issuer" (printf "jc-dns01-%s" $ns)) }}
{{- end }}
{{- end }}
{{- end }}
{{- $new := 0 }}
{{- range $certs }}{{ if not (has .name ($edge.issuedCertificates | default list)) }}{{ $new = add1 $new }}{{ end }}{{ end }}
{{- if gt $new 10 }}
{{- fail (printf "jc.server.organizations: %d new Certificates in one apply; stage at most 10 a day and list the issued ones in jc.server.issuedCertificates (Let's Encrypt: 50 new a week per registered domain)" $new) }}
{{- end }}
{{- range $certs }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    {{- include "configuration.labels" $ | nindent 4 }}
spec:
  secretName: {{ .name }}-tls
  issuerRef:
    name: {{ .issuer | default $edge.clusterIssuer | quote }}
    kind: ClusterIssuer
  dnsNames:
    {{- range .hosts }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
