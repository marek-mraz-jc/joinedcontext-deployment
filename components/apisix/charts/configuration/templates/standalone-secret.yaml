{{- /*
  The file APISIX serves (ADR-N-030, AP-112). Helm writes the base into it until the Portal's
  reconciler first composes it, which the reconciler marks with the annotation below; from then
  on the reconciler is its only writer and helm leaves it alone, so a sync never takes the Apps'
  routes off the edge. `keep` stops helm deleting the Secret it no longer renders. An
  installation without the Portal keeps getting the base from every sync.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "apisix-standalone-config" }}
{{- $composedBy := dig "metadata" "annotations" "joinedcontext.com/composed-by" "" ($existing | default dict) }}
{{- if ne $composedBy "portal" }}
apiVersion: v1
kind: Secret
metadata:
  name: apisix-standalone-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "configuration.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  apisix.yaml: |{{ include "configuration.standalone" . }}
{{- end }}
