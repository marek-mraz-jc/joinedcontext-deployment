---
# The body is the installation's own contact and expiry (global.securityTxt). A production
# render without them stops at the production guard, and the dev render test fails a month
# before the date passes, so the file is renewed before a reporter reads an expired one.
security-txt:
  name: security-txt
  description: Answer security.txt at the edge
  plugins:
    request-id:
      include_in_response: true
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
          end
    # Class 1 (standard web): public by the RFC, so bounded like every anonymous route.
    limit-count:
      count: 300
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    fault-injection:
      abort:
        http_status: 200
        body: "Contact: {{ .Values.global.securityTxt.contact }}\nExpires: {{ .Values.global.securityTxt.expires }}\nPreferred-Languages: en, sk, cs, de\n"
    response-rewrite:
      headers:
        set:
          Content-Type: "text/plain; charset=utf-8"
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          Referrer-Policy: "no-referrer"
          Cache-Control: "no-store, no-cache, must-revalidate"
