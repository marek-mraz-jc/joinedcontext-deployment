    upstream: keycloak-app-keycloakx-http.smartcity.svc.cluster.local:80
    uri: /*
  keycloak-discovery:
    description: Keycloak discovery documents, without the dynamic client registration endpoint
    methods:
      - GET
      - HEAD
    name: keycloak-discovery
    pluginConfig: keycloak
    plugins:
      response-rewrite:
        filters:
          - regex: ',"registration_endpoint":"[^"]*"'
            replace: ""
            scope: global
        headers:
          set:
            Cache-Control: no-store, no-cache, must-revalidate
            Referrer-Policy: strict-origin-when-cross-origin
            Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
            X-Content-Type-Options: nosniff
            X-Frame-Options: SAMEORIGIN
    priority: 5
    subDomain: idm
    upstream: keycloak-app-keycloakx-http.smartcity.svc.cluster.local:80
    uri: /*
    vars:
      - - uri
        - ~~
        - ^(/\.well-known/(openid-configuration|oauth-authorization-server)/realms/[^/]+|/realms/[^/]+/\.well-known/(openid-configuration|oauth-authorization-server))$
