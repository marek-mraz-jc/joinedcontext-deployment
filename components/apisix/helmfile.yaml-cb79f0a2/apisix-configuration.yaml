      limit-count:
        count: 3000
        key: remote_addr
        key_type: var
        policy: local
        rejected_code: 429
        show_limit_quota_header: true
        time_window: 60
      serverless-post-function:
        functions:
          - |-
            return function()
              if ngx.header["Content-Security-Policy"] == nil then
                ngx.header["Content-Security-Policy"] =
                  "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
              end
            end
          - |-
            return function()
              if ngx.status == 200 or ngx.status == 304 then
                ngx.header["Cache-Control"] = "public, max-age=31536000, immutable"
              end
            end
        phase: header_filter
