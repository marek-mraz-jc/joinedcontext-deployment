composer:
  enabled: true
  namespace: smartcity
  serviceAccount: portal
domain: smartcity.joinedcontext.com
edge:
  appsWildcard: ""
  clusterIssuer: letsencrypt-prod
  enabled: true
  hosts:
    - smartcity.joinedcontext.com
    - api.smartcity.joinedcontext.com
    - assistant.smartcity.joinedcontext.com
    - data.smartcity.joinedcontext.com
    - idm.smartcity.joinedcontext.com
    - opendata.smartcity.joinedcontext.com
    - participacia.smartcity.joinedcontext.com
    - portal.smartcity.joinedcontext.com
    - status.smartcity.joinedcontext.com
    - tiles.smartcity.joinedcontext.com
    - viz.smartcity.joinedcontext.com
  ingressClass: traefik
  secretName: apisix-edge-tls
  stagingHosts: []
  websocketHosts:
    - api.smartcity.joinedcontext.com
    - portal.smartcity.joinedcontext.com
    - smartcity.joinedcontext.com
plugins:
  api-moved:
    description: Send a public data surface to the data host
    name: api-moved
    plugins:
      limit-count:
        count: 300
        key: remote_addr
        key_type: var
        policy: local
        rejected_code: 429
        show_limit_quota_header: true
        time_window: 60
      redirect:
        ret_code: 308
        uri: https://api.${DOMAIN}$request_uri
      request-id:
        include_in_response: true
      response-rewrite:
        headers:
          set:
            Cache-Control: no-store, no-cache, must-revalidate
            Referrer-Policy: strict-origin-when-cross-origin
            Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
      serverless-post-function:
        functions:
          - |-
            return function()
              if ngx.header["Content-Security-Policy"] == nil then
                ngx.header["Content-Security-Policy"] =
                  "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
              end
            end
        phase: header_filter
      serverless-pre-function:
        functions:
          - |-
            return function()
              local forged = {
                "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
                "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
                "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
                "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
              }
              for _, header in ipairs(forged) do
                ngx.req.clear_header(header)
                ngx.req.clear_header((header:gsub("%-", "_")))
              end
              for name in pairs(ngx.req.get_headers(0)) do
                local key = name:lower():gsub("_", "-")
                for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                  if key:sub(1, #prefix) == prefix and key ~= "x-jc-visitor" then
                    ngx.req.clear_header(name)
                  end
                end
              end
            end
        phase: rewrite
  apps-surface:
    description: Static apps on demand behind the edge login
    name: apps-surface
    plugins:
      limit-count:
        count: 300
        key: remote_addr
        key_type: var
        policy: local
        rejected_code: 429
        show_limit_quota_header: true
        time_window: 60
      openid-connect:
        bearer_only: false
        client_id: edge
        client_secret: ${EDGE_CLIENT_SECRET}
        discovery: https://idm.${DOMAIN}/realms/${REALM}/.well-known/openid-configuration
        logout_path: /apps/logout
        post_logout_redirect_uri: https://portal.${DOMAIN}/
        redirect_uri: https://${DOMAIN}/apps/callback
        session:
          absolute_timeout: 36000
          cookie_http_only: true
          cookie_name: __Host-jc_edge_apps
          cookie_path: /
          cookie_same_site: Lax
          cookie_secure: true
          idling_timeout: 3600
          rolling_timeout: 3600
          secret: ${OIDC_SESSION_SECRET}
        set_access_token_header: true
        set_id_token_header: false
        set_refresh_token_header: false
        set_userinfo_header: true
        ssl_verify: true
        unauth_action: auth
        use_jwks: false
        use_pkce: true
      proxy-rewrite:
        headers:
          set:
            X-Forwarded-Port: "443"
            X-Forwarded-Proto: https
      request-id:
        include_in_response: true
      response-rewrite:
        headers:
          set:
            Referrer-Policy: no-referrer
            Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
            X-Content-Type-Options: nosniff
            X-Frame-Options: SAMEORIGIN
      serverless-post-function:
        functions:
          - |-
            return function()
              if ngx.header["Content-Security-Policy"] == nil then
                ngx.header["Content-Security-Policy"] =
                  "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
              end
            end
        phase: header_filter
      serverless-pre-function:
        functions:
          - |-
            return function()
              local forged = {
                "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
                "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
                "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
                "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
              }
              for _, header in ipairs(forged) do
