realm: smartcity
routes:
  api-catalog-feed:
    description: The DCAT-AP catalogue feed on the data host, anonymous
    methods:
      - GET
      - HEAD
    name: api-catalog-feed
    pluginConfig: catalog-feed
    priority: 20
    subDomain: api
    upstream: context-gateway.smartcity.svc.cluster.local:8080
    uri: /catalog*
  api-context-endpoint:
    description: Context endpoint representation surface on the data host
    keepalivePool:
      idleTimeout: 60
      requests: 1000
      size: 320
    name: api-context-endpoint
    pluginConfig: context-endpoint
    plugins:
      proxy-buffering:
        disable_proxy_buffering: false
      proxy-cache:
        cache_bypass:
          - $http_cookie
          - $http_authorization
          - $http_link
          - $http_prefer
          - $http_ngsild_tenant
        cache_control: true
        cache_http_status:
          - 200
        cache_key:
          - $host
          - $request_uri
          - $http_accept
          - $http_accept_language
          - $http_accept_encoding
          - $http_ngsild_results_restricted
        cache_method:
          - GET
          - HEAD
        cache_strategy: disk
        cache_ttl: 5
        cache_zone: disk_cache_one
        hide_cache_headers: false
        no_cache:
          - $http_cookie
          - $http_authorization
          - $http_link
          - $http_prefer
          - $http_ngsild_tenant
    priority: 20
    subDomain: api
    timeout:
      connect: 6
      read: 60
      send: 60
    upstream: context-gateway.smartcity.svc.cluster.local:8080
    uri: /api/endpoint/*
  api-context-endpoint-bulk:
    description: Bulk exports of the data host's Endpoint surface, 10 at once per client
    name: api-context-endpoint-bulk
    pluginConfig: context-endpoint
    plugins:
      limit-conn:
        burst: 0
        conn: 10
        default_conn_delay: 0.1
        key: $http_authorization $remote_addr
        key_type: var_combination
        rejected_code: 429
    priority: 21
    subDomain: api
    timeout:
      connect: 6
      read: 300
      send: 60
    upstream: context-gateway.smartcity.svc.cluster.local:8080
    uri: /api/endpoint/*
    vars:
      - - uri
