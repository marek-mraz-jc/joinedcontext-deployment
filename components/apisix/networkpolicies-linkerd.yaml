---
apisix-allow-linkerd:
  podSelector:
    app.kubernetes.io/name: apisix
  policyTypes:
    - Ingress
  ingress:
    # 4143 is where meshed traffic lands, so it is the data plane of a meshed ingress
    # controller (`allowUnauthenticatedIngress: false`) and admits that controller alone,
    # for the reason the 9080 rule gives (T-0939). No workload of ours calls APISIX.
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [traefik, kube-system, ingress-nginx]
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [traefik, ingress-nginx]
      ports:
        - port: 4143
          protocol: TCP
    # The proxy's own control and admin ports (tap, readiness, metrics): no request reaches
    # APISIX through them.
    - ports:
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP

# A meshed pod under an egress policy needs two things spelled out. The Linkerd control
# plane — identity (8080), destination (8086), policy (8090) — or the proxy never learns the
# inbound policy for its own admin port, answers the kubelet startup probe with 403 and the
# pod loops in Init forever. And 4143 on every peer it calls: meshed traffic lands on the
# peer's inbound proxy, not on the service port, so the plain rule in networkpolicies.yaml
# allows a connection the proxy never makes.

apisix-linkerd-control-plane:
  podSelector:
    app.kubernetes.io/name: apisix
    app.kubernetes.io/instance: apisix-apisix
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
          componentNamespace: keycloak
      ports:
        - protocol: TCP
          port: 4143
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal-portal
          componentNamespace: portal
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-gateway-gateway
          componentNamespace: context-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
              app.kubernetes.io/instance: gitea-forge
          componentNamespace: gitea
        # A pod-backed App is meshed too (AP-108): the Portal's reconciler labels it in the
        # apps namespace, which is the Portal's.
        - podSelector:
            matchLabels:
              joinedcontext.com/app: "true"
          componentNamespace: portal
      ports:
        - protocol: TCP
          port: 4143
