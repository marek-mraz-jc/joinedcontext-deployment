---
# The server answers the edge and dials nothing but CoreDNS (its mesh proxy resolves): it serves
# files; the browser does every fetch.
ai-server:
  podSelector:
    app.kubernetes.io/name: app
    app.kubernetes.io/instance: ai-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
          componentNamespace: apisix
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# The edge's side of the route on ai.{domain}.
apisix-egress-to-ai:
  componentNamespace: apisix
  podSelector:
    app.kubernetes.io/name: apisix
    app.kubernetes.io/instance: apisix-apisix
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: app
          componentNamespace: ai
      ports:
        - protocol: TCP
          port: 8080
