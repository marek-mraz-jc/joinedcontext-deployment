# T-4694: the standalone assistant on ai.{domain}. Static files only; every `/{publicId}` is the
# one page, which reads its deployment from the address and asks the chat's host for the rest.
# No cookie is set or read on this host.
server {
    listen 8080;
    server_tokens off;
    root /srv/site;
    autoindex off;
    charset utf-8;
    location ~ /\. { return 404; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # The scripts, the style and the visitor worker: files, framed by nothing.
    location ~ ^/(app|widget|visitor|embed)\.js$ {
        limit_except GET { deny all; }
        types { text/javascript js; }
    }
    location = /widget.css {
        limit_except GET { deny all; }
    }
    location = /index.html { return 404; }

    # `/{publicId}` (a-z, 0-9, hyphen) is the page. It may be framed anywhere: app.js shows it
    # only inside the deployment's own origins, and the chat refuses every other origin.
    location ~ "^/[a-z0-9][a-z0-9-]{0,62}/?$" {
        limit_except GET { deny all; }
        default_type text/html;
        try_files /index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src __API__; img-src 'self'; worker-src 'self'; __FRAMES__base-uri 'none'; form-action 'none'" always;
    }

    location / { return 404; }
}
