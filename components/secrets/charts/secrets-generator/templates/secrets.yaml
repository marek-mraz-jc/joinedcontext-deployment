{{- range .Values.secrets }}
{{- $secretDef := . }}
{{- /* Generate data once by checking all namespaces */ -}}
{{- $generatedData := include "secrets.generateData" (dict "name" $secretDef.name "namespaces" $secretDef.namespaces "keys" $secretDef.keys) | fromYaml }}
{{- /* Now create the secret in each namespace with the same data */ -}}
{{- range $namespace := $secretDef.namespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretDef.name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "secrets.labels" $ | nindent 4 }}
  annotations:
    {{- include "secrets.annotations" $ | nindent 4 }}
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- $generatedData | toYaml | nindent 2 }}
{{- end }}
{{- end }}
