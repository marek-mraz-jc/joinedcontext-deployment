---
# ghcr.io/marek-mraz-jc/jc, built, smoke-tested and signed by the monorepo's
# .github/workflows/image.yml on main and scanned by its image-scan.yml.
jc:
  # main f7ba9a13, ci run 43083855292 (image/build, scan, promote/sign green; cosign githubWorkflowSha
  # f7ba9a13): 5669f7e5 + T-6759 (an Endpoint's policyRef binds only on its project's own domains),
  # T-6764 (a Portal held from its start writes every view and rule document), T-6755/T-6760 (gateway
  # feeds/ and entities.* routes), T-6748, T-6717 (jc refuses to start without a profile; base-values
  # sets profile = "production"), smoke retry. Smoke 05911dba: 44 fail vs 45 on 5669f7e5, no
  # regression (supervisor 20:04Z). Never pin an image older than 520e299e: without its reconciler
  # guard a fresh start deletes managed groups and their members.
  server:
    repository: 'ghcr.io/marek-mraz-jc/jc'
    tag: 'f7ba9a13138478d73ea3f5b57c7f837d279e355b'
    digest: 'sha256:8b204db8df0d2c02dc2a0188b219f684245db2fb0827898ace1795eb14c949af'
  # jc-functions: the platform image's runtime, the digest jc-migrate's rehearsals ran
  # (deploy/rehearsal/apps.sh) and dev's components/functions runs.
  functions:
    repository: 'ghcr.io/marek-mraz-jc/joinedcontext-platform'
    tag: 'main'
    digest: 'sha256:0020212d990b4d13d855b6ff1a90d994ab3665a859865ccae5f4a44021a5d1a5'
  # The init container that copies Secret jc-setup into the state dir: busybox's sh and install,
  # the same pin as components/keycloak/images.yaml dbchecker.
  seed:
    repository: 'docker.io/busybox'
    tag: '1.38'
    digest: 'sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616'
  # prom-label-proxy (metricsProxy part): one static Go binary, runs as nobody. v0.16.2 of
  # 2026-11-04; trivy 2026-11-10: one HIGH, golang.org/x/net/html CVE-2026-78661 (HTML parsing,
  # which the proxy never does; not in CISA KEV, so scan-pinned-images.py does not block it).
  metricsProxy:
    repository: 'quay.io/prometheuscommunity/prom-label-proxy'
    tag: 'v0.16.2'
    digest: 'sha256:9812cce38fa78c39250c9c59c78bbe75895ef9126952a098cd44adef2e21dbc5'
