---
jc:
  name: jc
  description: jc headers, rate limiting and the mounts that stay inside the pod
  plugins: &jc-plugins
    request-id:
      include_in_response: true
    # Every route clears the headers the platform trusts internally, not only the
    # authenticated ones (T-0026): a client that can set them can claim a tenant or an
    # identity. X-Forwarded-For stays — nginx maintains it and the rate limit keys on it.
    # Each name is cleared twice, hyphenated and with underscores (T-1672): the http block
    # runs with `underscores_in_headers on`, so `X_Userinfo` survives to the upstream as a
    # header of its own, and a WSGI or CGI upstream folds it onto the same name the
    # hyphenated spelling has. The Lua is identical on every route and a test holds it so.
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
            for name in pairs(ngx.req.get_headers(0)) do
              local key = name:lower():gsub("_", "-")
              for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                if key:sub(1, #prefix) == prefix and key ~= "x-jc-visitor" then
                  ngx.req.clear_header(name)
                end
              end
            end
          end
    # Class 1 (standard web) as the Portal's pages, doubled: one host carries the Portal's
    # bundle, the identity flows, the catalogue and the dashboards of every visitor.
    limit-count:
      count: 600
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    # Mounted in jc but never public (decided jc-ship, owner may override): ekiben (/streams)
    # takes one shared token, the in-binary broker (/broker) runs no views or Policy engine,
    # shako (/git) is the Portal's forge. The Portal reaches all three inside the pod; the edge
    # answers 404 without dialling jc. `metrics` stays on the admin listener (9091): jc's public
    # port answers /metrics too, empty but 200 (G-17, T-6727), so the edge closes it as well.
    uri-blocker:
      block_rules:
        - '^/streams([/?]|$)'
        - '^/broker([/?]|$)'
        - '^/git([/?]|$)'
        - '^/metrics([/?]|$)'
      rejected_code: 404
    proxy-rewrite:
      headers:
        set:
          X-Forwarded-Proto: https
          X-Forwarded-Port: '443'
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "SAMEORIGIN"
          Referrer-Policy: "strict-origin-when-cross-origin"
    # OPS-34: the upstream owns the Content Security Policy (the Portal's, each App's, AP-12,
    # AP-122), so the edge sets none over it and adds this baseline only to an answer that
    # carries none, its own refusals included. `frame-ancestors` says what X-Frame-Options
    # says. It runs after `response-rewrite`, whose `add` of an App's frame-ancestors counts.
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
            end
          end

# The App hosts `{name}.apps.{domain}` (jc host mode): the same chain, but no X-Frame-Options.
# The Portal opens an App in a frame of its own origin (AP-122), which SAMEORIGIN refuses; each
# App's own Content Security Policy says who may frame it (`frame-ancestors`), as the Portal's
# edge file left it on dev (reconciler/edge_file.rs framed_by_portal).
jc-apps:
  name: jc-apps
  description: jc on the App hosts, framed by the Portal alone
  plugins:
    <<: *jc-plugins
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          Referrer-Policy: "strict-origin-when-cross-origin"
    # An answer without a policy of its own (a problem body, a gateway read) is framed by nobody:
    # the App's pages carry their own `frame-ancestors` naming the Portal.
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
            end
          end
