---
jc:
  server:
    # jc's first-start secrets (bins/jc/src/setup.rs Secret::file_name), one key per file of the
    # state dir. Generated once by the secrets component and kept (it looks the Secret up before it
    # generates), so every pod of jc reads the same values; never in Git. kaisatsu-kek encrypts
    # kaisatsu's secrets in its database: never rotate it while rows are sealed under it.
    jc-setup:
      kaisatsu-kek:
        length: 64
        generate: true
        encoding: hex
      portal-client-secret:
        length: 64
        generate: true
        encoding: hex
      portal-admin-client-secret:
        length: 64
        generate: true
        encoding: hex
      portal-cookie-key:
        length: 128
        generate: true
        encoding: hex
      first-admin-password:
        length: 32
        generate: true
        encoding: hex
      shako-token:
        length: 64
        generate: true
        encoding: hex
      forge-webhook-secret:
        length: 64
        generate: true
        encoding: hex
      ekiben-token:
        length: 64
        generate: true
        encoding: hex
      antares-admin-token:
        length: 64
        generate: true
        encoding: hex
      dashboards-password:
        length: 64
        generate: true
        encoding: hex
      catalogue-token:
        length: 64
        generate: true
        encoding: hex
      componentNamespaces:
        - jc
    # The admin listener's bearer (/metrics carries every module's series, Antares' included).
    jc-admin-token:
      token:
        length: 64
        generate: true
        encoding: hex
      componentNamespaces:
        - jc
    # One login per database on the shared postgres-cluster (databases.yaml).
    db-jc-portal:
      username: 'jc_portal'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - jc
        - postgres
    db-jc-antares:
      username: 'jc_antares'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - jc
        - postgres
    # kaisatsu's migration role owns its database; its request role owns nothing and is neither
    # superuser nor BYPASSRLS (kaisatsu refuses to boot otherwise).
    db-jc-kaisatsu:
      username: 'kaisatsu_migrate'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - jc
        - postgres
    db-jc-kaisatsu-app:
      username: 'kaisatsu_app'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - jc
        - postgres
