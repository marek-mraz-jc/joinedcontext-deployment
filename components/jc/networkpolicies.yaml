---
# jc (one pod, every module): the edge reaches its public listener on 8080, the Prometheus pods of
# monitoring.prometheusNamespace alone its admin listener (9091: /metrics behind the admin token,
# /healthz), nothing reaches the Portal's internal listener (9090) from outside the pod. It reaches
# its databases on postgres-cluster, the cluster's ingress (the Portal reads the OIDC
# discovery of kaisatsu at its public issuer URL, jc.{domain}/login) and public addresses on 443
# (catalogue harvests, pipeline sources, the model provider), plus DNS. The modules call each
# other on jc's own listener inside the pod, which no policy sees.
jc-server:
  podSelector:
    app.kubernetes.io/name: jc-server
    app.kubernetes.io/instance: jc-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
          componentNamespace: apisix
      ports:
        - protocol: TCP
          port: 8080
    # The Prometheus that scrapes jc's /metrics (components/monitoring, job jc, T-7469), from its own
    # namespace only; no peer and no rule is rendered while monitoring.prometheusNamespace is empty.
    # Meshed, 9091 skips jc's inbound proxy (values/server), so no 4143 half: that port would reach 8080.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
          namespaceFrom: monitoring.monitoring.prometheusNamespace
      ports:
        - protocol: TCP
          port: 9091
  egress:
    # The server WASM Apps (ADR-N-044), each peer dropped where its component is not deployed: an
    # App host's /api/* to the App's shard (8080) and each shard's /jobs (9090, AP-154), the Apps'
    # database (AP-149) and the store the shards' keys and components live in (AP-151, AP-158).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wasm-host-shard
          componentNamespace: wasm-host
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: apps-db
          componentNamespace: apps-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: store
          componentNamespace: artifact-store
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-cluster
          componentNamespace: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - traefik
                  - kube-system
                  - ingress-nginx
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - traefik
                  - ingress-nginx
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
    - to:
        - publicInternet: true
      ports:
        - protocol: TCP
          port: 443
    # The App functions runtime beside jc (jc.functions), when the environment turns it on.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jc-functions
      ports:
        - protocol: TCP
          port: 8080
# jc-functions (jc.functions): called by jc's Portal alone; reaches jc's identity and gateway only
# through the cluster's ingress (their public hosts), plus DNS. A function's code is the model's:
# no internet, no database, no other pod.
jc-functions:
  podSelector:
    app.kubernetes.io/name: jc-functions
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jc-server
              app.kubernetes.io/instance: jc-server
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - traefik
                  - kube-system
                  - ingress-nginx
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - traefik
                  - ingress-nginx
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
postgres-from-jc:
  componentNamespace: postgres
  podSelector:
    cnpg.io/cluster: postgres-cluster
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jc-server
              app.kubernetes.io/instance: jc-server
          componentNamespace: jc
      ports:
        - protocol: TCP
          port: 5432
    # jc-retain (retainHours): the hourly history cut on jc_antares.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jc-retain
          componentNamespace: jc
      ports:
        - protocol: TCP
          port: 5432
jc-retain:
  podSelector:
    app.kubernetes.io/name: jc-retain
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-cluster
          componentNamespace: postgres
      ports:
        - protocol: TCP
          port: 5432
apisix-egress-to-jc:
  componentNamespace: apisix
  podSelector:
    app.kubernetes.io/name: apisix
    app.kubernetes.io/instance: apisix-apisix
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jc-server
              app.kubernetes.io/instance: jc-server
          componentNamespace: jc
      ports:
        - protocol: TCP
          port: 8080
