---
# Meshed: the worker's proxy needs the Linkerd control plane, and meshed calls land on the
# peer's inbound proxy (4143), not on the service port.
assistant-linkerd-control-plane:
  podSelector:
    app.kubernetes.io/name: assistant-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8090
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-cluster
          componentNamespace: postgres
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
              app.kubernetes.io/instance: gitea-forge
          componentNamespace: gitea
      ports:
        - protocol: TCP
          port: 4143

postgres-linkerd-from-assistant:
  componentNamespace: postgres
  podSelector:
    cnpg.io/cluster: postgres-cluster
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: assistant-worker
          componentNamespace: assistant
      ports:
        - port: 4143
          protocol: TCP

gitea-linkerd-from-assistant:
  componentNamespace: gitea
  podSelector:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea-forge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: assistant-worker
          componentNamespace: assistant
      ports:
        - port: 4143
          protocol: TCP
