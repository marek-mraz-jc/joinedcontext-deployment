---
assistant-chat:
  name: assistant-chat
  description: The knowledge assistant's chat, anonymous, limited per address at the edge as well
  plugins:
    request-id:
      include_in_response: true
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
            for name in pairs(ngx.req.get_headers(0)) do
              local key = name:lower():gsub("_", "-")
              for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                if key:sub(1, #prefix) == prefix then
                  ngx.req.clear_header(name)
                end
              end
            end
          end
    # Each question costs model tokens; the service's own limits are per deployment, this one
    # holds one address to a person's pace before the request reaches it at all.
    limit-count:
      count: 30
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          Referrer-Policy: "no-referrer"
          Cache-Control: "no-store, no-cache, must-revalidate"
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
            end
          end

assistant-widget:
  name: assistant-widget
  description: The knowledge assistant's widget, anonymous, framed by the deployment's own origins
  plugins:
    request-id:
      include_in_response: true
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
            for name in pairs(ngx.req.get_headers(0)) do
              local key = name:lower():gsub("_", "-")
              for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                if key:sub(1, #prefix) == prefix then
                  ngx.req.clear_header(name)
                end
              end
            end
          end
    # A page and two files per visit cost no token; this holds one address below a scrape.
    limit-count:
      count: 120
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    # No X-Frame-Options: it cannot name a list of sites, and the page's own `frame-ancestors`
    # names the deployment's. No Cache-Control: the page says no-store, the script and style
    # a short public max-age.
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          Referrer-Policy: "no-referrer"
    # An answer that came without a policy (the script, the style, a 404) is framed by nobody.
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
            end
          end

assistant-unknown:
  name: assistant-unknown
  description: Any other path on the assistant host, answered by the edge as a page in words
  plugins:
    request-id:
      include_in_response: true
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity", "X-Forwarded-User",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP", "JC-Read-Versions",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
              ngx.req.clear_header((header:gsub("%-", "_")))
            end
            for name in pairs(ngx.req.get_headers(0)) do
              local key = name:lower():gsub("_", "-")
              for _, prefix in ipairs({ "x-jc-", "jc-provenance-", "l5d-" }) do
                if key:sub(1, #prefix) == prefix then
                  ngx.req.clear_header(name)
                end
              end
            end
          end
    limit-count:
      count: 120
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    # The page names no deployment and holds nothing a visitor could not see (T-4200).
    fault-injection:
      abort:
        http_status: 404
        body: >-
          <!doctype html><html lang="sk"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="Content-Security-Policy" content="default-src 'none'">
          <title>Stránka neexistuje</title></head><body><main>
          <h1>Táto stránka neexistuje.</h1>
          <p>Asistent odpovedá na stránke, ktorá ho ponúka.</p>
          <p lang="en">This page does not exist. The assistant answers on the site that offers it.</p>
          </main></body></html>
    response-rewrite:
      headers:
        set:
          Content-Type: "text/html; charset=utf-8"
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          Referrer-Policy: "no-referrer"
          Cache-Control: "no-store, no-cache, must-revalidate"
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
            end
          end
