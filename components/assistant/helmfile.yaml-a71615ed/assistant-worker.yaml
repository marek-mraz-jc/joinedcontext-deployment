command:
  - /usr/local/bin/jc-assistant
containerPort: 8080
env:
  JC_ASSISTANT_ASSEMBLY_DIR: /assembly/current
  JC_ASSISTANT_BIND: 0.0.0.0:8080
  JC_ASSISTANT_CLIENT_ASSERTION_FILE: /var/run/secrets/jc/keycloak/token
  JC_ASSISTANT_CLIENT_ID: jc-assistant
  JC_ASSISTANT_DATABASE_URL: postgresql://assistant:$(PGPASSWORD)@postgres-cluster-rw.smartcity.svc.cluster.local:5432/assistant
  JC_ASSISTANT_EMBED_THREADS: "1"
  JC_ASSISTANT_ENDPOINT_URL: https://api.smartcity.joinedcontext.com
  JC_ASSISTANT_FUNCTIONS_URL: http://jc-functions.smartcity.svc.cluster.local:8080
  JC_ASSISTANT_GATEWAY_URL: http://context-gateway.smartcity.svc.cluster.local:8080
  JC_ASSISTANT_LLM: google/gemini-3.8-flash
  JC_ASSISTANT_ORG_DOMAIN: hel.fi
  JC_ASSISTANT_PORTAL_URL: https://portal.smartcity.joinedcontext.com
  JC_ASSISTANT_PROJECTS_DIR: /projects
  JC_ASSISTANT_PROXY_URL: http://agent-proxy.smartcity.svc.cluster.local:8080
  JC_ASSISTANT_PUBLIC_ORIGIN: https://assistant.smartcity.joinedcontext.com
  JC_ASSISTANT_REPO_DIR: /repo/current
  JC_ASSISTANT_TOKEN_URL: http://keycloak-app-keycloakx-http.smartcity.svc.cluster.local:80/realms/smartcity/protocol/openid-connect/token
  JC_ASSISTANT_VIZ_URL: https://viz.smartcity.joinedcontext.com
  MALLOC_ARENA_MAX: "2"
envSecret:
  PGPASSWORD:
    key: password
    secret: db-assistant
extraContainers:
  - env:
      - name: GITSYNC_REPO
        value: http://gitea-http.smartcity.svc.cluster.local:3000/joinedcontext/configuration.git
      - name: GITSYNC_REF
        value: main
      - name: GITSYNC_ROOT
        value: /repo
      - name: GITSYNC_LINK
        value: current
      - name: GITSYNC_DEPTH
        value: "1"
      - name: GITSYNC_USERNAME
        value: git-sync
      - name: GITSYNC_PASSWORD
        valueFrom:
          secretKeyRef:
            key: token
            name: gitea-token-gateway
      - name: HOME
        value: /tmp
      - name: GITSYNC_PERIOD
        value: 60s
      - name: GITSYNC_HTTP_BIND
        value: :9092
      - name: GITSYNC_MAX_FAILURES
        value: "-1"
    image: registry.k8s.io/git-sync/git-sync:v4.7.1@sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717
    imagePullPolicy: IfNotPresent
    name: git-sync
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /
        port: 9092
      periodSeconds: 10
      timeoutSeconds: 3
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 65533
      runAsNonRoot: true
      runAsUser: 65533
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - mountPath: /repo
        name: repo
      - mountPath: /tmp
        name: tmp
  - args:
      - --org-dir
      - /repo/current
      - --projects-dir
      - /projects
      - --forge
      - http://gitea-http.smartcity.svc.cluster.local:3000/joinedcontext
      - --token-file
      - /var/run/forge/token
      - --interval
      - "60"
    env:
      - name: HOME
        value: /tmp
    image: ghcr.io/marek-mraz-jc/joinedcontext-platform/checkouts:main@sha256:f686b672dd063a85a718bf329aab9175aa81f6a6da238d31c0c18641a736bf09
    imagePullPolicy: IfNotPresent
    name: checkouts
    readinessProbe:
      exec:
        command:
          - test
          - -d
          - /projects
      periodSeconds: 30
      timeoutSeconds: 3
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - mountPath: /repo
        name: repo
        readOnly: true
      - mountPath: /projects
        name: projects
      - mountPath: /var/run/forge
        name: forge-token
        readOnly: true
      - mountPath: /tmp
        name: tmp
extraInitContainers:
  - env:
      - name: GITSYNC_REPO
        value: http://gitea-http.smartcity.svc.cluster.local:3000/joinedcontext/configuration.git
      - name: GITSYNC_REF
        value: main
      - name: GITSYNC_ROOT
        value: /repo
      - name: GITSYNC_LINK
        value: current
      - name: GITSYNC_DEPTH
        value: "1"
      - name: GITSYNC_USERNAME
        value: git-sync
      - name: GITSYNC_PASSWORD
        valueFrom:
          secretKeyRef:
            key: token
            name: gitea-token-gateway
      - name: HOME
        value: /tmp
      - name: GITSYNC_ONE_TIME
        value: "true"
    image: registry.k8s.io/git-sync/git-sync:v4.7.1@sha256:c5e1976da735bf0b53979f079a07475d77174c51863cd084e928ff6074480717
    imagePullPolicy: IfNotPresent
    name: git-sync-init
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 65533
      runAsNonRoot: true
      runAsUser: 65533
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - mountPath: /repo
        name: repo
      - mountPath: /tmp
        name: tmp
  - args:
      - --org-dir
      - /repo/current
      - --projects-dir
      - /projects
      - --forge
      - http://gitea-http.smartcity.svc.cluster.local:3000/joinedcontext
      - --token-file
      - /var/run/forge/token
      - --once
    env:
      - name: HOME
        value: /tmp
    image: ghcr.io/marek-mraz-jc/joinedcontext-platform/checkouts:main@sha256:f686b672dd063a85a718bf329aab9175aa81f6a6da238d31c0c18641a736bf09
    imagePullPolicy: IfNotPresent
    name: checkouts-init
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - mountPath: /repo
        name: repo
        readOnly: true
      - mountPath: /projects
        name: projects
      - mountPath: /var/run/forge
        name: forge-token
        readOnly: true
      - mountPath: /tmp
        name: tmp
extraVolumeMounts:
  - mountPath: /repo
    name: repo
    readOnly: true
  - mountPath: /var/run/secrets/jc/keycloak
    name: keycloak-token
    readOnly: true
  - mountPath: /assembly
    name: assembly
  - mountPath: /projects
    name: projects
    readOnly: true
extraVolumes:
  - emptyDir: {}
    name: repo
  - name: keycloak-token
    projected:
      sources:
        - serviceAccountToken:
            audience: https://idm.smartcity.joinedcontext.com/realms/smartcity
            expirationSeconds: 600
            path: token
  - emptyDir:
      sizeLimit: 256Mi
    name: assembly
  - emptyDir:
      sizeLimit: 256Mi
    name: projects
  - name: forge-token
    secret:
      items:
        - key: token
          path: token
      secretName: gitea-token-gateway
fullnameOverride: jc-assistant
image:
  digest: sha256:e11965b94ddb93e034221c15eccfe967a8af46008fc5f2375243326d442f9650
  pullPolicy: IfNotPresent
  repository: ghcr.io/marek-mraz-jc/joinedcontext-platform
  tag: main
nameOverride: assistant-worker
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
probes:
  liveness:
    failureThreshold: 3
    initialDelaySeconds: 10
    path: /healthz
    periodSeconds: 15
    timeoutSeconds: 3
  readiness:
    failureThreshold: 3
    path: /readyz
    periodSeconds: 10
    timeoutSeconds: 3
replicaCount: 1
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 50m
    memory: 768Mi
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
service:
  enabled: true
  name: http
  port: 8080
  targetPort: 8080
  type: ClusterIP
serviceMesh:
  enabled: true
