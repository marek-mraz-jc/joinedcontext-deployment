{{- $ns := include "preview.namespace" . }}
{{- /*
  The Portal preview size of ADR-N-062: portal 576Mi + portal-ui 32Mi + two proxies, 736Mi of
  requests and about 1.4Gi of limits, with room for the isolation suite's one Job pod. A third
  service or a 2Gi pod is refused at admission.
*/}}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview
  namespace: {{ $ns }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
spec:
  hard:
    pods: "4"
    requests.cpu: "1"
    limits.cpu: "3"
    requests.memory: 1Gi
    limits.memory: 2Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: preview
  namespace: {{ $ns }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 1Gi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 1Gi
