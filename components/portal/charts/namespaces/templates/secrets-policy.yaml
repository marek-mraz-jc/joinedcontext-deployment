{{- $release := .Values.release }}
{{- $sa := .Values.serviceAccount }}
{{- /*
  The bound on the Secrets the Portal writes outside a project's apps namespace (T-4798). Its
  own, the runner's and the WASM host's namespace hold the platform's credentials (database,
  Keycloak, forge, artifact store), and on a single-namespace installation they are one
  namespace. RBAC names the Secrets the Portal reads there; it cannot name a prefix, so `create`
  and `patch` are granted without names and this policy is the bound. The Portal writes six
  kinds of Secret there, and nothing else:

    pipeline-secrets              the pipeline runner's environment (T-0927)
    artifact-store-reader-{org}   an organization's reader key (T-0925)
    build-{app}-{job}             a build Job's registration token, owned by the Job (AP-130)
    apps-host-{shard}-store       a WASM shard's store key (AP-158)
    apisix-standalone-config      the edge file APISIX serves, composed by the Portal's edge
                                  wave (joinedcontext-portal reconciler/edge_file.rs)
    personal-data-keys            each space's personal-data key, in the gateway's namespace
                                  (DM-121, reconciler/daemon.rs resolve_personal_keys)

  Each is Opaque: a Secret of type service-account-token gets a token filled in by the cluster,
  and the reply to the Portal's next apply would hand it that ServiceAccount's token. Nothing
  is deleted: a build token goes with its Job, by the garbage collector.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $release }}-portal-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["secrets"]
        operations: ["CREATE", "UPDATE", "DELETE"]
  matchConditions:
    - name: the-portal
      expression: request.userInfo.username == "system:serviceaccount:{{ $sa.namespace }}:{{ $sa.name }}"
    # A project's apps namespace holds only what the Portal put there (policy.yaml).
    - name: outside-an-apps-namespace
      expression: >-
        !request.namespace.matches("^{{ $release }}-[a-z0-9]([-a-z0-9]*[a-z0-9])?-apps$")
  validations:
    - expression: >-
        request.operation != "DELETE"
        && object.metadata.name.matches("^(pipeline-secrets|artifact-store-reader-[a-z0-9]([-a-z0-9]*[a-z0-9])?|build-[a-z0-9]([-a-z0-9]*[a-z0-9])?|apps-host-[0-9]+-store|apisix-standalone-config|personal-data-keys)$")
        && (!has(object.type) || object.type == "Opaque")
      messageExpression: >-
        "Outside a project's apps namespace the Portal writes only Opaque Secrets named pipeline-secrets, artifact-store-reader-{org}, build-{app}-{job}, apps-host-{shard}-store, apisix-standalone-config or personal-data-keys and deletes none, not " + request.operation + " " + request.namespace + "/" + request.name + " (T-4798)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $release }}-portal-secrets
spec:
  policyName: {{ $release }}-portal-secrets
  validationActions: [Deny]
