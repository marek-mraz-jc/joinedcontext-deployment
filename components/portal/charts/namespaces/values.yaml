# The installation's release name: projects' apps namespaces are `{release}-{project}-apps`.
release: ''
# The Portal's ServiceAccount and its namespace.
serviceAccount:
  name: portal
  namespace: ''
# The edge: the Service every App's Ingress routes to, the one the chart's edge Ingress names.
edge:
  gatewayService: apisix-gateway
# The namespace `{release}-app-tests`, where a run tests the model's code before it offers
# publication (SDK-38). Needs the builder image, so it is on where the forge's runner is.
appTests:
  enabled: false
