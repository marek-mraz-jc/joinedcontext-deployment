containerPort: 8080
extraVolumeMounts:
  - mountPath: /var/cache/nginx
    name: nginx-cache
extraVolumes:
  - emptyDir: {}
    name: nginx-cache
fullnameOverride: portal-ui
image:
  digest: sha256:2ef37bf964502222309f55812ca51ab67968fdd78f126229a172071f52fd0b63
  pullPolicy: IfNotPresent
  repository: ghcr.io/marek-mraz-jc/joinedcontext-portal-ui
  tag: main
meshAuthorization:
  clients:
    - namespace: smartcity
      serviceAccount: portal
  port: 8080
nameOverride: portal-ui
podSecurityContext:
  fsGroup: 101
  runAsGroup: 101
  runAsNonRoot: true
  runAsUser: 101
  seccompProfile:
    type: RuntimeDefault
probes:
  liveness:
    failureThreshold: 3
    initialDelaySeconds: 5
    path: /
    periodSeconds: 15
    timeoutSeconds: 3
  readiness:
    failureThreshold: 3
    path: /
    periodSeconds: 5
    timeoutSeconds: 3
replicaCount: 1
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
service:
  enabled: true
  name: http
  port: 8080
  targetPort: 8080
  type: ClusterIP
serviceMesh:
  enabled: true
