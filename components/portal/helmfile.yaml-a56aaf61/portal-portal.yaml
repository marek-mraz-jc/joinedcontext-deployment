envSecret:
  APPS_DB_PASSWORD:
    key: password
    secret: db-apps-admin
  CKAN_API_TOKEN:
    key: token
    secret: ckan-api-token
  JC_GITEA_APPS_TOKEN:
    key: token
    secret: gitea-token-apps
  JC_GITEA_TOKEN:
    key: token
    secret: gitea-token-portal
  JC_PORTAL_ARTIFACT_STORE_ACCESS_KEY:
    key: ACCESS_KEY_ID
    secret: artifact-store-root
  JC_PORTAL_ARTIFACT_STORE_SECRET_KEY:
    key: ACCESS_SECRET_KEY
    secret: artifact-store-root
  JC_PORTAL_COOKIE_KEY:
    key: key
    secret: portal-cookie-key
  JC_PORTAL_COOKIE_KEY_PREVIOUS:
    key: previous
    optional: true
    secret: portal-cookie-key
  JC_PORTAL_ERASURE_KEY:
    key: key
    optional: true
    secret: portal-erasure-key
  JC_PORTAL_SMTP_URL:
    key: url
    optional: true
    secret: portal-mail-relay
  PGPASSWORD:
    key: password
    secret: db-portal
extraVolumeMounts:
  - mountPath: /var/cache/jc/apps
    name: apps-cache
  - mountPath: /var/run/secrets/jc/keycloak
    name: keycloak-token
    readOnly: true
  - mountPath: /etc/jc/health
    name: validation-results
    readOnly: true
  - mountPath: /var/run/secrets/jc/broker-admin
    name: broker-admin-token
    readOnly: true
  - mountPath: /etc/jc/age
    name: age-identity
    readOnly: true
extraVolumes:
  - emptyDir:
      sizeLimit: 2Gi
    name: apps-cache
  - configMap:
      name: jc-validation-results
      optional: true
    name: validation-results
  - name: keycloak-token
    projected:
      sources:
        - serviceAccountToken:
            audience: https://idm.smartcity.joinedcontext.com/realms/smartcity
            expirationSeconds: 600
            path: token
  - name: broker-admin-token
    secret:
      defaultMode: 288
      items:
        - key: token
          path: token
      secretName: context-broker-admin-token
  - name: age-identity
    secret:
      defaultMode: 288
      optional: true
      secretName: portal-age-identity
fullnameOverride: portal
headlessService:
  name: portal-pods
image:
  digest: sha256:488c3e03777d9fa4a66c8eacb88cce49db1a7ac8d2cc430e9fe547f65d880c82
  pullPolicy: IfNotPresent
  repository: ghcr.io/marek-mraz-jc/joinedcontext-portal
  tag: main
nameOverride: portal-portal
podAnnotations:
  config.linkerd.io/skip-outbound-ports: "443"
  security.joinedcontext.com/api-access-reason: 'App reconciler: applies the four objects an App is made of — Deployment, Service, Secret and NetworkPolicy — in each project''s apps namespace, under the ClusterRole `portal-apps` bound there (AP-13, AP-15, AP-18, AP-116); in its own namespace, under the Role in `rbac.rules` below, only the pipeline runner''s restart patch and the Secrets it hands over (T-5094); and an App''s build Job, its token Secret and its cache claim in the runner''s namespace, under the Role `portal-build-pods` there (AP-130, AP-131, T-2794). It reads and writes nothing else at the API server.'
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
probes:
  liveness:
    failureThreshold: 3
    initialDelaySeconds: 10
    path: /api/v1/health
    periodSeconds: 15
    timeoutSeconds: 3
  readiness:
    failureThreshold: 3
    path: /api/v1/ready
    periodSeconds: 5
    timeoutSeconds: 3
rbac:
  namespace: smartcity
  rules:
    - apiGroups:
        - apps
      resourceNames:
        - pipeline-runner
      resources:
        - deployments
      verbs:
        - get
        - patch
    - apiGroups:
        - ""
      resourceNames:
        - app-registry
      resources:
        - secrets
      verbs:
        - get
    - apiGroups:
        - ""
      resources:
        - secrets
      verbs:
        - create
        - patch
replicaCount: 1
resources:
  limits:
    cpu: "1"
    memory: 1536Mi
  requests:
    cpu: 100m
    memory: 576Mi
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
service:
  enabled: true
  extraPorts:
    - name: internal
      port: 9090
      protocol: TCP
      targetPort: 9090
  name: http
  port: 8080
  targetPort: 8080
  type: ClusterIP
serviceAccount:
  automountServiceAccountToken: true
  create: true
serviceMesh:
  enabled: true
