---
portal-allow-linkerd:
  podSelector:
    app.kubernetes.io/name: portal-portal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
          componentNamespace: apisix
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP

# Meshed traffic reaches a pod through its Linkerd inbound proxy on 4143, not on the
# service port, so the 5432 rule alone would leave the connection blocked.
postgres-linkerd-from-portal:
  podSelector:
    cnpg.io/cluster: postgres-cluster
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal-portal
          componentNamespace: portal
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP

# The portal declares an egress policy, so its Linkerd proxy needs identity (8080),
# destination (8086) and policy (8090) spelled out. Without them the proxy never learns the
# inbound policy for its own admin port, the kubelet startup probe gets a 403 and the pod
# never leaves Init.
portal-linkerd-control-plane:
  podSelector:
    app.kubernetes.io/name: portal-portal
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8090
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-cluster
          componentNamespace: postgres
      ports:
        - protocol: TCP
          port: 4143
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
          componentNamespace: keycloak
      ports:
        - protocol: TCP
          port: 4143
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-gateway-gateway
          componentNamespace: context-gateway
      ports:
        - protocol: TCP
          port: 4143
    # The registration write is meshed like every other hop, so the 9090 rule beside this one
    # is not enough: the client proxy dials the broker's inbound proxy on 4143 (T-0345).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-broker-broker
          componentNamespace: context-broker
      ports:
        - protocol: TCP
          port: 4143
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: model-tools-tools
          componentNamespace: model-tools
      ports:
        - protocol: TCP
          port: 4143
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pipeline-runner-runner
          componentNamespace: pipeline-runner
      ports:
        - protocol: TCP
          port: 4143
    # The reconciler's admin calls to the artifact store are meshed too, so the 9000 rule
    # beside this one is not enough: the client proxy dials the store's inbound proxy on 4143
    # and the connection is refused at this pod's own egress without it (T-0933). The bucket
    # Job has carried both ports since it was written, which is why it could create the bucket
    # while the reconciler could not issue one credential.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: store
          componentNamespace: artifact-store
      ports:
        - protocol: TCP
          port: 4143
