---
artifact-store:
  store:
    # The store's root credential, and the only one that is generated: the per-organization
    # writer and reader keys of Architecture/17 §3 are derived from it by the Portal's
    # reconciler and written into the store's own IAM (T-0422, PF-32). It is therefore in two
    # namespaces and no more — the store, which owns it, and the Portal, which mints with it.
    # No other workload ever sees it; the boundary around the store itself stays the
    # NetworkPolicy, since it has no ingress route and only named workloads reach port 9000.
    artifact-store-root:
      ACCESS_KEY_ID:
        length: 32
        generate: true
      ACCESS_SECRET_KEY:
        length: 48
        generate: true
      componentNamespaces:
        - artifact-store
        - portal
    # The Postgres backup user's key (T-5289): the store's bucket Job registers it with a policy
    # that reaches the backup bucket alone, and the database's barman reads it by secretRef. It
    # exists everywhere and is used only where `postgres.cluster.backups.target` is
    # 'artifact-store'.
    postgres-backup-artifact-store:
      ACCESS_KEY_ID:
        length: 32
        generate: true
      ACCESS_SECRET_KEY:
        length: 48
        generate: true
      componentNamespaces:
        - artifact-store
        - postgres
    # apps-db's own backup key (T-5662): the bucket Job gives it a policy on postgres-backups/apps-db/
    # alone, so the cluster that serves tenant Apps cannot read or delete the platform's backups.
    apps-db-backup-artifact-store:
      ACCESS_KEY_ID:
        length: 32
        generate: true
      ACCESS_SECRET_KEY:
        length: 48
        generate: true
      componentNamespaces:
        - artifact-store
        - apps-db
