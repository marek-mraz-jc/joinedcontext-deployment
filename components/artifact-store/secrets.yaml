---
artifact-store:
  store:
    # The store's root credential, and the only one that is generated: the per-organization
    # writer and reader keys of Architecture/17 §3 are derived from it by the Portal's
    # reconciler and written into the store's own IAM (T-0422, PF-32). It is therefore in two
    # namespaces and no more — the store, which owns it, and the Portal, which mints with it.
    # No other workload ever sees it; the boundary around the store itself stays the
    # NetworkPolicy, since it has no ingress route and only named workloads reach port 9000.
    artifact-store-root:
      ACCESS_KEY_ID:
        length: 32
        generate: true
      ACCESS_SECRET_KEY:
        length: 48
        generate: true
      componentNamespaces:
        - artifact-store
        - portal
