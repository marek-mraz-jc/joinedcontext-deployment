---
ckan:
  catalogue:
    db-ckan:
      username: 'ckan'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - ckan
        - postgres
    # The DataStore read connection. A role of its own with SELECT only, so the SQL search
    # endpoint cannot write; the postgres component creates it from databases.yaml.
    db-ckan-datastore-read:
      username: 'ckan_datastore_read'
      password:
        length: 32
        generate: true
      componentNamespaces:
        - ckan
        - postgres
    # CKAN's `SECRET_KEY`: the session cookie, the CSRF token and every API token are signed
    # with it, because CKAN derives all three from this one value. Rotating it logs everyone
    # out and invalidates every issued token, which is the point of
    # `helm.sh/resource-policy: keep` on the generated Secret — and the reason the pod may not
    # fall back to the one `start_ckan.sh` mints per restart (T-0436).
    ckan-session:
      secret:
        length: 32
        generate: true
      componentNamespaces:
        - ckan
    # CKAN's own site administrator. Keycloak owns human logins once an image with
    # ckanext-oauth2 exists (see README); this account holds the administration pages when
    # the identity provider is the thing that is broken, and the image needs a sysadmin to
    # create on an empty database.
    ckan-admin-credentials:
      username: 'ckan_admin'
      # RFC 2606 reserves `.invalid`: a format-valid address that can never be routed,
      # so a forgotten-password mail cannot leave the cluster to a real inbox.
      email: 'ckan-admin@joinedcontext.invalid'
      password:
        length: 32
        generate: true
        special: true
      componentNamespaces:
        - ckan
