---
ckan:
  name: ckan
  description: Catalogue web headers and rate limiting
  plugins:
    request-id:
      include_in_response: true
    # Every route clears the headers the platform trusts internally, not only the
    # authenticated ones (T-0026): a client that can set them can claim a tenant or an
    # identity. X-Forwarded-For stays — nginx maintains it and the rate limit keys on it.
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
            end
          end
    # Class 1 (standard web): a catalogue is browsed and crawled, not called in a loop.
    limit-count:
      count: 300
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    proxy-rewrite:
      headers:
        set:
          X-Forwarded-Proto: https
          X-Forwarded-Port: '443'
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          # CKAN frames its own resource previews (the `*_view` plugins), so DENY would
          # blank every preview on every dataset page.
          X-Frame-Options: "SAMEORIGIN"
          Referrer-Policy: "strict-origin-when-cross-origin"

ckan-redirect:
  name: ckan-redirect
  description: Send /ckan on the primary host to the catalogue host
  plugins:
    request-id:
      include_in_response: true
    # The route terminates here: APISIX answers 302 in the rewrite phase and never dials
    # the upstream the route declares.
    redirect:
      uri: "https://data.${DOMAIN}/"
      ret_code: 302
