---
# The catalogue on its own host. `subDomain` also puts data.{domain} on the edge Ingress
# and in the certificate SAN list, both derived from this map.
ckan:
  name: ckan
  description: Open-data catalogue (CKAN)
  upstream: ckan.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "ckan") }}.svc.cluster.local:5000 # yamllint disable-line rule:line-length
  subDomain: data
  uri: '/*'
  # Harvesting a large resource and rendering a dataset page with fifty resources are both
  # slower than a portal page; the platform defaults would cut them off mid-response.
  timeout:
    connect: 6
    send: 60
    read: 60

# T-4201: CKAN's webassets carry a content hash in their names (`51d427fe_main.css`) yet CKAN
# serves them `no-cache`, so every page revalidated each stylesheet and script against the
# per-address limit. The browser keeps them a year, set only on a 200 or 304 so an error is
# never cached. A route's `serverless-post-function` replaces its plugin config's, so the
# config's CSP baseline comes first, word for word (tests/test_edge_asset_cache.py).
ckan-webassets:
  name: ckan-webassets
  description: CKAN's fingerprinted stylesheets and scripts, cached for a year
  upstream: ckan.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "ckan") }}.svc.cluster.local:5000 # yamllint disable-line rule:line-length
  subDomain: data
  uri: '/webassets/*'
  priority: 5
  pluginConfig: ckan
  plugins:
    serverless-post-function:
      phase: header_filter
      functions:
        - >-
          return function()
            if ngx.header["Content-Security-Policy"] == nil then
              ngx.header["Content-Security-Policy"] =
                "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
            end
          end
        - >-
          return function()
            if ngx.status == 200 or ngx.status == 304 then
              ngx.header["Cache-Control"] = "public, max-age=31536000, immutable"
            end
          end

# T-4639: the dataset map a site may frame, /map/{dataset}[/{resource}] with CKAN's language
# prefix or without; its own plugin config drops X-Frame-Options and the cookie.
ckan-map:
  name: ckan-map
  description: The framable dataset map
  upstream: ckan.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "ckan") }}.svc.cluster.local:5000 # yamllint disable-line rule:line-length
  subDomain: data
  uri: '/*'
  vars: [["uri", "~~", "^/([a-z]{2}(_[A-Z]{2})?/)?map/[^/]+(/[^/]+)?$"]]
  priority: 5

# One stable path on the primary host that leads to the catalogue, for the people who only
# ever learn one hostname. It answers a redirect and never proxies (see apisix-plugins.yaml),
# because CKAN renders every link from its site URL and would emit data.{domain} links from
# a /ckan page anyway.
ckan-redirect:
  name: ckan-redirect
  description: /ckan on the primary host redirects to the catalogue host
  upstream: ckan.{{ include "jc.namespace" (dict "global" .Values.global "suffix" "ckan") }}.svc.cluster.local:5000 # yamllint disable-line rule:line-length
  host: '{{ .Values.global.domain }}'
  uri: '/ckan*'
  # Above the portal UI's `/*` at priority 1, below its API routes.
  priority: 5
