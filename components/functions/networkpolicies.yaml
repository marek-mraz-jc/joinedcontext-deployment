---
# jc-functions is called by the Portal alone (SDK-23) and calls the Context Gateway with each
# caller's token, the agent proxy's data route with a run's data credential when the editing agent
# tests a function (ADR-N-038 decision 6), Keycloak's in-cluster Service for the realm's signing
# keys, and CoreDNS. Nothing else, the internet included: a function's code is the model's.
functions-runtime:
  podSelector:
    app.kubernetes.io/name: functions-runtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal-portal
          componentNamespace: portal
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-gateway-gateway
          componentNamespace: context-gateway
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runner-proxy
          componentNamespace: agent-runner
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
          componentNamespace: keycloak
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

portal-egress-to-functions:
  componentNamespace: portal
  podSelector:
    app.kubernetes.io/name: portal-portal
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: functions-runtime
          componentNamespace: functions
      ports:
        - protocol: TCP
          port: 8080

gateway-from-functions:
  componentNamespace: context-gateway
  podSelector:
    app.kubernetes.io/name: context-gateway-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: functions-runtime
          componentNamespace: functions
      ports:
        - protocol: TCP
          port: 8080

# The proxy honours a run's data credential on /v1/data alone, from this workload alone when mesh
# identity is required (ADR-N-038 decision 6).
agent-proxy-from-functions:
  componentNamespace: agent-runner
  podSelector:
    app.kubernetes.io/name: agent-runner-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: functions-runtime
          componentNamespace: functions
      ports:
        - protocol: TCP
          port: 8080

keycloak-from-functions:
  componentNamespace: keycloak
  podSelector:
    app.kubernetes.io/instance: keycloak-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: functions-runtime
          componentNamespace: functions
      ports:
        - protocol: TCP
          port: 8080
