command:
  - /usr/local/bin/jc-functions
containerPort: 8080
env:
  JC_FUNCTIONS_ASSISTANT_CALLER: jc-assistant
  JC_FUNCTIONS_AUDIENCE: jc-functions
  JC_FUNCTIONS_BIND: 0.0.0.0:8080
  JC_FUNCTIONS_CALLER: portal-api
  JC_GATEWAY_URL: http://context-gateway.smartcity.svc.cluster.local:8080
  JC_OIDC_ISSUER: https://idm.smartcity.joinedcontext.com/realms/smartcity
  JC_OIDC_JWKS_URL: http://keycloak-app-keycloakx-http.smartcity.svc.cluster.local:80/realms/smartcity/protocol/openid-connect/certs
fullnameOverride: jc-functions
image:
  digest: sha256:e11965b94ddb93e034221c15eccfe967a8af46008fc5f2375243326d442f9650
  pullPolicy: IfNotPresent
  repository: ghcr.io/marek-mraz-jc/joinedcontext-platform
  tag: main
nameOverride: functions-runtime
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
probes:
  liveness:
    failureThreshold: 3
    initialDelaySeconds: 5
    path: /healthz
    periodSeconds: 15
    timeoutSeconds: 3
  readiness:
    failureThreshold: 3
    path: /healthz
    periodSeconds: 5
    timeoutSeconds: 3
replicaCount: 1
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 50m
    memory: 96Mi
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
service:
  enabled: true
  name: http
  port: 8080
  targetPort: 8080
  type: ClusterIP
serviceMesh:
  enabled: true
