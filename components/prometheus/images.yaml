# The images kube-prometheus-stack 92.9.0 names, each pinned by its multi-arch index digest
# (T-5154). Bump them together with the chart in charts.yaml. Re-pin a digest with:
#   T=$(curl -s "https://quay.io/v2/auth?service=quay.io&scope=repository:<repo>:pull" | jq -r .token)
#   curl -sI -H "Authorization: Bearer $T" \
#     -H 'Accept: application/vnd.oci.image.index.v1+json' \
#     https://quay.io/v2/<repo>/manifests/<tag> | grep -i docker-content-digest
# (registry.k8s.io answers the same request without a token, after a redirect: curl -L.)
