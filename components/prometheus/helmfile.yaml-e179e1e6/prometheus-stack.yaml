alertmanager:
  alertmanagerSpec:
    automountServiceAccountToken: false
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      sha: e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
      tag: v0.34.1
    replicas: 1
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 5m
        memory: 32Mi
    retention: 120h
    useExistingSecret: true
  enabled: true
  ingress:
    enabled: false
cleanPrometheusOperatorObjectNames: true
coreDns:
  enabled: false
crds:
  enabled: true
defaultRules:
  create: true
  rules:
    etcd: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubernetesSystem: false
    node: false
    nodeExporterAlerting: false
    nodeExporterRecording: false
    windows: false
fullnameOverride: prometheus
grafana:
  enabled: false
kube-state-metrics:
  collectors:
    - cronjobs
    - daemonsets
    - deployments
    - horizontalpodautoscalers
    - jobs
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - poddisruptionbudgets
    - pods
    - replicasets
    - resourcequotas
    - statefulsets
  image:
    registry: registry.k8s.io
    repository: kube-state-metrics/kube-state-metrics
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
    tag: v2.20.0
  metricDenylist:
    - ^kube_pod_init_container_.+$
    - ^kube_pod_(tolerations|status_qos_class)$
    - ^kube_replicaset_(created|metadata_generation|spec_replicas|status_.+)$
  podAnnotations:
    security.joinedcontext.com/api-access-reason: kube-state-metrics lists every object kind it reports on (Pods, CronJobs, PVCs, ...) through the API server; PostgresBackupStale reads its kube_cronjob_status_last_successful_time (T-5154).
  resources:
    limits:
      memory: 192Mi
    requests:
      cpu: 10m
      memory: 48Mi
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubelet:
  enabled: true
  serviceMonitor:
    cAdvisorMetricRelabelings:
      - action: drop
        regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
        sourceLabels:
          - __name__
      - action: drop
        regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
        sourceLabels:
          - __name__
      - action: drop
        regex: container_memory_(mapped_file|swap)
        sourceLabels:
          - __name__
      - action: drop
        regex: container_(file_descriptors|tasks_state|threads_max)
        sourceLabels:
          - __name__
      - action: drop
        regex: container_memory_failures_total;hierarchy
        sourceLabels:
          - __name__
          - scope
      - action: drop
        regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
        sourceLabels:
          - __name__
          - interface
      - action: drop
        regex: container_spec.*
        sourceLabels:
          - __name__
      - action: drop
        regex: .+;
        sourceLabels:
          - id
          - pod
      - action: drop
        regex: container_(blkio_device_usage_total|cpu_load_d_average_10s|fs_(reads|writes)(_bytes)?_total|last_seen|memory_(failcnt|failures_total|kernel_usage|max_usage_bytes|total_active_file_bytes|total_inactive_file_bytes)|processes|sockets|start_time_seconds|threads|ulimits_soft)
        sourceLabels:
          - __name__
    metricRelabelings:
      - action: drop
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        sourceLabels:
          - __name__
          - le
      - action: drop
        regex: (apiserver|apiextensions|aggregator|authentication|authorization|etcd|kubeproxy|lasso|rest_client|scheduler|storage|watch_cache|workqueue)_.+
        sourceLabels:
          - __name__
    probes: false
nodeExporter:
  enabled: true
prometheus:
  enabled: true
  ingress:
    enabled: false
  prometheusSpec:
    enforcedBodySizeLimit: 32MB
    enforcedLabelLimit: 64
    enforcedLabelNameLengthLimit: 128
    enforcedLabelValueLengthLimit: 1024
    enforcedSampleLimit: 40000
    enforcedTargetLimit: 200
    evaluationInterval: 30s
    image:
      registry: quay.io
      repository: prometheus/prometheus
      sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
      tag: v3.15.0-distroless
    podMetadata:
      annotations:
        security.joinedcontext.com/api-access-reason: 'Kubernetes service discovery: Prometheus lists the Endpoints, Pods and Services its ServiceMonitors and PodMonitors select, and scrapes the kubelet with its token (T-5154).'
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    replicas: 1
    resources:
      limits:
        memory: 1536Mi
      requests:
        cpu: 100m
        memory: 384Mi
    retention: 31d
    retentionSize: 8GB
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: local-path
prometheus-node-exporter:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
  fullnameOverride: node-exporter
  hostNetwork: false
  hostPID: false
  image:
    digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
    distroless: false
    registry: quay.io
    repository: prometheus/node-exporter
    tag: v1.12.1-distroless
  livenessProbe:
    failureThreshold: 6
  namespaceOverride: kube-system
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
        ports:
          - port: 9100
            protocol: TCP
  resources:
    limits:
      memory: 96Mi
    requests:
      cpu: 10m
      memory: 24Mi
  securityContext:
    fsGroup: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  enabled: true
  extraVolumeMounts:
    - mountPath: /tmp
      name: tmp
  extraVolumes:
    - emptyDir:
        sizeLimit: 16Mi
      name: tmp
  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
    tag: v0.94.1
  livenessProbe:
    failureThreshold: 6
  podAnnotations:
    security.joinedcontext.com/api-access-reason: The Prometheus Operator watches its custom resources and writes the Prometheus and Alertmanager StatefulSets, their Secrets and the kubelet Endpoints (T-5154).
  prometheusConfigReloader:
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-config-reloader
      sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
      tag: v0.94.1
    resources:
      limits:
        memory: 48Mi
      requests:
        cpu: 5m
        memory: 16Mi
  resources:
    limits:
      memory: 160Mi
    requests:
      cpu: 10m
      memory: 48Mi
  tls:
    enabled: false
windowsMonitoring:
  enabled: false
