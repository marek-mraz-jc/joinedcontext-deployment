keycloakUrl: http://keycloak-app-keycloakx-http.smartcity.svc.cluster.local:80
principal: portal-api
realm: smartcity
securityDefaults:
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
