command:
  - /opt/keycloak/bin/kc.sh
  - start
  - --optimized
database:
  database: keycloak
  existingSecret: db-keycloak
  existingSecretKey: password
  hostname: postgres-cluster-rw.smartcity.svc.cluster.local
  port: 5432
  username: keycloak
  vendor: postgres
dbchecker:
  enabled: true
  image:
    repository: docker.io/busybox
    tag: 1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
  resources:
    limits:
      cpu: 20m
      memory: 32Mi
    requests:
      cpu: 20m
      memory: 32Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
extraEnv: |
  - name: KC_HOSTNAME_STRICT
    value: "false"
  # The pool's default ceiling is 100. One shared Postgres has max_connections 55 on the
  # development profile (T-4933); Keycloak grew to 10 there on 2026-10-21 and the other clients'
  # token lookups were refused (53300). 4 serves one realm at this scale (prod held 2 open on
  # 2026-10-26 11:5xZ) and keeps every client's ceiling within
  # tests/test_postgres_connection_budget.py since the assistant's pool grew to 10 (T-5780).
  - name: KC_DB_POOL_MAX_SIZE
    value: "4"
  # kc.sh sizes the heap in a container at MaxRAMPercentage=70 with InitialRAMPercentage=50, and its
  # default MaxHeapFreeRatio=70 rarely gives a page back: on dev's 2048Mi limit that is a 1024Mi
  # heap from the start and up to 1434Mi, while 146 MB of it is live (jcmd, T-5282). Keycloak sat at
  # 1021Mi on a node at 97 % (T-5892). A quarter of the limit (512Mi on dev, 2Gi on the production
  # profile) is the cap kc.sh itself picks outside a container (-Xmx512m) and leaves the live set
  # three times over; the 5 % start lets the heap grow from about 100Mi instead of committing 1Gi.
  - name: JAVA_OPTS_KC_HEAP
    value: "-XX:MaxRAMPercentage=25 -XX:InitialRAMPercentage=5"
  - name: JGROUPS_DISCOVERY_PROTOCOL
    value: kubernetes.KUBE_PING
  - name: JGROUPS_DISCOVERY_PROPERTIES
    value: dump_requests=true,port_range=0,namespace=smartcity
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: admin
  - name: KC_HOSTNAME
    value: 'https://idm.smartcity.joinedcontext.com'
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-user
        key: password
extraInitContainers: "- name: build-keycloak\n  image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b\n  imagePullPolicy: IfNotPresent\n  securityContext:\n    \n    allowPrivilegeEscalation: false\n    capabilities:\n      drop:\n        - ALL\n    readOnlyRootFilesystem: true\n    \n  command:\n    - bash\n    - -c\n  args:\n    - |\n      set -eu\n      cp -R /opt/keycloak/* /app/\n      # The login theme (UI-82): a ConfigMap key is the file's path with `__` for `/`\n      # (components/keycloak/charts/theme).\n      for file in /theme/*; do\n        path=\"/app/themes/joinedcontext/$(basename \"$file\")\"\n        path=\"${path//__//}\"\n        mkdir -p \"${path%/*}\"\n        cp \"$file\" \"$path\"\n      done\n      # Script mappers stay off: with them, whoever may manage a client runs code in every\n      # token it mints (T-2857). Keycloak 26 ships them off; the build says so, so no image or\n      # default change turns them on.\n      # `cimd` (experimental) lets claude.ai, Claude Code and VS Code sign in by their published\n      # client id URL; `parameterized-scopes` (preview) mints the one `connector:{id}` scope that\n      # binds a token to one Portal connector (T-5954, ADR-N-064 §3.3). `resource-indicators`\n      # stays off: Keycloak 26.8 matches `resource` only against a static list.\n      /app/bin/kc.sh build --db=postgres --health-enabled=true --metrics-enabled=true --features=cimd,parameterized-scopes --features-disabled=scripts --http-relative-path=/\n  resources:\n    requests:\n      cpu: \"100m\"\n      memory: \"256Mi\"\n    limits:\n      cpu: \"1000m\"\n      memory: \"1Gi\"\n  volumeMounts:\n    - name: workspace\n      mountPath: /app\n    - name: tmp\n      mountPath: /tmp\n    - name: theme\n      mountPath: /theme\n      readOnly: true\n"
extraVolumeMounts: |
  - name: workspace
    mountPath: /opt/keycloak
  - name: tmp
    mountPath: /tmp
  # Where Keycloak looks for its own token and the cluster CA: the `kubernetes` identity
  # provider authenticates to `{issuer}/.well-known/openid-configuration` with it, and the CA
  # joins Keycloak's truststore by that path (PF-47).
  - name: kube-api-token
    mountPath: /var/run/secrets/kubernetes.io/serviceaccount
    readOnly: true
extraVolumes: |
  - name: workspace
    emptyDir: {}
  - name: tmp
    emptyDir: {}
  - name: theme
    configMap:
      name: keycloak-theme
  # The API server's default audience and an hour's life: good for the issuer discovery the
  # cluster grants every ServiceAccount (system:service-account-issuer-discovery) and for no
  # RBAC, because Keycloak's ServiceAccount is bound to none.
  - name: kube-api-token
    projected:
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 3600
        - configMap:
            name: kube-root-ca.crt
            items:
              - key: ca.crt
                path: ca.crt
health:
  enabled: true
http:
  relativePath: /
image:
  digest: sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
  pullPolicy: IfNotPresent
  repository: quay.io/keycloak/keycloak
  tag: 26.8.1
ingress:
  console:
    enabled: false
  enabled: false
livenessProbe: |
  httpGet:
    path: '/realms/master'
    port: 'http'
    scheme: 'HTTP'
  initialDelaySeconds: 0
  timeoutSeconds: 5
metrics:
  enabled: true
podAnnotations:
  checksum/theme: 047caeb0a62532d349cec47dcac634df34c8f860042fd1175c14ffadedbe66f3
  config.linkerd.io/skip-inbound-ports: 7800,57800
  config.linkerd.io/skip-outbound-ports: 25,465,587,7800,57800
  security.joinedcontext.com/api-access-reason: The kubernetes identity provider reads the cluster's issuer discovery with its own token to verify federated ServiceAccount tokens; Keycloak's ServiceAccount is bound to no role.
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
proxy:
  enabled: true
  http:
    enabled: true
  mode: xforwarded
readinessProbe: |
  httpGet:
    path: '/realms/master'
    port: 'http'
    scheme: 'HTTP'
  initialDelaySeconds: 10
  timeoutSeconds: 1
replicas: 1
resources:
  limits:
    cpu: 1000m
    memory: 2048Mi
  requests:
    cpu: 500m
    memory: 928Mi
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
service:
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
serviceAccount:
  automountServiceAccountToken: false
serviceMonitor:
  enabled: true
  namespace: smartcity
startupProbe: |
  httpGet:
    path: '/realms/master'
    port: 'http'
    scheme: 'HTTP'
  initialDelaySeconds: 15
  timeoutSeconds: 1
  failureThreshold: 60
  periodSeconds: 5
