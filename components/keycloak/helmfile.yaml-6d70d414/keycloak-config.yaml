backoffLimit: 2
config:
  master:
    inline:
      authenticationFlows:
        - alias: master browser
          authenticationExecutions:
            - authenticator: auth-cookie
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 10
              requirement: ALTERNATIVE
              userSetupAllowed: false
            - authenticatorFlow: true
              autheticatorFlow: true
              flowAlias: master browser forms
              priority: 20
              requirement: ALTERNATIVE
              userSetupAllowed: false
          builtIn: false
          description: 'Browser login of the master realm: password and TOTP'
          providerId: basic-flow
          topLevel: true
        - alias: master browser forms
          authenticationExecutions:
            - authenticator: auth-username-password-form
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 10
              requirement: REQUIRED
              userSetupAllowed: false
            - authenticator: auth-otp-form
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 20
              requirement: REQUIRED
              userSetupAllowed: false
          builtIn: false
          description: Username/password, then TOTP
          providerId: basic-flow
          topLevel: false
      browserFlow: master browser
      bruteForceProtected: true
      defaultSignatureAlgorithm: ES256
      failureFactor: 10
      maxDeltaTimeSeconds: 43200
      maxFailureWaitSeconds: 900
      minimumQuickLoginWaitSeconds: 60
      otpPolicyAlgorithm: HmacSHA256
      passwordPolicy: length(20) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1)
      permanentLockout: false
      quickLoginCheckMilliSeconds: 1000
      realm: master
      rememberMe: false
      requiredActions:
        - alias: CONFIGURE_TOTP
          defaultAction: false
          enabled: true
          name: Configure OTP
          priority: 10
          providerId: CONFIGURE_TOTP
      ssoSessionIdleTimeout: 1800
      ssoSessionMaxLifespan: 36000
      waitIncrementSeconds: 60
  smartcity:
    inline:
      accessCodeLifespan: 60
      accessCodeLifespanLogin: 1800
      accessCodeLifespanUserAction: 300
      accessTokenLifespan: 3600
      accessTokenLifespanForImplicitFlow: 900
      accountTheme: joinedcontext
      actionTokenGeneratedByAdminLifespan: 43200
      actionTokenGeneratedByUserLifespan: 300
      adminEventsDetailsEnabled: true
      adminEventsEnabled: true
      adminPermissionsEnabled: true
      adminTheme: keycloak
      attributes:
        acr.loa.map: '{"pwd":1,"mfa":2}'
        clientOfflineSessionIdleTimeout: "0"
        clientOfflineSessionMaxLifespan: "0"
        clientSessionIdleTimeout: "0"
        clientSessionMaxLifespan: "0"
      authenticationFlows:
        - alias: custom browser
          authenticationExecutions:
            - authenticator: auth-cookie
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 10
              requirement: ALTERNATIVE
              userSetupAllowed: false
            - authenticator: identity-provider-redirector
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 20
              requirement: ALTERNATIVE
              userSetupAllowed: false
            - authenticatorFlow: true
              autheticatorFlow: true
              flowAlias: custom browser forms
              priority: 30
              requirement: ALTERNATIVE
              userSetupAllowed: false
          builtIn: false
          description: Custom browser flow with conditional 2FA per TR-03187
          providerId: basic-flow
          topLevel: true
        - alias: custom browser forms
          authenticationExecutions:
            - authenticatorFlow: true
              autheticatorFlow: true
              flowAlias: custom browser password
              priority: 10
              requirement: CONDITIONAL
              userSetupAllowed: false
            - authenticatorFlow: true
              autheticatorFlow: true
              flowAlias: custom browser required 2fa
              priority: 20
              requirement: CONDITIONAL
              userSetupAllowed: false
            - authenticatorFlow: true
              autheticatorFlow: true
              flowAlias: custom browser 2fa
              priority: 30
              requirement: CONDITIONAL
              userSetupAllowed: false
            - authenticatorFlow: true
              autheticatorFlow: true
              flowAlias: custom browser step-up
              priority: 40
              requirement: CONDITIONAL
              userSetupAllowed: false
          builtIn: false
          description: Username/password, then the second factor the person's role or credentials ask for
          providerId: basic-flow
          topLevel: false
        - alias: custom browser required 2fa
          authenticationExecutions:
            - authenticator: conditional-user-role
              authenticatorConfig: mfa required
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 10
              requirement: REQUIRED
              userSetupAllowed: false
            - authenticator: auth-otp-form
              authenticatorConfig: otp reference required
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 20
              requirement: REQUIRED
              userSetupAllowed: false
          builtIn: false
          description: TOTP for every holder of mfa-required; enrolment at the next login
          providerId: basic-flow
          topLevel: false
        - alias: custom browser password
          authenticationExecutions:
            - authenticator: conditional-level-of-authentication
              authenticatorConfig: password level
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 10
              requirement: REQUIRED
              userSetupAllowed: false
            - authenticator: auth-username-password-form
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 20
              requirement: REQUIRED
              userSetupAllowed: false
          builtIn: false
          description: 'Level 1: username and password (T-5567)'
          providerId: basic-flow
          topLevel: false
        - alias: custom browser step-up
          authenticationExecutions:
            - authenticator: conditional-level-of-authentication
              authenticatorConfig: step-up level
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 10
              requirement: REQUIRED
              userSetupAllowed: false
            - authenticator: auth-otp-form
              authenticatorConfig: otp reference step-up
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 20
              requirement: REQUIRED
              userSetupAllowed: false
          builtIn: false
          description: 'The step-up a decision asks (acr_values=mfa): TOTP of anyone, enrolment if none (T-5567)'
          providerId: basic-flow
          topLevel: false
        - alias: custom direct grant
          authenticationExecutions:
            - authenticator: direct-grant-validate-username
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 10
              requirement: REQUIRED
              userSetupAllowed: false
            - authenticator: direct-grant-validate-password
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 20
              requirement: REQUIRED
              userSetupAllowed: false
            - authenticatorFlow: true
              autheticatorFlow: true
              flowAlias: custom direct grant required otp
              priority: 30
              requirement: CONDITIONAL
              userSetupAllowed: false
            - authenticatorFlow: true
              autheticatorFlow: true
              flowAlias: custom direct grant otp
              priority: 40
              requirement: CONDITIONAL
              userSetupAllowed: false
          builtIn: false
          description: 'Password grant: username, password, then TOTP of every mfa-required holder'
          providerId: basic-flow
          topLevel: true
        - alias: custom direct grant required otp
          authenticationExecutions:
            - authenticator: conditional-user-role
              authenticatorConfig: mfa required
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 10
              requirement: REQUIRED
              userSetupAllowed: false
            - authenticator: direct-grant-validate-otp
              authenticatorConfig: otp reference grant required
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 20
              requirement: REQUIRED
              userSetupAllowed: false
          builtIn: false
          description: TOTP for every holder of mfa-required; one not yet enrolled gets no token
          providerId: basic-flow
          topLevel: false
        - alias: custom direct grant otp
          authenticationExecutions:
            - authenticator: conditional-user-role
              authenticatorConfig: mfa not required
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 5
              requirement: REQUIRED
              userSetupAllowed: false
            - authenticator: conditional-user-configured
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 10
              requirement: REQUIRED
              userSetupAllowed: false
            - authenticator: direct-grant-validate-otp
              authenticatorConfig: otp reference grant
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 20
              requirement: REQUIRED
              userSetupAllowed: false
          builtIn: false
          description: 'Optional TOTP: asked of a person without mfa-required who configured one'
          providerId: basic-flow
          topLevel: false
        - alias: custom browser 2fa
          authenticationExecutions:
            - authenticator: conditional-user-role
              authenticatorConfig: mfa not required
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 5
              requirement: REQUIRED
              userSetupAllowed: false
            - authenticator: conditional-user-configured
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 10
              requirement: REQUIRED
              userSetupAllowed: false
            - authenticator: auth-otp-form
              authenticatorConfig: otp reference optional
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 20
              requirement: ALTERNATIVE
              userSetupAllowed: false
            - authenticator: webauthn-authenticator
              authenticatorFlow: false
              autheticatorFlow: false
              priority: 30
              requirement: ALTERNATIVE
              userSetupAllowed: false
          builtIn: false
          description: 'Optional 2FA: prompts only a person without mfa-required who configured TOTP or WebAuthn'
          providerId: basic-flow
          topLevel: false
      authenticatorConfig:
        - alias: otp reference required
          config:
            default.reference.value: otp
        - alias: otp reference step-up
          config:
            default.reference.value: otp
        - alias: otp reference grant required
          config:
            default.reference.value: otp
        - alias: otp reference grant
          config:
            default.reference.value: otp
        - alias: otp reference optional
          config:
            default.reference.value: otp
        - alias: password level
          config:
            loa-condition-level: "1"
            loa-max-age: "36000"
        - alias: step-up level
          config:
            loa-condition-level: "2"
            loa-max-age: "300"
        - alias: mfa required
          config:
            condUserRole: mfa-required
            negate: "false"
        - alias: mfa not required
          config:
            condUserRole: mfa-required
            negate: "true"
      browserFlow: custom browser
      browserSecurityHeaders:
        contentSecurityPolicy: frame-src 'self'; frame-ancestors 'self'; object-src 'none';
        contentSecurityPolicyReportOnly: ""
        strictTransportSecurity: max-age=31536000; includeSubDomains
        xContentTypeOptions: nosniff
        xFrameOptions: SAMEORIGIN
        xRobotsTag: none
        xXSSProtection: 1; mode=block
      bruteForceProtected: true
      clientAuthenticationFlow: clients
      clientOfflineSessionIdleTimeout: 0
      clientOfflineSessionMaxLifespan: 0
      clientPolicies:
        policies:
          - conditions:
              - condition: client-id-uri
                configuration:
                  client-id-uri-allow-permitted-domains:
                    - claude.ai
                    - vscode.dev
                  client-id-uri-scheme:
                    - https
            description: Client ids that are https URLs of the known AI clients
            enabled: true
            name: cimd
            profiles:
              - cimd
      clientProfiles:
        profiles:
          - description: Client ID Metadata Documents of the known AI clients
            executors:
              - configuration:
                  accept-public-client-with-confidential-client-only-grant: true
                  cimd-allow-permitted-domains:
                    - claude.ai
                    - vscode.dev
                    - code.visualstudio.com
                    - localhost
                    - 127.0.0.1
                executor: client-id-metadata-document
            name: cimd
      clientScopes:
        - attributes:
            consent.screen.text: Use one AI connector you created in the Portal, with the rights you gave it
            display.on.consent.screen: "true"
            include.in.token.scope: "true"
