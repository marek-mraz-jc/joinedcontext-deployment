---
# The presenter (T-6542, owner 2026-11-03): one person the owner presents as on dev, stage and the
# production instance, with one password and one TOTP seed across the three realms. Seeded on an
# instance whose global.presenterUserId is set; the id is the same on all three. The person holds
# the demo steward's realm roles and groups plus the root group of every other seeded Organization,
# and the forge seeds bind them beside the steward and each Organization's administrator
# (components/gitea/values/*/base-values.yaml.gotmpl rewrites): what the owner's dev admin reads,
# and no more. `mfa-required` keeps the second factor on dev too, where approvers sign in without one.
#
# The password and the TOTP seed are the owner's, not the cluster's: components/keycloak/
# presenter.enc.yaml (sops, the dev, stage and prod age keys), loaded into Secret
# keycloak-user-presenter by scripts/presenter-secret.sh. Until that runs the Secret holds the
# generator's random values and nobody can sign in as the presenter.
firstName: Presenter
lastName: Administrator
realmRoles: [portal-approver, mfa-required]
groups: [banskabystrica, bbsk, helsinki, helsinki-mobility, praha, slovensko, zilina, barcelona, bratislava]
