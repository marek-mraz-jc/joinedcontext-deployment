---
# Re-pin a digest with: docker buildx imagetools inspect <repository>:<tag>
# and copy the Digest of the image index.
keycloak:
  db:
  app:
    repository: 'quay.io/keycloak/keycloak'
    # 26.8.1 (the 26.8.1-1 rebuild of 2026-10-23) ships ca-certificates 2026.2.92, which
    # fixes CRITICAL CVE-2026-114406 of 26.8.0 and 26.8.1-0 (T-5484). Quay republishes a tag
    # as -0, -1, ...: a base fix lands only in the newest -N, so pin the digest of that one.
    # A patch release; still dump the database before the apply, as for 26.8.0 (T-4124).
    tag: '26.8.1'
    # The keycloakx chart drops the tag when it is given a digest, so the values file
    # keeps both by hand: `repository:tag@sha256:...` (BSI TR-03187 AR-4).
    digest: 'sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b'
  configCli:
    repository: 'docker.io/adorsys/keycloak-config-cli'
    tag: '6.5.1-26'
    digest: 'sha256:1b22dfaa9ae0c71f74b0342f9221a6510f272da5def683dbba26a98e6b1b1411'
  dbchecker:
    repository: 'docker.io/busybox'
    tag: '1.38'
    digest: 'sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616'
