# Set by components/keycloak/values/admin-permissions; the defaults name what each one is.
image: ""
keycloakUrl: ""
realm: ""
principal: portal-api
# How often the CronJob links new Endpoint scopes between syncs (T-6388): the wait a connector
# sees for a new Endpoint, so the Portal's refusal names it.
schedule: "*/5 * * * *"
serviceAccount: keycloak-app-keycloakx
admin:
  username: ""
  existingSecret: keycloak-admin-user
  existingSecretKey: password
securityDefaults:
  podSecurityContext: {}
  securityContext: {}
