# Nothing here any more (T-2271). `agent-proxy-token` was one generated bearer copied to the proxy
# and to the Portal — the last static key between two services of this platform, which CLAUDE.md
# rules out. The proxy presents a token of its own Keycloak client now, audience-bound to the
# Portal's internal listener by the `portal-internal-audience` mapper in `keycloak-clients.yaml`,
# and the Portal is told whose token to expect (`JC_PORTAL_AGENT_PROXY_CLIENT_ID`). The file stays
# so the component keeps its shape for the next secret it needs.
agent-runner: {}
