  podSelector:
    app.kubernetes.io/name: context-gateway-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runner-proxy
          componentNamespace: agent-runner
      ports:
        - port: 4143
          protocol: TCP

gitea-linkerd-from-agent-proxy:
  componentNamespace: gitea
  podSelector:
    app.kubernetes.io/name: gitea
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runner-proxy
          componentNamespace: agent-runner
      ports:
        - port: 4143
