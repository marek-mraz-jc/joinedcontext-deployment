command:
  - /usr/local/bin/jc-agent-proxy
containerPort: 8080
env:
  JC_DAILY_TOKENS_APP_BUILDER: "4000000"
  JC_DAILY_TOKENS_ASSISTANT: "2000000"
  JC_DAILY_TOKENS_OTHER: "1000000"
  JC_DAILY_TOKENS_PER_PERSON: "3000000"
  JC_FORGE_BASE: http://gitea-http.smartcity.svc.cluster.local:3000
  JC_FORGE_REPO: joinedcontext/configuration
  JC_GATEWAY_BASE: http://context-gateway.smartcity.svc.cluster.local:8080
  JC_MODEL_BASE: https://openrouter.ai/api/v1
  JC_MODEL_PROBE_SECS: "900"
  JC_MODEL_PROVIDER: openai-compatible
  JC_OIDC_CLIENT_ASSERTION_FILE: /var/run/secrets/jc/keycloak/token
  JC_OIDC_CLIENT_ID: helsinki-agent-proxy
  JC_OIDC_ISSUER: https://idm.smartcity.joinedcontext.com/realms/smartcity
  JC_OIDC_TOKEN_URL: http://keycloak-app-keycloakx-http.smartcity.svc.cluster.local:80/realms/smartcity/protocol/openid-connect/token
  JC_PORTAL_BASE: http://portal.smartcity.svc.cluster.local:9090
  JC_PROXY_BIND: 0.0.0.0:8080
  JC_PROXY_PORTAL_IDENTITY: portal.smartcity
  JC_REQUIRE_MESH_IDENTITY: "true"
envSecret:
  JC_FORGE_TOKEN:
    key: token
    secret: gitea-token-portal
  JC_MODEL_KEY:
    key: key
    secret: agent-runner-model-key
extraVolumeMounts:
  - mountPath: /var/run/secrets/jc/keycloak
    name: keycloak-token
    readOnly: true
extraVolumes:
  - name: keycloak-token
    projected:
      sources:
        - serviceAccountToken:
            audience: https://idm.smartcity.joinedcontext.com/realms/smartcity
            expirationSeconds: 600
            path: token
fullnameOverride: agent-proxy
image:
  digest: sha256:e11965b94ddb93e034221c15eccfe967a8af46008fc5f2375243326d442f9650
  pullPolicy: IfNotPresent
  repository: ghcr.io/marek-mraz-jc/joinedcontext-platform
  tag: main
nameOverride: agent-runner-proxy
podAnnotations:
  config.linkerd.io/skip-outbound-ports: "443"
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
probes:
  liveness:
    failureThreshold: 3
    initialDelaySeconds: 5
    path: /healthz
    periodSeconds: 15
    timeoutSeconds: 3
  readiness:
    failureThreshold: 3
    path: /healthz
    periodSeconds: 5
    timeoutSeconds: 3
replicaCount: 1
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
service:
  enabled: true
  name: http
  port: 8080
  targetPort: 8080
  type: ClusterIP
serviceMesh:
  enabled: true
