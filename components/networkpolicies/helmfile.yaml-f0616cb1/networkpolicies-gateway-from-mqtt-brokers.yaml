networkpolicies:
  gateway-from-mqtt-brokers:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: mqtt-broker
        ports:
          - port: 8082
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: context-gateway-gateway
    policyTypes:
      - Ingress
