networkpolicies:
  gitea-linkerd-from-jc:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: portal-portal
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: bootstrap
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: gitea-forge
                app.kubernetes.io/name: gitea
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: gitea-runner
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: context-gateway-gateway
        ports:
          - port: 4143
            protocol: TCP
          - port: 4190
            protocol: TCP
          - port: 4191
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/instance: gitea-forge
      app.kubernetes.io/name: gitea
    policyTypes:
      - Ingress
