networkpolicies:
  prometheus-server:
    egress:
      - to:
          - namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - cert-manager
                    - kube-system
                    - smartcity
      - ports:
          - port: 6443
            protocol: TCP
          - port: 10250
            protocol: TCP
        to:
          - ipBlock:
              cidr: 0.0.0.0/0
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
    ingress: []
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: prometheus
    policyTypes:
      - Ingress
      - Egress
