networkpolicies:
  gitea-from-lane-token:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: lane-token
        ports:
          - port: 3000
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/instance: gitea-forge
      app.kubernetes.io/name: gitea
    policyTypes:
      - Ingress
