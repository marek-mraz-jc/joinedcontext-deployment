networkpolicies:
  apps-db-backup:
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
      - ports:
          - port: 5432
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                cnpg.io/cluster: apps-db
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: apps-db-backup
      joinedcontext.com/psql-client: "true"
    policyTypes:
      - Egress
