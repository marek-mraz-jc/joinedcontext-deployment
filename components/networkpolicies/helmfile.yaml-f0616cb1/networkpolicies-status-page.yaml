networkpolicies:
  status-page:
    egress:
      - ports:
          - port: 9100
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: probes-probe
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: apisix
        ports:
          - port: 8080
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: probes-status
    policyTypes:
      - Ingress
      - Egress
