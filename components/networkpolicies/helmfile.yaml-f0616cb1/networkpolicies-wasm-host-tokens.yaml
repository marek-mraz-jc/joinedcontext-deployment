networkpolicies:
  wasm-host-tokens:
    egress:
      - ports:
          - port: 6443
            protocol: TCP
        to:
          - ipBlock:
              cidr: 10.255.0.1/32
      - ports:
          - port: 443
            protocol: TCP
          - port: 8443
            protocol: TCP
        to:
          - namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - traefik
                    - kube-system
                    - ingress-nginx
            podSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - traefik
                    - ingress-nginx
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: wasm-host-shard
        ports:
          - port: 4180
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: wasm-host-tokens
    policyTypes:
      - Ingress
      - Egress
