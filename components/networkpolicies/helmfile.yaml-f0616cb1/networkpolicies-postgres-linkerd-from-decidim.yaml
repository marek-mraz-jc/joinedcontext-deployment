networkpolicies:
  postgres-linkerd-from-decidim:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: decidim-web
                app.kubernetes.io/name: decidim-web
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: decidim-sidekiq
                app.kubernetes.io/name: decidim-sidekiq
        ports:
          - port: 4143
            protocol: TCP
          - port: 4190
            protocol: TCP
          - port: 4191
            protocol: TCP
    namespace: smartcity
    podSelector:
      cnpg.io/cluster: postgres-cluster
    policyTypes:
      - Ingress
