networkpolicies:
  portal-linkerd-from-pipeline-runner:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: pipeline-runner-runner
        ports:
          - port: 4143
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: portal-portal
    policyTypes:
      - Ingress
