networkpolicies:
  ckan-api-token:
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
      - ports:
          - port: 5000
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/component: ckan
                app.kubernetes.io/instance: ckan-catalogue
                app.kubernetes.io/name: ckan
      - ports:
          - port: 443
            protocol: TCP
        to:
          - ipBlock:
              cidr: 0.0.0.0/0
      - ports:
          - port: 6443
            protocol: TCP
        to:
          - ipBlock:
              cidr: 10.255.0.1/32
    namespace: smartcity
    podSelector:
      app.kubernetes.io/component: api-token
      app.kubernetes.io/instance: ckan-catalogue
      app.kubernetes.io/name: ckan
    policyTypes:
      - Ingress
      - Egress
