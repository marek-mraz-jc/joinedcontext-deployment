networkpolicies:
  mail-catcher:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: portal-portal
        ports:
          - port: 1025
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: mail-catcher
    policyTypes:
      - Ingress
