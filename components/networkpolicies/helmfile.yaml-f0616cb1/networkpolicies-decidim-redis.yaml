networkpolicies:
  decidim-redis:
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: decidim-web
                app.kubernetes.io/name: decidim-web
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: decidim-sidekiq
                app.kubernetes.io/name: decidim-sidekiq
        ports:
          - port: 6379
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/instance: decidim-redis
      app.kubernetes.io/name: decidim-redis
    policyTypes:
      - Ingress
      - Egress
