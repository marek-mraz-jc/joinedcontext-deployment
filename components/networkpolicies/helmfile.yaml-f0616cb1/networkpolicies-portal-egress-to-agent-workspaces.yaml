networkpolicies:
  portal-egress-to-agent-workspaces:
    egress:
      - ports:
          - port: 8000
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchExpressions:
                - key: joinedcontext.com/run-id
                  operator: Exists
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: portal-portal
    policyTypes:
      - Egress
