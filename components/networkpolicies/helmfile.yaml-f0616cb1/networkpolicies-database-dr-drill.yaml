networkpolicies:
  database-dr-drill:
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
      - ports:
          - port: 6443
            protocol: TCP
        to:
          - ipBlock:
              cidr: 10.255.0.1/32
    namespace: smartcity
    podSelector:
      app.kubernetes.io/component: database-dr-drill
      app.kubernetes.io/name: databases
    policyTypes:
      - Egress
