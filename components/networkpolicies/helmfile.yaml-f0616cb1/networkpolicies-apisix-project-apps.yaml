networkpolicies:
  apisix-project-apps:
    egress:
      - ports:
          - port: 8080
            protocol: TCP
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                joinedcontext.com/managed-by: joinedcontext-portal
                joinedcontext.com/release: smartcity
            podSelector:
              matchLabels:
                joinedcontext.com/app: "true"
    namespace: smartcity
    podSelector:
      app.kubernetes.io/instance: apisix-apisix
      app.kubernetes.io/name: apisix
    policyTypes:
      - Egress
