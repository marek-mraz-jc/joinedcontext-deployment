networkpolicies:
  runner-to-mqtt-brokers:
    egress:
      - ports:
          - port: 1883
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: mqtt-broker
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: pipeline-runner-runner
    policyTypes:
      - Egress
