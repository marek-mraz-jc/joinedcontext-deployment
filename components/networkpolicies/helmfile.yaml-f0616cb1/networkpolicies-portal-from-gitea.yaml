networkpolicies:
  portal-from-gitea:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: gitea-forge
                app.kubernetes.io/name: gitea
        ports:
          - port: 8080
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: portal-portal
    policyTypes:
      - Ingress
