networkpolicies:
  postgres-operator-webhook:
    ingress:
      - from:
          - ipBlock:
              cidr: 0.0.0.0/0
        ports:
          - port: 9443
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: cloudnative-pg
    policyTypes:
      - Ingress
