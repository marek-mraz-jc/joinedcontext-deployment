networkpolicies:
  postgres-from-ckan:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/component: ckan
                app.kubernetes.io/instance: ckan-catalogue
                app.kubernetes.io/name: ckan
        ports:
          - port: 5432
            protocol: TCP
    namespace: smartcity
    podSelector:
      cnpg.io/cluster: postgres-cluster
    policyTypes:
      - Ingress
