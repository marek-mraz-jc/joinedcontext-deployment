networkpolicies:
  alertmanager-allow-linkerd:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
        ports:
          - port: 4143
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: alertmanager
    policyTypes:
      - Ingress
