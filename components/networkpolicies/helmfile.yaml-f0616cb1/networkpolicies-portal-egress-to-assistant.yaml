networkpolicies:
  portal-egress-to-assistant:
    egress:
      - ports:
          - port: 8080
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: assistant-worker
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: portal-portal
    policyTypes:
      - Egress
