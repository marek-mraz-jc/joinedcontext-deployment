networkpolicies:
  decidim-redis-linkerd-control-plane:
    egress:
      - ports:
          - port: 8080
            protocol: TCP
          - port: 8086
            protocol: TCP
          - port: 8090
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: linkerd
    namespace: smartcity
    podSelector:
      app.kubernetes.io/instance: decidim-redis
      app.kubernetes.io/name: decidim-redis
    policyTypes:
      - Egress
