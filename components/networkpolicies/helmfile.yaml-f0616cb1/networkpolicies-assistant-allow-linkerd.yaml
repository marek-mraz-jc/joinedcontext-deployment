networkpolicies:
  assistant-allow-linkerd:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: apisix
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: portal-portal
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: context-gateway-gateway
        ports:
          - port: 4143
            protocol: TCP
          - port: 4190
            protocol: TCP
          - port: 4191
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: assistant-worker
    policyTypes:
      - Ingress
