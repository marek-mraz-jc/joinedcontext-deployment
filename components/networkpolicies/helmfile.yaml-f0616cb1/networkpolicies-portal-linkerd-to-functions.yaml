networkpolicies:
  portal-linkerd-to-functions:
    egress:
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: functions-runtime
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: portal-portal
    policyTypes:
      - Egress
