networkpolicies:
  ckan-linkerd-control-plane:
    egress:
      - ports:
          - port: 8080
            protocol: TCP
          - port: 8086
            protocol: TCP
          - port: 8090
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: linkerd
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                cnpg.io/cluster: postgres-cluster
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/component: solr
                app.kubernetes.io/instance: ckan-catalogue
                app.kubernetes.io/name: ckan
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/component: redis
                app.kubernetes.io/instance: ckan-catalogue
                app.kubernetes.io/name: ckan
    namespace: smartcity
    podSelector:
      app.kubernetes.io/component: ckan
      app.kubernetes.io/instance: ckan-catalogue
      app.kubernetes.io/name: ckan
    policyTypes:
      - Egress
