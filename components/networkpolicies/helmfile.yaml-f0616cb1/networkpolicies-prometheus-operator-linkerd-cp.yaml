networkpolicies:
  prometheus-operator-linkerd-cp:
    egress:
      - ports:
          - port: 8080
            protocol: TCP
          - port: 8086
            protocol: TCP
          - port: 8090
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: linkerd
    namespace: smartcity
    podSelector:
      app: kube-prometheus-stack-operator
    policyTypes:
      - Egress
