networkpolicies:
  pipeline-runner-linkerd-control-plane:
    egress:
      - ports:
          - port: 8080
            protocol: TCP
          - port: 8086
            protocol: TCP
          - port: 8090
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: linkerd
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: context-gateway-gateway
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: portal-portal
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: pipeline-runner-tokens
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: pipeline-runner-runner
    policyTypes:
      - Egress
