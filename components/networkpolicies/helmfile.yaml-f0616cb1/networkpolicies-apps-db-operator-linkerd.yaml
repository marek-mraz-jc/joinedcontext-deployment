networkpolicies:
  apps-db-operator-linkerd:
    egress:
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                cnpg.io/cluster: apps-db
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: cloudnative-pg
    policyTypes:
      - Egress
