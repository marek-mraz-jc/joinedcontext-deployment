networkpolicies:
  decidim-web-linkerd-control-plane:
    egress:
      - ports:
          - port: 8080
            protocol: TCP
          - port: 8086
            protocol: TCP
          - port: 8090
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: linkerd
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                cnpg.io/cluster: postgres-cluster
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: decidim-redis
                app.kubernetes.io/name: decidim-redis
    namespace: smartcity
    podSelector:
      app.kubernetes.io/instance: decidim-web
      app.kubernetes.io/name: decidim-web
    policyTypes:
      - Egress
