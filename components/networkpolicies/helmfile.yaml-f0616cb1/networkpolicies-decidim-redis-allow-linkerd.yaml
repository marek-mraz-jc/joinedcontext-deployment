networkpolicies:
  decidim-redis-allow-linkerd:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: decidim-web
                app.kubernetes.io/name: decidim-web
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: decidim-sidekiq
                app.kubernetes.io/name: decidim-sidekiq
        ports:
          - port: 4143
            protocol: TCP
          - port: 4190
            protocol: TCP
          - port: 4191
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/instance: decidim-redis
      app.kubernetes.io/name: decidim-redis
    policyTypes:
      - Ingress
