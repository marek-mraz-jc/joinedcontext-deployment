networkpolicies:
  artifact-store-bucket:
    egress:
      - ports:
          - port: 9000
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/component: store
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
    namespace: smartcity
    podSelector:
      app.kubernetes.io/component: bucket
    policyTypes:
      - Ingress
      - Egress
