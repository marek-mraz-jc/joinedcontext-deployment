networkpolicies:
  probe-allow-linkerd-from-status-page:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: probes-status
        ports:
          - port: 4143
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: probes-probe
    policyTypes:
      - Ingress
