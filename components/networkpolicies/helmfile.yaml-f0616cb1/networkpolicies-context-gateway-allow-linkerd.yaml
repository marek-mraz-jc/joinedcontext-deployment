networkpolicies:
  context-gateway-allow-linkerd:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: apisix
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: pipeline-runner-runner
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: wasm-host-shard
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: portal-portal
          - namespaceSelector:
              matchLabels:
                joinedcontext.com/managed-by: joinedcontext-portal
            podSelector:
              matchLabels:
                joinedcontext.com/app: "true"
        ports:
          - port: 4143
            protocol: TCP
          - port: 4190
            protocol: TCP
          - port: 4191
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: context-gateway-gateway
    policyTypes:
      - Ingress
