networkpolicies:
  postgres-operator-linkerd:
    egress:
      - ports:
          - port: 8080
            protocol: TCP
          - port: 8086
            protocol: TCP
          - port: 8090
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: linkerd
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                cnpg.io/cluster: postgres-cluster
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                cnpg.io/cluster: postgres-cluster-drill
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: cloudnative-pg
    policyTypes:
      - Egress
