networkpolicies:
  ckan-redis:
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/component: ckan
                app.kubernetes.io/instance: ckan-catalogue
                app.kubernetes.io/name: ckan
        ports:
          - port: 6379
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/component: redis
      app.kubernetes.io/instance: ckan-catalogue
      app.kubernetes.io/name: ckan
    policyTypes:
      - Ingress
      - Egress
