networkpolicies:
  gitea-linkerd-from-agent-proxy:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: agent-runner-proxy
        ports:
          - port: 4143
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: gitea
    policyTypes:
      - Ingress
