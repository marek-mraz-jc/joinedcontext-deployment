networkpolicies:
  mqtt-brokers-allow-linkerd:
    egress:
      - ports:
          - port: 4143
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: context-gateway-gateway
      - ports:
          - port: 8080
            protocol: TCP
          - port: 8086
            protocol: TCP
          - port: 8090
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: linkerd
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: pipeline-runner-runner
          - namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - traefik
                    - kube-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/name: portal-portal
        ports:
          - port: 4143
            protocol: TCP
      - ports:
          - port: 4190
            protocol: TCP
          - port: 4191
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: mqtt-broker
    policyTypes:
      - Ingress
      - Egress
