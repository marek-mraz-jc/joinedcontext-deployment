networkpolicies:
  gitea-bootstrap:
    egress:
      - ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
      - ports:
          - port: 3000
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: smartcity
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: gitea-forge
                app.kubernetes.io/name: gitea
      - ports:
          - port: 443
            protocol: TCP
          - port: 6443
            protocol: TCP
        to:
          - ipBlock:
              cidr: 10.255.0.1/32
    namespace: smartcity
    podSelector:
      app.kubernetes.io/instance: gitea-bootstrap
      app.kubernetes.io/name: bootstrap
    policyTypes:
      - Ingress
      - Egress
