networkpolicies:
  ckan-redis-linkerd-control-plane:
    egress:
      - ports:
          - port: 8080
            protocol: TCP
          - port: 8086
            protocol: TCP
          - port: 8090
            protocol: TCP
        to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: linkerd
    namespace: smartcity
    podSelector:
      app.kubernetes.io/component: redis
      app.kubernetes.io/instance: ckan-catalogue
      app.kubernetes.io/name: ckan
    policyTypes:
      - Egress
