networkpolicies:
  apisix-allow-linkerd:
    ingress:
      - from:
          - namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: In
                  values:
                    - traefik
                    - kube-system
                    - ingress-nginx
            podSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - traefik
                    - ingress-nginx
        ports:
          - port: 4143
            protocol: TCP
      - ports:
          - port: 4190
            protocol: TCP
          - port: 4191
            protocol: TCP
    namespace: smartcity
    podSelector:
      app.kubernetes.io/name: apisix
    policyTypes:
      - Ingress
