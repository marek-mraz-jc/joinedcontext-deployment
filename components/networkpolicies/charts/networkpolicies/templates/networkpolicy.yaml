{{- $root := . }}
{{- range $name, $config := .Values.networkpolicies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  {{- with $config.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "networkpolicies.labels" $root | nindent 4 }}
    {{- with $config.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $config.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    {{- if $config.podSelector }}
    matchLabels:
      {{- toYaml $config.podSelector | nindent 6 }}
    {{- else }}
    {}
    {{- end }}
  {{- with $config.policyTypes }}
  policyTypes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $config.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $config.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
