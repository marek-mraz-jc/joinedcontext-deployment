---
# Re-pin a digest with (the manifest list, so every architecture keeps its image):
#   docker buildx imagetools inspect <repository>:<tag> | awk '/^Digest:/ { print $2; exit }'
gitops:
  # Every Argo CD workload, and the Job that writes Redis's password.
  argocd:
    repository: 'quay.io/argoproj/argocd'
    tag: 'v3.5.4'
    digest: 'sha256:49dff79439bb38b1b942b19a113fe1fec7e6b6c671ddf9fe6a4a7c46bde0b77b'
  redis:
    repository: 'ecr-public.aws.com/docker/library/redis'
    tag: '8.6.4-alpine'
    digest: 'sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763'
  # The helmfile plugin sidecar: the stock image with the helmfile, helm, kubectl, sops and age
  # versions CI renders with (helmfile 1.8.1, helm 4.3.0), and yq for the data guard.
  helmfile:
    repository: 'ghcr.io/helmfile/helmfile'
    tag: 'v1.8.1'
    digest: 'sha256:9c29ece2fb6ec3f8c1432be9d29526f3cfe35d7e59e066d0aa5c4b3e819f2165'
