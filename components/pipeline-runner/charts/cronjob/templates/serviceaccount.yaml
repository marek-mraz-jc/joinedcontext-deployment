{{- if and .Values.serviceAccount.create .Values.pipelines }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pipelineCronjob.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pipelineCronjob.labels" . | nindent 4 }}
# A scheduled pipeline talks to the Context Gateway with a Keycloak service-account token,
# never with a Kubernetes one: the gateway does not accept ServiceAccount tokens at all
# (Architecture/08 §5.1), so the pod has no reason to carry one.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
