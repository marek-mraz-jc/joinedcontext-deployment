---
# Browser login for the dashboards. Confidential, authorization-code with PKCE, and no
# service account: Grafana acts for the person who logged in and never on its own.
grafana:
  # What the login page names ("Sign in to {name} · {organization}"): a key the login theme
  # translates (components/keycloak/charts/theme).
  name: ${jcClientMonitoring}
  description: Confidential client of the Grafana addon for operator login
  subdomain: ''
  redirectPath: /grafana/login/generic_oauth
  componentNamespaces:
    - grafana
  rawValues:
    publicClient: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
