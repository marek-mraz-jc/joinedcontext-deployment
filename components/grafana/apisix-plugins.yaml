---
grafana:
  name: grafana
  description: Dashboard web headers and rate limiting
  plugins:
    request-id:
      include_in_response: true
    # Every route clears the headers the platform trusts internally, not only the
    # authenticated ones (T-0026): a client that can set them can claim a tenant or an
    # identity. X-Forwarded-For stays — nginx maintains it and the rate limit keys on it.
    serverless-pre-function:
      phase: rewrite
      functions:
        - >-
          return function()
            local forged = {
              "NGSILD-Tenant", "X-Userinfo", "X-Access-Token", "X-Allowed-Scope-Ids",
              "X-Endpoint-Slug", "X-Consumer-Identity",
              "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port",
              "X-Forwarded-Prefix", "X-Forwarded-Server", "X-Real-IP",
            }
            for _, header in ipairs(forged) do
              ngx.req.clear_header(header)
            end
          end
    # Class 1 (standard web): a dashboard refreshes its panels on a timer, so the ceiling is
    # above a browsed page and well below an API called in a loop.
    limit-count:
      count: 600
      time_window: 60
      key_type: var
      key: remote_addr
      rejected_code: 429
      policy: local
      show_limit_quota_header: true
    proxy-rewrite:
      headers:
        set:
          X-Forwarded-Proto: https
          X-Forwarded-Port: '443'
    response-rewrite:
      headers:
        set:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          # Grafana renders its own panels in iframes on some pages, and nothing outside
          # this host may frame it.
          X-Frame-Options: "SAMEORIGIN"
          Referrer-Policy: "strict-origin-when-cross-origin"
