---
grafana:
  grafana:
    # The local administrator, used when Keycloak is the thing that is broken. The realm owns
    # every other login (keycloak-clients.yaml), so this account exists for exactly that hour.
    grafana-admin:
      username: 'grafana_admin'
      password:
        length: 32
        generate: true
        special: true
      # The Portal saves a person's visualization through the admin API (T-6509); no browser sees it.
      componentNamespaces:
        - grafana
        - portal
