---
# A dashboard viewer reads one Prometheus and talks to one identity provider, and that is the
# whole of its network life. Ingress: APISIX, which is the only way in. Egress: Prometheus,
# Keycloak and DNS. It has no database, reads no other component's API, and reaches nothing
# outside the cluster (OPS-38).
grafana:
  podSelector:
    app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
          componentNamespace: apisix
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # CoreDNS. Every rule below names a Service, and a Service name is worth nothing
    # without this one.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The Prometheus that scrapes this installation. It is not one of this repository's
    # components — the monitoring component configures an Operator that is already on the
    # cluster — so the peer is named by the pod label that Operator sets rather than by a
    # namespace this file cannot template.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # The code exchange and the userinfo call, in-cluster. The browser's own hop to the
    # realm goes through the edge and never through this pod.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
          componentNamespace: keycloak
      ports:
        - protocol: TCP
          port: 8080

# Keycloak lists its callers by name, and Grafana is one.
keycloak-from-grafana:
  componentNamespace: keycloak
  podSelector:
    app.kubernetes.io/instance: keycloak-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
          componentNamespace: grafana
      ports:
        - protocol: TCP
          port: 8080

# The edge side of the ingress rule above. APISIX runs under a default-deny egress of its own
# and its component names only the upstreams that ship with every installation; an addon
# brings its own line. Without it the route resolves, the connection is dropped on the way
# out, and the edge answers 504 while the pod is 1/1 and healthy (T-0419).
apisix-egress-to-grafana:
  componentNamespace: apisix
  podSelector:
    app.kubernetes.io/name: apisix
    app.kubernetes.io/instance: apisix-apisix
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
          componentNamespace: grafana
      ports:
        - protocol: TCP
          port: 3000
