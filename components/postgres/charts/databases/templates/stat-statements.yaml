{{- /*
pg_stat_statements for the superuser and pg_read_all_stats only (T-4904). The extension grants
SELECT on its views and EXECUTE on its functions to PUBLIC, so every login (antares_app, keycloak,
an App's shard login) could read the statistics and timings of every database. This Job creates
the extension where the library is loaded and takes those grants away in every database,
template1 included, so a database created later inherits the extension already closed and
CNPG's own CREATE EXTENSION IF NOT EXISTS there changes nothing.
*/ -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-stat-statements" .Values.cluster.name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "database.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-role-setup
    joinedcontext.com/psql-client: "true"
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "database.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database-role-setup
        joinedcontext.com/psql-client: "true"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityDefaults.podSecurityContext | nindent 8 }}
      volumes:
      - name: home
        emptyDir: {}
      containers:
      - name: stat-statements
        securityContext:
          {{- toYaml .Values.securityDefaults.securityContext | nindent 10 }}
        volumeMounts:
        - name: home
          mountPath: /tmp
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 200m, memory: 128Mi }
        image: {{ .Values.roleJob.image }}
        env:
        - name: HOME
          value: /tmp
        - name: PGHOST
          value: {{ .Values.cluster.name }}-rw.{{ .Release.Namespace }}.svc.cluster.local
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: postgres
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.cluster.name }}-superuser
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.cluster.name }}-superuser
              key: password
        - name: PRELOADED
          value: {{ .Values.statStatements.preloaded | quote }}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          # A shared_buffers change restarts the instance after this release is applied: wait
          # until the server is up and, when the cluster preloads the library, has loaded it.
          tries=0
          until psql -Atc "SHOW shared_preload_libraries" >/tmp/preload 2>/dev/null &&
                { [ "$PRELOADED" != "true" ] || grep -q pg_stat_statements /tmp/preload; }; do
            tries=$((tries + 1))
            if [ "$tries" -ge 180 ]; then
              echo "ERROR: after 15 min the server is down or has not loaded pg_stat_statements (shared_preload_libraries: $(cat /tmp/preload 2>/dev/null))"
              exit 1
            fi
            sleep 5
          done
          psql -v ON_ERROR_STOP=1 -Atc "SELECT datname FROM pg_database WHERE datallowconn" >/tmp/dbs
          while read -r db; do
            echo "pg_stat_statements in ${db}"
            psql -v ON_ERROR_STOP=1 -d "$db" <<-'EOSQL'
              DO $$
              DECLARE
                ext oid;
                obj record;
              BEGIN
                IF current_setting('shared_preload_libraries') ~ 'pg_stat_statements' THEN
                  CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
                END IF;
                SELECT oid INTO ext FROM pg_extension WHERE extname = 'pg_stat_statements';
                IF ext IS NULL THEN
                  RETURN;
                END IF;
                -- A view calls its functions as the reader, so the readers get EXECUTE too;
                -- the reset functions stay the superuser's.
                FOR obj IN SELECT p.oid::regprocedure AS f, p.proname FROM pg_depend d
                    JOIN pg_proc p ON p.oid = d.objid
                    WHERE d.refobjid = ext AND d.classid = 'pg_proc'::regclass AND d.deptype = 'e' LOOP
                  EXECUTE format('REVOKE ALL ON FUNCTION %s FROM PUBLIC', obj.f);
                  IF obj.proname NOT LIKE '%reset%' THEN
                    EXECUTE format('GRANT EXECUTE ON FUNCTION %s TO pg_read_all_stats', obj.f);
                  END IF;
                END LOOP;
                FOR obj IN SELECT objid::regclass AS v FROM pg_depend
                    WHERE refobjid = ext AND classid = 'pg_class'::regclass AND deptype = 'e' LOOP
                  EXECUTE format('REVOKE ALL ON %s FROM PUBLIC', obj.v);
                  EXECUTE format('GRANT SELECT ON %s TO pg_read_all_stats', obj.v);
                END LOOP;
                IF EXISTS (
                  SELECT 1 FROM pg_depend d
                  LEFT JOIN pg_class c ON d.classid = 'pg_class'::regclass AND c.oid = d.objid
                  LEFT JOIN pg_proc p ON d.classid = 'pg_proc'::regclass AND p.oid = d.objid
                  CROSS JOIN LATERAL aclexplode(coalesce(c.relacl, p.proacl)) a
                  WHERE d.refobjid = ext AND d.deptype = 'e' AND a.grantee = 0
                ) THEN
                  RAISE EXCEPTION 'pg_stat_statements still grants PUBLIC access in %', current_database();
                END IF;
              END
              $$;
          EOSQL
          done </tmp/dbs
          echo "pg_stat_statements: superuser and pg_read_all_stats only"
