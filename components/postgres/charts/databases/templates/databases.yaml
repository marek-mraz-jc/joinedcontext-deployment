{{ $root := . }}
{{ range $component, $config := .Values.databases }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  # postgres database names should be lowercase and snake_case, because sql is case-insensitive and "-" is not a valid character in a database name.
  # kubernetes names on the other hand must follow RFC 1123 DNS label rules, which are lowercase and hyphen-separated.
  # because of this, metadata.name is different to spec.name
  name: {{ $config.name | replace "_" "-" }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "database.labels" $root | nindent 6 }}
    ## TODO: Add component label?
spec:
  cluster:
    name: {{ $root.Values.cluster.name }}
  name: {{ $config.name }}
  owner: {{ $config.user }}
  {{- if index $config "extensions" }}
  extensions: {{- toYaml $config.extensions | nindent 4 }}
  {{- end }}
{{- end }}
