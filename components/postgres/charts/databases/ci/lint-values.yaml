# The values `helm lint` and tests/test_values_schemas.py render the bare chart with (T-4956):
# the security defaults every deployment passes from defaults/environment/security.yaml.gotmpl.
securityDefaults:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: [ALL] }
    readOnlyRootFilesystem: true
