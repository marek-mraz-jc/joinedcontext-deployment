backups:
  enabled: false
cluster:
  annotations:
    config.linkerd.io/skip-inbound-ports: "8000"
    security.joinedcontext.com/api-access-reason: 'CloudNativePG instance manager: watches its own Cluster resource and reports instance status back to the operator.'
  imageName: ghcr.io/cloudnative-pg/postgis:16-3.6-system-trixie@sha256:a08a1c1795fcbee5bfc3e935f21be68f08700e4e1e7f3b6af5e11866617d9e61
  instances: 1
  monitoring:
    enabled: true
    podMonitor:
      enabled: false
  postgresql:
    parameters:
      autovacuum_work_mem: 32MB
      max_connections: "61"
      max_parallel_workers: "2"
    pg_hba:
      - hostnossl all all all reject
      - hostssl all all all scram-sha-256
    synchronous: {}
  resources:
    limits:
      cpu: "6"
      memory: 2560Mi
    requests:
      cpu: 100m
      memory: 1792Mi
  roles:
    - ensure: present
      login: true
      name: assistant
      passwordSecret:
        name: db-assistant
      superuser: false
    - ensure: present
      login: true
      name: ckan
      passwordSecret:
        name: db-ckan
      superuser: false
    - ensure: present
      login: true
      name: antares
      passwordSecret:
        name: db-antares
      superuser: false
    - ensure: present
      login: true
      name: decidim
      passwordSecret:
        name: db-decidim
      superuser: false
    - ensure: present
      login: true
      name: gitea
      passwordSecret:
        name: db-gitea
      superuser: false
    - ensure: present
      login: true
      name: keycloak
      passwordSecret:
        name: db-keycloak
      superuser: false
    - ensure: present
      login: true
      name: portal
      passwordSecret:
        name: db-portal
      superuser: false
  storage:
    size: 1Gi
    storageClass: local-path
type: postgis
version:
  postgis: "3.4"
  postgresql: "16"
  timescaledb: "2.15"
