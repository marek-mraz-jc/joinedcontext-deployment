---
# The drill key of the nightly dump (T-5839, templates/local-backup.yaml of the databases chart):
# each dump is age-encrypted to it besides the operator's key, and the monthly drill opens the
# newest with it. 64 hex digits, an X25519 private key; the chart reads it as
# `{cluster}-local-backup-key`, so a renamed cluster renames it here. Never rotate it alone: the
# dumps sealed under the old key then open only with the operator's key.
postgres:
  databases:
    postgres-cluster-local-backup-key:
      key:
        length: 64
        generate: true
        encoding: hex
      componentNamespaces:
        - postgres
