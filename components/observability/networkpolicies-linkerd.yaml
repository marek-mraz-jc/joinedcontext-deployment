---
# Meshed traffic lands on a pod's Linkerd inbound proxy on 4143, not on the service port, so
# every rule in networkpolicies.yaml needs a mirror here or the connection it allows is one
# the proxy never makes.
observability-allow-linkerd:
  podSelector:
    app.kubernetes.io/name: observability-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-broker-broker
          componentNamespace: context-broker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: context-gateway-gateway
          componentNamespace: context-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pipeline-runner-runner
          componentNamespace: pipeline-runner
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP

# The collector declares an egress policy, so its proxy needs identity (8080), destination
# (8086) and policy (8090) spelled out. Without them the proxy never learns the inbound policy
# for its own admin port, the kubelet startup probe gets a 403 and the pod never leaves Init.
observability-linkerd-control-plane:
  podSelector:
    app.kubernetes.io/name: observability-collector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: portal-portal
          componentNamespace: portal
      ports:
        - protocol: TCP
          port: 4143
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: keycloak-app
          componentNamespace: keycloak
      ports:
        - protocol: TCP
          port: 4143

portal-linkerd-from-observability:
  componentNamespace: portal
  podSelector:
    app.kubernetes.io/name: portal-portal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: observability-collector
          componentNamespace: observability
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP

keycloak-linkerd-from-observability:
  componentNamespace: keycloak
  podSelector:
    app.kubernetes.io/instance: keycloak-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: observability-collector
          componentNamespace: observability
      ports:
        - port: 4143
          protocol: TCP
        - port: 4190
          protocol: TCP
        - port: 4191
          protocol: TCP
